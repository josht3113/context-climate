name: Cache ENSO Data

on:
  schedule:
    - cron: '0 6 1 * *'   # 1st of every month at 6 AM UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Niño 3.4 anomaly data from NOAA PSL
        run: |
          curl -L -f \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0" \
            -H "Accept: text/plain, */*" \
            -H "Referer: https://psl.noaa.gov/gcos_wgsp/Timeseries/Nino34/" \
            -o public/nino34.long.anom.data \
            "https://psl.noaa.gov/gcos_wgsp/Timeseries/Data/nino34.long.anom.data"
          echo "Downloaded $(wc -l < public/nino34.long.anom.data) lines"

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/nino34.long.anom.data
          git diff --staged --quiet \
            && echo "Data unchanged, skipping commit" \
            || (git commit -m "chore: update Niño 3.4 anomaly data [automated]" && git push)
