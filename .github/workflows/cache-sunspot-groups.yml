name: Cache Sunspot Group Data

on:
  schedule:
    - cron: '0 8 5 * *'   # 5th of every month at 8 AM UTC — a couple days
                          # after the existing monthly SSN job (3rd), so
                          # the two sunspot data pipelines don't collide.
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch + reduce RGO/USAF/NOAA sunspot group catalog (1874-present)
        run: python3 scripts/fetch_sunspot_groups.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sunspot-groups.csv
          git diff --staged --quiet \
            && echo "Data unchanged — no commit needed" \
            || (git commit -m "chore: update sunspot group data [automated]" && git push)
