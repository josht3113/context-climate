name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Cache ENSO Data"
      - "Cache Sunspot Data"
      - "Update Sea Ice Extent Data"
      - "Update Pacific SST Data"
      - "Update GODAS Section Data"
      - "Cache Sunspot Group Data"
      - "Fetch Solar TSI Data"
      - "Cache Cloud Cover Backfill"
      - "Cache Cloud Cover Monthly Update"
      - "Update Global Cloud Cover Data"
      - "Update Global Temperature Data"
      - "Update tropical ACE data"
      - "Update tide data"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # For push events, always run. For workflow_run events (the data
    # jobs above), only run if that job actually succeeded — a failed
    # fetch means nothing changed, so there's nothing new to deploy.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Add SST frames from sst-data branch
        run: |
          if git ls-remote --exit-code --heads origin sst-data > /dev/null; then
            git fetch --depth=1 origin sst-data
            mkdir -p public/sst
            git archive FETCH_HEAD | tar -x -C public/sst
            echo "SST frames: $(ls public/sst/daily 2>/dev/null | wc -l) daily, $(ls public/sst/monthly 2>/dev/null | wc -l) monthly"
          else
            echo "No sst-data branch yet — deploying without SST frames"
          fi

      - name: Add GODAS frames from godas-data branch
        run: |
          if git ls-remote --exit-code --heads origin godas-data > /dev/null; then
            git fetch --depth=1 origin godas-data
            mkdir -p public/godas
            git archive FETCH_HEAD | tar -x -C public/godas
            echo "GODAS frames: $(ls public/godas/pentad 2>/dev/null | wc -l) pentad, $(ls public/godas/monthly 2>/dev/null | wc -l) monthly"
          else
            echo "No godas-data branch yet — deploying without GODAS frames"
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
