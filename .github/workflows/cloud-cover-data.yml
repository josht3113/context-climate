name: Update Global Cloud Cover Data

# Runs daily. Every run does two things, both budget-capped against
# Open-Meteo's free-tier limit of 10,000 API "calls"/day (calls are
# metered by date-range length, not just request count -- see the
# comment block at the top of scripts/fetch_global_cloud_cover.py):
#
#   1. Cheap refresh of the trailing ~90 days across all 144 sample
#      points, so recent months always stay current.
#   2. Whatever budget is left over goes toward the historical backfill
#      (1980-present), picking up the oldest not-yet-fetched year where
#      the last run left off. A committed cache file
#      (data/global-cloud-cover-raw-cache.json) makes this resumable --
#      the backfill just gets a little further back in time each day
#      until it reaches 1980, then that step becomes a no-op forever.
#
# Because it's self-throttling and resumable, daily cadence is safe and
# gives faster backfill progress than weekly would, at negligible extra
# cost once the backfill is complete.
#
# NOTE: add "Update Global Cloud Cover Data" to deploy.yml's workflow_run
# trigger list (already done) so a successful data commit here also
# redeploys Pages, same as the other data pipelines.

on:
  schedule:
    - cron: "0 13 * * *"  # daily, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch cloud cover data
        run: |
          python scripts/fetch_global_cloud_cover.py \
            --out public/global-cloud-cover.json \
            --raw-cache data/global-cloud-cover-raw-cache.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/global-cloud-cover.json data/global-cloud-cover-raw-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update global cloud cover data [automated]"
            git push
          fi
