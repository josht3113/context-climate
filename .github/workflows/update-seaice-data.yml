name: Update Sea Ice Extent Data

on:
  schedule:
    - cron: '0 16 * * *'  # ~9-10am Mountain Time, after NSIDC typically posts the prior day's values
  workflow_dispatch: {}    # lets you trigger a manual run from the Actions tab to test

jobs:
  update-seaice-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python scripts/update_seaice_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/seaice-extent.json
          git diff --staged --quiet || (git commit -m "Update sea ice extent data" && git push)
