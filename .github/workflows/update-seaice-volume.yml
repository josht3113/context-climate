name: Update Sea Ice Volume Data

on:
  schedule:
    # PSC posts PIOMAS around the 4th-6th of each month; checking weekly also
    # picks up a resumed series (new version) without waiting a month.
    - cron: '23 15 * * 1'
  workflow_dispatch: {}

jobs:
  update-seaice-volume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python scripts/build_seaice_volume.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/seaice-volume.json
          git diff --staged --quiet || (git commit -m "Update sea ice volume data [automated]" && git push)
