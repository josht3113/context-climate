name: Update tropical ACE data

# Daily in-season refresh from IBTrACS' last-3-years file, plus a full-archive
# rebuild on the 1st of each month to pick up post-season reanalysis (which is
# what moves older seasons' numbers). A failed download or a failed validation
# never overwrites a committed file — the run just goes red.

on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Rebuild from the full IBTrACS archive'
        type: boolean
        default: false
      diagnose:
        description: 'Report what IBTrACS carries for each basin this season, then stop'
        type: boolean
        default: false

concurrency:
  group: ace-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Unit tests first: if the ACE arithmetic, the season-boundary handling
      # or the leap-day slot mapping is broken, fail before touching any data.
      - name: Self-test
        run: python3 scripts/build_ace_data.py --selftest

      # Diagnostic only: prints what the upstream file actually contains for
      # each basin's current season and writes nothing.
      - name: Diagnose current-season coverage
        if: ${{ inputs.diagnose }}
        run: python3 scripts/build_ace_data.py --diagnose

      - name: Choose build mode
        if: ${{ !inputs.diagnose }}
        id: mode
        run: |
          if [ "${{ inputs.force_full }}" = "true" ]; then
            M=full; WHY="manually requested"
          elif [ ! -f public/ace-na.json ]; then
            M=full; WHY="no committed data yet"
          elif [ "$(date -u +%d)" = "01" ]; then
            M=full; WHY="monthly archive rebuild"
          else
            M=recent; WHY="daily in-season refresh"
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "Mode: $M ($WHY)"

      - name: Build ACE data
        if: ${{ !inputs.diagnose }}
        run: |
          python3 scripts/build_ace_data.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --out public

      - name: Commit and push
        if: ${{ !inputs.diagnose }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ace-*.json
          if git diff --cached --quiet; then
            echo "No change in the data files — nothing to commit."
            exit 0
          fi
          git commit -m "ACE data (${{ steps.mode.outputs.mode }} build, $(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 6
          done
          echo "Could not push after 3 attempts."
          exit 1
