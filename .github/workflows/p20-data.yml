name: ESSRT p20 data (one-off)
# Scratch branch only. Fetches NOAA drifter-climatology currents, OISST
# 1991-2020 SST, GDP drifter tracks and city normals for ESSRT_20.html and
# commits the compact results to p20-out/ on this branch.
on:
  push:
    branches: [p20-data]
    paths: ['scripts/build_p20_data.py', '.github/workflows/p20-data.yml']
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma list of sections (ocean,drifters,normals); blank = all'
        default: ''
permissions:
  contents: write
concurrency:
  group: p20-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install netCDF4 numpy
      - name: Build
        run: python scripts/build_p20_data.py --out p20-out --only "${{ inputs.only || 'drifters' }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "p20-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f p20-out
          git commit -m "p20 data $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push origin HEAD:p20-data
