name: TEMP snow map diagnostic
on:
  push:
    branches: [snow-map]
    paths: ['tmpdiag/diag.py']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 tmpdiag/diag.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmpdiag/diag-out.json && git commit -m "TEMP diag output" && git pull --rebase origin snow-map && git push
