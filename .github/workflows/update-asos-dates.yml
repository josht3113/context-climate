name: Update ASOS dates

on:
  schedule:
    - cron: "17 10 12 1 *"    # yearly, Jan 12 at 10:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-asos-dates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build public/asos-dates.json
        run: python scripts/build_asos_dates.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add public/asos-dates.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update ASOS commissioning dates"
            git pull --rebase
            git push
          fi
