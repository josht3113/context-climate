name: Update Pacific SST Data

on:
  schedule:
    - cron: '42 13 * * *'  # daily at 13:42 UTC — script no-ops if no new month is available yet
  workflow_dispatch:         # allow manual trigger from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install netCDF4 numpy

      - name: Run SST update check
        run: python scripts/update_ersst_monthly.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/pacific-sst-anomalies.json
          git diff --cached --quiet || git commit -m "chore: update Pacific SST data $(date +%Y-%m-%d)"
          git push
