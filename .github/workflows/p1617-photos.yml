name: p1617 photos (one-off)
on:
  push:
    branches: [p1617-photos]
    paths: [scripts/p1617_photos.py, photos/select.json, .github/workflows/p1617-photos.yml]
permissions:
  contents: write
concurrency:
  group: p1617-photos
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pillow
      - run: python scripts/p1617_photos.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add photos
          git commit -m "p1617 photos output" || echo "nothing"
          git push
