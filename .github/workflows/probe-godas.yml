name: Probe GODAS sources
# One-off diagnostic (v2). Writes nothing to the repo. Delete once read.

on:
  workflow_dispatch:

env:
  UA: 'contextclimate-sst-pipeline/1.0 (+https://contextclimate.io)'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-tools > /dev/null
          pip install -q netCDF4 numpy
          echo "Run time (UTC): $(date -u '+%Y-%m-%d %H:%M')"

      - name: A · CPC pentad page, verbatim text
        continue-on-error: true
        run: |
          curl -sS -L --http1.1 -A "$UA" -o p.html -w "HTTP %{http_code}, final URL %{url_effective}\n" https://ftp.cpc.ncep.noaa.gov/godas/pentad/
          echo "--- all links ---"
          grep -oE 'href="[^"]+"' p.html | sed 's/href="//;s/"$//' | head -60
          echo "--- page text ---"
          sed 's/<[^>]*>/ /g' p.html | tr -s ' \n' | head -80

      - name: B · Follow the newest subfolder(s), if any
        continue-on-error: true
        run: |
          for d in $(grep -oE 'href="[^"?/][^"]*/"' p.html | sed 's/href="//;s/"$//' | grep -v '^\.\.' | sort | tail -2); do
            echo "=== $d"
            curl -sS -L --http1.1 -A "$UA" -o sub.html -w "HTTP %{http_code}\n" "https://ftp.cpc.ncep.noaa.gov/godas/pentad/$d"
            sed 's/<[^>]*>/ /g' sub.html | tr -s ' ' | grep -vE '^\s*$' | tail -15
          done

      - name: C · First GRIB-like file found above — inventory
        continue-on-error: true
        run: |
          BASE=https://ftp.cpc.ncep.noaa.gov/godas/pentad
          D=$(grep -oE 'href="[^"?/][^"]*/"' p.html | sed 's/href="//;s/"$//' | grep -v '^\.\.' | sort | tail -1)
          if [ -n "$D" ]; then curl -sS -L --http1.1 -A "$UA" -o sub.html "$BASE/$D"; LIST=sub.html; PFX="$BASE/$D"; else LIST=p.html; PFX="$BASE/"; fi
          F=$(grep -oE 'href="[^"?/][^"]*"' $LIST | sed 's/href="//;s/"$//' | grep -viE '\.(inv|html?|txt|idx|md5)$' | grep -v '/$' | sort | tail -1)
          echo "Candidate: $PFX$F"
          [ -z "$F" ] && exit 0
          curl -sS -L --http1.1 -A "$UA" -o f.bin -w "HTTP %{http_code}, %{size_download} bytes\n" "$PFX$F"
          file f.bin; head -c 8 f.bin | xxd
          grib_ls -p edition,shortName,name,typeOfLevel,level,units,dataDate,stepRange f.bin | head -45
          grib_ls -p shortName,typeOfLevel f.bin | sed '1,2d' | head -n -3 | sort | uniq -c
          grib_get -p gridType,Ni,Nj,latitudeOfFirstGridPointInDegrees,latitudeOfLastGridPointInDegrees,longitudeOfFirstGridPointInDegrees,longitudeOfLastGridPointInDegrees -w count=1 f.bin

      - name: D · NCEP NOMADS — any operational GODAS output?
        continue-on-error: true
        run: |
          curl -sS -L --http1.1 -A "$UA" -o n.html -w "HTTP %{http_code}\n" https://nomads.ncep.noaa.gov/pub/data/nccf/com/
          grep -oE 'href="[^"]+"' n.html | sed 's/href="//;s/"$//' | grep -iE 'godas|cfs' | head
          for d in godas cfs; do
            curl -sS -L --http1.1 -A "$UA" -o nd.html -w "$d: HTTP %{http_code}\n" "https://nomads.ncep.noaa.gov/pub/data/nccf/com/$d/prod/"
            sed 's/<[^>]*>/ /g' nd.html | tr -s ' ' | grep -vE '^\s*$' | tail -6
          done

      - name: E · PSL OPeNDAP via netCDF4 — equatorial slice of the newest monthly file
        continue-on-error: true
        shell: python
        run: |
          import time, numpy as np, netCDF4, datetime as dt
          y = dt.datetime.utcnow().year
          url = f'https://psl.noaa.gov/thredds/dodsC/Datasets/godas/pottmp.{y}.nc'
          t0 = time.time()
          ds = netCDF4.Dataset(url)
          print('opened', url, f'{time.time()-t0:.1f}s')
          print('variables:', list(ds.variables))
          v = ds.variables['pottmp']
          print('pottmp dims', v.dimensions, 'shape', v.shape, {a: v.getncattr(a) for a in v.ncattrs()})
          lat, lon, lev = ds['lat'][:], ds['lon'][:], ds['level'][:]
          t = ds['time']
          print('times:', [str(d)[:10] for d in netCDF4.num2date(t[:], t.units)])
          print('levels:', np.round(lev[:30], 1).tolist())
          print('lat near eq:', np.round(lat[(lat > -3) & (lat < 3)], 3).tolist())
          print('lon first/last/step:', float(lon[0]), float(lon[-1]), float(lon[1] - lon[0]))
          r = np.where((lat > -2.2) & (lat < 2.2))[0]; c = np.where((lon > 109.5) & (lon < 285.5))[0]
          t0 = time.time()
          sl = v[len(t) - 1, 0:26, r[0]:r[-1] + 1, c[0]:c[-1] + 1]
          print(f'slice {sl.shape} fetched in {time.time()-t0:.1f}s, masked cells {np.ma.count_masked(sl)}')
          ci = int(np.argmin(np.abs(lon[c] - 220)))
          print('2S-2N mean at 140W, newest month, by depth:')
          for k in range(0, 26, 3):
              print(f'  {float(lev[k]):6.1f} m  {float(sl[k, :, ci].mean()):8.3f}')

      - name: F · PSL Derived folder (long-term means) — base period
        continue-on-error: true
        shell: python
        run: |
          import netCDF4
          url = 'https://psl.noaa.gov/thredds/dodsC/Datasets/godas/Derived/pottmp.mon.ltm.nc'
          try:
              ds = netCDF4.Dataset(url)
              print({a: ds.getncattr(a) for a in ds.ncattrs()})
              print('time len', len(ds['time']), 'attrs', {a: ds['time'].getncattr(a) for a in ds['time'].ncattrs()})
          except Exception as e:
              print('failed:', e)
