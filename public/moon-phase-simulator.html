<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Phase Simulator</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; white-space: nowrap; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.now { padding: 6px 13px; font-size: 14px; font-weight: 700; color: var(--accent-live); border-color: var(--accent-live); white-space: nowrap; }
.now::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-live); margin-right: 7px; vertical-align: 1px; }
.now:hover { background: rgba(42,168,126,0.14); color: #4FD3A4; border-color: #4FD3A4; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 62px; }
.controls .grp { display: flex; gap: 5px; align-items: stretch; }
.play { min-width: 104px; padding: 10px 14px; font-size: 15px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent);
  color: var(--color-bg); white-space: nowrap; align-self: center; }
.play:hover { filter: brightness(1.1); background: var(--tool-accent); color: var(--color-bg); }
.preset { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 64px; padding: 4px 8px;
  color: var(--color-text-primary); line-height: 1.1; }
.preset svg { display: block; margin-bottom: 2px; }
.preset b { font-family: var(--font-display); font-size: 15px; font-weight: 700; white-space: nowrap; }
.preset i { font-style: normal; font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; color: var(--color-text-secondary); white-space: nowrap; }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.preset.is-active i { color: var(--color-bg); opacity: .85; }
.rs .preset { min-width: 96px; padding: 6px 12px; }
.rs .preset b { font-size: 17px; }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 80px; padding-left: 4px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 86px; text-align: right; white-space: nowrap; }

/* chips on the stage */
.chips { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 300px); }
.chips-r { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; }
.chips .cc-segmented-btn, .chips-r .cc-segmented-btn { padding: 6px 12px; font-size: 13px; background: var(--color-surface); }
.chips .cc-segmented-btn.is-active, .chips-r .cc-segmented-btn.is-active { background: var(--tool-accent); }
.tgl { padding: 5px 11px; font-size: 13px; white-space: nowrap; background: var(--color-surface); }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
.card .eb b { font-family: var(--font-display); font-size: 22px; letter-spacing: 0; text-transform: none; color: var(--color-text-primary); }
.date-sec { padding-bottom: 10px; border-bottom: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 7px; }
.date-sec input { width: 100%; accent-color: var(--tool-accent); height: 20px; cursor: pointer; margin: 0; }
.dchips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.dchip { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px; line-height: 1.15; color: var(--color-text-primary); }
.dchip b { font-size: 13px; font-weight: 700; white-space: nowrap; }
.dchip i { font-style: normal; font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--color-text-secondary); }
.dchip.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.dchip.is-active i { color: var(--color-bg); }
.ph-sec { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--color-border); }
.ph-sec canvas { width: 104px; height: 104px; flex: none; }
.ph-name { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.1; color: var(--color-text-primary); }
.ph-sub { font-family: var(--font-body); font-size: 15px; color: var(--color-text-secondary); margin-top: 4px; }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .r.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.2; color: var(--color-text-primary); white-space: nowrap; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--color-text-secondary); margin-left: 4px; }
.card .v.hi { color: var(--tool-accent); }
.card .v.dim { color: var(--color-text-muted); font-size: 17px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 760px) {
  .ph-sec { padding: 7px 0; } .ph-sec canvas { width: 88px; height: 88px; }
  .card .r { padding: 4px 0 3px; } .card .v { font-size: 18px; }
  .date-sec { gap: 5px; padding-bottom: 7px; } .dchip { padding: 3px 4px; }
  .card .src { padding-top: 6px; }
}
@media (max-width: 1340px) { .tabs .cc-segmented-btn { padding: 11px 16px; } }
@media (max-width: 1250px) { .slider .sv { display: none; } .top { gap: 10px; } .top h1 { font-size: 21px; } }
@media (max-width: 1160px) { .preset { min-width: 0; padding: 4px 6px; } .preset b { font-size: 14px; } .play { min-width: 0; } #status { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Lunar Phase Simulator</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="phases">Phases</button>
      <button class="cc-segmented-btn" data-tab="rise">Rise &amp; Set</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <button class="cc-btn now" id="bNow" title="Today's date, phase and time on Long Island">Now</button>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chips"></div>
        <div class="chips-r" id="chipsR"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card">
      <div class="date-sec">
        <div class="eb"><span>Date</span><b id="dateNow">Mar 20</b></div>
        <input type="range" id="dateRange" min="1" max="365" step="1" value="79" aria-label="Date">
        <div class="dchips" id="dchips"></div>
      </div>
      <div class="ph-sec">
        <canvas id="phCv" width="208" height="208" aria-label="The Moon as seen from Long Island"></canvas>
        <div><div class="ph-name" id="phName"></div><div class="ph-sub" id="phSub"></div></div>
      </div>
      <div id="rows"></div>
      <div class="src" id="src"></div>
    </div>
  </div>
</div>
