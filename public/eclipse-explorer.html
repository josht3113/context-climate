<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipse Explorer</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 14px; padding: 11px 20px; white-space: nowrap; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn, #bSaros { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#bSaros.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.png-menu { position: absolute; top: 38px; left: 0; z-index: 40; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.png-menu.open { display: flex; }
.png-menu button { background: none; border: 0; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px;
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.png-menu button:hover { background: rgba(232,228,217,0.08); }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; position: relative; }
.split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 10px; }
.pane { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.chips { position: absolute; display: flex; gap: 6px; align-items: center; z-index: 3; }
.chips.tl { top: 10px; left: 10px; }
.chips.tr { top: 10px; right: 10px; }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; }
.tgl::before { content: ''; display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tgl.is-active { border-color: var(--tool-accent); color: var(--color-text-primary); }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.tip { position: absolute; pointer-events: none; display: none; z-index: 8; background: var(--color-surface); border: 1px solid var(--tool-accent);
  border-radius: var(--radius-md); padding: 8px 11px; font-family: var(--font-mono); font-size: 14px; line-height: 1.5; color: var(--color-text-primary); white-space: nowrap; }
.tip b { font-family: var(--font-body); }

/* sky pane: event timeline + readout */
.evbar { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 46px; z-index: 3; border-radius: var(--radius-md);
  background: rgba(22,26,24,0.82); border: 1px solid rgba(232,228,217,0.14); backdrop-filter: blur(3px); }
.evbar canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: ew-resize; }
.readout { display: flex; align-items: stretch; gap: 0; border-top: 1px solid var(--color-border); min-height: 56px; }
.readout .ph { display: flex; align-items: center; gap: 10px; padding: 6px 16px; min-width: 196px; border-right: 1px solid var(--color-border); }
.readout .ph i { width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto; }
.readout .ph span { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.05; white-space: nowrap; }
.readout .st { display: flex; flex-direction: column; justify-content: center; padding: 5px 14px; border-right: 1px solid var(--color-border); min-width: 0; }
.readout .st:last-child { border-right: 0; }
.readout .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.readout .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.readout .v .u { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--color-text-secondary); margin-left: 4px; }

/* control bar */
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--color-surface);
  border: 1px solid var(--color-border); border-radius: var(--radius-lg); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.snap { padding: 6px 12px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .03em; color: var(--color-text-secondary); }
.snap .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.go { min-width: 104px; padding: 9px 14px; font-size: 15px; white-space: nowrap; }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 120px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 66px; text-align: right; white-space: nowrap; }

/* Saros reference panel */
.saros { position: absolute; inset: 0; z-index: 30; display: none; flex-direction: column; background: var(--color-surface);
  border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); overflow: hidden; }
.saros.open { display: flex; }
.saros .sh { display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
.saros .sh .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; white-space: nowrap; }
.saros .sh .info { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.saros .sh .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.saros .sh .cc-btn { padding: 6px 12px; font-size: 13px; }
.saros .sbody { flex: 1; position: relative; min-height: 0; }
.saros .sbody canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

@media (max-width: 1440px) { .top .sub { display: none; } .top { gap: 12px; } }
@media (max-width: 1366px) {
  .readout .ph { min-width: 170px; padding: 6px 12px; }
  .readout .st { padding: 5px 11px; }
  .readout .v { font-size: 19px; }
}
@media (max-width: 1280px) {
  .snap { padding: 6px 9px; }
  .readout .ph span { font-size: 19px; }
  .readout .st.opt { display: none; }
}
@media (max-width: 1180px) {
  .tabs .cc-segmented-btn { padding: 11px 14px; }
  .snap { padding: 6px 7px; font-size: 13px; }
  .snap .sw { display: none; }
  .slider .sv { min-width: 0; }
  .go { min-width: 0; padding: 9px 12px; }
  .controls { gap: 6px; }
  .readout .ph { min-width: 150px; }
}
@media (max-height: 680px) {
  .readout { min-height: 50px; }
  .readout .v { font-size: 18px; }
  .readout .ph span { font-size: 19px; }
  .evbar { height: 42px; bottom: 8px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title">Eclipse Explorer</h1><span class="sub">Earth–Moon System</span></div>
    <div class="cc-segmented tabs" id="tabs"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <button class="cc-btn" id="bSaros">Saros</button>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="png-menu" id="pngMenu">
        <button data-png="all">Whole tool</button>
        <button data-png="orbit">Orbit view</button>
        <button data-png="sky">Sky view</button>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="split">
      <div class="pane">
        <div class="stage" id="oStage"><canvas id="ocv"></canvas><div class="chips tr" id="oChips"></div><div class="tip" id="tip"></div></div>
      </div>
      <div class="pane">
        <div class="stage" id="kStage"><canvas id="kcv"></canvas><div class="chips tl" id="kChips"></div>
          <div class="evbar" id="evbar"><canvas id="ecv"></canvas></div></div>
        <div class="readout" id="readout"></div>
      </div>
    </div>
    <div class="controls" id="controls"></div>
    <div class="saros" id="saros">
      <div class="sh"><span class="eb">Saros families</span><div id="famChips"></div><span class="info" id="sInfo"></span><div class="spacer" style="flex:1"></div><button class="cc-btn" id="sClose">✕ Close</button></div>
      <div class="sbody" id="sBody"><canvas id="scv"></canvas><div class="tip" id="stip"></div></div>
    </div>
  </div>
</div>

const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* photosphere: limb-darkened disc with granulation and two spot groups.

function buildPhotosphere(kind, N = 512) {
  const cv = mkCanvas(N, N), c = cv.getContext('2d'), img = c.createImageData(N, N), d = img.data, R = N / 2 - 1;
  const cen = kind === 'filter' ? [255, 210, 128] : [255, 255, 250], limb = kind === 'filter' ? [188, 66, 12] : [255, 205, 150];
  const spots = [[0.34, -0.22, 0.016], [0.40, -0.18, 0.010], [-0.28, 0.17, 0.013], [-0.22, 0.20, 0.008]];
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const x = (i + 0.5 - N / 2) / R, y = (j + 0.5 - N / 2) / R, r2 = x * x + y * y, k = (j * N + i) * 4;
    if (r2 > 1.0) { const e = clamp((1.0 + 2 / R - Math.sqrt(r2)) * R / 2, 0, 1); if (e <= 0) continue; }

}

/* corona: helmet streamers, polar plumes, fine radial filaments. Sprite spans ±CORONA_EXT solar radii */
const CORONA_EXT = 4.6;
function buildCorona(N = 1100) {
  const cv = mkCanvas(N, N), c = cv.getContext('2d'), img = c.createImageData(N, N), d = img.data, Rs = N / 2 / CORONA_EXT;
  const tilt = 16 * RAD;
  const lobes = [[0.10, 1.25, 0.30], [Math.PI + 0.05, 1.05, 0.36], [0.85, 0.75, 0.20], [Math.PI - 0.70, 0.85, 0.22], [-0.55, 0.55, 0.17], [Math.PI + 0.75, 0.50, 0.16], [2.05, 0.28, 0.13], [-2.3, 0.30, 0.12]];

    const x = (i + 0.5 - N / 2) / Rs, y = (j + 0.5 - N / 2) / Rs, r = Math.hypot(x, y), k = (j * N + i) * 4;
    if (r < 0.96 || r > CORONA_EXT) continue;
    const th = Math.atan2(y, x) - tilt;
    let A = 0.07 + 0.08 * Math.pow(Math.abs(Math.cos(th)), 0.5);
    for (const [c0, a, w] of lobes) { let dth = Math.atan2(Math.sin(th - c0), Math.cos(th - c0)); const ww = w * (0.45 + 0.85 / Math.pow(r, 1.3)); A += a * Math.exp(-(dth * dth) / (ww * ww)); }

/* chromosphere ring + prominences. Sprite spans ±1.16 solar radii */
const CHROMO_EXT = 1.16;
function buildChromosphere(N = 640) {
  const cv = mkCanvas(N, N), c = cv.getContext('2d'), Rs = N / 2 / CHROMO_EXT, cx = N / 2, cy = N / 2;
  const g = c.createRadialGradient(cx, cy, Rs * 0.985, cx, cy, Rs * 1.022);
  g.addColorStop(0, 'rgba(255,70,110,0)'); g.addColorStop(0.3, 'rgba(255,92,128,0.95)'); g.addColorStop(0.62, 'rgba(255,80,120,0.55)'); g.addColorStop(1, 'rgba(255,70,110,0)');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, Rs * 1.022, 0, TAU); c.fill();
  const R = rng(91);
  const proms = [[-0.55, 0.10], [0.62, 0.07], [2.35, 0.12], [3.55, 0.06], [4.6, 0.09], [5.5, 0.05]];
  c.save(); c.filter = 'blur(1.2px)'; c.lineCap = 'round';
  for (const [pa, h] of proms) {
    for (let k = 0; k < 7; k++) {
      const a0 = pa + (R() - 0.5) * 0.09, a1 = a0 + (R() - 0.5) * 0.12, hh = h * (0.4 + 0.7 * R());
      const p0 = [cx + Rs * Math.cos(a0), cy + Rs * Math.sin(a0)], p1 = [cx + Rs * Math.cos(a1), cy + Rs * Math.sin(a1)];
      const am = (a0 + a1) / 2 + (R() - 0.5) * 0.05, pc = [cx + Rs * (1 + hh * 1.6) * Math.cos(am), cy + Rs * (1 + hh * 1.6) * Math.sin(am)];
      c.strokeStyle = `rgba(255,${90 + R() * 40 | 0},${125 + R() * 30 | 0},${0.45 + R() * 0.4})`; c.lineWidth = 1.5 + R() * 3.5;
      c.beginPath(); c.moveTo(p0[0], p0[1]); c.quadraticCurveTo(pc[0], pc[1], p1[0], p1[1]); c.stroke();
    }
    const bx = cx + Rs * (1 + h * 0.45) * Math.cos(pa), by = cy + Rs * (1 + h * 0.45) * Math.sin(pa), br = Rs * h * 0.55;
    const gb = c.createRadialGradient(bx, by, 0, bx, by, br); gb.addColorStop(0, 'rgba(255,110,140,0.55)'); gb.addColorStop(1, 'rgba(255,90,130,0)');

function loadMoon() {
  return new Promise(res => { const im = new Image();
    im.onload = () => { const c = mkCanvas(512, 512); c.getContext('2d').drawImage(im, 0, 0, 512, 512); res(c); };
    im.onerror = () => { const c = mkCanvas(512, 512), x = c.getContext('2d'); x.fillStyle = '#C9C6BE'; x.beginPath(); x.arc(256, 256, 255, 0, TAU); x.fill(); res(c); };

let TEX = null;
async function buildTextures() {
  TEX = { sunF: buildPhotosphere('filter'), sunW: buildPhotosphere('white'), corona: buildCorona(), chromo: buildChromosphere(), moon: await loadMoon() };
}

/* ══════════════════════════ STATE ══════════════════════════ */
const S = {
  tab: 'solar', T: 5, p: 0, playing: false, stopAt: false, ended: false, tween: null,
  view: 'angled', cam: { az: 0, el: 0 }, zoom: 1, sky: 'close', outlines: true,
  sarosOpen: false, fam: 'solar-139', fy: 2024
};
const VIEWS = { above: { az: 100, el: 88, l: 'Above' }, angled: { az: 128, el: 30, l: 'Angled' }, edge: { az: 190, el: 0, l: 'Edge-on' } };
const DATA = {};
function tabData(k = S.tab) {
  if (!DATA[k]) {
    const evs = buildEvents(k), W = buildWarp(k, evs), tab = TAB_DEF[k];
    const inWin = evs.filter(e => e.Tm >= tab.T0 && e.Tm <= tab.T1);
    const ecl = inWin.filter(e => e.type !== 'none');
    // one representative miss: the new/full moon just after the first eclipse season
    const miss = inWin.find(e => e.type === 'none' && e.Tm > ecl[0].Tm);
    const snaps = [...ecl, miss].filter(Boolean).sort((a, b) => a.Tm - b.Tm).map(e => ({ ev: e, T: e.Tm, p: W.pOf(e.Tm) }));
    DATA[k] = { evs, W, tab, inWin, snaps };
  }
  return DATA[k];
}

/* calendar for the idealized year (365 days, no leap day) */

const MLEN = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const MSTART = MLEN.reduce((a, l, i) => (a.push(i ? a[i - 1] + MLEN[i - 1] : 0), a), []);
function calOf(T) { let d = Math.floor(((T % 365) + 365) % 365), m = 0; while (m < 11 && d >= MSTART[m + 1]) m++; return { m, d: d - MSTART[m] + 1 }; }
const fmtDay = T => { const c = calOf(T); return MONTHS[c.m] + ' ' + c.d; };
function fmtClock(h) { h = ((h % 24) + 24) % 24; let hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  const ap = hh < 12 ? 'AM' : 'PM', h12 = hh % 12 === 0 ? 12 : hh % 12; return h12 + ':' + String(mm).padStart(2, '0') + ' ' + ap; }
const fmtDur = d => { const s = Math.round(d * 86400), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  return h ? `${h} h ${String(m).padStart(2, '0')} min` : m ? `${m} min ${String(x).padStart(2, '0')} s` : `${x} s`; };

/* ── the observer: one per event, blended between events ── */

/* everything the sky view and readout need at time T */
function skyState(T, tabKey = S.tab) {

/* ══════════════════════════ SKY VIEW ══════════════════════════ */
function label(c, t, x, y, o = {}) {

}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

}
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const css = (v, a = 1) => `rgba(${v[0] | 0},${v[1] | 0},${v[2] | 0},${a})`;

/* off-screen buffers, sized to the canvas being drawn */
const BUF = {};
function buf(name, w, h) { let b = BUF[name]; if (!b) b = BUF[name] = mkCanvas(2, 2);

const EVBAR_H = 58;                       // room kept clear for the timeline strip
const closeScale = (W, H) => Math.min(W, H - EVBAR_H) * 0.205 / 16;     // px per arcmin
const closeCenter = (W, H) => [W / 2, (H - EVBAR_H) / 2 + 4];

function drawSky(c, W, H, st, o = {}) {
  c.save();
  if (S.sky === 'wide') drawWide(c, W, H, st, o);
  else if (st.kind === 'solar') drawCloseSolar(c, W, H, st, o);
  else drawCloseLunar(c, W, H, st, o);

}
const pxr = c => c.getTransform().a || 1;

/* ── close-up: the Sun through a filter, filter off at totality ── */
function drawCloseSolar(c, W, H, st, o) {
  const k = closeScale(W, H), [cx, cy] = closeCenter(W, H), dpr = pxr(c);
  const Rs = st.rs * k, Rm = st.rm * k, mx = cx + st.moonXY[0] * k, my = cy - st.moonXY[1] * k;
  const overlap = st.sep < st.rs + st.rm;
  const uw = overlap ? 1 - smooth(0.0016, 0.011, st.flux) : 0;          // 0 = filtered view, 1 = naked-eye totality
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);

    const g = c.createRadialGradient(cx, cy, Rs, cx, cy, Math.max(W, H) * 0.75);
    g.addColorStop(0, '#16233F'); g.addColorStop(0.45, '#0B1428'); g.addColorStop(1, '#050913');
    c.globalAlpha = uw; c.fillStyle = g; c.fillRect(0, 0, W, H);

    const ce = CORONA_EXT * Rs; c.globalAlpha = uw; c.drawImage(TEX.corona.cv, cx - ce, cy - ce, ce * 2, ce * 2);
    c.globalAlpha = uw; c.fillStyle = '#040508'; moonPath(c, mx, my, Rm); c.fill();
    const { b, c: bc } = buf('chromo', c.canvas.width, c.canvas.height); bc.setTransform(c.getTransform());
    const he = CHROMO_EXT * Rs; bc.drawImage(TEX.chromo.cv, cx - he, cy - he, he * 2, he * 2);

    bc.drawImage(uw > 0.5 ? TEX.sunW : TEX.sunF, cx - Rs, cy - Rs, Rs * 2, Rs * 2);
    if (overlap) { bc.globalCompositeOperation = 'destination-out'; moonPath(bc, mx, my, Rm); bc.fill(); bc.globalCompositeOperation = 'source-over'; }

/* sunlight through the valleys on the Moon's limb: each gap glows; the brightest becomes the diamond */

const fmtLat = p => Math.abs(Math.round(p)) + '°' + (Math.round(p) === 0 ? '' : p > 0 ? 'N' : 'S');
function tags(c, W, lines) {

function scaleBar(c, W, H, k) {

/* ── the Moon with its phase and Earth's shadow on it ── */
function litPath(c, x, y, R, pa, cosI, fresh = true) {
  // lit region: the half facing the Sun, bounded by the terminator ellipse
  c.save(); c.translate(x, y); c.rotate(-pa);
  if (fresh) c.beginPath();
  for (let i = 0; i <= 48; i++) { const t = -Math.PI / 2 + Math.PI * i / 48; c.lineTo(R * Math.cos(t), -R * Math.sin(t)); }
  for (let i = 0; i <= 48; i++) { const t = Math.PI / 2 - Math.PI * i / 48; c.lineTo(-cosI * R * Math.cos(t), -R * Math.sin(t)); }
  c.closePath(); c.restore();
}
function drawMoonFace(c, x, y, R, st, opt = {}) {
  const dpr = pxr(c), pad = 2;
  const bw = Math.ceil((R * 2 + pad * 2) * dpr), { b, c: bc } = buf(opt.buf || 'moon', bw, bw);
  bc.setTransform(dpr, 0, 0, dpr, 0, 0); const ox = R + pad, oy = R + pad;
  bc.drawImage(TEX.moon, ox - R, oy - R, R * 2, R * 2);
  bc.save(); bc.beginPath(); bc.arc(ox, oy, R, 0, TAU); bc.clip();
  if (st.kind === 'lunar' && st.light < 0.9999 && st.inPen > 0) {
    const k = R / st.rm, sx = ox + (st.shadowXY[0] - st.moonXY0[0]) * k, sy = oy - (st.shadowXY[1] - st.moonXY0[1]) * k, rp = st.rp * k, ru = st.ru * k, E = st.exposure;
    const g = bc.createRadialGradient(sx, sy, 0, sx, sy, rp);
    for (let i = 0; i <= 40; i++) {
      const t = i / 40, r = t * rp, s = shadowLight(r, ru, rp);
      let col;
      if (r < ru) { const q = r / ru; col = mixc([0.62, 0.17, 0.07], [1.0, 0.46, 0.18], q * q); }
      else { const q = clamp((r - ru) / (ru * 0.06), 0, 1); col = mixc([0.78, 0.88, 1.0], [1, 1, 1], q); }
      let v = [col[0] * s * E, col[1] * s * E, col[2] * s * E];
      if (r < ru * 1.01) v = v.map((z, ci) => Math.max(z, [0.11, 0.035, 0.02][ci]));      // the eye still sees a dull red umbra
      v = v.map(z => clamp(z, 0, 1) * 255);
      g.addColorStop(t, css(v));

    bc.globalCompositeOperation = 'multiply'; bc.fillStyle = g; bc.fillRect(0, 0, R * 2 + pad * 2, R * 2 + pad * 2);

    bc.globalCompositeOperation = 'multiply';
    bc.fillStyle = 'rgb(14,16,22)'; bc.beginPath(); bc.rect(0, 0, R * 2 + pad * 2, R * 2 + pad * 2);

}

function drawCloseLunar(c, W, H, st, o) {
  const k = closeScale(W, H), [cx, cy] = closeCenter(W, H), Rm = st.rm * k;
  const L = st.light;
  // night sky, scattered moonlight, faint stars that come out as the Moon darkens
  c.fillStyle = '#03060C'; c.fillRect(0, 0, W, H);
  const gl = c.createRadialGradient(cx, cy, Rm, cx, cy, Rm * 6);
  gl.addColorStop(0, `rgba(150,170,205,${0.20 * L})`); gl.addColorStop(1, 'rgba(150,170,205,0)');
  c.fillStyle = gl; c.fillRect(0, 0, W, H);
  drawFieldStars(c, W, H, st, k, cx, cy, clamp(1 - L * 1.6, 0.12, 1));
  st.moonXY0 = [0, 0];
  drawMoonFace(c, cx, cy, Rm, st, { pa: st.brightPA });
  // a soft glow around a bright Moon
  if (L > 0.05) { const g2 = c.createRadialGradient(cx, cy, Rm * 0.98, cx, cy, Rm * 1.5); g2.addColorStop(0, `rgba(235,238,245,${0.22 * L})`); g2.addColorStop(1, 'rgba(235,238,245,0)'); c.fillStyle = g2; c.beginPath(); c.arc(cx, cy, Rm * 1.5, 0, TAU); c.fill(); }

    const sx = cx + st.shadowXY[0] * k, sy = cy - st.shadowXY[1] * k;
    c.save(); c.setLineDash([6, 6]); c.lineWidth = 1.4;
    c.strokeStyle = 'rgba(232,228,217,0.42)'; c.beginPath(); c.arc(sx, sy, st.ru * k, 0, TAU); c.stroke();
    c.strokeStyle = 'rgba(232,228,217,0.24)'; c.beginPath(); c.arc(sx, sy, st.rp * k, 0, TAU); c.stroke();
    c.restore();
    // label each outline where it crosses the view, away from the Moon
    for (const [r, t, a] of [[st.ru * k, "Earth's umbra", 0.66], [st.rp * k, 'penumbra', 0.5]]) {
      let best = null;
      for (let q = 0; q < 360; q += 6) { const x = sx + r * Math.cos(q * RAD), y = sy + r * Math.sin(q * RAD);
        if (x < 70 || x > W - 70 || y < 70 || y > H - EVBAR_H - 30) continue; const dd = Math.hypot(x - cx, y - cy); if (dd < Rm * 1.6) continue; if (!best || dd < best.d) best = { x, y, d: dd }; }
      if (best) label(c, t, best.x, best.y - 12, { font: `600 13px ${FB}`, color: `rgba(232,228,217,${a + 0.12})` });
    }
  }
  scaleBar(c, W, H, k);
  tags(c, W, [`Seen from ${fmtLat(st.phi)} · Moon ${Math.round(st.moonAA.alt)}° up`]);
  label(c, 'Moon image: NASA SVS', W - 14, H - EVBAR_H - 12, { align: 'right', font: `500 13px ${FM}`, color: 'rgba(232,228,217,0.55)', halo: false });
}
// background stars fixed on the sky (cells on the ecliptic grid), for the close-up
function drawFieldStars(c, W, H, st, k, cx, cy, vis) {
  if (vis <= 0.02) return;
  const t = st.tgt, lon0 = Math.atan2(t[1], t[0]) * DEG, lat0 = Math.asin(clamp(t[2], -1, 1)) * DEG;
  const span = Math.max(W, H) / k / 60 * 0.75 + 0.3, cell = 0.12;
  const cl = Math.cos(lat0 * RAD);
  for (let la = Math.floor((lat0 - span) / cell); la <= Math.ceil((lat0 + span) / cell); la++)
    for (let lo = Math.floor((lon0 - span / Math.max(0.2, cl)) / cell); lo <= Math.ceil((lon0 + span / Math.max(0.2, cl)) / cell); lo++) {
      const h = hash3(la, lo, 11); if (h > 0.35) continue;
      const sla = (la + hash3(la, lo, 12)) * cell, slo = (lo + hash3(la, lo, 13)) * cell;
      const v = [Math.cos(sla * RAD) * Math.cos(slo * RAD), Math.cos(sla * RAD) * Math.sin(slo * RAD), Math.sin(sla * RAD)];
      const n = dot3(v, t); if (n <= 0) continue;
      const x = cx + dot3(v, st.rgt) / n * DEG * 60 * k, y = cy - dot3(v, st.up) / n * DEG * 60 * k;
      if (x < 0 || x > W || y < 0 || y > H) continue;
      const mag = hash3(la, lo, 14); const a = vis * (0.25 + 0.75 * mag * mag);
      c.fillStyle = `rgba(225,232,255,${a})`; c.beginPath(); c.arc(x, y, 0.6 + mag * 1.0, 0, TAU); c.fill();
    }
}

/* ── wide view over the horizon ── */
const WIDE_FOV = { solar: 90, lunar: 70 };
const STARS = (() => { const R = rng(5), out = []; for (let i = 0; i < 1100; i++) { const z = R() * 2 - 1, a = R() * TAU, s = Math.sqrt(1 - z * z); out.push({ v: [s * Math.cos(a), s * Math.sin(a), z], m: Math.pow(R(), 2.6) }); } return out; })();
