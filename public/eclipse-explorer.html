<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eclipse Explorer</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 15px; white-space: nowrap; }
.tabs .cc-segmented-btn .n { opacity: .65; margin-right: 6px; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.png-menu { position: absolute; top: 38px; left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.png-menu.open { display: flex; }
.png-menu button { background: none; border: 0; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px;
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.png-menu button:hover { background: rgba(232,228,217,0.08); }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.snap { padding: 6px 10px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .03em; color: var(--color-text-secondary); }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.go { min-width: 98px; padding: 9px 14px; font-size: 15px; white-space: nowrap; }
.slider { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 120px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 84px; text-align: right; white-space: nowrap; }
.strip { flex: 1; min-width: 140px; height: 42px; position: relative; cursor: ew-resize; touch-action: none; }
.strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: var(--radius-sm); }
.chips { position: absolute; display: flex; gap: 6px; align-items: center; }
.chips.tl { top: 12px; left: 12px; }
.chips.tr { top: 12px; right: 12px; }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; }
.tgl::before { content: ''; display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tgl.is-active { border-color: var(--tool-accent); color: var(--color-text-primary); }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.tip { position: absolute; pointer-events: none; display: none; z-index: 8; background: var(--color-surface); border: 1px solid var(--tool-accent);
  border-radius: var(--radius-md); padding: 8px 11px; font-family: var(--font-mono); font-size: 14px; line-height: 1.5; color: var(--color-text-primary); white-space: nowrap; }
.tip b { font-family: var(--font-body); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .verdict { display: flex; align-items: center; gap: 10px; padding: 9px 0 8px; border-bottom: 1px solid var(--color-border); }
.card .verdict i { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }
.card .verdict span { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.1; }
.card .inset { padding: 8px 0 8px; border-bottom: 1px solid var(--color-border); }
.card .inset .ih { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.card .inset .cc-segmented-btn { padding: 4px 8px; font-size: 13px; }
.card .inset canvas { display: block; width: 100%; height: 148px; border-radius: var(--radius-md); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.dim .v { font-size: 19px; color: var(--color-text-secondary); }
.card .gauge { position: relative; height: 14px; margin: 6px 0 2px; border-radius: 2px; background: rgba(232,228,217,0.06); border: 1px solid var(--color-border); overflow: hidden; }
.card .gauge .hit { position: absolute; left: 0; top: 0; bottom: 0; }
.card .gauge .mk { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: #E8E4D9; }
.card .gscale { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 21px; }
  .card .r.dim .v { font-size: 17px; }
  .card .verdict { padding: 6px 0 5px; }
  .card .verdict span { font-size: 20px; }
  .card .inset canvas { height: 128px; }
  .card .inset { padding: 6px 0; }
}
@media (max-height: 640px) {
  .card .inset canvas { height: 112px; }
  .card .gauge { margin: 4px 0 1px; }
  .card .v { font-size: 20px; }
}
@media (max-width: 1440px) { .top .sub { display: none; } }
@media (max-width: 1280px) { .tabs .cc-segmented-btn { padding: 11px 11px; } }
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .card { padding: 10px 12px; }
  .tabs .cc-segmented-btn .lb { display: none; }
  .tabs .cc-segmented-btn .n { margin-right: 0; opacity: 1; }
  .snap { padding: 6px 7px; font-size: 13px; }
  .slider .sv { display: none; }
  .slider { min-width: 80px; }
  .controls { gap: 6px; }
  .go { min-width: 0; padding: 9px 11px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title">Eclipse Explorer</h1><span class="sub">Earth–Moon System</span></div>
    <div class="cc-segmented tabs" id="tabs"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="png-menu" id="pngMenu">
        <button data-png="all">Whole tool</button>
        <button data-png="stage">Stage only</button>
        <button data-png="card">Readout card</button>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips tl" id="chipsL"></div>
        <div class="chips tr" id="chipsR"></div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

/* ══════════════════════════ CARD INSETS ══════════════════════════ */
const SKY_HALF = 1.95;    // degrees, vertical half-span

      c.fillStyle = '#05070A'; c.beginPath(); c.arc(mx, my, rm, 0, TAU); c.fill(); c.strokeStyle = 'rgba(200,200,210,0.45)'; c.lineWidth = 1; c.stroke();

/* solar only: the Moon's shadow where it reaches Earth, seen from the Sun */

/* ══════════════════════════ STEP 4 — WHERE ARE WE NOW ══════════════════════════ */
const B_MAX = 5.7, SOLAR_LIMIT = 1.58;

  // y axis

    if (b % 1 === 0) label(c, (b > 0 ? '+' : b < 0 ? '−' : '') + Math.abs(b) + '°', L - 10, Y(b), { align: 'right', font: `500 14px ${FM}`, color: b ? 'rgba(232,228,217,0.62)' : '#E2A253', halo: false });
  }
  label(c, 'β', 18, T + h / 2, { font: `700 17px ${FM}`, color: 'rgba(232,228,217,0.8)', halo: false });
  // years

  const step = S.span > 10 ? 2 : 1;

    c.strokeStyle = 'rgba(232,228,217,0.14)'; c.beginPath(); c.moveTo(X(jx), T); c.lineTo(X(jx), T + h); c.stroke();
    if ((y - y0) % step === 0) label(c, String(y), X(jx) + 5, T + h + 16, { align: 'left', font: `600 14px ${FM}`, color: 'rgba(232,228,217,0.8)', halo: false });
  }

  c.strokeStyle = C.accent; c.lineWidth = 2; c.beginPath(); c.moveTo(tx, T - 6); c.lineTo(tx, T + h); c.stroke();
  label(c, 'TODAY', tx, T - 16, { font: `700 13px ${FM}`, color: '#6CCBD5' });
  const marks = [...pastEv().slice(-2), ...futureEv().slice(0, 3)];

  }

  lx += 6; dot(c, lx + 6, ly, 6, '#E8E4D9', false); label(c, 'new moon (solar)', lx + 17, ly + 1, { align: 'left', font: `500 13px ${FB}`, color: 'rgba(232,228,217,0.85)', halo: false });

}

/* ══════════════════════════ STEP 5 — THE SAROS ══════════════════════════ */
const TL_Y0 = 2026, TL_Y1 = 2056;

  const top = { x: 54, y: 52, w: W - 70, h: Math.round(H * 0.5) - 52 };

  const TX = y => t.x + (y - TL_Y0) / (TL_Y1 - TL_Y0 + 1) * t.w;
  label(c, 'EVERY ECLIPSE, 2026–2056', 12, 22, { align: 'left', font: `700 13px ${FM}`, color: 'rgba(232,228,217,0.7)', halo: false });
  for (let m = 0; m < 12; m++) {
    if (m % 2) { c.fillStyle = 'rgba(232,228,217,0.03)'; c.fillRect(t.x, t.y + m * mh, t.w, mh); }
    label(c, MONTHS[m], t.x - 8, t.y + m * mh + mh / 2, { align: 'right', font: `500 13px ${FM}`, color: 'rgba(232,228,217,0.66)', halo: false });
  }
  for (let y = TL_Y0; y <= TL_Y1 + 1; y++) {
    const x = TX(y), major = y % 5 === 0 || y === TL_Y0;
    c.strokeStyle = `rgba(232,228,217,${major ? 0.16 : 0.05})`; c.beginPath(); c.moveTo(x, t.y); c.lineTo(x, t.y + t.h); c.stroke();
    if (major && y <= TL_Y1) label(c, String(y), x + 4, t.y + t.h + 14, { align: 'left', font: `600 14px ${FM}`, color: 'rgba(232,228,217,0.78)', halo: false });
  }
  const pos = EV.map(e => { const cc = jdCal(e.jd), f = (cc.d - 1) / 31; return { e, x: TX(cc.y + (cc.m - 1 + f) / 12), y: t.y + (cc.m - 1) * mh + mh * (0.15 + 0.7 * f) }; });

  for (const p of pos) {

    c.globalAlpha = 1;

  }

  const b = lay.beats;

  label(c, 'THREE MONTHS, ONE SAROS', b.x + 12, b.y + 16, { align: 'left', font: `700 13px ${FM}`, color: 'rgba(232,228,217,0.7)', halo: false });
