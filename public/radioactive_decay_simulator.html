<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radioactive Decay Simulator — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); --dau: #E8E4D9; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

/* header */
#hdr { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--color-border); flex: 0 0 auto; }
#hdr .ttl { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
#hdr .ttl .cc-eyebrow { font-size: 12px; color: #8f8a7d; }
#hdr h1 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; }
#modeSeg .cc-segmented-btn { padding: 9px 16px; }
#hdr .sp { flex: 1; }
#isoRow { display: flex; gap: 6px; flex-wrap: wrap; }
.isob { display: inline-flex; align-items: center; gap: 7px; background: var(--color-surface); border: 1.5px solid var(--color-border); color: var(--color-text-secondary);
  font: 600 13.5px var(--font-body); padding: 6px 11px 6px 9px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.isob .dot { width: 11px; height: 11px; border-radius: 50%; }
.isob:hover { color: var(--color-text-primary); border-color: var(--color-border-hover); }
.isob.is-active { color: #F3EFE4; border-color: var(--c); background: color-mix(in srgb, var(--c) 18%, var(--color-surface)); }

/* shared */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 6px; min-width: 0; min-height: 0; }
.lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8f8a7d; }
canvas { display: block; }
.view { flex: 1 1 auto; min-height: 0; padding: 10px 12px; display: none; gap: 10px; }
.view.on { display: grid; }

/* SIMULATE */
#vSim { grid-template-columns: minmax(250px, 0.72fr) 1.45fr 300px; grid-template-rows: 1fr; }
#atomCard, #graphCard { display: flex; flex-direction: column; padding: 8px 10px 10px; }
#atomCard .cw, #graphCard .cw { position: relative; flex: 1 1 auto; min-height: 0; }
#atomCard canvas, #graphCard canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cardHead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; min-height: 22px; }
.legend { display: flex; gap: 12px; font: 13px var(--font-body); color: var(--color-text-secondary); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
#ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
#ctrl .cc-btn { padding: 7px 13px; }
#playB { min-width: 92px; }
.tog { display: inline-flex; align-items: center; gap: 5px; font: 13px var(--font-body); color: var(--color-text-secondary); cursor: pointer; white-space: nowrap; }
.tog input { accent-color: var(--tool-accent); width: 15px; height: 15px; }
.sel { font: 13px var(--font-body); color: var(--color-text-secondary); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.sel select { background: var(--color-surface-2); color: var(--color-text-primary); border: 1px solid var(--color-border); border-radius: 4px; font: 13px var(--font-body); padding: 4px 6px; }
#side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr 0.8fr; gap: 6px; }
#stT { grid-column: 1 / 4; }
.st { padding: 6px 10px; }
.st .v { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; white-space: nowrap; }
.st .s { font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st.warn .v { color: #F08A6E; }
#ratio { padding: 8px 10px; }
.rtrack { height: 12px; border-radius: 3px; overflow: hidden; display: flex; background: #3a3f3b; margin: 6px 0 4px; }
.rtrack div { height: 100%; transition: width .15s; }
.rlab { display: flex; justify-content: space-between; font: 13px var(--font-mono); color: var(--color-text-secondary); }
#mathCard { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
#mathSeg { display: flex; border-bottom: 1px solid var(--color-border); }
#mathSeg button { flex: 1; background: none; border: none; border-right: 1px solid var(--color-border); color: var(--color-text-secondary); font: 600 12px var(--font-mono);
  letter-spacing: .08em; text-transform: uppercase; padding: 7px 4px; cursor: pointer; }
#mathSeg button:last-child { border-right: none; }
#mathSeg button.is-active { background: var(--tool-accent); color: var(--color-bg); }
#mBox { padding: 8px 10px; overflow-y: auto; flex: 1 1 auto; font-size: 14px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font: 14px var(--font-mono); }
.kv span:nth-child(odd) { color: var(--color-text-secondary); }
.kv b { color: #F3EFE4; }
.dtab { width: 100%; border-collapse: collapse; font: 13px var(--font-mono); }
.dtab th { font-size: 12px; color: #8f8a7d; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; padding: 3px 4px; text-align: right; border-bottom: 1px solid var(--color-border); }
.dtab td { padding: 4px; text-align: right; border-bottom: 1px solid var(--color-border); }
.dtab td:first-child, .dtab th:first-child { text-align: left; }
.dtab tr.cur td { background: var(--color-surface-2); font-weight: 700; }
.empty { color: #8f8a7d; font: 13px var(--font-mono); text-align: center; padding: 14px 0; }
.meq { font: 15px var(--font-mono); color: #F3EFE4; margin-bottom: 8px; }
#rowCard { padding: 7px 10px; font-size: 13px; color: var(--color-text-secondary); line-height: 1.45; }
#rowCard b { color: #F3EFE4; font-weight: 600; }

/* DATE THE SAMPLE */
#vDate { grid-template-columns: 290px 1fr; grid-template-rows: auto 1fr; }
#sampList { grid-row: 1 / 3; display: flex; flex-direction: column; padding: 8px; gap: 5px; overflow-y: auto; }
.samp { text-align: left; background: var(--color-surface-2); border: 1.5px solid var(--color-border); border-radius: 6px; padding: 6px 9px; cursor: pointer; color: var(--color-text-primary); }
.samp:hover { border-color: var(--color-border-hover); }
.samp.is-active { border-color: var(--tool-accent); background: rgba(60,163,174,0.14); }
.samp .n { font: 700 14px var(--font-body); display: flex; justify-content: space-between; gap: 6px; }
.samp .m { font: 13px var(--font-body); color: var(--color-text-secondary); }
.samp .ok { color: #7FD3A0; font-size: 13px; }
#pick { padding: 8px 10px; }
#sampHead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
#sampHead .t { font: 700 18px var(--font-display); }
#sampHead .m { font: 14px var(--font-body); color: var(--color-text-secondary); }
.ptab { width: 100%; border-collapse: collapse; font-size: 13px; }
.ptab th { font: 600 12px var(--font-mono); color: #8f8a7d; text-transform: uppercase; letter-spacing: .05em; text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--color-border); }
.ptab td { padding: 4px 6px; border-bottom: 1px solid var(--color-border); vertical-align: top; color: var(--color-text-secondary); }
.ptab tr.row { cursor: pointer; }
.ptab tr.row:hover td { background: var(--color-surface-2); color: var(--color-text-primary); }
.ptab tr.row td:first-child { white-space: nowrap; color: #F3EFE4; font-weight: 600; }
.ptab tr.row td:first-child i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.ptab tr.good td { background: rgba(127,211,160,0.14); }
.ptab tr.bad td { background: rgba(240,138,110,0.12); }
.ptab .fb { font: 600 13px var(--font-body); white-space: normal; margin-top: 2px; max-width: 250px; }
.ptab tr.good .fb { color: #7FD3A0; }
.ptab tr.bad .fb { color: #F08A6E; }
.ptab td.nw { white-space: nowrap; }
#ageCard { display: flex; flex-direction: column; padding: 8px 10px 10px; }
#ageCard .cw { position: relative; flex: 1 1 auto; min-height: 120px; }
#ageCard canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
#winRow { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.winb { background: var(--color-surface-2); border: 1px solid var(--color-border); color: var(--color-text-secondary); font: 600 13px var(--font-mono); padding: 4px 9px; border-radius: 4px; cursor: pointer; }
.winb.is-active { border-color: var(--tool-accent); color: #F3EFE4; background: rgba(60,163,174,0.18); }
#measure { font: 700 15px var(--font-body); color: #F3EFE4; margin-left: auto; white-space: nowrap; }
#result { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; min-height: 30px; align-items: center; }
.rchip { font: 14px var(--font-body); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 4px; padding: 4px 9px; color: var(--color-text-primary); }
.rchip b { font-weight: 700; }
.rchip.src { color: var(--color-text-secondary); border-style: dashed; font-size: 13px; }
.rchip.grade { border-color: var(--tool-accent); }
#locked { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; font: 600 14px var(--font-body); color: #8f8a7d; background: rgba(30,35,32,0.7); }
#locked.on { display: flex; }

#modeSeg { flex-shrink: 0; }
@media (max-width: 1150px) {
  #vSim { grid-template-columns: minmax(200px, 0.6fr) 1.4fr 270px; }
  .isob { font-size: 13px; padding: 5px 8px; }
  .isob .nm { display: none; }
  #hdr .ttl .cc-eyebrow { display: none; }
  #vDate { grid-template-columns: 230px 1fr; }
  .ptab .hl { display: none; }
}
@media (prefers-reduced-motion: reduce) { .rtrack div { transition: none; } }
</style>
</head>
<body>
<header id="hdr">
  <div class="ttl"><span class="cc-eyebrow">ESSRT · Page 12</span><h1>Radioactive Decay</h1></div>
  <div class="cc-segmented" id="modeSeg">
    <button class="cc-segmented-btn is-active" data-mode="sim">Simulate</button>
    <button class="cc-segmented-btn" data-mode="date">Date the sample</button>
  </div>
  <div class="sp"></div>
  <div id="isoRow"></div>
</header>

<section class="view on" id="vSim">
  <div class="card" id="atomCard">
    <div class="cardHead"><span class="lbl">Atoms</span><span class="legend"><span><i id="lgP"></i>parent</span><span><i style="background:#4a504b"></i>daughter</span></span></div>
    <div class="cw"><canvas id="aC" aria-label="Grid of atoms decaying"></canvas></div>
  </div>
  <div class="card" id="graphCard">
    <div class="cardHead"><span class="lbl">Parent atoms remaining</span></div>
    <div class="cw"><canvas id="gC" aria-label="Decay curve"></canvas></div>
    <div id="ctrl">
      <button class="cc-btn primary" id="playB">▶ Play</button>
      <button class="cc-btn" id="stepB">+1 half-life</button>
      <button class="cc-btn" id="resetB">Reset</button>
      <label class="sel">Atoms <select id="n0s"><option>50</option><option>100</option><option selected>200</option><option>400</option></select></label>
      <label class="sel">Speed <select id="spds"><option value=".5">½×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option></select></label>
      <label class="tog"><input type="checkbox" id="dauCk">daughter</label>
      <label class="tog"><input type="checkbox" id="logCk">log scale</label>
      <label class="tog"><input type="checkbox" id="apCk">pause each t½</label>
    </div>
  </div>
  <div id="side">
    <div class="stats">
      <div class="card st"><div class="lbl">Parent</div><div class="v" id="sP">—</div><div class="s" id="sPs">—</div></div>
      <div class="card st"><div class="lbl">Daughter</div><div class="v" id="sD">—</div><div class="s" id="sDs">—</div></div>
      <div class="card st"><div class="lbl">t½</div><div class="v" id="sH">—</div><div class="s">elapsed</div></div>
      <div class="card st" id="stT"><div class="lbl">Time</div><div class="v" id="sT">—</div><div class="s" id="sTs">—</div></div>
    </div>
    <div class="card" id="ratio">
      <div class="lbl">Parent : daughter</div>
      <div class="rtrack"><div id="rP"></div><div id="rD" style="background:#4a504b"></div></div>
      <div class="rlab"><span id="rLP">100%</span><span id="rRat">—</span><span id="rLD">0%</span></div>
    </div>
    <div class="card" id="mathCard">
      <div id="mathSeg"><button data-m="sum" class="is-active">Summary</button><button data-m="table">Table</button><button data-m="eq">Equation</button></div>
      <div id="mBox"></div>
    </div>
    <div class="card" id="rowCard"></div>
  </div>
</section>

<section class="view" id="vDate">
  <div class="card" id="sampList"></div>
  <div class="card" id="pick">
    <div id="sampHead"><span class="t" id="sT2"></span><span class="m" id="sM2"></span></div>
    <table class="ptab"><thead><tr><th>Parent → daughter</th><th class="hl">Half-life</th><th>Useful range</th><th>Materials</th></tr></thead><tbody id="ptBody"></tbody></table>
  </div>
  <div class="card" id="ageCard">
    <div id="winRow"><span class="lbl" style="margin-right:4px">Time window</span><span id="winBtns"></span><span id="measure"></span></div>
    <div class="cw"><canvas id="ageC" aria-label="Decay curve for reading the age"></canvas><div id="locked">Pick the isotope first</div></div>
    <div id="result"></div>
  </div>
</section>

<script>
// ── ESSRT 2026 p. 12, in page order ──────────────────────────────────────
var ISO = [
  { id: 'sm147', sym: '¹⁴⁷Sm', par: 'Samarium-147', dau: 'Neodymium-143', hl: 106e9, hls: '106 billion yr', r: [1e7, 4.6e9], rs: '10 million – 4.6 billion yr',
    mat: 'Garnets, lunar fragments, and meteorites', tags: ['garnet', 'lunar', 'meteorite'], c: '#D08425' },
  { id: 'rb87', sym: '⁸⁷Rb', par: 'Rubidium-87', dau: 'Strontium-87', hl: 49.7e9, hls: '49.7 billion yr', r: [1e7, 4.6e9], rs: '10 million – 4.6 billion yr',
    mat: 'Potassium-bearing minerals (mica, feldspar, hornblende), whole igneous or metamorphic rock', tags: ['k-mineral', 'igneous-rock', 'metamorphic-rock'], c: '#D67E60' },
  { id: 'u238', sym: '²³⁸U', par: 'Uranium-238', dau: 'Lead-206', hl: 4.5e9, hls: '4.5 billion yr', r: [1e7, 4.6e9], rs: '10 million – 4.6 billion yr',
    mat: 'Uranium-bearing minerals (zircon, apatite, uraninite)', tags: ['zircon', 'apatite', 'uraninite'], c: '#A08CC6' },
  { id: 'u235', sym: '²³⁵U', par: 'Uranium-235', dau: 'Lead-207', hl: 703e6, hls: '703 million yr', r: [1e7, 4.6e9], rs: '10 million – 4.6 billion yr',
    mat: 'Uranium-bearing minerals (zircon, apatite, uraninite)', tags: ['zircon', 'apatite', 'uraninite'], c: '#6D96D8' },
  { id: 'k40', sym: '⁴⁰K', par: 'Potassium-40', dau: 'Argon-40', hl: 1.3e9, hls: '1.3 billion yr', r: [1e5, 4.6e9], rs: '100,000 – 4.6 billion yr',
    mat: 'Potassium-bearing minerals (mica, feldspar, hornblende), igneous or metamorphic rock', tags: ['k-mineral', 'igneous-rock', 'metamorphic-rock'], c: '#A69630' },
  { id: 'c14', sym: '¹⁴C', par: 'Carbon-14', dau: 'Nitrogen-14', hl: 5730, hls: '5,730 yr', r: [100, 70000], rs: '100 – 70,000 yr',
    mat: 'Organic materials, glacial ice containing carbon dioxide, groundwater, and ocean water', tags: ['organic', 'ice', 'water'], c: '#2AA87E' }
];
var EARTH = 4.6e9;
// ── real samples (ages from the published sources listed) ────────────────
var SAMPLES = [
  { id: 'otzi', name: 'Ötzi the Iceman', where: 'Ötztal Alps, Italy–Austria border', mat: 'Body tissue (organic material)', tags: ['organic'], age: 5300,
    src: 'ETH Zürich AMS: 4527 ± 7 radiocarbon years BP → 3356–3108 BCE (Radiocarbon)' },
  { id: 'chauvet', name: 'Chauvet Cave charcoal', where: 'Ardèche, France', mat: 'Charcoal from torches and fires (organic material)', tags: ['organic'], age: 35000,
    src: 'First occupation 37,000–33,500 years ago (Quiles et al. 2016, PNAS)' },
  { id: 'kauai', name: 'Nā Pali basalt, Kauaʻi', where: 'Hawaiian Islands', mat: 'Basalt lava (whole igneous rock)', tags: ['igneous-rock'], age: 5.1e6,
    src: 'K-Ar: oldest shield lavas ≈ 5.1 million years (McDougall 1964, 1979)' },
  { id: 'palisades', name: 'Palisades Sill zircon', where: 'Hudson River, New York–New Jersey', mat: 'Zircon crystals from diabase', tags: ['zircon'], age: 201e6,
    src: 'U-Pb: 201 ± 1 million years (Dunning & Hodych 1990, Geology)' },
  { id: 'marcy', name: 'Marcy anorthosite zircon', where: 'Adirondack Mountains, New York', mat: 'Zircon crystals from anorthosite', tags: ['zircon'], age: 1155e6,
    src: 'U-Pb SHRIMP: 1155 ± 6 million years (Hamilton et al. 2004)' },
  { id: 'amitsoq', name: 'Amîtsoq gneiss', where: 'Nuuk region, West Greenland', mat: 'Gneiss (whole metamorphic rock)', tags: ['metamorphic-rock'], age: 3.7e9,
    src: 'Rb-Sr: ≈ 3,700 million years (Moorbath et al. 1977, Nature)' },
  { id: 'moon', name: 'Apollo 16 sample 60025', where: 'Lunar highlands, the Moon', mat: 'Anorthosite (lunar fragment)', tags: ['lunar'], age: 4.36e9,
    src: 'Sm-Nd: 4,360 ± 3 million years (Borg et al. 2011, Nature)' },
  { id: 'jackhills', name: 'Jack Hills zircon', where: 'Western Australia', mat: 'Zircon crystal in sandstone', tags: ['zircon'], age: 4.404e9,
    src: 'U-Pb: 4,404 ± 8 million years — oldest known piece of Earth (Wilde et al. 2001, Nature)' }
];
var $ = function (id) { return document.getElementById(id); };
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function fmtN(n, d) { return n.toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
function fmtY(y) {
  if (y >= 1e9) return fmtN(y / 1e9, y >= 1e11 ? 0 : y >= 1e10 ? 1 : 2) + ' billion yr';
  if (y >= 1e6) return fmtN(y / 1e6, y >= 1e8 ? 0 : 1) + ' million yr';
  if (y >= 1e4) return fmtN(Math.round(y / 100) * 100) + ' yr';
  return fmtN(Math.round(y)) + ' yr';
}
function fmtYs(y) {                        // short axis label
  if (y === 0) return '0';
  if (y >= 1e9) return (+(y / 1e9).toFixed(2)) + ' B';
  if (y >= 1e6) return (+(y / 1e6).toFixed(1)) + ' M';
  if (y >= 1e3) return (+(y / 1e3).toFixed(1)) + 'k';
  return String(Math.round(y));
}
function pct(f) { return f >= 0.999 ? (f * 100).toFixed(4) : f >= 0.99 ? (f * 100).toFixed(3) : f >= 0.9 ? (f * 100).toFixed(2) : f >= 0.1 ? (f * 100).toFixed(1) : f >= 0.001 ? (f * 100).toFixed(2) : (f * 100).toPrecision(2); }
function hidpi(cv) {
  var r = cv.getBoundingClientRect(), d = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
  var c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0);
  return { c: c, W: r.width, H: r.height };
}
var REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── state ──
var S = { iso: 5, mode: 'sim', n0: 200, atoms: [], hl: 0, hist: [], tableLog: [], run: false, spd: 1, logSc: false, autoP: false,
  dau: false, math: 'sum', hover: null, samp: 0, pick: {}, win: {}, guess: {} };
var MHL = 8, THL = 0.02, RATE = 0.2;       // axis length (t½), tick size (t½), t½ per second at 1×

// ── isotope chips ──
(function () {
  var row = $('isoRow');
  ISO.forEach(function (o, i) {
    var b = document.createElement('button'); b.className = 'isob'; b.style.setProperty('--c', o.c);
    b.innerHTML = '<span class="dot" style="background:' + o.c + '"></span>' + o.sym + '<span class="nm"> ' + o.par.split('-')[0] + '</span>';
    b.onclick = function () { setIso(i); }; row.appendChild(b);
  });
})();
function setIso(i) {
  S.iso = i;
  document.querySelectorAll('.isob').forEach(function (b, k) { b.classList.toggle('is-active', k === i); });
  stop(); init();
}

// ── simulation ──
function init() {
  S.atoms = []; for (var i = 0; i < S.n0; i++) S.atoms.push({ d: false, f: 0 });
  S.hist = [{ t: 0, n: S.n0 }]; S.hl = 0; S.tableLog = [];
  render();
}
function alive() { var n = 0; for (var i = 0; i < S.atoms.length; i++) if (!S.atoms[i].d) n++; return n; }
function tick() {
  if (S.hl >= MHL - 1e-9) return false;
  var p = 1 - Math.pow(2, -THL), prevWhole = Math.floor(S.hl + 1e-9);
  for (var i = 0; i < S.atoms.length; i++) {
    var a = S.atoms[i];
    if (!a.d && Math.random() < p) { a.d = true; a.f = 6; } else if (a.f > 0) a.f--;
  }
  S.hl = Math.round((S.hl + THL) * 1e6) / 1e6;
  var n = alive(); S.hist.push({ t: S.hl, n: n });
  var whole = Math.floor(S.hl + 1e-9);
  if (whole > prevWhole) {
    var d = S.n0 - n;
    S.tableLog.push({ k: whole, n: n, d: d });
    if (S.autoP) return 'pause';
  }
  return true;
}
var raf = 0, lastT = 0, acc = 0;
function loop(now) {
  if (!S.run) return;
  var dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;

    c.fillStyle = '#F08A6E'; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillText('▼ measured ' + pct(fm) + '% is below this window', L + gw / 2, Tp + gh - 4);
  }
  // guess
  var gs = S.guess[s.id];
  if (gs !== null && gs !== undefined && gs <= win) {
    var gx = X(gs), gf = Math.pow(2, -gs / o.hl);
    c.strokeStyle = COL_GUESS; c.lineWidth = 2; c.beginPath(); c.moveTo(gx, Tp); c.lineTo(gx, Tp + gh); c.stroke();
    if (gf >= lo) { c.fillStyle = COL_GUESS; c.beginPath(); c.arc(gx, Y(gf), 5, 0, Math.PI * 2); c.fill(); }
    if (s.age <= win) {   // reveal: the published age
      var ax = X(s.age); c.strokeStyle = '#7FD3A0'; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(ax, Tp); c.lineTo(ax, Tp + gh); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#7FD3A0'; c.textAlign = ax > L + gw * 0.7 ? 'right' : 'left'; c.textBaseline = 'top'; c.fillText('published', ax + (ax > L + gw * 0.7 ? -5 : 5), Tp + 4);
    }
  }
  S._a = { L: L, gw: gw, win: win };
}
var COL_GUESS = '#F2C14E';
$('ageC').addEventListener('click', function (e) {
  if (!S._a) return; var r = $('ageC').getBoundingClientRect(), x = e.clientX - r.left;
  var t = clamp((x - S._a.L) / S._a.gw, 0, 1) * S._a.win;
  S.guess[SAMPLES[S.samp].id] = t; renderAge();
});

// ── modes, deep links, layout ──
function setMode(m) {
  S.mode = m; stop();
  document.querySelectorAll('#modeSeg .cc-segmented-btn').forEach(function (b) { b.classList.toggle('is-active', b.dataset.mode === m); });
  $('vSim').classList.toggle('on', m === 'sim'); $('vDate').classList.toggle('on', m === 'date');
  $('isoRow').style.visibility = m === 'sim' ? '' : 'hidden';
  if (m === 'sim') render(); else renderAge();
}
document.querySelectorAll('#modeSeg .cc-segmented-btn').forEach(function (b) { b.onclick = function () { setMode(b.dataset.mode); }; });
var rT = 0;
window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { if (S.mode === 'sim') render(); else drawAge(); }, 60); });
buildSamples();
(function boot() {
  var q = new URLSearchParams(location.search);
  var ii = ISO.findIndex(function (o) { return o.id === q.get('iso'); });
  S.iso = ii >= 0 ? ii : 5;
  document.querySelectorAll('.isob').forEach(function (b, k) { b.classList.toggle('is-active', k === S.iso); });
  var si = SAMPLES.findIndex(function (s) { return s.id === q.get('sample'); });
  setSample(si >= 0 ? si : 0);
  init();
  setMode(q.get('mode') === 'date' || si >= 0 ? 'date' : 'sim');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if (S.mode === 'sim') render(); else drawAge(); });
})();
</script>
