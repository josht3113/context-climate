<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Ice Extent Explorer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --tool-accent: var(--accent-climate);
    /* Content colors: which year a line represents, not decorative theme */
    --current: #FFF200;
    --previous: #E8E6DC;
  }
  body { font-size: 17px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 26px 24px 36px; }

  .logo-mark.cc-eyebrow { color: var(--tool-accent); margin-bottom: 8px; }

  h1.cc-title { margin: 0 0 8px; }

  .freshness {
    font-size: 15px;
    color: var(--color-text-muted);
    margin-bottom: 22px;
  }

  .controls-row, .compare-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 14px;
  }
  .sep { width: 1px; height: 22px; background: var(--color-border); margin: 0 8px; }

  .pill {
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 7px 13px;
    border-radius: var(--radius-md);
    cursor: pointer;
    user-select: none;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  #downloadBtn.cc-btn {
    border-color: var(--tool-accent);
    color: var(--tool-accent);
    background: transparent;
  }
  #downloadBtn.cc-btn:hover { background: var(--color-surface-2); color: var(--color-text-primary); }

  .hint {
    font-size: 14px;
    color: var(--color-text-muted);
    margin-bottom: 20px;
  }

  /* Chart surface: a real bordered, fully-opaque box per core-sample-tools.css's
     "CHART SURFACES" convention, so the page's grid-paper texture never bleeds
     through Chart.js's own (transparent-by-default) plot background. */
  .chart-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 24px;
    position: relative;
    height: 640px;
    margin-bottom: 22px;
  }
  .chart-status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-muted);
    font-size: 15px;
  }

  .stat-card {
    display: inline-block;
    background: var(--color-surface-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: 18px 24px;
    margin-bottom: 18px;
  }
  .stat-label {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--color-text-muted);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .stat-value {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 700;
    color: var(--current);
  }
  .stat-sub {
    font-size: 15px;
    color: var(--color-text-secondary);
    margin-top: 3px;
  }

  .footnote {
    font-size: 13px;
    color: var(--color-text-muted);
    font-style: italic;
    line-height: 1.5;
    max-width: 900px;
  }
  .citation {
    font-size: 12px;
    color: var(--color-text-muted);
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="logo-mark cc-eyebrow">[ Climate ]</div>
  <h1 class="cc-title">Sea ice extent explorer</h1>
  <div class="freshness" id="freshness">Loading data&hellip;</div>

  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:22px;">
    <div class="cc-segmented" id="hemiToggle" style="margin-bottom:0;">
      <button class="cc-segmented-btn active" data-hemi="N">Arctic</button>
      <button class="cc-segmented-btn" data-hemi="S">Antarctic</button>
    </div>
    <button id="downloadBtn" class="cc-btn">&#8681;&nbsp; Download PNG</button>
  </div>

  <div class="controls-row">
    <button id="contextToggle" class="cc-btn cc-btn-sm">All years: off</button>
    <span class="sep"></span>
    <div id="decadeLegend" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
    <span class="sep"></span>
    <span class="pill" id="previousPill" style="border-color: var(--previous);"></span>
    <span class="pill" id="currentPill" style="border-color: var(--current);"></span>
  </div>

  <div class="compare-row">
    <select id="compareSelect" class="cc-select"><option value="">+ compare a year</option></select>
    <div id="compareChips" style="display:flex; flex-wrap:wrap; gap:6px;"></div>
  </div>
  <div class="hint">click a decade or the current-year pill to toggle &middot; double-click to isolate</div>

  <div class="chart-card">
    <div class="chart-status" id="chartStatus">Loading&hellip;</div>
    <canvas id="seaiceChart" role="img" aria-label="Sea ice extent by year, day of year on the x-axis, million square kilometers on the y-axis" style="display:none;"></canvas>
  </div>

  <div class="stat-card" id="statCard" style="display:none;">
    <div class="stat-label">Current standing</div>
    <div class="stat-value" id="statValue"></div>
    <div class="stat-sub" id="statSub"></div>
  </div>

  <div class="footnote" id="footnote"></div>
  <div class="citation" id="citation"></div>

</div>

<script>
(function(){

  var STATE = {
    hemisphere: 'N',
    contextVisible: false,
    data: null,
    chart: null,
    decades: [],
    currentYear: null,
    previousYear: null,
    compareCount: 0,
    compareColors: ['#4FBFA0', '#D4537E', '#7AB8E0']
  };

  // Content color: the current year's line. Kept bright/saturated on purpose
  // so it reads instantly against the decade averages and the previous year.
  var CURRENT_COLOR = '#FFF200';

  function buildSlotLabels(){
    var labels = [];
    var d = new Date(2000, 0, 1); // 2000 is a leap year, gives exactly 366 days
    for (var i = 0; i < 366; i++){
      labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
      d.setDate(d.getDate() + 1);
    }
    return labels;
  }
  var SLOT_LABELS = buildSlotLabels();
  var MONTH_START_INDEX = {0:'Jan',31:'Feb',60:'Mar',91:'Apr',121:'May',152:'Jun',182:'Jul',213:'Aug',244:'Sep',274:'Oct',305:'Nov',335:'Dec'};

  function cleanVals(arr){
    return arr.filter(function(v){ return v !== null && v !== undefined; });
  }

  function formatDate(iso){
    if (!iso) return 'unknown';
    var parts = iso.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // sensor_transition.note is written generically ("...on this date...",
  // "...from this date forward...") and relies on sensor_transition.date
  // to fill in which date that actually is. Substitute it in here so the
  // footnote is never left with a dangling "this date" reference.
  function formatTransitionNote(transition){
    if (!transition) return '';
    var note = transition.note || '';
    if (transition.date) note = note.split('this date').join(formatDate(transition.date));
    return note;
  }

  fetch('seaice-extent.json').then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(json){
    STATE.data = json;
    document.getElementById('freshness').textContent =
      'Data current through ' + formatDate(json.updated_through) + ' · ' + json.source;
    document.getElementById('footnote').textContent = formatTransitionNote(json.sensor_transition);
    document.getElementById('citation').textContent = json.citation || '';
    initChart();
    rebuild();
  }).catch(function(err){
    document.getElementById('chartStatus').textContent = 'Could not load sea ice data right now. Please try again shortly.';
    console.error('seaice-extent.json load failed:', err);
  });

  function initChart(){
    var ctx = document.getElementById('seaiceChart');
    STATE.chart = new Chart(ctx, {
      type: 'line',
      data: { labels: SLOT_LABELS, datasets: [] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 150 },
        interaction: { mode: 'nearest', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function(items){ return SLOT_LABELS[items[0].dataIndex]; }
            }
          }
        },
        scales: {
          x: {
            ticks: {
              color: '#A6A499',
              font: { size: 14 },
              autoSkip: false,
              callback: function(val, index){ return MONTH_START_INDEX.hasOwnProperty(index) ? MONTH_START_INDEX[index] : ''; }
            },
            grid: { color: 'rgba(232,228,217,0.05)' }
          },
          y: {
            ticks: { color: '#A6A499', font: { size: 14 } },
            grid: { color: 'rgba(232,228,217,0.05)' },
            title: { display: true, text: 'million km²', color: '#A6A499', font: { size: 14 } }
          }
        }
      }
    });
  }

  function wrapText(ctx, text, maxWidth){
    var words = text.split(' ');
    var lines = [];
    var current = '';
    words.forEach(function(word){
      var test = current ? current + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = word;
      } else {
        current = test;
      }
    });
    if (current) lines.push(current);
    return lines;
  }

  function getLegendItems(){
    // Mirrors whatever is currently toggled on/visible in the interactive
    // chart, so the exported PNG's legend always matches what's drawn.
    var items = [];
    var contextOn = STATE.chart.data.datasets.some(function(ds){ return ds._kind === 'context' && !ds.hidden; });
    if (contextOn && STATE.yearKeys && STATE.yearKeys.length){
      items.push({
        label: 'All years (' + STATE.yearKeys[0] + '–' + STATE.yearKeys[STATE.yearKeys.length - 1] + ')',
        color: '#4a5049',
        dashed: false
      });
    }
    STATE.chart.data.datasets.forEach(function(ds){
      if (ds._kind === 'context' || ds.hidden) return;
      var label = ds.label;
      if (ds._kind === 'current') label += ' (current)';
      else if (ds._kind === 'previous') label += ' (previous)';
      items.push({ label: label, color: ds.borderColor, dashed: ds._kind === 'decade' });
    });
    return items;
  }

  function downloadChartPNG(){
    var EXPORT_SCALE = 3;
    var logicalWidth = 1400;
    var pad = 44;
    var contentWidth = logicalWidth - pad*2;

    var measureCanvas = document.createElement('canvas');
    var mctx = measureCanvas.getContext('2d');

    mctx.font = 'italic 17px "Public Sans"';
    var footnoteText = (document.getElementById('footnote').textContent || '').trim();
    var footnoteLines = footnoteText ? wrapText(mctx, footnoteText, contentWidth) : [];

    var citationText = (document.getElementById('citation').textContent || '').trim();

    // Lay out the legend (color-swatch + label pairs, wrapped into rows)
    // before we know totalHeight, same approach as the footnote wrapping above.
    var LEGEND_SWATCH_W = 26, LEGEND_SWATCH_GAP = 8, LEGEND_ITEM_GAP = 22, LEGEND_ROW_H = 26;
    mctx.font = '500 15px "Public Sans"';
    var legendItems = getLegendItems();
    var legendRows = [];
    (function(){
      var row = [], x = 0;
      legendItems.forEach(function(item){
        var textW = mctx.measureText(item.label).width;
        var itemW = LEGEND_SWATCH_W + LEGEND_SWATCH_GAP + textW;
        if (x + itemW > contentWidth && row.length){
          legendRows.push(row);
          row = []; x = 0;
        }
        row.push({ item: item, w: itemW });
        x += itemW + LEGEND_ITEM_GAP;
      });
      if (row.length) legendRows.push(row);
    })();
    var legendBlockHeight = legendRows.length ? (legendRows.length * LEGEND_ROW_H + 18) : 0;

    // Render the chart's own canvas at a fixed high-res multiplier, independent
    // of the viewing screen's devicePixelRatio -- otherwise on a standard 1x
    // display the chart only ever gets captured at 1x and then upscaled into
    // the export canvas below, which is what makes exported PNGs look blurry.
    var origDpr = STATE.chart.options.devicePixelRatio || (window.devicePixelRatio || 1);
    STATE.chart.options.devicePixelRatio = EXPORT_SCALE;
    STATE.chart.resize();

    var img = new Image();
    img.onload = function(){
      // Restore the on-screen chart to normal resolution now that the
      // high-res bitmap has been captured, so nothing looks different to the user.
      STATE.chart.options.devicePixelRatio = origDpr;
      STATE.chart.resize();

      var chartAspect = img.width / img.height;
      var chartDrawWidth = contentWidth;
      var chartDrawHeight = chartDrawWidth / chartAspect;

      var headerHeight = 96;
      var chartGap = 32;
      var statGap = 30;
      var footerLineHeight = 26;
      var footnoteBlockHeight = footnoteLines.length ? (footnoteLines.length * footerLineHeight + 16) : 0;
      var citationBlockHeight = citationText ? 26 : 0;
      var creditHeight = 30;
      var dividerGap = 26;

      var totalHeight = pad + headerHeight + chartGap + chartDrawHeight + legendBlockHeight + statGap + 96 + statGap
        + dividerGap + footnoteBlockHeight + citationBlockHeight + creditHeight + pad;

      var canvas = document.createElement('canvas');
      canvas.width = logicalWidth * EXPORT_SCALE;
      canvas.height = totalHeight * EXPORT_SCALE;
      var ctx = canvas.getContext('2d');
      ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
      ctx.textBaseline = 'top';

      ctx.fillStyle = '#1E2320';
      ctx.fillRect(0, 0, logicalWidth, totalHeight);

      var y = pad;

      ctx.fillStyle = '#D08425';
      ctx.font = '600 15px "Courier Prime"';
      ctx.fillText('[ CLIMATE ]', pad, y);
      y += 32;

      ctx.fillStyle = '#E8E4D9';
      ctx.font = '700 46px "Zilla Slab"';
      ctx.fillText('Sea Ice Extent Explorer', pad, y);
      y += 56;

      var hemiLabel = STATE.hemisphere === 'N' ? 'Arctic' : 'Antarctic';
      var freshness = document.getElementById('freshness').textContent || '';
      ctx.fillStyle = '#A6A499';
      ctx.font = '21px "Public Sans"';
      ctx.fillText(hemiLabel + '  ·  ' + freshness, pad, y);
      y += headerHeight - 56 - 32 + chartGap;

      ctx.drawImage(img, pad, y, chartDrawWidth, chartDrawHeight);
      y += chartDrawHeight + 20;

      if (legendRows.length){
        ctx.textBaseline = 'middle';
        ctx.font = '500 15px "Public Sans"';
        legendRows.forEach(function(row){
          var x = pad;
          var rowMidY = y + LEGEND_ROW_H / 2;
          row.forEach(function(cell){
            var item = cell.item;
            ctx.strokeStyle = item.color;
            ctx.lineWidth = item.dashed ? 3 : 3;
            ctx.lineCap = item.dashed ? 'round' : 'butt';
            ctx.setLineDash(item.dashed ? [1, 6] : []);
            ctx.beginPath();
            ctx.moveTo(x, rowMidY);
            ctx.lineTo(x + LEGEND_SWATCH_W, rowMidY);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.lineCap = 'butt';
            ctx.fillStyle = '#A6A499';
            ctx.fillText(item.label, x + LEGEND_SWATCH_W + LEGEND_SWATCH_GAP, rowMidY);
            x += cell.w + LEGEND_ITEM_GAP;
          });
          y += LEGEND_ROW_H;
        });
        ctx.textBaseline = 'top';
        y += 18;
      }
      y += statGap - 20;

      ctx.fillStyle = '#948F82';
      ctx.font = '600 15px "Public Sans"';
      ctx.fillText('CURRENT STANDING', pad, y);
      y += 30;

      ctx.fillStyle = CURRENT_COLOR;
      ctx.font = '700 42px "Zilla Slab"';
      var statValue = document.getElementById('statValue').textContent || '';
      ctx.fillText(statValue, pad, y);
      y += 50;

      ctx.fillStyle = '#A6A499';
      ctx.font = '21px "Public Sans"';
      var statSub = document.getElementById('statSub').textContent || '';
      ctx.fillText(statSub, pad, y);
      y += statGap + dividerGap - 10;

      ctx.strokeStyle = '#3B423C';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad, y);
      ctx.lineTo(logicalWidth - pad, y);
      ctx.stroke();
      y += 26;

      if (footnoteLines.length){
        ctx.fillStyle = '#A6A499';
        ctx.font = 'italic 17px "Public Sans"';
        footnoteLines.forEach(function(line){
          ctx.fillText(line, pad, y);
          y += footerLineHeight;
        });
        y += 12;
      }

      if (citationText){
        ctx.fillStyle = '#948F82';
        ctx.font = '15px "Public Sans"';
        ctx.fillText(citationText, pad, y);
        y += citationBlockHeight;
      }

      ctx.fillStyle = '#D08425';
      ctx.font = '600 15px "Courier Prime"';
      ctx.fillText('contextclimate.io  ·  Sea Ice Extent Explorer', pad, y);

      var dateStr = (STATE.data && STATE.data.updated_through) || new Date().toISOString().slice(0,10);
      var link = document.createElement('a');
      link.download = 'seaice-extent-' + (STATE.hemisphere === 'N' ? 'arctic' : 'antarctic') + '-' + dateStr + '.png';
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };
    img.src = STATE.chart.toBase64Image('image/png', 1);
  }

  document.getElementById('downloadBtn').onclick = function(){
    var btn = this;
    var original = btn.textContent;
    btn.textContent = 'Preparing…';
    document.fonts.ready.then(function(){
      downloadChartPNG();
      btn.textContent = original;
    });
  };

  document.getElementById('hemiToggle').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-hemi]');
    if (!btn) return;
    var hemi = btn.getAttribute('data-hemi');
    if (hemi === STATE.hemisphere) return;
    STATE.hemisphere = hemi;
    this.querySelectorAll('button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-hemi') === hemi); });
    STATE.compareCount = 0;
    rebuild();
  });

  function rebuild(){
    var hemiData = STATE.data.hemispheres[STATE.hemisphere];
    if (!hemiData){
      document.getElementById('chartStatus').style.display = 'flex';
      document.getElementById('chartStatus').textContent = 'No data available for this hemisphere yet.';
      document.getElementById('seaiceChart').style.display = 'none';
      return;
    }
    document.getElementById('chartStatus').style.display = 'none';
    document.getElementById('seaiceChart').style.display = 'block';

    var yearsObj = hemiData.years;
    var yearKeys = Object.keys(yearsObj).map(Number).sort(function(a,b){ return a-b; });
    var minYear = yearKeys[0], maxYear = yearKeys[yearKeys.length-1];
    STATE.currentYear = maxYear;
    STATE.previousYear = yearKeys.indexOf(maxYear-1) !== -1 ? maxYear-1 : null;
    STATE.yearsObj = yearsObj;
    STATE.yearKeys = yearKeys;

    var firstDecadeStart = Math.ceil(minYear/10)*10;
    var decades = [];
    for (var ds = firstDecadeStart; ds <= maxYear; ds += 10){
      var de = ds + 9;
      var yrsIn = yearKeys.filter(function(y){ return y >= ds && y <= de; });
      if (yrsIn.length === 0) continue;
      decades.push({ label: ds + 's', start: ds, end: de, years: yrsIn });
    }
    decades.forEach(function(dec, i){
      var t = decades.length > 1 ? i/(decades.length-1) : 0;
      var hue = 220 - 195*t, sat = 55 + 13*t, light = 42 + 10*t;
      dec.color = 'hsl(' + hue.toFixed(0) + ',' + sat.toFixed(0) + '%,' + light.toFixed(0) + '%)';
      dec.data = [];
      for (var slot = 0; slot < 366; slot++){
        var vals = cleanVals(dec.years.map(function(y){ return yearsObj[String(y)][slot]; }));
        dec.data.push(vals.length ? Math.round((vals.reduce(function(a,b){ return a+b; },0)/vals.length)*1000)/1000 : null);
      }
    });
    STATE.decades = decades;

    var datasets = [];
    yearKeys.forEach(function(y){
      datasets.push({ label: String(y), data: yearsObj[String(y)], borderColor: '#3a4038', borderWidth: 1, pointRadius: 0, tension: 0.25, cubicInterpolationMode: 'monotone', hidden: !STATE.contextVisible, _kind: 'context' });
    });
    decades.forEach(function(dec){
      // Dotted (not dashed) so short segments stay crisp round dots instead of
      // the ragged look plain square-cap dashes get at this line weight.
      datasets.push({ label: dec.label, data: dec.data, borderColor: dec.color, borderWidth: 2.5, borderDash: [1, 6], borderCapStyle: 'round', borderJoinStyle: 'round', pointRadius: 0, tension: 0.25, cubicInterpolationMode: 'monotone', hidden: false, _kind: 'decade' });
    });
    if (STATE.previousYear !== null){
      datasets.push({ label: String(STATE.previousYear), data: yearsObj[String(STATE.previousYear)], borderColor: '#E8E6DC', borderWidth: 2, pointRadius: 0, tension: 0.25, cubicInterpolationMode: 'monotone', hidden: false, _kind: 'previous' });
    }

    // Current year: brighter/bolder line with a larger marker at the last
    // reported day (today), so it's visually distinct from the reference lines.
    var currentData = yearsObj[String(maxYear)];
    var lastValidIdx = -1;
    for (var lvi = currentData.length - 1; lvi >= 0; lvi--){
      if (currentData[lvi] !== null && currentData[lvi] !== undefined){ lastValidIdx = lvi; break; }
    }
    var currentPointRadius = currentData.map(function(v, i){ return i === lastValidIdx ? 7 : 0; });
    var currentPointHoverRadius = currentData.map(function(v, i){ return i === lastValidIdx ? 9 : 3; });
    datasets.push({
      label: String(maxYear),
      data: currentData,
      borderColor: CURRENT_COLOR,
      borderWidth: 3,
      pointRadius: currentPointRadius,
      pointHoverRadius: currentPointHoverRadius,
      pointBackgroundColor: CURRENT_COLOR,
      pointBorderColor: '#1E2320',
      pointBorderWidth: 2,
      tension: 0.25,
      cubicInterpolationMode: 'monotone',
      hidden: false,
      _kind: 'current'
    });

    STATE.chart.data.datasets = datasets;
    STATE.chart.update();

    renderDecadeLegend();
    renderPreviousPill();
    renderCurrentPill();
    populateCompareSelect();
    renderCompareChips();
    updateStat();
  }

  document.getElementById('contextToggle').onclick = function(){
    STATE.contextVisible = !STATE.contextVisible;
    STATE.chart.data.datasets.forEach(function(ds){ if (ds._kind === 'context') ds.hidden = !STATE.contextVisible; });
    this.textContent = 'All years: ' + (STATE.contextVisible ? 'on' : 'off');
    this.classList.toggle('on', STATE.contextVisible);
    STATE.chart.update();
  };

  function isolateDataset(targetIdx){
    STATE.chart.data.datasets.forEach(function(ds, i){ ds.hidden = (i !== targetIdx); });
    STATE.contextVisible = (STATE.chart.data.datasets[targetIdx]._kind === 'context');
    var toggleBtn = document.getElementById('contextToggle');
    toggleBtn.textContent = 'All years: ' + (STATE.contextVisible ? 'on' : 'off');
    toggleBtn.classList.toggle('on', STATE.contextVisible);
    STATE.chart.update();
    renderDecadeLegend();
    renderPreviousPill();
    renderCurrentPill();
  }

  function renderCurrentPill(){
    var idx = STATE.chart.data.datasets.findIndex(function(d){ return d._kind === 'current'; });
    var ds = STATE.chart.data.datasets[idx];
    var el = document.getElementById('currentPill');
    el.textContent = STATE.currentYear;
    el.style.background = ds.hidden ? 'var(--color-surface)' : 'var(--current)';
    el.style.color = ds.hidden ? 'var(--color-text-muted)' : 'var(--color-bg)';
    el.onclick = function(){ ds.hidden = !ds.hidden; STATE.chart.update(); renderCurrentPill(); };
    el.ondblclick = function(){ isolateDataset(idx); };
  }

  function renderPreviousPill(){
    var el = document.getElementById('previousPill');
    var idx = STATE.chart.data.datasets.findIndex(function(d){ return d._kind === 'previous'; });
    if (idx === -1){
      el.style.display = 'none';
      return;
    }
    el.style.display = 'inline-block';
    var ds = STATE.chart.data.datasets[idx];
    el.textContent = STATE.previousYear;
    el.style.background = ds.hidden ? 'var(--color-surface)' : 'var(--previous)';
    el.style.color = ds.hidden ? 'var(--color-text-muted)' : 'var(--color-bg)';
    el.onclick = function(){ ds.hidden = !ds.hidden; STATE.chart.update(); renderPreviousPill(); };
    el.ondblclick = function(){ isolateDataset(idx); };
  }

  function renderDecadeLegend(){
    var el = document.getElementById('decadeLegend');
    el.innerHTML = '';
    STATE.decades.forEach(function(dec){
      var idx = STATE.chart.data.datasets.findIndex(function(d){ return d._kind === 'decade' && d.label === dec.label; });
      var ds = STATE.chart.data.datasets[idx];
      var pill = document.createElement('span');
      pill.textContent = dec.label;
      pill.className = 'pill';
      pill.style.borderStyle = 'dashed';
      pill.style.borderColor = dec.color;
      pill.style.background = ds.hidden ? 'var(--color-surface)' : 'var(--color-surface-2)';
      pill.style.color = ds.hidden ? 'var(--color-text-muted)' : dec.color;
      pill.onclick = function(){ ds.hidden = !ds.hidden; STATE.chart.update(); renderDecadeLegend(); };
      pill.ondblclick = function(){ isolateDataset(idx); };
      el.appendChild(pill);
    });
  }

  function populateCompareSelect(){
    var select = document.getElementById('compareSelect');
    select.innerHTML = '<option value="">+ compare a year</option>';
    STATE.yearKeys.slice().sort(function(a,b){ return b-a; }).forEach(function(y){
      if (y === STATE.currentYear || y === STATE.previousYear) return;
      var opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      select.appendChild(opt);
    });
  }

  document.getElementById('compareSelect').onchange = function(){
    var y = this.value;
    if (!y) return;
    var already = STATE.chart.data.datasets.some(function(d){ return d._kind === 'compare' && d.label === y; });
    if (!already){
      STATE.chart.data.datasets.push({
        label: y,
        data: STATE.yearsObj[String(y)],
        borderColor: STATE.compareColors[STATE.compareCount % STATE.compareColors.length],
        borderWidth: 2, pointRadius: 0, tension: 0.25, cubicInterpolationMode: 'monotone', hidden: false, _kind: 'compare'
      });
      STATE.compareCount++;
      STATE.chart.update();
      renderCompareChips();
    }
    this.value = '';
  };

  function renderCompareChips(){
    var container = document.getElementById('compareChips');
    container.innerHTML = '';
    STATE.chart.data.datasets.filter(function(d){ return d._kind === 'compare'; }).forEach(function(ds){
      var chip = document.createElement('span');
      chip.className = 'pill';
      chip.style.borderColor = ds.borderColor;
      chip.style.color = ds.borderColor;
      chip.innerHTML = ds.label + ' <span style="cursor:pointer; opacity:0.7;">&times;</span>';
      chip.querySelector('span').onclick = function(){
        var i = STATE.chart.data.datasets.indexOf(ds);
        STATE.chart.data.datasets.splice(i, 1);
        STATE.chart.update();
        renderCompareChips();
      };
      container.appendChild(chip);
    });
  }

  function updateStat(){
    var curData = STATE.yearsObj[String(STATE.currentYear)];
    var lastIdx = -1;
    for (var i = curData.length-1; i >= 0; i--){ if (curData[i] !== null && curData[i] !== undefined){ lastIdx = i; break; } }
    if (lastIdx === -1){
      document.getElementById('statCard').style.display = 'none';
      return;
    }
    var otherVals = STATE.yearKeys.filter(function(y){ return y !== STATE.currentYear; })
      .map(function(y){ return STATE.yearsObj[String(y)][lastIdx]; });
    var allVals = cleanVals(otherVals.concat([curData[lastIdx]]));
    var sorted = allVals.slice().sort(function(a,b){ return a-b; });
    var rank = sorted.indexOf(curData[lastIdx]) + 1;
    var ordinal = (rank===1?'1st':rank===2?'2nd':rank===3?'3rd':rank+'th');

    document.getElementById('statCard').style.display = 'inline-block';
    document.getElementById('statValue').textContent = ordinal + ' lowest';
    document.getElementById('statSub').textContent =
      'of ' + allVals.length + ' years on record for ' + SLOT_LABELS[lastIdx] + ' · computed live from the data shown';
  }

})();
</script>
</body>
</html>
