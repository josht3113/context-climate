<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Formation Lab</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; }
.top .spacer { flex: 1; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 54px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.preset { min-width: 64px; padding: 8px 12px; font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.preset:disabled, .tgl:disabled { opacity: .4; cursor: default; }
.go { min-width: 108px; padding: 9px 16px; font-size: 15px; }
.go2 { padding: 9px 14px; font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
.slider { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 150px; }
.slider .sl { font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sl .ls, .cc-btn .ls { display: none; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 66px; text-align: right; white-space: nowrap; }
.slider .se { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.slider.off { opacity: .4; }
.slider + .slider { margin-left: 14px; }
.tgl { padding: 8px 14px; font-size: 14px; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.chips { position: absolute; display: none; gap: 6px; }
.chips .cc-segmented-btn { padding: 6px 13px; font-size: 13px; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.dim .v { font-size: 21px; color: var(--color-text-secondary); }
.card .r.hot .v { color: #8FD0F2; }
.card table { width: 100%; border-collapse: collapse; margin-top: 4px; table-layout: fixed; }
.card th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; text-transform: uppercase; font-weight: 500;
  color: var(--color-text-secondary); text-align: right; padding: 8px 2px 5px 6px; border-bottom: 1px solid var(--color-border-hover); line-height: 1.25; vertical-align: bottom; }
.card th:first-child, .card td:first-child { text-align: left; }
.card td { font-family: var(--font-mono); font-size: 17px; font-weight: 700; text-align: right; padding: 7px 2px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.card td:first-child { font-family: var(--font-display); font-size: 20px; color: var(--tool-accent); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 640px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 23px; }
  .card .r.dim .v { font-size: 18px; }
  .card td { padding: 5px 2px; }
}
@media (max-width: 1240px) {
  .top h1 { font-size: 21px; }
  .tabs .cc-segmented-btn { padding: 11px 15px; }
  .slider .sl .lf, .cc-btn .lf { display: none; }
  .cc-btn .ls { display: inline; }
  .slider .sl .ls { display: inline; }
  .slider + .slider { margin-left: 8px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .controls { gap: 6px; padding: 8px 8px; }
  .slider { min-width: 0; gap: 6px; }
  .slider input { min-width: 36px; }
  .slider .sv { min-width: 0; font-size: 15px; }
  .slider .se { display: none; }
  .preset { min-width: 0; padding: 8px 9px; font-size: 14px; }
  .go { min-width: 0; padding: 9px 12px; }
  .go2 { padding: 9px 10px; font-size: 14px; }
  .tgl { padding: 8px 10px; font-size: 13px; }
  .card .v { font-size: 23px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Cloud Formation Lab</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="cap">Capacity</button>
      <button class="cc-segmented-btn" data-tab="psy">Psychrometer</button>
      <button class="cc-segmented-btn" data-tab="rise">Rising Air</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <a class="cc-btn x-link" id="adLink" target="_top" href="#">Atmospheric Density &rarr;</a>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chipsCap">
          <div class="cc-segmented">
            <button class="cc-segmented-btn" data-view="now">Beaker</button>
            <button class="cc-segmented-btn" data-view="day">24 Hours</button>
          </div>
          <div class="cc-segmented">
            <button class="cc-segmented-btn" data-unit="C">°C</button>
            <button class="cc-segmented-btn" data-unit="F">°F</button>
          </div>
        </div>
        <div class="chips" id="chipsPsy">
          <div class="cc-segmented">
            <button class="cc-segmented-btn" data-table="dp">Dewpoint</button>
            <button class="cc-segmented-btn" data-table="rh">Relative Humidity</button>
          </div>
        </div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

  [100, 92, 84, 76, 69, 62, 55, 49, 42, 36, 30, 25, 20, 14, 9, 4], [100, 92, 85, 77, 70, 64, 57, 51, 45, 39, 34, 28, 23, 18, 13, 9],
  [100, 93, 86, 78, 71, 65, 59, 53, 47, 42, 36, 31, 26, 21, 17, 12], [100, 93, 86, 79, 72, 66, 61, 55, 49, 44, 39, 34, 29, 25, 20, 16]];
const dryRow = T => Math.round((T + 20) / 2);
const maxDep = T => { const i = dryRow(T); return Math.min(ESRT_DP[i].length, ESRT_RH[i].length) - 1; };

/* ── state ─────────────────────────────────────────────────────────── */
const S = {
  tab: 'cap', unit: 'C',
  cap: { view: 'now', T: 20, W: 6.0, compare: false, hour: 4, dTd: 10, playing: false },
  psy: { T: 20, d: 9, wet: 20, phase: 'rest', m: 0, ang: 0, om: 0, target: 0, table: 'dp', lookup: false, everSpun: false },
  rise: { T0: 24, Td0: 12, z: 0, dir: 0, nuclei: true },
};
let capturing = false, clock = 0, dirty = true;

/* ═════════════════════════════ CAPACITY ════════════════════════════ */
const CAP_TMIN = -10, CAP_TMAX = 34, CAP_WMAX = 35;
const DAY_TMIN = -5, DAY_TMAX = 30;
const tU = c => S.unit === 'F' ? cToF(c) : c;
const uSym = () => S.unit === 'F' ? '°F' : '°C';
const fmtT = (c, dp = 0) => tU(c).toFixed(dp) + ' ' + uSym();

function capLayout(W, H) {
  const pad = 10, top = pad, bot = H - pad;
  const lw = Math.round((W - 3 * pad) * 0.37), gx = pad * 2 + lw, gw = W - gx - pad;
  const y0 = top + 52, yb = bot - 54;
  const day = S.cap.view === 'day';
  const px0 = gx + 74, px1 = gx + gw - (day ? 56 : 22);
  return { pad, top, bot, lw, gx, gw, y0, yb, px0, px1 };
}

/* the beaker: its height is the air's capacity, the water is the vapor it holds */
function drawBeaker(c, cx, yb, bw, capPx, vapPx, o) {
  const x0 = cx - bw / 2, x1 = cx + bw / 2, yt = yb - Math.max(capPx, 6), r = Math.min(9, bw * 0.12, capPx * 0.4);
  // water
  if (vapPx > 0.5) {
    const wy = yb - vapPx, mz = Math.min(3, vapPx * 0.3);
    c.save(); c.beginPath();
    c.moveTo(x0 + 2, wy); c.quadraticCurveTo(cx, wy + mz * 1.6, x1 - 2, wy);
    c.lineTo(x1 - 2, yb - r); c.quadraticCurveTo(x1 - 2, yb - 2, x1 - r, yb - 2);
    c.lineTo(x0 + r, yb - 2); c.quadraticCurveTo(x0 + 2, yb - 2, x0 + 2, yb - r); c.closePath();
    const g = c.createLinearGradient(0, wy, 0, yb); g.addColorStop(0, 'rgba(98,182,236,0.92)'); g.addColorStop(1, 'rgba(38,104,182,0.95)');
    c.fillStyle = g; c.fill();
    c.strokeStyle = 'rgba(214,238,255,0.85)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(x0 + 3, wy + 0.5); c.quadraticCurveTo(cx, wy + mz * 1.6 + 0.5, x1 - 3, wy + 0.5); c.stroke();
    c.restore();
  }
  // glass body
  c.save();
  const gl = c.createLinearGradient(x0, 0, x1, 0);
  gl.addColorStop(0, 'rgba(210,230,245,0.10)'); gl.addColorStop(0.18, 'rgba(255,255,255,0.16)'); gl.addColorStop(0.3, 'rgba(210,230,245,0.04)'); gl.addColorStop(1, 'rgba(210,230,245,0.08)');
  c.beginPath(); c.moveTo(x0 - 6, yt - 4); c.lineTo(x0, yt + 3); c.lineTo(x0, yb - r); c.quadraticCurveTo(x0, yb, x0 + r, yb);
  c.lineTo(x1 - r, yb); c.quadraticCurveTo(x1, yb, x1, yb - r); c.lineTo(x1, yt + 2); c.lineTo(x1 + 3, yt - 1);
  c.fillStyle = gl; c.fill();
  c.strokeStyle = 'rgba(226,240,250,0.9)'; c.lineWidth = 2.2; c.lineJoin = 'round'; c.stroke();
  // graduations at the shared scale
  if (o.grad) { c.strokeStyle = 'rgba(232,240,248,0.42)'; c.lineWidth = 1.2;
    for (const g of o.grad) { if (yb - g.y > capPx - 3 || g.y > yb - 4) continue; const len = g.major ? 11 : 6; line(c, x1 - 3 - len, g.y, x1 - 3, g.y); } }
  c.restore();
  // condensed water: beads on the glass and a puddle
  if (o.cond > 0 || o.dew) {
    const amt = o.dew ? 0.5 : clamp(o.cond / 4, 0.25, 1), rnd = seeded(o.seed || 7);
    const n = Math.round(4 + 8 * amt);
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? 1 : -1, hgt = rnd(), sp = 0.08 + rnd() * 0.12;
      const fy = (rnd() + (o.phase || 0) * sp) % 1;
      const y = yt + 6 + (yb - yt - 10) * (o.dew ? hgt : fy), x = (side > 0 ? x1 + 2.5 : x0 - 2.5) + side * rnd() * 1.5, rr = 2 + rnd() * 2.2;
      c.save(); c.beginPath(); c.ellipse(x, y, rr * 0.8, rr, 0, 0, TAU);
      const dg = c.createRadialGradient(x - rr * 0.3, y - rr * 0.4, 0, x, y, rr); dg.addColorStop(0, 'rgba(235,248,255,0.95)'); dg.addColorStop(1, 'rgba(98,182,236,0.75)');
      c.fillStyle = dg; c.fill(); c.restore();
    }
    if (o.cond > 0) { const pw = bw * (0.35 + 0.5 * amt);
      c.save(); c.beginPath(); c.ellipse(x1 + pw * 0.25, yb + 1, pw * 0.6, 3.2, 0, 0, TAU); c.fillStyle = 'rgba(98,182,236,0.55)'; c.fill(); c.restore(); }
  }
}

function drawBench(c, x, w, yb) {
  c.save();
  const g = c.createLinearGradient(0, yb, 0, yb + 14); g.addColorStop(0, '#4A4F49'); g.addColorStop(1, '#353A35');
  c.fillStyle = g; c.fillRect(x, yb, w, 14);
  c.fillStyle = 'rgba(255,255,255,0.10)'; c.fillRect(x, yb, w, 1.5);
  c.restore();
}

function capGrid(c, L, day) {
  const { px0, px1, y0, yb, gx } = L;
  c.save(); c.lineWidth = 1;
  if (!day) {
    const yW = w => yb - w / CAP_WMAX * (yb - y0);
    for (let w = 0; w <= CAP_WMAX; w += 5) { c.strokeStyle = w % 10 ? 'rgba(232,228,217,0.04)' : C_GRID; line(c, px0, yW(w), px1, yW(w));
      if (w % 5 === 0) label(c, String(w), px0 - 9, yW(w), { font: `600 13px ${FM}`, align: 'right', color: C_TXT2, halo: false }); }
    label(c, 'Water vapor (g per kg of air)', gx + 20, (y0 + yb) / 2, { font: `600 13px ${FB}`, color: C_TXT2, halo: false, rot: -Math.PI / 2 });
  }
  c.restore();
}

function xTempTicks(c, L, xT, lo, hi) {
  const { yb } = L;
  if (S.unit === 'F') { for (let f = Math.ceil(cToF(lo) / 10) * 10; f <= cToF(hi) + 1e-6; f += 10) { const x = xT(fToC(f)); c.strokeStyle = C_GRID; line(c, x, L.y0, x, yb); label(c, f + '°', x, yb + 17, { font: `600 13px ${FM}`, color: C_TXT2, halo: false }); } }
  else { const st = 10; for (let t = Math.ceil(lo / st) * st; t <= hi; t += st) { const x = xT(t); c.strokeStyle = C_GRID; line(c, x, L.y0, x, yb); label(c, t + '°', x, yb + 17, { font: `600 13px ${FM}`, color: C_TXT2, halo: false }); } }
}

function drawCap(c, W, H, o) {
  const L = capLayout(W, H), cp = S.cap, Td = tdFromW(cp.W);
  c.fillStyle = '#262B27'; c.fillRect(0, 0, W, H);
  panel(c, L.pad, L.top, L.lw, L.bot - L.top);
  panel(c, L.gx, L.top, L.gw, L.bot - L.top);
  if (cp.view === 'day') return drawCapDay(c, W, H, o, L);

  const { px0, px1, y0, yb } = L;
  const xT = t => px0 + (t - CAP_TMIN) / (CAP_TMAX - CAP_TMIN) * (px1 - px0);
  const yW = w => yb - w / CAP_WMAX * (yb - y0);
  const grad = []; for (let w = 5; w <= CAP_WMAX; w += 5) grad.push({ y: yW(w), major: w % 10 === 0 });
  capGrid(c, L, false);
  c.save(); xTempTicks(c, L, xT, CAP_TMIN, CAP_TMAX); c.restore();
  c.strokeStyle = C_AXIS; c.lineWidth = 1.2; line(c, px0, yb, px1, yb); line(c, px0, y0 - 6, px0, yb);
  label(c, `Air temperature (${uSym()})`, (px0 + px1) / 2, yb + 38, { font: `600 13px ${FB}`, color: C_TXT2, halo: false });

  // saturation curve
  c.save(); c.beginPath(); c.moveTo(xT(CAP_TMIN), yb);
  for (let t = CAP_TMIN; t <= CAP_TMAX + 1e-9; t += 0.25) c.lineTo(xT(t), Math.max(y0 - 4, yW(wsat(t))));
  c.lineTo(xT(CAP_TMAX), yb); c.closePath(); c.fillStyle = rgba(C_TEMP, 0.07); c.fill(); c.restore();
  c.save(); c.beginPath(); for (let t = CAP_TMIN; t <= CAP_TMAX + 1e-9; t += 0.25) { const y = yW(wsat(t)); t === CAP_TMIN ? c.moveTo(xT(t), y) : c.lineTo(xT(t), y); }
  c.strokeStyle = C_TEMP; c.lineWidth = 3; c.lineJoin = 'round'; c.stroke(); c.restore();

  // beakers
  const temps = cp.compare ? [10, 20, 30] : [cp.T];
  const bw = cp.compare ? Math.min(92, (L.lw - 70) / 3) : Math.min(150, L.lw * 0.42);
  const bx = temps.map((t, i) => cp.compare ? L.pad + L.lw * (0.2 + 0.3 * i) + 8 : L.pad + L.lw * 0.5);
  drawBench(c, L.pad + 1, L.lw - 2, yb);
  const states = temps.map(t => sample(t, Td));
  states.forEach((s, i) => {
    drawBeaker(c, bx[i], yb, bw, yb - yW(s.cap), yb - yW(s.vapor), { grad, cond: s.cond, phase: o.phase, seed: 11 + i * 7 });
    label(c, fmtT(s.T), bx[i], yb + 30, { font: `700 16px ${FM}`, color: C_TXT });
  });

  // guide lines across the gutter: rim → capacity, water level → dew point
  c.save(); c.lineWidth = 1.4; dash(c, [4, 5]);
  states.forEach((s, i) => { c.strokeStyle = rgba(C_TEMP, 0.55); line(c, bx[i] + bw / 2 + 5, yW(s.cap), xT(s.T) - 9, yW(s.cap)); });
  const sv = states[states.length - 1];
  c.strokeStyle = rgba(C_DEW, 0.6);
  line(c, bx[bx.length - 1] + bw / 2 + 5, yW(sv.vapor), xT(sv.dew) - 8, yW(sv.vapor));
  c.restore();

  // state bars
  states.forEach(s => {
    const x = xT(s.T), bwid = 14;
    c.save(); c.fillStyle = rgba(C_DEW, 0.9); c.fillRect(x - bwid / 2, yW(s.vapor), bwid, yb - yW(s.vapor));
    c.strokeStyle = C_TEMP; c.lineWidth = 2; c.strokeRect(x - bwid / 2, yW(s.cap), bwid, yb - yW(s.cap));
    if (s.cond > 0) { dash(c, [3, 3]); c.strokeStyle = rgba(C_DEW, 0.9); c.lineWidth = 1.6; c.strokeRect(x - bwid / 2, yW(s.W), bwid, yW(s.cap) - yW(s.W)); dash(c);
      label(c, 'Condensed', x + 12, (yW(s.W) + yW(s.cap)) / 2, { font: `600 13px ${FB}`, align: 'left', color: '#8FD0F2' }); }
    c.restore();
    dot(c, x, yW(s.cap), 5, C_TEMP, '#1F2421', 1.5);
    c.save(); c.fillStyle = C_TEMP; c.beginPath(); c.moveTo(x, yb - 1); c.lineTo(x - 6, yb + 7); c.lineTo(x + 6, yb + 7); c.closePath(); c.fill(); c.restore();
  });
  // water line and the dew point
  const s0 = sample(cp.compare ? 30 : cp.T, Td);
  const dewX = xT(s0.dew);
  c.save(); c.strokeStyle = C_DEW; c.lineWidth = 2.6; line(c, dewX, yW(s0.vapor), xT(s0.T) - 7, yW(s0.vapor)); c.restore();
  const dewT = s0.dew, dy = yW(wsat(dewT));
  c.save(); c.strokeStyle = rgba(C_DEW, 0.7); c.lineWidth = 1.4; dash(c, [3, 4]); line(c, xT(dewT), dy + 7, xT(dewT), yb); c.restore();
  c.save(); c.fillStyle = C_DEW; c.beginPath(); c.moveTo(xT(dewT), yb - 1); c.lineTo(xT(dewT) - 6, yb + 7); c.lineTo(xT(dewT) + 6, yb + 7); c.closePath(); c.fill(); c.restore();
  dot(c, xT(dewT), dy, 6.5, C_DEW, '#F1EEE6', 2);
  label(c, 'Dew point', xT(dewT) - 11, dy - 13, { font: `700 14px ${FB}`, align: 'right', color: '#8FD0F2' });
  if (!cp.compare) dot(c, xT(cp.T), yW(sample(cp.T, Td).vapor), 4, '#F1EEE6');

  // legend
  const nar = px1 - px0 < 470; let lx = px0 + 6; const ly = L.top + 20;
  lx += legendItem(c, lx, ly, C_TEMP, nar ? 'Capacity' : 'Capacity (maximum water vapor)') + 22;
  c.save(); c.fillStyle = rgba(C_DEW, 0.9); c.fillRect(lx, ly - 6, 14, 12); c.restore();
  label(c, 'Water vapor in the air', lx + 21, ly, { font: `600 13px ${FB}`, align: 'left', color: C_TXT, halo: false });

  if (o.hit) o.hit.cap = { L, xT, yW, stateX: xT(cp.T), stateY: yW(sample(cp.T, Td).cap), waterY: yW(s0.vapor), waterX0: Math.min(dewX, xT(cp.compare ? 30 : cp.T)), waterX1: xT(cp.compare ? 30 : cp.T), beakerX: bx, bw };
}

function drawCapDay(c, W, H, o, L) {
  const cp = S.cap, st = dayAt(cp.hour, cp.dTd);
  const { px0, px1, y0, yb } = L;
  // beaker panel (shared g/kg scale with the Beaker view)
  const yW = w => yb - w / CAP_WMAX * (yb - y0);
  const grad = []; for (let w = 5; w <= CAP_WMAX; w += 5) grad.push({ y: yW(w), major: w % 10 === 0 });
  drawBench(c, L.pad + 1, L.lw - 2, yb);
  const bw = Math.min(150, L.lw * 0.42), bx = L.pad + L.lw * 0.5;
  drawBeaker(c, bx, yb, bw, yb - yW(st.cap), yb - yW(Math.min(st.W, st.cap)), { grad, cond: 0, dew: st.sat, phase: o.phase, seed: 5 });
  label(c, fmtT(st.T), bx, yb + 30, { font: `700 16px ${FM}`, color: C_TXT });

  // graph
  const xH = h => px0 + h / 24 * (px1 - px0), yH = y0 + 16;
  const yT = t => yb - (t - DAY_TMIN) / (DAY_TMAX - DAY_TMIN) * (yb - yH);
  const yR = r => yb - r / 100 * (yb - yH);
  c.save(); c.fillStyle = 'rgba(0,0,0,0.22)'; c.fillRect(xH(0), y0, xH(6) - xH(0), yb - y0); c.fillRect(xH(18), y0, xH(24) - xH(18), yb - y0); c.restore();
  label(c, 'NIGHT', xH(3), yb - 13, { font: `700 13px ${FM}`, color: C_TXT2, halo: false });
  label(c, 'NIGHT', xH(21), yb - 13, { font: `700 13px ${FM}`, color: C_TXT2, halo: false });
  label(c, 'DAY', xH(12), yb - 13, { font: `700 13px ${FM}`, color: C_TXT2, halo: false });
  // saturated spans
  let inSat = false, h0 = 0;
  const spans = [];
  for (let h = 0; h <= 24.0001; h += 0.05) { const s = tCurve(h) <= cp.dTd; if (s && !inSat) { inSat = true; h0 = h; } if ((!s || h >= 24) && inSat) { inSat = false; spans.push([h0, h]); } }
  spans.forEach(([a, b]) => { c.save(); c.fillStyle = rgba(C_DEW, 0.13); c.fillRect(xH(a), y0, xH(b) - xH(a), yb - y0); c.restore();
    if (xH(b) - xH(a) > 34) label(c, 'Dew', (xH(a) + xH(b)) / 2, yb - 33, { font: `700 13px ${FB}`, color: '#8FD0F2' }); });
  // grid + axes
  c.save(); c.lineWidth = 1;
  const stepT = S.unit === 'F' ? 10 : 5;
  const loU = Math.ceil(tU(DAY_TMIN) / stepT) * stepT, hiU = tU(DAY_TMAX);
  for (let u = loU; u <= hiU + 1e-6; u += stepT) { const t = S.unit === 'F' ? fToC(u) : u, y = yT(t); c.strokeStyle = C_GRID; line(c, px0, y, px1, y); label(c, u + '°', px0 - 9, y, { font: `600 13px ${FM}`, align: 'right', color: C_TXT2, halo: false }); }
  for (let r = 0; r <= 100; r += 20) label(c, r + '%', px1 + 9, yR(r), { font: `600 13px ${FM}`, align: 'left', color: C_RH, halo: false });
  const hl = ['12 AM', '3 AM', '6 AM', '9 AM', '12 PM', '3 PM', '6 PM', '9 PM', '12 AM'];
  for (let i = 0; i <= 8; i++) { const x = xH(i * 3); c.strokeStyle = C_GRID; line(c, x, y0, x, yb); label(c, hl[i], x, yb + 17, { font: `600 13px ${FM}`, color: C_TXT2, halo: false }); }
  c.strokeStyle = C_AXIS; c.lineWidth = 1.2; line(c, px0, yb, px1, yb); line(c, px0, y0, px0, yb); line(c, px1, y0, px1, yb);
  c.restore();
  label(c, `Temperature (${uSym()})`, L.gx + 20, (y0 + yb) / 2, { font: `600 13px ${FB}`, color: C_TXT2, halo: false, rot: -Math.PI / 2 });
  label(c, 'Time of day', (px0 + px1) / 2, yb + 38, { font: `600 13px ${FB}`, color: C_TXT2, halo: false });
  // curves
  const curve = (f, y, col, w, dsh) => { c.save(); c.beginPath(); for (let h = 0; h <= 24.0001; h += 0.1) { const v = y(f(h)); h === 0 ? c.moveTo(xH(h), v) : c.lineTo(xH(h), v); }
    c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'round'; dash(c, dsh); c.stroke(); c.restore(); };
  curve(h => dayAt(h, cp.dTd).rh, yR, C_RH, 2.6);
  curve(() => cp.dTd, yT, C_DEW, 3, [8, 6]);
  curve(h => dayAt(h, cp.dTd).T, yT, C_TEMP, 3);
  // cursor
  const xc = xH(cp.hour);
  c.save(); c.strokeStyle = 'rgba(241,238,230,0.55)'; c.lineWidth = 1.5; line(c, xc, y0, xc, yb); c.restore();
  dot(c, xc, yR(st.rh), 5.5, C_RH, '#1F2421', 1.5);
  dot(c, xc, yT(st.Td), 5.5, C_DEW, '#1F2421', 1.5);
  dot(c, xc, yT(st.T), 6, C_TEMP, '#1F2421', 1.5);
  // legend
  let lx = px0 + 6; const ly = L.top + 20;
  lx += legendItem(c, lx, ly, C_TEMP, 'Air temperature') + 20;
  lx += legendItem(c, lx, ly, C_DEW, 'Dewpoint', true) + 20;
  legendItem(c, lx, ly, C_RH, 'Relative humidity');
  if (o.hit) o.hit.day = { L, xH };
}

/* ═══════════════════════════ PSYCHROMETER ══════════════════════════ */
const OMAX = 2.3 * TAU;           // rad/s while whirling
const SC_LO = -25, SC_HI = 40;    // thermometer scale, °C

function psyStep(ps, dt) {
  const Tw = ps.T - ps.d;
  if (ps.phase === 'up') { ps.m = Math.min(1, ps.m + dt / 0.45); ps.om = Math.min(OMAX, ps.om + OMAX * dt / 0.5); if (ps.m >= 1 && ps.om >= OMAX) ps.phase = 'spin'; }
  else if (ps.phase === 'spin') { ps.m = 1; ps.om = OMAX; }
  else if (ps.phase === 'stopping') { const rem = ps.target - ps.ang; if (rem > 0.02) { const a = ps.om * ps.om / (2 * rem); ps.om = Math.max(0.5, ps.om - a * dt); } }
  else if (ps.phase === 'down') { ps.m = Math.max(0, ps.m - dt / 0.5); if (ps.m <= 0) ps.phase = 'rest'; }
  ps.ang += ps.om * dt;
  if (ps.phase === 'stopping' && ps.ang >= ps.target - 1e-4) { ps.ang = 0; ps.om = 0; ps.phase = 'down'; }
  // the wick cools by evaporation; moving air through it is what lets it reach the wet-bulb temperature
  const v = ps.om / OMAX, eq = Tw + (1 - v) * 0.35 * ps.d;
  const tau = ps.wet > eq ? lerp(10, 0.9, v) : 90;
  ps.wet += (eq - ps.wet) * (1 - Math.exp(-dt / tau));
  if (v > 0.95 && Math.abs(ps.wet - Tw) < 0.04) ps.wet = Tw;
}
function startSpin(ps) { if (ps.phase === 'rest' || ps.phase === 'down' || ps.phase === 'stopping') { ps.phase = 'up'; ps.everSpun = true; if (ps.om < 0.5) ps.ang = ps.ang % TAU; } }
function stopSpin(ps) { if (ps.phase === 'spin' || ps.phase === 'up') { ps.phase = 'stopping'; let t = Math.ceil(ps.ang / TAU) * TAU; if (t - ps.ang < 1.4) t += TAU; ps.target = t; if (ps.om < 1.5) ps.om = 1.5; } }
const spinning = ps => ps.phase === 'up' || ps.phase === 'spin';
/* what the thermometers say right now: the lookup follows the reading, not the hidden answer */

function psyLayout(W, H) {

/* one thermometer on its enamel plate, centered on y = 0 in local units; bulb at xb */
function thermo(c, L, xb, xPlate0, reading, simple, wet) {
  const xs0 = -L + 76, xs1 = -48, tx = t => xs0 + (t - SC_LO) / (SC_HI - SC_LO) * (xs1 - xs0);

  c.save(); rrect(c, xPlate0, -17, -30 - xPlate0, 34, 5);
  const pg = c.createLinearGradient(0, -17, 0, 17); pg.addColorStop(0, '#F7F4EC'); pg.addColorStop(1, '#E2DDD0');
  c.fillStyle = pg; c.fill(); c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1; c.stroke(); c.restore();
  // ticks

  for (let t = SC_LO; t <= SC_HI; t++) { if (simple && t % 5) continue; const x = tx(t), mj = t % 5 === 0; line(c, x, -15, x, mj ? -8.5 : -11.5); }
  c.restore();

    const st = (tx(5) - tx(0)) < 30 ? 10 : 5;

    c.font = `700 13px ${FB}`; c.textAlign = 'left'; c.fillText('°C', tx(SC_HI) + 10, 9.5); c.restore(); }

  c.strokeStyle = '#D63A2B'; c.lineWidth = 3.2; line(c, xb, -3.5, tx(clamp(reading, SC_LO - 2, SC_HI)), -3.5); c.restore();
  // bulb

  c.beginPath(); c.ellipse(xb, -3.5, 10, 7.5, 0, 0, TAU); c.fillStyle = bg; c.fill(); c.restore();
  if (wet) { // cotton wick over the bulb

    c.fillStyle = wg; c.fill(); c.strokeStyle = 'rgba(60,70,75,0.45)'; c.lineWidth = 1; c.stroke();
    c.strokeStyle = 'rgba(90,105,112,0.35)'; for (let k = -10; k <= 14; k += 4) line(c, xb + k, -14, xb + k - 3, 7);
    c.restore();

}

/* a magnified window on one thermometer, centered on its reading */

  for (let t = Math.ceil(lo) - 1; t <= lo + span + 1; t++) { const xx = X(t), mj = t % 5 === 0; c.lineWidth = mj ? 2 : 1.2; line(c, xx, y + 3, xx, y + (mj ? h * 0.27 : h * 0.18)); }

function drawDevice(c, L, wet, dry, simple, handleA) {

  const fg = c.createLinearGradient(0, -44, 0, 44); fg.addColorStop(0, '#7C848B'); fg.addColorStop(0.5, '#5D656C'); fg.addColorStop(1, '#4A5157');

function drawTable(c, L, ps, x, y, w, h) {
  const tab = ps.table === 'rh' ? ESRT_RH : ESRT_DP, show = ps.lookup;
  const hx = 58, cw = (w - hx) / 16, top = y + 44, rh = (y + h - top) / 26;

  label(c, 'Difference between wet-bulb and dry-bulb temperatures (C°)', x + hx + (w - hx) / 2, y + 12, { font: `600 13px ${FB}`, color: C_TXT2, halo: false });
  label(c, 'Dry-bulb', x + 2, y + 25, { font: `700 13px ${FB}`, align: 'left', color: C_TXT2, halo: false });

  for (let i = 0; i < 26; i++) if (i % 2) { c.fillStyle = 'rgba(232,228,217,0.04)'; c.fillRect(x, top + i * rh, w, rh); }
  c.strokeStyle = 'rgba(232,228,217,0.22)'; c.lineWidth = 1; line(c, x, top, x + w, top); line(c, x + hx - 4, y + 18, x + hx - 4, y + h);
  c.strokeStyle = 'rgba(232,228,217,0.13)'; for (let j = 1; j < 16; j++) line(c, x + hx + j * cw, top, x + hx + j * cw, y + h);

    });
  }
}

function drawPsy(c, W, H, o) {
  const L = psyLayout(W, H), ps = S.psy, m = smooth(ps.m);
  c.fillStyle = '#262B27'; c.fillRect(0, 0, W, H);
  panel(c, L.pad, L.top, L.lw, L.bot - L.top);
  panel(c, L.gx, L.top, L.gw, L.bot - L.top);
  const px = lerp(L.read.x, L.spin.x, m), py = lerp(L.read.y, L.spin.y, m), sc = lerp(1, L.s, m);
  c.save(); c.beginPath(); c.rect(L.pad, L.top, L.lw, L.bot - L.top); c.clip();
  if (m > 0.2) { c.save(); const R = L.Lw * sc + 8, g = c.createRadialGradient(px, py, R * 0.25, px, py, R);
    g.addColorStop(0, 'rgba(232,228,217,0)'); g.addColorStop(0.75, `rgba(232,228,217,${0.05 * m})`); g.addColorStop(1, 'rgba(232,228,217,0)');
    c.fillStyle = g; dot(c, px, py, R, null); c.fill(); c.restore(); }

    for (let k = 4; k >= 1; k--) {
      c.save(); c.globalAlpha = 0.16 * (5 - k) / 4 * m * (ps.om / OMAX);
      c.translate(px, py); c.rotate(ps.ang - k * 0.17 * (ps.om / OMAX)); c.scale(sc, sc);
      drawDevice(c, L.Lw, ps.wet, ps.T, true, 0); c.restore();
    }
  }
  c.save(); c.translate(px, py); c.rotate(ps.ang); c.scale(sc, sc);
  drawDevice(c, L.Lw, ps.wet, ps.T, simple, clamp(1 - m * 3, 0, 1));
  c.restore();
  // evaporation from the wick
  const evap = ps.d > 0 ? 0.25 + 0.75 * ps.d / 15 : 0, wa = clamp(1 - m * 2.5, 0, 1) * evap;
  if (wa > 0.01) {
    const wx = px - L.Lw + 12, wy = py - 21 - 14;
    c.save(); c.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const t = ((o.phase || 0) * 0.32 + i / 7) % 1, x = wx + (i - 3) * 4 + Math.sin(t * 7 + i) * 4 - t * 14, y = wy - t * 40;
      c.strokeStyle = `rgba(226,240,250,${(wa * 0.6 * Math.sin(Math.PI * t)).toFixed(3)})`; c.lineWidth = 1.6;
      c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + 4, y - 4, x - 4, y - 8, x, y - 13); c.stroke();
    }
    c.restore();
  }

  if (la > 0.02) { c.save(); c.globalAlpha = la;
    label(c, 'Wet bulb', px - L.Lw + 40, py - 21 - 31, { font: `700 15px ${FB}`, align: 'left', color: C_TXT });
    label(c, 'Dry bulb', px - L.Lw + 46, py + 21 + 32, { font: `700 15px ${FB}`, color: C_TXT });
    c.restore(); }
  const ma = clamp(1 - m * 2.2, 0, 1);
  if (ma > 0.02) {
    const x0 = L.pad + 16, x1 = L.read.x - 30, yTop = L.read.y + 84, avail = L.bot - 10 - yTop;
    const sh = clamp((avail - 100) / 2, 44, 66), blk = 18 + 2 * (30 + sh) + 22, y1 = yTop + Math.max(0, (avail - blk) / 2);
    c.save(); c.globalAlpha = ma;
    label(c, 'MAGNIFIED', x0, y1 + 6, { font: `700 13px ${FM}`, align: 'left', color: C_TXT2, halo: false });
    magStrip(c, x0, y1 + 18 + 30, x1 - x0, sh, ps.wet, 'Wet bulb');
    magStrip(c, x0, y1 + 18 + 30 + sh + 22 + 30, x1 - x0, sh, ps.T, 'Dry bulb');
    c.restore();
  }
  c.restore();
  drawTable(c, L, ps, L.gx + 12, L.top + 46, L.gw - 24, L.bot - L.top - 54);
  if (o.hit) o.hit.psy = { L, px, py, sc, m };
}

/* ═════════════════════════════ RISING AIR ══════════════════════════ */
const RISE_V = 175;               // m per second of animation
const RX0 = -40, RX1 = 40;        // graph temperature axis, °C

function riseLayout(W, H) {
  const pad = 10, top = pad, bot = H - pad;
  const sw = Math.round((W - 3 * pad) * 0.56), sx = pad, gx = pad * 2 + sw, gw = W - gx - pad;
  const y0 = top + 40, yb = bot - 46;
  const px0 = gx + 88, px1 = gx + gw - 18;
  const yZ = z => yb - z / ZTOP * (yb - y0);
  const xT = t => px0 + (t - RX0) / (RX1 - RX0) * (px1 - px0);
  const r0 = clamp((yb - y0) * 0.068, 22, 36);
  return { pad, top, bot, sw, sx, gx, gw, y0, yb, px0, px1, yZ, xT, r0, cx: sx + sw * 0.40 };
}

/* static scenery, cached per size */
const SCN = { key: '', cv: null };
function sceneryCanvas(L, W, H, pr) {
  const key = [W, H, pr].join('|');
  if (SCN.key === key) return SCN.cv;
  const cv = document.createElement('canvas'); cv.width = Math.ceil(W * pr); cv.height = Math.ceil(H * pr);
  const c = cv.getContext('2d'); c.scale(pr, pr);
  const { sx, sw, top, bot, yb, y0 } = L;
  c.save(); rrect(c, sx, top, sw, bot - top, 6); c.clip();
  const sky = c.createLinearGradient(0, top, 0, yb);
  sky.addColorStop(0, '#2F67AE'); sky.addColorStop(0.45, '#4F8BCF'); sky.addColorStop(0.82, '#8DBDE6'); sky.addColorStop(1, '#C6DEF0');
  c.fillStyle = sky; c.fillRect(sx, top, sw, yb - top);
  const sun = c.createRadialGradient(sx + sw - 34, top + 26, 0, sx + sw - 34, top + 26, 150);
  sun.addColorStop(0, 'rgba(255,250,228,0.85)'); sun.addColorStop(0.12, 'rgba(255,246,214,0.45)'); sun.addColorStop(1, 'rgba(255,246,214,0)');
  c.fillStyle = sun; c.fillRect(sx, top, sw, yb - top);
  dot(c, sx + sw - 34, top + 26, 14, '#FFF8E2');
  // altitude grid
  c.strokeStyle = 'rgba(255,255,255,0.13)'; c.lineWidth = 1; dash(c, [2, 6]);
  for (let z = 500; z <= ZTOP; z += 500) line(c, sx, L.yZ(z), sx + sw, L.yZ(z));
  dash(c);
  // haze, treeline, ground
  const hz = c.createLinearGradient(0, yb - 40, 0, yb); hz.addColorStop(0, 'rgba(220,234,244,0)'); hz.addColorStop(1, 'rgba(220,234,244,0.35)');
  c.fillStyle = hz; c.fillRect(sx, yb - 40, sw, 40);
  const rnd = seeded(9);
  c.fillStyle = '#3E5B3A'; c.beginPath(); c.moveTo(sx, yb);
  for (let x = sx; x <= sx + sw + 6; x += 5) { const hgt = 4 + rnd() * 7 + (rnd() > 0.82 ? 5 : 0); c.lineTo(x, yb - hgt); }
  c.lineTo(sx + sw, yb + 2); c.closePath(); c.fill();

  c.fillStyle = gg; c.fillRect(sx, yb, sw, bot - yb);
  c.fillStyle = 'rgba(255,255,255,0.10)'; c.fillRect(sx, yb, sw, 1);
  c.strokeStyle = 'rgba(30,50,25,0.35)'; c.lineWidth = 1;
  for (let k = 0; k < 5; k++) { const y = yb + 6 + k * k * 2.2; line(c, sx, y, sx + sw, y); }
  c.restore();
  SCN.key = key; SCN.cv = cv; return cv;

/* ── cumulus sprite (three-pass: silhouette · lighting · form) ── */
