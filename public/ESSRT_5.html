<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESSRT Page 5 — Life Cycles of Stars</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); --panel-w: 360px; }
html, body { height: 100%; }
body { padding: 10px 16px; overflow: hidden; }
.app { display: flex; flex-direction: column; gap: 8px; height: calc(100vh - 20px); min-height: 600px; max-width: 1800px; margin: 0 auto; }

/* header */
.hdr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px; }
.hdr-title { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.hdr-title .cc-title { font-size: 26px; margin: 0; }
.tour-group { display: flex; align-items: center; gap: 8px; }
.tour-lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }
.tour-btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); color: var(--color-text-primary);
  font-family: var(--font-body); font-weight: 600; font-size: 14px; transition: transform .15s ease, border-color .15s ease, box-shadow .2s ease; }
.tour-btn .dot { width: 10px; height: 10px; border-radius: 50%; }
.tour-btn:hover { transform: translateY(-2px); border-color: var(--tc); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.tour-btn.is-active { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 22%, #262B27); box-shadow: 0 0 0 1px var(--tc), 0 0 18px color-mix(in srgb, var(--tc) 35%, transparent); }
.tour-btn:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 2px; }

/* mass strip */
.mass { position: relative; display: grid; grid-template-columns: 180px minmax(0, 1fr) 220px; gap: 14px; align-items: center;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: 8px; padding: 8px 14px; }
.mass-l .lbl, .mass-r .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }
.mass-val { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; color: var(--color-text-primary); }
.mass-val small { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 4px; }
.mass-path { font-family: var(--font-body); font-size: 14px; font-weight: 600; }
.mass-mid { position: relative; height: 92px; }
#massCv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#massIn { position: absolute; left: 10px; right: 10px; top: 4px; height: 34px; width: calc(100% - 20px); margin: 0; opacity: 0; cursor: pointer; }
#massIn:focus-visible + .focus-ring { display: block; }
.focus-ring { display: none; position: absolute; left: 4px; right: 4px; top: 2px; height: 38px; border: 2px solid var(--tool-accent); border-radius: 6px; pointer-events: none; }
.fate { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; }
.life { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); margin-top: 2px; }
.path-tgl { margin-top: 6px; }

/* main */
.main { position: relative; flex: 1; min-height: 0; display: flex; gap: 8px; }
.viewer { position: relative; flex: 1; min-width: 0; overflow: hidden; background: #F3F1EC; border: 1px solid var(--color-border); border-radius: 8px; cursor: grab; touch-action: none; }
.viewer.dragging { cursor: grabbing; }
.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.layer img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.layer svg { position: absolute; left: 0; top: 0; pointer-events: none; }
.hs { position: absolute; width: 0; height: 0; }
.hs button { position: absolute; left: 0; top: 0; width: 30px; height: 30px; transform: translate(-50%, -50%) scale(var(--inv, 1)); border-radius: 50%; cursor: pointer;
  background: rgba(30,35,32,0.18); border: 3px solid #1E8A95; box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.35); padding: 0; transition: background .15s ease; }
.hs button::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid rgba(30,138,149,0.55); animation: ring 2.6s ease-out infinite; }
.hs.time button { border-radius: 6px; border-color: #A67A1E; width: 26px; height: 26px; }
.hs.time button::after { border-radius: 9px; border-color: rgba(166,122,30,0.5); }
.hs.cycle button { border-color: #2A8C5E; }
.hs.cycle button::after { border-color: rgba(42,140,94,0.5); }
.hs button:hover { background: rgba(30,138,149,0.45); }
.hs.on-path button { background: rgba(255,255,255,0.6); }
.layer.pathmode .hs:not(.on-path):not(.active) { opacity: 0.45; }
.layer.pathmode .hs.time, .layer.pathmode .hs.cycle { opacity: 1; }
.hs.active button { background: #1E8A95; }
.hs.active button::after { animation: none; border-color: transparent; }
.hs .tip { position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 22px)) scale(var(--inv, 1)); transform-origin: 50% 100%; white-space: nowrap;
  background: #1E2320; color: #E8E4D9; font-family: var(--font-body); font-size: 14px; font-weight: 600; padding: 4px 10px; border-radius: 5px; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
.hs button:hover + .tip, .hs button:focus-visible + .tip { opacity: 1; }
@keyframes ring { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .hs button::after { animation: none; } .tour-btn { transition: none; } }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; }
.zoom .cc-btn { background: #262B27; }
.zoom-pct { font-family: var(--font-mono); font-size: 13px; color: #3A403B; background: rgba(243,241,236,0.85); padding: 2px 6px; border-radius: 4px; }

/* panel */
.panel { width: var(--panel-w); flex-shrink: 0; display: none; flex-direction: column; background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: 8px; overflow: hidden; }
.panel.open { display: flex; }
.p-head { display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px 8px; }
.p-head .cat { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }
.p-head h2 { font-family: var(--font-display); font-size: 23px; line-height: 1.15; margin: 2px 0 0; color: var(--color-text-primary); }
.p-close { margin-left: auto; background: none; border: 1px solid var(--color-border); color: var(--color-text-secondary); border-radius: 5px; width: 32px; height: 32px; font-size: 18px; cursor: pointer; flex-shrink: 0; }
.p-close:hover { color: var(--color-text-primary); border-color: var(--color-border-hover); }
.p-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px 12px; }
.p-lead { font-size: 15px; line-height: 1.45; color: var(--color-text-secondary); margin: 0 0 10px; }
.media-tabs { display: flex; margin-bottom: 8px; }
.media-tabs .cc-segmented { width: 100%; }
.media-tabs .cc-segmented-btn { flex: 1; padding: 8px 10px; }
.media { position: relative; width: 100%; border-radius: 6px; overflow: hidden; background: #0E100F; }
.photo .media { aspect-ratio: 33 / 20; }
.photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.img-mark { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 2px solid #F2C14E; border-radius: 50%; box-shadow: 0 0 0 1px rgba(0,0,0,.6); pointer-events: none; }
.img-mark span { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); white-space: nowrap; font: 600 14px var(--font-sans, sans-serif); color: #F2C14E; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
.credit .cap { font-style: normal; color: var(--color-text-secondary); }
.credit { font-size: 13px; color: var(--color-text-muted); font-style: italic; margin: 4px 0 0; line-height: 1.35; }
#animCv { display: block; width: 100%; height: 196px; }
.scrub { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.scrub input { flex: 1; accent-color: var(--tool-accent); }
.play { width: 34px; height: 30px; border-radius: 5px; border: 1px solid var(--color-border-hover); background: var(--color-surface-2); color: var(--color-text-primary); cursor: pointer; font-size: 13px; }
.readout { font-family: var(--font-mono); font-size: 14px; line-height: 1.45; color: var(--color-text-primary); margin-top: 6px; min-height: 40px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.fact { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 6px; padding: 6px 9px; }
.fact.wide { grid-column: 1 / -1; }
.fact .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); }
.fact .v { font-size: 15px; font-weight: 600; color: var(--color-text-primary); line-height: 1.3; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.links a { text-decoration: none; }
.p-foot { display: none; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--color-border); }
.p-foot.on { display: flex; }
.p-foot .step { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-right: auto; }
.p-foot .cc-btn.next { background: var(--tool-accent); border-color: var(--tool-accent); color: #1E2320; font-weight: 700; }
.src { font-size: 13px; color: var(--color-text-muted); font-style: italic; margin: 12px 0 0; line-height: 1.4; }

@media (max-width: 1180px) { .mass { grid-template-columns: 150px minmax(0,1fr) 180px; } .mass-val { font-size: 26px; } .fate { font-size: 19px; } .tour-lbl { display: none; } }
@media (max-width: 980px) { :root { --panel-w: 320px; } }
</style>
</head>

<div class="app cc-tool-wrap">

    <div class="hdr-title"><span class="cc-tag">ESSRT · Page 5</span><h1 class="cc-title">Life Cycles of Stars</h1></div>

function cr(pts, n) {
  n = n || 14;
  const out = [], P = [pts[0]].concat(pts, [pts[pts.length - 1]]);
  for (let i = 1; i < P.length - 2; i++) {
    const p0 = P[i - 1], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2];
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(j => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

document.getElementById('zIn').addEventListener('click', () => zoomBy(1.3));
document.getElementById('zOut').addEventListener('click', () => zoomBy(1 / 1.3));

const panel = document.getElementById('panel');
function openHS(id) {
  const h = HS_MAP[id]; if (!h) return;
  st.open = id;
  document.querySelectorAll('.hs').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  if (h.mass != null && !st.tour) { const cls = pathFor(st.M).key, want = pathFor(h.mass).key; if (cls !== want || (id === 'BH' && st.M < BH_HI) || (id === 'NS' && st.M >= BH_HI)) setMass(h.mass); }
  document.getElementById('pCat').textContent = CAT_LABEL[h.cat];
  document.getElementById('pTitle').textContent = h.name;
  const lead = document.getElementById('pLead'); lead.textContent = h.lead || ''; lead.style.display = h.lead ? '' : 'none';
  const im = h.img && IMAGES[h.img];
  document.getElementById('mediaTabs').style.display = im ? '' : 'none';
  if (im) {
    document.getElementById('pImg').src = im.src; document.getElementById('pImg').alt = im.cap || h.name;
    document.getElementById('pCap').textContent = im.cap || ''; document.getElementById('pCredit').textContent = im.credit;
    const mk = document.getElementById('pMark'); mk.style.display = im.mark ? '' : 'none';
    if (im.mark) { mk.style.left = (im.mark.x * 100) + '%'; mk.style.top = (im.mark.y * 100) + '%'; mk.querySelector('span').textContent = im.mark.label; }
  }
  setMedia(im ? 'photo' : 'model');
  document.getElementById('pFacts').innerHTML = h.facts.map(f => '<div class="fact' + (f[2] ? ' wide' : '') + '"><div class="k">' + f[0] + '</div><div class="v">' + f[1] + '</div></div>').join('');
  document.getElementById('pLinks').innerHTML = h.links.map(l => '<a class="cc-btn cc-btn-sm" target="_top" href="' + l.href + '">' + l.t + '</a>').join('');
  const foot = document.getElementById('pFoot');
  if (st.tour) {
    const T = TOURS[st.tour];
    foot.classList.add('on');
    document.getElementById('pStep').textContent = 'Step ' + (st.tourIdx + 1) + ' of ' + T.steps.length;
    document.getElementById('pPrev').disabled = st.tourIdx === 0;
    document.getElementById('pNext').textContent = st.tourIdx === T.steps.length - 1 ? 'Finish' : 'Next →';
  } else foot.classList.remove('on');

}

function setMedia(m) {

// tours
function syncTourBtns() { document.querySelectorAll('.tour-btn').forEach(b => b.classList.toggle('is-active', b.dataset.tour === st.tour)); }
function startTour(k) { st.tour = k; st.tourIdx = 0; syncTourBtns(); setMass(TOURS[k].mass); openHS(TOURS[k].steps[0]); }
function tourStep(d) {
  const T = TOURS[st.tour]; if (!T) return;
  const i = st.tourIdx + d;
  if (i >= T.steps.length) { closePanel(); return; }
  if (i < 0) return;
  st.tourIdx = i; const id = T.steps[i];

// ════════════════════════════════════════════════════════════════════
// ANIMATION HARNESS — p comes from the scrub slider; autoplay tweens it
// ════════════════════════════════════════════════════════════════════
const aCv = document.getElementById('animCv'), actx = aCv.getContext('2d'), scrub = document.getElementById('scrub'), playBtn = document.getElementById('playBtn');
let AW = 328, AH = 214, anim = null, animToken = 0, playing = false, t0 = 0, p = 0;
const DUR = 7000;
function sizeAnim() {
  const r = aCv.getBoundingClientRect(); if (r.width < 10) return;
  AW = Math.round(r.width); AH = Math.round(r.height);
  const dpr = window.devicePixelRatio || 1;
  aCv.width = AW * dpr; aCv.height = AH * dpr; actx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function startAnim(h) {
  const [prim, variant] = h.anim;
  anim = PRIMS[prim](variant);
  sizeAnim();
  p = 0; scrub.value = 0;
  playing = !reduce; if (reduce) { p = 1; scrub.value = 1000; }
  playBtn.textContent = playing ? '❚❚' : '▶';
  t0 = performance.now();
  const my = ++animToken;
  const loop = now => {
    if (my !== animToken) return;
    if (playing) {
      p = Math.min(1, p + (now - t0) / DUR); t0 = now; scrub.value = Math.round(p * 1000);
      if (p >= 1) { playing = false; playBtn.textContent = '▶'; }
    } else t0 = now;
    if (st.media === 'model') {
      actx.clearRect(0, 0, AW, AH);
      const ro = anim.draw(actx, p, AW, AH, now / 1000);
      document.getElementById('readout').innerHTML = ro || '';

    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
function stopAnim() { animToken++; playing = false; }
scrub.addEventListener('input', () => { p = scrub.value / 1000; playing = false; playBtn.textContent = '▶'; });
playBtn.addEventListener('click', () => {
  if (p >= 1) p = 0;
  playing = !playing; t0 = performance.now(); playBtn.textContent = playing ? '❚❚' : '▶';
});

// ── shared drawing helpers
const ease = x => x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (p, a, b) => clamp01((p - a) / (b - a));
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function gauss(r) { let u = 0, v2 = 0; while (u === 0) u = r(); while (v2 === 0) v2 = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v2); }
function T(c, s, x, y, o) {
  o = o || {}; c.font = o.font || '400 13px "Public Sans", sans-serif'; c.fillStyle = o.color || 'rgba(232,228,217,0.85)';
  c.textAlign = o.align || 'center'; c.textBaseline = o.base || 'alphabetic'; c.fillText(s, x, y);
}
function glow(c, x, y, r, col, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.save(); c.globalAlpha = a == null ? 1 : a; c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); c.restore();
}
// blackbody-ish surface colour ramp
function starCol(Tk) {
  const stops = [[3000, [255, 120, 70]], [3600, [255, 150, 90]], [4500, [255, 190, 120]], [5800, [255, 236, 190]], [7500, [235, 240, 255]], [12000, [200, 215, 255]], [30000, [160, 185, 255]]];
  let a = stops[0], b = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) if (Tk >= stops[i][0] && Tk <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
  const f = b[0] === a[0] ? 0 : clamp01((Tk - a[0]) / (b[0] - a[0]));
  return 'rgb(' + a[1].map((v, i) => Math.round(v + (b[1][i] - v) * f)).join(',') + ')';
}
function arrow(c, x1, y1, x2, y2, col, w) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = w || 2;
  c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2 - Math.cos(a) * 6, y2 - Math.sin(a) * 6); c.stroke();
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - 8 * Math.cos(a - 0.45), y2 - 8 * Math.sin(a - 0.45)); c.lineTo(x2 - 8 * Math.cos(a + 0.45), y2 - 8 * Math.sin(a + 0.45)); c.closePath(); c.fill();
  c.restore();
}
function bar(c, x, y, w, h, f, col, bg) { c.fillStyle = bg || 'rgba(232,228,217,0.15)'; c.fillRect(x, y, w, h); c.fillStyle = col; c.fillRect(x, y, w * clamp01(f), h); }

// ════════════════════════════════════════════════════════════════════
// PRIMITIVE A — collapse (cloud → protostar)
// ════════════════════════════════════════════════════════════════════
function primCollapse(variant) {
  const r = rng(variant === 'cluster' ? 11 : 7);
  const clumps = variant === 'cluster' ? [[-0.28, -0.12], [0.22, 0.18], [0.3, -0.25]] : [[0, 0]];
  const N = variant === 'cluster' ? 540 : 420;
  const parts = [];
  for (let i = 0; i < N; i++) {
    const k = i % clumps.length;
    parts.push({ k, ix: gauss(r) * 0.42 + (variant === 'cluster' ? clumps[k][0] * 0.4 : 0), iy: gauss(r) * 0.3 + (variant === 'cluster' ? clumps[k][1] * 0.4 : 0),
      rf: (variant === 'cluster' ? 0.02 + 0.09 * Math.pow(r(), 0.8) : 0.03 + 0.3 * Math.pow(r(), 0.75)), a0: r() * Math.PI * 2, sz: 0.8 + r() * 1.6, sh: r() });
  }
  return {
    draw(c, p, W, H, t) {
      const e = ease(p), cx = W / 2, cy = H / 2 + 6, S = Math.min(W, H) * 0.9;
      c.fillStyle = '#0B0D0C'; c.fillRect(0, 0, W, H);
      parts.forEach(q => {
        const cl = clumps[q.k], ccx = cx + cl[0] * S * (variant === 'cluster' ? 0.9 : 0), ccy = cy + cl[1] * S * (variant === 'cluster' ? 0.9 : 0);
        const spin = q.a0 + 9 * e * e / Math.pow(q.rf / 0.12, 1.5) + t * 0.6 * e / Math.pow(q.rf / 0.12, 1.5);
        const fx = ccx + Math.cos(spin) * q.rf * S, fy = ccy + Math.sin(spin) * q.rf * S * (variant === 'cluster' ? 0.6 : 0.28);
        const x = cx + q.ix * S + (fx - cx - q.ix * S) * e, y = cy + q.iy * S + (fy - cy - q.iy * S) * e;
        const warm = e * (1 - Math.min(1, q.rf / 0.32));
        c.fillStyle = 'rgba(' + Math.round(120 + 135 * warm) + ',' + Math.round(110 + 70 * warm) + ',' + Math.round(100 + 10 * warm) + ',' + (0.35 + 0.4 * q.sh) + ')';
        c.fillRect(x, y, q.sz, q.sz);
      });
      clumps.forEach(cl => {
        const ccx = cx + cl[0] * S * (variant === 'cluster' ? 0.9 : 0), ccy = cy + cl[1] * S * (variant === 'cluster' ? 0.9 : 0);
        const g = Math.pow(e, 2.2);
        glow(c, ccx, ccy, 6 + 26 * g, 'rgba(255,214,150,1)', g);
        if (g > 0.05) { c.fillStyle = 'rgba(255,248,230,' + g + ')'; c.beginPath(); c.arc(ccx, ccy, 1.5 + 3.5 * g, 0, Math.PI * 2); c.fill(); }
        if (variant === 'single' && p > 0.72) {
          const j = seg(p, 0.72, 1), Lj = 82 * j;
          [-1, 1].forEach(d => {
            const gr = c.createLinearGradient(ccx, ccy, ccx, ccy + d * Lj);
            gr.addColorStop(0, 'rgba(150,200,255,0.75)'); gr.addColorStop(1, 'rgba(150,200,255,0)');
            c.fillStyle = gr; c.beginPath(); c.moveTo(ccx - 3, ccy); c.lineTo(ccx - 16 * j, ccy + d * Lj); c.lineTo(ccx + 16 * j, ccy + d * Lj); c.lineTo(ccx + 3, ccy); c.closePath(); c.fill();
          });
        }
      });
      const Tc = 10 * Math.pow(10, 5 * Math.pow(e, 1.6));
      const phase = p < 0.25 ? 'Cold cloud' : p < 0.6 ? 'Collapsing' : p < 0.85 ? 'Spinning, flattening disk' : (variant === 'single' ? 'Protostar with jets' : 'Protostars');
      T(c, phase, 12, 22, { align: 'left', font: '600 14px "Public Sans", sans-serif', color: '#E8E4D9' });
      return 'Center temperature ≈ ' + sig(Tc, 2).toLocaleString() + ' K' + (variant === 'cluster' ? '<br>One cloud → ' + clumps.length + ' stars' : '');
    }
  };
}

// ════════════════════════════════════════════════════════════════════
// PRIMITIVE B — balance, then swell (true-scale orbits)
// ════════════════════════════════════════════════════════════════════
const AU_RSUN = 215.03;
const ORBITS = [['Mercury', 0.387], ['Venus', 0.723], ['Earth', 1.0], ['Mars', 1.524], ['Jupiter', 5.2]];
function primBalance(variant) {
  const cfg = {
    // main sequence only — the core hydrogen runs down; the star barely changes
    sunms: { msOnly: true, R0: 1, T0: 5772, ms: 10e9, today: 4.6e9, name: 'The Sun' },
    massms: { msOnly: true, R0: 7.5, T0: 25300, ms: tau(11.4), today: null, name: 'Spica' },
    // giant phases — open at the very end of the main sequence, then swell
    rg: { R0: 1, R1: 200, T0: 5772, T1: 3500, ms: 10e9, giant: 1.2e9, orbits: ['Mercury', 'Venus', 'Earth'], outerAU: 1.12 },
    rsg: { R0: 7.5, R1: 887, T0: 25300, T1: 3600, ms: tau(11.4), giant: 1.5e6, orbits: ['Earth', 'Mars', 'Jupiter'], outerAU: 5.6 },
    red: { R0: 0.154, R1: 0.154, T0: 3042, T1: 3042, ms: tau(0.122), giant: 0, orbits: [], outerAU: 0 }
  }[variant];
  const r = rng(3), cells = [];
  for (let i = 0; i < 9; i++) cells.push({ a: r() * Math.PI * 2, rr: 0.25 + r() * 0.6, ph: r() * 6 });
  return {
    draw(c, p, W, H, t) {
      c.fillStyle = '#0B0D0C'; c.fillRect(0, 0, W, H);
      const cx = variant === 'red' ? W / 2 - 30 : W / 2, cy = variant === 'red' ? H / 2 - 12 : H / 2 - 4;
      if (variant === 'red') {
        const age = p * UNIVERSE, R = 44;
        glow(c, cx, cy, R * 1.6, 'rgba(255,110,70,0.55)');
        c.fillStyle = starCol(3042); c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();
        // convection reaches the whole star
        c.save(); c.strokeStyle = 'rgba(120,30,20,0.55)'; c.lineWidth = 2;
        cells.forEach(q => { const a = q.a + t * 0.4, rr = q.rr * R; c.beginPath(); c.ellipse(cx + Math.cos(a) * rr * 0.4, cy + Math.sin(a) * rr * 0.4, rr * 0.45, rr * 0.25, a + q.ph, 0, Math.PI * 2); c.stroke(); });
        c.restore();
        balanceArrows(c, cx, cy, R);
        const used = age / cfg.ms;
        T(c, 'Fuel used', 14, H - 30, { align: 'left', font: '400 13px "Courier Prime", monospace' });
        bar(c, 14, H - 22, W - 28, 9, used, '#E0705A');
        c.fillStyle = '#E0705A'; c.fillRect(14, H - 22, Math.max(2, (W - 28) * used), 9);
        legendGP(c, W);
        return 'Age ' + fmtYears(Math.max(age, 1e6)) + (p >= 1 ? ' — today' : '') + '<br>Fuel used: ' + (used * 100).toFixed(2) + '% of ' + fmtYears(cfg.ms);
      }
      if (cfg.msOnly) {
        const age = p * cfg.ms;
        /* Sun: central hydrogen ≈ 0.71 → ≈ 0.34 by mass today (standard solar model) — about half left */
        const left = cfg.today ? (age <= cfg.today ? 1 - 0.52 * age / cfg.today : 0.48 * (1 - (age - cfg.today) / (cfg.ms - cfg.today))) : 1 - p;
        const R = 38, col = starCol(cfg.T0), sx = W / 2 + 24, cy = 80;
        glow(c, sx, cy, R * 1.5 + 6, col.replace('rgb', 'rgba').replace(')', ',0.45)'));
        const gr = c.createRadialGradient(sx - R * 0.3, cy - R * 0.3, R * 0.1, sx, cy, R);
        gr.addColorStop(0, '#FFFFFF'); gr.addColorStop(0.35, col); gr.addColorStop(1, col);
        c.fillStyle = gr; c.beginPath(); c.arc(sx, cy, R, 0, Math.PI * 2); c.fill();
        // fusing core: hydrogen (gold) giving way to helium (grey)
        const cr = R * 0.25;
        c.fillStyle = 'rgba(150,150,160,0.9)'; c.beginPath(); c.arc(sx, cy, cr, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,214,110,0.95)'; c.beginPath(); c.arc(sx, cy, cr * Math.sqrt(Math.max(0, left)), 0, Math.PI * 2); c.fill();
        balanceArrows(c, sx, cy, R);
        if (!cfg.today) {   // the Sun beside it, same scale
          const sr = R / cfg.R0, ux = 20, uy = H - 50;
          c.fillStyle = starCol(5772); c.beginPath(); c.arc(ux, uy, sr, 0, Math.PI * 2); c.fill();
          T(c, 'Sun, same scale', ux + sr + 6, uy + 4, { align: 'left', font: '400 13px "Public Sans", sans-serif' });
        }
        T(c, 'Core hydrogen', 14, H - 30, { align: 'left', font: '400 13px "Courier Prime", monospace' });
        bar(c, 14, H - 22, W - 28, 9, left, '#E3B23C');
        if (cfg.today) {
          const tx = 14 + (W - 28) * 0.48;
          c.fillStyle = '#E8E4D9'; c.fillRect(tx - 1, H - 25, 2, 15);
          T(c, 'today', tx, H - 30, { font: '400 13px "Public Sans", sans-serif' });
        }

        const isToday = cfg.today && Math.abs(age - cfg.today) < 0.12e9;
        return 'Age ' + fmtYears(Math.max(age, 1e6)) + (isToday ? ' — today' : '') + ' of ' + fmtYears(cfg.ms) +
          '<br>Core hydrogen left ≈ ' + Math.round(left * 100) + '% · ' + (cfg.today ? 'size and color barely change' : 'the Sun gets 10 billion yr');
      }
      /* giant variants open at the end of the main sequence: the last tenth of core hydrogen, then the swell */
      const msEnd = 0.15, zoomEnd = 0.3;
      const inner = 36 / cfg.R0;                        // px per solar radius at the end of the main sequence
      const outer = Math.min(W * 0.46, H * 0.43) / (cfg.outerAU * AU_RSUN);
      const zf = ease(seg(p, msEnd, zoomEnd));
      const pxR = Math.exp(Math.log(inner) + (Math.log(outer) - Math.log(inner)) * zf);
      const g = seg(p, msEnd, 1);
      const R = p <= msEnd ? cfg.R0 * 1.1 : cfg.R0 * 1.1 * Math.pow(cfg.R1 / (cfg.R0 * 1.1), ease(g));
      const Tk = p <= msEnd ? cfg.T0 : cfg.T0 + (cfg.T1 - cfg.T0) * ease(g);
      const age = p <= msEnd ? cfg.ms * (0.9 + 0.1 * p / msEnd) : cfg.ms + cfg.giant * g;
      const core = p <= msEnd ? 0.1 * (1 - p / msEnd) : 0;
      const starPx = Math.max(1.5, R * pxR);
      // orbits
      ORBITS.filter(o => cfg.orbits.includes(o[0])).forEach(([name, au], i) => {
        const rr = au * AU_RSUN * pxR; if (rr > Math.hypot(W, H)) return;
        const gone = R >= au * AU_RSUN;
        c.strokeStyle = gone ? 'rgba(224,112,90,0.35)' : 'rgba(232,228,217,0.3)'; c.setLineDash([3, 4]); c.lineWidth = 1;
