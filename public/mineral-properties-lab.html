<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mineral Properties Lab</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
:root { --tool-accent: var(--accent-geology, #6FA85C); --gold: #E2B64A; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; }
.top .spacer { flex: 1; }
.picker { display: flex; align-items: center; gap: 8px; }
.picker .cc-select { font-size: 15px; font-weight: 600; padding: 8px 10px; min-width: 150px; }
.picker .lt { min-width: 40px; padding: 8px 0; font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.picker .lt.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.picker .lt:disabled { opacity: .35; cursor: default; }
.picker #selLetter { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#bSound { padding: 6px 12px; font-size: 13px; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #1b1f1c; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.lens { position: absolute; inset: 0; pointer-events: none; display: none;
  background: radial-gradient(circle at 50% 50%, transparent 0, transparent 40%, rgba(10,12,11,0.55) 47%, rgba(10,12,11,0.97) 49.5%); }
.lens.on { display: block; }

.fl { position: absolute; display: flex; gap: 6px; align-items: center; z-index: 3; }
.fl .cc-segmented-btn { padding: 6px 12px; font-size: 12px; }
.fl .cc-segmented-btn:disabled { opacity: .38; cursor: default; }
.fl .cc-btn { padding: 6px 12px; font-size: 13px; background: var(--color-surface); }
#chipsTL { left: 10px; top: 10px; }
#chipsTR { right: 10px; top: 10px; }
#angleChip { left: 10px; bottom: 10px; display: none; background: rgba(30,35,32,0.92); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-md); padding: 6px 12px; gap: 10px; }
#angleChip .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); }
#angleChip .v { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--color-text-primary); min-width: 64px; }
#wipe { left: 50%; bottom: 12px; transform: translateX(-50%); display: none; }
#wipe .cc-btn { padding: 10px 22px; font-size: 15px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg);
  box-shadow: 0 4px 18px rgba(0,0,0,0.45); }
.tags3d { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.tag3d { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-align: center;
  font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); background: rgba(27,31,28,0.85);
  border: 1px solid var(--color-border); border-radius: 3px; padding: 3px 8px; line-height: 1.3; }
.tag3d b { display: block; font-family: var(--font-display); font-size: 20px; color: var(--color-text-primary); }

/* tool tray */
.tray { display: flex; align-items: stretch; gap: 5px; padding: 7px 8px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 70px; }
.tray .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 3px; }
.tool { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  padding: 5px 4px 4px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  color: var(--color-text-primary); cursor: pointer; font-family: var(--font-body); transition: border-color .15s, background .15s; }
.tool:hover { border-color: var(--color-border-hover); }
.tool svg { width: 30px; height: 26px; flex-shrink: 0; }
.tool .tn { font-size: 13px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tool { position: relative; }
.tool .th { position: absolute; top: 3px; right: 5px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--gold); line-height: 1; }
.tool.big { flex-grow: 1.35; border-color: rgba(111,168,92,0.55); }
.tool.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.tool.is-active .th { color: var(--color-bg); }
@media (max-width: 1240px) { .tool:not(.big) .tn { display: none; } .tool:not(.big) svg { width: 34px; height: 30px; } .tool.big { flex-grow: 2.3; } }

/* card */
.card { padding: 12px 14px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; }
.card .nm { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.1; padding: 6px 0 4px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; }
.card .nm .lh { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--color-text-secondary); white-space: nowrap; }
.card .row .r { overflow-wrap: anywhere; }
.card .sec { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.25; color: var(--color-text-primary); }
.card .v.dim, .card .dim { color: var(--color-text-muted); font-weight: 500; }
.card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 1px 0; line-height: 1.4; }
.card .row .k { font-family: var(--font-body); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
.card .row .k b { font-family: var(--font-mono); color: var(--gold); margin-left: 4px; }
.card .row .r { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--color-text-primary); text-align: right; }
.card .row .r.no { color: var(--color-text-muted); font-weight: 500; }
.card .row .r.pend { color: var(--gold); }
.card .sw { display: inline-block; width: 30px; height: 16px; border-radius: 2px; border: 1px solid rgba(232,228,217,0.3); vertical-align: -2px; margin-right: 8px; }
.card .path { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; padding: 2px 0 2px; }
.card .pn { font-family: var(--font-body); font-size: 13px; font-weight: 600; padding: 1px 6px; border-radius: 3px;
  border: 1px solid var(--color-border); color: var(--color-text-muted); line-height: 1.25; }
.card .pn.on { border-color: var(--tool-accent); color: var(--color-text-primary); background: rgba(111,168,92,0.16); }
.card .pn.fin.on { background: var(--tool-accent); color: var(--color-bg); }
.card .pn.na { border-style: dashed; }
.card .pa { color: var(--color-text-muted); font-size: 13px; line-height: 1; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) { .card { padding: 9px 14px; } .card .sec { padding: 3px 0 2px; } .card .nm { font-size: 23px; padding: 2px 0 0; } .card .row { padding: 0; line-height: 1.32; } .card .path { padding: 4px 0 2px; } .card .src { padding-top: 6px; } }
@media (max-width: 1180px) { .top h1 { font-size: 21px; } .tabs .cc-segmented-btn { padding: 10px 14px; } #status { display: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Mineral Properties Lab</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-mode="explore">Explore</button>
      <button class="cc-segmented-btn" data-mode="unknown">Unknowns</button>
    </div>
    <div class="picker" id="picker"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <button class="cc-btn" id="bSound">🔊 Sound</button>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv" tabindex="0"></canvas>
        <div class="lens" id="lens"></div>
        <div class="tags3d" id="tags3d"></div>
        <div class="fl" id="chipsTL">
          <div class="cc-segmented" id="views">
            <button class="cc-segmented-btn is-active" data-view="sample">Hand sample</button>
            <button class="cc-segmented-btn" data-view="lens">Hand lens 10×</button>
            <button class="cc-segmented-btn" data-view="frag" disabled>Fragments</button>
          </div>
        </div>
        <div class="fl" id="chipsTR"></div>
        <div class="fl" id="angleChip"><span class="l">Angle</span><span class="v" id="angleV">—</span></div>
        <div class="fl" id="wipe"><button class="cc-btn" id="bWipe">Wipe clean</button></div>
      </div>
      <div class="tray" id="tray"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
