<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidal Locking</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; white-space: nowrap; }
.top .spacer { flex: 1; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.play { min-width: 112px; padding: 10px 16px; font-size: 15px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent);
  color: var(--color-bg); white-space: nowrap; }
.play:hover { filter: brightness(1.1); background: var(--tool-accent); color: var(--color-bg); }
.preset { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 66px; padding: 5px 11px;
  color: var(--color-text-primary); line-height: 1.1; }
.preset b { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.preset i { font-style: normal; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--color-text-secondary); white-space: nowrap; }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.preset.is-active i { color: var(--color-bg); opacity: .85; }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 92px; text-align: right; white-space: nowrap; }
.tgl { padding: 8px 14px; font-size: 14px; white-space: nowrap; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.chips { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 20px); }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .tgl { padding: 5px 11px; font-size: 13px; background: var(--color-surface); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .v.hi { color: var(--tool-accent); }
.card .r.dim .v { font-size: 20px; color: var(--color-text-secondary); }
.card .r.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card .r.pair .l { font-size: 12px; letter-spacing: .03em; }
.card .r.pair .v { font-size: 19px; color: var(--color-text-secondary); }
.card .r.pair .v .u { font-size: 13px; margin-left: 4px; }
.card .note { margin-top: 12px; padding: 10px 12px; background: var(--color-surface-2); border-left: 3px solid var(--tool-accent);
  border-radius: 4px; font-family: var(--font-body); font-size: 14.5px; line-height: 1.45; color: var(--color-text-primary); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 780px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .r.dim .v { font-size: 18px; }
  .card .note { font-size: 14px; line-height: 1.4; padding: 8px 10px; margin-top: 8px; }
  .card .src { padding-top: 6px; }
}
@media (max-width: 1340px) { .x-link .nm { display: none; } .tabs .cc-segmented-btn { padding: 11px 16px; } }
@media (max-width: 1200px) { .slider .sv { display: none; } .top { gap: 10px; } .top h1 { font-size: 21px; } }
@media (max-width: 1120px) { .preset { min-width: 0; padding: 5px 8px; } .play { min-width: 0; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Tidal Locking</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="face">Same Face</button>
      <button class="cc-segmented-btn" data-tab="spin">Spin-Down</button>
      <button class="cc-segmented-btn" data-tab="brake">The Brake</button>
      <button class="cc-segmented-btn" data-tab="earth">Earth &amp; Moon</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <a class="cc-btn x-link" id="trLink" target="_top" href="#"><span class="nm">Tidal Rhythm </span>&rarr;</a>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chips"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

async function exportMP4() {

}
