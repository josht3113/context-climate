<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidereal vs Synodic Month — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #07071a; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 62px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.play { min-width: 104px; padding: 12px 14px; font-size: 15px; font-weight: 700; white-space: nowrap;
  background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.play:hover { color: var(--color-bg); filter: brightness(1.1); }
.preset { padding: 5px 12px; line-height: 1.2; text-align: left; white-space: nowrap; color: var(--color-text-primary); }
.preset b { display: block; font-family: var(--font-display); font-size: 17px; }
.preset span { display: block; font-size: 13px; font-weight: 500; color: var(--color-text-secondary); min-width: 108px; }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.preset.is-active span { color: var(--color-bg); }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 86px; text-align: right; white-space: nowrap; }
.tgl { padding: 12px 14px; font-size: 15px; font-weight: 700; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.tgl::before { content: ''; display: inline-block; width: 12px; height: 12px; border: 1.5px solid var(--tool-accent);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active { background: var(--tool-accent); color: var(--color-bg); }
.tgl.is-active::before { background: var(--color-bg); border-color: var(--color-bg); }

.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .ph { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--color-border); }
.card .ph canvas { width: 66px; height: 66px; flex: none; }
.card .pn { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.1; color: var(--color-text-primary); }
.card .pl { font-size: 15px; color: var(--color-text-secondary); margin-top: 3px; }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.15; color: var(--color-text-primary); }
.card .r.gold .v { color: #ffc850; }
.card .r.teal .v { color: #5cc4cf; }
.card .src { font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 640px) {
  .card .ph { padding: 6px 0; }
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 24px; }
}
@media (max-width: 1240px) { .preset span { min-width: 0; } .slider .sv { display: none; } }
@media (max-width: 1120px) { .preset span { display: none; } .preset b { font-size: 16px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Sidereal vs Synodic Month</h1>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage"><canvas id="cv" tabindex="0" aria-label="Overhead view of the Sun, Earth and Moon"></canvas></div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 5));
      if (err) throw err;
      if (i % 5 === 0) { status(`encoding ${i + 1}/${sw.fr.length}`); await tick(); }
    }
    await enc.flush(); muxer.finalize();
    const buf = muxer.target.buffer;
    saveBlob(new Blob([buf], { type: 'video/mp4' }), slug() + '-animation.mp4');
    status('MP4 ' + (buf.byteLength / 1e6).toFixed(1) + ' MB');
  } catch (e) { console.error(e); status('MP4 failed'); }
  finally { sw.restore(); capturing = false; setBusy(false); refresh(); }
}
