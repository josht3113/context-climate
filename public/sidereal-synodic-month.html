<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why 29.5 Days? — Sidereal vs Synodic Month — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>

}

#playBtn {

}

/* Below ~1000px the wide left inset costs more than it's worth — it pushes the

</style>
</head>
<body>

<div class="top-bar">
  <h1>SIDEREAL vs SYNODIC MONTH</h1>
  <p>Why does a full phase cycle take <strong>29.5 days</strong> when the Moon orbits Earth in only <strong>27.3 days?</strong></p>
</div>

<canvas id="mainCanvas"></canvas>

<div class="controls">
  <button id="resetBtn" class="cc-btn tool-btn">↺ Reset</button>
  <button id="playBtn" class="cc-btn tool-btn">▶ Play</button>
  <div class="sep"></div>
  <div class="speed-wrap">
    <span>Speed</span>
    <input type="range" id="speedSlider" min="1" max="30" value="8">
    <span id="speedVal">8×</span>
  </div>
  <div class="sep"></div>
  <span class="jump-label">JUMP TO</span>
  <button id="jump273" class="cc-btn tool-btn">Day 27.3 →</button>
  <button id="jump295" class="cc-btn tool-btn">Day 29.5 →</button>
  <div class="sep"></div>
  <button id="pngBtn" class="cc-btn tool-btn">⬇ PNG</button>
</div>

<script>
'use strict';

const canvas = document.getElementById('mainCanvas');
let ctx      = canvas.getContext('2d');

/* ── RESIZE ─────────────────────────────────────────────────────────────── */
let CW = 0, CH = 0;                    // logical (CSS px) canvas size
function resize() {
  const topBar   = document.querySelector('.top-bar');
  const controls = document.querySelector('.controls');
  const dpr = window.devicePixelRatio || 1;
  CW = window.innerWidth;
  CH = Math.max(320, window.innerHeight - topBar.offsetHeight - controls.offsetHeight);
  canvas.width  = Math.round(CW * dpr);
  canvas.height = Math.round(CH * dpr);
  canvas.style.width  = CW + 'px';
  canvas.style.height = CH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);   // draw in CSS px, render at device res
}
resize();
window.addEventListener('resize', resize);

/* ── ORBITAL CONSTANTS ───────────────────────────────────────────────────── */
const W_E   = 360 / 365.25;   // Earth °/day
// True sidereal period. Rounding it to 27.3 made the two textbook constants
// inconsistent — the Moon overshot New Moon by 0.3° at day 29.5307. With the
// exact value the phase cycle closes exactly at T_SYN, so the Moon lands on
// the New Moon marker rather than near it. Both still display as 27.3 / 29.5.
const T_SID = 27.3217;
const W_M   = 360 / T_SID;    // Moon sidereal °/day — W_M * T_SID = exactly 360°
const W_S   = W_M - W_E;      // Synodic °/day ≈ 12.19
const T_SYN = 29.5307;

const EARTH_ANG0 = 210;               // deg from +x, CW on screen
const MOON_ANG0  = EARTH_ANG0 + 180;  // new moon: Moon toward Sun

/* ── STARS ───────────────────────────────────────────────────────────────── */
const STARS = (() => {
  let s = 7777;
  const rng = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967295; };
  return Array.from({length: 230}, () => ({
    fx: rng(), fy: rng(),
    r: rng() * 1.2 + 0.2,
    a: rng() * 0.55 + 0.2
  }));
})();

/* ── STATE ───────────────────────────────────────────────────────────────── */
let t = 0, playing = false, speed = 8, lastTs = null;
let pauseSid = false, pauseSyn = false;
let didPauseSid = false, didPauseSyn = false;
let barRect = null, scrubbing = false;   // timeline hit-box (set by drawInfoBar)

/* ── MATH ────────────────────────────────────────────────────────────────── */
const RAD  = Math.PI / 180;
const d2r  = d => d * RAD;
const mod360 = a => ((a % 360) + 360) % 360;

/* ── LAYOUT ──────────────────────────────────────────────────────────────── */
// Bottom strip reserved for info bar; orbit centered in remaining space.
const INFO_H = 60;

// Core geometry math, independent of which canvas it targets — shared by the
// live on-screen layout() and the offscreen PNG-export layout.
function computeOrbitGeometry(W, OrbH) {
  // Sun sits low-right; the Earth-Moon system rides the upper-left arc of the
  // orbit. Earth travels only ~29 deg over the whole animation, so the rest of
  // the orbit circle is allowed to run off-frame. That buys a much larger Moon
  // orbit, which is the circle the 26.9 deg payoff is actually measured on.
  const sx = W * 0.66;
  const sy = OrbH * 0.72;
  const margin = 30;

  // Earth's screen offset from the Sun over the animated arc (210 deg -> 181 deg):
  // |cos| peaks near 1.0, |sin| peaks at 0.5. K = Moon-orbit radius as a
  // fraction of Re; PAD leaves room for the Moon body and its label.
  const K = 0.40, PAD = 0.12;
  const ReH = (sx - margin) / (1.00 + K + PAD);
  const ReV = (sy - margin) / (0.50 + K + PAD);
  const Re  = Math.min(ReH, ReV);

  const Rm      = Math.max(44, Math.min(Re * K, 260));   // Moon orbit radius
  const rEarth  = Math.max(15, Rm * 0.20);               // Earth body radius
  const rMoon   = Math.max(9,  Rm * 0.125);              // Moon body radius
  const rSun    = Math.max(20, Re * 0.085);              // Sun core radius

  return { sx, sy, Re, Rm, rEarth, rMoon, rSun };
}

function layout() {
  const W = CW, H = CH;
  const OrbH = H - INFO_H;           // height of orbital viewport
  return { W, H, OrbH, ...computeOrbitGeometry(W, OrbH) };
}

/* ── POSITIONS ───────────────────────────────────────────────────────────── */
function earthPos(tDays, L) {
  const ang = EARTH_ANG0 - W_E * tDays;   // CCW on screen
  return { x: L.sx + L.Re * Math.cos(d2r(ang)),
           y: L.sy + L.Re * Math.sin(d2r(ang)), ang };
}

function moonPos(tDays, L) {
  const e   = earthPos(tDays, L);
  // Moon sidereal angle goes CCW; W_M * T_SID = 360° exactly → one full orbit
  const ang = MOON_ANG0 - W_M * tDays;   // CCW on screen
  return { x: e.x + L.Rm * Math.cos(d2r(ang)),
           y: e.y + L.Rm * Math.sin(d2r(ang)),
           ang, ex: e.x, ey: e.y };
}

// Ghost = where New Moon happens NOW: the point on the Moon's *current* orbit
// lying in the Earth->Sun direction. It rides the orbit with Earth, so the Moon
// visibly chases it and catches it at day 29.5. At t=0 the two coincide.
function ghostPos(tDays, L) {
  const e   = earthPos(tDays, L);
  const dir = Math.atan2(L.sy - e.y, L.sx - e.x);
  return { x: e.x + L.Rm * Math.cos(dir),
           y: e.y + L.Rm * Math.sin(dir), dir, ex: e.x, ey: e.y };
}

function synodic(tDays)    { return mod360(W_S * tDays); }
function illumination(syn) { return (1 - Math.cos(d2r(syn))) / 2; }

function phaseName(s) {
  if (s < 11.25 || s >= 348.75) return 'New Moon';
  if (s < 78.75)  return 'Waxing Crescent';
  if (s < 101.25) return 'First Quarter';
  if (s < 168.75) return 'Waxing Gibbous';
  if (s < 191.25) return 'Full Moon';
  if (s < 258.75) return 'Waning Gibbous';
  if (s < 281.25) return 'Last Quarter';
  return 'Waning Crescent';
}

/* ── PHASE DISK ──────────────────────────────────────────────────────────── */
function drawPhaseDisk(cx, cy, r, phaseDeg) {
  const phase = mod360(phaseDeg);
  const LIT = '#ede080', DARK = '#08081e';
  ctx.save();
  ctx.translate(cx, cy);

  // Full-moon glow
  const illum = illumination(phase);
  if (illum > 0.65) {
    const grd = ctx.createRadialGradient(0, 0, r - 2, 0, 0, r + 10);
    grd.addColorStop(0, `rgba(237,224,128,${(illum - 0.65) * 0.55})`);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, r + 10, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = DARK;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  if (phase > 177 && phase < 183) {
    ctx.fillStyle = LIT;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  } else if (phase > 3 && phase < 357) {
    ctx.fillStyle = LIT;
    ctx.beginPath();
    if (phase <= 180) {
      const ex = r * Math.cos(d2r(phase));
      ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2, false);
      if (Math.abs(ex) < 2)       ctx.lineTo(0, -r);
      else if (ex > 0)            ctx.ellipse(0, 0,  ex, r, 0, Math.PI/2, -Math.PI/2, true);
      else                        ctx.ellipse(0, 0, -ex, r, 0, Math.PI/2, -Math.PI/2, false);
    } else {
      const tx = -r * Math.cos(d2r(phase));
      ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2, true);
      if (Math.abs(tx) < 2)       ctx.lineTo(0, -r);
      else if (tx > 0)            ctx.ellipse(0, 0,  tx, r, 0, Math.PI/2, -Math.PI/2, true);
      else                        ctx.ellipse(0, 0, -tx, r, 0, Math.PI/2, -Math.PI/2, false);
    }
    ctx.closePath(); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* ── ROUND RECT ──────────────────────────────────────────────────────────── */
function rRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ── DRAW SCENE ──────────────────────────────────────────────────────────── */
function drawStars(W, H) {
  ctx.save();
  STARS.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.fx * W, s.fy * (H - INFO_H), s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOrbitCircle(L) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 8]);
  ctx.beginPath(); ctx.arc(L.sx, L.sy, L.Re, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawSun(L) {
  const r = L.rSun;
  [[r * 5.5, 0.022], [r * 3.6, 0.06], [r * 2.3, 0.15], [r * 1.4, 0.55]].forEach(([gr, a]) => {
    const g = ctx.createRadialGradient(L.sx, L.sy, 0, L.sx, L.sy, gr);
    g.addColorStop(0,   `rgba(255,245,165,${a*3})`);
    g.addColorStop(0.4, `rgba(255,178,40,${a})`);
    g.addColorStop(1,   'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(L.sx, L.sy, gr, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#fff9d8';
  ctx.beginPath(); ctx.arc(L.sx, L.sy, r, 0, Math.PI * 2); ctx.fill();
  ctx.font = `bold ${Math.round(r * 0.85)}px "Courier Prime"`;
  ctx.fillStyle = 'rgba(255,240,160,0.8)';
  ctx.textAlign = 'center';
  ctx.fillText('Sun', L.sx, L.sy - r - 8);
}

function drawMoonOrbitCircle(earth, Rm) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(earth.x, earth.y, Rm, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawEarth(e, L) {
  const r = L.rEarth;
  // Atmosphere glow
  const g = ctx.createRadialGradient(e.x, e.y, r * 0.5, e.x, e.y, r * 2.0);
  g.addColorStop(0, 'rgba(80,155,255,0.30)');
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, r * 2.0, 0, Math.PI*2); ctx.fill();
  // Ocean
  ctx.fillStyle = '#1a4a8a';
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
  // Land
  ctx.fillStyle = '#2d8a44';
  [[-0.18, -0.28, 0.42], [0.36, 0.26, 0.26]].forEach(([dx, dy, cr]) => {
    ctx.beginPath(); ctx.arc(e.x + r*dx, e.y + r*dy, r*cr, 0, Math.PI*2); ctx.fill();
  });
  // Night side — the half facing away from the Sun
  const sunDirE = Math.atan2(L.sy - e.y, L.sx - e.x);
  ctx.fillStyle = 'rgba(3,5,24,0.55)';
  ctx.beginPath();
  ctx.arc(e.x, e.y, r, sunDirE + Math.PI / 2, sunDirE + Math.PI * 1.5);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(120,185,255,0.65)';
  ctx.lineWidth = Math.max(1, r * 0.13);
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `bold ${Math.round(r * 1.1)}px "Courier Prime"`;
  ctx.fillStyle = 'rgba(160,205,255,0.9)';
  ctx.textAlign = 'center';
  ctx.fillText('Earth', e.x, e.y + r + r * 1.3);
}

function drawMoonBody(m, syn, L) {
  const r = L.rMoon;
  const illum = illumination(syn);
  if (illum > 0.08) {
    const g = ctx.createRadialGradient(m.x, m.y, r * 0.3, m.x, m.y, r * 2.2);
    g.addColorStop(0, `rgba(220,212,170,${illum * 0.4})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, r * 2.2, 0, Math.PI*2); ctx.fill();
  }
  // From overhead the terminator is a straight line: exactly half is always lit,
  // and the lit half points at the Sun. That is the phase, seen from above.
  const sunDirM = Math.atan2(L.sy - m.y, L.sx - m.x);
  ctx.fillStyle = '#4a4740';
  ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ddd6c2';
  ctx.beginPath();
  ctx.arc(m.x, m.y, r, sunDirM - Math.PI / 2, sunDirM + Math.PI / 2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(200,192,165,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.12);
  ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `bold ${Math.round(r * 1.1)}px "Courier Prime"`;
  ctx.fillStyle = 'rgba(200,190,165,0.85)';
  ctx.textAlign = 'center';
  ctx.fillText('Moon', m.x, m.y + r + r * 1.3);
}

function drawGhostMoon(g, L) {
  const alpha = Math.min(1, Math.max(0, (t - 0.3) / 1.2));
  if (alpha <= 0) return;
  const r = L.rMoon;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(62,64,86,0.8)';
  ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(178,180,198,0.8)';
  ctx.lineWidth = Math.max(1, r * 0.16);
  ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = `bold ${Math.round(r * 0.95)}px "Courier Prime"`;
  ctx.fillStyle = 'rgba(182,185,203,0.9)';
  ctx.textAlign = 'center';
  ctx.fillText('New Moon', g.x, g.y - r - r * 0.75);
  ctx.restore();
}

// Sidereal reference direction — fixed absolute angle MOON_ANG0.
// At t=27.3 the Moon's sidereal angle = MOON_ANG0 + 360° ≡ MOON_ANG0, so it
// realigns with this reference line, confirming one complete sidereal orbit.
function drawSiderealRef(earth, L) {
  const ang      = d2r(MOON_ANG0);   // fixed direction in absolute space
  const moonAng  = mod360(MOON_ANG0 - W_M * t);   // CCW: subtracts
  const diff     = mod360(moonAng - MOON_ANG0);
  const aligned  = diff < 6 || diff > 354;

  const len = L.Rm * 1.35;
  const ex  = earth.x + len * Math.cos(ang);
  const ey  = earth.y + len * Math.sin(ang);

  ctx.save();
  ctx.strokeStyle = aligned ? 'rgba(255,210,60,0.9)' : 'rgba(255,210,60,0.3)';
  ctx.lineWidth   = aligned ? 2 : 1;
  ctx.setLineDash([3, 6]);
  ctx.beginPath(); ctx.moveTo(earth.x, earth.y); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.setLineDash([]);

  // Star symbol at tip
  const fs = Math.round(Math.max(11, L.rMoon * 1.2));
  ctx.font = `${fs}px serif`;
  ctx.fillStyle = aligned ? '#ffc850' : 'rgba(255,200,60,0.45)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', ex, ey);
  ctx.textBaseline = 'alphabetic';

  if (t > 1 && !aligned) {
    ctx.font = `${Math.round(fs * 0.92)}px "Courier Prime"`;
    ctx.fillStyle = 'rgba(255,200,60,0.4)';
    ctx.fillText('ref star', ex, ey + fs * 1.1);
  }
  ctx.restore();
}

function drawAngleViz(earth, moon, ghost, L) {
  // At exactly T_SYN the phase angle wraps to 0; show the closed 360° ring.
  const syn = t >= T_SYN - 1e-6 ? 360 : synodic(t);
  const gap = 360 - syn;          // how far the Moon still has to sweep
  ctx.save();

  // Earth → Sun (dashed yellow) — passes through the ghost marker
  ctx.strokeStyle = 'rgba(255,200,55,0.32)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 8]);
  ctx.beginPath(); ctx.moveTo(earth.x, earth.y); ctx.lineTo(L.sx, L.sy); ctx.stroke();

  // Earth → Moon (dashed white)
  ctx.strokeStyle = 'rgba(200,200,240,0.38)';
  ctx.setLineDash([3, 6]);
  ctx.beginPath(); ctx.moveTo(earth.x, earth.y); ctx.lineTo(moon.x, moon.y); ctx.stroke();
  ctx.setLineDash([]);

  const gAng = Math.atan2(ghost.y - earth.y, ghost.x - earth.x);
  const mAng = Math.atan2(moon.y  - earth.y, moon.x  - earth.x);

  const lbl = (txt, a, col, sz, out) => {
    ctx.font = `bold ${sz}px "Courier Prime"`;
    ctx.fillStyle = col;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, earth.x + Math.cos(a) * (L.Rm + out),
                      earth.y + Math.sin(a) * (L.Rm + out));
    ctx.textBaseline = 'alphabetic';
  };

  // Elapsed phase — ghost → Moon along the direction of travel = synodic angle
  if (syn > 2) {
    ctx.strokeStyle = 'rgba(58,175,169,0.65)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(earth.x, earth.y, L.Rm, gAng, gAng - d2r(syn), true);
    ctx.stroke();
    lbl(syn.toFixed(0) + '°', gAng - d2r(syn / 2), '#3CA3AE',
        Math.round(L.rMoon * 0.95), L.rMoon * 1.5);
  }

  // Remaining gap — Moon → ghost. Drawn only once it is small enough to be the
  // subject of the picture rather than most of the circle.
  if (gap > 0.4 && gap < 110) {
    ctx.strokeStyle = '#ffc850';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(earth.x, earth.y, L.Rm, mAng, mAng - d2r(gap), true);
    ctx.stroke();
    ctx.lineCap = 'butt';
    lbl(gap.toFixed(1) + '°', mAng - d2r(gap / 2), '#ffc850',
        Math.round(L.rMoon * 1.1), L.rMoon * 2.6);
  }
  ctx.restore();
}

/* ── INFO BAR (bottom strip) ─────────────────────────────────────────────── */
function drawInfoBar(L) {
  const syn  = synodic(t);
  const ill  = illumination(syn);
  const name = phaseName(syn);
  const orbP = W_E * t;

  const y0 = L.OrbH;     // top of info strip
  const W  = L.W;
  const H  = INFO_H;

  // Background
  ctx.fillStyle = 'rgba(4,4,22,0.92)';
  ctx.fillRect(0, y0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();

  const cy   = y0 + H / 2;
  // Match the CSS clamp(40px, 22vw, 380px) used by the top-bar and controls
  const lpad = W <= 1000 ? 20 : Math.max(40, Math.min(W * 0.22, 380));

  // ── DAY COUNTER ─────────────────────────────────────────────────────────
  const dayFontSz = Math.round(Math.min(H * 0.52, 28));
  ctx.font = `bold ${dayFontSz}px "Courier Prime"`;
  ctx.fillStyle = '#e8e6f0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('Day ' + t.toFixed(1), lpad, cy);

  // ── PROGRESS BAR ────────────────────────────────────────────────────────
  const bx = lpad + 118, bw = Math.min(W * 0.25, 240), bh = 6;
  const by = cy - bh / 2;
  barRect = { x: bx, y: by - 12, w: bw, h: bh + 24 };   // drag target

  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  rRect(bx, by, bw, bh, 3); ctx.fill();

  const prog = Math.min(1, t / T_SYN);
  if (prog > 0) {
    ctx.fillStyle = '#3CA3AE';
    rRect(bx, by, bw * prog, bh, 3); ctx.fill();
  }

  // Tick at 27.3
  const tickX = bx + bw * (T_SID / T_SYN);
  ctx.fillStyle = '#ffc850';
  ctx.fillRect(tickX - 1, by - 4, 2, bh + 8);

  // The two ticks sit only 7.5% of the bar apart, so their labels go on
  // separate rows — 27.3 below the bar, 29.5 above it.
  ctx.font = `${Math.max(11, Math.round(bh * 1.7))}px "Courier Prime"`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,200,80,0.75)';
  ctx.fillText('27.3', tickX, by + bh + 5);

  // Tick at 29.5
  const tickX2 = bx + bw;
  ctx.fillStyle = 'rgba(58,175,169,0.7)';
  ctx.fillRect(tickX2 - 1, by - 4, 2, bh + 8);
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(58,175,169,0.7)';
  ctx.fillText('29.5', tickX2, by - 6);
  ctx.textBaseline = 'middle';

  // Drag knob
  ctx.fillStyle = '#e8e6f0';
  ctx.beginPath(); ctx.arc(bx + bw * prog, cy, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1; ctx.stroke();

  // ── PHASE DISK + NAME ───────────────────────────────────────────────────
  const diskR = Math.min(H * 0.35, 20);
  const diskX = bx + bw + 24 + diskR;
  drawPhaseDisk(diskX, cy, diskR, syn);

  // Blocks are measured and packed left-to-right; any block that would not
  // fit is dropped rather than overprinted.
  const fs1 = Math.round(diskR * 1.05);
  const fs2 = Math.round(diskR * 0.82);
  const GAP = 26;
  const rowA = cy - diskR * 0.45, rowB = cy + diskR * 0.55;
  let x = diskX + diskR + 10;

  const widthOf = (txt, f) => { ctx.font = f; return ctx.measureText(txt).width; };
  const fA = `bold ${fs1}px "Courier Prime"`, fB = `${fs2}px "Courier Prime"`;

  ctx.textAlign = 'left';

  // Phase name + illumination
  const nm = name.toUpperCase(), lit = (ill * 100).toFixed(0) + '% lit';
  const wName = Math.max(widthOf(nm, fA), widthOf(lit, fB));
  ctx.font = fA; ctx.fillStyle = '#ede080';                 ctx.fillText(nm,  x, rowA);
  ctx.font = fB; ctx.fillStyle = 'rgba(255,255,255,0.5)';   ctx.fillText(lit, x, rowB);
  x += wName + GAP;

  // Angles
  const a1 = 'Phase angle: ' + syn.toFixed(1) + '°';
  const a2 = 'Earth moved: ' + orbP.toFixed(1) + '°';
  const wAng = Math.max(widthOf(a1, fB), widthOf(a2, fB));
  if (x + wAng < W - 14) {
    ctx.font = fB;
    ctx.fillStyle = 'rgba(58,175,169,0.9)';  ctx.fillText(a1, x, rowA);
    ctx.fillStyle = 'rgba(255,200,60,0.85)'; ctx.fillText(a2, x, rowB);
    x += wAng + GAP;
  }

  // Progress through each cycle
  const done   = t >= T_SYN - 1e-6;
  const b1 = 'Moon orbit: '  + (mod360(W_M * t) / 360 * 100).toFixed(0) + '%';
  const b2 = 'Phase cycle: ' + (done ? 100 : syn / 360 * 100).toFixed(0) + '%';
  const wPrg = Math.max(widthOf(b1, fB), widthOf(b2, fB));
  if (x + wPrg < W - 14) {
    ctx.font = fB;
    ctx.fillStyle = 'rgba(255,200,80,0.75)'; ctx.fillText(b1, x, rowA);
    ctx.fillStyle = 'rgba(200,200,220,0.5)'; ctx.fillText(b2, x, rowB);
  }

  ctx.textBaseline = 'alphabetic';
}

/* ── PAUSE OVERLAY ───────────────────────────────────────────────────────── */
function drawPauseOverlay(L) {
  if (!pauseSid && !pauseSyn) return;
  const syn  = synodic(t);
  const gold = pauseSid && !pauseSyn;

  const bw = Math.min(440, L.W - 40);
  const bh = gold ? 106 : 128;
  const bx = 24;                       // lower-left: clear of the Earth-Moon system
  const by = L.OrbH - bh - 16;
  const px = bx + 20;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur  = 26;
  ctx.fillStyle   = 'rgba(8,6,28,0.97)';
  ctx.strokeStyle = gold ? '#ffc850' : '#3CA3AE';
  ctx.lineWidth   = 1.5;
  rRect(bx, by, bw, bh, 12); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';

  if (gold) {
    ctx.font = 'bold 16px "Courier Prime"';
    ctx.fillStyle = '#ffc850';
    ctx.fillText('DAY 27.3 — SIDEREAL ORBIT COMPLETE', px, by + 30);

    ctx.font = '14px "Public Sans"';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText('Moon back on the ★ line. Earth moved '
                 + (W_E * T_SID).toFixed(1) + '°.', px, by + 56);

    ctx.font = 'bold 14px "Public Sans"';
    ctx.fillStyle = '#ffc850';
    ctx.fillText((360 - syn).toFixed(1) + '° still to sweep to reach New Moon.', px, by + 78);

    ctx.font = '11px "Courier Prime"';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('SPACE OR PLAY TO CONTINUE  →', px, by + 96);
  } else {
    ctx.font = 'bold 16px "Courier Prime"';
    ctx.fillStyle = '#3CA3AE';
    ctx.fillText('DAY 29.5 — SYNODIC MONTH COMPLETE', px, by + 30);

    ctx.font = '14px "Public Sans"';
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText('Moon has caught the New Moon marker.', px, by + 56);

    ctx.font = '14px "Public Sans"';
    ctx.fillStyle = 'rgba(200,230,230,0.9)';
    ctx.fillText('Sidereal 27.3 d  →  Synodic 29.5 d', px, by + 80);

    ctx.font = 'bold 14px "Public Sans"';
    ctx.fillStyle = 'rgba(255,200,80,0.9)';
    ctx.fillText('+2.2 d  =  Earth\'s ' + (W_E * T_SID).toFixed(1) + '° of orbital drift.', px, by + 102);

    ctx.font = '11px "Courier Prime"';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('SPACE OR ↺ RESET TO RESTART', px, by + 120);
  }
  ctx.restore();
}

/* ── RENDER LOOP ─────────────────────────────────────────────────────────── */
function frame(ts) {
  if (playing && lastTs !== null) {
    const dt = (ts - lastTs) / 1000;
    t = Math.min(t + dt * speed, T_SYN);

    if (t >= T_SID && !didPauseSid) {
      t = T_SID; playing = false; pauseSid = true; didPauseSid = true; updatePlayBtn();
    }
    if (t >= T_SYN && !didPauseSyn) {
      t = T_SYN; playing = false; pauseSyn = true; didPauseSyn = true; updatePlayBtn();
    }
  }
  lastTs = ts;

  const L     = layout();
  const earth = earthPos(t, L);
  const moon  = moonPos(t, L);
  const ghost = ghostPos(t, L);
  const syn   = synodic(t);

  ctx.fillStyle = '#07071a';
  ctx.fillRect(0, 0, L.W, L.H);

  drawStars(L.W, L.H);
  drawOrbitCircle(L);
  drawSun(L);
  drawMoonOrbitCircle(earth, L.Rm);
  drawAngleViz(earth, moon, ghost, L);
  drawSiderealRef(earth, L);
  drawGhostMoon(ghost, L);
  drawEarth(earth, L);
  drawMoonBody(moon, syn, L);
  drawInfoBar(L);
  drawPauseOverlay(L);

  requestAnimationFrame(frame);
}

/* ── PNG EXPORT ──────────────────────────────────────────────────────────── */
function wrapText(c, text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '', ly = y;
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) {
      c.fillText(line, x, ly);
      line = w; ly += lineH;
    } else {
      line = test;
    }
  });
  if (line) c.fillText(line, x, ly);
  return ly + lineH;
}

function exportPNG() {
  const SCALE = 2;
  const EW = 1200, HEADER_H = 130, STAT_H = 76, FOOTER_H = 46;
  const DIAG_H = 660;
  const EH = HEADER_H + DIAG_H + STAT_H + FOOTER_H;

  const off = document.createElement('canvas');
  off.width = EW * SCALE; off.height = EH * SCALE;
  const octx = off.getContext('2d');
  octx.scale(SCALE, SCALE);

  // Background
  octx.fillStyle = '#07071a';
  octx.fillRect(0, 0, EW, EH);

  // Header
  octx.textAlign = 'left'; octx.textBaseline = 'alphabetic';
  octx.font = '600 14px "Courier Prime"';
  octx.fillStyle = '#3CA3AE';
  octx.fillText('CONTEXTCLIMATE  ·  EARTH & SPACE  ·  ESS1', 40, 42);

  octx.font = '700 32px "Zilla Slab"';
  octx.fillStyle = '#E8E4D9';
  octx.fillText('Sidereal vs Synodic Month', 40, 80);

  octx.font = '15px "Public Sans"';
  octx.fillStyle = 'rgba(232,228,217,0.62)';
  wrapText(octx, 'Why does a full phase cycle take 29.5 days when the Moon orbits Earth in only 27.3 days?', 40, 106, EW - 80, 20);

  // Diagram — reuse the live drawing pipeline, targeted at the offscreen ctx
  const liveCtx = ctx;
  ctx = octx;
  ctx.save();
  ctx.translate(0, HEADER_H);
  const L = { W: EW, H: DIAG_H + INFO_H, OrbH: DIAG_H, ...computeOrbitGeometry(EW, DIAG_H) };
  const earth = earthPos(t, L);
  const moon  = moonPos(t, L);
  const ghost = ghostPos(t, L);
  drawStars(EW, DIAG_H + INFO_H);
  drawOrbitCircle(L);
  drawSun(L);
  drawMoonOrbitCircle(earth, L.Rm);
  drawAngleViz(earth, moon, ghost, L);
  drawSiderealRef(earth, L);
  drawGhostMoon(ghost, L);
  drawEarth(earth, L);
  drawMoonBody(moon, synodic(t), L);
  ctx.restore();
  ctx = liveCtx;

  // Stat callout band
  const syn  = synodic(t);
  const ill  = illumination(syn);
  const name = phaseName(syn);
  const statY = HEADER_H + DIAG_H;
  octx.fillStyle = 'rgba(255,255,255,0.04)';
  octx.fillRect(0, statY, EW, STAT_H);
  octx.strokeStyle = 'rgba(255,255,255,0.08)'; octx.lineWidth = 1;
  octx.beginPath(); octx.moveTo(0, statY); octx.lineTo(EW, statY); octx.stroke();

  const scY = statY + STAT_H / 2;
  octx.textBaseline = 'middle';
  const stats = [
    ['DAY',            t.toFixed(1)],
    ['MOON PHASE',     name],
    ['ILLUMINATION',   (ill * 100).toFixed(0) + '%'],
    ['SIDEREAL',       T_SID.toFixed(1) + ' d'],
    ['SYNODIC',        T_SYN.toFixed(1) + ' d'],
  ];
  const colW = EW / stats.length;
  stats.forEach((s, i) => {
    const cx = colW * i + colW / 2;
    octx.textAlign = 'center';
    octx.font = '600 12px "Courier Prime"';
    octx.fillStyle = 'rgba(232,228,217,0.5)';
    octx.fillText(s[0], cx, scY - 12);
    octx.font = '700 22px "Zilla Slab"';
    octx.fillStyle = '#E8E4D9';
    octx.fillText(s[1], cx, scY + 14);
  });
  octx.textBaseline = 'alphabetic';

  // Footer
  octx.font = '12px "Courier Prime"';
  octx.fillStyle = 'rgba(232,228,217,0.4)';
  octx.textAlign = 'center';
  octx.fillText('contextclimate.io  ·  NYS Earth & Space Sciences (ESS1)  ·  Not to scale', EW / 2, EH - 18);

  off.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sidereal-synodic-month_day${t.toFixed(1)}.png`;
    a.click();
    URL.revokeObjectURL(url);
  });
}

/* ── CONTROLS ────────────────────────────────────────────────────────────── */
function updatePlayBtn() {
  const btn = document.getElementById('playBtn');
  btn.style.color = ''; btn.style.borderColor = ''; btn.style.background = '';
  if (pauseSyn) {
    btn.textContent = '↺ Restart';
    btn.classList.add('is-active');
  } else if (playing) {
    btn.textContent = '⏸ Pause';
    btn.classList.add('is-active');
  } else if (didPauseSid && !didPauseSyn) {
    btn.textContent = '▶ Continue';
    btn.classList.remove('is-active');
    btn.style.color = btn.style.borderColor = '#ffc850';
    btn.style.background = 'rgba(255,200,60,0.1)';
  } else {
    btn.textContent = '▶ Play';
    btn.classList.remove('is-active');
  }
}

function resetAll() {
  t = 0; playing = false;
  pauseSid = pauseSyn = false;
  didPauseSid = didPauseSyn = false;
  lastTs = null;
  updatePlayBtn();
}

document.getElementById('resetBtn').addEventListener('click', resetAll);

document.getElementById('playBtn').addEventListener('click', () => {
  if (pauseSyn) { resetAll(); return; }
  pauseSid = false;
  playing  = !playing;
  if (playing) lastTs = null;
  updatePlayBtn();
});

document.getElementById('speedSlider').addEventListener('input', e => {
  speed = +e.target.value;
  document.getElementById('speedVal').textContent = speed + '×';
});

document.getElementById('jump273').addEventListener('click', () => {
  t = T_SID; playing = false;
  pauseSid = true; pauseSyn = false;
  didPauseSid = true; didPauseSyn = false;
  updatePlayBtn();
});

document.getElementById('jump295').addEventListener('click', () => {
  t = T_SYN; playing = false;
  pauseSid = false; pauseSyn = true;
  didPauseSid = didPauseSyn = true;
  updatePlayBtn();
});

function setTime(nt) {
  t = Math.min(T_SYN, Math.max(0, nt));
  playing = false;
  pauseSid = pauseSyn = false;
  didPauseSid = t >= T_SID - 1e-6;    // don't re-trigger a stop already passed
  didPauseSyn = t >= T_SYN - 1e-6;
  lastTs = null;
  updatePlayBtn();
}

function overBar(px, py) {
  return barRect && px >= barRect.x - 8 && px <= barRect.x + barRect.w + 8
                 && py >= barRect.y     && py <= barRect.y + barRect.h;
}
function localPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function scrubTo(px) {
  const f = Math.min(1, Math.max(0, (px - barRect.x) / barRect.w));
  setTime(f * T_SYN);
}

canvas.addEventListener('pointerdown', e => {
  const p = localPos(e);
  if (!overBar(p.x, p.y)) return;
  scrubbing = true;
  canvas.setPointerCapture(e.pointerId);
  scrubTo(p.x);
});
canvas.addEventListener('pointermove', e => {
  const p = localPos(e);
  if (scrubbing) scrubTo(p.x);
  else canvas.style.cursor = overBar(p.x, p.y) ? 'ew-resize' : 'default';
});
canvas.addEventListener('pointerup',     () => { scrubbing = false; });
canvas.addEventListener('pointercancel', () => { scrubbing = false; });

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('playBtn').click(); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); setTime(t + (e.shiftKey ? 1 : 0.1)); }
  else if (e.code === 'ArrowLeft')  { e.preventDefault(); setTime(t - (e.shiftKey ? 1 : 0.1)); }
});

document.getElementById('pngBtn').addEventListener('click', exportPNG);

requestAnimationFrame(frame);
</script>
