<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why 29.5 Days? — Sidereal vs Synodic Month</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #07071a; overflow: hidden; }
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  color: #e8e6f0;
}
.top-bar {
  width: 100%;
  padding: 8px 20px 8px clamp(40px, 22vw, 380px);
  background: rgba(0,0,10,0.7);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
.top-bar h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 24px;
  font-weight: 600;
  color: #a0d8d6;
  letter-spacing: 1px;
  white-space: nowrap;
}
.top-bar p { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.4; }
.top-bar p strong { color: rgba(255,255,255,0.7); }
#mainCanvas { flex: 1; width: 100%; display: block; }
.controls {
  width: 100%;
  padding: 8px 20px 8px clamp(40px, 22vw, 380px);
  background: rgba(0,0,10,0.75);
  border-top: 1px solid rgba(255,255,255,0.07);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  flex-wrap: wrap;
}
button {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.05);
  color: #e8e6f0;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
button:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.35); }
#playBtn { background: rgba(58,175,169,0.15); border-color: #3AAFA9; color: #3AAFA9; }
#playBtn:hover { background: rgba(58,175,169,0.28); }
#jump273 { background: rgba(255,190,60,0.12); border-color: rgba(255,190,60,0.5); color: #ffbe3c; }
#jump273:hover { background: rgba(255,190,60,0.24); }
.sep { width: 1px; height: 24px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
.speed-wrap { display: flex; align-items: center; gap: 8px; }
.speed-wrap span {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  white-space: nowrap;
}
input[type=range] { width: 90px; height: 3px; accent-color: #3AAFA9; cursor: pointer; }
#speedVal {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  min-width: 28px;
}
.jump-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<div class="top-bar">
  <h1>SIDEREAL vs SYNODIC MONTH</h1>
  <p>Why does a full phase cycle take <strong>29.5 days</strong> when the Moon orbits Earth in only <strong>27.3 days?</strong></p>
</div>

<canvas id="mainCanvas"></canvas>

<div class="controls">
  <button id="resetBtn">↺ Reset</button>
  <button id="playBtn">▶ Play</button>
  <div class="sep"></div>
  <div class="speed-wrap">
    <span>Speed</span>
    <input type="range" id="speedSlider" min="1" max="30" value="8">
    <span id="speedVal">8×</span>
  </div>
  <div class="sep"></div>
  <span class="jump-label">JUMP TO</span>
  <button id="jump273">Day 27.3 →</button>
  <button id="jump295">Day 29.5 →</button>
</div>

<script>
'use strict';

const canvas = document.getElementById('mainCanvas');
const ctx    = canvas.getContext('2d');

/* ── RESIZE ─────────────────────────────────────────────────────────────── */
function resize() {
  const topBar   = document.querySelector('.top-bar');
  const controls = document.querySelector('.controls');
  canvas.width  = window.innerWidth;
  canvas.height = Math.max(320, window.innerHeight - topBar.offsetHeight - controls.offsetHeight);
}
resize();
window.addEventListener('resize', resize);

/* ── ORBITAL CONSTANTS ───────────────────────────────────────────────────── */
const W_E   = 360 / 365.25;   // Earth °/day
const W_M   = 360 / 27.3;     // Moon sidereal °/day — W_M * 27.3 = exactly 360°
const W_S   = W_M - W_E;      // Synodic °/day ≈ 12.19
const T_SID = 27.3;
const T_SYN = 29.5307;

const EARTH_ANG0 = 210;               // deg from +x, CW on screen
const MOON_ANG0  = EARTH_ANG0 + 180;  // new moon: Moon toward Sun

/* ── STARS ───────────────────────────────────────────────────────────────── */
const STARS = (() => {
  let s = 7777;
  const rng = () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967295; };
  return Array.from({length: 230}, () => ({
    fx: rng(), fy: rng(),
    r: rng() * 1.2 + 0.2,
    a: rng() * 0.55 + 0.2
  }));
})();

/* ── STATE ───────────────────────────────────────────────────────────────── */
let t = 0, playing = false, speed = 8, lastTs = null;
let pauseSid = false, pauseSyn = false;
let didPauseSid = false, didPauseSyn = false;

/* ── MATH ────────────────────────────────────────────────────────────────── */
const RAD  = Math.PI / 180;
const d2r  = d => d * RAD;
const mod360 = a => ((a % 360) + 360) % 360;

/* ── LAYOUT ──────────────────────────────────────────────────────────────── */
// Bottom strip reserved for info bar; orbit centered in remaining space.
const INFO_H = 68;

function layout() {
  const W = canvas.width, H = canvas.height;
  const OrbH = H - INFO_H;           // height of orbital viewport

  const sx = W * 0.58;               // Sun x — left-of-centre so orbit has room
  const sy = OrbH * 0.50;            // Sun y — vertically centred in orbital area

  const margin = 28;
  const Re = Math.min(sx - margin, W - sx - margin,
                      sy - margin, OrbH - sy - margin) * 0.90;

  const Rm      = Math.max(36, Math.min(Re * 0.32, 80));   // Moon orbit radius
  const rEarth  = Math.max(16, Re * 0.078);                // Earth body radius
  const rMoon   = Math.max(10, Re * 0.050);                // Moon body radius
  const rSun    = Math.max(20, Re * 0.090);                // Sun core radius

  return { W, H, OrbH, sx, sy, Re, Rm, rEarth, rMoon, rSun };
}

/* ── POSITIONS ───────────────────────────────────────────────────────────── */
function earthPos(tDays, L) {
  const ang = EARTH_ANG0 - W_E * tDays;   // CCW on screen
  return { x: L.sx + L.Re * Math.cos(d2r(ang)),
           y: L.sy + L.Re * Math.sin(d2r(ang)), ang };
}

function moonPos(tDays, L) {
  const e   = earthPos(tDays, L);
  // Moon sidereal angle goes CCW; W_M * T_SID = 360° exactly → one full orbit
  const ang = MOON_ANG0 - W_M * tDays;   // CCW on screen
  return { x: e.x + L.Rm * Math.cos(d2r(ang)),
           y: e.y + L.Rm * Math.sin(d2r(ang)),
           ang, ex: e.x, ey: e.y };
}

// Ghost = Moon's absolute position at t=0 (New Moon, fixed in space)
function ghostPos(L) {
  return {
    x: L.sx + L.Re * Math.cos(d2r(EARTH_ANG0)) + L.Rm * Math.cos(d2r(MOON_ANG0)),
    y: L.sy + L.Re * Math.sin(d2r(EARTH_ANG0)) + L.Rm * Math.sin(d2r(MOON_ANG0))
  };
}

function synodic(tDays)    { return mod360(W_S * tDays); }
function illumination(syn) { return (1 - Math.cos(d2r(syn))) / 2; }

function phaseName(s) {
  if (s < 11.25 || s >= 348.75) return 'New Moon';
  if (s < 78.75)  return 'Waxing Crescent';
  if (s < 101.25) return 'First Quarter';
  if (s < 168.75) return 'Waxing Gibbous';
  if (s < 191.25) return 'Full Moon';
  if (s < 258.75) return 'Waning Gibbous';
  if (s < 281.25) return 'Last Quarter';
  return 'Waning Crescent';
}

/* ── PHASE DISK ──────────────────────────────────────────────────────────── */
function drawPhaseDisk(cx, cy, r, phaseDeg) {
  const phase = mod360(phaseDeg);
  const LIT = '#ede080', DARK = '#08081e';
  ctx.save();
  ctx.translate(cx, cy);

  // Full-moon glow
  const illum = illumination(phase);
  if (illum > 0.65) {
    const grd = ctx.createRadialGradient(0, 0, r - 2, 0, 0, r + 10);
    grd.addColorStop(0, `rgba(237,224,128,${(illum - 0.65) * 0.55})`);
    grd.addColorStop(1, 'transparent');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(0, 0, r + 10, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = DARK;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  if (phase > 177 && phase < 183) {
    ctx.fillStyle = LIT;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  } else if (phase > 3 && phase < 357) {
    ctx.fillStyle = LIT;
    ctx.beginPath();
    if (phase <= 180) {
      const ex = r * Math.cos(d2r(phase));
      ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2, false);
      if (Math.abs(ex) < 2)       ctx.lineTo(0, -r);
      else if (ex > 0)            ctx.ellipse(0, 0,  ex, r, 0, Math.PI/2, -Math.PI/2, true);
      else                        ctx.ellipse(0, 0, -ex, r, 0, Math.PI/2, -Math.PI/2, false);
    } else {
      const tx = -r * Math.cos(d2r(phase));
      ctx.arc(0, 0, r, -Math.PI/2, Math.PI/2, true);
      if (Math.abs(tx) < 2)       ctx.lineTo(0, -r);
      else if (tx > 0)            ctx.ellipse(0, 0,  tx, r, 0, Math.PI/2, -Math.PI/2, true);
      else                        ctx.ellipse(0, 0, -tx, r, 0, Math.PI/2, -Math.PI/2, false);
    }
    ctx.closePath(); ctx.fill();
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

/* ── ROUND RECT ──────────────────────────────────────────────────────────── */
function rRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ── DRAW SCENE ──────────────────────────────────────────────────────────── */
function drawStars(W, H) {
  ctx.save();
  STARS.forEach(s => {
    ctx.globalAlpha = s.a;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(s.fx * W, s.fy * (H - INFO_H), s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOrbitCircle(L) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.13)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 8]);
  ctx.beginPath(); ctx.arc(L.sx, L.sy, L.Re, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawSun(L) {
  const r = L.rSun;
  [[r * 5.5, 0.022], [r * 3.6, 0.06], [r * 2.3, 0.15], [r * 1.4, 0.55]].forEach(([gr, a]) => {
    const g = ctx.createRadialGradient(L.sx, L.sy, 0, L.sx, L.sy, gr);
    g.addColorStop(0,   `rgba(255,245,165,${a*3})`);
    g.addColorStop(0.4, `rgba(255,178,40,${a})`);
    g.addColorStop(1,   'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(L.sx, L.sy, gr, 0, Math.PI*2); ctx.fill();
  });
  ctx.fillStyle = '#fff9d8';
  ctx.beginPath(); ctx.arc(L.sx, L.sy, r, 0, Math.PI * 2); ctx.fill();
  ctx.font = `bold ${Math.round(r * 0.85)}px "Barlow Condensed"`;
  ctx.fillStyle = 'rgba(255,240,160,0.8)';
  ctx.textAlign = 'center';
  ctx.fillText('Sun', L.sx, L.sy - r - 8);
}

function drawMoonOrbitCircle(earth, Rm) {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(earth.x, earth.y, Rm, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawEarth(e, L) {
  const r = L.rEarth;
  // Atmosphere glow
  const g = ctx.createRadialGradient(e.x, e.y, r * 0.5, e.x, e.y, r * 2.0);
  g.addColorStop(0, 'rgba(80,155,255,0.30)');
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, r * 2.0, 0, Math.PI*2); ctx.fill();
  // Ocean
  ctx.fillStyle = '#1a4a8a';
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
  // Land
  ctx.fillStyle = '#2d8a44';
  [[-0.18, -0.28, 0.42], [0.36, 0.26, 0.26]].forEach(([dx, dy, cr]) => {
    ctx.beginPath(); ctx.arc(e.x + r*dx, e.y + r*dy, r*cr, 0, Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle = 'rgba(120,185,255,0.65)';
  ctx.lineWidth = Math.max(1, r * 0.13);
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `bold ${Math.round(r * 1.1)}px "Barlow Condensed"`;
  ctx.fillStyle = 'rgba(160,205,255,0.9)';
  ctx.textAlign = 'center';
  ctx.fillText('Earth', e.x, e.y + r + r * 1.3);
}

function drawMoonBody(m, syn, L) {
  const r = L.rMoon;
  const illum = illumination(syn);
  if (illum > 0.08) {
    const g = ctx.createRadialGradient(m.x, m.y, r * 0.3, m.x, m.y, r * 2.2);
    g.addColorStop(0, `rgba(220,212,170,${illum * 0.4})`);
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, r * 2.2, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = '#b4aca0';
  ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(200,192,165,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.12);
  ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `bold ${Math.round(r * 1.1)}px "Barlow Condensed"`;
  ctx.fillStyle = 'rgba(200,190,165,0.85)';
  ctx.textAlign = 'center';
  ctx.fillText('Moon', m.x, m.y + r + r * 1.3);
}

function drawGhostMoon(L) {
  const alpha = Math.min(1, Math.max(0, (t - 0.3) / 1.2));
  if (alpha <= 0) return;
  const g = ghostPos(L);
  const r = L.rMoon;
  ctx.save();
  ctx.globalAlpha = alpha * 0.6;
  const grd = ctx.createRadialGradient(g.x, g.y, r * 0.3, g.x, g.y, r * 2.2);
  grd.addColorStop(0, 'rgba(255,130,35,0.55)'); grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(g.x, g.y, r * 2.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#d06818';
  ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ff9944'; ctx.lineWidth = Math.max(1, r * 0.18);
  ctx.setLineDash([2, 4]);
  ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = alpha;
  ctx.font = `bold ${Math.round(r * 1.0)}px "Barlow Condensed"`;
  ctx.fillStyle = 'rgba(255,170,80,0.95)';
  ctx.textAlign = 'center';
  ctx.fillText('Start (New Moon)', g.x, g.y + r + r * 1.3);
  ctx.restore();
}

// Sidereal reference direction — fixed absolute angle MOON_ANG0.
// At t=27.3 the Moon's sidereal angle = MOON_ANG0 + 360° ≡ MOON_ANG0, so it
// realigns with this reference line, confirming one complete sidereal orbit.
function drawSiderealRef(earth, L) {
  const ang      = d2r(MOON_ANG0);   // fixed direction in absolute space
  const moonAng  = mod360(MOON_ANG0 - W_M * t);   // CCW: subtracts
  const diff     = mod360(moonAng - MOON_ANG0);
  const aligned  = diff < 6 || diff > 354;

  const len = L.Rm * 1.35;
  const ex  = earth.x + len * Math.cos(ang);
  const ey  = earth.y + len * Math.sin(ang);

  ctx.save();
  ctx.strokeStyle = aligned ? 'rgba(255,210,60,0.9)' : 'rgba(255,210,60,0.3)';
  ctx.lineWidth   = aligned ? 2 : 1;
  ctx.setLineDash([3, 6]);
  ctx.beginPath(); ctx.moveTo(earth.x, earth.y); ctx.lineTo(ex, ey); ctx.stroke();
  ctx.setLineDash([]);

  // Star symbol at tip
  const fs = Math.round(Math.max(11, L.rMoon * 1.2));
  ctx.font = `${fs}px serif`;
  ctx.fillStyle = aligned ? '#ffc850' : 'rgba(255,200,60,0.45)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', ex, ey);
  ctx.textBaseline = 'alphabetic';

  if (t > 1 && !aligned) {
    ctx.font = `${Math.round(fs * 0.82)}px "Barlow Condensed"`;
    ctx.fillStyle = 'rgba(255,200,60,0.4)';
    ctx.fillText('ref star', ex, ey + fs * 1.1);
  }
  ctx.restore();
}

function drawAngleViz(earth, moon, L) {
  const syn = synodic(t);
  ctx.save();

  // Earth → Sun (dashed yellow)
  ctx.strokeStyle = 'rgba(255,200,55,0.32)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 8]);
  ctx.beginPath(); ctx.moveTo(earth.x, earth.y); ctx.lineTo(L.sx, L.sy); ctx.stroke();

  // Earth → Moon (dashed white)
  ctx.strokeStyle = 'rgba(200,200,240,0.38)';
  ctx.setLineDash([3, 6]);
  ctx.beginPath(); ctx.moveTo(earth.x, earth.y); ctx.lineTo(moon.x, moon.y); ctx.stroke();
  ctx.setLineDash([]);

  if (syn > 3 && syn < 357) {
    const dirSun = Math.atan2(L.sy - earth.y, L.sx - earth.x);
    const arcR   = L.rEarth + 10;
    ctx.strokeStyle = 'rgba(58,175,169,0.8)';
    ctx.lineWidth   = 2.5;
    // Arc sweeps CCW (anticlockwise=true) from Sun direction by synodic angle
    ctx.beginPath(); ctx.arc(earth.x, earth.y, arcR, dirSun, dirSun - d2r(syn), true); ctx.stroke();

    const midA = dirSun - d2r(syn / 2);   // mid-point of CCW arc
    const ld   = arcR + 18;
    ctx.font      = `bold ${Math.round(L.rEarth * 0.9)}px "JetBrains Mono"`;
    ctx.fillStyle = '#3AAFA9';
    ctx.textAlign = 'center';
    ctx.fillText(syn.toFixed(0) + '°',
      earth.x + Math.cos(midA) * ld,
      earth.y + Math.sin(midA) * ld + 4);
  }
  ctx.restore();
}

/* ── INFO BAR (bottom strip) ─────────────────────────────────────────────── */
function drawInfoBar(L) {
  const syn  = synodic(t);
  const ill  = illumination(syn);
  const name = phaseName(syn);
  const orbP = W_E * t;

  const y0 = L.OrbH;     // top of info strip
  const W  = L.W;
  const H  = INFO_H;

  // Background
  ctx.fillStyle = 'rgba(4,4,22,0.92)';
  ctx.fillRect(0, y0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(W, y0); ctx.stroke();

  const cy   = y0 + H / 2;
  // Match the CSS clamp(40px, 22vw, 380px) used by the top-bar and controls
  const lpad = Math.max(40, Math.min(W * 0.22, 380));

  // ── DAY COUNTER ─────────────────────────────────────────────────────────
  const dayFontSz = Math.round(Math.min(H * 0.52, 28));
  ctx.font = `bold ${dayFontSz}px "Barlow Condensed"`;
  ctx.fillStyle = '#e8e6f0';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('Day ' + t.toFixed(1), lpad, cy);

  // ── PROGRESS BAR ────────────────────────────────────────────────────────
  const bx = lpad + 118, bw = Math.min(W * 0.25, 240), bh = 6;
  const by = cy - bh / 2;

  ctx.fillStyle = 'rgba(255,255,255,0.1)';
  rRect(bx, by, bw, bh, 3); ctx.fill();

  const prog = Math.min(1, t / T_SYN);
  if (prog > 0) {
    ctx.fillStyle = '#3AAFA9';
    rRect(bx, by, bw * prog, bh, 3); ctx.fill();
  }

  // Tick at 27.3
  const tickX = bx + bw * (T_SID / T_SYN);
  ctx.fillStyle = '#ffc850';
  ctx.fillRect(tickX - 1, by - 4, 2, bh + 8);

  ctx.font = `${Math.round(bh * 1.7)}px "Barlow Condensed"`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(255,200,80,0.7)';
  ctx.fillText('27.3', tickX, by + bh + 5);
  ctx.textBaseline = 'middle';

  // Tick at 29.5
  const tickX2 = bx + bw;
  ctx.fillStyle = 'rgba(58,175,169,0.7)';
  ctx.fillRect(tickX2 - 1, by - 4, 2, bh + 8);
  ctx.font = `${Math.round(bh * 1.7)}px "Barlow Condensed"`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(58,175,169,0.6)';
  ctx.fillText('29.5', tickX2, by + bh + 5);
  ctx.textBaseline = 'middle';

  // ── PHASE DISK + NAME ───────────────────────────────────────────────────
  const diskR = Math.min(H * 0.35, 20);
  const diskX = bx + bw + 24 + diskR;
  drawPhaseDisk(diskX, cy, diskR, syn);

  const tx1 = diskX + diskR + 10;
  ctx.textAlign = 'left';
  ctx.font = `bold ${Math.round(diskR * 1.05)}px "Barlow Condensed"`;
  ctx.fillStyle = '#ede080';
  ctx.fillText(name.toUpperCase(), tx1, cy - diskR * 0.45);

  ctx.font = `${Math.round(diskR * 0.82)}px "JetBrains Mono"`;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText((ill * 100).toFixed(0) + '% lit', tx1, cy + diskR * 0.55);

  // ── ANGLE STATS ─────────────────────────────────────────────────────────
  const statsX = Math.min(tx1 + 160, W - 240);
  const fs2    = Math.round(diskR * 0.82);
  ctx.font = `${fs2}px "JetBrains Mono"`;
  ctx.textAlign = 'left';

  ctx.fillStyle = 'rgba(58,175,169,0.9)';
  ctx.fillText('Phase angle: ' + syn.toFixed(1) + '°', statsX, cy - diskR * 0.45);

  ctx.fillStyle = 'rgba(255,200,60,0.85)';
  ctx.fillText('Earth moved: ' + orbP.toFixed(1) + '°', statsX, cy + diskR * 0.55);

  // Sidereal progress note
  const sidDone = mod360(W_M * t) / 360;
  const sideX = statsX + 200;
  if (sideX + 160 < W) {
    ctx.font = `${fs2}px "Barlow Condensed"`;
    ctx.fillStyle = 'rgba(255,200,80,0.75)';
    ctx.fillText('Moon orbit: ' + (sidDone * 100).toFixed(0) + '%', sideX, cy - diskR * 0.45);
    ctx.fillStyle = 'rgba(200,200,220,0.5)';
    ctx.fillText('Phase cycle: ' + (syn / 360 * 100).toFixed(0) + '%', sideX, cy + diskR * 0.55);
  }

  ctx.textBaseline = 'alphabetic';
}

/* ── PAUSE OVERLAY ───────────────────────────────────────────────────────── */
function drawPauseOverlay(L) {
  if (!pauseSid && !pauseSyn) return;

  const W = L.W;

  const bw = Math.min(520, W - 40);
  const bh = 192;
  const bx = W / 2 - bw / 2;
  // Anchor box to the bottom of the orbital area, just above the info bar
  const by = L.OrbH - bh - 8;
  const syn = synodic(t);

  if (pauseSid && !pauseSyn) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur  = 28;
    ctx.fillStyle = 'rgba(8,6,28,0.97)'; ctx.strokeStyle = '#ffc850'; ctx.lineWidth = 1.5;
    rRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center';

    ctx.font = 'bold 22px "Barlow Condensed"';
    ctx.fillStyle = '#ffc850';
    ctx.fillText('⏸  SIDEREAL ORBIT COMPLETE — Day 27.3', W/2, by + 38);

    ctx.font = '15px "Plus Jakarta Sans"';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('The Moon has completed exactly 360° around Earth', W/2, by + 68);
    ctx.fillText('relative to the distant stars (★ reference line).', W/2, by + 88);

    ctx.font = '14px "Plus Jakarta Sans"';
    ctx.fillStyle = '#ffaa66';
    ctx.fillText('But Earth has moved ' + (W_E * T_SID).toFixed(1) + '° — New Moon alignment NOT restored yet.', W/2, by + 116);
    ctx.fillText('Compare the Moon\'s position to the orange ● ghost.', W/2, by + 134);

    ctx.font = '14px "Plus Jakarta Sans"';
    ctx.fillStyle = 'rgba(58,175,169,0.9)';
    ctx.fillText('Phase angle: ' + syn.toFixed(1) + '° — still ' + (360 - syn).toFixed(1) + '° short of New Moon.', W/2, by + 160);

    ctx.font = '11px "Barlow Condensed"';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('PRESS SPACE OR CLICK PLAY TO CONTINUE  →', W/2, by + 182);
    ctx.restore();

  } else {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur  = 28;
    ctx.fillStyle = 'rgba(8,6,28,0.97)'; ctx.strokeStyle = '#3AAFA9'; ctx.lineWidth = 1.5;
    rRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.textAlign = 'center';

    ctx.font = 'bold 22px "Barlow Condensed"';
    ctx.fillStyle = '#3AAFA9';
    ctx.fillText('✓  SYNODIC MONTH COMPLETE — Day 29.5', W/2, by + 38);

    ctx.font = '15px "Plus Jakarta Sans"';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('Moon–Sun–Earth alignment restored.  New Moon again.', W/2, by + 68);

    ctx.font = '14px "Plus Jakarta Sans"';
    ctx.fillStyle = 'rgba(200,230,230,0.9)';
    ctx.fillText('Sidereal month:  27.3 days  — one orbit relative to the stars', W/2, by + 100);
    ctx.fillText('Synodic month:   29.5 days  — one phase cycle relative to the Sun', W/2, by + 120);

    ctx.font = '14px "Plus Jakarta Sans"';
    ctx.fillStyle = 'rgba(255,200,80,0.85)';
    ctx.fillText('Extra 2.2 days = Earth\'s 26.9° orbital drift during the Moon\'s orbit.', W/2, by + 152);

    ctx.font = '11px "Barlow Condensed"';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText('PRESS SPACE OR ↺ RESET TO RESTART', W/2, by + 180);
    ctx.restore();
  }
}

/* ── RENDER LOOP ─────────────────────────────────────────────────────────── */
function frame(ts) {
  if (playing && lastTs !== null) {
    const dt = (ts - lastTs) / 1000;
    t = Math.min(t + dt * speed, T_SYN);

    if (t >= T_SID && !didPauseSid) {
      t = T_SID; playing = false; pauseSid = true; didPauseSid = true; updatePlayBtn();
    }
    if (t >= T_SYN && !didPauseSyn) {
      t = T_SYN; playing = false; pauseSyn = true; didPauseSyn = true; updatePlayBtn();
    }
  }
  lastTs = ts;

  const L     = layout();
  const earth = earthPos(t, L);
  const moon  = moonPos(t, L);
  const syn   = synodic(t);

  ctx.fillStyle = '#07071a';
  ctx.fillRect(0, 0, L.W, L.H);

  drawStars(L.W, L.H);
  drawOrbitCircle(L);
  drawSun(L);
  drawAngleViz(earth, moon, L);
  drawMoonOrbitCircle(earth, L.Rm);
  drawSiderealRef(earth, L);
  drawGhostMoon(L);
  drawEarth(earth, L);
  drawMoonBody(moon, syn, L);
  drawInfoBar(L);
  drawPauseOverlay(L);

  requestAnimationFrame(frame);
}

/* ── CONTROLS ────────────────────────────────────────────────────────────── */
function updatePlayBtn() {
  const btn = document.getElementById('playBtn');
  if (pauseSyn) {
    btn.textContent = '↺ Restart';
    btn.style.color = btn.style.borderColor = '#a0d8d6';
  } else if (playing) {
    btn.textContent = '⏸ Pause';
    btn.style.color = btn.style.borderColor = '#3AAFA9';
  } else if (didPauseSid && !didPauseSyn) {
    btn.textContent = '▶ Continue';
    btn.style.color = btn.style.borderColor = '#ffc850';
  } else {
    btn.textContent = '▶ Play';
    btn.style.color = btn.style.borderColor = '#3AAFA9';
  }
}

function resetAll() {
  t = 0; playing = false;
  pauseSid = pauseSyn = false;
  didPauseSid = didPauseSyn = false;
  lastTs = null;
  updatePlayBtn();
}

document.getElementById('resetBtn').addEventListener('click', resetAll);

document.getElementById('playBtn').addEventListener('click', () => {
  if (pauseSyn) { resetAll(); return; }
  pauseSid = false;
  playing  = !playing;
  if (playing) lastTs = null;
  updatePlayBtn();
});

document.getElementById('speedSlider').addEventListener('input', e => {
  speed = +e.target.value;
  document.getElementById('speedVal').textContent = speed + '×';
});

document.getElementById('jump273').addEventListener('click', () => {
  t = T_SID; playing = false;
  pauseSid = true; pauseSyn = false;
  didPauseSid = true; didPauseSyn = false;
  updatePlayBtn();
});

document.getElementById('jump295').addEventListener('click', () => {
  t = T_SYN; playing = false;
  pauseSid = false; pauseSyn = true;
  didPauseSid = didPauseSyn = true;
  updatePlayBtn();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('playBtn').click(); }
});

requestAnimationFrame(frame);

requestAnimationFrame(frame);
</script>
