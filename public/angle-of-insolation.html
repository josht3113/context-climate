<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle of Insolation</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root { --tool-accent: var(--accent-seasons); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 24px; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 54px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.preset { min-width: 72px; padding: 8px 12px; font-size: 15px; font-weight: 600; color: var(--color-text-primary); }
.preset b { font-family: var(--font-display); font-size: 18px; margin-right: 6px; }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 120px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 64px; text-align: right; }
.tgl { padding: 8px 14px; font-size: 14px; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.chips { position: absolute; display: none; gap: 6px; }
.chips .cc-segmented-btn { padding: 5px 12px; font-size: 12px; }
.chips .tgl { padding: 4px 10px; font-size: 13px; background: var(--color-surface); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.dim .v { font-size: 21px; color: var(--color-text-secondary); }
.card table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.card th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; text-transform: uppercase; font-weight: 500;
  color: var(--color-text-secondary); text-align: right; padding: 8px 2px 5px 6px; border-bottom: 1px solid var(--color-border-hover); line-height: 1.25; vertical-align: bottom; }
.card th:first-child, .card td:first-child { text-align: left; }
.card td { font-family: var(--font-mono); font-size: 17px; font-weight: 700; text-align: right; padding: 7px 2px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.card td:first-child { font-family: var(--font-display); font-size: 21px; color: var(--tool-accent); }
.card tr.probe td:first-child { color: #F2C14E; }
.card tr.w td { font-size: 15px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 640px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 23px; }
  .card .r.dim .v { font-size: 18px; }
  .card td { padding: 5px 2px; }
}
.card .sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Angle of Insolation</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="flash">Flashlight</button>
      <button class="cc-segmented-btn" data-tab="globe">Globe</button>
      <button class="cc-segmented-btn" data-tab="ground">Ground</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chips">
          <div class="cc-segmented">
            <button class="cc-segmented-btn is-active" data-chart="day">Day</button>
            <button class="cc-segmented-btn" data-chart="year">Year</button>
          </div>
          <button class="cc-btn tgl" id="tMeasured">Measured</button>
        </div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

  ctx.restore();

}

function drawFlashSide(ctx, x0, y0, w, h, angle, o) {
  const u = Math.min(w / 16.8, h / 10.4);
  const benchY = y0 + h - 2.3 * u, beamY = benchY - 4.3 * u, b = 0.95 * u;
  const px = x0 + w * 0.22, py = beamY;
  const lensX = x0 + w * 0.635;
  const s = 2 * b / D_SQ, L = BOARD_R * s;
  const th = angle * DEG, sn = Math.sin(th), cs = Math.cos(th);
  const dTop = [-cs, -sn], nrm = [sn, -cs];   // board direction (bottom→top) and lit-side normal

  // bench
  const bxL = x0 + 0.3 * u, bxR = x0 + w - 0.3 * u;
  let g = ctx.createLinearGradient(0, benchY, 0, benchY + 1.25 * u);
  g.addColorStop(0, '#8a6644'); g.addColorStop(0.12, '#6f5136'); g.addColorStop(1, '#4a3524');
  ctx.fillStyle = g; ctx.fillRect(bxL, benchY, bxR - bxL, 1.25 * u);
  ctx.fillStyle = 'rgba(255,230,190,0.18)'; ctx.fillRect(bxL, benchY, bxR - bxL, 2);
  ctx.fillStyle = '#2a1f16'; ctx.fillRect(bxL + u, benchY + 1.25 * u, u * 0.6, h - (benchY - y0) - 1.25 * u); ctx.fillRect(bxR - 1.6 * u, benchY + 1.25 * u, u * 0.6, h - (benchY - y0) - 1.25 * u);

  // ruler on the bench edge: lens to board pivot = 30 cm
  const rY = benchY + 0.18 * u, rH = 0.88 * u;
  ctx.fillStyle = '#e2cf92'; ctx.fillRect(px, rY, lensX - px, rH);
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1; ctx.strokeRect(px + 0.5, rY + 0.5, lensX - px - 1, rH - 1);
  const cm = (lensX - px) / 30;
  ctx.strokeStyle = '#2b2414'; ctx.beginPath();
  for (let i = 0; i <= 30; i++) { const xx = Math.round(px + i * cm) + 0.5, tl = i % 10 === 0 ? rH * 0.5 : i % 5 === 0 ? rH * 0.34 : rH * 0.2; ctx.moveTo(xx, rY); ctx.lineTo(xx, rY + tl); }
  ctx.stroke();
  ctx.fillStyle = '#2b2414'; ctx.font = `700 ${Math.max(13, Math.round(rH * 0.42))}px ${FM}`; ctx.textBaseline = 'bottom';
  for (const i of [10, 20]) { ctx.textAlign = 'center'; ctx.fillText(String(i), px + i * cm, rY + rH - 1); }
  ctx.textAlign = 'left'; ctx.fillText('0', px + 3, rY + rH - 1); ctx.textAlign = 'right'; ctx.fillText('30 cm', lensX - 3, rY + rH - 1);

  // board post
  ctx.fillStyle = '#5b6266'; ctx.fillRect(px - u * 0.11, py, u * 0.22, benchY - py);
  ctx.fillStyle = '#3c4245'; rrect(ctx, px - u * 0.8, benchY - u * 0.2, u * 1.6, u * 0.24, 3); ctx.fill();

  // flashlight + cradle
  const fl = drawFlashlight(ctx, lensX, py, b, u);
  { const xm = (fl.bx0 + fl.bx1) / 2 + u * 0.3;
    ctx.fillStyle = '#5b6266'; ctx.fillRect(xm - u * 0.11, py + fl.bodyR, u * 0.22, benchY - py - fl.bodyR);
    ctx.fillStyle = '#3c4245'; rrect(ctx, xm - u * 0.9, py + fl.bodyR - 2, u * 1.8, u * 0.3, 4); ctx.fill();
    rrect(ctx, xm - u * 0.8, benchY - u * 0.2, u * 1.6, u * 0.24, 3); ctx.fill(); }

  // beam: hits along the board face line
  const hitX = yy => px - ((py - yy) / sn) * cs;
  const yT = py - b, yB = py + b, xT = hitX(yT), xB = hitX(yB);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  g = ctx.createLinearGradient(lensX, 0, Math.min(xT, xB), 0); g.addColorStop(0, 'rgba(255,236,190,0.30)'); g.addColorStop(1, 'rgba(255,236,190,0.16)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(lensX, yT); ctx.lineTo(xT, yT); ctx.lineTo(xB, yB); ctx.lineTo(lensX, yB); ctx.closePath(); ctx.fill();
  const lg = ctx.createRadialGradient(lensX, py, 0, lensX, py, b * 2.2); lg.addColorStop(0, 'rgba(255,240,200,0.55)'); lg.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lensX, py, b * 2.2, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = 'rgba(255,240,205,0.55)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.moveTo(lensX, yT); ctx.lineTo(xT, yT); ctx.moveTo(lensX, yB); ctx.lineTo(xB, yB); ctx.stroke(); ctx.restore();

  // energy packets travelling along 10 rays

    const sp = 3.2 * u; // px per second

      const yy = rayY(k), xe = hitX(yy);

    }
    ctx.restore();

  const Q0 = [P0[0] - nrm[0] * t, P0[1] - nrm[1] * t], Q1 = [P1[0] - nrm[0] * t, P1[1] - nrm[1] * t];

  ctx.strokeStyle = '#ece9e0'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(P0[0], P0[1]); ctx.lineTo(P1[0], P1[1]); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(xT, yT); ctx.lineTo(xB, yB); ctx.stroke(); ctx.restore();
  // ray landing ticks

    ctx.fillStyle = '#ffb44a';
    for (let k = 0; k < NR; k++) { const yy = rayY(k); ctx.beginPath(); ctx.arc(hitX(yy), yy, 2.4, 0, Math.PI * 2); ctx.fill(); }
  }

  ctx.fillStyle = '#9aa2a6'; ctx.beginPath(); ctx.arc(px - u * 0.05, py - u * 0.05, u * 0.07, 0, Math.PI * 2); ctx.fill();

  // angle arc (between the incoming rays and the board, lit side)
  const rA = 2.35 * u;
  ctx.save(); ctx.strokeStyle = '#F2C14E'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(px, py, rA, 0, th, false); ctx.stroke(); ctx.restore();
  const lr = rA + 0.62 * u, la = th / 2;
  label(ctx, Math.round(angle) + '°', px + Math.cos(la) * lr + 4, py + Math.sin(la) * lr, { font: `700 ${Math.round(Math.max(18, u * 0.78))}px ${FD}`, color: '#F2C14E' });

  // drag handle at the top end of the board
  if (!o.capture) {
    ctx.save(); ctx.fillStyle = 'rgba(214,126,96,0.95)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(P1[0], P1[1], 8.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  label(ctx, 'SIDE VIEW', x0 + 10, y0 + 16, { font: `700 13px ${FM}`, align: 'left', color: 'rgba(232,228,217,0.62)', halo: false });
  if (o.hit) { o.hit.board = { px, py, P0, P1, L }; }
}

function drawFlash(ctx, W, H, o) {
  let g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#272d29'); g.addColorStop(1, '#1a1e1b');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (S.fCompare) return drawFlashCompare(ctx, W, H, o);
  const sideW = Math.round(W * 0.6);
  drawFlashSide(ctx, 0, 0, sideW, H, S.angle, o);
  // face-on inset
  const fx = sideW + 4, fy = 10, fw = W - fx - 10, fh = H - 20;
  ctx.fillStyle = '#1b1f1c'; rrect(ctx, fx, fy, fw, fh, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(232,228,217,0.14)'; ctx.lineWidth = 1; ctx.stroke();
  label(ctx, 'FACE-ON VIEW', fx + 12, fy + 17, { font: `700 13px ${FM}`, align: 'left', color: 'rgba(232,228,217,0.62)', halo: false });
  const bd = drawBoardFace(ctx, fx + 6, fy + 30, fw - 12, fh - 64, S.angle, o);
  drawFaceLegend(ctx, fx + fw / 2, fy + fh - 17, bd.q, o.packets);
}

function drawFaceLegend(ctx, cx, cy, q, packets) {
  const s = Math.min(16, q * 0.5);
  ctx.save(); ctx.font = `600 13px ${FB}`; ctx.textBaseline = 'middle';
  const t1 = '= 1 square', t2 = '= 1 energy unit';
  const w1 = s + 6 + ctx.measureText(t1).width, w2 = 12 + ctx.measureText(t2).width;
  const tot = packets ? w1 + 22 + w2 : w1; let x = cx - tot / 2;
  ctx.strokeStyle = 'rgba(232,228,217,0.75)'; ctx.lineWidth = 1.2; ctx.strokeRect(x + 0.5, cy - s / 2 + 0.5, s, s);
  ctx.fillStyle = 'rgba(232,228,217,0.8)'; ctx.textAlign = 'left'; ctx.fillText(t1, x + s + 6, cy);
  if (packets) { x += w1 + 22; ctx.fillStyle = '#E0742F'; ctx.beginPath(); ctx.arc(x + 4, cy, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(232,228,217,0.8)'; ctx.fillText(t2, x + 12, cy); }
  ctx.restore();
}

function drawMiniSide(ctx, x, y, w, h, angle) {
  // small schematic: horizontal beam from the right meeting a tilted board
  const cy = y + h / 2, px = x + w * 0.3, b = h * 0.17, th = angle * DEG, sn = Math.sin(th), cs = Math.cos(th);
  const hitX = yy => px - ((cy - yy) / sn) * cs;
  ctx.save();
  ctx.fillStyle = 'rgba(255,236,190,0.22)'; ctx.beginPath(); ctx.moveTo(x + w - 6, cy - b); ctx.lineTo(hitX(cy - b), cy - b); ctx.lineTo(hitX(cy + b), cy + b); ctx.lineTo(x + w - 6, cy + b); ctx.closePath(); ctx.fill();
  ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(255,240,205,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x + w - 6, cy - b); ctx.lineTo(hitX(cy - b), cy - b); ctx.moveTo(x + w - 6, cy + b); ctx.lineTo(hitX(cy + b), cy + b); ctx.stroke(); ctx.setLineDash([]);
  const hl = h * 0.46;
  ctx.strokeStyle = '#ece9e0'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px + cs * hl, cy + sn * hl); ctx.lineTo(px - cs * hl, cy - sn * hl); ctx.stroke();
  ctx.strokeStyle = '#F2C14E'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(px, cy, h * 0.3, 0, th); ctx.stroke();
  ctx.restore();
}

function drawFlashCompare(ctx, W, H, o) {
  const n = 4, gap = 10, cw = (W - gap * (n + 1)) / n;
  PRESETS.forEach((p, i) => {
    const x = gap + i * (cw + gap), y = 10, h = H - 20;
    ctx.fillStyle = '#1b1f1c'; rrect(ctx, x, y, cw, h, 6); ctx.fill(); ctx.strokeStyle = 'rgba(232,228,217,0.14)'; ctx.lineWidth = 1; ctx.stroke();
    label(ctx, p.k, x + 14, y + 22, { font: `700 24px ${FD}`, align: 'left', color: '#D67E60', halo: false });
    label(ctx, p.a + '°', x + 38, y + 23, { font: `700 18px ${FD}`, align: 'left', color: '#F2C14E', halo: false });
    drawMiniSide(ctx, x + cw * 0.42, y + 4, cw * 0.56, 44, p.a);
    const bd = drawBoardFace(ctx, x + 4, y + 52, cw - 8, h - 88, p.a, o);
    if (i === 0 || true) {}

  drawFaceLegend(ctx, W / 2, H - 17, 26, o.packets);
}

function cardFlash() {
  if (S.fCompare) {
    return { eb: 'Boards A–D', rows: [{ l: 'Distance to board', v: '30', u: 'cm', dim: 1 }, { l: 'Energy in beam', v: '100', u: 'units', dim: 1 }],
      table: { cols: ['26px', '58px', 'auto', '84px'], head: ['', 'Angle', 'Illuminated area (squares)', 'Energy per square'],
        rows: PRESETS.map(p => { const v = flashVals(p.a); return [p.k, p.a + '°', v.area.toFixed(1), v.per.toFixed(1)]; }) } };

/* ═══════════════════════════════ GLOBE ═════════════════════════════ */
let LAND = null;
const STARS = (() => { const r = rnd(7), a = []; for (let i = 0; i < 260; i++) a.push([r(), r(), r() * 1.1 + 0.3, r() * 0.6 + 0.2]); return a; })();
let earthCache = { key: '', cv: null };

function earthLayer(R, dec, pr) {
  const key = [R.toFixed(1), dec.toFixed(2), pr, !!LAND].join('|');
  if (earthCache.key === key) return earthCache.cv;
  const pad = 3, size = Math.ceil((2 * R + 2 * pad) * pr);
  const cv = earthCache.cv && earthCache.cv.width === size ? earthCache.cv : document.createElement('canvas');
  cv.width = cv.height = size;
  const c = cv.getContext('2d'); c.setTransform(pr, 0, 0, pr, 0, 0); c.clearRect(0, 0, size, size);
  const C = R + pad;
  if (typeof d3 === 'undefined' || !d3.geoOrthographic) { // fallback: plain ocean sphere
    c.fillStyle = '#1d4f7a'; c.beginPath(); c.arc(C, C, R, 0, Math.PI * 2); c.fill();
  } else {
    const proj = d3.geoOrthographic().scale(R).translate([C, C]).rotate([-(LON - 90), 0, -dec]).clipAngle(90).precision(0.3);
    const path = d3.geoPath(proj, c);
    let g = c.createRadialGradient(C + R * 0.3, C, R * 0.1, C, C, R); g.addColorStop(0, '#2a6a9c'); g.addColorStop(1, '#173e60');
    c.fillStyle = g; c.beginPath(); path({ type: 'Sphere' }); c.fill();
    if (LAND) {
      c.fillStyle = '#7d9a5e'; c.beginPath(); path(LAND); c.fill();
      // ice: high latitudes
      c.save(); c.beginPath(); path(d3.geoCircle().center([0, 90]).radius(21)()); path(d3.geoCircle().center([0, -90]).radius(28)()); c.clip();
      c.fillStyle = '#e4ebee'; c.beginPath(); path(LAND); c.fill(); c.restore();
      c.strokeStyle = 'rgba(30,50,30,0.35)'; c.lineWidth = 0.6; c.beginPath(); path(LAND); c.stroke();
    }
    // key latitude lines
    const latLine = lat => ({ type: 'LineString', coordinates: d3.range(-180, 181, 3).map(l => [l, lat]) });
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1.2; c.beginPath(); path(latLine(0)); c.stroke();
    c.setLineDash([5, 4]); c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 1;
    c.beginPath(); for (const l of [23.44, -23.44, 66.56, -66.56]) path(latLine(l)); c.stroke(); c.setLineDash([]);
  }
  // sunlight: Lambert shading — Sun is exactly to the right (+x), so brightness depends on x only
  c.save(); c.beginPath(); c.arc(C, C, R, 0, Math.PI * 2); c.clip();
  const sg = c.createLinearGradient(C - R, 0, C + R, 0);
  sg.addColorStop(0, 'rgba(3,6,14,0.86)'); sg.addColorStop(0.47, 'rgba(3,6,14,0.86)');
  for (let i = 0; i <= 10; i++) { const x = i / 10; sg.addColorStop(0.5 + x * 0.5, `rgba(3,6,14,${(0.80 * Math.pow(1 - x, 1.15)).toFixed(3)})`); }
  c.fillStyle = sg; c.fillRect(C - R, C - R, 2 * R, 2 * R);
  c.restore();
  // atmosphere rim on the day side
  const ag = c.createLinearGradient(C, 0, C + R, 0); ag.addColorStop(0, 'rgba(130,190,255,0)'); ag.addColorStop(1, 'rgba(150,205,255,0.75)');
  c.strokeStyle = ag; c.lineWidth = 2.5; c.beginPath(); c.arc(C, C, R + 0.5, -Math.PI / 2, Math.PI / 2); c.stroke();
  earthCache = { key, cv };
  return cv;
}

function globeLayout(W, H) {
  const tileH = clamp(Math.round(H * 0.25), 96, 132), mainH = H - tileH;
  const R = Math.min(mainH * 0.355, W * 0.23);
  const cx = 92 + R, cy = mainH / 2 + 2;
  const Rs = mainH * 0.40, sx = W + Rs * 0.22, sy = cy;
  const xs = Math.round((cx + R + (sx - Rs)) / 2);
  return { tileH, mainH, R, cx, cy, Rs, sx, sy, xs };
}

function drawGlobe(ctx, W, H, o) {
  const Lo = globeLayout(W, H), { R, cx, cy, mainH, xs } = Lo, dec = decl(S.day);
  // space
  ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, W, mainH);
  for (const s of STARS) { if (s[1] * mainH > mainH - 4) continue; ctx.fillStyle = `rgba(220,228,255,${s[3] * 0.7})`; ctx.fillRect(s[0] * W, s[1] * mainH, s[2], s[2]); }
  // Sun
  const sg = ctx.createRadialGradient(Lo.sx, Lo.sy, Lo.Rs * 0.6, Lo.sx, Lo.sy, Lo.Rs * 1.7);
  sg.addColorStop(0, 'rgba(255,214,120,0.55)'); sg.addColorStop(1, 'rgba(255,170,60,0)');
  ctx.fillStyle = sg; ctx.fillRect(Lo.sx - Lo.Rs * 1.8, 0, Lo.Rs * 1.8, mainH);
  const sd = ctx.createRadialGradient(Lo.sx - Lo.Rs * 0.2, Lo.sy, 0, Lo.sx, Lo.sy, Lo.Rs);
  sd.addColorStop(0, '#fffbe9'); sd.addColorStop(0.7, '#ffe49a'); sd.addColorStop(1, '#ffc35a');
  ctx.fillStyle = sd; ctx.beginPath(); ctx.arc(Lo.sx, Lo.sy, Lo.Rs, 0, Math.PI * 2); ctx.fill();
  // background rays: Sun → screen
  ctx.strokeStyle = 'rgba(255,226,160,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath(); for (let y = 12; y < mainH - 6; y += 13) { const xe = Lo.sx - Math.sqrt(Math.max(0, Lo.Rs * Lo.Rs - (y - Lo.sy) ** 2)) - 2; if (xe > xs) { ctx.moveTo(xs + 8, y); ctx.lineTo(xe, y); } } ctx.stroke();
  // Earth
  const ev = earthLayer(R, dec, o.pr || 1); const pad = 3;
  ctx.drawImage(ev, cx - R - pad, cy - R - pad, 2 * R + 2 * pad, 2 * R + 2 * pad);
  // axis
  const np = [cx + R * Math.cos((90 - dec) * DEG), cy - R * Math.sin((90 - dec) * DEG)];
  const ax = [Math.cos((90 - dec) * DEG), -Math.sin((90 - dec) * DEG)];
  ctx.strokeStyle = 'rgba(232,228,217,0.85)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(np[0], np[1]); ctx.lineTo(np[0] + ax[0] * R * 0.16, np[1] + ax[1] * R * 0.16);
  ctx.moveTo(cx - ax[0] * R, cy - ax[1] * R); ctx.lineTo(cx - ax[0] * R * 1.16, cy - ax[1] * R * 1.16); ctx.stroke();
  ctx.setLineDash([3, 4]); ctx.strokeStyle = 'rgba(232,228,217,0.35)'; ctx.beginPath(); ctx.moveTo(np[0], np[1]); ctx.lineTo(cx - ax[0] * R, cy - ax[1] * R); ctx.stroke(); ctx.setLineDash([]);
  label(ctx, 'N', np[0] + ax[0] * R * 0.24, np[1] + ax[1] * R * 0.24, { font: `700 15px ${FB}` });
  // latitude labels on the night-side limb
  for (const [lt, t] of [[0, 'Equator'], [23.44, '23.5°N'], [-23.44, '23.5°S'], [66.56, '66.5°N'], [-66.56, '66.5°S']]) {
    const b = (180 - (lt - dec)) * DEG; // where this latitude meets the left (midnight) limb
    const lx = cx + R * Math.cos(b), ly = cy - R * Math.sin(b);
    label(ctx, t, lx - 8, ly, { font: `600 13px ${FM}`, align: 'right', color: lt === 0 ? 'rgba(240,238,230,0.9)' : 'rgba(232,228,217,0.72)', halo: false });
  }
  // screen with equal cutouts
  const hb = R * 0.072, sw = 12;
  const cuts = PATCHES.map(p => ({ ...p, beta: (p.lat - dec) * DEG }));
  cuts.forEach(c => { c.y = cy - R * Math.sin(c.beta); });
  const scrTop = Math.max(8, Math.min(...cuts.map(c => c.y)) - R * 0.38), scrBot = Math.min(mainH - 8, Math.max(...cuts.map(c => c.y)) + R * 0.38);
  ctx.save();
  ctx.fillStyle = '#5d6468';
  let yPrev = scrTop; const sorted = [...cuts].sort((a, b) => a.y - b.y);
  const slab = (y0, y1) => { if (y1 - y0 < 1) return; const g = ctx.createLinearGradient(xs, 0, xs + sw, 0); g.addColorStop(0, '#4a5155'); g.addColorStop(0.5, '#8d969b'); g.addColorStop(1, '#565d61'); ctx.fillStyle = g; ctx.fillRect(xs, y0, sw, y1 - y0); };
  for (const c of sorted) { slab(yPrev, c.y - hb); yPrev = c.y + hb; } slab(yPrev, scrBot);
  ctx.restore();
  label(ctx, 'Equal cutouts', xs + sw / 2, Math.max(14, scrTop - 12), { font: `600 13px ${FB}`, color: 'rgba(232,228,217,0.8)', halo: false });
  // beams through cutouts → limb
  const limbX = y => cx + Math.sqrt(Math.max(0, R * R - (y - cy) ** 2));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const c of cuts) {
    if (Math.abs(c.beta) >= Math.PI / 2) continue;
    const y0 = c.y - hb, y1 = c.y + hb;
    ctx.fillStyle = 'rgba(255,226,150,0.22)';
    ctx.beginPath(); ctx.moveTo(xs, y0); ctx.lineTo(limbX(y0), y0);
    const N = 12; for (let i = 0; i <= N; i++) { const yy = y0 + (y1 - y0) * i / N; ctx.lineTo(limbX(yy), yy); }
    ctx.lineTo(xs, y1); ctx.closePath(); ctx.fill();
  }
  // packets
  if (o.packets) {
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,190,90,0.9)'; ctx.lineWidth = 2;
    const gap = R * 0.3, sp = R * 0.5;
    for (const c of cuts) {

      for (let k = 0; k < 4; k++) {
        const yy = c.y - hb + (k + 0.5) * 2 * hb / 4, xe = limbX(yy);
        const off = (o.phase * sp + k * gap * 0.37) % gap;

  const pb = (S.probe - dec) * DEG, ppx = cx + R * Math.cos(pb), ppy = cy - R * Math.sin(pb);
  ctx.save(); ctx.fillStyle = '#F2C14E'; ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(ppx, ppy, 7.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore();
  const pl = R + 22;
  label(ctx, 'P', cx + pl * Math.cos(pb), cy - pl * Math.sin(pb), { font: `700 17px ${FD}`, color: '#F2C14E' });
  if (o.hit) o.hit.globe = { cx, cy, R, dec, ppx, ppy };

  // footprint tiles
  drawGlobeTiles(ctx, 0, mainH, W, Lo.tileH, dec, o);
}

function drawFootprintRect(ctx, x, y, w, h, ang, o) {
  // light grid surface with a stretched square beam (√10 squares a side) + 10×10 packets
  const cols = 11, rows = 4, q = Math.min(w / cols, h / rows);
  const gw = q * cols, gh = q * rows, gx = x + (w - gw) / 2, gy = y + (h - gh) / 2;
  ctx.save(); ctx.beginPath(); ctx.rect(gx, gy, gw, gh); ctx.clip();
  ctx.fillStyle = '#8e8b83'; ctx.fillRect(gx, gy, gw, gh);
  if (ang > 0) {
    const s = Math.sin(ang * DEG), side = Math.sqrt(BEAM_SQ) * q, fw = side / s, fh = side;
    const fx = gx + gw / 2 - fw / 2, fy = gy + gh / 2 - fh / 2;
    ctx.fillStyle = mixc('#8e8b83', '#fff8e6', 0.18 + 0.82 * s); ctx.shadowColor = mixc('#8e8b83', '#fff3d6', 0.1 + 0.8 * s); ctx.shadowBlur = q * 0.4;
    ctx.fillRect(fx, fy, fw, fh); ctx.shadowBlur = 0;
    if (o.packets) { ctx.fillStyle = '#B4480E'; const r = Math.max(1.3, q * 0.07);
      for (let i = 0; i < 10; i++) for (let j = 0; j < 10; j++) { ctx.beginPath(); ctx.arc(fx + (i + 0.5) * fw / 10, fy + (j + 0.5) * fh / 10, r, 0, Math.PI * 2); ctx.fill(); } }
  }
  ctx.strokeStyle = 'rgba(40,46,52,0.42)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let i = 1; i < cols; i++) { const xx = Math.round(gx + i * q) + 0.5; ctx.moveTo(xx, gy); ctx.lineTo(xx, gy + gh); }
  for (let j = 1; j < rows; j++) { const yy = Math.round(gy + j * q) + 0.5; ctx.moveTo(gx, yy); ctx.lineTo(gx + gw, yy); }
  ctx.stroke(); ctx.restore();
  ctx.strokeStyle = 'rgba(232,228,217,0.25)'; ctx.strokeRect(gx - 0.5, gy - 0.5, gw + 1, gh + 1);
  return q;
}

function drawGlobeTiles(ctx, x, y, w, h, dec, o) {
  ctx.fillStyle = '#1b1f1c'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(232,228,217,0.14)'; ctx.fillRect(x, y, w, 1);
  const n = 4, gap = 10, tw = (w - gap * (n + 1)) / n;
  let q = 10;
  PATCHES.forEach((p, i) => {
    const tx = x + gap + i * (tw + gap), v = patchVals(p.lat, dec);
    label(ctx, p.k, tx + 2, y + 17, { font: `700 20px ${FD}`, align: 'left', color: '#D67E60', halo: false });
    label(ctx, latStr(p.lat) + ' · ' + Math.round(v.ang) + '°', tx + 22, y + 18, { font: `700 14px ${FM}`, align: 'left', color: 'rgba(232,228,217,0.85)', halo: false });
    q = drawFootprintRect(ctx, tx, y + 32, tw, h - 40, v.ang, o);
  });
}

function cardGlobe() {
  const dec = decl(S.day);
  const rows = PATCHES.map(p => { const v = patchVals(p.lat, dec); return [p.k, latStr(p.lat), Math.round(v.ang) + '°', v.area.toFixed(1), v.per.toFixed(1)]; });
  const pv = patchVals(S.probe, dec);
  rows.push(['P', latStr(Math.round(S.probe)), pv.ang > 0 ? Math.round(pv.ang) + '°' : '0°', pv.ang > 0 ? pv.area.toFixed(1) : '—', pv.per.toFixed(1)]);
  return { eb: dateLabel(S.day), rows: [{ l: 'Direct rays strike', v: latStr(dec, 1) }, { l: 'Energy per cutout', v: '100', u: 'units', dim: 1 }],
    table: { cols: ['24px', '62px', '48px', 'auto', '74px'], head: ['', 'Latitude', 'Angle', 'Area (squares)', 'Energy per square'], rows, probeLast: true } };
}

/* ═══════════════════════════════ GROUND ════════════════════════════ */
const TREE = (() => { // normalized branch list, generated once
  const r = rnd(11), segs = [], tips = [];
  function br(x, y, a, len, w, d) {
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len; segs.push([x, y, x2, y2, w]);
    if (d === 0) { tips.push([x2, y2]); return; }
    const n = d > 3 ? 2 : 3;
    for (let i = 0; i < n; i++) br(x2, y2, a + (r() - 0.5) * 1.25 + (i - (n - 1) / 2) * 0.42, len * (0.68 + r() * 0.12), w * 0.66, d - 1);
  }
  br(0, 0, -Math.PI / 2, 0.30, 0.055, 6);
  const leaves = tips.map(t => [t[0] + (r() - 0.5) * 0.06, t[1] + (r() - 0.5) * 0.06, 0.045 + r() * 0.035, r()]);
  return { segs, leaves };
})();
function leafState(day) { // 0..1 cover, autumn 0..1
  const up = smooth((day - 108) / 32), down = 1 - smooth((day - 292) / 26);
  return { cover: Math.min(up, down), fall: smooth((day - 262) / 30) };
}
function greenness(day) { return clamp(0.5 - 0.5 * Math.cos((day - 15) / 365 * 2 * Math.PI) * 1.25, 0, 1); }

function drawTree(ctx, x, y, size, day) {
  ctx.save(); ctx.lineCap = 'round';
  for (const s of TREE.segs) { ctx.strokeStyle = '#3d2f24'; ctx.lineWidth = Math.max(1, s[4] * size); ctx.beginPath(); ctx.moveTo(x + s[0] * size, y + s[1] * size); ctx.lineTo(x + s[2] * size, y + s[3] * size); ctx.stroke(); }
  const ls = leafState(day);
  if (ls.cover > 0.01) {
    for (const l of TREE.leaves) {
      const base = mixc('#4f7d38', '#c9772e', ls.fall * (0.6 + l[3] * 0.6));
      ctx.globalAlpha = 0.85 * ls.cover; ctx.fillStyle = base;
      ctx.beginPath(); ctx.arc(x + l[0] * size, y + l[1] * size, l[2] * size * (0.55 + 0.45 * ls.cover), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawLandscape(ctx, x, y, w, h, day, o) {
  const v = groundVals(day), a = v.alt * DEG, sn = Math.sin(a), cs = Math.cos(a);
  const hi = clamp((v.alt - 20) / 55, 0, 1), gr = greenness(day);
  const yH = y + h * 0.50, yG = y + h * 0.71;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();

  g.addColorStop(0, mixc('#4d82b8', '#2361a8', hi)); g.addColorStop(1, mixc('#dccfb2', '#b8d3ea', hi));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, yH - y + 1);

  const x0 = x + w * (o.panel ? 0.36 : 0.42), L = m / sn, xL = x0 - L / 2, xR = x0 + L / 2;
  const rs = Math.max(13, h * 0.055);
  const d = Math.min((x + w - x0 - rs - 10) / cs, (yG - y - rs - 10) / sn);
  const sunX = x0 + cs * d, sunY = yG - sn * d;

  ctx.beginPath(); ctx.moveTo(x, yH + 2);
  for (let xx = x; xx <= x + w + 8; xx += 7) ctx.lineTo(xx, yH - 6 - r() * 9 - (Math.sin(xx * 0.013) + 1) * 4);
  ctx.lineTo(x + w, yH + 2); ctx.closePath(); ctx.fill();
  // field
  g = ctx.createLinearGradient(0, yH, 0, yG);
  g.addColorStop(0, mixc('#a59c76', '#78a052', gr)); g.addColorStop(1, mixc('#8f8660', '#5d8a40', gr));
  ctx.fillStyle = g; ctx.fillRect(x, yH, w, yG - yH);
  // soil cross-section

  ctx.fillStyle = g; ctx.fillRect(x, yG, w, y + h - yG);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; for (let i = 0; i < 70; i++) { ctx.beginPath(); ctx.arc(x + r() * w, yG + 10 + r() * (y + h - yG - 12), 1 + r() * 2, 0, Math.PI * 2); ctx.fill(); }
  // grass edge
  ctx.fillStyle = mixc('#8a8257', '#4f7d36', gr); ctx.fillRect(x, yG - 3, w, 5);
  // tree
  drawTree(ctx, x + w * 0.11, yG, h * 0.62, day);

  // beam band
  const ux = cs, uy = -sn, far = d + rs * 0.2;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  g = ctx.createLinearGradient(x0, yG, x0 + ux * far, yG + uy * far); g.addColorStop(0, 'rgba(255,232,160,0.34)'); g.addColorStop(1, 'rgba(255,232,160,0.08)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(xL, yG); ctx.lineTo(xR, yG); ctx.lineTo(xR + ux * far, yG + uy * far); ctx.lineTo(xL + ux * far, yG + uy * far); ctx.closePath(); ctx.fill();
  ctx.restore();

  const NR = 10;
  ctx.save(); ctx.strokeStyle = 'rgba(255,240,200,0.35)'; ctx.lineWidth = 1;
  for (let k = 0; k < NR; k++) { const gx = xL + (k + 0.5) * L / NR; ctx.beginPath(); ctx.moveTo(gx, yG); ctx.lineTo(gx + ux * far, yG + uy * far); ctx.stroke(); }
  if (o.packets !== false) {
    ctx.strokeStyle = 'rgba(255,170,60,0.9)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';

    for (let k = 0; k < NR; k++) {
      const gx = xL + (k + 0.5) * L / NR, off = (o.phase * sp + k * gap * 0.37) % gap;
      ctx.beginPath();
      for (let t = off + 2; t < far - rs * 1.2; t += gap) { const t2 = t + gap * 0.16; ctx.moveTo(gx + ux * t, yG + uy * t); ctx.lineTo(gx + ux * t2, yG + uy * t2); }

  ctx.fillRect(xL, yG - 3, L, 5); ctx.restore();
  ctx.fillStyle = '#ffb44a'; for (let k = 0; k < NR; k++) { ctx.beginPath(); ctx.arc(xL + (k + 0.5) * L / NR, yG - 0.5, 2.3, 0, Math.PI * 2); ctx.fill(); }
  // metre ticks along the ground
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
  ctx.beginPath(); for (let k = -12; k <= 12; k++) { const xx = Math.round(x0 + k * m) + 0.5; if (xx < x || xx > x + w) continue; ctx.moveTo(xx, yG + 2); ctx.lineTo(xx, yG + 9); } ctx.stroke();
  // beam cross-section marker (1 m wide)
  const tm = Math.min(d * 0.55, d - rs * 2.2), mx = x0 + ux * tm, my = yG + uy * tm, px_ = -uy, py_ = ux; // perpendicular
  ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6;
  const e1 = [mx - px_ * m / 2, my - py_ * m / 2], e2 = [mx + px_ * m / 2, my + py_ * m / 2];
  ctx.beginPath(); ctx.moveTo(e1[0], e1[1]); ctx.lineTo(e2[0], e2[1]); ctx.stroke();
  for (const e of [e1, e2]) { ctx.beginPath(); ctx.moveTo(e[0] - ux * 5, e[1] - uy * 5); ctx.lineTo(e[0] + ux * 5, e[1] + uy * 5); ctx.stroke(); }
  ctx.restore();
  label(ctx, '1 m²', e1[0] - 6, e1[1] - 4, { font: `700 15px ${FB}`, align: 'right' });
  // footprint bracket (in the soil)
  const by = yG + 18;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(xL, by - 6); ctx.lineTo(xL, by); ctx.lineTo(xR, by); ctx.lineTo(xR, by - 6); ctx.stroke();
  label(ctx, v.area.toFixed(2) + ' m²', x0, by + 15, { font: `700 16px ${FB}` });
  { let k = Math.floor((x + w - 14 - x0) / m); const t1 = x0 + (k - 1) * m, t2 = x0 + k * m;
    ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(t1, yG + 13); ctx.lineTo(t2, yG + 13); ctx.stroke();
    label(ctx, '1 m', (t1 + t2) / 2, yG + 25, { font: `600 13px ${FM}`, color: 'rgba(255,255,255,0.85)', halo: false }); }

    const pc = [pcx, yG - ph];

    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255,232,160,0.22)'; ctx.beginPath(); ctx.moveTo(pe1[0], pe1[1]); ctx.lineTo(pe2[0], pe2[1]);
    ctx.lineTo(pe2[0] + ux * w, pe2[1] + uy * w); ctx.lineTo(pe1[0] + ux * w, pe1[1] + uy * w); ctx.closePath(); ctx.fill(); ctx.restore();
    ctx.strokeStyle = '#555c60'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(pc[0], pc[1]); ctx.lineTo(pc[0], yG); ctx.stroke();
    ctx.strokeStyle = '#1d2a44'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(pe1[0], pe1[1]); ctx.lineTo(pe2[0], pe2[1]); ctx.stroke();
    ctx.strokeStyle = '#6f8fc6'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pe1[0] + ux * 2.5, pe1[1] + uy * 2.5); ctx.lineTo(pe2[0] + ux * 2.5, pe2[1] + uy * 2.5); ctx.stroke();
    label(ctx, 'Solar panel', pc[0], yG + 44, { font: `600 13px ${FB}` });
  }
  // compass
  label(ctx, 'N', x + 12, yH - 22, { font: `700 14px ${FB}`, align: 'left' });
  label(ctx, 'S', x + w - 12, yH - 22, { font: `700 14px ${FB}`, align: 'right' });
  if (o.title) label(ctx, o.title, x + 12, y + 18, { font: `700 18px ${FD}`, align: 'left' });
  ctx.restore();
}

function dayCurve(dec) { const pts = []; for (let h = 0; h <= 24.001; h += 0.1) pts.push([h, BEAM * Math.max(0, Math.sin(sunAlt(LAT, dec, h) * DEG))]); return pts; }

function chartFrame(ctx, x, y, w, h) {
  ctx.fillStyle = '#262B27'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(232,228,217,0.14)'; ctx.fillRect(x, y, w, 1);
}

function drawDayChart(ctx, x, y, w, h, days) {
  chartFrame(ctx, x, y, w, h);
  const L = x + 64, R = x + w - 16, T = y + 34, B = y + h - 28;
  const X = t => L + (R - L) * t / 24, Y = v => B - (B - T) * v / 1000;
  label(ctx, 'Energy reaching 1 m² of ground (W/m²)', x + 14, y + 16, { font: `700 14px ${FB}`, align: 'left', halo: false, color: 'rgba(232,228,217,0.9)' });
  ctx.strokeStyle = 'rgba(232,228,217,0.10)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let v = 0; v <= 1000; v += 250) { ctx.moveTo(L, Math.round(Y(v)) + 0.5); ctx.lineTo(R, Math.round(Y(v)) + 0.5); }
  for (let t = 0; t <= 24; t += 6) { ctx.moveTo(Math.round(X(t)) + 0.5, T); ctx.lineTo(Math.round(X(t)) + 0.5, B); }
  ctx.stroke();
  for (let v = 0; v <= 1000; v += 500) label(ctx, String(v), L - 6, Y(v), { font: `600 13px ${FM}`, align: 'right', halo: false, color: 'rgba(232,228,217,0.7)' });
  ['Midnight', '6 AM', 'Noon', '6 PM', 'Midnight'].forEach((t, i) => label(ctx, t, X(i * 6), B + 12, { font: `600 13px ${FM}`, halo: false, color: 'rgba(232,228,217,0.7)', align: i === 0 ? 'left' : i === 4 ? 'right' : 'center' }));
  const cols = ['#F2C14E', '#7FB2E5'];
  // reference curves (Jun 21 / Dec 21) when a single day is shown
  if (days.length === 1) {
    for (const [d, t] of [[172, 'Jun 21'], [355, 'Dec 21']]) {
      if (d === days[0]) continue;
      const pts = dayCurve(decl(d)); ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(232,228,217,0.38)'; ctx.lineWidth = 1.3;
      ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1]))); ctx.stroke(); ctx.restore();
      const pk = BEAM * Math.sin(groundVals(d).alt * DEG);
      label(ctx, t, X(12) + (d === 172 ? 0 : 0), Y(pk) - 9, { font: `600 13px ${FM}`, halo: '#262B27', color: 'rgba(232,228,217,0.62)' });
    }
  }
  days.forEach((d, i) => {
    const col = days.length === 1 ? cols[0] : cols[i], pts = dayCurve(decl(d));
    ctx.save(); ctx.fillStyle = col; ctx.globalAlpha = 0.28; ctx.beginPath(); ctx.moveTo(X(0), Y(0)); pts.forEach(p => ctx.lineTo(X(p[0]), Y(p[1]))); ctx.lineTo(X(24), Y(0)); ctx.closePath(); ctx.fill();

async function exportPNG() {

/* animation sweep definition: returns [{set(), delay(cs)}] */
function sweep(kind) {
  const saved = { angle: S.angle, day: S.day };
  const fr = [];
  if (S.tab === 'flash') {
    if (kind === 'gif') { const n = 40; for (let i = 0; i <= n; i++) { const a = Math.round(lerp(90, 25, i / n)); fr.push({ a, delay: i === 0 ? 90 : i === n ? 160 : 7 }); } }
    else { for (let i = 0; i < 30; i++) fr.push({ a: 90 }); for (let i = 0; i <= 90; i++) fr.push({ a: lerp(90, 25, smooth(i / 90)) }); for (let i = 0; i < 45; i++) fr.push({ a: 25 }); }
    fr.forEach(f => f.set = () => { S.angle = f.a; });
  } else {
    if (kind === 'gif') { for (let d = 1; d <= 365; d += 5) fr.push({ d, delay: d === 361 ? 160 : 8 }); }
    else { for (let d = 1; d <= 365; d++) fr.push({ d }); for (let i = 0; i < 30; i++) fr.push({ d: 365 }); }
    fr.forEach(f => f.set = () => { S.day = f.d; });

}
function frameAngleRound() { if (S.tab === 'flash') S.angle = Math.round(S.angle * 10) / 10; }

async function exportGIF() {
  if (!animatable()) return;
  setBusy(true); capturing = true; status('rendering…'); await tick();
  const sc = 0.75, W = Math.round(EW * sc), H = Math.round(EH * sc);
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H; const c = oc.getContext('2d', { willReadFrequently: true });
  const sw = sweep('gif'), raw = [];
  try {
    for (let i = 0; i < sw.fr.length; i++) { sw.fr[i].set(); compose(c, sc, i * 0.12); raw.push(c.getImageData(0, 0, W, H).data); if (i % 4 === 0) { status(`rendering ${i + 1}/${sw.fr.length}`); await tick(); } }
    status('building palette…'); await tick();
    const { pal, lut } = buildPalette(raw.filter((_, i) => i % 6 === 0 || i === raw.length - 1));
    const out = []; let prev = null;
    for (let i = 0; i < raw.length; i++) {
      const d = raw[i], n = W * H, ix = new Uint8Array(n);
      for (let y = 0, p = 0; y < H; y++) for (let x = 0; x < W; x++, p++) { const q = p * 4, o = BAYER[((y & 3) << 2) | (x & 3)];
        const r = clamp(d[q] + o, 0, 255), g = clamp(d[q + 1] + o, 0, 255), b = clamp(d[q + 2] + o, 0, 255);
        ix[p] = lut[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]; }
      if (!prev) out.push({ x: 0, y: 0, w: W, h: H, ix, delay: sw.fr[i].delay });
      else {
        let x0 = W, y0 = H, x1 = -1, y1 = -1;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const p = y * W + x; if (ix[p] !== prev[p]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
        if (x1 < 0) { out[out.length - 1].delay += sw.fr[i].delay; }
        else { const fw = x1 - x0 + 1, fh = y1 - y0 + 1, sub = new Uint8Array(fw * fh);
          for (let y = 0; y < fh; y++) for (let x = 0; x < fw; x++) { const p = (y + y0) * W + x + x0; sub[y * fw + x] = ix[p] === prev[p] ? 255 : ix[p]; }
          out.push({ x: x0, y: y0, w: fw, h: fh, ix: sub, delay: sw.fr[i].delay }); }

      prev = ix;
      if (i % 4 === 0) { status(`encoding ${i + 1}/${raw.length}`); await tick(); }

    const bytes = gifBytes(W, H, pal, out);
    saveBlob(new Blob([bytes], { type: 'image/gif' }), slug().replace(/-[^-]*$/, '') + '-animation.gif');
    status('GIF ' + (bytes.length / 1e6).toFixed(1) + ' MB');
  } catch (e) { console.error(e); status('GIF failed'); }
  finally { sw.restore(); capturing = false; setBusy(false); renderControls(); renderCard(); draw(); }
}

async function exportMP4() {
  if (!animatable()) return;
  if (typeof VideoEncoder === 'undefined' || typeof Mp4Muxer === 'undefined') { status('MP4 needs a newer browser'); return; }
  setBusy(true); capturing = true; status('preparing…'); await tick();
  const sc = 1.5, W = Math.round(EW * sc), H = Math.round(EH * sc), FPS = 30;
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H; const c = oc.getContext('2d');
  const sw = sweep('mp4');
  try {
    let codec = null, mux = null;
    for (const [cs, mc] of [['avc1.640028', 'avc'], ['avc1.4d0028', 'avc'], ['vp09.00.40.08', 'vp9']]) {
      const cfg = { codec: cs, width: W, height: H, bitrate: 8e6, framerate: FPS };
      try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported) { codec = cfg; mux = mc; break; } } catch (e) {}
    }
    if (!codec) { status('MP4 not supported here'); return; }
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: mux, width: W, height: H }, fastStart: 'in-memory' });
    let err = null;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { err = e; } });
    enc.configure(codec);
    for (let i = 0; i < sw.fr.length; i++) {
      sw.fr[i].set(); compose(c, sc, i / FPS);
      const vf = new VideoFrame(oc, { timestamp: Math.round(i * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
      enc.encode(vf, { keyFrame: i % 60 === 0 }); vf.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 5));
      if (err) throw err;
      if (i % 5 === 0) { status(`encoding ${i + 1}/${sw.fr.length}`); await tick(); }
    }
    await enc.flush(); muxer.finalize();
    const buf = muxer.target.buffer;
    saveBlob(new Blob([buf], { type: 'video/mp4' }), slug().replace(/-[^-]*$/, '') + '-animation.mp4');
    status('MP4 ' + (buf.byteLength / 1e6).toFixed(1) + ' MB');
  } catch (e) { console.error(e); status('MP4 failed'); }
  finally { sw.restore(); capturing = false; setBusy(false); renderControls(); renderCard(); draw(); }
}
document.getElementById('bPNG').onclick = exportPNG;
document.getElementById('bGIF').onclick = exportGIF;
document.getElementById('bMP4').onclick = exportMP4;

})();
