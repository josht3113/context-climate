<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doppler Shift Challenge</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="spectra-core.js"></script>
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.setsel { display: flex; align-items: center; gap: 8px; }
.setsel .lbl { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--color-text-secondary); }
.setsel .cc-segmented-btn { font-size: 14px; padding: 9px 15px; }
.top .spacer { flex: 1; }
.links { display: flex; gap: 6px; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #0F1311; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.controls { display: grid; grid-template-columns: minmax(0, 1fr) auto 176px; column-gap: 10px; padding: 8px 10px;
  border-top: 1px solid var(--color-border); background: var(--color-surface); align-items: stretch; }
.snaps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; min-width: 0; }
.snap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; padding: 5px 2px; min-width: 0; }
.snap .n { font-family: var(--font-body); font-weight: 600; font-size: 13px; line-height: 1.12; color: var(--color-text-primary); text-align: center; }
.snap .v { font-family: var(--font-mono); font-weight: 700; font-size: 13px; line-height: 1; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
.reset { font-size: 13px; font-weight: 600; padding: 6px 14px; }
.reset:disabled { opacity: .4; cursor: default; }
.go { font-size: 17px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.go:hover:not(:disabled) { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.go:disabled { opacity: .4; cursor: default; }

.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; color: var(--tool-accent); font-weight: 700;
  padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .sub { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--color-text-secondary); margin-top: 1px; }
.card .tx { font-family: var(--font-body); font-size: 14px; line-height: 1.45; color: var(--color-text-secondary); margin: 8px 0 2px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) { .card .r { padding: 5px 0 4px; } .card .v { font-size: 23px; } }
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 262px; }
  .x-link .nm { display: none; }
  .card { padding: 10px 13px; }
  .card .v { font-size: 22px; } .card .v .u { font-size: 14px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 248px; }
  .top { gap: 12px; }
  .controls { grid-template-columns: minmax(0, 1fr) auto 140px; column-gap: 8px; }
  .snaps { gap: 4px; }
  .exp .cc-btn { padding: 6px 9px; }
  .setsel .lbl { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Doppler Shift Challenge</h1>
    <div class="setsel"><span class="lbl">SET</span><div class="cc-segmented" id="sets"></div></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="links">
      <a class="cc-btn x-link" id="prevLink" target="_top" href="#">&larr; <span class="nm" id="prevName"></span></a>
      <a class="cc-btn x-link" id="nextLink" target="_top" href="#"><span class="nm" id="nextName"></span> &rarr;</a>
    </div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage"><canvas id="cv" tabindex="0" aria-label="Observed spectrum, your reference pattern, and the six element patterns"></canvas></div>
      <div class="controls">
        <div class="snaps" id="snaps"></div>
        <button class="cc-btn reset" id="bReset">Reset</button>
        <button class="cc-btn go" id="bGo">Check</button>
      </div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

<script>
'use strict';
const S = CC_SPECTRA, EL = S.ELEMENTS, ORDER = S.ELEMENT_ORDER;
const RED = S.RED_C, BLUE = S.BLUE_C, ACC = '#3CA3AE', OK = '#2AA87E', BAD = '#D2665A', INK = '#E8E4D9', LABEL = 'rgba(232,228,217,0.66)';
const FD = '"Zilla Slab", Georgia, serif', FB = '"Public Sans", system-ui, sans-serif', FM = '"Courier Prime", ui-monospace, monospace';
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const fmtV = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(Math.round(v)).toLocaleString('en-US');
function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

/* ══ DATA ═══════════════════════════════════════════════════════════════════
   Each set ramps: a wide shift, a dense pattern, one source AT REST, a small
   shift, then a large shift on a busy element. Every pattern stays inside the
   380–760 nm window. */
const SETS = {
  A: [{ el: 'hydrogen', v: 9500 }, { el: 'helium', v: -7200 }, { el: 'oxygen', v: 0 }, { el: 'carbon', v: 3800 }, { el: 'silicon', v: -14000 }],
  B: [{ el: 'helium', v: -10500 }, { el: 'hydrogen', v: 5600 }, { el: 'nitrogen', v: 0 }, { el: 'oxygen', v: -4200 }, { el: 'carbon', v: 16000 }],
  C: [{ el: 'hydrogen', v: -12000 }, { el: 'silicon', v: 6800 }, { el: 'carbon', v: 0 }, { el: 'nitrogen', v: 4600 }, { el: 'helium', v: 15500 }],
  D: [{ el: 'oxygen', v: 8900 }, { el: 'nitrogen', v: -6300 }, { el: 'silicon', v: 0 }, { el: 'hydrogen', v: -3500 }, { el: 'carbon', v: -13200 }]
};
const SET_KEYS = Object.keys(SETS);
const WL0 = 380, WL1 = 760, TOL = 500, DETENT = 300, V_CAP = 26000;
const TEXT = 'Pick the element whose pattern matches the observed spectrum. Then drag its pattern until every line lines up.';
const SRC = 'Rest wavelengths: NYSED ESRT (2026), p. 3. Classical shift λ = λ₀(1 + v/c). Source velocities chosen for visibility.';

/* ══ STATE ══════════════════════════════════════════════════════════════════ */
const ST = { set: 'A', idx: 0, pick: null, alignV: 0, answers: [null, null, null, null, null], show: null, tw: null };
let capturing = false;
const HIT = {};
const item = () => SETS[ST.set][ST.idx];
const checked = () => !!ST.answers[ST.idx];

/* what the reference band displays: the student's pattern, or (once checked) the answer sliding in */
function display() {
  if (ST.show) return ST.show;
  return { el: ST.pick, v: ST.alignV };
}

/* ══ DRAWING ════════════════════════════════════════════════════════════════ */
function geom(w, h) {
  const gut = 132, x = gut, pw = w - gut - 20, top = 16;
  const obsH = clamp(h * 0.15, 50, 110), gap = clamp(h * 0.065, 26, 44), refH = clamp(h * 0.12, 42, 92);
  const obs = { x, y: top, w: pw, h: obsH, wlMin: WL0, wlMax: WL1 };
  const ref = { x, y: top + obsH + gap, w: pw, h: refH, wlMin: WL0, wlMax: WL1 };
  const axisY = ref.y + refH + 20, pickTop = axisY + 18, pg = 6;
  const rh = clamp((h - pickTop - 10 - 5 * pg) / 6, 20, 58);
  const rows = ORDER.map((k, i) => ({ x, y: pickTop + i * (rh + pg), w: pw, h: rh, wlMin: WL0, wlMax: WL1, k }));
  return { obs, ref, gap, axisY, rows };
}
function band(c, p) {
  const v0 = Math.max(p.wlMin, 400), v1 = Math.min(p.wlMax, 700), x0 = S.wlToX(v0, p), x1 = S.wlToX(v1, p);
  const g = c.createLinearGradient(x0, 0, x1, 0);
  for (let i = 0; i <= 48; i++) g.addColorStop(i / 48, S.wavelengthToRGB(lerp(v0, v1, i / 48)));
  c.fillStyle = g; c.fillRect(x0, p.y, x1 - x0, p.h);
  const ir = c.createLinearGradient(x1, 0, p.x + p.w, 0); ir.addColorStop(0, '#2A1412'); ir.addColorStop(1, '#160D0C');
  c.fillStyle = ir; c.fillRect(x1, p.y, p.x + p.w - x1, p.h);
  c.fillStyle = '#140F1C'; c.fillRect(p.x, p.y, x0 - p.x, p.h);
}
/* dark lines on the rainbow; light marks where a line lands outside the visible band */
function lines(c, p, el, v, ws) {
  el.lines.forEach(l => {
    const wl = S.shiftedWl(l.wl, v); if (wl < p.wlMin || wl > p.wlMax) return;
    const x = S.wlToX(wl, p), w = (l.strong ? 4 : 2.2) * (ws || 1);
    c.fillStyle = wl < 400 || wl > 700 ? 'rgba(232,228,217,0.62)' : 'rgba(8,8,8,0.9)'; c.fillRect(x - w / 2, p.y, w, p.h);
  });
}
function frame(c, p, col, lw) { c.strokeStyle = col || 'rgba(232,228,217,0.2)'; c.lineWidth = lw || 1; c.strokeRect(p.x - 0.5, p.y - 0.5, p.w + 1, p.h + 1); }
function gutter(c, p, a, b, bcol) {
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.font = `700 15px ${FB}`; c.fillStyle = INK; c.fillText(a, 14, p.y + p.h / 2 - 2);
  if (b) { c.font = `600 13px ${FB}`; c.fillStyle = bcol || LABEL; c.fillText(b, 14, p.y + p.h / 2 + 16); }
}
function drawScene(c, w, h, live) {
  const G = geom(w, h), it = item(), D = display(), chk = checked(), a = ST.answers[ST.idx];
  c.save();
  c.fillStyle = '#141916'; c.fillRect(0, 0, w, h);
  // observed
  band(c, G.obs); lines(c, G.obs, EL[it.el], it.v, 1.15); frame(c, G.obs);
  gutter(c, G.obs, 'Observed', `Source ${ST.idx + 1}`);
  // the gap: observed lines reach down (solid), reference lines reach up (dashed) — aligned lines meet
  const mid = G.obs.y + G.obs.h + G.gap / 2;
  c.save(); c.beginPath(); c.rect(G.obs.x, G.obs.y, G.obs.w, G.ref.y + G.ref.h - G.obs.y); c.clip();
  EL[it.el].lines.forEach(l => { const x = S.wlToX(S.shiftedWl(l.wl, it.v), G.obs);
    c.strokeStyle = 'rgba(232,228,217,0.62)'; c.lineWidth = l.strong ? 2 : 1.3; c.beginPath(); c.moveTo(x, G.obs.y + G.obs.h + 1); c.lineTo(x, mid); c.stroke(); });
  if (D.el) EL[D.el].lines.forEach(l => { const x = S.wlToX(S.shiftedWl(l.wl, D.v), G.ref);
    c.setLineDash([3, 3]); c.strokeStyle = chk ? 'rgba(42,168,126,0.95)' : 'rgba(60,163,174,0.95)'; c.lineWidth = l.strong ? 2 : 1.3;
    c.beginPath(); c.moveTo(x, G.ref.y - 1); c.lineTo(x, mid); c.stroke(); c.setLineDash([]); });
  c.restore();
  // your reference
  if (D.el) { band(c, G.ref); lines(c, G.ref, EL[D.el], D.v, 1.15); }
  else {
    c.fillStyle = '#0B0E0C'; c.fillRect(G.ref.x, G.ref.y, G.ref.w, G.ref.h);
    c.font = `500 14px ${FB}`; c.fillStyle = LABEL; c.textAlign = 'center'; c.fillText('Pick an element below', G.ref.x + G.ref.w / 2, G.ref.y + G.ref.h / 2 + 5);
  }
  frame(c, G.ref, chk ? OK : D.el ? ACC : null, D.el ? 2 : 1);
  if (chk) gutter(c, G.ref, 'Answer', EL[it.el].name, OK);
  else gutter(c, G.ref, 'Your reference', D.el ? 'drag ⇆' : 'pick below', D.el ? ACC : LABEL);
  // axis
  c.font = `500 13px ${FM}`; c.textBaseline = 'alphabetic';
  for (let wl = 380; wl <= 760; wl += 10) {
    const x = S.wlToX(wl, G.ref), major = wl % 50 === 0;
    c.strokeStyle = major ? 'rgba(232,228,217,0.42)' : 'rgba(232,228,217,0.2)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x + 0.5, G.ref.y + G.ref.h + 2); c.lineTo(x + 0.5, G.ref.y + G.ref.h + (major ? 8 : 5)); c.stroke();
    if (major) { c.fillStyle = LABEL; c.textAlign = 'center'; c.fillText(String(wl), x, G.axisY + 2); }
  }
  c.textAlign = 'left'; c.fillStyle = LABEL; c.fillText('nm', 14, G.axisY + 2);
  // element patterns at rest
  G.rows.forEach(p => {
    const el = EL[p.k], sel = ST.pick === p.k, isTrue = chk && p.k === it.el, wrong = chk && sel && p.k !== it.el;
    c.globalAlpha = !chk && ST.pick && !sel ? 0.82 : 1;
    band(c, p); lines(c, p, el, 0); c.globalAlpha = 1;
    frame(c, p, isTrue ? OK : wrong ? BAD : sel ? ACC : null, isTrue || wrong || sel ? 2.5 : 1);
    if (live && HIT.hoverRow === p.k && !chk && !sel) frame(c, p, 'rgba(232,228,217,0.55)', 1.5);
    c.textBaseline = 'middle'; c.textAlign = 'left';
    c.font = `700 ${clamp(p.h * 0.5, 14, 18)}px ${FD}`; c.fillStyle = sel || isTrue ? INK : 'rgba(232,228,217,0.85)'; c.fillText(el.symbol, 14, p.y + p.h / 2 + 1);
    c.font = `${sel || isTrue ? 700 : 500} 13px ${FB}`; c.fillStyle = sel || isTrue ? INK : LABEL; c.fillText(el.name, 44, p.y + p.h / 2 + 1);
    c.textBaseline = 'alphabetic';
  });
  c.restore();
  if (live) HIT.G = G;
  return G;
}

/* ══ CANVAS ═════════════════════════════════════════════════════════════════ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 800, H = 500, DPR = 1;
function resize() {
  const r = document.getElementById('stage').getBoundingClientRect();
  W = Math.max(200, r.width); H = Math.max(160, r.height); DPR = Math.max(1, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
function draw() { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawScene(ctx, W, H, true); }

/* ══ CARD ═══════════════════════════════════════════════════════════════════ */
const state = v => v > 0 ? 'receding · redshift' : v < 0 ? 'approaching · blueshift' : 'at rest · no shift';
function cardModel() {
  const it = item(), a = ST.answers[ST.idx], v = a ? a.alignV : ST.alignV, pick = a ? a.pick : ST.pick;
  const rows = [
    { l: 'Your element', v: pick ? EL[pick].name : '—' },
    { l: 'Your measurement', v: pick ? fmtV(v) : '—', u: pick ? 'km/s' : '', color: pick ? S.shiftColor(v, 0) : null, sub: pick ? state(v) : '', subColor: pick ? S.shiftColor(v, 0) : null }];
  if (a) {
    rows.push({ l: 'Answer', v: EL[it.el].name, sub: a.elementOK ? '✓ your pick' : `✗ you chose ${EL[a.pick].name}`, subColor: a.elementOK ? OK : BAD });
    rows.push({ l: 'Actual velocity', v: fmtV(it.v), u: 'km/s', color: S.shiftColor(it.v, 0),
      sub: !a.elementOK ? '✗ different pattern' : a.aligned ? '✓ lines up' : `✗ off by ${Math.abs(Math.round(a.alignV - it.v)).toLocaleString('en-US')} km/s`,
      subColor: a.elementOK && a.aligned ? OK : BAD });
  }
  return { eb: `Set ${ST.set} · Source ${ST.idx + 1} of 5`, intro: TEXT, rows };
}
const upLatin = s => String(s).replace(/[a-z]/g, ch => ch.toUpperCase());
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
let lastCard = '';
function renderCard() {
  const m = cardModel(), key = JSON.stringify(m); if (key === lastCard) return; lastCard = key;
  document.getElementById('card').innerHTML = `<div class="eb">${esc(upLatin(m.eb))}</div><p class="tx">${esc(m.intro)}</p>` + m.rows.map(r =>
    `<div class="r"><div class="l">${esc(upLatin(r.l))}</div><div class="v"${r.color ? ` style="color:${r.color}"` : ''}>${esc(r.v)}${r.u ? `<span class="u">${esc(r.u)}</span>` : ''}</div>` +
    (r.sub ? `<div class="sub"${r.subColor ? ` style="color:${r.subColor}"` : ''}>${esc(r.sub)}</div>` : '') + '</div>').join('') + `<div class="src">${esc(SRC)}</div>`;
}

/* ══ CONTROLS ═══════════════════════════════════════════════════════════════ */
const setsEl = document.getElementById('sets'), snapsEl = document.getElementById('snaps');
setsEl.innerHTML = SET_KEYS.map(k => `<button class="cc-segmented-btn" data-s="${k}">${k}</button>`).join('');
setsEl.querySelectorAll('[data-s]').forEach(b => b.onclick = () => loadSet(b.dataset.s));
snapsEl.innerHTML = [0, 1, 2, 3, 4].map(i => `<button class="cc-btn snap" data-i="${i}"><span class="n">Source ${i + 1}</span><span class="v"></span></button>`).join('');
snapsEl.querySelectorAll('.snap').forEach(b => b.onclick = () => loadItem(+b.dataset.i));
document.getElementById('bReset').onclick = () => { if (!checked()) { ST.alignV = 0; refresh(); } };
document.getElementById('bGo').onclick = go;
let lastCtl = '';
function syncControls() {
  const chk = checked(), open = ST.answers.findIndex(a => !a);
