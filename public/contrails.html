<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrails</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-hourly); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 24px; }
.top .spacer { flex: 1; min-width: 0; }
.units .cc-segmented-btn { padding: 8px 13px; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 190px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.pmenu.open { display: flex; }
.pmenu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; }
.pmenu button:hover { background: var(--color-surface); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #191E1B; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* control bar */
.controls { border-top: 1px solid var(--color-border); background: var(--color-surface); }
.cb { display: flex; align-items: stretch; gap: 10px; padding: 8px 10px; min-height: 64px; }
.snaps { flex: 1; display: grid; gap: 6px; min-width: 0; }
.snaps.s4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.snaps.s5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.snap { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 10px; min-width: 0; text-align: left; }
.snaps.s5 .snap { align-items: center; text-align: center; padding: 5px 4px; }
.snap .n { font-family: var(--font-body); font-weight: 600; font-size: 15px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.snap .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.15; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
.tm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tm .snaps { flex: none; }
.tsl { padding: 0 calc((100% - 24px) / 10); }
.tsl input { width: 100%; margin: 0; accent-color: var(--tool-accent); height: 18px; cursor: pointer; display: block; }
.play { width: 112px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); line-height: 1.1;
  box-shadow: 0 0 0 0 rgba(109,150,216,0); animation: glow 2.4s ease-in-out infinite; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 20px; }
.play.busy { animation: none; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(109,150,216,0); } 50% { box-shadow: 0 0 0 5px rgba(109,150,216,.28); } }
@media (prefers-reduced-motion: reduce) { .play { animation: none; } }
.sl { width: 236px; flex: none; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.slr { display: flex; flex-direction: column; gap: 0; }
.sll { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sll span { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.sll b { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--color-text-primary); white-space: nowrap; }
.slr input { width: 100%; margin: 0; accent-color: var(--tool-accent); height: 18px; cursor: pointer; display: block; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .hd { display: flex; align-items: center; gap: 10px; padding: 9px 0 8px; border-bottom: 1px solid var(--color-border); }
.card .hd .sw { width: 46px; height: 34px; border-radius: 5px; flex: none; display: flex; align-items: center; justify-content: center; }
.card .hd .sw svg { width: 40px; height: 26px; }
.card .hd .nm { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.05; }
.card .hd .sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 4px; }
.card .v.sm { font-size: 20px; }
.card .d { font-family: var(--font-body); font-size: 13px; color: var(--color-text-secondary); line-height: 1.35; margin-top: 1px; }
.card .fl { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .fl .dot { width: 12px; height: 12px; border-radius: 50%; }
.card .fl .fn { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--color-text-primary); white-space: nowrap; }
.card .fl .fs { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.card .fl .fst { font-weight: 400; font-size: 13px; color: var(--color-text-secondary); margin-left: 8px; }
.card .fl .fv { font-family: var(--font-display); font-size: 20px; font-weight: 700; text-align: right; white-space: nowrap; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 21px; }
  .card .v.sm { font-size: 18px; }
  .card .hd { padding: 6px 0 5px; }
  .card .hd .nm { font-size: 24px; }
  .card .fl { padding: 5px 0 4px; }
  .cb { min-height: 56px; padding: 6px 10px; }
  .snap { padding: 4px 8px; }
}
@media (max-height: 640px) {
  .snaps.s5 .snap { padding: 3px 2px; }
  .snaps.s5 .snap .n { font-size: 14px; }
  .play { flex-direction: row; gap: 6px; font-size: 15px; }
  .card .src { font-size: 13px; }
}
@media (max-height: 600px) { .card .src { display: none; } }
@media (max-height: 560px) { .card .d { display: none; } }
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 18px; } }
@media (max-width: 1366px) {
  .main { grid-template-columns: minmax(0, 1fr) 272px; }
  .sl { width: 214px; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .top { gap: 10px; }
  .top h1 { font-size: 22px; }
  .card { padding: 10px 13px; }
  .card .v { font-size: 21px; }
  .card .hd .nm { font-size: 24px; }
  .exp .cc-btn { padding: 6px 9px; }
  .units .cc-segmented-btn { padding: 8px 10px; }
  .play { width: 96px; }
  .sl { width: 196px; }
  .snap { padding: 6px 8px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .tabs .cc-segmented-btn { padding: 11px 13px; }
  .sl { width: 180px; }
  .play { width: 84px; font-size: 15px; }
  .snap .n { font-size: 14px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Contrails</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="form">Form</button>
      <button class="cc-segmented-btn" data-tab="persist">Persist</button>
      <button class="cc-segmented-btn" data-tab="spread">Spread</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="cc-segmented units" id="units">
      <button class="cc-segmented-btn is-active" data-u="C">°C</button>
      <button class="cc-segmented-btn" data-u="F">°F</button>
    </div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="pmenu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage"><canvas id="cv"></canvas></div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

/* ═══════════════════════════ SKY VIEW (Spread) ═══════════════════════ */
const TREES = (() => { const r = rnd(31), a = []; for (let e = 0; e < 4; e++) { const n = e % 2 ? 16 : 22; for (let i = 0; i < n; i++) a.push({ e, t: (i + r() * 0.9) / n, r: 0.016 + r() * 0.03, d: -0.01 + r() * 0.012 }); } return a; })();

}

/* ═══════════════════════════ HUMIDITY PROFILE (Spread) ═══════════════ */
