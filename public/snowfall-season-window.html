// Station search (same finder as the heatmaps and Current Conditions)
let ddIdx = -1;
function findNearestStation() {
  const btn = $('locate-btn');
  if (!navigator.geolocation) { alert('Geolocation is not supported by this browser.'); return; }
  const orig = btn.innerHTML; btn.classList.add('loading'); btn.innerHTML = '&#8987; Locating…';
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove('loading'); btn.innerHTML = orig;
    const { latitude: lat, longitude: lon } = pos.coords;
    const ranked = Object.values(STATIONS).map(s => ({ s, dist: haversineMiles(lat, lon, s.lat, s.lon) }))
      .sort((a, b) => a.dist - b.dist).slice(0, 8);
    $('si').value = '';
    renderDD(ranked.map(r => r.s), ranked.map(r => r.dist));
  }, err => {
    btn.classList.remove('loading'); btn.innerHTML = orig;
    alert('Could not get your location: ' + (err && err.message ? err.message : 'permission denied or unavailable.'));
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
}
function initSearch() {
  const inp = $('si'), dd = $('dd');
  const all = Object.values(STATIONS);
  inp.addEventListener('input', () => {
    ddIdx = -1; const q = inp.value.trim().toLowerCase();
    if (!q) { dd.classList.remove('open'); return; }
    renderDD(all.filter(s => s.id.toLowerCase().startsWith(q) || s.id.slice(1).toLowerCase().startsWith(q) ||
                             s.name.toLowerCase().includes(q) || s.st.toLowerCase() === q).slice(0, 18));
  });
  inp.addEventListener('keydown', e => {
    const items = dd.querySelectorAll('.d-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); ddIdx = Math.min(ddIdx + 1, items.length - 1); highlightDD(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ddIdx = Math.max(ddIdx - 1, 0); highlightDD(items); }
    else if (e.key === 'Enter') { e.preventDefault(); if (ddIdx >= 0 && items[ddIdx]) items[ddIdx].click(); else if (items[0]) items[0].click(); }
    else if (e.key === 'Escape') { dd.classList.remove('open'); }
  });
  document.addEventListener('click', e => { if (!$('sw').contains(e.target)) dd.classList.remove('open'); });
  $('locate-btn').addEventListener('click', findNearestStation);
}
function highlightDD(items) { items.forEach((el, i) => { el.classList.toggle('hi', i === ddIdx); if (i === ddIdx) el.scrollIntoView({ block: 'nearest' }); }); }
function renderDD(matches, dists) {
  const dd = $('dd');
  if (!matches.length) { dd.classList.remove('open'); return; }
  dd.innerHTML = matches.map((s, i) => `<div class="d-item"><span class="d-id">${s.id}</span><span class="d-name">${esc(s.name)}</span>` +
    (dists ? `<span class="d-dist">${dists[i].toFixed(0)}mi</span>` : '') + `<span class="d-st">${s.st}</span></div>`).join('');
  dd.querySelectorAll('.d-item').forEach((el, i) => el.addEventListener('click', () => {
    $('si').value = ''; dd.classList.remove('open'); selectStation(matches[i].id);
  }));
  dd.classList.add('open');
}

//  Export — composed offscreen at EXPORT_SCALE
// ═══════════════════════════════════════════════
const VIEW_NAME = { days: 'Snow days', window: 'Season window', nearby: 'Nearby stations' };
const ORDER_NAME = { year: '', enso: 'grouped by ENSO phase', total: 'sorted by season total', first: 'sorted by first date', last: 'sorted by last date' };
const RANGE_NAME = { all: 'all seasons', '50': 'last 50 seasons', '30': 'last 30 seasons', '1991': '1991–2020' };
function exportLines() {
  const F = FIELDS[ui.field], th = TH[ui.th];
  if (ui.view === 'nearby') {
    return {
      context: `Nearby stations · ${F.label.toLowerCase()} · ${F.day} ${th.label}`,
      meta: `Median and middle 50% of first and last dates · seasons ${seasonLabel(CMP_FROM)} to ${seasonLabel(CMP_TO)}`,
      lines: [],
    };
  }
  const m = M, st = m.st;
  const ctx = [VIEW_NAME[ui.view], F.label.toLowerCase(), `${F.day} ${th.label}`, RANGE_NAME[ui.range]];
  if (ORDER_NAME[m.order]) ctx.push(ORDER_NAME[m.order]);
  const out = {
    context: ctx.join(' · '),
    meta: `${plural(st.n, 'complete season')}${st.n ? `, ${seasonLabel(st.y0)} to ${seasonLabel(st.y1)}` : ''}${ds.name ? ' · ' + ds.name : ''}`,
    lines: [],
  };
  if (m.pin) {
    const s = m.pin, sm = s.sum[m.k];
    out.lines.push({ bold: true, text: sm.first === null
      ? `${seasonLabel(s.sy)}  ·  no ${F.day} ${th.label}  ·  snowfall ${inch(s.total)}`
      : `${seasonLabel(s.sy)}  ·  First ${ciLabel(sm.first)}  ·  ${s.current ? 'Latest' : 'Last'} ${ciLabel(sm.last)}  ·  ${sm.win} days  ·  ${plural(sm.n, F.day)}  ·  snowfall ${inch(s.total)}` });
    out.lines.push({ text: pinLine(m).replace(/<[^>]+>/g, '') });
  }
  if (st.nWith) out.lines.push({ bold: !m.pin, text: `Median first ${ciLabel(st.first.med)}  ·  Median last ${ciLabel(st.last.med)}  ·  Median window ${Math.round(st.win.med)} days  ·  ${f1(st.days)} ${F.days.toLowerCase()} / season  ·  ${inch(st.total)} snowfall / season` });
  if (!m.pin && m.now && m.now.lastRep >= 0) {
    const nw = m.now;
    out.lines.push({ text: nw.sm.first === null
      ? `${seasonLabel(nw.cur.sy)}: no ${F.day} ${th.label} as of ${ciLabel(TODAY_CI)}  ·  ${nw.byToday} of ${nw.n} seasons had one by this date  ·  ${nw.afterToday} of ${nw.n} had one after it`
      : `${seasonLabel(nw.cur.sy)}: first ${F.day} ${th.label} on ${ciLabel(nw.sm.first)}  ·  earlier than ${nw.laterThan} of ${nw.n} seasons` });
  }
  if (m.trends) {
    const t = m.trends;
    const fmt = (x, words) => x ? `${f1(Math.abs(x.slope * 10))} d/decade ${x.slope >= 0 ? words[0] : words[1]} (${fmtP(x.p)})` : '—';
    out.lines.push({ text: `Trend (Sen's slope)  ·  first ${fmt(t.first, ['later', 'earlier'])}  ·  last ${fmt(t.last, ['later', 'earlier'])}  ·  window ${fmt(t.win, ['longer', 'shorter'])}` });
  }
  return out;
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function wrapParts(c, text, maxW) {
  const SEP = '  ·  ', parts = text.split(SEP), out = [];
  let cur = '';
  parts.forEach(p => {
    const t = cur ? cur + SEP + p : p;
    if (cur && c.measureText(t).width > maxW) { out.push(cur); cur = '    ' + p; } else cur = t;
  });
  if (cur) out.push(cur);
  return out;
}
function fitText(c, text, x, y, maxW, size, weight) {
  let sz = size;
  c.font = `${weight}${sz}px ${MONO}`;
  while (sz > 11 && c.measureText(text).width > maxW) { sz -= 0.5; c.font = `${weight}${sz}px ${MONO}`; }
  c.fillText(text, x, y);
}
async function composeExport() {
  await document.fonts.ready;
  const W = 1400, PAD = 32, CARD = 14, innerW = W - PAD * 2, chartW = innerW - CARD * 2;
  const nearby = ui.view === 'nearby';
  const chartH = nearby ? Math.max(200, 50 + (NB ? NB.rows.length : 0) * 40) : 640;
  const lines = exportLines();
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = `13px ${MONO}`;
  const items = nearby
    ? [{ k: 'line', color: '#7F9FC4', text: 'Median first → median last' }, { k: 'band', text: 'Middle 50%' }, { k: 'sw', color: C.accent, text: currentStation.label }]
    : legendItems(M);
  const rows = [[]]; let w = 0;
  items.forEach(it => {
    const sw = it.k === 'tick' ? it.w : it.k === 'grad' ? 46 : ['line', 'today'].includes(it.k) ? 22 : it.k === 'band' || it.k === 'area' ? 16 : it.k === 'rail' ? 4 : 12;
    const iw = sw + 7 + meas.measureText(it.text).width;
    if (w && w + 18 + iw > chartW) { rows.push([]); w = 0; }
    rows[rows.length - 1].push({ ...it, iw, sw });
    w += (w ? 18 : 0) + iw;
  });
  const extra = [];
  lines.lines.forEach(l => {
    meas.font = `${l.bold ? '700 14' : '13'}px ${MONO}`;
    wrapParts(meas, l.text, innerW).forEach(t => extra.push({ text: t, bold: l.bold }));
  });
  const cardH = CARD + rows.length * 22 + 6 + chartH + CARD;
  const H = PAD + 36 + 22 + 30 + cardH + 16 + extra.length * 22 + 14 + 26 + PAD - 12;

  const off = document.createElement('canvas');
  off.width = Math.round(W * EXPORT_SCALE); off.height = Math.round(H * EXPORT_SCALE);
  const c = off.getContext('2d');
  c.scale(EXPORT_SCALE, EXPORT_SCALE);
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  c.textBaseline = 'top'; c.textAlign = 'left';
  let y = PAD;
  c.fillStyle = C.accent; c.font = `700 26px ${DISPLAY}`;
  c.fillText('Snowfall Season Window', PAD, y);
  const tw = c.measureText('Snowfall Season Window').width;
  c.fillStyle = C.text; c.font = `700 15px ${MONO}`;
  c.fillText(`${currentStation.label} · ${currentStation.id}`.toUpperCase(), PAD + tw + 16, y + 8);
  y += 36;
  c.fillStyle = C.text2; fitText(c, lines.context, PAD, y, innerW, 13, ''); y += 22;
  c.fillStyle = C.muted; fitText(c, lines.meta, PAD, y, innerW, 13, ''); y += 30;

  c.fillStyle = C.surface; roundRect(c, PAD, y, innerW, cardH, 6); c.fill();
  c.strokeStyle = 'rgba(232,228,217,0.14)'; c.lineWidth = 1; roundRect(c, PAD + 0.5, y + 0.5, innerW - 1, cardH - 1, 6); c.stroke();
  let cy = y + CARD;
  rows.forEach(row => {
    let x = PAD + CARD;
    row.forEach(it => {
      drawLegendItem(c, it, x, cy + 8);
      c.font = `13px ${MONO}`; c.fillStyle = C.text2; c.textBaseline = 'top'; c.textAlign = 'left';
      c.fillText(it.text, x + it.sw + 7, cy + 1);
      x += it.iw + 18;
    });
    cy += 22;
  });
  cy += 6;
  c.save();
  c.translate(PAD + CARD, cy);
  c.beginPath(); c.rect(0, 0, chartW, chartH); c.clip();
  if (nearby) drawNearby(c, chartW, chartH, NB); else drawMain(c, chartW, chartH, M);
  c.restore();
  y += cardH + 16;
  c.textBaseline = 'top'; c.textAlign = 'left';
  extra.forEach(l => {
    c.fillStyle = l.bold ? C.text : C.text2;
    fitText(c, l.text, PAD, y, innerW, l.bold ? 14 : 13, l.bold ? '700 ' : '');
    y += 22;
  });
  y += 14;
  c.textBaseline = 'alphabetic';
  c.fillStyle = C.accent; c.font = `700 14px ${MONO}`;
  c.fillText('contextclimate.io', PAD, y + 10);
  const credW = c.measureText('contextclimate.io').width + 24;
  c.fillStyle = C.muted; c.textAlign = 'right';
  const src = `Data: NOAA ACIS daily ${ui.field === 'cover' ? 'snow depth' : 'snowfall, min temp ≤ 40°F'}${!nearby && M && (M.ensoOn || M.order === 'enso') ? ' · ENSO: HadISST 1.1 Niño 3.4, DJF, CPC base' : ''}`;
  fitText(c, src, W - PAD, y + 10, innerW - credW, 12, '');
  return off;
}
function exportName() {
  const thn = { T: 'trace', '01': '0.1in', '1': '1in', '3': '3in', '6': '6in', c1: 'cover1in', c3: 'cover3in', c6: 'cover6in' }[ui.th];
  return `snowfall-season-window_${currentStation.id}_${ui.view}_${thn}${ui.order !== 'year' && ui.view !== 'nearby' ? '_' + ui.order : ''}.png`;
}
function flash(btn, cls, text, orig) {
  btn.textContent = text; btn.classList.add(cls);
  setTimeout(() => { btn.textContent = orig; btn.classList.remove(cls); btn.disabled = false; }, 2000);
}
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function exportImage(kind) {
  const btn = kind === 'copy' ? $('copy-btn') : $('png-btn');
  const orig = btn.textContent;
  if (!G || !$('state').hidden) return;
  btn.disabled = true; btn.textContent = 'Rendering…';
  try {
    const off = await composeExport();
    const blob = await new Promise(res => off.toBlob(res, 'image/png'));
    if (kind === 'copy' && navigator.clipboard && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        flash(btn, 'is-ok', '✓ Copied', orig);
        return;
      } catch (e) { /* clipboard blocked: fall through to download */ }
    }
    downloadBlob(blob, exportName());
    flash(btn, 'is-ok', '✓ Saved', orig);
  } catch (err) {
    console.error('Export failed:', err);
    flash(btn, 'is-error', '⚠ Failed', orig);
  }
}

// Read-only hook for automated checks
window.__snowState = () => ({ ui: { ...ui }, pinned, station: currentStation && currentStation.id, M, G, NB, ds, TODAY_CI, CUR_SY });

// ═══════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════
(function init() {
  const p = new URLSearchParams(location.search);
  const st = (p.get('st') || '').toUpperCase();
  if (['days', 'window', 'nearby'].includes(p.get('view'))) ui.view = p.get('view');
  if (p.get('field') === 'cover') { ui.field = 'cover'; ui.th = 'c1'; }
  if (p.get('th') && FIELDS[ui.field].ths.includes(p.get('th'))) { ui.th = p.get('th'); ui.thBy[ui.field] = ui.th; }
  if (['all', '50', '30', '1991'].includes(p.get('range'))) ui.range = p.get('range');
  if (['year', 'enso', 'total', 'first', 'last'].includes(p.get('order'))) ui.order = p.get('order');

  document.querySelectorAll('#view-seg .cc-segmented-btn').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  document.querySelectorAll('#field-seg .cc-segmented-btn').forEach(b => b.addEventListener('click', () => setField(b.dataset.field)));
  $('range-sel').addEventListener('change', e => { ui.range = e.target.value; render(); });
  $('order-sel').addEventListener('change', e => { ui.order = e.target.value; buildControls(); render(); });
  $('copy-btn').addEventListener('click', () => exportImage('copy'));
  $('png-btn').addEventListener('click', () => exportImage('png'));
  $('pin-chip').addEventListener('click', () => { pinned = null; render(); });
  ov.addEventListener('mousemove', onMove);
  ov.addEventListener('mouseleave', () => { hideTip(); clearOverlay(); });
  ov.addEventListener('click', onClick);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && pinned !== null) { pinned = null; render(); } });
  let raf = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { if (sizeCanvases()) render(); });
  }).observe($('stage'));
  initSearch();
  buildControls();
  loadENSO();
  loadStation(STATIONS[st] || STATIONS[DEFAULT_ID]);
})();
</script>
