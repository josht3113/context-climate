<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESS Vocabulary</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-seasons); --ok: #6FA85C; --bad: #DE7767; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; min-height: 44px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-family: var(--font-display); font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 15px; padding: 11px 22px; }
.top .spacer { flex: 1; }
.deckchip { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
.deckchip b { color: var(--color-text-primary); font-size: 17px; }

/* layout */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 10px; }
.pane { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); min-height: 0; min-width: 0; }

/* rail */
.rail { display: flex; flex-direction: column; overflow: hidden; }
.rail .scroll { flex: 1; overflow-y: auto; padding: 10px 10px 6px; }
.rl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-muted); margin: 4px 2px 8px; }
.ch { border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-bottom: 8px; background: var(--color-surface-2); }
.ch.is-active { border-color: var(--tool-accent); }
.ch-head { display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px 8px; cursor: pointer; user-select: none; }
.box { width: 16px; height: 16px; border: 1.5px solid var(--color-text-muted); border-radius: 3px; flex: 0 0 auto; margin-top: 2px; position: relative; }
.ch.is-active .box, .sec.is-active .box { background: var(--tool-accent); border-color: var(--tool-accent); }
.ch.is-active .box::after, .sec.is-active .box::after { content: ''; position: absolute; left: 4px; top: 0px; width: 5px; height: 10px; border: solid var(--color-bg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.ch-name { flex: 1; min-width: 0; }
.ch-n { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--color-text-secondary); text-transform: uppercase; }
.ch-t { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.15; color: var(--color-text-primary); }
.mbar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.mtrack { flex: 1; height: 6px; border-radius: 3px; background: rgba(232,228,217,0.10); overflow: hidden; }
.mfill { height: 100%; background: var(--tool-accent); width: 0; transition: width .3s ease; }
.mval { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); min-width: 34px; text-align: right; }
.exp { background: none; border: 0; color: var(--color-text-muted); cursor: pointer; font-size: 15px; padding: 0 2px; line-height: 1; margin-top: 1px; }
.exp:hover { color: var(--color-text-primary); }
.secs { display: none; padding: 0 10px 8px 35px; }
.ch.open .secs { display: block; }
.sec { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; user-select: none; font-size: 13.5px; color: var(--color-text-secondary); line-height: 1.25; }
.sec .box { width: 13px; height: 13px; margin-top: 0; }
.sec.is-active { color: var(--color-text-primary); }
.sec.is-active .box::after { left: 3px; top: -1px; width: 4px; height: 8px; }
.types { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 10px; }
.types .cc-btn { padding: 6px 10px; font-size: 13px; }
.types .cc-btn.is-active { border-color: var(--tool-accent); color: var(--color-text-primary); background: rgba(214,126,96,0.12); }
.rail-foot { border-top: 1px solid var(--color-border); padding: 8px 10px; display: flex; gap: 8px; align-items: center; }
.rail-foot .cc-btn { padding: 6px 10px; font-size: 13px; }
.rail-foot .sp { flex: 1; }

/* stage */
.stage { display: flex; flex-direction: column; overflow: hidden; position: relative; }
.bar { display: flex; align-items: center; gap: 10px; min-height: 40px; flex: 0 0 auto; }
.bar .cc-segmented-btn { padding: 7px 13px; font-size: 14px; }
.bar .cc-btn { padding: 7px 13px; font-size: 14px; }
.bar .sp { flex: 1; }
.stat { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
.stat b { color: var(--color-text-primary); font-size: 16px; }
.body { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 18px 22px; overflow: auto; }
.view { display: none; width: 100%; max-width: 1000px; height: 100%; flex-direction: column; align-items: stretch; gap: 12px; }
.vbody { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.view.is-active { display: flex; }
.empty { display: none; font-family: var(--font-mono); font-size: 15px; color: var(--color-text-muted); }
.stage.no-deck .view { display: none !important; }
.stage.no-deck .empty { display: block; }

/* tags */
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tg { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--color-border); color: var(--color-text-secondary); white-space: nowrap; }
.tg.t-Science { border-color: rgba(109,150,216,.55); color: #9DB8E6; }
.tg.t-Academic { border-color: rgba(160,140,198,.55); color: #BFB0DC; }
.tg.t-Dual-meaning { border-color: rgba(208,132,37,.6); color: #E2A55A; }
.tg.t-Person { border-color: rgba(42,168,126,.55); color: #6CC7A6; }
.tg.ref { border-color: rgba(183,143,54,.55); color: #D3B46A; }
.dots { display: inline-flex; gap: 4px; margin-left: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(232,228,217,0.15); }
.dots i.on { background: var(--tool-accent); }

/* flashcard */
.fc { position: relative; flex: 1 1 auto; min-height: 300px; max-height: 460px; perspective: 1600px; cursor: pointer; }
.fc-in { position: relative; width: 100%; height: 100%; transition: transform .45s ease; transform-style: preserve-3d; }
.fc.flipped .fc-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); padding: 18px 24px; display: flex; flex-direction: column; overflow: hidden; }
.face.back { transform: rotateY(180deg); }
.face .fhead { display: flex; align-items: center; gap: 8px; }
.face .fhead .sp { flex: 1; }
.front .big { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px 20px; }
.front .big .term { font-family: var(--font-display); font-weight: 700; font-size: 46px; line-height: 1.1; }
.front .big .defn { font-family: var(--font-body); font-size: 26px; line-height: 1.35; max-width: 760px; }
.back .bgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 18px; align-items: center; margin-top: 6px; }
.back .bgrid.noimg { grid-template-columns: minmax(0,1fr); }
.back .bterm { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin-bottom: 8px; }
.back .bdef { font-size: 22px; line-height: 1.4; }
.back dl { margin: 14px 0 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 5px 12px; font-size: 16px; }
.back dt { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); padding-top: 3px; white-space: nowrap; }
.back dd { margin: 0; color: var(--color-text-secondary); }
.fig { width: 300px; max-width: 34vw; }
.fig svg { width: 100%; height: auto; display: block; }
.toollink { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--tool-accent); text-decoration: none; border: 1px solid rgba(214,126,96,.5); border-radius: var(--radius-md); padding: 6px 11px; }
.toollink:hover { background: rgba(214,126,96,.12); }
.grade { display: flex; gap: 10px; justify-content: center; }
.grade .cc-btn { min-width: 170px; padding: 12px 18px; font-size: 16px; font-weight: 600; }
.grade .miss:hover { border-color: var(--bad); color: var(--bad); }
.grade .got:hover { border-color: var(--ok); color: var(--ok); }
.grade .flipbtn { min-width: 360px; }
kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid var(--color-border-hover); border-radius: 3px; padding: 0 4px; margin-left: 8px; color: var(--color-text-muted); }

/* best word */
.bw-card { background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); padding: 26px 30px; }
.bw-sent { font-family: var(--font-body); font-size: 28px; line-height: 1.45; margin: 14px 0 4px; }
.blank { display: inline-block; min-width: 150px; border-bottom: 3px solid var(--tool-accent); text-align: center; padding: 0 6px; color: var(--tool-accent); font-weight: 600; }
.blank.ok { color: var(--ok); border-color: var(--ok); }
.blank.bad { color: var(--bad); border-color: var(--bad); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { text-align: left; font-family: var(--font-display); font-weight: 600; font-size: 21px; padding: 14px 18px; background: var(--color-surface); border: 1px solid var(--color-border-hover); color: var(--color-text-primary); border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: 12px; }
.choice .k { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); border: 1px solid var(--color-border-hover); border-radius: 3px; padding: 0 6px; }
.choice:hover:not(:disabled) { border-color: var(--tool-accent); }
.choice.ok { border-color: var(--ok); background: rgba(111,168,92,.14); }
.choice.bad { border-color: var(--bad); background: rgba(222,119,103,.12); }
.choice:disabled { cursor: default; }
.typein { display: none; gap: 10px; }
.typein input { flex: 1; font-family: var(--font-display); font-size: 22px; padding: 12px 16px; background: var(--color-surface); color: var(--color-text-primary); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); outline: none; }
.typein input:focus { border-color: var(--tool-accent); }
.typein .cc-btn { padding: 12px 18px; font-size: 16px; }
.view.typing .choices { display: none; }
.view.typing .typein { display: flex; }
.after { display: none; align-items: center; gap: 14px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 12px 16px; }
.after.show { display: flex; }
.after .res { font-family: var(--font-display); font-weight: 700; font-size: 20px; white-space: nowrap; }
.after .res.ok { color: var(--ok); } .after .res.bad { color: var(--bad); }
.after .adef { flex: 1; font-size: 16px; color: var(--color-text-secondary); }
.after .adef b { color: var(--color-text-primary); }
.after .cc-btn { padding: 10px 18px; font-size: 15px; font-weight: 600; }

/* which one */
.w1-bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bin { min-height: 92px; background: var(--color-surface-2); border: 1.5px solid var(--color-border-hover); border-radius: var(--radius-lg); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px; color: var(--color-text-primary); }
.bin:hover { border-color: var(--tool-accent); }
.bin .bn { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; text-align: center; }
.bin .bk { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }
.bin.ok { border-color: var(--ok); background: rgba(111,168,92,.14); }
.bin.bad { border-color: var(--bad); background: rgba(222,119,103,.12); }
.w1-card { background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); padding: 24px 28px; min-height: 150px; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.w1-kind { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-muted); }
.w1-text { font-size: 25px; line-height: 1.4; }
.w1-prog { display: flex; gap: 6px; justify-content: center; }
.w1-prog i { width: 26px; height: 6px; border-radius: 3px; background: rgba(232,228,217,0.14); }
.w1-prog i.ok { background: var(--ok); } .w1-prog i.bad { background: var(--bad); } .w1-prog i.cur { background: var(--tool-accent); }
.w1-done { display: none; flex-direction: column; align-items: center; gap: 14px; }
.w1-done .big { font-family: var(--font-display); font-weight: 700; font-size: 40px; }
.w1-done .row { display: flex; gap: 10px; }
.w1-done .cc-stat-chip { min-width: 140px; }
.view.done .w1-bins, .view.done .w1-card, .view.done .w1-prog { display: none; }
.view.done .w1-done { display: flex; }

/* diagram strokes (inline SVG) */
.vd { font-family: var(--font-mono); }
.vd .ln { stroke: var(--color-text-primary); stroke-width: 1.5; }
.vd .mu { stroke: var(--color-text-muted); stroke-width: 1.2; }
.vd .ac { stroke: var(--tool-accent); stroke-width: 1.6; }
.vd .ac2 { stroke: #9DB8E6; }
.vd .w2 { stroke-width: 2; } .vd .w3 { stroke-width: 3; stroke-linecap: round; } .vd .w4 { stroke-width: 4; stroke-linecap: round; } .vd .w5 { stroke-width: 5; stroke-linecap: round; }
.vd .acf { fill: var(--tool-accent); }
.vd .coolf { fill: #6D96D8; }
.vd .dotf { fill: var(--color-text-secondary); }
.vd .starf { fill: #F3EBD0; }
.vd .sunf { fill: #E8C25A; }
.vd .sunray { stroke: #E8C25A; stroke-width: 1.3; opacity: .75; }
.vd .earthf { fill: #2F5D78; }
.vd .earthf2 { fill: #5B9BD5; }
.vd .planetf { fill: #B9A88C; }
.vd .nightf { fill: rgba(10,12,11,0.62); }
.vd .waterf { fill: rgba(91,155,213,0.35); }
.vd .rockf { fill: #8C8274; }
.vd .wedgef { fill: rgba(214,126,96,0.35); stroke: var(--tool-accent); stroke-width: 1; }
.vd .atmf { fill: rgba(91,155,213,0.12); }
.vd .groundf { fill: rgba(140,130,116,0.25); }
.vd .streak { stroke: #F0C36A; }
.vd .tx { fill: var(--color-text-secondary); font-size: 12px; }
.vd .tx.sm { font-size: 11px; } .vd .tx.xs { font-size: 9.5px; } .vd .tx.big { font-size: 18px; }
.vd .ac-t { fill: var(--tool-accent); }

@media (max-width: 1280px) {
  .main { grid-template-columns: 250px minmax(0,1fr); }
  .front .big .term { font-size: 40px; }
  .bw-sent { font-size: 24px; }
  .fig { width: 250px; }
  .top .sub { display: none; }
}
@media (max-height: 700px) {
  .fc { min-height: 260px; }
  .bw-card { padding: 18px 22px; }
  .bw-sent { font-size: 23px; }
  .w1-text { font-size: 21px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1>Vocabulary</h1><div class="sub">Earth &amp; Space Science</div></div>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-mode="fc">Flashcards</button>
      <button class="cc-segmented-btn" data-mode="bw">Best Word</button>
      <button class="cc-segmented-btn" data-mode="w1">Which One?</button>
    </div>
    <div class="spacer"></div>
    <div class="deckchip"><b id="deckN">0</b> terms</div>
  </div>

  <div class="main">
    <aside class="pane rail">
      <div class="scroll">
        <div class="rl">Chapters</div>
        <div id="chapters"></div>
        <div class="rl" style="margin-top:12px">Word type</div>
        <div class="types" id="types"></div>
      </div>
      <div class="rail-foot">
        <button class="cc-btn" id="allCh">All chapters</button>
        <span class="sp"></span>
        <button class="cc-btn" id="reset">Reset progress</button>
      </div>
    </aside>

    <section class="pane stage" id="stage">
      <div class="empty" id="empty">No terms selected</div>

      <!-- FLASHCARDS -->
      <div class="view is-active" id="v-fc">
        <div class="bar">
          <div class="cc-segmented" id="fcDir">
            <button class="cc-segmented-btn is-active" data-dir="t">Term first</button>
            <button class="cc-segmented-btn" data-dir="d">Definition first</button>
          </div>
          <button class="cc-btn" id="fcShuffle">Shuffle</button>
          <span class="sp"></span>
          <span class="stat">Card <b id="fcPos">1</b> / <span id="fcLen">0</span></span>
          <span class="stat">Got it <b id="fcGot">0</b></span>
        </div>
        <div class="vbody">
        <div class="fc" id="fc">
          <div class="fc-in">
            <div class="face front" id="fcFront"></div>
            <div class="face back" id="fcBack"></div>
          </div>
        </div>
        <div class="grade" id="fcGrade"></div>
        </div>
      </div>

      <!-- BEST WORD -->
      <div class="view" id="v-bw">
        <div class="bar">
          <div class="cc-segmented" id="bwMode">
            <button class="cc-segmented-btn is-active" data-m="mc">Choices</button>
            <button class="cc-segmented-btn" data-m="type">Type it</button>
          </div>
          <span class="sp"></span>
          <span class="stat">Correct <b id="bwOk">0</b> / <span id="bwN">0</span></span>
          <span class="stat">Streak <b id="bwStreak">0</b></span>
        </div>
        <div class="vbody">
        <div class="bw-card">
          <div class="tagrow" id="bwTags"></div>
          <div class="bw-sent" id="bwSent"></div>
        </div>
        <div class="choices" id="bwChoices"></div>
        <div class="typein"><input id="bwInput" autocomplete="off" spellcheck="false" placeholder="Type the word"><button class="cc-btn" id="bwCheck">Check</button></div>
        <div class="after" id="bwAfter"><span class="res" id="bwRes"></span><span class="adef" id="bwDef"></span><button class="cc-btn" id="bwNext">Next<kbd>Enter</kbd></button></div>
        </div>
      </div>

      <!-- WHICH ONE -->
      <div class="view" id="v-w1">
        <div class="bar">
          <button class="cc-btn" id="w1Skip">New pair</button>
          <span class="sp"></span>
          <span class="stat">Time <b id="w1Time">0.0</b> s</span>
          <span class="stat">Best <b id="w1Best">—</b></span>
        </div>
        <div class="vbody">
        <div class="w1-bins">
          <button class="bin" id="binL"><span class="bn" id="binLn"></span><span class="bk">←</span></button>
          <button class="bin" id="binR"><span class="bn" id="binRn"></span><span class="bk">→</span></button>
        </div>
        <div class="w1-card"><div class="w1-kind" id="w1Kind"></div><div class="w1-text" id="w1Text"></div></div>
        <div class="w1-prog" id="w1Prog"></div>
        <div class="w1-done">
          <div class="big" id="w1Score"></div>
          <div class="row">
            <div class="cc-stat-chip"><div class="cc-stat-label">Time</div><div class="cc-stat-value" id="w1DoneT"></div></div>
            <div class="cc-stat-chip"><div class="cc-stat-label">Best</div><div class="cc-stat-value" id="w1DoneB"></div></div>
          </div>
          <div class="row"><button class="cc-btn" id="w1Again">Same pair</button><button class="cc-btn" id="w1Next">Next pair<kbd>Enter</kbd></button></div>
        </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
'use strict';
var DATA = null, TERMS = [], BYNAME = {}, BYID = {};
var TYPES = ['Science', 'Academic', 'Dual-meaning', 'Person'];
var INTERVAL_DAYS = [0, 1, 3, 7, 14];
var KEY = 'ccVocab.v1';
var store = load();
var sel = { chapters: {}, secs: {}, types: {} };
TYPES.forEach(function (t) { sel.types[t] = true; });
var mode = 'fc';
var svgCache = {};

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { boxes: {}, best: {} }; } catch (e) { return { boxes: {}, best: {} }; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function boxOf(id) { var b = store.boxes[id]; return b ? b.b : 0; }
function record(id, correct) {
  var b = store.boxes[id] || { b: 0, due: 0 };
  b.b = correct ? Math.min(5, (b.b || 1) + 1) : 1;
  b.due = Date.now() + INTERVAL_DAYS[b.b - 1] * 864e5;
  store.boxes[id] = b; save(); renderMastery();
}
function isDue(id) { var b = store.boxes[id]; return !b || b.due <= Date.now(); }

fetch('vocab-terms.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (d) {
  DATA = d; TERMS = d.terms;
  TERMS.forEach(function (t) { BYNAME[t.term.toLowerCase()] = t; BYID[t.id] = t; });
  d.chapters.forEach(function (c) {
    sel.chapters[c.n] = false;
    sel.secs[c.n] = {}; c.sections.forEach(function (s, i) { sel.secs[c.n][i + 1] = true; });
  });
  var last = d.chapters[d.chapters.length - 1].n;
  sel.chapters[last] = true;
  buildRail(); setMode('fc');
});

/* ── deck ─────────────────────────────────────────────────────────── */
function chapterAll(n) { var s = sel.secs[n]; return Object.keys(s).every(function (k) { return s[k]; }); }
function deck() {
  return TERMS.filter(function (t) {
    if (!sel.types[t.type]) return false;
    if (sel.chapters[t.ch] && sel.secs[t.ch][t.sec]) return true;
    return t.also.some(function (c) { return sel.chapters[c] && chapterAll(c); });
  });
}
function inChapter(t, n) { return t.ch === n || t.also.indexOf(n) >= 0; }

/* ── rail ─────────────────────────────────────────────────────────── */
function buildRail() {
  var h = '';
  DATA.chapters.forEach(function (c) {
    h += '<div class="ch" data-ch="' + c.n + '"><div class="ch-head"><span class="box"></span><div class="ch-name"><div class="ch-n">Chapter ' + c.n + '</div><div class="ch-t">' + esc(c.title) + '</div>' +
      '<div class="mbar"><div class="mtrack"><div class="mfill"></div></div><span class="mval"></span></div></div><button class="exp" title="Sections">▾</button></div><div class="secs">';
    c.sections.forEach(function (s, i) { h += '<div class="sec is-active" data-ch="' + c.n + '" data-sec="' + (i + 1) + '"><span class="box"></span>' + esc(s) + '</div>'; });
    h += '</div></div>';
  });
  $('chapters').innerHTML = h;
  $('types').innerHTML = TYPES.map(function (t) { return '<button class="cc-btn is-active" data-type="' + t + '">' + t + '</button>'; }).join('');
  [].forEach.call(document.querySelectorAll('.ch-head'), function (el) {
    el.addEventListener('click', function (e) {
      var ch = +el.parentNode.dataset.ch;
      if (e.target.classList.contains('exp')) { el.parentNode.classList.toggle('open'); return; }
      sel.chapters[ch] = !sel.chapters[ch]; changed();
    });
  });
  [].forEach.call(document.querySelectorAll('.sec'), function (el) {
    el.addEventListener('click', function () {
      var ch = +el.dataset.ch, s = +el.dataset.sec;
      sel.secs[ch][s] = !sel.secs[ch][s];
      if (sel.secs[ch][s]) sel.chapters[ch] = true;
      changed();
    });
  });
  [].forEach.call(document.querySelectorAll('#types .cc-btn'), function (el) {
    el.addEventListener('click', function () { sel.types[el.dataset.type] = !sel.types[el.dataset.type]; changed(); });
  });
  $('allCh').addEventListener('click', function () {
    DATA.chapters.forEach(function (c) { sel.chapters[c.n] = true; Object.keys(sel.secs[c.n]).forEach(function (k) { sel.secs[c.n][k] = true; }); });
    changed();
  });
  $('reset').addEventListener('click', function () {
    if (!$('reset').dataset.arm) { $('reset').dataset.arm = '1'; $('reset').textContent = 'Confirm reset'; setTimeout(function () { delete $('reset').dataset.arm; $('reset').textContent = 'Reset progress'; }, 3000); return; }
    store = { boxes: {}, best: {} }; save(); delete $('reset').dataset.arm; $('reset').textContent = 'Reset progress'; changed();
  });
  paintRail();
}
function paintRail() {
  [].forEach.call(document.querySelectorAll('.ch'), function (el) { el.classList.toggle('is-active', !!sel.chapters[+el.dataset.ch]); });
  [].forEach.call(document.querySelectorAll('.sec'), function (el) { el.classList.toggle('is-active', !!(sel.chapters[+el.dataset.ch] && sel.secs[+el.dataset.ch][+el.dataset.sec])); });
  [].forEach.call(document.querySelectorAll('#types .cc-btn'), function (el) { el.classList.toggle('is-active', !!sel.types[el.dataset.type]); });
  renderMastery();
}
function renderMastery() {
  if (!DATA) return;
  [].forEach.call(document.querySelectorAll('.ch'), function (el) {
    var n = +el.dataset.ch, list = TERMS.filter(function (t) { return inChapter(t, n); });
    var m = list.length ? list.reduce(function (a, t) { var b = boxOf(t.id); return a + (b ? (b - 1) / 4 : 0); }, 0) / list.length : 0;
    el.querySelector('.mfill').style.width = (m * 100).toFixed(0) + '%';
    el.querySelector('.mval').textContent = Math.round(m * 100) + '%';
  });
}
function changed() { paintRail(); var d = deck(); $('deckN').textContent = d.length; $('stage').classList.toggle('no-deck', d.length === 0); restart(); }

/* ── modes ────────────────────────────────────────────────────────── */
[].forEach.call(document.querySelectorAll('#tabs .cc-segmented-btn'), function (b) { b.addEventListener('click', function () { setMode(b.dataset.mode); }); });
function setMode(m) {
  mode = m;
  [].forEach.call(document.querySelectorAll('#tabs .cc-segmented-btn'), function (b) { b.classList.toggle('is-active', b.dataset.mode === m); });
  ['fc', 'bw', 'w1'].forEach(function (k) { $('v-' + k).classList.toggle('is-active', k === m); });
  changed();
}
function restart() { if (!DATA) return; if (deck().length === 0) { stopTimer(); return; } if (mode === 'fc') fcStart(); else if (mode === 'bw') bwNew(); else w1Start(); }

/* ── shared bits ──────────────────────────────────────────────────── */
function typeTag(t) { return '<span class="tg t-' + t.type + '">' + t.type + '</span>'; }
function chTag(t) { var c = DATA.chapters[t.ch - 1]; return '<span class="tg">Ch ' + t.ch + ' · ' + esc(c.sections[t.sec - 1]) + '</span>'; }
function boxDots(t) { var b = boxOf(t.id), s = '<span class="dots">'; for (var i = 1; i <= 5; i++) s += '<i class="' + (i <= b ? 'on' : '') + '"></i>'; return s + '</span>'; }
function regTag(t) { if (t.reg && /^Exam:/.test(t.reg)) { var m = t.reg.match(/^Exam:\s*([A-Za-z]+ \d{4})/); return m ? '<span class="tg ref">Regents · ' + m[1] + '</span>' : ''; } return ''; }
function sentHTML(s, fill, cls) {
  var startCap = s.indexOf('_____') === 0;
  var word = fill ? (startCap ? fill.charAt(0).toUpperCase() + fill.slice(1) : fill) : '';
  return esc(s).replace('_____', '<span class="blank ' + (cls || '') + '">' + (word ? esc(word) : '&nbsp;') + '</span>');
}
function filled(s, term) { var w = s.indexOf('_____') === 0 ? term.charAt(0).toUpperCase() + term.slice(1) : term; return esc(s).replace('_____', '<b style="color:var(--color-text-primary)">' + esc(w) + '</b>'); }
function loadSvg(key, el) {
  if (!key) { el.innerHTML = ''; return; }
  if (svgCache[key]) { el.innerHTML = svgCache[key]; return; }
  fetch('vocab-img/' + key + '.svg').then(function (r) { return r.text(); }).then(function (t) { svgCache[key] = t; if (el.dataset.key === key) el.innerHTML = t; });
}
function toolLink(t) {
  if (!t.tool || !DATA.tools[t.tool]) return '';
  var tl = DATA.tools[t.tool];
  return '<a class="toollink" href="/#' + tl.route + '" target="_top">' + esc(tl.name) + ' ↗</a>';
}
function overlaps(u, t) {
  var a = u.term.toLowerCase().replace(/\s*\(.*?\)/g, ''), b = t.term.toLowerCase().replace(/\s*\(.*?\)/g, '');
  if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return true;
  return u.aka.concat(t.aka).some(function (x) { x = x.toLowerCase(); return x === a || x === b; });
}
function mixPartners(t) {
  var out = [];
  t.mix.forEach(function (m) {
    var k = m.toLowerCase();
    if (BYNAME[k]) { out.push(BYNAME[k]); return; }
    TERMS.forEach(function (u) { if (u !== t && new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(u.term.toLowerCase())) out.push(u); });
  });
  return out.filter(function (u, i) { return u !== t && out.indexOf(u) === i && !overlaps(u, t); });
}

/* ── FLASHCARDS ───────────────────────────────────────────────────── */
var fc = { q: [], i: 0, got: 0, dir: 't', flipped: false };
[].forEach.call(document.querySelectorAll('#fcDir .cc-segmented-btn'), function (b) {
  b.addEventListener('click', function () {
    fc.dir = b.dataset.dir;
    [].forEach.call(document.querySelectorAll('#fcDir .cc-segmented-btn'), function (x) { x.classList.toggle('is-active', x === b); });
    fcShow();
  });
});
$('fcShuffle').addEventListener('click', function () { shuffle(fc.q); fc.i = 0; fcShow(); });
$('fc').addEventListener('click', function (e) { if (e.target.closest('a')) return; fcFlip(); });
function fcStart() {
  var d = deck();
  var due = d.filter(function (t) { return isDue(t.id); }), later = d.filter(function (t) { return !isDue(t.id); });
  due = shuffle(due).sort(function (a, b) { return boxOf(a.id) - boxOf(b.id); });
  fc.q = due.concat(shuffle(later)); fc.i = 0; fc.got = 0; fcShow();
}
function fcFlip() { fc.flipped = !fc.flipped; $('fc').classList.toggle('flipped', fc.flipped); fcGrade(); }
function fcGrade() {
  $('fcGrade').innerHTML = fc.flipped
    ? '<button class="cc-btn miss" id="gMiss">Missed it<kbd>1</kbd></button><button class="cc-btn got" id="gGot">Got it<kbd>2</kbd></button>'
    : '<button class="cc-btn flipbtn" id="gFlip">Flip<kbd>Space</kbd></button>';
  if (fc.flipped) { $('gMiss').onclick = function () { fcAnswer(false); }; $('gGot').onclick = function () { fcAnswer(true); }; }
  else $('gFlip').onclick = fcFlip;
}
function fcAnswer(ok) {
  var t = fc.q[fc.i]; record(t.id, ok);
  if (ok) fc.got++; else { var at = Math.min(fc.q.length, fc.i + 4); fc.q.splice(at, 0, t); }
  fc.i++; if (fc.i >= fc.q.length) { fcStart(); return; }
  fcShow();
}
function fcShow() {
  var t = fc.q[fc.i]; if (!t) return;
  fc.flipped = false; $('fc').classList.remove('flipped');
  $('fcPos').textContent = fc.i + 1; $('fcLen').textContent = fc.q.length; $('fcGot').textContent = fc.got;
  var head = '<div class="fhead">' + typeTag(t) + chTag(t) + '<span class="sp"></span>' + boxDots(t) + '</div>';
  $('fcFront').innerHTML = head + '<div class="big">' + (fc.dir === 't' ? '<div class="term">' + esc(t.term) + '</div>' : '<div class="defn">' + esc(t.def) + '</div>') + '</div>';
  var rows = '';
  if (t.every) rows += '<dt>Everyday</dt><dd>' + esc(t.every) + '</dd>';
  if (t.aka.length) rows += '<dt>Also called</dt><dd>' + esc(t.aka.join(' · ')) + '</dd>';
  if (t.parts) rows += '<dt>Word parts</dt><dd>' + esc(t.parts) + '</dd>';
  if (t.sents[0]) rows += '<dt>In use</dt><dd>' + filled(t.sents[0], t.term) + '</dd>';
  var refs = (t.essrt ? '<span class="tg ref">ESSRT ' + esc(t.essrt) + '</span>' : '') + regTag(t);
  $('fcBack').innerHTML = head + '<div class="bgrid' + (t.img ? '' : ' noimg') + '"><div><div class="bterm">' + esc(t.term) + '</div><div class="bdef">' + esc(t.def) + '</div>' +
    (rows ? '<dl>' + rows + '</dl>' : '') + (refs ? '<div class="tagrow" style="margin-top:12px">' + refs + '</div>' : '') + toolLink(t) + '</div>' +
    (t.img ? '<div class="fig" data-key="' + t.img + '"></div>' : '') + '</div>';
  var fig = $('fcBack').querySelector('.fig'); if (fig) loadSvg(t.img, fig);
  fcGrade();
}

/* ── BEST WORD ────────────────────────────────────────────────────── */
var bw = { t: null, s: '', opts: [], done: false, ok: 0, n: 0, streak: 0, typing: false, last: null };
[].forEach.call(document.querySelectorAll('#bwMode .cc-segmented-btn'), function (b) {
  b.addEventListener('click', function () {
    bw.typing = b.dataset.m === 'type';
    [].forEach.call(document.querySelectorAll('#bwMode .cc-segmented-btn'), function (x) { x.classList.toggle('is-active', x === b); });
    $('v-bw').classList.toggle('typing', bw.typing);
    if (!bw.done && bw.typing) $('bwInput').focus();
  });
});
$('bwNext').addEventListener('click', bwNew);
$('bwCheck').addEventListener('click', bwCheckTyped);
$('bwInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (bw.done) bwNew(); else bwCheckTyped(); } });
function pickWeighted(list) {
  var w = list.map(function (t) { return 6 - Math.max(1, boxOf(t.id)) + (isDue(t.id) ? 2 : 0); });
  var sum = w.reduce(function (a, b) { return a + b; }, 0), r = Math.random() * sum;
  for (var i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; }
  return list[list.length - 1];
}
function bwNew() {
  var d = deck().filter(function (t) { return t.sents.length; }); if (!d.length) return;
  var t; do { t = pickWeighted(d); } while (d.length > 1 && t === bw.last);
  bw.last = t; bw.t = t; bw.s = t.sents[Math.floor(Math.random() * t.sents.length)]; bw.done = false;
  var low = bw.s.toLowerCase();
  var cands = mixPartners(t);
  var same = shuffle(TERMS.filter(function (u) { return u.ch === t.ch && u.type === t.type && u !== t; }));
  var any = shuffle(TERMS.filter(function (u) { return u.ch === t.ch && u !== t; }));
  var opts = [];
  cands.concat(same, any).forEach(function (u) {
    if (opts.length >= 3 || opts.indexOf(u) >= 0 || u === t) return;
    if (low.indexOf(u.term.toLowerCase()) >= 0) return;
    if (overlaps(u, t)) return;
    if ((u.type === 'Person') !== (t.type === 'Person')) return;
    opts.push(u);
  });
  bw.opts = shuffle(opts.concat([t]));
  $('bwTags').innerHTML = typeTag(t) + chTag(t);
  $('bwSent').innerHTML = sentHTML(bw.s, '');
  $('bwChoices').innerHTML = bw.opts.map(function (u, i) { return '<button class="choice" data-i="' + i + '"><span class="k">' + 'ABCD'[i] + '</span>' + esc(u.term) + '</button>'; }).join('');
  [].forEach.call(document.querySelectorAll('.choice'), function (b) { b.addEventListener('click', function () { bwPick(+b.dataset.i); }); });
  $('bwAfter').classList.remove('show'); $('bwInput').value = ''; $('bwInput').disabled = false;
  if (bw.typing) $('bwInput').focus();
}
function bwFinish(ok, shown) {
  bw.done = true; bw.n++; if (ok) { bw.ok++; bw.streak++; } else bw.streak = 0;
  record(bw.t.id, ok);
  $('bwOk').textContent = bw.ok; $('bwN').textContent = bw.n; $('bwStreak').textContent = bw.streak;
  $('bwSent').innerHTML = sentHTML(bw.s, bw.t.term, ok ? 'ok' : 'bad');
  $('bwRes').className = 'res ' + (ok ? 'ok' : 'bad'); $('bwRes').textContent = ok ? 'Correct' : (shown ? '“' + shown + '”' : 'Not quite');
  $('bwDef').innerHTML = '<b>' + esc(bw.t.term) + '</b> — ' + esc(bw.t.def);
  $('bwAfter').classList.add('show'); $('bwNext').focus({ preventScroll: true });
}
function bwPick(i) {
  if (bw.done) return; var u = bw.opts[i], ok = u === bw.t;
  [].forEach.call(document.querySelectorAll('.choice'), function (b, j) { b.disabled = true; if (bw.opts[j] === bw.t) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); });
  bwFinish(ok, ok ? '' : u.term);
}
function norm(s) { return s.toLowerCase().replace(/[’'"“”.,!?;:()]/g, '').replace(/[-–]/g, ' ').replace(/^the\s+/, '').replace(/\s+/g, ' ').trim(); }
function answers(t) {
  var a = [t.term].concat(t.aka), out = [];
  a.forEach(function (x) {
    var base = x.replace(/\s*\(.*?\)/g, ''); out.push(base);
    var p = x.match(/\(([^)]*)\)/); if (p && /[a-z]/i.test(p[1])) out.push(p[1]);
  });
  var more = [];
  out.forEach(function (x) { var n = norm(x); more.push(n, n + 's', n + 'es', n.replace(/y$/, 'ies')); });
  return more;
}
function bwCheckTyped() {
  if (bw.done) return; var v = norm($('bwInput').value); if (!v) return;
  var ok = answers(bw.t).indexOf(v) >= 0;
  $('bwInput').disabled = true;
  bwFinish(ok, ok ? '' : $('bwInput').value.trim());
}

/* ── WHICH ONE? ───────────────────────────────────────────────────── */
var w1 = { pair: null, cards: [], i: 0, res: [], t0: 0, timer: null, lastKey: '' };
function pairsIn(d) {
  var ids = {}; d.forEach(function (t) { ids[t.id] = true; });
  var seen = {}, out = [];
  d.forEach(function (t) {
    mixPartners(t).forEach(function (u) {
      var k = [t.id, u.id].sort().join('|'); if (seen[k]) return; seen[k] = true;
      var n = t.sents.length + u.sents.length + 2;
      if (n >= 4 && t.type !== 'Person' && u.type !== 'Person') out.push([t, u]);
    });
  });
  return out;
}
function w1Start(same) {
  var d = deck(), pairs = pairsIn(d);
  $('v-w1').classList.remove('done');
  if (!pairs.length) { $('w1Text').textContent = '—'; $('w1Kind').textContent = ''; $('binLn').textContent = ''; $('binRn').textContent = ''; return; }
  var p = same && w1.pair ? w1.pair : null;
  if (!p) { var pool = pairs.filter(function (q) { return q[0].id + q[1].id !== w1.lastKey; }); p = (pool.length ? pool : pairs)[Math.floor(Math.random() * (pool.length ? pool.length : pairs.length))]; }
  if (Math.random() < 0.5 && !same) p = [p[1], p[0]];
  w1.pair = p; w1.lastKey = p[0].id + p[1].id;
  var cards = [];
  p.forEach(function (t, side) {
    t.sents.forEach(function (s) { cards.push({ side: side, kind: 'Sentence', html: sentHTML(s, '') }); });
    cards.push({ side: side, kind: 'Definition', html: esc(t.def) });
  });
  w1.cards = shuffle(cards).slice(0, 8); w1.i = 0; w1.res = [];
  $('binLn').textContent = p[0].term; $('binRn').textContent = p[1].term;
  w1Best(); w1Show(); startTimer();
}
function pairKey() { return [w1.pair[0].id, w1.pair[1].id].sort().join('|'); }
function w1Best() { var b = store.best[pairKey()]; $('w1Best').textContent = b ? (b / 1000).toFixed(1) : '—'; }
function startTimer() { stopTimer(); w1.t0 = Date.now(); w1.timer = setInterval(function () { $('w1Time').textContent = ((Date.now() - w1.t0) / 1000).toFixed(1); }, 100); }
function stopTimer() { if (w1.timer) clearInterval(w1.timer); w1.timer = null; }
function w1Show() {
  var c = w1.cards[w1.i];
  $('w1Kind').textContent = c.kind; $('w1Text').innerHTML = c.html;
  $('w1Prog').innerHTML = w1.cards.map(function (_, j) { return '<i class="' + (j < w1.i ? (w1.res[j] ? 'ok' : 'bad') : j === w1.i ? 'cur' : '') + '"></i>'; }).join('');
  $('binL').className = 'bin'; $('binR').className = 'bin';
}
var w1Lock = false;
function w1Pick(side) {
  if (w1Lock || !w1.pair || $('v-w1').classList.contains('done')) return;
  var c = w1.cards[w1.i], ok = c.side === side;
  w1.res.push(ok); record(w1.pair[c.side].id, ok);
  $(side ? 'binR' : 'binL').classList.add(ok ? 'ok' : 'bad');
  if (!ok) $(c.side ? 'binR' : 'binL').classList.add('ok');
  w1Lock = true;
  setTimeout(function () {
    w1Lock = false; w1.i++;
    if (w1.i >= w1.cards.length) w1End(); else w1Show();
  }, ok ? 260 : 900);
}
function w1End() {
  stopTimer();
  var ms = Date.now() - w1.t0, n = w1.res.filter(Boolean).length, k = pairKey();
  if (n === w1.cards.length && (!store.best[k] || ms < store.best[k])) { store.best[k] = ms; save(); }
  $('w1Score').textContent = n + ' / ' + w1.cards.length;
  $('w1DoneT').textContent = (ms / 1000).toFixed(1) + ' s';
  $('w1DoneB').textContent = store.best[k] ? (store.best[k] / 1000).toFixed(1) + ' s' : '—';
  w1Best(); $('v-w1').classList.add('done');
}
$('binL').addEventListener('click', function () { w1Pick(0); });
$('binR').addEventListener('click', function () { w1Pick(1); });
$('w1Skip').addEventListener('click', function () { w1Start(); });
$('w1Again').addEventListener('click', function () { w1Start(true); });
$('w1Next').addEventListener('click', function () { w1Start(); });

/* ── keys ─────────────────────────────────────────────────────────── */
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'INPUT') return;
  if (mode === 'fc') {
    if (e.key === ' ') { e.preventDefault(); fcFlip(); }
    else if (fc.flipped && e.key === '1') fcAnswer(false);
    else if (fc.flipped && e.key === '2') fcAnswer(true);
  } else if (mode === 'bw') {
    var i = 'abcd'.indexOf(e.key.toLowerCase()); if (i < 0) i = '1234'.indexOf(e.key);
    if (!bw.typing && i >= 0 && i < bw.opts.length) bwPick(i);
    else if (e.key === 'Enter' && bw.done) { e.preventDefault(); bwNew(); }
  } else if (mode === 'w1') {
    if (e.key === 'ArrowLeft') w1Pick(0);
    else if (e.key === 'ArrowRight') w1Pick(1);
    else if (e.key === 'Enter' && $('v-w1').classList.contains('done')) w1Start();
  }
});
})();
</script>
</body>
