<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climographs | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
  :root { --tool-accent: var(--accent-earth); --cc-card-width: 330px; }
  [hidden] { display: none !important; }

  .cc-app { max-width: 1760px; margin: 0 auto; }
  .cc-scene-head, .lg-strip, .myst-strip, .cc-scene-bar { flex-shrink: 0; }

  /* ── Top row ── */
  .cc-app-top { gap: 10px; }
  .exp { display: flex; gap: 6px; }
  .exp .cc-btn, .top-btn { padding: 8px 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .cc-btn.is-error { border-color: #C05050; color: #E07070; }
  .cc-btn.is-ok { border-color: #3A9E50; color: #5CC070; }
  .top-btn.is-active { border-color: var(--tool-accent); color: #F2EEE3; background: rgba(60,163,174,.16); }
  .top-btn:disabled, .cc-select:disabled { opacity: .35; cursor: not-allowed; }

  .finder-group { position: relative; flex: 0 0 auto; display: flex; align-items: stretch; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color .15s; }
  .finder-group:focus-within { border-color: var(--tool-accent); }
  .finder-group.is-off { opacity: .35; pointer-events: none; }
  .finder-group .sw-key { width: 4px; border-radius: var(--radius-md) 0 0 var(--radius-md); flex-shrink: 0; }
  .finder-group .search-icon { display: flex; align-items: center; padding-left: 10px; color: var(--color-text-muted); font-size: 16px; pointer-events: none; }
  .finder-group .search-input { width: 200px; background: transparent; border: none; border-radius: 0; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
  .finder-group .search-input::placeholder { color: var(--color-text-muted); }
  .finder-x { border: none; background: transparent; color: var(--color-text-secondary); font-size: 16px; padding: 0 10px; cursor: pointer; border-left: 1px solid var(--color-border); }
  .finder-x:hover { color: var(--color-text-primary); }
  .dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 320px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 300px; overflow-y: auto; z-index: 300; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .dropdown.open { display: block; }
  .d-item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); transition: background .1s; }
  .d-item:last-child { border-bottom: none; }
  .d-item:hover, .d-item.hi { background: rgba(60,163,174,.18); }
  .d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 50px; flex-shrink: 0; }
  .d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-item .d-st { color: var(--color-text-muted); font-size: 13px; width: 24px; text-align: right; }
  .pair-sel { font-size: 14px; font-weight: 600; padding: 8px 8px; width: 210px; }

  /* ── Scene head ── */
  .cc-scene-head { gap: 6px 22px; padding: 8px 14px 7px; align-items: flex-end; }
  .hd-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hm-heading { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hm-heading i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .hm-heading .vs { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-muted); font-weight: 400; }
  .fac { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tool-accent); border: 1px solid var(--tool-accent); border-radius: 10px; padding: 1px 8px; font-weight: 700; }
  .hm-period { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ro-row { display: flex; align-items: flex-end; gap: 4px 22px; flex-wrap: wrap; margin-left: auto; }
  .ro { display: flex; flex-direction: column; min-width: 0; }
  .ro-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
  .ro-v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; }
  .ro-v.two { font-size: 19px; line-height: 1.15; }
  .ro-n { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
  .ro[data-tip] { cursor: help; }

  /* ── Legend + mystery strips ── */
  .lg-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; padding: 6px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 32px; }
  .lg-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .lg-item[title] { cursor: help; }
  .sw-line { width: 22px; height: 0; border-top: 3px solid; flex-shrink: 0; }
  .sw-band { width: 22px; height: 12px; flex-shrink: 0; border-radius: 2px; }
  .sw-grad { width: 64px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .sw-bar { width: 10px; height: 12px; border-radius: 1px; flex-shrink: 0; }
  .sw-sq { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1.5px #1E2320; }
  .sw-range { width: 8px; height: 14px; border: 2px solid var(--color-text-primary); border-left: none; flex-shrink: 0; }
  .ramp { display: inline-flex; flex-direction: column; gap: 2px; }
  .ramp-bar { width: 220px; height: 10px; border-radius: 2px; }
  .ramp-t { display: flex; justify-content: space-between; width: 220px; font-size: 12px; color: var(--color-text-muted); }
  .myst-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 6px 14px; border-bottom: 1px solid var(--color-border); background: rgba(60,163,174,.08); font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); }
  .myst-strip b { color: var(--tool-accent); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
  .myst-strip .sp { flex: 1; }
  .myst-strip .cc-btn { font-size: 14px; padding: 5px 11px; }
  .myst-res { color: var(--color-text-primary); }
  .myst-res em { font-style: normal; color: var(--tool-accent); font-weight: 700; }

  /* ── Stage ── */
  .cc-scene-stage { overflow: hidden; }
  #cv { position: absolute; left: 0; top: 0; display: block; outline: none; touch-action: pan-y; }
  #cv.is-chart { cursor: crosshair; }
  #cv.is-map { cursor: pointer; }
  .tbl { position: absolute; inset: 0; overflow: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 18px; }
  .tbl h3 { margin: 0 0 6px; font-family: var(--font-display); font-size: 18px; color: var(--color-text-primary); display: flex; align-items: center; gap: 8px; }
  .tbl h3 i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  table.nt { border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; width: 100%; min-width: 760px; }
  .nt th { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); font-weight: 400; text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
  .nt th:first-child, .nt td:first-child { text-align: left; }
  .nt th.cg { text-align: center; color: var(--color-text-primary); border-bottom: 1px solid var(--color-border-hover); }
  .nt td { padding: 4px 8px; text-align: right; color: var(--color-text-primary); border-bottom: 1px solid rgba(232,228,217,.06); white-space: nowrap; }
  .nt td.dim { color: var(--color-text-muted); }
  .nt td .yr { color: var(--color-text-muted); font-size: 12px; margin-left: 4px; }
  .nt tr.ann td { border-top: 1px solid var(--color-border-hover); font-weight: 700; }
  .nt tr.hl td { background: rgba(60,163,174,.10); }
  .state-overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px;
    background: #262B27; color: var(--color-text-secondary); font-family: var(--font-mono); font-size: 14px; text-align: center; }
  .state-overlay .err { color: #E07070; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--color-border); border-top-color: var(--tool-accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Control bar ── */
  .cc-scene-bar { flex-wrap: wrap; gap: 8px 10px; min-height: 0; padding: 7px 12px; }
  .grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .grp-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-right: 3px; white-space: nowrap; }
  .grp .cc-btn { font-size: 14px; padding: 6px 11px; color: var(--color-text-primary); }
  .grp .cc-btn:not(.is-active) { color: var(--color-text-secondary); }
  .grp .cc-btn.is-active { color: #F2EEE3; }
  .grp .cc-btn:disabled { opacity: .35; cursor: not-allowed; }
  #grp-view .cc-btn { font-size: 15px; font-weight: 700; padding: 6px 14px; }

  /* ── Rail card ── */
  .cc-card { gap: 0; padding: 10px 14px; overflow-x: hidden; }
  .loc-wrap { position: relative; height: 150px; flex-shrink: 0; margin-bottom: 8px; border-radius: var(--radius-md); overflow: hidden; cursor: pointer; }
  .loc-wrap:hover { box-shadow: inset 0 0 0 1px var(--tool-accent); }
  #loc { position: absolute; left: 0; top: 0; display: block; }
  .rd-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
  .rd-date { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--color-text-primary); line-height: 1.1; }
  .rd-tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
  .rd-tag button { background: none; border: 1px solid var(--tool-accent); color: var(--tool-accent); border-radius: 10px; font-family: var(--font-mono); font-size: 12px; padding: 0 6px; margin-left: 4px; cursor: pointer; }
  .rd-hint { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); white-space: nowrap; }
  table.rd-t { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; margin: 4px 0 2px; flex-shrink: 0; }
  .rd-t th { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-secondary); font-weight: 400; text-align: right; padding: 3px 0 2px; white-space: nowrap; }
  .rd-t th:first-child { text-align: left; }
  .rd-t td { padding: 3px 0; color: var(--color-text-primary); text-align: right; white-space: nowrap; border-top: 1px solid rgba(232,228,217,.06); }
  .rd-t td:first-child { text-align: left; color: var(--color-text-secondary); font-size: 13px; padding-right: 6px; }
  .rd-t td b { font-family: var(--font-display); font-size: 17px; }
  .rd-t .sub { color: var(--color-text-muted); font-size: 12px; margin-left: 3px; }
  .rd-t tr.gap td { border-top: 1px solid var(--color-border); }
  .cc-card-src { padding-top: 8px; flex-shrink: 0; }
  .cc-card-src span { cursor: help; border-bottom: 1px dotted var(--color-text-muted); }

  /* ── Narrower windows ── */
  @media (max-width: 1500px) {
    .cc-app-title { display: none; }
    .finder-group .search-input { width: 170px; }
    .ro-row { gap: 4px 16px; }
    .grp .cc-btn { padding: 6px 8px; }
  }
  @media (max-width: 1400px) { :root { --cc-card-width: 300px; } .pair-sel { width: 180px; } .exp .cc-btn, .top-btn { padding: 8px 9px; } }
  @media (max-width: 1280px) {
    .finder-group .search-input { width: 140px; }
    .pair-sel { width: 150px; }
    .exp .cc-btn { padding: 8px 7px; font-size: 13px; }
    .grp .cc-btn { padding: 6px 7px; font-size: 13px; }
    .grp-l { display: none; }
    .ro-v { font-size: 24px; }
  }
  @media (max-height: 700px) and (min-width: 761px) {
    .cc-app { padding-top: 6px; padding-bottom: 8px; gap: 6px; }
    .cc-app-top { min-height: 0; }
    .finder-group .search-input { padding-top: 6px; padding-bottom: 6px; }
    .exp .cc-btn, .top-btn, .pair-sel { padding-top: 5px; padding-bottom: 5px; }
    .cc-scene-head { padding-top: 4px; padding-bottom: 4px; }
    .ro-n { display: none; }
    .lg-strip { padding-top: 3px; padding-bottom: 3px; min-height: 0; }
    .cc-scene-bar { padding-top: 4px; padding-bottom: 4px; }
    .grp .cc-btn { padding-top: 4px; padding-bottom: 4px; }
    .loc-wrap { height: 118px; }
    .rd-t td { padding: 2px 0; }
  }
  @media (max-width: 760px) {
    .cc-app-title { display: block; width: 100%; font-size: 20px; }
    .cc-app-spacer { display: none; }
    .cc-app-top { flex-wrap: wrap; }
    .finder-group { flex: 1 1 100%; }
    .finder-group .search-input { width: 100%; min-width: 0; }
    .pair-sel { flex: 1 1 auto; width: auto; }
    .hm-heading { white-space: normal; font-size: 19px; }
    .ro-row { margin-left: 0; }
    .cc-scene-head { display: contents; }
    .hd-id { order: 0; padding: 8px 14px; border-bottom: 1px solid var(--color-border); }
    .myst-strip { order: 1; }
    .cc-scene-stage { order: 2; }
    .lg-strip { order: 3; border-top: 1px solid var(--color-border); }
    .ro-row { order: 4; padding: 8px 14px; border-bottom: 1px solid var(--color-border); gap: 8px 20px; }
    .cc-scene-bar { order: 5; }
  }
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">

  <div class="cc-app-top">
    <h1 class="cc-app-title">Climographs</h1>
    <div class="finder-group" id="fa">
      <span class="sw-key" style="background:#D08425"></span>
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si-a" placeholder="Search city or station..." autocomplete="off" spellcheck="false" aria-label="City">
      <div class="dropdown" id="dd-a"></div>
    </div>
    <button class="cc-btn top-btn" id="cmp-btn" type="button">+ Compare</button>
    <div class="finder-group" id="fb" hidden>
      <span class="sw-key" style="background:#6D96D8"></span>
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si-b" placeholder="Second city..." autocomplete="off" spellcheck="false" aria-label="Second city">
      <div class="dropdown" id="dd-b"></div>
      <button class="finder-x" id="fb-x" type="button" title="Remove second city">&#10005;</button>
    </div>
    <select class="cc-select pair-sel" id="pair-sel" aria-label="Contrast pairs"></select>
    <button class="cc-btn top-btn" id="myst-btn" type="button" title="Hide the city and guess where it is">? Mystery</button>
    <div class="cc-app-spacer"></div>
    <div class="exp">
      <button class="cc-btn" id="copy-btn" type="button" title="Copy the image">&#x29C9; Copy</button>
      <button class="cc-btn" id="png-btn" type="button" title="Download as PNG">&#x2193; PNG</button>
      <button class="cc-btn" id="csv-btn" type="button" title="Download the monthly normals as CSV">&#x2193; CSV</button>
    </div>
  </div>

  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head">
        <div class="hd-id">
          <div class="hm-heading" id="hd-name">&nbsp;</div>
          <div class="hm-period" id="hd-meta">&nbsp;</div>
        </div>
        <div class="ro-row" id="readouts"></div>
      </div>
      <div class="myst-strip" id="myst" hidden></div>
      <div class="lg-strip" id="legend"></div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="cv" tabindex="0" aria-label="Climograph. Hover or use the arrow keys to read a month."></canvas>
        <div class="tbl" id="tbl" hidden></div>
        <div class="state-overlay" id="state"><div class="spinner"></div><div>Loading climate normals…</div></div>
      </div>
      <div class="cc-scene-bar" id="bar">
        <div class="grp" id="grp-view"><button class="cc-btn" data-v="chart">Chart</button><button class="cc-btn" data-v="map">Map</button><button class="cc-btn" data-v="table">Table</button></div>
        <div class="cc-scene-bar-sep"></div>
        <div class="grp" id="grp-scale"><span class="grp-l">Scale</span><button class="cc-btn" data-sc="fit" title="Axes fit the city or pair shown">Fit</button><button class="cc-btn" data-sc="fixed" title="Same axes for every city">Fixed</button></div>
        <div class="grp" id="grp-show"><span class="grp-l">Show</span><button class="cc-btn" data-sh="band">High–Low</button><button class="cc-btn" data-sh="range">Range</button><button class="cc-btn" data-sh="vals">Values</button></div>
        <div class="grp" id="grp-col" hidden><span class="grp-l">Colour</span><button class="cc-btn" data-mc="koppen">Köppen</button><button class="cc-btn" data-mc="range">Temp range</button></div>
        <div class="grp" id="grp-pick" hidden><span class="grp-l">Click sets</span><button class="cc-btn" data-pk="a">City 1</button><button class="cc-btn" data-pk="b">City 2</button></div>
        <div class="cc-scene-bar-sep"></div>
        <div class="grp" id="grp-u"><button class="cc-btn" data-u="f">°F</button><button class="cc-btn" data-u="c">°C</button></div>
        <div class="grp" id="grp-p"><button class="cc-btn" data-p="in">in</button><button class="cc-btn" data-p="mm">mm</button></div>
      </div>
    </div>

    <div class="cc-card" id="card">
      <div class="loc-wrap" id="loc-wrap" title="Open the map"><canvas id="loc"></canvas></div>
      <div class="rd-head"><span class="rd-date" id="rd-title">&nbsp;</span><span class="rd-tag" id="rd-tag"></span><span class="rd-hint" id="rd-hint"></span></div>
      <table class="rd-t" id="rd-t"></table>
      <div class="cc-card-src" id="src">Source: NOAA NCEI 1991–2020 U.S. Climate Normals; monthly records from NOAA RCC ACIS. <span title="Average = mean of the daily high and low. Annual range = warmest month's average minus coldest month's average. Köppen–Geiger type computed from the monthly normals (Peel et al. 2007 rules; C/D boundary at −3 °C; summer = Apr–Sep).">Methods</span></div>
    </div>
  </div>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONO = '"Courier Prime", monospace', DISP = '"Zilla Slab", Georgia, serif';
const INK = '#E8E4D9', INK2 = '#A6A499', MUTED = '#948F82', SURF = '#262B27', PAGE_BG = '#1E2320';
const LAND = '#323a34', BORDER = 'rgba(232,228,217,0.17)', GRID = 'rgba(232,228,217,0.08)', DOT_EDGE = 'rgba(22,26,23,0.9)';
const COL = { a: '#D08425', b: '#6D96D8' };
const EARTH = '#3CA3AE';
const isNum = v => typeof v === 'number' && isFinite(v);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let dpr = window.devicePixelRatio || 1;

// ─── COLOUR SCALES (site temperature + monthly precip ramps) ──────────────
const SCALES = {
  temp: { vals: [-60,-40,-20,-5,25,50,75,102,113,119,130], cols: ['#2A0440','#7C18C0','#D42070','#FFB3C6','#A8D4F0','#5DBF6A','#FFE033','#D41A1A','#FF5555','#FFFFFF','#FFC0D0'] },
  precip: { vals: [0,0.25,1.5,3.5,6,12], cols: ['#232323','#0d2812','#1c7020','#40c030','#b0d820','#e4d800'] },
  // annual temperature range (warmest − coldest month), °F
  range: { vals: [0,10,20,30,40,50,60,70], cols: ['#1F3D5C','#2C6E8E','#3E9AA6','#7DBB94','#C9CF78','#E9B25C','#E7804A','#D9503F'] },
};
const hexRGB = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function scaleRGB(v, sc) {
  const { vals, cols } = sc;
  if (!isNum(v)) return [60,66,61];
  if (v <= vals[0]) return hexRGB(cols[0]);
  if (v >= vals[vals.length-1]) return hexRGB(cols[cols.length-1]);
  for (let i = 0; i < vals.length-1; i++) if (v <= vals[i+1]) {
    const t = (v - vals[i]) / (vals[i+1] - vals[i]), a = hexRGB(cols[i]), b = hexRGB(cols[i+1]);
    return a.map((x, k) => Math.round(x + t * (b[k] - x)));
  }
  return hexRGB(cols[cols.length-1]);
}
const rgba = (rgb, a) => `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${a == null ? 1 : a})`;
const tempCol = (f, a) => rgba(scaleRGB(f, SCALES.temp), a);
const precipCol = (inch, a) => rgba(scaleRGB(inch, SCALES.precip), a);
const rangeCol = (f, a) => rgba(scaleRGB(f, SCALES.range), a);

// ─── KÖPPEN ──────────────────────────────────────────────────────────────
const KOPPEN_NAMES = {

  BWh:'Hot Desert', BWk:'Cold Desert', BSh:'Hot Semi-Arid', BSk:'Cold Semi-Arid',
  Csa:'Hot-Summer Mediterranean', Csb:'Warm-Summer Mediterranean', Csc:'Cold-Summer Mediterranean',
  Cwa:'Humid Subtropical (dry winter)', Cwb:'Subtropical Highland', Cwc:'Cold Subtropical Highland',
  Cfa:'Humid Subtropical', Cfb:'Oceanic', Cfc:'Subpolar Oceanic',
  Dsa:'Hot-Summer Mediterranean Continental', Dsb:'Warm-Summer Mediterranean Continental', Dsc:'Dry-Summer Subarctic', Dsd:'Dry-Summer Very Cold Subarctic',
  Dwa:'Hot-Summer Humid Continental (dry winter)', Dwb:'Warm-Summer Humid Continental (dry winter)', Dwc:'Subarctic (dry winter)', Dwd:'Very Cold Subarctic (dry winter)',
  Dfa:'Hot-Summer Humid Continental', Dfb:'Warm-Summer Humid Continental', Dfc:'Subarctic', Dfd:'Very Cold Subarctic',
  ET:'Tundra', EF:'Ice Cap',

const KOPPEN_COL = {
  Af:'#0000FF', Am:'#0078FF', Aw:'#46AAFA', As:'#46AAFA',
  BWh:'#FF0000', BWk:'#FF9696', BSh:'#F5A500', BSk:'#FFDC64',
  Csa:'#FFFF00', Csb:'#C8C800', Csc:'#969600',
  Cwa:'#96FF96', Cwb:'#64C864', Cwc:'#329632',
  Cfa:'#C8FF50', Cfb:'#64FF50', Cfc:'#32C800',
  Dsa:'#FF00FF', Dsb:'#C800C8', Dsc:'#963296', Dsd:'#966496',
  Dwa:'#AAAFFF', Dwb:'#5A78DC', Dwc:'#4B50B4', Dwd:'#320087',
  Dfa:'#00FFFF', Dfb:'#37C8FF', Dfc:'#007D7D', Dfd:'#00465F',
  ET:'#B2B2B2', EF:'#666666',
};
const KOPPEN_ORDER = Object.keys(KOPPEN_COL);
function classifyKoppen(tavgF, prcpIn) {
  if (tavgF.some(v => !isNum(v)) || prcpIn.some(v => !isNum(v))) return null;

  const Tann = tC.reduce((a, b) => a + b, 0) / 12, Pann = pMm.reduce((a, b) => a + b, 0);
  const Tcold = Math.min(...tC), Twarm = Math.max(...tC);

  const Ps = sumI.reduce((s, i) => s + pMm[i], 0), Pw = winI.reduce((s, i) => s + pMm[i], 0);
  const Pthr = Ps / Pann >= 0.7 ? 20 * Tann + 280 : Pw / Pann >= 0.7 ? 20 * Tann : 20 * Tann + 140;
  const above10 = tC.filter(v => v >= 10).length;
  const third = () => Twarm >= 22 ? 'a' : (above10 >= 4 ? 'b' : 'c');
  const second = () => {
    const sDry = Math.min(...sumI.map(i => pMm[i])), sWet = Math.max(...sumI.map(i => pMm[i]));
    const wDry = Math.min(...winI.map(i => pMm[i])), wWet = Math.max(...winI.map(i => pMm[i]));
    if (sDry < 40 && sDry < wWet / 3) return 's';
    if (wDry < sWet / 10) return 'w';
    return 'f';
  };
  let code;
  if (Twarm < 10) code = Twarm > 0 ? 'ET' : 'EF';
  else if (Pann < Pthr) code = 'B' + (Pann < Pthr / 2 ? 'W' : 'S') + (Tann >= 18 ? 'h' : 'k');
  else if (Tcold >= 18) { const d = Math.min(...pMm); code = d >= 60 ? 'Af' : d >= 100 - Pann / 25 ? 'Am' : 'Aw'; }
  else if (Tcold > -3) code = 'C' + second() + third();
  else code = 'D' + second() + (Twarm >= 22 ? 'a' : above10 >= 4 ? 'b' : Tcold > -38 ? 'c' : 'd');
  return { code, name: KOPPEN_NAMES[code] || 'Unclassified' };
}

const S = {

// ─── UNITS ───────────────────────────────────────────────────────────────
const tU = f => isNum(f) ? (S.u === 'c' ? (f - 32) * 5 / 9 : f) : NaN;
const dU = f => isNum(f) ? (S.u === 'c' ? f * 5 / 9 : f) : NaN;          // temperature difference
const pU = i => isNum(i) ? (S.p === 'mm' ? i * 25.4 : i) : NaN;
const tUnit = () => S.u === 'c' ? '°C' : '°F';
const fT = (f, deg = true) => isNum(f) ? tU(f).toFixed(1) + (deg ? '°' : '') : '—';
const fD = f => isNum(f) ? dU(f).toFixed(1) + '°' : '—';
const fP = (i, unit = true) => isNum(i) ? (S.p === 'mm' ? Math.round(pU(i)).toString() : pU(i).toFixed(2)) + (unit ? ' ' + S.p : '') : '—';
const fPs = i => isNum(i) ? (S.p === 'mm' ? Math.round(pU(i)).toString() : pU(i).toFixed(i >= 10 ? 1 : 2)) : '—';
const fSnowN = i => isNum(i) ? (S.p === 'mm' ? (i * 2.54).toFixed(i >= 10 ? 0 : 1) : i.toFixed(1)) : '—';
const fSnow = i => isNum(i) ? (S.p === 'mm' ? (i * 2.54).toFixed(i >= 10 ? 0 : 1) + ' cm' : i.toFixed(1) + ' in') : '—';

// ─── DATA ────────────────────────────────────────────────────────────────
function prep(id, v) {
  const m = v.months, col = k => m.map(x => x[k]);
  const tavg = col('tavg'), tmax = col('tmax'), tmin = col('tmin'), prcp = col('prcp'), snow = col('snow');
  const okT = tavg.every(isNum);
  const argx = (arr, sgn) => arr.reduce((b, x, i) => (isNum(x) && (b < 0 || sgn * x > sgn * arr[b])) ? i : b, -1);
  const warm = argx(tavg, 1), cold = argx(tavg, -1), wet = argx(prcp, 1), dry = argx(prcp, -1);
  const sum = arr => arr.every(isNum) ? arr.reduce((a, b) => a + b, 0) : NaN;
  const mean = arr => arr.every(isNum) ? arr.reduce((a, b) => a + b, 0) / arr.length : NaN;
  const rh = argx(col('record_high'), 1), rl = argx(col('record_low'), -1);
  const st = v.state, region = st === 'AK' ? 'ak' : st === 'HI' ? 'hi' : st === 'PR' ? 'pr' : 'conus';
  return {
    id, name: cleanName(id, v.name), raw: v.name, st, lat: v.lat, lon: v.lon, elev: v.elev_ft, m, region,
    tavg, tmax, tmin, prcp, snow, warm, cold, wet, dry, rh, rl,
    ann: mean(tavg), annHi: mean(tmax), annLo: mean(tmin), range: okT ? tavg[warm] - tavg[cold] : NaN,
    pAnn: sum(prcp), snowAnn: sum(snow), kop: classifyKoppen(tavg, prcp),
  };
}
const label = s => `${s.name}, ${s.st}`;
const sA = () => BY[S.a] || null, sB = () => (S.cmp && BY[S.b]) ? BY[S.b] : null;
const hidden = () => !!(S.myst && !S.myst.rev);
const pairNow = () => { const A = sA(), B = sB(); if (!A || !B) return null; return PAIRS.find(p => (p.a === A.id && p.b === B.id) || (p.a === B.id && p.b === A.id)) || null; };

// ─── NICE AXES ───────────────────────────────────────────────────────────
function niceStep(span, n) {
  const raw = span / Math.max(1, n), p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function tempAxis(series, ph) {
  if (S.scale === 'fixed') return S.u === 'c' ? { lo: -40, hi: 50, step: ph < 300 ? 30 : 10 } : { lo: -40, hi: 120, step: ph < 300 ? 40 : 20 };
  let lo = Infinity, hi = -Infinity;
  series.forEach(v => { if (isNum(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); } });
  if (!isFinite(lo)) { lo = 0; hi = 1; }
  if (hi - lo < (S.u === 'c' ? 10 : 20)) { const c = (hi + lo) / 2, h = S.u === 'c' ? 5 : 10; lo = c - h; hi = c + h; }
  const step = niceStep(hi - lo, Math.max(3, Math.round(ph / 55)));
  return { lo: Math.floor(lo / step) * step, hi: Math.ceil(hi / step) * step, step };
}
function precipAxis(series, ph) {
  if (S.scale === 'fixed') return S.p === 'mm' ? { lo: 0, hi: 500, step: 100 } : { lo: 0, hi: 20, step: ph < 300 ? 10 : 5 };
  let hi = 0; series.forEach(v => { if (isNum(v)) hi = Math.max(hi, v); });
  hi = Math.max(hi * 1.08, S.p === 'mm' ? 100 : 4);   // floor keeps dry climates looking dry
  const step = niceStep(hi, Math.max(3, Math.round(ph / 60)));
  return { lo: 0, hi: Math.ceil(hi / step) * step, step };
}
const fmtTick = (v, step) => { const d = step >= 1 ? 0 : (Math.round(step * 10) === step * 10 ? 1 : 2); return v.toFixed(d).replace(/^-/, '−'); };

// ─── CHART ───────────────────────────────────────────────────────────────
// Draws a climograph for one or two stations into a W×H box. o.fs scales text.
function drawChart(c, W, H, o) {
  const fs = o.fs || 1, A = o.A, B = o.B, cities = B ? [A, B] : [A];
  const px = n => Math.round(n * fs);
  c.save(); c.fillStyle = SURF; c.fillRect(0, 0, W, H);
  const padL = px(64), padR = px(66), padT = px(18), padB = px(36);
  const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
  const laneW = o.range ? Math.min(px(B ? 124 : 68), (x1 - x0) * (B ? 0.26 : 0.16)) : 0, laneK = laneW / px(B ? 124 : 68);
  const pw = x1 - x0 - laneW, ph = y1 - y0;
  if (pw < 100 || ph < 80) { c.restore(); return null; }
  const cw = pw / 12, cx = i => x0 + cw * (i + 0.5);
  const tSeries = []; cities.forEach(s => (o.band ? s.tmax.concat(s.tmin) : s.tavg).forEach(v => tSeries.push(tU(v))));
  const pSeries = []; cities.forEach(s => s.prcp.forEach(v => pSeries.push(pU(v))));
  const ta = tempAxis(tSeries, ph), pa = precipAxis(pSeries, ph);
  const ty = v => y1 - (v - ta.lo) / (ta.hi - ta.lo) * ph, py = v => y1 - (v - pa.lo) / (pa.hi - pa.lo) * ph;

  // hover column
  const hl = o.hover != null ? o.hover : o.pin;
  if (hl != null) { c.fillStyle = 'rgba(232,228,217,0.06)'; c.fillRect(x0 + cw * hl, y0, cw, ph); }
  // grid + left ticks
  c.font = `${px(13)}px ${MONO}`; c.textBaseline = 'middle';
  for (let v = ta.lo; v <= ta.hi + 1e-9; v += ta.step) {
    const y = Math.round(ty(v)) + 0.5;
    c.strokeStyle = Math.abs(v) < 1e-9 || (S.u === 'f' && Math.abs(v - 32) < 1e-9) ? 'rgba(232,228,217,0.20)' : GRID;
    c.lineWidth = 1; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
    c.fillStyle = INK2; c.textAlign = 'right'; c.fillText(fmtTick(v, ta.step), x0 - px(8), y);
  }
  // right ticks
  c.textAlign = 'left';
  for (let v = pa.lo; v <= pa.hi + 1e-9; v += pa.step) {
    const y = py(v);
    c.strokeStyle = 'rgba(232,228,217,0.25)'; c.beginPath(); c.moveTo(x1, y + 0.5); c.lineTo(x1 + px(4), y + 0.5); c.stroke();
    c.fillStyle = INK2; c.fillText(fmtTick(v, pa.step), x1 + px(7), y);
  }
  c.strokeStyle = 'rgba(232,228,217,0.25)'; c.beginPath(); c.moveTo(x0 + 0.5, y0); c.lineTo(x0 + 0.5, y1); c.moveTo(x1 + 0.5, y0); c.lineTo(x1 + 0.5, y1); c.moveTo(x0, y1 + 0.5); c.lineTo(x1, y1 + 0.5); c.stroke();
  // axis titles
  c.save(); c.fillStyle = INK2; c.font = `${px(13)}px ${MONO}`; c.textAlign = 'center';
  c.translate(px(16), (y0 + y1) / 2); c.rotate(-Math.PI / 2); c.fillText(`Temperature (${tUnit()})`, 0, 0); c.restore();
  c.save(); c.fillStyle = INK2; c.font = `${px(13)}px ${MONO}`; c.textAlign = 'center';
  c.translate(W - px(14), (y0 + y1) / 2); c.rotate(Math.PI / 2); c.fillText(`Precipitation (${S.p})`, 0, 0); c.restore();
  // months
  c.textAlign = 'center'; c.textBaseline = 'top'; c.font = `${px(13)}px ${MONO}`;
  for (let i = 0; i < 12; i++) { c.fillStyle = i === hl ? INK : INK2; c.fillText(cw < px(30) ? MONTHS[i][0] : MONTHS[i], cx(i), y1 + px(8)); }

  // precip bars
  const nb = cities.length, bw = Math.min(cw * (nb === 1 ? 0.52 : 0.36), px(54));
  cities.forEach((s, k) => {
    for (let i = 0; i < 12; i++) {
      const v = s.prcp[i]; if (!isNum(v)) continue;
      const bx = nb === 1 ? cx(i) - bw / 2 : cx(i) + (k === 0 ? -bw - 1 : 1), top = py(pU(v));
      c.fillStyle = nb === 1 ? precipCol(v, 0.5) : (k === 0 ? 'rgba(208,132,37,0.42)' : 'rgba(109,150,216,0.42)');
      c.fillRect(bx, top, bw, y1 - top);
      c.strokeStyle = nb === 1 ? 'rgba(232,228,217,0.18)' : (k === 0 ? 'rgba(208,132,37,0.9)' : 'rgba(109,150,216,0.9)');
      c.lineWidth = 1; c.strokeRect(Math.round(bx) + 0.5, Math.round(top) + 0.5, Math.round(bw) - 1, Math.max(0, Math.round(y1 - top) - 1));
      if (o.vals) { c.fillStyle = INK2; c.font = `${px(12)}px ${MONO}`; c.textBaseline = 'bottom'; c.fillText(fPs(v), bx + bw / 2, top - px(2)); }
    }
  });
  // high–low band
  if (o.band) cities.forEach((s, k) => {
    c.beginPath();
    for (let i = 0; i < 12; i++) { const y = ty(tU(s.tmax[i])); i ? c.lineTo(cx(i), y) : c.moveTo(cx(i), y); }
    for (let i = 11; i >= 0; i--) c.lineTo(cx(i), ty(tU(s.tmin[i])));
    c.closePath(); c.fillStyle = k === 0 ? 'rgba(208,132,37,0.15)' : 'rgba(109,150,216,0.15)'; c.fill();
    c.setLineDash([px(3), px(3)]); c.strokeStyle = k === 0 ? 'rgba(208,132,37,0.55)' : 'rgba(109,150,216,0.55)'; c.lineWidth = 1; c.stroke(); c.setLineDash([]);
  });
  // range guides + bracket
  if (o.range) cities.forEach((s, k) => {
    if (s.warm < 0 || s.cold < 0) return;
    const yw = ty(tU(s.tavg[s.warm])), yc = ty(tU(s.tavg[s.cold])), bx = x0 + 12 * cw + px(16) * laneK + k * px(56) * laneK;
    const colr = B ? COL[k ? 'b' : 'a'] : INK;
    c.strokeStyle = B ? colr : 'rgba(232,228,217,0.7)'; c.lineWidth = 1; c.setLineDash([px(2), px(3)]);
    c.beginPath(); c.moveTo(cx(s.warm), yw); c.lineTo(bx, yw); c.moveTo(cx(s.cold), yc); c.lineTo(bx, yc); c.stroke(); c.setLineDash([]);
    c.lineWidth = 2; c.strokeStyle = colr;
    c.beginPath(); c.moveTo(bx - px(5), yw); c.lineTo(bx, yw); c.lineTo(bx, yc); c.lineTo(bx - px(5), yc); c.stroke();
    c.fillStyle = colr; c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = `700 ${px(laneK < 0.8 ? 12 : 14)}px ${MONO}`;
    c.fillText((laneK < 0.8 ? dU(s.range).toFixed(0) : dU(s.range).toFixed(1)) + '°', bx + px(5), (yw + yc) / 2);
    if (k === 0) { c.fillStyle = INK2; c.font = `${px(12)}px ${MONO}`; c.textBaseline = 'bottom'; c.fillText('RANGE', x0 + 12 * cw + px(10), Math.min(yw, B ? ty(tU(B.tavg[B.warm])) : yw) - px(8)); }
  });
  // average temperature lines
  cities.forEach((s, k) => {
    const colr = COL[k ? 'b' : 'a'];
    c.strokeStyle = colr; c.lineWidth = px(3); c.lineJoin = 'round';
    c.beginPath(); for (let i = 0; i < 12; i++) { const y = ty(tU(s.tavg[i])); i ? c.lineTo(cx(i), y) : c.moveTo(cx(i), y); } c.stroke();
    for (let i = 0; i < 12; i++) {
      const y = ty(tU(s.tavg[i]));
      c.beginPath(); c.arc(cx(i), y, px(i === hl ? 6.5 : 5), 0, Math.PI * 2); c.fillStyle = tempCol(s.tavg[i]); c.fill();
      c.lineWidth = px(1.6); c.strokeStyle = colr; c.stroke();
      if (o.vals) { c.fillStyle = INK; c.font = `700 ${px(12)}px ${MONO}`; c.textAlign = 'center'; c.textBaseline = k ? 'top' : 'bottom'; c.fillText(tU(s.tavg[i]).toFixed(0), cx(i), y + (k ? px(9) : -px(9))); }
    }
  });
  c.restore();
  return { x0, x1, y0, y1, cw, pw };
}

// ─── MAP GEOMETRY (Albers, AK/HI/PR insets — as the US Season Map) ────────
function albers(lon0, lat0, p1, p2) {
  const r = Math.PI / 180, s1 = Math.sin(p1 * r), s2 = Math.sin(p2 * r), n = (s1 + s2) / 2;

    const f1 = v => isNum(v) ? (Math.round(tU(v) * 10) / 10).toString() : '';
    const fp = v => isNum(v) ? (S.p === 'mm' ? (Math.round(pU(v) * 10) / 10).toString() : v.toFixed(2)) : '';
    const fs = v => isNum(v) ? (S.p === 'mm' ? (Math.round(v * 25.4) / 10).toString() : v.toFixed(1)) : '';
    const lines = ['# Monthly climate normals 1991-2020 (NOAA NCEI); monthly records from NOAA RCC ACIS. Source: contextclimate.io climographs.',
      ['station', 'id', 'month', `avg_high_${u}`, `avg_low_${u}`, `avg_${u}`, `precip_${p}`, `precip_median_${p}`, `snowfall_${sn}`, `record_high_${u}`, `record_low_${u}`, `wettest_month_on_record_${p}`, 'wettest_year'].join(',')];
    (B ? [A, B] : [A]).forEach((s, k) => {
      const nm = k === 0 && hidden() ? 'Mystery city' : label(s), id = k === 0 && hidden() ? '' : s.id;
      s.m.forEach((m, i) => lines.push([`"${nm}"`, id, MONTHS[i], f1(m.tmax), f1(m.tmin), f1(m.tavg), fp(m.prcp), fp(m.prcp_med), fs(m.snow), f1(m.record_high), f1(m.record_low), fp(m.extreme_prcp), m.extreme_prcp_year || ''].join(',')));
    });
    download(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }), `${slug()}.csv`);
  };
  initFinder('si-a', 'dd-a', 'fa', 'a');
  initFinder('si-b', 'dd-b', 'fb', 'b');
  wirePointer();
  let lastKey = '', lastLoc = '';
  new ResizeObserver(() => { const s = $('stage'), k = s.offsetWidth + 'x' + s.offsetHeight; if (k !== lastKey) { lastKey = k; draw(); } }).observe($('stage'));
  new ResizeObserver(() => { const s = $('loc-wrap'), k = s.offsetWidth + 'x' + s.offsetHeight; if (k !== lastLoc) { lastLoc = k; drawLoc(); } }).observe($('loc-wrap'));
  window.addEventListener('resize', () => { const d = window.devicePixelRatio || 1; if (d !== dpr) { dpr = d; draw(); } });

  Promise.all([
    fetch('climo_data.json').then(r => { if (!r.ok) throw new Error('data ' + r.status); return r.json(); }),
    fetch('states-500k.geojson').then(r => r.ok ? r.json() : null).catch(() => null),
  ]).then(([data, gj]) => {
    ST = Object.entries(data).map(([id, v]) => prep(id, v)).filter(s => s.tavg.some(isNum));
    ST.forEach(s => BY[s.id] = s);
    if (gj) try { buildGeo(gj); } catch (e) { GEO = null; }
    readURL();
    ready = true; $('state').hidden = true;
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => refresh());
    refresh();
  }).catch(err => {
    $('state').innerHTML = `<div class="err">Climate normals failed to load (${esc(err.message)}).</div>`;
  });
})();
window.__climo = () => ({ S: JSON.parse(JSON.stringify(S)), n: ST.length, pairs: PAIRS, st: id => BY[id] && { id, name: BY[id].name, kop: BY[id].kop, range: BY[id].range, ann: BY[id].ann, pAnn: BY[id].pAnn, warm: BY[id].warm, cold: BY[id].cold } });
</script>
