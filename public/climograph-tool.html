<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1180">
<title>Climographs — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>

:root { --tool-accent: var(--accent-climate); } /* Climate section */

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px 56px; }

/* ── Header ────────────────────────────────────────────────────── */
.climo-header { padding: 20px 0 16px; border-bottom: 1px solid var(--color-border); margin-bottom: 20px; }
.header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.header-id { min-width: 260px; }
.city-title { font-family: var(--font-display); font-size: 42px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; color: var(--color-text-primary); }
.city-meta { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-muted); letter-spacing: .03em; margin-top: 7px; }
.compare-line { font-family: var(--font-body); font-size: 15px; color: var(--accent-hourly); margin-top: 5px; }
.compare-line .vs-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent-hourly); margin-right:7px; vertical-align:1px; }
.koppen-wrap { display: none; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
.koppen-badge { font-family: var(--font-mono); font-size: 18px; font-weight: 700; letter-spacing: .04em; padding: 6px 16px; border-radius: var(--radius-md); background: var(--color-surface-2); border: 1px solid var(--tool-accent); color: var(--tool-accent); }
.koppen-name { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); text-align: right; max-width: 220px; }

.search-row { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.finder-group { position: relative; flex: 0 0 auto; display: flex; align-items: stretch; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color .15s; }
.finder-group:focus-within { border-color: var(--tool-accent); }
.finder-group .search-icon { position: static; display: flex; align-items: center; padding-left: 12px; color: var(--color-text-muted); font-size: 15px; pointer-events: none; }
.finder-group .search-input { width: 240px; background: transparent; border: none; border-radius: 0; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
.finder-group .search-input::placeholder { color: var(--color-text-muted); }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 272px; overflow-y: auto; z-index: 200; display: none; box-shadow: 0 10px 32px rgba(0,0,0,.6); }
.dropdown.open { display: block; }
.d-item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); transition: background .1s; }
.d-item:last-child { border-bottom: none; }
.d-item:hover, .d-item.hi { background: rgba(208,132,37,.18); }
.d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 46px; flex-shrink: 0; }
.d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-item .d-st { color: var(--color-text-muted); font-size: 13px; width: 24px; text-align: right; }
.d-item .d-nodata { color: var(--color-text-muted); font-size: 10px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--color-border); border-radius:3px; padding:1px 5px; flex-shrink:0; }
.sw2-wrap { display: none; align-items: center; gap: 10px; }
.compare-remove-btn { color: var(--accent-seasons); }

.units-row { display: flex; align-items: center; gap: 14px; margin-top: 16px; flex-wrap: wrap; }

/* ── Banner note (compare-city missing data, etc.) ───────────────── */
.banner-note { display:none; align-items:center; gap:10px; background: rgba(208,132,37,.08); border: 1px solid rgba(208,132,37,.3); border-radius: var(--radius-md); padding: 9px 14px; font-family: var(--font-body); font-size: 13.5px; color: var(--color-text-secondary); margin-bottom: 16px; }
.banner-note.show { display: flex; }
.banner-note .b-icon { color: var(--tool-accent); font-size: 15px; flex-shrink: 0; }

/* ── Stat chips ───────────────────────────────────────────────── */
.stat-block { margin-bottom: 18px; }
.stat-block-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
.stat-block-label .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.cc-stat-chip { min-width: 148px; }
.cc-stat-value { font-size: 24px; }

/* ── Chart panel ──────────────────────────────────────────────── */
.section-hdr { display: flex; align-items: center; justify-content: space-between; margin: 30px 0 10px; gap: 10px; flex-wrap: wrap; }
.section-title { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--color-text-primary); }
.chart-box { position: relative; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 14px 8px 8px; max-width: 820px; margin: 0 auto; }
.chart-png-btn { position: absolute; top: 12px; right: 12px; z-index: 6; opacity: .85; }
.chart-png-btn:hover { opacity: 1; }
#climo-chart { height: 640px; }
.chart-empty-note { text-align:center; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); padding: 4px 0 2px; }
.legend-band { display:flex; justify-content:center; margin-top: 10px; }
.chart-note { text-align:center; font-family: var(--font-mono); font-size: 11.5px; letter-spacing:.02em; color: var(--color-text-muted); margin-top: 8px; }
.cc-legend-chip.clickable { cursor: pointer; user-select: none; transition: opacity .15s ease, border-color .15s ease; }
.cc-legend-chip.clickable:hover { border-color: var(--tool-accent); }
.cc-legend-chip.off { opacity: .38; }
.cc-legend-chip.off .cc-legend-dot { background: var(--color-text-muted) !important; }

/* ── Empty state ──────────────────────────────────────────────── */
.empty-state { background: var(--color-surface); border: 1px dashed var(--color-border-hover); border-radius: var(--radius-lg); padding: 46px 30px; text-align: center; }
.empty-state .es-icon { font-size: 34px; margin-bottom: 12px; opacity: .7; }
.empty-state .es-title { font-family: var(--font-display); font-size: 21px; font-weight: 600; color: var(--color-text-primary); margin-bottom: 8px; }
.empty-state .es-body { font-family: var(--font-body); font-size: 14.5px; color: var(--color-text-secondary); max-width: 460px; margin: 0 auto; line-height: 1.6; }
.empty-state code { font-family: var(--font-mono); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 3px; padding: 1px 6px; color: var(--tool-accent); }
.load-error { background: var(--color-surface); border: 1px solid rgba(214,126,96,.4); border-radius: var(--radius-lg); padding: 30px; text-align:center; font-family: var(--font-body); color: var(--color-text-secondary); }
.load-error strong { color: var(--accent-seasons); }

/* ── Tables ───────────────────────────────────────────────────── */
.tables-wrap { display: flex; flex-direction: column; gap: 26px; margin-top: 6px; }
.city-table-group { }
.city-table-group-hdr { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 10px; display:flex; align-items:center; gap:8px; }
.city-table-group-hdr .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink:0; }
.tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .tables-grid { grid-template-columns: 1fr; } }
.table-panel { position: relative; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 14px; overflow-x: auto; }
.table-panel-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
.table-panel-title { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.data-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 12.5px; min-width: 430px; }
.data-table th { text-align: right; padding: 7px 9px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; font-weight: 600; border-bottom: 1px solid var(--color-border); background: var(--color-surface-2); white-space: nowrap; }
.data-table th:first-child, .data-table td:first-child { text-align: left; }
.data-table td { padding: 6px 9px; text-align: right; color: var(--color-text-primary); border-bottom: 1px solid rgba(232,228,217,.06); white-space: nowrap; }
.data-table tbody tr:nth-child(even) td { background: rgba(255,255,255,.02); }
.data-table tbody tr:hover td { background: rgba(208,132,37,.07); }
.data-table td.dim { color: var(--color-text-muted); }
.data-table tfoot td { font-weight: 700; color: var(--color-text-primary); border-top: 1px solid var(--color-border-hover); border-bottom: none; background: var(--color-surface-2); }

/* ── Footer ───────────────────────────────────────────────────── */
.tool-footer { margin-top: 40px; padding-top: 18px; border-top: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

@media (max-width: 700px) {
  .city-title { font-size: 32px; }
  #climo-chart { height: 460px; }
  .chart-box { max-width: none; }
  .header-top { flex-direction: column; }
  .koppen-wrap { align-items: flex-start; }
  .koppen-name { text-align: left; }
}
</style>
</head>

  <!-- STAT CHIPS -->

  <!-- CHART -->
  <div class="section-hdr">

  <div id="chart-section">

      <button class="cc-btn cc-btn-sm chart-png-btn" id="chart-png-btn" type="button">&darr; PNG</button>

    <div class="legend-band cc-legend-row" id="chart-legend"></div>

  <!-- TABLES -->

  </div>
  <div class="tables-wrap" id="tables-container"></div>

  <div class="tool-footer">

    <span class="cc-tag">ContextClimate &middot; contextclimate.io</span>
  </div>

</div>

  precipMonthly: { vals:[0,0.25,1.5,3.5,6,12], cols:['#232323','#0d2812','#1c7020','#40c030','#b0d820','#e4d800'] },
};
function hexToRGB(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }
function getColorRGB(val,scale){
  if (val==null||isNaN(val)) return [30,35,32];
  const {vals,cols} = scale;
  if (val<=vals[0]) return hexToRGB(cols[0]);
  if (val>=vals[vals.length-1]) return hexToRGB(cols[cols.length-1]);
  for (let i=0;i<vals.length-1;i++){
    if (val>=vals[i] && val<=vals[i+1]){
      const t=(val-vals[i])/(vals[i+1]-vals[i]);
      const a=hexToRGB(cols[i]), b=hexToRGB(cols[i+1]);
      return [Math.round(a[0]+t*(b[0]-a[0])),Math.round(a[1]+t*(b[1]-a[1])),Math.round(a[2]+t*(b[2]-a[2]))];
    }
  }
  return hexToRGB(cols[cols.length-1]);
}
function tempColorRGBA(fVal,alpha){ const [r,g,b]=getColorRGB(fVal,SCALES.temp); return `rgba(${r},${g},${b},${alpha==null?1:alpha})`; }
function precipColorRGBA(inVal,alpha){ const [r,g,b]=getColorRGB(inVal,SCALES.precipMonthly); return `rgba(${r},${g},${b},${alpha==null?1:alpha})`; }

const ACCENT_A = '#D08425';       // city A — tool accent (climate)
const ACCENT_B = '#6D96D8';       // city B — hourly accent, per spec

// Fixed climograph axis bounds (canonical °F / inches — converted for
// display via tempVal()/precipVal() same as everything else). Chosen to
// comfortably span the station roster's full climate diversity — Arctic
// Alaska winters (Barrow/Fairbanks normal lows near -20°F) through Desert
// Southwest summers (Phoenix/Yuma normal highs ~107°F), plus the wettest
// Gulf Coast/Hawaii monthly precip totals — without ever rescaling per
// city. See renderChart() for why a fixed scale matters here.
const TEMP_AXIS_MIN_F = -30, TEMP_AXIS_MAX_F = 120;
const PRECIP_AXIS_MAX_IN = 20;

// ================================================================
// PLOTLY BASE (opaque card, monospace font, no drag/zoom)
// ================================================================
const PLOTLY_BASE = { paper_bgcolor:'#262B27', plot_bgcolor:'#262B27', font:{family:'Courier Prime, monospace', color:'rgba(232,228,217,.6)', size:13}, hoverlabel:{bgcolor:'#2C322D', bordercolor:'rgba(232,228,217,.2)', font:{family:'Courier Prime, monospace', size:13}}, dragmode:false };
function chartConfig(){ return { responsive:true, displayModeBar:false, scrollZoom:false }; }

// ================================================================
// STATE
// ================================================================
const state = {
  cityA: null,
  cityB: null,
  compare: false,
  tempUnit: 'f',   // 'f' | 'c'
  precipUnit: 'in',// 'in' | 'mm'
  climoData: null, // fetched climo_data.json
  dataError: false,
  // Legend click-to-toggle: which trace groups are shown per city slot.
  vis: { tempA: true, precipA: true, tempB: true, precipB: true },
};

// ================================================================
// UNIT CONVERSION — canonical storage stays °F / inches; conversion is
// display-only, applied at render time in every consumer (chart, tables,
// stat chips, PNG exports).
// ================================================================
function fmtTemp(f){
  if (f==null||isNaN(f)) return '—';
  const v = state.tempUnit==='c' ? (f-32)*5/9 : f;
  return v.toFixed(1) + '°' + state.tempUnit.toUpperCase();
}
function tempVal(f){ if (f==null||isNaN(f)) return null; return state.tempUnit==='c' ? (f-32)*5/9 : f; }
function precipVal(inches){ if (inches==null||isNaN(inches)) return null; return state.precipUnit==='mm' ? inches*25.4 : inches; }
function fmtPrecip(inches){
  if (inches==null||isNaN(inches)) return '—';
  const v = precipVal(inches);
  return (state.precipUnit==='mm' ? v.toFixed(0) : v.toFixed(2)) + ' ' + state.precipUnit;
}
function tempAxisLabel(){ return 'Temperature (°' + state.tempUnit.toUpperCase() + ')'; }
function precipAxisLabel(){ return 'Precipitation (' + state.precipUnit + ')'; }
function elevLabel(ft){ return ft==null ? '—' : Math.round(ft).toLocaleString('en-US') + ' ft'; }
function coordLabel(lat, lon){
  const ns = lat>=0 ? 'N' : 'S', ew = lon>=0 ? 'E' : 'W';
  return `${Math.abs(lat).toFixed(4)}°${ns}, ${Math.abs(lon).toFixed(4)}°${ew}`;
}

// ================================================================
// DATA HELPERS
// ================================================================
function hasClimoData(icao){ return !!(icao && state.climoData && state.climoData[icao]); }
function cityMeta(icao){ return icao ? STATIONS_BY_ICAO[icao] : null; }
function cityClimo(icao){ return hasClimoData(icao) ? state.climoData[icao] : null; }
function cityDisplayName(icao){
  const climo = cityClimo(icao);
  if (climo) return `${climo.name}, ${climo.state}`;
  const meta = cityMeta(icao);
  return meta ? `${meta.name}, ${meta.state}` : icao;
}

function monthArray(climo, field){ return climo.months.map(m => m[field]); }

function statsFor(climo){
  const tavg = monthArray(climo,'tavg'), prcp = monthArray(climo,'prcp');
  const argmax = arr => arr.reduce((best,v,i)=> (v!=null && (best.v==null||v>best.v)) ? {i,v} : best, {i:-1,v:null});
  const argmin = arr => arr.reduce((best,v,i)=> (v!=null && (best.v==null||v<best.v)) ? {i,v} : best, {i:-1,v:null});
  const warm = argmax(tavg), cold = argmin(tavg), wet = argmax(prcp), dry = argmin(prcp);
  return { warm, cold, wet, dry };
}

// ================================================================
// SIMPLIFIED KÖPPEN-GEIGER CLASSIFICATION
// Standard decision rules (Peel, Finlay & McMahon 2007 simplification),
// computed from the loaded station's monthly tavg (°F) / prcp (in). This is
// an approximation from normals data, not an authoritative Köppen source —
// labeled as such in the UI tooltip.
// ================================================================
const KOPPEN_NAMES = {
  Af:'Tropical Rainforest', Am:'Tropical Monsoon', Aw:'Tropical Savanna', As:'Tropical Savanna (dry summer)',
  BWh:'Hot Desert', BWk:'Cold Desert', BSh:'Hot Semi-Arid', BSk:'Cold Semi-Arid',
  Csa:'Hot-Summer Mediterranean', Csb:'Warm-Summer Mediterranean', Csc:'Cold-Summer Mediterranean',
  Cwa:'Humid Subtropical (dry winter)', Cwb:'Subtropical Highland', Cwc:'Cold Subtropical Highland',
  Cfa:'Humid Subtropical', Cfb:'Oceanic', Cfc:'Subpolar Oceanic',
  Dsa:'Hot-Summer Mediterranean Continental', Dsb:'Warm-Summer Mediterranean Continental', Dsc:'Dry-Summer Subarctic', Dsd:'Dry-Summer Very Cold Subarctic',
  Dwa:'Hot-Summer Humid Continental (dry winter)', Dwb:'Warm-Summer Humid Continental (dry winter)', Dwc:'Subarctic (dry winter)', Dwd:'Very Cold Subarctic (dry winter)',
  Dfa:'Hot-Summer Humid Continental', Dfb:'Warm-Summer Humid Continental', Dfc:'Subarctic', Dfd:'Very Cold Subarctic',
  ET:'Tundra', EF:'Ice Cap',
};
function classifyKoppen(climo){
  const tavgF = monthArray(climo,'tavg'), prcpIn = monthArray(climo,'prcp');
  if (tavgF.some(v=>v==null) || prcpIn.some(v=>v==null)) return null;
  const tC = tavgF.map(f => (f-32)*5/9);
  const pMm = prcpIn.map(i => i*25.4);
  const Tann = tC.reduce((a,b)=>a+b,0)/12;
  const Pann = pMm.reduce((a,b)=>a+b,0);
  const Tcold = Math.min(...tC), Twarm = Math.max(...tC);
  const summerIdx=[3,4,5,6,7,8], winterIdx=[9,10,11,0,1,2]; // NH: Apr-Sep / Oct-Mar
  const Psummer = summerIdx.reduce((s,i)=>s+pMm[i],0), Pwinter = winterIdx.reduce((s,i)=>s+pMm[i],0);
  const summerFrac = Psummer/Pann, winterFrac = Pwinter/Pann;

  let Pthreshold;
  if (summerFrac>=0.7) Pthreshold = 20*Tann+280;
  else if (winterFrac>=0.7) Pthreshold = 20*Tann;
  else Pthreshold = 20*Tann+140;

  const monthsAbove10 = tC.filter(v=>v>=10).length;
  const thirdLetterMid = () => Twarm>=22 ? 'a' : (monthsAbove10>=4 ? 'b' : 'c');
  const secondLetterCD = () => {
    const PdriestSummer = Math.min(...summerIdx.map(i=>pMm[i]));
    const PwettestSummer = Math.max(...summerIdx.map(i=>pMm[i]));
    const PdriestWinter = Math.min(...winterIdx.map(i=>pMm[i]));
    const PwettestWinter = Math.max(...winterIdx.map(i=>pMm[i]));
    if (PdriestSummer<40 && PdriestSummer<PwettestWinter/3) return 's';
    if (PdriestWinter<PwettestSummer/10) return 'w';
    return 'f';
  };

  let code;
  if (Pann < Pthreshold) {
    const w = Pann < Pthreshold/2 ? 'W' : 'S';
    const sub = Tann>=18 ? 'h' : 'k';
    code = 'B'+w+sub;
  } else if (Tcold >= 18) {
    const Pdriest = Math.min(...pMm);
    if (Pdriest>=60) code='Af';
    else if (Pdriest >= 100-Pann/25) code='Am';
    else code='Aw';
  } else if (Tcold > -3) {
    code = 'C'+secondLetterCD()+thirdLetterMid();
  } else if (Twarm >= 10) {
    const third = Twarm>=22 ? 'a' : (monthsAbove10>=4 ? 'b' : (Tcold>-38 ? 'c' : 'd'));
    code = 'D'+secondLetterCD()+third;
  } else {
    code = Twarm>0 ? 'ET' : 'EF';
  }
  return { code, name: KOPPEN_NAMES[code] || 'Unclassified' };
}

// ================================================================
// SEARCH / AUTOCOMPLETE — site-wide convention (current-conditions.html)
// ================================================================
function initSearch(inputId, ddId, onPick){
  const inp = document.getElementById(inputId), dd = document.getElementById(ddId);
  let ddIdx = -1;
  inp.addEventListener('input', () => {
    ddIdx = -1;
    const q = inp.value.trim().toLowerCase();
    if (!q) { dd.classList.remove('open'); return; }
    const matches = STATIONS.filter(s =>
      s.icao.toLowerCase().startsWith(q) ||
      s.icao.slice(1).toLowerCase().startsWith(q) ||
      s.name.toLowerCase().includes(q) ||
      (s.state && s.state.toLowerCase()===q)
    ).slice(0,18);
    renderDD(matches);
  });
  inp.addEventListener('keydown', e => {
    const items = dd.querySelectorAll('.d-item');
    if (e.key==='ArrowDown'){ e.preventDefault(); ddIdx=Math.min(ddIdx+1,items.length-1); highlight(items); }
    else if (e.key==='ArrowUp'){ e.preventDefault(); ddIdx=Math.max(ddIdx-1,0); highlight(items); }
    else if (e.key==='Enter'){ e.preventDefault(); if (ddIdx>=0 && items[ddIdx]) items[ddIdx].click(); }
    else if (e.key==='Escape'){ dd.classList.remove('open'); }
  });
  document.addEventListener('click', e => { if (!inp.closest('.finder-group').contains(e.target)) dd.classList.remove('open'); });
  function highlight(items){ items.forEach((el,i)=>{ el.classList.toggle('hi', i===ddIdx); if (i===ddIdx) el.scrollIntoView({block:'nearest'}); }); }
  function renderDD(matches){
    if (!matches.length){ dd.innerHTML=''; dd.classList.remove('open'); return; }
    dd.innerHTML = matches.map(s => `<div class="d-item"><span class="d-id">${s.icao}</span><span class="d-name">${s.name}, ${s.state}</span>${hasClimoData(s.icao)?'':'<span class="d-nodata">no data</span>'}</div>`).join('');
    dd.querySelectorAll('.d-item').forEach((el,i)=>el.addEventListener('click', () => { inp.value=''; dd.classList.remove('open'); onPick(matches[i]); }));
    dd.classList.add('open');
  }
}

function renderHeader(){
  const metaA = cityMeta(state.cityA);
  const climoA = cityClimo(state.cityA);
  document.getElementById('city-title').textContent = metaA ? `${(climoA?climoA.name:metaA.name)}, ${metaA.state}` : 'Select a city';
  const metaLine = metaA ? `${coordLabel(metaA.lat, metaA.lon)} · ${elevLabel(metaA.elev_ft)} elevation` : '';
  document.getElementById('city-meta').textContent = metaLine;

  const compareLine = document.getElementById('compare-line');
  if (state.compare && state.cityB) {
    compareLine.style.display = 'block';
    compareLine.innerHTML = `<span class="vs-dot"></span>vs. ${cityDisplayName(state.cityB)}`;
  } else {
    compareLine.style.display = 'none';
  }

  const kWrap = document.getElementById('koppen-wrap');
  if (climoA) {
    const k = classifyKoppen(climoA);
    if (k) {
      kWrap.style.display = 'flex';
      document.getElementById('koppen-badge').textContent = k.code;
      document.getElementById('koppen-badge').title = 'Simplified Köppen–Geiger classification, estimated from 1991–2020 monthly normals';
      document.getElementById('koppen-name').textContent = k.name;
    } else { kWrap.style.display = 'none'; }
  } else { kWrap.style.display = 'none'; }
}

function renderBanner(){
  const banner = document.getElementById('banner-note');

    banner.classList.add('show');

  } else {
    banner.classList.remove('show');
  }
}

// ================================================================
// STAT CHIPS
// ================================================================
function statChipHTML(label, monthIdx, valueText, noteText){
  const month = monthIdx>=0 ? MONTHS_FULL[monthIdx] : '—';
  return `<div class="cc-stat-chip"><div class="cc-stat-label">${label}</div><div class="cc-stat-value">${month}</div><div class="cc-stat-note">${valueText}${noteText?(' · '+noteText):''}</div></div>`;
}
function renderStatsBlock(climo, accentColor, label){
  if (!climo) return '';
  const s = statsFor(climo);
  const chips = [
    statChipHTML('Warmest Month', s.warm.i, fmtTemp(s.warm.v), 'avg'),
    statChipHTML('Coldest Month', s.cold.i, fmtTemp(s.cold.v), 'avg'),
    statChipHTML('Wettest Month', s.wet.i, fmtPrecip(s.wet.v), 'avg'),
    statChipHTML('Driest Month', s.dry.i, fmtPrecip(s.dry.v), 'avg'),
  ].join('');
  const labelHTML = label ? `<div class="stat-block-label"><span class="dot" style="background:${accentColor}"></span>${label}</div>` : '';
  return `<div class="stat-block">${labelHTML}<div class="cc-stat-row">${chips}</div></div>`;
}
function renderStats(){
  const climoA = cityClimo(state.cityA), climoB = (state.compare && hasClimoData(state.cityB)) ? cityClimo(state.cityB) : null;
  let html = '';
  if (climoA) html += renderStatsBlock(climoA, ACCENT_A, climoB ? cityDisplayName(state.cityA) : null);
  if (climoB) html += renderStatsBlock(climoB, ACCENT_B, cityDisplayName(state.cityB));
  document.getElementById('stats-container').innerHTML = html;
}

// ================================================================
// CHART
// ================================================================
function renderChart(){
  const chartSection = document.getElementById('chart-section');
  const climoA = cityClimo(state.cityA);

  if (!climoA) {
    chartSection.innerHTML = emptyStateHTML();
    document.getElementById('chart-legend').innerHTML = '';
    return;
  }
  // Restore chart markup if a previous render replaced it with the empty state.
  if (!document.getElementById('climo-chart')) {
    chartSection.innerHTML = `<div class="chart-box"><button class="cc-btn cc-btn-sm chart-png-btn" id="chart-png-btn" type="button">&darr; PNG</button><div id="climo-chart"></div></div><div class="legend-band cc-legend-row" id="chart-legend"></div><div class="chart-note" id="chart-note">Shaded band = each month's average daily high&ndash;low spread, not year-to-year variability.</div>`;
    document.getElementById('chart-png-btn').addEventListener('click', () => exportChartPNG());
  }

  const climoB = (state.compare && hasClimoData(state.cityB)) ? cityClimo(state.cityB) : null;

  const tavgA = monthArray(climoA,'tavg'), tmaxA = monthArray(climoA,'tmax'), tminA = monthArray(climoA,'tmin'), prcpA = monthArray(climoA,'prcp');
  const tavgAd = tavgA.map(tempVal), tmaxAd = tmaxA.map(tempVal), tminAd = tminA.map(tempVal), prcpAd = prcpA.map(precipVal);

  const traces = [];

  // City A shaded tmin–tmax band
  traces.push({ x: MONTHS.concat(MONTHS.slice().reverse()), y: tmaxAd.concat(tminAd.slice().reverse()),
    fill:'toself', fillcolor:'rgba(208,132,37,.13)', line:{width:0}, showlegend:false, hoverinfo:'skip', yaxis:'y', type:'scatter', mode:'lines',
    visible: state.vis.tempA });

  // City A temp line — markers colored by value on the shared temp scale
  traces.push({ x: MONTHS, y: tavgAd, name: (climoB?cityDisplayName(state.cityA):'Avg Temp'), type:'scatter', mode:'lines+markers',
    line:{color:ACCENT_A, width:3}, marker:{size:8, color: tavgA.map(v=>tempColorRGBA(v,1)), line:{color:ACCENT_A,width:1}},
    yaxis:'y', visible: state.vis.tempA,
    hovertemplate:'%{x}: %{y:.1f}°'+state.tempUnit.toUpperCase()+'<extra>'+cityDisplayName(state.cityA)+'</extra>' });

  // City A precip bars — colored by value on the monthly precip scale
  traces.push({ x: MONTHS, y: prcpAd, name: (climoB?cityDisplayName(state.cityA)+' Precip':'Precipitation'), type:'bar',
    marker:{color: prcpA.map(v=>precipColorRGBA(v,.88)), line:{color:'rgba(232,228,217,.15)',width:1}},
    yaxis:'y2', visible: state.vis.precipA,
    hovertemplate:'%{x}: %{y:.2f} '+state.precipUnit+'<extra>'+cityDisplayName(state.cityA)+'</extra>' });

  if (climoB) {
    const tavgB = monthArray(climoB,'tavg'), tmaxB = monthArray(climoB,'tmax'), tminB = monthArray(climoB,'tmin'), prcpB = monthArray(climoB,'prcp');
    const tavgBd = tavgB.map(tempVal), tmaxBd = tmaxB.map(tempVal), tminBd = tminB.map(tempVal), prcpBd = prcpB.map(precipVal);

    traces.push({ x: MONTHS.concat(MONTHS.slice().reverse()), y: tmaxBd.concat(tminBd.slice().reverse()),
      fill:'toself', fillcolor:'rgba(109,150,216,.13)', line:{width:0}, showlegend:false, hoverinfo:'skip', yaxis:'y', type:'scatter', mode:'lines',
      visible: state.vis.tempB });

    traces.push({ x: MONTHS, y: tavgBd, name: cityDisplayName(state.cityB), type:'scatter', mode:'lines+markers',
      line:{color:ACCENT_B, width:3, dash:'dash'}, marker:{size:7, color:ACCENT_B, symbol:'diamond'},
      yaxis:'y', visible: state.vis.tempB,
      hovertemplate:'%{x}: %{y:.1f}°'+state.tempUnit.toUpperCase()+'<extra>'+cityDisplayName(state.cityB)+'</extra>' });

    traces.push({ x: MONTHS, y: prcpBd, name: cityDisplayName(state.cityB)+' Precip', type:'bar',
      marker:{color: 'rgba(109,150,216,.55)', line:{color:ACCENT_B,width:1}},
      yaxis:'y2', visible: state.vis.precipB,
      hovertemplate:'%{x}: %{y:.2f} '+state.precipUnit+'<extra>'+cityDisplayName(state.cityB)+'</extra>' });
  }

  // Fixed axis scale (see TEMP_AXIS_MIN_F/MAX_F, PRECIP_AXIS_MAX_IN above) —
  // deliberately NOT computed from this city's data. A dynamic per-city
  // range stretches every climograph to fill the same box, which erases the
  // very thing this chart exists to show: comparing temperature swing
  // (slope) and precip amount (bar height) across different places.
  const yRange = [tempVal(TEMP_AXIS_MIN_F), tempVal(TEMP_AXIS_MAX_F)];
  const y2Range = [0, precipVal(PRECIP_AXIS_MAX_IN)];

  const axisFont = {family:'Courier Prime, monospace', color:'rgba(232,228,217,.6)', size:12};
  const layout = {
    ...PLOTLY_BASE,
    barmode: climoB ? 'group' : 'overlay',
    margin: {l:56, r:58, t:14, b:40},
    xaxis: { tickfont:axisFont, gridcolor:'rgba(232,228,217,.05)', zeroline:false },
    yaxis: { title:{text:tempAxisLabel(),font:axisFont}, tickfont:axisFont, range:yRange, gridcolor:'rgba(232,228,217,.08)', zeroline:false },
    yaxis2: { title:{text:precipAxisLabel(),font:axisFont}, tickfont:axisFont, overlaying:'y', side:'right', range:y2Range, showgrid:false, zeroline:false },
    legend: { orientation:'h', y:1.14, x:0.5, xanchor:'center', font:axisFont },
    showlegend: !!climoB,
  };

  Plotly.newPlot('climo-chart', traces, layout, chartConfig());

  renderChartLegend(climoA, climoB);
}

function legendChip(color, label, key, isOn){
  return `<span class="cc-legend-chip clickable${isOn?'':' off'}" data-vis-key="${key}" role="button" tabindex="0" title="Click to show/hide"><span class="cc-legend-dot" style="background:${color}"></span>${label}</span>`;
}
function renderChartLegend(climoA, climoB){
  const el = document.getElementById('chart-legend');
  if (!climoA) { el.innerHTML=''; return; }
  let html = legendChip(ACCENT_A, (climoB?cityDisplayName(state.cityA)+' — ':'')+'Avg Temp (solid)', 'tempA', state.vis.tempA)
           + legendChip('rgba(208,132,37,.5)', 'Precip', 'precipA', state.vis.precipA);
  if (climoB) html += legendChip(ACCENT_B, cityDisplayName(state.cityB)+' — Avg Temp (dashed)', 'tempB', state.vis.tempB)
                     + legendChip('rgba(109,150,216,.7)', cityDisplayName(state.cityB)+' Precip', 'precipB', state.vis.precipB);
  el.innerHTML = html;
  el.querySelectorAll('.cc-legend-chip.clickable').forEach(chip => {
    const toggle = () => { state.vis[chip.dataset.visKey] = !state.vis[chip.dataset.visKey]; renderChart(); };
    chip.addEventListener('click', toggle);
    chip.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); toggle(); } });
  });
}

function emptyStateHTML(){
  const meta = cityMeta(state.cityA);
  const name = meta ? `${meta.name}, ${meta.state}` : 'this city';
  return `<div class="empty-state">
    <div class="es-icon">&#127777;&#65039;</div>
    <div class="es-title">Climate normals not loaded yet</div>
    <div class="es-body">Climate normals for <strong>${name}</strong> haven't been loaded into this tool yet. This starter build ships with 11 cities. Run <code>climo_build.py</code> to generate the full 372-city dataset and unlock every station in the search box.</div>
  </div>`;
}

function buildTempTableRows(climo){

    MONTHS[i],
    fmtTemp(m.tmax), fmtTemp(m.tmin), fmtTemp(m.tavg),
    m.record_high==null ? '—' : fmtTemp(m.record_high),
    m.record_low==null ? '—' : fmtTemp(m.record_low),
  ]);
}
function buildPrecipTableRows(climo){
  return climo.months.map((m,i) => [
    MONTHS[i],
    fmtPrecip(m.prcp), fmtPrecip(m.prcp_med),
    m.extreme_prcp==null ? '—' : fmtPrecip(m.extreme_prcp),
    m.extreme_prcp_year==null ? '—' : String(m.extreme_prcp_year),
    m.snow==null ? '—' : fmtPrecip(m.snow),
  ]);
}
function annualTempRow(climo){
  const tmax = monthArray(climo,'tmax'), tmin = monthArray(climo,'tmin'), tavg = monthArray(climo,'tavg');
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  return ['Annual', fmtTemp(avg(tmax)), fmtTemp(avg(tmin)), fmtTemp(avg(tavg)), '—', '—'];
}
function annualPrecipRow(climo){
  const prcp = monthArray(climo,'prcp'), snow = monthArray(climo,'snow');
  const sum = arr => arr.some(v=>v==null) ? null : arr.reduce((a,b)=>a+b,0);
  return ['Annual', fmtPrecip(sum(prcp)), '—', '—', '—', snow.some(v=>v==null) ? '—' : fmtPrecip(sum(snow))];
}
function tableHTML(id, headers, rows, footRow){
  const thead = `<thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${c==='—'?' class="dim"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
  const tfoot = footRow ? `<tfoot><tr>${footRow.map(c=>`<td>${c}</td>`).join('')}</tr></tfoot>` : '';
  return `<table class="data-table" id="${id}">${thead}${tbody}${tfoot}</table>`;
}
function cityTablesBlockHTML(climo, icao, accentColor, groupLabel, idx){
  const tTempId = `tbl-temp-${idx}`, tPrecipId = `tbl-precip-${idx}`;
  const tempRows = buildTempTableRows(climo); tempRows.push(annualTempRow(climo));
  const precipRows = buildPrecipTableRows(climo); precipRows.push(annualPrecipRow(climo));
  const tempTable = tableHTML(tTempId, ['Month','Daily Max','Daily Min','Mean','Record High','Record Low'], buildTempTableRows(climo), annualTempRow(climo));
  const precipTable = tableHTML(tPrecipId, ['Month','Mean','Median','Extreme','Year','Snow'], buildPrecipTableRows(climo), annualPrecipRow(climo));
  const label = groupLabel ? `<div class="city-table-group-hdr"><span class="dot" style="background:${accentColor}"></span>${groupLabel}</div>` : '';
  return `<div class="city-table-group">
    ${label}
    <div class="tables-grid">
      <div class="table-panel">
        <div class="table-panel-hdr"><span class="table-panel-title">Temperature (°${state.tempUnit.toUpperCase()})</span><button class="cc-btn cc-btn-sm" type="button" onclick="exportTablePNGFor('${tTempId}','${icao}','temp')">&darr; PNG</button></div>
        ${tempTable}
      </div>
      <div class="table-panel">
        <div class="table-panel-hdr"><span class="table-panel-title">Precipitation (${state.precipUnit})</span><button class="cc-btn cc-btn-sm" type="button" onclick="exportTablePNGFor('${tPrecipId}','${icao}','precip')">&darr; PNG</button></div>
        ${precipTable}
      </div>
    </div>
  </div>`;
}
function renderTables(){
  const climoA = cityClimo(state.cityA), climoB = (state.compare && hasClimoData(state.cityB)) ? cityClimo(state.cityB) : null;
  const container = document.getElementById('tables-container');
  if (!climoA) { container.innerHTML = ''; return; }
  let html = cityTablesBlockHTML(climoA, state.cityA, ACCENT_A, climoB ? cityDisplayName(state.cityA) : null, 'a');
  if (climoB) html += cityTablesBlockHTML(climoB, state.cityB, ACCENT_B, cityDisplayName(state.cityB), 'b');
  container.innerHTML = html;
}

// ================================================================
// PNG EXPORT — site-wide standard: branded header (title, context line),
// the surface itself, footer citation, top/bottom accent stripe, 2x scale.
// ================================================================
function exportChartPNG(){
  const gd = document.getElementById('climo-chart');
  if (!gd || !window.Plotly) return;
  const climoA = cityClimo(state.cityA);
  if (!climoA) return;
  const climoB = (state.compare && hasClimoData(state.cityB)) ? cityClimo(state.cityB) : null;
  const title = climoB ? `Climograph — ${cityDisplayName(state.cityA)} vs. ${cityDisplayName(state.cityB)}` : `Climograph — ${cityDisplayName(state.cityA)}`;
  const metaA = cityMeta(state.cityA);
  const contextLine = `${coordLabel(metaA.lat,metaA.lon)} · ${elevLabel(metaA.elev_ft)} elevation · 1991–2020 Climate Normals`;
  const sourceLine = 'Source: NOAA NCEI 1991–2020 U.S. Climate Normals';

  const chartW = gd.offsetWidth||900, chartH = gd.offsetHeight||400;
  // scale:2 — matches the 2x-scaled composite canvas below. At scale:1 the
  // chart was rendered at native CSS size then stretched 2x into the final
  // canvas, blurring it; rendering it at 2x natively keeps it crisp.
  Plotly.toImage(gd, {format:'png', width:chartW, height:chartH, scale:2}).then(src => {
    const img = new Image();
    img.onload = () => {
      const PAD=28, HDR=112, FTR=42;
      const ow=chartW+PAD*2, oh=HDR+chartH+FTR;
      const off = document.createElement('canvas');
      off.width = Math.round(ow*2); off.height = Math.round(oh*2);
      const oc = off.getContext('2d'); oc.scale(2,2);
      oc.fillStyle='#1E2320'; oc.fillRect(0,0,ow,oh);
      oc.fillStyle='#D08425'; oc.fillRect(0,0,ow,4);
      oc.textBaseline='alphabetic';
      oc.fillStyle='#948F82'; oc.font='600 12px "Courier Prime", monospace';
      oc.textAlign='left'; oc.fillText('CONTEXTCLIMATE · CLIMOGRAPHS', PAD, 30);
      oc.textAlign='right'; oc.fillText(new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}), ow-PAD, 30);
      oc.textAlign='left';
      oc.fillStyle='#E8E4D9'; oc.font='bold 27px "Zilla Slab", serif'; oc.fillText(title, PAD, 64);
      oc.fillStyle='#A6A499'; oc.font='15px "Public Sans", sans-serif'; oc.fillText(contextLine, PAD, 90);
      oc.fillStyle='#262B27'; oc.fillRect(PAD,HDR,chartW,chartH);
      oc.drawImage(img, PAD, HDR, chartW, chartH);
      oc.fillStyle='#948F82'; oc.font='12px "Courier Prime", monospace';
      oc.fillText(`${sourceLine}  ·  ContextClimate  ·  contextclimate.io`, PAD, oh-16);
      oc.fillStyle='#D08425'; oc.fillRect(0,oh-3,ow,3);
      const link = document.createElement('a');
      link.download = `climograph_${state.cityA}${climoB?'_vs_'+state.cityB:''}_${new Date().toISOString().slice(0,10)}.png`;
      link.href = off.toDataURL('image/png');
      link.click();
    };
    img.src = src;
  }).catch(e => console.warn('PNG export failed:', e));
}

function exportTablePNGFor(tableId, icao, kind){
  const climo = cityClimo(icao);
  const meta = cityMeta(icao);
  if (!climo || !meta) return;
  const title = (kind==='temp' ? 'Temperature Normals — ' : 'Precipitation Normals — ') + cityDisplayName(icao);
  const contextLine = `${coordLabel(meta.lat,meta.lon)} · ${elevLabel(meta.elev_ft)} elevation · 1991–2020 Climate Normals`;
  const sourceLine = 'Source: NOAA NCEI 1991–2020 U.S. Climate Normals';
  exportTablePNG(tableId, title, contextLine, sourceLine);
}

function exportTablePNG(tableId, title, contextLine, sourceLine){
  const table = document.getElementById(tableId);
  if (!table) return;
  const rows = Array.from(table.querySelectorAll('tr')).map(tr => Array.from(tr.children).map(td => td.textContent.trim()));
  if (!rows.length) return;
  const cols = rows[0].length;
  const PAD=28, HDR=112, FTR=42, ROWH=27, CELLPAD=14;
  const measure = document.createElement('canvas').getContext('2d');
  const colW = new Array(cols).fill(0);
  rows.forEach((r,ri) => {
    measure.font = ri===0 ? '700 11px "Courier Prime", monospace' : '13px "Courier Prime", monospace';
    r.forEach((cell,ci) => { colW[ci] = Math.max(colW[ci], measure.measureText(cell).width + CELLPAD*2); });
  });
  const tableW = colW.reduce((a,b)=>a+b,0);
  const tableH = rows.length*ROWH;
  const ow = tableW+PAD*2, oh = HDR+tableH+FTR;
  const off = document.createElement('canvas');
  off.width = Math.round(ow*2); off.height = Math.round(oh*2);
  const oc = off.getContext('2d'); oc.scale(2,2);
  oc.fillStyle='#1E2320'; oc.fillRect(0,0,ow,oh);
  oc.fillStyle='#D08425'; oc.fillRect(0,0,ow,4);
  oc.textBaseline='alphabetic';
  oc.fillStyle='#948F82'; oc.font='600 12px "Courier Prime", monospace';
  oc.textAlign='left'; oc.fillText('CONTEXTCLIMATE · CLIMOGRAPHS', PAD, 30);
  oc.textAlign='right'; oc.fillText(new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}), ow-PAD, 30);
  oc.textAlign='left';
  oc.fillStyle='#E8E4D9'; oc.font='bold 25px "Zilla Slab", serif'; oc.fillText(title, PAD, 64);
  oc.fillStyle='#A6A499'; oc.font='14px "Public Sans", sans-serif'; oc.fillText(contextLine, PAD, 90);
  oc.fillStyle='#262B27'; oc.fillRect(PAD,HDR,tableW,tableH);
  let y = HDR;
  rows.forEach((r,ri) => {
    const isHeader = ri===0, isLast = ri===rows.length-1;
    if (isHeader) { oc.fillStyle='#2C322D'; oc.fillRect(PAD,y,tableW,ROWH); }
    else if (isLast) { oc.fillStyle='#2C322D'; oc.fillRect(PAD,y,tableW,ROWH); }
    else if (ri%2===0) { oc.fillStyle='rgba(255,255,255,.03)'; oc.fillRect(PAD,y,tableW,ROWH); }
    let x = PAD;
    r.forEach((cell,ci) => {
      oc.fillStyle = isHeader ? '#A6A499' : (isLast ? '#E8E4D9' : '#E8E4D9');
      oc.font = isHeader ? '700 10.5px "Courier Prime", monospace' : (isLast ? '700 13px "Courier Prime", monospace' : '13px "Courier Prime", monospace');
      const align = ci===0 ? 'left' : 'right';
      oc.textAlign = align;
      const tx = align==='left' ? x+CELLPAD : x+colW[ci]-CELLPAD;
      oc.fillText(isHeader ? cell.toUpperCase() : cell, tx, y+ROWH/2+4);
      x += colW[ci];
    });
    y += ROWH;
    oc.strokeStyle='rgba(232,228,217,.08)'; oc.beginPath(); oc.moveTo(PAD,y); oc.lineTo(PAD+tableW,y); oc.stroke();
  });
  oc.textAlign='left';
  oc.fillStyle='#948F82'; oc.font='12px "Courier Prime", monospace';
  oc.fillText(`${sourceLine}  ·  ContextClimate  ·  contextclimate.io`, PAD, oh-16);
  oc.fillStyle='#D08425'; oc.fillRect(0,oh-3,ow,3);
  const link = document.createElement('a');
  link.download = `${tableId}_${new Date().toISOString().slice(0,10)}.png`;
  link.href = off.toDataURL('image/png');
  link.click();
}

// ================================================================
// PERMALINK — reflects city / compare / units in the URL query string via
// history.replaceState (no reload); read back on load so a shared link
// reproduces the view.
// ================================================================
function updateURL(){
  const params = new URLSearchParams();
  if (state.cityA) params.set('city', state.cityA);
  if (state.compare && state.cityB) params.set('compare', state.cityB);
  params.set('units', state.tempUnit==='c' ? 'c' : 'f');
  const qs = params.toString();
  history.replaceState(null, '', qs ? ('?'+qs) : location.pathname);
}
function readURL(){
  const params = new URLSearchParams(location.search);
  const city = params.get('city');
  const compare = params.get('compare');
  const units = params.get('units');
  if (city && STATIONS_BY_ICAO[city]) state.cityA = city;
  if (compare && STATIONS_BY_ICAO[compare]) { state.cityB = compare; state.compare = true; }
  if (units === 'c') { state.tempUnit='c'; state.precipUnit='mm'; }
}

// ================================================================
// MASTER RENDER
// ================================================================
function render(){
  renderHeader();
  renderBanner();
  renderStats();
  renderChart();
  renderTables();
}

// ================================================================
// EVENT WIRING
// ================================================================
function wireUnitToggle(id, key, onChange){
  const wrap = document.getElementById(id);
  wrap.querySelectorAll('.cc-segmented-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      wrap.querySelectorAll('.cc-segmented-btn').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      state[key] = btn.dataset.unit;
      onChange();
      render();
      updateURL();
    });
  });
}

function syncUnitToggleUI(){
  document.querySelectorAll('#temp-unit-toggle .cc-segmented-btn').forEach(b=>b.classList.toggle('on', b.dataset.unit===state.tempUnit));
  document.querySelectorAll('#precip-unit-toggle .cc-segmented-btn').forEach(b=>b.classList.toggle('on', b.dataset.unit===state.precipUnit));
}

function setCompare(on){
  state.compare = on;
  document.getElementById('sw2-wrap').style.display = on ? 'flex' : 'none';
  document.getElementById('compare-toggle-btn').classList.toggle('on', on);
  document.getElementById('compare-toggle-btn').textContent = on ? '− Compare City' : '+ Compare City';
  if (!on) { state.cityB = null; state.vis.tempB = true; state.vis.precipB = true; }
}

function init(){
  readURL();
  if (!state.cityA) state.cityA = 'KATL'; // sensible default: four-season humid subtropical, in starter set

  initSearch('si1','dd1', s => { state.cityA = s.icao; render(); updateURL(); });
  initSearch('si2','dd2', s => { state.cityB = s.icao; state.vis.tempB = true; state.vis.precipB = true; render(); updateURL(); });

  document.getElementById('compare-toggle-btn').addEventListener('click', () => {
    setCompare(!state.compare);
    render(); updateURL();
    if (state.compare) document.getElementById('si2').focus();
  });
  document.getElementById('compare-remove-btn').addEventListener('click', () => { setCompare(false); render(); updateURL(); });

  wireUnitToggle('temp-unit-toggle','tempUnit', () => {});
  wireUnitToggle('precip-unit-toggle','precipUnit', () => {});

  document.getElementById('chart-png-btn').addEventListener('click', () => exportChartPNG());

  if (state.compare) setCompare(true);
  syncUnitToggleUI();

  fetch('climo_data.json')
    .then(r => { if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(data => {
      state.climoData = data;
      render();
    })
    .catch(err => {
      console.error('Failed to load climo_data.json:', err);
      state.dataError = true;
      document.getElementById('city-title').textContent = 'Data failed to load';
      document.getElementById('city-meta').textContent = '';
      document.getElementById('stats-container').innerHTML = '';
      document.getElementById('chart-section').innerHTML = `<div class="load-error"><strong>Could not load climo_data.json.</strong><br><br>
        This tool fetches its dataset at runtime from <code>climo_data.json</code> in the same folder as this HTML file. If you opened this file directly from disk (a <code>file://</code> URL), most browsers block that fetch for local files — serve the folder over HTTP instead, e.g.:<br><br>
        <code>python3 -m http.server</code><br><br>
        then open <code>http://localhost:8000/climograph-tool.html</code>. On the live site this works automatically once both files are uploaded together.</div>`;
      document.getElementById('tables-container').innerHTML = '';
    });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
