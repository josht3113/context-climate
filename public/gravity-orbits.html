<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravity &amp; Orbits</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); --force: #7DA7F5; --vel: #5FD08E; --solar: #F2C14E; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 14px; white-space: nowrap; }
.tabs .cc-segmented-btn .n { opacity: .65; margin-right: 6px; }
.top .spacer { flex: 1; }
.series { display: flex; gap: 6px; }
.x-link { padding: 6px 11px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #0C100E; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 56px; }
.controls .grp { display: flex; gap: 5px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 3px; }
.controls .gl { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; margin-right: 2px; }
.snap { padding: 6px 10px; font-size: 15px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; min-width: 50px; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--color-text-secondary); }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.go { min-width: 98px; padding: 10px 14px; font-size: 15px; white-space: nowrap; }
.ico { padding: 9px 11px; font-size: 15px; line-height: 1; }
.slider { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 74px; text-align: right; white-space: nowrap; }

/* the gravity switch (step 1) */
.grav { display: flex; align-items: center; gap: 12px; padding: 8px 18px 8px 10px; font-size: 17px; font-weight: 700; letter-spacing: .02em;
  border: 2px solid var(--force); color: var(--color-text-primary); background: rgba(125,167,245,0.14); border-radius: 999px; cursor: pointer; white-space: nowrap; }
.grav .sw { width: 46px; height: 26px; border-radius: 13px; background: var(--force); position: relative; transition: background .2s; flex: none; }
.grav .sw::after { content: ''; position: absolute; top: 3px; left: 23px; width: 20px; height: 20px; border-radius: 50%; background: #0C100E; transition: left .2s; }
.grav.off { border-color: #8A8F86; background: rgba(232,228,217,0.04); color: var(--color-text-secondary); }
.grav.off .sw { background: #4A504A; }
.grav.off .sw::after { left: 3px; background: #A6A499; }
.grav:hover { filter: brightness(1.12); }
.grav:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 2px; }

/* stage chips */
.chips { position: absolute; display: flex; gap: 6px; }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .cc-btn { padding: 5px 11px; font-size: 13px; background: rgba(38,43,39,0.88); }
#chipsTR { top: 10px; right: 10px; flex-direction: column; align-items: flex-end; }
#chipsTR .lay { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
#chipsBL { left: 10px; bottom: 10px; align-items: center; }
.tgl { text-align: left; }
.tgl.is-active { border-color: var(--chip-col, var(--tool-accent)); color: var(--color-text-primary); }
.tgl::before { content: ''; display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--chip-col, var(--color-text-muted));
  border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--chip-col, var(--tool-accent)); }
.tgl:disabled { opacity: .35; cursor: default; }

/* the big button (step 5) */
#vanish { position: absolute; left: 50%; top: 7px; transform: translateX(-50%); display: none; align-items: center; gap: 12px;
  padding: 11px 28px 11px 18px; font-family: var(--font-display); font-size: 22px; font-weight: 700; color: #1E2320; white-space: nowrap;
  background: radial-gradient(circle at 30% 30%, #FFE59A, #F2C14E 55%, #D99A2B); border: none; border-radius: 999px; cursor: pointer;
  box-shadow: 0 0 0 0 rgba(242,193,78,0.55), 0 10px 30px rgba(0,0,0,0.45); animation: pulse 2.2s infinite; }
#vanish .sun { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle, #FFFBEA 0 35%, #FFD45E 60%, rgba(255,212,94,0) 72%); box-shadow: 0 0 14px #FFE38A; }
#vanish:hover { filter: brightness(1.08); transform: translateX(-50%) scale(1.03); }
#vanish:focus-visible { outline: 3px solid #FFE59A; outline-offset: 3px; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(242,193,78,0.5), 0 10px 30px rgba(0,0,0,0.45); } 70% { box-shadow: 0 0 0 18px rgba(242,193,78,0), 0 10px 30px rgba(0,0,0,0.45); } 100% { box-shadow: 0 0 0 0 rgba(242,193,78,0), 0 10px 30px rgba(0,0,0,0.45); } }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.dim .v { font-size: 20px; color: var(--color-text-secondary); }
.card .nt { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-top: 1px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card { padding: 10px 14px; }
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .r.dim .v { font-size: 18px; }
  .card .nt { font-size: 13px; margin-top: 0; }
  .card .src { padding-top: 6px; line-height: 1.3; }
}
@media (max-width: 1440px) {
  .top .sub { display: none; }
}
@media (max-width: 1280px) {
  .tabs .cc-segmented-btn { padding: 11px 10px; }
  .x-link .nm { display: none; }
  .top { gap: 12px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 252px; }
  .tabs .cc-segmented-btn:not(.is-active) .lb { display: none; }
  .tabs .cc-segmented-btn:not(.is-active) .n { opacity: 1; margin-right: 0; }
  .tabs .cc-segmented-btn { padding: 11px 13px; }
  .snap { padding: 6px 8px; min-width: 44px; }
  .slider .sv { display: none; }
  .slider { min-width: 80px; }
  .controls { gap: 6px; }
  .go { min-width: 0; padding: 10px 12px; }
  .grav { font-size: 15px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title">Gravity &amp; Orbits</h1><span class="sub">Orbital mechanics · Sun &amp; Earth</span></div>
    <div class="cc-segmented tabs" id="tabs"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="series" id="series"></div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chipsTR"></div>
        <div class="chips" id="chipsBL"></div>
        <button id="vanish" type="button"><span class="sun"></span>Make the Sun vanish</button>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
