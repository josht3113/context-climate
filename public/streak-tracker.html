<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streak Tracker | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<script src="station-roster.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --tool-accent: var(--accent-hourly);
  --streak-warm: #E0824A;    /* at/above threshold — content-encoded */
  --streak-cool: #5B9BD8;    /* at/below threshold — content-encoded */
  --streak-record: #D9A94F;
  --streak-current: #F1EEE4;
}

body { padding: 20px 0 48px; }
.container { max-width: 1320px; margin: 0 auto; padding: 0 28px; }

/* ── Header ── */
.page-eyebrow { margin-bottom: 6px; }
.page-title { font-size: 24px; font-weight: 700; letter-spacing: -0.3px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.title-sep { color: var(--color-text-muted); font-weight: 400; }

/* ── Station bar ── */
.station-bar { padding: 12px 0 14px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--color-border); margin-bottom: 14px; flex-wrap: wrap; }
.finder-group { position: relative; flex: 0 0 auto; display: flex; align-items: stretch; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color .15s; }
.finder-group:focus-within { border-color: var(--tool-accent); }
.finder-group .search-icon { display: flex; align-items: center; padding-left: 12px; color: var(--color-text-muted); font-size: 17px; pointer-events: none; }
.finder-group .search-input { width: 260px; background: transparent; border: none; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
.finder-group .search-input::placeholder { color: var(--color-text-muted); }
.finder-sep { width: 1px; align-self: stretch; margin: 7px 0; background: var(--color-border); }
.finder-group .locate-btn { border: none; border-radius: 0; background: transparent; white-space: nowrap; font-size: 14px; }
.locate-btn.loading { opacity: .5; pointer-events: none; }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 360px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 288px; overflow-y: auto; z-index: 300; display: none; box-shadow: 0 10px 32px rgba(0,0,0,.6); }
.dropdown.open { display: block; }
.d-item { padding: 9px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 15px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); transition: background .1s; }
.d-item:last-child { border-bottom: none; }
.d-item:hover, .d-item.hi { background: rgba(109,150,216,.18); }
.d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 50px; flex-shrink: 0; }
.d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-item .d-st { color: var(--color-text-muted); font-size: 14px; width: 24px; text-align: right; }
.d-item .d-dist { color: var(--tool-accent); font-size: 13px; width: 50px; flex-shrink: 0; text-align: right; }
.stn-info { flex: 1; min-width: 200px; }
.stn-name { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--color-text-primary); }
.stn-meta { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-muted); letter-spacing: .03em; margin-top: 2px; }
.meta-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.load-status { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 200px; }
.load-text { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); white-space: nowrap; }
.load-bar { width: 200px; height: 3px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; visibility: hidden; }
.load-bar.on { visibility: visible; }
.load-bar::after { content: ''; display: block; width: 36%; height: 100%; background: var(--tool-accent); animation: loadslide 1.3s ease-in-out infinite; }
@keyframes loadslide { 0% { transform: translateX(-110%); } 100% { transform: translateX(290%); } }
@media (prefers-reduced-motion: reduce) { .load-bar::after { animation: none; width: 100%; opacity: .5; } }
.load-notice { display: none; align-items: center; gap: 12px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 14px; color: #E3A26B; margin: -4px 0 12px; }
.load-notice.show { display: flex; }

/* ── Controls ── */
.controls-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 14px; }
.ctrl-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.ctrl-label { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-muted); white-space: nowrap; }
.cc-segmented-btn { font-size: 14px; }
.preset-row { display: flex; align-items: center; gap: 8px 6px; flex-wrap: wrap; }
#preset-row { margin-top: 12px; }
.preset-group { display: flex; align-items: center; gap: 6px; margin-right: 18px; flex-wrap: wrap; }
.preset-group-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin-right: 2px; }
.preset-btn { font-size: 14px; color: var(--color-text-primary); }
.summary-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.threshold-summary { font-family: var(--font-mono); font-size: 15px; color: var(--tool-accent); letter-spacing: .02em; }
.custom-panel { display: none; grid-template-columns: repeat(6, auto) 1fr; gap: 10px 18px; align-items: end; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--color-border); }
.custom-panel.open { display: grid; }
.custom-field { display: flex; flex-direction: column; gap: 5px; }
.custom-field > label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
.num-input { width: 84px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); font-family: var(--font-mono); font-size: 16px; padding: 6px 8px; }
.range-input { width: 150px; accent-color: var(--tool-accent); }
.season-row { border-top: 1px dashed var(--color-border); padding-top: 12px; margin-top: 12px; }
.record-group { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.record-group .cc-segmented-btn { font-size: 13px; padding-top: 6px; padding-bottom: 6px; }
.month-grid { display: none; grid-template-columns: repeat(12, auto); justify-content: start; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--color-border); }
.month-grid.open { display: grid; }
.month-btn { min-width: 50px; text-align: center; font-size: 14px; }

/* ── View tabs ── */
.view-tabs { margin-bottom: 14px; }
.view-tabs .cc-tab { font-size: 15px; }

/* ── Headline ── */
.headline-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 14px; }
.headline-top { display: flex; align-items: flex-start; gap: 22px; flex-wrap: wrap; }
.headline-main { flex: 1; min-width: 280px; }
.headline-value { font-family: var(--font-display); font-weight: 700; font-size: 56px; line-height: 1; color: var(--color-text-primary); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.headline-value .unit { font-size: 22px; font-weight: 400; color: var(--color-text-secondary); }
.headline-label { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-muted); margin-top: 8px; }
.headline-note { font-family: var(--font-body); font-size: 16px; color: var(--color-text-secondary); margin-top: 8px; line-height: 1.5; max-width: 600px; }
.headline-note strong { color: var(--color-text-primary); font-weight: 600; }
.jeopardy-line { font-family: var(--font-body); font-size: 15px; color: var(--color-text-secondary); margin-top: 8px; }
.jeopardy-line strong { color: var(--tool-accent); }
.badge-active { background: rgba(224,130,74,.18); color: var(--streak-warm); border: 1px solid rgba(224,130,74,.4); }
.badge-active.cool { background: rgba(91,155,216,.18); color: var(--streak-cool); border-color: rgba(91,155,216,.4); }
.badge-ended { background: var(--color-surface-2); color: var(--color-text-muted); border: 1px solid var(--color-border); }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(150px, auto)); gap: 10px; align-self: flex-start; }
.stat-grid .cc-stat-chip { background: var(--color-surface-2); min-width: 150px; }
.stat-grid .cc-stat-value { font-size: 26px; white-space: nowrap; }
.stat-grid .cc-stat-value.dim { color: var(--color-text-muted); }

/* ── Calendar ── */
.strip-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 14px; }
.strip-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
.panel-title { font-family: var(--font-mono); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
.cc-legend-row { display: flex; gap: 8px; flex-wrap: wrap; }
.cc-legend-chip { font-size: 13px; }
.legend-sq { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
.legend-grad { width: 42px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.strip-wrap { position: relative; }
#strip-canvas { display: block; width: 100%; cursor: crosshair; }
.strip-tooltip { position: absolute; pointer-events: none; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 8px 12px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; color: var(--color-text-primary); box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none; z-index: 20; white-space: nowrap; }
.strip-tooltip .tt-sub { color: var(--color-text-secondary); }
.strip-empty { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-muted); padding: 24px 0; text-align: center; }

/* ── Ranked / totals ── */
.ranked-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 18px 20px; margin-bottom: 14px; }
.ranked-hdr { margin-bottom: 12px; }
.ranked-grid { display: flex; gap: 22px; flex-wrap: wrap; }
.ranked-chart-box { flex: 1 1 480px; min-width: 320px; height: 420px; }
.ranked-table-box { flex: 1 1 400px; min-width: 320px; max-height: 420px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); }
.ranked-table { width: 100%; border-collapse: collapse; }
.ranked-table th { position: sticky; top: 0; background: var(--color-surface-2); padding: 8px 12px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); text-align: left; border-bottom: 1px solid var(--color-border); z-index: 1; }
.ranked-table th.r, .ranked-table td.r { text-align: right; }
.ranked-table td { padding: 7px 12px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 15px; color: var(--color-text-secondary); white-space: nowrap; }
.ranked-table tr:last-child td { border-bottom: none; }
.ranked-table tbody tr.clickable { cursor: pointer; }
.ranked-table tbody tr.clickable:hover td { background: rgba(109,150,216,.10); color: var(--color-text-primary); }
.ranked-table tr.is-current td { background: rgba(241,238,228,.06); color: var(--color-text-primary); }
.ranked-table tr.is-record td { color: var(--streak-record); }
.ranked-table td.empty { text-align: center; padding: 22px; color: var(--color-text-muted); }
.rank-tag { font-family: var(--font-mono); font-size: 12px; padding: 2px 7px; border-radius: var(--radius-sm); letter-spacing: .06em; text-transform: uppercase; }
.tag-active { background: rgba(241,238,228,.14); color: var(--streak-current); }
.tag-record { background: rgba(217,169,79,.18); color: var(--streak-record); }
.muted { color: var(--color-text-muted); }

/* ── Footer ── */
.footer-note { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); line-height: 1.6; margin-top: 4px; }

::-webkit-scrollbar { width: 6px; height: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(232,228,217,.15); border-radius: 3px; }

@media (max-width: 900px) {
  .stat-grid { grid-template-columns: repeat(2, minmax(140px, auto)); }
  .record-group { margin-left: 0; }
  .custom-panel { grid-template-columns: repeat(2, auto); }
}
</style>
</head>
<body>
<div class="container">

  <p class="cc-eyebrow page-eyebrow">Hourly Data</p>
  <div class="page-title">
    <span id="title-station">&ndash;</span>
    <span class="title-sep">|</span>
    <span>Streak Tracker</span>
    <button class="cc-btn cc-btn-sm" id="png-btn" title="Download PNG">&darr; PNG</button>
  </div>

  <!-- STATION BAR -->
  <div class="station-bar">
    <div class="finder-group" id="sw">
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si" placeholder="Search station ID or city..." autocomplete="off" spellcheck="false">
      <div class="dropdown" id="dd"></div>
      <div class="finder-sep"></div>
      <button class="cc-btn cc-btn-sm locate-btn" id="locate-btn" title="Find the nearest station">&#128205; Near Me</button>
    </div>
    <div class="stn-info">
      <div class="stn-name" id="stn-name">&ndash;</div>
      <div class="stn-meta" id="stn-meta">&ndash;</div>
    </div>
    <div class="meta-right">
      <div class="load-status">
        <span class="load-text" id="load-text">&ndash;</span>
        <div class="load-bar" id="load-bar"></div>
      </div>
      <button class="cc-btn cc-btn-sm" id="refresh-btn">&#8635; Refresh</button>
    </div>
  </div>
  <div class="load-notice" id="load-notice"><span id="load-notice-text"></span><button class="cc-btn cc-btn-sm" id="retry-btn">Retry</button></div>

  <!-- CONTROLS -->
  <div class="controls-panel">
    <div class="ctrl-row">
      <span class="ctrl-label">Streak</span>
      <div class="cc-segmented" id="seg-family"></div>
    </div>
    <div class="preset-row" id="preset-row"></div>
    <div class="summary-row">
      <span class="threshold-summary" id="threshold-summary">&ndash;</span>
      <button class="cc-btn cc-btn-sm" id="custom-toggle-btn">Custom &#9662;</button>
      <div class="record-group">
        <span class="ctrl-label">Record</span>
        <div class="cc-segmented" id="seg-record">
          <button class="cc-segmented-btn" data-rec="full">Full record</button>
          <button class="cc-segmented-btn" data-rec="1991">Since 1991</button>
          <button class="cc-segmented-btn" data-rec="30">Last 30 yrs</button>
        </div>
      </div>
    </div>
    <div class="custom-panel" id="custom-panel">
      <div class="custom-field">
        <label for="custom-variable">Variable</label>
        <select class="cc-select" id="custom-variable">
          <option value="temp">Temperature</option>
          <option value="dewpoint">Dewpoint</option>
          <option value="cloud">Cloud cover</option>
          <option value="wind">Wind speed</option>
          <option value="gust">Wind gust</option>
        </select>
      </div>
      <div class="custom-field" id="agg-field">
        <label>Track by</label>
        <div class="cc-segmented" id="seg-agg">
          <button class="cc-segmented-btn" data-agg="hourly">Hourly</button>
          <button class="cc-segmented-btn" data-agg="daily">Daily</button>
        </div>
      </div>
      <div class="custom-field" id="metric-field">
        <label for="metric-select">Daily value</label>
        <select class="cc-select" id="metric-select">
          <option value="max">Max</option>
          <option value="min">Min</option>
          <option value="mean">Mean</option>
        </select>
      </div>
      <div class="custom-field" id="op-field">
        <label>Direction</label>
        <div class="cc-segmented" id="seg-op">
          <button class="cc-segmented-btn" data-op="gte">&ge; At/Above</button>
          <button class="cc-segmented-btn" data-op="lte">&le; At/Below</button>
        </div>
      </div>
      <div class="custom-field">
        <label for="custom-num" id="custom-value-label">Value</label>
        <input type="number" class="num-input" id="custom-num">
      </div>
      <div class="custom-field">
        <label>&nbsp;</label>
        <input type="range" class="range-input" id="custom-range" aria-label="Threshold value">
      </div>
      <div class="custom-field">
        <label>&nbsp;</label>
        <button class="cc-btn cc-btn-sm primary" id="custom-apply">Apply</button>
      </div>
    </div>
    <div class="ctrl-row season-row">
      <span class="ctrl-label">Season</span>
      <div class="preset-row" id="season-preset-row"></div>
      <button class="cc-btn cc-btn-sm" id="season-custom-toggle-btn">Custom months &#9662;</button>
    </div>
    <div class="month-grid" id="month-grid"></div>
  </div>

  <div class="cc-tab-bar view-tabs" id="view-tabs">
    <button class="cc-tab is-active" data-view="streaks">Streaks</button>
    <button class="cc-tab" data-view="totals">Totals</button>
  </div>

  <div id="streaks-view">
    <div class="headline-panel">
      <div class="headline-top">
        <div class="headline-main">
          <div class="headline-value"><span id="hl-value">&ndash;</span><span class="unit" id="hl-unit"></span><span class="cc-badge badge-ended" id="hl-badge">&ndash;</span></div>
          <div class="headline-label" id="hl-label">Current streak</div>
          <div class="headline-note" id="hl-note"></div>
          <div class="jeopardy-line" id="jeopardy-line"></div>
        </div>
        <div class="stat-grid">
          <div class="cc-stat-chip"><span class="cc-stat-label">Return period</span><span class="cc-stat-value" id="sv-rp">&ndash;</span></div>
          <div class="cc-stat-chip"><span class="cc-stat-label">Record</span><span class="cc-stat-value" id="sv-record">&ndash;</span></div>
          <div class="cc-stat-chip"><span class="cc-stat-label" id="sl-season">Longest this year</span><span class="cc-stat-value" id="sv-season">&ndash;</span></div>
          <div class="cc-stat-chip"><span class="cc-stat-label">Streaks on record</span><span class="cc-stat-value" id="sv-total">&ndash;</span></div>
          <div class="cc-stat-chip"><span class="cc-stat-label">Avg length</span><span class="cc-stat-value" id="sv-avg">&ndash;</span></div>
          <div class="cc-stat-chip"><span class="cc-stat-label">Years</span><span class="cc-stat-value" id="sv-period">&ndash;</span></div>
        </div>
      </div>
    </div>

    <div class="strip-panel">
      <div class="strip-hdr">
        <span class="panel-title" id="strip-title">Calendar</span>
        <div class="cc-legend-row" id="strip-legend"></div>
      </div>
      <div class="strip-wrap" id="strip-wrap">
        <canvas id="strip-canvas" class="cc-canvas-frame"></canvas>
        <div class="strip-tooltip" id="strip-tooltip"></div>
      </div>
    </div>

    <div class="ranked-panel">
      <div class="panel-title ranked-hdr">Longest streaks</div>
      <div class="ranked-grid">
        <div class="ranked-chart-box" id="ranked-chart"></div>
        <div class="ranked-table-box">
          <table class="ranked-table">
            <thead><tr><th>Rank</th><th>Dates</th><th class="r">Length</th><th></th></tr></thead>
            <tbody id="ranked-tbody"><tr><td colspan="4" class="empty">&ndash;</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div id="totals-view" style="display:none">
    <div class="ranked-panel">
      <div class="ranked-hdr" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <span class="panel-title" id="totals-hdr-label">Total time at/above threshold</span>
        <div class="cc-segmented" id="seg-totals-group">
          <button class="cc-segmented-btn is-active" data-group="year">By year</button>
          <button class="cc-segmented-btn" data-group="month">By month (avg)</button>
        </div>
      </div>
      <div id="totals-chart" style="height:380px;"></div>
      <div class="ranked-table-box" style="max-height:340px;margin-top:14px;width:100%;">
        <table class="ranked-table">
          <thead id="totals-thead"><tr><th>Year</th><th class="r">Total</th><th class="r">Coverage</th></tr></thead>
          <tbody id="totals-tbody"><tr><td colspan="3" class="empty">&ndash;</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="footer-note" id="provenance"></div>
</div>

<script>
'use strict';
// ================================================================
// CONSTANTS
// ================================================================
const HOUR = 3600000, DAY = 86400000;
const MIN_HOURS_COMPLETE = 18;     // hours of the variable needed for a day to count
const COVERAGE_MIN = 0.9;          // share of in-season units a year needs to enter the rarity distribution
const RP_MIN_YEARS = 10;           // fewer qualifying years than this -> no return period
const FETCH_RETRIES = 3, FETCH_BACKOFF_MS = 1200, FETCH_GAP_MS = 400;
const SPLIT_MAX_DEPTH = 4, MAX_INFLIGHT = 2;
const EMPTY_STOP = 12;             // consecutive empty years that end the backward walk
const POR_FLOOR = 1900;
const ROUTINE_MIN_OBS = 200;
const CACHE_VER = 2;
const KT_TO_MPH = 1.15078;
const EXPORT_SCALE = 3;
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TEMPLATE_LEN = [31,29,31,30,31,30,31,31,30,31,30,31];

// ================================================================
// VARIABLES, FAMILIES, PRESETS
// ================================================================

// ================================================================
// TIME — everything is binned in local standard time (LST), the NWS

// FETCH RESILIENCE (same pattern as the heatmaps)
// ================================================================
function isTransientStatus(code) { return code === 408 || code === 425 || code === 429 || (code >= 500 && code <= 599); }

    if (attempt > 0) await sleep(FETCH_BACKOFF_MS * Math.pow(2, attempt - 1));
    try { return await doFetch(); }
    catch (e) {
      lastErr = e;
      if (!isTransientError(e)) throw e;
      console.warn(`${label}: attempt ${attempt + 1} failed (${e.message}); retrying`);
    }
  }
  throw lastErr;
}

// ================================================================
// IEM ASOS — requested in UTC, one routine ob per LST hour
// ================================================================
function buildIEMUrl(stId, group, y1, y2) {
  // Pad a day either side: LST year Y starts a few hours into UTC Jan 1
  // and ends a few hours into UTC Jan 1 of Y+1. day2 is exclusive.
  const data = GROUPS[group].fields.map(f => `data=${f}`).join('&');
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?station=${stId}&${data}` +
    `&year1=${y1 - 1}&month1=12&day1=31&year2=${y2 + 1}&month2=1&day2=2` +
    `&tz=Etc%2FUTC&format=comma&latlon=no&elev=no&missing=M&trace=T&direct=no`;
}
async function fetchIEMOnce(stId, group, y1, y2) {
  let resp;
  resp = await fetch(buildIEMUrl(stId, group, y1, y2), { cache: 'no-store' });
  if (!resp.ok) {
    const err = new Error(`IEM HTTP ${resp.status}`);
    err.transient = isTransientStatus(resp.status); err.status = resp.status;
    throw err;
  }
  return resp.text();
}

// METAR sky layer -> oktas (band midpoints). VV = sky obscured -> 8.
function skyCodeToOktas(code) {
  switch (code) {
    case 'CLR': case 'SKC': case 'NSC': case 'NCD': return 0;
    case 'FEW': return 1.5;
    case 'SCT': return 3.5;
    case 'BKN': return 6.5;
    case 'OVC': case 'VV': return 8;

  }
}
function modeOfHist(hist) { let best = -1, bestN = 0; for (let m = 0; m < 60; m++) if (hist[m] > bestN) { bestN = hist[m]; best = m; } return best; }

const numOrNull = s => { if (s == null) return null; s = s.trim(); if (!s || s === 'M') return null; const f = parseFloat(s); return isNaN(f) ? null : f; };

// Parse one IEM chunk into Map(LST year -> { out: Float32Array of hourly values } | null).
// State fields (temp, dewpoint, sky, wind speed): cell window is (H-1):45 to
// H:44, the routine ob wins, and a special fills a cell only when the routine
// value is missing — then the special nearest the routine minute.
// Gusts are events, binned by when they happened (clock hour, no rollover) so
// a late-evening gust stays on its own day: the cell holds the highest gust of
// any ob in the hour, or 0 when wind was reported with no gust. A METAR peak
// wind (PK WND) is binned at its own reported time.
function parseChunk(text, group, y1, y2, st) {
  const lines = text.split('\n');
  let hdr = -1;
  for (let i = 0; i < lines.length; i++) if (lines[i].startsWith('station,')) { hdr = i; break; }
  const out = new Map();
  for (let Y = y1; Y <= y2; Y++) out.set(Y, null);
  if (hdr < 0) return out;

  const h = lines[hdr].split(',');
  const col = f => h.indexOf(f);
  const vI = col('valid');
  const I = {}; for (const f of G.fields) I[f] = col(f);
  const toLst = (s) => {
    if (!s || s.length < 16) return NaN;
    const uy = +s.substr(0, 4), um = +s.substr(5, 2), ud = +s.substr(8, 2), uh = +s.substr(11, 2), umi = +s.substr(14, 2);
    if (!(uy > 0) || isNaN(um) || isNaN(ud) || isNaN(uh) || isNaN(umi)) return NaN;
    return Date.UTC(uy, um - 1, ud, uh, umi) + stdOffsetMin(st.iana, uy) * 60000;
  };
  // State value of a row for this group (one state output per group).
  let stateOut, stateVal;
  if (group === 'sky') {
    stateOut = 'sky';
    stateVal = parts => {
      let v = null;
      for (const f of G.fields) {
        const idx = I[f]; if (idx < 0) continue;
        const c = (parts[idx] || '').trim();
        if (!c || c === 'M') continue;
        const o = skyCodeToOktas(c);
        if (o != null && (v === null || o > v)) v = o;
      }
      return v;
    };
  } else if (group === 'wind') {
    stateOut = 'wind';
    stateVal = parts => { const k = numOrNull(parts[I.sknt]); return k === null ? null : Math.round(k * KT_TO_MPH); };
  } else {
    stateOut = G.outs[0];
    stateVal = parts => numOrNull(parts[I[G.fields[0]]]);

  const hasGust = group === 'wind';

  // Pass 1: parse rows, histogram of LST minutes per LST year.
  const rows = [];
  const histByYear = new Map(), histAll = new Int32Array(60);
  for (let i = hdr + 1; i < lines.length; i++) {
    const line = lines[i];
    if (!line) continue;
    const parts = line.split(',');
    const lst = toLst(parts[vI]);
    if (isNaN(lst)) continue;
    const dt = new Date(lst), mi = dt.getUTCMinutes(), ly = dt.getUTCFullYear();
    let hist = histByYear.get(ly);
    if (!hist) { hist = new Int32Array(60); histByYear.set(ly, hist); }
    hist[mi]++; histAll[mi]++;
    const v = stateVal(parts);
    const row = { lst, mi, v };
    if (hasGust) {
      const g = numOrNull(parts[I.gust]);
      row.seen = row.v !== null || g !== null;
      row.gust = g === null ? null : Math.round(g * KT_TO_MPH);
      const pk = numOrNull(parts[I.peak_wind_gust]);
      if (pk !== null) {
        let pt = I.peak_wind_time >= 0 ? toLst((parts[I.peak_wind_time] || '').trim()) : NaN;
        // PK WND happened since the previous routine ob; if the time is absent or implausible, assume ~30 min earlier.
        if (!(pt <= lst && lst - pt <= 2 * HOUR)) pt = lst - 30 * 60000;
        row.pk = Math.round(pk * KT_TO_MPH); row.pkLst = pt;

    let n = 0; for (let m = 0; m < 60; m++) n += hist[m];
    routineOf.set(yr, n >= ROUTINE_MIN_OBS ? modeOfHist(hist) : globalR);

  // Pass 2: fill cells.
  const bufs = new Map();   // Y -> { vals: {out: arr}, dist }
  const bufFor = (Y) => {
    let b = bufs.get(Y);

    const cell = Math.floor(ms / HOUR) * HOUR;

    if (!(arr[idx] >= v)) arr[idx] = v;

    const cell = Math.floor((r.lst + 15 * 60000) / HOUR) * HOUR;
    const Y = new Date(cell).getUTCFullYear();
    if (Y >= y1 && Y <= y2) {
      const b = bufFor(Y);
      if (r.v !== null) {
        const idx = (cell - Date.UTC(Y, 0, 1)) / HOUR;
        const R = routineOf.get(new Date(r.lst).getUTCFullYear()) ?? globalR;
        const dd = Math.abs(r.mi - R), d = Math.min(dd, 60 - dd);
        if (d < b.dist[idx]) { b.dist[idx] = d; b.vals[stateOut][idx] = r.v; }
      }
    }
    if (hasGust) {
      if (r.seen) eventAt(r.lst, r.gust === null ? 0 : r.gust);
      if (r.pk != null) eventAt(r.pkLst, r.pk);
    }
  }
  for (const [Y, b] of bufs) out.set(Y, b.vals);
  return out;
}

// ================================================================
// INDEXEDDB CACHE — completed years only
// ================================================================
const idb = (() => {
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise(res => {
      try {
        const r = indexedDB.open('cc-streak-tracker', 1);
        r.onupgradeneeded = () => { r.result.createObjectStore('years'); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
        r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
    return dbp;
  }
  async function get(key) {
    const db = await open(); if (!db) return undefined;
    return new Promise(res => {
      try { const q = db.transaction('years', 'readonly').objectStore('years').get(key); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }
      catch (e) { res(undefined); }
    });
  }
  async function put(key, val) {
    const db = await open(); if (!db) return;
    return new Promise(res => {
      try { const tx = db.transaction('years', 'readwrite'); tx.objectStore('years').put(val, key); tx.oncomplete = () => res(); tx.onerror = () => res(); }
      catch (e) { res(); }
    });
  }
  return { get, put };
})();

function yearCacheable(st, Y) { return nowLST(st).ms >= Date.UTC(Y + 1, 0, 10); }

  const rec = await idb.get(cacheKey(stId, group, Y));
  if (!rec || rec.v !== CACHE_VER) return undefined;
  return rec.empty ? null : rec.vals;
}
function cachePutYear(stId, group, Y, vals) {
  idb.put(cacheKey(stId, group, Y), vals ? { v: CACHE_VER, vals } : { v: CACHE_VER, empty: true });
}

// Adaptive range fetch: a multi-year range that fails transiently is halved

// backoff retries. Each half's outcome is independent.

  const out = { years: new Map(), failed: new Map() };

    const text = y1 === y2
      ? await fetchWithRetry(`IEM ${group} ${y1}`, () => fetchIEMOnce(st.id, group, y1, y2))
      : await fetchIEMOnce(st.id, group, y1, y2);
    for (const [Y, v] of parseChunk(text, group, y1, y2, st)) out.years.set(Y, v);
  } catch (e) {
    if (y1 < y2 && isTransientError(e) && depth < SPLIT_MAX_DEPTH) {
      const mid = Math.floor((y1 + y2) / 2);
      const a = await fetchRange(st, group, mid + 1, y2, depth + 1);
      await sleep(FETCH_GAP_MS);
      const b = await fetchRange(st, group, y1, mid, depth + 1);

// Loads one field group for the current station: current + previous year
// first, then walks backward through history in chunks until EMPTY_STOP
// consecutive empty years (or POR_FLOOR). Completed years are cached.
async function loadGroup(group) {
  const gs = groupState(group);
  if (gs.status === 'loading') return;
  const st = store.st, tok = store.token;
  const wanted = () => storeAlive(tok) && activeGroupNeeded() === group;
  gs.status = 'loading';
  onLoadProgress();
  const curY = nowLST(st).y;

  function ingest(res) {
    if (res.years.has(curY)) gs.curAt = Date.now();
    for (const [Y, v] of res.years) {
      applyYear(gs, Y, v);
      if (yearCacheable(st, Y)) cachePutYear(st.id, group, Y, v);
    }
    for (const [Y, m] of res.failed) { if (!gs.years.has(Y)) gs.failed.set(Y, m); }
  }

  // Step 1: recent years (current always fresh).
  const recent = [];
  for (const Y of [curY - 1, curY]) {
    if (gs.years.has(Y) && (Y !== curY || Date.now() - (gs.curAt || 0) < 600000)) continue;
    if (Y !== curY && yearCacheable(st, Y)) {
      const c = await cacheGetYear(st.id, group, Y);
      if (!storeAlive(tok)) return;
      if (c !== undefined) { applyYear(gs, Y, c); continue; }
    }
    recent.push(Y);
  }
  if (recent.length) {
    const res = await fetchRange(st, group, recent[0], recent[recent.length - 1]);
    if (!storeAlive(tok)) return;
    ingest(res);
  }
  onLoadProgress(true);

  // Step 2: walk backward.
  let nextY = curY - 2, stop = false, inflight = 0, failStreak = 0;
  // Stop once any 12 consecutive years below the recent chunk are known to be
  // empty. Completions arrive out of order (a year stuck in retries must not
  // hold the walk open), so this scans known years rather than a frontier.
  function advanceFrontier() {
    let run = 0;
    for (let Y = curY - 2; Y > nextY; Y--) {
      if (gs.years.has(Y) && gs.years.get(Y) === null) { if (++run >= EMPTY_STOP) { stop = true; return; } }
      else run = 0;
    }
    if (nextY < POR_FLOOR) stop = true;
  }
  await new Promise(resolve => {
    let pumping = false, again = false, finished = false;
    const finish = () => { if (!finished) { finished = true; resolve(); } };
    const exhausted = () => stop || nextY < POR_FLOOR;
    async function pumpOnce() {
      if (!storeAlive(tok)) return;
      advanceFrontier();
      while (wanted() && !exhausted() && inflight < MAX_INFLIGHT) {
        while (nextY >= POR_FLOOR && gs.years.has(nextY)) nextY--;
        if (nextY < POR_FLOOR) break;
        const c = await cacheGetYear(st.id, group, nextY);
        if (!storeAlive(tok)) return;
        if (c !== undefined) { applyYear(gs, nextY, c); nextY--; advanceFrontier(); onLoadProgress(); continue; }
        // A chunk of consecutive uncached years, newest first.
        const hi = nextY;
        let lo = hi;
        while (lo - 1 >= POR_FLOOR && hi - (lo - 1) < GROUPS[group].chunk && !gs.years.has(lo - 1)) {
          if ((await cacheGetYear(st.id, group, lo - 1)) !== undefined) break;
          lo--;
        }
        if (!storeAlive(tok)) return;
        nextY = lo - 1;
        inflight++;
        const stagger = FETCH_GAP_MS * (inflight - 1);
        (async () => {
          if (stagger) await sleep(stagger);
          const res = await fetchRange(st, group, lo, hi);
          inflight--;
          if (!storeAlive(tok)) { finish(); return; }
          ingest(res);
          failStreak = res.years.size === 0 ? failStreak + 1 : 0;
          if (failStreak >= 3) stop = true;
          onLoadProgress();
          pump();
        })();
      }
    }
    async function pump() {
      if (pumping) { again = true; return; }
      pumping = true;
      do { again = false; await pumpOnce(); } while (again);
      pumping = false;
      if (!storeAlive(tok)) { finish(); return; }
      if (inflight === 0 && (!wanted() || exhausted())) { advanceFrontier(); finish(); }
    }
    pump();
  });
  if (!storeAlive(tok)) return;
  advanceFrontier();
  gs.status = stop ? 'done' : 'idle';
  onLoadProgress(true);
}

function mergedFor(group, outName) {
  const gs = store && store.groups[group];
  if (!gs) return null;
  gs.merged = gs.merged || {};
  const hit = gs.merged[outName];
  if (hit !== undefined && hit.ver === gs.ver) return hit.m;
  let minY = Infinity, maxY = -Infinity;
  for (const [Y, v] of gs.years) if (v) { if (Y < minY) minY = Y; if (Y > maxY) maxY = Y; }
  let m = null;
  if (minY !== Infinity) {
    const startMs = Date.UTC(minY, 0, 1);
    const vals = new Float32Array((Date.UTC(maxY + 1, 0, 1) - startMs) / HOUR).fill(NaN);
    for (let Y = minY; Y <= maxY; Y++) { const v = gs.years.get(Y); if (v && v[outName]) vals.set(v[outName], (Date.UTC(Y, 0, 1) - startMs) / HOUR); }
    m = { startMs, startDay: startMs / DAY, vals, minY, maxY };
  }
  gs.merged[outName] = { ver: gs.ver, m };
  return m;
}

// Per-LST-day aggregates of an hourly group.
function dailyFor(group, outName) {
  const gs = store && store.groups[group];
  const m = mergedFor(group, outName);
  if (!m) return null;
  gs.daily = gs.daily || {};
  const hit = gs.daily[outName];
  if (hit && hit.ver === gs.ver) return hit.d;
  const nDays = m.vals.length / 24;
  const max = new Float32Array(nDays).fill(NaN), min = new Float32Array(nDays).fill(NaN), mean = new Float32Array(nDays).fill(NaN), cnt = new Uint8Array(nDays);
  for (let d = 0; d < nDays; d++) {
    let c = 0, s = 0, hi = -Infinity, lo = Infinity;
    for (let h = d * 24, e = h + 24; h < e; h++) {
      const v = m.vals[h];
      if (v === v) { c++; s += v; if (v > hi) hi = v; if (v < lo) lo = v; }
    }
    cnt[d] = c;
    if (c >= MIN_HOURS_COMPLETE) { max[d] = hi; min[d] = lo; mean[d] = s / c; }
  }
  const d = { startDay: m.startDay, max, min, mean, cnt };
  gs.daily[outName] = { ver: gs.ver, d };
  return d;
}

// ================================================================
// ACIS — official daily high/low
// ================================================================
async function loadACIS() {
  const a = store.acis;
  if (a.status === 'loading' || a.status === 'ok' || a.status === 'fail') return;
  const st = store.st, tok = store.token;
  a.status = 'loading';
  onLoadProgress();
  const sid = /^K[A-Z0-9]{3}$/.test(st.id) ? st.id.slice(1) : st.id;
  try {
    const json = await fetchWithRetry(`ACIS ${sid}`, async () => {
      const resp = await fetch('https://data.rcc-acis.org/StnData', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sid, sdate: 'por', edate: 'por', elems: ['maxt', 'mint'] })
      });
      if (!resp.ok) { const err = new Error(`ACIS HTTP ${resp.status}`); err.transient = isTransientStatus(resp.status); throw err; }
      return resp.json();
    });
    if (!storeAlive(tok)) return;
    if (!json || json.error || !Array.isArray(json.data) || !json.data.length) throw new Error(json && json.error ? json.error : 'no ACIS data');
    const rows = json.data;
    const p0 = rows[0][0].split('-').map(Number);
    const startDay = ymdToDay(p0[0], p0[1], p0[2]);
    const p1 = rows[rows.length - 1][0].split('-').map(Number);
    const n = ymdToDay(p1[0], p1[1], p1[2]) - startDay + 1;
    const maxt = new Float32Array(n).fill(NaN), mint = new Float32Array(n).fill(NaN);
    const pv = s => { if (s == null) return NaN; const f = parseFloat(s); return isNaN(f) ? NaN : f; };
    for (const r of rows) {
      const p = r[0].split('-').map(Number);
      const i = ymdToDay(p[0], p[1], p[2]) - startDay;
      if (i < 0 || i >= n) continue;
      maxt[i] = pv(r[1]); mint[i] = pv(r[2]);
    }
    let any = false; for (let i = 0; i < n; i++) if (maxt[i] === maxt[i] || mint[i] === mint[i]) { any = true; break; }
    if (!any) throw new Error('no ACIS values');
    Object.assign(a, { status: 'ok', startDay, maxt, mint });
  } catch (e) {
    if (!storeAlive(tok)) return;
    a.status = 'fail'; a.error = e.message;
    console.warn('ACIS unavailable, falling back to IEM hourly-derived daily values:', e.message);
  }
  onLoadProgress(true);
}

// ================================================================
// CONFIG

const app = {

  presetId: 'd-muggy65',

// ================================================================
// SERIES — one unit per hour or per day, starting on an LST day boundary.
// state: 0 = present, not qualifying · 1 = qualifying · 2 = missing · 3 = out of season
// ================================================================
function recordStartDay(cfg, st) {
  if (cfg.record === 'full') return -Infinity;
  if (cfg.record === '1991') return syStartDay(1991, cfg.ys);
  const t = nowLST(st);
  return syStartDay(syOf(t.y, t.m, cfg.ys) - 29, cfg.ys);
}

function finalizeSeries(unit, startDay, vals, cfg, st, source) {
  const upd = unit === 'hour' ? 24 : 1;
  const now = nowLST(st);
  const L = vals.length;
  // Last unit allowed: yesterday for daily (today is still in progress), now for hourly.
  const maxIdx = unit === 'day' ? (now.day - 1) - startDay : Math.floor((now.ms - startDay * DAY) / HOUR);
  let end = Math.min(L - 1, maxIdx);
  while (end >= 0 && !(vals[end] === vals[end])) end--;          // trailing missing = not yet reported
  if (end < 0) return null;
  let start = 0;
  const rsd = recordStartDay(cfg, st);
  if (rsd > startDay) start = (rsd - startDay) * upd;
  while (start <= end && !(vals[start] === vals[start])) start++;
  start -= start % upd;                                           // align to the day
  if (start > end) return null;
  const n = end - start + 1;
  const sd = startDay + start / upd;
  const nDays = Math.floor((n - 1) / upd) + 1;
  const dayMonth = new Uint8Array(nDays), dayYear = new Int16Array(nDays), daySY = new Int16Array(nDays), dayDom = new Uint8Array(nDays);
  for (let d = 0; d < nDays; d++) {
    const t = dayToYMD(sd + d);
    dayMonth[d] = t.m; dayYear[d] = t.y; dayDom[d] = t.d; daySY[d] = syOf(t.y, t.m, cfg.ys);
  }
  const val = vals.subarray(start, end + 1);
  const state = new Uint8Array(n);
  for (let i = 0; i < n; i++) {
    const d = upd === 1 ? i : (i / 24) | 0;
    if (!cfg.months.has(dayMonth[d])) { state[i] = 3; continue; }
    const v = val[i];
    state[i] = v === v ? (qualifies(v, cfg) ? 1 : 0) : 2;
  }
  return { unit, upd, startDay: sd, n, nDays, val, state, dayMonth, dayYear, daySY, dayDom, source,
           lastMs: (sd * DAY) + (n - 1) * (unit === 'hour' ? HOUR : DAY) };
}

function buildSeries(cfg) {
  if (!store) return null;
  const st = store.st;
  const src = sourceFor(cfg);
  if (src === 'acis') {
    const a = store.acis;
    if (a.status !== 'ok') return null;
    const n = a.maxt.length, vals = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const hi = a.maxt[i], lo = a.mint[i];
      vals[i] = cfg.metric === 'max' ? hi : cfg.metric === 'min' ? lo : ((hi === hi && lo === lo) ? (hi + lo) / 2 : NaN);
    }
    return finalizeSeries('day', a.startDay, vals, cfg, st, 'acis');
  }
  const out = VARIABLES[cfg.variable].out;
  if (cfg.agg === 'hourly') {
    const m = mergedFor(src, out);
    if (!m) return null;
    return finalizeSeries('hour', m.startDay, m.vals, cfg, st, 'iem');
  }
  const dly = dailyFor(src, out);
  if (!dly) return null;
  return finalizeSeries('day', dly.startDay, dly[cfg.metric], cfg, st, cfg.variable === 'temp' ? 'iem-derived' : 'iem');
}

// ================================================================
// STREAKS + STATS
// ================================================================
function extractStreaks(S) {
  const s = [], l = [];
  let cs = -1;
  const st = S.state;
  for (let i = 0; i < S.n; i++) {
    if (st[i] === 1) { if (cs < 0) cs = i; }
    else if (cs >= 0) { s.push(cs); l.push(i - cs); cs = -1; }
  }
  if (cs >= 0) { s.push(cs); l.push(S.n - cs); }
  return { s, l };
}
const dayOfUnit = (S, i) => S.upd === 1 ? i : (i / 24) | 0;

function inSeasonUnits(sy, cfg, upd) {
  // Theoretical in-season units in a counting year (independent of data).
  let n = 0;
  for (let k = 0; k < 12; k++) {
    const m = ((cfg.ys - 1 + k) % 12) + 1;
    const y = (cfg.ys !== 1 && m < cfg.ys) ? sy + 1 : sy;
    if (cfg.months.has(m)) n += daysInMonth(y, m);
  }
  return n * upd;
}

function computeStats(S, streaks, cfg) {
  const st = {};
  const { s, l } = streaks;
  const K = l.length;
  st.total = K;
  st.avg = K ? l.reduce((a, b) => a + b, 0) / K : 0;
  let rec = 0; for (const x of l) if (x > rec) rec = x;
  st.record = rec;
  st.recordTies = rec ? l.filter(x => x === rec).length : 0;
  st.current = (K && s[K - 1] + l[K - 1] === S.n) ? K - 1 : -1;
  st.lastEnded = st.current < 0 && K ? K - 1 : (K > 1 ? K - 2 : -1);
  if (st.current >= 0) {
    const L = l[st.current];
    st.rank = 1 + l.filter(x => x > L).length;
    st.rankTies = l.filter(x => x === L).length;
  }

  // Counting years: coverage and each year's longest streak.
  const lastDay = S.nDays - 1;
  st.syFirst = S.daySY[0]; st.syLast = S.daySY[lastDay]; st.currentSY = st.syLast;
  const present = new Map();
  for (let i = 0; i < S.n; i++) {
    const v = S.state[i];
    if (v === 0 || v === 1) { const sy = S.daySY[dayOfUnit(S, i)]; present.set(sy, (present.get(sy) || 0) + 1); }
  }
  const yearlyMax = new Map();
  for (let k = 0; k < K; k++) {
    const syA = S.daySY[dayOfUnit(S, s[k])], syB = S.daySY[dayOfUnit(S, s[k] + l[k] - 1)];
    for (let sy = syA; sy <= syB; sy++) if (!(yearlyMax.get(sy) >= l[k])) yearlyMax.set(sy, l[k]);
  }
  const years = [];
  for (let sy = st.syFirst; sy <= st.syLast; sy++) {
    const theo = inSeasonUnits(sy, cfg, S.upd);
    const cov = theo ? (present.get(sy) || 0) / theo : 0;
    years.push({ sy, theo, present: present.get(sy) || 0, cov, max: yearlyMax.get(sy) || 0 });
  }

  st.seasonMax = yearlyMax.get(st.currentSY) || 0;

  if (dist.length) {

function returnPeriodText(stats) {
  if (stats.persistent) return 'Persistent';
  if (stats.rpN == null) return '–';
  const { rpK: k, rpN: N } = stats;
  if (k === 0) return `> ${N} yrs`;
  if (k === N) return 'Every year';

// ================================================================
// TOTALS
// ================================================================
function computeYearTotals(S, stats) {
  const qual = new Map();
  for (let i = 0; i < S.n; i++) if (S.state[i] === 1) { const sy = S.daySY[dayOfUnit(S, i)]; qual.set(sy, (qual.get(sy) || 0) + 1); }
  return stats.years.map(y => ({
    key: y.sy, qual: qual.get(y.sy) || 0, present: y.present, theo: y.theo, cov: y.cov,
    partial: y.sy === stats.currentSY || y.cov < COVERAGE_MIN
  }));
}
function computeMonthTotals(S, cfg) {
  const acc = new Map();   // y*12+m -> {qual, present, y, m}
  for (let i = 0; i < S.n; i++) {
    const v = S.state[i];
    if (v !== 0 && v !== 1) continue;
    const d = dayOfUnit(S, i);
    const key = S.dayYear[d] * 12 + S.dayMonth[d];
    let e = acc.get(key);
    if (!e) { e = { qual: 0, present: 0, y: S.dayYear[d], m: S.dayMonth[d] }; acc.set(key, e); }

  const rows = [];

    if (!cfg.months.has(m)) continue;
    let sum = 0, cnt = 0;
    for (const e of acc.values()) {
      if (e.m !== m) continue;
      if (e.present / (daysInMonth(e.y, m) * S.upd) < COVERAGE_MIN) continue;
      sum += e.qual; cnt++;
    }
    rows.push({ m, avg: cnt ? sum / cnt : 0, years: cnt });
  }

      ? `${fmtDay(unitStartDay(S, s[stats.current]))}, ${fmtHourOfMs(unitMs(S, s[stats.current]))}`
      : fmtDay(unitStartDay(S, s[stats.current]));

    if (L === stats.record) html += stats.recordTies > 1 ? ' Ties the record.' : ' <strong>New record.</strong>';
    note.innerHTML = html;
  } else {
    // Not active: time since the last streak ended.
    const k = stats.lastEnded;

    if (lastState === 3) {
      val.textContent = '–'; unit.textContent = '';

  setChip('sv-rp', loadingHist && stats.current >= 0 ? '…' : returnPeriodText(stats), loadingHist || stats.current < 0 && !stats.persistent);
  setChip('sv-record', stats.record ? formatLengthShort(stats.record, cfg) : '–', !stats.record);

// ================================================================
// FORECAST CHECK (NWS)
// ================================================================
const forecastCache = new Map();
function tempFAndRHtoDewpointF(tF, rh) {
  const tC = (tF - 32) * 5 / 9, a = 17.625, b = 243.04;
  const g = Math.log(rh / 100) + a * tC / (b + tC);
  return (b * g / (a - g)) * 9 / 5 + 32;
}
function shortForecastToOktas(s) {
  if (!s) return null;
  const t = s.toLowerCase();
  if (t.includes('overcast') || t.includes('cloudy') && !t.includes('partly') && !t.includes('mostly')) return 8;
  if (t.includes('mostly cloudy')) return 6.5;
  if (t.includes('partly')) return 4;
  if (t.includes('mostly sunny') || t.includes('mostly clear')) return 2;
  if (t.includes('sunny') || t.includes('clear')) return 0;
  return null;
}
async function fetchForecast(st, hourly) {
  const key = `${st.id}|${hourly ? 'h' : 'd'}`;
  const hit = forecastCache.get(key);
  if (hit && Date.now() - hit.at < 10 * 60000) return hit.data;
  const pt = await fetch(`https://api.weather.gov/points/${st.lat.toFixed(4)},${st.lon.toFixed(4)}`);
  if (!pt.ok) throw new Error('points');
  const pj = await pt.json();
  const url = hourly ? pj.properties.forecastHourly : pj.properties.forecast;
  if (!url) throw new Error('nourl');
  const fr = await fetch(url);
  if (!fr.ok) throw new Error('forecast');
  const data = ((await fr.json()).properties || {}).periods || [];
  forecastCache.set(key, { at: Date.now(), data });
  return data;
}
let forecastSeq = 0;
async function maybeCheckForecast() {
  const el = $('jeopardy-line');
  const { cfg, S, stats } = last;
  const seq = ++forecastSeq;
  if (!S || !stats || stats.current < 0 || !isFresh(S) || !store) { el.textContent = ''; return; }
  el.textContent = 'Checking NWS forecast…';
  try {
    const periods = await fetchForecast(store.st, cfg.agg === 'hourly');
    if (seq !== forecastSeq) return;
    const nums = str => (String(str || '').match(/\d+/g) || []).map(Number);
    const pv = p => {
      if (cfg.variable === 'wind') { const n = nums(p.windSpeed); return n.length ? (cfg.agg === 'daily' && cfg.metric === 'mean' ? n.reduce((a, b) => a + b, 0) / n.length : Math.max(...n)) : null; }
      if (cfg.variable === 'gust') {
        const m = String(p.detailedForecast || '').match(/gusts?[^.]*?(?:as high as|up to|around|near|of)\s+(\d+)\s*mph/i);
        return m ? +m[1] : 0;
      }
      if (cfg.variable === 'temp') return typeof p.temperature === 'number' ? p.temperature : null;
      if (cfg.variable === 'cloud') return shortForecastToOktas(p.shortForecast);
      if (p.dewpoint && typeof p.dewpoint.value === 'number') {
        const v = p.dewpoint.value; return (p.dewpoint.unitCode || '').includes('degC') ? v * 9 / 5 + 32 : v;
      }
      if (p.relativeHumidity && typeof p.relativeHumidity.value === 'number' && typeof p.temperature === 'number') return tempFAndRHtoDewpointF(p.temperature, p.relativeHumidity.value);
      return null;
    };
    let use, when;
    if (cfg.agg === 'hourly') { use = periods.slice(0, 6); when = 'the next 6 hours'; }
    else {
      const day = periods.find(p => p.isDaytime), night = periods.find(p => !p.isDaytime);
      if (cfg.variable === 'gust') { use = periods.slice(0, 2); when = periods.slice(0, 2).map(p => p.name.toLowerCase()).join(' and '); }
      else if (cfg.metric === 'min') { use = night ? [night] : []; when = night ? night.name.toLowerCase() : ''; }
      else if (cfg.metric === 'max') { use = day ? [day] : []; when = day ? day.name.toLowerCase() : ''; }
      else { use = periods.slice(0, 2); when = periods.slice(0, 2).map(p => p.name.toLowerCase()).join(' and '); }
    }
    const vals = use.map(pv).filter(v => v != null);
    if (!vals.length) throw new Error('novals');
    // Daily mean from a day/night pair: average them.
    const tested = cfg.variable === 'gust' ? [Math.max(...vals)]
      : cfg.agg === 'daily' && cfg.metric === 'mean' ? [vals.reduce((a, b) => a + b, 0) / vals.length] : vals;
    const all = tested.every(v => qualifies(v, cfg)), any = tested.some(v => qualifies(v, cfg));
    const V = VARIABLES[cfg.variable];
    const shown = cfg.variable === 'gust' && tested[0] === 0 ? 'no gusts mentioned'
      : [...new Set(vals.filter(v => cfg.variable !== 'gust' || v > 0).map(v => Math.round(v)))].join('–') + V.unit;
    const verdict = all ? 'likely to continue' : !any ? 'likely to end' : 'close call';
    el.innerHTML = `<strong>Forecast: ${verdict}.</strong> NWS ${when}: ${shown}${cfg.variable === 'cloud' ? ' (from forecast wording)' : ''}.`;
  } catch (e) {
    if (seq === forecastSeq) el.textContent = 'Forecast unavailable.';
  }
}

// ================================================================
// CALENDAR (one row per counting year, one cell per day)
// ================================================================
const stripCanvas = $('strip-canvas'), stripCtx = stripCanvas.getContext('2d');
const CAL = { ROW_H: 14, ROW_GAP: 2, HDR: 24, LEFT: 70, RIGHT: 12 };
let calFlash = null;   // {d0, d1, until}
let calGeom = null;

// Column layout: months in counting-year order, out-of-season months dropped.
function templateOffsets(ys, months) {
  const off = new Array(13).fill(-1);
  let acc = 0;
  for (let k = 0; k < 12; k++) {
    const m = ((ys - 1 + k) % 12) + 1;
    if (months && !months.has(m)) continue;
    off[m] = acc; acc += TEMPLATE_LEN[m - 1];

}
// Per-day summary: qualifying units, present units, and the day's range of values.
function daySummary(S) {
  if (S._days) return S._days;
  const q = new Uint8Array(S.nDays), p = new Uint8Array(S.nDays), ex = new Uint8Array(S.nDays);
  for (let i = 0; i < S.n; i++) {
    const d = dayOfUnit(S, i), v = S.state[i];
    if (v === 3) ex[d] = 1;
    else if (v !== 2) { p[d]++; if (v === 1) q[d]++; }

}
function streakDayRange(S, sIdx, len) { return [dayOfUnit(S, sIdx), dayOfUnit(S, sIdx + len - 1)]; }

function drawCalendar(ctx, W, opts) {
  opts = opts || {};
  const { cfg, S, streaks, stats } = last;
  const rows = stats.syLast - stats.syFirst + 1;
  const H = CAL.HDR + rows * (CAL.ROW_H + CAL.ROW_GAP);
  if (opts.bg) { ctx.fillStyle = opts.bg; ctx.fillRect(0, 0, W, H); }
  const { off, total } = templateOffsets(cfg.ys, cfg.months);
  const plotW = W - CAL.LEFT - CAL.RIGHT, cellW = plotW / total;

  ctx.font = '12px "Courier Prime", monospace';
  ctx.fillStyle = COLORS.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  for (let m = 1; m <= 12; m++) if (off[m] >= 0) ctx.fillText(MONTH_NAMES[m - 1], CAL.LEFT + (off[m] + TEMPLATE_LEN[m - 1] / 2) * cellW, CAL.HDR - 8);
  ctx.strokeStyle = 'rgba(232,228,217,0.07)'; ctx.lineWidth = 1;
  for (let m = 1; m <= 12; m++) {
    if (off[m] <= 0) continue;
    const x = Math.round(CAL.LEFT + off[m] * cellW) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, CAL.HDR - 4); ctx.lineTo(x, H); ctx.stroke();
  }

  const ds = daySummary(S);
  const base = baseColor(cfg);
  const recDays = new Uint8Array(S.nDays);
  const { s, l } = streaks;
  const recRows = new Set(), curRows = new Set();
  if (stats.record) for (let k = 0; k < l.length; k++) if (l[k] === stats.record) {
    const [a, b] = streakDayRange(S, s[k], l[k]);
    for (let d = a; d <= b; d++) { recDays[d] = 1; recRows.add(S.daySY[d]); }
  }
  if (stats.current >= 0) {
    const [a, b] = streakDayRange(S, s[stats.current], l[stats.current]);
    for (let d = a; d <= b; d++) { recDays[d] = 2; curRows.add(S.daySY[d]); }
  }
  const hourly = S.upd === 24;
  const rgb = hexToRgb(base);
  for (let d = 0; d < S.nDays; d++) {
    const mo = S.dayMonth[d];
    if (off[mo] < 0) continue;
    const row = S.daySY[d] - stats.syFirst;
    const y = CAL.HDR + row * (CAL.ROW_H + CAL.ROW_GAP);
    const x = CAL.LEFT + (off[mo] + S.dayDom[d] - 1) * cellW;
    // Non-leap Feb 28 also covers the empty Feb 29 column, so it doesn't read as a gap.
    const wCells = (mo === 2 && S.dayDom[d] === 28 && !isLeap(S.dayYear[d])) ? 2 : 1;
    let color;
    if (ds.p[d] === 0) color = ds.ex[d] ? null : COLORS.missing;
    else if (recDays[d] === 2) color = COLORS.current;
    else if (recDays[d] === 1) color = COLORS.record;
    else if (ds.q[d] === 0) color = COLORS.nonQual;
    else if (!hourly) color = base;
    else { const f = ds.q[d] / 24; color = `rgba(${rgb},${(0.22 + 0.78 * Math.min(1, f)).toFixed(3)})`; }

    const sy = stats.syFirst + r, y = CAL.HDR + r * (CAL.ROW_H + CAL.ROW_GAP);
    ctx.fillStyle = curRows.has(sy) ? COLORS.current : recRows.has(sy) ? COLORS.record : COLORS.label;
    ctx.fillText(syLabel(sy, cfg.ys), CAL.LEFT - 12, y + CAL.ROW_H / 2 + 1);

    for (let d = calFlash.d0; d <= calFlash.d1; d++) {
      if (off[S.dayMonth[d]] < 0) continue;
      const row = S.daySY[d] - stats.syFirst, y = CAL.HDR + row * (CAL.ROW_H + CAL.ROW_GAP);
      const x = CAL.LEFT + (off[S.dayMonth[d]] + S.dayDom[d] - 1) * cellW;
      ctx.strokeRect(x - 1, y - 1.5, Math.max(cellW, 1) + 1.6, CAL.ROW_H + 3);

}
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`; }

  if (!S) { stripCanvas.style.height = '0px'; stripCanvas.height = 0; calGeom = null; return; }

    chip(sq(COLORS.record), 'Record'),

function flashStreak(k) {

  const [d0, d1] = streakDayRange(S, streaks.s[k], streaks.l[k]);
  calFlash = { d0, d1, until: Date.now() + 1800 };
  const row = S.daySY[d0] - last.stats.syFirst;
  const rect = stripCanvas.getBoundingClientRect();
  const y = rect.top + window.scrollY + CAL.HDR + row * (CAL.ROW_H + CAL.ROW_GAP);
  window.scrollTo({ top: Math.max(0, y - window.innerHeight / 3), behavior: 'smooth' });

// Tooltip
(function () {

    const plotW = rect.width - CAL.LEFT - CAL.RIGHT, cellW = plotW / total;

      if (ds.ex[d] && ds.p[d] === 0) html += `<div class="tt-sub">Outside season</div>`;
      else if (ds.p[d] === 0) html += `<div class="tt-sub">No data</div>`;
      else if (S.upd === 24) html += `<div class="tt-sub">${ds.q[d]} of ${ds.p[d]} hrs ${cfg.op === 'gte' ? '≥' : '≤'} ${cfg.value}${V.unit}</div>`;
      else html += `<div class="tt-sub">${V.metricLabel[cfg.metric][0].toUpperCase() + V.metricLabel[cfg.metric].slice(1)}: ${V.fmt(S.val[d])}${ds.q[d] ? ' ✓' : ''}</div>`;
    }
    tt.innerHTML = html;
    tt.style.display = 'block';
    const tw = tt.offsetWidth;
    tt.style.left = (x + 16 + tw > rect.width ? x - tw - 12 : x + 14) + 'px';
    tt.style.top = (y + 14) + 'px';
  });
  stripCanvas.addEventListener('mouseleave', () => { tt.style.display = 'none'; });
})();

const PLOT_LAYOUT_BASE = {
  paper_bgcolor: '#262B27', plot_bgcolor: '#262B27',
  font: { family: 'Courier Prime, monospace', color: '#A6A499', size: 13 }
};
function renderRanked() {
  const { cfg, S, streaks, stats } = last;
  const tbody = $('ranked-tbody');
  if (!S || !streaks.l.length) {
    tbody.innerHTML = `<tr><td colspan="4" class="empty">${S ? 'No qualifying streaks in this record' : '–'}</td></tr>`;
    Plotly.purge('ranked-chart');
    return;
  }
  const order = streaks.l.map((_, k) => k).sort((a, b) => streaks.l[b] - streaks.l[a] || streaks.s[b] - streaks.s[a]).slice(0, 15);
  const rankOf = k => 1 + streaks.l.filter(x => x > streaks.l[k]).length;
  tbody.innerHTML = order.map(k => {
    const isCur = k === stats.current, isRec = streaks.l[k] === stats.record;
    const tag = isCur ? '<span class="rank-tag tag-active">Current</span>' : isRec ? '<span class="rank-tag tag-record">Record</span>' : '';
    return `<tr class="clickable ${isCur ? 'is-current' : isRec ? 'is-record' : ''}" data-k="${k}"><td>#${rankOf(k)}</td><td>${streakDateText(S, streaks.s[k], streaks.l[k])}</td><td class="r">${formatLength(streaks.l[k], cfg)}</td><td>${tag}</td></tr>`;
  }).join('');
  tbody.querySelectorAll('tr.clickable').forEach(tr => tr.addEventListener('click', () => flashStreak(+tr.dataset.k)));

  const labels = order.map(k => `#${rankOf(k)} · ${fmtDay(unitStartDay(S, streaks.s[k]), false)} ${S.dayYear[dayOfUnit(S, streaks.s[k])]}`);
  const colors = order.map(k => k === stats.current ? COLORS.current : streaks.l[k] === stats.record ? COLORS.record : baseColor(cfg));
  // Duplicate labels (same start date text) would merge bars; make them unique.
  const seen = new Map();
  const uniq = labels.map(t => { const n = (seen.get(t) || 0) + 1; seen.set(t, n); return n > 1 ? t + ' '.repeat(n - 1) : t; });
  Plotly.react('ranked-chart', [{
    type: 'bar', orientation: 'h', y: uniq.slice().reverse(), x: order.map(k => streaks.l[k]).reverse(),
    marker: { color: colors.slice().reverse() },

  }], Object.assign({}, PLOT_LAYOUT_BASE, {
    margin: { l: 170, r: 20, t: 10, b: 44 },

    yaxis: { automargin: true, tickfont: { size: 13 } }

}

// ================================================================
// STATION FINDER (search + Near Me, shared roster)
// ================================================================
let ddIdx = -1;
function haversineMiles(lat1, lon1, lat2, lon2) {
  const R = 3958.8, r = d => d * Math.PI / 180;
  const a = Math.sin(r(lat2 - lat1) / 2) ** 2 + Math.cos(r(lat1)) * Math.cos(r(lat2)) * Math.sin(r(lon2 - lon1) / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(a));
}
function findNearestStation() {
  const btn = $('locate-btn');
  if (!navigator.geolocation) { alert('Geolocation is not supported by this browser.'); return; }
  const orig = btn.innerHTML; btn.classList.add('loading'); btn.innerHTML = '&#8987; Locating…';
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove('loading'); btn.innerHTML = orig;
    const { latitude: lat, longitude: lon } = pos.coords;
    const ranked = Object.values(STATIONS).map(s => ({ s, dist: haversineMiles(lat, lon, s.lat, s.lon) })).sort((a, b) => a.dist - b.dist).slice(0, 8);
    $('si').value = '';
    renderDD(ranked.map(r => r.s), ranked.map(r => r.dist));
  }, err => {
    btn.classList.remove('loading'); btn.innerHTML = orig;
    alert('Could not get your location: ' + (err && err.message ? err.message : 'permission denied or unavailable.'));
  }, { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
}
function initSearch() {
  const inp = $('si'), dd = $('dd'), all = Object.values(STATIONS);
  inp.addEventListener('input', () => {
    ddIdx = -1; const q = inp.value.trim().toLowerCase();
    if (!q) { dd.classList.remove('open'); return; }
    renderDD(all.filter(s => s.id.toLowerCase().startsWith(q) || s.id.slice(1).toLowerCase().startsWith(q) || s.name.toLowerCase().includes(q) || s.st.toLowerCase() === q).slice(0, 18));
  });
  inp.addEventListener('keydown', e => {
    const items = dd.querySelectorAll('.d-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); ddIdx = Math.min(ddIdx + 1, items.length - 1); highlightDD(items); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ddIdx = Math.max(ddIdx - 1, 0); highlightDD(items); }
    else if (e.key === 'Enter') { e.preventDefault(); if (ddIdx >= 0 && items[ddIdx]) items[ddIdx].click(); else if (items[0]) items[0].click(); }
    else if (e.key === 'Escape') dd.classList.remove('open');
  });
  document.addEventListener('click', e => { if (!$('sw').contains(e.target)) dd.classList.remove('open'); });
  $('locate-btn').addEventListener('click', findNearestStation);
}
function highlightDD(items) { items.forEach((el, i) => { el.classList.toggle('hi', i === ddIdx); if (i === ddIdx) el.scrollIntoView({ block: 'nearest' }); }); }
function renderDD(matches, dists) {
  const dd = $('dd');
  if (!matches.length) { dd.classList.remove('open'); return; }
  dd.innerHTML = matches.map((s, i) => `<div class="d-item"><span class="d-id">${s.id}</span><span class="d-name">${s.name}</span>` +
    (dists ? `<span class="d-dist">${dists[i].toFixed(0)}mi</span>` : '') + `<span class="d-st">${s.st}</span></div>`).join('');
  dd.querySelectorAll('.d-item').forEach((el, i) => el.addEventListener('click', () => { $('si').value = ''; dd.classList.remove('open'); selectStation(matches[i].id); }));
  dd.classList.add('open');
}

// ================================================================
// URL STATE  ?st=KISP&streak=d-muggy65&season=jja&rec=1991&view=totals
// custom streak: c.<variable>.<agg>.<metric>.<op>.<value>; custom months: months=6,7,8
// ================================================================
function syncURL() {
  const p = new URLSearchParams();
  if (app.station) p.set('st', app.station);
  if (app.custom) { const c = app.custom; p.set('streak', `c.${c.variable}.${c.agg}.${c.metric}.${c.op}.${c.value}`); }
  else p.set('streak', app.presetId);
  if (app.seasonId === 'custom') p.set('months', [...app.months].sort((a, b) => a - b).join(','));
  else if (app.seasonId !== 'all') p.set('season', app.seasonId);
  if (app.record !== 'full') p.set('rec', app.record);
  if (app.view !== 'streaks') p.set('view', app.view);
  try { history.replaceState(null, '', `${location.pathname}?${p.toString()}`); } catch (e) {}
}
function readURL() {
  const p = new URLSearchParams(location.search);
  const streak = p.get('streak');
  if (streak && PRESET_BY_ID[streak]) { app.presetId = streak; app.custom = null; }
  else if (streak && streak.startsWith('c.')) {
    const [, variable, agg, metric, op, value] = streak.split('.').length > 6
      ? [null, ...streak.slice(2).split('.').slice(0, 4), streak.slice(2).split('.').slice(4).join('.')]
      : streak.split('.');
    if (VARIABLES[variable] && (agg === 'hourly' || agg === 'daily') && ['max', 'min', 'mean'].includes(metric) && (op === 'gte' || op === 'lte') && !isNaN(parseFloat(value)))
      app.custom = { variable, agg, metric, op, value: parseFloat(value) };
  }
  const cfg = app.custom || PRESET_BY_ID[app.presetId];
  app.family = FAMILY_OF_VARIABLE[cfg.variable];
  const season = p.get('season'), months = p.get('months');
  const sp = SEASON_PRESETS.find(s => s.id === season);
  if (sp) { app.months = new Set(sp.months); app.seasonId = sp.id; app.seasonLabel = sp.label; }
  else if (months) {
    const ms = months.split(',').map(Number).filter(m => m >= 1 && m <= 12);
    if (ms.length) { app.months = new Set(ms); app.seasonId = 'custom'; app.seasonLabel = customSeasonLabel(app.months); }
  }
  const rec = p.get('rec'); if (rec === '1991' || rec === '30') app.record = rec;
  const view = p.get('view'); if (view === 'totals') app.view = 'totals';
  const st = (p.get('st') || '').toUpperCase();
  return STATIONS[st] ? st : (STATIONS.KISP ? 'KISP' : Object.keys(STATIONS)[0]);
}

// ================================================================
// PNG EXPORT — drawn directly at a fixed scale, independent of the screen's DPR
// ================================================================
function exportPNG() {
  const { cfg, S, streaks, stats } = last;
  if (!S) return;
  const st = store.st;
  const W = 1200, PAD = 28, headerH = 150, legendH = 34, footerH = 46;
  const rows = stats.syLast - stats.syFirst + 1;
  const calH = CAL.HDR + rows * (CAL.ROW_H + CAL.ROW_GAP);
  const H = headerH + calH + legendH + footerH + 16;
  const off = document.createElement('canvas');
  off.width = W * EXPORT_SCALE; off.height = H * EXPORT_SCALE;
  const c = off.getContext('2d');
  c.scale(EXPORT_SCALE, EXPORT_SCALE);
  c.fillStyle = '#1E2320'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#262B27'; c.fillRect(0, 0, W, headerH);
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillStyle = COLORS.muted; c.font = '12px "Courier Prime", monospace';
  c.fillText('HOURLY DATA · STREAK TRACKER', PAD, 28);
  c.fillStyle = '#E8E4D9'; c.font = 'bold 24px "Zilla Slab", serif';
  c.fillText(`${st.name}, ${st.st}`, PAD, 60);
  c.fillStyle = baseColor(cfg); c.font = 'bold 16px "Courier Prime", monospace';
  c.fillText(summaryText(cfg), PAD, 86);
  const { s, l } = streaks;
  let line;
  if (stats.current >= 0) line = `Current streak: ${formatLength(l[stats.current], cfg)} since ${fmtDay(unitStartDay(S, s[stats.current]))} · #${stats.rank} of ${stats.total}`;
  else if (stats.lastEnded >= 0) line = `Not active · last streak ${streakDateText(S, s[stats.lastEnded], l[stats.lastEnded])} (${formatLength(l[stats.lastEnded], cfg)})`;
  else line = 'No qualifying streaks on record';
  c.fillStyle = '#E8E4D9'; c.font = '15px "Courier Prime", monospace';
  c.fillText(line, PAD, 112);
  c.fillStyle = COLORS.label; c.font = '14px "Public Sans", sans-serif';
  const rp = returnPeriodText(stats);
  c.fillText(`Record ${stats.record ? formatLength(stats.record, cfg) : '–'} · ${stats.total} streaks · ${S.dayYear[0]}–${S.dayYear[S.nDays - 1]}${rp !== '–' ? ` · Return period ${rp}` : ''}`, PAD, 134);

  c.save(); c.translate(0, headerH + 8);
  drawCalendar(c, W, { export: true });
  c.restore();

  // Legend
  let lx = PAD; const ly = headerH + 8 + calH + 12;
  c.font = '12px "Courier Prime", monospace'; c.textBaseline = 'middle';
  const items = [[baseColor(cfg), S.upd === 24 ? 'Share of hours qualifying' : 'Qualifying day'], [COLORS.record, 'Record'], [COLORS.current, 'Current'], [COLORS.nonQual, 'Not qualifying'], [COLORS.missing, 'No data']];
  for (const [col, txt] of items) {
    c.fillStyle = col; c.fillRect(lx, ly - 6, 12, 12);
    if (col === COLORS.missing) { c.strokeStyle = 'rgba(232,228,217,.25)'; c.strokeRect(lx + 0.5, ly - 5.5, 11, 11); }
    c.fillStyle = COLORS.label; c.fillText(txt, lx + 18, ly);
    lx += 18 + c.measureText(txt).width + 22;
  }
  c.textBaseline = 'alphabetic';
  c.fillStyle = COLORS.muted; c.font = '12px "Courier Prime", monospace';
  const srcTxt = S.source === 'acis' ? 'NOAA ACIS' : 'Iowa Environmental Mesonet ASOS';
  c.fillText(`Data: ${srcTxt} · ${st.id} · local standard time`, PAD, H - 18);
  c.textAlign = 'right'; c.fillText('contextclimate.io', W - PAD, H - 18);
  c.fillStyle = baseColor(cfg); c.fillRect(0, H - 3, W, 3);

  const a = document.createElement('a');
  a.download = `streak-tracker-${st.id}-${cfg.presetId || 'custom'}.png`;
  a.href = off.toDataURL('image/png');
  a.click();
}

// ================================================================
// INIT
// ================================================================
function init() {
  initSearch();
  initControls();
  const id = readURL();
  $('streaks-view').style.display = app.view === 'streaks' ? '' : 'none';
  $('totals-view').style.display = app.view === 'totals' ? '' : 'none';
  syncControls();
  selectStation(id);
}
init();

</script>
</body>
</html>
