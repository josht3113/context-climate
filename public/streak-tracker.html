<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streak Tracker | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="station-roster.js"></script>
<style>
:root { --tool-accent: var(--accent-hourly); --cc-card-width: 400px; }
[hidden] { display: none !important; }

/* Top bar */
.exp { display: flex; gap: 6px; }
.exp .cc-btn { padding: 8px 12px; font-size: 14px; font-weight: 700; }
.cc-btn.is-ok { border-color: #3A9E50; color: #5CC070; }
.cc-btn.is-error { border-color: #C05050; color: #E07070; }

/* Station finder */
.finder-group { position: relative; flex: 0 0 auto; display: flex; align-items: stretch; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color .15s; }
.finder-group:focus-within { border-color: var(--tool-accent); }
.finder-group .search-icon { display: flex; align-items: center; padding-left: 12px; color: var(--color-text-muted); font-size: 16px; pointer-events: none; }
.finder-group .search-input { width: 250px; background: transparent; border: none; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
.finder-group .search-input::placeholder { color: var(--color-text-muted); }
.finder-sep { width: 1px; align-self: stretch; margin: 7px 0; background: var(--color-border); }
.finder-group .locate-btn { border: none; border-radius: 0; background: transparent; white-space: nowrap; font-size: 14px; padding: 6px 12px; color: var(--color-text-primary); }
.locate-btn.loading { opacity: .5; pointer-events: none; }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 360px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 320px; overflow-y: auto; z-index: 300; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.dropdown.open { display: block; }
.d-item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); }
.d-item:last-child { border-bottom: none; }
.d-item:hover, .d-item.hi { background: rgba(55,138,221,.18); }
.d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 50px; flex-shrink: 0; }
.d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-item .d-dist, .d-item .d-st { color: var(--color-text-muted); font-size: 13px; }

/* Sentence */
.cc-scene-head { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px 9px; }
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
.q-word { font-family: var(--font-display); font-size: 19px; color: var(--color-text-secondary); }
.q-tok { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; color: var(--color-text-primary); background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-bottom: 2px solid var(--tool-accent); border-radius: var(--radius-md); padding: 5px 10px 4px; cursor: pointer; white-space: nowrap; }
.q-tok:hover, .q-tok.is-open { border-color: var(--tool-accent); background: rgba(55,138,221,.14); }
.q-tok::after { content: '\25BE'; font-size: 13px; margin-left: 7px; color: var(--tool-accent); }
.q-thr { display: inline-flex; align-items: stretch; border: 1px solid var(--color-border-hover); border-bottom: 2px solid var(--tool-accent); border-radius: var(--radius-md); background: var(--color-surface-2); overflow: hidden; }
.q-thr button { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-text-primary); background: transparent; border: none; border-right: 1px solid var(--color-border); padding: 2px 10px; cursor: pointer; }
.q-thr button:hover { background: rgba(55,138,221,.14); }
.q-thr input { width: 70px; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-text-primary); background: transparent; border: none; outline: none; padding: 2px 4px 2px 10px; text-align: right; -moz-appearance: textfield; }
.q-thr input::-webkit-outer-spin-button, .q-thr input::-webkit-inner-spin-button { -webkit-appearance: none; }
.q-thr .u { font-family: var(--font-display); font-size: 18px; color: var(--color-text-secondary); align-self: center; padding: 0 10px 0 3px; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--color-text-secondary); background: transparent; border: 1px solid var(--color-border); border-radius: 999px; padding: 4px 11px; cursor: pointer; white-space: nowrap; }
.preset:hover { color: var(--color-text-primary); border-color: var(--tool-accent); }
.preset.is-active { color: var(--color-bg); background: var(--tool-accent); border-color: var(--tool-accent); font-weight: 600; }
.preset:disabled { opacity: .35; cursor: not-allowed; }

/* Popovers */
.pop { position: absolute; z-index: 400; min-width: 220px; max-width: 520px; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); box-shadow: 0 10px 28px rgba(0,0,0,.5); padding: 10px; }
.pop-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin: 8px 2px 6px; }
.pop-l:first-child { margin-top: 0; }
.pop-grid { display: grid; gap: 5px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); }
.pop-opt { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--color-text-primary); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 8px 10px; cursor: pointer; text-align: left; white-space: nowrap; }
.pop-opt:hover { border-color: var(--tool-accent); }
.pop-opt.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); font-weight: 600; }
.pop-opt:disabled { opacity: .35; cursor: not-allowed; }
.pop-opt.c { text-align: center; }
.pop-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.pop-row .cc-btn { padding: 7px 12px; font-size: 14px; }

/* Stage */
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tip { position: absolute; z-index: 50; pointer-events: none; background: rgba(30,35,32,.96); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 7px 10px; font-family: var(--font-mono); font-size: 13px; line-height: 1.45; color: var(--color-text-primary); white-space: nowrap; }
.tip b { font-family: var(--font-display); font-size: 17px; }
.tip .m { color: var(--color-text-muted); }
.state-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--color-surface); font-family: var(--font-mono); font-size: 15px; color: var(--color-text-secondary); text-align: center; padding: 20px; }
.load-bar { width: 220px; height: 3px; background: var(--color-border); border-radius: 2px; overflow: hidden; }
.load-bar::after { content: ''; display: block; width: 36%; height: 100%; background: var(--tool-accent); animation: loadslide 1.3s ease-in-out infinite; }
@keyframes loadslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }

/* Scene bar */
.cc-scene-bar { flex-wrap: wrap; row-gap: 6px; }
.cc-scene-bar .cc-segmented { flex-shrink: 0; }
.cc-scene-bar .cc-segmented-btn { padding-left: 12px; padding-right: 12px; font-size: 14px; }
.bar-opts { display: flex; align-items: center; gap: 8px; }
.bar-opts .cc-btn { font-size: 14px; padding: 7px 11px; }
.legend { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-left: auto; flex-wrap: wrap; }
.legend .k { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.legend .ln { width: 18px; height: 0; border-top: 2px dashed; display: inline-block; }

/* Rail */
.stn-name { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.15; color: var(--color-text-primary); }
.stn-meta { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.5; color: var(--color-text-muted); margin: 3px 0 10px; }
.hl { display: grid; grid-template-columns: auto 1fr; align-items: end; column-gap: 10px; margin: 2px 0 2px; }
.hl-num { font-family: var(--font-display); font-weight: 700; font-size: 58px; line-height: .95; color: var(--color-text-primary); }
.hl-unit { font-family: var(--font-display); font-size: 22px; color: var(--color-text-secondary); padding-bottom: 6px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.badge { font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--color-border-hover); color: var(--color-text-muted); }
.badge.active { color: #1E2320; background: #E0824A; border-color: #E0824A; }
.badge.active.cool { background: #5B9BD8; border-color: #5B9BD8; }
.hl-label { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin-top: 6px; }
.hl-note { font-family: var(--font-body); font-size: 15px; line-height: 1.45; color: var(--color-text-secondary); margin-top: 6px; }
.hl-note strong { color: var(--color-text-primary); }
.fc-line { font-family: var(--font-body); font-size: 14.5px; line-height: 1.45; color: var(--color-text-secondary); margin-top: 6px; min-height: 0; }
.fc-line strong { color: var(--tool-accent); }
.chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 6px; margin: 12px 0 10px; }
.chip { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 6px 8px; min-width: 0; }
.chip-l { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-muted); white-space: nowrap; }
.chip-v { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.2; color: var(--color-text-primary); white-space: nowrap; }
.chip.dim .chip-v { color: var(--color-text-muted); }
.tbl-wrap { flex: 1; min-height: 150px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-top: 6px; }
table.tbl { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13.5px; }
.tbl th { position: sticky; top: 0; background: var(--color-surface-2); color: var(--color-text-primary); font-weight: 700; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; padding: 7px 7px; text-align: right; border-bottom: 1px solid var(--color-border-hover); white-space: nowrap; }
.tbl th:nth-child(2), .tbl td:nth-child(2) { text-align: left; }
.tbl td { padding: 5px 7px; text-align: right; color: var(--color-text-primary); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.tbl td.r { color: var(--color-text-muted); }
.tbl td.dt { white-space: normal; line-height: 1.3; }
.tbl tbody tr { cursor: pointer; }
.tbl tbody tr:hover td { background: rgba(232,228,217,.05); }
.tbl tr.cur td { background: rgba(241,238,228,.08); }
.tbl tr.sel td { background: rgba(55,138,221,.2); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 0 4px; border-radius: 3px; margin-left: 4px; vertical-align: 1px; }
.tag.now { color: #1E2320; background: #F1EEE4; }
.tag.rec { color: #1E2320; background: #D9A94F; }
.tag.gap { color: var(--color-text-muted); border: 1px solid var(--color-border-hover); }
.notice { font-family: var(--font-mono); font-size: 13px; color: #E0A060; margin: 4px 0 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notice .cc-btn { font-size: 12px; padding: 3px 8px; }
.cc-card-src { margin-top: 8px; padding-top: 0; font-size: 12px; }

@media (max-width: 1100px) {
  .finder-group .search-input { width: 160px; }
  .locate-btn .nm { display: none; }
  :root { --cc-card-width: 340px; }
  .hl-num { font-size: 48px; }
}
@media (max-width: 760px) {
  .finder-group { flex: 1 1 100%; order: 3; }
  .finder-group .search-input { width: 100%; min-width: 0; }
  .exp { margin-left: auto; }
  .tbl-wrap { max-height: 420px; }
  .legend { margin-left: 0; }
  .cc-scene-bar .cc-segmented { flex: 1 1 100%; display: flex; }
  .cc-scene-bar .cc-segmented-btn { flex: 1 1 auto; padding: 9px 1px; font-size: 11px; letter-spacing: 0; }
}
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">

  <div class="cc-app-top">
    <h1 class="cc-app-title">Streak Tracker</h1>
    <div class="finder-group" id="sw">
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si" placeholder="Search city or station..." autocomplete="off" spellcheck="false">
      <div class="dropdown" id="dd"></div>
      <div class="finder-sep"></div>
      <button class="cc-btn locate-btn" id="locate-btn" title="Use my location to find the nearest station">&#128205;<span class="nm"> Near Me</span></button>
    </div>
    <div class="cc-app-spacer"></div>
    <div class="exp">
      <button class="cc-btn" id="csv-btn">&#x2193; CSV</button>
      <button class="cc-btn" id="png-btn">&#x2193; PNG</button>
    </div>
  </div>

  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head">
        <div class="sentence" id="sentence">
          <span class="q-word">Streaks of</span>
          <button class="q-tok" id="tok-unit"></button>
          <span class="q-word">with</span>
          <button class="q-tok" id="tok-metric" hidden></button>
          <button class="q-tok" id="tok-var"></button>
          <span class="q-thr" id="thr-grp">
            <button id="thr-op" title="Switch between at-or-above and at-or-below"></button>
            <input type="number" id="thr-val" step="any" aria-label="Threshold value">
            <span class="u" id="thr-unit"></span>
          </span>
          <span class="q-word" id="thr-word" hidden>reported</span>
          <span class="q-word">in</span>
          <button class="q-tok" id="tok-season"></button>
          <span class="q-word">across</span>
          <button class="q-tok" id="tok-record"></button>
        </div>
        <div class="presets" id="presets"></div>
      </div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="chart"></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="state-overlay" id="overlay"><div id="overlay-text">Loading station record…</div><div class="load-bar" id="overlay-bar"></div></div>
      </div>
      <div class="cc-scene-bar">
        <div class="cc-segmented" id="view-seg">
          <button class="cc-segmented-btn is-active" data-view="now">Streak</button>
          <button class="cc-segmented-btn" data-view="year">By year</button>
          <button class="cc-segmented-btn" data-view="all">All streaks</button>
          <button class="cc-segmented-btn" data-view="cal">Calendar</button>
          <button class="cc-segmented-btn" data-view="totals">Totals</button>
        </div>
        <div class="bar-opts" id="opts-totals" hidden>
          <div class="cc-segmented" id="totals-seg">
            <button class="cc-segmented-btn is-active" data-g="ytd">Year to date</button>
            <button class="cc-segmented-btn" data-g="year">By year</button>
            <button class="cc-segmented-btn" data-g="month">By month</button>
          </div>
        </div>
        <div class="bar-opts" id="opts-now" hidden>
          <button class="cc-btn" id="back-btn">&#8634; Current</button>
        </div>
        <div class="bar-opts" id="opts-trace" hidden>
          <button class="cc-btn" id="trace-btn">Trace counts as wet</button>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <div class="cc-card">
      <div class="stn-name" id="stn-name">&nbsp;</div>
      <div class="stn-meta" id="stn-meta">&nbsp;</div>
      <div class="notice" id="notice" hidden></div>
      <div class="hl">
        <div class="hl-num" id="hl-num">&ndash;</div>
        <div class="hl-unit"><span id="hl-unit"></span><span class="badge" id="hl-badge">&ndash;</span></div>
      </div>
      <div class="hl-label" id="hl-label">&nbsp;</div>
      <div class="hl-note" id="hl-note"></div>
      <div class="fc-line" id="fc-line"></div>
      <div class="chips" id="chips"></div>
      <div class="cc-card-eb">Longest streaks<span id="tbl-sub" style="margin-left:auto;font-weight:400;color:var(--color-text-muted);letter-spacing:.04em"></span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Dates</th><th>Length</th><th id="val-th">Peak</th></tr></thead><tbody id="tbody"></tbody></table></div>
      <div class="cc-card-src" id="prov"></div>
    </div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>

  const sp = SEASON_PRESETS.find(s => s.id === season);
  if (sp) { app.months = new Set(sp.months); app.seasonId = sp.id; app.seasonLabel = sp.label; }
  else if (months) { const ms = months.split(',').map(Number).filter(m => m >= 1 && m <= 12); if (ms.length && ms.length < 12) { app.months = new Set(ms); app.seasonId = 'custom'; app.seasonLabel = customSeasonLabel(app.months); } }
  const rec = p.get('rec'); if (rec === '1991' || rec === '30') app.record = rec;
  else if (!p.get('rec') && streak && PRESET_BY_ID[streak] && PRESET_BY_ID[streak].era30) app.record = '30';
  const view = p.get('view'); if (VIEWS[view]) app.view = view; else if (view === 'totals') app.view = 'totals';
  const tot = p.get('tot'); if (tot === 'year' || tot === 'month') app.totals = tot;
  if (p.get('trace') === 'wet') app.traceWet = true;
  let st = (p.get('st') || '').toUpperCase();
  if (!STATIONS[st]) { try { st = localStorage.getItem('cc-streak-stn') || ''; } catch (e) { st = ''; } }
  return STATIONS[st] ? st : (STATIONS.KISP ? 'KISP' : Object.keys(STATIONS)[0]);
}

/* ── Exports ──────────────────────────────────────────────────────── */
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
const VIEW_TITLE = { now: 'Streak', year: 'Longest streak by year', all: 'Every streak on record', cal: 'Calendar', totals: 'Totals' };
function slug() { return `${app.station}-${last.cfg.presetId || 'custom'}-${app.view}`.toLowerCase(); }
function buildPNG() {
  const { cfg, S, stats } = last;
  const W = 1500, H = 900, sc = 2, cv = document.createElement('canvas'); cv.width = W * sc; cv.height = H * sc;
  const c = cv.getContext('2d'); c.scale(sc, sc);
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.font = `700 32px ${F.disp}`; c.fillStyle = C.text;
  const st = store.st;
  c.fillText(`${st.name}, ${st.st} · ${summaryText(cfg)}`, 36, 56);
  c.font = `17px ${F.mono}`; c.fillStyle = C.text2;
  let sub = `${VIEW_TITLE[app.view]}${app.view === 'totals' ? ` · ${({ ytd: 'year to date', year: 'by year', month: 'by month' })[app.totals]}` : ''} · ${syLabel(stats.years[0].sy, cfg.ys)}–${syLabel(stats.currentSY, cfg.ys)}`;
  if (stats.current >= 0) sub += ` · current streak ${formatLength(last.streaks.l[stats.current], cfg)}, #${stats.rank} of ${stats.total.toLocaleString()}`;
  else if (stats.record) sub += ` · record ${formatLength(stats.record, cfg)}`;
  c.fillText(sub, 36, 86);
  const cx = 28, cy = 106, cw = W - 56, ch = H - 106 - 56;
  c.fillStyle = C.surface; rr(c, cx, cy, cw, ch, 6); c.fill(); c.strokeStyle = C.border; c.lineWidth = 1; c.stroke();
  VIEWS[app.view](c, cx + 16, cy + 14, cw - 32, ch - 26, null);
  c.font = `14px ${F.mono}`; c.fillStyle = C.muted; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  const src = S.source === 'acis' ? `NOAA ACIS ${store.thread ? 'ThreadEx' : 'station'} daily record` : 'Iowa Environmental Mesonet ASOS observations';
  c.fillText(`Data: ${src} · local standard time${fcSeries && app.view === 'now' ? ' · forecast: NWS' : ''}`, 36, H - 22);
  c.textAlign = 'right'; c.fillStyle = C.text2; c.font = `700 15px ${F.mono}`; c.fillText('contextclimate.io', W - 36, H - 22);
  return cv;
}
$('png-btn').onclick = async () => { if (!last.S) return; await document.fonts.ready; buildPNG().toBlob(b => download(b, `streak-tracker-${slug()}.png`), 'image/png'); };
$('csv-btn').onclick = () => {
  const { cfg, S, streaks, stats } = last; if (!S) return;
  const q = s => `"${String(s).replace(/"/g, '""')}"`, kind = streakValueKind(cfg);
  const iso = i => S.unit === 'hour' ? new Date(unitMs(S, i)).toISOString().slice(0, 16).replace('T', ' ') : new Date(unitStartDay(S, i) * DAY).toISOString().slice(0, 10);
  const lines = [`# ${store.st.name}, ${store.st.st} (${store.st.id}) · ${summaryText(cfg)} · times in local standard time`,
    ['rank', 'start', 'end', `length_${cfg.agg === 'daily' ? 'days' : 'hours'}`, VALUE_HDR[kind].toLowerCase() || 'value', 'current', 'record', 'next_to_missing_data'].join(',')];
  for (const k of rankedKs(Infinity)) {
    const s0 = streaks.s[k], len = streaks.l[k], v = streakValue(S, s0, len, kind);
    lines.push([rankOf(len), iso(s0), iso(s0 + len - 1), len, v == null ? '' : (Math.round(v * 100) / 100), k === stats.current ? 'yes' : '', len === stats.record ? 'yes' : '', streakTouchesGap(S, s0, len) ? 'yes' : ''].join(','));
  }
  download(new Blob([lines.join('\n')], { type: 'text/csv' }), `streak-tracker-${app.station}-${cfg.presetId || 'custom'}.csv`.toLowerCase());
};

/* ── Init ─────────────────────────────────────────────────────────── */
new ResizeObserver(() => draw()).observe($('stage'));
initSearch();
selectStation(readURL(), true);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => draw());
setInterval(() => { if (store && store.hourly.live === 'ok' && document.visibilityState === 'visible' && Date.now() - (store.liveAt || store.loadedAt || Date.now()) > 20 * 60000) refreshLive(); }, 60000);
async function refreshLive() {
  const s = store, h = s.hourly; s.liveAt = Date.now();
  try {
    const nowY = nowLST(s.st).y, y1 = Math.max(h.through + 1, nowY);
    const text = await fetchLive(s.st, y1);
    if (!alive(s)) return;
    for (const g of Object.keys(GROUPS)) for (const [Y, out] of parseChunk(text, g, y1, nowY, s.st)) {
      if (!out) continue; const off = (Date.UTC(Y, 0, 1) - h.startMs) / HOUR;
      for (const o of GROUPS[g].outs) if (out[o] && off + out[o].length <= h.vals[o].length) h.vals[o].set(out[o], off);
    }
    s.cache = {}; render();
  } catch (e) {}
}
