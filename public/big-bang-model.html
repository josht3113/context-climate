<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Bang Model</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="spectra-core.js"></script>
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 24px; }
.top .spacer { flex: 1; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #0F1311; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* controls: Play | snap chips over the time strip | Log/Linear */
.controls { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; grid-template-rows: auto 46px; column-gap: 10px;
  padding: 8px 10px 4px; border-top: 1px solid var(--color-border); background: var(--color-surface); }
.play { grid-row: 1 / 3; grid-column: 1; align-self: stretch; margin-bottom: 4px; font-size: 16px; font-weight: 700;
  background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 22px; }
.snaps { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; }
.snap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px;
  padding: 5px 2px; min-width: 0; white-space: normal; }
.snap .n { font-family: var(--font-body); font-weight: 600; font-size: 13px; line-height: 1.12; color: var(--color-text-primary); text-align: center; }
.snap .v { font-family: var(--font-mono); font-weight: 700; font-size: 13px; line-height: 1; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
#strip { grid-column: 2; grid-row: 2; width: 100%; height: 46px; display: block; touch-action: none; cursor: pointer; }
.scale { grid-column: 3; grid-row: 1 / 3; flex-direction: column; align-self: stretch; margin-bottom: 4px; }
.scale .cc-segmented-btn { flex: 1; padding: 6px 14px; font-size: 14px; font-weight: 600; border-right: none; border-bottom: 1px solid var(--color-border); }
.scale .cc-segmented-btn:last-child { border-bottom: none; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.ev .v { font-size: 19px; color: var(--tool-accent); }
.card .comp { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .bar { display: flex; height: 14px; border-radius: 2px; overflow: hidden; margin: 6px 0 5px; background: var(--color-surface-2); }
.card .bar span { display: block; height: 100%; }
.card .keys { display: flex; flex-wrap: wrap; gap: 3px 12px; }
.card .key { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--color-text-primary); white-space: nowrap; }
.card .key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.card .note { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--color-text-primary); margin-top: 3px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .comp { padding: 5px 0 4px; }
}
@media (max-width: 1440px) {
  .tabs .cc-segmented-btn { padding: 11px 16px; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 262px; }
  .x-link .nm { display: none; }
  .tabs .cc-segmented-btn { padding: 11px 13px; }
  .card { padding: 10px 13px; }
  .card .v { font-size: 22px; }
  .card .v .u { font-size: 14px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 248px; }
  .top { gap: 12px; }
  .controls { grid-template-columns: 84px minmax(0, 1fr) auto; column-gap: 8px; }
  .snaps { gap: 4px; }
  .scale .cc-segmented-btn { padding: 6px 10px; }
  .exp .cc-btn { padding: 6px 9px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Big Bang Model</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-view="inside">Inside</button>
      <button class="cc-segmented-btn" data-view="profile">Profile</button>
      <button class="cc-segmented-btn" data-view="observer">Observer</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <a class="cc-btn x-link" id="prevLink" target="_top" href="#">&larr; <span class="nm" id="prevName">Doppler Challenge</span></a>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage"><canvas id="cv"></canvas></div>
      <div class="controls">
        <button class="cc-btn play" id="bPlay"><span class="ic">▶</span><span class="tx">Play</span></button>
        <div class="snaps" id="snaps"></div>
        <canvas id="strip"></canvas>
        <div class="cc-segmented scale" id="scale">
          <button class="cc-segmented-btn is-active" data-scale="log">Log</button>
          <button class="cc-segmented-btn" data-scale="linear">Linear</button>
        </div>
      </div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

        copies(qx - Math.floor(qx), qy - Math.floor(qy), ly.sc, W, H, 4, (x, y) => { c.fillRect(x - 1, y - 1, 2, 2); });
      }
    }
    wb.stars.forEach((s, i) => {
      const thr = LY(lerp(110e6, 320e6, hash(i, sd, 51)));
      const sa = sstep(thr - 0.03, thr + 0.03, lt) * (1 - 0.92 * sstep(LY(1e9), LY(4e9), lt)) * w * vis(ly.w, hash(i, sd, 52));
      if (sa < 0.02) return;
      copies(s[0], s[1], ly.sc, W, H, 12, (x, y) => { if (hole && Math.hypot(x - cx, y - cy) < hole) return;
        c.globalAlpha = sa; const r = s[2] ? 11 : 6; c.drawImage(SPR.star, x - r, y - r, 2 * r, 2 * r); });
    });
    wb.gals.forEach((g0, i) => {
      const gg = sstep(LY(0.45e9) + 0.12 * hash(i, sd, 61), LY(4e9), lt), gv = vis(ly.w, hash(i, sd, 65));
      if (gg < 0.01 || gv < 0.02) return;
      const kind = Math.floor(hash(i, sd, 62) * 6), rot = hash(i, sd, 63) * TAU, sq = 0.45 + 0.5 * hash(i, sd, 64);
      const size = (g0[2] ? 17 : 10) * (0.35 + 0.65 * gg);
      copies(g0[0], g0[1], ly.sc, W, H, 30, (x, y) => { if (hole && Math.hypot(x - cx, y - cy) < hole) return;
        drawSprite(c, SPR.gal[kind].cv, x, y, size, rot, sq, gg * w * gv); });
    });
  }
  c.restore();
  if (mwA > 0.01) {
    drawSprite(c, SPR.gal[1].cv, cx, cy, 30, -0.5, 0.62, mwA);
    if (mwA > 0.35) label(c, 'Milky Way', cx + 38, cy - 8, { color: `rgba(232,228,217,${0.85 * mwA})`, plate: `rgba(7,9,11,${0.6 * mwA})` });
    const sunA = sstep(LY(8.5e9), LY(9.15e9), lt) * alpha;
    if (sunA > 0.01) {
      const sx = cx + 11, sy = cy + 3;
      c.save(); c.globalAlpha = sunA; c.beginPath(); c.arc(sx, sy, 3, 0, TAU); c.fillStyle = '#F2C14E'; c.fill();
      c.lineWidth = 1.5; c.strokeStyle = '#F2C14E'; c.beginPath(); c.arc(sx, sy, 7, 0, TAU); c.stroke(); c.restore();
      label(c, 'Sun & Earth', cx + 38, cy + 14, { color: `rgba(242,193,78,${0.95 * sunA})`, plate: `rgba(7,9,11,${0.6 * sunA})` });
    }
  }
}

function insideLegend(t, mA) {
  const lt = L10(t), out = [];
  if (t <= T_I1) return out;
  const band = fmtPeak(t)[1];
  const P = (r, col, edge) => (c, x, y) => dot(c, x, y, r, rgba(col, 1), 1, edge);
  if (mA >= 0.5) {
    if (lt < LQ1 - 0.1) out.push([P(2.2, C_QUARK), 'Quark']);
    if (lt >= LQ0 + 0.1) out.push([P(4.5, C_PROT), lt < LF1 ? 'Proton' : lt < LR1 ? 'Hydrogen nucleus' : 'Hydrogen atom']);
    if (lt >= LQ0 + 0.1 && lt < LF1) out.push([P(4.5, C_NEUT), 'Neutron']);
    if (lt >= LF0) out.push([(c, x, y) => { for (const [dx, dy, k] of [[-3, 0, 0], [0, -3, 1], [3, 0, 0], [0, 3, 1]]) dot(c, x + dx, y + dy, 3.4, rgba(k ? C_NEUT : C_PROT, 1), 1, 'rgba(12,14,16,0.55)'); },
      lt < LR1 ? 'Helium nucleus' : 'Helium atom']);
    if (lt < LR1) out.push([P(2, C_ELEC), 'Electron']);
    out.push([(c, x, y) => { const col = photonColor(t); c.globalAlpha = 1; c.strokeStyle = rgba(col, 1); c.lineWidth = 1.7; c.beginPath();
      for (let s = 0; s <= 16; s++) { const u = s / 16, px = x - 8 + 16 * u, py = y + 3.2 * Math.sin(u * TAU * 1.6); s ? c.lineTo(px, py) : c.moveTo(px, py); } c.stroke(); }, 'Light · ' + band]);
  } else {
    if (lt < LY(3.5e9)) out.push([(c, x, y) => { c.globalAlpha = 1; c.fillStyle = rgba(C_GAS, 1); for (const [dx, dy] of [[-4, -2], [0, 2], [4, -1], [-1, -4]]) c.fillRect(x + dx - 0.9, y + dy - 0.9, 1.8, 1.8); }, 'Hydrogen & helium gas']);
    if (lt >= LY(105e6) && lt < LY(3.5e9)) out.push([(c, x, y) => { c.globalAlpha = 1; c.drawImage(SPR.star, x - 9, y - 9, 18, 18); }, 'Stars']);
    if (lt >= LY(0.45e9)) out.push([(c, x, y) => drawSprite(c, SPR.gal[0].cv, x, y, 10, 0.4, 0.6, 1), 'Galaxies']);
  }
  return out;
}

function drawLegend(c, items, x, y) { // bottom-left anchor
  if (!items.length) return;
  c.save(); c.font = `600 13px ${FB}`;
  const rowH = 21, w = Math.max(...items.map(i => c.measureText(i[1]).width)) + 44, h = items.length * rowH + 10;
  c.fillStyle = 'rgba(14,17,15,0.74)'; rrect(c, x, y - h, w, h, 4); c.fill();
  items.forEach(([draw, txt], i) => {
    const yy = y - h + 5 + rowH * (i + 0.5);
    c.save(); draw(c, x + 16, yy); c.restore();
    label(c, txt, x + 32, yy, { color: 'rgba(232,228,217,0.88)' });
  });
  c.restore();
}

function scaleBar(c, W, H, t, mA) {
  if (t <= 0) return;
  let physW, unit;
  if (mA >= 0.5) {
    const T = tempOf(t);
    physW = T ? 12 * 3.7e-3 / T : 12 * 3.7e-3 / (TCMB / A_I1) * aOf(t) / A_I1; unit = 'm';
  } else { physW = 4e7 * aOf(t); unit = 'ly'; }
  const target = physW * 0.18, e = Math.floor(L10(target)), base = Math.pow(10, e);
  const m = target / base >= 5 ? 5 : target / base >= 2 ? 2 : 1, len = m * base, px = len / physW * W;
  const txt = unit === 'm' ? fmtMeters(len) : fmtLy(len);
  c.save(); c.font = `700 13px ${FM}`;
  const tw = Math.max(px, c.measureText(txt).width), x1 = W - 18, x0 = x1 - px, y = H - 22;
  c.fillStyle = 'rgba(14,17,15,0.74)'; rrect(c, x1 - tw - 12, y - 30, tw + 24, 42, 4); c.fill();
  c.strokeStyle = 'rgba(232,228,217,0.9)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(x0, y - 5); c.lineTo(x0, y + 3); c.moveTo(x0, y); c.lineTo(x1, y); c.moveTo(x1, y - 5); c.lineTo(x1, y + 3); c.stroke();
  label(c, txt, x1, y - 16, { font: `700 13px ${FM}`, align: 'right', color: 'rgba(232,228,217,0.9)' });
  c.restore();
}

function drawInside(c, W, H, o) {
  const t = o.t, tau = o.tau;
  const lt = t > 0 ? L10(t) : -99;
  const mA = 1 - sstep(LZ0, LZ1, lt), cA = 1 - mA;
  const gl = glowColor(t), bg = cA > 0 ? mix(gl, mix(SPACE_BG, gl, sstep(700, 3000, tempOf(t) || 1e9)), cA) : gl;
  c.fillStyle = rgba(bg, 1); c.fillRect(0, 0, W, H);

  const a = aOf(t), L = layers(a);
  drawGrid(c, W, H, a, 1, bright);
  if (mA > 0.01) drawMicro(c, W, H, t, a, L, mA, tau, bright);
  if (cA > 0.01) drawCosmic(c, W, H, t, a, L, cA, tau, o.capture);
  drawLegend(c, insideLegend(t, mA), 14, H - 14);
  scaleBar(c, W, H, t, mA);
  if (t <= T_I1) tag(c, 'NO PARTICLES YET', W - 16, 22, 'right');
  else tag(c, mA >= 0.5 ? 'PARTICLE SIZES NOT TO SCALE' : 'GALAXY SIZES EXAGGERATED', W - 16, 22, 'right');
}

/* ═══════════════════════════ PROFILE VIEW ══════════════════════════
   The size of the universe against its age, drawn like the NYSED model:
   a trumpet whose slices are the stages. Log mode shows inflation's
   flare; linear mode shows the slow start and today's speed-up. */
const LA_MIN = L10(aOf(T_I0)) - 3;
function sizeNorm(t, scale) {
  if (t <= 0) return 0;
  if (scale === 'linear') return aOf(t);
  if (t < T_I0) return (-3 / LA_MIN) * (xLog(t) / PB);
  return clamp((L10(aOf(t)) - LA_MIN) / -LA_MIN, 0, 1);
}
function profileColor(t) {
  if (t <= 0) return [250, 250, 255];
  if (t <= T_I1) return [226, 218, 255];
  const T = tempOf(t);
  if (T >= 3000) return mix([24, 28, 32], hotColor(T), 0.92);
  const dark = mix([20, 26, 32], [30, 40, 56], sstep(LY(150e6), LY(2e9), L10(t)));
  return mix(dark, bbColor(Math.max(T, 1000)), 0.9 * sstep(700, 3000, T));
}
function timeTicks(scale) {
  if (scale === 'linear') return [0, 2, 4, 6, 8, 10, 12].map(g => ({ t: g * 1e9 * YR, txt: g ? g + 'B yr' : '0', major: true }));
  const out = [];
  for (let e = -35; e <= 17; e++) out.push({ t: Math.pow(10, e), txt: e % 10 === 0 ? (e === 0 ? '1 s' : `10${sup(e)} s`) : '', major: e % 10 === 0 });
  return out;
}
function nearestSnap(t) { // index of the snap the clock sits on, or -1
  const x = xLog(t);
  for (let i = 0; i < SNAPS.length; i++) if (Math.abs(xLog(SNAPS[i].t) - x) < 0.0015 && (i > 0 || t <= 0)) return i;
  return -1;
}
function stageIndex(t) { let k = 0; for (let i = 0; i < SNAPS.length; i++) if (t >= SNAPS[i].t * (1 - 1e-9)) k = i; return k; }

function drawProfile(c, W, H, o) {
  const scale = o.scale, t = o.t;
  c.fillStyle = '#0F1311'; c.fillRect(0, 0, W, H);
  const ml = 56, mr = 24, mt = 78, mb = 52;
  const x0 = ml, x1 = W - mr, cy = mt + (H - mt - mb) / 2, hmax = (H - mt - mb) / 2 - 4;
  const xOfT = tt => x0 + (scale === 'log' ? xLog(tt) : xLin(tt)) * (x1 - x0);
  const tOfX = x => { const u = (x - x0) / (x1 - x0); return scale === 'log' ? tLog(u) : tLin(u); };
  const hp = tt => Math.max(tt > 0 ? 1.2 : 0, sizeNorm(tt, scale) * hmax);
  if (o.hit) o.hit.profile = { x0, x1, tOfX };
  // body
  const N = 420, top = [];
  for (let i = 0; i <= N; i++) { const x = x0 + (x1 - x0) * i / N; top.push([x, hp(tOfX(x))]); }
  const grad = c.createLinearGradient(x0, 0, x1, 0);
  for (let i = 0; i <= 80; i++) { const u = i / 80; grad.addColorStop(u, rgba(profileColor(tOfX(x0 + u * (x1 - x0))), 1)); }
  c.beginPath(); top.forEach(([x, h], i) => i ? c.lineTo(x, cy - h) : c.moveTo(x, cy - h));
  for (let i = N; i >= 0; i--) c.lineTo(top[i][0], cy + top[i][1]);
  c.closePath(); c.fillStyle = grad; c.fill();
  c.strokeStyle = 'rgba(232,228,217,0.38)'; c.lineWidth = 1; c.stroke();
  // stars and galaxies inside the shape
  c.save(); c.clip();
  const uS = (xOfT(SNAPS[6].t) - x0) / (x1 - x0);
  for (let i = 0; i < 520; i++) {
    const u = lerp(uS, 1, Math.sqrt(hash(i, 5, 1))), x = x0 + u * (x1 - x0), h = hp(tOfX(x)), y = cy + (hash(i, 5, 2) * 2 - 1) * h * 0.92;
    const old = tOfX(x) > 1e9 * YR;
    c.globalAlpha = 0.35 + 0.5 * hash(i, 5, 3); c.fillStyle = old && hash(i, 5, 4) > 0.6 ? '#FFE3B0' : '#CFE0FF';
    const r = old ? 0.7 + hash(i, 5, 5) * 0.9 : 0.6; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
  }
  c.restore(); c.globalAlpha = 1;
  // CMB release
  { const xc = xOfT(T_CMB), h = hp(T_CMB);
    c.save(); c.shadowColor = 'rgba(255,170,90,0.9)'; c.shadowBlur = 10; c.strokeStyle = 'rgba(255,186,110,0.95)'; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(xc, cy - h); c.lineTo(xc, cy + h); c.stroke(); c.restore(); }
  // stage slices
  const cur = nearestSnap(t);
  SNAPS.forEach((s, i) => {
    const x = xOfT(s.t), h = hp(s.t);
    if (i === 0) { c.beginPath(); c.arc(x, cy, 3, 0, TAU); c.fillStyle = 'rgba(250,250,255,0.95)'; c.fill(); return; }
    c.save(); c.setLineDash([3, 3]); c.strokeStyle = 'rgba(232,228,217,0.42)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(x, cy, Math.max(2, Math.min(9, h * 0.16)), Math.max(h, 2), 0, 0, TAU); c.stroke(); c.restore();
  });
  // cursor
  { const x = xOfT(t), h = hp(t);
    c.save(); c.setLineDash([5, 4]); c.strokeStyle = 'rgba(60,163,174,0.7)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(x, mt - 6); c.lineTo(x, H - mb + 6); c.stroke(); c.restore();
    c.beginPath(); c.ellipse(x, cy, Math.max(3, Math.min(11, h * 0.18)), Math.max(h, 3), 0, 0, TAU);
    c.fillStyle = 'rgba(60,163,174,0.18)'; c.fill(); c.strokeStyle = ACC; c.lineWidth = 2.2; c.stroke(); }
  // stage labels with leaders
  const slot = (x1 - x0) / SNAPS.length;
  c.font = `600 13px ${FB}`;
  SNAPS.forEach((s, i) => {
    const sx = x0 + (i + 0.5) * slot, on = i === cur;
    const lines = wrapWords(c, s.n, slot - 6), ny = 16;
    lines.forEach((ln, k) => label(c, ln, sx, ny + k * 16, { align: 'center', color: on ? ACC : 'rgba(232,228,217,0.88)', font: `600 13px ${FB}` }));
    const vy = ny + lines.length * 16;
    label(c, s.v, sx, vy, { align: 'center', font: `700 13px ${FM}`, color: on ? ACC : 'rgba(166,164,153,0.95)' });
    const tx = xOfT(s.t), ty = cy - hp(s.t) - 3;
    c.strokeStyle = on ? ACC : 'rgba(232,228,217,0.24)'; c.lineWidth = on ? 1.5 : 1;
    c.beginPath(); c.moveTo(sx, vy + 9); c.lineTo(sx, vy + 14); c.lineTo(tx, Math.max(ty, vy + 22)); c.stroke();
  });
  // time axis
  const ay = H - mb + 12;
  c.strokeStyle = 'rgba(232,228,217,0.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, ay); c.lineTo(x1, ay); c.stroke();
  for (const tk of timeTicks(scale)) {
    const x = xOfT(tk.t); if (x < x0 - 1 || x > x1 + 1) continue;
    c.beginPath(); c.moveTo(x, ay); c.lineTo(x, ay + (tk.major ? 6 : 3)); c.stroke();
    if (tk.txt) label(c, tk.txt, x, ay + 17, { align: 'center', font: `700 13px ${FM}`, color: 'rgba(166,164,153,0.95)' });
  }
  if (scale === 'log') { // axis break between 0 and 10⁻³⁶ s
    const xb = x0 + PB * (x1 - x0) * 0.55;
    c.fillStyle = '#0F1311'; c.fillRect(xb - 4, ay - 4, 8, 8);
    c.beginPath(); c.moveTo(xb - 6, ay + 4); c.lineTo(xb - 2, ay - 4); c.moveTo(xb + 2, ay + 4); c.lineTo(xb + 6, ay - 4); c.stroke();
    label(c, '0', x0, ay + 17, { align: 'center', font: `700 13px ${FM}`, color: 'rgba(166,164,153,0.95)' });
  }
  label(c, 'Age of the Universe', (x0 + x1) / 2, H - 10, { align: 'center', font: `600 13px ${FB}`, color: 'rgba(232,228,217,0.75)' });
  label(c, 'Universe cools →', x1, H - 10, { align: 'right', font: `700 13px ${FM}`, color: 'rgba(166,164,153,0.85)' });
  c.save(); c.translate(20, cy); c.rotate(-Math.PI / 2);
  label(c, 'Diameter of the Observable Universe', 0, 0, { align: 'center', font: `600 13px ${FB}`, color: 'rgba(232,228,217,0.75)' });
  c.restore();
  tag(c, scale === 'log' ? 'TIME: LOG · SIZE: LOG' : 'TIME: LINEAR · SIZE: LINEAR', scale === 'log' ? x0 + 14 : x1 - 4, H - mb - 14, scale === 'log' ? 'left' : 'right');
}

/* ═══════════════════════════ OBSERVER VIEW ═════════════════════════
   The Milky Way at the center; distance outward is today's distance to
   where the light we receive now set out (comoving distance). Farther =
   earlier = more redshifted, out to the CMB wall. */
const OBS = [];
(function buildObs() {
  const chiC = chiOf(T_CMB);
  for (let i = 0; i < 640; i++) {
    const u = Math.sqrt(lerp(0.004, 1, hash(i, 77, 1))), te = tOfChi(u * chiC);
    OBS.push({ u, th: hash(i, 77, 2) * TAU, te, z: 1 / aOf(te) - 1, kind: Math.floor(hash(i, 77, 3) * 6), rot: hash(i, 77, 4) * TAU, sq: 0.4 + 0.55 * hash(i, 77, 5), big: hash(i, 77, 6) > 0.8 });
  }
})();
const CMB_RAMP = [[-1, [52, 98, 201]], [-0.35, [118, 168, 230]], [0, [236, 226, 200]], [0.35, [240, 160, 80]], [1, [214, 72, 44]]];
const CMB_NOISE = Array.from({ length: 720 }, (_, k) => {
  const a = k / 720 * TAU; let v = 0;
  for (let j = 0; j < 7; j++) v += Math.sin(a * (3 + j * 4) + hash(j, 88, 1) * TAU) * (0.55 / (1 + j * 0.35));
  return clamp(v * 0.75 + (hash(k >> 2, 88, 2) - 0.5) * 0.5, -1, 1);
});
function zColor(z) { return mix([255, 255, 255], [255, 86, 52], 0.8 * zFrac(z)); }

function drawObserver(c, W, H, o) {
  const t = o.t;
  c.fillStyle = '#0F1311'; c.fillRect(0, 0, W, H);
  const LW = clamp(W * 0.32, 210, 300);
  const Rout = Math.max(60, Math.min((H - 28) / 2, (W - LW - 50) / 2));
  const cx = 24 + Rout + Math.max(0, (W - LW - 48 - 2 * Rout) / 2), cy = H / 2;
  const R1 = Rout - 24, chiC = chiOf(T_CMB), rOf = tt => R1 * chiOf(tt) / chiC;
  if (o.hit) o.hit.obs = { cx, cy, R1, chiC };
  // opaque early universe beyond the CMB
  c.save(); c.beginPath(); c.arc(cx, cy, Rout, 0, TAU); c.arc(cx, cy, R1, 0, TAU, true); c.fillStyle = '#272320'; c.fill('evenodd');
  c.clip('evenodd'); c.strokeStyle = 'rgba(232,228,217,0.12)'; c.lineWidth = 1;
  for (let k = -Rout * 2; k < Rout * 2; k += 7) { c.beginPath(); c.moveTo(cx + k, cy - Rout); c.lineTo(cx + k + Rout * 2, cy + Rout); c.stroke(); }
  c.restore();
  // dark interior
  c.beginPath(); c.arc(cx, cy, R1, 0, TAU); c.fillStyle = '#05070A'; c.fill();
  // galaxies
  for (const g of OBS) {
    const ga = sstep(LY(250e6), LY(600e6), L10(g.te)); if (ga < 0.02) continue;
    const r = g.u * R1; if (r < 18) continue;
    const young = 0.45 + 0.55 * sstep(LY(0.4e9), LY(4e9), L10(g.te));
    const size = (g.big ? 11 : 7) * (1 - 0.5 * g.u) * young * clamp(R1 / 210, 0.9, 1.7);
    const zb = Math.round(zFrac(g.z) * (ZB - 1));
    drawSprite(c, tinted(g.kind, zb), cx + r * Math.cos(g.th), cy + r * Math.sin(g.th), size, g.rot, g.sq, ga * (1 - 0.4 * zFrac(g.z)));
  }
  // CMB light arriving from every direction
  c.save(); c.setLineDash([4, 6]); c.strokeStyle = 'rgba(127,150,168,0.45)'; c.lineWidth = 1.2;
  for (let k = 0; k < 16; k++) {
    const a = k / 16 * TAU + 0.12, ri = 24;
    c.beginPath(); c.moveTo(cx + (R1 - 7) * Math.cos(a), cy + (R1 - 7) * Math.sin(a)); c.lineTo(cx + ri * Math.cos(a), cy + ri * Math.sin(a)); c.stroke();
    c.setLineDash([]); c.beginPath();
    const hx = cx + ri * Math.cos(a), hy = cy + ri * Math.sin(a), px = -Math.sin(a), py = Math.cos(a);
    c.moveTo(hx + 6 * Math.cos(a) + 3 * px, hy + 6 * Math.sin(a) + 3 * py); c.lineTo(hx, hy); c.lineTo(hx + 6 * Math.cos(a) - 3 * px, hy + 6 * Math.sin(a) - 3 * py); c.stroke();
    c.setLineDash([4, 6]);
  }
  c.restore();
  // CMB wall
  c.save(); c.lineWidth = 10;
  for (let k = 0; k < 720; k++) {
    c.strokeStyle = rgba(ramp(CMB_RAMP, CMB_NOISE[k]), 1);
    c.beginPath(); c.arc(cx, cy, R1, k / 720 * TAU - 0.002, (k + 1) / 720 * TAU + 0.002); c.stroke();
  }
  c.restore();
  // snap rings
  const rings = [SNAPS[6], SNAPS[7]];
  c.save(); c.setLineDash([3, 4]); c.strokeStyle = 'rgba(232,228,217,0.28)'; c.lineWidth = 1;
  for (const s of rings) { c.beginPath(); c.arc(cx, cy, rOf(s.t), 0, TAU); c.stroke(); }
  c.restore();
  // Milky Way
  drawSprite(c, SPR.gal[1].cv, cx, cy, 15 * clamp(R1 / 210, 0.9, 1.5), -0.5, 0.62, 1);
  // highlight the light emitted at the clock time
  c.save(); c.strokeStyle = ACC; c.lineWidth = 2.2;
  if (t < T_CMB) { c.beginPath(); c.arc(cx, cy, Rout - 1, 0, TAU); c.stroke(); c.beginPath(); c.arc(cx, cy, R1 + 6, 0, TAU); c.stroke(); }
  else { const r = Math.max(rOf(t), 17); c.beginPath(); c.arc(cx, cy, r, 0, TAU); c.stroke(); }
