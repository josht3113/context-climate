<style>
:root { --tool-accent: var(--accent-earth); --warm: #E0654F; --cold: #4F8FE0; }

/* body */

/* floating chips over the stage */

  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }

.spd { display: inline-flex; align-items: center; gap: 8px; height: 31px; padding: 0 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary);

.tbtn { background: var(--color-surface-2); border: 1px solid var(--color-border-hover); color: var(--color-text-primary);
  font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.tbtn:hover:not(:disabled) { border-color: var(--tool-accent); }

.zb { width: 30px; padding: 5px 0; font-family: var(--font-mono); font-size: 15px; text-align: center; }

.loading.on { display: flex; }

/* Long Island pin */
.mk { position: absolute; z-index: 3; padding: 0; border: 0; background: none; cursor: pointer; display: none; align-items: center; transform: translate(-7px, -50%); }
.mk.on { display: flex; }
.mk .d { width: 14px; height: 14px; border-radius: 50%; background: #E8E4D9; border: 3px solid #14181A; box-shadow: 0 0 0 1.5px #FFF, 0 1px 4px rgba(0,0,0,.5); flex: none; }
.mk .tg { margin-left: 5px; font-family: var(--font-body); font-size: 12.5px; font-weight: 700; color: #14181A; background: rgba(255,255,255,.92);

.mk .tg { display: none; } .mk:hover .tg, .mk.sel .tg, .mk:focus-visible .tg { display: inline; }
.mk.sel .d { box-shadow: 0 0 0 4px var(--tool-accent), 0 1px 4px rgba(0,0,0,.5); }
.mk:focus-visible .d { outline: 3px solid #FFF; outline-offset: 2px; }

/* page control bar */
.tour { flex: 0 0 auto; min-width: 176px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: stretch;

  padding: 6px 16px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.tour:hover { filter: brightness(1.1); }
.tour.invite { animation: invite 2.2s ease-out infinite; }
@keyframes invite { 0% { box-shadow: 0 0 0 0 rgba(60,163,174,.55); } 70% { box-shadow: 0 0 0 10px rgba(60,163,174,0); } 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } }
.stepper { display: flex; align-items: stretch; gap: 4px; align-self: stretch; min-width: 0; flex: 1 1 auto; }
.nb { width: 36px; padding: 0; font-size: 20px; line-height: 1; }
.stepinfo { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1 1 auto; padding: 4px 12px;
  background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.stepinfo b { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: #A6A499; font-weight: 700; white-space: nowrap; }
.stepinfo i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thru { align-self: stretch; }
.thru.on { background: rgba(60,163,174,0.16); border-color: var(--tool-accent); }
.act { align-self: stretch; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; font-size: 15px; font-weight: 700; white-space: nowrap;
  border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-body); color: var(--tool-accent); background: rgba(60,163,174,0.12); border: 1.5px solid var(--tool-accent); }
.act:hover { background: rgba(60,163,174,0.24); }
.act::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #E8B84A; box-shadow: 0 0 8px #E8B84A; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.k-eb { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); min-height: 28px; }
.k-eb .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.k-title { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.15; margin: 10px 0 6px; color: var(--color-text-primary); }
.k-t { font-size: 15px; line-height: 1.45; color: var(--color-text-primary); margin: 0 0 10px; }
.k-note { font-size: 14px; line-height: 1.45; color: var(--color-text-secondary); margin: 6px 0 8px; }

.k-back { align-self: flex-start; background: none; border: 0; color: var(--tool-accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; margin-top: 2px; font-family: var(--font-body); }
.k-back:hover { text-decoration: underline; }
.k-list { display: flex; flex-direction: column; gap: 1px; margin: 4px 0 4px; }
.k-it { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: 1px solid transparent; color: var(--color-text-secondary);
  font-size: 14.5px; text-align: left; padding: 4px 6px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-body); }
.k-it:hover { background: var(--color-surface-2); color: var(--color-text-primary); }

.k-it .bd { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #14181A; font-size: 12px; font-weight: 800;

.k-it .bd.li { background: #E8E4D9; border: 3px solid #14181A; width: 14px; height: 14px; margin: 0 4px; }

.k-it .ln.d { border-top-style: dashed; }
.k-it .q { width: 22px; height: 22px; border-radius: 50%; background: #2AA87E; color: #14181A; font-weight: 800; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.k-rows { margin: 4px 0 10px; }
.k-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--color-border); }
.k-row:first-child { border-top: 1px solid var(--color-border); }
.k-row .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: #A6A499; flex: none; }
.k-row .v { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--color-text-primary); text-align: right; }

function buildPalette(frames) {
