<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Climate Record Explorer | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-climate); --cc-card-width: 390px; }
[hidden] { display: none !important; }

/* Top bar */
.exp { display: flex; gap: 6px; }
.exp .cc-btn { padding: 8px 12px; font-size: 14px; font-weight: 700; }
.cc-btn.is-ok { border-color: #3A9E50; color: #5CC070; }
.cc-btn.is-error { border-color: #C05050; color: #E07070; }
.cc-segmented-btn { font-size: 14px; }

/* Station finder (same pattern as the frequency tools) */
.finder-group { position: relative; flex: 0 0 auto; display: flex; align-items: stretch; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color .15s; }
.finder-group:focus-within { border-color: var(--tool-accent); }
.finder-group .search-icon { display: flex; align-items: center; padding-left: 12px; color: var(--color-text-muted); font-size: 16px; pointer-events: none; }
.finder-group .search-input { width: 250px; background: transparent; border: none; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
.finder-group .search-input::placeholder { color: var(--color-text-muted); }
.finder-sep { width: 1px; align-self: stretch; margin: 7px 0; background: var(--color-border); }
.finder-group .locate-btn { border: none; border-radius: 0; background: transparent; white-space: nowrap; font-size: 14px; padding: 6px 12px; color: var(--color-text-primary); }
.locate-btn.loading { opacity: .5; pointer-events: none; }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 360px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 320px; overflow-y: auto; z-index: 300; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.dropdown.open { display: block; }
.d-item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); }
.d-item:last-child { border-bottom: none; }
.d-item:hover, .d-item.hi { background: rgba(208,132,37,.18); }
.d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 46px; flex-shrink: 0; }
.d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-item .d-por, .d-item .d-dist { color: var(--color-text-muted); font-size: 13px; }
.d-item .d-st { color: var(--color-text-muted); font-size: 13px; width: 22px; text-align: right; }

/* Query sentence */
.cc-scene-head { gap: 7px 7px; padding: 10px 12px 9px; }
.q-word { font-family: var(--font-display); font-size: 19px; color: var(--color-text-secondary); }
.q-tok { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1.1; color: var(--color-text-primary); background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-bottom: 2px solid var(--tool-accent); border-radius: var(--radius-md); padding: 5px 10px 4px; cursor: pointer; white-space: nowrap; }
.q-tok:hover, .q-tok.is-open { border-color: var(--tool-accent); background: rgba(208,132,37,.14); }
.q-tok::after { content: '\25BE'; font-size: 13px; margin-left: 7px; color: var(--tool-accent); }
.q-thr { display: inline-flex; align-items: stretch; border: 1px solid var(--color-border-hover); border-bottom: 2px solid var(--tool-accent); border-radius: var(--radius-md); background: var(--color-surface-2); overflow: hidden; }
.q-thr button { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-text-primary); background: transparent; border: none; border-right: 1px solid var(--color-border); padding: 2px 10px; cursor: pointer; }
.q-thr button:hover { background: rgba(208,132,37,.14); }
.q-thr input { width: 64px; font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-text-primary); background: transparent; border: none; outline: none; padding: 2px 4px 2px 10px; text-align: right; -moz-appearance: textfield; }
.q-thr input::-webkit-outer-spin-button, .q-thr input::-webkit-inner-spin-button { -webkit-appearance: none; }
.q-thr .u { font-family: var(--font-display); font-size: 19px; color: var(--color-text-secondary); align-self: center; padding: 0 10px 0 3px; }

/* Popover menus */
.pop { position: absolute; z-index: 400; min-width: 220px; max-width: 420px; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); box-shadow: 0 10px 28px rgba(0,0,0,.5); padding: 10px; }
.pop-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); margin: 8px 2px 6px; }
.pop-l:first-child { margin-top: 0; }
.pop-grid { display: grid; gap: 5px; grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); }
.pop-opt { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--color-text-primary); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 8px 10px; cursor: pointer; text-align: left; white-space: nowrap; }
.pop-opt:hover { border-color: var(--tool-accent); }
.pop-opt.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); font-weight: 600; }
.pop-opt:disabled { opacity: .35; cursor: not-allowed; }
.pop-opt.c { text-align: center; }
.pop-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.pop-row select, .pop-row input { font-family: var(--font-mono); font-size: 15px; color: var(--color-text-primary); background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 7px 8px; outline: none; }
.pop-row input { width: 84px; }
.pop-row span { font-size: 14px; color: var(--color-text-secondary); }
.pop-row .cc-btn { padding: 7px 12px; font-size: 14px; }

/* Stage */
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }
.tip { position: absolute; z-index: 50; pointer-events: none; background: rgba(30,35,32,.96); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 7px 10px; font-family: var(--font-mono); font-size: 13px; line-height: 1.45; color: var(--color-text-primary); white-space: nowrap; }
.tip b { font-family: var(--font-display); font-size: 17px; }
.tip .m { color: var(--color-text-muted); }
.state-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--color-surface); font-family: var(--font-mono); font-size: 15px; color: var(--color-text-secondary); text-align: center; padding: 20px; }
.state-overlay .cc-btn { font-size: 14px; }

/* Scene bar */
.bar-lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.bar-opts { display: flex; align-items: center; gap: 8px; }
.cc-scene-bar { flex-wrap: wrap; row-gap: 6px; }
.cc-scene-bar .cc-segmented { flex-shrink: 0; }
.cc-scene-bar .cc-segmented-btn { padding-left: 13px; padding-right: 13px; }
.tol-grp { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.bar-opts .cc-btn { font-size: 14px; padding: 7px 11px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); overflow: hidden; }
.stepper button { background: transparent; border: none; color: var(--color-text-primary); font-size: 17px; font-weight: 700; padding: 4px 11px; cursor: pointer; }
.stepper button:hover { background: rgba(208,132,37,.16); }
.stepper span { font-family: var(--font-mono); font-size: 15px; font-weight: 700; min-width: 34px; text-align: center; color: var(--color-text-primary); }
.legend { display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.legend canvas { width: 110px; height: 12px; border-radius: 2px; display: block; }

/* Card */
.stn-name { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.15; color: var(--color-text-primary); }
.stn-meta { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin: 2px 0 8px; }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 10px; }
.chip { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 6px 10px 6px; min-width: 0; }
.chip-l { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-muted); }
.chip-v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.chip-s { font-family: var(--font-mono); font-size: 12.5px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.sel { border-color: var(--tool-accent); display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 10px; }
.chip.sel .chip-v { grid-column: 2; grid-row: 1 / span 2; }
.chip.sel .chip-l { grid-column: 1; grid-row: 1; }
.chip.sel .chip-s { grid-column: 1; grid-row: 2; }
.tbl-wrap { flex: 1; min-height: 160px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-md); margin-top: 8px; }
table.tbl { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; }
.tbl th { position: sticky; top: 0; background: var(--color-surface-2); color: var(--color-text-primary); font-weight: 700; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; padding: 8px 8px; text-align: right; cursor: pointer; user-select: none; border-bottom: 1px solid var(--color-border-hover); white-space: nowrap; }
.tbl th:hover { color: var(--tool-accent); }
.tbl th.s::after { content: attr(data-arrow); margin-left: 4px; color: var(--tool-accent); }
.tbl td { padding: 5px 8px; text-align: right; color: var(--color-text-primary); border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.tbl th:nth-child(2), .tbl td:nth-child(2) { text-align: left; }
.tbl td.r { color: var(--color-text-muted); }
.tbl td.dt { color: var(--color-text-secondary); font-size: 13px; }
.tbl tr { cursor: pointer; }
.tbl tbody tr:hover td { background: rgba(232,228,217,.05); }
.tbl tr.sel td { background: rgba(208,132,37,.2); }
.tbl tr.out td { color: var(--color-text-muted); }
.tbl tr.out td:nth-child(3) { text-decoration: line-through; text-decoration-color: rgba(148,143,130,.6); }
.tbl tr.part td { font-style: italic; }
.cc-card-src { margin-top: 8px; padding-top: 0; font-size: 12.5px; }

@media (max-width: 1100px) {
  .finder-group .search-input { width: 160px; }
  .locate-btn .nm { display: none; }
  :root { --cc-card-width: 330px; }
}
@media (max-width: 760px) {
  .finder-group { flex: 1 1 100%; order: 3; }
  .finder-group .search-input { width: 100%; min-width: 0; }
  .exp { margin-left: auto; }
  .tbl-wrap { max-height: 420px; }
  .legend { margin-left: 0; }
  .cc-scene-bar .cc-segmented { flex: 1 1 100%; display: flex; }
  .cc-scene-bar .cc-segmented-btn { flex: 1; padding: 9px 2px; font-size: 12px; letter-spacing: .02em; }
}
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">

  <div class="cc-app-top">
    <h1 class="cc-app-title">Climate Record Explorer</h1>
    <div class="finder-group" id="sw">
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si" placeholder="Search city or station..." autocomplete="off" spellcheck="false">
      <div class="dropdown" id="dd"></div>
      <div class="finder-sep"></div>
      <button class="cc-btn locate-btn" id="locate-btn" title="Use my location to find the nearest station">&#128205;<span class="nm"> Near Me</span></button>
    </div>
    <div class="cc-app-spacer"></div>
    <div class="exp">
      <button class="cc-btn" id="csv-btn">&#x2193; CSV</button>
      <button class="cc-btn" id="copy-btn">&#x29C9; Copy</button>
      <button class="cc-btn" id="png-btn">&#x2193; PNG</button>
    </div>
  </div>

  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head" id="sentence">
        <button class="q-tok" id="tok-stat"></button>
        <button class="q-tok" id="tok-var"></button>
        <span class="q-thr" id="thr-grp" hidden>
          <button id="thr-op" title="Switch between at-or-above and at-or-below"></button>
          <input type="number" id="thr-val" step="any" aria-label="Threshold value">
          <span class="u" id="thr-unit"></span>
        </span>
        <span class="q-word">in</span>
        <button class="q-tok" id="tok-period"></button>
        <span class="q-word">across</span>
        <button class="q-tok" id="tok-years"></button>
      </div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="chart"></canvas>
        <div class="tip" id="tip" hidden></div>
        <div class="state-overlay" id="overlay">Loading station record…</div>
      </div>
      <div class="cc-scene-bar">
        <div class="cc-segmented" id="view-seg">
          <button class="cc-segmented-btn is-active" data-view="rank">Ranking</button>
          <button class="cc-segmented-btn" data-view="series">Time series</button>
          <button class="cc-segmented-btn" data-view="cal">Calendar</button>
          <button class="cc-segmented-btn" data-view="dist">Distribution</button>
        </div>
        <div class="cc-scene-bar-sep"></div>
        <div class="bar-opts" id="opts-rank">
          <button class="cc-btn" id="order-btn"></button>
        </div>
        <div class="bar-opts" id="opts-series" hidden>
          <button class="cc-btn is-active" id="avg-btn">10-yr average</button>
          <button class="cc-btn is-active" id="trend-btn">Trend</button>
        </div>
        <div class="legend" id="legend"><span id="leg-lo"></span><canvas id="leg-c" width="300" height="24"></canvas><span id="leg-hi"></span></div>
        <div class="tol-grp">
          <span class="bar-lbl" title="A period with more missing days than this is left out of ranks and statistics">Max missing days</span>
          <div class="stepper"><button id="tol-dn" aria-label="Fewer">&minus;</button><span id="tol-v"></span><button id="tol-up" aria-label="More">+</button></div>
        </div>
      </div>
    </div>

    <div class="cc-card">
      <div class="stn-name" id="stn-name">&nbsp;</div>
      <div class="stn-meta" id="stn-meta">&nbsp;</div>
      <div class="cc-card-eb">Summary<span id="sum-sub" style="margin-left:auto;font-weight:400;color:var(--color-text-muted);letter-spacing:.04em"></span></div>
      <div class="chips" id="chips"></div>
      <div class="cc-card-eb">All periods<span id="tbl-sub" style="margin-left:auto;font-weight:400;color:var(--color-text-muted);letter-spacing:.04em"></span></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th data-k="rank">#</th><th data-k="year">Period</th><th data-k="value">Value</th><th data-k="date" id="th-date">Date</th><th data-k="miss" title="Missing days in the period">Miss</th>
      </tr></thead><tbody id="tbody"></tbody></table></div>
      <div class="cc-card-src">Data: NOAA ACIS, ThreadEx station threads. Trace counts as zero. Struck-through periods exceed the missing-day allowance and are left out of ranks.</div>
    </div>
  </div>
</div>
<div class="pop" id="pop" hidden></div>

<script id="cx-engine">
/* ════════════════════════════════════════════════════════════════════
   CX — query engine. Pure functions over one station's daily record;
   no DOM access, so it can be tested on its own.
   ════════════════════════════════════════════════════════════════════ */
const CX = (() => {
  const DAY = 864e5;
  const ELEMS = ['maxt', 'mint', 'pcpn', 'snow', 'snwd'];
  const leap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  const mlen = (y, m) => [31, leap(y) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];

  function parse(json) {
    const rows = json.data;
    const utc = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
    const t0 = utc(rows[0][0]), n = Math.round((utc(rows[rows.length - 1][0]) - t0) / DAY) + 1;
    const rec = { t0, n, Y: new Int16Array(n), M: new Uint8Array(n), D: new Uint8Array(n), trace: {}, cache: {} };
    for (let i = 0; i < n; i++) { const d = new Date(t0 + i * DAY); rec.Y[i] = d.getUTCFullYear(); rec.M[i] = d.getUTCMonth() + 1; rec.D[i] = d.getUTCDate(); }
    ELEMS.forEach((e, k) => {
      const a = new Float32Array(n).fill(NaN), tr = new Uint8Array(n);
      for (const r of rows) {
        const i = Math.round((utc(r[0]) - t0) / DAY), s = r[k + 1];
        if (s === 'T') { a[i] = 0; tr[i] = 1; continue; }
        const x = parseFloat(s);            // 'M', 'S' -> NaN; '0.50A' -> 0.5
        if (!isNaN(x)) a[i] = x;
      }
      rec.cache[e] = a; rec.trace[e] = tr;
    });
    return rec;
  }

  // Derived daily series. Mean temperature and degree days follow the
  // NWS convention: the daily mean is rounded half-up before use in HDD/CDD.
  function series(rec, v) {
    if (rec.cache[v]) return rec.cache[v];
    const hi = rec.cache.maxt, lo = rec.cache.mint, a = new Float32Array(rec.n);
    for (let i = 0; i < rec.n; i++) {
      const h = hi[i], l = lo[i];
      if (isNaN(h) || isNaN(l)) { a[i] = NaN; continue; }
      const avg = (h + l) / 2, r = Math.floor(avg + 0.5);
      a[i] = v === 'avgt' ? avg : v === 'range' ? h - l : v === 'hdd' ? Math.max(0, 65 - r) : Math.max(0, r - 65);
    }
    return (rec.cache[v] = a);
  }

  const idx = (rec, y, m, d) => Math.round((Date.UTC(y, m - 1, d) - rec.t0) / DAY);

  /* q = { v, stat, op:'ge'|'le', thr, period:{sm,sd,em,ed}, y0, y1, tol }
     stat: max | min | mean | sum | cnt | first | last
     A period that runs past Dec 31 is labelled by the year it ends in. */
  function compute(rec, q) {
    const a = series(rec, q.v), P = q.period, n = rec.n;
    const wrap = P.sm * 100 + P.sd > P.em * 100 + P.ed;
    const oneDay = P.sm === P.em && P.sd === P.ed;
    const hit = q.op === 'ge' ? x => x >= q.thr : x => x <= q.thr;
    const out = [];
    const yA = Math.max(rec.Y[0], q.y0 || -1e9), yB = Math.min(rec.Y[n - 1] + (wrap ? 1 : 0), q.y1 || 1e9);
    for (let Y = yA; Y <= yB; Y++) {
      const ys = wrap ? Y - 1 : Y;
      if (oneDay && P.sm === 2 && P.sd === 29 && !leap(Y)) continue;
      const s = idx(rec, ys, P.sm, Math.min(P.sd, mlen(ys, P.sm))), e = idx(rec, Y, P.em, Math.min(P.ed, mlen(Y, P.em)));
      if (e < 0 || s >= n) continue;
      const partial = e > n - 1, s2 = Math.max(s, 0), e2 = Math.min(e, n - 1);
      let miss = s2 - s, nv = 0, sum = 0, mx = -Infinity, mn = Infinity, iMx = -1, iMn = -1, cnt = 0, iF = -1, iL = -1, ties = 0;
      for (let i = s2; i <= e2; i++) {
        const x = a[i];
        if (x !== x) { miss++; continue; }
        nv++; sum += x;
        if (x > mx) { mx = x; iMx = i; }
        if (x < mn) { mn = x; iMn = i; }
        if (hit(x)) { cnt++; if (iF < 0) iF = i; iL = i; }
      }
      let v = null, di = -1;
      if (nv) {
        if (q.stat === 'max') { v = mx; di = iMx; }
        else if (q.stat === 'min') { v = mn; di = iMn; }
        else if (q.stat === 'mean') v = sum / nv;
        else if (q.stat === 'sum') v = sum;
        else if (q.stat === 'cnt') v = cnt;
        else if (q.stat === 'first') { if (iF >= 0) { v = iF - s; di = iF; } }
        else if (q.stat === 'last') { if (iL >= 0) { v = iL - s; di = iL; } }
        if (q.stat === 'max' || q.stat === 'min') for (let i = s2; i <= e2; i++) if (a[i] === v) ties++;
      }
      const within = miss <= q.tol;
      out.push({ y: Y, label: wrap ? `${Y - 1}–${String(Y).slice(2)}` : String(Y), s, e, len: e - s + 1,
        v, di, ties, miss, partial, ok: within && !partial && v !== null, shown: within && v !== null });
    }
    return out;
  }

  // Competition ranking (1,1,3) over the periods that count; ties keep year order.
  function rank(rows, desc) {
    const r = rows.filter(o => o.ok).sort((p, q) => (desc ? q.v - p.v : p.v - q.v) || p.y - q.y);
    r.forEach((o, i) => { o.rank = i && r[i - 1].v === o.v ? r[i - 1].rank : i + 1; });
    return r;
  }

  function summary(rows) {
    const ok = rows.filter(o => o.ok), n = ok.length;
    if (!n) return { n: 0 };
    const vs = ok.map(o => o.v).sort((p, q) => p - q);
    const mean = vs.reduce((p, q) => p + q, 0) / n, median = n % 2 ? vs[(n - 1) / 2] : (vs[n / 2 - 1] + vs[n / 2]) / 2;
    const hi = ok.reduce((p, q) => (q.v > p.v ? q : p)), lo = ok.reduce((p, q) => (q.v < p.v ? q : p));
    const nrm = ok.filter(o => o.y >= 1991 && o.y <= 2020);
    const normal = nrm.length >= 25 ? nrm.reduce((p, q) => p + q.v, 0) / nrm.length : null;
    let slope = null, icpt = null;
    if (n >= 20) {
      const mx = ok.reduce((p, q) => p + q.y, 0) / n;
      let sxy = 0, sxx = 0;
      for (const o of ok) { sxy += (o.y - mx) * (o.v - mean); sxx += (o.y - mx) ** 2; }
      slope = sxy / sxx; icpt = mean - slope * mx;
    }
    return { n, mean, median, hi, lo, normal, slope, icpt };
  }

  return { parse, series, compute, rank, summary, idx, leap, mlen, DAY, ELEMS };
})();
</script>

<script>
/* ════════════════════════════════════════════════════════════════════
   Definitions
   ════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const STATS = {

const RAMPS = {
  temp:  { vals: [-60, -40, -20, -5, 25, 50, 75, 102, 113, 119, 130], cols: ['#2A0440', '#7C18C0', '#D42070', '#FFB3C6', '#A8D4F0', '#5DBF6A', '#FFE033', '#D41A1A', '#FF5555', '#FFFFFF', '#FFC0D0'] },
  pcpn:  { vals: [0, 0.01, 0.1, 0.25, 0.5, 1, 2, 4], cols: ['#2C322D', '#35504A', '#3E7C6A', '#4BA37A', '#8CCB6A', '#E6D94A', '#F08A3C', '#D43A3A'] },
  snow:  { vals: [0, 0.1, 1, 3, 6, 12, 24], cols: ['#2C322D', '#3D5670', '#5584B0', '#86B4DC', '#C4DDF2', '#FFFFFF', '#E9B8E8'] },
  hdd:   { vals: [0, 10, 25, 45, 70], cols: ['#2C322D', '#35557A', '#4F86BE', '#9CC4EA', '#F2F6FA'] },
  cdd:   { vals: [0, 5, 12, 20, 30], cols: ['#2C322D', '#7A5A2A', '#C98A2E', '#F0B040', '#FFE9A0'] },
  range: { vals: [0, 10, 20, 30, 45], cols: ['#2C322D', '#4A4470', '#7D6CB8', '#B9A6E6', '#F1EAFB'] },
  year:  { vals: [0, 0.5, 1], cols: ['#4E6272', '#9A8A6A', '#F0A93B'] },
};
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
Object.values(RAMPS).forEach(r => { r.rgb = r.cols.map(hex); });
function ramp(name, x) {
  const r = RAMPS[name], v = r.vals;
  if (x <= v[0]) return `rgb(${r.rgb[0]})`;
  for (let i = 1; i < v.length; i++) if (x <= v[i]) {
    const t = (x - v[i - 1]) / (v[i] - v[i - 1]), a = r.rgb[i - 1], b = r.rgb[i];
    return `rgb(${Math.round(a[0] + (b[0] - a[0]) * t)},${Math.round(a[1] + (b[1] - a[1]) * t)},${Math.round(a[2] + (b[2] - a[2]) * t)})`;
  }
  return `rgb(${r.rgb[r.rgb.length - 1]})`;
}

const PERIODS = {
  year:   { label: 'the calendar year', sm: 1, sd: 1, em: 12, ed: 31 },
  water:  { label: 'the water year (Oct–Sep)', sm: 10, sd: 1, em: 9, ed: 30 },
  snowyr: { label: 'the snow season (Jul–Jun)', sm: 7, sd: 1, em: 6, ed: 30 },
  djf:    { label: 'winter (Dec–Feb)', sm: 12, sd: 1, em: 2, ed: 29 },
  mam:    { label: 'spring (Mar–May)', sm: 3, sd: 1, em: 5, ed: 31 },
  jja:    { label: 'summer (Jun–Aug)', sm: 6, sd: 1, em: 8, ed: 31 },
  son:    { label: 'fall (Sep–Nov)', sm: 9, sd: 1, em: 11, ed: 30 },
};
const MDAYS = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

/* ════════════════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════════════════ */
const S = { sid: 'ISP', v: 'maxt', stat: 'cnt', op: 'ge', thr: 90, pkey: 'year', period: { ...PERIODS.year }, plabel: PERIODS.year.label,
  y0: null, y1: null, tol: null, view: 'rank', desc: true, showAvg: true, showTrend: true, sel: null, sortK: 'rank', sortDir: 1 };
let REC = null, STN = null, M = null;   // record, roster row, computed model
const STATIONS = THREADEX_ROSTER.map(r => ({ id: r[0], name: r[1], st: r[2], lat: r[3], lon: r[4], y0: r[5] }));
const byId = Object.fromEntries(STATIONS.map(s => [s.id, s]));

const periodLen = () => { const P = S.period, a = Date.UTC(2001, P.sm - 1, P.sd), b = Date.UTC(P.sm * 100 + P.sd > P.em * 100 + P.ed ? 2002 : 2001, P.em - 1, Math.min(P.ed, P.em === 2 ? 28 : 31)); return Math.round((b - a) / CX.DAY) + 1; };
const autoTol = () => { const L = periodLen(); return L <= 1 ? 0 : Math.round(L / 31); };
const tol = () => (S.tol == null ? autoTol() : S.tol);

/* ════════════════════════════════════════════════════════════════════
   Formatting
   ════════════════════════════════════════════════════════════════════ */
const isDate = () => !!STATS[S.stat].date;
function dateOfOffset(off) {            // offset from period start -> "Oct 14"
  const P = S.period, d = new Date(Date.UTC(2001, P.sm - 1, P.sd) + Math.round(off) * CX.DAY);
  return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`;
}
const dateOfIdx = (i, withYear) => `${MON[REC.M[i] - 1]} ${REC.D[i]}${withYear ? ', ' + REC.Y[i] : ''}`;
function decimals(avg) {
  const V = VARS[S.v];
  if (S.stat === 'cnt') return avg ? 1 : 0;
  if (S.stat === 'mean') return Math.max(1, V.dec);

}

  if (v == null || isNaN(v)) return '—';
  if (isDate()) return dateOfOffset(v);

}

  if (v == null || isNaN(v)) return '—';
  const u = unit();
  return fmt(v, avg) + (u === '°F' ? '°' : u ? ' ' + u : '');
}
function thrText() { const V = VARS[S.v]; return `${S.op === 'ge' ? '≥' : '≤'} ${S.thr}${V.unit === '°F' ? '°F' : ' ' + V.unit}`; }
function yearsText() {
  if (!REC) return 'all years';
  const a = S.y0 || REC.Y[0], b = S.y1 || REC.Y[REC.n - 1];
  return S.y0 || S.y1 ? `${a}–${b}` : 'all years';
}
function sentenceText() {
  const st = STATS[S.stat];
  return `${st.label} ${st.thr ? VARS[S.v].label.toLowerCase() + ' ' + thrText() : VARS[S.v].label.toLowerCase()} in ${S.plabel}`;
}

/* ════════════════════════════════════════════════════════════════════
   Data — one request for the whole daily record, cached for the day
   ════════════════════════════════════════════════════════════════════ */
const ACIS_URL = 'https://data.rcc-acis.org/StnData';
const memCache = new Map();
function idb() {
  return new Promise(res => { try { const r = indexedDB.open('cc-climate-explorer', 1); r.onupgradeneeded = () => r.result.createObjectStore('rec'); r.onsuccess = () => res(r.result); r.onerror = r.onblocked = () => res(null); } catch (e) { res(null); } });
}
async function idbGet(k) { const db = await idb(); if (!db) return null; return new Promise(res => { try { const r = db.transaction('rec').objectStore('rec').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); } }); }
async function idbPut(k, v) { const db = await idb(); if (!db) return; try { db.transaction('rec', 'readwrite').objectStore('rec').put(v, k); } catch (e) {} }
const todayKey = () => new Date().toISOString().slice(0, 10);

async function fetchRecord(sid) {
  if (memCache.has(sid)) return memCache.get(sid);
  const c = await idbGet(sid);
  let json = c && c.day === todayKey() ? c.json : null;
  if (!json) {
    let err;
    for (let k = 0; k < 4 && !json; k++) {
      if (k) await new Promise(r => setTimeout(r, 600 * 2 ** k));
      try {
        const res = await fetch(ACIS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sid: sid + 'thr', sdate: 'por', edate: 'por', elems: CX.ELEMS.map(name => ({ name })), meta: ['name', 'state', 'valid_daterange'] }) });
        if (!res.ok) { err = new Error('ACIS HTTP ' + res.status); if (res.status < 500 && res.status !== 429 && res.status !== 408) break; continue; }
        const j = await res.json();
        if (!j.data || !j.data.length) { err = new Error(j.error || 'No data for this station'); break; }
        json = j;
      } catch (e) { err = e; }
    }
    if (!json) throw err || new Error('Request failed');
    idbPut(sid, { day: todayKey(), json });
  }
  const rec = CX.parse(json);
  rec.meta = json.meta || {};
  memCache.set(sid, rec);
  return rec;
}

async function selectStation(id) {
  const s = byId[id]; if (!s) return;
  S.sid = id; STN = s; S.sel = null;
  try { localStorage.setItem('cc-explorer-stn', id); } catch (e) {}
  $('stn-name').textContent = `${s.name}, ${s.st}`;
  $('stn-meta').textContent = ' ';
  const ov = $('overlay'); ov.hidden = false; ov.textContent = 'Loading station record…';
  try {
    const rec = await fetchRecord(id);
    if (S.sid !== id) return;
    REC = rec;
    if (S.y0 && S.y0 < REC.Y[0]) S.y0 = null;
    $('stn-meta').textContent = `Record ${dateOfIdx(0, true)} – ${dateOfIdx(REC.n - 1, true)}`;
    ov.hidden = true;
    update();
  } catch (e) {
    if (S.sid !== id) return;
    REC = null;
    ov.innerHTML = `<div>Could not load this station (${esc(e.message || e)})</div><button class="cc-btn" id="retry-btn">Retry</button>`;
    $('retry-btn').onclick = () => selectStation(id);

}

/* ════════════════════════════════════════════════════════════════════
   Model + rendering of the non-canvas parts
   ════════════════════════════════════════════════════════════════════ */
function update() {
  renderSentence();
  if (!REC) return;
  const rows = CX.compute(REC, { v: S.v, stat: S.stat, op: S.op, thr: S.thr, period: S.period, y0: S.y0, y1: S.y1, tol: tol() });
  const ranked = CX.rank(rows, S.desc);
  M = { rows, ranked, sum: CX.summary(rows), partial: rows.find(o => o.partial && o.shown) || null };
  if (S.sel != null && !rows.some(o => o.y === S.sel)) S.sel = null;
  if (S.view === 'cal' && periodLen() <= 1) setView('series', true);
  $('view-seg').querySelector('[data-view=cal]').disabled = periodLen() <= 1;
  renderBar(); renderChips(); renderTable(); draw();
}

function renderSentence() {
  const st = STATS[S.stat];
  $('tok-stat').textContent = st.label;
  $('tok-var').textContent = VARS[S.v].label.toLowerCase();
  $('thr-grp').hidden = !st.thr;
  $('thr-op').textContent = S.op === 'ge' ? '≥' : '≤';
  if (document.activeElement !== $('thr-val')) $('thr-val').value = S.thr;
  $('thr-unit').textContent = VARS[S.v].unit;
  $('tok-period').textContent = S.plabel;
  $('tok-years').textContent = yearsText();
}

function renderBar() {
  $('opts-rank').hidden = S.view !== 'rank';
  $('opts-series').hidden = S.view !== 'series';
  const hiWord = isDate() ? 'Latest' : 'Highest', loWord = isDate() ? 'Earliest' : 'Lowest';

  $('avg-btn').classList.toggle('is-active', S.showAvg);
  $('trend-btn').classList.toggle('is-active', S.showTrend);

  lg.hidden = !showLg;

    let lo = r.vals[0], hi = r.vals[r.vals.length - 1];
    if (name === 'temp') { lo = -20; hi = 110; }
    for (let x = 0; x < 300; x++) { c.fillStyle = ramp(name, lo + (hi - lo) * x / 299); c.fillRect(x, 0, 1, 24); }
    const u = VARS[S.v].unit === '°F' ? '°' : ' ' + VARS[S.v].unit;
    $('leg-lo').textContent = S.view === 'rank' ? M.rows[0].label : lo + u;
    $('leg-hi').textContent = S.view === 'rank' ? M.rows[M.rows.length - 1].label : hi + u + '+';
  }
}

function renderChips() {
  const s = M.sum, chips = [];
  const chip = (l, v, sub, cls) => `<div class="chip ${cls || ''}"><div class="chip-l">${l}</div><div class="chip-v">${v}</div><div class="chip-s">${sub || '&nbsp;'}</div></div>`;
  $('sum-sub').textContent = s.n ? `${s.n} periods` : '';

  const when = o => (o.di >= 0 && !isDate() ? dateOfIdx(o.di, true) : o.label);
  const hiL = isDate() ? 'Latest' : 'Highest', loL = isDate() ? 'Earliest' : 'Lowest';
  chips.push(chip(hiL, fmtU(s.hi.v), when(s.hi)), chip(loL, fmtU(s.lo.v), when(s.lo)));
  chips.push(chip('Average', fmtU(s.mean, true), s.normal != null ? `1991–2020: ${fmt(s.normal, true)}` : `Median ${fmtU(s.median, true)}`));
  if (s.slope != null) {
    const d = s.slope * 10, dd = isDate() ? `${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(1)} days` : `${d >= 0 ? '+' : '−'}${Math.abs(d).toFixed(Math.max(1, decimals(true)))}${unit() === '°F' ? '°' : S.stat === 'cnt' ? ' days' : ''}`;
    chips.push(chip('Trend', dd, 'per decade, linear'));
  } else chips.push(chip('Median', fmtU(s.median, true), ''));
  const sel = S.sel != null ? M.rows.find(o => o.y === S.sel) : M.partial;
  if (sel) {
    const rk = sel.ok ? `Rank ${sel.rank} of ${M.ranked.length}` : sel.partial ? `Would rank ${wouldRank(sel.v)} of ${M.ranked.length + 1}` : `${sel.miss} missing days`;
    chips.push(`<div class="chip sel" style="grid-column:1/-1"><div class="chip-l">${esc(sel.label)}${sel.partial ? ' so far' : ''}</div><div class="chip-v">${fmtU(sel.v)}</div><div class="chip-s">${rk}${sel.di >= 0 && !isDate() ? ' · ' + dateOfIdx(sel.di) + (sel.ties > 1 ? ` (+${sel.ties - 1} more)` : '') : ''}</div></div>`);

}
function wouldRank(v) { return 1 + M.ranked.filter(o => (S.desc ? o.v > v : o.v < v)).length; }

function sortedRows() {
  const k = S.sortK, d = S.sortDir, rows = M.rows.slice();
  const val = o => (k === 'rank' ? (o.ok ? o.rank : 1e6 + (o.partial ? 0 : 1)) : k === 'year' ? o.y : k === 'value' ? (o.v == null ? -Infinity : o.v) : k === 'date' ? (o.di < 0 ? 1e9 : (REC.M[o.di] * 100 + REC.D[o.di])) : o.miss);
  return rows.sort((p, q) => d * (val(p) - val(q)) || (k === 'rank' ? p.y - q.y : q.y - p.y));
}
function renderTable() {
  const showDate = S.stat === 'max' || S.stat === 'min';
  $('th-date').hidden = !showDate;
  document.querySelectorAll('.tbl th').forEach(th => { th.classList.toggle('s', th.dataset.k === S.sortK); th.dataset.arrow = S.sortDir > 0 ? '▴' : '▾'; });
  $('tbl-sub').textContent = `${M.rows.length} rows`;
  $('tbody').innerHTML = sortedRows().map(o => `<tr data-y="${o.y}" class="${o.y === S.sel ? 'sel ' : ''}${o.partial ? 'part ' : o.ok ? '' : 'out'}">` +
    `<td class="r">${o.ok ? o.rank : o.partial ? '•' : ''}</td><td>${o.label}${o.partial ? ' so far' : ''}</td><td>${o.v == null ? (STATS[S.stat].thr ? 'none' : '—') : fmt(o.v)}</td>` +
    (showDate ? `<td class="dt">${o.di >= 0 ? dateOfIdx(o.di) + (o.ties > 1 ? ' +' + (o.ties - 1) : '') : ''}</td>` : '') + `<td class="r">${o.miss || ''}</td></tr>`).join('');

/* ════════════════════════════════════════════════════════════════════
   Canvas charts. Every view draws into (ctx, x, y, w, h) so the PNG

   ════════════════════════════════════════════════════════════════════ */
function niceStep(span, target) {

}

function drawRank(c, x, y, w, h, hits) {
  const R = M.ranked;
  if (!R.length) return emptyMsg(c, x, y, w, h, 'No complete periods for this query');
  const padT = 26, padB = M.partial ? 24 : 8, rowH = Math.max(22, Math.min(34, (h - padT - padB) / Math.min(R.length, 25)));
  const nRows = Math.min(R.length, Math.floor((h - padT - padB) / rowH)), rows = R.slice(0, nRows);
  const showDate = S.stat === 'max' || S.stat === 'min';
  c.font = `700 15px ${F.mono}`;
  const labW = Math.max(...rows.map(o => c.measureText(o.label).width)) + 46, valW = (showDate ? 150 : 80);
  const x0 = x + labW + 10, x1 = x + w - valW - 12;
  const zero = fromZero(), ax = axisRange(R.map(o => o.v).concat(M.partial ? [M.partial.v] : []), zero);
  const X = v => x0 + (v - ax.lo) / (ax.hi - ax.lo) * (x1 - x0);
  // grid
  c.font = `13px ${F.mono}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  for (let v = ax.lo; v <= ax.hi + 1e-9; v += ax.step) {
    c.strokeStyle = C.grid; c.lineWidth = 1; c.beginPath(); c.moveTo(Math.round(X(v)) + .5, y + padT - 4); c.lineTo(Math.round(X(v)) + .5, y + padT + nRows * rowH); c.stroke();
    c.fillStyle = C.muted; c.fillText(tickLabel(v, ax.step), X(v), y + 14);
  }
  rows.forEach((o, i) => {
    const cy = y + padT + i * rowH + rowH / 2, sel = o.y === S.sel, col = yearColor(o.y);
    if (sel) { c.fillStyle = 'rgba(208,132,37,.16)'; c.fillRect(x, cy - rowH / 2, w, rowH); }
    c.textBaseline = 'middle'; c.textAlign = 'right';
    c.font = `13px ${F.mono}`; c.fillStyle = C.muted; c.fillText(o.rank, x + 30, cy);
    c.font = `700 15px ${F.mono}`; c.fillStyle = C.text; c.fillText(o.label, x + labW, cy);
    const bx = X(o.v), bh = Math.min(rowH - 8, 20);

    const vt = fmtU(o.v); c.fillText(vt, x1 + 12, cy);

    c.font = `700 13px ${F.mono}`; c.fillStyle = C.text; const t = `${M.partial.label} so far`, tw = c.measureText(t).width;
    c.textAlign = px + tw + 8 > x1 ? 'right' : 'left'; c.textBaseline = 'alphabetic';

}

function drawSeries(c, x, y, w, h, hits) {
  const rows = M.rows.filter(o => o.shown), ok = M.ranked;
  if (!rows.length) return emptyMsg(c, x, y, w, h, 'No periods to plot for this query');
  const padL = isDate() ? 62 : 52, padR = 16, padT = 14, padB = 30, zero = fromZero();
  const ax = axisRange(rows.map(o => o.v), zero), yA = M.rows[0].y, yB = M.rows[M.rows.length - 1].y;
  const x0 = x + padL, x1 = x + w - padR, y0 = y + h - padB, y1 = y + padT, slot = (x1 - x0) / (yB - yA + 1);
  const X = yr => x0 + (yr - yA + .5) * slot, Y = v => y0 - (v - ax.lo) / (ax.hi - ax.lo) * (y0 - y1);
  c.font = `13px ${F.mono}`; c.textBaseline = 'middle'; c.textAlign = 'right';
  for (let v = ax.lo; v <= ax.hi + 1e-9; v += ax.step) {
    c.strokeStyle = C.grid; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, Math.round(Y(v)) + .5); c.lineTo(x1, Math.round(Y(v)) + .5); c.stroke();
    c.fillStyle = C.muted; c.fillText(tickLabel(v, ax.step), x0 - 8, Y(v));
  }
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  const ys = niceStep(yB - yA, Math.max(3, w / 90)) < 1 ? 1 : Math.max(1, Math.round(niceStep(yB - yA, Math.max(3, w / 90))));
  for (let yr = Math.ceil(yA / ys) * ys; yr <= yB; yr += ys) { c.fillStyle = C.muted; c.fillText(yr, X(yr), y0 + 20); c.strokeStyle = C.border; c.beginPath(); c.moveTo(Math.round(X(yr)) + .5, y0); c.lineTo(Math.round(X(yr)) + .5, y0 + 5); c.stroke(); }

  if (s.normal != null) {
    const ny = Math.round(Y(s.normal)) + .5;
    c.strokeStyle = 'rgba(232,228,217,.45)'; c.lineWidth = 1; c.setLineDash([2, 4]); c.beginPath(); c.moveTo(X(1991) - slot / 2, ny); c.lineTo(X(2020) + slot / 2, ny); c.stroke(); c.setLineDash([]);
    c.font = `12px ${F.mono}`; const nt = `1991–2020 avg ${fmt(s.normal, true)}`, nw = c.measureText(nt).width, nx = X(2020) + slot / 2;
    c.fillStyle = 'rgba(38,43,39,.82)'; c.fillRect(nx - nw - 6, ny - 19, nw + 8, 16); c.fillStyle = C.text; c.textAlign = 'right'; c.fillText(nt, nx - 2, ny - 7);
  }

  for (const o of rows) {
    const cx = X(o.y), cy = Y(o.v), sel = o.y === S.sel, col = sel ? C.text : C.accent;
    if (zero) {
      if (o.partial) { c.strokeStyle = col; c.lineWidth = 1.5; c.strokeRect(cx - bw / 2 + .75, cy, Math.max(.5, bw - 1.5), y0 - cy); }
      else { c.fillStyle = col; c.globalAlpha = sel ? 1 : .88; c.fillRect(cx - bw / 2, cy, bw, y0 - cy); c.globalAlpha = 1; }
    } else {

  }

    c.strokeStyle = C.text; c.lineWidth = 2.5; c.lineJoin = 'round'; c.beginPath(); let pen = false;

}

function drawCal(c, x, y, w, h, hits) {
  const rows = M.rows, a = CX.series(REC, S.v), name = VARS[S.v].ramp, L = Math.max(...rows.map(o => o.len));
  const padL = 62, padR = 10, padT = 22, padB = 6, x0 = x + padL, y0 = y + padT;
  const cw = (x + w - padR - x0) / L, ch = Math.min(22, (y + h - padB - y0) / rows.length);
  const st = STATS[S.stat], hit = st.thr ? (S.op === 'ge' ? v => v >= S.thr : v => v <= S.thr) : null;
  c.font = `13px ${F.mono}`; c.textBaseline = 'alphabetic'; c.textAlign = 'left'; c.fillStyle = C.muted;
  // month ticks from a non-leap reference period

  for (let d = 0; d < L; d++) { const dt = new Date(t0 + d * CX.DAY); if (dt.getUTCDate() === 1 || d === 0) { if (d && cw * (L - d) < 30) continue; if (d === 0 && dt.getUTCDate() > 20) continue; c.fillText(L > 45 ? (cw * 30 < 34 ? MON[dt.getUTCMonth()][0] : MON[dt.getUTCMonth()]) : `${MON[dt.getUTCMonth()]} ${dt.getUTCDate()}`, x0 + d * cw + 2, y + 14); c.fillRect(Math.round(x0 + d * cw), y + 17, 1, 4); } }

function drawDist(c, x, y, w, h, hits) {
  const ok = M.ranked;
  if (ok.length < 2) return emptyMsg(c, x, y, w, h, 'Not enough complete periods for a distribution');
  const vs = ok.map(o => o.v), lo = Math.min(...vs), hi = Math.max(...vs);
  let step = niceStep((hi - lo) || 1, Math.min(24, Math.max(8, Math.sqrt(ok.length) * 2)));
  if (VARS[S.v].dec === 0 && S.stat !== 'mean' || S.stat === 'cnt' || isDate()) step = Math.max(1, Math.round(step));
  const b0 = Math.floor(lo / step) * step, nb = Math.max(1, Math.floor((hi - b0) / step) + 1), bins = Array.from({ length: nb }, () => []);
  ok.forEach(o => bins[Math.min(nb - 1, Math.floor((o.v - b0) / step + 1e-9))].push(o));
  const maxN = Math.max(...bins.map(b => b.length)), ystep = Math.max(1, Math.round(niceStep(maxN, 5)));
  const padL = 46, padR = 16, padT = 30, padB = 34, x0 = x + padL, x1 = x + w - padR, y0 = y + h - padB, y1 = y + padT, bw = (x1 - x0) / nb;
  const ctr = step === 1 && (S.stat === 'cnt' || isDate() || (VARS[S.v].dec === 0 && S.stat !== 'mean')) ? .5 : 0;
  const Yc = n => y0 - n / (Math.ceil(maxN / ystep) * ystep) * (y0 - y1), Xv = v => x0 + ((v - b0) / step + ctr) * bw;
  c.font = `13px ${F.mono}`; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let n = 0; n <= maxN + ystep - 1; n += ystep) { c.strokeStyle = C.grid; c.beginPath(); c.moveTo(x0, Math.round(Yc(n)) + .5); c.lineTo(x1, Math.round(Yc(n)) + .5); c.stroke(); c.fillStyle = C.muted; c.fillText(n, x0 - 8, Yc(n)); }
  c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  const every = Math.max(1, Math.ceil(nb * (isDate() ? 62 : 48) / (x1 - x0)));
  bins.forEach((b, i) => {
    const bx = x0 + i * bw, by = Yc(b.length), has = b.some(o => o.y === S.sel);
    c.fillStyle = has ? C.text : C.accent; c.globalAlpha = has ? 1 : .88; if (b.length) c.fillRect(bx + 1, by, Math.max(1, bw - 2), y0 - by); c.globalAlpha = 1;
    if (i % every === 0) { c.fillStyle = C.muted; c.fillText(tickLabel(b0 + i * step, step), bx + ctr * bw, y0 + 20); }
    if (hits) hits.push({ x: bx, y: y1, w: bw, h: y0 - y1, bin: b, lo: b0 + i * step, hi: b0 + (i + 1) * step });

  const sel = S.sel != null ? M.rows.find(o => o.y === S.sel) : M.partial, hasSel = sel && sel.v != null, selLeft = hasSel && sel.v < M.sum.median;
  mark(M.sum.median, `Median ${fmtU(M.sum.median, true)}`, C.text2, [2, 4], 0, hasSel ? (selLeft ? 'left' : 'right') : null);
  if (hasSel) mark(sel.v, `${sel.label}${sel.partial ? ' so far' : ''} ${fmtU(sel.v)}`, C.text, sel.partial ? [5, 4] : [], 0, selLeft ? 'right' : 'left');
  c.strokeStyle = 'rgba(232,228,217,.3)'; c.setLineDash([]); c.lineWidth = 1; c.beginPath(); c.moveTo(x0, y0 + .5); c.lineTo(x1, y0 + .5); c.stroke();
  c.font = `12px ${F.mono}`; c.fillStyle = C.muted; c.textAlign = 'left'; c.save(); c.translate(x + 13, (y0 + y1) / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center'; c.fillText('periods', 0, 0); c.restore();
}

const VIEWS = { rank: drawRank, series: drawSeries, cal: drawCal, dist: drawDist };
let HITS = [];
function draw() {
  const cv = $('chart'), st = $('stage'), dpr = window.devicePixelRatio || 1, w = st.clientWidth, h = st.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
  HITS = [];
  if (REC && M) VIEWS[S.view](c, 12, 10, w - 24, h - 18, HITS);
}

/* ════════════════════════════════════════════════════════════════════
   Hover + selection
   ════════════════════════════════════════════════════════════════════ */
function hitAt(ev) {
  const r = $('chart').getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  return { h: HITS.find(k => mx >= k.x && mx < k.x + k.w && my >= k.y && my < k.y + k.h), mx, my };
}
$('chart').addEventListener('mousemove', ev => {
  const { h, mx, my } = hitAt(ev), tip = $('tip');
  if (!h) { tip.hidden = true; $('chart').style.cursor = 'default'; return; }
  let html;
  if (h.bin) html = `<b>${h.bin.length}</b> period${h.bin.length === 1 ? '' : 's'}<br><span class="m">${tickLabel(h.lo, 0.01)} to ${tickLabel(h.hi, 0.01)}${unit() && !isDate() ? ' ' + unit() : ''}</span>` + (h.bin.length && h.bin.length <= 8 ? '<br>' + h.bin.map(o => o.label).join(', ') : '');
  else if (h.cal) {
    const i = h.o.s + Math.floor((mx - h.cal.x0) / h.cal.cw), a = CX.series(REC, S.v);
    if (i < 0 || i >= REC.n || i > h.o.e) { tip.hidden = true; return; }
    const v = a[i], V = VARS[S.v], tr = REC.trace[S.v] && REC.trace[S.v][i];
    html = `<span class="m">${dateOfIdx(i, true)}</span><br><b>${v !== v ? 'missing' : tr ? 'trace' : v.toFixed(V.dec) + (V.unit === '°F' ? '°' : ' ' + V.unit)}</b>`;
  } else {
    const o = h.o;
    html = `<span class="m">${o.label}${o.partial ? ' so far' : ''}</span><br><b>${fmtU(o.v)}</b>` + (o.ok ? `<br>Rank ${o.rank} of ${M.ranked.length}` : '') +
      (o.di >= 0 && !isDate() ? `<br><span class="m">${dateOfIdx(o.di, true)}${o.ties > 1 ? ` +${o.ties - 1} more` : ''}</span>` : '') + (o.miss ? `<br><span class="m">${o.miss} missing day${o.miss === 1 ? '' : 's'}</span>` : '');
  }
  tip.innerHTML = html; tip.hidden = false; $('chart').style.cursor = h.bin ? 'default' : 'pointer';
  const sw = $('stage').clientWidth, sh = $('stage').clientHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(4, Math.min(sw - tw - 4, mx + 14)) + 'px'; tip.style.top = Math.max(4, Math.min(sh - th - 4, my + 14)) + 'px';
});
$('chart').addEventListener('mouseleave', () => { $('tip').hidden = true; });
$('chart').addEventListener('click', ev => { const { h } = hitAt(ev); if (h && h.o) select(h.o.y, true); });
function select(y, scroll) {
  S.sel = S.sel === y ? null : y;
  renderChips(); renderTable(); draw();
  if (scroll && S.sel != null) { const tr = $('tbody').querySelector(`tr[data-y="${y}"]`); if (tr) tr.scrollIntoView({ block: 'nearest' }); }
}
$('tbody').addEventListener('click', ev => { const tr = ev.target.closest('tr'); if (tr) select(+tr.dataset.y, false); });
document.querySelectorAll('.tbl th').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  if (S.sortK === k) S.sortDir *= -1; else { S.sortK = k; S.sortDir = k === 'rank' || k === 'date' ? 1 : -1; }
  renderTable();
}));

/* ════════════════════════════════════════════════════════════════════
   Controls
   ════════════════════════════════════════════════════════════════════ */
function setView(v, quiet) {
  S.view = v;
  $('view-seg').querySelectorAll('button').forEach(b => b.classList.toggle('is-active', b.dataset.view === v));
  if (!quiet) { renderBar(); draw(); }
}
$('view-seg').addEventListener('click', ev => { const b = ev.target.closest('button'); if (b && !b.disabled) setView(b.dataset.view); });
$('order-btn').onclick = () => { S.desc = !S.desc; update(); };
$('avg-btn').onclick = () => { S.showAvg = !S.showAvg; renderBar(); draw(); };
$('trend-btn').onclick = () => { S.showTrend = !S.showTrend; renderBar(); draw(); };
$('tol-dn').onclick = () => { S.tol = Math.max(0, tol() - 1); update(); };
$('tol-up').onclick = () => { S.tol = Math.min(366, tol() + 1); update(); };
$('thr-op').onclick = () => { S.op = S.op === 'ge' ? 'le' : 'ge'; update(); };
$('thr-val').addEventListener('input', () => { const x = parseFloat($('thr-val').value); if (!isNaN(x)) { S.thr = x; update(); } });

function setStat(k) {
  S.stat = k; S.desc = STATS[k].desc;
  if (k === 'sum' && !VARS[S.v].sum) S.stat = 'mean';
  S.sortK = 'rank'; S.sortDir = 1;
}
function setVar(k) {
  S.v = k; S.thr = VARS[k].thr; S.op = VARS[k].op;
  if (S.stat === 'sum' && !VARS[k].sum) setStat('mean');
}
function setPeriod(key, p, label) { S.pkey = key; S.period = { sm: p.sm, sd: p.sd, em: p.em, ed: p.ed }; S.plabel = label; S.tol = null; }

let popFor = null;
function closePop() { $('pop').hidden = true; if (popFor) popFor.classList.remove('is-open'); popFor = null; }
function openPop(tok, html, wire) {
  if (popFor === tok) return closePop();
  closePop(); popFor = tok; tok.classList.add('is-open');
  const pop = $('pop'); pop.innerHTML = html; pop.hidden = false;
  const r = tok.getBoundingClientRect(), pw = pop.offsetWidth;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left)) + window.scrollX + 'px';
  pop.style.top = r.bottom + 6 + window.scrollY + 'px';
  wire(pop);
}
document.addEventListener('mousedown', ev => { if (popFor && !$('pop').contains(ev.target) && !ev.target.closest('.q-tok')) closePop(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closePop(); });
const opt = (k, label, active, extra) => `<button class="pop-opt ${active ? 'is-active' : ''} ${extra || ''}" data-k="${k}">${label}</button>`;

$('tok-stat').onclick = () => openPop($('tok-stat'),
  `<div class="pop-grid">${Object.entries(STATS).map(([k, s]) => `<button class="pop-opt ${S.stat === k ? 'is-active' : ''}" data-k="${k}" ${k === 'sum' && !VARS[S.v].sum ? 'disabled' : ''}>${s.label}${s.thr ? ' …' : ''}</button>`).join('')}</div>`,
  pop => pop.querySelectorAll('.pop-opt').forEach(b => b.onclick = () => { setStat(b.dataset.k); closePop(); update(); }));

$('tok-var').onclick = () => openPop($('tok-var'),
  `<div class="pop-grid">${Object.entries(VARS).map(([k, v]) => opt(k, v.label, S.v === k)).join('')}</div>`,
  pop => pop.querySelectorAll('.pop-opt').forEach(b => b.onclick = () => { setVar(b.dataset.k); closePop(); update(); }));

const monSel = (id, m) => `<select id="${id}">${MON.map((n, i) => `<option value="${i + 1}" ${i + 1 === m ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
const daySel = (id, d) => `<select id="${id}">${Array.from({ length: 31 }, (_, i) => `<option ${i + 1 === d ? 'selected' : ''}>${i + 1}</option>`).join('')}</select>`;
$('tok-period').onclick = () => {
  const P = S.period;
  openPop($('tok-period'),
    `<div class="pop-l">Year</div><div class="pop-grid" style="--cols:3">${['year', 'water', 'snowyr'].map(k => opt(k, ({ year: 'Calendar', water: 'Water (Oct–Sep)', snowyr: 'Snow (Jul–Jun)' })[k], S.pkey === k, 'c')).join('')}</div>` +
    `<div class="pop-l">Season</div><div class="pop-grid" style="--cols:4">${['djf', 'mam', 'jja', 'son'].map(k => opt(k, ({ djf: 'Winter', mam: 'Spring', jja: 'Summer', son: 'Fall' })[k], S.pkey === k, 'c')).join('')}</div>` +
    `<div class="pop-l">Month</div><div class="pop-grid" style="--cols:6">${MON.map((n, i) => opt('m' + (i + 1), n, S.pkey === 'm' + (i + 1), 'c')).join('')}</div>` +
    `<div class="pop-l">Single day</div><div class="pop-row">${monSel('p-dm', P.sm)}${daySel('p-dd', P.sd)}<button class="cc-btn" id="p-day">Set</button></div>` +
    `<div class="pop-l">Custom range</div><div class="pop-row">${monSel('p-sm', P.sm)}${daySel('p-sd', P.sd)}<span>to</span>${monSel('p-em', P.em)}${daySel('p-ed', P.ed)}<button class="cc-btn" id="p-rng">Set</button></div>`,
    pop => {
      pop.querySelectorAll('.pop-opt').forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (k[0] === 'm' && k.length <= 3 && !PERIODS[k]) { const m = +k.slice(1); setPeriod(k, { sm: m, sd: 1, em: m, ed: MDAYS[m - 1] }, MONL[m - 1]); }
        else setPeriod(k, PERIODS[k], PERIODS[k].label);
        closePop(); update();
      });
      const g = id => +pop.querySelector('#' + id).value, clampD = (m, d) => Math.min(d, MDAYS[m - 1]);
      pop.querySelector('#p-day').onclick = () => { const m = g('p-dm'), d = clampD(m, g('p-dd')); setPeriod('day', { sm: m, sd: d, em: m, ed: d }, `${MON[m - 1]} ${d}`); closePop(); update(); };
      pop.querySelector('#p-rng').onclick = () => { const sm = g('p-sm'), sd = clampD(sm, g('p-sd')), em = g('p-em'), ed = clampD(em, g('p-ed')); setPeriod('custom', { sm, sd, em, ed }, `${MON[sm - 1]} ${sd} – ${MON[em - 1]} ${ed}`); closePop(); update(); };
    });
};

$('tok-years').onclick = () => {
  if (!REC) return;
  const a = REC.Y[0], b = REC.Y[REC.n - 1];
  openPop($('tok-years'),
    `<div class="pop-grid" style="--cols:2">${opt('all', `All years (${a}–${b})`, !S.y0 && !S.y1)}${opt('1991', 'Since 1991', S.y0 === 1991 && !S.y1)}${opt('30', 'Last 30 years', S.y0 === b - 29 && !S.y1)}${opt('nrm', '1991–2020', S.y0 === 1991 && S.y1 === 2020)}</div>` +
    `<div class="pop-l">Custom</div><div class="pop-row"><input type="number" id="y-a" min="${a}" max="${b}" value="${S.y0 || a}"><span>to</span><input type="number" id="y-b" min="${a}" max="${b}" value="${S.y1 || b}"><button class="cc-btn" id="y-set">Set</button></div>`,
    pop => {
      pop.querySelectorAll('.pop-opt').forEach(o => o.onclick = () => {
        const k = o.dataset.k;
        if (k === 'all') { S.y0 = S.y1 = null; } else if (k === '1991') { S.y0 = 1991; S.y1 = null; } else if (k === '30') { S.y0 = b - 29; S.y1 = null; } else { S.y0 = 1991; S.y1 = 2020; }
        closePop(); update();
      });
      pop.querySelector('#y-set').onclick = () => {
        let p = +pop.querySelector('#y-a').value || a, q = +pop.querySelector('#y-b').value || b; if (p > q) [p, q] = [q, p];
        S.y0 = p <= a ? null : p; S.y1 = q >= b ? null : q; closePop(); update();
      };
    });
};

/* ════════════════════════════════════════════════════════════════════
   Station finder
   ════════════════════════════════════════════════════════════════════ */
let ddIdx = -1;
function haversineMiles(a, b, c, d) { const R = 3958.8, t = x => x * Math.PI / 180, h = Math.sin(t(c - a) / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(t(d - b) / 2) ** 2; return R * 2 * Math.asin(Math.sqrt(h)); }
function renderDD(matches, dists) {
  const dd = $('dd');
  if (!matches.length) { dd.classList.remove('open'); return; }
  dd.innerHTML = matches.map((s, i) => `<div class="d-item"><span class="d-id">${s.id.slice(0, 3)}</span><span class="d-name">${esc(s.name)}</span>` +
    (dists ? `<span class="d-dist">${dists[i].toFixed(0)} mi</span>` : `<span class="d-por">${s.y0}–</span>`) + `<span class="d-st">${s.st}</span></div>`).join('');
  dd.classList.add('open');
  dd.querySelectorAll('.d-item').forEach((el, i) => el.addEventListener('click', () => { $('si').value = ''; dd.classList.remove('open'); selectStation(matches[i].id); }));
}
function initSearch() {
  const inp = $('si'), dd = $('dd');
  inp.addEventListener('input', () => {
    ddIdx = -1; const q = inp.value.trim().toLowerCase();
    if (!q) { dd.classList.remove('open'); return; }
    const rank = s => { const id = s.id.toLowerCase(), nm = s.name.toLowerCase();
      if (id.slice(0, 3) === q || 'k' + id.slice(0, 3) === q) return 0;
      if (nm.startsWith(q)) return 1;
      if (nm.split(/[\s\-\/]+/).some(w => w.startsWith(q))) return 2;
      if (id.startsWith(q)) return 3;
      if (nm.includes(q)) return 4;
      if (s.st.toLowerCase() === q) return 5;
      return 9; };
    renderDD(STATIONS.map(s => [rank(s), s]).filter(r => r[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).map(r => r[1]).slice(0, 30));
  });
  inp.addEventListener('keydown', e => {
    const items = dd.querySelectorAll('.d-item');
    const hl = () => items.forEach((el, i) => { el.classList.toggle('hi', i === ddIdx); if (i === ddIdx) el.scrollIntoView({ block: 'nearest' }); });
    if (e.key === 'ArrowDown') { e.preventDefault(); ddIdx = Math.min(ddIdx + 1, items.length - 1); hl(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ddIdx = Math.max(ddIdx - 1, 0); hl(); }
    else if (e.key === 'Enter') { e.preventDefault(); const i = ddIdx >= 0 ? ddIdx : 0; if (items[i]) items[i].click(); }
    else if (e.key === 'Escape') dd.classList.remove('open');
  });
  document.addEventListener('click', e => { if (!$('sw').contains(e.target)) dd.classList.remove('open'); });
  $('locate-btn').onclick = () => {
    const btn = $('locate-btn');
    if (!navigator.geolocation) { btn.classList.add('is-error'); return; }
    const orig = btn.innerHTML; btn.classList.add('loading'); btn.innerHTML = '&#8987; Locating…';
    navigator.geolocation.getCurrentPosition(pos => {
      btn.classList.remove('loading'); btn.innerHTML = orig;
      const r = STATIONS.map(s => ({ s, d: haversineMiles(pos.coords.latitude, pos.coords.longitude, s.lat, s.lon) })).sort((a, b) => a.d - b.d).slice(0, 8);
      $('si').value = ''; renderDD(r.map(k => k.s), r.map(k => k.d));
    }, () => { btn.classList.remove('loading'); btn.innerHTML = orig; btn.classList.add('is-error'); setTimeout(() => btn.classList.remove('is-error'), 2500); },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
  };
}

/* ════════════════════════════════════════════════════════════════════
   Exports
   ════════════════════════════════════════════════════════════════════ */
function slug() { return `${STN.id.slice(0, 3)}-${S.stat}-${S.v}-${S.pkey}`.toLowerCase(); }
function buildPNG() {
  const W = 1500, H = 940, sc = 2, cv = document.createElement('canvas'); cv.width = W * sc; cv.height = H * sc;
  const c = cv.getContext('2d'); c.scale(sc, sc);
  c.fillStyle = C.bg; c.fillRect(0, 0, W, H);
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.font = `700 34px ${F.disp}`; c.fillStyle = C.text; c.fillText(sentenceText(), 36, 58);
  c.font = `17px ${F.mono}`; c.fillStyle = C.text2;
  c.fillText(`${STN.name}, ${STN.st}  ·  ${yearsText() === 'all years' ? `${M.rows[0].label} to ${M.rows[M.rows.length - 1].label}` : yearsText()}  ·  ${M.sum.n || 0} complete periods`, 36, 88);
  const cx = 28, cy = 110, cw = W - 56, chh = H - 110 - 58;
  c.fillStyle = C.surface; rr(c, cx, cy, cw, chh, 6); c.fill(); c.strokeStyle = C.border; c.lineWidth = 1; c.stroke();
  VIEWS[S.view](c, cx + 16, cy + 14, cw - 32, chh - 26, null);
  c.font = `14px ${F.mono}`; c.fillStyle = C.muted; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillText(`Data: NOAA Regional Climate Centers (ACIS), ThreadEx  ·  up to ${tol()} missing day${tol() === 1 ? '' : 's'} allowed per period`, 36, H - 24);
  c.textAlign = 'right'; c.fillStyle = C.text2; c.font = `700 15px ${F.mono}`; c.fillText('contextclimate.io', W - 36, H - 24);
  return cv;
}
function flash(btn, cls) { btn.classList.add(cls); setTimeout(() => btn.classList.remove(cls), 1600); }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$('png-btn').onclick = async () => { if (!M) return; await document.fonts.ready; buildPNG().toBlob(b => download(b, `climate-explorer-${slug()}.png`), 'image/png'); };
$('copy-btn').onclick = async () => {
  if (!M) return; const btn = $('copy-btn');
  try { await document.fonts.ready; const blob = await new Promise(r => buildPNG().toBlob(r, 'image/png')); await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); flash(btn, 'is-ok'); }
  catch (e) { flash(btn, 'is-error'); }
};
$('csv-btn').onclick = () => {
  if (!M) return;
  const q = s => `"${String(s).replace(/"/g, '""')}"`, lines = [
    `# ${sentenceText()} — ${STN.name}, ${STN.st} (${STN.id}thr). Source: NOAA ACIS ThreadEx. Up to ${tol()} missing days allowed.`,
    ['rank', 'period', 'value', 'unit', 'date', 'missing_days', 'status'].join(',')];
  for (const o of sortedRows()) lines.push([o.ok ? o.rank : '', q(o.label), o.v == null ? '' : isDate() ? q(dateOfOffset(o.v)) : o.v.toFixed(decimals()), q(unit() || 'date'),
    o.di >= 0 ? `${REC.Y[o.di]}-${String(REC.M[o.di]).padStart(2, '0')}-${String(REC.D[o.di]).padStart(2, '0')}` : '', o.miss, o.partial ? 'in progress' : o.ok ? 'complete' : 'excluded'].join(','));
  download(new Blob([lines.join('\n')], { type: 'text/csv' }), `climate-explorer-${slug()}.csv`);
};

/* ════════════════════════════════════════════════════════════════════
   Init
   ════════════════════════════════════════════════════════════════════ */
new ResizeObserver(() => draw()).observe($('stage'));
initSearch();
renderSentence();
let start = 'ISP';
try { const s = localStorage.getItem('cc-explorer-stn'); if (s && byId[s]) start = s; } catch (e) {}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => draw());
selectStation(start);
</script>
