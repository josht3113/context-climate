<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Core Furnace</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-solar); --exo: #7ECB8F; --endo: #F8584A; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 9px 18px; display: inline-flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.1; }
.tabs .cc-segmented-btn small { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; text-transform: none; opacity: .85; }
.top .spacer { flex: 1; min-width: 0; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 180px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu.open { display: flex; }
.menu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.menu button:hover { background: var(--color-surface); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; gap: 12px; padding: 10px 10px 4px; }
.pnl { display: flex; flex-direction: column; position: relative; }
.pnl-head { height: 32px; display: flex; align-items: center; gap: 8px; }
.pnl-head .lab { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.pnl-head .tag { font-family: var(--font-mono); font-size: 13px; color: var(--tool-accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pnl-head .sp { flex: 1; }
.pnl-head .cc-btn { padding: 4px 10px; font-size: 13px; }
.pnl-head .cc-segmented-btn { padding: 5px 10px; font-size: 12px; }
.pnl canvas { display: block; border-radius: var(--radius-md); background: #222723; }
.info { width: 28px; height: 26px; padding: 0 !important; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-display) !important; font-style: italic; font-weight: 700; font-size: 15px !important; }
.info.is-active, .cc-btn.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.drawer { position: absolute; left: 0; right: 0; bottom: 0; display: none; background: rgba(30,35,32,.96); border-top: 1px solid var(--tool-accent);
  padding: 10px 14px 12px; font-size: 14px; line-height: 1.5; color: var(--color-text-secondary); border-radius: 0 0 var(--radius-md) var(--radius-md); max-height: 60%; overflow-y: auto; }
.drawer.open { display: block; }
.drawer p { margin: 0 0 6px; }
.drawer p:last-child { margin: 0; }
.drawer b { color: var(--color-text-primary); }

/* timeline */
.tl { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; column-gap: 10px; row-gap: 4px; align-items: center; padding: 4px 12px 8px; }
.tl > .rl { grid-column: 1; grid-row: 1; } .tl > .bar { grid-column: 2; grid-row: 1; }
.tl .row2 .rl { grid-column: 1; grid-row: 2; } .tl .row2 .bar { grid-column: 2; grid-row: 2; }
.tl .rl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.tl .bar { display: flex; height: 18px; border-radius: 3px; overflow: hidden; background: rgba(232,228,217,.05); }
.tl .seg { display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: #1E2320; white-space: nowrap; overflow: hidden;
  border-right: 1px solid rgba(30,35,32,.6); cursor: pointer; opacity: .62; transition: opacity .2s; }
.tl .seg.active { opacity: 1; box-shadow: inset 0 0 0 2px #FFF7E8; }
.tl .seg.merged { outline: 1.5px solid #D67E60; outline-offset: -1.5px; }
.tl .chips { grid-column: 3; grid-row: 1; }
.tl.essrt .chips { grid-row: 1 / span 2; }
.tl .cc-segmented-btn { padding: 5px 10px; font-size: 12px; }
.tl .row2 { display: none; }
.tl.essrt .row2 { display: contents; }

/* control bar */
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border); background: var(--color-surface); min-height: 60px; }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; width: 150px; flex: none; align-self: stretch; white-space: nowrap;
  font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); animation: glow 2.4s ease-in-out infinite; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play.run { animation: none; }
.play:disabled { opacity: .45; animation: none; cursor: default; filter: none; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(166,150,48,0); } 50% { box-shadow: 0 0 0 5px rgba(166,150,48,.3); } }
@media (prefers-reduced-motion: reduce) { .play { animation: none; } }
.snaps { display: grid; gap: 5px; flex: 1 1 auto; min-width: 0; }
.snap { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 3px; min-width: 0; }
.snap .n { font-family: var(--font-body); font-weight: 700; font-size: 14px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.snap .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.15; color: var(--color-text-secondary); white-space: nowrap; }
.snap.locked { border-style: dashed; }
.snap.locked .n, .snap.locked .v { color: var(--color-text-muted); }
.snap.merged { outline: 1.5px solid #D67E60; outline-offset: -1.5px; }
.snap.is-active { background: var(--snap-c, var(--tool-accent)); border-color: var(--snap-c, var(--tool-accent)); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
.snap:disabled { cursor: default; }
.scrub { display: flex; align-items: center; gap: 6px; flex: 0 0 150px; }
.scrub input { width: 100%; accent-color: var(--tool-accent); cursor: pointer; }

/* card */
.card { padding: 11px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .eb .st { color: var(--color-text-primary); letter-spacing: .04em; margin-left: auto; white-space: nowrap; }
.card .eb > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .rx { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .rx .t { font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1.2; color: var(--color-text-primary); }
.card .rx .m { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.card .r { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; white-space: nowrap; text-align: right; }
.card .sub { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; margin-top: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--color-border-hover); }
.card .sub span { white-space: nowrap; }
.card .sub span:last-child { color: var(--color-text-secondary); font-weight: 500; letter-spacing: .03em; text-transform: none; }
.eg { display: grid; grid-template-columns: 70px minmax(0, 1fr) 40px; gap: 3px 8px; align-items: center; margin-top: 6px; }
.eg .s { line-height: 1.25; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.eg .b { height: 10px; background: rgba(232,228,217,.06); border-radius: 2px; position: relative; overflow: hidden; }
.eg .b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
.eg .n { line-height: 1.25; font-family: var(--font-mono); font-size: 13px; font-weight: 700; text-align: right; color: var(--color-text-primary); white-space: nowrap; }
.eg .cur .s, .eg .cur.n { color: var(--color-text-primary); font-weight: 700; }
.eg .off { opacity: .4; }
.els { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.el { min-width: 34px; padding: 4px 6px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 16px; border-radius: 4px;
  border: 1px solid var(--color-border); color: var(--color-text-muted); opacity: .45; }
.el.made { opacity: 1; color: var(--color-text-primary); border-color: var(--color-border-hover); background: rgba(232,228,217,.06); }
.el.new { opacity: 1; color: #1E2320; }
.el.heavy { font-family: var(--font-mono); font-size: 13px; padding-top: 6px; }
.res { margin-top: 8px; padding: 5px 10px 6px; border: 1px solid; border-radius: var(--radius-md); }
.res .t { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
.res .d { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
.cnotes { display: none; margin-top: 10px; font-size: 14px; line-height: 1.5; color: var(--color-text-secondary); border-left: 2px solid var(--tool-accent); padding-left: 10px; }
.cnotes.open { display: block; }
.cnotes p { margin: 0 0 7px; }
.card .src { margin-top: auto; padding-top: 10px; }
.srcbtn { background: none; border: none; padding: 0; cursor: pointer; font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); text-align: left; line-height: 1.4; }
.srcbtn:hover { color: var(--color-text-secondary); }
.srcnotes { display: none; font-size: 13px; line-height: 1.5; color: var(--color-text-muted); margin-top: 6px; }
.srcnotes.open { display: block; }
.srcnotes p { margin: 0 0 6px; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 20px; }
  .card .sub { margin-top: 8px; }
  .eg { gap: 2px 8px; margin-top: 4px; }
  .el { padding: 3px 5px; font-size: 15px; }
  .card .rx { padding: 5px 0 4px; }
  .card .rx .t { font-size: 17px; }
  .eg .b { height: 8px; }
}
@media (max-width: 1366px) { .main { grid-template-columns: minmax(0, 1fr) 272px; } .card { padding: 10px 14px; } }
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .top { gap: 10px; } .top h1 { font-size: 22px; }
  .tabs .cc-segmented-btn { padding: 9px 12px; }
  .scrub { flex-basis: 110px; }
  .play { width: 130px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .tabs small { display: none; }
  .scrub { display: none; }
  .snap .v { font-size: 12px; }
  .tl { grid-template-columns: 74px minmax(0, 1fr) auto; }
  .card .eb { letter-spacing: .04em; font-size: 12px; }
  .card .sub { letter-spacing: .03em; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">The Core Furnace</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="sun">The Sun<small>1 M☉</small></button>
      <button class="cc-segmented-btn" data-tab="massive">Massive star<small>25 M☉</small></button>
      <button class="cc-segmented-btn" data-tab="essrt">ESSRT p. 2<small>25 M☉ · 6 rows</small></button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="menu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <div class="pnl" id="pChm">
          <div class="pnl-head">
            <span class="lab">Reaction chamber</span>
            <span class="tag" id="chmTag"></span>
            <span class="sp"></span>
            <button class="cc-btn" id="bKey">Key</button>
            <button class="cc-btn info" id="iChm" title="Notes">i</button>
          </div>
          <canvas id="chmCanvas"></canvas>
          <div class="drawer" id="dChm"></div>
        </div>
        <div class="pnl" id="pCtx">
          <div class="pnl-head">
            <div class="cc-segmented" id="ctxTabs">
              <button class="cc-segmented-btn is-active" data-c="star">Star</button>
              <button class="cc-segmented-btn" data-c="curve">Binding</button>
              <button class="cc-segmented-btn" data-c="hill">The hill</button>
              <button class="cc-segmented-btn" data-c="journey">Escape</button>
            </div>
            <span class="sp"></span>
            <button class="cc-btn info" id="iCtx" title="Notes">i</button>
          </div>
          <canvas id="ctxCanvas"></canvas>
          <div class="drawer" id="dCtx"></div>
        </div>
      </div>
      <div class="tl" id="tl">
        <span class="rl" id="tlLab">Duration</span>
        <div class="bar" id="tlBar"></div>
        <div class="chips">
          <div class="cc-segmented" id="scaleTabs">
            <button class="cc-segmented-btn is-active" data-scale="log">Log</button>
            <button class="cc-segmented-btn" data-scale="true">True</button>
          </div>
        </div>
        <div class="row2"><span class="rl">ESSRT p. 2</span><div class="bar" id="essrtBar"></div></div>
      </div>
      <div class="controls">
        <button class="cc-btn play" id="bPlay"><span class="ic">▶</span><span class="tx">Play</span></button>
        <div class="snaps" id="snaps"></div>
        <label class="scrub" title="Reaction progress"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Reaction progress"></label>
      </div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

    s = (s*1664525 + 1013904223) >>> 0;
    var th = (i/17)*6.2832 + ((s%1000)/1000 - 0.5)*0.30;
    s = (s*1664525 + 1013904223) >>> 0;
    a.push({ th:th, d: 86 + (s%1000)/1000*52 });
  }
  return a;
})();

/* ── Sun · proton–proton chain ───────────────────────────────────────────
   The point is the WAIT. Step one needs a proton to become a neutron while
   two protons are touching; a given proton waits ~a billion years for it.
   That improbability is why the Sun burns for ten billion years instead of
   detonating. ─────────────────────────────────────────────────────────── */
var PPS = 1.5;                       /* one scale for the whole scene, so a
                                        deuteron is never smaller than a proton */
function scenePP(ctx, p, ts){
  var cx = 260, cy = 150;
  cap(ctx, 'The proton\u2013proton chain');

  if (p < 0.40){
    stepDots(ctx, 3, 0);
    var t = p / 0.40;
    if (t < 0.42){
      var e = ease(clamp01(t/0.42));
      drawNucleus(ctx, lerp(104, cx-26, e), cy, 1, 0, { scale:PPS, name:'H' });
      drawNucleus(ctx, lerp(416, cx+26, e), cy, 1, 0, { scale:PPS, name:'H' });
    } else {
      var f = clamp01((t-0.42)/0.58);
      drawNucleus(ctx, cx, cy, 1, 1, { scale:PPS, name:'H', ring: f>0.4?'#7ECB8F':null,
                                       glow:'rgba(240,194,74,'+(0.20*(1-f))+')' });
      var d = 34 + f*74;
      drawLite(ctx, cx + d*0.86, cy - d*0.52, 'e+', { alpha:1-f*0.5 });
      drawLite(ctx, cx + d*1.02, cy + d*0.40, 'nu', { alpha:1-f*0.5 });
      chipTxt(ctx, 'one proton just became a neutron', cx, 226, 14, INK, 'center', '700');
    }
    waitChip(ctx, 'typical wait: about a billion years', 250);
  } else if (p < 0.66){
    stepDots(ctx, 3, 1);
    var t2 = (p-0.40)/0.26;
    if (t2 < 0.5){
      var e2 = ease(clamp01(t2/0.5));
      drawNucleus(ctx, cx - 36, cy, 1, 1, { scale:PPS, name:'H' });
      drawNucleus(ctx, lerp(430, cx+26, e2), cy, 1, 0, { scale:PPS, name:'H' });
    } else {
      var f2 = clamp01((t2-0.5)/0.5);
      drawNucleus(ctx, cx, cy, 2, 1, { scale:PPS, name:'He', ring:'#7ECB8F' });
      drawPhoton(ctx, cx+38, cy-28, cx+38+72*f2, cy-28-54*f2, { alpha:1-f2*0.5, phase:ts*0.012 });
    }
    waitChip(ctx, 'typical wait: about one second', 250);
  } else {
    stepDots(ctx, 3, 2);
    var t3 = (p-0.66)/0.34;
    if (t3 < 0.45){
      var e3 = ease(clamp01(t3/0.45));
      drawNucleus(ctx, lerp(120, cx-34, e3), cy, 2, 1, { scale:PPS, name:'He' });
      drawNucleus(ctx, lerp(430, cx+34, e3), cy, 2, 1, { scale:PPS, name:'He' });
      txt(ctx, 'the second \u00b3He was built the same way', CHM_W-16, 232, 13, INK_MUTE, 'right', '500');
    } else {
      var f3 = ease(clamp01((t3-0.45)/0.55));
      drawNucleus(ctx, cx, cy, 2, 2, { scale:PPS, name:'He', ring:'#7ECB8F',
                                       glow:'rgba(126,203,143,'+(0.26*(1-f3*0.6))+')' });
      drawNucleus(ctx, cx - 52 - f3*112, cy - f3*44, 1, 0, { scale:PPS, alpha:1-f3*0.35 });
      drawNucleus(ctx, cx + 52 + f3*112, cy + f3*44, 1, 0, { scale:PPS, alpha:1-f3*0.35 });
      chipTxt(ctx, 'two protons handed back', cx, 226, 14, INK_MUTE, 'center', '700');
    }
    waitChip(ctx, 'typical wait: about 400,000 years', 250);
  }
  subcap(ctx, 'Four hydrogen nuclei in, one helium out. The Sun runs this about 10\u00b3\u2078 times a second and still has half its hydrogen left.');
}

/* ── CNO cycle (massive star hydrogen burning) ───────────────────────── */
var CNO = [
  {Z:6,N:6,sym:'C'},{Z:7,N:6,sym:'N'},{Z:6,N:7,sym:'C'},
  {Z:7,N:7,sym:'N'},{Z:8,N:7,sym:'O'},{Z:7,N:8,sym:'N'}
];
var CNO_KIND = ['p','b','p','p','b','a'];

function sceneCNO(ctx, p, ts){
  var wx = 150, wy = 150, wr = 76, i;
  var k = Math.min(5, Math.floor(p*6)), t = clamp01(p*6 - k), kind = CNO_KIND[k];
  var HEX = 356, HEY = 196;

  ctx.beginPath(); ctx.arc(wx, wy, wr, 0, 6.2832);
  ctx.strokeStyle='rgba(232,228,217,0.13)'; ctx.lineWidth=1.2;
  ctx.setLineDash([4,5]); ctx.stroke(); ctx.setLineDash([]);

  var ang = function(i){ return -Math.PI/2 + Math.PI/6 + i*6.2832/6; };
  var px = function(i){ return wx + wr*Math.cos(ang(i)); };
  var py = function(i){ return wy + wr*Math.sin(ang(i)); };

  for (i = 0; i < 6; i++){
    ctx.beginPath(); ctx.arc(wx, wy, wr, ang(i)+0.44, ang(i+1)-0.44);
    ctx.strokeStyle = (i===k) ? 'rgba(240,194,74,0.8)' : 'rgba(232,228,217,0.16)';
    ctx.lineWidth = (i===k) ? 2.4 : 1.4; ctx.stroke();
  }
  for (i = 0; i < 6; i++){
    var act = (i===k), node = CNO[i];
    if (act && t > ((kind==='b')?0.5:0.55)) node = CNO[(k+1)%6];
    drawNucleus(ctx, px(i), py(i), node.Z, node.N, {
      scale: act?0.62:0.52, alpha: act?1:0.55,
      ring: act?'#F0C24A':null, glow: act?'rgba(240,194,74,0.16)':null });
    nucName(ctx, wx+(wr+32)*Math.cos(ang(i)), wy+(wr+32)*Math.sin(ang(i))+5,
            node.Z+node.N, node.sym, act?16:14, act?INK:'rgba(232,228,217,0.55)', 'center');
  }
  txt(ctx, 'CNO', wx, wy+5, 15, 'rgba(232,228,217,0.30)', 'center', '700', true);

  var sx = px(k), sy = py(k);
  if (kind==='p' || kind==='a'){
    if (t < 0.62){
      var fa = ang(k)-0.55, fr = wr+104, e = ease(clamp01(t/0.55));
      var ix = lerp(wx+fr*Math.cos(fa), sx, e), iy = lerp(wy+fr*Math.sin(fa), sy, e);
      drawNucleus(ctx, ix, iy, 1, 0, { r:9, alpha: 1-clamp01((t-0.52)/0.1) });
      if (t < 0.4) txt(ctx, 'proton', ix, iy-17, 13.5, C_PROTON, 'center', '600');
    }
  }
  if (kind==='b'){
    var bo = clamp01((t-0.5)/0.5);
    if (bo > 0){
      var d = 30 + bo*54;
      drawLite(ctx, sx+d*0.8, sy-d*0.5, 'e+', { alpha:1-bo*0.7 });
      drawLite(ctx, sx+d*1.0, sy+d*0.4, 'nu', { alpha:1-bo*0.7 });
      if (bo < 0.7) txt(ctx, 'beta-plus decay', sx, sy-46, 13.5, C_POS, 'center', '600');
    }
  }
  if (kind==='p' && t > 0.55){
    var go = clamp01((t-0.55)/0.45);
    drawPhoton(ctx, sx, sy, sx+60*go, sy-46*go, { alpha:1-go*0.6, phase:ts*0.01 });
  }
  if (kind==='a' && t > 0.55){
    var ao = ease(clamp01((t-0.55)/0.45));
    drawNucleus(ctx, lerp(sx,HEX,ao), lerp(sy,HEY,ao), 2, 2, { scale:0.72 });
  }

  var tx = 300;
  txt(ctx, 'NET, ONE TURN', tx, 62, 13, INK_MUTE, 'left', '600', true);
  var cons = 0, pk = [0,2,3];
  for (i = 0; i < 3; i++) if (k > pk[i] || (k===pk[i] && t>0.55)) cons++;
  if (k === 5) cons = (t>0.55) ? 4 : 3;
  for (i = 0; i < 4; i++) drawNucleus(ctx, tx+14+i*34, 96, 1, 0, { r:9, alpha: i<cons?1:0.20 });
  txt(ctx, '4 protons in', tx, 130, 14, INK_SEC, 'left', '500');
  arrow(ctx, tx+16, 146, tx+16, 172, 'rgba(232,228,217,0.35)', 2);
  drawNucleus(ctx, HEX, HEY, 2, 2, { scale:0.72, alpha:(k===5&&t>0.55)?1:0.22 });
  txt(ctx, '1 helium out', tx, 238, 14, INK_SEC, 'left', '500');
  txt(ctx, '+ 2 positrons, 2 neutrinos', tx, 258, 13, INK_MUTE, 'left', '500');

  cap(ctx, 'Hydrogen burning in a massive star runs through carbon');
  subcap(ctx, 'Carbon is a catalyst \u2014 it goes in and comes back out unchanged. Hotter cores make this route beat the Sun\u2019s p\u2013p chain.');
}

/* ── silicon: the alpha ladder ──────────────────────────────────────── */
var LADDER = [
  {Z:14,N:14,sym:'Si'},{Z:16,N:16,sym:'S'},{Z:18,N:18,sym:'Ar'},{Z:20,N:20,sym:'Ca'},
  {Z:22,N:22,sym:'Ti'},{Z:24,N:24,sym:'Cr'},{Z:26,N:26,sym:'Fe'},{Z:28,N:28,sym:'Ni'}

function sceneSilicon(ctx, p, ts){
  cap(ctx, 'Photons melt silicon; the pieces are stacked into iron');
  var i, mx=54, my=108;
  drawNucleus(ctx, mx, my, 14, 14, { scale:0.44, alpha:0.9 });
  nucName(ctx, mx, my+30, 28, 'Si', 13.5, INK_SEC, 'center');
  for (var g = 0; g < 3; g++){
    var ph = ((ts*0.0009 + g*0.33) % 1);
    drawPhoton(ctx, 8, my-42+g*26, 8+20*ph+10, my-38+g*23,
               { alpha:0.3+0.5*Math.sin(ph*Math.PI), amp:3.2, wl:8, lw:1.7 });
  }
  txt(ctx, 'fuel supply', mx, my+52, 13, INK_MUTE, 'center', '500');

  var n=8, x0=132, x1=470, y0=214, y1=72;
  var st = Math.min(6.999, p*7), ki = Math.floor(st), kt = st-ki, done = p > 0.955;
  var LX = function(i){ return lerp(x0,x1,i/(n-1)); }, LY = function(i){ return lerp(y0,y1,i/(n-1)); };

  ctx.beginPath();
  for (i=0;i<n;i++) i?ctx.lineTo(LX(i),LY(i)):ctx.moveTo(LX(0),LY(0));
  ctx.strokeStyle='rgba(232,228,217,0.14)'; ctx.lineWidth=1.4;
  ctx.setLineDash([3,4]); ctx.stroke(); ctx.setLineDash([]);

  for (i=0;i<n;i++){

    drawNucleus(ctx, LX(i), LY(i), node.Z, node.N, {

    nucName(ctx, LX(i), (i%2===0?LY(i)+32:LY(i)-25), node.Z+node.N, node.sym,

  }
  if (done){
    chipTxt(ctx, 'seven alpha captures', 14, 208, 14, C_EXO, 'left', '700');
    chipTxt(ctx, '\u2075\u2076Ni \u2192 \u2075\u2076Co \u2192 \u2075\u2076Fe, over 77 days', 300, 250, 14, C_EXO, 'center', '700');
  } else if (ki < n-1){
    var e = ease(clamp01(kt/0.72));

                  2, 2, { scale:0.56 });
    if (kt > 0.72) chipTxt(ctx, 'rung ' + (ki+1) + ' of 7', 14, 208, 14, C_EXO, 'left', '700');
  }
  subcap(ctx, 'Silicon never fuses with silicon \u2014 two silicon nuclei repel each other far too strongly. The ladder is the only route to iron.');
}

        var no = clamp01((lt-0.92)/0.08);
        drawLite(ctx, 320+no*90, yy-8-no*16, 'nu', { alpha:1-no*0.35 });
        txt(ctx, 'n + \u03bd', 314, yy+5, 15, INK, 'left', '600');
      }
    }
    chipTxt(ctx, 'that electron pressure was the only thing holding the core up',
            CHM_W/2, 250, 14.5, C_ENDO, 'center', '700');
    subcap(ctx, 'Every capture also fires off a neutrino, which leaves the star immediately and takes more energy with it.');
  }
}

/* ── temperature scale, shared by the locked stages and the Sun's ending ──
   Log axis from 10⁷ to 10¹⁰ K. The gap between "what this core reaches" and
   "what this reaction needs" is the entire argument. ─────────────────── */
function tempScale(ctx, haveK, needK, y, haveLbl, needLbl){
  var x0 = 56, x1 = CHM_W - 56, lo = 7, hi = 10.2;
  var X = function(K){ return x0 + (Math.log(K)/Math.LN10 - lo)/(hi-lo) * (x1-x0); };
  ctx.beginPath(); roundRect(ctx, x0, y, x1-x0, 8, 4);
  ctx.fillStyle = 'rgba(232,228,217,0.10)'; ctx.fill();
  var hx = X(haveK), nx = X(needK);
  ctx.beginPath(); roundRect(ctx, x0, y, hx-x0, 8, 4);
  ctx.fillStyle = '#F2CE72'; ctx.fill();
  if (nx > hx){
    ctx.beginPath(); roundRect(ctx, hx, y, nx-hx, 8, 4);
    ctx.fillStyle = 'rgba(248,88,74,0.30)'; ctx.fill();
  }
  for (var e = 7; e <= 10; e++){
    var tx0 = X(Math.pow(10,e));
    ctx.beginPath(); ctx.moveTo(tx0, y+11); ctx.lineTo(tx0, y+15);
    ctx.strokeStyle='rgba(232,228,217,0.25)'; ctx.lineWidth=1; ctx.stroke();
    txt(ctx, '10' + ['\u2077','\u2078','\u2079','\u00b9\u2070'][e-7] + ' K', tx0, y+26, 12.5, INK_MUTE, 'center', '500', true);
  }
  ctx.beginPath(); ctx.moveTo(nx, y-6); ctx.lineTo(nx, y+9);
  ctx.strokeStyle = C_ENDO; ctx.lineWidth = 2.4; ctx.stroke();
  /* Both callouts sit ABOVE the bar on separate rows, so they can never
     collide with each other or with the tick labels below. */
  chipTxt(ctx, needLbl, clampX(ctx, needLbl, nx, 13.5), y-14, 13.5, C_ENDO, 'center', '700');
  chipTxt(ctx, haveLbl, clampX(ctx, haveLbl, hx, 13.5), y-38, 13.5, '#F2CE72', 'center', '700');
}
function clampX(ctx, s, x, size){
  ctx.font = '700 ' + size + 'px ' + BODY;
  var half = ctx.measureText(s).width/2 + 10;
  return Math.max(half + 8, Math.min(CHM_W - half - 8, x));
}

/* ── a stage this star never reaches ────────────────────────────────── */
var LOCK_NUC = { 'C':[6,6], 'Ne':[10,10], 'O':[8,8], 'Si':[14,14] };
function sceneLocked(ctx, p, ts, stg){
  cap(ctx, 'The Sun never reaches this stage');
  var n = LOCK_NUC[stg.ring];
  if (n){
    ctx.save(); ctx.globalAlpha = 0.22;
    drawNucleus(ctx, CHM_W/2 - 62, 96, n[0], n[1], { scale:0.8 });
    drawNucleus(ctx, CHM_W/2 + 62, 96, n[0], n[1], { scale:0.8 });
    ctx.restore();
    ctx.save(); ctx.globalAlpha = 0.34;
    ctx.strokeStyle = C_ENDO; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(CHM_W/2-13, 83); ctx.lineTo(CHM_W/2+13, 109);
    ctx.moveTo(CHM_W/2+13, 83); ctx.lineTo(CHM_W/2-13, 109);
    ctx.stroke(); ctx.restore();
  }
  txt(ctx, stg.label + '  \u00b7  needs ' + stg.needT, CHM_W/2, 152, 15, INK_SEC, 'center', '600');
  tempScale(ctx, 1e8, parseNeed(stg.needT), 214,
            'the Sun\u2019s core, at its hottest', 'needed here');
  subcap(ctx, stg.why);
}
function parseNeed(s){
  var m = s.match(/([\d.]+)\u00d710([\u2077\u2078\u2079]|\u00b9\u2070)/);
  if (!m) return 1e9;
  var e = { '\u2077':7, '\u2078':8, '\u2079':9, '\u00b9\u2070':10 }[m[2]];
  return parseFloat(m[1]) * Math.pow(10, e);
}

/* ── the Sun's ending: fuel present, heat absent ────────────────────── */
function sceneSunEnd(ctx, p, ts){
  cap(ctx, 'The fuel is right there. The core is just too cool to light it.');
  /* A still, cold carbon-oxygen core. The nuclei only jiggle — nothing ever
     collides hard enough to fuse, which is the whole point of the frame. */
  var cy = 86, i;
  for (i = 0; i < 9; i++){
    var row = Math.floor(i/5), inRow = (row === 0) ? 5 : 4, idx = i - row*5;
    var ax = CHM_W/2 + (idx - (inRow-1)/2) * 76 + Math.sin(ts*0.0006 + i*1.3)*2.4;
    var ay = cy + row*56 + Math.cos(ts*0.0007 + i*1.7)*2.4;
    var isO = (i % 3 === 0);
    drawNucleus(ctx, ax, ay, isO?8:6, isO?8:6, { scale:0.46, alpha:0.85 });
    nucName(ctx, ax, ay + 29, isO?16:12, isO?'O':'C', 12.5, 'rgba(232,228,217,0.48)', 'center');
  }
  tempScale(ctx, 1e8, 6e8, 230, 'the Sun gets here', 'carbon needs here');
  subcap(ctx, 'A massive star stops because iron is worthless as fuel. The Sun stops for the opposite reason — its fuel is fine and its furnace is too cool.');
}

/* ── dispatch ───────────────────────────────────────────────────────── */
function drawChamber(ctx, p, ts, star, slot){
  ctx.clearRect(0, 0, CHM_W, CHM_H);
  var stg = star.stages[slot];
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, CHM_W, SC_BOT+2); ctx.clip();
  switch (stg.scene){
    case 'pp':         scenePP(ctx, p, ts); break;
    case 'cno':        sceneCNO(ctx, p, ts); break;
    case 'triple':     sceneTriple(ctx, p, ts, false); break;
    case 'triple_sun': sceneTriple(ctx, p, ts, true); break;
    case 'carbon': sceneFuse(ctx, p, ts, { cap:'Two carbon nuclei fuse \u2014 into neon, not oxygen',
        Z:6,N:6,sym:'C',gap:30,midSym:'Mg',midLabel:'\u00b2\u2074Mg, briefly and violently excited',
        pZ:10,pN:10,pSym:'Ne',
        note:'Other branch: \u00b9\u00b2C + \u00b9\u00b2C \u2192 \u00b2\u00b3Na + p. The oxygen in this star came from helium burning, not from here.' }); break;
    case 'oxygen': sceneFuse(ctx, p, ts, { cap:'Two oxygen nuclei fuse into silicon',
        Z:8,N:8,sym:'O',gap:32,midSym:'S',midLabel:'\u00b3\u00b2S, briefly and violently excited',
        pZ:14,pN:14,pSym:'Si',
        note:'Other branch: \u00b9\u2076O + \u00b9\u2076O \u2192 \u00b3\u00b9P + p. This is the last stage that is plain fusion of two like nuclei.' }); break;
    case 'neon':    sceneNeon(ctx, p, ts); break;
    case 'silicon': sceneSilicon(ctx, p, ts); break;
    case 'iron':    sceneIron(ctx, p, ts); break;
    case 'sunend':  sceneSunEnd(ctx, p, ts); break;
    case 'locked':  sceneLocked(ctx, p, ts, stg); break;
  }
  ctx.restore();
  drawLedger(ctx, stg);
}
</script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   LEDGER · CUTAWAY (+ the Sun's energy escape) · BINDING CURVE
   ══════════════════════════════════════════════════════════════════════════ */

function nucW(ctx, A, sym, size){
  var ss = Math.max(10, Math.round(size*0.66));
  ctx.font = '700 ' + ss + 'px ' + MONO;  var a = ctx.measureText(String(A)).width;
  ctx.font = '700 ' + size + 'px ' + BODY; var s = ctx.measureText(sym).width;
  return a + 2 + s;
}
function drawEq(ctx, toks, x, y, size, color, align){
  var i, w = 0, ws = [];
  for (i = 0; i < toks.length; i++){
    var tk = toks[i], tw;
    if (tk.A !== undefined) tw = nucW(ctx, tk.A, tk.s, size);
    else { ctx.font = '600 ' + size + 'px ' + BODY; tw = ctx.measureText(tk.t).width; }
    ws.push(tw); w += tw + (i?7:0);
  }
  var cx = align==='center' ? x-w/2 : (align==='right' ? x-w : x);
  for (i = 0; i < toks.length; i++){
    if (toks[i].A !== undefined) nucName(ctx, cx, y, toks[i].A, toks[i].s, size, toks[i].c||color, 'left');
    else txt(ctx, toks[i].t, cx, y, size, toks[i].c||color, 'left', '600');
    cx += ws[i] + 7;
  }
  return w;
}

/* Every ledger carries a nucleon count. The crosscutting concept attached to
   HS-ESS1-3 is that atoms are NOT conserved in nuclear processes but the
   total number of protons plus neutrons IS — so the tool has to let a student
   check that, not just assert it. */
var LEDGER = {
  pp: { eq:[{t:'4'},{A:1,s:'H'},{t:'\u2192'},{A:4,s:'He'},{t:'+ 2e\u207a + 2\u03bd'}],
        mass:'4.031300 u in \u2192 4.002603 u out \u00b7 +26.7 MeV', nIn:4, nOut:4,
        note:'0.7% of the mass is gone. That missing 0.029 u is the energy the Sun has been running on for 4.6 billion years.' },
  cno:{ eq:[{t:'4'},{A:1,s:'H'},{t:'\u2192'},{A:4,s:'He'},{t:'+ 2e\u207a + 2\u03bd'}],
        mass:'same net reaction as the Sun \u00b7 +26.7 MeV', nIn:4, nOut:4,
        note:'The carbon, nitrogen and oxygen are borrowed and returned, so they do not appear in the net count.' },
  triple:{ eq:[{t:'3'},{A:4,s:'He'},{t:'\u2192'},{A:12,s:'C'},{t:'+ \u03b3'}],
        mass:'12.007810 u in \u2192 12.000000 u out \u00b7 +7.3 MeV', nIn:12, nOut:12,
        note:'One tenth the yield per nucleon of hydrogen burning \u2014 and the star is far brighter now, so the fuel goes much faster.' },
  triple_sun:{ eq:[{t:'3'},{A:4,s:'He'},{t:'\u2192'},{A:12,s:'C'},{t:', then'},{A:12,s:'C'},{t:'+'},{A:4,s:'He'},{t:'\u2192'},{A:16,s:'O'}],
        mass:'+7.3 MeV, then +7.2 MeV', nIn:16, nOut:16,
        note:'This is the end of the line for the Sun. Everything it will ever make, it has made by now.' },
  carbon:{ eq:[{A:12,s:'C'},{t:'+'},{A:12,s:'C'},{t:'\u2192'},{A:20,s:'Ne'},{t:'+'},{A:4,s:'He'}],
        mass:'24.000000 u in \u2192 23.995044 u out \u00b7 +4.6 MeV', nIn:24, nOut:24,
        note:'Neutrinos now carry away more energy than the reaction releases as light, so the core has to burn faster to keep up.' },
  neon:{ eq:[{t:'2'},{A:20,s:'Ne'},{t:'\u2192'},{A:16,s:'O'},{t:'+'},{A:24,s:'Mg'}],
        mass:'\u22124.7 MeV to break, +9.3 MeV to build \u00b7 +4.6 MeV net', nIn:40, nOut:40,
        note:'The lowest yield of any stage. Neon burning lasts about a year.' },
  oxygen:{ eq:[{A:16,s:'O'},{t:'+'},{A:16,s:'O'},{t:'\u2192'},{A:28,s:'Si'},{t:'+'},{A:4,s:'He'}],
        mass:'31.989829 u in \u2192 31.979530 u out \u00b7 +9.6 MeV', nIn:32, nOut:32,
        note:'Six months of fuel, in a star that spent seven million years on hydrogen.' },
  silicon:{ eq:[{t:'2'},{A:28,s:'Si'},{t:'\u2192'},{A:56,s:'Ni'},{t:'\u2192'},{A:56,s:'Fe'}],
        mass:'the ladder pays 49.4 MeV \u00b7 melting the fuel costs 38.5 MeV', nIn:56, nOut:56,
        note:'You have to destroy one silicon nucleus to supply the alphas that build the other one up.' },
  iron:{ eq:[{A:56,s:'Fe'},{t:'+ \u03b3 \u2192 13'},{A:4,s:'He'},{t:'+ 4n'}],
        mass:'\u2212124.4 MeV \u00b7 the core is paying, not earning', nIn:56, nOut:56, endo:true,
        note:'Then e\u207b + p \u2192 n + \u03bd removes the electrons whose pressure was holding the core up. Collapse takes about a quarter of a second.' },
  sunend:{ eq:[{A:12,s:'C'},{t:'+'},{A:12,s:'C'},{t:'\u2192  nothing'}],
        mass:'would release +4.6 MeV \u2014 if it could ever start', nIn:24, nOut:24, endo:true,
        note:'A star needs roughly eight solar masses before gravity can squeeze a core to carbon-burning temperature.' },
  locked:{ eq:[{t:'never happens in the Sun'}],
        mass:'', nIn:0, nOut:0, endo:true,
        note:'A more massive star runs this stage. Switch stars to watch it.' }
};

function drawLedger(ctx, stg){
  var L = LEDGER[stg.scene];
  ctx.beginPath(); ctx.moveTo(12, LEDGER_Y-6); ctx.lineTo(CHM_W-12, LEDGER_Y-6);
  ctx.strokeStyle='rgba(232,228,217,0.13)'; ctx.lineWidth=1; ctx.stroke();

  txt(ctx, 'MASS LEDGER', 14, LEDGER_Y+13, 13, INK_MUTE, 'left', '600', true);
  drawEq(ctx, L.eq, 14, LEDGER_Y+38, 17, L.endo?'#D9BDB6':INK, 'left');
  if (L.mass) txt(ctx, L.mass, 14, LEDGER_Y+58, 13.5, INK_MUTE, 'left', '500');
  if (NOTES.chm) wrapTxt(ctx, L.note, 14, LEDGER_Y+80, CHM_W-176, 17, 13.5, INK_SEC);

  if (L.nIn > 0){
    var rx = CHM_W - 14;
    txt(ctx, 'NUCLEONS', rx, LEDGER_Y+13, 12.5, INK_MUTE, 'right', '600', true);
    txt(ctx, L.nIn + ' \u2192 ' + L.nOut, rx, LEDGER_Y+40, 22, C_EXO, 'right', '700', true);
    txt(ctx, 'protons + neutrons', rx, LEDGER_Y+58, 12.5, INK_MUTE, 'right', '500');
    txt(ctx, 'always conserved', rx, LEDGER_Y+74, 12.5, INK_MUTE, 'right', '500');
  }
}

function wrapTxt(ctx, s, x, y, maxw, lh, size, color, align){
  ctx.font = '500 ' + size + 'px ' + BODY;
  var words = s.split(' '), line='', lines=[], i;
  for (i=0;i<words.length;i++){
    var t = line ? line+' '+words[i] : words[i];
    if (ctx.measureText(t).width > maxw && line){ lines.push(line); line = words[i]; } else line = t;
  }
  if (line) lines.push(line);
  for (i=0;i<lines.length;i++) txt(ctx, lines[i], x, y+i*lh, size, color, align||'left', '500');
  return lines.length;
}

/* ══ CUTAWAY ══════════════════════════════════════════════════════════ */
var CUT_CX = 180, CUT_CY = 196;
var SHELL_ANG = [-1.90, -1.35, -0.80, -0.25, 0.30, 0.85, 2.20];

function drawCutaway(ctx, ts, S){
  if (S.journey && S.star.key === 'sun'){ drawJourney(ctx, ts, S); return; }

  var cx = CUT_CX, cy = CUT_CY, star = S.star, sh = star.shells, i;

  if (S.endPlaying || S.endDone){
    var el = S.endDone ? 99999 : ts - S.endStart;
    if (star.key === 'sun') drawSunEnding(ctx, el, ts, S);
    else                    drawCollapse(ctx, el, ts, S);
    return;
  }

  for (i = sh.length-1; i >= 0; i--){
    var a = S.ringAlpha[sh[i].s];
    if (a <= 0.004) continue;
    ctx.beginPath(); ctx.arc(cx, cy, sh[i].r, 0, 6.2832);
    ctx.fillStyle = 'rgba(' + star.stages[sh[i].s].fill.join(',') + ',' + a + ')'; ctx.fill();
  }
  var last = sh[sh.length-1];
  if (S.ringAlpha[last.s] > 0.05){
    ctx.beginPath(); ctx.arc(cx, cy, 15, 0, 6.2832);
    ctx.fillStyle = star.key === 'sun'
      ? 'rgba(210,232,255,' + Math.min(0.9, S.ringAlpha[last.s]) + ')'
      : 'rgba(255,247,232,' + Math.min(0.92, S.ringAlpha[last.s]+0.05) + ')';
    ctx.fill();
  }

  for (i = 0; i < sh.length; i++){
    var slot = sh[i].s;
    if (slot > S.slot) continue;
    var rOut = sh[i].r, rIn = (i === sh.length-1) ? 0 : sh[i+1].r;
    var rm = (i === sh.length-1) ? 26 : (rOut+rIn)/2;
    var th = SHELL_ANG[slot];
    var lit = (slot === S.slot);
    chipTxt(ctx, star.stages[slot].ring, cx + rm*Math.cos(th), cy + rm*Math.sin(th) + 5,
            lit?16.5:14, lit ? star.stages[slot].accent : 'rgba(232,228,217,0.62)', 'center', '700');
  }

  var cur = star.stages[S.slot];
  if (cur.on){
    var pulse = 0.5 + 0.5*Math.sin(ts * (cur.ending ? 0.009 : 0.0022));
    var rr = 0;
    for (i = 0; i < sh.length; i++) if (sh[i].s === S.slot) rr = sh[i].r;
    if (rr){
      ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.2832);
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.18 + pulse*0.24) + ')';
      ctx.lineWidth = 1.7; ctx.stroke();
    }
  }
  ctx.beginPath(); ctx.arc(cx, cy, sh[0].r, 0, 6.2832);
  ctx.strokeStyle='rgba(232,228,217,0.15)'; ctx.lineWidth=0.9; ctx.stroke();

  var lbl = cur.shellLabel ? cur.shellLabel
            : (cur.on ? ('burning shell: ' + cur.ring) : 'this shell never forms');
  chipTxt(ctx, lbl, cx, CUT_H-22, 14.5, cur.accent, 'center', '700');
  var nOn = 0;
  for (i = 0; i < NSLOT; i++) if (star.stages[i].on) nOn++;
  txt(ctx, star.name + ' \u00b7 ' + nOn + ' fusion stages in total', cx, CUT_H-2, 13, INK_MUTE, 'center', '500');
}

/* ── HS-ESS1-1: how the energy actually gets out, and then to Earth ──── */
function drawJourney(ctx, ts, S){
  var cx = 152, cy = 170, R = 116;
  txt(ctx, 'The Sun today, while it burns hydrogen', CUT_W/2, 20, 13.5, INK_SEC, 'center', '600');

  var zones = [
    { r:R,       c:'rgba(226,168,92,0.30)',  lbl:'convective zone', sub:'boiling plasma carries it' },
    { r:R*0.70,  c:'rgba(214,132,60,0.42)',  lbl:'radiative zone',  sub:'light, absorbed and re-emitted' },
    { r:R*0.25,  c:'rgba(255,238,190,0.95)', lbl:'core',            sub:'fusion happens only here' }
  ];
  for (var i = 0; i < zones.length; i++){
    ctx.beginPath(); ctx.arc(cx, cy, zones[i].r, 0, 6.2832);
    ctx.fillStyle = zones[i].c; ctx.fill();
  }
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 6.2832);
  ctx.strokeStyle='rgba(255,224,160,0.55)'; ctx.lineWidth=1.6; ctx.stroke();

  /* the random walk — a real one, seeded so it never shimmers */
  var s = 22222, px = cx, py = cy, path = [];
  for (i = 0; i < 260; i++){
    s = (s*1664525 + 1013904223) >>> 0;
    var th = (s % 6283) / 1000;
    px += Math.cos(th) * 7.2; py += Math.sin(th) * 7.2;
    var d = Math.hypot(px-cx, py-cy);
    if (d > R*0.97){ px = cx + (px-cx)/d*R*0.97; py = cy + (py-cy)/d*R*0.97; }
    path.push([px, py]);
  }
  var head = Math.floor(((ts*0.00022) % 1) * path.length);
  ctx.beginPath();
  for (i = 0; i <= head; i++) i ? ctx.lineTo(path[i][0], path[i][1]) : ctx.moveTo(cx, cy);
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.4; ctx.stroke();
  if (head > 0){
    ctx.beginPath(); ctx.arc(path[head][0], path[head][1], 3.4, 0, 6.2832);
    ctx.fillStyle = '#FFF7E8'; ctx.fill();
  }

  for (i = 0; i < zones.length; i++){
    var ly = cy - zones[i].r + (i===2 ? 26 : 16);
    chipTxt(ctx, zones[i].lbl, cx, ly, 13, INK, 'center', '700');
  }

  /* the straight-line neutrino, for contrast */
  var np = ((ts*0.0009) % 1);
  drawLite(ctx, cx + (R+64)*np, cy + 78 - 34*np, 'nu', { alpha: 0.85 });
  txt(ctx, 'neutrino escapes the Sun:  ~2 s', 14, CUT_H-92, 13.5, C_NU, 'left', '600');
  txt(ctx, 'light, straight out:  2.3 s', 14, CUT_H-70, 13.5, INK_SEC, 'left', '500');
  txt(ctx, 'light, absorbed and re-emitted:  ~170,000 yr', 14, CUT_H-48, 14, C_PHOTON, 'left', '700');
  txt(ctx, 'surface to Earth:  8 min 20 s', 14, CUT_H-26, 13.5, INK_SEC, 'left', '500');

  /* Earth, off to the side */
  ctx.beginPath(); ctx.arc(CUT_W-26, 92, 7, 0, 6.2832);
  ctx.fillStyle = '#5B8FB9'; ctx.fill();
  txt(ctx, 'Earth', CUT_W-26, 114, 12.5, INK_MUTE, 'center', '500');
  arrow(ctx, cx+R+10, 106, CUT_W-40, 96, 'rgba(255,224,160,0.45)', 1.6, 0.9);
}

function drawCollapse(ctx, e, ts, S){
  var cx = CUT_CX, cy = CUT_CY, sh = S.star.shells, i;
  var v = collapseVisual(e);
  for (i = sh.length-1; i >= 1; i--){
    var a = S.star.alpha[sh[i].s] * (1 - v.outerFade);
    if (a <= 0.004) continue;
    ctx.beginPath(); ctx.arc(cx, cy, sh[i-1].r, 0, 6.2832);
    ctx.fillStyle = 'rgba(' + S.star.stages[sh[i-1].s].fill.join(',') + ',' + a + ')'; ctx.fill();
  }
  var cc = (S.endDone || e > 1200) ? '255,247,232' : '232,65,58';
  ctx.beginPath(); ctx.arc(cx, cy, Math.max(v.coreR,2), 0, 6.2832);
  ctx.fillStyle = 'rgba(' + cc + ',0.95)'; ctx.fill();
  if (S.endDone){
    var pu = 0.6 + 0.4*Math.sin(ts*0.003);
    var gr = ctx.createRadialGradient(cx,cy,0,cx,cy,42*pu);
    gr.addColorStop(0,'rgba(180,210,255,0.5)'); gr.addColorStop(1,'rgba(180,210,255,0)');
    ctx.beginPath(); ctx.arc(cx,cy,42*pu,0,6.2832); ctx.fillStyle=gr; ctx.fill();
  }
  if (v.shockOpacity > 0.005){
    ctx.beginPath(); ctx.arc(cx,cy,v.shockR,0,6.2832);
    ctx.strokeStyle='rgba(255,210,150,'+v.shockOpacity+')'; ctx.lineWidth=3; ctx.stroke();
  }
  if (v.flashOpacity > 0.005){
    ctx.beginPath(); ctx.arc(cx,cy,260,0,6.2832);
    ctx.fillStyle='rgba(255,250,235,'+v.flashOpacity+')'; ctx.fill();
  }
  chipTxt(ctx, v.phase, cx, CUT_H-22, 14.5, v.phaseCol||INK, 'center', '700');
  if (v.sub) txt(ctx, v.sub, cx, CUT_H-2, 13, INK_MUTE, 'center', '500');
}

function collapseVisual(e){
  var coreR=44, shockR=0, shockOpacity=0, flashOpacity=0, outerFade=0, phase='', sub='', pc=INK;
  if (e < 1200){
    coreR = lerp(44, 7, clamp01(e/1200)*clamp01(e/1200));
    phase='photodisintegration + electron capture'; pc=C_ENDO;
    sub='the pressure holding the core up is being removed';
  } else if (e < 1600){
    var p1=clamp01((e-1200)/400);
    coreR=lerp(7,13,p1); shockR=lerp(7,30,p1); shockOpacity=0.7*(1-p1*0.3);
    phase='nuclear density \u2014 the core bounces'; sub='infall halts in about a millisecond';
  } else if (e < 3100){
    var p2=clamp01((e-1600)/1500);
    coreR=13; shockR=lerp(30,45,p2); shockOpacity=lerp(0.55,0.15,p2);
    phase='the shock stalls'; sub='it runs out of energy tearing through infalling iron'; pc='#F0C24A';
  } else if (e < 3600){
    coreR=13; shockR=45; shockOpacity=0.15+0.05*Math.sin(e*0.02);
    phase='neutrinos pour out of the new core'; sub='a fraction are reabsorbed behind the shock'; pc='#7FB6D8';
  } else if (e < 5400){
    var p3=clamp01((e-3600)/1800);
    coreR=13; shockR=lerp(45,220,p3); shockOpacity=lerp(0.15,0.8,p3);
    phase='the shock is revived'; sub='this mechanism is simplified \u2014 and still an open question'; pc='#7ECB8F';
  } else if (e < 5700){
    var p4=clamp01((e-5400)/300);
    coreR=13; shockR=220; shockOpacity=0.8; flashOpacity=Math.sin(p4*Math.PI)*0.85;
    phase='supernova'; pc='#FFF7E8'; sub='everything heavier than iron is made from here on';
  } else if (e < 7200){
    coreR=12; shockR=220; outerFade=clamp01((e-5700)/1500);
    phase='the envelope is thrown off'; sub='the star seeds its galaxy with the elements it made';
  } else {
    coreR=12; outerFade=1; phase='neutron star';
    sub='about 20 km across, denser than an atomic nucleus'; pc='#B4D2FF';
  }
  return { coreR:coreR, shockR:shockR, shockOpacity:shockOpacity, flashOpacity:flashOpacity,
           outerFade:outerFade, phase:phase, sub:sub, phaseCol:pc };
}

/* The Sun's ending: no explosion. It drifts apart. */
function drawSunEnding(ctx, e, ts, S){
  var cx = CUT_CX, cy = CUT_CY;
  var phase, sub, pc = INK, envR = 168, envA = 0.30, coreR = 58, ring = 0, ringA = 0;
  if (e < 1600){
    var p0 = clamp01(e/1600);
    envR = lerp(168, 260, p0); envA = lerp(0.30, 0.14, p0);
    phase = 'the Sun swells into a red giant'; pc = '#E8A87C';
    sub = 'it will reach past Earth\u2019s orbit';
  } else if (e < 4200){
    var p1 = clamp01((e-1600)/2600);
    envR = 260; envA = lerp(0.14, 0, p1); ring = lerp(120, 250, p1); ringA = lerp(0.55, 0.14, p1);
    coreR = lerp(58, 20, p1);
    phase = 'the outer layers drift away'; pc = '#9CB6D6';
    sub = 'a planetary nebula \u2014 pushed off gently, not blown off';
  } else {
    coreR = 20; ring = 250; ringA = 0.10; envA = 0;
    phase = 'white dwarf'; pc = '#B4D2FF';
    sub = 'about the size of Earth, and it will simply cool from here';
  }
  if (envA > 0.004){
    ctx.beginPath(); ctx.arc(cx, cy, envR, 0, 6.2832);
    ctx.fillStyle = 'rgba(232,150,90,' + envA + ')'; ctx.fill();
  }
  if (ringA > 0.004){
    ctx.beginPath(); ctx.arc(cx, cy, ring, 0, 6.2832);
    ctx.strokeStyle = 'rgba(156,182,214,' + ringA + ')'; ctx.lineWidth = 14; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(cx, cy, coreR, 0, 6.2832);
  ctx.fillStyle = 'rgba(156,182,214,0.55)'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, coreR*0.42, 0, 6.2832);
  ctx.fillStyle = 'rgba(226,240,255,0.95)'; ctx.fill();
  if (e >= 4200){
    var pu = 0.6 + 0.4*Math.sin(ts*0.003);
    var gr = ctx.createRadialGradient(cx,cy,0,cx,cy,40*pu);
    gr.addColorStop(0,'rgba(190,220,255,0.42)'); gr.addColorStop(1,'rgba(190,220,255,0)');
    ctx.beginPath(); ctx.arc(cx,cy,40*pu,0,6.2832); ctx.fillStyle=gr; ctx.fill();
  }
  chipTxt(ctx, phase, cx, CUT_H-22, 14.5, pc, 'center', '700');
  txt(ctx, sub, cx, CUT_H-2, 13, INK_MUTE, 'center', '500');
}

/* ══ BINDING ENERGY CURVE ═════════════════════════════════════════════ */
var PX0=56, PX1=400, PY0=50, PY1=286, VMAX=9.4;
var LOGA = Math.log(238)/Math.LN10;
function xOfA(A){ return PX0 + (Math.log(A)/Math.LN10 / LOGA) * (PX1-PX0); }
function yOfV(v){ return PY1 - (v/VMAX)*(PY1-PY0); }

function drawCurve(ctx, S){
  ctx.clearRect(0, 0, RGT_W, RGT_H);
  var i;
  txt(ctx, 'binding energy per nucleon (MeV)', PX0-6, 26, 14, INK_SEC, 'left', '600');

  for (var v = 0; v <= 8; v += 2){
    var yy = yOfV(v);
    ctx.beginPath(); ctx.moveTo(PX0,yy); ctx.lineTo(PX1,yy);
    ctx.strokeStyle='rgba(232,228,217,'+(v===0?0.22:0.07)+')'; ctx.lineWidth=1; ctx.stroke();
    txt(ctx, String(v), PX0-8, yy+5, 13, INK_MUTE, 'right', '500', true);
  }
  var ticks = [1,2,5,10,20,50,100,200];
  for (i=0;i<ticks.length;i++){
    var xx = xOfA(ticks[i]);
    ctx.beginPath(); ctx.moveTo(xx,PY1); ctx.lineTo(xx,PY1+5);
    ctx.strokeStyle='rgba(232,228,217,0.22)'; ctx.lineWidth=1; ctx.stroke();
    txt(ctx, String(ticks[i]), xx, PY1+20, 13, INK_MUTE, 'center', '500', true);
  }
  txt(ctx, 'mass number A  (log scale)', (PX0+PX1)/2, PY1+38, 13.5, INK_MUTE, 'center', '500');

  ctx.beginPath();
  for (i=0;i<CURVE.length;i++){
    var X = xOfA(CURVE[i][0]), Y = yOfV(CURVE[i][1]);
    i ? ctx.lineTo(X,Y) : ctx.moveTo(X,Y);
  }
  ctx.strokeStyle='rgba(232,228,217,0.55)'; ctx.lineWidth=2; ctx.stroke();
  for (i=0;i<CURVE.length;i++){
    ctx.beginPath(); ctx.arc(xOfA(CURVE[i][0]), yOfV(CURVE[i][1]), 2.4, 0, 6.2832);
    ctx.fillStyle='rgba(232,228,217,0.45)'; ctx.fill();
  }

  /* BOTH stopping points, always. Two marks on one curve is the standard. */
  var stops = [
    { A:16, v:7.976, lbl:'the Sun stops here',        col:'#9CB6D6', row:214, mine:S.star.key==='sun' },
    { A:56, v:8.790, lbl:'a massive star stops here', col:'#f8584a', row:178, mine:S.star.key==='massive' }
  ];
  for (i = 0; i < 2; i++){
    var st = stops[i], sx = xOfA(st.A), sy = yOfV(st.v);
    ctx.beginPath(); ctx.moveTo(sx, sy+6); ctx.lineTo(sx, st.row-9);
    ctx.setLineDash([3,4]);
    ctx.strokeStyle = st.mine ? st.col : 'rgba(232,228,217,0.22)';
    ctx.lineWidth = st.mine ? 1.5 : 1; ctx.stroke(); ctx.setLineDash([]);
    ctx.font = '700 ' + (st.mine?13.5:12.5) + 'px ' + BODY;
    var half = ctx.measureText(st.lbl).width/2 + 10;
    chipTxt(ctx, st.lbl, Math.max(PX0+half-40, Math.min(PX1-half+30, sx)), st.row,
            st.mine?13.5:12.5, st.mine ? st.col : 'rgba(232,228,217,0.45)', 'center',
            st.mine?'700':'500');
  }

  /* stage markers for the current star only */
  for (i = 0; i < NSLOT; i++){
    var stg = S.star.stages[i];
    if (!stg.on) continue;
    var idx = stg.ci, A2 = CURVE[idx][0], val = CURVE[idx][1];
    var lv = S.curveLevel[i], X2 = xOfA(A2), Y2 = yOfV(val);
    ctx.beginPath(); ctx.arc(X2, Y2, lerp(3.4, 7, lv), 0, 6.2832);
    ctx.fillStyle = lv>0.6 ? stg.accent : 'rgba('+stg.fill.join(',')+','+lerp(0.45,1,lv)+')';
    ctx.fill();
    if (lv > 0.55 || i === S.slot)
      chipTxt(ctx, CURVE[idx][2], X2, Y2-15, 15,
              'rgba(232,228,217,'+lerp(0.55,1,lv)+')', 'center', '700');
  }

  var ay = 356, fx = xOfA(56);
  arrow(ctx, PX0+6, ay, fx-26, ay, 'rgba(126,203,143,0.7)', 1.8);
  arrow(ctx, PX1-2, ay, fx+26, ay, 'rgba(160,140,198,0.7)', 1.8);
  txt(ctx, 'fusion releases energy \u2192', PX0+6, ay-9, 13, 'rgba(126,203,143,0.9)', 'left', '600');
  txt(ctx, '\u2190 fission', PX1-2, ay-9, 13, 'rgba(160,140,198,0.9)', 'right', '600');
  txt(ctx, 'Fe', fx, ay+5, 14, INK, 'center', '700');

  var msg;
  if (S.star.key === 'sun')
    msg = 'The Sun climbs the first stretch of this curve and no further. Everything to the right of oxygen was made by heavier stars.';
  else
    msg = 'A massive star climbs all the way to the peak. Nothing above iron is higher, in either direction \u2014 so the climbing stops.';
}
</script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   THE HILL — why each stage needs a hotter core, without the arithmetic.
   Barrier heights are still computed from Z₁Z₂e²/4πε₀R; only the display is
   qualitative. The height a student sees is real, the MeV label is gone.
   ══════════════════════════════════════════════════════════════════════════ */
function drawHill(ctx, S){
  ctx.clearRect(0, 0, RGT_W, RGT_H);
  var i, star = S.star;
  txt(ctx, 'Repulsion barrier each stage must overcome', 14, 26, 14, INK_SEC, 'left', '600');
  txt(ctx, 'hill height \u221d Z\u2081Z\u2082 / separation', 14, 48, 13, INK_MUTE, 'left', '500', true);

  var GY = 300, x0 = 24, x1 = RGT_W - 18, span = (x1-x0)/NSLOT;
  var maxB = barrierMeV(SLOT_PAIR[6]);
  var HMAX = 176;

  for (i = 0; i < NSLOT; i++){
    var stg = star.stages[i];
    /* A stage may name a different reaction than its slot's default — the Sun's
       last card is the carbon hill it can never climb, not an iron one. */
    var B = barrierMeV(SLOT_PAIR[stg.hillPair !== undefined ? stg.hillPair : i]);
    var climbs = stg.on && !stg.hillCant;
    var h = Math.pow(B/maxB, 0.42) * HMAX;
    var cxi = x0 + span*(i+0.5), w = span*0.86;
    var cur = (i === S.slot);

    /* the hill */
    ctx.beginPath();
    ctx.moveTo(cxi - w/2, GY);
    ctx.bezierCurveTo(cxi - w*0.22, GY, cxi - w*0.16, GY-h, cxi, GY-h);
    ctx.bezierCurveTo(cxi + w*0.16, GY-h, cxi + w*0.22, GY, cxi + w/2, GY);
    ctx.closePath();
    if (!climbs){
      ctx.fillStyle = 'rgba(232,228,217,0.07)'; ctx.fill();
      ctx.setLineDash([3,3]);
      ctx.strokeStyle = 'rgba(248,88,74,0.42)'; ctx.lineWidth = 1.3; ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle = cur ? stg.accent : 'rgba(' + stg.fill.join(',') + ',0.42)';
      ctx.fill();
    }

    /* the ball — same size every time; only the hill changes */
    var by = GY - h - 9;
    ctx.beginPath(); ctx.arc(cxi, climbs ? by : GY - h*0.34, 6, 0, 6.2832);
    ctx.fillStyle = climbs ? '#FFF7E8' : 'rgba(248,88,74,0.75)'; ctx.fill();
    if (!climbs) txt(ctx, 'can\u2019t', cxi, GY - h*0.34 + 22, 12.5, C_ENDO, 'center', '700');

    txt(ctx, stg.ring, cxi, GY+18, 13.5, cur?INK:INK_MUTE, 'center', '600');
    var tl = climbs ? stg.temp : (stg.needT || stg.temp);
    txt(ctx, tl.replace(' K',''), cxi, GY+35, 12, cur?INK_SEC:INK_MUTE, 'center', '500', true);
  }
  ctx.beginPath(); ctx.moveTo(x0, GY); ctx.lineTo(x1, GY);
  ctx.strokeStyle='rgba(232,228,217,0.28)'; ctx.lineWidth=1.2; ctx.stroke();
  txt(ctx, 'core temperature needed (K)', RGT_W/2, GY+53, 12.5, INK_MUTE, 'center', '500');

  var msg;
  if (star.key === 'sun')
    msg = 'The Sun can get over the first two hills and no further. Those dashed hills are the ones its core is never hot enough to climb \u2014 which is exactly why those stages are greyed out below.';
  else
    msg = 'A massive star has enough gravity to squeeze its core hotter and hotter, so it clears every hill \u2014 right up to iron, where climbing stops being worth it.';
}

/* ══ STATE ════════════════════════════════════════════════════════════ */
var S = {
  star: SUN, slot: 0, p: 0, playing: false, ctxTab: 'star', scaleMode: 'log', ref: 'real', tab: 'sun',
  legend: false, journey: false, endPlaying: false, endDone: false, endStart: 0,
  ringAlpha: [0,0,0,0,0,0,0], curveLevel: [1,0,0,0,0,0,0], last: 0
};
var SCENE_SEC = { pp:13, cno:11, triple:9, triple_sun:13, carbon:7, neon:9,
                  oxygen:7, silicon:12, iron:10, sunend:8, locked:8 };
var END_MS = { sun: 5600, massive: 7200 };
var CTX_W = 420, CTX_H = 420;
var $ = function(id){ return document.getElementById(id); };

/* short durations for the stage buttons */
var SHORT_DUR = { '10 billion yr':'10 B yr', '100 million yr':'100 M yr', '6 months':'6 mo', 'forever':'no fusion' };
function shortDur(st){ return st.on ? (SHORT_DUR[st.duration] || st.duration) : 'never'; }

/* elements made at each slot (fuel H is present from the start) */
var ELEMS = ['H','He','C','O','Ne','Mg','Si','S','Fe'];
var MADE = {
  sun:     [['He'], ['C','O'], [], [], [], [], []],
  massive: [['He'], ['C','O'], ['Ne','Mg'], ['O','Mg'], ['Si','S'], ['Fe'], []]
};

function drawLegend(ctx){
  ctx.fillStyle = 'rgba(30,35,32,0.94)'; ctx.fillRect(0, 0, CHM_W, SC_BOT+2);
  txt(ctx, 'What the pieces are', 24, 42, 17, INK, 'left', '700');
  var rows = [
    ['p','proton — how many there are decides which element it is'],
    ['n','neutron — changes the isotope, not the element'],
    ['g','gamma ray — light. Above 10⁹ K it can break nuclei apart'],
    ['nu','neutrino — leaves the star almost instantly, carrying energy off'],
    ['e+','positron — emitted when a proton turns into a neutron'],
    ['e-','electron — its pressure holds a dying core up, until it cannot']
  ];
  for (var i = 0; i < rows.length; i++){
    var y = 78 + i*36, k = rows[i][0];
    if (k==='p'){ ctx.beginPath(); ctx.arc(38,y-5,8,0,6.2832); ctx.fillStyle=C_PROTON; ctx.fill(); }
    else if (k==='n'){ ctx.beginPath(); ctx.arc(38,y-5,8,0,6.2832); ctx.fillStyle=C_NEUTRON; ctx.fill(); }
    else if (k==='g'){ drawPhoton(ctx, 22, y-5, 54, y-5, { amp:4, wl:9, lw:2 }); }
    else drawLite(ctx, 38, y-5, k, {});
    txt(ctx, rows[i][1], 68, y, 14, INK_SEC, 'left', '500');
  }
  txt(ctx, 'Nuclei are drawn with every one of their protons and neutrons, at true count.',
      24, 282, 13.5, INK_MUTE, 'left', '500');
}

/* ══ CANVAS SIZING ════════════════════════════════════════════════════
   Both panels draw in fixed logical spaces (chamber 520×420, context
   420×420) and are scaled together so their text stays in proportion. */
var DPR = Math.min(window.devicePixelRatio || 1, 2), K = 1;
var chmCv = $('chmCanvas'), ctxCv = $('ctxCanvas'), chmX = chmCv.getContext('2d'), ctxX = ctxCv.getContext('2d');
function layout(){
  var st = $('stage').getBoundingClientRect();
  var availW = st.width - 20 - 12, availH = st.height - 14 - 32;
  K = Math.max(0.6, Math.min(1.8, availW / (CHM_W + CTX_W), availH / CHM_H));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  [[chmCv, CHM_W, CHM_H], [ctxCv, CTX_W, CTX_H]].forEach(function(a){
    a[0].style.width = Math.round(a[1]*K) + 'px'; a[0].style.height = Math.round(a[2]*K) + 'px';
    a[0].width = Math.round(a[1]*K*DPR); a[0].height = Math.round(a[2]*K*DPR);
  });
  $('pChm').style.width = Math.round(CHM_W*K) + 'px';
  $('pCtx').style.width = Math.round(CTX_W*K) + 'px';
  drawAll(performance.now());
}

/* ══ DRAWING ══════════════════════════════════════════════════════════ */
function renderChamber(c, ts){
  if (S.legend){ c.clearRect(0,0,CHM_W,CHM_H); drawLegend(c); drawLedger(c, S.star.stages[S.slot]); }
  else drawChamber(c, S.p, ts, S.star, S.slot);
}
function renderContext(c, ts, tab){
  c.clearRect(0, 0, CTX_W, CTX_H);
  tab = tab || S.ctxTab;
  if (tab === 'curve') drawCurve(c, S);
  else if (tab === 'hill') drawHill(c, S);
  else {
    S.journey = (tab === 'journey');
    c.save(); c.translate((CTX_W - CUT_W) / 2, 0);
    drawCutaway(c, ts, S);
    c.restore();
    if (tab === 'star' && !S.endPlaying && !S.endDone){
      if (S.star.key === 'sun' && S.slot === 0) drawSunToday(c, ts);
      else drawCoreGlow(c, ts);
      chipTxt(c, 'SHELLS NOT TO SCALE', 10, 22, 12, 'rgba(232,228,217,0.62)', 'left', '700');
    }
    S.journey = false;
  }
}
/* core glow: brighter and whiter for hotter cores (log of core temperature) */
function drawCoreGlow(c, ts){
  var stg = S.star.stages[S.slot]; if (!stg.on) return;
  var f = clamp01((Math.log(stg.tempK)/Math.LN10 - 7) / 3), cx = CTX_W/2, cy = CUT_CY;
  var pulse = 0.92 + 0.08*Math.sin(ts*0.003), R = (18 + f*26) * pulse;
  var g = c.createRadialGradient(cx, cy, 0, cx, cy, R);
  var col = f < 0.5 ? '255,214,140' : '255,240,225';
  g.addColorStop(0, 'rgba(' + col + ',' + (0.55 + 0.4*f).toFixed(2) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
  c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.fill(); c.restore();
}
/* the Sun during hydrogen burning: core, radiative zone, convective zone */
function drawSunToday(c, ts){
  var cx = CTX_W/2, cy = CUT_CY, R = 168;
  c.save();
  c.fillStyle = '#222723'; c.fillRect(0, 0, CTX_W, CUT_H - 40);
  var zones = [[R, 'rgba(226,168,92,0.30)'], [R*0.70, 'rgba(214,132,60,0.45)'], [R*0.25, 'rgba(255,226,160,0.92)']];
  zones.forEach(function(z){ c.beginPath(); c.arc(cx, cy, z[0], 0, 6.2832); c.fillStyle = z[1]; c.fill(); });
  for (var i = 0; i < 26; i++){
    var a = i/26*6.2832 + ts*0.00005, r0 = R*0.74, r1 = R*0.97;
    c.beginPath(); c.arc(cx + Math.cos(a)*(r0+r1)/2, cy + Math.sin(a)*(r0+r1)/2, (r1-r0)/2, a + 1.5708, a - 1.5708);
    c.strokeStyle = 'rgba(255,214,150,0.10)'; c.lineWidth = 1; c.stroke();
  }
  c.beginPath(); c.arc(cx, cy, R, 0, 6.2832); c.strokeStyle = 'rgba(255,224,160,0.55)'; c.lineWidth = 1.6; c.stroke();
  c.restore();
  drawCoreGlow(c, ts);
  chipTxt(c, 'convective zone', cx, cy - R + 24, 13, INK, 'center', '700');
  chipTxt(c, 'radiative zone', cx, cy - R*0.70 + 26, 13, INK, 'center', '700');
  chipTxt(c, 'core \u00b7 H \u2192 He', cx, cy + 5, 13, '#FFF1D0', 'center', '700');
}
function drawAll(ts){
  chmX.setTransform(DPR*K, 0, 0, DPR*K, 0, 0); renderChamber(chmX, ts);
  ctxX.setTransform(DPR*K, 0, 0, DPR*K, 0, 0); renderContext(ctxX, ts);
}

function tick(ts){
  if (!S.last) S.last = ts;
  var dt = Math.min(0.05, (ts - S.last)/1000); S.last = ts;
  var sec = SCENE_SEC[S.star.stages[S.slot].scene] || 9;
  if (S.playing && !S.legend && !capturing){
    S.p += dt/sec;
    if (S.p >= 1){ S.p = 1; S.playing = false; refreshControls(); }
    $('scrub').value = Math.round(S.p*1000);
  }
  for (var i = 0; i < NSLOT; i++){
    var stg = S.star.stages[i];
    var vis = stg.on && i <= S.slot;
    var target = (S.endPlaying || S.endDone) ? S.ringAlpha[i] : (vis ? S.star.alpha[i] : 0);
    S.ringAlpha[i] += (target - S.ringAlpha[i]) * 0.14;
    S.curveLevel[i] += ((i === S.slot ? 1 : 0.3) - S.curveLevel[i]) * 0.14;
  }
  if (!capturing) drawAll(ts);
  if (S.endPlaying && ts - S.endStart >= END_MS[S.star.key]) finishEnding();
  requestAnimationFrame(tick);
}

/* ══ SNAPS + TIMELINE ════════════════════════════════════════════════ */
function snapDefs(){
  if (S.ref === 'essrt') return ESSRT_ROWS.map(function(r){
