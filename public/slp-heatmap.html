<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const CLIMO_START   = 1991;
const CLIMO_END     = 2025;
const TOTAL_YEARS   = CLIMO_END - CLIMO_START + 1;
const CANVAS_HEIGHT = 504; // 21px × 24

const MB_MIN = 960;
const MB_MAX = 1040;

const STATIONS = {
  KISP: { label: 'Islip, NY',              tz: 'America/New_York',    tzLabel: 'Eastern' },
  KJFK: { label: 'New York City, NY',      tz: 'America/New_York',    tzLabel: 'Eastern' },
  KBOS: { label: 'Boston, MA',             tz: 'America/New_York',    tzLabel: 'Eastern' },
  KPHL: { label: 'Philadelphia, PA',       tz: 'America/New_York',    tzLabel: 'Eastern' },
  KDCA: { label: 'Washington, DC',         tz: 'America/New_York',    tzLabel: 'Eastern' },
  KBUF: { label: 'Buffalo, NY',            tz: 'America/New_York',    tzLabel: 'Eastern' },
  KBGR: { label: 'Bangor, ME',             tz: 'America/New_York',    tzLabel: 'Eastern' },
  KBTV: { label: 'Burlington, VT',         tz: 'America/New_York',    tzLabel: 'Eastern' },
  KORD: { label: 'Chicago, IL',            tz: 'America/Chicago',     tzLabel: 'Central' },
  KDTW: { label: 'Detroit, MI',            tz: 'America/New_York',    tzLabel: 'Eastern' },
  KMSP: { label: 'Minneapolis, MN',        tz: 'America/Chicago',     tzLabel: 'Central' },
  KTPA: { label: 'Tampa, FL',              tz: 'America/New_York',    tzLabel: 'Eastern' },
  KMCO: { label: 'Orlando, FL',            tz: 'America/New_York',    tzLabel: 'Eastern' },
  KMIA: { label: 'Miami, FL',              tz: 'America/New_York',    tzLabel: 'Eastern' },
  KATL: { label: 'Atlanta, GA',            tz: 'America/New_York',    tzLabel: 'Eastern' },
  KCLT: { label: 'Charlotte, NC',          tz: 'America/New_York',    tzLabel: 'Eastern' },
  KMSY: { label: 'New Orleans, LA',        tz: 'America/Chicago',     tzLabel: 'Central' },
  KIAH: { label: 'Houston, TX',            tz: 'America/Chicago',     tzLabel: 'Central' },
  KDFW: { label: 'Dallas / Ft. Worth, TX', tz: 'America/Chicago',     tzLabel: 'Central' },
  KOKC: { label: 'Oklahoma City, OK',      tz: 'America/Chicago',     tzLabel: 'Central' },
  KDEN: { label: 'Denver, CO',             tz: 'America/Denver',      tzLabel: 'Mountain' },
  KPHX: { label: 'Phoenix, AZ',            tz: 'America/Phoenix',     tzLabel: 'Arizona' },
  KSLC: { label: 'Salt Lake City, UT',     tz: 'America/Denver',      tzLabel: 'Mountain' },
  KLAX: { label: 'Los Angeles, CA',        tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
  KSFO: { label: 'San Francisco, CA',      tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
  KSEA: { label: 'Seattle, WA',            tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
  PANC: { label: 'Anchorage, AK',          tz: 'America/Anchorage',   tzLabel: 'Alaska' },
};

let activeStationId = 'KISP';
function activeStation() { return STATIONS[activeStationId]; }

// ═══════════════════════════════════════════════════════════════
// COLOR SCALE  (fixed 960–1040 mb)
// ═══════════════════════════════════════════════════════════════
// Deep violet (low) → blue-purple → steel blue →
// light blue-gray (normal ~1013) → warm gold → bright amber (high)
const COLOR_STOPS = [
  { mb:  960, rgb: [ 28,   8,  72] },
  { mb:  985, rgb: [ 48,  30, 155] },
  { mb: 1000, rgb: [ 38, 105, 190] },
  { mb: 1013, rgb: [148, 162, 178] },
  { mb: 1025, rgb: [205, 150,  45] },
  { mb: 1040, rgb: [245, 170,   0] },
];

// Color for the gradient header / legend (same stops, t in 0..1)
const COLOR_STOPS_T = COLOR_STOPS.map(s => ({
  t: (s.mb - MB_MIN) / (MB_MAX - MB_MIN),
  rgb: s.rgb,
}));

function lerpColor(mb) {
  mb = Math.max(MB_MIN, Math.min(MB_MAX, mb));
  let lo = COLOR_STOPS[0], hi = COLOR_STOPS[COLOR_STOPS.length - 1];
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    if (mb <= COLOR_STOPS[i + 1].mb) { lo = COLOR_STOPS[i]; hi = COLOR_STOPS[i + 1]; break; }
  }
  const span = hi.mb - lo.mb;
  const f    = span < 1e-6 ? 0 : (mb - lo.mb) / span;
  return [
    Math.round(lo.rgb[0] + f * (hi.rgb[0] - lo.rgb[0])),
    Math.round(lo.rgb[1] + f * (hi.rgb[1] - lo.rgb[1])),
    Math.round(lo.rgb[2] + f * (hi.rgb[2] - lo.rgb[2])),
  ];
}

function buildGradient(ctx2d, x0, x1) {
  const grad = ctx2d.createLinearGradient(x0, 0, x1, 0);
  for (const s of COLOR_STOPS_T) {
    const [r, g, b] = s.rgb;
    grad.addColorStop(s.t, `rgb(${r},${g},${b})`);
  }
  return grad;
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let mode        = 'climatology';
let loadToken   = 0; // bumped each loadClimatology() call; lets a stale in-flight request detect it's superseded
let currentYear = CLIMO_END;

// Climatology: per-(doy, hour) accumulator across years
// Each cell stores the sum of per-year hourly means (not raw obs).
let climoSum   = null;  // Array<Float64Array[24]>, length 366
let climoCount = null;  // Array<Int16Array[24]>,   length 366
const climoCache = new Map(); // Map<stationId, {climoSum, climoCount}>

// Single-year: mean SLP per (doy, hour)
let singleMean = null;  // Float32Array[366*24], NaN = missing
let singleRecLo = { mb: Infinity,  doy: -1, hour: -1 };
let singleRecHi = { mb: -Infinity, doy: -1, hour: -1 };

// ═══════════════════════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════════════════════
const MONTHS_SHORT    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL     = ['January','February','March','April','May','June',
                         'July','August','September','October','November','December'];
const MONTH_DAYS_LEAP   = [31,29,31,30,31,30,31,31,30,31,30,31];
const MONTH_DAYS_NOLEAP = [31,28,31,30,31,30,31,31,30,31,30,31];

const MONTH_START_DOY = (() => {
  const arr = [0];
  for (let m = 0; m < 11; m++) arr.push(arr[m] + MONTH_DAYS_LEAP[m]);
  return arr;
})();

function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function getDOY0(year, month, day) {
  const md = isLeap(year) ? MONTH_DAYS_LEAP : MONTH_DAYS_NOLEAP;
  let d = 0;
  for (let m = 0; m < month - 1; m++) d += md[m];
  return d + day - 1;
}

function doyToMonthDay(doy) {
  let rem = doy;
  for (let m = 0; m < 12; m++) {
    if (rem < MONTH_DAYS_LEAP[m]) return { m, day: rem + 1 };
    rem -= MONTH_DAYS_LEAP[m];
  }
  return { m: 11, day: 31 };
}

function fmtHour(h) {
  if (h === 0)  return 'Midnight';
  if (h === 12) return 'Noon';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

// ═══════════════════════════════════════════════════════════════
// IEM FETCH + PARSE
// ═══════════════════════════════════════════════════════════════
function buildSLPUrl(y1, y2) {
  const st = activeStation();
  const tz = encodeURIComponent(st.tz);
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?` +
    `station=${activeStationId}&data=mslp` +
    `&year1=${y1}&month1=1&day1=1` +
    `&year2=${y2}&month2=12&day2=31` +
    `&tz=${tz}&format=comma&latlon=no&missing=M&trace=T&direct=no`;
}

async function fetchRangeCSV(y1, y2) {
  const resp = await fetch(buildSLPUrl(y1, y2));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

// Returns Map<year, Array<{doy, hour, mb}>>
function parseSLP(text) {
  const lines  = text.split('\n');
  const byYear = new Map();
  let slpIdx   = 2;
  let inData   = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('station,')) {
      const h  = line.split(',');
      const si = h.indexOf('mslp');
      if (si >= 0) slpIdx = si;
      inData = true;
      continue;
    }
    if (!inData) continue;

    const parts = line.split(',');
    if (parts.length <= slpIdx) continue;

    const valid    = parts[1]?.trim();
    if (!valid) continue;
    const spaceIdx = valid.indexOf(' ');
    if (spaceIdx < 1) continue;

    const dp = valid.substring(0, spaceIdx).split('-').map(Number);
    if (dp.length < 3 || isNaN(dp[0])) continue;

    const [yr, mo, dy] = dp;
    const hour = parseInt(valid.substring(spaceIdx + 1));
    if (isNaN(hour) || hour < 0 || hour > 23) continue;

    const doy = getDOY0(yr, mo, dy);
    if (doy < 0 || doy > 365) continue;

    const slpStr = parts[slpIdx]?.trim();
    if (!slpStr || slpStr === 'M' || slpStr === 'T') continue;

    const mb = parseFloat(slpStr);
    // Sanity-check: ignore obviously bad values
    if (isNaN(mb) || mb < 880 || mb > 1100) continue;

    if (!byYear.has(yr)) byYear.set(yr, []);
    byYear.get(yr).push({ doy, hour, mb });
  }

  return byYear;
}

// ═══════════════════════════════════════════════════════════════
// DATA AGGREGATION
// ═══════════════════════════════════════════════════════════════
function initClimoGrids() {
  climoSum   = Array.from({ length: 366 }, () => new Float64Array(24));
  climoCount = Array.from({ length: 366 }, () => new Int16Array(24));
  return { climoSum, climoCount };
}

// Contribute one year's observations to climatology accumulators.
// We first average within each hour of this year (so a year with
// more sub-hourly obs doesn't outweigh one with fewer), then add
// that hourly mean to the multi-year sum.
function processYearClimo(obs, grids) {
  const { climoSum, climoCount } = grids;
  const ySum = new Float64Array(366 * 24);
  const yCnt = new Int16Array(366 * 24);

  for (const { doy, hour, mb } of obs) {
    const idx = doy * 24 + hour;
    ySum[idx] += mb;
    yCnt[idx]++;
  }

  for (let d = 0; d < 366; d++) {
    for (let h = 0; h < 24; h++) {
      const idx = d * 24 + h;
      if (yCnt[idx] > 0) {
        climoSum[d][h]   += ySum[idx] / yCnt[idx];
        climoCount[d][h] += 1;
      }
    }
  }
}

// Build single-year grid: mean SLP per (doy, hour) for one year.
function buildSingleGrid(obs) {
  const sum = new Float64Array(366 * 24);
  const cnt = new Int16Array(366 * 24);
  singleRecLo = { mb: Infinity,  doy: -1, hour: -1 };
  singleRecHi = { mb: -Infinity, doy: -1, hour: -1 };

  for (const { doy, hour, mb } of obs) {
    const idx = doy * 24 + hour;
    sum[idx] += mb;
    cnt[idx]++;
  }

  singleMean = new Float32Array(366 * 24).fill(NaN);
  for (let d = 0; d < 366; d++) {
    for (let h = 0; h < 24; h++) {
      const idx = d * 24 + h;
      if (cnt[idx] > 0) {
        const mean      = sum[idx] / cnt[idx];
        singleMean[idx] = mean;
        if (mean < singleRecLo.mb) singleRecLo = { mb: mean, doy: d, hour: h };
        if (mean > singleRecHi.mb) singleRecHi = { mb: mean, doy: d, hour: h };
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// CANVAS / RENDER
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('heatmap-canvas');
const ctx    = canvas.getContext('2d');
let dpr      = window.devicePixelRatio || 1;

const BG_RGB = [7, 7, 15]; // missing-data / no-data pixel color

function setupCanvas() {
  const W = document.getElementById('canvas-area').clientWidth;
  const H = CANVAS_HEIGHT;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

function renderHeatmap() {
  const W     = canvas.width  / dpr;
  const H     = canvas.height / dpr;
  const cellW = W / 366;
  const cellH = H / 24;

  const pw      = Math.round(W * dpr);
  const ph      = Math.round(H * dpr);
  const imgData = ctx.createImageData(pw, ph);
  const data    = imgData.data;

  const minYears = Math.ceil(TOTAL_YEARS / 3); // require at least ~11 years

  for (let doy = 0; doy < 366; doy++) {
    const x0 = Math.round(doy       * cellW * dpr);
    const x1 = Math.round((doy + 1) * cellW * dpr);

    for (let h = 0; h < 24; h++) {
      const y0 = Math.round(h       * cellH * dpr);
      const y1 = Math.round((h + 1) * cellH * dpr);

      let r, g, b;

      if (mode === 'climatology') {
        const cnt = climoCount[doy][h];
        if (cnt < minYears) {
          [r, g, b] = BG_RGB;
        } else {
          const meanMb = climoSum[doy][h] / cnt;
          [r, g, b] = lerpColor(meanMb);
        }
      } else {
        const idx = doy * 24 + h;
        const mb  = singleMean ? singleMean[idx] : NaN;
        if (isNaN(mb)) {
          [r, g, b] = BG_RGB;
        } else {
          [r, g, b] = lerpColor(mb);
        }
      }

      for (let py = y0; py < y1 && py < ph; py++) {
        for (let px = x0; px < x1 && px < pw; px++) {
          const i  = (py * pw + px) * 4;
          data[i]     = r;
          data[i + 1] = g;
          data[i + 2] = b;
          data[i + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Month dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth   = 1;
  for (let m = 1; m < 12; m++) {
    const x = Math.round(MONTH_START_DOY[m] * cellW) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Noon divider
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  const noonY = Math.round(12 * cellH) + 0.5;
  ctx.beginPath(); ctx.moveTo(0, noonY); ctx.lineTo(W, noonY); ctx.stroke();
}

// ── Legend ───────────────────────────────────────────────────
function renderLegend() {
  const lc = document.getElementById('legend-canvas');
  const lx = lc.getContext('2d');
  const W  = lc.width;
  const H  = lc.height;
  lx.clearRect(0, 0, W, H);
  lx.fillStyle = buildGradient(lx, 0, W);
  lx.fillRect(0, 0, W, H);
}

// ── Hour labels ──────────────────────────────────────────────
function renderHourLabels() {
  const container = document.getElementById('hour-labels');
  while (container.children.length > 1) container.removeChild(container.lastChild);

  const cellH = CANVAS_HEIGHT / 24;
  for (let h = 0; h < 24; h++) {
    const el      = document.createElement('div');
    el.className  = 'hour-label';
    el.style.height = cellH + 'px';
    if      (h === 0)  el.textContent = 'Midnight';
    else if (h === 12) el.textContent = 'Noon';
    else               el.textContent = h < 12 ? h : h - 12;
    container.appendChild(el);
  }
}

// ── Month labels ─────────────────────────────────────────────
function renderMonthLabels() {
  const bar   = document.getElementById('month-label-bar');
  bar.innerHTML = '';
  const W     = document.getElementById('canvas-area').clientWidth;
  const cellW = W / 366;

  for (let m = 0; m < 12; m++) {
    const startDOY = MONTH_START_DOY[m];
    const endDOY   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const midDOY   = (startDOY + endDOY) / 2;
    const el       = document.createElement('div');
    el.className   = 'month-label';
    el.textContent = MONTHS_SHORT[m];
    el.style.left  = (midDOY * cellW) + 'px';
    bar.appendChild(el);
  }
}

// ═══════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════
function updateStats() {
  const slPeriod = document.getElementById('sl-period');
  const svPeriod = document.getElementById('sv-period');
  const slMean   = document.getElementById('sl-mean');
  const svMean   = document.getElementById('sv-mean');
  const slLo     = document.getElementById('sl-lo');
  const svLo     = document.getElementById('sv-lo');
  const ssLo     = document.getElementById('ss-lo');
  const slHi     = document.getElementById('sl-hi');
  const svHi     = document.getElementById('sv-hi');
  const ssHi     = document.getElementById('ss-hi');

  if (mode === 'climatology' && climoSum) {
    slPeriod.textContent = 'Period';
    svPeriod.textContent = `${CLIMO_START}–${CLIMO_END}`;
    slMean.textContent   = 'Mean SLP';

    // Overall mean
    let totalSum = 0, totalCnt = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (climoCount[d][h] > 0) { totalSum += climoSum[d][h]; totalCnt += climoCount[d][h]; }
    svMean.textContent = totalCnt ? (totalSum / totalCnt).toFixed(1) + ' mb' : '–';

    // Monthly means
    const monthMean = Array.from({ length: 12 }, () => ({ sum: 0, cnt: 0 }));
    for (let d = 0; d < 366; d++) {
      const { m } = doyToMonthDay(d);
      for (let h = 0; h < 24; h++) {
        if (climoCount[d][h] > 0) {
          monthMean[m].sum += climoSum[d][h] / climoCount[d][h];
          monthMean[m].cnt++;
        }
      }
    }
    const monthAvg = monthMean.map(x => x.cnt ? x.sum / x.cnt : 1013);
    const loM = monthAvg.indexOf(Math.min(...monthAvg));
    const hiM = monthAvg.indexOf(Math.max(...monthAvg));

    slLo.textContent = 'Lowest Month';
    svLo.textContent = MONTHS_FULL[loM];
    ssLo.style.display = 'none';

    slHi.textContent = 'Highest Month';
    svHi.textContent = MONTHS_FULL[hiM];
    ssHi.style.display = 'none';

  } else if (mode === 'single' && singleMean) {
    slPeriod.textContent = 'Year';
    svPeriod.textContent = currentYear;
    slMean.textContent   = 'Year Mean SLP';

    let sum = 0, cnt = 0;
    for (let i = 0; i < 366 * 24; i++)
      if (!isNaN(singleMean[i])) { sum += singleMean[i]; cnt++; }
    svMean.textContent = cnt ? (sum / cnt).toFixed(1) + ' mb' : '–';

    // Record low
    slLo.textContent = 'Record Low';
    if (singleRecLo.doy >= 0) {
      svLo.textContent = singleRecLo.mb.toFixed(1) + ' mb';
      const { m, day } = doyToMonthDay(singleRecLo.doy);
      ssLo.textContent   = `${MONTHS_SHORT[m]} ${day}  ·  ${fmtHour(singleRecLo.hour)}`;
      ssLo.style.display = 'block';
    } else {
      svLo.textContent = '–'; ssLo.style.display = 'none';
    }

    // Record high
    slHi.textContent = 'Record High';
    if (singleRecHi.doy >= 0) {
      svHi.textContent = singleRecHi.mb.toFixed(1) + ' mb';
      const { m, day } = doyToMonthDay(singleRecHi.doy);
      ssHi.textContent   = `${MONTHS_SHORT[m]} ${day}  ·  ${fmtHour(singleRecHi.hour)}`;
      ssHi.style.display = 'block';
    } else {
      svHi.textContent = '–'; ssHi.style.display = 'none';
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// LOADING UI
// ═══════════════════════════════════════════════════════════════
function showLoading(txt) {
  const ov = document.getElementById('loading-overlay');
  ov.style.display = 'flex';
  document.getElementById('loading-text').textContent = txt;
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('error-text').style.display  = 'none';
}
function setProgress(pct, txt) {
  document.getElementById('progress-fill').style.width = pct + '%';
  if (txt) document.getElementById('loading-text').textContent = txt;
}
function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}
function showError(msg) {
  document.getElementById('loading-text').textContent = 'Failed to load data.';
  const et = document.getElementById('error-text');
  et.textContent  = msg;
  et.style.display = 'block';
}

// ═══════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  const hasClimo  = mode === 'climatology' && climoSum;
  const hasSingle = mode === 'single' && singleMean;
  if (!hasClimo && !hasSingle) { tooltip.style.display = 'none'; return; }

  const rect = canvas.getBoundingClientRect();
  const doy  = Math.min(365, Math.max(0, Math.floor((e.clientX - rect.left)  / rect.width  * 366)));
  const h    = Math.min(23,  Math.max(0, Math.floor((e.clientY - rect.top)   / rect.height * 24)));

  const { m, day } = doyToMonthDay(doy);
  document.getElementById('tt-date').textContent = `${MONTHS_FULL[m]} ${day}  ·  ${fmtHour(h)}`;

  const valEl = document.getElementById('tt-value');
  const detEl = document.getElementById('tt-detail');

  if (mode === 'climatology') {
    const cnt = climoCount[doy][h];
    if (cnt < Math.ceil(TOTAL_YEARS / 3)) {
      valEl.textContent = '–';
      detEl.textContent = 'Insufficient data';
    } else {
      const mean = climoSum[doy][h] / cnt;
      const [r, g, b] = lerpColor(mean);
      valEl.textContent = mean.toFixed(1) + ' mb';
      detEl.innerHTML   = `<span class="tt-swatch" style="background:rgb(${r},${g},${b})"></span>` +
                          `Mean of ${cnt} years`;
    }
  } else {
    const idx = doy * 24 + h;
    const mb  = singleMean[idx];
    if (isNaN(mb)) {
      valEl.textContent = 'No data';
      detEl.textContent = 'No observation this hour';
    } else {
      const [r, g, b] = lerpColor(mb);
      valEl.textContent = mb.toFixed(1) + ' mb';
      detEl.innerHTML   = `<span class="tt-swatch" style="background:rgb(${r},${g},${b})"></span>` +
                          `Hourly mean · ${currentYear}`;
    }
  }

  tooltip.style.display = 'block';
  const TW = 228, TH = 95;
  let tx = e.clientX + 16;
  let ty = e.clientY - 10;
  if (tx + TW > window.innerWidth  - 10) tx = e.clientX - TW - 12;
  if (ty + TH > window.innerHeight - 10) ty = window.innerHeight - TH - 10;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════
// LOAD – CLIMATOLOGY
// ═══════════════════════════════════════════════════════════════
async function loadClimatology() {
  const st = activeStation();
  const requestStationId = activeStationId;
  const myToken = ++loadToken;

  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = `${CLIMO_START}–${CLIMO_END}`;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;

  // Return cached data immediately if available
  if (climoCache.has(requestStationId)) {
    const c = climoCache.get(requestStationId);
    climoSum   = c.climoSum;
    climoCount = c.climoCount;
    renderHeatmap(); renderLegend(); updateStats();
    return;
  }

  // Request-local grids so a slower/older request can't clobber a newer one.
  const reqGrids = initClimoGrids();
  showLoading(`Fetching ${CLIMO_START}–${CLIMO_END} from IEM… (one large request, ~30 s)`);

  try {
    const csv = await fetchRangeCSV(CLIMO_START, CLIMO_END);
    if (myToken !== loadToken) return; // superseded by a later station switch
    setProgress(60, 'Parsing observations…');
    await sleep(30);
    if (myToken !== loadToken) return;
    const byYear = parseSLP(csv);
    setProgress(80, 'Aggregating by year…');
    await sleep(30);
    if (myToken !== loadToken) return;
    for (const obs of byYear.values()) processYearClimo(obs, reqGrids);
    await sleep(80);
    if (myToken !== loadToken) return;

    // Cache under the station this request was actually for.
    climoCache.set(requestStationId, {
      climoSum:   reqGrids.climoSum.map(r => new Float64Array(r)),
      climoCount: reqGrids.climoCount.map(r => new Int16Array(r)),
    });

    climoSum = reqGrids.climoSum; climoCount = reqGrids.climoCount;
    setProgress(100);
    hideLoading();
  } catch (e) {
    if (myToken !== loadToken) return; // ignore errors from abandoned requests
    showError(e.message);
    console.error('Climatology load failed:', e);
    return;
  }

  renderHeatmap(); renderLegend(); updateStats();
}

// ═══════════════════════════════════════════════════════════════
// LOAD – SINGLE YEAR
// ═══════════════════════════════════════════════════════════════
async function loadSingleYear(year) {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = year;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;
  showLoading(`Loading ${year} pressure data…`);

  try {
    const csv    = await fetchRangeCSV(year, year);
    const byYear = parseSLP(csv);
    const obs    = byYear.get(year) || [];

    buildSingleGrid(obs);
    hideLoading();
    renderHeatmap();
    renderLegend();
    updateStats();
  } catch (err) {
    showError(err.message);
    console.error(err);
  }
}

// ═══════════════════════════════════════════════════════════════
// MODE / NAV
// ═══════════════════════════════════════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('tab-climo') .classList.toggle('active', m === 'climatology');
  document.getElementById('tab-single').classList.toggle('active', m === 'single');

  const showYear = m === 'single';
  document.getElementById('ctrl-label').style.display  = showYear ? 'inline' : 'none';
  document.getElementById('year-select').style.display = showYear ? 'inline' : 'none';

  if (m === 'climatology') {
    loadClimatology();
  } else {
    currentYear = parseInt(document.getElementById('year-select').value);
    loadSingleYear(currentYear);
  }
}

function onYearChange() {
  currentYear = parseInt(document.getElementById('year-select').value);
  singleMean  = null;
  loadSingleYear(currentYear);
}

function onStationChange() {
  activeStationId = document.getElementById('station-select').value;
  singleMean  = null;
  climoSum    = null;
  climoCount  = null;
  if (mode === 'climatology') loadClimatology();
  else loadSingleYear(currentYear);
}

// ═══════════════════════════════════════════════════════════════
// DOWNLOAD PNG
// ═══════════════════════════════════════════════════════════════
function downloadPNG() {
  const st       = activeStation();
  const period   = mode === 'single' ? String(currentYear) : `${CLIMO_START}–${CLIMO_END}`;
  const subtitle = mode === 'climatology'
    ? `Mean sea level pressure by hour and day of year  ·  ${CLIMO_START}–${CLIMO_END}`
    : `Observed sea level pressure (hourly mean)  ·  ${currentYear}`;

  const EXPORT_SCALE = 3;
  const origDpr = dpr;
  dpr = EXPORT_SCALE;
  setupCanvas();
  renderHeatmap();

  const cw = canvas.width  / dpr;
  const ch = canvas.height / dpr;

  const PAD = 24, HDR = 86, FTR = 28, MONTH_H = 22;
  const ow  = cw + PAD * 2;
  const oh  = HDR + MONTH_H + ch + FTR;

  const off = document.createElement('canvas');
  off.width  = ow * EXPORT_SCALE;
  off.height = oh * EXPORT_SCALE;
  const oc   = off.getContext('2d');
  oc.scale(EXPORT_SCALE, EXPORT_SCALE);

  // Background
  oc.fillStyle = '#1E2320';
  oc.fillRect(0, 0, ow, oh);

  // Header accent bar (gradient)
  oc.fillStyle = buildGradient(oc, 0, ow);
  oc.fillRect(0, 0, ow, 3);

  // Station + title
  oc.fillStyle = '#E8E4D9';
  oc.font = 'bold 20px "Zilla Slab", serif';
  oc.fillText(`${st.label}  ·  Sea Level Pressure Heatmap  ·  ${period}`, PAD, 28);

  // Subtitle
  oc.fillStyle = '#A6A499';
  oc.font = '14px "Public Sans", sans-serif';
  oc.fillText(subtitle, PAD, 48);

  // Stats row
  const meanTxt = document.getElementById('sv-mean').textContent;
  const loTxt   = document.getElementById('sv-lo').textContent;
  const hiTxt   = document.getElementById('sv-hi').textContent;
  oc.fillStyle = '#93c5fd';
  oc.font = 'bold 13px "Courier Prime", monospace';
  oc.fillText(`Mean: ${meanTxt}   ${mode === 'climatology' ? 'Lowest month' : 'Record Low'}: ${loTxt}   ${mode === 'climatology' ? 'Highest month' : 'Record High'}: ${hiTxt}`, PAD, 68);

  // Branding
  oc.fillStyle = '#948F82';
  oc.font = '13px "Courier Prime", monospace';
  oc.textAlign = 'right';
  oc.fillText('contextclimate.io', ow - PAD, 28);
  oc.textAlign = 'left';

  // Month label strip
  oc.fillStyle = '#948F82';
  oc.font = '12px "Courier Prime", monospace';
  oc.textAlign = 'center';
  const cellW = cw / 366;
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e - 1) / 2;
    oc.fillText(MONTHS_SHORT[m], PAD + mid * cellW, HDR + MONTH_H - 6);
  }
  oc.textAlign = 'left';

  // Heatmap
  oc.drawImage(canvas, PAD, HDR + MONTH_H, cw, ch);

  dpr = origDpr;
  setupCanvas();
  renderHeatmap();

  // Footer
  oc.fillStyle = '#948F82';
  oc.font = '12px "Courier Prime", monospace';
  oc.fillText(`${st.tzLabel} Local Time  ·  Data: IEM ASOS (mslp)  ·  Fixed scale 960–1040 mb  ·  contextclimate.io`, PAD, HDR + MONTH_H + ch + 18);

  // Bottom accent line
  oc.fillStyle = buildGradient(oc, 0, ow);
  oc.fillRect(0, oh - 2, ow, 2);

  const link = document.createElement('a');
  link.download = `slp-heatmap-${activeStationId}-${period}.png`;
  link.href     = off.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════════════════════
// UTIL
// ═══════════════════════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function init() {
  // Populate year selector
  const sel = document.getElementById('year-select');
  for (let y = CLIMO_END; y >= CLIMO_START; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  }
  sel.value = currentYear;

  requestAnimationFrame(() => {
    setupCanvas();
    renderHourLabels();
    renderMonthLabels();
    renderLegend();
    loadClimatology();
  });

  window.addEventListener('resize', () => {
    dpr = window.devicePixelRatio || 1;
    setupCanvas();
    renderMonthLabels();
    const hasData = (mode === 'climatology' && climoSum) ||
                    (mode === 'single' && singleMean);
    if (hasData) renderHeatmap();
  });
}

init();
