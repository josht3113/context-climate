<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracking the Moon</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 14px; padding: 11px 16px; white-space: nowrap; }
.tabs .cc-segmented-btn .n { opacity: .65; margin-right: 6px; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.exp .print { padding: 7px 13px; font-size: 14px; font-weight: 700; border-color: var(--tool-accent); color: var(--color-text-primary); background: rgba(60,163,174,0.16); }
.exp .print:hover { background: rgba(60,163,174,0.28); }
.menu { position: absolute; top: 40px; z-index: 20; display: none; flex-direction: column; min-width: 200px;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.menu.open { display: flex; }
.menu button { background: none; border: 0; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px;
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; line-height: 1.25; }
.menu button small { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.menu button:hover { background: rgba(232,228,217,0.08); }
#printMenu { left: 0; }
#pngMenu { right: 0; min-width: 170px; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage canvas.dragging { cursor: grabbing; }
.stage canvas.on-moon { cursor: pointer; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 2px; }
.now { padding: 9px 13px; font-size: 15px; font-weight: 700; white-space: nowrap; border: 1.5px solid var(--accent-live); color: var(--color-text-primary);
  background: rgba(42,168,126,0.16); display: flex; align-items: center; gap: 7px; }
.now:hover { background: rgba(42,168,126,0.3); }
.now i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent-live); display: inline-block; }
.now.is-live { background: var(--accent-live); color: #0f1a15; }
.now.is-live i { background: #0f1a15; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.go { min-width: 104px; padding: 9px 14px; font-size: 15px; white-space: nowrap; }
.stepr .cc-segmented-btn { padding: 8px 10px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.snap { padding: 6px 9px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .03em; color: var(--color-text-secondary); }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.strip { flex: 1; min-width: 120px; height: 42px; position: relative; cursor: ew-resize; touch-action: none; }
.strip canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: var(--radius-sm); }
.chips { position: absolute; display: flex; gap: 6px; align-items: center; }
.chips.tl { top: 12px; left: 12px; }
.chips.tr { top: 12px; right: 12px; }
.chips .cc-segmented { background: rgba(20,24,21,0.86); }
.chips .cc-segmented-btn { padding: 7px 11px; font-size: 13px; }
.chips .lbl { font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary);
  background: rgba(20,24,21,0.86); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 7px 9px; }
.stepper { display: flex; align-items: stretch; background: rgba(20,24,21,0.86); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); overflow: hidden; }
.stepper button { background: none; border: 0; color: var(--color-text-primary); font-size: 14px; padding: 6px 11px; cursor: pointer; }
.stepper button:hover:not(:disabled) { background: rgba(60,163,174,0.25); }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper .dl { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--color-text-primary); padding: 7px 4px; white-space: nowrap; min-width: 150px; text-align: center; }
.live { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #0f1a15; background: var(--accent-live); border-radius: var(--radius-md); padding: 7px 10px; display: none; }
.live.on { display: inline-block; }
.tip { position: absolute; pointer-events: none; display: none; z-index: 8; background: var(--color-surface); border: 1px solid var(--tool-accent);
  border-radius: var(--radius-md); padding: 7px 10px; font-family: var(--font-mono); font-size: 14px; line-height: 1.45; color: var(--color-text-primary); white-space: nowrap; }
.tip b { font-family: var(--font-body); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .verdict { padding: 8px 0 7px; border-bottom: 1px solid var(--color-border); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card .verdict .big { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.05; color: var(--color-text-primary); }
.card .verdict .sm { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); letter-spacing: .03em; }
.card .inset { padding: 8px 0 8px; border-bottom: 1px solid var(--color-border); }
.card .inset .ih { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
.card .inset canvas { display: block; width: 100%; height: 170px; border-radius: var(--radius-md); cursor: grab; touch-action: none; }
.card .tg { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 0; border-bottom: 1px solid var(--color-border); }
.card .tg .cc-btn { padding: 4px 8px; font-size: 13px; }
.tgl::before { content: ''; display: inline-block; width: 9px; height: 9px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tgl.is-active { border-color: var(--tool-accent); color: var(--color-text-primary); }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.card .r .sub { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-top: 1px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 760px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 20px; }
  .card .verdict .big { font-size: 22px; }
  .card .inset canvas { height: 150px; }
  .card .tg { padding: 6px 0; }
}
@media (max-height: 680px) {
  .card .inset canvas { height: 132px; }
  .card .v { font-size: 19px; }
  .card .src { display: none; }
}
@media (max-width: 1180px) and (max-height: 700px) { .card .inset canvas { height: 118px; } .card .verdict { padding: 6px 0 5px; } }
@media (max-width: 1500px) { .top .sub { display: none; } }
@media (max-width: 1366px) {
  .snap { padding: 6px 7px; font-size: 13px; }
  .go { min-width: 0; padding: 9px 11px; }
  .controls { gap: 6px; }
}
@media (max-width: 1290px) {
  .chips .est, .stepr .unit { display: none; }
  .card .tg .cc-btn { padding: 4px 7px; }
  .tabs .cc-segmented-btn { padding: 11px 12px; }
  .exp .cc-btn { padding: 6px 8px; }
  .stepper .dl { min-width: 0; }
  .now { padding: 9px 10px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .card { padding: 10px 12px; }
  .card .tg { gap: 4px; }
  .card .tg .cc-btn { padding: 3px 6px; font-size: 12.5px; }
  .snap small { display: none; }
  .stepr .cc-segmented-btn { padding: 8px 8px; }
  .chips .lbl { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title">Tracking the Moon</h1><span class="sub">Earth–Moon System</span></div>
    <div class="cc-segmented tabs" id="tabs"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn print" id="bPrint">⎙ Printable horizon</button>
      <div class="menu" id="printMenu">
        <button data-print="blank">Blank horizon<small>Landmarks + grid · E–S–W</small></button>
        <button data-print="stars">With stars &amp; planets<small id="printStarsWhen">For the time shown</small></button>
      </div>
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="menu" id="pngMenu">
        <button data-png="all">Whole tool</button>
        <button data-png="stage">Sky view only</button>
        <button data-png="card">Readout card</button>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips tl" id="chipsL"></div>
        <div class="chips tr" id="chipsR"></div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
