<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System Objects Data Table — ESSRT p.2 | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --tool-accent:var(--accent-earth); /* Earth & Space section */
  --teal:var(--accent-earth);
  --teal-dim:rgba(60,163,174,0.13);
  --teal-glow:rgba(60,163,174,0.34);
  --bar:rgba(60,163,174,0.30);
  --bar-hi:rgba(60,163,174,0.52);
  --flag:#D67E60;
  --flag-dim:rgba(214,126,96,0.16);
  --row-h:rgba(232,228,217,0.045);
}

html,body{height:100%}
body{
  padding:0; overflow:hidden;
  display:flex; flex-direction:column;
  font-family:var(--font-body);
}

/* ══ HEADER ══════════════════════════════════════════════════ */
#top{
  flex:0 0 auto;
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  padding:6px 18px 5px;
  border-bottom:1px solid var(--color-border);
  background:var(--color-surface);
}
#top h1{
  font-family:var(--font-display); font-weight:700; font-size:19px;
  line-height:1.15; letter-spacing:.01em; color:var(--color-text-primary);
}
.src{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:#8d8a80;
}
#top .spacer{flex:1 1 auto}
#count{
  font-family:var(--font-mono); font-size:13px; color:var(--color-text-secondary);
  white-space:nowrap;
}

/* ══ CONTROLS ════════════════════════════════════════════════ */
#ctrls{
  flex:0 0 auto;
  border-bottom:1px solid var(--color-border);
  background:var(--color-surface);
  padding:6px 18px 7px;
  display:flex; flex-direction:column; gap:6px;
}
.crow{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.clab{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:#8d8a80; white-space:nowrap;
}
.cdiv{width:1px; align-self:stretch; background:var(--color-border); margin:0 3px}

.pill{
  background:var(--color-surface-2);
  border:1px solid var(--color-border);
  color:var(--color-text-secondary);
  font-family:var(--font-body); font-size:13px; font-weight:500;
  padding:3px 11px; border-radius:var(--radius-md);
  cursor:pointer; white-space:nowrap;
  display:inline-flex; align-items:center; gap:7px;
  transition:border-color .14s ease,color .14s ease,background .14s ease;
}
.pill:hover:not(:disabled){border-color:var(--color-border-hover); color:var(--color-text-primary)}
.pill.is-active{
  background:var(--teal-dim); border-color:var(--teal);
  color:var(--color-text-primary); font-weight:600;
}
.pill:disabled{opacity:.35; cursor:default}
.pill:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.swatch{width:9px;height:9px;border-radius:50%;flex:0 0 auto;opacity:.45;transition:opacity .14s ease}
.pill.is-active .swatch{opacity:1}
.pill .n{font-family:var(--font-mono); font-size:12px; color:#A6A499}
.pill.is-active .n{color:var(--color-text-secondary)}

/* planets sub-group */
.grp{
  display:inline-flex; align-items:center; gap:6px;
  border:1px solid var(--color-border); border-radius:var(--radius-lg);
  padding:3px 6px;
}
.grp-cap{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:#A6A499; padding:0 2px 0 3px;
}
.grp-all{
  background:transparent; border:1px solid var(--color-border);
  color:#A6A499; font-family:var(--font-mono); font-size:12px;
  letter-spacing:.05em; padding:3px 8px; border-radius:var(--radius-sm);
  cursor:pointer;
}
.grp-all:hover:not(:disabled){border-color:var(--color-border-hover); color:var(--color-text-primary)}
.grp-all:disabled{opacity:.35; cursor:default}
.grp-all:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

/* ══ TABLE AREA ══════════════════════════════════════════════ */
#area{flex:1 1 auto; overflow:auto; padding:10px 18px 8px}
#area.img-mode{padding:0; overflow:hidden}

table{
  border-collapse:separate; border-spacing:0;
  width:100%; max-width:1260px; min-width:980px; margin:0 auto;
  background:var(--color-surface);
  border:1px solid var(--color-border-hover);
  border-radius:var(--radius-md);
  table-layout:fixed;
}

thead th{
  position:sticky; top:0; z-index:3;
  background:var(--color-surface-2);
  border-bottom:1px solid var(--color-border-hover);
  border-left:1px solid var(--color-border);
  padding:5px 9px 3px; vertical-align:bottom;
  text-align:right; cursor:pointer;
  transition:background .14s ease;
}
thead th:first-child{border-left:none; text-align:left}
thead th:hover{background:#333a34}
thead th:focus-visible{outline:2px solid var(--teal); outline-offset:-2px}
th .h1t{
  display:block; font-family:var(--font-body); font-weight:600;
  font-size:13px; line-height:1.1; color:var(--color-text-primary);
}
th .h2t{
  display:block; font-family:var(--font-mono); font-size:12.5px;
  color:#A6A499; margin-top:1px; line-height:1.14;
}
th .sortmark{
  display:inline-block; width:11px; color:var(--teal);
  font-size:11px; vertical-align:1px;
}
th .logmark{
  display:inline-block; font-family:var(--font-mono); font-size:12px;
  letter-spacing:.06em; color:#A6A499; border:1px solid var(--color-border);
  border-radius:2px; padding:0 4px; margin-left:5px; font-weight:400;
}

/* header deep-link button */
.klink{
  display:inline-flex; align-items:center; gap:4px;
  margin-top:2px; padding:1px 7px;
  background:var(--color-surface); border:1px solid var(--teal);
  border-radius:var(--radius-sm);
  font-family:var(--font-mono); font-size:12px; letter-spacing:.03em;
  color:var(--teal); text-decoration:none; cursor:pointer; white-space:nowrap;
  transition:background .14s ease,color .14s ease;
}
.klink:hover{background:var(--teal); color:var(--color-bg)}
.klink:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

tbody td{
  border-top:1px solid var(--color-border);
  border-left:1px solid var(--color-border);
  padding:0; vertical-align:middle;
  font-family:var(--font-mono); font-size:14px;
  color:var(--color-text-primary);
  position:relative;
}
tbody td:first-child{border-left:none}
tbody tr:hover td{background:var(--row-h)}
tbody tr.open td{background:var(--teal-dim)}

.cell{position:relative; padding:3px 9px; text-align:right; z-index:1}
.bars .cell{padding-bottom:10px}
.barfill{
  position:absolute; left:0; bottom:1px; height:5px;
  background:var(--bar-hi); border-radius:0 2px 2px 0; z-index:1;
  transition:width .3s ease;
}
tbody td.hasbar::before{
  content:''; position:absolute; left:0; right:0; bottom:1px; height:5px;
  background:rgba(232,228,217,0.07); z-index:0;
}
tbody tr:hover .barfill{background:var(--teal)}
.barmark{
  position:absolute; bottom:0; width:1px; height:9px;
  background:rgba(214,126,96,0.75); z-index:2;
}
.sub{
  display:block; font-family:var(--font-mono); font-size:13px;
  color:#A6A499; line-height:1.25; margin-top:1px;
}

/* object name cell */
.namecell{
  display:flex; align-items:center; gap:8px;
  padding:3px 7px 3px 9px; text-align:left;
}
.nm{
  flex:1 1 auto; font-family:var(--font-body); font-weight:600;
  font-size:14px; letter-spacing:.02em; color:var(--color-text-primary);
  line-height:1.2;
}
.catdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.info{
  flex:0 0 auto; width:20px; height:20px; border-radius:50%;
  border:1px solid var(--color-border-hover); background:var(--color-surface-2);
  color:var(--color-text-secondary);
  font-family:var(--font-display); font-weight:700; font-size:13px;
  line-height:1; cursor:pointer; padding:0;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .14s ease,border-color .14s ease,color .14s ease;
}
.info:hover{border-color:var(--teal); color:var(--teal)}
.info.is-open{background:var(--teal); border-color:var(--teal); color:var(--color-bg)}
.info:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

/* flags */
.flag{
  display:inline-block; margin-left:6px; padding:1px 6px;
  border:1px solid var(--flag); background:var(--flag-dim);
  border-radius:2px; font-family:var(--font-mono); font-size:12px;
  letter-spacing:.04em; color:var(--flag); white-space:nowrap;
  vertical-align:1px;
}
.flag.lock{border-color:var(--accent-solar); background:rgba(166,150,48,.16); color:#c4b34a}

/* ══ CALLOUT ROW ═════════════════════════════════════════════ */
tr.detail>td{padding:0; border-left:none; background:var(--color-bg)!important}
.dwrap{
  border-top:2px solid var(--teal);
  padding:14px 16px 16px;
  display:grid; gap:16px;
  grid-template-columns:minmax(0,1fr) 320px 320px;
  align-items:start;
}
.dtext{min-width:0}
.dname{
  font-family:var(--font-display); font-weight:700; font-size:19px;
  color:var(--color-text-primary); line-height:1.15;
}
.dclass{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.11em;
  text-transform:uppercase; margin-top:3px;
}
.dfacts{list-style:none; margin:11px 0 0; padding:0}
.dfacts li{
  position:relative; padding-left:15px; margin-bottom:7px;
  font-family:var(--font-body); font-size:14px; line-height:1.5;
  color:var(--color-text-secondary);
}
.dfacts li::before{
  content:''; position:absolute; left:0; top:8px;
  width:5px; height:5px; border-radius:50%; background:var(--teal); opacity:.75;
}
.dfacts li b{color:var(--color-text-primary); font-weight:600}
.dfacts li.warn::before{background:var(--flag); opacity:1}
.dlinks{display:flex; gap:7px; flex-wrap:wrap; margin-top:12px}
.dlink{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 11px; background:var(--color-surface);
  border:1px solid var(--teal); border-radius:var(--radius-md);
  font-family:var(--font-mono); font-size:12.5px; letter-spacing:.03em;
  color:var(--teal); text-decoration:none;
  transition:background .14s ease,color .14s ease;
}
.dlink:hover{background:var(--teal); color:var(--color-bg)}
.dlink:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

.fig{
  background:var(--color-surface); border:1px solid var(--color-border);
  border-radius:var(--radius-md); padding:9px 10px 10px; min-width:0;
}
.figcap{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  margin-bottom:6px;
}
.figttl{
  font-family:var(--font-mono); font-size:12px; letter-spacing:.11em;
  text-transform:uppercase; color:#A6A499;
}
.figval{
  font-family:var(--font-display); font-weight:700; font-size:17px;
  color:var(--color-text-primary); white-space:nowrap;
}
.fig canvas{display:block; width:100%; max-width:400px; height:168px; margin:0 auto}
.fignote{
  font-family:var(--font-mono); font-size:13px; color:#A6A499;
  margin-top:5px; line-height:1.35;
}
.dclose{
  position:absolute; top:9px; right:11px;
  background:transparent; border:1px solid var(--color-border);
  color:var(--color-text-muted); border-radius:var(--radius-sm);
  font-family:var(--font-mono); font-size:12.5px; line-height:1;
  padding:4px 8px; cursor:pointer; z-index:2;
}
.dclose:hover{border-color:var(--color-border-hover); color:var(--color-text-primary)}
.dclose:focus-visible{outline:2px solid var(--teal); outline-offset:2px}

/* ══ PRINTED PAGE VIEW ═══════════════════════════════════════ */
#imgview{display:none; position:absolute; inset:0; overflow:hidden; background:#EFEDE6}
#area.img-mode{position:relative}
#area.img-mode>table{display:none}
#area.img-mode #imgview{display:block}
#imgview img{
  position:absolute; top:0; left:0; transform-origin:0 0;
  image-rendering:auto; user-select:none; -webkit-user-drag:none;
  cursor:grab;
}
#imgview img.drag{cursor:grabbing}
#zoomer{
  position:absolute; right:14px; bottom:14px; z-index:4;
  display:flex; gap:6px; align-items:center;
  background:var(--color-surface); border:1px solid var(--color-border-hover);
  border-radius:var(--radius-lg); padding:6px 8px;
}
#zoomer button{
  width:29px; height:27px; background:var(--color-surface-2);
  border:1px solid var(--color-border); color:var(--color-text-primary);
  font-family:var(--font-mono); font-size:14px; line-height:1;
  border-radius:var(--radius-sm); cursor:pointer;
}
#zoomer button:hover{border-color:var(--teal)}
#zoomer button:focus-visible{outline:2px solid var(--teal); outline-offset:1px}
#zlabel{
  font-family:var(--font-mono); font-size:12px; color:var(--color-text-secondary);
  min-width:44px; text-align:center;
}

/* ══ RESPONSIVE ══════════════════════════════════════════════ */
@media (max-width:1180px){
  .dwrap{grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
  .dtext{grid-column:1 / -1}
}
@media (max-width:880px){
  #area{padding:10px 10px 12px}
  .dwrap{grid-template-columns:minmax(0,1fr); gap:12px}
  .dtext{grid-column:auto}
  tbody td, .nm{font-size:13px}
  th .h1t{font-size:12.5px}
  .cell{padding:5px 7px}
  .namecell{padding:5px 6px 5px 8px; gap:6px}
}
@media (max-width:660px){
  #top{padding:6px 12px 5px}
  #top h1{font-size:17px}
  #ctrls{padding:6px 12px 7px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="top">
  <h1>Solar System Objects Data Table</h1>
  <span class="src">ESSRT 2026 &middot; p.&nbsp;2</span>
  <span class="spacer"></span>
  <span id="count"></span>
</div>

<div id="ctrls">
  <div class="crow" id="catrow">
    <span class="clab">Show</span>
    <button class="pill is-active" data-cat="sun"><span class="swatch" style="background:#E8C15A"></span>Sun<span class="n">1</span></button>
    <span class="grp">
      <span class="grp-cap">Planets</span>
      <button class="grp-all" id="allplanets">both</button>
      <button class="pill is-active" data-cat="terrestrial"><span class="swatch" style="background:#D08425"></span>Terrestrial<span class="n">4</span></button>
      <button class="pill is-active" data-cat="jovian"><span class="swatch" style="background:#6D96D8"></span>Jovian<span class="n">4</span></button>
    </span>
    <button class="pill is-active" data-cat="moon"><span class="swatch" style="background:#A6A499"></span>Moon<span class="n">1</span></button>
    <button class="pill is-active" data-cat="dwarf"><span class="swatch" style="background:#A08CC6"></span>Dwarf planets<span class="n">3</span></button>
    <button class="pill is-active" data-cat="asteroid"><span class="swatch" style="background:#8A9A8E"></span>Asteroid<span class="n">1</span></button>
    <span class="cdiv"></span>
    <button class="grp-all" id="selall">all</button>
    <button class="grp-all" id="selnone">none</button>
  </div>
  <div class="crow">
    <span class="clab">Units</span>
    <button class="pill is-active" id="u-printed">As printed</button>
    <button class="pill" id="u-earth">Earth = 1</button>
    <span class="cdiv"></span>
    <span class="clab">Overlay</span>
    <button class="pill" id="t-bars">Magnitude bars</button>
    <button class="pill" id="t-flags">Retrograde &amp; tidal lock</button>
    <span class="cdiv"></span>
    <button class="pill" id="t-img">Printed page</button>
    <button class="pill" id="t-reset" disabled>Printed order</button>
  </div>
</div>

<div id="area">
  <table id="tbl">
    <thead><tr id="hrow"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="imgview">
    <img id="pageimg" alt="Solar System Objects Data Table as printed in the 2026 Earth &amp; Space Sciences Reference Tables, page 2" draggable="false">
    <div id="zoomer">
      <button id="zout" title="Zoom out">&minus;</button>
      <span id="zlabel"></span>
      <button id="zin" title="Zoom in">+</button>
      <button id="zfit" title="Fit" style="width:38px;font-size:11px">fit</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   SOLAR SYSTEM OBJECTS DATA TABLE — ESSRT 2026, page 2
   ContextClimate.io | NYS Earth & Space Science
   Every printed value below is transcribed from the 2026 edition.
   `p` fields are the printed strings; numeric fields are parsed
   from them for sorting, bars and unit conversion.
   ═══════════════════════════════════════════════════════════════ */

var D = 1, Y = 365.26;                 // day, year (in days)
var hm = function(h,m){ return (h + m/60) / 24; };   // h/min -> days

var CATS = {
  sun:         {label:'Sun',            color:'#E8C15A', cls:'Star'},
  terrestrial: {label:'Terrestrial planet', color:'#D08425', cls:'Terrestrial planet'},
  jovian:      {label:'Jovian planet',  color:'#6D96D8', cls:'Jovian planet'},
  moon:        {label:'Moon',           color:'#A6A499', cls:'Natural satellite'},
  dwarf:       {label:'Dwarf planet',   color:'#A08CC6', cls:'Dwarf planet'},
  asteroid:    {label:'Asteroid',       color:'#8A9A8E', cls:'Asteroid'}
};

/* Earth's own printed values define the Earth = 1 unit for each column. */
var E_DIST = 149.6, E_REV = 365.26, E_ROT = hm(23,56), E_DIAM = 12756;

var DATA = [
  { key:'SUN', name:'SUN', cat:'sun', kepler:null,
    dist:null, distP:'---',
    rev:null,  revP:'---',
    rot:25.4,  rotP:'25.4 d',
    ecc:null,  eccP:'---',
    diam:1391400, diamP:'~1,391,400',
    tilt:7.25, tiltP:'7.25',
    fig2:'scale',
    facts:[
      'Distance, revolution and eccentricity are <b>---</b> because every other row is measured <b>from here</b>.',
      'The <b>25.4 d</b> rotation is equatorial only. The Sun is gas, so its poles take about 34 days — it does not rotate as one solid body.',
      'Diameter <b>~1,391,400 km</b> is about <b>109&times;</b> Earth.'
    ] },

  { key:'MERCURY', name:'MERCURY', cat:'terrestrial', kepler:'Mercury',
    dist:57.9,  distP:'57.9',
    rev:88.0,   revP:'88.0 d',
    rot:58.7,   rotP:'58.7 d',
    ecc:0.206,  eccP:'0.206',
    diam:4879,  diamP:'4879',
    tilt:0.03,  tiltP:'0.03',
    facts:[
      'Rotation <b>58.7 d</b> is exactly two-thirds of the <b>88.0 d</b> revolution — three rotations for every two orbits.',
      'Axial tilt <b>0.03&deg;</b> is effectively zero, so Mercury has no seasons.',
      'Eccentricity <b>0.206</b> is the highest of the eight planets.'
    ] },

  { key:'VENUS', name:'VENUS', cat:'terrestrial', kepler:'Venus',
    dist:108.2, distP:'108.2',
    rev:224.7,  revP:'224.7 d',
    rot:243.7,  rotP:'243.7 d',
    ecc:0.007,  eccP:'0.007',
    diam:12104, diamP:'12,104',
    tilt:177.36,tiltP:'177.36',
    retro:true,
    facts:[
      'Rotation <b>243.7 d</b> is longer than the <b>224.7 d</b> revolution — the only row where a day outlasts a year.',
      'Tilt <b>177.36&deg;</b> is past 90&deg;: Venus is turned almost fully over, so it rotates <b>retrograde</b>.',
      'Eccentricity <b>0.007</b> is the most circular orbit in the table.'
    ] },

  { key:'EARTH', name:'EARTH', cat:'terrestrial', kepler:'Earth',
    dist:149.6, distP:'149.6',
    rev:365.26, revP:'365.26 d',
    rot:hm(23,56), rotP:'23 h 56 min',
    ecc:0.017,  eccP:'0.017',
    diam:12756, diamP:'12,756',
    tilt:23.44, tiltP:'23.44',
    facts:[
      '<b>23 h 56 min</b> is one rotation measured against the stars — 4 minutes shorter than the 24 h solar day a clock keeps.',
      'Tilt <b>23.44&deg;</b> causes the seasons. Eccentricity <b>0.017</b> does not: Earth is closest to the Sun in January.'
    ] },

  { key:'MOON', name:"EARTH'S MOON", cat:'moon', kepler:null,
    dist:149.6, distP:'149.6', distSub:'(0.384 from Earth)',
    rev:27.3,   revP:'27.3 d',
    rot:27.3,   rotP:'27.3 d',
    ecc:0.055,  eccP:'0.055',
    diam:3475,  diamP:'3475',
    tilt:6.68,  tiltP:'6.68',
    lock:true, orbits:'Earth',
    facts:[
      'Revolution <b>27.3 d</b> equals rotation <b>27.3 d</b>. That is <b>tidal locking</b> — it is why one hemisphere always faces Earth.',
      'Its <b>149.6</b> is Earth’s distance from the Sun. The Moon orbits <b>Earth</b>, at 0.384 million km.',
      'Eccentricity <b>0.055</b> describes that orbit around Earth, not around the Sun.'
    ] },

  { key:'MARS', name:'MARS', cat:'terrestrial', kepler:'Mars',

var COLS = [
  {k:'name', h1:'Celestial Object', h2:'', w:'16%', align:'left'},
  {k:'dist', h1:'Mean Distance from Sun', h2:'(million km)', h2e:'(AU &middot; Earth = 1)', w:'13.5%', scale:'log'},
  {k:'rev',  h1:'Period of Revolution', h2:'(d=Earth days)<br>(y=Earth years)', h2e:'(Earth years &middot; Earth = 1)', w:'14%', scale:'log', kepler:3},
  {k:'rot',  h1:'Period of Rotation at Equator', h2:'', h2e:'(Earth rotations &middot; Earth = 1)', w:'16.5%', scale:'log'},
  {k:'ecc',  h1:'Eccentricity of Orbit', h2:'', h2e:'(already a ratio)', w:'12.5%', scale:'fixed', dom:[0,0.5], kepler:1},
  {k:'diam', h1:'Equatorial Diameter', h2:'(km)', h2e:'(Earth diameters &middot; Earth = 1)', w:'15%', scale:'log'},
  {k:'tilt', h1:'Axial Tilt', h2:'(&deg;)', h2e:'(degrees, absolute)', w:'12.5%', scale:'fixed', dom:[0,180], mark:90}
];

var KEPLER1 = 'kepler-law1-ellipses.html';
var KEPLER3 = 'kepler-law3-periods.html';

var S = {
  cats: {sun:1, terrestrial:1, jovian:1, moon:1, dwarf:1, asteroid:1},
  unit: 'printed',
  bars: false,
  flags: false,
  img: false,
  sortK: null,
  sortDir: 1,
  open: null
};

var $ = function(id){ return document.getElementById(id); };

/* ══ VALUE ACCESS & FORMATTING ══════════════════════════════════ */

// Numeric value for a row/column under the active unit mode.
function num(row, k){
  var v = row[k];
  if(v === null || v === undefined) return null;
  if(S.unit === 'earth'){
    if(k === 'dist') return v / E_DIST;
    if(k === 'rev')  return v / E_REV;
    if(k === 'rot')  return v / E_ROT;
    if(k === 'diam') return v / E_DIAM;
  }
  return v;   // ecc and tilt are already absolute; printed mode is raw
}

// Sort key is unit-independent (ratios preserve order), so use the raw number.
function sortVal(row, k){
  return (row[k] === null || row[k] === undefined) ? null : row[k];
}

function sigFmt(v){
  var a = Math.abs(v);
  if(a === 0) return '0';
  if(a >= 1000) return Math.round(v).toLocaleString('en-US');
  if(a >= 100)  return v.toFixed(1);
  if(a >= 10)   return v.toFixed(2);
  if(a >= 1)    return v.toFixed(3);
  if(a >= 0.01) return v.toFixed(4);
  return v.toPrecision(3);
}

// Display text for a cell.
function disp(row, k){
  if(S.unit === 'printed') return row[k + 'P'];
  if(k === 'ecc')  return row.eccP;          // dimensionless — unchanged
  if(k === 'tilt') return row.tiltP;         // degrees — unchanged
  var v = num(row, k);
  if(v === null) return '---';
  return sigFmt(v) + '&times;';
}

/* ══ BAR SCALES ═════════════════════════════════════════════════
   Fixed-domain columns (eccentricity 0–0.5, tilt 0–180) keep one
   scale whatever is filtered, so a bar means the same thing before
   and after a toggle. The four wide-range columns are log-scaled
   and normalized across the rows currently visible, so hiding the
   Sun re-spreads the planets instead of leaving them all pinned
   near zero. ═══════════════════════════════════════════════════ */
var scales = {};

function buildScales(rows){
  scales = {};
  COLS.forEach(function(c){
    if(c.k === 'name') return;
    if(c.scale === 'fixed'){ scales[c.k] = {kind:'fixed', lo:c.dom[0], hi:c.dom[1]}; return; }
    var vs = rows.map(function(r){ return num(r, c.k); })
                 .filter(function(v){ return v !== null && v > 0; });
    if(!vs.length){ scales[c.k] = null; return; }
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    scales[c.k] = {kind:'log', lo:Math.log10(lo), hi:Math.log10(hi)};
  });
}

function barFrac(row, k){
  var sc = scales[k], v = num(row, k);
  if(!sc || v === null) return null;
  var f;
  if(sc.kind === 'fixed'){
    f = (v - sc.lo) / (sc.hi - sc.lo);
  } else {
    if(v <= 0) return null;
    f = (sc.hi === sc.lo) ? 1 : (Math.log10(v) - sc.lo) / (sc.hi - sc.lo);
    f = 0.045 + 0.955 * f;          // floor so the smallest still reads as a value
  }
  return Math.max(0, Math.min(1, f));
}

/* ══ ROW SET ════════════════════════════════════════════════════ */
function visibleRows(){
  var rows = DATA.filter(function(r){ return S.cats[r.cat]; });
  if(S.sortK){
    var k = S.sortK, dir = S.sortDir;
    rows = rows.slice().sort(function(a, b){
      if(k === 'name') return dir * a.name.localeCompare(b.name);
      var av = sortVal(a, k), bv = sortVal(b, k);
      if(av === null && bv === null) return 0;
      if(av === null) return 1;            // blanks always last
      if(bv === null) return -1;
      return dir * (av - bv);
    });
  }
  return rows;
}

/* ══ HEADER ═════════════════════════════════════════════════════ */
function buildHead(){
  var tr = $('hrow');
  tr.innerHTML = '';
  COLS.forEach(function(c){
    var th = document.createElement('th');
    th.style.width = c.w;
    th.dataset.k = c.k;
    th.tabIndex = 0;
    th.setAttribute('role', 'columnheader');
    var h2 = (S.unit === 'earth' && c.h2e) ? c.h2e : c.h2;
    var mark = '<span class="sortmark" data-role="sm"></span>';
    var logm = (c.scale === 'log' && S.bars) ? '<span class="logmark">log</span>' : '';
    th.innerHTML =
      '<span class="h1t">' + (c.align === 'left' ? mark + c.h1 : c.h1 + mark) + logm + '</span>' +
      (h2 ? '<span class="h2t">' + h2 + '</span>' : '');
    if(c.kepler){
      var a = document.createElement('a');
      a.className = 'klink';
      a.href = c.kepler === 1 ? KEPLER1 : KEPLER3;
      a.textContent = c.kepler === 1 ? "Kepler's 1st ↗" : "Kepler's 3rd ↗";
      a.title = c.kepler === 1
        ? 'Open the orbit shape explorer — what these eccentricities look like'
        : "Open the harmony of the spheres — T² against a³ for these periods";
      a.addEventListener('click', function(e){ e.stopPropagation(); });
      th.appendChild(a);
    }
    th.addEventListener('click', function(){ onSort(c.k); });
    th.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onSort(c.k); }
    });
    tr.appendChild(th);
  });
  paintSortMarks();
}

function paintSortMarks(){
  Array.prototype.forEach.call($('hrow').children, function(th){
    var sm = th.querySelector('[data-role=sm]');
    if(!sm) return;
    sm.textContent = (S.sortK === th.dataset.k) ? (S.sortDir === 1 ? '▲' : '▼') : '';
  });
}

function onSort(k){
  if(S.img) return;
  if(S.sortK !== k){ S.sortK = k; S.sortDir = 1; }
  else if(S.sortDir === 1){ S.sortDir = -1; }
  else { S.sortK = null; S.sortDir = 1; }
  $('t-reset').disabled = !S.sortK;
  render();
}

/* ══ BODY ═══════════════════════════════════════════════════════ */
var figObs = [];
function render(){
  figObs.forEach(function(o){ o.disconnect(); });
  figObs = [];
  var rows = visibleRows();
  buildScales(rows);
  buildHead();

  var tb = $('tbody');
  tb.innerHTML = '';

  rows.forEach(function(r){
    var tr = document.createElement('tr');
    tr.dataset.key = r.key;
    if(S.open === r.key) tr.className = 'open';

    COLS.forEach(function(c){
      var td = document.createElement('td');

      if(c.k === 'name'){
        var wrap = document.createElement('div');
        wrap.className = 'namecell';
        var dot = document.createElement('span');
        dot.className = 'catdot';
        dot.style.background = CATS[r.cat].color;
        dot.title = CATS[r.cat].cls;
        var nm = document.createElement('span');
        nm.className = 'nm';
        nm.textContent = r.name;
        var btn = document.createElement('button');
        btn.className = 'info' + (S.open === r.key ? ' is-open' : '');
        btn.type = 'button';
        btn.textContent = 'i';
        btn.setAttribute('aria-expanded', S.open === r.key ? 'true' : 'false');
        btn.setAttribute('aria-label', (S.open === r.key ? 'Close' : 'Open') + ' details for ' + r.name);
        btn.addEventListener('click', function(e){ e.stopPropagation(); toggleOpen(r.key); });
        wrap.appendChild(dot); wrap.appendChild(nm); wrap.appendChild(btn);
        td.appendChild(wrap);
        tr.appendChild(td);
        return;
      }

      var cell = document.createElement('div');
      cell.className = 'cell';

      if(S.bars){
        var f = barFrac(r, c.k);
        if(f !== null && f > 0){
          td.className = 'hasbar';
          var bar = document.createElement('div');
          bar.className = 'barfill';
          bar.style.width = (f * 100).toFixed(2) + '%';
          td.appendChild(bar);
          if(c.mark){
            var mk = document.createElement('div');
            mk.className = 'barmark';
            mk.style.left = (c.mark / (c.dom[1] - c.dom[0]) * 100) + '%';
            mk.title = c.mark + '\u00B0 \u2014 past this, rotation is retrograde';
            td.appendChild(mk);
          }
        }
      }

      var html = disp(r, c.k);
      if(S.flags){
        if(c.k === 'tilt' && r.retro) html += '<span class="flag">retro</span>';
        if(c.k === 'rot'  && r.lock)  html += '<span class="flag lock">locked</span>';
        if(c.k === 'rev'  && r.lock)  html += '<span class="flag lock">locked</span>';
      }
      cell.innerHTML = html;
      if(c.k === 'dist' && r.distSub && S.unit === 'printed'){
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = r.distSub;
        cell.appendChild(sub);
      }
      td.appendChild(cell);
      tr.appendChild(td);
    });

    tb.appendChild(tr);

    if(S.open === r.key) tb.appendChild(detailRow(r));
  });

  $('tbl').classList.toggle('bars', S.bars);
  $('count').textContent = rows.length + ' of ' + DATA.length + ' objects';
  syncControls();
}

/* ══ CALLOUT ════════════════════════════════════════════════════ */
function toggleOpen(key){
  S.open = (S.open === key) ? null : key;
  render();
  if(!S.open) return;
  var area = $('area');
  var src  = $('tbody').querySelector('tr[data-key="' + S.open + '"]');
  var det  = $('tbody').querySelector('tr.detail');
  var th   = document.querySelector('thead th');
  if(!area || !src || !det || !th) return;
  // Keep the object's own row visible just under the sticky header; without
  // this the row that was clicked ends up hidden behind it.
  var a = area.getBoundingClientRect();
  var r = src.getBoundingClientRect();
  var d = det.getBoundingClientRect();
  var want = a.top + th.offsetHeight + 4;
  if(r.top < want || d.bottom > a.bottom){
    var by = r.top - want;
    if(typeof area.scrollBy === 'function'){
      area.scrollBy({top:by, behavior:'smooth'});
    } else {
      area.scrollTop += by;
    }
  }
}

function detailRow(r){
  var tr = document.createElement('tr');
  tr.className = 'detail';
  var td = document.createElement('td');
  td.colSpan = COLS.length;

  var wrap = document.createElement('div');
  wrap.className = 'dwrap';

  var txt = document.createElement('div');
  txt.className = 'dtext';
  var facts = r.facts.map(function(f){
    var warn = /asteroid<\/b>, not a dwarf|retrograde<\/b>|tidal locking<\/b>/.test(f) ? ' class="warn"' : '';
    return '<li' + warn + '>' + f + '</li>';
  }).join('');
  txt.innerHTML =
    '<div class="dname">' + r.name + '</div>' +
    '<div class="dclass" style="color:' + CATS[r.cat].color + '">' + CATS[r.cat].cls + '</div>' +
    '<ul class="dfacts">' + facts + '</ul>';

  if(r.kepler){
    var links = document.createElement('div');
    links.className = 'dlinks';
    var a1 = document.createElement('a');
    a1.className = 'dlink'; a1.href = KEPLER1 + '?b=' + encodeURIComponent(r.kepler);
    a1.innerHTML = r.name + ' in Kepler’s 1st ↗';
    links.appendChild(a1);
    var a3 = document.createElement('a');
    a3.className = 'dlink'; a3.href = KEPLER3 + '?b=' + encodeURIComponent(r.kepler);
    a3.innerHTML = r.name + ' in Kepler’s 3rd ↗';
    links.appendChild(a3);
    txt.appendChild(links);
  }
  wrap.appendChild(txt);

  wrap.appendChild(figure('Axial tilt', r.tiltP + '°',
    tiltNote(r), function(ctx,w,h){ drawTilt(ctx,w,h,r); }));

  if(r.fig2 === 'scale'){
    wrap.appendChild(figure('Size against Earth', '109×',
      'Sun’s edge at true scale. Earth is 12,756 km against 1,391,400 km.',
      function(ctx,w,h){ drawScale(ctx,w,h); }));
  } else {
    wrap.appendChild(figure('Orbit shape', 'e = ' + r.eccP,
      eccNote(r), function(ctx,w,h){ drawOrbit(ctx,w,h,r); }));
  }

  var close = document.createElement('button');
  close.className = 'dclose'; close.type = 'button'; close.textContent = 'close ×';
  close.addEventListener('click', function(){ toggleOpen(r.key); });
  td.style.position = 'relative';
  td.appendChild(wrap);
  td.appendChild(close);
  tr.appendChild(td);
  return tr;
}

function figure(title, val, note, drawFn){
  var box = document.createElement('div');
  box.className = 'fig';
  var cap = document.createElement('div');
  cap.className = 'figcap';
  cap.innerHTML = '<span class="figttl">' + title + '</span><span class="figval">' + val + '</span>';
  var cv = document.createElement('canvas');
  var nt = document.createElement('div');
  nt.className = 'fignote';
  nt.innerHTML = note;
  box.appendChild(cap); box.appendChild(cv); box.appendChild(nt);

  var ro = new ResizeObserver(function(){ sizeAndDraw(cv, drawFn); });
  figObs.push(ro);
  requestAnimationFrame(function(){ ro.observe(cv); sizeAndDraw(cv, drawFn); });
  return box;
}

function sizeAndDraw(cv, drawFn){
  var rect = cv.getBoundingClientRect();
  if(!rect.width || !rect.height) return;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(rect.width * dpr);
  cv.height = Math.round(rect.height * dpr);
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  drawFn(ctx, rect.width, rect.height);
}

function tiltNote(r){
  if(r.tilt > 90) return 'Past 90° — the north pole lies below the orbital plane, so rotation is <b>retrograde</b>.';
  if(r.tilt < 1)  return 'Effectively upright. No seasonal change from tilt.';
  if(r.key === 'EARTH') return 'The tilt stays pointed the same way all year. That is what makes seasons.';
  return 'Dashed line is Earth’s 23.44° for comparison.';
}

function eccNote(r){
  var pct = (r.ecc * 100).toFixed(1);
  var about = r.orbits ? r.orbits : 'Sun';
  return 'Dashed circle is a perfect circle for comparison. The ' + about +
         ' sits <b>' + pct + '%</b> of the way from the centre to the end.';
}

/* ═══════════════════════════════════════════════════════════════
   CANVASES — every mark below is generated from the row's own
   printed numbers. Nothing here is decorative geometry.
   ═══════════════════════════════════════════════════════════════ */

var C_TXT  = 'rgba(232,228,217,0.62)';
var C_TXT2 = 'rgba(232,228,217,0.90)';
var C_LINE = 'rgba(232,228,217,0.22)';
var C_TEAL = '#3CA3AE';
var C_FLAG = '#D67E60';
var F_LBL  = '13px "Public Sans", sans-serif';

function arrowHead(ctx, x, y, dx, dy, size, color){
  var a = Math.atan2(dy, dx);
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.beginPath();
  ctx.moveTo(size, 0); ctx.lineTo(-size * 0.75, size * 0.62); ctx.lineTo(-size * 0.75, -size * 0.62);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

/* ── AXIAL TILT ────────────────────────────────────────────────
   Horizontal line = the orbital plane. Dashed vertical = the
   plane's normal. The solid axis is drawn at the printed tilt
   from that normal, and the spin arrow follows the right-hand
   rule about the axis — so a tilt past 90 degrees reverses the
   arrow on its own rather than by a special case. ───────────── */
function drawTilt(ctx, w, h, r){
  var t  = r.tilt * Math.PI / 180;
  var cx = w * 0.52, cy = h * 0.50;
  var R  = Math.min(28, h * 0.175);
  var AX = Math.min(R * 2.0, h * 0.5 - 20);
  var ax = Math.sin(t), ay = -Math.cos(t);

  // orbital plane
  ctx.strokeStyle = C_LINE; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(8, cy); ctx.lineTo(w - 8, cy); ctx.stroke();
  ctx.fillStyle = C_TXT; ctx.font = F_LBL; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.fillText('orbital plane', 9, cy - 4);

  // to the Sun (or to Earth, for the Moon)
  var toward = r.orbits ? 'Earth' : 'Sun';
  if(r.cat !== 'sun'){
    ctx.strokeStyle = 'rgba(232,228,217,0.30)'; ctx.beginPath();
    ctx.moveTo(cx - R - 14, cy); ctx.lineTo(18, cy); ctx.stroke();
    arrowHead(ctx, 14, cy, -1, 0, 4.5, 'rgba(232,228,217,0.45)');
    ctx.fillStyle = C_TXT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.fillText('to ' + toward, 9, cy + 5);
  }

  // normal to the plane
  ctx.save(); ctx.setLineDash([3, 3]);
  ctx.strokeStyle = 'rgba(232,228,217,0.26)';
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - AX - 6); ctx.stroke();
  ctx.restore();

  // Earth's 23.44 degrees, for comparison
  if(r.key !== 'EARTH'){
    var et = 23.44 * Math.PI / 180;
    ctx.save(); ctx.setLineDash([2, 4]);
    ctx.strokeStyle = 'rgba(109,150,216,0.55)'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(et) * (AX + 2), cy - Math.cos(et) * (AX + 2));
    ctx.stroke(); ctx.restore();
    ctx.fillStyle = 'rgba(109,150,216,0.85)'; ctx.font = F_LBL;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('Earth', cx + Math.sin(et) * (AX + 8), cy - Math.cos(et) * (AX + 8));
  }

  // the tilt angle, swept from the normal to the axis
  ctx.strokeStyle = C_TEAL; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 1.75, -Math.PI / 2, -Math.PI / 2 + t, t < 0);
  ctx.stroke();

  // the body
  var grad = ctx.createRadialGradient(cx - R * 0.35, cy - R * 0.35, R * 0.1, cx, cy, R);
  grad.addColorStop(0, '#454E48'); grad.addColorStop(1, '#2C322D');
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(232,228,217,0.45)'; ctx.lineWidth = 1.2; ctx.stroke();

  // spin axis
  ctx.strokeStyle = (r.tilt > 90) ? C_FLAG : C_TXT2;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - ax * AX, cy - ay * AX);
  ctx.lineTo(cx + ax * AX, cy + ay * AX);
  ctx.stroke();

  // north pole
  ctx.beginPath(); ctx.arc(cx + ax * AX, cy + ay * AX, 3.2, 0, Math.PI * 2);
  ctx.fillStyle = (r.tilt > 90) ? C_FLAG : C_TXT2; ctx.fill();
  ctx.font = 'bold ' + F_LBL; ctx.textAlign = 'center';
  ctx.textBaseline = (ay < 0) ? 'bottom' : 'top';
  ctx.fillText('N', cx + ax * AX, cy + ay * AX + (ay < 0 ? -6 : 6));

  // equator, and the spin arrow on its near side (right-hand rule about N)
  var k = 0.30;
  ctx.save();
  ctx.strokeStyle = 'rgba(232,228,217,0.38)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(cx, cy, R, R * k, t, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  var px = cx - R * k * Math.sin(t), py = cy + R * k * Math.cos(t);
  var tx = -Math.cos(t), ty = -Math.sin(t);
  arrowHead(ctx, px + tx * R * 0.55, py + ty * R * 0.55, tx, ty, 5.5, C_TEAL);
  ctx.strokeStyle = C_TEAL; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px - tx * R * 0.15, py - ty * R * 0.15);
  ctx.lineTo(px + tx * R * 0.45, py + ty * R * 0.45);
  ctx.stroke();
}

/* ── ORBIT SHAPE ───────────────────────────────────────────────
   Ellipse at the printed eccentricity against a true circle, with
   the primary placed at the focus, offset by c = a*e. ────────── */
function drawOrbit(ctx, w, h, r){
  var e  = r.ecc === null ? 0 : r.ecc;
  var cx = w * 0.5, cy = h * 0.47;
  var a  = Math.min((w - 34) / 2, (h - 56) / 2);
  var b  = a * Math.sqrt(1 - e * e);
  var c  = a * e;

  // the orbit
  ctx.strokeStyle = C_TEAL; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.ellipse(cx, cy, a, b, 0, 0, Math.PI * 2); ctx.stroke();

  // a true circle over it, so a near-circular orbit shows the two coinciding
  ctx.save(); ctx.setLineDash([4, 4]);
  ctx.strokeStyle = 'rgba(232,228,217,0.58)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, a, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();

  // geometric centre
  ctx.strokeStyle = 'rgba(232,228,217,0.45)'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx - 4, cy); ctx.lineTo(cx + 4, cy);
  ctx.moveTo(cx, cy - 4); ctx.lineTo(cx, cy + 4);
  ctx.stroke();

  // offset from centre to focus
  if(c > 1.5){
    ctx.strokeStyle = C_FLAG; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + c, cy); ctx.stroke();
  }

  // the primary, at the focus
  var moon = !!r.orbits;
  var fx = cx + c;
  var gl = ctx.createRadialGradient(fx, cy, 1, fx, cy, 13);
  gl.addColorStop(0, moon ? 'rgba(109,150,216,0.55)' : 'rgba(232,193,90,0.55)');
  gl.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(fx, cy, 13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(fx, cy, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = moon ? '#6D96D8' : '#E8C15A'; ctx.fill();

  // the two ends
  ctx.font = F_LBL; ctx.textBaseline = 'top'; ctx.fillStyle = C_TXT;
  ctx.textAlign = 'right';
  ctx.fillText(moon ? 'perigee' : 'perihelion', Math.min(w - 4, cx + a + 16), cy + b + 7);
  ctx.textAlign = 'left';
  ctx.fillText(moon ? 'apogee' : 'aphelion', Math.max(4, cx - a - 16), cy + b + 7);

  ctx.fillStyle = 'rgba(232,228,217,0.82)';
  [[cx + a, cy], [cx - a, cy]].forEach(function(p){
    ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, Math.PI * 2); ctx.fill();
  });
}

/* ── SIZE AT TRUE SCALE (Sun row) ─────────────────────────────
   Radii come straight from the printed equatorial diameters. ── */
function drawScale(ctx, w, h){
  var dS = 1391400, dJ = 142976, dE = 12756;
  var horizon = h * 0.52;

  // Jupiter is the biggest thing that must fit above the limb, so it sets
  // the scale; the Sun's radius follows from it, not the other way round.
  var rJ = Math.min((horizon - 12) / 2, w * 0.13);
  var Rs = rJ * dS / dJ;
  var rE = Math.max(Rs * dE / dS, 1.4);

  // the Sun's limb
  var g = ctx.createLinearGradient(0, horizon, 0, h);
  g.addColorStop(0, '#F0D27A'); g.addColorStop(1, '#C9922C');
  ctx.beginPath(); ctx.arc(w / 2, horizon + Rs, Rs, -Math.PI, 0); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(38,28,6,0.78)'; ctx.font = 'bold ' + F_LBL;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('SUN  \u2014  1,391,400 km', w / 2, horizon + 13);

  // Jupiter and Earth above it, at the same scale
  var jx = rJ + 10, jy = horizon - rJ - 8;
  ctx.beginPath(); ctx.arc(jx, jy, rJ, 0, Math.PI * 2);
  ctx.fillStyle = '#C8A870'; ctx.fill();
  ctx.fillStyle = C_TXT; ctx.font = F_LBL;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Jupiter', jx + rJ + 7, jy);

  var ex = w * 0.70, ey = horizon - 26;
  ctx.beginPath(); ctx.arc(ex, ey, rE, 0, Math.PI * 2);
  ctx.fillStyle = '#6D96D8'; ctx.fill();
  ctx.strokeStyle = C_TEAL; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(ex, ey, 9, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ex + 9, ey); ctx.lineTo(ex + 16, ey); ctx.stroke();
  ctx.fillStyle = C_TXT2; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('Earth', ex + 20, ey);
}

/* ══ CONTROLS ═══════════════════════════════════════════════════ */
function syncControls(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'), function(b){
    b.classList.toggle('is-active', !!S.cats[b.dataset.cat]);
    b.disabled = S.img;
  });
  $('u-printed').classList.toggle('is-active', S.unit === 'printed');
  $('u-earth').classList.toggle('is-active', S.unit === 'earth');
  $('t-bars').classList.toggle('is-active', S.bars);
  $('t-flags').classList.toggle('is-active', S.flags);
  $('t-img').classList.toggle('is-active', S.img);
  ['u-printed','u-earth','t-bars','t-flags','allplanets','selall','selnone'].forEach(function(id){
    $(id).disabled = S.img;
  });
  $('t-reset').disabled = S.img || !S.sortK;
  $('area').classList.toggle('img-mode', S.img);
}

function setupControls(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-cat]'), function(b){
    b.addEventListener('click', function(){
      var c = b.dataset.cat;
      S.cats[c] = !S.cats[c];
      if(!S.cats[c] && S.open){
        var r = DATA.filter(function(x){ return x.key === S.open; })[0];
        if(r && r.cat === c) S.open = null;
      }
      render();
    });
  });

  $('allplanets').addEventListener('click', function(){
    var on = !(S.cats.terrestrial && S.cats.jovian);
    S.cats.terrestrial = S.cats.jovian = on;
    if(!on && S.open){
      var r = DATA.filter(function(x){ return x.key === S.open; })[0];
      if(r && (r.cat === 'terrestrial' || r.cat === 'jovian')) S.open = null;
    }
    render();
  });
  $('selall').addEventListener('click', function(){
    Object.keys(S.cats).forEach(function(k){ S.cats[k] = 1; }); render();
  });
  $('selnone').addEventListener('click', function(){
    Object.keys(S.cats).forEach(function(k){ S.cats[k] = 0; });
    S.open = null; render();
  });

  $('u-printed').addEventListener('click', function(){ S.unit = 'printed'; render(); });
  $('u-earth').addEventListener('click',   function(){ S.unit = 'earth';   render(); });
  $('t-bars').addEventListener('click',  function(){ S.bars  = !S.bars;  render(); });
  $('t-flags').addEventListener('click', function(){ S.flags = !S.flags; render(); });
  $('t-reset').addEventListener('click', function(){
    S.sortK = null; S.sortDir = 1; render();
  });
  $('t-img').addEventListener('click', function(){
    S.img = !S.img;
    syncControls();
    if(S.img) fitImage();
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && S.open){ S.open = null; render(); }
  });
}

/* ══ PRINTED PAGE VIEW ══════════════════════════════════════════ */
var IV = {scale:1, fit:1, max:1, x:0, y:0, w:0, h:0, drag:null};

function fitImage(){
  var img = $('pageimg'), box = $('imgview');
  if(!img.naturalWidth) return;
  IV.w = img.naturalWidth; IV.h = img.naturalHeight;
  var bw = box.clientWidth - 24, bh = box.clientHeight - 24;
  IV.fit = Math.min(bw / IV.w, bh / IV.h);
  IV.max = Math.max(IV.fit * 2.5, Math.min(1, IV.fit * 8));
  IV.scale = IV.fit;
  IV.x = (box.clientWidth  - IV.w * IV.scale) / 2;
  IV.y = (box.clientHeight - IV.h * IV.scale) / 2;
  applyImage();
}

function clampImage(){
  var box = $('imgview');
  var sw = IV.w * IV.scale, sh = IV.h * IV.scale;
  IV.x = (sw <= box.clientWidth)  ? (box.clientWidth  - sw) / 2
       : Math.min(0, Math.max(box.clientWidth  - sw, IV.x));
  IV.y = (sh <= box.clientHeight) ? (box.clientHeight - sh) / 2
       : Math.min(0, Math.max(box.clientHeight - sh, IV.y));
}

function applyImage(){
  clampImage();
  $('pageimg').style.transform =
    'translate(' + IV.x.toFixed(1) + 'px,' + IV.y.toFixed(1) + 'px) scale(' + IV.scale + ')';
  $('zlabel').textContent = Math.round(IV.scale / IV.fit * 100) + '%';
}

function zoomAt(factor, px, py){
  var box = $('imgview');
  if(px === undefined){ px = box.clientWidth / 2; py = box.clientHeight / 2; }
  var ns = Math.max(IV.fit, Math.min(IV.max, IV.scale * factor));
  if(ns === IV.scale) return;
  IV.x = px - (px - IV.x) * (ns / IV.scale);
  IV.y = py - (py - IV.y) * (ns / IV.scale);
  IV.scale = ns;
  applyImage();
}

function setupImage(){
  var img = $('pageimg'), box = $('imgview');
  img.addEventListener('load', function(){ if(S.img) fitImage(); });
  $('zin').addEventListener('click',  function(){ zoomAt(1.4); });
  $('zout').addEventListener('click', function(){ zoomAt(1 / 1.4); });
  $('zfit').addEventListener('click', fitImage);

  box.addEventListener('wheel', function(e){
    if(!S.img) return;
    e.preventDefault();
    var r = box.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
  }, {passive:false});

  img.addEventListener('pointerdown', function(e){
    IV.drag = {x:e.clientX, y:e.clientY, ox:IV.x, oy:IV.y, id:e.pointerId};
    img.classList.add('drag');
    try{ img.setPointerCapture(e.pointerId); }catch(err){}
  });
  img.addEventListener('pointermove', function(e){
    if(!IV.drag) return;
    if(e.buttons === 0){ endDrag(); return; }       // missed pointerup
    IV.x = IV.drag.ox + (e.clientX - IV.drag.x);
    IV.y = IV.drag.oy + (e.clientY - IV.drag.y);
    applyImage();
  });
  function endDrag(){
    if(!IV.drag) return;
    try{ img.releasePointerCapture(IV.drag.id); }catch(err){}
    IV.drag = null; img.classList.remove('drag');
  }
  img.addEventListener('pointerup', endDrag);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  window.addEventListener('blur', endDrag);
  document.addEventListener('visibilitychange', function(){ if(document.hidden) endDrag(); });

  window.addEventListener('resize', function(){
    if(S.img){ clampImage(); applyImage(); }
  });
}

/* ══ INIT ═══════════════════════════════════════════════════════ */
function init(){
  $('pageimg').src = PAGE_IMG;
  setupControls();
  setupImage();
  render();
}
init();
</script>
