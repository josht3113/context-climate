<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="core-sample-tools.css">
<title>Find the Front — ContextClimate</title>
<style>
:root { --tool-accent: var(--accent-earth); --f-cold: #6D96D8; --f-warm: #D9603F; --f-low: #E36A5C; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 18px; }
.top .spacer { flex: 1; min-width: 0; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; display: none; flex-direction: column; min-width: 180px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu.open { display: flex; }
.menu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.menu button:hover { background: var(--color-surface); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

/* floating chips */
.chips { position: absolute; top: 8px; display: flex; align-items: center; gap: 6px; z-index: 5; }
.chips-l { left: 10px; }
.chips-r { right: 10px; }
.tgl { padding: 6px 12px; font-size: 13px; background: rgba(38,43,39,.94); white-space: nowrap; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl .sx { display: none; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.zoom { display: flex; align-items: center; background: rgba(38,43,39,.94); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
.zoom button { background: none; border: none; border-right: 1px solid var(--color-border); color: var(--color-text-primary); font-family: var(--font-mono);
  font-size: 17px; font-weight: 700; width: 36px; height: 32px; cursor: pointer; }
.zoom button:hover:not(:disabled) { background: var(--color-surface-2); }
.zoom button:disabled { opacity: .35; cursor: default; }
.zoom #bFit { width: auto; padding: 0 12px; font-size: 13px; letter-spacing: .06em; }
.zoom #bFit.is-active { color: var(--tool-accent); }
.zoom .zl { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--color-text-primary); padding: 0 12px; min-width: 52px; text-align: center; }

/* control bar */
.controls { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--color-border); background: var(--color-surface); min-height: 62px; }
.tools { flex: none; }
.tools .cc-segmented-btn { font-family: var(--font-body); font-size: 15px; font-weight: 600; padding: 12px 16px; text-transform: none; letter-spacing: 0;
  display: inline-flex; align-items: center; gap: 8px; color: var(--color-text-primary); }
.tools .sw { width: 13px; height: 13px; border-radius: 2px; flex: none; }
.tools .lsym { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1; color: var(--f-low); }
.tools [data-tool=cold].is-active { background: var(--f-cold); color: #12161A; }
.tools [data-tool=warm].is-active { background: var(--f-warm); color: #12161A; }
.tools [data-tool=low].is-active { background: var(--f-low); color: #12161A; }
.tools .is-active .sw { display: none; }
.tools [data-tool=low].is-active .lsym { color: #12161A; }
.edit { display: grid; grid-template-columns: auto auto; gap: 4px; flex: none; }
.edit .cc-btn { padding: 4px 11px; font-size: 13px; white-space: nowrap; }
.edit .cc-btn:disabled { opacity: .4; cursor: default; }
.controls .spacer { flex: 1; min-width: 0; }
.check { flex: none; align-self: stretch; padding: 8px 20px; font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); white-space: nowrap; }
.check:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.check.glow { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } 50% { box-shadow: 0 0 0 5px rgba(60,163,174,.28); } }
@media (prefers-reduced-motion: reduce) { .check.glow { animation: none; } }
.answer { flex: none; align-self: stretch; padding: 8px 16px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.answer:disabled { opacity: .4; cursor: not-allowed; }

/* readout card */
.card { padding: 10px 16px 12px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card > * { flex-shrink: 0; }
.ctabs { display: flex; margin-bottom: 10px; position: sticky; top: -10px; z-index: 2; box-shadow: 0 -10px 0 var(--color-surface); }
.ctabs .cc-segmented-btn { flex: 1; font-size: 13px; padding: 8px 6px; }
.ctabs .cc-segmented-btn:disabled { opacity: .4; cursor: default; }
.card .eb { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .eb span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .eb .tag { font-size: 12px; letter-spacing: .06em; color: #E2BE58; border: 1px solid #E2BE5866; border-radius: 3px; padding: 1px 6px; flex: none; }
.card canvas.stn { width: 100%; height: 160px; display: block; margin: 2px 0; }
.card .r { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 5px 0 4px; border-top: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; text-align: right; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--color-text-secondary); margin-left: 5px; }
.card .sub { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; margin-top: 12px; padding-bottom: 4px; }
.card .sub span:last-child { color: var(--color-text-secondary); font-weight: 500; }
.rt { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 4px; }
.rt th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; text-align: right; padding: 6px 0 4px; font-weight: 700; }
.rt th:first-child { width: 40%; }
.rt td { font-family: var(--font-mono); font-size: 16px; font-weight: 700; text-align: right; padding: 6px 0 5px; border-top: 1px solid var(--color-border); color: var(--color-text-primary); white-space: nowrap; }
.rt td.l { text-align: left; font-size: 12px; font-weight: 500; white-space: normal; line-height: 1.2; }
.rt td.w { font-size: 14px; letter-spacing: -.02em; }
.badge { display: inline-block; font-family: var(--font-body); font-size: 13px; font-weight: 700; border: 1px solid; border-radius: 3px; padding: 0 4px; }
.dim { font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--color-text-secondary); }
.wl { display: block; padding: 2px 0 2px 44px; text-indent: -44px; line-height: 1.4; }
.wl .wk { display: inline-block; text-indent: 0; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; width: 44px; }
.wl .sep { color: var(--color-text-muted); }
.stn-link { font-family: var(--font-body); font-size: 13px; color: var(--color-text-primary); text-decoration: underline dashed; text-underline-offset: 3px; cursor: default; white-space: nowrap; }
.stn-link:hover { color: var(--tool-accent); }
.card .r .v .badge { margin-left: 6px; vertical-align: 2px; }
.stale { opacity: .45; }
.card .eb.stale { opacity: 1; }
@media (min-height: 820px) {
  .card canvas.stn { height: 190px; }
  .card .r { padding: 8px 0 7px; }
  .card .v { font-size: 23px; }
  .rt td { padding: 9px 0 8px; }
}
@media (max-height: 700px) {
  .card canvas.stn { height: 140px; margin: 0; }
  .card .r { padding: 4px 0 3px; }
  .rt td { padding: 4px 0 3px; }
  .card .sub { margin-top: 8px; }
}
@media (max-height: 620px) {
  .rt td { padding: 3px 0 2px; }
  .rt th { padding: 3px 0 2px; }
  .wl { line-height: 1.32; padding-top: 1px; padding-bottom: 1px; }
  .card .sub { margin-top: 6px; padding-bottom: 2px; }
  .ctabs { margin-bottom: 7px; }
  .card .v { font-size: 19px; }
  .card canvas.stn { height: 124px; }
  .controls { min-height: 56px; padding: 5px 10px; }
  .tools .cc-segmented-btn { padding: 10px 14px; }
}
@media (max-height: 580px) {
  .card { padding: 8px 14px; }
  .ctabs { margin-bottom: 6px; }
  .ctabs .cc-segmented-btn { padding: 6px; }
  .card canvas.stn { height: 112px; }
  .card .r { padding: 2px 0 1px; }
  .rt td { padding: 2px 0 1px; font-size: 15px; }
  .rt th { padding: 3px 0 2px; }
  .wl { line-height: 1.3; padding: 1px 0 1px 46px; }
  .card .sub { margin-top: 5px; padding-bottom: 2px; }
}
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 14px; } }
@media (max-width: 1366px) {
  .main { grid-template-columns: minmax(0, 1fr) 272px; }
  .card { padding: 10px 14px; }
  .tools .cc-segmented-btn { padding: 12px 13px; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .top { gap: 10px; }
  .top h1 { font-size: 22px; }
  .tabs .cc-segmented-btn { padding: 11px 11px; }
  .answer .lw { display: none; }
  .tgl .lx { display: none; }
  .tgl .sx { display: inline; }
  .card .v { font-size: 20px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .tools .lx { display: none; }
  .tools .cc-segmented-btn { padding: 12px 12px; }
  .check .lx { display: none; }
  .zoom .zl { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Find the Front</h1>
    <div class="cc-segmented tabs" id="scns">
      <button class="cc-segmented-btn is-active" data-scn="0">Midwest Cyclone</button>
      <button class="cc-segmented-btn" data-scn="1">Plains Cyclone</button>
      <button class="cc-segmented-btn" data-scn="2">Mississippi Valley Low</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="menu" id="pmenu"></div>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips chips-l">
          <button class="cc-btn tgl is-active" data-layer="dew">Dewpoint<span class="lx"> groups</span></button>
          <button class="cc-btn tgl" data-layer="wind">Wind<span class="lx"> arrows</span></button>
          <button class="cc-btn tgl" data-layer="temp">Temp<span class="lx">erature shading</span></button>
          <button class="cc-btn tgl is-active" data-layer="isobars">Isobars</button>
          <button class="cc-btn tgl" data-layer="names"><span class="lx">Station names</span><span class="sx">Names</span></button>
        </div>
        <div class="chips chips-r">
          <div class="zoom">
            <button id="bZout" title="Zoom out">−</button>
            <span class="zl" id="zLvl">Fit</span>
            <button id="bZin" title="Zoom in">+</button>
            <button id="bFit" class="is-active">FIT</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <div class="cc-segmented tools" id="tools">
          <button class="cc-segmented-btn is-active" data-tool="cold"><span class="sw" style="background:#6D96D8"></span><span>Cold<span class="lx"> front</span></span></button>
          <button class="cc-segmented-btn" data-tool="warm"><span class="sw" style="background:#D9603F"></span><span>Warm<span class="lx"> front</span></span></button>
          <button class="cc-segmented-btn" data-tool="low"><span class="lsym">L</span>Low</button>
        </div>
        <div class="edit">
          <button class="cc-btn" id="bUndo">↶ Undo</button>
          <button class="cc-btn" id="bFlip">⇄ Flip</button>
          <button class="cc-btn" id="bClear">Clear</button>
          <button class="cc-btn" id="bClearAll">Clear all</button>
        </div>
        <div class="spacer"></div>
        <button class="cc-btn check glow" id="bCheck">Check<span class="lx"> my analysis</span></button>
        <button class="cc-btn answer" id="bAnswer" disabled><span class="lb">Show<span class="lw"> analyzed</span> fronts</span></button>
      </div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

    if (P[k]<pmin) pmin=P[k]; if (P[k]>pmax) pmax=P[k];
    if (T[k]<tmin) tmin=T[k]; if (T[k]>tmax) tmax=T[k];
  }
  FIELD = { P, T, pmin, pmax, tmin, tmax };
}
const gLon = i => DOM.lon0 + (DOM.lon1-DOM.lon0)*i/(GN.nx-1);
const gLat = j => DOM.lat1 - (DOM.lat1-DOM.lat0)*j/(GN.ny-1);

/* marching squares → line segments for one level */
function contour(grid, level){
  const segs = [];
  const V = (i,j) => grid[j*GN.nx+i];
  const ip = (v1,v2,a,b) => a + (b-a)*(level-v1)/(v2-v1);
  for (let j=0;j<GN.ny-1;j++){
    for (let i=0;i<GN.nx-1;i++){
      const v = [V(i,j), V(i+1,j), V(i+1,j+1), V(i,j+1)];
      let idx = 0; for (let k=0;k<4;k++) if (v[k] > level) idx |= (1<<k);
      if (idx === 0 || idx === 15) continue;
      const x0=gLon(i), x1=gLon(i+1), y0=gLat(j), y1=gLat(j+1);
      const E = [
        [ip(v[0],v[1],x0,x1), y0],           // top
        [x1, ip(v[1],v[2],y0,y1)],           // right
        [ip(v[3],v[2],x0,x1), y1],           // bottom
        [x0, ip(v[0],v[3],y0,y1)]            // left
      ];
      const TBL = [[],[[3,0]],[[0,1]],[[3,1]],[[1,2]],[[3,0],[1,2]],[[0,2]],[[3,2]],
                   [[2,3]],[[2,0]],[[0,1],[2,3]],[[2,1]],[[1,3]],[[1,0]],[[0,3]],[]];
      for (const [a,b] of TBL[idx]) segs.push([E[a],E[b]]);
    }
  }
  return segs;
}

/* Link the segments end to end into continuous isobars. Marching squares emits
   them in scan order, so without this an isobar is a pile of unordered
   fragments — you cannot draw it as one smooth line, and a label placed on
   "segment 40" can land on a completely different branch of the same level. */
function stitch(segs){
  const key = p => Math.round(p[0]*2000)+','+Math.round(p[1]*2000);
  const ends = new Map();
  segs.forEach(([a,b],i) => {
    for (const [p,q] of [[a,b],[b,a]]){
      const k = key(p);
      if (!ends.has(k)) ends.set(k,[]);
      ends.get(k).push({i, to:q});
    }
  });
  const used = new Array(segs.length).fill(false), lines = [];
  for (let i=0;i<segs.length;i++){
    if (used[i]) continue;
    used[i] = true;
    const line = [segs[i][0], segs[i][1]];
    for (let dir=0; dir<2; dir++){
      for (;;){
        const end = dir ? line[0] : line[line.length-1];
        const cand = (ends.get(key(end))||[]).find(c => !used[c.i]);
        if (!cand) break;
        used[cand.i] = true;
        if (dir) line.unshift(cand.to); else line.push(cand.to);
      }
    }
    lines.push(line);
  }
  return lines;
}

/* ── color ramps ───────────────────────────────────────────────── */
const TRAMP = [[15,'#2E4A86'],[30,'#4878BE'],[42,'#7FAED2'],[50,'#BFC7C0'],
               [58,'#E8CE86'],[68,'#DE9350'],[80,'#C4523A']];
function rampColor(v){
  if (v <= TRAMP[0][0]) return TRAMP[0][1];
  for (let i=1;i<TRAMP.length;i++){
    if (v <= TRAMP[i][0]){
      const [a,ca] = TRAMP[i-1], [b,cb] = TRAMP[i], t = (v-a)/(b-a);
      const pa = parseInt(ca.slice(1),16), pb = parseInt(cb.slice(1),16);
      const m = (sh) => Math.round((((pa>>sh)&255)*(1-t) + ((pb>>sh)&255)*t));
      return [m(16), m(8), m(0)];
    }
  }
  const p = parseInt(TRAMP[TRAMP.length-1][1].slice(1),16);
  return [(p>>16)&255,(p>>8)&255,p&255];
}
function rgbOf(c){ if (Array.isArray(c)) return c; const p = parseInt(c.slice(1),16); return [(p>>16)&255,(p>>8)&255,p&255]; }
const dewCol = td => (td >= 50 ? COL.dewWet : COL.dewDry);

/* ── station model ── */
function stationModel(ctx, cx, cy, o, opt){
  opt = opt || {};
  const r = opt.r || 8.5, fs = opt.fs || 13;
  const numCol = opt.plain ? COL.text : COL.text;
  /* wind barb — points toward the direction the wind is coming FROM */
  if (o.ws >= 3){
    const a = (o.wd - 90)*Math.PI/180, dx = Math.cos(a), dy = Math.sin(a);
    const L = r*2.9, bx = cx+dx*r, by = cy+dy*r, ex = cx+dx*(r+L), ey = cy+dy*(r+L);
    ctx.save(); ctx.strokeStyle = COL.text; ctx.lineWidth = Math.max(1.4, r*0.18); ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
    let rem = Math.round(o.ws/5)*5, pos = 0;
    const px = -dy, py = dx, step = r*0.44;
    while (rem >= 50 && pos < 4){
      const p0=[ex-dx*step*pos, ey-dy*step*pos], p1=[ex-dx*step*(pos+1), ey-dy*step*(pos+1)];
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p0[0]+px*r*0.95,p0[1]+py*r*0.95); ctx.lineTo(p1[0],p1[1]);
      ctx.closePath(); ctx.fillStyle = COL.text; ctx.fill(); rem -= 50; pos += 1.2;
    }
    while (rem >= 10 && pos < 6){
      const p0=[ex-dx*step*pos, ey-dy*step*pos];
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p0[0]+px*r*0.95,p0[1]+py*r*0.95); ctx.stroke();
      rem -= 10; pos += 1;
    }
    if (rem >= 5){
      const p0=[ex-dx*step*Math.max(pos,0.9), ey-dy*step*Math.max(pos,0.9)];
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p0[0]+px*r*0.5,p0[1]+py*r*0.5); ctx.stroke();
    }
    ctx.restore();
  }
  /* sky cover */
  const e = clamp(Math.round(o.sky),0,8);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle = '#1B201D'; ctx.fill();
  ctx.strokeStyle = COL.text; ctx.lineWidth = Math.max(1.3, r*0.19); ctx.stroke();
  if (e >= 8){ ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle = COL.text; ctx.fill(); }
  else if (e > 0){
    const frac = (e===7?7.4:e)/8;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); ctx.closePath();
    ctx.fillStyle = COL.text; ctx.fill();
    if (e===1||e===3||e===5) line(ctx,cx,cy-r,cx,cy+r,COL.text,Math.max(1.2,r*0.18));
  }
  if (opt.compact){
    if (opt.dewColor){ ctx.save(); ctx.fillStyle = dewCol(o.Td); ctx.beginPath(); ctx.arc(cx - r - 5.5, cy, 3.4, 0, 7); ctx.fill(); ctx.restore(); }
    return;
  }
  /* numbers */
  const tdC = (opt.dewColor === false) ? COL.text : dewCol(o.Td);
  txt(ctx, String(o.T),  cx-r*1.45, cy-r*0.30, `700 ${fs}px ${FONT.mono}`, COL.text, 'right');
  txt(ctx, String(o.Td), cx-r*1.45, cy+r*1.42, `700 ${fs}px ${FONT.mono}`, tdC, 'right');
  const code = String(Math.round(o.P*10) % 1000).padStart(3,'0');
  txt(ctx, code, cx+r*1.45, cy-r*0.30, `700 ${fs}px ${FONT.mono}`, COL.text, 'left');
  if (o.wx === 'rain'){
    ctx.save(); ctx.fillStyle = COL.green;
    for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(cx-r*0.34+(i%2)*r*0.68, cy+r*1.62+Math.floor(i/2)*r*0.62, r*0.19, 0, 7); ctx.fill(); }
    ctx.restore();
  }
}

/* ── ESSRT front symbols along a projected polyline ── */
function frontLine(ctx, pts, kind, side, scale){
  if (pts.length < 2) return;
  const col = kind === 'cold' ? COL.cold : COL.warm;
  const s = 7*(scale||1);
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3.2*(scale||1); ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
  /* walk the line at fixed spacing, dropping symbols */
  const spacing = s*3.4;
  let carry = spacing*0.6;
  for (let i=0;i<pts.length-1;i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy);
    if (L < 1e-6) continue;
    const ux = dx/L, uy = dy/L;
    const nx = -uy*side, ny = ux*side;
    for (let t = carry; t < L; t += spacing){
      const cx = x1+ux*t, cy = y1+uy*t;
      ctx.fillStyle = col;
      if (kind === 'cold'){
        ctx.beginPath();
        ctx.moveTo(cx-ux*s, cy-uy*s);
        ctx.lineTo(cx+nx*s*1.4, cy+ny*s*1.4);
        ctx.lineTo(cx+ux*s, cy+uy*s);
        ctx.closePath(); ctx.fill();
      } else {
        const a = Math.atan2(ny,nx);
        ctx.beginPath(); ctx.arc(cx,cy,s,a-Math.PI/2,a+Math.PI/2); ctx.closePath(); ctx.fill();
      }
    }
    carry = spacing - ((L - carry) % spacing);
    if (carry >= spacing) carry -= spacing;
  }
  ctx.restore();
}

/* Front symbols sit on the side the boundary is advancing toward, worked out from the stations themselves. */
function sideOf(poly, kind){
  if (!poly || poly.length < 2) return -1;
  const A = [], B = [];
  SCEN[S.scn].st.forEach(s => {
    const r = signedDist(poly, [s.lon, s.lat]);
    if (r.d > 430) return;
    (r.s > 0 ? A : B).push(s.T);
  });
  if (!A.length || !B.length) return -1;
  const mA = A.reduce((x,y)=>x+y,0)/A.length, mB = B.reduce((x,y)=>x+y,0)/B.length;
  const warmSide = (mA > mB) ? -1 : 1;         // frontLine's +1 normal is signedDist's negative side
  return (kind === 'cold') ? warmSide : -warmSide;
}

function resample(poly, n){
  const segLen = [];
  let total = 0;
  for (let i=0;i<poly.length-1;i++){ const L = kmDist(poly[i],poly[i+1]); segLen.push(L); total += L; }
  if (total === 0) return [poly[0]];
  const out = [];
  for (let k=0;k<=n;k++){
    let target = total*k/n, i = 0;
    while (i < segLen.length-1 && target > segLen[i]){ target -= segLen[i]; i++; }
    const t = segLen[i] ? target/segLen[i] : 0;
    out.push([ poly[i][0] + (poly[i+1][0]-poly[i][0])*t, poly[i][1] + (poly[i+1][1]-poly[i][1])*t ]);
  }
  return out;
}
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
/* wind directions are angles: an arithmetic mean of 350 and 10 is 180, which is
   the opposite of the truth. Average the unit vectors instead. */
const meanDir = a => {
  const s = mean(a.map(d => Math.sin(d*Math.PI/180))), c = mean(a.map(d => Math.cos(d*Math.PI/180)));
  return (Math.atan2(s,c)*180/Math.PI + 360) % 360;
};

function evaluate(){
  const sc = SCEN[S.scn], res = { fronts:{}, low:null, evidence:{} };
  ['cold','warm'].forEach(k => {
    const drawn = S.draw[k];
    const key = (k === 'cold') ? sc.cf : sc.wf;
    const dk = (k === 'cold') ? 'dCF' : 'dWF', sk = (k === 'cold') ? 'sCF' : 'sWF';
    const near = sc.st.filter(s => s[dk] < 430);
    /* what the data actually shows across the analyzed front */
    const wS = near.filter(s => s[sk] > 0), cS = near.filter(s => s[sk] <= 0);
    if (wS.length && cS.length){
      res.evidence[k] = {
        dT: Math.round(mean(wS.map(s=>s.T)) - mean(cS.map(s=>s.T))),
        dTd: Math.round(mean(wS.map(s=>s.Td)) - mean(cS.map(s=>s.Td))),
        wdW: Math.round(meanDir(wS.map(s=>s.wd))), wdC: Math.round(meanDir(cS.map(s=>s.wd)))
      };
    }
    if (drawn.length < 2) return;
    const d1 = mean(resample(drawn,26).map(p => signedDist(key,p).d));
    const d2 = mean(resample(key,26).map(p => signedDist(drawn,p).d));
    const meanD = Math.round((d1+d2)/2);
    let right = 0;
    const wrongA = [], wrongB = [];
    near.forEach(s => {
      const sd = signedDist(drawn, [s.lon,s.lat]).s;
      if (Math.sign(sd) === Math.sign(s[sk])) { right++; wrongB.push(s.name); }
      else wrongA.push(s.name);
    });
    let wrong = wrongA;
    if (right < near.length/2){ right = near.length - right; wrong = wrongB; }
    res.fronts[k] = { meanD, right, total: near.length, wrong };
  });
  if (S.low) res.low = Math.round(kmDist(S.low, sc.L));
  return res;
}

const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const dirName = d => COMPASS[Math.round(((d%360)+360)%360/22.5)%16];

/* ═══════════════════════════════════════════════════════════════════
   VIEW — zoom + pan. One projection serves the screen, the minimap and
   every export; the map domain never changes, only the view onto it.
   ═══════════════════════════════════════════════════════════════════ */
const UW = (DOM.lon1 - DOM.lon0)*KLON, UH = DOM.lat1 - DOM.lat0;
const LOD_FULL = 40;     // px per degree of latitude at which full station models are drawn
const SC_MAX = 96;       // px per degree of latitude at maximum zoom
const PAD = 12;
const V = { z: 1, cLon: (DOM.lon0 + DOM.lon1)/2, cLat: (DOM.lat0 + DOM.lat1)/2 };
const PAD_T = 48;          // keeps the chip row clear of the map
const baseScale = (W, H, pt) => Math.min((W - 2*PAD)/UW, (H - (pt || PAD) - PAD)/UH);
const centerY = (H, pt) => (pt || PAD) + (H - (pt || PAD) - PAD)/2;
function makeView(W, H, v, pt){
  const sc0 = baseScale(W, H, pt), sc = sc0*v.z, cx = W/2, cy = centerY(H, pt);
  const P = (lon, lat) => [cx + (lon - v.cLon)*KLON*sc, cy - (lat - v.cLat)*sc];
  const inv = (x, y) => [v.cLon + (x - cx)/(KLON*sc), v.cLat - (y - cy)/sc];
  const a = P(DOM.lon0, DOM.lat1), b = P(DOM.lon1, DOM.lat0);
  return { P, inv, sc, sc0, ox: a[0], oy: a[1], w: b[0] - a[0], h: b[1] - a[1], W, H };
}
function clampView(v, W, H, pt){
  const sc0 = baseScale(W, H, pt);
  v.z = clamp(v.z, 1, Math.max(1, SC_MAX/sc0));
  const sc = sc0*v.z, hl = (W/2 - PAD)/(KLON*sc), ht = ((H - (pt || PAD) - PAD)/2)/sc;
  const fit = (c, lo, hi, half) => (hi - lo) <= 2*half ? (lo + hi)/2 : clamp(c, lo + half, hi - half);
  v.cLon = fit(v.cLon, DOM.lon0, DOM.lon1, hl);
  v.cLat = fit(v.cLat, DOM.lat0, DOM.lat1, ht);
}
const fitView = () => { V.z = 1; V.cLon = (DOM.lon0 + DOM.lon1)/2; V.cLat = (DOM.lat0 + DOM.lat1)/2; };

/* isobars are fixed in lon/lat for a scenario — contour once, project every frame */
let ISO = [];
function buildIso(){
  ISO = [];
  const lo = Math.ceil(FIELD.pmin/4)*4, hi = Math.floor(FIELD.pmax/4)*4;
  for (let lev = lo; lev <= hi; lev += 4) ISO.push({ lev, lines: stitch(contour(FIELD.P, lev)).filter(l => l.length >= 2) });
}

/* ═══════════════════════════════════════════════════════════════════
   THE MAP
   ═══════════════════════════════════════════════════════════════════ */
function drawMap(ctx, W, H, opt){
  opt = opt || {};
  const sc = SCEN[S.scn], PR = opt.view, P = PR.P;
  const full = opt.full !== undefined ? opt.full : PR.sc >= LOD_FULL;
  ctx.save();
  ctx.fillStyle = '#1C211E'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.rect(PR.ox, PR.oy, PR.w, PR.h); ctx.clip();
  ctx.fillStyle = '#202622'; ctx.fillRect(PR.ox, PR.oy, PR.w, PR.h);

  /* temperature shading */
  if (S.layers.temp){
    const off = document.createElement('canvas');
    off.width = GN.nx; off.height = GN.ny;
    const octx = off.getContext('2d'), img = octx.createImageData(GN.nx, GN.ny);
    for (let k = 0; k < GN.nx*GN.ny; k++){
      const c = rgbOf(rampColor(FIELD.T[k]));
      img.data[k*4] = c[0]; img.data[k*4+1] = c[1]; img.data[k*4+2] = c[2]; img.data[k*4+3] = 132;
    }
    octx.putImageData(img, 0, 0);
    ctx.save(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    const a = P(DOM.lon0, DOM.lat1), b = P(DOM.lon1, DOM.lat0);
    ctx.drawImage(off, a[0], a[1], b[0] - a[0], b[1] - a[1]); ctx.restore();
  }

  /* lakes and the Gulf */
  ctx.save();
  WATER.forEach(poly => {
    ctx.beginPath();
    poly.forEach((p, i) => { const q = P(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.closePath();
    ctx.fillStyle = 'rgba(44,62,74,0.72)'; ctx.fill();
    ctx.strokeStyle = 'rgba(150,186,206,0.30)'; ctx.lineWidth = 1; ctx.stroke();
  });
  ctx.restore();

  /* state / coast outlines */
  ctx.save(); ctx.strokeStyle = 'rgba(232,228,217,0.42)'; ctx.lineWidth = 1.1; ctx.lineJoin = 'round';
  GEO.forEach(seg => {
    ctx.beginPath();
    seg.forEach((p, i) => { const q = P(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
    ctx.stroke();
  });
  ctx.restore();

  /* isobars — 4 mb interval, anchored to 1000/1004/1008…; labels scored for clear space */
  if (S.layers.isobars){
    const placed = [];
    const stPx = sc.st.map(st => P(st.lon, st.lat));
    const vis = (x, y) => x > Math.max(PR.ox, 0) + 26 && x < Math.min(PR.ox + PR.w, W) - 26 && y > Math.max(PR.oy, 0) + 18 && y < Math.min(PR.oy + PR.h, H) - 18;
    const minLen = full ? 140 : 90;
    ISO.forEach(({ lev, lines }) => {
      ctx.save();
      ctx.strokeStyle = 'rgba(232,228,217,0.55)'; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const drawn = [];
      lines.forEach(ln => {
        const px = ln.map(q => P(q[0], q[1]));
        ctx.beginPath(); px.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
        drawn.push(px);
      });
      ctx.restore();
      const cands = [];
      drawn.forEach(px => {
        let len = 0; const cum = [0];
        for (let k = 1; k < px.length; k++){ len += Math.hypot(px[k][0] - px[k-1][0], px[k][1] - px[k-1][1]); cum.push(len); }
        if (len < minLen) return;
        for (let f = 0.10; f <= 0.90; f += 0.05){
          const t = len*f;
          let k = 1; while (k < cum.length - 1 && cum[k] < t) k++;
          const p1 = px[k-1], p2 = px[k];
          const mx = (p1[0] + p2[0])/2, my = (p1[1] + p2[1])/2;
          if (!vis(mx, my)) continue;
          let dSt = 1e9; stPx.forEach(q => { dSt = Math.min(dSt, Math.hypot(q[0] - mx, q[1] - my)); });
          let ang = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
          if (ang > Math.PI/2) ang -= Math.PI;
          if (ang < -Math.PI/2) ang += Math.PI;
          cands.push({ mx, my, ang, len, dSt });
        }
      });
      const want = cands.some(c => c.len > 1000) ? 2 : 1;
      const chosen = [];
      for (let pick = 0; pick < want; pick++){
        let best = null, bestScore = -1e9;
        cands.forEach(c => {
          let dLab = 1e9;
          placed.concat(chosen).forEach(q => { dLab = Math.min(dLab, Math.hypot(q[0] - c.mx, q[1] - c.my)); });
          const score = Math.min(c.dSt, 70)*2.2 + Math.min(dLab, 160) + c.len*0.015;
          if (score > bestScore){ bestScore = score; best = c; }
        });
        if (!best) break;
        chosen.push([best.mx, best.my]);
        ctx.save();
        ctx.translate(best.mx, best.my); ctx.rotate(best.ang);
        ctx.font = `700 13px ${FONT.mono}`;
        const t2 = String(lev), tw = ctx.measureText(t2).width;
        ctx.fillStyle = '#202622'; ctx.fillRect(-tw/2 - 5, -9, tw + 10, 18);
        ctx.fillStyle = 'rgba(232,228,217,0.92)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(t2, 0, 0.5);
        ctx.restore();
      }
      chosen.forEach(c => placed.push(c));
    });
  }

  /* analyzed answer */
  if (S.showAnswer){
    const cf = sc.cf.map(p => P(p[0], p[1])), wf = sc.wf.map(p => P(p[0], p[1]));
    ctx.save(); ctx.globalAlpha = 0.85;
    frontLine(ctx, cf, 'cold', sideOf(sc.cf, 'cold'), 1.0);
    frontLine(ctx, wf, 'warm', sideOf(sc.wf, 'warm'), 1.0);
    ctx.restore();
  }

  /* wind arrows, colored by dewpoint group */
  if (S.layers.wind){
    const L = clamp(PR.sc*0.9, 22, 44);
    sc.st.forEach(s => {
      const p = P(s.lon, s.lat);
      const a = (s.wd + 90)*Math.PI/180, ax = Math.cos(a), ay = Math.sin(a);
      arrow(ctx, p[0] - ax*L*0.42, p[1] - ay*L*0.42, p[0] + ax*L*0.78, p[1] + ay*L*0.78, dewCol(s.Td), full ? 2.6 : 2.2, full ? 9 : 7);
    });
  }

  /* the student's fronts */
  ['cold', 'warm'].forEach(k => {
    const pts = S.draw[k].map(p => P(p[0], p[1]));
    if (pts.length >= 2) frontLine(ctx, pts, k, S.flip[k]*sideOf(S.draw[k], k), 1.05);
    else if (pts.length === 1){
      ctx.save(); ctx.fillStyle = k === 'cold' ? COL.cold : COL.warm;
      ctx.beginPath(); ctx.arc(pts[0][0], pts[0][1], 4.5, 0, 7); ctx.fill(); ctx.restore();
    }
    pts.forEach(q => { ctx.save(); ctx.strokeStyle = 'rgba(232,228,217,0.70)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, 7); ctx.stroke(); ctx.restore(); });
  });

  /* wrong-side stations after a check, and the station under the pointer */
  const ring = (s, col, rr, w, dash) => { const p = P(s.lon, s.lat); ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.arc(p[0], p[1], rr, 0, 7); ctx.stroke(); ctx.restore(); };
  const rr = full ? 15 : 10;
  if (S.checked && !S.stale && opt.rings !== false){
    const wrong = new Set([...(S.checked.fronts.cold ? S.checked.fronts.cold.wrong : []), ...(S.checked.fronts.warm ? S.checked.fronts.warm.wrong : [])]);
    sc.st.forEach(s => { if (wrong.has(s.name)) ring(s, '#E0705A', rr, 2.2, [4, 3]); });
  }

  /* stations */
  const nameBoxes = [];
  sc.st.forEach(s => {
    const p = P(s.lon, s.lat);
    if (p[0] < -60 || p[0] > W + 60 || p[1] < -60 || p[1] > H + 60) return;
    if (full) stationModel(ctx, p[0], p[1], s, { r: 8.5, fs: 13, dewColor: S.layers.dew });
    else stationModel(ctx, p[0], p[1], s, { r: 5.5, compact: true, dewColor: S.layers.dew });
    if (S.layers.names){
      ctx.save(); ctx.font = `600 13px ${FONT.body}`;
      const tw = ctx.measureText(s.name).width, ny = p[1] + (full ? 26 : 17);
      const bx = [p[0] - tw/2 - 4, ny - 12, p[0] + tw/2 + 4, ny + 4];
      if (nameBoxes.some(q => bx[0] < q[2] && bx[2] > q[0] && bx[1] < q[3] && bx[3] > q[1])){ ctx.restore(); return; }
      nameBoxes.push(bx);
      ctx.fillStyle = 'rgba(28,33,30,0.78)'; roundRect(ctx, p[0] - tw/2 - 4, ny - 12, tw + 8, 16, 3); ctx.fill();
      ctx.restore();
      txt(ctx, s.name, p[0], ny, `600 13px ${FONT.body}`, 'rgba(200,198,188,0.95)', 'center');
    }
  });
  if (opt.hover !== undefined && opt.hover !== null && sc.st[opt.hover]) ring(sc.st[opt.hover], COL.accent, rr + 2, 2.4);

  /* the analyzed L sits above the plot so it never hides behind the station reporting the lowest pressure */
  if (S.showAnswer){
    const l = P(sc.L[0], sc.L[1]);
    ctx.save(); ctx.beginPath(); ctx.arc(l[0], l[1], 15, 0, 7);
    ctx.fillStyle = 'rgba(30,35,32,0.86)'; ctx.fill();
    ctx.strokeStyle = COL.low; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    txt(ctx, 'L', l[0], l[1] + 9, `700 25px ${FONT.disp}`, COL.low, 'center');
  }
  /* the student's L */
  if (S.low){
    const l = P(S.low[0], S.low[1]);
    ctx.save(); ctx.beginPath(); ctx.arc(l[0], l[1], 15, 0, 7);
    ctx.fillStyle = 'rgba(30,35,32,0.72)'; ctx.fill();
    ctx.strokeStyle = COL.low; ctx.lineWidth = 2; ctx.setLineDash([3, 3]); ctx.stroke(); ctx.restore();
    txt(ctx, 'L', l[0], l[1] + 9, `700 25px ${FONT.disp}`, COL.low, 'center');
  }
  ctx.restore();   // map clip
  ctx.strokeStyle = COL.borderH; ctx.lineWidth = 1; ctx.strokeRect(PR.ox + 0.5, PR.oy + 0.5, PR.w - 1, PR.h - 1);

  if (sc.id === 'midwest' && opt.caption !== false){
    const t = 'Adapted from the Synoptic Meteorology pre-lab map';
    ctx.save(); ctx.font = `500 13px ${FONT.body}`; const tw = ctx.measureText(t).width; ctx.restore();
    const x = Math.min(PR.ox + PR.w, W) - 8, y = Math.min(PR.oy + PR.h, H) - 8;
    ctx.save(); ctx.fillStyle = 'rgba(28,33,30,0.80)'; roundRect(ctx, x - tw - 10, y - 16, tw + 12, 20, 3); ctx.fill(); ctx.restore();
    txt(ctx, t, x - 4, y - 2, `500 13px ${FONT.body}`, COL.text2, 'right');
  }
  ctx.restore();
  return PR;
}

/* legend for the active color layers — bottom-left of the stage */
function drawLegend(ctx, W, H, opt){
  const rows = [];
  if (S.layers.dew || S.layers.wind) rows.push('dew');
  if (S.layers.temp) rows.push('temp');
  if (!rows.length) return;
  const bw = 196, rh = 44, bh = 10 + rows.length*rh, x = 10, y = H - bh - (opt && opt.bottom || 10);
  ctx.save();
  ctx.fillStyle = 'rgba(26,31,28,0.92)'; roundRect(ctx, x, y, bw, bh, 5); ctx.fill();
  ctx.strokeStyle = COL.border; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  let yy = y + 8;
  rows.forEach(r => {
    if (r === 'dew'){
      txt(ctx, 'DEWPOINT', x + 10, yy + 12, `700 13px ${FONT.mono}`, COL.text2, 'left');
      const dot = (cx, col, t) => { ctx.save(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, yy + 29, 5, 0, 7); ctx.fill(); ctx.restore();
        txt(ctx, t, cx + 10, yy + 34, `600 13px ${FONT.body}`, col, 'left'); };
      dot(x + 16, COL.dewDry, '20s–40s'); dot(x + 104, COL.dewWet, '50s–60s');
    } else {
      txt(ctx, 'TEMPERATURE °F', x + 10, yy + 12, `700 13px ${FONT.mono}`, COL.text2, 'left');
      const gx = x + 10, gw = bw - 20, gy = yy + 18;
      const g = ctx.createLinearGradient(gx, 0, gx + gw, 0);
      for (let v = 15; v <= 80; v += 5){ const c = rgbOf(rampColor(v)); g.addColorStop((v - 15)/65, `rgb(${c[0]},${c[1]},${c[2]})`); }
      ctx.fillStyle = g; ctx.fillRect(gx, gy, gw, 8);
      [20, 40, 60, 80].forEach(v => txt(ctx, String(v), gx + (v - 15)/65*gw, gy + 22, `13px ${FONT.mono}`, COL.text2, v === 80 ? 'right' : 'center'));
    }
    yy += rh;
  });
}

/* minimap — where the current view sits on the whole map */
function drawMinimap(ctx, W, H, PR){
  const mh = clamp(Math.round(H*0.30), 120, 190), mw = Math.round(mh*UW/UH);
  const x = W - mw - 10, y = H - mh - 10;
  const s = mh/UH;
  const mp = (lon, lat) => [x + (lon - DOM.lon0)*KLON*s, y + (DOM.lat1 - lat)*s];
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#202622'; ctx.fillRect(x, y, mw, mh);
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, mw, mh); ctx.clip();
  WATER.forEach(poly => { ctx.beginPath(); poly.forEach((p, i) => { const q = mp(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.closePath(); ctx.fillStyle = 'rgba(44,62,74,0.85)'; ctx.fill(); });
  ctx.strokeStyle = 'rgba(232,228,217,0.30)'; ctx.lineWidth = 0.8;
  GEO.forEach(seg => { ctx.beginPath(); seg.forEach((p, i) => { const q = mp(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke(); });
  SCEN[S.scn].st.forEach(st => { const q = mp(st.lon, st.lat); ctx.fillStyle = S.layers.dew ? dewCol(st.Td) : 'rgba(232,228,217,0.75)'; ctx.beginPath(); ctx.arc(q[0], q[1], 1.8, 0, 7); ctx.fill(); });
  ['cold', 'warm'].forEach(k => { const pts = S.draw[k]; if (pts.length < 2) return; ctx.strokeStyle = k === 'cold' ? COL.cold : COL.warm; ctx.lineWidth = 2;
    ctx.beginPath(); pts.forEach((p, i) => { const q = mp(p[0], p[1]); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke(); });
  const a = mp(...PR.inv(0, 0)), b = mp(...PR.inv(W, H));
  ctx.fillStyle = 'rgba(60,163,174,0.14)'; ctx.fillRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
  ctx.strokeStyle = COL.accent; ctx.lineWidth = 1.6; ctx.strokeRect(a[0], a[1], b[0] - a[0], b[1] - a[1]);
  ctx.restore();
  ctx.strokeStyle = 'rgba(232,228,217,0.32)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, mw - 1, mh - 1);
  return { x, y, w: mw, h: mh, inv: (px, py) => [DOM.lon0 + (px - x)/(KLON*s), DOM.lat1 - (py - y)/s] };
}

function renderScene(c, W, H, o){
  const v = { z: V.z, cLon: V.cLon, cLat: V.cLat };
  const pt = o.capture ? PAD : PAD_T;
  clampView(v, W, H, pt);
  const PR = makeView(W, H, v, pt);
  o.view = PR;
  drawMap(c, W, H, { view: PR, hover: o.hover, full: o.full, rings: o.rings, caption: v.z <= 1.02 });
  o.mini = v.z > 1.02 && !o.capture ? drawMinimap(c, W, H, PR) : null;
  drawLegend(c, W, H, {});
}

/* ═══════════════════════════════════════════════════════════════════
   READOUT CARD — Station · Results
   ═══════════════════════════════════════════════════════════════════ */
const cardEl = el('card');
const KEY_ST = { name: 'Station model key', T: 52, Td: 48, P: 1002.6, sky: 8, wd: 120, ws: 15, wx: 'rain' };
const ST_ROWS = ['Temperature', 'Dewpoint', 'Pressure', 'Wind', 'Sky cover', 'Weather'];
cardEl.innerHTML =
  `<div class="cc-segmented ctabs" id="ctabs"><button class="cc-segmented-btn is-active" data-ct="station">Station</button><button class="cc-segmented-btn" data-ct="results" disabled>Results</button></div>` +
  `<div id="cStation"><div class="eb"><span id="cName"></span></div><canvas class="stn" id="cStn"></canvas>` +
  ST_ROWS.map((l, i) => `<div class="r"><span class="l">${l}</span><span class="v" id="cR${i}"></span></div>`).join('') +
  `</div><div id="cResults" hidden></div>`;
const vHTML = (v, u, col) => `<span${col ? ` style="color:${col}"` : ''}>${v}</span>${u ? `<span class="u">${u}</span>` : ''}`;
const setH = (id, h) => { const e = el(id); if (e && e.innerHTML !== h) e.innerHTML = h; };
function stationRows(s){
  const code = String(Math.round(s.P*10) % 1000).padStart(3, '0');

  ];
}
function cardStation(){ return HOVER !== null ? SCEN[S.scn].st[HOVER] : KEY_ST; }
function drawStnCanvas(c, w, h, s, key){
  const r = Math.min(20, h*0.15), cx = w*0.56, cy = h*0.40;
  stationModel(c, cx, cy, s, { r, fs: Math.max(16, Math.round(r*0.92)), dewColor: S.layers.dew });
  if (!key) return;
  const L = (t, x, y, al) => txt(c, t, x, y, `700 13px ${FONT.mono}`, COL.accent, al);
  const fs = Math.max(16, Math.round(r*0.92));
  c.save(); c.font = `700 ${fs}px ${FONT.mono}`; const nw = c.measureText('52').width; c.restore();
  L('TEMP', cx - r*1.45 - nw - 8, cy - r*0.3, 'right');
  L('DEWPT', cx - r*1.45 - nw - 8, cy + r*1.42, 'right');
  L('PRESSURE', cx + r*1.45, cy - r*0.3 - fs - 4, 'left');
  L('SKY', cx, cy - r - 8, 'center');
  L('WEATHER', cx, cy + r*2.24 + 16, 'center');
  const a = (s.wd - 90)*Math.PI/180;
  L('WIND', cx + Math.cos(a)*r*3.9 + 4, cy + Math.sin(a)*r*3.9 - 6, 'left');
}
function renderCard(){
  const s = cardStation(), key = HOVER === null;
  setH('cName', key ? 'Station model key' : s.name);
  stationRows(s).forEach((r, i) => setH('cR' + i, vHTML(r[0], r[1], r[2])));
  const cs = el('cStn'), w = cs.clientWidth, h = cs.clientHeight;
  if (w && h){
    const pw = Math.round(w*DPR), ph = Math.round(h*DPR);
    if (cs.width !== pw || cs.height !== ph){ cs.width = pw; cs.height = ph; }
    const c = cs.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, w, h);
    drawStnCanvas(c, w, h, s, key);
  }
  renderResults();
}
const TONE = { good: ['On target', '#2AA87E'], ok: ['Close', '#B5A43A'], bad: ['Not yet', '#D8735E'] };
function resultsModel(){
  const r = S.checked; if (!r) return null;
  const fr = k => {
    const f = r.fronts[k];
    if (!f) return null;
    const pct = Math.round(100*f.right/Math.max(1, f.total));
    const tone = (f.meanD < 160 && pct >= 88) ? 'good' : (f.meanD < 300 || pct >= 72) ? 'ok' : 'bad';
    return { sep: f.right + '/' + f.total, dist: f.meanD + ' km', tone, wrong: f.wrong };
  };
  const ev = k => { const e = r.evidence[k]; return e ? { dT: sgnN(e.dT) + '°F', dTd: sgnN(e.dTd) + '°F', wind: dirName(e.wdC) + '→' + dirName(e.wdW) } : null; };
  const low = r.low === null ? null : { dist: r.low + ' km', tone: r.low < 180 ? 'good' : r.low < 350 ? 'ok' : 'bad' };
  return { cold: fr('cold'), warm: fr('warm'), low, eCold: ev('cold'), eWarm: ev('warm') };
}
const sgnN = v => v > 0 ? '+' + v : v < 0 ? '−' + Math.abs(v) : '0';
let lastRes = '';
function renderResults(){
  const m = resultsModel(), box = el('cResults');
  if (!m){ if (lastRes){ box.innerHTML = ''; lastRes = ''; } return; }
  const cell = (f, key) => f ? f[key] : '—';
  const badge = f => f ? `<span class="badge" style="color:${TONE[f.tone][1]};border-color:${TONE[f.tone][1]}66;background:${TONE[f.tone][1]}1F">${TONE[f.tone][0]}</span>` : '<span class="dim">Not drawn</span>';
  const st = SCEN[S.scn].st;
  const names = (f, col) => (f && f.wrong.length) ? f.wrong.map(n => `<span class="stn-link" data-st="${st.findIndex(s => s.name === n)}" style="text-decoration-color:${col}" title="${n}">${n.replace(/ [A-Z]{2}$/, '')}</span>`).join('<span class="sep"> · </span>') : '<span class="dim">none</span>';
  let h = S.stale ? `<div class="eb"><span>Results</span><span class="tag">edited</span></div>` : '';
  h += `<div class="${S.stale ? 'stale' : ''}"><table class="rt"><tr><th></th><th style="color:${COL.cold}">Cold</th><th style="color:${COL.warm}">Warm</th></tr>` +
       `<tr><td class="l">Separated</td><td>${cell(m.cold, 'sep')}</td><td>${cell(m.warm, 'sep')}</td></tr>` +
       `<tr><td class="l">Distance</td><td>${cell(m.cold, 'dist')}</td><td>${cell(m.warm, 'dist')}</td></tr>` +
       `<tr><td class="l"></td><td>${badge(m.cold)}</td><td>${badge(m.warm)}</td></tr></table>` +
       `<div class="sub"><span>Wrong side</span></div>` +
       `<div class="wl"><span class="wk" style="color:${COL.cold}">Cold</span>${names(m.cold, COL.cold)}</div>` +
       `<div class="wl"><span class="wk" style="color:${COL.warm}">Warm</span>${names(m.warm, COL.warm)}</div>` +
       `<div class="r"><span class="l">Low center</span><span class="v">${m.low ? m.low.dist + ' ' + badge(m.low) : '<span class="dim">Not placed</span>'}</span></div>` +
       `<div class="sub"><span>Across the fronts</span><span>cool→warm</span></div>` +
       `<table class="rt"><tr><th></th><th style="color:${COL.cold}">Cold</th><th style="color:${COL.warm}">Warm</th></tr>` +
       `<tr><td class="l">Temperature</td><td>${cell(m.eCold, 'dT')}</td><td>${cell(m.eWarm, 'dT')}</td></tr>` +
       `<tr><td class="l">Dewpoint</td><td>${cell(m.eCold, 'dTd')}</td><td>${cell(m.eWarm, 'dTd')}</td></tr>` +
       `<tr><td class="l">Wind</td><td class="w">${cell(m.eCold, 'wind')}</td><td class="w">${cell(m.eWarm, 'wind')}</td></tr></table></div>`;
  if (h !== lastRes){
    box.innerHTML = h; lastRes = h;
    box.querySelectorAll('.stn-link').forEach(sp => {
      sp.addEventListener('mouseenter', () => { HOVER = +sp.dataset.st; draw(); });
      sp.addEventListener('mouseleave', () => { HOVER = null; draw(); });
    });
  }
}
function setCardTab(t){
  S.ctab = t;
  document.querySelectorAll('#ctabs [data-ct]').forEach(b => b.classList.toggle('is-active', b.dataset.ct === t));
  el('cStation').hidden = t !== 'station'; el('cResults').hidden = t !== 'results'; cardEl.scrollTop = 0;

function syncControls(){
  document.querySelectorAll('#tools [data-tool]').forEach(b => b.classList.toggle('is-active', b.dataset.tool === S.tool));
  el('bFlip').disabled = S.tool === 'low';
  const ans = el('bAnswer');

  ans.title = S.checkedOnce ? '' : 'Check your analysis first';
  ans.classList.toggle('is-active', S.showAnswer);

  el('bCheck').classList.toggle('glow', !S.checked || S.stale);
  const rt = document.querySelector('#ctabs [data-ct=results]'); rt.disabled = !S.checkedOnce;
  document.querySelectorAll('[data-layer]').forEach(b => b.classList.toggle('is-active', !!S.layers[b.dataset.layer]));
}
function edited(){ if (S.checked) S.stale = true; syncControls(); renderCard(); draw(); }
document.querySelectorAll('#tools [data-tool]').forEach(b => b.onclick = () => { S.tool = b.dataset.tool; syncControls(); });
el('bUndo').onclick = () => { if (S.tool === 'low') S.low = null; else S.draw[S.tool].pop(); edited(); };
el('bClear').onclick = () => { if (S.tool === 'low') S.low = null; else S.draw[S.tool] = []; edited(); };

el('bFlip').onclick = () => { if (S.tool !== 'low'){ S.flip[S.tool] *= -1; edited(); } };
el('bCheck').onclick = () => { S.checked = evaluate(); S.stale = false; S.checkedOnce = true; syncControls(); setCardTab('results'); draw(); };
el('bAnswer').onclick = () => { if (!S.checkedOnce) return; S.showAnswer = !S.showAnswer; syncControls(); draw(); };
document.querySelectorAll('[data-layer]').forEach(b => b.onclick = () => { const k = b.dataset.layer; S.layers[k] = !S.layers[k]; syncControls(); renderCard(); draw(); });
document.querySelectorAll('#scns [data-scn]').forEach(b => b.onclick = () => {
  if (S.scn === +b.dataset.scn) return;
  S.scn = +b.dataset.scn;
  document.querySelectorAll('#scns [data-scn]').forEach(x => x.classList.toggle('is-active', x === b));
  S.draw = { cold: [], warm: [] }; S.low = null; S.flip = { cold: 1, warm: 1 };
  S.showAnswer = false; S.checked = null; S.stale = false; S.checkedOnce = false; HOVER = null;
  buildField(); buildIso(); fitView(); syncZoom(); syncControls(); setCardTab('station'); draw();
});
function zoomAt(f, x, y){
  if (!LAST) return;
  const PR = LAST.view, ll = PR.inv(x, y);
  V.z = V.z*f; clampView(V, CW, CH, PAD_T);
  const sc = baseScale(CW, CH, PAD_T)*V.z;
  V.cLon = ll[0] - (x - CW/2)/(KLON*sc); V.cLat = ll[1] + (y - centerY(CH, PAD_T))/sc;
  clampView(V, CW, CH, PAD_T); syncZoom(); draw();
}
function syncZoom(){
  const sc = baseScale(CW, CH, PAD_T)*V.z;
  el('zLvl').textContent = (V.z < 1.02 ? 'Fit' : V.z.toFixed(1) + '×');
  el('bFit').classList.toggle('is-active', V.z < 1.02);
  el('bZin').disabled = sc >= SC_MAX - 0.5; el('bZout').disabled = V.z <= 1.001;
}
el('bZin').onclick = () => zoomAt(1.5, CW/2, CH/2);
el('bZout').onclick = () => zoomAt(1/1.5, CW/2, CH/2);
el('bFit').onclick = () => { fitView(); syncZoom(); draw(); };

/* ═══════════════════════════════════════════════════════════════════
   CANVAS + POINTER
   ═══════════════════════════════════════════════════════════════════ */
const cv = el('cv'), stage = el('stage'), ctx = cv.getContext('2d');
let CW = 0, CH = 0, DPR = 1, LAST = null, capturing = false, HOVER = null;
function resize(){
  const r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = Math.max(300, Math.round(r.width)); CH = Math.max(240, Math.round(r.height));
  cv.width = Math.round(CW*DPR); cv.height = Math.round(CH*DPR);
  clampView(V, CW, CH, PAD_T); syncZoom(); draw(); renderCard();
}
new ResizeObserver(resize).observe(stage);
function draw(){
  if (capturing || !CW) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, CW, CH);
  const o = { hover: HOVER }; renderScene(ctx, CW, CH, o); LAST = o;
}
function ptr(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
const inMini = p => LAST && LAST.mini && p[0] >= LAST.mini.x && p[0] <= LAST.mini.x + LAST.mini.w && p[1] >= LAST.mini.y && p[1] <= LAST.mini.y + LAST.mini.h;
function nearestStation(p){
  if (!LAST) return null;
  const PR = LAST.view, full = PR.sc >= LOD_FULL, lim = full ? 20 : 13;
  let best = null, bd = lim;
  SCEN[S.scn].st.forEach((s, i) => { const q = PR.P(s.lon, s.lat), d = Math.hypot(q[0] - p[0], q[1] - p[1]); if (d < bd){ bd = d; best = i; } });
  return best;
}
let down = null;
cv.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const p = ptr(e);
  cv.setPointerCapture(e.pointerId);
  if (inMini(p)){ down = { mini: true }; const ll = LAST.mini.inv(p[0], p[1]); V.cLon = ll[0]; V.cLat = ll[1]; clampView(V, CW, CH, PAD_T); draw(); return; }
  down = { x: p[0], y: p[1], cLon: V.cLon, cLat: V.cLat, moved: false };
});
cv.addEventListener('pointermove', e => {
  const p = ptr(e);
  if (down && down.mini){ const ll = LAST.mini.inv(p[0], p[1]); V.cLon = ll[0]; V.cLat = ll[1]; clampView(V, CW, CH, PAD_T); draw(); return; }
  if (down){
    if (!down.moved && Math.hypot(p[0] - down.x, p[1] - down.y) > 5) down.moved = true;
    if (down.moved){
      const sc = baseScale(CW, CH, PAD_T)*V.z;
      V.cLon = down.cLon - (p[0] - down.x)/(KLON*sc); V.cLat = down.cLat + (p[1] - down.y)/sc;
      clampView(V, CW, CH, PAD_T); cv.style.cursor = 'grabbing'; draw();
    }
    return;
  }
  const h = inMini(p) ? null : nearestStation(p);
  cv.style.cursor = inMini(p) ? 'pointer' : 'crosshair';
  if (h !== HOVER){ HOVER = h; renderCard(); draw(); }
});
cv.addEventListener('pointerup', e => {
  const p = ptr(e), d = down; down = null; cv.style.cursor = 'crosshair';
  if (!d || d.mini || d.moved || !LAST) return;
  const ll = LAST.view.inv(p[0], p[1]);
  if (ll[0] < DOM.lon0 || ll[0] > DOM.lon1 || ll[1] < DOM.lat0 || ll[1] > DOM.lat1) return;
  if (S.tool === 'low') S.low = ll; else S.draw[S.tool].push(ll);
  edited();
});
cv.addEventListener('pointercancel', () => { down = null; });
cv.addEventListener('pointerleave', () => { if (!down && HOVER !== null){ HOVER = null; renderCard(); draw(); } });
cv.addEventListener('contextmenu', e => { e.preventDefault(); if (S.tool === 'low') S.low = null; else S.draw[S.tool].pop(); edited(); });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const p = ptr(e), k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? CH : 1;
  if (e.ctrlKey){ zoomAt(Math.exp(-e.deltaY*k*0.005), p[0], p[1]); return; }
  const sc = baseScale(CW, CH, PAD_T)*V.z;
  V.cLon += e.deltaX*k/(KLON*sc); V.cLat -= e.deltaY*k/sc;
  clampView(V, CW, CH, PAD_T); draw();
}, { passive: false });
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === '+' || e.key === '='){ zoomAt(1.5, CW/2, CH/2); e.preventDefault(); }
  else if (e.key === '-' || e.key === '_'){ zoomAt(1/1.5, CW/2, CH/2); e.preventDefault(); }
  else if (e.key === '0'){ fitView(); syncZoom(); draw(); }
  else if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)){ el('bUndo').click(); e.preventDefault(); }
});

/* ═══════════════════════════════════════════════════════════════════
   EXPORT — PNG: whole tool, full-detail map, readout card
   ═══════════════════════════════════════════════════════════════════ */
const EW = 1280, EH = 720;
function drawCardCanvas(c, x, y, w, h){
  c.save();
  c.fillStyle = '#262B27'; roundRect(c, x, y, w, h, 6); c.fill();
  c.strokeStyle = COL.border; c.lineWidth = 1; c.stroke();
  const px = x + 16, pw = w - 32; let yy = y + 22;
  const hr = () => { c.fillStyle = COL.border; c.fillRect(px, yy, pw, 1); };
  const m = S.ctab === 'results' ? resultsModel() : null;
  if (!m){
    const s = cardStation(), key = HOVER === null;
    txt(c, (key ? 'Station model key' : s.name).toUpperCase(), px, yy, `700 13px ${FONT.mono}`, COL.accent, 'left', 'middle');
    yy += 14; hr();
    c.save(); c.translate(px, yy + 2); drawStnCanvas(c, pw, 160, s, key); c.restore();
    yy += 166;
    stationRows(s).forEach((r, i) => {
      hr(); yy += 18;
      txt(c, ST_ROWS[i].toUpperCase(), px, yy, `500 13px ${FONT.mono}`, COL.text2, 'left', 'middle');
      let xr = px + pw;
      if (r[1]){ c.font = `500 14px ${FONT.body}`; const uw = c.measureText(r[1]).width; txt(c, r[1], xr, yy + 1, `500 14px ${FONT.body}`, COL.text2, 'right', 'middle'); xr -= uw + 6; }
      txt(c, String(r[0]), xr, yy, `700 21px ${FONT.disp}`, r[2] || COL.text, 'right', 'middle');
      yy += 18;
    });
  } else {
    txt(c, SCEN[S.scn].name.toUpperCase(), px, yy, `700 13px ${FONT.mono}`, COL.accent, 'left', 'middle');
    yy += 14; hr();
    const c1 = px + pw*0.70, c2 = px + pw;
    const table = (rows, head) => {
      yy += 18;
      txt(c, 'COLD', c1, yy, `700 13px ${FONT.mono}`, COL.cold, 'right', 'middle');
      txt(c, 'WARM', c2, yy, `700 13px ${FONT.mono}`, COL.warm, 'right', 'middle');
      if (head) txt(c, head, px, yy, `700 13px ${FONT.mono}`, COL.accent, 'left', 'middle');
      yy += 12;
      rows.forEach(([l, a, b, col1, col2]) => {
        hr(); yy += 17;
        txt(c, l.toUpperCase(), px, yy, `500 13px ${FONT.mono}`, COL.text2, 'left', 'middle');
        txt(c, a, c1, yy, `700 16px ${FONT.mono}`, col1 || COL.text, 'right', 'middle');
        txt(c, b, c2, yy, `700 16px ${FONT.mono}`, col2 || COL.text, 'right', 'middle');
        yy += 15;
      });
    };
    const cl = (f, k) => f ? f[k] : '—';
    const tn = f => f ? TONE[f.tone][0] : 'Not drawn', tc = f => f ? TONE[f.tone][1] : COL.text2;
    table([['Separated', cl(m.cold, 'sep'), cl(m.warm, 'sep')], ['Avg distance', cl(m.cold, 'dist'), cl(m.warm, 'dist')], ['', tn(m.cold), tn(m.warm), tc(m.cold), tc(m.warm)]]);
    yy += 14; txt(c, 'WRONG SIDE', px, yy, `700 13px ${FONT.mono}`, COL.accent, 'left', 'middle'); yy += 4;
    const wrap = (label, col, list) => {
      const words = list.length ? list : ['none'];
      let line = label + ' ';
      c.font = `500 13px ${FONT.body}`;
      const out = [];
      words.forEach((wd, i) => { const t = wd + (i < words.length - 1 ? ', ' : ''); if (c.measureText(line + t).width > pw && line.trim()){ out.push(line); line = t; } else line += t; });
      out.push(line);
      out.forEach((ln, i) => { yy += 17; txt(c, ln, px, yy, `500 13px ${FONT.body}`, i === 0 ? col : COL.text, 'left', 'middle'); });
    };
    wrap('Cold:', COL.cold, m.cold ? m.cold.wrong : []);
    wrap('Warm:', COL.warm, m.warm ? m.warm.wrong : []);
    yy += 10; hr(); yy += 17;
    txt(c, 'LOW CENTER', px, yy, `500 13px ${FONT.mono}`, COL.text2, 'left', 'middle');
    txt(c, m.low ? m.low.dist + ' · ' + TONE[m.low.tone][0] : 'Not placed', px + pw, yy, `700 16px ${FONT.mono}`, m.low ? TONE[m.low.tone][1] : COL.text2, 'right', 'middle');
    yy += 16;
    table([['Temperature', cl(m.eCold, 'dT'), cl(m.eWarm, 'dT')], ['Dewpoint', cl(m.eCold, 'dTd'), cl(m.eWarm, 'dTd')], ['Wind', cl(m.eCold, 'wind'), cl(m.eWarm, 'wind')]], 'ACROSS');
  }
  c.restore();
}
function compose(c, scale){
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.fillStyle = '#1E2320'; c.fillRect(0, 0, EW, EH);
  txt(c, 'Find the Front', 18, 30, `700 26px ${FONT.disp}`, COL.text, 'left', 'middle');
  txt(c, SCEN[S.scn].name + ' · surface weather map', 18, 56, `500 14px ${FONT.mono}`, COL.text2, 'left', 'middle');
  txt(c, 'contextclimate.io', EW - 18, 30, `700 14px ${FONT.mono}`, COL.accent, 'right', 'middle');
  const cw = 290, sx = 16, sy = 74, sw = EW - 32 - cw - 12, sh = EH - sy - 34;
  c.save(); roundRect(c, sx, sy, sw, sh, 6); c.clip(); c.translate(sx, sy);
  const full = LAST ? LAST.view.sc >= LOD_FULL : false;
  renderScene(c, sw, sh, { capture: true, full, hover: HOVER });
  c.restore();
  c.strokeStyle = COL.border; c.lineWidth = 1; roundRect(c, sx + 0.5, sy + 0.5, sw - 1, sh - 1, 6); c.stroke();
  drawCardCanvas(c, sx + sw + 12, sy, cw, sh);
  txt(c, 'Isobars: Barnes objective analysis of the plotted station pressures · front symbols per NYS ESSRT p. 18', 18, EH - 16, `500 13px ${FONT.mono}`, COL.text2, 'left', 'middle');
}
function saveBlob(b, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const status = t => { el('status').textContent = t; };
const tick = () => new Promise(r => setTimeout(r, 0));
const pmenu = el('pmenu');
[['whole', 'Whole tool'], ['map', 'Full map (detail)'], ['card', 'Readout card']].forEach(([k, n]) => {
  const b = document.createElement('button'); b.textContent = n; b.onclick = () => { pmenu.classList.remove('open'); exportPNG(k); }; pmenu.appendChild(b);
});
el('bPNG').onclick = e => { e.stopPropagation(); pmenu.classList.toggle('open'); };
document.addEventListener('click', e => { if (!pmenu.contains(e.target)) pmenu.classList.remove('open'); });
async function exportPNG(kind){
  el('bPNG').disabled = true; capturing = true; status('rendering…'); await tick();
  try {
    let oc;
    const slug = 'find-the-front-' + SCEN[S.scn].id;
    if (kind === 'whole'){ oc = document.createElement('canvas'); oc.width = EW*2; oc.height = EH*2; compose(oc.getContext('2d'), 2); }
    else if (kind === 'card'){
      const w = 290, h = 612, sc = 3; oc = document.createElement('canvas'); oc.width = w*sc; oc.height = h*sc;
      const c = oc.getContext('2d'); c.setTransform(sc, 0, 0, sc, 0, 0); c.fillStyle = '#1E2320'; c.fillRect(0, 0, w, h);
      drawCardCanvas(c, 0, 0, w, h);
    } else {
      const W = 1000, TB = 58, MH = 1100, sc = 3;
      oc = document.createElement('canvas'); oc.width = W*sc; oc.height = (MH + TB)*sc;
      const c = oc.getContext('2d'); c.setTransform(sc, 0, 0, sc, 0, 0);
      c.fillStyle = '#1E2320'; c.fillRect(0, 0, W, MH + TB);
      txt(c, 'Surface weather map — ' + SCEN[S.scn].name, 16, 34, `700 24px ${FONT.disp}`, COL.text, 'left');
      txt(c, 'contextclimate.io', W - 16, 34, `700 14px ${FONT.mono}`, COL.accent, 'right');
      c.save(); c.translate(0, TB);
      const PR = makeView(W, MH, { z: 1, cLon: (DOM.lon0 + DOM.lon1)/2, cLat: (DOM.lat0 + DOM.lat1)/2 });
      drawMap(c, W, MH, { view: PR, full: true, hover: null });
      drawLegend(c, W, MH, {});
      c.restore();
    }
    const b = await new Promise(r => oc.toBlob(r, 'image/png'));
    saveBlob(b, slug + (kind === 'whole' ? '' : '-' + kind) + '.png');
    status('PNG ' + (b.size/1e6).toFixed(1) + ' MB');
  } catch (e){ console.error(e); status('PNG failed'); }
  finally { capturing = false; el('bPNG').disabled = false; draw(); }
}

/* ═══════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════ */
buildField(); buildIso(); syncControls();
(async function init(){
  try { await Promise.all([`700 16px ${FONT.disp}`, `700 13px ${FONT.mono}`, `600 13px ${FONT.body}`, `500 14px ${FONT.body}`].map(f => document.fonts.load(f))); } catch (e){}
  resize(); renderCard();
})();
window.__FTF = { S, V, SCEN, evaluate, draw, compose, drawCardCanvas, exportPNG, setCardTab, zoomAt, fitView, last: () => LAST, resultsModel, makeView, baseScale, clampView, dims: () => [CW, CH] };

})();
</script>
