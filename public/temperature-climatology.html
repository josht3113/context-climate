<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Temperature Climatology | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="threadex-roster.js"></script>
<style>
  :root { --tool-accent: var(--accent-climate); --cc-card-width: 330px; }
  [hidden] { display: none !important; }

  .cc-app { max-width: 1760px; margin: 0 auto; }
  .cc-scene-head, .lg-strip, .note-strip, .cc-scene-bar { flex-shrink: 0; }

  /* ── Top row ── */
  .exp { display: flex; gap: 6px; }
  .exp .cc-btn { padding: 8px 12px; font-size: 14px; font-weight: 700; }
  .cc-btn.is-error { border-color: #C05050; color: #E07070; }
  .cc-btn.is-ok { border-color: #3A9E50; color: #5CC070; }

  /* Station finder (shared pattern) */
  .finder-group { position: relative; flex: 0 0 auto; display: flex; align-items: stretch; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color .15s; }
  .finder-group:focus-within { border-color: var(--tool-accent); }
  .finder-group .search-icon { display: flex; align-items: center; padding-left: 12px; color: var(--color-text-muted); font-size: 16px; pointer-events: none; }
  .finder-group .search-input { width: 230px; background: transparent; border: none; border-radius: 0; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
  .finder-group .search-input::placeholder { color: var(--color-text-muted); }
  .finder-sep { width: 1px; align-self: stretch; margin: 7px 0; background: var(--color-border); }
  .finder-group .locate-btn { border: none; border-radius: 0; background: transparent; white-space: nowrap; font-size: 14px; padding: 6px 12px; color: var(--color-text-primary); }
  .locate-btn.loading { opacity: .5; pointer-events: none; }
  .dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 340px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 300px; overflow-y: auto; z-index: 300; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .dropdown.open { display: block; }
  .d-item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); transition: background .1s; }
  .d-item:last-child { border-bottom: none; }
  .d-item:hover, .d-item.hi { background: rgba(208,132,37,.18); }
  .d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 50px; flex-shrink: 0; }
  .d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-item .d-st { color: var(--color-text-muted); font-size: 13px; width: 22px; text-align: right; }
  .d-item .d-por, .d-item .d-dist { color: var(--color-text-secondary); font-size: 12px; width: 50px; flex-shrink: 0; text-align: right; }
  .d-item .d-dist { color: var(--tool-accent); }

  /* ── Scene head: station + readouts ── */
  .cc-scene-head { gap: 6px 22px; padding: 8px 14px 7px; align-items: flex-end; }
  .hd-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hm-heading { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
  .hm-period { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
  .ro-row { display: flex; align-items: flex-end; gap: 4px 22px; flex-wrap: wrap; margin-left: auto; }
  .ro { display: flex; flex-direction: column; min-width: 0; }
  .ro-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .ro-l i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ro-v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; }
  .ro-n { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }

  /* ── Legend + note strips ── */
  .lg-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; padding: 6px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 32px; }
  .lg-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sw-line { width: 22px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .sw-line.dash { border-top-style: dashed; }
  .sw-line.dot { border-top-style: dotted; }
  .sw-band { width: 22px; height: 12px; flex-shrink: 0; position: relative; background: rgba(232,228,217,.10); }
  .sw-band::after { content: ''; position: absolute; left: 0; right: 0; top: 3px; bottom: 3px; background: rgba(232,228,217,.16); }
  .sw-grad { width: 64px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .sw-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 0 1.5px #262B27; }
  .sw-ring { width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid; flex-shrink: 0; }
  .sw-today { width: 0; height: 14px; border-left: 2px dashed var(--tool-accent); flex-shrink: 0; }
  .note-strip { padding: 5px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: #D9A441; line-height: 1.5; }

  /* ── Stage ── */
  .cc-scene-stage { overflow: hidden; }
  #cv, #ov { position: absolute; left: 0; top: 0; display: block; }
  #ov { cursor: crosshair; outline: none; touch-action: pan-y; }
  .state-overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px;
    background: #262B27; color: var(--color-text-secondary); font-family: var(--font-mono); font-size: 14px; text-align: center; }
  .state-overlay .err { color: #E07070; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--color-border); border-top-color: var(--tool-accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Control bar ── */
  .cc-scene-bar { flex-wrap: wrap; gap: 8px 10px; min-height: 0; padding: 7px 12px; }
  .grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .grp-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-right: 3px; white-space: nowrap; }
  .grp .cc-btn { font-size: 14px; padding: 6px 11px; color: var(--color-text-primary); }
  .grp .cc-btn:not(.is-active) { color: var(--color-text-secondary); }
  .grp .cc-btn.is-active { color: #F2EEE3; }
  .grp .cc-btn:disabled { opacity: .35; cursor: not-allowed; }
  .grp .cc-select { font-size: 14px; font-weight: 600; padding: 6px 8px; width: 118px; }

  /* ── Rail card ── */
  .cc-card { gap: 0; padding: 10px 14px; overflow-x: hidden; }
  .rd-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
  .rd-date { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--color-text-primary); line-height: 1.1; }
  .rd-tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
  .rd-tag button { background: none; border: 1px solid var(--tool-accent); color: var(--tool-accent); border-radius: 10px; font-family: var(--font-mono); font-size: 12px; padding: 0 6px; margin-left: 4px; cursor: pointer; }
  .rd-hint { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }
  table.rd-t { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; margin: 4px 0 2px; }
  .rd-t th { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); font-weight: 400; text-align: right; padding: 3px 0 2px; }
  .rd-t th:first-child { text-align: left; }
  .rd-t td { padding: 2px 0; color: var(--color-text-primary); text-align: right; white-space: nowrap; border-top: 1px solid rgba(232,228,217,.06); }
  .rd-t td:first-child { text-align: left; color: var(--color-text-secondary); font-size: 13px; padding-right: 6px; }
  .rd-t td b { font-family: var(--font-display); font-size: 17px; }
  .rd-t .yrs { color: var(--color-text-muted); font-size: 12px; margin-left: 3px; }
  .rd-t .dep { font-size: 12px; margin-left: 3px; }
  .rd-t tr.yr td { border-top: none; }
  .rd-t tr.yr td:first-child { color: var(--color-text-primary); font-weight: 700; }
  .dc-head { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
  .dc-key { display: flex; flex-wrap: wrap; gap: 3px 12px; padding: 6px 0 2px; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); }
  .dc-key span { display: inline-flex; align-items: center; gap: 5px; }
  .dc-key i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .dc-key i.tick { width: 14px; height: 0; border-top: 2px solid #E8E4D9; border-radius: 0; }
  .dc-wrap { position: relative; flex: 1 1 auto; min-height: 120px; }
  #dc { position: absolute; left: 0; top: 0; display: block; cursor: pointer; }
  .dc-read { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 38px; line-height: 1.4; padding-top: 4px; }
  .cc-card-src { padding-top: 6px; }
  .cc-card-src span { cursor: help; border-bottom: 1px dotted var(--color-text-muted); }
  .dc-read b { color: var(--color-text-primary); }

  /* ── Narrower windows ── */
  @media (max-width: 1500px) {
    .cc-app-title { display: none; }
    .finder-group .search-input { width: 170px; }
    .ro-row { gap: 4px 16px; }
    .grp .cc-btn { padding: 6px 8px; }
    #grp-show .grp-l { display: none; }
    .cc-scene-bar { gap: 8px 8px; }
  }
  @media (max-width: 1400px) { :root { --cc-card-width: 300px; } .ro-row { gap: 4px 14px; } .ro-l { letter-spacing: .03em; } }
  @media (max-width: 1280px) {
    .locate-btn .nm { display: none; }
    .grp .cc-btn { padding: 6px 7px; font-size: 13px; }
    #grp-show .grp-l { display: none; }
    .exp .cc-btn { padding: 8px 8px; font-size: 13px; }
    .ro-v { font-size: 26px; }
  }
  @media (max-height: 700px) and (min-width: 761px) {
    .cc-app { padding-top: 6px; padding-bottom: 8px; gap: 6px; }
    .cc-app-top { min-height: 0; }
    .finder-group .search-input { padding-top: 6px; padding-bottom: 6px; }
    .exp .cc-btn { padding-top: 5px; padding-bottom: 5px; }
    .cc-scene-head { padding-top: 4px; padding-bottom: 4px; }
    .ro-n { display: none; }
    .lg-strip { padding-top: 3px; padding-bottom: 3px; min-height: 0; }
    .cc-scene-bar { padding-top: 4px; padding-bottom: 4px; }
    .grp .cc-btn, .grp .cc-select { padding-top: 4px; padding-bottom: 4px; }
    .rd-t td { padding: 2px 0; }
  }
  @media (max-width: 760px) {
    .cc-app-title { display: block; width: 100%; font-size: 20px; }
    .cc-app-spacer { display: none; }
    .finder-group { flex: 1 1 100%; }
    .finder-group .search-input { width: 100%; min-width: 0; }
    .hm-heading { white-space: normal; font-size: 19px; }
    .ro-row { margin-left: 0; }
    .cc-scene-head { display: contents; }
    .hd-id { order: 0; padding: 8px 14px; border-bottom: 1px solid var(--color-border); }
    .cc-scene-stage { order: 1; }
    .lg-strip { order: 2; border-top: 1px solid var(--color-border); }
    .ro-row { order: 3; padding: 8px 14px; border-bottom: 1px solid var(--color-border); gap: 8px 20px; }
    .note-strip { order: 4; }
    .cc-scene-bar { order: 5; }
    .dc-wrap { flex: none; height: 200px; }
  }
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">

  <div class="cc-app-top">
    <h1 class="cc-app-title">Daily Temperature Climatology</h1>
    <div class="finder-group" id="sw">
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si" placeholder="Search station or city..." autocomplete="off" spellcheck="false">
      <div class="dropdown" id="dd"></div>
      <div class="finder-sep"></div>
      <button class="cc-btn locate-btn" id="locate-btn" title="Use my location to find the nearest station">&#128205;<span class="nm"> Near Me</span></button>
    </div>
    <div class="cc-app-spacer"></div>
    <div class="exp">
      <button class="cc-btn" id="copy-btn" title="Copy the chart image">&#x29C9; Copy</button>
      <button class="cc-btn" id="png-btn" title="Download the chart as PNG">&#x2193; PNG</button>
      <button class="cc-btn" id="csv-btn" title="Download the daily table as CSV">&#x2193; CSV</button>
    </div>
  </div>

  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head">
        <div class="hd-id">
          <div class="hm-heading" id="hd-station">&nbsp;</div>
          <div class="hm-period" id="hd-period">&nbsp;</div>
        </div>
        <div class="ro-row" id="readouts"></div>
      </div>
      <div class="lg-strip" id="legend"></div>
      <div class="note-strip" id="note" hidden></div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="cv"></canvas>
        <canvas id="ov" tabindex="0" aria-label="Daily temperature climatology chart. Hover or use arrow keys to read a day."></canvas>
        <div class="state-overlay" id="state"><div class="spinner"></div><div>Loading station record…</div></div>
      </div>
      <div class="cc-scene-bar" id="bar">
        <div class="grp"><span class="grp-l" id="yr-l">Year</span><select class="cc-select" id="yr-sel" aria-label="Year shown"></select></div>
        <div class="cc-scene-bar-sep"></div>
        <div class="grp" id="grp-ax"><button class="cc-btn" data-ax="jan">Jan–Dec</button><button class="cc-btn" data-ax="jul">Jul–Jun</button></div>
        <div class="grp" id="grp-u"><button class="cc-btn" data-u="f">°F</button><button class="cc-btn" data-u="c">°C</button></div>
        <div class="cc-scene-bar-sep"></div>
        <div class="grp" id="grp-show"><span class="grp-l">Show</span><span class="grp" id="show-btns"></span></div>
      </div>
    </div>

    <div class="cc-card" id="card">
      <div class="rd-head"><span class="rd-date" id="rd-date">&nbsp;</span><span class="rd-tag" id="rd-tag"></span><span class="rd-hint" id="rd-hint">click to pin</span></div>
      <table class="rd-t" id="rd-t"></table>
      <div class="dc-head">Daily records · decade set</div>
      <div class="dc-key"><span><i style="background:#E8664F"></i>Highs</span><span><i style="background:#5AADEC"></i>Lows</span><span><i class="tick"></i>If all years equal</span></div>
      <div class="dc-wrap" id="dc-wrap"><canvas id="dc"></canvas></div>
      <div class="dc-read" id="dc-read"></div>
      <div class="cc-card-src" id="src"></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ════════════════════════════════════════════════════════════════════
   Constants
   ════════════════════════════════════════════════════════════════════ */
const ACIS_URL = 'https://data.rcc-acis.org/StnData';
const N = 366;                                   // day slots on a leap-year template (Feb 29 = slot 59)
const MSTART = [0, 31, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const JUL = 182;                                 // slot of Jul 1
const BASE = [1991, 2020], EARLY = [1961, 1990];
const POOL = 7;                                  // percentiles pool ±7 days
const QS = [10, 25, 50, 75, 90];
const HARM = 4;                                  // harmonics in the fitted period averages
const FIT_MIN_COVER = 0.8, PCT_MIN_COVER = 0.6;
const EXPORT_SCALE = 2;
const C = { bg: '#1E2320', surface: '#262B27', surface2: '#2C322D', grid: 'rgba(232,228,217,0.08)', axis: 'rgba(232,228,217,0.16)',
  text: '#E8E4D9', text2: '#A6A499', muted: '#948F82', accent: '#D08425', hot: '#E8664F', cold: '#5AADEC', norm: '#E8E4D9' };
const FONT = { mono: "'Courier Prime', monospace", body: "'Public Sans', sans-serif", disp: "'Zilla Slab', serif" };
// Heatmap-suite temperature scale (°F) — used for the axis colour strip
const TEMP_SCALE = { vals: [-60, -40, -20, -5, 25, 50, 75, 102, 113, 119, 130], cols: ['#2A0440', '#7C18C0', '#D42070', '#FFB3C6', '#A8D4F0', '#5DBF6A', '#FFE033', '#D41A1A', '#FF5555', '#FFFFFF', '#FFC0D0'] };
// Departure of the day's mean from normal (°F): cool ↔ neutral ↔ warm
const DEP_SCALE = { vals: [-16, -8, 0, 8, 16], cols: ['#3B78D8', '#7DB0EA', '#A29F95', '#F0A070', '#E04A30'] };
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
[TEMP_SCALE, DEP_SCALE].forEach(s => { s.rgb = s.cols.map(hexRGB); });
function scaleColor(s, x, a) {
  const v = s.vals; let c;
  if (!(x > v[0])) c = s.rgb[0];
  else if (x >= v[v.length - 1]) c = s.rgb[v.length - 1];
  else for (let i = 1; i < v.length; i++) if (x <= v[i]) {
    const t = (x - v[i - 1]) / (v[i] - v[i - 1]), p = s.rgb[i - 1], q = s.rgb[i];
    c = [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t, p[2] + (q[2] - p[2]) * t].map(Math.round); break;
  }
  return a == null ? `rgb(${c})` : `rgba(${c},${a})`;
}

/* ════════════════════════════════════════════════════════════════════
   Stations (shared ThreadEx roster)
   ════════════════════════════════════════════════════════════════════ */
const STATIONS = THREADEX_ROSTER.map(r => ({ id: r[0], name: r[1], st: r[2], lat: r[3], lon: r[4], y0: r[5] }));
const byId = Object.fromEntries(STATIONS.map(s => [s.id, s]));
const DEFAULT_ID = 'ISP';

/* ════════════════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════════════════ */
const SHOW_DEFS = [
  { k: 'bands', label: 'Bands', on: true, title: 'Middle 50% and middle 80% of daily highs and lows' },
  { k: 'records', label: 'Records', on: true, title: 'Record high and record low lines' },
  { k: 'opp', label: 'Opposite', on: false, title: 'Lowest high and highest low on record' },
  { k: 'early', label: '1961–90', on: false, title: '1961–1990 average high and low, fitted from this station’s daily record' },
  { k: 'peaks', label: 'Peaks', on: true, title: 'Warmest and coldest days of the normal year' },
  { k: 'today', label: 'Today', on: true, title: 'Today’s date line' },
  { k: 'smooth', label: 'Smooth', on: false, title: '5-day average of the record lines (display only; readouts show exact values)' },
];
const S = { id: DEFAULT_ID, ax: 'jan', u: 'f', yr: null, show: Object.fromEntries(SHOW_DEFS.map(d => [d.k, d.on])), pin: null, hover: null, dcHover: null };
let STN = null, M = null;                        // roster row, computed model
const memCache = new Map();

/* ════════════════════════════════════════════════════════════════════
   Calendar helpers
   ════════════════════════════════════════════════════════════════════ */
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const slotOf = (m, d) => MSTART[m - 1] + d - 1;  // m 1–12
function slotDate(i) { let m = 11; while (MSTART[m] > i) m--; return { m: m + 1, d: i - MSTART[m] + 1 }; }
const slotLabel = i => { const o = slotDate(i); return `${MON[o.m - 1]} ${o.d}`; };
const posOf = i => (S.ax === 'jul' ? (i - JUL + N) % N : i);
const slotAt = p => (S.ax === 'jul' ? (p + JUL) % N : p);
function todaySlot() { const t = new Date(); return slotOf(t.getMonth() + 1, t.getDate()); }
// Year a slot falls in for the selected overlay (calendar year or Jul–Jun season starting S.yr)
const yearOfSlot = i => (S.ax === 'jul' && i < JUL ? S.yr + 1 : S.yr);

/* ════════════════════════════════════════════════════════════════════
   Units
   ════════════════════════════════════════════════════════════════════ */
const toU = f => (S.u === 'c' ? (f - 32) * 5 / 9 : f);
const dU = f => (S.u === 'c' ? f * 5 / 9 : f);
const fromU = v => (S.u === 'c' ? v * 9 / 5 + 32 : v);
const ok = v => v != null && !Number.isNaN(v);
const fT = v => (ok(v) ? `${Math.round(toU(v))}°` : '—');
const fD = (v, dec) => { if (!ok(v)) return ''; const x = dU(v), r = dec ? x.toFixed(dec) : String(Math.round(x)); return (+r > 0 ? '+' : +r < 0 ? '−' : '±') + r.replace('-', ''); };

    for (let p = 0; p < N; p++) {
      const i = slotAt(p), o = ovAt(i);
      if (!o) break;
      const hv = o.hi, lv = o.lo;
      if (!ok(hv) && !ok(lv)) continue;
      const dep = ok(hv) && ok(lv) ? (hv + lv) / 2 - normMean(i) : NaN;
      c.fillStyle = ok(dep) ? scaleColor(DEP_SCALE, dep) : C.muted;
      const ya = g.Y(ok(hv) ? hv : lv), yb2 = g.Y(ok(lv) ? lv : hv);
      c.fillRect(g.X(p) - bw / 2, ya, bw, Math.max(1.5, yb2 - ya));

    c.strokeStyle = 'rgba(232,228,217,0.62)'; c.lineWidth = 1.6; c.setLineDash([6, 5]);
    c.beginPath(); pathLine(c, g, M.fitEarly.hi); pathLine(c, g, M.fitEarly.lo); c.stroke(); c.setLineDash([]);

  if (M.normDisp) {
    c.strokeStyle = C.surface; c.lineWidth = 4.5; c.beginPath(); pathLine(c, g, M.normDisp.hi); pathLine(c, g, M.normDisp.lo); c.stroke();
    c.strokeStyle = C.norm; c.lineWidth = 2; c.beginPath(); pathLine(c, g, M.normDisp.hi); pathLine(c, g, M.normDisp.lo); c.stroke();
  }
  if (S.show.opp) {
    c.lineWidth = 1.4; c.setLineDash([1.5, 3.5]);
    c.strokeStyle = 'rgba(232,102,79,0.75)'; c.beginPath(); pathLine(c, g, recDisp(M.lowHi)); c.stroke();
    c.strokeStyle = 'rgba(90,173,236,0.75)'; c.beginPath(); pathLine(c, g, recDisp(M.highLo)); c.stroke();
    c.setLineDash([]);

    c.strokeStyle = C.hot; c.beginPath(); pathLine(c, g, recDisp(M.recHi)); c.stroke();
    c.strokeStyle = C.cold; c.beginPath(); pathLine(c, g, recDisp(M.recLo)); c.stroke();

      const i = slotAt(p), o = ovAt(i);

    const X = g.X(posOf(todaySlot()));
    c.strokeStyle = C.accent; c.lineWidth = 1.5; c.setLineDash([4, 4]);
    c.beginPath(); c.moveTo(Math.round(X) + .5, g.yt); c.lineTo(Math.round(X) + .5, g.yb); c.stroke(); c.setLineDash([]);
    c.font = `700 12px ${FONT.mono}`; c.fillStyle = C.accent; c.textAlign = 'center'; c.textBaseline = 'bottom';
    c.fillText('TODAY', Math.min(Math.max(X, g.x0 + 20), g.x1 - 20), g.yt - 4);
  }
  c.restore();

}

/* ════════════════════════════════════════════════════════════════════
   Records-by-decade panel
   ════════════════════════════════════════════════════════════════════ */
function drawDecades(c, x, y, w, h, hoverK) {
  const T = M.decades, padL = 30, padB = 22, padT = 6;
  const x0 = x + padL, x1 = x + w - 4, y0 = y + padT, y1 = y + h - padB, mid = (y0 + y1) / 2;
  let mx = 1; for (let k = 0; k < T.K; k++) mx = Math.max(mx, T.hi[k], T.lo[k], T.eHi[k], T.eLo[k]);
  let step = 5, top;
  for (const st of [5, 10, 25, 50, 100]) { step = st; top = Math.ceil(mx / st) * st; if (st / top * (mid - y0) >= Math.max(16, (mid - y0) / 4)) break; }
  const H = v => v / top * (mid - y0);
  c.save();
  c.font = `12px ${FONT.mono}`; c.textAlign = 'right'; c.textBaseline = 'middle';
  for (let v = 0; v <= top; v += step) {
    [mid - H(v), mid + H(v)].forEach((yy, j) => {
      if (j && !v) return;
      c.strokeStyle = v ? C.grid : C.axis; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, Math.round(yy) + .5); c.lineTo(x1, Math.round(yy) + .5); c.stroke();
      c.fillStyle = C.text2; c.fillText(String(v), x0 - 5, yy);
    });
  }
  const bw = (x1 - x0) / T.K, gap = Math.min(3, bw * 0.2);
  for (let k = 0; k < T.K; k++) {
    const bx = x0 + k * bw + gap / 2, bwi = bw - gap, dim = hoverK != null && hoverK !== k;
    c.globalAlpha = dim ? 0.35 : 1;
    c.fillStyle = C.hot; c.fillRect(bx, mid - H(T.hi[k]), bwi, H(T.hi[k]));
    c.fillStyle = C.cold; c.fillRect(bx, mid + 1, bwi, H(T.lo[k]));
    c.globalAlpha = dim ? 0.45 : 1;
    c.strokeStyle = C.text; c.lineWidth = 2;
    c.beginPath(); c.moveTo(bx - 1, Math.round(mid - H(T.eHi[k])) + .5); c.lineTo(bx + bwi + 1, Math.round(mid - H(T.eHi[k])) + .5);
    c.moveTo(bx - 1, Math.round(mid + H(T.eLo[k])) + .5); c.lineTo(bx + bwi + 1, Math.round(mid + H(T.eLo[k])) + .5); c.stroke();
    c.globalAlpha = 1;
  }
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = C.text2;
  const every = Math.ceil(T.K / Math.max(1, Math.floor((x1 - x0) / 38)));
  for (let k = 0; k < T.K; k++) if ((T.K - 1 - k) % every === 0) c.fillText(`${T.d0 + 10 * k}`.replace(/^(\d\d)(\d\d)$/, (s, a, b) => (k === 0 || (T.K - 1 - k) === 0 ? s : `’${b}`)), x0 + (k + 0.5) * bw, y1 + 16);
  c.restore();
  return { x0, bw, K: T.K };
}

function drawOverlay() {

function defaultYear() {
  const t = new Date(), cy = t.getFullYear();

  return Math.min(cy, M.last);

function syncURL() {

/* ════════════════════════════════════════════════════════════════════

/* ════════════════════════════════════════════════════════════════════
   Station finder
   ════════════════════════════════════════════════════════════════════ */
let ddIdx = -1;
function haversineMiles(a, b, c, d) { const R = 3958.8, t = x => x * Math.PI / 180, h = Math.sin(t(c - a) / 2) ** 2 + Math.cos(t(a)) * Math.cos(t(c)) * Math.sin(t(d - b) / 2) ** 2; return R * 2 * Math.asin(Math.sqrt(h)); }
function renderDD(matches, dists) {
  const dd = $('dd');

  dd.innerHTML = matches.map((s, i) => `<div class="d-item"><span class="d-id">${esc(s.id)}</span><span class="d-name">${esc(s.name)}</span>` +
    (dists ? `<span class="d-dist">${dists[i].toFixed(0)} mi</span>` : `<span class="d-por">${s.y0}–</span>`) + `<span class="d-st">${s.st}</span></div>`).join('');
  dd.classList.add('open');
  dd.querySelectorAll('.d-item').forEach((el, i) => el.addEventListener('click', () => { $('si').value = ''; dd.classList.remove('open'); selectStation(matches[i].id); }));
}
function initSearch() {
  const inp = $('si'), dd = $('dd');
  inp.addEventListener('input', () => {
    ddIdx = -1; const q = inp.value.trim().toLowerCase();
    if (!q) { dd.classList.remove('open'); return; }
    const rank = s => { const id = s.id.toLowerCase(), nm = s.name.toLowerCase();
      if (id === q || 'k' + id === q) return 0;
      if (nm.startsWith(q)) return 1;
      if (nm.split(/[\s\-\/]+/).some(w => w.startsWith(q))) return 2;
      if (id.startsWith(q)) return 3;
      if (nm.includes(q)) return 4;
      if (s.st.toLowerCase() === q) return 5;
      return 9; };
    renderDD(STATIONS.map(s => [rank(s), s]).filter(r => r[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).map(r => r[1]).slice(0, 30));
  });

    if (e.key === 'ArrowDown') { e.preventDefault(); ddIdx = Math.min(ddIdx + 1, items.length - 1); hl(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ddIdx = Math.max(ddIdx - 1, 0); hl(); }
    else if (e.key === 'Enter') { e.preventDefault(); const i = ddIdx >= 0 ? ddIdx : 0; if (items[i]) items[i].click(); }
    else if (e.key === 'Escape') dd.classList.remove('open');

  document.addEventListener('click', e => { if (!$('sw').contains(e.target)) dd.classList.remove('open'); });

    }, () => { btn.classList.remove('loading'); btn.innerHTML = orig; btn.classList.add('is-error'); setTimeout(() => btn.classList.remove('is-error'), 2500); },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
  };
}

/* ════════════════════════════════════════════════════════════════════
   Exports
   ════════════════════════════════════════════════════════════════════ */
function drawLegendCanvas(c, x, y, maxW) {

  let cx = x, cy = y;
  for (const o of legendItems()) {
    const sw = o.t === 'grad' ? 64 : o.t === 'dot' ? 30 : 22, w = sw + 8 + c.measureText(o.label).width + 22;
    if (cx + w > x + maxW) { cx = x; cy += 24; }
    if (o.t === 'band') { c.fillStyle = 'rgba(232,228,217,0.10)'; c.fillRect(cx, cy - 6, 22, 12); c.fillStyle = 'rgba(232,228,217,0.16)'; c.fillRect(cx, cy - 3, 22, 6); }
    else if (o.t === 'grad') { const gr = c.createLinearGradient(cx, 0, cx + 64, 0); DEP_SCALE.cols.forEach((col, k) => gr.addColorStop(k / (DEP_SCALE.cols.length - 1), col)); c.fillStyle = gr; c.fillRect(cx, cy - 5, 64, 10); }
    else if (o.t === 'dot') { c.beginPath(); c.arc(cx + 5, cy, 4.5, 0, 7); c.fillStyle = C.hot; c.fill(); c.beginPath(); c.arc(cx + 21, cy, 4, 0, 7); c.strokeStyle = C.hot; c.lineWidth = 1.8; c.stroke(); }
    else { c.strokeStyle = o.col; c.lineWidth = 2; c.setLineDash(o.t === 'dash' ? [6, 5] : o.t === 'dot-line' ? [1.5, 3.5] : []); c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + 22, cy); c.stroke(); c.setLineDash([]); }

}
function buildPNG() {

  const c = cv.getContext('2d'); c.scale(sc, sc);

  c.font = `700 34px ${FONT.disp}`; c.fillStyle = C.text; c.fillText(`Daily Temperature Climatology — ${STN.name}, ${STN.st}`, 36, 56);
  c.font = `17px ${FONT.mono}`; c.fillStyle = C.text2;
  const sub = [`Record ${M.first}–${M.last}`, M.normSrc === 'ncei' ? 'Normals 1991–2020' : '', S.yr != null ? `${yearLabel(S.yr)} shown` : '', S.u === 'c' ? '°C' : '°F'].filter(Boolean).join('  ·  ');
  c.fillText(sub, 36, 86);
  const ly = drawLegendCanvas(c, 36, 116, W - 72);
  const top = ly + 12, footer = 52, sideW = 330, gap = 18;
  const cw = W - 56 - sideW - gap, ch = H - top - footer;
  c.fillStyle = C.surface; c.fillRect(28, top, cw, ch); c.strokeStyle = 'rgba(232,228,217,0.14)'; c.strokeRect(28.5, top + .5, cw - 1, ch - 1);
  const keepG = M.g; drawMain(c, 28, top + 4, cw, ch - 6); M.g = keepG;
  const sx = 28 + cw + gap;
  c.fillStyle = C.surface; c.fillRect(sx, top, sideW, ch); c.strokeStyle = 'rgba(232,228,217,0.14)'; c.strokeRect(sx + .5, top + .5, sideW - 1, ch - 1);
  c.font = `700 14px ${FONT.mono}`; c.fillStyle = C.text2; c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  c.fillText('STANDING DAILY RECORDS · BY DECADE', sx + 14, top + 26);
  c.font = `13px ${FONT.mono}`;
  c.fillStyle = C.hot; c.fillRect(sx + 14, top + 40, 10, 10); c.fillStyle = C.text2; c.fillText('Record highs', sx + 30, top + 49);
  c.fillStyle = C.cold; c.fillRect(sx + 150, top + 40, 10, 10); c.fillStyle = C.text2; c.fillText('Record lows', sx + 166, top + 49);
  c.strokeStyle = C.text; c.lineWidth = 2; c.beginPath(); c.moveTo(sx + 14, top + 68); c.lineTo(sx + 28, top + 68); c.stroke(); c.fillText('If all years equal', sx + 34, top + 72);
  drawDecades(c, sx + 8, top + 86, sideW - 20, ch - 96, null);
  c.font = `14px ${FONT.mono}`; c.fillStyle = C.muted; c.textAlign = 'left';
  c.fillText(`Data: NOAA RCC ACIS · ThreadEx ${STN.id}${M.normSrc === 'ncei' ? ' · NCEI 1991–2020 normals' : ''} · bands ${M.pctBase[0]}–${M.pctBase[1]}, ±${POOL} days`, 36, H - 22);
  c.textAlign = 'right'; c.fillStyle = C.text2; c.font = `700 15px ${FONT.mono}`; c.fillText('contextclimate.io', W - 36, H - 22);
  return cv;
}
const slug = () => `${STN.id}-temperature-climatology${S.yr != null ? '-' + S.yr : ''}`.toLowerCase();
function flash(btn, cls) { btn.classList.add(cls); setTimeout(() => btn.classList.remove(cls), 1600); }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$('png-btn').onclick = async () => { if (!M) return; await document.fonts.ready; buildPNG().toBlob(b => download(b, `${slug()}.png`), 'image/png'); };

$('csv-btn').onclick = () => {

/* ════════════════════════════════════════════════════════════════════
   Init

(function init() {
