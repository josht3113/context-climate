<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESSRT p. 11 — Earth's Interior</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth);
  --probe: #F2C14E; --probe-dim: rgba(242,193,78,0.35);
  --c-crustO: #5f6f75; --c-crustC: #a08a6a; --c-um: #6c4b37; --c-tz: #82593d; --c-lm: #97714c;
  --c-oc: #bb843a; --c-ic: #e6c46a;
  --hi-fill: rgba(242,193,78,0.30); --hi-line: #F2C14E;
  --panel-w: 360px; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; display: flex; flex-direction: column; }

/* ── header ── */
#hdr { display: flex; align-items: center; gap: 14px; padding: 8px 14px; height: 54px; flex: 0 0 auto;
  border-bottom: 1px solid var(--color-border); background: var(--color-bg); }
#hdr .ttl { display: flex; flex-direction: column; line-height: 1.1; white-space: nowrap; }
#hdr .ttl .cc-eyebrow { font-size: 12px; color: #8f8a7d; }
#hdr .ttl h1 { margin: 0; font-family: var(--font-display); font-size: 21px; font-weight: 700; }
#tours { display: flex; gap: 6px; align-items: center; margin-left: 6px; }
#tours .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8f8a7d; margin-right: 2px; }
.tourbtn { background: var(--color-surface-2); border: 1px solid rgba(60,163,174,0.55); color: var(--color-text-primary);
  font: 600 13px var(--font-body); padding: 7px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, transform .15s; }
.tourbtn:hover { background: #33403a; border-color: var(--tool-accent); transform: translateY(-1px); }
.tourbtn.is-active { background: var(--tool-accent); color: var(--color-bg); border-color: var(--tool-accent); }
#hdr .sp { flex: 1; }
#tsBtn { font: 700 13px var(--font-body); padding: 8px 14px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  background: var(--color-surface-2); color: var(--color-text-primary); border: 1.5px solid var(--probe); }
#tsBtn:hover { background: #3a382c; }
#tsBtn.is-active { background: var(--probe); color: #1E2320; }

/* ── main ── */
#main { flex: 1 1 auto; display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 10px 12px 10px; min-height: 0; position: relative; }
#intCol { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
#intWrap { position: relative; flex: 1 1 auto; min-height: 0; background: #222724; border: 1px solid var(--color-border); border-radius: 6px; overflow: hidden; }
#intCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: ns-resize; }
#intMk { position: absolute; inset: 0; pointer-events: none; }

/* readout */
#ro { flex: 0 0 auto; display: grid; grid-template-columns: 1.05fr 1fr 1.25fr; gap: 6px; }
.roc { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 6px; padding: 5px 10px; min-width: 0; }
.roc .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8f8a7d; white-space: nowrap; }
.roc .v { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roc .s { font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.roc.depth .v { color: var(--probe); font-size: 22px; }
#colSeg { margin-top: 2px; }
#colSeg .cc-segmented-btn { padding: 2px 10px; font-size: 12px; }
#roPct { text-transform: none; letter-spacing: 0; color: var(--color-text-secondary); margin-left: 6px; }
#nds1 { position: absolute; left: 10px; bottom: 6px; z-index: 3; }

/* cross-section column */
#xCol { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
#xTop { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
#xTop .nm { font-family: var(--font-display); font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#xTop .sp { flex: 1; }
.zbtn { width: 30px; height: 30px; padding: 0; font-size: 16px; line-height: 1; }
.ndsChip { font: 600 13px var(--font-mono); letter-spacing: .04em; color: var(--color-text-primary); background: var(--color-surface-2);
  border: 1px dashed var(--probe); border-radius: 4px; padding: 5px 9px; cursor: pointer; white-space: nowrap; }
.ndsChip:hover { background: #3a382c; }
#xView { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: #f4f3ef; border: 1px solid var(--color-border); border-radius: 6px; cursor: grab; touch-action: none; }
#xView.drag { cursor: grabbing; }
#xLayer { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1059px; height: 559px; }
#xLayer img { position: absolute; left: 0; top: 0; width: 1059px; height: 559px; user-select: none; -webkit-user-drag: none; pointer-events: none; }
#xSvg { position: absolute; left: 0; top: 0; width: 1059px; height: 559px; pointer-events: none; }
#xSvg path { fill: transparent; stroke: transparent; transition: fill .2s, stroke .2s; }
#xSvg path.on { fill: var(--hi-fill); stroke: var(--hi-line); stroke-width: calc(2px * var(--inv, 1)); }
#xSvg path.ring { fill: rgba(60,163,174,0.22); stroke: var(--tool-accent); stroke-width: calc(2px * var(--inv, 1)); }
#bLeg { display: flex; gap: 6px; flex: 0 0 auto; flex-wrap: wrap; }
.bchip { font: 600 13px var(--font-body); color: var(--color-text-secondary); background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: 5px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
.bchip:hover { color: var(--color-text-primary); border-color: var(--color-border-hover); }
.bchip.on { color: #1E2320; background: var(--probe); border-color: var(--probe); }
.bchip .d { font-family: var(--font-mono); font-weight: 400; font-size: 13px; opacity: .85; margin-left: 4px; }

/* markers */
.mk { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; padding: 0; cursor: pointer; pointer-events: auto;
  background: rgba(30,35,32,0.82); border: 2px solid var(--tool-accent); box-shadow: 0 0 0 2px rgba(30,35,32,0.55); }
.mk::after { content: ''; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--tool-accent); }
.mk:hover, .mk.sel { background: var(--tool-accent); transform: scale(1.12); }
.mk:hover::after, .mk.sel::after { background: #1E2320; }
.mk.sel { box-shadow: 0 0 0 4px rgba(60,163,174,0.35); }
.mk.tourDim { opacity: .4; }
#xLayer .mk { transform: scale(var(--inv, 1)); }
#xLayer .mk:hover, #xLayer .mk.sel { transform: scale(calc(var(--inv, 1) * 1.12)); }
.mk.info { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-width: 1.5px; }
.mk.info::after { content: 'i'; width: auto; height: auto; margin: 0; background: none; left: 0; right: 0; top: 0; bottom: 0; color: var(--tool-accent);
  font: 700 12px/15px var(--font-display); text-align: center; position: absolute; }
.mk.info:hover::after, .mk.info.sel::after { color: #1E2320; background: none; }
#tip { position: fixed; z-index: 50; pointer-events: none; background: #11140f; color: var(--color-text-primary); font: 600 13px var(--font-body);
  padding: 4px 9px; border-radius: 4px; border: 1px solid var(--color-border-hover); opacity: 0; transition: opacity .12s; white-space: nowrap; }
#tip.on { opacity: 1; }

/* panel */
#panel { position: absolute; top: 0; right: 0; bottom: 0; width: var(--panel-w); background: var(--color-surface); border: 1px solid var(--color-border-hover);
  border-radius: 6px; display: none; flex-direction: column; z-index: 20; box-shadow: -10px 0 24px rgba(0,0,0,0.35); }
#panel.on { display: flex; }
#pHead { padding: 10px 14px 4px; position: relative; }
#pCat { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--tool-accent); }
#pTitle { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; margin: 1px 26px 2px 0; }
#pLead { font-size: 14px; color: var(--color-text-secondary); line-height: 1.4; }
#pClose { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--color-border); background: transparent;
  color: var(--color-text-secondary); font-size: 16px; cursor: pointer; }
#pClose:hover { color: var(--color-text-primary); border-color: var(--color-border-hover); }
#pBody { flex: 1 1 auto; overflow-y: auto; padding: 4px 14px 10px; }
#pMedia { position: relative; width: 100%; height: 236px; background: #1b1f1c; border: 1px solid var(--color-border); border-radius: 5px; margin-top: 6px; }
#pCv { width: 100%; height: 100%; display: block; }
#pScrub { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
#pPlay { width: 32px; height: 28px; padding: 0; font-size: 13px; }
#pRange { flex: 1; accent-color: var(--tool-accent); }
#pRead { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-primary); min-height: 19px; margin-top: 2px; }
#pChips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.fchip { font-size: 13px; color: var(--color-text-primary); background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 4px; padding: 3px 8px; line-height: 1.35; }
.fchip.src { color: var(--color-text-secondary); font-size: 13px; border-style: dashed; }
#pLinks { display: flex; flex-direction: column; gap: 5px; margin-top: 9px; }
.plink { font: 600 13.5px var(--font-body); color: var(--color-text-primary); text-decoration: none; border: 1px solid var(--tool-accent); border-radius: 5px; padding: 6px 10px; background: rgba(60,163,174,0.12); }
.plink:hover { background: rgba(60,163,174,0.25); }
.plink.int { border-color: var(--probe); background: rgba(242,193,78,0.10); cursor: pointer; text-align: left; font-family: var(--font-body); }
#pTour { display: none; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--color-border); }
#pTour.on { display: flex; }
#pTour .st { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }

/* printed page */
#pageView { display: none; flex: 1 1 auto; position: relative; overflow: hidden; background: #f4f3ef; margin: 10px 12px; border-radius: 6px; cursor: grab; touch-action: none; }
#pageView.on { display: block; }
#pageImg { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; }
#pageZoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
body.page #main { display: none; }

@media (max-width: 1100px) { #hdr { gap: 8px; padding: 8px 10px; } #hdr .ttl .cc-eyebrow { display: none; } #tours { gap: 4px; margin-left: 0; } .tourbtn { padding: 6px 7px !important; font-size: 12.5px !important; } #viewSeg .cc-segmented-btn { padding: 9px 10px; } #tsBtn { padding: 8px 10px; } }
@media (max-width: 1180px) { #tours .lbl { display: none; } .tourbtn { padding: 7px 9px; font-size: 12.5px; } #hdr .ttl h1 { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { .tourbtn, .mk { transition: none; } }
</style>
</head>
<body>
<header id="hdr">
  <div class="ttl"><span class="cc-eyebrow">ESSRT · Page 11</span><h1>Earth's Interior</h1></div>
  <div id="tours"><span class="lbl">Tours</span>
    <button class="tourbtn" data-tour="journey">Journey to the center</button>
    <button class="tourbtn" data-tour="plate">Life of an ocean plate</button>
    <button class="tourbtn" data-tour="magma">Where magma comes from</button>
    <button class="tourbtn" data-tour="know">How we know</button>
  </div>
  <div class="sp"></div>
  <button id="tsBtn" aria-pressed="false">True scale</button>
  <div class="cc-segmented" id="viewSeg">
    <button class="cc-segmented-btn is-active" data-view="explore">Explore</button>
    <button class="cc-segmented-btn" data-view="page">Printed page</button>
  </div>
</header>

<div id="main">
  <section id="intCol">
    <div id="intWrap"><canvas id="intCv" aria-label="Generalized model of Earth's interior structure with depth probe"></canvas><div id="intMk"></div><button class="ndsChip" id="nds1" data-h="NDS1">Not drawn to scale ⓘ</button></div>
    <div id="ro">
      <div class="roc depth"><div class="k">Depth <span id="roPct"></span></div><div class="v" id="roDepth">—</div>
        <div class="cc-segmented" id="colSeg" title="Column under the probe"><button class="cc-segmented-btn is-active" data-col="ocean">Ocean</button><button class="cc-segmented-btn" data-col="continent">Continent</button></div></div>
      <div class="roc"><div class="k">Layer</div><div class="v" id="roLayer">—</div><div class="s" id="roState">—</div></div>
      <div class="roc"><div class="k">Behaves as</div><div class="v" id="roBeh">—</div><div class="s" id="roBehS">—</div></div>
      <div class="roc"><div class="k">Density</div><div class="v" id="roRho">—</div><div class="s" id="roRhoS">—</div></div>
      <div class="roc"><div class="k">Pressure</div><div class="v" id="roP">—</div><div class="s" id="roPS">—</div></div>
      <div class="roc"><div class="k">Temperature · inferred</div><div class="v" id="roT">—</div><div class="s" id="roTS">—</div></div>
    </div>
  </section>

  <section id="xCol">
    <div id="xTop">
      <span class="nm">Cross Section of Earth's Surface and Interior</span>
      <span class="sp"></span>
      <button class="ndsChip" data-h="NDS2">Not drawn to scale ⓘ</button>
      <button class="cc-btn zbtn" id="xOut" aria-label="Zoom out">−</button>
      <button class="cc-btn zbtn" id="xIn" aria-label="Zoom in">+</button>
      <button class="cc-btn cc-btn-sm" id="xFit">Fit</button>
    </div>

// ── EARTH CORE MODEL: PREM + inferred temperature + page mapping ──────────
// PREM: Dziewonski & Anderson (1981), isotropic, polynomials in x = r/6371.
var EC = (function () {
  var A = 6371;
  // [rTop, rho coeffs, vp coeffs, vs coeffs]  (layers listed from centre out)
  var L = [
    [1221.5, [13.0885, 0, -8.8381, 0], [11.2622, 0, -6.3640, 0], [3.6678, 0, -4.4475, 0]],
    [3480.0, [12.5815, -1.2638, -3.6426, -5.5281], [11.0487, -4.0362, 4.8023, -13.5732], [0, 0, 0, 0]],
    [3630.0, [7.9565, -6.4761, 5.5283, -3.0807], [15.3891, -5.3181, 5.5242, -2.5514], [6.9254, 1.4672, -2.0834, 0.9783]],
    [5600.0, [7.9565, -6.4761, 5.5283, -3.0807], [24.9520, -40.4673, 51.4832, -26.6419], [11.1671, -13.7818, 17.4575, -9.2777]],
    [5701.0, [7.9565, -6.4761, 5.5283, -3.0807], [29.2766, -23.6027, 5.5242, -2.5514], [22.3459, -17.2473, -2.0834, 0.9783]],
    [5771.0, [5.3197, -1.4836, 0, 0], [19.0957, -9.8672, 0, 0], [9.9839, -4.9324, 0, 0]],
    [5971.0, [11.2494, -8.0298, 0, 0], [39.7027, -32.6166, 0, 0], [22.3512, -18.5856, 0, 0]],
    [6151.0, [7.1089, -3.8045, 0, 0], [20.3926, -12.2569, 0, 0], [8.9496, -4.4597, 0, 0]],
    [6346.6, [2.6910, 0.6924, 0, 0], [4.1875, 3.9382, 0, 0], [2.1519, 2.3481, 0, 0]],
    [6356.0, [2.900, 0, 0, 0], [6.800, 0, 0, 0], [3.900, 0, 0, 0]],
    [6371.0, [2.600, 0, 0, 0], [5.800, 0, 0, 0], [3.200, 0, 0, 0]]   // PREM ocean layer replaced by upper crust
  ];
  function poly(c, x) { return c[0] + x * (c[1] + x * (c[2] + x * c[3])); }
  function layerAt(r, below) {           // below: at a discontinuity take the deeper layer

    }

  }
  function rho(r, below) { return poly(layerAt(r, below)[1], r / A); }
  function vp(r, below) { return poly(layerAt(r, below)[2], r / A); }
  function vs(r, below) { return poly(layerAt(r, below)[3], r / A); }

    for (var i = 1; i <= N; i++) {

    for (var i = 1; i < PG.length; i++) if (d <= PG[i]) {

PRIM.scale = {

  build: function (v) { return { v: v }; },
  onStart: function (st) { if (st.v === 'int') { ANIM.restoreS = S.sTarget; } },
  draw: function (c, st, p, W, H) {
    var F = '600 13px "Public Sans", sans-serif';
    if (st.v === 'int') {
      var e = ease(p); setS(e); S.sTarget = e;
      var rows = [
        ['Oceanic crust', 0.0122 * 6378, 7, 120],
        ['Continental crust', 0.0175 * 6378, 35, 120],
        ['Depth to the core', (1 - 0.5385) * 6378, 2900, 3200]
      ];
      rows.forEach(function (r, i) {
        var y = 26 + i * 70, val = lerp(r[1], r[2], e), max = r[3];
        T(c, r[0], 14, y, F, '#A6A499');
        T(c, '≈ ' + fmt(Math.round(val)) + ' km', W - 14, y, '700 17px "Zilla Slab", serif', '#F3EFE4', 'right');
        c.fillStyle = '#2C322D'; c.fillRect(14, y + 16, W - 28, 12);
        c.fillStyle = i < 2 ? (i ? COLR.crustC : COLR.crustO) : COLR.lm; c.fillRect(14, y + 16, (W - 28) * clamp(val / max, 0, 1), 12);
        c.fillStyle = COLR.probe; var tx = 14 + (W - 28) * clamp(r[2] / max, 0, 1); c.fillRect(tx - 1, y + 12, 2, 20);
        T(c, 'drawn ' + fmt(Math.round(r[1])) + ' · true ' + fmt(r[2]), 14, y + 40, '13px "Public Sans", sans-serif', '#D9D4C7');
      });
      return Math.round(e * 100) + '% of the way to true scale';
    }
    // cross section column: page proportions → true proportions
    var surf = 70, bot = H - 14, Hpx = bot - surf, kT = Hpx / 2900;
    var PG = { volc: 615, ocean: 300, lith: 476, asth: 835 }, TR = { volc: 3, ocean: 4, lith: 100, asth: 350 };
    var colX = [44, 196], colW = 96, e2 = ease(p);
    [0, 1].forEach(function (k) {
      var q = {}; Object.keys(PG).forEach(function (n) { q[n] = k === 0 ? PG[n] : lerp(PG[n], TR[n], e2); });
      var x = colX[k], Y = function (d) { return surf + d * kT; };
      c.fillStyle = '#8a6a4c'; c.fillRect(x, surf, colW, Hpx);
      c.fillStyle = '#b88a52'; c.fillRect(x, Y(q.lith), colW, Y(q.asth) - Y(q.lith));
      c.fillStyle = '#6f8f9a'; c.fillRect(x, surf, colW, Y(q.lith) - surf);
      c.fillStyle = '#3d6f8f'; c.fillRect(x, surf - q.ocean * kT, colW * 0.5, q.ocean * kT);
      c.fillStyle = '#7a6448'; c.beginPath(); var vx = x + colW * 0.78, vh = Math.max(1, q.volc * kT); c.moveTo(vx - 14 - vh * 0.4, surf); c.lineTo(vx, surf - vh); c.lineTo(vx + 14 + vh * 0.4, surf); c.closePath(); c.fill();
      c.strokeStyle = 'rgba(232,228,217,0.3)'; c.strokeRect(x + 0.5, surf + 0.5, colW - 1, Hpx - 1);
      T(c, k === 0 ? 'As drawn' : (e2 > 0.98 ? 'True scale' : 'Morphing'), x + colW / 2, 12, F, k === 0 ? '#A6A499' : COLR.probe, 'center');
      if (k === 1) {
        haloText(c, 'lithosphere ' + Math.round(q.lith) + ' km', x + colW / 2, Math.min(Y(q.lith) + 12, bot - 30), '13px "Public Sans", sans-serif', '#F3EFE4');
      } else {
        haloText(c, 'lithosphere', x + colW / 2, (surf + Y(q.lith)) / 2, '13px "Public Sans", sans-serif', '#F3EFE4');
        haloText(c, 'asthenosphere', x + colW / 2, (Y(q.lith) + Y(q.asth)) / 2, '13px "Public Sans", sans-serif', '#F3EFE4');
      }
      T(c, '2900 km', x + colW / 2, bot + 1, '13px "Courier Prime", monospace', '#A6A499', 'center', 'bottom');
    });
    return 'Ocean ' + Math.round(lerp(300, 4, e2)) + ' km · lithosphere ' + Math.round(lerp(476, 100, e2)) + ' km · volcano ' + Math.round(lerp(615, 3, e2)) + ' km';
  }
};

// ════════════════════════════════════════════════════════════════════
//  init + layout
// ════════════════════════════════════════════════════════════════════
function layoutAll() {
  if (document.body.classList.contains('page')) { pvFit(); return; }
  sizeInterior(); drawInterior(); updateReadout();
  if (S.open && HSI[S.open].on === 'x') xFocus(HSI[S.open].x, HSI[S.open].y, XV.fit * 2); else xFit();
  if (S.open && HSI[S.open].on === 'x') { var h = HSI[S.open]; var vw = XV.el.clientWidth, vh = XV.el.clientHeight; XV.fit = Math.min(vw / XV.IW, vh / XV.IH); xFocus(h.x, h.y, XV.fit * 2); }
}
buildProfiles(); addSteps();
buildIntMarkers(); buildXMarkers();
updateCross();
var rT = 0;
window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(layoutAll, 60); });
function boot() {
  layoutAll();
  var q = new URLSearchParams(location.search);
  if (q.get('col') === 'continent') setCol('continent');
  if (q.get('d')) setDepth(+q.get('d'));
  if (q.get('ts') === '1') { S.s = 1; S.sTarget = 1; $('tsBtn').classList.add('is-active'); drawInterior(); }
  if (q.get('view') === 'page') setView('page');
  var hm = location.hash.match(/h=([A-Z0-9]+)/);
  if (q.get('tour') && TOURS[q.get('tour')]) startTour(q.get('tour'));
  else if (hm && HSI[hm[1]]) openHS(hm[1]);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { boot(); }); else boot();
setTimeout(function () { if (!IC.R) boot(); }, 1500);

</script>
