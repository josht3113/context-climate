<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="core-sample-tools.css">
<title>Earth's Interior · ESSRT p. 11 · ContextClimate</title>
<style>
:root{
  --tool-accent:var(--accent-earth);
  --teal:var(--accent-earth);
  --teal-dim:rgba(60,163,174,0.16);
  --probe:#F2C14E; --probe-dim:rgba(242,193,78,0.18);
  --cat-layer:#3CA3AE; --cat-bnd:#D9D4C7; --cat-beh:#A08CC6; --cat-proc:#E07B5A; --cat-axis:#2AA87E;
}
.cc-app{line-height:1.3; --cc-card-width:300px}
button{font:inherit; line-height:1.2}

/* header */
#top{gap:14px}
.ttl{display:flex; flex-direction:column; justify-content:center; min-width:0}
.eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#A6A499; line-height:1.1; white-space:nowrap}
#top h1{font-size:22px; line-height:1.1; white-space:nowrap}
.tabs .cc-segmented-btn{padding:8px 16px}
.spacer{flex:1 1 auto}
.xwrap{position:relative}
.xbtn{display:inline-flex; align-items:center; gap:6px; background:var(--color-surface-2); border:1px solid var(--color-border-hover);
  color:var(--color-text-primary); font-family:var(--font-mono); font-size:13px; padding:6px 11px; border-radius:var(--radius-md); cursor:pointer; white-space:nowrap}
.xbtn:hover:not(:disabled){border-color:var(--teal)}
.xbtn:disabled{opacity:.6; cursor:default}
.xmenu{position:absolute; right:0; top:calc(100% + 6px); z-index:30; min-width:260px; background:var(--color-surface-2);
  border:1px solid var(--color-border-hover); border-radius:var(--radius-md); padding:5px; display:none; box-shadow:0 10px 28px rgba(0,0,0,.45)}
.xmenu.open{display:block}
.xmenu button{display:flex; justify-content:space-between; gap:12px; width:100%; background:transparent; border:0; color:var(--color-text-primary);
  font-size:13.5px; text-align:left; padding:7px 9px; border-radius:var(--radius-sm); cursor:pointer}
.xmenu button span{font-family:var(--font-mono); font-size:13px; color:#A6A499}
.xmenu button:hover{background:var(--teal-dim)}
.xmenu hr{border:0; border-top:1px solid var(--color-border); margin:4px 2px}
body:not(.t-page) .page-only{display:none !important}
body.t-page .anim-only{display:none !important}
body:not(.t-inside) .inside-only{display:none !important}
body:not(.t-proc) .proc-only{display:none !important}
.xstat{font-family:var(--font-mono); font-size:13px; color:#A6A499; white-space:nowrap}

/* stage */
#stage{background:#171B18; overflow:hidden}
#view{position:absolute; inset:0; cursor:grab; touch-action:none}
#view.drag{cursor:grabbing}
#layer{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
#pic{display:block; user-select:none; -webkit-user-drag:none; pointer-events:none}
#layer svg{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
#gMul{mix-blend-mode:multiply}
#litI,#litX,#litP{transition:opacity .3s ease}
#dim{opacity:0; transition:opacity .35s ease}
#dim.on{opacity:1}
.arcP{fill:none; stroke:var(--probe); stroke-width:calc(var(--inv,1) * 3.5px)}
.arcU{fill:none; stroke:rgba(20,22,19,.75); stroke-width:calc(var(--inv,1) * 7px)}
.arcB{fill:none; stroke:var(--teal); stroke-width:calc(var(--inv,1) * 5px)}

#marks{position:absolute; left:0; top:0}
.mk{position:absolute; transform:translate(-50%,-50%); padding:0; border:0; background:none; cursor:pointer}
.mk .d{display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%;
  background:var(--c); border:2.5px solid #FFF; box-shadow:0 1px 5px rgba(0,0,0,.55);
  color:#14181A; font-family:var(--font-body); font-size:13px; font-weight:800; line-height:1;
  transform:scale(var(--inv,1)); transition:box-shadow .15s ease}
.mk:hover .d{box-shadow:0 0 0 5px rgba(255,255,255,.45), 0 1px 5px rgba(0,0,0,.55)}
.mk.on .d{box-shadow:0 0 0 6px rgba(255,255,255,.85), 0 1px 6px rgba(0,0,0,.6)}
.mk:focus-visible .d{outline:3px solid #FFF; outline-offset:2px}

/* depth probe on the printed axis */
#axisZone{position:absolute; cursor:ns-resize; touch-action:none}
#knob{position:absolute; transform:translate(-50%,-50%); pointer-events:none}
#knob .k{width:22px; height:22px; border-radius:50%; background:var(--probe); border:3px solid #1E2320; box-shadow:0 0 0 2px var(--probe), 0 2px 8px rgba(0,0,0,.5);
  transform:scale(var(--inv,1))}
#knobTag{position:absolute; transform-origin:100% 50%; pointer-events:none; white-space:nowrap}
#knobTag span{display:inline-block; background:#1E2320; color:var(--probe); border:1.5px solid var(--probe); border-radius:var(--radius-md);
  font-family:var(--font-mono); font-weight:700; font-size:14px; padding:3px 8px}
#axisZone:hover ~ #knob .k, #knob.drag .k{box-shadow:0 0 0 2px var(--probe), 0 0 0 8px rgba(242,193,78,.35), 0 2px 8px rgba(0,0,0,.5)}

.fseg{position:absolute; left:10px; top:10px; z-index:4}
.fseg .cc-segmented-btn{padding:7px 12px; font-size:13px}
.zoomer{position:absolute; right:10px; bottom:10px; z-index:4; display:flex; align-items:center; gap:4px;
  background:rgba(38,43,39,.94); border:1px solid var(--color-border-hover); border-radius:var(--radius-md); padding:4px}
.tbtn{background:var(--color-surface-2); border:1px solid var(--color-border-hover); color:var(--color-text-primary);
  font-size:13.5px; font-weight:500; padding:6px 12px; border-radius:var(--radius-md); cursor:pointer; white-space:nowrap}
.tbtn:hover:not(:disabled){border-color:var(--teal)}
.tbtn.on{background:var(--teal-dim); border-color:var(--teal)}
.tbtn:disabled{opacity:.35; cursor:default}
.tbtn:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.zb{width:30px; padding:5px 0; font-family:var(--font-mono); font-size:15px; text-align:center}
.zpct{font-family:var(--font-mono); font-size:13px; color:var(--color-text-secondary); min-width:46px; text-align:center}
.hint{position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:4; font-size:13.5px; color:var(--color-text-primary);
  background:rgba(30,35,32,.9); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:6px 12px; white-space:nowrap;
  transition:opacity .5s ease; pointer-events:none}
.hint.gone{opacity:0}
#icv,#acv{position:absolute; inset:0; width:100%; height:100%; display:none; touch-action:none}
body.t-inside #icv{display:block}
body.t-proc #acv{display:block}
body:not(.t-page) #view{display:none}
#icv{cursor:ns-resize}
#icv.spin{cursor:grab}
.iseg{position:absolute; left:10px; bottom:10px; z-index:4; display:flex; gap:8px; align-items:center}
.vseg .cc-segmented-btn{padding:8px 14px; font-size:13px}
.cseg{position:absolute; z-index:4}
.cseg .cc-segmented-btn{padding:7px 11px; font-size:13px}

/* control bar */
#bar{gap:8px; padding:7px 12px 8px; min-height:60px}
.bs{display:none; align-items:center; gap:8px; width:100%; min-width:0; align-self:stretch}
.bs.on{display:flex}
.play{flex:0 0 auto; min-width:178px; display:inline-flex; align-items:center; justify-content:center; gap:8px; align-self:stretch;
  background:var(--teal); border:1px solid var(--teal); color:var(--color-bg); font-weight:700; font-size:15px;
  padding:6px 16px; border-radius:var(--radius-md); cursor:pointer; white-space:nowrap; box-shadow:0 0 0 0 rgba(60,163,174,.5)}
.play:hover:not(:disabled){filter:brightness(1.1)}
.play.invite{animation:invite 2.2s ease-out infinite}
@keyframes invite{0%{box-shadow:0 0 0 0 rgba(60,163,174,.55)} 70%{box-shadow:0 0 0 10px rgba(60,163,174,0)} 100%{box-shadow:0 0 0 0 rgba(60,163,174,0)}}
.play.sm{min-width:104px}
.stepper{display:flex; align-items:stretch; gap:4px; align-self:stretch; min-width:0}
.nb{width:38px; padding:0; font-size:20px; line-height:1}
.stepinfo{display:flex; flex-direction:column; justify-content:center; min-width:200px; max-width:300px; padding:4px 12px;
  background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden}
.stepinfo b{font-family:var(--font-mono); font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:#A6A499; font-weight:700; white-space:nowrap}
.stepinfo i{font-style:normal; font-size:15px; font-weight:600; color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.thru{align-self:stretch}
.snaps{flex:1 1 auto; min-width:0; display:flex; gap:5px; align-self:stretch}
.snap{flex:1 1 0; min-width:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  padding:6px 3px; background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md);
  color:var(--color-text-secondary); cursor:pointer; overflow:hidden; transition:border-color .14s ease, background .14s ease, transform .14s ease}
.snap b{font-weight:600; font-size:14px; color:var(--color-text-primary); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.snap i{font-style:normal; font-size:13px; color:#A6A499; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.snap .s{display:none}
.snap:hover{border-color:var(--color-border-hover); transform:translateY(-1px)}
.snap.on{border-color:var(--teal); background:var(--teal-dim)}
.snap.pr::before{content:''; position:absolute; left:8px; right:8px; top:2px; height:3px; border-radius:2px; background:var(--probe); opacity:.85}
.snap:focus-visible{outline:2px solid var(--teal); outline-offset:1px}
.rng{flex:0 0 auto; display:flex; align-items:center; gap:10px}
.rng input{width:150px; accent-color:var(--teal); margin:0}
.rng output{font-family:var(--font-mono); font-size:16px; font-weight:700; color:var(--color-text-primary); min-width:70px; text-align:right}

/* card */
#card{gap:0; padding:12px 14px 10px}
.k-eb{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--teal); font-weight:700; padding-bottom:6px; border-bottom:1px solid var(--color-border); min-height:30px}
.k-eb .sw{width:10px; height:10px; border-radius:50%; background:var(--c); flex:none}
.k-title{font-family:var(--font-display); font-weight:700; font-size:23px; line-height:1.15; margin:10px 0 6px; color:var(--color-text-primary)}
.k-t{font-size:15px; line-height:1.45; color:var(--color-text-primary); margin:0 0 10px}
.k-l{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#A6A499; margin:0 0 3px}
.k-pg{font-size:14px; line-height:1.4; color:var(--color-text-secondary); margin:0 0 10px; border-left:2px solid var(--teal); padding-left:9px}
.k-act{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:10px 12px; border-radius:var(--radius-md);
  background:var(--teal); border:1px solid var(--teal); color:var(--color-bg); font-weight:700; font-size:15px; cursor:pointer; text-decoration:none; margin:2px 0 8px}
.k-act:hover{filter:brightness(1.1)}
.k-act.alt{background:var(--color-surface-2); color:var(--color-text-primary); border-color:var(--teal)}
.k-act.pb{background:rgba(242,193,78,.12); color:var(--color-text-primary); border-color:var(--probe)}
.k-rows{margin:0 0 8px}
.k-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:5px 0; border-bottom:1px solid var(--color-border)}
.k-row:first-child{border-top:1px solid var(--color-border)}
.k-row .l{font-family:var(--font-mono); font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:#A6A499; flex:none}
.k-row .v{font-size:14.5px; font-weight:600; color:var(--color-text-primary); text-align:right}
.k-row .v small{display:block; font-size:13px; font-weight:400; color:var(--color-text-secondary)}
.k-row.dp .v{color:var(--probe); font-family:var(--font-display); font-size:20px; font-weight:700}
.k-list{display:flex; flex-direction:column; gap:1px; margin:6px 0 4px}
.k-sec{font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#A6A499; margin:10px 0 3px}
.k-it{display:flex; align-items:center; gap:9px; width:100%; background:none; border:1px solid transparent; color:var(--color-text-secondary);
  font-size:14px; text-align:left; padding:3px 6px; border-radius:var(--radius-sm); cursor:pointer}
.k-it:hover{background:var(--color-surface-2); color:var(--color-text-primary)}
.k-it .bd{width:22px; height:22px; border-radius:50%; background:var(--c); color:#14181A; font-size:12px; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center; flex:none; border:1.5px solid rgba(255,255,255,.8)}
.k-it .tg{margin-left:auto; font-family:var(--font-mono); font-size:12px; color:#948F82}
.k-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; margin:8px 0 8px}
.k-grid button{background:var(--color-surface-2); border:1px solid var(--color-border); color:var(--color-text-secondary); font-size:12.5px; font-weight:600; letter-spacing:-.01em;
  padding:7px 2px; border-radius:var(--radius-md); cursor:pointer; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.k-grid button:hover{border-color:var(--color-border-hover); color:var(--color-text-primary)}
.k-grid button.on{border-color:var(--teal); background:var(--teal-dim); color:var(--color-text-primary)}
.k-stats{display:grid; grid-template-columns:1fr 1fr; gap:0 14px; margin:0 0 6px}
.k-stat{padding:6px 0 7px; border-bottom:1px solid var(--color-border)}
.k-stat.w{grid-column:1 / -1}
.k-stat .l{font-family:var(--font-mono); font-size:12px; letter-spacing:.07em; text-transform:uppercase; color:#A6A499}
.k-stat .v{font-family:var(--font-display); font-size:22px; font-weight:700; color:var(--color-text-primary); line-height:1.15; margin-top:2px}
.k-stat .v small{font-family:var(--font-body); font-size:14px; font-weight:500; color:var(--color-text-secondary); margin-left:3px}
.k-stat .v.pb{color:var(--probe)}
.k-back{align-self:flex-start; background:none; border:0; color:var(--teal); font-size:14px; font-weight:600; cursor:pointer; padding:4px 0; margin-top:0}
.k-back:hover{text-decoration:underline}
.cc-card-src{font-size:13px}

@media (max-width:1280px){ .stepinfo{min-width:170px} .vseg .cc-segmented-btn{padding:8px 11px} }
@media (max-width:1500px){ #iSnaps .snap b{display:none} #iSnaps .snap .s{display:block; font-weight:600; font-size:14px; color:var(--color-text-primary); font-style:normal; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis} }
@media (max-width:1180px){ #iSnaps .snap .s{font-size:12.5px} }
@media (max-width:1180px){ .eyebrow{display:none} .thru .lb{display:none} .play{min-width:150px} .rng input{width:110px} .tabs .cc-segmented-btn{padding:8px 11px} }
@media (max-height:640px){ .k-title{font-size:20px; margin:6px 0 4px} .k-t{font-size:14px; line-height:1.35; margin-bottom:6px} .k-pg{font-size:13.5px; margin-bottom:6px}
  .k-row{padding:3px 0} .k-row .v{font-size:14px; line-height:1.2} .k-row .v small{font-size:12.5px} .k-row.dp .v{font-size:18px}
  .k-act{padding:8px 10px; margin:2px 0 6px} .k-stat{padding:3px 0 4px} .k-stat .v{font-size:19px} .k-eb{min-height:26px; padding-bottom:4px} .k-sec{margin:7px 0 2px} }
@media (max-height:600px){ .cc-card-src{display:none} .k-l, .k-pg{display:none} .k-back{padding:2px 0} }
@media (max-width:1180px){ #iSnaps .snap i{display:none} #iSnaps .snap{padding:6px 1px} }
</style>
</head>
<body class="cc-app-body t-page">
<div class="cc-app">
  <header id="top" class="cc-app-top">
    <div class="ttl">
      <span class="eyebrow">ESSRT 2026 &middot; p.&nbsp;11</span>
      <h1 class="cc-app-title">Earth&rsquo;s Interior</h1>
    </div>
    <div class="cc-segmented tabs" role="tablist" aria-label="View">
      <button class="cc-segmented-btn is-active" data-tab="page" role="tab">Printed page</button>
      <button class="cc-segmented-btn" data-tab="inside" role="tab">Inside Earth</button>
      <button class="cc-segmented-btn" data-tab="proc" role="tab">Processes</button>
    </div>
    <span class="spacer"></span>
    <span class="xstat" id="xstat"></span>
    <div class="xwrap">
      <button class="xbtn" id="xbtn" aria-haspopup="true" aria-expanded="false">&#8681; Export</button>
      <div class="xmenu" id="xmenu">
        <button data-x="whole">PNG &middot; Whole tool <span>2560&times;1440</span></button>
        <button data-x="page" class="page-only">PNG &middot; Printed diagrams <span>3961&times;1480</span></button>
        <button data-x="scene" class="inside-only">PNG &middot; Inside Earth <span>2560&times;1434</span></button>
        <button data-x="anim" class="proc-only">PNG &middot; Animation <span>2560&times;1434</span></button>
        <button data-x="card">PNG &middot; Card <span>960&times;1920</span></button>
        <hr class="anim-only">
        <button data-x="gif" class="anim-only">GIF &middot; Animation <span>960&times;540</span></button>
        <button data-x="mp4" class="anim-only">MP4 &middot; Animation <span>1920&times;1080</span></button>
      </div>
    </div>
  </header>

  <div class="cc-app-main">
    <section class="cc-scene">
      <div class="cc-scene-stage" id="stage">

/* ── layout (CSS px) ── */
