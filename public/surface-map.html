const REGION_DATA = {
  tristate: {
    stations: STATIONS_TRISTATE, names: NAMES_TRISTATE,
    sub: 'Tri-State · ASOS / AWOS Hourly Observations',
    docTitle: 'Surface Weather Map — Tri-State',
  },

};

let STATIONS = REGION_DATA[REGION_KEY].stations;
let NAMES    = REGION_DATA[REGION_KEY].names;

// ═══════════════════════════════════════════════════
// CANVAS + PROJECTION
// ═══════════════════════════════════════════════════
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let project;

// Re-run whenever the region (and therefore CW/CH/bounds) changes.
// Resizing a canvas's width/height resets its transform, so re-applying
// dpr scale here each time is correct rather than compounding.
function applyCanvasSize() {
  cv.width  = CW * dpr;
  cv.height = CH * dpr;
  cv.style.width  = CW + 'px';
  cv.style.height = CH + 'px';
  ctx.scale(dpr, dpr);
  project = MAP.makeProjection(B, dims);
}
applyCanvasSize();

// ═══════════════════════════════════════════════════
// UNIT HELPERS
// ═══════════════════════════════════════════════════
const cToF    = c => c != null ? Math.round(c * 9/5 + 32) : null;
const kmhToKt = k => k != null ? k / 1.852 : null;
const paToMb  = p => p != null ? p / 100 : null;

// ═══════════════════════════════════════════════════
// COLOR SCALES — ported 1:1 from temp-heatmap-monthly.html
// so a given temp/dewpoint always maps to the same color
// across every ContextClimate tool.
// ═══════════════════════════════════════════════════
const SCALES = {
  temp: { vals: [-5, 25, 50, 75, 102],          cols: ['#FFB3C6','#A8D4F0','#5DBF6A','#FFE033','#D41A1A'] },
  dew:  { vals: [-25, 5, 18, 30, 55, 68, 80],   cols: ['#4A3410','#B89870','#D4C060','#FFEE00','#3DB84A','#2A8C30','#2A72C8'] },
};

function h2r(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lrp(a, b, t) { return Math.round(a + (b - a) * t); }

function getColor(val, sc) {
  if (val == null) return '#888';
  const { vals: vs, cols: cs } = sc;
  if (val <= vs[0]) return cs[0];
  if (val >= vs[vs.length - 1]) return cs[cs.length - 1];
  for (let i = 0; i < vs.length - 1; i++) {
    if (val >= vs[i] && val <= vs[i + 1]) {
      const t = (val - vs[i]) / (vs[i + 1] - vs[i]);
      const a = h2r(cs[i]), b = h2r(cs[i + 1]);
      return `rgb(${lrp(a[0],b[0],t)},${lrp(a[1],b[1],t)},${lrp(a[2],b[2],t)})`;
    }
  }
  return cs[cs.length - 1];
}

function fmtPres(mb) {
  if (mb == null) return '';
  return String(Math.round(mb * 10) % 1000).padStart(3, '0');
}

function skyFrac(clouds) {
  if (!clouds || !clouds.length) return null;
  const rank = { CLR:0, SKC:0, FEW:1, SCT:2, BKN:3, OVC:4, VV:5 };
  let best = 'CLR';
  for (const l of clouds) {
    if ((rank[l.amount] ?? -1) > (rank[best] ?? -1)) best = l.amount;
  }
  return { CLR:0, SKC:0, FEW:0.2, SCT:0.5, BKN:0.75, OVC:1, VV:-1 }[best] ?? 0;
}

// ═══════════════════════════════════════════════════
// STATION MODEL DRAWING
// ═══════════════════════════════════════════════════
// Sky-cover circle: filled-fraction shows total cloud cover.
function drawSky(x, y, r, frac) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#3a5575';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  if (frac == null || frac === 0) return;

  if (frac === -1) { // sky obscured — X mark
    ctx.strokeStyle = '#3a5575';
    ctx.lineWidth = 1;
    const d = r * 0.62;
    ctx.beginPath();
    ctx.moveTo(x-d, y-d); ctx.lineTo(x+d, y+d);
    ctx.moveTo(x+d, y-d); ctx.lineTo(x-d, y+d);
    ctx.stroke();
    return;
  }

  ctx.fillStyle = '#3a5575';

  // OVC (fully covered) — solid fill
  if (frac >= 0.999) {
    ctx.beginPath();
    ctx.arc(x, y, r - 0.5, 0, Math.PI * 2);
    ctx.fill();
    return;
  }

  // Partial cover — pie slice from 12 o'clock, clockwise (WMO convention)
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, r - 0.5, -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * frac);
  ctx.closePath();
  ctx.fill();
}

// Wind barb: standard meteorological convention.
//   half barb = 5 kt, full barb = 10 kt, pennant = 50 kt
function drawBarb(x, y, dirDeg, speedKt) {
  if (speedKt == null) return;

  if (speedKt < 2.5) {  // calm — small open circle around the station
    ctx.beginPath();
    ctx.arc(x, y, 10, 0, Math.PI * 2);
    ctx.strokeStyle = '#3a5575';
    ctx.lineWidth = 1;
    ctx.stroke();
    return;
  }

  const { SL, BL, BS } = MAP.STATION;
  const rad = dirDeg * Math.PI / 180;
  const dx =  Math.sin(rad);
  const dy = -Math.cos(rad);
  const tx = x + dx * SL, ty = y + dy * SL;
  const px = -dy, py = dx;

  ctx.strokeStyle = '#2a3f5c';
  ctx.fillStyle   = '#2a3f5c';
  ctx.lineWidth   = 1.1;

  // Staff
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(tx, ty);
  ctx.stroke();

  let rem = Math.round(speedKt / 5) * 5;
  let pos = 0;

  // 50-kt pennants
  while (rem >= 50) {
    const bx = tx - dx*pos, by = ty - dy*pos;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + px*BL, by + py*BL);
    ctx.lineTo(bx - dx*BS, by - dy*BS);
    ctx.closePath(); ctx.fill();
    rem -= 50; pos += BS + 1;
  }
  // 10-kt full barbs
  while (rem >= 10) {
    const bx = tx - dx*pos, by = ty - dy*pos;
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx + px*BL, by + py*BL);
    ctx.stroke();
    rem -= 10; pos += BS;
  }
  // 5-kt half barb
  if (rem >= 5) {
    const bx = tx - dx*pos, by = ty - dy*pos;
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx + px*(BL/2), by + py*(BL/2));
    ctx.stroke();
  }
}

// Full station model: sky + barb + temp/dew/pressure/id labels
function drawStation(stn) {
  const [x, y] = project(stn.lon, stn.lat);
  if (x < -30 || x > CW+30 || y < -30 || y > CH+30) return;

  const { R, OFFSET_PAD } = MAP.STATION;
  const off = R + OFFSET_PAD;
  const kt  = kmhToKt(stn.windSpeed);
  const mb  = paToMb(stn.pres);

  drawSky(x, y, R, skyFrac(stn.clouds));
  if (stn.windDir != null && kt != null) drawBarb(x, y, stn.windDir, kt);

  ctx.textBaseline = 'middle';

  // Temperature (red, upper-left)
  const tF = cToF(stn.temp);
  if (tF != null) {
    ctx.font = MAP.FONTS.stationData;
    ctx.fillStyle = MAP.COLORS.temp; ctx.textAlign = 'right';
    ctx.fillText(tF, x - off, y - off);
  }

  // Dewpoint (blue, lower-left)
  const dF = cToF(stn.dew);
  if (dF != null) {
    ctx.font = MAP.FONTS.stationData;
    ctx.fillStyle = MAP.COLORS.dew; ctx.textAlign = 'right';
    ctx.fillText(dF, x - off, y + off);
  }

  // Pressure (dark, upper-right)
  if (mb != null) {
    ctx.font = MAP.FONTS.stationData;
    ctx.fillStyle = MAP.COLORS.textPrimary; ctx.textAlign = 'left';
    ctx.fillText(fmtPres(mb), x + off, y - off);
  }

  // Station ID (gray, lower-right)
  ctx.font = MAP.FONTS.stationId;
  ctx.fillStyle = MAP.COLORS.textSecondary; ctx.textAlign = 'left';
  ctx.fillText(stn.id.slice(1), x + off, y + off);
}

// Value-only marker: one large colored number, no other station glyphs.
// `field` is 'temp' or 'dew' — matches the SCALES key.
function drawValueOnly(stn, field) {
  const [x, y] = project(stn.lon, stn.lat);
  if (x < -30 || x > CW+30 || y < -30 || y > CH+30) return;

  const raw = field === 'temp' ? cToF(stn.temp) : cToF(stn.dew);
  if (raw == null) return;

  const color = getColor(raw, SCALES[field]);
  const label = `${raw}\u00B0`;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Dark halo so the colored number stays legible over the light basemap
  // regardless of land/ocean/state-line color underneath it.
  ctx.font = '700 26px "JetBrains Mono", monospace';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(8,12,20,0.82)';
  ctx.strokeText(label, x, y);
  ctx.fillStyle = color;
  ctx.fillText(label, x, y);

  // Station ID below, for reference
  const idLabel = stn.id.slice(1);
  ctx.font = '600 13px "Barlow Condensed"';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.strokeText(idLabel, x, y + 20);
  ctx.fillStyle = MAP.COLORS.textSecondary;
  ctx.fillText(idLabel, x, y + 20);
}

// ═══════════════════════════════════════════════════
// LOAD BASE GEOJSON
// ═══════════════════════════════════════════════════
let statesGeo = null;

async function loadGeo(signal) {
  const r = await fetch(REGION.geo, { signal });
  if (!r.ok) throw new Error(`Failed to fetch ${REGION.geo}: HTTP ${r.status}`);
  statesGeo = await r.json();
}

// ═══════════════════════════════════════════════════
// FETCH OBSERVATIONS (routine hourly METARs)
// ═══════════════════════════════════════════════════
let obs = [];

async function fetchStn(id, signal) {
  try {
    const r = await fetch(
      `https://api.weather.gov/stations/${id}/observations?limit=6`,
      { headers: { 'User-Agent': 'contextclimate.io' }, signal }
    );
    if (!r.ok) return null;
    const j = await r.json();
    const features = j.features;
    if (!features?.length) return null;

    // Prefer routine METAR (issued :45–:59 or :00–:05)
    const feat = features.find(f => {
      const min = new Date(f.properties?.timestamp).getUTCMinutes();
      return min >= 45 || min <= 5;
    }) || features[0];

    const p      = feat.properties;
    const coords = feat.geometry?.coordinates;
    if (!coords) return null;

    return {
      id,
      lon:       coords[0],
      lat:       coords[1],
      temp:      p.temperature?.value,
      dew:       p.dewpoint?.value,
      windDir:   p.windDirection?.value,
      windSpeed: p.windSpeed?.value,
      pres:      p.barometricPressure?.value,
      clouds:    p.cloudLayers,
      vis:       p.visibility?.value,
      ts:        p.timestamp,
    };
  } catch { return null; }
}

async function loadObs(signal) {
  const results = await Promise.all(STATIONS.map(id => fetchStn(id, signal)));
  obs = results.filter(r => r?.lat != null && r?.lon != null);
}

function getValidTime() {
  const times = obs.map(s => s.ts).filter(Boolean)
    .map(t => new Date(t)).filter(t => !isNaN(t));
  if (!times.length) return null;
  return new Date(Math.max(...times.map(t => t.getTime())));
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render() {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, CW, CH);
  ctx.clip();
  MAP.renderBase(ctx, statesGeo, project, dims);
  if (mode === 'station') {
    for (const stn of obs) drawStation(stn);
  } else {
    for (const stn of obs) drawValueOnly(stn, mode);
  }
  MAP.drawStamp(ctx, getValidTime(), dims);
  ctx.restore();
}

// ═══════════════════════════════════════════════════
// VIEW MODE — station model / temp-only / dewpoint-only
// ═══════════════════════════════════════════════════
let mode = 'station';

function legendGradient(sc) {
  const vMin = sc.vals[0], vMax = sc.vals[sc.vals.length - 1];
  const span = vMax - vMin;
  const stops = sc.vals.map((v, i) => `${sc.cols[i]} ${((v - vMin) / span * 100).toFixed(1)}%`);
  return `linear-gradient(to right, ${stops.join(', ')})`;
}

function updateLegend() {
  const legend = document.getElementById('legend');
  if (mode === 'station') {
    legend.innerHTML = `
      <div class="lg"><div class="lg-dot" style="background:#e05252"></div>Temperature &deg;F</div>
      <div class="lg"><div class="lg-dot" style="background:#6aabee"></div>Dewpoint &deg;F</div>
      <div class="lg"><div class="lg-dot" style="background:#9aa3b2"></div>Pressure (coded mb)</div>
      <div class="lg"><div class="lg-dot" style="border:1px solid rgba(255,255,255,0.5);background:transparent"></div>Wind barb &middot; Sky cover</div>
    `;
  } else {
    const sc    = SCALES[mode];
    const label = mode === 'temp' ? 'Temperature' : 'Dewpoint';
    legend.innerHTML = `
      <div class="lg lg-scale">
        <span class="lg-scale-lbl">${sc.vals[0]}&deg;</span>
        <div class="lg-gradient" style="background:${legendGradient(sc)}"></div>
        <span class="lg-scale-lbl">${sc.vals[sc.vals.length - 1]}&deg;</span>
      </div>
      <div class="lg">${label} &middot; colored by value</div>
    `;
  }
}

document.querySelectorAll('#view-toggle .vt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    document.querySelectorAll('#view-toggle .vt-btn').forEach(b => b.classList.toggle('active', b === btn));
    updateLegend();
    render();
  });
});

// ═══════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════
const tip = document.getElementById('tip');
const ov  = document.getElementById('ov');

cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CW / rect.width);
  const my = (e.clientY - rect.top)  * (CH / rect.height);

  let best = null, bestD = 24;
  for (const s of obs) {
    const [sx, sy] = project(s.lon, s.lat);
    const d = Math.hypot(mx - sx, my - sy);
    if (d < bestD) { bestD = d; best = s; }
  }

  if (!best) { tip.style.display = 'none'; return; }

  const tF    = cToF(best.temp);
  const dF    = cToF(best.dew);
  const mb    = paToMb(best.pres);
  const kt    = kmhToKt(best.windSpeed);
  const mph   = best.windSpeed != null ? Math.round(best.windSpeed * 0.621) : null;
  const visMi = best.vis != null ? (best.vis / 1609.34).toFixed(1) : null;

  tip.innerHTML = `
    <div class="tip-id">${best.id} &middot; ${NAMES[best.id] || best.id}</div>
    ${tF    != null ? `<div class="tip-row"><span class="tip-lbl">Temp</span><span>${tF}&deg;F</span></div>` : ''}
    ${dF    != null ? `<div class="tip-row"><span class="tip-lbl">Dewpoint</span><span>${dF}&deg;F</span></div>` : ''}
    ${mb    != null ? `<div class="tip-row"><span class="tip-lbl">Pressure</span><span>${mb.toFixed(1)} mb</span></div>` : ''}
    ${kt    != null ? `<div class="tip-row"><span class="tip-lbl">Wind</span><span>${best.windDir != null ? best.windDir+'&deg; @ ' : ''}${Math.round(kt)} kt &middot; ${mph} mph</span></div>` : ''}
    ${visMi != null ? `<div class="tip-row"><span class="tip-lbl">Visibility</span><span>${visMi} mi</span></div>` : ''}
  `;

  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = e.clientX + 16, ly = e.clientY - th/2;
  if (lx + tw > window.innerWidth - 8) lx = e.clientX - tw - 16;
  if (ly < 4) ly = 4;
  tip.style.left = lx + 'px';
  tip.style.top  = ly + 'px';
});

cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ═══════════════════════════════════════════════════
// SHARE / COPY PILL
// ═══════════════════════════════════════════════════
const shareBtn   = document.getElementById('share-btn');
const shareLabel = document.getElementById('share-label');

shareBtn.addEventListener('click', () => {
  cv.toBlob(async blob => {
    const file = new File([blob], 'contextclimate-surface-map.png', { type: 'image/png' });

    if (navigator.canShare?.({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Surface Weather Map — contextclimate.io' });
        flash('Shared!'); return;
      } catch { /* cancelled */ }
    }

    if (navigator.clipboard?.write) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        flash('Copied!'); return;
      } catch { /* fall through */ }
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'contextclimate-surface-map.png';
    a.click();
    flash('Saved!');
  }, 'image/png');
});

function flash(msg) {
  shareLabel.textContent = msg;
  shareBtn.classList.add('copied');
  setTimeout(() => {
    shareLabel.textContent = 'Copy Map';
    shareBtn.classList.remove('copied');
  }, 2200);
}

// ═══════════════════════════════════════════════════
// STATUS
// ═══════════════════════════════════════════════════
const setStatus = msg => { document.getElementById('stext').textContent = msg; };

// ═══════════════════════════════════════════════════
// REGION LOADING + SWITCHING
// ═══════════════════════════════════════════════════
// init() and switchRegion() both funnel through here. Each call gets its
// own AbortController; starting a new one cancels whatever the previous
// call still had in flight, so an init() still mid-fetch when the user
// clicks a toggle can't resolve later and clobber the newer region's
// state with stale data (the bug that caused the stuck/mismatched map).
let currentAbort = null;

async function loadRegion(key, { isInitial = false } = {}) {
  if (currentAbort) currentAbort.abort();
  const abort = new AbortController();
  currentAbort = abort;

  REGION_KEY = key;
  REGION     = MAP_REGIONS[key];
  B          = REGION.bounds;
  dims       = MAP.computeDims(B, CW);
  CH         = dims.CH;
  STATIONS   = REGION_DATA[key].stations;
  NAMES      = REGION_DATA[key].names;

  document.getElementById('page-sub').textContent = REGION_DATA[key].sub;
  document.title = REGION_DATA[key].docTitle;
  applyCanvasSize();

  ov.style.display = 'flex';
  ov.textContent = 'Loading map boundaries…';
  setStatus('Loading map boundaries…');

  try {
    await loadGeo(abort.signal);
    if (abort.signal.aborted) return;  // superseded by a newer region switch

    if (isInitial) await document.fonts.ready;
    MAP.renderBase(ctx, statesGeo, project, dims);

    ov.textContent = 'Fetching observations…';
    setStatus('Fetching station observations…');
    await loadObs(abort.signal);
    if (abort.signal.aborted) return;  // superseded again — don't paint stale obs

    render();
    ov.style.display = 'none';

    const t = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    setStatus(`${obs.length} of ${STATIONS.length} stations loaded · ${t}`);
  } catch (err) {
    if (abort.signal.aborted) return;  // expected cancellation, not a real failure
    console.error('Failed to load region', key, err);
    ov.textContent = 'Could not load map data — check your connection and try again.';
    setStatus('Load failed — see browser console for details');
  }
}

async function init() {
  await loadRegion(REGION_KEY, { isInitial: true });
}

async function switchRegion(key) {
  if (key === REGION_KEY) return;
  await loadRegion(key);
}

document.querySelectorAll('#region-toggle .vt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.region === REGION_KEY) return;
    document.querySelectorAll('#region-toggle .vt-btn').forEach(b => b.classList.toggle('active', b === btn));
    switchRegion(btn.dataset.region);
  });
});

async function refresh() {
  await loadObs();
  render();
  const t = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  setStatus(`${obs.length} stations · Refreshed ${t}`);
}

init();
setInterval(refresh, REFRESH_MS);
</script>
