<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Weather Map</title>
<link rel="stylesheet" href="core-sample-tools.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root { --tool-accent: var(--accent-live); --cc-card-width: 360px; }
[hidden] { display: none !important; }
.cc-tab { font-size: 15px; padding: 8px 12px; }
.sm-select { font-family: var(--font-mono); font-size: 14px; padding: 7px 10px; border-radius: var(--radius-md); }
.status { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tool-accent); box-shadow: 0 0 0 3px rgba(55,138,221,.18); }
.status.err .dot { background: #E5534B; box-shadow: 0 0 0 3px rgba(229,83,75,.18); }
.status.busy .dot { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.sm-head { gap: 8px 12px; flex-wrap: wrap; }
.sm-head .cc-segmented-btn { font-size: 13px; padding: 6px 10px; }
.sm-head .cc-segmented-btn:disabled { opacity: .35; cursor: default; }
.pchip { font-family: var(--font-mono); font-size: 13px; letter-spacing: .03em; padding: 5px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: transparent; color: var(--color-text-muted); cursor: pointer; }
.pchip.is-active { color: var(--color-text-primary); border-color: var(--color-border-hover); background: var(--color-surface-2); }
.pchip:hover { border-color: var(--tool-accent); }
.scene-cap { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
.scene-cap b { color: var(--color-text-primary); font-weight: 400; }
#stage canvas { position: absolute; left: 0; top: 0; }
.stage-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 14px; letter-spacing: .08em; color: var(--color-text-muted); pointer-events: none; text-align: center; }
.legend { position: absolute; left: 10px; bottom: 10px; z-index: 3; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; max-width: calc(100% - 120px); padding: 6px 10px; background: rgba(30,35,32,.9); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); pointer-events: none; }
.legend:empty { display: none; }
.lg-bar { position: relative; display: inline-block; width: 280px; height: 30px; }
.lg-grad { position: absolute; left: 0; right: 0; top: 2px; height: 10px; border-radius: 2px; background-repeat: no-repeat; }
.lg-ticks span { position: absolute; top: 15px; transform: translateX(-50%); font-size: 12px; color: var(--color-text-primary); white-space: nowrap; }
.lg-unit { white-space: nowrap; }
.lg-cat { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 13px; color: var(--color-text-primary); }
.lg-cat i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(232,228,217,.5); }
.lg-radar { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-radar span { display: inline-flex; } .lg-radar i { width: 8px; height: 11px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: rgba(30,35,32,.95); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 7px 10px; font-family: var(--font-mono); font-size: 13px; line-height: 1.45; color: var(--color-text-primary); max-width: 300px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
.tip b { color: var(--tool-accent); } .tip span { font-size: 15px; } .tip small { font-size: 12px; color: var(--color-text-muted); }
.sm-bar { gap: 8px; }
.t-range { flex: 0 1 220px; min-width: 90px; accent-color: var(--tool-accent); }
.t-label { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); white-space: nowrap; }
.xstat { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); white-space: nowrap; }
.rk-h { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-muted); margin: 6px 0 2px; }
.rk-h:first-child { margin-top: 0; }
.rk-row { display: grid; grid-template-columns: 12px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 3px 0; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); cursor: pointer; }
.rk-row:hover .rk-n { color: var(--tool-accent); }
.rk-row i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(232,228,217,.45); }
.rk-n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rk-n em { font-style: normal; font-size: 12px; color: var(--color-text-muted); }
.rk-row b { font-weight: 700; }
.rk-empty, .rk-note { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); }
.rk-note { margin-top: 6px; }
.st-name { font-family: var(--font-display); font-size: 20px; font-weight: 600; color: var(--color-text-primary); line-height: 1.2; }
.st-sub { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin: 2px 0 4px; }
.st-sub a { color: var(--tool-accent); text-decoration: none; } .st-sub a:hover { text-decoration: underline; }
.sm-box { position: relative; height: 180px; flex-shrink: 0; }
.sm-box canvas { position: absolute; left: 0; top: 0; }
.metar-raw { font-family: var(--font-mono); font-size: 14px; line-height: 1.65; padding: 6px 0; color: var(--color-text-secondary); overflow-wrap: anywhere; }
.md-row { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 10px; padding: 5px 2px; border-top: 1px solid var(--color-border); }
.md-tok { font-family: var(--font-mono); font-size: 13px; color: var(--tool-accent); overflow-wrap: anywhere; }
.md-row.plain .md-tok { color: var(--color-text-secondary); }
.md-txt { font-family: var(--font-body); font-size: 14px; line-height: 1.35; color: var(--color-text-primary); min-width: 0; }
.md-txt b { display: block; font-family: var(--font-mono); font-size: 11.5px; font-weight: 400; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-muted); }
#st-detail { flex-shrink: 0; }
@media (max-width: 1440px) { .cc-app-title { font-size: 21px; } .cc-tab { padding: 8px 9px; font-size: 14px; } .cc-app-top { column-gap: 10px; } }
@media (max-width: 1180px) { :root { --cc-card-width: 320px; } .status #stext { display: none; } }
@media (max-width: 760px) {
  .cc-app-top { flex-wrap: wrap; row-gap: 8px; }
  .cc-tab-bar { flex: 1 1 100%; order: 6; overflow-x: auto; } .cc-tab { flex: 1; padding: 9px 6px; font-size: 13px; white-space: nowrap; }
  .sm-bar { flex-wrap: wrap; }
  .legend { max-width: calc(100% - 20px); bottom: 34px; }
}
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">
  <div class="cc-app-top">
    <h1 class="cc-app-title">Surface Weather Map</h1>
    <div class="cc-tab-bar" id="view-tabs" role="tablist"></div>
    <div class="cc-app-spacer"></div>
    <select class="cc-select sm-select" id="region" aria-label="Region"></select>
    <div class="status busy" id="status"><span class="dot"></span><span id="stext">Loading…</span></div>
  </div>
  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head sm-head">
        <div class="cc-segmented" id="style-seg"><button class="cc-segmented-btn is-active" data-s="points" id="style-points">Points</button><button class="cc-segmented-btn" data-s="contour" id="style-contour">Isotherms</button></div>
        <div class="cc-segmented" id="chg-seg"></div>
        <button class="pchip" id="radar-btn">Radar</button>
        <div class="cc-app-spacer"></div>
        <span class="scene-cap" id="cap"></span>
      </div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="cv"></canvas><canvas id="ov"></canvas>
        <div class="stage-msg" id="msg">LOADING OBSERVATIONS…</div>
        <div class="legend" id="legend"></div>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="cc-scene-bar sm-bar">
        <button class="cc-btn cc-btn-sm" id="t-prev" title="Previous hour" aria-label="Previous hour">&#9664;</button>
        <input type="range" class="t-range" id="t-range" min="0" max="12" step="1" value="12" aria-label="Hour">
        <button class="cc-btn cc-btn-sm" id="t-next" title="Next hour" aria-label="Next hour">&#9654;</button>
        <button class="cc-btn cc-btn-sm" id="t-play">&#9654; Play</button>
        <button class="cc-btn cc-btn-sm" id="t-latest">Latest</button>
        <span class="t-label" id="t-label"></span>
        <div class="cc-app-spacer"></div>
        <span class="xstat" id="xstat"></span>
        <button class="cc-btn cc-btn-sm" id="x-png">&#8595; PNG</button>
        <button class="cc-btn cc-btn-sm" id="x-gif">&#8595; GIF</button>
        <button class="cc-btn cc-btn-sm" id="x-mp4">&#8595; MP4</button>
      </div>
    </div>
    <div class="cc-card">
      <div class="cc-card-eb"><span id="rank-t">Highest &amp; lowest</span><span class="sub" id="rank-sub"></span></div>
      <div class="cc-card-grp" id="rank"></div>
      <div class="cc-card-eb">Station<span class="sub" id="st-time"></span></div>
      <div id="st-detail"><div class="rk-empty">Click a station on the map.</div></div>
      <div class="cc-card-src" id="src"></div>
    </div>
  </div>
</div>

<script src="map-base.js"></script>
<script src="map-regions.js"></script>
<script src="station-model.js"></script>
<script src="field-analysis.js"></script>
<script src="metar-stations.js"></script>

<script>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const MONO = '"Courier Prime", monospace', SERIF = '"Zilla Slab", serif', SANS = '"Public Sans", sans-serif';

};
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function colorRGB(v, sc, k = 1) {
  const vals = sc.vals, cols = sc.cols;
  if (v <= vals[0] * k) return hexRGB(cols[0]);
  if (v >= vals[vals.length - 1] * k) return hexRGB(cols[cols.length - 1]);
  for (let i = 0; i < vals.length - 1; i++) {
    const a = vals[i] * k, b = vals[i + 1] * k;
    if (v >= a && v <= b) { const t = (v - a) / (b - a), A = hexRGB(cols[i]), B = hexRGB(cols[i + 1]); return [0, 1, 2].map(j => Math.round(A[j] + (B[j] - A[j]) * t)); }
  }
  return hexRGB(cols[0]);
}
const rgbStr = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const lum = c => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;
const RADAR_COLS = [[5,'#04e9e7'],[10,'#019ff4'],[15,'#0300f4'],[20,'#02fd02'],[25,'#01c501'],[30,'#008e00'],[35,'#fdf802'],[40,'#e5bc00'],[45,'#fd9500'],[50,'#fd0000'],[55,'#d40000'],[60,'#bc0000'],[65,'#f800fd'],[70,'#9854c6']];

function priority(id, key) {

// a margin, so contours run to the edges.
function stationSets(key) {
  const B = MAP_REGIONS[key].bounds, mx = (B.east - B.west) * .18, my = (B.north - B.south) * .18;
  const inBox = (lat, lon, m) => lat != null && lon >= B.west - (m ? mx : 0) && lon <= B.east + (m ? mx : 0) && lat >= B.south - (m ? my : 0) && lat <= B.north + (m ? my : 0);
  const S = new Map();

    let s = S.get(id);
    if (!s) {
      const r = LIST_BY_ID.get(id), ro = STATION_ROSTER.find(q => q[0] === id);
      s = { id, name: NAMES_ALL[id] || (r && r[1]) || (ro && ro[1]) || id, st: (r && r[2]) || (ro && ro[2]) || '', lat: r ? r[3] : ro ? ro[3] : null, lon: r ? r[4] : ro ? ro[4] : null, plot: false, prio: priority(id, key) };
      S.set(id, s);

  };

  else if (key === 'conus') plotIds = STATIONS_CONUS;
  else plotIds = [...new Set(STATIONS_TRISTATE.concat(STATIONS_CONUS, STATION_ROSTER.map(r => r[0])))];
  for (const id of plotIds) {
    const r = LIST_BY_ID.get(id), ro = STATION_ROSTER.find(q => q[0] === id), lat = r ? r[3] : ro ? ro[3] : null, lon = r ? r[4] : ro ? ro[4] : null;
    if (lat == null || inBox(lat, lon, false) || key === 'tristate' || key === 'conus') add(id, true);
  }
  for (const r of METAR_STATIONS) if (inBox(r[3], r[4], true)) add(r[0], false);
  return S;
}

async function loadRegion() {
  const id = ++S.loadId;

  const ctrl = S.ctrl = new AbortController();
  stop();
  S.stations = stationSets(S.region); S.lists = new Map(); S.frames = []; S.fi = -1; S.full = false; S.cache.clear(); S.qcCache.clear(); S.state = 'loading'; S.sel = null; S.hover = null;
  status('busy', 'Loading the last 4 hours…'); renderAll();
  const st = [...S.stations.values()], metarIds = new Set(st.filter(s => s.plot).map(s => s.id));
  const now = Date.now();
  try {
    const a = await OBS.load(st, { start: new Date(now - 4.5 * HOUR), end: new Date(now + 10 * 60e3), metarIds, signal: ctrl.signal,
      onProgress: (d, n) => { if (id === S.loadId) status('busy', `Loading the last 4 hours… ${d}/${n}`); } });
    if (id !== S.loadId) return;
    S.lists = a; buildFrames(); S.state = S.frames.length ? 'ready' : 'empty';
    status('busy', 'Loading earlier hours…'); renderAll();
    const b = await OBS.load(st, { start: new Date(now - 37 * HOUR), end: new Date(now - 4.5 * HOUR + 60e3), metarIds, signal: ctrl.signal,
      onProgress: (d, n) => { if (id === S.loadId) status('busy', `Loading earlier hours… ${d}/${n}`); } });
    if (id !== S.loadId) return;
    OBS.merge(S.lists, b); S.full = true; S.cache.clear(); S.qcCache.clear();
    const fi = S.fi, n0 = S.frames.length; buildFrames(); S.fi = Math.max(0, S.frames.length - (n0 - fi));
    status('ok', 'Updated ' + fmtClock(Date.now())); renderAll();
  } catch (e) {
    if (e.name === 'AbortError' || id !== S.loadId) return;
    console.error('Surface map load:', e);
    if (S.state !== 'ready') S.state = 'error';

}
function buildFrames() {

function stationValue(s, H, view = S.view, chg = S.chg) {
  const V = VIEWS[view]; if (!V.get) return null;

  if (!chg) { const v = V.get(o.ob); return v == null || !isFinite(v) ? null : v; }

// The region box, widened along one axis to fill the canvas.
function geom(W, H) {
  const B0 = MAP_REGIONS[S.region].bounds, cosMid = Math.cos((B0.north + B0.south) / 2 * Math.PI / 180);
  let lonR = B0.east - B0.west, latR = B0.north - B0.south;
  const needH = W * latR / (lonR * cosMid);
  if (needH > H) lonR = latR * W / (H * cosMid); else latR = H * lonR * cosMid / W;
  const cx = (B0.east + B0.west) / 2, cy = (B0.north + B0.south) / 2;
  const B = { west: cx - lonR / 2, east: cx + lonR / 2, south: cy - latR / 2, north: cy + latR / 2 };
  return { W, H, B, project: MAP.makeProjection(B, { CW: W, CH: H }), unproject: MAP.makeUnproject(B, { CW: W, CH: H }), mpp: lonR * 69.17 * cosMid / W };
}
function loadBase(G) {

}

function drawBase(c, G, base, fill) {

  if (fill) { c.save(); c.clip(us, 'evenodd'); c.drawImage(fill, 0, 0, G.W, G.H); c.restore(); }

  c.strokeStyle = fill ? 'rgba(14,18,16,.5)' : 'rgba(232,228,217,.17)'; c.lineWidth = .8; c.stroke(linePath(base.admin1, G));

function curScale() {

function analysis(fi, G) {

function modelParts(lay,ob){

  S.radar = p.get('radar') === '1';
  $('view-tabs').innerHTML = VIEW_ORDER.map(v => `<button class="cc-tab" role="tab" data-v="${v}">${VIEWS[v].label}</button>`).join('');
  $('region').innerHTML = ['tristate', 'northeast', 'southeast', 'midwest', 'northernplains', 'southernplains', 'mountainwest', 'southwest', 'pacificnw', 'california', 'conus'].map(k => `<option value="${k}">${MAP_REGIONS[k].label === 'Continental US' ? 'National' : MAP_REGIONS[k].label}</option>`).join('');
  $('region').value = S.region;
  $('chg-seg').innerHTML = CHGS.map(h => `<button class="cc-segmented-btn" data-h="${h}">${h ? h + ' h' : 'Now'}</button>`).join('');
  $('view-tabs').addEventListener('click', e => { const b = e.target.closest('.cc-tab'); if (!b) return; S.view = b.dataset.v; if (S.view === 'station' || S.view === 'gust') S.chg = 0; renderAll(); });
  $('style-seg').addEventListener('click', e => { const b = e.target.closest('.cc-segmented-btn'); if (!b) return; S.style = b.dataset.s; renderAll(); });
  $('chg-seg').addEventListener('click', e => { const b = e.target.closest('.cc-segmented-btn'); if (!b || b.disabled) return; S.chg = +b.dataset.h; renderAll(); });
  $('radar-btn').addEventListener('click', () => { S.radar = !S.radar; renderAll(); });
  $('region').addEventListener('change', e => { S.region = e.target.value; loadRegion(); });
  $('t-range').addEventListener('input', e => { stop(); setFrame(+e.target.value); });
  $('t-prev').addEventListener('click', () => { stop(); setFrame(S.fi - 1); });
  $('t-next').addEventListener('click', () => { stop(); setFrame(S.fi + 1); });
  $('t-latest').addEventListener('click', () => { stop(); setFrame(S.frames.length - 1); });
  $('t-play').addEventListener('click', play);
  $('x-png').addEventListener('click', exportPNG);
  $('x-gif').addEventListener('click', () => exportAnim('gif'));
  $('x-mp4').addEventListener('click', () => exportAnim('mp4'));
  $('rank').addEventListener('click', e => { const r = e.target.closest('[data-id]'); if (!r) return; S.sel = r.dataset.id; if (!S.stations.get(S.sel).plot) S.sel = null; renderMap(); renderStation(); });
  const ov = $('ov'), pos = ev => { const r = ov.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
  ov.addEventListener('mousemove', ev => { S.hover = hitTest(...pos(ev)); ov.style.cursor = S.hover && S.hover.it ? 'pointer' : 'default'; drawHover(); });
  ov.addEventListener('mouseleave', () => { S.hover = null; drawHover(); });
  ov.addEventListener('click', ev => { const h = hitTest(...pos(ev)); if (h && h.it) { S.sel = h.it.s.id; renderMap(); renderStation(); } });
  let key = '';
  new ResizeObserver(() => { const s = $('stage'), k = s.offsetWidth + 'x' + s.offsetHeight; if (k !== key && s.offsetWidth) { key = k; renderMap(); } }).observe($('stage'));
  if (SM.ready) SM.ready().then(() => renderMap()).catch(() => {});
  document.fonts && document.fonts.ready.then(() => renderMap());
  window.__smState = () => S;
  loadRegion();
  setInterval(() => { if (!S.exporting) loadRegion(); }, HOUR);
}
init();
</script>
</body>
</html>
