<!DOCTYPE html>
<html lang="en">
<head>

<title>Surface Weather Map — Tri-State</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Barlow+Condensed:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0f1117;
  color: #e0e4ee;
  font-family: 'Plus Jakarta Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

header {
  padding: 16px 22px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  display: flex;
  align-items: baseline;
  gap: 16px;
}

header h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1D9E75;
}

header .sub {
  font-size: 14px;
  color: rgba(255,255,255,0.4);
}

.status {
  padding: 9px 22px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #1D9E75;
  flex-shrink: 0;
  animation: blink 2.5s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

.view-toggle {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 13px 22px 0;
  flex-wrap: wrap;
}

.vt-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 999px;
  padding: 7px 18px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
}

.vt-btn:hover {
  border-color: rgba(29,158,117,0.5);
  color: rgba(255,255,255,0.85);
}

.vt-btn.active {
  background: rgba(29,158,117,0.16);
  border-color: #1D9E75;
  color: #1D9E75;
}

.map-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  padding: 14px 20px;
  flex: 1;
}

canvas {
  border-radius: 6px;
  max-width: 100%;
  display: block;
  cursor: crosshair;
}

.overlay {
  position: absolute;
  inset: 20px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15,17,23,0.7);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  pointer-events: none;
}

#share-btn {
  position: absolute;
  top: 32px;
  right: 32px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(15,17,23,0.82);
  border: 1px solid rgba(29,158,117,0.3);
  border-radius: 999px;
  padding: 7px 14px 7px 11px;
  color: rgba(255,255,255,0.65);
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  letter-spacing: 0.05em;
  cursor: pointer;
  backdrop-filter: blur(8px);
  transition: border-color 0.15s, color 0.15s;
  z-index: 10;
}

#share-btn:hover {
  border-color: rgba(29,158,117,0.7);
  color: #1D9E75;
}

#share-btn.copied {
  border-color: #1D9E75;
  color: #1D9E75;
}

#tip {
  position: fixed;
  background: rgba(10,12,18,0.96);
  border: 1px solid rgba(29,158,117,0.22);
  border-radius: 7px;
  padding: 10px 13px;
  display: none;
  pointer-events: none;
  z-index: 200;
  min-width: 180px;
  font-size: 12px;
  backdrop-filter: blur(8px);
}

#tip .tip-id {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  font-weight: 600;
  color: #1D9E75;
  margin-bottom: 7px;
  letter-spacing: 0.03em;
}

#tip .tip-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  line-height: 1.75;
  color: rgba(255,255,255,0.78);
}

#tip .tip-lbl { color: rgba(255,255,255,0.36); }

.legend {
  padding: 12px 22px 20px;
  display: flex;
  gap: 22px;
  flex-wrap: wrap;
  justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px;
  letter-spacing: 0.04em;
  color: rgba(255,255,255,0.45);
}

.lg { display: flex; align-items: center; gap: 6px; }
.lg-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }

.lg-scale { gap: 9px; }
.lg-gradient {
  width: 160px;
  height: 11px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.18);
}
.lg-scale-lbl {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: rgba(255,255,255,0.55);
}
.legend { flex-direction: column; align-items: center; gap: 10px; }
.lg-row { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; align-items: center; }
.lg-wx {
  font-family: 'CCWxSymbols';
  font-size: 22px;
  line-height: 1;
  width: 20px;
  text-align: center;
}
.lg-credits {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px;
  letter-spacing: 0;
  color: rgba(255,255,255,0.32);
  text-align: center;
}
#tip { max-width: 380px; }
#tip .tip-raw {
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.45;
  color: rgba(255,255,255,0.5);
  word-break: break-word;
}
</style>

<header>

<script>

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
// CANVAS + PROJECTION
// ═══════════════════════════════════════════════════
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let project;

// Re-run whenever the region (and therefore CW/CH/bounds) changes.
function applyCanvasSize() {
  cv.width  = CW * dpr;
  cv.height = CH * dpr;
  cv.style.width  = CW + 'px';
  cv.style.aspectRatio = `${CW} / ${CH}`;
  cv.style.height = 'auto';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  project = MAP.makeProjection(B, dims);
}

  dew:  { vals: [-25, 5, 18, 30, 55, 68, 80],   cols: ['#4A3410','#B89870','#D4C060','#FFEE00','#3DB84A','#2A8C30','#2A72C8'] },
  pres: { vals: [985, 1010, 1035],
          cols: ['#9E1B1B','#BFBFBF','#1B4399'] },
  gust: { vals: [10, 25, 40, 58, 75, 100],
          cols: ['#6AABEE','#5DBF6A','#FFE033','#FF9933','#D41A1A','#8B19B2'] },
};

function h2r(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lrp(a, b, t) { return Math.round(a + (b - a) * t); }

function getColor(val, sc) {
  if (val == null) return '#888';
  const { vals: vs, cols: cs } = sc;
  if (val <= vs[0]) return cs[0];
  if (val >= vs[vs.length - 1]) return cs[cs.length - 1];
  for (let i = 0; i < vs.length - 1; i++) {
    if (val >= vs[i] && val <= vs[i + 1]) {
      const t = (val - vs[i]) / (vs[i + 1] - vs[i]);
      const a = h2r(cs[i]), b = h2r(cs[i + 1]);
      return `rgb(${lrp(a[0],b[0],t)},${lrp(a[1],b[1],t)},${lrp(a[2],b[2],t)})`;
    }
  }
  return cs[cs.length - 1];
}

// Per-mode value (in the units each scale/legend expects) and suffix.
// Pressure is true sea-level pressure only, same as the station model.
const FIELD_VALUE = {
  temp: s => SM.cToF(s.tempC),
  dew:  s => SM.cToF(s.dewC),
  pres: s => s.slp != null ? Math.round(s.slp) : null,
  gust: s => (s.wind && s.wind.gust != null) ? ktToMph(s.wind.gust) : null,
};
const FIELD_SUFFIX = { temp: '\u00B0', dew: '\u00B0', pres: '', gust: '' };

// ═══════════════════════════════════════════════════
// VALUE-ONLY MARKERS (Temperature / Dewpoint / SLP / Gust tabs)
// ═══════════════════════════════════════════════════
const VALUE_FONT = '700 26px "JetBrains Mono", monospace';
const VALUE_ID_FONT = '600 13px "Barlow Condensed"';

function valueLayout(c, stn, field) {
  const raw = FIELD_VALUE[field](stn);
  if (raw == null) return null;
  const label = `${raw}${FIELD_SUFFIX[field]}`;
  c.font = VALUE_FONT;
  const w = c.measureText(label).width;
  return { raw, label, color: getColor(raw, SCALES[field]),
           box: { x0: -w / 2 - 2, x1: w / 2 + 2, y0: -15, y1: 28 } };
}

function drawValueOnly(c, x, y, stn, lay) {
  c.save();
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.lineJoin = 'round';

  c.font = VALUE_FONT;
  c.lineWidth = 4;
  c.strokeStyle = 'rgba(8,12,20,0.82)';
  c.strokeText(lay.label, x, y);
  c.fillStyle = lay.color;
  c.fillText(lay.label, x, y);

  const idLabel = stn.id.slice(1);
  c.font = VALUE_ID_FONT;
  c.lineWidth = 3;
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.strokeText(idLabel, x, y + 20);
  c.fillStyle = MAP.COLORS.textSecondary;
  c.fillText(idLabel, x, y + 20);
  c.restore();
}

// ═══════════════════════════════════════════════════
// BASEMAP
// ═══════════════════════════════════════════════════
let basemap = null;

async function loadGeo(signal) {
  basemap = await MAP.loadBasemap(MAP.basemapResFor(B, CW), { signal });
}

// ═══════════════════════════════════════════════════
// FETCH OBSERVATIONS (routine hourly METARs + 3-hr history)
// ═══════════════════════════════════════════════════
let obs = [];

const isRoutine = ts => { const m = new Date(ts).getUTCMinutes(); return m >= 45 || m <= 5; };

async function fetchStn(id, signal) {
  const base  = `https://api.weather.gov/stations/${id}/observations`;
  const start = new Date(Date.now() - HISTORY_MS).toISOString().replace(/\.\d{3}Z$/, 'Z');
  const urls  = [`${base}?start=${encodeURIComponent(start)}&limit=40`, `${base}?limit=12`];
  try {
    let features = null;
    for (const url of urls) {
      const r = await fetch(url, { headers: { 'User-Agent': 'contextclimate.io' }, signal });
      if (!r.ok) continue;
      const j = await r.json();
      if (j.features && j.features.length) { features = j.features; break; }
    }
    if (!features) return null;

    features.sort((a, b) => Date.parse(b.properties.timestamp) - Date.parse(a.properties.timestamp));
    const all  = features.map(SM.fromNws).filter(o => o.ts);
    const now  = all.find(o => isRoutine(o.ts)) || all[0];
    if (!now || now.lat == null || now.lon == null) return null;

    const hist = all.filter(o => isRoutine(o.ts));
    return Object.assign(now, { id, tend: SM.tendencyFromHistory(now, hist) });
  } catch { return null; }
}

async function loadObs(signal) {
  const results = await Promise.all(STATIONS.map(id => fetchStn(id, signal)));
  obs = results.filter(Boolean);
}

function getValidTime() {
  const times = obs.map(s => s.ts).filter(Boolean)
    .map(t => new Date(t)).filter(t => !isNaN(t));
  if (!times.length) return null;
  return new Date(Math.max(...times.map(t => t.getTime())));
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
let densityTier = 1; // 1=standard, 3=dense/all — National only.

function shownStations() {
  if (REGION_KEY !== 'conus') return obs;
  return obs.filter(s => (TIERS_CONUS[s.id] || 3) <= densityTier);
}

// Plotted vs thinned stations for the current view, recomputed per render.
let plotted = [], thinned = [];

function placeStations(c) {
  const items = [];
  for (const stn of shownStations()) {
    const [x, y] = project(stn.lon, stn.lat);
    if (x < -30 || x > CW + 30 || y < -30 || y > CH + 30) continue;
    items.push({ x, y, ob: stn, priority: priority(stn.id) });
  }
  // Models must sit fully on the canvas and stay clear of the stamp
  // (bottom-left) and the Copy Map button (top-right).
  const opts = {
    clip: { x0: 2, y0: 2, x1: CW - 2, y1: CH - 2 },
    reserved: [{ x0: 0, y0: CH - 36, x1: 360, y1: CH }, { x0: CW - 150, y0: 0, x1: CW, y1: 50 }],
  };
  if (mode === 'station') return SM.thin(c, items, opts);
  const withVal = items.filter(it => FIELD_VALUE[mode](it.ob) != null);
  return SM.thin(c, withVal, Object.assign(opts, { layoutFn: it => valueLayout(c, it.ob, mode) }));
}

function render(c = ctx) {
  c.save();
  c.beginPath();
  c.rect(0, 0, CW, CH);
  c.clip();
  MAP.renderBase(c, basemap, project, dims, B);

  const { kept, dropped } = placeStations(c);
  plotted = kept; thinned = dropped;

  for (const it of dropped) SM.drawThinned(c, it.x, it.y);
  if (mode === 'station') {
    for (const it of kept) SM.draw(c, it.x, it.y, it.ob, { lay: it.lay });
  } else {
    for (const it of kept) drawValueOnly(c, it.x, it.y, it.ob, it.lay);
  }
  MAP.drawStamp(c, getValidTime(), dims);
  c.restore();
}

// ═══════════════════════════════════════════════════
// VIEW MODE — station model / value-only tabs
// ═══════════════════════════════════════════════════
let mode = 'station';

function legendGradient(sc) {
  const vMin = sc.vals[0], vMax = sc.vals[sc.vals.length - 1];
  const span = vMax - vMin;
  const stops = sc.vals.map((v, i) => `${sc.cols[i]} ${((v - vMin) / span * 100).toFixed(1)}%`);
  return `linear-gradient(to right, ${stops.join(', ')})`;
}

const MODE_LABELS = { temp: 'Temperature', dew: 'Dewpoint', pres: 'Sea-level pressure', gust: 'Wind gusts' };
const MODE_UNITS  = { temp: '\u00B0', dew: '\u00B0', pres: ' mb', gust: ' mph' };

const WX_LEGEND = [
  ['rain', 63, 'Rain'], ['snow', 73, 'Snow'], ['mix', 69, 'Mixed'],
  ['ice', 67, 'Freezing / ice'], ['thunder', 1095, 'Thunder'], ['obscur', 45, 'Fog / mist'],
];

const CREDITS = 'Observations: NWS api.weather.gov &middot; Boundaries: U.S. Census Bureau, Natural Earth &middot; '
  + 'Weather symbols: OGC MetOcean DWG World Weather Symbols (CC BY 4.0)';

function updateLegend() {
  const legend = document.getElementById('legend');
  if (mode === 'station') {
    const wx = WX_LEGEND.map(([cls, code, label]) =>
      `<div class="lg"><span class="lg-wx" style="color:${SM.WX_COLORS[cls]}">${SM.wxChar(code)}</span>${label}</div>`).join('');
    legend.innerHTML = `
      <div class="lg-row">
        <div class="lg"><div class="lg-dot" style="background:${SM.COLORS.temp}"></div>Temperature &deg;F</div>
        <div class="lg"><div class="lg-dot" style="background:${SM.COLORS.dew}"></div>Dewpoint &deg;F</div>
        <div class="lg">SLP coded, 0.1 mb</div>
        <div class="lg">3-hr change, 0.1 mb</div>
        <div class="lg">Wind kt</div>
        <div class="lg">Visibility mi</div>
      </div>
      <div class="lg-row">${wx}</div>
      <div class="lg-credits">${CREDITS}</div>
    `;
  } else {
    const sc    = SCALES[mode];
    const label = MODE_LABELS[mode];
    const unit  = MODE_UNITS[mode];
    legend.innerHTML = `
      <div class="lg-row">
        <div class="lg lg-scale">
          <span class="lg-scale-lbl">${sc.vals[0]}${unit}</span>
          <div class="lg-gradient" style="background:${legendGradient(sc)}"></div>
          <span class="lg-scale-lbl">${sc.vals[sc.vals.length - 1]}${unit}</span>
        </div>
        <div class="lg">${label}</div>
      </div>
      <div class="lg-credits">${CREDITS}</div>
    `;
  }
}

document.querySelectorAll('#view-toggle .vt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    document.querySelectorAll('#view-toggle .vt-btn').forEach(b => b.classList.toggle('active', b === btn));
    updateLegend();
    render();
  });
});

// ═══════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════
const tip = document.getElementById('tip');
const ov  = document.getElementById('ov');

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const row = (lbl, v) => v == null || v === '' ? '' :
  `<div class="tip-row"><span class="tip-lbl">${lbl}</span><span>${v}</span></div>`;

function tipHtml(s) {
  const tF = SM.cToF(s.tempC), dF = SM.cToF(s.dewC);
  const w = s.wind;
  let wind = null;
  if (w && w.kt != null) {
    if (w.kt === 0) wind = 'Calm';
    else {
      const dir = w.dir != null ? `${String(w.dir).padStart(3, '0')}&deg;` : 'Variable';
      wind = `${dir} ${w.kt} kt${w.gust ? `, gust ${w.gust}` : ''} &middot; ${ktToMph(w.kt)} mph`;
    }
  }
  const tend = s.tend
    ? `${s.tend.ppp > 0 ? '+' : ''}${(s.tend.ppp / 10).toFixed(1)} mb &middot; ${SM.TEND_LABEL[s.tend.a]}`
    : null;
  const vis = s.visSM != null ? `${SM.formatVis(s.visSM, s.visLT)} mi` : null;
  const sky = s.sky ? SM.SKY_LABEL[s.sky] : 'Missing';
  return `
    <div class="tip-id">${s.id} &middot; ${esc(NAMES[s.id] || s.id)}</div>
    ${row('Temp', tF != null ? `${tF}&deg;F` : null)}
    ${row('Dewpoint', dF != null ? `${dF}&deg;F` : null)}
    ${row('Sea-level pressure', s.slp != null ? `${s.slp.toFixed(1)} mb` : null)}
    ${row('3-hr change', tend)}
    ${row('Wind', wind)}
    ${row('Visibility', vis)}
    ${row('Weather', s.wx.length ? esc(s.wx.join(' ')) : null)}
    ${row('Sky', sky)}
    ${s.raw ? `<div class="tip-raw">${esc(s.raw)}</div>` : ''}
  `;
}

cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CW / rect.width);
  const my = (e.clientY - rect.top)  * (CH / rect.height);

  let best = null, bestD = 18;
  for (const it of plotted.concat(thinned)) {
    const d = Math.hypot(mx - it.x, my - it.y);
    if (d < bestD) { bestD = d; best = it.ob; }
  }
  if (!best) { tip.style.display = 'none'; return; }

  tip.innerHTML = tipHtml(best);
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = e.clientX + 16, ly = e.clientY - th / 2;
  if (lx + tw > window.innerWidth - 8) lx = e.clientX - tw - 16;
  if (ly < 4) ly = 4;
  if (ly + th > window.innerHeight - 4) ly = window.innerHeight - th - 4;
  tip.style.left = lx + 'px';
  tip.style.top  = ly + 'px';
});

cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ═══════════════════════════════════════════════════
// SHARE / COPY PILL — fixed 3× export, independent of screen dpr
// ═══════════════════════════════════════════════════
const shareBtn   = document.getElementById('share-btn');
const shareLabel = document.getElementById('share-label');

function exportCanvas() {
  const off = document.createElement('canvas');
  off.width  = CW * EXPORT_SCALE;
  off.height = CH * EXPORT_SCALE;
  const oc = off.getContext('2d');
  oc.scale(EXPORT_SCALE, EXPORT_SCALE);
  render(oc);
  return off;
}

shareBtn.addEventListener('click', () => {
  exportCanvas().toBlob(async blob => {
    const file = new File([blob], 'contextclimate-surface-map.png', { type: 'image/png' });

    if (navigator.canShare?.({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: 'Surface Weather Map — contextclimate.io' });
        flash('Shared!'); return;
      } catch { /* cancelled */ }
    }

    if (navigator.clipboard?.write) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        flash('Copied!'); return;
      } catch { /* fall through */ }
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'contextclimate-surface-map.png';
    a.click();
    flash('Saved!');
  }, 'image/png');
});

function flash(msg) {
  shareLabel.textContent = msg;
  shareBtn.classList.add('copied');
  setTimeout(() => {
    shareLabel.textContent = 'Copy Map';
    shareBtn.classList.remove('copied');
  }, 2200);
}

// ═══════════════════════════════════════════════════
// STATUS
// ═══════════════════════════════════════════════════
const setStatus = msg => { document.getElementById('stext').textContent = msg; };

function statusLine(prefix) {
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const thin = thinned.length ? ` · ${thinned.length} thinned` : '';
  return `${prefix}${plotted.length} plotted${thin} · ${t}`;
}

// ═══════════════════════════════════════════════════
// REGION LOADING + SWITCHING
// ═══════════════════════════════════════════════════
// Each call gets its own AbortController; starting a new one cancels
// whatever the previous call still had in flight.
let currentAbort = null;

async function loadRegion(key) {
  if (currentAbort) currentAbort.abort();
  const abort = new AbortController();
  currentAbort = abort;

  REGION_KEY = key;
  REGION     = MAP_REGIONS[key];
  B          = REGION.bounds;
  dims       = MAP.computeDims(B, CW);
  CH         = dims.CH;
  STATIONS   = REGION_DATA[key].stations;
  NAMES      = REGION_DATA[key].names;

  document.getElementById('page-sub').textContent = REGION_DATA[key].sub;
  document.getElementById('density-toggle').style.display = (key === 'conus') ? '' : 'none';
  document.title = REGION_DATA[key].docTitle;
  applyCanvasSize();

  ov.style.display = 'flex';
  ov.textContent = 'Loading map boundaries…';
  setStatus('Loading map boundaries…');

  try {
    await Promise.all([loadGeo(abort.signal), SM.ready()]);
    if (abort.signal.aborted) return;

    obs = [];
    render();

    ov.textContent = 'Fetching observations…';
    setStatus('Fetching station observations…');
    await loadObs(abort.signal);
    if (abort.signal.aborted) return;

    render();
    ov.style.display = 'none';
    setStatus(statusLine(`${obs.length} of ${STATIONS.length} stations loaded · `));
  } catch (err) {
    if (abort.signal.aborted) return;
    console.error('Failed to load region', key, err);
    ov.textContent = 'Could not load map data — check your connection and try again.';
    setStatus('Load failed — see browser console for details');
  }
}

document.querySelectorAll('#region-toggle .vt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.region === REGION_KEY) return;
    document.querySelectorAll('#region-toggle .vt-btn').forEach(b => b.classList.toggle('active', b === btn));
    loadRegion(btn.dataset.region);
  });
});

document.querySelectorAll('#density-toggle .vt-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tier = Number(btn.dataset.density);
    if (tier === densityTier) return;
    densityTier = tier;
    document.querySelectorAll('#density-toggle .vt-btn').forEach(b => b.classList.toggle('active', b === btn));
    render();
    setStatus(statusLine(''));
  });
});

async function refresh() {
  await loadObs();
  render();
  setStatus(statusLine('Refreshed · '));
}

updateLegend();
loadRegion(REGION_KEY);
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
