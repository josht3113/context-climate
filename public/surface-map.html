<!DOCTYPE html>

<title>Surface Weather Map</title>

<!-- Station-plot content font (condensed numerals keep station models compact) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root {
  --tool-accent: var(--accent-live);
  --click-text: #F2EEE3;
}
[hidden] { display: none !important; }
body { padding: 28px 20px 48px; }
.wrap { max-width: 1240px; margin: 0 auto; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.head .cc-title { margin: 4px 0 0; }

.status { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tool-accent); box-shadow: 0 0 0 3px rgba(42,168,126,0.18); }
.status.err .dot { background: #E5534B; box-shadow: 0 0 0 3px rgba(229,83,75,0.18); }

.bar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
.bar .grp { display: flex; align-items: center; gap: 8px; }
.bar .spacer { flex: 1; }
.cc-tab { font-size: 16px; color: var(--color-text-secondary); padding: 8px 18px; }
.cc-tab.is-active { color: var(--click-text); }
.cc-segmented-btn { font-size: 13px; padding: 8px 16px; }
.cc-segmented-btn.is-active { color: var(--click-text); }
.cc-btn { font-size: 15px; }
.cc-btn.dl { color: var(--click-text); }
.cc-btn:disabled { opacity: .4; cursor: default; }

.map-frame { position: relative; max-width: 1202px; margin: 0 auto; background: #d6e0e7; overflow: hidden; }
#cv { display: block; width: 100%; height: auto; cursor: crosshair; }
.ov {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(30,35,32,0.55); color: var(--color-text-primary);
  font-family: var(--font-mono); font-size: 14px; letter-spacing: 0.06em; pointer-events: none;
}

.legend { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cc-legend-chip { font-size: 13px; }
.lg-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.lg-wx { font-family: 'CCWxSymbols'; font-size: 20px; line-height: 1; width: 18px; text-align: center; }
.lg-gradient { width: 220px; height: 12px; border-radius: 3px; border: 1px solid var(--color-border); }
.lg-credits { font-size: 12px; color: var(--color-text-muted); text-align: center; line-height: 1.5; }

#tip {
  position: fixed; display: none; pointer-events: none; z-index: 200;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg);
  padding: 12px 14px; min-width: 230px; max-width: 390px; font-size: 14px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.45);
}
#tip .tip-id { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--color-text-primary); margin-bottom: 6px; }
#tip .tip-id span { font-family: var(--font-mono); font-weight: 400; font-size: 13px; color: var(--tool-accent); margin-right: 6px; }
#tip .tip-row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.7; color: var(--color-text-primary); }
#tip .tip-lbl { color: var(--color-text-muted); white-space: nowrap; }
#tip .tip-row span:last-child { text-align: right; }
#tip .tip-raw {
  margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border);
  font-family: var(--font-mono); font-size: 12px; line-height: 1.45; color: var(--color-text-secondary); word-break: break-word;
}
#tip .tip-note { margin-top: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }

</head>

  return REGION_KEY === 'conus' ? (TIERS_CONUS[id] || 3) : (TIERS_TRISTATE[id] || 3);
}

// ═══════════════════════════════════════════════════
// CANVAS + PROJECTION
// ═══════════════════════════════════════════════════
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dpr = window.devicePixelRatio || 1;
let project;

function applyCanvasSize() {
  cv.width  = CW * dpr;
  cv.height = CH * dpr;
  cv.style.aspectRatio = `${CW} / ${CH}`;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  project = MAP.makeProjection(B, dims);
}
applyCanvasSize();

const ktToMph = k => k != null ? Math.round(k * 1.15078) : null;

// ═══════════════════════════════════════════════════
// COLOR SCALES — ported 1:1 from temp-heatmap-monthly.html
// so a given temp/dewpoint always maps to the same color
// across every ContextClimate tool.
// ═══════════════════════════════════════════════════
const SCALES = {
  temp: { vals: [-60,-48,-36,-24,-13,-1,11,23,35,47,59,71,83,94,106,118,130],
          cols: ['#2A0440','#5A108B','#8B19B2','#C21E81','#EA6A9B','#F3B8CC','#D1C4DC','#AFD1ED','#8ACCBA','#67C27C','#93CA58','#DFDA3E','#F4AE2D','#E25922','#E32F2F','#FFD7D7','#FFC4D3'] },
  dew:  { vals: [-25, 5, 18, 30, 55, 68, 80],   cols: ['#4A3410','#B89870','#D4C060','#FFEE00','#3DB84A','#2A8C30','#2A72C8'] },
  pres: { vals: [985, 1010, 1035],
          cols: ['#9E1B1B','#BFBFBF','#1B4399'] },
  gust: { vals: [10, 25, 40, 58, 75, 100],
          cols: ['#6AABEE','#5DBF6A','#FFE033','#FF9933','#D41A1A','#8B19B2'] },
};

function h2r(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function lrp(a, b, t) { return Math.round(a + (b - a) * t); }

function getColor(val, sc) {
  if (val == null) return '#888';
  const { vals: vs, cols: cs } = sc;
  if (val <= vs[0]) return cs[0];
  if (val >= vs[vs.length - 1]) return cs[cs.length - 1];
  for (let i = 0; i < vs.length - 1; i++) {
    if (val >= vs[i] && val <= vs[i + 1]) {
      const t = (val - vs[i]) / (vs[i + 1] - vs[i]);
      const a = h2r(cs[i]), b = h2r(cs[i + 1]);
      return `rgb(${lrp(a[0],b[0],t)},${lrp(a[1],b[1],t)},${lrp(a[2],b[2],t)})`;
    }
  }
  return cs[cs.length - 1];
}

// Pressure is true sea-level pressure only, same as the station model.
const FIELD_VALUE = {
  temp: s => SM.cToF(s.tempC),
  dew:  s => SM.cToF(s.dewC),
  pres: s => s.slp != null ? Math.round(s.slp) : null,
  gust: s => (s.wind && s.wind.gust != null) ? ktToMph(s.wind.gust) : null,
};
const FIELD_SUFFIX = { temp: '\u00B0', dew: '\u00B0', pres: '', gust: '' };

// ═══════════════════════════════════════════════════
// VALUE-ONLY MARKERS (Temperature / Dewpoint / SLP / Gust tabs)
// ═══════════════════════════════════════════════════
const VALUE_FONT    = '600 30px "Barlow Condensed"';
const VALUE_ID_FONT = '600 13px "Barlow Condensed"';

function valueLayout(c, stn, field) {
  const raw = FIELD_VALUE[field](stn);
  if (raw == null) return null;
  const label = `${raw}${FIELD_SUFFIX[field]}`;
  c.font = VALUE_FONT;
  const w = c.measureText(label).width;
  return { raw, label, color: getColor(raw, SCALES[field]),
           box: { x0: -w / 2 - 2, x1: w / 2 + 2, y0: -16, y1: 28 } };
}

function drawValueOnly(c, x, y, stn, lay) {
  c.save();
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.lineJoin = 'round';
  c.font = VALUE_FONT;
  c.lineWidth = 4;
  c.strokeStyle = 'rgba(8,12,20,0.82)';
  c.strokeText(lay.label, x, y);
  c.fillStyle = lay.color;
  c.fillText(lay.label, x, y);

  const idLabel = stn.id.length === 4 && stn.id[0] === 'K' ? stn.id.slice(1) : stn.id;
  c.font = VALUE_ID_FONT;
  c.lineWidth = 3;
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.strokeText(idLabel, x, y + 21);
  c.fillStyle = MAP.COLORS.textSecondary;
  c.fillText(idLabel, x, y + 21);
  c.restore();
}

// ═══════════════════════════════════════════════════
// BASEMAP
// ═══════════════════════════════════════════════════
let basemap = null;

async function loadGeo(signal) {
  basemap = await MAP.loadBasemap(MAP.basemapResFor(B, CW), { signal });
}

// ═══════════════════════════════════════════════════
// OBSERVATIONS
// Primary: IEM, one request for every station's routine METARs over the
// last 4.5 h (full remarks → true SLP, 3-hr tendency group, T-group).
// Fallback: NWS api.weather.gov, per station, for anything IEM didn't return.
// ═══════════════════════════════════════════════════
let obs = [];
let obsSource = '';

const sleep = ms => new Promise(r => setTimeout(r, ms));

// 5xx / 408 / 425 / 429 and network errors are transient: retry with backoff
// (1.2 s, 2.4 s, 4.8 s). Other 4xx are real errors and fail immediately.
async function fetchWithRetry(url, opts = {}, retries = 3) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    if (attempt) await sleep(1200 * Math.pow(2, attempt - 1));
    if (opts.signal && opts.signal.aborted) throw new DOMException('Aborted', 'AbortError');
    let r;
    try { r = await fetch(url, opts); }
    catch (e) { if (opts.signal && opts.signal.aborted) throw e; lastErr = e; continue; }
    if (r.ok) return r;
    lastErr = new Error(`HTTP ${r.status}`);
    if (!(r.status >= 500 || [408, 425, 429].includes(r.status))) throw lastErr;
  }
  throw lastErr;
}

function iemUrl(ids) {
  const now = new Date(), start = new Date(now.getTime() - HISTORY_MS), end = new Date(now.getTime() + 10 * 60e3);
  const p = (t, d) => `year${t}=${d.getUTCFullYear()}&month${t}=${d.getUTCMonth() + 1}&day${t}=${d.getUTCDate()}`
                    + `&hour${t}=${d.getUTCHours()}&minute${t}=${d.getUTCMinutes()}`;
  return 'https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?'
    + ids.map(id => `station=${id}`).join('&')
    + `&data=metar&${p('1', start)}&${p('2', end)}`
    + '&tz=UTC&format=onlycomma&latlon=yes&missing=empty&trace=T&direct=no&report_type=3';
}

// CSV → Map(stationKey → [{ts, lon, lat, metar}]) sorted newest first.
function parseIEM(text) {
  const out = new Map();
  let head = null;
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t || t[0] === '#') continue;
    const parts = t.split(',');
    if (!head || parts[0] === 'station') { head = parts; continue; }
    const get = k => { const i = head.indexOf(k); return i < 0 ? '' : (parts[i] || '').trim(); };
    const valid = get('valid'), metar = get('metar');
    const lon = parseFloat(get('lon')), lat = parseFloat(get('lat'));
    if (!valid || !metar || isNaN(lon) || isNaN(lat)) continue;
    const ts = new Date(valid.replace(' ', 'T') + ':00Z');
    if (isNaN(ts)) continue;
    const key = get('station');
    if (!out.has(key)) out.set(key, []);
    out.get(key).push({ ts: ts.toISOString(), lon, lat, metar });
  }
  for (const rows of out.values()) rows.sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts));
  return out;
}

function obFromHistory(id, list) {
  const now = list[0];
  if (!now || now.lat == null || Date.now() - Date.parse(now.ts) > STALE_MS) return null;
  return Object.assign(now, { id, tend: SM.tendencyFromHistory(now, list) });
}

async function loadIEM(ids, signal) {
  const r = await fetchWithRetry(iemUrl(ids), { signal });
  const rows = parseIEM(await r.text());
  const got = new Map();
  for (const id of ids) {
    const key3 = id.length === 4 && id[0] === 'K' ? id.slice(1) : id;
    const list = rows.get(id) || rows.get(key3);
    if (!list) continue;
    const ob = obFromHistory(id, list.map(o => SM.fromMetar(o.metar, o)));
    if (ob) got.set(id, ob);
  }
  return got;
}

const isRoutine = ts => { const m = new Date(ts).getUTCMinutes(); return m >= 45 || m <= 5; };

async function fetchNws(id, signal) {
  const base  = `https://api.weather.gov/stations/${id}/observations`;
  const start = new Date(Date.now() - HISTORY_MS).toISOString().replace(/\.\d{3}Z$/, 'Z');
  try {
    let features = null;
    for (const url of [`${base}?start=${encodeURIComponent(start)}&limit=40`, `${base}?limit=12`]) {
      const r = await fetch(url, { signal });
      if (!r.ok) continue;
      const j = await r.json();
      if (j.features && j.features.length) { features = j.features; break; }
    }
    if (!features) return null;
    const all = features.map(SM.fromNws).filter(o => o.ts && isRoutine(o.ts))
      .sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts));
    return obFromHistory(id, all);
  } catch { return null; }
}

async function loadObs(signal) {
  let got = new Map();
  let iemOk = false;
  try {
    got = await loadIEM(STATIONS, signal);
    iemOk = true;
  } catch (e) {
    if (signal && signal.aborted) throw e;
    console.warn('[surface-map] IEM request failed, falling back to NWS:', e.message || e);
  }
  const missing = STATIONS.filter(id => !got.has(id));
  if (missing.length && (!iemOk || missing.length <= 25)) {
    const res = await Promise.all(missing.map(id => fetchNws(id, signal)));
    res.forEach((ob, i) => { if (ob) got.set(missing[i], ob); });
  }
  obsSource = iemOk ? 'IEM' : 'NWS';
  obs = STATIONS.map(id => got.get(id)).filter(Boolean);
}

function getValidTime() {
  const times = obs.map(s => Date.parse(s.ts)).filter(t => !isNaN(t));
  return times.length ? new Date(Math.max(...times)) : null;
}

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
let plotted = [], thinned = [];

function placeStations(c) {
  const items = [];
  for (const stn of obs) {
    const [x, y] = project(stn.lon, stn.lat);
    if (x < -30 || x > CW + 30 || y < -30 || y > CH + 30) continue;
    items.push({ x, y, ob: stn, priority: priority(stn.id) });
  }
  // Models must sit fully on the canvas and stay clear of the stamp.
  const opts = {
    clip: { x0: 2, y0: 2, x1: CW - 2, y1: CH - 2 },
    reserved: [{ x0: 0, y0: CH - 36, x1: 330, y1: CH }],
  };
  if (mode === 'station') return SM.thin(c, items, opts);
  const withVal = items.filter(it => FIELD_VALUE[mode](it.ob) != null);
  return SM.thin(c, withVal, Object.assign(opts, { layoutFn: it => valueLayout(c, it.ob, mode) }));
}

function render(c = ctx) {
  c.save();
  c.beginPath();
  c.rect(0, 0, CW, CH);
  c.clip();
  MAP.renderBase(c, basemap, project, dims, B);

  const { kept, dropped } = placeStations(c);
  plotted = kept; thinned = dropped;

  for (const it of dropped) SM.drawThinned(c, it.x, it.y);
  if (mode === 'station') {
    for (const it of kept) SM.draw(c, it.x, it.y, it.ob, { lay: it.lay });
  } else {
    for (const it of kept) drawValueOnly(c, it.x, it.y, it.ob, it.lay);
  }
  MAP.drawStamp(c, getValidTime(), dims);
  c.restore();
}

// ═══════════════════════════════════════════════════
// VIEW MODE + LEGEND
// ═══════════════════════════════════════════════════
let mode = 'station';

const MODE_LABELS = { station: 'Station model', temp: 'Temperature', dew: 'Dewpoint', pres: 'Sea-level pressure', gust: 'Wind gusts' };
const MODE_UNITS  = { temp: '\u00B0F', dew: '\u00B0F', pres: ' mb', gust: ' mph' };

const WX_LEGEND = [
  ['rain', 63, 'Rain'], ['snow', 73, 'Snow'], ['mix', 69, 'Mixed'],
  ['ice', 67, 'Freezing / ice'], ['thunder', 1095, 'Thunder'], ['obscur', 45, 'Fog / mist'],
];

const STATION_KEYS = [
  { color: SM.COLORS.temp, label: 'Temperature °F' },
  { color: SM.COLORS.dew,  label: 'Dewpoint °F' },
  { label: 'SLP coded, 0.1 mb' },
  { label: '3-hr change, 0.1 mb' },
  { label: 'Wind kt' },
  { label: 'Visibility mi' },
];

function creditsText() {
  const land = basemap && basemap.res === 'regional' ? 'Coastline © OpenStreetMap contributors' : 'Coastline: Natural Earth';
  return `Observations: Iowa Environmental Mesonet (IEM), NWS · ${land} · State lines: U.S. Census Bureau · `
       + 'Weather symbols: OGC MetOcean DWG World Weather Symbols (CC BY 4.0)';
}

function legendGradient(sc) {
  const vMin = sc.vals[0], vMax = sc.vals[sc.vals.length - 1];
  const stops = sc.vals.map((v, i) => `${sc.cols[i]} ${((v - vMin) / (vMax - vMin) * 100).toFixed(1)}%`);
  return `linear-gradient(to right, ${stops.join(', ')})`;
}

function updateLegend() {
  const legend = document.getElementById('legend');
  let rows;
  if (mode === 'station') {
    const keys = STATION_KEYS.map(k =>
      `<div class="cc-legend-chip">${k.color ? `<span class="lg-swatch" style="background:${k.color}"></span>` : ''}${k.label}</div>`).join('');
    const wx = WX_LEGEND.map(([cls, code, label]) =>
      `<div class="cc-legend-chip"><span class="lg-wx" style="color:${SM.WX_COLORS[cls]}">${SM.wxChar(code)}</span>${label}</div>`).join('');
    rows = `<div class="cc-legend-row">${keys}</div><div class="cc-legend-row">${wx}</div>`;
  } else {
    const sc = SCALES[mode], unit = MODE_UNITS[mode];
    rows = `<div class="cc-legend-row">
      <div class="cc-legend-chip">${sc.vals[0]}${unit}
        <span class="lg-gradient" style="background:${legendGradient(sc)}"></span>
        ${sc.vals[sc.vals.length - 1]}${unit}</div>
      <div class="cc-legend-chip">${MODE_LABELS[mode]}</div>
    </div>`;
  }
  legend.innerHTML = rows + `<div class="lg-credits">${creditsText()}</div>`;
}

document.querySelectorAll('#view-tabs .cc-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    document.querySelectorAll('#view-tabs .cc-tab').forEach(b => b.classList.toggle('is-active', b === btn));
    updateLegend();
    render();
    setStatus(statusLine());
  });
});

// ═══════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════
const tip = document.getElementById('tip');
const ov  = document.getElementById('ov');

const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const row = (lbl, v) => v == null || v === '' ? '' :
  `<div class="tip-row"><span class="tip-lbl">${lbl}</span><span>${v}</span></div>`;

function tipHtml(s, isThinned) {
  const tF = SM.cToF(s.tempC), dF = SM.cToF(s.dewC);
  const w = s.wind;
  let wind = null;
  if (w && w.kt != null) {
    if (w.kt === 0) wind = 'Calm';
    else {
      const dir = w.dir != null ? `${String(w.dir).padStart(3, '0')}&deg;` : 'Variable';
      wind = `${dir} ${w.kt} kt${w.gust ? `, gust ${w.gust}` : ''} &middot; ${ktToMph(w.kt)} mph`;
    }
  }
  const tend = s.tend
    ? `${s.tend.ppp > 0 ? '+' : ''}${(s.tend.ppp / 10).toFixed(1)} mb &middot; ${SM.TEND_LABEL[s.tend.a]}`
    : null;
  const t = new Date(s.ts);
  const obTime = `${String(t.getUTCHours()).padStart(2, '0')}${String(t.getUTCMinutes()).padStart(2, '0')}Z`;
  return `
    <div class="tip-id"><span>${s.id}</span>${esc(NAMES[s.id] || s.id)}</div>
    ${row('Observed', obTime)}
    ${row('Temperature', tF != null ? `${tF}&deg;F` : null)}
    ${row('Dewpoint', dF != null ? `${dF}&deg;F` : null)}
    ${row('Sea-level pressure', s.slp != null ? `${s.slp.toFixed(1)} mb` : null)}
    ${row('3-hr change', tend)}
    ${row('Wind', wind)}
    ${row('Visibility', s.visSM != null ? `${SM.formatVis(s.visSM, s.visLT)} mi` : null)}
    ${row('Weather', s.wx.length ? esc(s.wx.join(' ')) : null)}
    ${row('Sky', s.sky ? SM.SKY_LABEL[s.sky] : 'Missing')}
    ${s.raw ? `<div class="tip-raw">${esc(s.raw)}</div>` : ''}
    ${isThinned ? '<div class="tip-note">Not plotted: no room at this map scale</div>' : ''}
  `;
}

cv.addEventListener('mousemove', e => {
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CW / rect.width);
  const my = (e.clientY - rect.top)  * (CH / rect.height);

  let best = null, bestD = 18, bestThin = false;
  for (const [list, thin] of [[plotted, false], [thinned, true]]) {
    for (const it of list) {
      const d = Math.hypot(mx - it.x, my - it.y);
      if (d < bestD) { bestD = d; best = it.ob; bestThin = thin; }
    }
  }
  if (!best) { tip.style.display = 'none'; return; }

  tip.innerHTML = tipHtml(best, bestThin);
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = e.clientX + 16, ly = e.clientY - th / 2;
  if (lx + tw > window.innerWidth - 8) lx = e.clientX - tw - 16;
  if (ly < 4) ly = 4;
  if (ly + th > window.innerHeight - 4) ly = window.innerHeight - th - 4;
  tip.style.left = lx + 'px';
  tip.style.top  = ly + 'px';
});
cv.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ═══════════════════════════════════════════════════
// PNG EXPORT — composed image at a fixed 3× scale
// ═══════════════════════════════════════════════════
const EXP = { pad: 28, head: 110, legend: 64, foot: 44 };

function fmtValid(d) {
  if (!d) return '';
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
  return `Valid ${String(d.getUTCHours()).padStart(2, '0')}${String(d.getUTCMinutes()).padStart(2, '0')}Z `
       + `${d.getUTCDate()} ${mo} ${d.getUTCFullYear()}`;
}

function drawLegendStrip(c, x, y, w) {
  c.save();
  c.textBaseline = 'middle';
  const items = [];
  if (mode === 'station') {
    for (const k of STATION_KEYS) items.push({ swatch: k.color, text: k.label });
    for (const [cls, code, label] of WX_LEGEND) items.push({ glyph: SM.wxChar(code), color: SM.WX_COLORS[cls], text: label });
  } else {
    items.push({ gradient: SCALES[mode], text: `${MODE_LABELS[mode]}, ${SCALES[mode].vals[0]}–${SCALES[mode].vals.at(-1)}${MODE_UNITS[mode]}` });
  }
  c.font = '13px "Courier Prime"';
  const widths = items.map(it => (it.gradient ? 150 : 20) + c.measureText(it.text).width + 22);
  // Two rows at most; wrap when the running width passes the strip width.
  let cx = x, cy = y + 14;
  const rowStart = [];
  items.forEach((it, i) => {
    if (cx + widths[i] > x + w) { cx = x; cy += 26; }
    rowStart.push([cx, cy]); cx += widths[i];
  });
  items.forEach((it, i) => {
    let [ix, iy] = rowStart[i];
    if (it.swatch) { c.fillStyle = it.swatch; c.fillRect(ix, iy - 5, 10, 10); ix += 16; }
    else if (it.glyph) { c.font = `18px ${'CCWxSymbols'}`; c.fillStyle = it.color; c.fillText(it.glyph, ix - 2, iy + 1); ix += 20; }
    else if (it.gradient) {
      const g = c.createLinearGradient(ix, 0, ix + 140, 0);
      const sc = it.gradient, v0 = sc.vals[0], v1 = sc.vals.at(-1);
      sc.vals.forEach((v, k) => g.addColorStop((v - v0) / (v1 - v0), sc.cols[k]));
      c.fillStyle = g; c.fillRect(ix, iy - 6, 140, 12); ix += 150;
    }
    c.font = '13px "Courier Prime"';
    c.fillStyle = '#A6A499';
    c.fillText(it.text, ix, iy);
  });
  c.restore();
}

function exportCanvas() {
  const W = CW + EXP.pad * 2;
  const H = EXP.head + CH + EXP.legend + EXP.foot;
  const off = document.createElement('canvas');
  off.width = W * EXPORT_SCALE; off.height = H * EXPORT_SCALE;
  const c = off.getContext('2d');
  c.scale(EXPORT_SCALE, EXPORT_SCALE);

  c.fillStyle = '#1E2320'; c.fillRect(0, 0, W, H);

  // Header: section mark, title, context line
  c.textBaseline = 'alphabetic';
  c.font = '700 14px "Courier Prime"'; c.fillStyle = '#2AA87E';
  c.fillText('[ contextclimate ]  LIVE', EXP.pad, 34);
  c.font = '700 30px "Zilla Slab"'; c.fillStyle = '#E8E4D9';
  c.fillText(`Surface Weather Map — ${MAP_REGIONS[REGION_KEY].label}`, EXP.pad, 68);
  c.font = '14px "Public Sans"'; c.fillStyle = '#A6A499';
  c.fillText(`${MODE_LABELS[mode]} · ${fmtValid(getValidTime())} · ASOS / AWOS routine observations`, EXP.pad, 88);

  // Map, rendered directly at export scale
  c.save();
  c.translate(EXP.pad, EXP.head);
  render(c);
  c.strokeStyle = 'rgba(232,228,217,0.26)'; c.lineWidth = 1; c.strokeRect(0.5, 0.5, CW - 1, CH - 1);
  c.restore();

  drawLegendStrip(c, EXP.pad, EXP.head + CH + 10, CW);

  c.font = '12px "Public Sans"'; c.fillStyle = '#948F82';
  c.textBaseline = 'alphabetic';
  c.fillText(creditsText().replace(/&middot;/g, '·'), EXP.pad, H - 18);
  return off;
}

document.getElementById('btn-png').addEventListener('click', () => {
  const off = exportCanvas();
  render(); // restore on-screen hit-test state
  const d = getValidTime();
  const stamp = d ? d.toISOString().slice(0, 13).replace(/[-T]/g, '') + 'Z' : 'latest';
  const a = document.createElement('a');
  a.download = `surface-map_${REGION_KEY}_${mode}_${stamp}.png`;
  a.href = off.toDataURL('image/png');
  a.click();
});

// ═══════════════════════════════════════════════════
// STATUS
// ═══════════════════════════════════════════════════
const statusEl = document.getElementById('status');
function setStatus(msg, isErr = false) {
  document.getElementById('stext').textContent = msg;
  statusEl.classList.toggle('err', isErr);
}

function statusLine() {
  const d = getValidTime();
  const valid = d ? fmtValid(d) : 'no data';
  const thin = thinned.length ? ` · ${thinned.length} not plotted` : '';
  return `${valid} · ${plotted.length} plotted${thin} · ${obsSource}`;
}

// ═══════════════════════════════════════════════════
// REGION LOADING + SWITCHING
// ═══════════════════════════════════════════════════
let currentAbort = null;

async function loadRegion(key) {
  if (currentAbort) currentAbort.abort();
  const abort = new AbortController();
  currentAbort = abort;

  REGION_KEY = key;
  REGION     = MAP_REGIONS[key];
  B          = REGION.bounds;
  dims       = MAP.computeDims(B, CW);
  CH         = dims.CH;
  STATIONS   = REGION_DATA[key].stations;
  NAMES      = REGION_DATA[key].names;

  document.getElementById('eyebrow').textContent = REGION_DATA[key].eyebrow;
  document.title = REGION_DATA[key].docTitle;
  document.getElementById('btn-png').disabled = true;
  applyCanvasSize();

  ov.style.display = 'flex';
  ov.textContent = 'Loading map…';
  setStatus('Loading map…');

  try {
    await Promise.all([loadGeo(abort.signal), SM.ready()]);
    if (abort.signal.aborted) return;
    obs = [];
    render();
    updateLegend();

    ov.textContent = 'Fetching observations…';
    setStatus('Fetching observations…');
    await loadObs(abort.signal);
    if (abort.signal.aborted) return;

    render();
    ov.style.display = 'none';
    document.getElementById('btn-png').disabled = false;
    setStatus(statusLine(), obs.length === 0);
  } catch (err) {
    if (abort.signal.aborted) return;
    console.error('Failed to load region', key, err);
    ov.textContent = 'Could not load map data — check your connection and try again.';
    setStatus('Load failed — see browser console for details', true);
  }
}

document.querySelectorAll('#region-seg .cc-segmented-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.region === REGION_KEY) return;
    document.querySelectorAll('#region-seg .cc-segmented-btn').forEach(b => b.classList.toggle('is-active', b === btn));
    loadRegion(btn.dataset.region);
  });
});

async function refresh() {
  try {
    await loadObs();
    render();
    setStatus(statusLine(), obs.length === 0);
  } catch (e) {
    console.warn('[surface-map] refresh failed', e);
  }
}

updateLegend();
loadRegion(REGION_KEY);
setInterval(refresh, REFRESH_MS);

</script>
