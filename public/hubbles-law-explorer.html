<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubble's Law Explorer</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="spectra-core.js"></script>
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; white-space: nowrap; }
.top .spacer { flex: 1; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #0F1311; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* control bar */
.controls { display: grid; column-gap: 10px; padding: 8px 10px; border-top: 1px solid var(--color-border); background: var(--color-surface); }
.controls canvas { display: block; width: 100%; touch-action: none; }
.c1 { grid-template-columns: 132px minmax(0, 1fr); align-items: stretch; }
.c2 { grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: auto 30px; }
.c3 { grid-template-columns: 132px minmax(0, 1fr) 124px; }
.c4 { grid-template-columns: 96px minmax(0, 1fr) auto; grid-template-rows: auto 40px; padding-bottom: 4px; }
.col { display: flex; flex-direction: column; gap: 6px; }
.act { font-size: 14px; font-weight: 700; padding: 8px 10px; flex: 1; }
.act.sm { flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 4px 10px; }
#vline { height: 64px; cursor: pointer; }

.play { grid-row: 1 / 3; grid-column: 1; align-self: stretch; font-size: 16px; font-weight: 700;
  background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 22px; }
.c4 .play { margin-bottom: 4px; }

.snaps { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 5px; min-width: 0; }
.c2 .snaps, .c4 .snaps { grid-column: 2; grid-row: 1; }
.snap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px;
  padding: 5px 2px; min-width: 0; white-space: normal; }
.snap .n { font-family: var(--font-body); font-weight: 600; font-size: 13px; line-height: 1.12; color: var(--color-text-primary); text-align: center; }
.snap .v { font-family: var(--font-mono); font-weight: 700; font-size: 13px; line-height: 1; color: var(--color-text-secondary); white-space: nowrap; }
.snap .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
.snap:disabled { opacity: .45; cursor: default; }
.snap.pulse:not(:disabled):not(.is-active) { animation: cc-pulse 1.6s ease-in-out infinite; border-color: var(--tool-accent); }
@keyframes cc-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } 50% { box-shadow: 0 0 0 5px rgba(60,163,174,0.32); } }
@media (prefers-reduced-motion: reduce) { .snap.pulse { animation: none; } }
.tgl.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.tgl.is-active .n, .tgl.is-active .v { color: var(--color-bg); }

.scrub { grid-column: 2; grid-row: 2; display: flex; align-items: center; gap: 10px; }
.scrub input { flex: 1; accent-color: var(--tool-accent); }
.scrub span { font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--color-text-secondary); min-width: 64px; text-align: right; }
#tstrip { grid-column: 2; grid-row: 2; height: 40px; cursor: pointer; }
.mode { grid-column: 3; grid-row: 1 / 3; flex-direction: column; align-self: stretch; margin-bottom: 4px; }
.mode .cc-segmented-btn { flex: 1; padding: 6px 14px; font-size: 13px; font-weight: 600; border-right: none; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.mode .cc-segmented-btn:last-child { border-bottom: none; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .sub { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--color-text-secondary); margin-top: 1px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 5px 0 4px; }
  .card .v { font-size: 23px; }
}
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 16px; } }
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 262px; }
  .x-link .nm { display: none; }
  .tabs .cc-segmented-btn { padding: 11px 12px; }
  .card { padding: 10px 13px; }
  .card .v { font-size: 22px; }
  .card .v .u { font-size: 14px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 248px; }
  .top { gap: 12px; }
  .c2, .c4 { grid-template-columns: 84px minmax(0, 1fr) auto; column-gap: 8px; }
  .c2 { grid-template-columns: 84px minmax(0, 1fr); }
  .snaps { gap: 4px; }
  .mode .cc-segmented-btn { padding: 6px 9px; }
  .exp .cc-btn { padding: 6px 9px; }
  .tabs .cc-segmented-btn { padding: 11px 10px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Hubble's Law Explorer</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-step="1">Velocity</button>
      <button class="cc-segmented-btn" data-step="2">Distance</button>
      <button class="cc-segmented-btn" data-step="3">Hubble Diagram</button>
      <button class="cc-segmented-btn" data-step="4">Expansion</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <a class="cc-btn x-link" id="nextLink" target="_top" href="#"><span class="nm" id="nextName">Spectral Analysis</span> &rarr;</a>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage"><canvas id="cv"></canvas></div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
