<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precession</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 16px; }
.tabs .cc-segmented-btn .n { opacity: .65; margin-right: 6px; }
.top .spacer { flex: 1; }
.series { display: flex; gap: 6px; }
.x-link { padding: 6px 11px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 54px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.snap { padding: 7px 11px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .03em; color: var(--color-text-secondary); }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.go { min-width: 92px; padding: 9px 14px; font-size: 15px; white-space: nowrap; }
.slider { flex: 1; display: flex; align-items: center; gap: 9px; min-width: 140px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 92px; text-align: right; white-space: nowrap; }
.chips { position: absolute; display: none; gap: 6px; top: 12px; right: 12px; }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; }
.tgl.is-active { border-color: var(--chip-col, var(--tool-accent)); color: var(--color-text-primary); }
.tgl::before { content: ''; display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--chip-col, var(--color-text-muted));
  border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--chip-col, var(--tool-accent)); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.dim .v { font-size: 20px; color: var(--color-text-secondary); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 640px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .r.dim .v { font-size: 18px; }
}
@media (max-width: 1440px) {
  .top .sub { display: none; }
  .tabs .cc-segmented-btn { padding: 11px 12px; }
}
@media (max-width: 1280px) {
  .tabs .cc-segmented-btn { padding: 11px 11px; }
  .x-link .nm { display: none; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 250px; }
  .tabs .cc-segmented-btn .lb { display: none; }
  .snap { padding: 7px 8px; font-size: 13px; }
  .slider .sv { display: none; }
  .slider { min-width: 90px; }
  .controls { gap: 6px; }
  .go { min-width: 0; padding: 9px 12px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title" id="ttl"></h1><span class="sub" id="sub"></span></div>
    <div class="cc-segmented tabs" id="tabs"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="series" id="series"></div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chips"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
<script src="milankovitch.js"></script>
<script src="coastlines-110m.js"></script>

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════
   MILANKOVITCH SERIES — shared shell (contextclimate.io)
   Each tool defines TOOL = { title, sub, slug, prev, next, steps[] }.
   A step owns one value v (a parameter or an age), a row of snaps, a
   slider, and draw / card / stamp functions. Play tweens v to the next
   snap and stops there.
   ════════════════════════════════════════════════════════════════ */
const M = window.MILANKOVITCH, LAND = window.COASTLINES || [];
const D2R = Math.PI / 180, R2D = 180 / Math.PI, TAU = Math.PI * 2;

const FM = "'Courier Prime', monospace", FB = "'Public Sans', sans-serif", FD = "'Zilla Slab', serif";
const P = M.PALETTE;
const C = { stage: '#151A17', panel: '#1F2421', text: '#E8E4D9', sec: '#A6A499', muted: '#948F82',
  grid: 'rgba(232,228,217,0.07)', axis: 'rgba(232,228,217,0.30)',
  tilt: P.obliquity, prec: P.precession, ecc: P.eccentricity, ins: P.insolation, snow: '#C0D7FC', melt: '#FFB347',
  sun: '#FFCF6B', peri: '#FFCF6B', aph: '#74BBFB', orbit: '#8E9A90', land: '#6E8F66', landEdge: '#A8C79B',
  warm: P.warm, cool: P.cool, proxy: P.proxy };
const O_NOW = M.orbit(0);
const MEAN = M.MEAN_800K;
const SNOWFALL = 250;                                  // mm water equivalent, held fixed

function label(ctx, t, x, y, o = {}) {
  ctx.save();
  ctx.font = o.font || `600 14px ${FB}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.rot) { ctx.translate(x, y); ctx.rotate(o.rot); x = 0; y = 0; }
  if (o.halo) { ctx.lineJoin = 'round'; ctx.lineWidth = o.hw || 4; ctx.strokeStyle = o.halo === true ? 'rgba(14,17,15,0.85)' : o.halo; ctx.strokeText(t, x, y); }
  ctx.fillStyle = o.color || C.text; ctx.fillText(t, x, y);
  ctx.restore();
}
function tw(ctx, t, font) { ctx.save(); ctx.font = font; const w = ctx.measureText(t).width; ctx.restore(); return w; }
function rrect(ctx, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function line(c, x0, y0, x1, y1) { c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke(); }
function dot(c, x, y, r, fill, stroke, sw) { c.beginPath(); c.arc(x, y, r, 0, TAU); if (fill) { c.fillStyle = fill; c.fill(); } if (stroke) { c.strokeStyle = stroke; c.lineWidth = sw || 2; c.stroke(); } }
function dash(c, p) { c.setLineDash(p || []); }
function panel(c, x, y, w, h, title, col) {
  c.save(); c.fillStyle = C.stage; rrect(c, x, y, w, h, 6); c.fill();
  c.strokeStyle = 'rgba(232,228,217,0.12)'; c.lineWidth = 1; rrect(c, x + 0.5, y + 0.5, w - 1, h - 1, 6); c.stroke(); c.restore();
  if (title) label(c, title, x + 12, y + 16, { font: `700 13px ${FM}`, align: 'left', color: col || C.sec });
}
function pill(c, t, x, y, col, o = {}) {           // a label on an opaque plate
  const font = o.font || `700 13px ${FM}`, w = tw(c, t, font) + 14, h = o.h || 22;
  const x0 = o.align === 'right' ? x - w : o.align === 'left' ? x : x - w / 2;
  c.save(); c.fillStyle = o.bg || 'rgba(21,26,23,0.92)'; rrect(c, x0, y - h / 2, w, h, 4); c.fill();
  c.strokeStyle = col; c.globalAlpha = 0.45; c.lineWidth = 1; rrect(c, x0 + 0.5, y - h / 2 + 0.5, w - 1, h - 1, 4); c.stroke(); c.restore();
  label(c, t, x0 + w / 2, y + 0.5, { font, color: col });
  return w;
}
function legend(c, x, y, items) {                   // [{col, t, dash}]
  let lx = x;
  for (const it of items) {
    c.save(); c.strokeStyle = it.col; c.lineWidth = 3; c.lineCap = 'round'; dash(c, it.dash ? [6, 5] : []); line(c, lx, y, lx + 22, y); c.restore();
    label(c, it.t, lx + 29, y, { font: `600 13px ${FB}`, align: 'left' });
    lx += 29 + tw(c, it.t, `600 13px ${FB}`) + 20;
  }
  return lx - x;
}
const fmtInt = v => Math.round(v).toLocaleString('en-US');
function fmtAgeLong(age) {                           // "9,400 years ago" / "today" / "10,300 years from now"
  if (Math.abs(age) < 250) return 'today';
  const r = age > 0 ? Math.round(age / 100) * 100 : Math.round(-age / 100) * 100;
  return fmtInt(r) + (age > 0 ? ' years ago' : ' years from now');
}
function fmtAgeShort(age) {
  if (Math.abs(age) < 250) return 'today';
  const k = Math.abs(age) / 1000, s = k >= 100 ? Math.round(k) + 'k' : (Math.round(k * 10) / 10).toLocaleString('en-US') + 'k';
  return age > 0 ? s + ' yr ago' : 'in ' + s + ' yr';
}
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MDAY = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
/* calendar date of a solar longitude, through Kepler's second law (Mar equinox = Mar 20) */
function keplerFrac(o, lam) {
  const e = o.e, ma = l => { const nu = (l - o.longPeri) * D2R;
    const E = 2 * Math.atan2(Math.sqrt(1 - e) * Math.sin(nu / 2), Math.sqrt(1 + e) * Math.cos(nu / 2)); return E - e * Math.sin(E); };
  let d = ma(lam) - ma(0); while (d < 0) d += TAU; return d / TAU;
}
function dateOfLon(o, lam) {
  let doy = (78.5 + keplerFrac(o, lam) * 365.2422) % 365.2422, m = 0;
  while (m < 11 && doy >= MDAY[m]) { doy -= MDAY[m]; m++; }
  return { m, d: Math.floor(doy) + 1, text: MONTHS[m].slice(0, 3) + ' ' + (Math.floor(doy) + 1), month: MONTHS[m] };
}
const sunDist = (o, lam) => 149.6 * (1 - o.e * o.e) / (1 + o.e * Math.cos((lam - o.longPeri) * D2R));   // million km
const q65 = (o, lam) => M.dailyMean(65, lam, o);
const meltOf = o => M.meltSeason(65, 0, { orbit: o, accumulation: SNOWFALL });

/* ═════════════════════════════ STATE ═════════════════════════════ */
let TOOL = null;
const S = { step: 0, v: [], chips: {}, tween: null };
let capturing = false, clock = 0, dirty = true;
const stepDef = () => TOOL.steps[S.step];
const curV = () => S.v[S.step];
const toSl = (st, v) => st.time ? -v : v;          // slider space: time runs left (past) → right (future)
const fromSl = (st, x) => st.time ? -x : x;

  const x = toSl(st, v), order = st.snaps.map((s, i) => ({ i, x: toSl(st, s.v) })).sort((a, b) => a.x - b.x);
  const n = order.find(o => o.x > x + snapEps(st));
  return n ? n.i : -1;
}
function setV(v, opts = {}) {
  const st = stepDef();
  S.v[S.step] = st.wrap ? v : clamp(v, Math.min(fromSl(st, st.slider.min), fromSl(st, st.slider.max)), Math.max(fromSl(st, st.slider.min), fromSl(st, st.slider.max)));
  if (!opts.keepTween) S.tween = null;
  syncControls(); renderCard(); dirty = true;
}

  const st = stepDef(), v = curV();
  if (S.tween) { S.tween = null; syncControls(); return; }
  let i = nextSnap(st, v);
  if (i < 0) {                                     // at the end: start over from the first snap
    const order = st.snaps.map((s, k) => ({ k, x: toSl(st, s.v) })).sort((a, b) => a.x - b.x);
    S.v[S.step] = st.snaps[order[0].k].v; i = order[1].k;
  }

  S.v[S.step] = lerp(tw0.from, tw0.to, ease(tw0.t));
  if (tw0.t >= 1) { S.v[S.step] = tw0.to; S.tween = null; }
  syncControls(); renderCard(); dirty = true;
}

/* ═════════════════════════════ CONTROLS ════════════════════════════ */
const ctl = document.getElementById('controls');
const mk = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
function renderControls() {
  const st = stepDef(); ctl.innerHTML = '';
  const pb = mk('button', 'cc-btn primary go'); pb.id = 'bPlay'; pb.onclick = play; ctl.appendChild(pb);
  ctl.appendChild(mk('div', 'sep'));
  const g = mk('div', 'grp'); g.id = 'snaps';
  st.snaps.forEach((s, i) => { const b = mk('button', 'cc-btn snap', s.l + (s.s ? `<small>${s.s}</small>` : '')); b.dataset.i = i;
    b.onclick = () => setV(s.v); g.appendChild(b); });
  ctl.appendChild(g);
  const sl = mk('div', 'slider');
  sl.innerHTML = `<input type="range" aria-label="${st.slider.label || 'value'}" min="${st.slider.min}" max="${st.slider.max}" step="${st.slider.step}"><span class="sv"></span>`;
  sl.querySelector('input').oninput = e => setV(fromSl(st, +e.target.value));
  ctl.appendChild(sl);
  syncControls();
}
function syncControls() {
  const st = stepDef(), v = curV();
  const a = activeSnap(st, v);
  ctl.querySelectorAll('.snap').forEach(b => b.classList.toggle('is-active', +b.dataset.i === a));
  const inp = ctl.querySelector('.slider input'); if (inp && document.activeElement !== inp) inp.value = toSl(st, v);
  const sv = ctl.querySelector('.slider .sv'); if (sv) sv.textContent = st.slider.fmt(v);
  const pb = document.getElementById('bPlay');
  if (pb) { const t = S.tween ? '❚❚ Pause' : (nextSnap(st, v) < 0 && S.played ? '↺ Replay' : '▶ Play'); if (pb.textContent !== t) pb.textContent = t; }
}

/* chips: optional per-step toggles on the stage */
const chipsEl = document.getElementById('chips');
function renderChips() {
  const st = stepDef(); chipsEl.innerHTML = '';
  if (!st.chips) { chipsEl.style.display = 'none'; return; }
  chipsEl.style.display = 'flex';
  for (const ch of st.chips) {
    if (ch.kind === 'seg') {
      const g = mk('div', 'cc-segmented');
      ch.options.forEach(op => { const b = mk('button', 'cc-segmented-btn' + (S.chips[ch.key] === op.v ? ' is-active' : ''), op.l);
        b.onclick = () => { S.chips[ch.key] = op.v; renderChips(); renderCard(); dirty = true; }; g.appendChild(b); });
      chipsEl.appendChild(g);
    } else {
      const b = mk('button', 'cc-btn tgl' + (S.chips[ch.key] ? ' is-active' : ''), ch.l);
      if (ch.col) b.style.setProperty('--chip-col', ch.col);
      b.onclick = () => { S.chips[ch.key] = !S.chips[ch.key]; renderChips(); renderCard(); dirty = true; }; chipsEl.appendChild(b);

    saveBlob(new Blob([buf], { type: 'video/mp4' }), slug() + '.mp4'); status('MP4 ' + (buf.byteLength / 1e6).toFixed(1) + ' MB');
  } catch (e) { console.error(e); status('MP4 failed'); }
  finally { sw.restore(); capturing = false; setBusy(false); syncControls(); renderCard(); dirty = true; draw(); }
}

/* ═════════════════════════════ PRECESSION ══════════════════════════ */
const E_VIS = 0.28;                                     // drawn orbit eccentricity (true value ≈ 0.017)
const periOrbit = lp => ({ e: O_NOW.e, obliquity: O_NOW.obliquity, longPeri: ((lp % 360) + 360) % 360 });
const precTiltHeld = a => { const o = M.orbit(a); return { e: o.e, obliquity: O_NOW.obliquity, longPeri: o.longPeri }; };
const periDate = o => dateOfLon(o, o.longPeri);
const PREC_SRC = 'Tilt and eccentricity held at today’s values.';

function wobbleScene(c, x, y, w, h, age) {
  const eps = M.orbit(age).obliquity, lean = poleBearing(age) * D2R;
  const gR = Math.min(h * 0.27, w * 0.15), gx = x + w * 0.25, gy = y + h * 0.56;
  const EXT = 1.45, ax = l => { const e = eps * D2R; return [Math.sin(e) * Math.cos(l), Math.sin(e) * Math.sin(l), Math.cos(e)]; };
  c.save(); dash(c, [3, 4]); c.strokeStyle = 'rgba(232,228,217,.35)'; c.lineWidth = 1.2; c.beginPath();
  for (let q = 0; q <= 360; q += 4) { const av = ax(q * D2R), pt = project([av[0] * EXT, av[1] * EXT, av[2] * EXT], gx, gy, gR); q ? c.lineTo(pt.x, pt.y) : c.moveTo(pt.x, pt.y); }
  c.stroke(); c.restore();
  drawGlobe(c, gx, gy, gR, eps, lean, { night: false, axis: false });
  const a = ax(lean), pN = project([a[0] * EXT, a[1] * EXT, a[2] * EXT], gx, gy, gR), pS = project([-a[0] * EXT, -a[1] * EXT, -a[2] * EXT], gx, gy, gR), pV = project([0, 0, EXT], gx, gy, gR);
  c.save(); dash(c, [2, 5]); c.strokeStyle = 'rgba(232,228,217,.45)'; c.lineWidth = 1.2; line(c, gx, gy, pV.x, pV.y); c.restore();
  c.save(); c.strokeStyle = C.tilt; c.lineWidth = 2.6; line(c, pS.x, pS.y, pN.x, pN.y); c.restore(); dot(c, pN.x, pN.y, 5.5, C.tilt);
  label(c, 'Earth’s axis', pN.x, pN.y - 16, { font: `700 13px ${FB}`, color: C.tilt, halo: true });
  const mR = Math.min(h * 0.40, w * 0.25), mx = x + w * 0.70, my = y + h * 0.52;
  const near = drawStarMap(c, mx, my, mR, age, eps);
  label(c, 'NORTH SKY · WHERE THE AXIS POINTS', mx, my - mR - 16, { font: `700 13px ${FM}`, color: C.sec });
  return near;
}
function orbitScene(c, x, y, w, h, o, opts = {}) {
  const A = Math.min(h * 0.29, w * 0.30), cx = x + w * 0.5, cy = y + h * 0.50;
  const r = drawSeasonOrbit(c, cx, cy, A, o.longPeri, E_VIS);
  if (opts.arrow) {                                     // perihelion slides later in the year
    const l0 = o.longPeri + 6, l1 = o.longPeri + 34; c.save(); c.strokeStyle = C.peri; c.lineWidth = 3; c.beginPath();
    for (let l = l0; l <= l1; l += 2) { const p = orbitXY(l, o.longPeri, E_VIS, cx, cy, A * 1.12); l === l0 ? c.moveTo(p.x, p.y) : c.lineTo(p.x, p.y); } c.stroke();
    const pe = orbitXY(l1, o.longPeri, E_VIS, cx, cy, A * 1.12), pb = orbitXY(l1 - 3, o.longPeri, E_VIS, cx, cy, A * 1.12), ang = Math.atan2(pe.y - pb.y, pe.x - pb.x);
    c.fillStyle = C.peri; c.beginPath(); c.moveTo(pe.x + Math.cos(ang) * 9, pe.y + Math.sin(ang) * 9); c.lineTo(pe.x + Math.cos(ang + 2.3) * 8, pe.y + Math.sin(ang + 2.3) * 8); c.lineTo(pe.x + Math.cos(ang - 2.3) * 8, pe.y + Math.sin(ang - 2.3) * 8); c.closePath(); c.fill(); c.restore();
  }
  label(c, 'ORBIT SHAPE EXAGGERATED', x + 12, y + h - 16, { font: `700 13px ${FM}`, align: 'left', color: C.muted });
  return r;
}

/* ═════════════════════════════ INIT ════════════════════════════════ */
function routeHref(route) { let hash = false; try { hash = (window.top.location.hash || '').startsWith('#/'); } catch (e) {} return (hash ? '/#' : '') + route; }
function urlParams() { const p = new URLSearchParams(location.search);
  try { const h = window.top.location.hash || '', i = h.indexOf('?'); if (i >= 0) new URLSearchParams(h.slice(i + 1)).forEach((v, k) => { if (!p.has(k)) p.set(k, v); }); } catch (e) {}
  return p; }
(async function init() {
  document.getElementById('ttl').textContent = TOOL.title;
  document.getElementById('sub').textContent = TOOL.sub;
  const tabs = document.getElementById('tabs');
  TOOL.steps.forEach((st, i) => { const b = mk('button', 'cc-segmented-btn', `<span class="n">${i + 1}</span><span class="lb">${st.label}</span>`); b.title = st.label; b.onclick = () => setStep(i); tabs.appendChild(b); });
  const ser = document.getElementById('series');
  if (TOOL.prev) { const a = mk('a', 'cc-btn x-link', `&larr; <span class="nm">${TOOL.prev.t}</span>`); a.href = routeHref(TOOL.prev.r); a.target = '_top'; a.title = TOOL.prev.t; ser.appendChild(a); }
  if (TOOL.next) { const a = mk('a', 'cc-btn x-link', `<span class="nm">${TOOL.next.t}</span> &rarr;`); a.href = routeHref(TOOL.next.r); a.target = '_top'; a.title = TOOL.next.t; ser.appendChild(a); }
  S.v = TOOL.steps.map(st => st.v0);
  S.chips = Object.assign({}, TOOL.chips0 || {});
  const p = urlParams(), sp = parseInt(p.get('step'), 10);
  const start = sp >= 1 && sp <= TOOL.steps.length ? sp - 1 : 0;
  try { await Promise.all([`700 16px ${FD}`, `600 14px ${FB}`, `700 14px ${FB}`, `700 14px ${FM}`, `600 13px ${FM}`].map(f => document.fonts.load(f))); } catch (e) {}
  if (TOOL.init) await TOOL.init();
  new ResizeObserver(resize).observe(stage);
  setStep(start);
  requestAnimationFrame(loop);
})();
