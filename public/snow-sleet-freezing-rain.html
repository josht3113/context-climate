<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow, Sleet &amp; Freezing Rain</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-hourly); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; }
.top .spacer { flex: 1; min-width: 0; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.units .cc-segmented-btn { padding: 8px 13px; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.pmenu.open { display: flex; }
.pmenu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; }
.pmenu button:hover { background: var(--color-surface); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #191E1B; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.chips { position: absolute; top: 8px; right: 10px; display: none; }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 12px; }

/* controls — Profiles */
.controls { border-top: 1px solid var(--color-border); background: var(--color-surface); }
.c1 { display: flex; align-items: stretch; gap: 8px; padding: 8px 10px; min-height: 62px; }
.drop { display: flex; align-items: center; justify-content: center; gap: 10px; width: 214px; flex: none; padding: 8px 16px;
  font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg);
  box-shadow: 0 0 0 0 rgba(109,150,216,.55); animation: glow 2.4s ease-in-out infinite; }
.drop:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.drop.busy { animation: none; filter: saturate(.6); }
.drop svg { width: 22px; height: 22px; flex: none; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(109,150,216,0); } 50% { box-shadow: 0 0 0 5px rgba(109,150,216,.28); } }
@media (prefers-reduced-motion: reduce) { .drop { animation: none; } }
.snaps1 { flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; min-width: 0; }
.snap1 { display: flex; align-items: center; gap: 10px; padding: 6px 10px; min-width: 0; text-align: left; }
.snap1 .ic { width: 34px; height: 30px; flex: none; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
.snap1 .ic svg { width: 28px; height: 26px; }
.snap1 .tx { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.snap1 .n { font-family: var(--font-body); font-weight: 600; font-size: 15px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snap1 .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.15; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snap1.is-active { background: var(--color-surface-2); border-color: var(--tool-accent); box-shadow: inset 0 0 0 1px var(--tool-accent); }

/* controls — Warm Front */
.c2 { display: grid; grid-template-columns: 112px minmax(0, 1fr); column-gap: 10px; row-gap: 0; padding: 6px 10px 6px; }
.tl-name { grid-column: 1; background: none; border: none; text-align: right; padding: 0 2px 0 0; cursor: pointer;
  font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-name:hover { color: var(--color-text-primary); }
.tl-name.is-active { color: var(--tool-accent); font-weight: 700; }
.tl-cells { grid-column: 2; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; padding: 1px 0; }
.tl-cell { height: 19px; border-radius: 3px; border: 1px dashed rgba(232,228,217,0.16); display: flex; align-items: center; justify-content: center; }
.tl-cell.full { border: none; }
.tl-cell svg { height: 15px; width: 30px; }
.tl-row-sel .tl-cell { box-shadow: 0 0 0 1px rgba(109,150,216,0.55); }
.play { grid-column: 1; grid-row: span 2; align-self: stretch; margin-top: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); line-height: 1.1; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 20px; }
.snaps2 { grid-column: 2; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; margin-top: 6px; }
.snap2 { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px; min-width: 0; }
.snap2 .n { font-family: var(--font-body); font-weight: 600; font-size: 15px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; }
.snap2 .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.1; color: var(--color-text-secondary); white-space: nowrap; }
.snap2.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap2.is-active .n, .snap2.is-active .v { color: var(--color-bg); }
.slw { grid-column: 2; padding: 0 calc((100% - 30px) / 14); }
.slw input { width: 100%; margin: 4px 0 0; accent-color: var(--tool-accent); height: 20px; cursor: pointer; display: block; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 4px; }
.card .v.sm { font-size: 21px; }
.card .ty { display: flex; align-items: center; gap: 10px; padding: 8px 0 7px; border-bottom: 1px solid var(--color-border); }
.card .ty .bd { width: 52px; height: 40px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex: none; }
.card .ty .bd svg { width: 42px; height: 36px; }
.card .ty .nm { font-family: var(--font-display); font-weight: 700; font-size: 29px; line-height: 1.05; }
.card .ty .sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card canvas.mini { width: 100%; height: 178px; display: block; margin: 6px 0 2px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .v.sm { font-size: 19px; }
  .card .ty { padding: 5px 0 4px; }
  .card .ty .nm { font-size: 25px; }
  .card canvas.mini { height: 150px; }
  .tl-cell { height: 17px; }
  .tl-cell svg { height: 13px; }
}
@media (max-height: 640px) {
  .tl-cell { height: 15px; }
  .tl-cell svg { height: 12px; }
  .snap2 { flex-direction: row; justify-content: center; gap: 6px; padding: 4px 2px; }
  .snap2 .n { font-size: 14px; }
  .c2 { padding: 4px 10px 4px; }
  .play { flex-direction: row; gap: 6px; font-size: 15px; }
  .slw input { margin-top: 2px; height: 18px; }
  .c1 { min-height: 54px; padding: 6px 10px; }
}
@media (max-height: 620px) {
  .card .src { display: none; }
  .card canvas.mini { height: 132px; }
}
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 16px; } }
@media (max-width: 1366px) {
  .main { grid-template-columns: minmax(0, 1fr) 272px; }
  .drop { width: 200px; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .x-link .nm { display: none; }
  .snap1 .ic { display: none; }
  .top { gap: 10px; }
  .top h1 { font-size: 22px; }
  .card { padding: 10px 13px; }
  .card .v { font-size: 22px; }
  .card .ty .nm { font-size: 25px; }
  .exp .cc-btn { padding: 6px 9px; }
  .units .cc-segmented-btn { padding: 8px 10px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .tabs .cc-segmented-btn { padding: 11px 12px; }
  .drop { width: 168px; padding: 8px 12px; }
  .drop .lbl2 { display: none; }
  .c2 { grid-template-columns: 100px minmax(0, 1fr); }
  .snap1 { padding: 6px 8px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Snow, Sleet &amp; Freezing Rain</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="prof">Profiles</button>
      <button class="cc-segmented-btn" data-tab="front">Warm Front</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <a class="cc-btn x-link" id="prevLink" target="_top" href="#">&larr; <span class="nm">Anatomy of a Front</span></a>
    <div class="cc-segmented units" id="units">
      <button class="cc-segmented-btn is-active" data-u="metric">Metric</button>
      <button class="cc-segmented-btn" data-u="us">US</button>
    </div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="pmenu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chips">
          <div class="cc-segmented" id="views">
            <button class="cc-segmented-btn" data-v="map">Map</button>
            <button class="cc-segmented-btn" data-v="xsec">Cross-section</button>
            <button class="cc-segmented-btn is-active" data-v="split">Split</button>
          </div>
        </div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
