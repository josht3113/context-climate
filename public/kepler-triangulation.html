<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kepler's Triangulation</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); --ok: #5CC48A; --warn: #E8A04C; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 20px; white-space: nowrap; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#bSheet { color: var(--tool-accent); border-color: var(--tool-accent); font-weight: 700; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.play, .act { min-width: 112px; padding: 10px 16px; font-size: 15px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent);
  color: var(--color-bg); white-space: nowrap; }
.play:hover, .act:hover { filter: brightness(1.1); background: var(--tool-accent); color: var(--color-bg); }
.act:disabled { opacity: .4; filter: none; cursor: default; }
.act.check { background: transparent; color: var(--tool-accent); }
.act.check:hover { background: var(--tool-accent); color: var(--color-bg); }
.sm { padding: 9px 13px; font-size: 14px; white-space: nowrap; }
.preset { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 66px; padding: 5px 11px;
  color: var(--color-text-primary); line-height: 1.1; }
.preset b { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.preset i { font-style: normal; font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--color-text-secondary); white-space: nowrap; }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.preset.is-active i { color: var(--color-bg); opacity: .85; }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider .sl { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: .06em; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 64px; text-align: right; white-space: nowrap; }
.tgl { padding: 8px 14px; font-size: 14px; white-space: nowrap; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.chips { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 8px; max-width: calc(100% - 20px); }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .tgl { padding: 5px 11px; font-size: 13px; background: var(--color-surface); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .v.hi { color: var(--tool-accent); }
.card .r.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card .r.pair .v { font-size: 21px; }
.card table { width: 100%; border-collapse: collapse; margin: 8px 0 2px; font-family: var(--font-mono); font-size: 13.5px; color: var(--color-text-primary); }
.card th { font-family: var(--font-body); font-weight: 500; font-size: 12.5px; color: var(--color-text-secondary);
  text-align: right; padding: 0 0 5px 6px; line-height: 1.25; vertical-align: bottom; border-bottom: 1px solid var(--color-border); }
.card th:first-child, .card td:first-child { text-align: left; padding-left: 0; }
.card td { text-align: right; padding: 5px 0 5px 6px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.card td .sw { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
.card td.on { color: var(--tool-accent); font-weight: 700; }
.card table.big td { font-size: 14px; }
.card table.list td { padding: 3px 0 3px 6px; font-size: 13px; }
.card table.list tr.dim td { color: var(--color-text-muted); }
.card .note { margin-top: 12px; padding: 10px 12px; background: var(--color-surface-2); border-left: 3px solid var(--tool-accent);
  border-radius: 4px; font-family: var(--font-body); font-size: 14.5px; line-height: 1.45; color: var(--color-text-primary); }
.card .note b { color: var(--tool-accent); font-weight: 600; }
.card .note .inner { color: #FF8A7A; font-weight: 600; }
.card .fb { margin-top: 8px; padding: 8px 12px; border-radius: 4px; font-family: var(--font-body); font-size: 14px; line-height: 1.4; }
.card .fb.ok { background: rgba(92,196,138,0.12); color: #8FDCB0; border-left: 3px solid var(--ok); }
.card .fb.warn { background: rgba(232,160,76,0.12); color: #F2C08A; border-left: 3px solid var(--warn); }
.card .defs { margin-top: 10px; display: grid; gap: 6px; font-family: var(--font-body); font-size: 14px; line-height: 1.35; color: var(--color-text-primary); }
.card .defs div { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: start; }
.card .defs i { display: block; width: 14px; height: 3px; margin-top: 8px; border-radius: 2px; }
.card .defs span b { font-weight: 600; }
.card .ck { margin-top: 10px; display: grid; gap: 4px; font-family: var(--font-body); font-size: 14px; }
.card .ck div { display: grid; grid-template-columns: 18px 1fr; gap: 6px; }
.card .ck .y { color: var(--ok); font-weight: 700; } .card .ck .n { color: var(--warn); font-weight: 700; }
.card .ck small { display: block; color: var(--color-text-secondary); font-size: 13px; }
.card .nx { margin-top: 10px; align-self: flex-start; padding: 9px 16px; font-size: 14px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.card .nx:hover { filter: brightness(1.1); background: var(--tool-accent); color: var(--color-bg); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 780px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .note { font-size: 14px; line-height: 1.4; padding: 8px 10px; margin-top: 8px; }
  .card td { padding: 4px 0 4px 6px; }
  .card table.list td { padding: 2px 0 2px 6px; }
  .card .src { padding-top: 6px; }
}
@media (max-height: 620px) {
  .card { padding: 10px 14px; }
  .card .defs { margin-top: 6px; gap: 3px; font-size: 13.5px; }
  .card table { margin-top: 4px; }
  .card table.list td { padding: 1px 0 1px 6px; }
  .card .r.pair .v { font-size: 19px; }
}
@media (max-width: 1340px) { .tabs .cc-segmented-btn { padding: 11px 15px; } }
@media (max-width: 1240px) { .slider .sv { min-width: 0; } .top { gap: 10px; } .top h1 { font-size: 21px; } .sm { padding: 9px 10px; } }
@media (max-width: 1160px) { .slider .sl { display: none; } .play, .act { min-width: 0; padding: 10px 13px; } .preset { min-width: 0; padding: 5px 8px; } .exp .cc-btn { padding: 6px 9px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Kepler's Triangulation</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="idea">The Idea</button>
      <button class="cc-segmented-btn" data-tab="guided">Guided</button>
      <button class="cc-segmented-btn" data-tab="practice">Practice</button>
      <button class="cc-segmented-btn" data-tab="whole">Whole Orbit</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bSheet">⎙ Practice sheet</button>
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv" tabindex="0"></canvas>
        <div class="chips" id="chips"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
