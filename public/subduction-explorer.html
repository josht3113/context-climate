<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(180deg, #0b1424 0%, #131f37 100%);
    background-attachment: fixed;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    padding: 20px 12px 24px;
    min-height: 100vh;
  }
  .hdr { width: 100%; max-width: 920px; }
  .hdr h1 { font-size: 1.3rem; font-weight: 700; color: #3AAFA9; margin-bottom: 5px; letter-spacing: -.005em; }
  .hdr p  { font-size: 0.87rem; color: #94a3b8; line-height: 1.45; }
  .ctrl {
    width: 100%; max-width: 920px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .zone-sw {
    display: flex; gap: 3px;
    background: rgba(30,41,59,.85);
    padding: 3px;
    border-radius: 8px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.3);
  }
  .zbtn {
    background: transparent; color: #94a3b8; border: none; cursor: pointer;
    padding: 8px 20px; border-radius: 6px;
    font-size: 0.86rem; font-weight: 600; letter-spacing: .02em;
    transition: color .15s, background .2s, box-shadow .25s, transform .1s;
  }
  .zbtn:hover { color: #cbd5e1; }
  .zbtn.active {
    background: #3AAFA9; color: #fff;
    box-shadow: 0 2px 10px rgba(58,175,169,.35);
  }
  .zbtn.active:hover { color: #fff; }
  .zbtn:active { transform: scale(.97); }
  #btn {
    background: #3AAFA9; color: #fff; border: none; cursor: pointer;
    padding: 9px 22px; border-radius: 6px; font-size: 0.92rem;
    font-weight: 600; letter-spacing: .02em; white-space: nowrap;
    transition: background .15s;
  }
  #btn:hover   { background: #2e9490; }
  #btn:disabled { opacity: .5; cursor: not-allowed; }
  #lbl { font-size: .86rem; color: #64748b; font-style: italic; }
  canvas { display: block; border-radius: 9px; box-shadow: 0 6px 32px rgba(0,0,0,.55); }
  .leg {
    width: 100%; max-width: 920px;
    display: flex; flex-wrap: wrap;
    align-items: center; gap: 5px 14px;
  }
  .legt { font-size: .79rem; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
  .legi { display: flex; align-items: center; gap: 6px; font-size: .82rem;
    color: #94a3b8; white-space: nowrap; }
  .legd { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.14); }
</style>
</head>

    csTitle: "Cross-Section A—A'  ·  23°S Transect",
    csLeftLabel: '← W  (Fiji / Tonga)',
    csRightLabel: 'E  (Pacific / Trench) →',
    overridingPlate: 'Tonga / Australian Plate  (overriding)',
    subductingPlate: 'subducting slab surface (Pacific Plate)'
  },
  chile: {
    label: 'Chile',
    title: 'Chile Subduction Zone',
    detail: "Shallow slab dip (~25°) · Color-coded by focal depth (IRIS scale) · Map view ↔ Cross-section A—A' (30°S transect)",
    lon0: -80, lon1: -60, lat0: -40, lat1: -20,
    polygons: [C_SAMERICA],
    elevPoly: C_ANDES,
    trench: C_TRENCH,
    trenchLon: lat => -71.0 + (lat+20)*0.175,
    teethTarget: [-67, -29],
    labels: [
      {t:'PACIFIC OCEAN', lon:-77.0, lat:-28.0, f:'italic 12px system-ui', c:'#1a5f8a'},
      {t:'BOLIVIA',   lon:-64.0, lat:-21.5, f:'bold 12px system-ui', c:'#4a3a1a'},
      {t:'ARGENTINA', lon:-64.5, lat:-33.0, f:'bold 12px system-ui', c:'#4a3a1a'},
      {t:'CHILE',     lon:-70.5, lat:-29.0, f:'bold 10.5px system-ui', c:'#4a3a1a', rot:-Math.PI/2},
      {t:'ANDES',     lon:-68.7, lat:-26.5, f:'italic 10px system-ui', c:'#6a5530', rot:-Math.PI/2},
      {t:'Peru-Chile Trench', lon:-72.5, lat:-25.5, f:'11px system-ui', c:'#111', rot:-Math.PI/2}
    ],
    transectLat: -30, transectStart: -78.5, transectEnd: -61.0,
    slabD: d =>
      d<=0  ? 0 :
      d<=80 ? d*0.27 :
      d<=300? 21.6+(d-80)*0.466 :
      d<=600? 124.1+(d-300)*0.577 :
              297.4+(d-600)*0.85,
    maxDist: 700,
    quakeLon: (tl, dist) => tl + dist/96,
    csMaxX: 700, csInvert: false,
    csTitle: "Cross-Section A—A'  ·  30°S Transect",
    csLeftLabel: '← W  (Pacific / Trench)',
    csRightLabel: 'E  (Argentina) →',
    overridingPlate: 'South American Plate  (overriding)',
    subductingPlate: 'subducting slab surface (Nazca Plate)',
    // Realism parameters
    clusterLats: [-22.0, -32.0, -36.5],  // Iquique, Atacama, Maule regions
    doubleZoneProb: 0.22,                 // Less pronounced than Japan
    doubleZoneOffset: 22,
    crustalArc: 'andes'
  }
};

let zoneKey = 'tonga';
const Z = () => ZONES[zoneKey];

// ═══════════════════════════════════════════════════════════════════
// COORDINATE FUNCTIONS (zone-aware)
// ═══════════════════════════════════════════════════════════════════
const mapX = lon  => (lon - Z().lon0)/(Z().lon1 - Z().lon0)*W;
const mapY = lat  => H - (lat - Z().lat0)/(Z().lat1 - Z().lat0)*H;
const csX  = dist => Z().csInvert ? (CSL+PLW)-(dist/Z().csMaxX)*PLW : CSL+(dist/Z().csMaxX)*PLW;
const csY  = dep  => CST + (dep/700)*PLH;

const depCol = d =>
  d<33  ?'#9B59B6': d<70 ?'#3B82F6': d<150?'#22C55E':
  d<300 ?'#EAB308': d<500?'#F97316': '#EF4444';

// ═══════════════════════════════════════════════════════════════════
// QUAKE GENERATION
//   Slab events with depth-dependent perpendicular scatter,
//   double-seismic-zone effect, locked-patch clusters,
//   and shallow crustal events on the overriding plate.
// ═══════════════════════════════════════════════════════════════════
function generateQuakes(){
  const z = Z();
  const raw = zoneKey === 'tonga' ? TONGA_DATA : CHILE_DATA;
  return raw.map(([lon, lat, dep]) => {
    const tLon  = z.trenchLon(lat);
    const kpd   = 111 * Math.cos(Math.abs(lat) * Math.PI / 180);
    const dLon  = z.csInvert ? (tLon - lon) : (lon - tLon);
    const dist  = dLon * kpd;
    // Events outside the slab corridor fade on the map but don't appear in CS
    const offSlab = dist < 0 || dist > z.csMaxX;
    return {
      lon, lat, dist: Math.max(0, dist), dep,
      mx: mapX(lon), my: mapY(lat),
      cx: offSlab ? mapX(lon) : csX(Math.max(0, dist)),
      cy: offSlab ? mapY(lat) : csY(dep),
      col: depCol(dep),
      crustal: offSlab
    };
  });
}
let quakes = generateQuakes();

// ═══════════════════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════════════════
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');

function poly(pts, fill, stroke, lw=0.9){
  ctx.beginPath();
  ctx.moveTo(mapX(pts[0][0]), mapY(pts[0][1]));
  for (let i=1; i<pts.length; i++) ctx.lineTo(mapX(pts[i][0]), mapY(pts[i][1]));
  ctx.closePath();
  if (fill)   { ctx.fillStyle = fill;   ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}

// ═══════════════════════════════════════════════════════════════════
// DRAW MAP
// ═══════════════════════════════════════════════════════════════════
function drawMap(a){
  if (a<=0) return;
  ctx.save(); ctx.globalAlpha = a;
  const z = Z();

  ctx.fillStyle = '#bbd8e8';
  ctx.fillRect(0, 0, W, H);

  z.polygons.forEach(p => poly(p, '#d4c49c', '#8a7550'));

  if (z.elevPoly) poly(z.elevPoly, 'rgba(167,138,89,.32)', 'rgba(120,95,60,.35)', 0.6);

  const tp = z.trench.map(p => [mapX(p[0]), mapY(p[1])]);
  ctx.beginPath();
  ctx.moveTo(tp[0][0], tp[0][1]);
  tp.slice(1).forEach(p => ctx.lineTo(p[0], p[1]));
  ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2.2; ctx.setLineDash([]); ctx.stroke();

  const [tjLon, tjLat] = z.teethTarget;
  const jx = mapX(tjLon), jy = mapY(tjLat);
  for (let i=0; i<tp.length-1; i++){
    const p1 = tp[i], p2 = tp[i+1];
    const len = Math.hypot(p2[0]-p1[0], p2[1]-p1[1]);
    const steps = Math.max(1, Math.floor(len/18));
    for (let s=0; s<steps; s++){
      const t2 = (s+.5)/steps;
      const tx = lerp(p1[0],p2[0],t2), ty = lerp(p1[1],p2[1],t2);
      const dx = jx-tx, dy = jy-ty, dl = Math.hypot(dx,dy);
      const px = -dy/dl*4.5, py = dx/dl*4.5;
      ctx.beginPath();
      ctx.moveTo(tx+px, ty+py); ctx.lineTo(tx-px, ty-py);
      ctx.lineTo(tx+dx/dl*9, ty+dy/dl*9);
      ctx.closePath(); ctx.fillStyle = '#1a1a2e'; ctx.fill();
    }
  }

  const tY  = mapY(z.transectLat);
  const txA = mapX(z.transectStart);
  const txAp= mapX(z.transectEnd);
  ctx.beginPath();
  ctx.moveTo(txA, tY); ctx.lineTo(txAp, tY);
  ctx.setLineDash([8,5]); ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#222';
  ctx.textAlign = 'right'; ctx.fillText('A', txA-4, tY+5);
  ctx.textAlign = 'left';  ctx.fillText("A'", txAp+4, tY+5);

  z.labels.forEach(l => {
    const x = mapX(l.lon), y = mapY(l.lat);
    ctx.save();
    ctx.font = l.f; ctx.fillStyle = l.c; ctx.textAlign = 'center';
    if (l.rot) { ctx.translate(x, y); ctx.rotate(l.rot); ctx.fillText(l.t, 0, 0); }
    else        { ctx.fillText(l.t, x, y); }
    ctx.restore();
  });

  const ax = W-30, ay = 38;
  ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.moveTo(ax,ay+15); ctx.lineTo(ax,ay-11); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ax-5,ay-4); ctx.lineTo(ax,ay-14); ctx.lineTo(ax+5,ay-4); ctx.closePath(); ctx.fill();
  ctx.font='bold 12px system-ui'; ctx.textAlign='center'; ctx.fillText('N',ax,ay-18);

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════
// DRAW CROSS-SECTION
// ═══════════════════════════════════════════════════════════════════
function drawCS(a){
  if (a<=0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.setLineDash([]);
  const z = Z();

  [[0,70,'rgba(155,89,182,.08)'],[70,300,'rgba(234,179,8,.09)'],[300,700,'rgba(239,68,68,.08)']].forEach(([d1,d2,c])=>{
    ctx.fillStyle = c;
    ctx.fillRect(CSL, csY(d1), PLW, csY(d2)-csY(d1));
  });

  ctx.strokeStyle = '#d8e4ee'; ctx.lineWidth = .8;
  for (let d=0; d<=700; d+=100){
    const y=csY(d); ctx.beginPath(); ctx.moveTo(CSL,y); ctx.lineTo(CSL+PLW,y); ctx.stroke();
  }
  for (let d=0; d<=z.csMaxX; d+=100){
    const x=csX(d); ctx.beginPath(); ctx.moveTo(x,CST); ctx.lineTo(x,CST+PLH); ctx.stroke();
  }

  [70,300].forEach(d => {
    ctx.beginPath(); ctx.setLineDash([5,4]);
    ctx.moveTo(CSL, csY(d)); ctx.lineTo(CSL+PLW, csY(d));
    ctx.strokeStyle='#b0b8c8'; ctx.lineWidth=1.2; ctx.stroke(); ctx.setLineDash([]);
  });

  ctx.beginPath(); ctx.setLineDash([7,5]);
  let first = true;
  for (let d=0; d<=z.csMaxX; d+=3){
    const dep = z.slabD(d); if (dep > 700) break;
    first ? (ctx.moveTo(csX(d), csY(dep)), first=false) : ctx.lineTo(csX(d), csY(dep));
  }
  ctx.strokeStyle='#444'; ctx.lineWidth=1.8; ctx.stroke(); ctx.setLineDash([]);

  const midD = z.maxDist * 0.5, midDep = z.slabD(midD);
  ctx.font='italic 11px system-ui'; ctx.fillStyle='#555'; ctx.textAlign='center';
  ctx.fillText(z.subductingPlate, csX(midD), csY(midDep)-11);

  ctx.fillStyle='rgba(212,196,156,.45)';
  ctx.fillRect(CSL,CST-42,PLW,38);
  ctx.strokeStyle='rgba(138,117,80,.5)'; ctx.lineWidth=1;
  ctx.strokeRect(CSL,CST-42,PLW,38);
  ctx.fillStyle='#3a2c10'; ctx.font='bold 11px system-ui'; ctx.textAlign='center';
  ctx.fillText(z.overridingPlate, CSL+PLW/2, CST-42+20);

  const trX = csX(0);
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath();
  ctx.moveTo(trX-9,CST-5); ctx.lineTo(trX+9,CST-5); ctx.lineTo(trX,CST+2);
  ctx.closePath(); ctx.fill();
  ctx.font='11px system-ui'; ctx.fillStyle='#1a1a2e'; ctx.textAlign='center';
  ctx.fillText('Trench', trX, CST-8);

  ctx.strokeStyle='#4a5568'; ctx.lineWidth=1.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(CSL,CST); ctx.lineTo(CSL,CST+PLH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CSL,CST+PLH); ctx.lineTo(CSL+PLW,CST+PLH); ctx.stroke();

  [0,70,150,300,500,700].forEach(d => {
    const y = csY(d), essrt = (d===70 || d===300);
    ctx.strokeStyle='#4a5568'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CSL,y); ctx.lineTo(CSL-5,y); ctx.stroke();
    ctx.font = essrt ? 'bold 11px system-ui' : '11px system-ui';
    ctx.fillStyle = essrt ? '#c0392b' : '#4a5568';
    ctx.textAlign = 'right'; ctx.fillText(d, CSL-8, y+4);
  });

  for (let d=0; d<=z.csMaxX; d+=100){
    const x = csX(d);
    ctx.strokeStyle='#4a5568'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(x,CST+PLH); ctx.lineTo(x,CST+PLH+5); ctx.stroke();
    ctx.font='12px system-ui'; ctx.fillStyle='#4a5568'; ctx.textAlign='center';
    ctx.fillText(d, x, CST+PLH+19);
  }

  ctx.font='bold 13px system-ui'; ctx.fillStyle='#2d3748'; ctx.textAlign='center';
  ctx.fillText('Distance from Trench (km)', CSL+PLW/2, H-7);
  ctx.save();
  ctx.translate(17, CST+PLH/2); ctx.rotate(-Math.PI/2); ctx.textAlign='center';
  ctx.fillText('Depth (km)', 0, 0); ctx.restore();

  ctx.font='bold 15px system-ui'; ctx.fillStyle='#1a202c'; ctx.textAlign='center';
  ctx.fillText(z.csTitle, CSL+PLW/2, 19);
  ctx.font='13px system-ui'; ctx.fillStyle='#718096';
  ctx.textAlign='left';  ctx.fillText(z.csLeftLabel, CSL+4, 39);
  ctx.textAlign='right'; ctx.fillText(z.csRightLabel, CSL+PLW-4, 39);

  ctx.font='10px system-ui'; ctx.fillStyle='rgba(80,80,80,.3)';
  ctx.textAlign = z.csInvert ? 'left' : 'right';
  const labelX = z.csInvert ? CSL+5 : CSL+PLW-5;
  ctx.fillText('shallow',      labelX, csY(35));
  ctx.fillText('intermediate', labelX, csY(185));
  ctx.fillText('deep',         labelX, csY(500));

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════════
// DRAW QUAKES
//   Crustal events (overriding plate) fade out during transition to CS.
// ═══════════════════════════════════════════════════════════════════
function drawQuakes(t){
  const baseAlpha = ctx.globalAlpha;
  quakes.forEach(q => {
    const fade = q.crustal ? Math.max(0, 1 - t*1.6) : 1;
    if (fade <= 0.01) return;
    const x = lerp(q.mx, q.cx, t), y = lerp(q.my, q.cy, t);
    ctx.globalAlpha = baseAlpha * fade;
    ctx.beginPath(); ctx.arc(x, y, 3.0, 0, Math.PI*2);
    ctx.fillStyle = q.col; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = .5; ctx.stroke();
  });
  ctx.globalAlpha = baseAlpha;
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function render(t){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f0f4f8'; ctx.fillRect(0,0,W,H);
  drawMap(1-t);
  drawCS(t);
  drawQuakes(t);
}

// ═══════════════════════════════════════════════════════════════════
// VIEW ANIMATION
// ═══════════════════════════════════════════════════════════════════
let animT = 0, tgt = 0, v0 = 0, t0 = 0, busy = false;
const DUR = 1350;

function tick(now){
  const p = Math.min((now - t0)/DUR, 1);
  animT = lerp(v0, tgt, ease(p));
  render(animT);
  if (p < 1) requestAnimationFrame(tick);
  else { animT = tgt; busy = false; setButtonsEnabled(true); }
}

function toggle(){
  if (busy) return;
  busy = true; setButtonsEnabled(false);
  tgt = animT < .5 ? 1 : 0;
  v0 = animT; t0 = performance.now();
  updateBtnLabel();
  requestAnimationFrame(tick);
}

function updateBtnLabel(){
  const goingToCS = tgt === 1;
  const btn = document.getElementById('btn'), lbl = document.getElementById('lbl');
  if (goingToCS) { btn.textContent = '← Switch to Map View'; lbl.textContent = "Cross-Section A—A'"; }
  else           { btn.textContent = 'Switch to Cross-Section →'; lbl.textContent = 'Map View'; }
}

function setButtonsEnabled(enabled){
  document.getElementById('btn').disabled = !enabled;
  document.querySelectorAll('.zbtn').forEach(b => b.disabled = !enabled);
}

// ═══════════════════════════════════════════════════════════════════
// ZONE SWITCHING — soft cross-fade
// ═══════════════════════════════════════════════════════════════════
let zoneFading = false;
function switchZone(newKey){
  if (zoneKey === newKey || busy || zoneFading) return;
  zoneFading = true; setButtonsEnabled(false);

  const FADE = 220;
  const start = performance.now();
  let halfway = false;

  function fade(now){
    const elapsed = now - start;
    if (elapsed < FADE) {
      const a = 1 - elapsed/FADE;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#f0f4f8'; ctx.fillRect(0,0,W,H);
      ctx.globalAlpha = a;
      drawMap(1-animT); drawCS(animT); drawQuakes(animT);
      ctx.globalAlpha = 1;
      requestAnimationFrame(fade);
    } else if (!halfway) {
      halfway = true;
      zoneKey = newKey;
      quakes = generateQuakes();
      updateZoneUI();
      requestAnimationFrame(fade);
    } else if (elapsed < FADE*2) {
      const a = (elapsed - FADE)/FADE;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#f0f4f8'; ctx.fillRect(0,0,W,H);
      ctx.globalAlpha = a;
      drawMap(1-animT); drawCS(animT); drawQuakes(animT);
      ctx.globalAlpha = 1;
      requestAnimationFrame(fade);
    } else {
      render(animT);
      zoneFading = false;
      setButtonsEnabled(true);
    }
  }
  requestAnimationFrame(fade);
}

function updateZoneUI(){
  document.getElementById('title').textContent = 'Wadati-Benioff Zone — ' + Z().title;
  document.getElementById('subtitle').textContent = Z().detail;
  document.querySelectorAll('.zbtn').forEach(b => {
    b.classList.toggle('active', b.dataset.zone === zoneKey);
  });
}

// ═══════════════════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════════════════
document.getElementById('btn').addEventListener('click', toggle);
document.querySelectorAll('.zbtn').forEach(b => {
  b.addEventListener('click', () => switchZone(b.dataset.zone));
});

updateZoneUI();
render(0);
</script>
</body>
</html>
