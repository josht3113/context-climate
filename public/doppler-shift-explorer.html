<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doppler Shift Explorer</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="spectra-core.js"></script>
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.top .spacer { flex: 1; }
.links { display: flex; gap: 6px; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #0F1311; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.float { position: absolute; left: 12px; right: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none; }
.float > * { pointer-events: auto; }
.float .cc-segmented-btn { font-size: 13px; padding: 6px 13px; white-space: nowrap; }
.float .els .cc-segmented-btn { font-family: var(--font-display); font-weight: 700; font-size: 15px; padding: 4px 13px; min-width: 42px; text-transform: none; letter-spacing: 0; }

.controls { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; grid-template-rows: auto 40px; column-gap: 10px;
  padding: 8px 10px 4px; border-top: 1px solid var(--color-border); background: var(--color-surface); }
.play { grid-row: 1 / 3; grid-column: 1; align-self: stretch; margin-bottom: 4px; font-size: 16px; font-weight: 700;
  background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; line-height: 1.1; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 22px; }
.snaps { grid-column: 2; grid-row: 1; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 5px; min-width: 0; }
.snap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; padding: 5px 2px; min-width: 0; white-space: normal; }
.snap .n { font-family: var(--font-body); font-weight: 600; font-size: 13px; line-height: 1.12; color: var(--color-text-primary); text-align: center; }
.snap .v { font-family: var(--font-mono); font-weight: 700; font-size: 13px; line-height: 1; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
#vstrip { grid-column: 2; grid-row: 2; display: block; width: 100%; height: 40px; cursor: pointer; touch-action: none; }
.mode { grid-column: 3; grid-row: 1 / 3; flex-direction: column; align-self: stretch; margin-bottom: 4px; }
.mode .cc-segmented-btn { flex: 1; padding: 6px 14px; font-size: 13px; font-weight: 600; border-right: none; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.mode .cc-segmented-btn:last-child { border-bottom: none; }

.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; color: var(--tool-accent); font-weight: 700;
  padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v.sm { font-family: var(--font-mono); font-size: 16px; line-height: 1.35; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .sub { font-family: var(--font-mono); font-weight: 700; font-size: 14px; color: var(--color-text-secondary); margin-top: 1px; }
.card .tx { font-family: var(--font-body); font-size: 14px; line-height: 1.45; color: var(--color-text-secondary); margin: 8px 0 2px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) { .card .r { padding: 5px 0 4px; } .card .v { font-size: 23px; } }
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 262px; }
  .x-link .nm { display: none; }
  .card { padding: 10px 13px; }
  .card .v { font-size: 22px; } .card .v .u { font-size: 14px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 248px; }
  .top { gap: 12px; }
  .controls { grid-template-columns: 84px minmax(0, 1fr) auto; column-gap: 8px; }
  .snaps { gap: 4px; }
  .mode .cc-segmented-btn { padding: 6px 9px; }
  .exp .cc-btn { padding: 6px 9px; }
  .float .els .cc-segmented-btn { padding: 4px 10px; min-width: 36px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Doppler Shift Explorer</h1>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="links">
      <a class="cc-btn x-link" id="prevLink" target="_top" href="#">&larr; <span class="nm" id="prevName"></span></a>
      <a class="cc-btn x-link" id="nextLink" target="_top" href="#"><span class="nm" id="nextName"></span> &rarr;</a>
    </div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="float" id="float">
          <div class="cc-segmented els" id="els"></div>
          <div class="cc-segmented zoom" id="zoom"><button class="cc-segmented-btn" data-z="0">Full</button><button class="cc-segmented-btn" data-z="1">Zoom</button></div>
        </div>
      </div>
      <div class="controls" id="controls">
        <button class="cc-btn play" id="bPlay"></button>
        <div class="snaps" id="snaps"></div>
        <canvas id="vstrip" aria-label="Velocity"></canvas>
        <div class="cc-segmented mode" id="mode"><button class="cc-segmented-btn" data-m="stop">Stop at each</button><button class="cc-segmented-btn" data-m="through">Straight through</button></div>
      </div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

<script>

function rrect(c, x, y, w, h, r) {

  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function tag(c, text, x, y, color, font, w) {

  const tw = c.measureText(text).width, bx = clamp(x, tw / 2 + 8, (w || 1e9) - tw / 2 - 8);
  c.fillStyle = 'rgba(15,19,17,0.9)'; rrect(c, bx - tw / 2 - 7, y - 14, tw + 14, 20, 4); c.fill();
  c.fillStyle = color || INK; c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillText(text, bx, y);
}

/* ══ DATA ═══════════════════════════════════════════════════════════════════ */
/* line-of-sight velocities (km/s, cz) — the same objects as Hubble's Law Explorer */
const SNAPS = [
  { n: 'M31',        full: 'M31 Andromeda',     v:   -300 },
  { n: 'At rest',    full: '',                  v:      0 },
  { n: 'M49',        full: 'M49',               v:    980 },
  { n: 'Coma',       full: 'Coma cluster',      v:   6900 },
  { n: 'Ursa Major', full: 'Ursa Major cluster',v:  15000 },
  { n: 'Hydra',      full: 'Hydra cluster',     v:  61000 }

const VMIN = -20000, VMAX = 70000, VK = 1000;
const U = v => Math.asinh(v / VK), Vof = u => VK * Math.sinh(u);
const U0 = U(VMIN), U1 = U(VMAX), U_END = U(SNAPS[SNAPS.length - 1].v);
const FULL = { wlMin: 400, wlMax: 800 }, ZOOM_HALF = 12;
const TEXT = { intro: 'A star or galaxy moves along our line of sight. Its spectrum is compared with the same element measured in a lab, at rest.' };
const SRC = 'Rest wavelengths: NYSED ESRT (2026), p. 3. Galaxy velocities as in Hubble’s Law Explorer (cz, NED). Classical formula v = c·Δλ/λ₀.';

/* ══ STATE ══════════════════════════════════════════════════════════════════ */
const ST = { el: 'hydrogen', v: 0, zoom: 0, wt: 0, playing: false, target: null, tween: null, mode: 'stop' };
let capturing = false;

/* ══ MOTION VIEW ════════════════════════════════════════════════════════════
   The source is held still on screen; each wavefront is a circle centred where
   the source was when it left, so the fronts bunch ahead of the motion and
   spread behind it. Display speed is exaggerated (β shown ≈ 0.6·(|v|/70,000)^0.4). */
const betaD = v => Math.sign(v) * 0.6 * Math.pow(Math.min(1, Math.abs(v) / VMAX), 0.4);
const shiftCol = v => S.shiftColor(v) || INK;
function drawMotion(c, w, mh) {
  c.fillStyle = SKY; c.fillRect(0, 0, w, mh);
  const oy = mh * 0.54, ox = 70, sx = w * 0.64, sy = oy;
  const lam = clamp(mh * 0.16, 22, 42), cd = lam * 1.4, T = lam / cd, b = betaD(ST.v), u = b * cd;
  const rmax = Math.hypot(Math.max(sx, w - sx), mh) + 40, amax = rmax / cd;
  // line of sight
  c.save(); c.setLineDash([3, 5]); c.strokeStyle = 'rgba(232,228,217,0.22)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(ox + 22, oy); c.lineTo(sx, sy); c.stroke(); c.restore();
  // wavefronts
  c.save(); c.beginPath(); c.rect(0, 0, w, mh); c.clip();
  const k1 = Math.floor(ST.wt / T), k0 = Math.floor((ST.wt - amax) / T);
  for (let k = k0; k <= k1; k++) {
    const a = ST.wt - k * T; if (a <= 0) continue;
    const r = cd * a, cx = sx - u * a, fade = Math.pow(clamp(1 - r / rmax, 0, 1), 0.8) * clamp(r / 10, 0, 1);
    c.beginPath(); c.arc(cx, sy, r, 0, 7); c.strokeStyle = `rgba(232,228,217,${(0.5 * fade).toFixed(3)})`; c.lineWidth = 1.6; c.stroke();
  }
  c.restore();
  // source
  const gr = c.createRadialGradient(sx, sy, 0, sx, sy, 34);
  gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.4, 'rgba(255,232,190,0.4)'); gr.addColorStop(1, 'rgba(255,232,190,0)');
  c.fillStyle = gr; c.beginPath(); c.arc(sx, sy, 34, 0, 7); c.fill();
  c.fillStyle = '#FFF7E6'; c.beginPath(); c.arc(sx, sy, 12, 0, 7); c.fill();
  // motion arrow
  if (Math.abs(ST.v) > 50) {
    const dir = Math.sign(ST.v), len = 26 + Math.abs(b) * 120, y = sy - 46, x0 = sx + dir * 4, x1 = x0 + dir * len, col = shiftCol(ST.v);
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x0 - dir * 4, y); c.lineTo(x1 - dir * 6, y); c.stroke();
    c.beginPath(); c.moveTo(x1, y); c.lineTo(x1 - dir * 11, y - 6.5); c.lineTo(x1 - dir * 11, y + 6.5); c.closePath(); c.fill();
  }

  c.beginPath(); c.ellipse(ox, oy, 20, 12, 0, 0, 7); c.fillStyle = 'rgba(15,19,17,0.9)'; c.fill();
  c.strokeStyle = 'rgba(232,228,217,0.8)'; c.lineWidth = 2; c.stroke();
  c.beginPath(); c.arc(ox + 5, oy, 5, 0, 7); c.fillStyle = 'rgba(232,228,217,0.9)'; c.fill();
  c.font = `500 13px ${FB}`; c.fillStyle = LABEL; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillText('observer', ox, oy + 30); c.fillText('source', sx, sy + 34);
  // wavelength ruler at the observer: dashed = at rest, solid = arriving
  const rx = ox + 34, lr = lam, la = lam * (1 + b), y1 = oy + 52, y2 = oy + 72;
  if (y2 + 6 < mh) {
    const bar = (y, L, dash, col) => {
      c.save(); c.setLineDash(dash ? [4, 3] : []); c.strokeStyle = col; c.lineWidth = 2;
      c.beginPath(); c.moveTo(rx, y - 5); c.lineTo(rx, y + 5); c.moveTo(rx, y); c.lineTo(rx + L, y); c.moveTo(rx + L, y - 5); c.lineTo(rx + L, y + 5); c.stroke(); c.restore();
    };
    bar(y1, lr, true, 'rgba(232,228,217,0.75)'); bar(y2, la, false, shiftCol(ST.v));
    c.font = `500 13px ${FB}`; c.textAlign = 'left'; c.fillStyle = LABEL;
    const tx = rx + Math.max(lr, la) + 10;
    c.fillText('at rest', tx, y1 + 4.5); c.fillStyle = Math.abs(ST.v) > 50 ? shiftCol(ST.v) : LABEL; c.fillText('arriving', tx, y2 + 4.5);
  }
  c.font = `700 13px ${FM}`; c.textAlign = 'right'; c.fillStyle = 'rgba(232,228,217,0.55)';
  if ('letterSpacing' in c) c.letterSpacing = '1px';
  c.fillText('MOTION EXAGGERATED', w - 14, 22);
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  c.strokeStyle = 'rgba(232,228,217,0.14)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, mh + 0.5); c.lineTo(w, mh + 0.5); c.stroke();
}

/* ══ SPECTRA ════════════════════════════════════════════════════════════════ */
function windowNow() {
  if (!ST.zoom) return FULL;
  const r = S.refLine(EL[ST.el]).wl; return { wlMin: r - ZOOM_HALF, wlMax: r + ZOOM_HALF };
}
function geom(w, h) {
  const mh = Math.round(clamp(h * 0.42, 150, 420)), gut = 118, x = gut, pw = w - gut - 20, win = windowNow();
  const top = mh + 46, gap = 30, bh = Math.max(30, Math.min(110, (h - top - gap - 58) / 2));
  const lab = { x, y: top, w: pw, h: bh, wlMin: win.wlMin, wlMax: win.wlMax };
  const star = { x, y: top + bh + gap, w: pw, h: bh, wlMin: win.wlMin, wlMax: win.wlMax };
  return { mh, lab, star, bracketY: star.y + bh + 22, axisY: star.y + bh + 50 };
}
function band(c, p) {

    g.addColorStop(0, '#2A1412'); g.addColorStop(1, '#160D0C'); c.fillStyle = g; c.fillRect(x0, p.y, x1 - x0, p.h);
    if (x0 > p.x) { c.save(); c.setLineDash([3, 3]); c.strokeStyle = 'rgba(232,228,217,0.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x0 + 0.5, p.y); c.lineTo(x0 + 0.5, p.y + p.h); c.stroke(); c.restore(); }
  }
  if (p.wlMin < 400) {
    const x1 = Math.min(p.x + p.w, S.wlToX(400, p)); c.fillStyle = '#140F1C'; c.fillRect(p.x, p.y, x1 - p.x, p.h);
  }
}
function irMarks(c, p, el, v, ws) {
  el.lines.forEach(l => { const wl = S.shiftedWl(l.wl, v); if (wl <= 700 || wl > p.wlMax) return;
    const x = S.wlToX(wl, p), w = (l.strong ? 4 : 2.2) * ws; c.fillStyle = 'rgba(232,228,217,0.62)'; c.fillRect(x - w / 2, p.y, w, p.h); });
}
function offWindow(c, p, el, v) {
  let lo = 0, hi = 0;
  el.lines.forEach(l => { const w = S.shiftedWl(l.wl, v); if (w < p.wlMin) lo++; else if (w > p.wlMax) hi++; });
  const y = p.y - 8;
  c.font = `700 13px ${FM}`;
  const pill = (t, right) => { const tw = c.measureText(t).width, x = right ? p.x + p.w - tw - 14 : p.x;
    c.fillStyle = 'rgba(15,19,17,0.95)'; rrect(c, x, y - 14, tw + 14, 20, 4); c.fill();
    c.fillStyle = INK; c.textAlign = 'left'; c.fillText(t, x + 7, y); };

  if (lo) pill(`← ${lo} beyond`, false);
}
function drawSpectra(c, w, h, G) {
  const el = EL[ST.el], ref = S.refLine(el), v = ST.v, col = shiftCol(v), lab = G.lab, star = G.star;
  const ws = ST.zoom ? 1.6 : 1;
  band(c, lab); S.drawLines(c, lab, el, 0, { widthScale: ws }); S.drawFrame(c, lab);
