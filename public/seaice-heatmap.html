<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Ice Extent Heatmap · Context Climate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
  :root {
    --tool-accent: var(--accent-climate);
    --current: #F5D742;
    --warn:    #d9a441;
  }

  /* colors/font/grid texture come from core-sample-tools.css body rule */
  body { padding: 22px 24px 52px; max-width: 1320px; margin: 0 auto; }

  .page-eyebrow { margin-bottom: 6px; }
  .page-subtitle { margin-top: 4px; margin-bottom: 4px; }

  .freshness {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--color-text-muted); letter-spacing: 0.2px;
    line-height: 1.6; margin: 0 0 6px;
  }
  .freshness.stale { color: var(--warn); }

  /* ── CHIPS ────────────────────────────────────────────────── */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 16px; }
  .chip-sub {
    font-family: var(--font-mono); font-size: 12px;
    color: var(--color-text-muted); margin-top: 3px; letter-spacing: 0.2px;
  }

  /* ── CONTROLS ─────────────────────────────────────────────── */
  .controls {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; flex-wrap: wrap;
  }
  .control-spacer { flex: 1 1 auto; }

  .status-note {
    font-family: var(--font-mono); font-size: 13px;
    color: var(--color-text-muted); letter-spacing: 0.2px;
    margin-bottom: 12px; line-height: 1.6;
  }

  /* ── CHART ────────────────────────────────────────────────── */
  .chart-outer { overflow-x: auto; }
  .chart-stack { position: relative; line-height: 0; }
  #heatmapCanvas { display: block; cursor: crosshair; }
  #hoverLayer { position: absolute; top: 0; left: 0; pointer-events: none; display: block; }
  .chart-status {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 380px; gap: 14px;
    font-family: var(--font-mono); font-size: 15px;
    letter-spacing: 0.08em; color: var(--color-text-muted);
  }
  .loading-spinner {
    width: 26px; height: 26px;
    border: 2px solid var(--color-border);
    border-top-color: var(--tool-accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── LEGEND ───────────────────────────────────────────────── */
  .legend-block { margin-top: 18px; }
  .legend-title {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 6px;
  }
  #legendCanvas { display: block; border-radius: 3px; }
  .legend-ticks { display: flex; justify-content: space-between; margin-top: 5px; }
  .legend-tick {
    font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary);
  }
  .legend-bands { display: flex; justify-content: space-between; margin-top: 3px; }
  .legend-band {
    font-family: var(--font-body); font-size: 13px; letter-spacing: 0.3px;
    color: var(--color-text-muted);
  }
  .legend-keys { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .legend-key {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--color-text-muted); letter-spacing: 0.2px;
  }
  .key-swatch {
    width: 15px; height: 15px; border-radius: 2px;
    background: #3c6ea8; flex-shrink: 0;
  }
  .key-swatch.partial { border: 1px dotted rgba(232,228,217,0.8); }
  .key-swatch.nodata  { background: #1E2320; border: 1px solid var(--color-border); }

  /* ── TOOLTIP ──────────────────────────────────────────────── */
  .tooltip {
    position: fixed;
    background: rgba(18,21,18,0.97);
    border: 1px solid var(--color-border-hover);
    border-radius: 8px; padding: 11px 14px;
    pointer-events: none; opacity: 0;
    transition: opacity .08s; z-index: 1000;
    min-width: 196px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.65);
  }
  .tooltip.visible { opacity: 1; }
  .tt-period {
    font-family: var(--font-body); font-size: 15px; font-weight: 600;
    margin-bottom: 7px; color: var(--color-text-primary);
  }
  .tt-value {
    font-family: var(--font-mono); font-size: 28px;
    font-weight: 500; line-height: 1; margin-bottom: 5px;
  }
  .tt-sub {
    font-family: var(--font-body); font-size: 14px;
    color: var(--color-text-secondary); letter-spacing: 0.2px;
  }
  .tt-badge {
    display: none; margin-top: 8px;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 4px;
    background: rgba(217,164,65,0.13);
    border: 1px solid rgba(217,164,65,0.35);
    color: var(--warn);
  }

  /* ── FOOTER ───────────────────────────────────────────────── */
  .footer {
    margin-top: 26px; padding-top: 16px;
    border-top: 1px solid var(--color-border);
    font-family: var(--font-mono); font-size: 12px;
    color: var(--color-text-muted); letter-spacing: 0.2px; line-height: 1.8;
  }

  @media (max-width: 640px) {
    body { padding: 18px 14px 44px; }
  }
</style>
</head>
<body>

<p class="cc-eyebrow page-eyebrow">Climatology Heatmaps</p>
<h1 class="cc-title">Sea Ice Extent Heatmap</h1>
<p class="cc-subtitle page-subtitle">Monthly mean extent by year &middot; NSIDC Sea Ice Index</p>
<p class="freshness" id="freshness">Loading data&hellip;</p>

<div class="chips cc-stat-row" id="chipRow" style="display:none">
  <div class="cc-stat-chip">
    <div class="cc-stat-label">Latest</div>
    <div class="cc-stat-value" id="chipLatestV">&mdash;</div>
    <div class="chip-sub" id="chipLatestP"></div>
  </div>
  <div class="cc-stat-chip">
    <div class="cc-stat-label">Standing</div>
    <div class="cc-stat-value" id="chipRankV">&mdash;</div>
    <div class="chip-sub" id="chipRankP"></div>
  </div>
  <div class="cc-stat-chip">
    <div class="cc-stat-label" id="chipRecL">Record Low</div>
    <div class="cc-stat-value" id="chipRecV">&mdash;</div>
    <div class="chip-sub" id="chipRecP"></div>
  </div>
</div>

<div class="controls">
  <div class="cc-segmented" id="hemiToggle">
    <button class="cc-segmented-btn is-active" data-hemi="N">Arctic</button>
    <button class="cc-segmented-btn" data-hemi="S">Antarctic</button>
  </div>
  <div class="cc-segmented" id="modeToggle">
    <button class="cc-segmented-btn is-active" data-mode="anomaly">Anomaly</button>
    <button class="cc-segmented-btn" data-mode="raw">Raw Extent</button>
  </div>
  <span class="control-spacer"></span>
  <button class="cc-btn cc-btn-sm" id="downloadBtn">&darr; Export PNG</button>
</div>

<div class="status-note" id="modeNote"></div>

<div class="chart-status" id="chartStatus">
  <div class="loading-spinner"></div>
  <span>Loading Sea Ice Data&hellip;</span>
</div>

<div id="chartInner" style="display:none">
  <div class="chart-outer" id="chartOuter">
    <div class="chart-stack">
      <canvas id="heatmapCanvas" role="img"
        aria-label="Sea ice extent by month and year, colored by anomaly or raw value"></canvas>
      <canvas id="hoverLayer"></canvas>
    </div>
  </div>

  <div class="legend-block">
    <div class="legend-title" id="legendTitle"></div>
    <canvas id="legendCanvas"></canvas>
    <div class="legend-ticks" id="legendTicks"></div>
    <div class="legend-bands" id="legendBands"></div>
    <div class="legend-keys">
      <span class="legend-key"><span class="key-swatch nodata"></span>No data</span>
      <span class="legend-key"><span class="key-swatch partial"></span>Incomplete month</span>
    </div>
  </div>
</div>

<div class="footer">
  <span id="footnote"></span>
  <span id="coverageNote"></span>
  <span id="citation"></span>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-period"></div>
  <div class="tt-value"></div>
  <div class="tt-sub"></div>
  <div class="tt-badge">Incomplete month</div>
</div>

<script>
(function(){

  // ══════════════════════════════════════════════════════════════
  // CONFIG
  // ══════════════════════════════════════════════════════════════

  // Daily arrays are 366 slots, leap-year indexed: non-leap years carry a
  // null at slot 59 (the Feb 29 position), so these fixed month starts are
  // correct for every year. Verified against the real seaice-extent.json.
  var MONTH_STARTS = [0,31,60,91,121,152,182,213,244,274,305,335,366];
  var MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MON_FULL  = ['January','February','March','April','May','June',
                   'July','August','September','October','November','December'];

  // ── Layout ───────────────────────────────────────────────────
  // Time runs LEFT → RIGHT (one column per year); months are rows.
  var CELL_H       = 28;   // px per month row
  var MIN_CELL_W   = 12;   // px per year column (floor; below this the chart scrolls)
  var MAX_CELL_W   = 34;
  var LABEL_W      = 48;   // px for the month-label gutter
  var GRID_TOP     = 4;    // room for the current-year marker
  var AXIS_H       = 24;   // px for the year axis strip
  var EXPORT_SCALE = 3;    // fixed export multiplier, independent of devicePixelRatio

  var FIRST_FULL_YEAR = 1979; // satellite record starts Oct 1978; 1979 is the first complete year

  // Nimbus-7 SMMR ran an every-other-day duty cycle from the start of the
  // record until 20 Aug 1987; SSM/I gave daily coverage after that. A month
  // sampled every other day is a perfectly good monthly mean, so expected
  // coverage is era-dependent and a raw day count would wrongly flag the
  // whole of 1979–87 as incomplete.
  var SMMR_END_Y = 1987, SMMR_END_M = 7, SMMR_END_D = 20; // 0-indexed month
  var COVERAGE_OK = 0.85;   // actual/expected below this → flagged incomplete
  var MATCH_MIN   = 0.40;   // a year needs this share of the matched days to be ranked
  var STALE_DAYS  = 28;     // data older than this earns a freshness warning

  // Diverging anomaly scale (million km²), capped at ±3.
  // Both sides share the same neutral anchor so a zero anomaly reads
  // identically regardless of which direction you approach from.
  // CONTENT COLOURS — encode real meaning, never remap to design tokens.
  var MORE_ICE_STOPS = [   // cool/blue side — positive anomaly (more ice than normal)
    [0.0, [42, 46, 64]],
    [0.5, [150, 195, 245]],
    [1.0, [80, 150, 225]],
    [1.5, [40, 105, 190]],
    [2.0, [20, 70, 150]],
    [3.0, [10, 42, 95]]
  ];
  var LESS_ICE_STOPS = [   // warm/red side — negative anomaly (less ice than normal)
    [0.0, [42, 46, 64]],
    [0.5, [240, 195, 120]],
    [1.0, [225, 140, 55]],
    [1.5, [205, 85, 40]],
    [2.0, [175, 45, 32]],
    [3.0, [115, 20, 22]]
  ];
  // Sequential raw-extent scale (million km²), 0–20 — dark open ocean to bright ice.
  // Fixed 0–20 rather than per-hemisphere adaptive, so Arctic and Antarctic
  // stay directly comparable when the toggle is flipped.
  var RAW_STOPS = [
    [0,  [12, 28, 58]],
    [5,  [28, 72, 122]],
    [10, [68, 138, 190]],
    [15, [150, 200, 232]],
    [20, [232, 244, 250]]
  ];

  // No-data reads as the page background (a hole in the grid) rather than a
  // near-black that could be mistaken for a very low extent value.
  var NO_DATA_RGB = [30, 35, 32];

  var ANOMALY_TICKS = [-3,-2,-1.5,-1,-0.5,0,0.5,1,1.5,2,3];
  var RAW_TICKS = [0,5,10,15,20];
  var LEGEND_H = 20;

  var MODE_NOTES = {
    anomaly: 'Each cell is that month\u2019s mean extent minus the same month\u2019s ' +
             'BASELINE average. Warm colours mean less ice than normal, blue means more.',
    raw:     'Each cell is that month\u2019s mean extent on a fixed 0\u201320 million km\u00b2 ' +
             'scale, so the Arctic and Antarctic stay directly comparable. The seasonal ' +
             'cycle dominates \u2014 read down a column, not across a row.'
  };

  // ══════════════════════════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════════════════════════

  var STATE = {
    hemisphere: 'N',
    mode: 'anomaly',
    data: null,
    baselineStart: 1991,
    baselineEnd: 2020,
    grid: {},             // year -> [12 cell objects]
    baseFull: [],         // [12] baseline monthly means
    colYears: [],         // ascending
    maxYear: null,
    currentCalYear: new Date().getFullYear(),
    cellW: MIN_CELL_W,
    dpr: window.devicePixelRatio || 1,
    hover: null,
    pinned: false,
    latest: null,         // {year, month, cell}
    rank: null            // cached rankLatest() result
  };

  // ══════════════════════════════════════════════════════════════
  // HELPERS
  // ══════════════════════════════════════════════════════════════

  function $(id){ return document.getElementById(id); }
  function isLeap(y){ return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  function mean(vals){
    var v = vals.filter(function(x){ return x !== null && x !== undefined; });
    if (!v.length) return null;
    return v.reduce(function(a,b){ return a+b; }, 0) / v.length;
  }

  function ordinal(n){
    var s = ['th','st','nd','rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  function formatDate(iso){
    if (!iso) return 'unknown';
    var p = iso.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function daysSince(iso){
    if (!iso) return null;
    var p = iso.split('-');
    var d = Date.UTC(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return Math.floor((Date.now() - d) / 86400000);
  }

  // The note text in seaice-extent.json is written generically ("...on this
  // date...", "...from this date forward...") and relies on the separate
  // sensor_transition.date field to say which date that actually is. Render
  // the note without this and "this date" reaches the reader literally.
  function formatTransitionNote(tr){
    if (!tr || !tr.note) return '';
    if (!tr.date) return tr.note;
    return tr.note.split('this date').join(formatDate(tr.date));
  }

  function interpStops(val, stops){
    var capped = Math.min(Math.max(0, val), stops[stops.length-1][0]);
    for (var i = 0; i < stops.length - 1; i++){
      var t0 = stops[i][0], c0 = stops[i][1];
      var t1 = stops[i+1][0], c1 = stops[i+1][1];
      if (capped <= t1){
        var t = (capped - t0) / (t1 - t0);
        return [Math.round(lerp(c0[0],c1[0],t)),
                Math.round(lerp(c0[1],c1[1],t)),
                Math.round(lerp(c0[2],c1[2],t))];
      }
    }
    return stops[stops.length-1][1].slice();
  }

  function cellColor(v, mode){
    if (v === null || v === undefined) return NO_DATA_RGB.slice();
    if (mode === 'raw') return interpStops(v, RAW_STOPS);
    return v >= 0 ? interpStops(Math.abs(v), MORE_ICE_STOPS)
                  : interpStops(Math.abs(v), LESS_ICE_STOPS);
  }

  function rgbStr(rgb){ return 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')'; }
  function rgbHex(rgb){
    return '#' + rgb.map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
  }

  // Cool-side extremes go too dark to read as chip text on a dark surface.
  function readableRGB(rgb){
    var lum = 0.2126*rgb[0] + 0.7152*rgb[1] + 0.0722*rgb[2], MIN = 110;
    if (lum >= MIN) return rgb;
    var t = Math.min(1, (MIN - lum) / MIN);
    return rgb.map(function(c){ return Math.round(lerp(c, 255, t)); });
  }

  function wrapText(ctx, text, maxWidth){
    var words = text.split(' '), lines = [], cur = '';
    words.forEach(function(w){
      var test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
      else cur = test;
    });
    if (cur) lines.push(cur);
    return lines;
  }

  // ══════════════════════════════════════════════════════════════
  // COVERAGE MODEL
  // ══════════════════════════════════════════════════════════════

  // Real calendar date for a leap-indexed day slot, or null for the Feb 29
  // slot in a non-leap year.
  function slotDate(year, slot){
    var ref = new Date(Date.UTC(2000, 0, 1 + slot)); // 2000 is a leap year
    var mo = ref.getUTCMonth(), da = ref.getUTCDate();
    if (mo === 1 && da === 29 && !isLeap(year)) return null;
    return { m: mo, d: da };
  }

  // How many observations a month SHOULD have, given the sensor era.
  function expectedDays(year, m){
    var exp = 0;
    for (var s = MONTH_STARTS[m]; s < MONTH_STARTS[m+1]; s++){
      var dt = slotDate(year, s);
      if (!dt) continue;
      var beforeSMMREnd =
        year < SMMR_END_Y ||
        (year === SMMR_END_Y && (dt.m < SMMR_END_M ||
          (dt.m === SMMR_END_M && dt.d <= SMMR_END_D)));
      exp += beforeSMMREnd ? 0.5 : 1;
    }
    return exp;
  }

  // ══════════════════════════════════════════════════════════════
  // BUILD PER-HEMISPHERE GRID
  // ══════════════════════════════════════════════════════════════

  function rebuildForHemisphere(hemi){
    var yearsObj = STATE.data.hemispheres[hemi].years;
    var allYears = Object.keys(yearsObj).map(Number).sort(function(a,b){ return a-b; });
    var maxYear  = allYears[allYears.length-1];
    var topYear  = Math.max(maxYear, STATE.currentCalYear);

    // Pass 1 — per-month mean, day count and coverage flag.
    var grid = {};
    allYears.forEach(function(y){
      var daily = yearsObj[String(y)];
      var row = [];
      for (var m = 0; m < 12; m++){
        var slots = [], vals = [];
        for (var s = MONTH_STARTS[m]; s < MONTH_STARTS[m+1]; s++){
          if (daily[s] !== null && daily[s] !== undefined){ slots.push(s); vals.push(daily[s]); }
        }
        var exp = expectedDays(y, m);
        var mu  = vals.length ? Math.round(mean(vals)*1000)/1000 : null;
        row.push({
          v: mu,
          days: vals.length,
          expected: exp,
          slots: slots,
          partial: mu !== null && exp > 0 && (vals.length / exp) < COVERAGE_OK,
          anom: null
        });
      }
      grid[y] = row;
    });

    // Pass 2 — baseline. Complete months only: a gappy month inside the
    // baseline window would drag the normal toward whatever part of the
    // month happened to be observed.
    var baseFull = [];
    for (var m = 0; m < 12; m++){
      var vals = [];
      for (var by = STATE.baselineStart; by <= STATE.baselineEnd; by++){
        var c = grid[by] && grid[by][m];
        if (c && c.v !== null && !c.partial) vals.push(c.v);
      }
      baseFull.push(vals.length ? mean(vals) : null);
    }

    // Pass 3 — anomalies. An incomplete month is differenced against a
    // baseline restricted to the SAME day slots; extent moves within a month,
    // so a 21-day mean against a full-month normal is not a like-for-like
    // comparison and biases the anomaly by the within-month drift.
    allYears.forEach(function(y){
      grid[y].forEach(function(c, m){
        if (c.v === null) return;
        var b = c.partial ? baselineOnSlots(grid, m, c.slots) : baseFull[m];
        c.anom = (b === null) ? null : Math.round((c.v - b)*1000)/1000;
      });
    });

    // Columns, ascending, trailing empties trimmed.
    var cols = [];
    for (var y = FIRST_FULL_YEAR; y <= topYear; y++) cols.push(y);
    while (cols.length > 1){
      var last = cols[cols.length-1];
      var any = grid[last] && grid[last].some(function(c){ return c.v !== null; });
      if (any) break;
      cols.pop();
    }

    STATE.grid     = grid;
    STATE.baseFull = baseFull;
    STATE.colYears = cols;
    STATE.maxYear  = maxYear;
    STATE.latest   = findLatest(grid, cols);
  }

  function baselineOnSlots(grid, m, slots){
    var yearsObj = STATE.data.hemispheres[STATE.hemisphere].years;
    var vals = [];
    for (var by = STATE.baselineStart; by <= STATE.baselineEnd; by++){
      var daily = yearsObj[String(by)];
      if (!daily) continue;
      var got = [];
      for (var i = 0; i < slots.length; i++){
        var v = daily[slots[i]];
        if (v !== null && v !== undefined) got.push(v);
      }
      if (got.length >= slots.length * MATCH_MIN) vals.push(mean(got));
    }
    return vals.length ? mean(vals) : null;
  }

  function findLatest(grid, cols){
    for (var i = cols.length - 1; i >= 0; i--){
      var y = cols[i], row = grid[y];
      if (!row) continue;
      for (var m = 11; m >= 0; m--){
        if (row[m].v !== null) return { year: y, month: m, cell: row[m] };
      }
    }
    return null;
  }

  // ══════════════════════════════════════════════════════════════
  // RANKING
  // ══════════════════════════════════════════════════════════════

  // Rank the latest month against every other year. For an incomplete month
  // the comparison is built from the SAME day slots in every year, so a
  // part-month value is never ranked against full-month values.
  function rankLatest(){
    var L = STATE.latest;
    if (!L) return null;
    var yearsObj = STATE.data.hemispheres[STATE.hemisphere].years;
    var m = L.month, slots = L.cell.slots;
    var series = [];

    STATE.colYears.forEach(function(y){
      if (y === L.year) return;
      if (L.cell.partial){
        var daily = yearsObj[String(y)];
        if (!daily) return;
        var got = [];
        for (var i = 0; i < slots.length; i++){
          var v = daily[slots[i]];
          if (v !== null && v !== undefined) got.push(v);
        }
        if (got.length >= slots.length * MATCH_MIN) series.push({ y: y, v: mean(got) });
      } else {
        var c = STATE.grid[y] && STATE.grid[y][m];
        if (c && c.v !== null && !c.partial) series.push({ y: y, v: c.v });
      }
    });

    series.push({ y: L.year, v: L.cell.v });
    series.sort(function(a,b){ return a.v - b.v; });
    var rank = 0;
    for (var i = 0; i < series.length; i++){ if (series[i].y === L.year){ rank = i+1; break; } }

    // The record comes out of the SAME series, so all three chips are on one
    // footing — comparing a 21-day 2026 mean against a full-month record from
    // another year would put two different statistics side by side.
    var others = series.filter(function(s){ return s.y !== L.year; });
    return {
      rank: rank, n: series.length,
      matched: L.cell.partial,
      record: others.length ? others[0] : null
    };
  }

  // ══════════════════════════════════════════════════════════════
  // GRID DRAWING (shared by the on-screen canvas and the PNG export)
  // ══════════════════════════════════════════════════════════════

  function drawGrid(ctx, o){
    ctx.save();   // never leak textAlign/textBaseline/font back to the caller
    var x0 = o.x0, y0 = o.y0, cw = o.cw, ch = o.ch, labelW = o.labelW;
    var monFont  = o.monFont  || 13;
    var axisFont = o.axisFont || 12;
    var mode = STATE.mode;
    var cols = STATE.colYears;
    var gx = x0 + labelW, gy = y0;
    var gw = cols.length * cw, gh = 12 * ch;

    // ── Month labels (left gutter) ──
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'right';
    ctx.font = "600 " + monFont + "px 'Courier Prime', monospace";
    for (var r = 0; r < 12; r++){
      ctx.fillStyle = '#A6A499';
      ctx.fillText(MON_SHORT[r].toUpperCase(), x0 + labelW - 8, gy + r*ch + ch/2);
    }

    // ── Cells ──
    cols.forEach(function(year, ci){
      var cx = gx + ci*cw;
      var row = STATE.grid[year];
      for (var r = 0; r < 12; r++){
        var c = row ? row[r] : null;
        var val = !c ? null : (mode === 'raw' ? c.v : c.anom);
        var cy = gy + r*ch;
        ctx.fillStyle = rgbStr(cellColor(val, mode));
        // No horizontal gap — adjacent years butt together so each month row
        // reads as a continuous timeline. 1px vertical gap separates rows.
        ctx.fillRect(cx, cy, cw, ch - 1);

        if (c && c.v !== null && c.partial && cw >= 4){
          ctx.save();
          ctx.lineWidth = 1;
          ctx.setLineDash([1,2]);
          ctx.strokeStyle = 'rgba(232,228,217,0.7)';
          ctx.strokeRect(cx + 0.5, cy + 0.5, cw - 1, ch - 2);
          ctx.restore();
        }
      }
    });

    // ── Decade rules ──
    ctx.fillStyle = 'rgba(232,228,217,0.22)';
    cols.forEach(function(year, ci){
      if (year % 10 !== 0 || ci === 0) return;
      ctx.fillRect(Math.round(gx + ci*cw), gy, 1, gh);
    });

    // ── Current-year marker ──
    var curIdx = cols.indexOf(STATE.currentCalYear);
    if (curIdx >= 0){
      ctx.fillStyle = '#F5D742';
      ctx.fillRect(Math.round(gx + curIdx*cw), gy - 3, Math.max(2, cw), 3);
    }

    // ── Year axis ──
    var ay = gy + gh;
    var step = cw >= 20 ? 5 : 10;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    cols.forEach(function(year, ci){
      if (year % step !== 0) return;
      var cx = gx + ci*cw;
      ctx.fillStyle = 'rgba(232,228,217,0.28)';
      ctx.fillRect(Math.round(cx), ay + 1, 1, 5);
      ctx.fillStyle = (year === STATE.currentCalYear) ? '#F5D742' : '#A6A499';
      ctx.font = "600 " + axisFont + "px 'Courier Prime', monospace";
      ctx.fillText(String(year), cx, ay + 8);
    });

    ctx.restore();
  }

  // ══════════════════════════════════════════════════════════════
  // ON-SCREEN RENDER
  // ══════════════════════════════════════════════════════════════

  function gridW(){ return STATE.colYears.length * STATE.cellW; }
  function gridH(){ return 12 * CELL_H; }
  function canvasW(){ return LABEL_W + gridW(); }
  function canvasH(){ return GRID_TOP + gridH() + AXIS_H; }

  function computeCellW(){
    var avail = (document.body.clientWidth || 900) - 48 - LABEL_W - 2;
    var w = Math.floor(avail / Math.max(1, STATE.colYears.length));
    return Math.max(MIN_CELL_W, Math.min(MAX_CELL_W, w));
  }

  function sizeCanvas(canvas, w, h, scale){
    canvas.width  = Math.round(w*scale);
    canvas.height = Math.round(h*scale);
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    return ctx;
  }

  function renderHeatmap(){
    var W = canvasW(), H = canvasH();
    var ctx = sizeCanvas($('heatmapCanvas'), W, H, STATE.dpr);
    ctx.fillStyle = '#1E2320';
    ctx.fillRect(0, 0, W, H);
    drawGrid(ctx, { x0: 0, y0: GRID_TOP, cw: STATE.cellW, ch: CELL_H, labelW: LABEL_W });
    sizeCanvas($('hoverLayer'), W, H, STATE.dpr);
    drawHover();
  }

  function drawHover(){
    var ctx = $('hoverLayer').getContext('2d');
    ctx.clearRect(0, 0, canvasW(), canvasH());
    if (!STATE.hover) return;
    var x = LABEL_W + STATE.hover.col * STATE.cellW;
    var y = GRID_TOP + STATE.hover.row * CELL_H;
    ctx.save();
    ctx.strokeStyle = 'rgba(232,228,217,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(LABEL_W, y + CELL_H/2 - 0.5);
    ctx.lineTo(LABEL_W + gridW(), y + CELL_H/2 - 0.5);
    ctx.moveTo(x + STATE.cellW/2 - 0.5, GRID_TOP);
    ctx.lineTo(x + STATE.cellW/2 - 0.5, GRID_TOP + gridH());
    ctx.stroke();
    ctx.strokeStyle = '#E8E4D9';
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 1, y - 1, STATE.cellW + 2, CELL_H + 1);
    ctx.restore();
  }

  // ══════════════════════════════════════════════════════════════
  // LEGEND
  // ══════════════════════════════════════════════════════════════

  function renderLegend(){
    var mode = STATE.mode;
    var W = Math.max(420, gridW());
    var canvas = $('legendCanvas');
    var ctx = sizeCanvas(canvas, W, LEGEND_H, STATE.dpr);
    canvas.style.marginLeft = LABEL_W + 'px';

    var ticks = (mode === 'raw') ? RAW_TICKS : ANOMALY_TICKS;
    var grad = ctx.createLinearGradient(0, 0, W, 0);
    ticks.forEach(function(v){
      grad.addColorStop(mode === 'raw' ? v/20 : (v+3)/6, rgbStr(cellColor(v, mode)));
    });
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, LEGEND_H);

    var td = $('legendTicks');
    td.style.cssText = 'margin-left:' + LABEL_W + 'px;max-width:' + W + 'px';
    td.innerHTML = '';
    ticks.forEach(function(v){
      var sp = document.createElement('span');
      sp.className = 'legend-tick';
      sp.textContent = (v > 0 ? '+' : '') + v;
      td.appendChild(sp);
    });

    var bd = $('legendBands');
    bd.style.cssText = 'margin-left:' + LABEL_W + 'px;max-width:' + W + 'px';
    bd.innerHTML = (mode === 'raw') ? '' :
      '<span class="legend-band">Less ice \u2190</span>' +
      '<span class="legend-band">Near normal</span>' +
      '<span class="legend-band">\u2192 More ice</span>';

    $('legendTitle').textContent = (mode === 'raw')
      ? 'Monthly mean extent (million km\u00b2) \u00b7 fixed 0\u201320 scale'
      : 'Extent anomaly (million km\u00b2) vs. ' + STATE.baselineStart + '\u2013' + STATE.baselineEnd + ' average';
  }

  // ══════════════════════════════════════════════════════════════
  // CHIPS
  // ══════════════════════════════════════════════════════════════

  function updateChips(){
    var L = STATE.latest;
    if (!L){ $('chipRow').style.display = 'none'; return; }
    $('chipRow').style.display = '';

    var c = L.cell;
    $('chipLatestV').textContent = c.v.toFixed(2);
    $('chipLatestV').style.color = rgbHex(readableRGB(cellColor(
      STATE.mode === 'raw' ? c.v : c.anom, STATE.mode)));
    $('chipLatestP').textContent = MON_SHORT[L.month] + ' ' + L.year +
      (c.partial ? ' \u00b7 ' + c.days + ' of ' + Math.round(c.expected) + ' days' : '') +
      ' \u00b7 million km\u00b2';

    var rk = rankLatest();
    STATE.rank = rk;
    if (rk){
      // Flip the framing once a value sits in the upper half — "44th lowest
      // of 48" is technically true but nobody reads it that way.
      var fromTop = rk.n - rk.rank + 1;
      var low = rk.rank <= rk.n/2;
      $('chipRankV').textContent = ordinal(low ? rk.rank : fromTop) + (low ? ' lowest' : ' highest');
      $('chipRankV').style.color = low ? '#e1873a' : '#7fb2e8';
      $('chipRankP').textContent = 'of ' + rk.n + ' years \u00b7 ' +
        (c.partial ? MON_SHORT[L.month] + ' 1\u2013' + lastDayOfSlots(L.year, c.slots) + ' only'
                   : 'full ' + MON_FULL[L.month]);
    }

    var rec = rk && rk.record;
    if (rec){
      $('chipRecL').textContent = 'Lowest On Record \u00b7 ' + MON_SHORT[L.month];
      $('chipRecV').textContent = rec.v.toFixed(2);
      $('chipRecV').style.color = '#e1873a';
      $('chipRecP').textContent = rec.y + ' \u00b7 ' +
        (rk.matched ? 'same days' : 'full month') + ' \u00b7 excludes ' + L.year;
    }
  }

  function lastDayOfSlots(year, slots){
    if (!slots.length) return 0;
    var dt = slotDate(year, slots[slots.length-1]);
    return dt ? dt.d : 0;
  }

  // ══════════════════════════════════════════════════════════════
  // TOOLTIP (pointer events — mouse, pen and touch)
  // ══════════════════════════════════════════════════════════════

  function hitTest(clientX, clientY){
    var rect = $('heatmapCanvas').getBoundingClientRect();
    var col = Math.floor((clientX - rect.left - LABEL_W) / STATE.cellW);
    var row = Math.floor((clientY - rect.top - GRID_TOP) / CELL_H);
    if (col < 0 || col >= STATE.colYears.length || row < 0 || row >= 12) return null;
    return { col: col, row: row };
  }

  function showTooltip(hit, clientX, clientY, lift){
    var tooltip = $('tooltip');
    var year = STATE.colYears[hit.col], m = hit.row;
    var c = (STATE.grid[year] || [])[m];

    tooltip.querySelector('.tt-period').textContent = MON_FULL[m] + ' ' + year;
    var ttv = tooltip.querySelector('.tt-value');
    var tts = tooltip.querySelector('.tt-sub');
    var badge = tooltip.querySelector('.tt-badge');

    if (!c || c.v === null){
      ttv.textContent = 'No data';
      ttv.style.color = '#948F82';
      tts.textContent = '';
      badge.style.display = 'none';
    } else {
      ttv.textContent = c.v.toFixed(2) + ' M km\u00b2';
      ttv.style.color = rgbHex(cellColor(STATE.mode === 'raw' ? c.v : c.anom, STATE.mode));
      tts.textContent = (c.anom !== null)
        ? ((c.anom > 0 ? '+' : '') + c.anom.toFixed(2) + ' vs. ' +
           STATE.baselineStart + '\u2013' + STATE.baselineEnd +
           (c.partial ? ' (same days)' : ''))
        : '';
      badge.style.display = c.partial ? 'inline-block' : 'none';
      badge.textContent = c.days + ' of ' + Math.round(c.expected) + ' days';
    }

    tooltip.classList.add('visible');
    var tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    var tx = clientX + 14;
    var ty = lift ? clientY - th - 24 : clientY - 10;
    if (tx + tw > window.innerWidth) tx = clientX - tw - 14;
    if (tx < 4) tx = 4;
    if (ty + th > window.innerHeight) ty = clientY - th - 10;
    if (ty < 4) ty = clientY + 24;
    tooltip.style.left = tx + 'px';
    tooltip.style.top  = ty + 'px';
  }

  function hideTooltip(){
    $('tooltip').classList.remove('visible');
    STATE.hover = null;
    STATE.pinned = false;
    drawHover();
  }

  function setupTooltip(){
    var canvas = $('heatmapCanvas');

    canvas.addEventListener('pointermove', function(e){
      if (e.pointerType !== 'mouse' && !STATE.pinned) return;
      var hit = hitTest(e.clientX, e.clientY);
      if (!hit){ if (e.pointerType === 'mouse') hideTooltip(); return; }
      if (!STATE.hover || STATE.hover.col !== hit.col || STATE.hover.row !== hit.row){
        STATE.hover = hit; drawHover();
      }
      showTooltip(hit, e.clientX, e.clientY, e.pointerType !== 'mouse');
    });

    canvas.addEventListener('pointerdown', function(e){
      var hit = hitTest(e.clientX, e.clientY);
      if (!hit){ hideTooltip(); return; }
      STATE.hover = hit;
      STATE.pinned = e.pointerType !== 'mouse';
      drawHover();
      showTooltip(hit, e.clientX, e.clientY, e.pointerType !== 'mouse');
    });

    canvas.addEventListener('pointerleave', function(e){
      if (e.pointerType === 'mouse') hideTooltip();
    });

    document.addEventListener('pointerdown', function(e){
      if (STATE.pinned && e.target !== canvas) hideTooltip();
    }, true);
  }

  // ══════════════════════════════════════════════════════════════
  // NOTES
  // ══════════════════════════════════════════════════════════════

  function updateModeNote(){
    $('modeNote').textContent = MODE_NOTES[STATE.mode].replace(
      'BASELINE', STATE.baselineStart + '\u2013' + STATE.baselineEnd);
  }

  function updateCoverageNote(){
    var n = 0, worst = null;
    STATE.colYears.forEach(function(y){
      (STATE.grid[y] || []).forEach(function(c, m){
        if (c.v !== null && c.partial){
          n++;
          if (!worst || (c.days/c.expected) < (worst.days/worst.expected))
            worst = { days: c.days, expected: c.expected, y: y, m: m };
        }
      });
    });
    $('coverageNote').innerHTML = !n ? '' :
      n + ' month' + (n === 1 ? '' : 's') + ' in this hemisphere have incomplete coverage and are ' +
      'marked with a dotted outline (sparsest: ' + MON_SHORT[worst.m] + ' ' + worst.y + ', ' +
      worst.days + ' of ' + Math.round(worst.expected) + ' days). Their anomalies and rankings ' +
      'are computed against the same calendar days in every other year, not against full-month ' +
      'averages. Every-other-day sampling before 20 Aug 1987 is expected, not flagged.<br>';
  }

  function updateFreshness(){
    var j = STATE.data;
    var age = daysSince(j.updated_through);
    var stale = age !== null && age > STALE_DAYS;
    var el = $('freshness');
    el.classList.toggle('stale', stale);
    el.textContent =
      'Data current through ' + formatDate(j.updated_through) +
      (age !== null ? ' (' + age + ' days ago)' : '') +
      ' \u00b7 ' + j.source +
      ' \u00b7 anomalies vs. ' + STATE.baselineStart + '\u2013' + STATE.baselineEnd + ' average' +
      (stale ? ' \u2014 \u26a0 the data file has not refreshed in ' + age +
               ' days; check the update workflow.' : '');
  }

  // ══════════════════════════════════════════════════════════════
  // RENDER PIPELINE
  // ══════════════════════════════════════════════════════════════

  function relayout(){
    STATE.cellW = computeCellW();
    renderHeatmap();
    renderLegend();
    var outer = $('chartOuter');
    if (outer.scrollWidth > outer.clientWidth + 1) outer.scrollLeft = outer.scrollWidth;
  }

  function renderAll(){
    relayout();
    updateChips();
    updateModeNote();
    updateCoverageNote();
  }

  // ══════════════════════════════════════════════════════════════
  // PNG EXPORT (fixed multiplier — never derived from devicePixelRatio)
  // ══════════════════════════════════════════════════════════════

  function downloadHeatmapPNG(){
    var PAD = 32, EX_CW = 22, EX_CH = 32, EX_LABEL = 56, EX_AXIS = 26;
    var cols = STATE.colYears;
    var gw = cols.length * EX_CW, gh = 12 * EX_CH;
    var HEADER_H = 116;
    var totalW = PAD*2 + EX_LABEL + gw;

    var measure = document.createElement('canvas').getContext('2d');
    measure.font = "400 14px 'Courier Prime', monospace";
    var footText = ($('footnote').textContent + ' ' + $('coverageNote').textContent).trim();
    var footLines = footText ? wrapText(measure, footText, gw) : [];
    var citeText  = ($('citation').textContent || '').trim();
    var citeLines = citeText ? wrapText(measure, citeText, gw) : [];

    var LEG_BLOCK = 86, STAT_BLOCK = 86, LINE_H = 21;
    var totalH = PAD + HEADER_H + gh + EX_AXIS + 30 + LEG_BLOCK + STAT_BLOCK
               + footLines.length*LINE_H + citeLines.length*LINE_H + 40 + PAD;

    var canvas = document.createElement('canvas');
    canvas.width  = Math.round(totalW * EXPORT_SCALE);
    canvas.height = Math.round(totalH * EXPORT_SCALE);
    var ctx = canvas.getContext('2d');
    ctx.setTransform(EXPORT_SCALE, 0, 0, EXPORT_SCALE, 0, 0);

    ctx.fillStyle = '#1E2320';
    ctx.fillRect(0, 0, totalW, totalH);

    var x = PAD, y = PAD;
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    ctx.fillStyle = '#948F82';
    ctx.font = "500 13px 'Courier Prime', monospace";
    ctx.fillText('CLIMATOLOGY HEATMAPS', x, y); y += 22;

    ctx.fillStyle = '#E8E4D9';
    ctx.font = "700 30px 'Zilla Slab', serif";
    ctx.fillText('Sea Ice Extent Heatmap', x, y); y += 40;

    ctx.fillStyle = '#A6A499';
    ctx.font = "500 15px 'Public Sans', sans-serif";
    ctx.fillText(
      (STATE.hemisphere === 'N' ? 'Arctic' : 'Antarctic') + ' \u00b7 ' +
      (STATE.mode === 'raw'
        ? 'Monthly mean extent, fixed 0\u201320 M km\u00b2 scale'
        : 'Anomaly vs. ' + STATE.baselineStart + '\u2013' + STATE.baselineEnd + ' average') +
      ' \u00b7 ' + cols[0] + '\u2013' + cols[cols.length-1] +
      ' \u00b7 through ' + formatDate(STATE.data.updated_through), x, y);

    y = PAD + HEADER_H;
    drawGrid(ctx, { x0: PAD, y0: y, cw: EX_CW, ch: EX_CH,
                    labelW: EX_LABEL, monFont: 14, axisFont: 13 });
    y += gh + EX_AXIS + 34;

    // Legend
    var legX = PAD + EX_LABEL, legW = Math.min(gw, 760);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#948F82';
    ctx.font = "500 13px 'Courier Prime', monospace";
    ctx.fillText(($('legendTitle').textContent || '').toUpperCase(), legX, y - 20);

    var ticks = (STATE.mode === 'raw') ? RAW_TICKS : ANOMALY_TICKS;
    var grad = ctx.createLinearGradient(legX, 0, legX + legW, 0);
    ticks.forEach(function(v){
      grad.addColorStop(STATE.mode === 'raw' ? v/20 : (v+3)/6, rgbStr(cellColor(v, STATE.mode)));
    });
    ctx.fillStyle = grad;
    ctx.fillRect(legX, y, legW, 18);

    ctx.fillStyle = '#A6A499';
    ctx.font = "400 13px 'Courier Prime', monospace";
    ctx.textAlign = 'center';
    ticks.forEach(function(v){
      var t = (STATE.mode === 'raw') ? v/20 : (v+3)/6;
      ctx.fillText((v > 0 ? '+' : '') + v, legX + t*legW, y + 24);
    });
    ctx.textAlign = 'left';
    y += LEG_BLOCK;

    // Stat line
    ctx.fillStyle = '#948F82';
    ctx.font = "500 13px 'Courier Prime', monospace";
    ctx.fillText('LATEST \u00b7 STANDING \u00b7 RECORD', PAD, y); y += 22;
    ctx.fillStyle = '#F5D742';
    ctx.font = "700 26px 'Zilla Slab', serif";
    ctx.fillText(
      $('chipLatestV').textContent + '  \u00b7  ' +
      $('chipRankV').textContent + '  \u00b7  ' +
      $('chipRecV').textContent +
        (STATE.rank && STATE.rank.record ? ' (' + STATE.rank.record.y + ')' : ''),
      PAD, y);
    y += 34;
    ctx.fillStyle = '#A6A499';
    ctx.font = "400 14px 'Public Sans', sans-serif";
    ctx.fillText($('chipLatestP').textContent + '  \u00b7  ' + $('chipRankP').textContent, PAD, y);
    y += 30;

    ctx.strokeStyle = 'rgba(232,228,217,0.14)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD, y + 0.5); ctx.lineTo(totalW - PAD, y + 0.5); ctx.stroke();
    y += 18;

    ctx.fillStyle = '#948F82';
    ctx.font = "400 14px 'Courier Prime', monospace";
    footLines.forEach(function(line){ ctx.fillText(line, PAD, y); y += LINE_H; });
    citeLines.forEach(function(line){ ctx.fillText(line, PAD, y); y += LINE_H; });
    y += 8;

    ctx.fillStyle = '#D08425';
    ctx.font = "500 14px 'Courier Prime', monospace";
    ctx.fillText('contextclimate.io \u00b7 Sea Ice Extent Heatmap', PAD, y);

    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'seaice-heatmap-' + (STATE.hemisphere === 'N' ? 'arctic' : 'antarctic') +
        '-' + STATE.mode + '-' + (STATE.data.updated_through || '') + '.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    }, 'image/png');
  }

  // ══════════════════════════════════════════════════════════════
  // WIRING
  // ══════════════════════════════════════════════════════════════

  $('hemiToggle').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-hemi]');
    if (!btn || btn.dataset.hemi === STATE.hemisphere) return;
    STATE.hemisphere = btn.dataset.hemi;
    this.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('is-active', b.dataset.hemi === STATE.hemisphere);
    });
    hideTooltip();
    rebuildForHemisphere(STATE.hemisphere);
    renderAll();
  });

  $('modeToggle').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-mode]');
    if (!btn || btn.dataset.mode === STATE.mode) return;
    STATE.mode = btn.dataset.mode;
    this.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('is-active', b.dataset.mode === STATE.mode);
    });
    hideTooltip();
    renderHeatmap();
    renderLegend();
    updateChips();
    updateModeNote();
  });

  $('downloadBtn').addEventListener('click', function(){
    var btn = this, original = btn.textContent;
    btn.textContent = 'Rendering\u2026';
    btn.disabled = true;
    var done = function(){ btn.textContent = original; btn.disabled = false; };
    var go = function(){
      try { downloadHeatmapPNG(); } catch (err){ console.error('PNG export failed', err); }
      done();
    };
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function(){
    STATE.dpr = window.devicePixelRatio || 1;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){ hideTooltip(); relayout(); }, 120);
  });

  // ══════════════════════════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════════════════════════

  fetch('seaice-extent.json').then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(json){
    STATE.data = json;

    var bp = (json.baseline_period || '1991-2020').match(/(\d{4}).*?(\d{4})/);
    if (bp){ STATE.baselineStart = Number(bp[1]); STATE.baselineEnd = Number(bp[2]); }

    rebuildForHemisphere(STATE.hemisphere);

    updateFreshness();
    $('footnote').innerHTML = formatTransitionNote(json.sensor_transition) +
      ' Heatmap begins in ' + FIRST_FULL_YEAR + ', the first complete year of the satellite ' +
      'record (which starts October ' + (FIRST_FULL_YEAR - 1) + ').<br>';
    $('citation').textContent = json.citation || '';

    $('chartStatus').style.display = 'none';
    $('chartInner').style.display = '';

    renderAll();
    setupTooltip();
  }).catch(function(err){
    $('chartStatus').innerHTML =
      '<div class="loading-spinner" style="border-top-color:#e05252"></div>' +
      '<span style="color:#e05252">Could not load sea ice data</span>' +
      '<span style="font-family:var(--font-body);font-size:13px;max-width:420px;text-align:center">' +
      'Make sure <code>seaice-extent.json</code> sits alongside this file in <code>public/</code>.</span>';
    console.error('seaice-extent.json load failed:', err);
  });

})();
</script>
</body>
</html>
