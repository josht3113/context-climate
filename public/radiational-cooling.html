<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiational Cooling</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-hourly); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; }
.top .spacer { flex: 1; min-width: 0; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.units .cc-segmented-btn { padding: 8px 13px; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.pmenu.open { display: flex; }
.pmenu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; }
.pmenu button:hover { background: var(--color-surface); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #151A19; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.chip { position: absolute; display: none; z-index: 2; }
.chip .cc-segmented-btn { padding: 6px 12px; font-size: 12px; }
.chip.speed { align-items: center; gap: 10px; padding: 5px 12px; background: rgba(30,35,32,0.92); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
.chip.speed label { font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.chip.speed input { width: 110px; accent-color: var(--tool-accent); height: 18px; margin: 0; cursor: pointer; }
.chip.small .cc-btn { padding: 4px 10px; font-size: 13px; background: rgba(30,35,32,0.92); }

/* controls */
.controls { border-top: 1px solid var(--color-border); background: var(--color-surface); padding: 6px 10px 6px; display: grid;
  grid-template-columns: 112px minmax(0, 1fr); column-gap: 10px; row-gap: 6px; }
.rowA { grid-column: 1 / 3; display: flex; gap: 6px; align-items: stretch; min-width: 0; }
.rowA .lab { font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary);
  display: flex; align-items: center; width: 112px; flex: none; justify-content: flex-end; padding-right: 4px; text-align: right; line-height: 1.15; }
.vsnaps { flex: 1; display: grid; gap: 6px; min-width: 0; }
.vsnap { display: flex; align-items: center; gap: 9px; padding: 5px 10px; min-width: 0; text-align: left; }
.vsnap .ic { width: 28px; height: 28px; flex: none; display: flex; align-items: center; justify-content: center; }
.vsnap .ic svg { width: 26px; height: 26px; }
.vsnap .tx { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.vsnap .n { font-family: var(--font-body); font-weight: 600; font-size: 15px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vsnap .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.15; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vsnap.is-active { background: var(--color-surface-2); border-color: var(--tool-accent); box-shadow: inset 0 0 0 1px var(--tool-accent); }
.vsnap.is-active .ic svg circle, .vsnap.is-active .ic svg path { }
.hseg { display: flex; flex-direction: column; flex: none; }
.hseg .cc-segmented-btn { flex: 1; padding: 4px 14px; font-size: 12px; line-height: 1.15; border-right: none; border-bottom: 1px solid var(--color-border); text-align: center; }
.hseg .cc-segmented-btn:last-child { border-bottom: none; }
.hseg .cc-segmented-btn span { display: block; font-size: 11px; letter-spacing: .04em; font-weight: 500; opacity: .9; text-transform: none; }
.play { grid-column: 1; grid-row: span 2; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); line-height: 1.1; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 20px; }
.tsnaps { grid-column: 2; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.tsnap { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px; min-width: 0; }
.tsnap .n { font-family: var(--font-body); font-weight: 600; font-size: 15px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; }
.tsnap .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.1; color: var(--color-text-secondary); white-space: nowrap; }
.tsnap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.tsnap.is-active .n, .tsnap.is-active .v { color: var(--color-bg); }
.slw { grid-column: 2; }
.slw input { width: 100%; margin: 0; accent-color: var(--tool-accent); height: 20px; cursor: pointer; display: block; }
.nightbtn { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 6px 12px; min-width: 0; }
.nightbtn .n { font-family: var(--font-body); font-weight: 600; font-size: 15px; color: var(--color-text-primary); white-space: nowrap; }
.nightbtn .v { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.nightbtn.is-active { background: var(--color-surface-2); border-color: var(--tool-accent); box-shadow: inset 0 0 0 1px var(--tool-accent); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.card .v.big { font-size: 34px; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 4px; }
.card .v.sm { font-size: 20px; }
.card .bud { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 6px; }
.card .bl { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; align-items: baseline; }
.card .bl .k { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .bl .q { font-family: var(--font-display); font-weight: 700; font-size: 19px; color: var(--color-text-primary); white-space: nowrap; }
.card .bl .q small { font-family: var(--font-body); font-weight: 500; font-size: 13px; color: var(--color-text-secondary); margin-left: 3px; }
.card .bar { grid-column: 1 / 3; height: 9px; border-radius: 2px; background: var(--color-surface-2); overflow: hidden; margin-top: 3px; }
.card .bar i { display: block; height: 100%; border-radius: 2px; }
.card .gr { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 8px; align-items: center; padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .gr i { width: 12px; height: 12px; border-radius: 2px; }
.card .gr .k { font-family: var(--font-body); font-weight: 600; font-size: 15px; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .gr .k small { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 12px; color: var(--color-text-secondary); }
.card .gr .q { font-family: var(--font-display); font-weight: 700; font-size: 23px; color: var(--color-text-primary); white-space: nowrap; }
.card .sky { display: flex; align-items: center; gap: 10px; }
.card .sky svg { width: 30px; height: 30px; flex: none; }
.card canvas.mini { width: 100%; height: 170px; display: block; margin: 6px 0 2px; }
.card .clr { align-self: flex-start; margin-top: 6px; padding: 4px 10px; font-size: 13px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 720px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .v.big { font-size: 29px; }
  .card .v.sm { font-size: 18px; }
  .card .bud { padding: 5px 0 4px; gap: 4px; }
  .card .gr { padding: 5px 0 4px; }
  .card canvas.mini { height: 140px; }
  .vsnap { padding: 3px 9px; }
  .vsnap .ic { width: 24px; height: 24px; } .vsnap .ic svg { width: 22px; height: 22px; }
  .tsnap { flex-direction: row; justify-content: center; gap: 6px; padding: 4px 2px; }
  .nightbtn { flex-direction: row; align-items: baseline; gap: 10px; padding: 5px 12px; }
  .hseg .cc-segmented-btn { padding: 2px 12px; }
}
@media (max-height: 640px) {
  .card .src { display: none; }
  .card canvas.mini { height: 120px; }
  .vsnap .v { display: none; }
  .hseg .cc-segmented-btn span { display: inline; margin-left: 4px; }
  .controls { row-gap: 4px; padding: 4px 10px; }
  .play { flex-direction: row; gap: 6px; font-size: 15px; }
}
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 16px; } }
@media (max-width: 1366px) {
  .main { grid-template-columns: minmax(0, 1fr) 272px; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .top { gap: 10px; }
  .top h1 { font-size: 22px; }
  .card { padding: 10px 13px; }
  .card .v { font-size: 22px; }
  .card .v.big { font-size: 29px; }
  .exp .cc-btn { padding: 6px 9px; }
  .units .cc-segmented-btn { padding: 8px 10px; }
  .vsnap .ic { display: none; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .tabs .cc-segmented-btn { padding: 11px 12px; }
  .controls { grid-template-columns: 96px minmax(0, 1fr); }
  .rowA .lab { width: 96px; }
  .vsnap { padding: 5px 7px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Radiational Cooling</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="clouds">Clouds</button>
      <button class="cc-segmented-btn" data-tab="wind">Wind</button>
      <button class="cc-segmented-btn" data-tab="li">Long Island</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="cc-segmented units" id="units">
      <button class="cc-segmented-btn" data-u="metric">Metric</button>
      <button class="cc-segmented-btn is-active" data-u="us">US</button>
    </div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="pmenu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chip" id="chipView"><div class="cc-segmented" id="viewSeg">
          <button class="cc-segmented-btn is-active" data-v="vis">Visible</button>
          <button class="cc-segmented-btn" data-v="ir">Infrared</button>
        </div></div>
        <div class="chip speed" id="chipSpeed"><label for="irSpeed">Arrow speed</label><input type="range" id="irSpeed" min="0.08" max="1" step="0.01" value="0.3" aria-label="Infrared arrow speed"></div>
        <div class="chip" id="chipLi"><div class="cc-segmented" id="liSeg">
          <button class="cc-segmented-btn is-active" data-v="stations">Stations</button>
          <button class="cc-segmented-btn" data-v="ground">Ground</button>
        </div></div>
        <div class="chip small" id="chipClear"><button class="cc-btn" id="bClear">Clear traces</button></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
