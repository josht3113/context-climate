<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planetary Retrograde — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }

html,body{height:100%}
body{
  margin:0;padding:8px 14px 10px;
  height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;gap:7px;
}

/* ── header ─────────────────────────────────────── */
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;flex:0 0 auto}
.bar .ttl{display:flex;align-items:baseline;gap:12px;min-width:0}
.bar .cc-title{font-size:22px;margin:0;white-space:nowrap}
.bar .cc-eyebrow{font-size:11px;white-space:nowrap}
.bar .sub{font-size:13px;color:var(--color-text-muted);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

.steps{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.step{display:flex;align-items:center;gap:6px;background:none;border:none;
  cursor:pointer;padding:3px 6px;border-radius:var(--radius-md)}
.step:hover{background:var(--color-surface)}
.step:focus-visible{outline:2px solid var(--tool-accent);outline-offset:1px}
.step-dot{width:9px;height:9px;border-radius:50%;background:var(--color-surface-2);
  border:1.5px solid var(--color-border);transition:all .3s;flex:0 0 auto}
.step-dot.active{background:var(--tool-accent);border-color:var(--tool-accent)}
.step-dot.done{background:rgba(60,163,174,.3);border-color:rgba(60,163,174,.45)}
.step-lbl{font-family:var(--font-mono);font-size:12px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-muted);
  white-space:nowrap;transition:color .3s}
.step-lbl.active{color:var(--tool-accent)}
.step-sep{width:16px;height:1px;background:var(--color-border);flex:0 0 auto}

/* ── canvas stage ───────────────────────────────── */
.stage{flex:1 1 auto;min-height:0;position:relative}
#mc{display:block;width:100%;height:100%;border:1px solid var(--color-border-hover);
  border-radius:var(--radius-md);background:#0A0D14}

/* ── readouts ───────────────────────────────────── */
.reads{display:flex;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.read{background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-md);padding:4px 12px;display:flex;
  align-items:baseline;gap:8px;min-width:0}
.read-l{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--color-text-muted);white-space:nowrap}
.read-v{font-family:var(--font-mono);font-size:16px;font-weight:700;
  color:var(--color-text-primary);white-space:nowrap}

/* ── timeline ───────────────────────────────────── */
.tl{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.tl input[type=range]{flex:1 1 auto;height:5px;border-radius:3px;cursor:pointer;
  -webkit-appearance:none;appearance:none;background:var(--color-surface-2);
  border:1px solid var(--color-border);outline:none;min-width:80px}
.tl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
  width:16px;height:16px;border-radius:50%;background:var(--tool-accent);
  cursor:pointer;border:2px solid var(--color-bg)}
.tl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
  background:var(--tool-accent);cursor:pointer;border:2px solid var(--color-bg)}
.tl input[type=range]:focus-visible{outline:2px solid var(--tool-accent);outline-offset:2px}
.tl-date{font-family:var(--font-mono);font-size:16px;font-weight:700;
  color:var(--color-text-primary);min-width:118px;text-align:right}

/* ── controls / nav ─────────────────────────────── */
.ctrls{display:flex;align-items:center;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.note{font-family:var(--font-body);font-size:13px;color:var(--color-text-secondary);
  margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}

@media (max-width:900px){
  .bar .sub{display:none}
  .step-lbl{display:none}
  .step-sep{width:10px}
}
@media (max-height:620px){
  .bar .cc-eyebrow,.bar .sub{display:none}
  .bar .cc-title{font-size:18px}
}
</style>
</head>
<body>

<div class="bar">
  <div class="ttl">
    <p class="cc-eyebrow">Astronomy · ESS1</p>
    <h1 class="cc-title">Planetary Retrograde</h1>
    <span class="sub" id="subLine"></span>
  </div>
  <div class="steps" id="steps"></div>
</div>

<div class="stage"><canvas id="mc"></canvas></div>

<div class="reads" id="reads"></div>

<div class="tl">
  <button class="cc-btn cc-btn-sm" id="playBtn">&#9208; Pause</button>
  <input type="range" id="scrub" min="0" max="1000" value="500" step="1" aria-label="Time">
  <span class="tl-date" id="dateOut"></span>
</div>

<div class="ctrls" id="ctrls"></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════
   CONSTANTS
   Orbital elements: mean values, circular-orbit model.
   Opposition dates verified against in-the-sky.org / EarthSky.
   ══════════════════════════════════════════════════════════════ */
const EP = 365.256, WE = 2*Math.PI/EP, AU = 1;
/* Each planet's phase is set so that opposition (d = 0) lands at the real
   ecliptic longitude of that opposition, to ~2 deg (the Sun's true longitude
   varies from the mean because Earth's orbit is not quite circular). */

const PL = {
  mars:{
    name:'Mars', color:'#E8603C', rgb:[232,96,60],
    a:1.523679, period:686.980, inc:1.850*Math.PI/180, syn:779.94,
    opp:'2027-02-19', oppLabel:'19 Feb 2027', ph:151.4*Math.PI/180,
    node:49.58*Math.PI/180,
    cadence:7, latGrid:1
  },
  jupiter:{
    name:'Jupiter', color:'#D6B98C', rgb:[214,185,140],
    a:5.20440, period:4332.59, inc:1.303*Math.PI/180, syn:398.88,
    opp:'2027-02-11', oppLabel:'11 Feb 2027', ph:143.5*Math.PI/180,
    node:100.46*Math.PI/180,
    cadence:14, latGrid:0.5
  },
  saturn:{
    name:'Saturn', color:'#E0C68A', rgb:[224,198,138],
    a:9.58260, period:10759.22, inc:2.485*Math.PI/180, syn:378.09,
    opp:'2026-10-04', oppLabel:'4 Oct 2026', ph:15.1*Math.PI/180,
    node:113.66*Math.PI/180,
    cadence:21, latGrid:1
  }
};
const PKEYS = ['mars','jupiter','saturn'];

const LON_HALF = 35;      // strip half-window, degrees of longitude (shared)
const CMP_HALF = 14;      // compare-mode half-window (shared)

const SKY_BG    = '#0A0D14';   // night sky — content colour, not a theme token
const PANEL_BG  = '#0D1119';
const TXT_HI    = 'rgba(255,255,255,0.88)';
const TXT_MD    = 'rgba(255,255,255,0.62)';
const TXT_LO    = 'rgba(255,255,255,0.42)';
const GRID      = 'rgba(255,255,255,0.09)';
const GRID_0    = 'rgba(255,255,255,0.20)';
const EARTH_C   = '#3CA3AE';
const SUN_C     = '#E8C05A';

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ══════════════════════════════════════════════════════════════
   UTILS
   ══════════════════════════════════════════════════════════════ */
function adiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;}
function clamp(v,lo,hi){return v<lo?lo:v>hi?hi:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function fmtDate(key,d){
  const base=new Date(PL[key].opp+'T00:00:00Z');
  const t=new Date(base.getTime()+Math.round(d)*86400000);
  return t.getUTCDate()+' '+MONTHS[t.getUTCMonth()]+' '+t.getUTCFullYear();
}

/* ══════════════════════════════════════════════════════════════
   ASTRONOMY
   Heliocentric circular orbits; planet orbit inclined by `inc`,
   Earth's orbit defines the ecliptic plane (z = 0).
   Opposition at d = 0: Earth and planet share heliocentric longitude.
   ══════════════════════════════════════════════════════════════ */
/* Heliocentric ecliptic longitude of a point at argument-of-latitude u
   on an orbit with inclination `inc` and ascending node `node`. */
function helioLon(p,u){
  return p.node + Math.atan2(Math.sin(u)*Math.cos(p.inc), Math.cos(u));
}
/* Argument of latitude that places the planet at longitude p.ph (opposition). */
function solveU0(p){
  let u=p.ph-p.node;
  for(let k=0;k<60;k++){
    const f=adiff(helioLon(p,u),p.ph);
    if(Math.abs(f)<1e-13) break;
    const h=1e-6;
    const df=adiff(helioLon(p,u+h),helioLon(p,u-h))/(2*h);
    u-=f/df;
  }
  return u;
}
PKEYS.forEach(k=>{PL[k].u0=solveU0(PL[k]);});

function bodies(key,d){
  const p=PL[key], wP=2*Math.PI/p.period;
  const u=p.u0+wP*d, lamE=p.ph+WE*d;
  const cu=Math.cos(u), su=Math.sin(u);
  const ci=Math.cos(p.inc), si=Math.sin(p.inc);
  const cO=Math.cos(p.node), sO=Math.sin(p.node);
  return {
    E:{x:AU*Math.cos(lamE), y:AU*Math.sin(lamE)},
    P:{x:p.a*(cO*cu - sO*su*ci), y:p.a*(sO*cu + cO*su*ci), z:p.a*su*si}
  };
}
function geo(key,d){
  const {E,P}=bodies(key,d);
  const dx=P.x-E.x, dy=P.y-E.y, dz=P.z;
  const dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
  return {lon:Math.atan2(dy,dx), lat:Math.asin(dz/dist)*180/Math.PI, dist, E, P};
}

/* Pre-computed path table over one synodic period centred on opposition.
   `u` = unwrapped ecliptic longitude in degrees, measured from opposition. */
const TAB = {};
function buildTable(key){
  const p=PL[key], step=0.5;
  const D0=-Math.round(p.syn/2), D1=Math.round(p.syn/2);
  const rows=[]; let prev=null, u=0;
  for(let d=D0; d<=D1+1e-9; d+=step){
    const g=geo(key,d);
    if(prev!==null) u+=adiff(g.lon,prev)*180/Math.PI;
    prev=g.lon;
    rows.push({d, u, lat:g.lat, dist:g.dist, lon:g.lon});
  }
  let i0=0, best=Infinity;
  rows.forEach((r,i)=>{const a=Math.abs(r.d); if(a<best){best=a;i0=i;}});
  const u0=rows[i0].u, lon0=rows[i0].lon;
  rows.forEach(r=>{r.u-=u0;});
  rows[0].retro=false;
  for(let i=1;i<rows.length;i++) rows[i].retro = rows[i].u < rows[i-1].u;

  const rp=rows.filter(r=>r.retro);
  const us=rp.map(r=>r.u);
  const dists=rows.map(r=>r.dist);
  TAB[key]={
    rows, D0, D1, step, lon0,
    s1:rp.length?rp[0].d:0, s2:rp.length?rp[rp.length-1].d:0,
    arc:rp.length?(Math.max(...us)-Math.min(...us)):0,
    dur:rp.length?(rp[rp.length-1].d-rp[0].d):0,
    W0:0, W1:0,
    dMin:Math.min(...dists), dMax:Math.max(...dists),
    uMin:Math.min(...rows.map(r=>r.u)), uMax:Math.max(...rows.map(r=>r.u)),
    latMax:Math.max(...rows.map(r=>Math.abs(r.lat)))
  };
  PL[key].latHalf = Math.max(0.6, TAB[key].latMax*1.30);
  /* Scrub only over the stretch where the planet is actually inside the
     +-LON_HALF sky window; outside it the strip would be blank. */
  const inWin=rows.filter(r=>Math.abs(r.u)<=LON_HALF);
  TAB[key].W0 = inWin.length?inWin[0].d:D0;
  TAB[key].W1 = inWin.length?inWin[inWin.length-1].d:D1;
}
PKEYS.forEach(buildTable);

function at(key,d){
  const T=TAB[key];
  const f=clamp((d-T.D0)/T.step, 0, T.rows.length-1);
  const i=Math.floor(f), j=Math.min(i+1,T.rows.length-1), t=f-i;
  const a=T.rows[i], b=T.rows[j];
  return {
    d, u:lerp(a.u,b.u,t), lat:lerp(a.lat,b.lat,t),
    dist:lerp(a.dist,b.dist,t), lon:a.lon,
    retro:(b.u-a.u)<0
  };
}

/* Fixed background star field, in (ecliptic longitude, latitude) space. */
const STARS=(()=>{const r=rng(1701),s=[];
  for(let i=0;i<620;i++) s.push({
    lam:r()*360, latF:(r()*2-1), mag:r()
  });
  return s;})();

/* Regulus (alpha Leonis): ecliptic longitude 150.1 deg, latitude +0.46 deg.
   Mars's Feb 2027 opposition falls close to it, so it anchors the Mars strip. */
const REGULUS={lonDeg:150.1, lat:0.46, name:'Regulus'};

/* ══════════════════════════════════════════════════════════════
   LAYOUT  — measured from the stage element, drawn in CSS px
   ══════════════════════════════════════════════════════════════ */
const cv = document.getElementById('mc');
const ctx = cv.getContext('2d');
const stage = document.querySelector('.stage');
let CW=0, CH=0, LAY=null;

function computeLayout(w,h){
  const pad=10, gap=12;
  const availH=h-pad*2, availW=w-pad*2;
  if(w < 860){
    const mh=Math.min(availH*0.44, availW);
    return {stack:true,
      mech :{x:(w-mh)/2, y:pad, size:mh},
      strip:{x:pad, y:pad+mh+gap, w:availW, h:availH-mh-gap}};
  }
  const ms=Math.min(availH, availW*0.42);
  return {stack:false,
    mech :{x:pad, y:pad+(availH-ms)/2, size:ms},
    strip:{x:pad+ms+gap, y:pad, w:availW-gap-ms, h:availH}};
}
function resize(){
  const r=stage.getBoundingClientRect();
  CW=Math.max(320,Math.floor(r.width));
  CH=Math.max(220,Math.floor(r.height));
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.round(CW*dpr); cv.height=Math.round(CH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  LAY=computeLayout(CW,CH);
}
new ResizeObserver(resize).observe(stage);

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
let beat=0, pKey='mars', day=0, playing=true, cmp=false;
let morphT=0, morphing=false, lastT=null;
const SPD=22;  // days per second of wall clock

function T(){return TAB[pKey];}
function P(){return PL[pKey];}
function lam0(){return T().lon0*180/Math.PI;}
function normLam(v){let x=v%360; if(x<0)x+=360; return x;}

/* ══════════════════════════════════════════════════════════════
   SKY STRIP  — identical geometry in every beat.
   x = ecliptic longitude (east to the LEFT, as when facing south)
   y = ecliptic latitude (north up)
   ══════════════════════════════════════════════════════════════ */
function stripGeom(L,key,isCmp){
  const s=L.strip;
  const padL=16, padR=16, padT=26, padB=46;
  const plotX=s.x+padL, plotY=s.y+padT;
  const plotW=Math.max(40,s.w-padL-padR), plotH=Math.max(40,s.h-padT-padB);
  const half=isCmp?CMP_HALF:LON_HALF;
  const latHalf=isCmp?Math.max(PL.mars.latHalf,PL.saturn.latHalf):PL[key].latHalf;
  return {
    plotX,plotY,plotW,plotH,
    cx:plotX+plotW/2, cy:plotY+plotH/2,
    ppd:plotW/(half*2), lpd:plotH/(latHalf*2),
    half, latHalf
  };
}

function drawStrip(g,L,o){
  const key=o.key, s=L.strip, G=stripGeom(L,key,o.cmp);
  const p=PL[key], T0=TAB[key];
  const X=u=>G.cx-u*G.ppd;            // east is left
  const Y=lat=>G.cy-lat*G.lpd;        // north is up
  const L0=lam0();

  g.fillStyle=PANEL_BG;
  g.beginPath(); g.roundRect(s.x,s.y,s.w,s.h,6); g.fill();
  g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=1; g.stroke();

  g.save();
  g.beginPath(); g.rect(G.plotX,G.plotY,G.plotW,G.plotH); g.clip();

  // background stars
  STARS.forEach(st=>{
    const u=normLam(st.lam-L0+180)-180;
    if(Math.abs(u)>G.half+2) return;
    const sy=Y(st.latF*G.latHalf);
    const rr=0.4+st.mag*1.2;
    g.beginPath(); g.arc(X(u),sy,rr,0,Math.PI*2);
    g.fillStyle='rgba(255,255,255,'+(0.06+st.mag*0.20).toFixed(3)+')'; g.fill();
  });

  // longitude gridlines, labelled in absolute ecliptic longitude
  const lonStep=o.cmp?5:10;
  const lo=Math.ceil((L0-G.half)/lonStep)*lonStep, hi=L0+G.half;
  for(let lam=lo; lam<=hi; lam+=lonStep){
    const x=X(lam-L0);
    g.beginPath(); g.moveTo(x,G.plotY); g.lineTo(x,G.plotY+G.plotH);
    g.strokeStyle=GRID; g.lineWidth=1; g.stroke();
  }
  // latitude gridlines
  const ls=p.latGrid;
  for(let lat=-Math.floor(G.latHalf/ls)*ls; lat<=G.latHalf; lat+=ls){
    const y=Y(lat);
    g.beginPath(); g.moveTo(G.plotX,y); g.lineTo(G.plotX+G.plotW,y);
    g.strokeStyle=Math.abs(lat)<1e-9?GRID_0:GRID;
    g.lineWidth=Math.abs(lat)<1e-9?1.4:1; g.stroke();
  }

  if(o.cmp){ drawCompare(g,G,X,Y); g.restore(); drawStripChrome(g,L,G,o,X,Y); return; }

  // ── traversed path, accumulating ────────────────────────────
  const rows=T0.rows;
  let prev=null;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(r.d>o.day) break;
    if(Math.abs(r.u)>G.half+4){ prev=r; continue; }
    if(prev){
      g.beginPath(); g.moveTo(X(prev.u),Y(prev.lat)); g.lineTo(X(r.u),Y(r.lat));
      if(r.retro){ g.strokeStyle='rgba('+p.rgb.join(',')+',0.95)'; g.lineWidth=3; }
      else { g.strokeStyle='rgba(255,255,255,0.34)'; g.lineWidth=2; }
      g.stroke();
    }
    prev=r;
  }

  // ── observation dots, one per cadence interval ──────────────
  const cad=p.cadence;
  for(let d=Math.ceil(T0.W0/cad)*cad; d<=o.day; d+=cad){
    const a=at(key,d);
    if(Math.abs(a.u)>G.half) continue;
    const x=X(a.u), y=Y(a.lat);
    g.beginPath(); g.arc(x,y,3.4,0,Math.PI*2);
    g.fillStyle=a.retro?'rgba('+p.rgb.join(',')+',1)':'rgba(255,255,255,0.80)';
    g.fill();
    g.beginPath(); g.arc(x,y,3.4,0,Math.PI*2);
    g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=1; g.stroke();
  }

  // ── event markers: stationary points and opposition ─────────
  const evs=[
    {d:T0.s1, lbl:'STATIONARY'},
    {d:0,     lbl:'OPPOSITION'},
    {d:T0.s2, lbl:'STATIONARY'}
  ];
  evs.forEach((ev,i)=>{
    if(o.day<ev.d) return;
    const a=at(key,ev.d), x=X(a.u);
    if(Math.abs(a.u)>G.half) return;
    g.setLineDash([3,5]);
    g.beginPath(); g.moveTo(x,G.plotY+2); g.lineTo(x,G.plotY+G.plotH-2);
    g.strokeStyle=i===1?'rgba(255,255,255,0.30)':'rgba('+p.rgb.join(',')+',0.45)';
    g.lineWidth=1.2; g.stroke(); g.setLineDash([]);
    g.font='700 12px "Courier Prime", monospace';
    g.textAlign=i===2?'right':'left'; g.textBaseline='top';
    const tx=i===2?x-5:x+5;
    g.fillStyle=i===1?'rgba(255,255,255,0.66)':'rgba('+p.rgb.join(',')+',0.90)';
    g.fillText(ev.lbl,tx,G.plotY+3);
    g.font='400 12px "Courier Prime", monospace';
    g.fillStyle=TXT_LO;
    g.fillText(fmtDate(key,ev.d),tx,G.plotY+17);
  });

  // ── Regulus, for the Mars field ─────────────────────────────
  if(key==='mars'){
    const u=normLam(REGULUS.lonDeg-L0+180)-180;
    if(Math.abs(u)<=G.half){
      const x=X(u), y=Y(REGULUS.lat);
      const gr=g.createRadialGradient(x,y,0,x,y,13);
      gr.addColorStop(0,'rgba(255,247,220,0.75)'); gr.addColorStop(1,'rgba(255,247,220,0)');
      g.beginPath(); g.arc(x,y,13,0,Math.PI*2); g.fillStyle=gr; g.fill();
      g.beginPath(); g.arc(x,y,3.6,0,Math.PI*2); g.fillStyle='rgba(255,250,235,0.98)'; g.fill();
      g.font='700 13px "Courier Prime", monospace';
      g.textAlign='center'; g.textBaseline='bottom';
      g.fillStyle='rgba(255,245,205,0.80)';
      g.fillText(REGULUS.name,x,y-7);
    }
  }

  // ── current position ────────────────────────────────────────
  const a=at(key,o.day);
  if(Math.abs(a.u)<=G.half){
    const x=X(a.u), y=Y(a.lat);
    // brightness with distance: radius scales as 1/dist, clamped
    const rad=clamp(5.0*(T0.dMin/a.dist),3.2,8.0);
    const gr=g.createRadialGradient(x,y,0,x,y,rad*3.4);
    gr.addColorStop(0,'rgba('+p.rgb.join(',')+',0.62)');
    gr.addColorStop(1,'rgba('+p.rgb.join(',')+',0)');
    g.beginPath(); g.arc(x,y,rad*3.4,0,Math.PI*2); g.fillStyle=gr; g.fill();
    g.beginPath(); g.arc(x,y,rad,0,Math.PI*2); g.fillStyle=p.color; g.fill();
    g.beginPath(); g.arc(x,y,rad*0.38,0,Math.PI*2); g.fillStyle='rgba(255,255,255,0.95)'; g.fill();
    // longitude guide, matching the sight line in the mechanism panel
    g.setLineDash([2,6]);
    g.beginPath(); g.moveTo(x,G.plotY); g.lineTo(x,G.plotY+G.plotH);
    g.strokeStyle='rgba('+p.rgb.join(',')+',0.42)'; g.lineWidth=1.2; g.stroke();
    g.setLineDash([]);
  }
  g.restore();
  drawStripChrome(g,L,G,o,X,Y);
}

/* axis numbers, headings and compass letters — drawn outside the clip */
function drawStripChrome(g,L,G,o,X,Y){
  const key=o.key, p=PL[key], s=L.strip, L0=lam0();

  g.font='400 13px "Courier Prime", monospace';
  g.textAlign='center'; g.textBaseline='top';
  g.fillStyle=TXT_MD;
  const lonStep=o.cmp?5:10;
  const lo=Math.ceil((L0-G.half)/lonStep)*lonStep;
  for(let lam=lo; lam<=L0+G.half; lam+=lonStep){
    const x=X(lam-L0);
    if(x<G.plotX+12||x>G.plotX+G.plotW-12) continue;
    g.fillText(normLam(lam).toFixed(0)+'°', x, G.plotY+G.plotH+5);
  }
  g.textAlign='left'; g.textBaseline='middle';
  const ls=p.latGrid;
  for(let lat=-Math.floor(G.latHalf/ls)*ls; lat<=G.latHalf; lat+=ls){
    if(Math.abs(lat)<1e-9) continue;
    const y=Y(lat);
    if(y<G.plotY+10||y>G.plotY+G.plotH-10) continue;
    g.fillStyle=TXT_LO;
    g.fillText((lat>0?'+':'')+lat+'°', G.plotX+3, y);
  }

  g.font='700 14px "Courier Prime", monospace';
  g.textAlign='left'; g.textBaseline='top';
  g.fillStyle=TXT_MD;
  g.fillText('THE SKY  ·  LOOKING SOUTH', s.x+10, s.y+6);

  g.font='700 13px "Courier Prime", monospace';
  g.textAlign='right';
  g.fillStyle=TXT_LO;
  g.fillText('← EAST      WEST →', s.x+s.w-10, s.y+7);

  g.font='400 12px "Courier Prime", monospace';
  g.textAlign='center'; g.textBaseline='bottom';
  g.fillStyle=TXT_LO;
  g.fillText(o.cmp
    ? 'ecliptic longitude · same scale for all three planets'
    : 'ecliptic longitude  ·  1 dot = '+p.cadence+' days  ·  latitude exaggerated',
    s.x+s.w/2, s.y+s.h-5);
}

/* compare view: all three retrograde loops, one shared scale */
function drawCompare(g,G,X,Y){
  PKEYS.forEach(k=>{
    const p=PL[k], T0=TAB[k];
    let prev=null;
    T0.rows.forEach(r=>{
      if(Math.abs(r.u)>G.half+2){prev=null;return;}
      if(prev){
        g.beginPath(); g.moveTo(X(prev.u),Y(prev.lat)); g.lineTo(X(r.u),Y(r.lat));
        g.strokeStyle=r.retro?'rgba('+p.rgb.join(',')+',0.95)':'rgba('+p.rgb.join(',')+',0.26)';
        g.lineWidth=r.retro?3:1.6; g.stroke();
      }
      prev=r;
    });
    // width brackets share one lane so the three arcs lie against each other
    // directly, instead of being read off at three different heights
    const rp=T0.rows.filter(r=>r.retro);
    if(rp.length>2){
      const us=rp.map(r=>r.u);
      const xa=X(Math.max(...us)), xb=X(Math.min(...us));
      const yb=G.plotY+G.plotH-78+PKEYS.indexOf(k)*27;
      g.beginPath();
      g.moveTo(xa,yb); g.lineTo(xb,yb);
      g.moveTo(xa,yb-5); g.lineTo(xa,yb+5);
      g.moveTo(xb,yb-5); g.lineTo(xb,yb+5);
      g.strokeStyle='rgba('+p.rgb.join(',')+',0.95)'; g.lineWidth=2; g.stroke();
      g.font='700 14px "Courier Prime", monospace';
      g.textBaseline='middle';
      g.fillStyle=p.color;
      const txt=p.name.toUpperCase()+'  '+T0.arc.toFixed(1)+'° over '+Math.round(T0.dur)+' d';
      // keep the label inside the plot: flip it to the east end if it won't fit west
      if(xb+12+g.measureText(txt).width <= G.plotX+G.plotW-6){
        g.textAlign='left';  g.fillText(txt, xb+12, yb);
      } else {
        g.textAlign='right'; g.fillText(txt, xa-12, yb);
      }
    }
  });
}

/* ══════════════════════════════════════════════════════════════
   MECHANISM PANEL
   m = 0 : Earth at the centre of the frame (geocentric)
   m = 1 : Sun at the centre of the frame   (heliocentric)
   Both circles stay centred on the panel throughout the morph:
   the large one is the deferent at m=0 and the planet's orbit at
   m=1; the small one is the Sun's circle at m=0 and Earth's orbit
   at m=1. Only the Sun and Earth trade places.
   ══════════════════════════════════════════════════════════════ */
function drawMech(g,L,o){
  const M=L.mech, key=o.key, p=PL[key], T0=TAB[key];
  const cx=M.x+M.size/2, cy=M.y+M.size/2, R=M.size/2;
  /* The planet can be (a + 1) AU from Earth at conjunction, so scale to that
     worst case. Then nothing leaves the panel and the two circles keep a fixed
     size and centre right through the morph. */
  const m=o.morph, sc=(R*0.78)/(p.a+1);
  const b=bodies(key,o.day), E=b.E, Q=b.P;
  const SX=(x,y)=>({x:cx+(x-(1-m)*E.x)*sc, y:cy-(y-(1-m)*E.y)*sc});
  const pe=SX(E.x,E.y), ps=SX(0,0), pq=SX(Q.x,Q.y);
  const pc=SX(Q.x+E.x, Q.y+E.y);            // epicycle centre
  const lon=Math.atan2(Q.y-E.y, Q.x-E.x);
  const rgb=p.rgb.join(',');

  g.fillStyle=PANEL_BG;
  g.beginPath(); g.roundRect(M.x,M.y,M.size,M.size,6); g.fill();
  g.strokeStyle='rgba(255,255,255,0.10)'; g.lineWidth=1; g.stroke();

  g.save();
  g.beginPath(); g.roundRect(M.x+1,M.y+1,M.size-2,M.size-2,6); g.clip();

  if(o.cmp){ drawMechCompare(g,M,cx,cy,R,o); g.restore(); return; }

  // ── the sky ring: directions as seen from Earth ─────────────
  //  Exact only while Earth is at the frame centre, so it fades out
  //  as the morph re-centres the frame on the Sun.
  const ringA=1-m;
  if(ringA>0.01){
    const Rr=R*0.93, L0r=T0.lon0;
    const RP=f=>({x:cx+Rr*Math.cos(f), y:cy-Rr*Math.sin(f)});
    g.globalAlpha=ringA;

    g.beginPath();
    for(let i=0;i<=180;i++){const q=RP(i/180*2*Math.PI); i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y);}
    g.closePath();
    g.strokeStyle='rgba(255,255,255,0.13)'; g.lineWidth=1; g.stroke();

    // the slice of sky the strip shows
    g.beginPath();
    for(let i=0;i<=60;i++){
      const f=L0r+(-LON_HALF+i/60*2*LON_HALF)*Math.PI/180;
      const q=RP(f); i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y);
    }
    g.strokeStyle='rgba(255,255,255,0.30)'; g.lineWidth=3; g.stroke();

    // background stars, same field as the strip
    for(let i=0;i<STARS.length;i+=3){
      const st=STARS[i], q=RP(st.lam*Math.PI/180);
      g.beginPath(); g.arc(q.x,q.y,0.5+st.mag*1.1,0,Math.PI*2);
      g.fillStyle='rgba(255,255,255,'+(0.10+st.mag*0.30).toFixed(3)+')'; g.fill();
    }
    if(key==='mars'){
      const q=RP(REGULUS.lonDeg*Math.PI/180);
      g.beginPath(); g.arc(q.x,q.y,3,0,Math.PI*2);
      g.fillStyle='rgba(255,250,235,0.95)'; g.fill();
      g.font='700 12px "Courier Prime", monospace';
      g.textAlign='center'; g.textBaseline='middle';
      const ql=RP(REGULUS.lonDeg*Math.PI/180);
      g.fillStyle='rgba(255,245,205,0.75)';
      g.fillText('Regulus', clamp(ql.x,M.x+40,M.x+M.size-40), ql.y-11);
    }

    // where the planet has been seen, marked on the ring
    const cad=p.cadence;
    for(let d=Math.ceil(T0.W0/cad)*cad; d<=o.day; d+=cad){
      const a=at(key,d), bb=bodies(key,d);
      const f=Math.atan2(bb.P.y-bb.E.y, bb.P.x-bb.E.x);
      const q0=RP(f), q1={x:cx+(Rr-7)*Math.cos(f), y:cy-(Rr-7)*Math.sin(f)};
      g.beginPath(); g.moveTo(q0.x,q0.y); g.lineTo(q1.x,q1.y);
      g.strokeStyle=a.retro?'rgba('+rgb+',0.95)':'rgba(255,255,255,0.40)';
      g.lineWidth=a.retro?2.6:1.6; g.stroke();
    }
    // current direction
    const qc=RP(lon), qi={x:cx+(Rr-13)*Math.cos(lon), y:cy-(Rr-13)*Math.sin(lon)};
    g.beginPath(); g.moveTo(qc.x,qc.y); g.lineTo(qi.x,qi.y);
    g.strokeStyle='rgba('+rgb+',1)'; g.lineWidth=3.4; g.stroke();
    g.beginPath(); g.arc(qc.x,qc.y,4,0,Math.PI*2); g.fillStyle=p.color; g.fill();
    g.globalAlpha=1;
  }

  // ── the two circles (never move) ────────────────────────────
  if(o.beat>0){
    g.setLineDash([3,6]); g.lineWidth=1.3;
    g.beginPath(); g.arc(cx,cy,p.a*sc,0,Math.PI*2);
    g.strokeStyle='rgba('+rgb+',0.30)'; g.stroke();
    g.beginPath(); g.arc(cx,cy,1*sc,0,Math.PI*2);
    g.strokeStyle='rgba(60,163,174,0.34)'; g.stroke();
    g.setLineDash([]);
  }

  // ── epicycle construction, fading out through the morph ─────
  const ep=clamp(1-m/0.55,0,1);
  if(o.beat>0 && ep>0.01){
    g.globalAlpha=ep;
    g.beginPath(); g.arc(pc.x,pc.y,1*sc,0,Math.PI*2);
    g.strokeStyle='rgba(255,255,255,0.20)'; g.lineWidth=1.2; g.stroke();
    // deferent arm: centre -> epicycle centre
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(pc.x,pc.y);
    g.strokeStyle='rgba(255,255,255,0.28)'; g.lineWidth=1.3; g.stroke();
    // the identity: epicycle arm  ==  Earth -> Sun arm
    g.lineWidth=2.4;
    g.beginPath(); g.moveTo(pc.x,pc.y); g.lineTo(pq.x,pq.y);
    g.strokeStyle='rgba(245,163,64,0.90)'; g.stroke();
    g.beginPath(); g.moveTo(pe.x,pe.y); g.lineTo(ps.x,ps.y);
    g.strokeStyle='rgba(245,163,64,0.90)'; g.stroke();
    // parallel ticks
    const ang=Math.atan2(ps.y-pe.y, ps.x-pe.x), tl=5;
    [[pc,pq],[pe,ps]].forEach(pr=>{
      const mx=(pr[0].x+pr[1].x)/2, my=(pr[0].y+pr[1].y)/2;
      g.beginPath();
      g.moveTo(mx-Math.cos(ang-0.9)*tl, my-Math.sin(ang-0.9)*tl);
      g.lineTo(mx+Math.cos(ang-0.9)*tl, my+Math.sin(ang-0.9)*tl);
      g.strokeStyle='rgba(245,163,64,0.95)'; g.lineWidth=2; g.stroke();
    });
    g.globalAlpha=1;
  }

  // ── sight line from Earth ───────────────────────────────────
  const c=Math.cos(lon), s2=-Math.sin(lon), FAR=M.size*1.6;
  g.setLineDash([5,5]);
  g.beginPath(); g.moveTo(pe.x,pe.y); g.lineTo(pe.x+c*FAR, pe.y+s2*FAR);
  g.strokeStyle='rgba('+rgb+',0.70)'; g.lineWidth=1.6; g.stroke();
  g.setLineDash([]);

  // ── bodies ──────────────────────────────────────────────────
  function orb(pt,col,rad,glow){
    const gr=g.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,glow);
    gr.addColorStop(0,col+'cc'); gr.addColorStop(1,col+'00');
    g.beginPath(); g.arc(pt.x,pt.y,glow,0,Math.PI*2); g.fillStyle=gr; g.fill();
    g.beginPath(); g.arc(pt.x,pt.y,rad,0,Math.PI*2); g.fillStyle=col; g.fill();
    g.beginPath(); g.arc(pt.x,pt.y,rad*0.36,0,Math.PI*2);
    g.fillStyle='rgba(255,255,255,0.95)'; g.fill();
  }
  if(o.beat>0){
    orb(ps,SUN_C,7.5,20);
    orb(pq,p.color,6.5,17);
  }
  orb(pe,EARTH_C,6,16);

  // ── labels ──────────────────────────────────────────────────
  g.font='700 15px "Courier Prime", monospace';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle=EARTH_C; g.fillText('EARTH', pe.x, pe.y+19);
  if(o.beat>0){
    g.fillStyle=SUN_C;   g.fillText('SUN', ps.x, ps.y+20);
    g.fillStyle=p.color; g.fillText(p.name.toUpperCase(), pq.x, pq.y-19);
  }

  // circle labels crossfade with the morph; suppressed on a small panel,
  // where they would collide with the body labels
  if(o.beat>0 && M.size>=340){
    g.font='700 13px "Courier Prime", monospace';
    g.textBaseline='bottom';
    g.globalAlpha=1-m;
    g.fillStyle='rgba(255,255,255,0.55)';
    g.fillText('DEFERENT', cx, cy-p.a*sc-6);
    g.fillStyle='rgba(60,163,174,0.70)';
    g.fillText("SUN'S ORBIT", cx, cy-1*sc-6);
    g.globalAlpha=m;
    g.fillStyle='rgba(255,255,255,0.55)';
    g.fillText(p.name.toUpperCase()+"'S ORBIT", cx, cy-p.a*sc-6);
    g.fillStyle='rgba(60,163,174,0.70)';
    g.fillText("EARTH'S ORBIT", cx, cy-1*sc-6);
    g.globalAlpha=1;
  }

  // longitude readout on the sight line
  const lamNow=normLam(lon*180/Math.PI);
  const lrad=(1-m)>0.5?R*0.62:R*0.80;
  const lx=pe.x+c*lrad, ly=pe.y+s2*lrad;
  g.font='700 15px "Courier Prime", monospace';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='rgba('+rgb+',0.95)';
  g.fillText('λ '+lamNow.toFixed(1)+'°',
    clamp(lx,M.x+42,M.x+M.size-42), clamp(ly,M.y+30,M.y+M.size-30));

  g.restore();

  // ── panel chrome ────────────────────────────────────────────
  g.font='700 14px "Courier Prime", monospace';
  g.textAlign='left'; g.textBaseline='top';
  const heads=['WHAT WE SEE FROM EARTH','PTOLEMY, c. 150 AD  ·  GEOCENTRIC','HELIOCENTRIC'];
  if(o.beat===2 && m<1){
    g.globalAlpha=1-m; g.fillStyle=TXT_MD; g.fillText(heads[1],M.x+10,M.y+7);
    g.globalAlpha=m;   g.fillStyle=TXT_MD; g.fillText(heads[2],M.x+10,M.y+7);
    g.globalAlpha=1;
  } else {
    g.fillStyle=TXT_MD; g.fillText(heads[o.beat],M.x+10,M.y+7);
  }

  // scale bar
  if(o.beat>0){
    const bx=M.x+12, by=M.y+M.size-14, bw=Math.max(14,sc);
    g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+bw,by);
    g.strokeStyle=TXT_LO; g.lineWidth=2; g.stroke();
    g.beginPath(); g.moveTo(bx,by-3); g.lineTo(bx,by+3);
    g.moveTo(bx+bw,by-3); g.lineTo(bx+bw,by+3); g.stroke();
    g.font='400 12px "Courier Prime", monospace';
    g.textAlign='left'; g.textBaseline='bottom';
    g.fillStyle=TXT_LO; g.fillText('1 AU', bx+bw+6, by+4);
  }
}

/* All three orbits at one shared scale — the spatial half of the comparison. */
function drawMechCompare(g,M,cx,cy,R,o){
  const outer=PL.saturn.a, sc=(R*0.80)/(outer+1);
  g.setLineDash([3,6]); g.lineWidth=1.3;
  g.beginPath(); g.arc(cx,cy,1*sc,0,Math.PI*2);
  g.strokeStyle='rgba(60,163,174,0.55)'; g.stroke();
  PKEYS.forEach(k=>{
    g.beginPath(); g.arc(cx,cy,PL[k].a*sc,0,Math.PI*2);
    g.strokeStyle='rgba('+PL[k].rgb.join(',')+',0.42)'; g.stroke();
  });
  g.setLineDash([]);

  const gr=g.createRadialGradient(cx,cy,0,cx,cy,20);
  gr.addColorStop(0,SUN_C+'cc'); gr.addColorStop(1,SUN_C+'00');
  g.beginPath(); g.arc(cx,cy,20,0,Math.PI*2); g.fillStyle=gr; g.fill();
  g.beginPath(); g.arc(cx,cy,7,0,Math.PI*2); g.fillStyle=SUN_C; g.fill();

  const be=bodies('mars',o.day);
  g.beginPath(); g.arc(cx+be.E.x*sc, cy-be.E.y*sc, 5,0,Math.PI*2);
  g.fillStyle=EARTH_C; g.fill();

  // legend, rather than labels on circles that collide at Saturn's scale
  const items=[['SATURN',PL.saturn.a,PL.saturn.color],
               ['JUPITER',PL.jupiter.a,PL.jupiter.color],
               ['MARS',PL.mars.a,PL.mars.color],
               ['EARTH',1,EARTH_C]];
  g.font='700 13px "Courier Prime", monospace';
  g.textBaseline='middle';
  items.forEach((it,i)=>{
    const ly=M.y+34+i*20, lx=M.x+M.size-156;
    g.beginPath(); g.arc(lx,ly,4,0,Math.PI*2); g.fillStyle=it[2]; g.fill();
    g.textAlign='left'; g.fillStyle=TXT_MD; g.fillText(it[0],lx+11,ly);
    g.textAlign='right'; g.fillStyle=TXT_LO;
    g.fillText(it[1].toFixed(2)+' AU', M.x+M.size-12, ly);
  });

  g.font='700 14px "Courier Prime", monospace';
  g.textAlign='left'; g.textBaseline='top';
  g.fillStyle=TXT_MD; g.fillText('ORBITS AT ONE SCALE',M.x+10,M.y+7);

  const bx=M.x+12, by=M.y+M.size-14, bw=Math.max(14,sc);
  g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+bw,by);
  g.strokeStyle=TXT_LO; g.lineWidth=2; g.stroke();
  g.beginPath(); g.moveTo(bx,by-3); g.lineTo(bx,by+3);
  g.moveTo(bx+bw,by-3); g.lineTo(bx+bw,by+3); g.stroke();
  g.font='400 12px "Courier Prime", monospace';
  g.textAlign='left'; g.textBaseline='bottom';
  g.fillStyle=TXT_LO; g.fillText('1 AU', bx+bw+6, by+4);
}

function drawScene(g,L,o){
  g.fillStyle=SKY_BG; g.fillRect(0,0,o.w,o.h);
  drawMech(g,L,o);
  drawStrip(g,L,o);
}

/* ══════════════════════════════════════════════════════════════
   UI
   ══════════════════════════════════════════════════════════════ */
const STEP_NAMES=['The Mystery',"Ptolemy's Answer",'The Truth'];
const scrub=document.getElementById('scrub');
const dateOut=document.getElementById('dateOut');
const playBtn=document.getElementById('playBtn');
const readsEl=document.getElementById('reads');
const ctrlsEl=document.getElementById('ctrls');
const stepsEl=document.getElementById('steps');
const subLine=document.getElementById('subLine');

function note(){
  const p=P();
  if(beat===0) return p.name+' against the fixed stars — one dot every '+p.cadence+' days.';
  if(beat===1) return 'Ptolemy, c. 150 AD: each planet rides a small circle on a large one.';
  return 'Same sky. No epicycles.';
}

function buildSteps(){
  let h='';
  for(let i=0;i<3;i++){
    if(i) h+='<span class="step-sep"></span>';
    h+='<button class="step" data-step="'+i+'">'+
       '<span class="step-dot'+(i===beat?' active':i<beat?' done':'')+'"></span>'+
       '<span class="step-lbl'+(i===beat?' active':'')+'">'+STEP_NAMES[i]+'</span></button>';
  }
  stepsEl.innerHTML=h;
  stepsEl.querySelectorAll('.step').forEach(b=>
    b.onclick=()=>goStep(+b.dataset.step));
}

function buildCtrls(){
  const p=P();
  let h='<p class="note">'+note()+'</p><span class="spacer"></span>';
  h+=PKEYS.map(k=>'<button class="cc-btn cc-btn-sm plan'+(k===pKey?' is-active':'')+
      '" data-p="'+k+'">'+PL[k].name+'</button>').join('');
  if(beat===2){
    h+='<button class="cc-btn cc-btn-sm'+(cmp?' is-active':'')+'" id="cmpBtn">Compare all three</button>';
    h+='<button class="cc-btn cc-btn-sm" id="morphBtn">↺ Replay morph</button>';
  }
  h+='<button class="cc-btn cc-btn-sm" id="backBtn"'+(beat===0?' disabled style="opacity:.35"':'')+'>← Back</button>';
  h+='<button class="cc-btn cc-btn-sm primary" id="nextBtn">'+
     (beat===2?'↺ Start over':'Next →')+'</button>';
  h+='<button class="cc-btn cc-btn-sm" id="pngBtn">⬇ PNG</button>';
  ctrlsEl.innerHTML=h;

  ctrlsEl.querySelectorAll('.plan').forEach(b=>b.onclick=()=>selPlanet(b.dataset.p));
  const cb=document.getElementById('cmpBtn');
  if(cb) cb.onclick=()=>{cmp=!cmp; buildCtrls(); syncHash();};
  const mb=document.getElementById('morphBtn');
  if(mb) mb.onclick=()=>{morphT=0; morphing=true;};
  document.getElementById('backBtn').onclick=()=>goStep(beat-1);
  document.getElementById('nextBtn').onclick=()=>goStep(beat===2?0:beat+1);
  document.getElementById('pngBtn').onclick=exportPNG;
}

function buildReads(){
  const p=P(), T0=T(), a=at(pKey,day);
  const bright=Math.pow(T0.dMax/a.dist,2);
  const rows=[
    ['Longitude', normLam(lam0()+a.u).toFixed(1)+'°'],
    ['Motion', a.retro?'RETROGRADE · west':'PROGRADE · east'],
    ['Distance', a.dist.toFixed(2)+' AU'],
    ['Brightness', '×'+bright.toFixed(1)],
    ['From opposition', (day>=0?'+':'')+Math.round(day)+' d']
  ];
  readsEl.innerHTML=rows.map(r=>
    '<div class="read"><span class="read-l">'+r[0]+'</span><span class="read-v">'+r[1]+'</span></div>'
  ).join('');
}

function syncScrub(){
  const T0=T();
  scrub.value=Math.round((day-T0.W0)/(T0.W1-T0.W0)*1000);
  dateOut.textContent=fmtDate(pKey,day);
}
function setDayFromScrub(){
  const T0=T();
  day=T0.W0+(+scrub.value/1000)*(T0.W1-T0.W0);
}

function goStep(n){
  n=clamp(n,0,2);
  const from=beat; beat=n;
  if(n===2 && from===1){ morphT=0; morphing=true; }
  else if(n===2){ morphT=1; morphing=false; }
  else { morphT=0; morphing=false; }
  if(n!==2) cmp=false;
  buildSteps(); buildCtrls(); syncHash();
}
function selPlanet(k){
  if(k===pKey) return;
  pKey=k;
  const T0=T();
  day=clamp(day,T0.W0,T0.W1);
  buildCtrls(); updateSub(); syncScrub(); syncHash();
}

subLine.textContent='';
function updateSub(){
  subLine.textContent='Opposition '+P().oppLabel+'  ·  circular-orbit model';
}

/* ── deep links ─────────────────────────────────────────────── */
function syncHash(){
  const h='#step='+(beat+1)+'&planet='+pKey+(cmp?'&compare=1':'');
  if(location.hash!==h) history.replaceState(null,'',h);
}
function readHash(){
  const q=new URLSearchParams(location.hash.replace(/^#/,''));
  const st=parseInt(q.get('step'),10);
  const pl=q.get('planet');
  if(pl&&PL[pl]) pKey=pl;
  if(st>=1&&st<=3) beat=st-1;
  if(q.get('compare')==='1'&&beat===2) cmp=true;
  const dd=parseFloat(q.get('day'));
  if(!isNaN(dd)) day=clamp(dd,T().W0,T().W1);
  morphT=beat===2?1:0;
}

/* ── events ─────────────────────────────────────────────────── */
scrub.addEventListener('input',()=>{ playing=false; playBtn.innerHTML='▶ Play'; setDayFromScrub(); });
playBtn.addEventListener('click',()=>{
  playing=!playing;
  playBtn.innerHTML=playing?'⏸ Pause':'▶ Play';
});
window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); playBtn.click(); }
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
    e.preventDefault(); playing=false; playBtn.innerHTML='▶ Play';
    day=clamp(day+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?7:1), T().W0, T().W1);
  }
});

/* ══════════════════════════════════════════════════════════════
   LOOP
   ══════════════════════════════════════════════════════════════ */
function frame(ts){
  if(!lastT) lastT=ts;
  const dt=Math.min(ts-lastT,60); lastT=ts;

  if(morphing){
    morphT+=dt/2200;
    if(morphT>=1){ morphT=1; morphing=false; }
  } else if(playing){
    const T0=T();
    day+=dt/1000*SPD;
    if(day>T0.W1) day=T0.W0;
  }

  if(LAY){
    drawScene(ctx,LAY,{
      key:pKey, day, beat, morph:beat===2?morphT:0,
      cmp:cmp&&beat===2, w:CW, h:CH
    });
  }
  syncScrub(); buildReads();
  requestAnimationFrame(frame);
}

/* ══════════════════════════════════════════════════════════════
   PNG EXPORT — fixed resolution, never inherited from the screen
   ══════════════════════════════════════════════════════════════ */
function exportPNG(){
  const SCALE=2, W=1400, HEAD=96, FOOT=34, DIAG=620;
  const H=HEAD+DIAG+FOOT;
  const off=document.createElement('canvas');
  off.width=W*SCALE; off.height=H*SCALE;
  const g=off.getContext('2d');
  g.scale(SCALE,SCALE);

  g.fillStyle='#1E2320'; g.fillRect(0,0,W,H);

  g.textAlign='left'; g.textBaseline='alphabetic';
  g.font='600 13px "Courier Prime", monospace';
  g.fillStyle=EARTH_C;
  g.fillText('CONTEXTCLIMATE  ·  EARTH & SPACE  ·  ESS1', 24, 30);
  g.font='700 30px "Zilla Slab", serif';
  g.fillStyle='#E8E4D9';
  g.fillText('Planetary Retrograde — '+P().name, 24, 62);
  g.font='400 14px "Public Sans", sans-serif';
  g.fillStyle='rgba(232,228,217,0.62)';
  g.fillText('Step '+(beat+1)+' of 3 · '+STEP_NAMES[beat]+
    '  ·  '+fmtDate(pKey,day)+
    '  ·  opposition '+P().oppLabel, 24, 84);

  const L=computeLayout(W,DIAG);
  g.save(); g.translate(0,HEAD);
  drawScene(g,L,{key:pKey,day,beat,morph:beat===2?morphT:0,cmp:cmp&&beat===2,w:W,h:DIAG});
  g.restore();

  g.font='400 11px "Courier Prime", monospace';
  g.fillStyle='rgba(232,228,217,0.42)';
  g.textAlign='center';
  g.fillText('contextclimate.io  ·  NYS Earth & Space Sciences (ESS1)  ·  '+
    'circular-orbit model, latitude exaggerated  ·  opposition dates: in-the-sky.org',
    W/2, H-13);

  off.toBlob(b=>{
    const url=URL.createObjectURL(b), a=document.createElement('a');
    a.href=url; a.download='planetary-retrograde_'+pKey+'_step'+(beat+1)+'.png';
    a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
day=TAB[pKey].W0;
readHash();
resize();
buildSteps(); buildCtrls(); updateSub(); syncScrub(); buildReads();
window.addEventListener('resize',resize);
/* a handout can link between steps on an already-open page */
window.addEventListener('hashchange',()=>{
  readHash(); buildSteps(); buildCtrls(); updateSub(); syncScrub(); buildReads();
});
requestAnimationFrame(frame);
</script>
