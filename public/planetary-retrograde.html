<body>

<a class="back-link" href="/earthandspace">← Earth &amp; Space</a>

<header>
  <p class="eyebrow">Astronomy</p>
  <h1>Planetary Retrograde</h1>
  <p class="subtitle">Why planets appear to move backward across the sky.</p>
</header>

<div class="step-row">
  <div class="step-item">
    <div class="step-dot" id="dot0"></div>
    <span class="step-label" id="lbl0">The Mystery</span>
  </div>
  <div class="step-line"></div>
  <div class="step-item">
    <div class="step-dot" id="dot1"></div>
    <span class="step-label" id="lbl1">Ptolemy's Answer</span>
  </div>
  <div class="step-line"></div>
  <div class="step-item">
    <div class="step-dot" id="dot2"></div>
    <span class="step-label" id="lbl2">The Truth</span>
  </div>
</div>

<div class="canvas-block">
  <canvas id="mc" width="720" height="800"></canvas>
</div>

<div class="beat-info" id="beatInfo"></div>

<div class="nav-row">
  <button class="nav-btn ghost" id="backBtn">← Back</button>
  <button class="nav-btn primary" id="nextBtn">Next →</button>
</div>

<script>
// ═══════════════════════════════════════════════
// POLYFILL
// ═══════════════════════════════════════════════
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    this.beginPath();
    this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);
    this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);
    this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);
    this.closePath();return this;
  };
}

// ═══════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════
const PHASE   = Math.PI / 4;   // orbit start angle; opposition at t=0 with visible lat
const EP = 365.26, ER = 1.0;
const WE = 2*Math.PI/EP;       // Earth angular velocity (rad/day)

const CW=720, CH=800;
const cv = document.getElementById('mc');
const cx = cv.getContext('2d');

const PL = {
  mars:{
    name:'Mars', color:'#E8603C', rgb:[232,96,60],
    period:686.97, radius:1.524, inc:1.85*Math.PI/180, synodic:779.9
  },
  jupiter:{
    name:'Jupiter', color:'#C4A882', rgb:[196,168,130],
    period:4332.6, radius:5.203, inc:1.30*Math.PI/180, synodic:398.9
  },
  saturn:{
    name:'Saturn', color:'#D4B483', rgb:[212,180,131],
    period:10759.2, radius:9.537, inc:2.49*Math.PI/180, synodic:378.1
  }
};
const PKEYS = ['mars','jupiter','saturn'];

// Pixels-per-degree scales for the ecliptic strip
const STRIP_PPD  = {mars:4.2, jupiter:10.5, saturn:14.0};  // lon
const STRIP_LPIX = {mars:22,  jupiter:45,   saturn:30};     // lat (pixels per degree)

// ═══════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════
function adiff(a,b){let d=a-b; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d;}
function rng(seed){let s=seed; return()=>{s=(s*9301+49297)%233280;return s/233280;};}

// ═══════════════════════════════════════════════
// BEAT 1: Pre-compute Mars apparent path
// Uses inclination so the path forms a 2-D loop in (lon, lat) space
// ═══════════════════════════════════════════════
const MARS_PATH = [];
(function(){
  const wM = 2*Math.PI/PL.mars.period;
  const inc = PL.mars.inc;
  const syn = PL.mars.synodic;
  // One full synodic period centred on opposition (t=0)
  const T0 = -syn*0.47, T1 = syn*0.53, DT = 2.0;

  let prevL=null, unwrap=0;
  for(let t=T0;t<=T1;t+=DT){
    const tE = WE*t+PHASE, tP = wM*t+PHASE;
    const EX=ER*Math.cos(tE), EY=ER*Math.sin(tE);
    const px=PL.mars.radius*Math.cos(tP);
    const py=PL.mars.radius*Math.sin(tP)*Math.cos(inc);
    const pz=PL.mars.radius*Math.sin(tP)*Math.sin(inc);
    const dx=px-EX, dy=py-EY;
    const dist=Math.sqrt(dx*dx+dy*dy+pz*pz);
    const lon=Math.atan2(dy,dx);
    const lat=Math.asin(Math.max(-1,Math.min(1,pz/dist)))*180/Math.PI;
    if(prevL===null) unwrap=0;
    else unwrap+=adiff(lon,prevL)*180/Math.PI;
    prevL=lon;
    MARS_PATH.push({u:unwrap,lat});
  }
  // mark retrograde
  MARS_PATH[0].retro=false;
  for(let i=1;i<MARS_PATH.length;i++)
    MARS_PATH[i].retro=MARS_PATH[i].u<MARS_PATH[i-1].u;

  // Display window: centre on the retrograde arc, ±36° in lon
  const rp=MARS_PATH.filter(p=>p.retro);
  if(rp.length>3){
    const ru=rp.map(p=>p.u);
    window.B1UC=(Math.max(...ru)+Math.min(...ru))/2;
    window.B1UH=36;
  } else {
    const au=MARS_PATH.map(p=>p.u);
    window.B1UC=(Math.max(...au)+Math.min(...au))/2;
    window.B1UH=(Math.max(...au)-Math.min(...au))/2;
  }
  const al=MARS_PATH.map(p=>p.lat);
  window.B1LH=Math.max(Math.abs(Math.min(...al)),Math.abs(Math.max(...al)))*1.9;
})();

// Beat 1 sky panel geometry
const S_L=38,S_R=682,S_T=98,S_B=685;
const S_CX=(S_L+S_R)/2, S_CY=(S_T+S_B)/2;

// Beat 1: sky as seen looking south — east is LEFT, west is RIGHT
// Negate the x-offset so increasing longitude goes left
function uToX(u){return S_CX-(u-B1UC)/B1UH*((S_R-S_L)/2-22);}
function lToY(lat){return S_CY-lat/B1LH*((S_B-S_T)/2-18);}

// Beat 1 background stars
const B1ST=(()=>{const r=rng(77),s=[];
  for(let i=0;i<110;i++)s.push({x:S_L+r()*(S_R-S_L),y:S_T+r()*(S_B-S_T),
    sz:r()*1.1+0.3,br:r()*0.22+0.04});
  return s;})();

// ═══════════════════════════════════════════════
// BEAT 2: Ptolemy constants  (CCW → negate y-sin)
// ═══════════════════════════════════════════════
const B2X=CW/2, B2Y=CH/2+5;
const B2D=230;                         // deferent radius (px)
const B2E=Math.round(B2D/PL.mars.radius*ER); // epicycle radius ≈ 121px

const B2ST=(()=>{const r=rng(33),s=[];
  for(let i=0;i<60;i++)s.push({x:r()*CW,y:r()*CH,sz:r()*0.6+0.2,br:r()*0.07+0.02});
  return s;})();

// ═══════════════════════════════════════════════
// BEAT 3 geometry
// ═══════════════════════════════════════════════
const O_H=373;              // orbital panel height
const O_CX=CW/2, O_CY=O_H/2;
const O_R=164;              // max orbit radius (px)

const BD_TOP=395;           // ecliptic band top
const BD_H=240;             // band height — TALL for 2-D loop
const BD_CY=BD_TOP+BD_H/2; // band vertical centre (lat=0 line)

// Reference stars: normalized lon (degrees from t_start), ecliptic lat (degrees)
const RSTARS=[
  {lon:-62,lat: 0.4,name:'α Gem',mag:2},
  {lon:-30,lat:-1.0,name:'β Gem',mag:2},
  {lon: 18,lat: 1.3,name:'η Leo',mag:3},
  {lon: 52,lat: 0.1,name:'α Leo',mag:1},
  {lon: 94,lat:-0.8,name:'β Leo',mag:2},
];

// Scrolling background stars for strip
const BST=(()=>{const r=rng(555),s=[];
  for(let i=0;i<320;i++)s.push({lon:r()*640-320,yf:r(),sz:r()*0.8+0.25,br:r()*0.18+0.03});
  return s;})();

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let beat=0, playing=true, spd=1.0, pKey='mars', lastT=null;

// Beat 1
let b1prog=0;
const DPS1=40; // dot speed: days/sec

// Beat 2
let b2days=0, b2trail=[];
const B2MAX=1600, DPS2=85;

// Beat 3
let b3days=0, b3trail=[], b3prevL=null, b3unwrap=0;
const B3MAX=750, DPS3=42;

// ═══════════════════════════════════════════════
// BEAT 3 INIT
// ═══════════════════════════════════════════════
function initB3(key){
  const p=PL[key];
  const wP=2*Math.PI/p.period;
  const t0=-p.synodic/3.2;
  b3days=t0; b3trail=[]; b3unwrap=0;

  const tE0=WE*t0+PHASE, tP0=wP*t0+PHASE;
  const EX0=ER*Math.cos(tE0), EY0=ER*Math.sin(tE0);
  const px0=p.radius*Math.cos(tP0);
  const py0=p.radius*Math.sin(tP0)*Math.cos(p.inc);
  const pz0=p.radius*Math.sin(tP0)*Math.sin(p.inc);
  const dx0=px0-EX0, dy0=py0-EY0;
  const d0=Math.sqrt(dx0*dx0+dy0*dy0+pz0*pz0);
  b3prevL=Math.atan2(dy0,dx0);
  const lat0=Math.asin(Math.max(-1,Math.min(1,pz0/d0)))*180/Math.PI;
  b3trail.push({u:0,lat:lat0,retro:false});
}

// ═══════════════════════════════════════════════
// DRAW BEAT 1 — The Mystery
// ═══════════════════════════════════════════════
function drawBeat1(){
  cx.clearRect(0,0,CW,CH);
  cx.fillStyle='#090b12'; cx.fillRect(0,0,CW,CH);

  // sky panel bg
  cx.fillStyle='#0b0d1c';
  cx.beginPath(); cx.roundRect(S_L-4,S_T-6,S_R-S_L+8,S_B-S_T+12,10);
  cx.fill();
  cx.strokeStyle='rgba(255,255,255,0.06)'; cx.lineWidth=1; cx.stroke();

  B1ST.forEach(s=>{
    cx.beginPath(); cx.arc(s.x,s.y,s.sz,0,Math.PI*2);
    cx.fillStyle=`rgba(255,255,255,${s.br})`; cx.fill();
  });

  // ecliptic baseline (lat=0)
  cx.setLineDash([3,8]);
  cx.beginPath(); cx.moveTo(S_L+6,S_CY); cx.lineTo(S_R-6,S_CY);
  cx.strokeStyle='rgba(255,255,255,0.05)'; cx.lineWidth=1; cx.stroke();
  cx.setLineDash([]);

  // full path
  for(let i=1;i<MARS_PATH.length;i++){
    const a=MARS_PATH[i-1], b=MARS_PATH[i];
    const x1=uToX(a.u),y1=lToY(a.lat),x2=uToX(b.u),y2=lToY(b.lat);
    if(Math.abs(x1-S_CX)>S_CX-S_L+30&&Math.abs(x2-S_CX)>S_CX-S_L+30) continue;
    cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2);
    if(b.retro){cx.strokeStyle='rgba(232,96,60,0.95)'; cx.lineWidth=3;}
    else{cx.strokeStyle='rgba(255,255,255,0.22)'; cx.lineWidth=1.8;}
    cx.stroke();
  }

  // loop-closing annotation
  const rp=MARS_PATH.filter(p=>p.retro);
  if(rp.length>4){
    const mid=rp[Math.floor(rp.length/2)];
    const mx=uToX(mid.u), my=lToY(mid.lat)-38;
    cx.font='700 20px "Barlow Condensed",sans-serif';
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillStyle='rgba(232,96,60,0.95)';
    cx.fillText('RETROGRADE LOOP',mx,my);
    cx.beginPath(); cx.moveTo(mx,my+12); cx.lineTo(mx,my+28);
    cx.strokeStyle='rgba(232,96,60,0.4)'; cx.lineWidth=1.5; cx.stroke();
  }

  // animated Mars dot
  const idx=Math.min(Math.floor(b1prog*(MARS_PATH.length-1)),MARS_PATH.length-1);
  const dp=MARS_PATH[idx];
  const dx=uToX(dp.u), dy=lToY(dp.lat);
  const gc=cx.createRadialGradient(dx,dy,0,dx,dy,18);
  gc.addColorStop(0,'rgba(232,96,60,0.65)'); gc.addColorStop(1,'rgba(232,96,60,0)');
  cx.beginPath(); cx.arc(dx,dy,18,0,Math.PI*2); cx.fillStyle=gc; cx.fill();
  cx.beginPath(); cx.arc(dx,dy,5.5,0,Math.PI*2); cx.fillStyle='#E8603C'; cx.fill();
  cx.beginPath(); cx.arc(dx,dy,2.2,0,Math.PI*2); cx.fillStyle='rgba(255,255,255,0.95)'; cx.fill();

  // axis labels — southern sky convention: E is left, W is right
  cx.font='700 18px "Barlow Condensed",sans-serif';
  cx.textBaseline='middle';
  cx.fillStyle='rgba(255,255,255,0.62)';
  cx.textAlign='left';  cx.fillText('E', S_L+2, S_CY);
  cx.textAlign='right'; cx.fillText('W', S_R-2, S_CY);

  // N/S labels for lat axis
  cx.textAlign='left';
  cx.fillStyle='rgba(255,255,255,0.30)';
  cx.font='600 15px "Barlow Condensed",sans-serif';
  cx.fillText('N', S_L+4, S_T+20);
  cx.fillText('S', S_L+4, S_B-20);

  // panel title
  cx.textAlign='center';
  cx.font='700 18px "Barlow Condensed",sans-serif';
  cx.fillStyle='rgba(255,255,255,0.65)';
  cx.fillText('MARS — APPARENT PATH ACROSS THE SKY', CW/2, S_T-20);
  cx.font='500 14px "Barlow Condensed",sans-serif';
  cx.fillStyle='rgba(255,255,255,0.28)';
  cx.fillText('Looking south toward the ecliptic  ·  East is left, West is right  ·  one 26-month cycle', CW/2, S_T-4);
}

// ═══════════════════════════════════════════════
// DRAW BEAT 2 — Ptolemaic Epicycle  (CCW)
// CCW on screen: position = (cx + R·cos θ,  cy − R·sin θ)
// ═══════════════════════════════════════════════
function drawBeat2(){
  const wM=2*Math.PI/PL.mars.period;
  cx.clearRect(0,0,CW,CH);
  cx.fillStyle='#090b12'; cx.fillRect(0,0,CW,CH);

  B2ST.forEach(s=>{
    cx.beginPath(); cx.arc(s.x,s.y,s.sz,0,Math.PI*2);
    cx.fillStyle=`rgba(255,255,255,${s.br})`; cx.fill();
  });

  // ambient glow
  const ag=cx.createRadialGradient(B2X,B2Y,0,B2X,B2Y,200);
  ag.addColorStop(0,'rgba(58,175,169,0.05)'); ag.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=ag; cx.fillRect(0,0,CW,CH);

  const tDef=wM*b2days+PHASE;
  const tE2 =WE*b2days+PHASE;

  // deferent circle (CCW: epY = B2Y - B2D·sinθ)
  cx.setLineDash([4,6]);
  cx.beginPath(); cx.arc(B2X,B2Y,B2D,0,Math.PI*2);
  cx.strokeStyle='rgba(255,255,255,0.08)'; cx.lineWidth=1.5; cx.stroke();
  cx.setLineDash([]);

  const epX=B2X+B2D*Math.cos(tDef);
  const epY=B2Y-B2D*Math.sin(tDef); // CCW

  // epicycle circle
  cx.beginPath(); cx.arc(epX,epY,B2E,0,Math.PI*2);
  cx.strokeStyle='rgba(255,255,255,0.06)'; cx.lineWidth=1.2; cx.stroke();

  // Mars position on epicycle (CCW)
  const mX=epX-B2E*Math.cos(tE2);
  const mY=epY+B2E*Math.sin(tE2); // CCW

  // trail
  b2trail.push({x:mX,y:mY});
  if(b2trail.length>B2MAX) b2trail.shift();
  for(let i=1;i<b2trail.length;i++){
    const a=i/b2trail.length;
    cx.beginPath();
    cx.moveTo(b2trail[i-1].x,b2trail[i-1].y);
    cx.lineTo(b2trail[i].x,  b2trail[i].y);
    cx.strokeStyle=`rgba(232,96,60,${a*0.75})`;
    cx.lineWidth=2; cx.stroke();
  }

  // arm: Earth → epicycle centre
  cx.beginPath(); cx.moveTo(B2X,B2Y); cx.lineTo(epX,epY);
  cx.strokeStyle='rgba(255,255,255,0.07)'; cx.lineWidth=1.2; cx.stroke();
  // arm: epicycle centre → Mars
  cx.beginPath(); cx.moveTo(epX,epY); cx.lineTo(mX,mY);
  cx.strokeStyle='rgba(232,96,60,0.25)'; cx.lineWidth=1.2; cx.stroke();

  // Earth dot (centre)
  const eg=cx.createRadialGradient(B2X,B2Y,0,B2X,B2Y,18);
  eg.addColorStop(0,'rgba(58,175,169,0.75)'); eg.addColorStop(1,'rgba(58,175,169,0)');
  cx.beginPath(); cx.arc(B2X,B2Y,18,0,Math.PI*2); cx.fillStyle=eg; cx.fill();
  cx.beginPath(); cx.arc(B2X,B2Y,8,0,Math.PI*2); cx.fillStyle='#3AAFA9'; cx.fill();
  cx.beginPath(); cx.arc(B2X,B2Y,3,0,Math.PI*2); cx.fillStyle='white'; cx.fill();

  // epicycle pivot dot
  cx.beginPath(); cx.arc(epX,epY,3.5,0,Math.PI*2);
  cx.fillStyle='rgba(255,255,255,0.22)'; cx.fill();

  // Mars dot
  const mg=cx.createRadialGradient(mX,mY,0,mX,mY,18);
  mg.addColorStop(0,'rgba(232,96,60,0.75)'); mg.addColorStop(1,'rgba(232,96,60,0)');
  cx.beginPath(); cx.arc(mX,mY,18,0,Math.PI*2); cx.fillStyle=mg; cx.fill();
  cx.beginPath(); cx.arc(mX,mY,7,0,Math.PI*2); cx.fillStyle='#E8603C'; cx.fill();
  cx.beginPath(); cx.arc(mX,mY,2.8,0,Math.PI*2); cx.fillStyle='rgba(255,255,255,0.9)'; cx.fill();

  // labels
  cx.font='700 22px "Barlow Condensed",sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='#3AAFA9'; cx.fillText('EARTH',B2X,B2Y+26);
  cx.fillStyle='#E8603C';
  cx.fillText('MARS',mX, mY+(mY<B2Y-24?26:-26));

  cx.font='600 17px "Barlow Condensed",sans-serif';
  cx.fillStyle='rgba(255,255,255,0.45)';
  cx.fillText('DEFERENT',B2X,B2Y-B2D-20);

  // epicycle label — follows epicycle centre
  const ea=tDef+Math.PI*0.5;
  const elX=Math.max(60,Math.min(CW-60,epX+B2E*0.6*Math.cos(ea)));
  const elY=Math.max(22,Math.min(CH-22,epY+B2E*0.6*Math.sin(ea)-12));
  cx.fillText('EPICYCLE',elX,elY);

  cx.textAlign='left';
  cx.font='600 16px "Barlow Condensed",sans-serif';
  cx.fillStyle='rgba(255,255,255,0.45)';
  cx.fillText('PTOLEMAIC MODEL  ·  GEOCENTRIC',20,22);
}

// ═══════════════════════════════════════════════
// DRAW BEAT 3 — Heliocentric orbital panel  (CCW)
// ═══════════════════════════════════════════════
function drawOrb(){
  const p=PL[pKey];
  const [r,g,b]=p.rgb;
  const wP=2*Math.PI/p.period;
  const sc=O_R/p.radius;
  const eR_px=Math.max(24,ER*sc), pR_px=p.radius*sc;

  // ambient
  const ag=cx.createRadialGradient(O_CX,O_CY,0,O_CX,O_CY,pR_px*1.15);
  ag.addColorStop(0,`rgba(${r},${g},${b},0.06)`); ag.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=ag; cx.fillRect(0,0,CW,O_H);

  const tE=WE*b3days+PHASE, tP=wP*b3days+PHASE;
  // CCW: y = cy - R·sin θ
  const EX=O_CX+eR_px*Math.cos(tE),  EY=O_CY-eR_px*Math.sin(tE);
  const PX=O_CX+pR_px*Math.cos(tP),  PY=O_CY-pR_px*Math.sin(tP);

  // orbit rings
  cx.setLineDash([2,5]); cx.lineWidth=1.2;
  cx.beginPath(); cx.arc(O_CX,O_CY,eR_px,0,Math.PI*2);
  cx.strokeStyle='rgba(58,175,169,0.22)'; cx.stroke();
  cx.beginPath(); cx.arc(O_CX,O_CY,pR_px,0,Math.PI*2);
  cx.strokeStyle=`rgba(${r},${g},${b},0.16)`; cx.stroke();
  cx.setLineDash([]);

  // line of sight (clipped)
  cx.save();
  cx.beginPath(); cx.rect(0,0,CW,O_H); cx.clip();
  const ddx=PX-EX, ddy=PY-EY, dd=Math.sqrt(ddx*ddx+ddy*ddy);
  cx.beginPath(); cx.moveTo(EX,EY);
  cx.lineTo(EX+(ddx/dd)*560, EY+(ddy/dd)*560);
  cx.strokeStyle=`rgba(${r},${g},${b},0.28)`;
  cx.lineWidth=1.2; cx.setLineDash([4,5]); cx.stroke();
  cx.setLineDash([]); cx.restore();

  // Sun
  const sg=cx.createRadialGradient(O_CX,O_CY,0,O_CX,O_CY,26);
  sg.addColorStop(0,'rgba(255,235,150,0.95)');
  sg.addColorStop(0.35,'rgba(255,200,70,0.45)');
  sg.addColorStop(1,'rgba(255,150,50,0)');
  cx.beginPath(); cx.arc(O_CX,O_CY,26,0,Math.PI*2); cx.fillStyle=sg; cx.fill();
  cx.beginPath(); cx.arc(O_CX,O_CY,8,0,Math.PI*2); cx.fillStyle='#FFD166'; cx.fill();
  cx.beginPath(); cx.arc(O_CX,O_CY,3,0,Math.PI*2); cx.fillStyle='rgba(255,255,255,0.9)'; cx.fill();

  // Earth
  const eg=cx.createRadialGradient(EX,EY,0,EX,EY,14);
  eg.addColorStop(0,'rgba(58,175,169,0.8)'); eg.addColorStop(1,'rgba(58,175,169,0)');
  cx.beginPath(); cx.arc(EX,EY,14,0,Math.PI*2); cx.fillStyle=eg; cx.fill();
  cx.beginPath(); cx.arc(EX,EY,6,0,Math.PI*2); cx.fillStyle='#3AAFA9'; cx.fill();
  cx.beginPath(); cx.arc(EX,EY,2.4,0,Math.PI*2); cx.fillStyle='white'; cx.fill();

  // Planet
  const pg=cx.createRadialGradient(PX,PY,0,PX,PY,16);
  pg.addColorStop(0,`rgba(${r},${g},${b},0.8)`); pg.addColorStop(1,`rgba(${r},${g},${b},0)`);
  cx.beginPath(); cx.arc(PX,PY,16,0,Math.PI*2); cx.fillStyle=pg; cx.fill();
  cx.beginPath(); cx.arc(PX,PY,6.5,0,Math.PI*2); cx.fillStyle=p.color; cx.fill();
  cx.beginPath(); cx.arc(PX,PY,2.6,0,Math.PI*2); cx.fillStyle='rgba(255,255,255,0.9)'; cx.fill();

  // labels
  cx.font='700 22px "Barlow Condensed",sans-serif';
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='rgba(255,215,100,0.55)'; cx.fillText('SUN',O_CX,O_CY+22);
  cx.fillStyle='#3AAFA9';
  cx.fillText('EARTH',EX,EY+(EY<O_CY?20:-20));
  cx.fillStyle=p.color;
  cx.fillText(p.name.toUpperCase(),PX,PY+(PY<O_CY?20:-20));

  // panel header
  cx.textAlign='left';
  cx.font='700 17px "Barlow Condensed",sans-serif';
  cx.fillStyle='rgba(255,255,255,0.55)';
  cx.fillText('HELIOCENTRIC VIEW',20,22);

  // retrograde badge
  const isR=b3trail.length>1&&b3trail[b3trail.length-1].retro;
  if(isR){
    cx.textAlign='right';
    cx.fillStyle=p.color;
    cx.font='700 20px "Barlow Condensed",sans-serif';
    cx.fillText('◀ RETROGRADE NOW',CW-20,22);
  }
}

// ═══════════════════════════════════════════════
// DRAW BEAT 3 — Ecliptic strip  (2-D: lon on x, lat on y)
// ═══════════════════════════════════════════════
function drawStrip(){
  const p=PL[pKey];
  const [r,g,b]=p.rgb;
  const ppd=STRIP_PPD[pKey];
  const lpx=STRIP_LPIX[pKey];

  // strip BG
  cx.fillStyle='#090b12';
  cx.fillRect(0,O_H+1,CW,CH-O_H-1);

  // band
  cx.fillStyle='#0c0f1e';
  cx.beginPath(); cx.roundRect(18,BD_TOP,CW-36,BD_H,7); cx.fill();
  cx.strokeStyle='rgba(255,255,255,0.06)'; cx.lineWidth=1; cx.stroke();

  if(!b3trail.length) return;
  const curU=b3trail[b3trail.length-1].u;
  const isR=b3trail[b3trail.length-1].retro;

  cx.save();
  cx.beginPath(); cx.roundRect(18,BD_TOP,CW-36,BD_H,7); cx.clip();

  // scrolling background stars (southern sky: east=left, so negate lon offset)
  BST.forEach(s=>{
    const sx=CW/2-(s.lon-curU)*ppd;
    if(sx<14||sx>CW-14) return;
    const sy=BD_TOP+s.yf*BD_H;
    cx.beginPath(); cx.arc(sx,sy,s.sz,0,Math.PI*2);
    cx.fillStyle=`rgba(255,255,255,${s.br})`; cx.fill();
  });

  // ecliptic baseline (lat = 0)
  cx.setLineDash([3,8]);
  cx.beginPath(); cx.moveTo(18,BD_CY); cx.lineTo(CW-18,BD_CY);
  cx.strokeStyle='rgba(255,255,255,0.09)'; cx.lineWidth=1; cx.stroke();
  cx.setLineDash([]);

  // named reference stars (scroll with lon; east=left)
  RSTARS.forEach(s=>{
    const sx=CW/2-(s.lon-curU)*ppd;
    const sy=BD_CY-s.lat*lpx;
    const syC=Math.max(BD_TOP+6,Math.min(BD_TOP+BD_H-6,sy));
    if(sx<20||sx>CW-20) return;
    const sr=s.mag===1?4.5:s.mag===2?3.2:2;
    const sg=cx.createRadialGradient(sx,syC,0,sx,syC,sr*3.5);
    sg.addColorStop(0,'rgba(255,255,220,0.72)'); sg.addColorStop(1,'rgba(255,255,200,0)');
    cx.beginPath(); cx.arc(sx,syC,sr*3.5,0,Math.PI*2); cx.fillStyle=sg; cx.fill();
    cx.beginPath(); cx.arc(sx,syC,sr,0,Math.PI*2);
    cx.fillStyle='rgba(255,255,235,0.95)'; cx.fill();
    // label visible when near centre
    if(Math.abs(sx-CW/2)<CW*0.42){
      cx.font='700 15px "Barlow Condensed",sans-serif';
      cx.textAlign='center'; cx.textBaseline='bottom';
      cx.fillStyle='rgba(255,255,220,0.68)';
      cx.fillText(s.name,sx,syC-sr-4);
    }
  });

  // 2-D trail: x = lon (east=left in southern sky), y = ecliptic lat
  if(b3trail.length>1){
    for(let i=1;i<b3trail.length;i++){
      const a=b3trail[i-1], bpt=b3trail[i];
      const x1=CW/2-(a.u-curU)*ppd;
      const x2=CW/2-(bpt.u-curU)*ppd;
      if((x1<18&&x2<18)||(x1>CW-18&&x2>CW-18)) continue;
      const y1=Math.max(BD_TOP+4,Math.min(BD_TOP+BD_H-4,BD_CY-a.lat*lpx));
      const y2=Math.max(BD_TOP+4,Math.min(BD_TOP+BD_H-4,BD_CY-bpt.lat*lpx));
      const alpha=Math.min(1,(i/b3trail.length)*3)*0.92;
      cx.beginPath(); cx.moveTo(x1,y1); cx.lineTo(x2,y2);
      if(bpt.retro){
        cx.strokeStyle=`rgba(${r},${g},${b},${alpha})`;
        cx.lineWidth=2.8;
      } else {
        cx.strokeStyle=`rgba(255,255,255,${alpha*0.22})`;
        cx.lineWidth=1.8;
      }
      cx.stroke();
    }
  }

  // planet dot (always at centre-x, current lat)
  const curLat=b3trail[b3trail.length-1].lat;
  const pDotY=Math.max(BD_TOP+6,Math.min(BD_TOP+BD_H-6,BD_CY-curLat*lpx));
  const dg=cx.createRadialGradient(CW/2,pDotY,0,CW/2,pDotY,18);
  dg.addColorStop(0,`rgba(${r},${g},${b},0.82)`); dg.addColorStop(1,`rgba(${r},${g},${b},0)`);
  cx.beginPath(); cx.arc(CW/2,pDotY,18,0,Math.PI*2); cx.fillStyle=dg; cx.fill();
  cx.beginPath(); cx.arc(CW/2,pDotY,6.5,0,Math.PI*2); cx.fillStyle=p.color; cx.fill();
  cx.beginPath(); cx.arc(CW/2,pDotY,2.6,0,Math.PI*2); cx.fillStyle='rgba(255,255,255,0.9)'; cx.fill();

  cx.restore();

  // E / W labels — southern sky convention: E is left, W is right
  cx.font='700 18px "Barlow Condensed",sans-serif';
  cx.textBaseline='middle';
  cx.fillStyle='rgba(255,255,255,0.62)';
  cx.textAlign='left';  cx.fillText('E',22,BD_CY);
  cx.textAlign='right'; cx.fillText('W',CW-22,BD_CY);

  // N / S lat axis labels
  cx.font='600 15px "Barlow Condensed",sans-serif';
  cx.textAlign='left';
  cx.fillStyle='rgba(255,255,255,0.30)';
  cx.fillText('N',22,BD_TOP+16);
  cx.fillText('S',22,BD_TOP+BD_H-16);

  // section header
  cx.textAlign='left';
  cx.font='700 17px "Barlow Condensed",sans-serif';
  cx.fillStyle='rgba(255,255,255,0.55)';
  cx.fillText('APPARENT PATH ACROSS THE SKY',20,O_H+22);

  cx.textAlign='right';
  cx.font=`700 18px "Barlow Condensed",sans-serif`;
  cx.fillStyle=isR ? p.color : 'rgba(255,255,255,0.30)';
  cx.fillText(isR?'▶ MOVING WEST (RETROGRADE)':'◀ MOVING EAST (PROGRADE)',CW-20,O_H+22);

  // stat note
  cx.textAlign='center';
  cx.font='500 13px "Barlow Condensed",sans-serif';
  cx.fillStyle='rgba(255,255,255,0.18)';
  cx.fillText(
    {mars:'Mars retrogrades every 26 months',
     jupiter:'Jupiter retrogrades every 13 months',
     saturn:'Saturn retrogrades every 12.5 months'}[pKey],
    CW/2, CH-10);
}

function drawBeat3(){
  cx.clearRect(0,0,CW,CH);
  cx.fillStyle='#090b12'; cx.fillRect(0,0,CW,CH);
  drawOrb();
  // divider
  cx.fillStyle='rgba(255,255,255,0.06)'; cx.fillRect(20,O_H,CW-40,1);
  drawStrip();
}

// ═══════════════════════════════════════════════
// TICK
// ═══════════════════════════════════════════════
function tick(ts){
  if(!lastT) lastT=ts;
  const dt=Math.min(ts-lastT,50); lastT=ts;

  if(playing){
    if(beat===0){
      b1prog+=(dt/1000)*DPS1*spd/PL.mars.synodic;
      if(b1prog>=1) b1prog=0;

    } else if(beat===1){
      b2days+=(dt/1000)*DPS2*spd;

    } else {
      const p=PL[pKey];
      const wP=2*Math.PI/p.period;
      b3days+=(dt/1000)*DPS3*spd;

      const tE=WE*b3days+PHASE, tP=wP*b3days+PHASE;
      const EX=ER*Math.cos(tE), EY=ER*Math.sin(tE);
      const px3=p.radius*Math.cos(tP);
      const py3=p.radius*Math.sin(tP)*Math.cos(p.inc);
      const pz3=p.radius*Math.sin(tP)*Math.sin(p.inc);
      const dx3=px3-EX, dy3=py3-EY;
      const d3=Math.sqrt(dx3*dx3+dy3*dy3+pz3*pz3);
      const newL=Math.atan2(dy3,dx3);
      const latD=Math.asin(Math.max(-1,Math.min(1,pz3/d3)))*180/Math.PI;

      if(b3prevL!==null) b3unwrap+=adiff(newL,b3prevL)*180/Math.PI;
      b3prevL=newL;

      const isR=b3trail.length>0&&b3unwrap<b3trail[b3trail.length-1].u;
      b3trail.push({u:b3unwrap,lat:latD,retro:isR});
      if(b3trail.length>B3MAX) b3trail.shift();

      if(b3days > -p.synodic/3.2 + p.synodic*1.28) initB3(pKey);
    }
  }

  if(beat===0) drawBeat1();
  else if(beat===1) drawBeat2();
  else drawBeat3();

  requestAnimationFrame(tick);
}

// ═══════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════
const NXT_LABELS=['Ptolemy\'s Answer →','The Real Reason →','↺ Start Over'];
const INFO=[
  `<p class="info-text">Watch Mars trace its path against the stars over a full 26-month cycle. It moves steadily eastward — then slows, reverses into a <strong>visible loop</strong>, and continues. This loop is real: ancient astronomers tracked it for centuries without explanation. Every outer planet does it. <em>Why?</em></p>`,

  `<p class="info-text">Around 150 AD, Ptolemy placed Earth at the center and gave each planet two circular motions: a large circle (<em>deferent</em>) and a small circle riding on it (<em>epicycle</em>). When the epicycle sweeps the planet backward, the loop appears. Ptolemy's model matched observations to within <strong>a few arc-minutes</strong> — and was used for over 1,400 years.</p>
   <p class="info-callout">It worked. It was completely wrong about why.</p>`,

  `<p class="info-text">Earth and all outer planets orbit the Sun counterclockwise at different speeds. When faster Earth overtakes a slower outer planet, that planet appears to drift west against the stars — the same loop shape, with zero epicycles. Select a planet to see how the size of the loop shrinks with distance. The <strong>ecliptic strip below</strong> shows the planet's 2-D path as seen <em>looking south</em> — east is left, west is right — so prograde motion tracks left and retrograde tracks right.</p>`
];

function updSteps(){
  for(let i=0;i<3;i++){
    document.getElementById('dot'+i).className='step-dot'+(i===beat?' active':i<beat?' done':'');
    document.getElementById('lbl'+i).className='step-label'+(i===beat?' active':'');
  }
}
function updInfo(){ document.getElementById('beatInfo').innerHTML=INFO[beat]; }
function updControls(){
  const el=document.getElementById('beatControls');
  if(beat===0){ el.innerHTML=''; return; }
  if(beat===1){
    el.innerHTML=`<div class="ctrl-row">
      <button class="ctrl-btn" id="ppb" onclick="tgPlay()">${playing?'⏸ Pause':'▶ Play'}</button>
      <button class="ctrl-btn" onclick="rst2()">↺ Restart</button>
      <div class="speed-wrap">
        <label>Speed</label>
        <input type="range" min="0.5" max="4" step="0.5" value="${spd}"
          oninput="spd=+this.value;document.getElementById('sv').textContent=this.value+'×'">
        <span class="speed-val" id="sv">${spd}×</span>
      </div></div>`;
    return;
  }
  const btns=PKEYS.map(k=>{
    const pp=PL[k],ac=(k===pKey);
    const st=ac?`border-color:${pp.color};background:${pp.color}1c;color:${pp.color}`:'';
    return `<button class="app-btn" style="${st}" onclick="selP('${k}')">${pp.name}</button>`;
  }).join('');
  el.innerHTML=`<div class="planet-row">${btns}</div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="ppb" onclick="tgPlay()">${playing?'⏸ Pause':'▶ Play'}</button>
      <div class="speed-wrap">
        <label>Speed</label>
        <input type="range" min="0.5" max="5" step="0.5" value="${spd}"
          oninput="spd=+this.value;document.getElementById('sv').textContent=this.value+'×'">
        <span class="speed-val" id="sv">${spd}×</span>
      </div></div>`;
}
function updNav(){
  const bk=document.getElementById('backBtn');
  const nk=document.getElementById('nextBtn');
  bk.className='nav-btn ghost'+(beat===0?' invisible':'');
  nk.textContent=NXT_LABELS[beat];
  nk.className=beat===2?'nav-btn ghost':'nav-btn primary';
}
function updAll(){ updSteps(); updInfo(); updControls(); updNav(); }

function tgPlay(){
  playing=!playing;
  const b=document.getElementById('ppb');
  if(b) b.textContent=playing?'⏸ Pause':'▶ Play';
}
function rst2(){ b2days=0; b2trail=[]; }
function selP(k){ pKey=k; initB3(k); updControls(); }

document.getElementById('backBtn').addEventListener('click',()=>{
  if(beat===0) return;
  beat--; playing=true;
  if(beat===1){b2days=0;b2trail=[];}
  if(beat===2) initB3(pKey);
  updAll();
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  if(beat===2){beat=0;b1prog=0;playing=true;updAll();return;}
  beat++; playing=true;
  if(beat===1){b2days=0;b2trail=[];}
  if(beat===2) initB3(pKey);
  updAll();
});

initB3('mars');
updAll();
requestAnimationFrame(tick);
</script>
