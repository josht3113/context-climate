<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planetary Retrograde</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* control bar */
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 60px; }
.play { min-width: 96px; padding: 10px 14px; font-size: 15px; font-weight: 700; }
.play.primary { color: var(--color-bg); }
.snaps { display: flex; gap: 5px; }
.snap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 62px; padding: 4px 8px; line-height: 1.1; color: var(--color-text-primary); }
.snap b { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.snap span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active b, .snap.is-active span { color: var(--color-bg); }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary);
  min-width: 112px; text-align: right; white-space: nowrap; }

/* floating chips */
.chips { position: absolute; display: none; gap: 6px; align-items: center; }
.chips .cc-segmented-btn { padding: 5px 12px; font-size: 12px; }
.chips .cc-btn { padding: 5px 11px; font-size: 13px; background: var(--color-surface); }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.planets { display: flex; width: 100%; margin-bottom: 10px; }
.planets .cc-segmented-btn { flex: 1; padding: 10px 4px; font-size: 14px; font-weight: 700; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.card th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .02em; text-transform: uppercase; font-weight: 500;
  color: var(--color-text-secondary); text-align: right; padding: 8px 2px 5px 6px; border-bottom: 1px solid var(--color-border-hover); vertical-align: bottom; }
.card th:first-child, .card td:first-child { text-align: left; }
.card td { font-family: var(--font-mono); font-size: 16px; font-weight: 700; text-align: right; padding: 8px 2px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
.card td:first-child { font-family: var(--font-display); font-size: 19px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .planets .cc-segmented-btn { padding: 7px 4px; }
}
@media (max-width: 1260px) {
  .slider .sv { display: none; }
  .tabs .cc-segmented-btn { padding: 11px 16px; }
}
@media (max-width: 1160px) {
  .snap { min-width: 54px; padding: 4px 6px; }
  .play { min-width: 84px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Planetary Retrograde</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn" data-tab="observe">Observe</button>
      <button class="cc-segmented-btn" data-tab="geo">Geocentric</button>
      <button class="cc-segmented-btn" data-tab="helio">Heliocentric</button>
      <button class="cc-segmented-btn" data-tab="compare">Compare</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="skyChips">
          <div class="cc-segmented" id="nsSeg">
            <button class="cc-segmented-btn" data-ns="true">True shape</button>
            <button class="cc-segmented-btn" data-ns="stretch" id="nsStretch">N–S ×4</button>
          </div>
        </div>
        <div class="chips" id="mechChips">
          <div class="cc-segmented" id="zSeg">
            <button class="cc-segmented-btn" data-z="whole">Whole</button>
            <button class="cc-segmented-btn" data-z="close">Close-up</button>
          </div>
          <button class="cc-btn" id="bMorph">↺ Morph</button>
          <button class="cc-btn tgl is-active" id="tSight">Sight lines</button>
        </div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

  const dx = P.x - E.x, dy = P.y - E.y, dz = P.z, dist = Math.hypot(dx, dy, dz);

/* path table over one synodic period; u = unwrapped longitude (deg) from opposition */
const TAB = {};

    if (prev !== null) u += adiff(g.lon, prev) / DEG;
    prev = g.lon; rows.push({ d, u, lat: g.lat, dist: g.dist, lon: g.lon });
  }
  let i0 = 0, best = Infinity;
  rows.forEach((r, i) => { if (Math.abs(r.d) < best) { best = Math.abs(r.d); i0 = i; } });
  const uz = rows[i0].u;
  rows.forEach(r => { r.u -= uz; });
  rows[0].retro = false;
  for (let i = 1; i < rows.length; i++) rows[i].retro = rows[i].u < rows[i - 1].u;
  const rp = rows.filter(r => r.retro), us = rp.map(r => r.u), dists = rows.map(r => r.dist);
  let maxRate = 0;
  for (let i = 1; i < rows.length; i++) maxRate = Math.max(maxRate, Math.abs(rows[i].u - rows[i - 1].u) / step);
  const T = { rows, D0, D1, step, lon0: rows[i0].lon / DEG,

    arc: Math.max(...us) - Math.min(...us), dur: rp[rp.length - 1].d - rp[0].d,
    dMin: Math.min(...dists), dMax: Math.max(...dists), maxRate,
    latMax: Math.max(...rows.map(r => Math.abs(r.lat))) };

  T.W0 = inWin[0].d; T.W1 = inWin[inWin.length - 1].d;

    { L: 'A', d: Math.round((T.W0 + T.s1) / 2) },
    { L: 'B', d: Math.round(T.s1) },
    { L: 'C', d: 0 },
    { L: 'D', d: Math.round(T.s2) },
    { L: 'E', d: Math.round((T.s2 + T.W1) / 2) }];

PKEYS.forEach(buildTable);

function at(key, d) {

/* ══════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════ */
const S = {
  tab: 'observe', key: 'mars', day: 0, playing: false,
  m: 0, mFrom: 0, mTo: 0, mT: 1,       // morph: 0 = Earth-centered frame, 1 = Sun-centered frame
  stretch: true, sight: true, close: false, zv: 0
};
const TABS = ['observe', 'geo', 'helio', 'compare'];
const TAB_NAMES = { observe: 'Observe', geo: 'Geocentric', helio: 'Heliocentric', compare: 'Compare' };
const win = () => S.tab === 'compare' ? [CMP_W0, CMP_W1] : [TAB[S.key].W0, TAB[S.key].W1];
const snaps = () => S.tab === 'compare'
  ? CMP_SNAPS.map(d => ({ L: d === 0 ? '0' : (d > 0 ? '+' : '−') + Math.abs(d), d }))
  : TAB[S.key].snaps;
const morphing = () => S.mT < 1;

/* ══════════════════════════════════════════════════════════════
   LAYOUT
   ══════════════════════════════════════════════════════════════ */
function layout(w, h, tab) {
  const pad = 10, gap = 12, aw = w - 2 * pad, ah = h - 2 * pad;
  if (tab === 'observe') return { sky: { x: pad, y: pad, w: aw, h: ah } };
  const ms = Math.floor(Math.min(ah, aw * 0.5));
  return { mech: { x: pad, y: pad + Math.floor((ah - ms) / 2), w: ms, h: ms },
           sky:  { x: pad + ms + gap, y: pad, w: aw - ms - gap, h: ah } };

/* ══════════════════════════════════════════════════════════════
   DRAWING HELPERS
   ══════════════════════════════════════════════════════════════ */
function rrect(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function panel(c, r) {

  c.strokeStyle = 'rgba(255,255,255,0.10)'; c.lineWidth = 1; c.stroke();
}
function halo(c, t, x, y, col, font, align = 'center', base = 'middle') {
  c.font = font; c.textAlign = align; c.textBaseline = base;
  c.lineJoin = 'round'; c.lineWidth = 4; c.strokeStyle = 'rgba(10,13,20,0.9)';
  c.strokeText(t, x, y); c.fillStyle = col; c.fillText(t, x, y);
}
function glowDot(c, x, y, r, rgb, glow) {
  const g = c.createRadialGradient(x, y, 0, x, y, glow);
  g.addColorStop(0, rgba(rgb, 0.7)); g.addColorStop(1, rgba(rgb, 0));
  c.beginPath(); c.arc(x, y, glow, 0, 2 * Math.PI); c.fillStyle = g; c.fill();
  c.beginPath(); c.arc(x, y, r, 0, 2 * Math.PI); c.fillStyle = rgba(rgb, 1); c.fill();
  c.beginPath(); c.arc(x, y, r * 0.38, 0, 2 * Math.PI); c.fillStyle = 'rgba(255,255,255,0.95)'; c.fill();
}
function badge(c, x, y, L, rgb, alpha = 1) {

  c.fillStyle = 'rgba(10,13,20,0.92)'; c.fill();
  c.strokeStyle = rgba(rgb, 0.95); c.lineWidth = 1.5; c.stroke();
  c.font = `700 14px ${FM}`; c.textAlign = 'center'; c.textBaseline = 'middle';

}
function niceStep(pxPerUnit, minPx, steps) {
  for (const s of steps) if (s * pxPerUnit >= minPx) return s;

/* ══════════════════════════════════════════════════════════════
   THE SKY — east to the left, north up (facing south)
   ══════════════════════════════════════════════════════════════ */
function skyGeom(r, key, cmp, stretch) {
  const padL = 12, padR = 12, padT = 30, padB = cmp ? 132 : 46;
  const plotX = r.x + padL, plotY = r.y + padT;
  const plotW = Math.max(40, r.w - padL - padR), plotH = Math.max(40, r.h - padT - padB);
  const half = cmp ? CMP_HALF : LON_HALF, ppd = plotW / (2 * half);
  let lo, hi;
  if (stretch) {
    if (cmp) { lo = Math.min(...PKEYS.map(k => TAB[k].band[0])); hi = Math.max(...PKEYS.map(k => TAB[k].band[1])); }
    else [lo, hi] = TAB[key].band;

function stretchFactor(key, cmp) {

function drawSky(c, r, st, capture) {
  const cmp = st.tab === 'compare', key = st.key, p = PL[key], T = TAB[key];
  const G = skyGeom(r, key, cmp, st.stretch);
  const L0 = cmp ? 0 : T.lon0;
  const X = u => G.cx - u * G.ppd, Y = b => G.cy - (b - G.mid) * G.lpd;
  panel(c, r);

  c.save();
  c.beginPath(); c.rect(G.plotX, G.plotY, G.plotW, G.plotH); c.clip();

  // gridlines
  const lonStep = cmp ? 5 : niceStep(G.ppd, 70, [5, 10, 20]);
  for (let v = Math.ceil(-G.half / lonStep) * lonStep; v <= G.half; v += lonStep) {
    const lam = cmp ? v : Math.round((L0 + v) / lonStep) * lonStep, x = X(cmp ? v : lam - L0);
    c.beginPath(); c.moveTo(x, G.plotY); c.lineTo(x, G.plotY + G.plotH); c.strokeStyle = GRID; c.lineWidth = 1; c.stroke();
  }
  const latStep = niceStep(G.lpd, 34, [0.25, 0.5, 1, 2, 5, 10, 20]);
  for (let b = Math.ceil(G.latLo / latStep) * latStep; b <= G.latHi + 1e-9; b += latStep) {
    const y = Y(b), zero = Math.abs(b) < 1e-9;
    c.beginPath(); c.moveTo(G.plotX, y); c.lineTo(G.plotX + G.plotW, y);
    c.strokeStyle = zero ? GRID_0 : GRID; c.lineWidth = zero ? 1.4 : 1; c.stroke();

  if (cmp) drawComparePaths(c, G, X, Y, st);
  else drawPlanetPath(c, G, X, Y, st);
  c.restore();
  if (cmp) drawCompareBrackets(c, G, X);

  // ── chrome outside the clip ──
  c.font = `400 13px ${FM}`; c.textAlign = 'center'; c.textBaseline = 'top'; c.fillStyle = TXT_MD;
  for (let v = Math.ceil(-G.half / lonStep) * lonStep; v <= G.half; v += lonStep) {
    let x, t;
    if (cmp) { x = X(v); t = v === 0 ? '0°' : Math.abs(v) + '°' + (v > 0 ? ' E' : ' W'); }
    else { const lam = Math.round((L0 + v) / lonStep) * lonStep; x = X(lam - L0); t = normDeg(lam).toFixed(0) + '°'; }
    if (x < G.plotX + 70 || x > G.plotX + G.plotW - 70) continue;
    c.fillText(t, x, G.plotY + G.plotH + 6);
  }

  c.textAlign = 'left';  c.fillText('← EAST', G.plotX + 2, G.plotY + G.plotH + 6);
  c.textAlign = 'right'; c.fillText('WEST →', G.plotX + G.plotW - 2, G.plotY + G.plotH + 6);
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = `400 13px ${FM}`;
  for (let b = Math.ceil(G.latLo / latStep) * latStep; b <= G.latHi + 1e-9; b += latStep) {
    if (Math.abs(b) < 1e-9) continue;

    if (y < G.plotY + 10 || y > G.plotY + G.plotH - 10) continue;
    halo(c, (b > 0 ? '+' : '−') + +Math.abs(b).toFixed(2) + '°', G.plotX + 4, y, TXT_LO, `400 13px ${FM}`, 'left');
  }
  c.font = `700 14px ${FM}`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = TXT_MD;
  const head = cmp ? 'THE SKY  ·  ONE SCALE' : 'THE SKY  ·  LOOKING SOUTH';
  c.fillText(c.measureText(head).width + 230 < r.w || capture ? head : 'THE SKY', r.x + 12, r.y + 9);
  c.font = `400 13px ${FM}`; c.textAlign = 'center'; c.textBaseline = 'bottom'; c.fillStyle = TXT_LO;
  const cap = cmp ? 'degrees from each planet\'s opposition point'

  c.fillText(c.measureText(cap).width + 20 < r.w ? cap : (cmp ? 'degrees from opposition point' : '1 dot = ' + p.cadence + ' days'), r.x + r.w / 2, r.y + r.h - 5);
  if (capture && st.stretch && G.factor > 1.05) {
    c.font = `700 13px ${FM}`; c.textAlign = 'right'; c.textBaseline = 'top'; c.fillStyle = TXT_MD;
    c.fillText('N–S STRETCHED ×' + Math.round(G.factor), r.x + r.w - 12, r.y + 9);

}

function drawStarfield(c, G, L0, X, Y) {
  const bandOK = b => b >= G.latLo - 0.2 && b <= G.latHi + 0.2;
  const inView = (l, b) => { const u = wrap180(l - L0); return Math.abs(u) <= G.half + 3 && bandOK(b); };
  const distorted = G.factor > 1.05;
  // constellation figures
  c.lineWidth = 1.1; c.strokeStyle = 'rgba(140,170,225,0.30)';
  for (const con of SKYE.cons) {
    for (const path of con.p) {
      for (let i = 1; i < path.length; i++) {
        const a = path[i - 1], b = path[i];
        const ua = wrap180(a[0] - L0), ub = wrap180(b[0] - L0);
        if (Math.abs(ua - ub) > 90) continue;
        if (distorted || (!inView(a[0], a[1]) && !inView(b[0], b[1]))) continue;   // figures only where shapes are true
        c.beginPath(); c.moveTo(X(ua), Y(a[1])); c.lineTo(X(ub), Y(b[1])); c.stroke();
      }
    }
  }
  // stars
  for (const s of SKYE.stars) {
    const u = wrap180(s[0] - L0);
    if (Math.abs(u) > G.half + 1 || !bandOK(s[1])) continue;
    const x = X(u), y = Y(s[1]), m = s[2], rad = Math.max(0.85, 2.9 - 0.45 * m);
    if (m < 2.2) {
      const g = c.createRadialGradient(x, y, 0, x, y, rad * 4.5);
      g.addColorStop(0, 'rgba(255,248,230,0.35)'); g.addColorStop(1, 'rgba(255,248,230,0)');
      c.beginPath(); c.arc(x, y, rad * 4.5, 0, 2 * Math.PI); c.fillStyle = g; c.fill();
    }
    c.globalAlpha = clamp(1.2 - m * 0.14, 0.42, 1);
    c.beginPath(); c.arc(x, y, rad, 0, 2 * Math.PI); c.fillStyle = s[3]; c.fill();
    c.globalAlpha = 1;
  }
  // bright named stars
  const taken = [];
  for (const s of SKYE.named) {
    const u = wrap180(s[0] - L0);
    if (Math.abs(u) > G.half - 2 || s[1] < G.latLo + 0.05 * (G.latHi - G.latLo) || s[1] > G.latHi) continue;
    const x = X(u), y = Y(s[1]) - 14;
    halo(c, s[2], x, y, 'rgba(255,240,205,0.82)', `700 13px ${FM}`); taken.push([x, y]);
  }

  for (const con of SKYE.cons) {
    let lx, ly;
    const ul = wrap180(con.l[0] - L0), span = G.latHi - G.latLo;
    if (Math.abs(ul) < G.half - 4 && con.l[1] > G.latLo + 0.08 * span && con.l[1] < G.latHi - 0.08 * span) { lx = X(ul); ly = Y(con.l[1]); }
    else {
      const pts = [];
      con.p.forEach(path => path.forEach(v => { const u = wrap180(v[0] - L0);
        if (Math.abs(u) < G.half - 3 && v[1] > G.latLo && v[1] < G.latHi) pts.push([X(u), Y(v[1])]); }));
      if (pts.length < 2) continue;
      lx = pts.reduce((s, q) => s + q[0], 0) / pts.length; ly = pts.reduce((s, q) => s + q[1], 0) / pts.length;
    }
    lx = clamp(lx, G.plotX + 60, G.plotX + G.plotW - 60); ly = clamp(ly, G.plotY + 22, G.plotY + G.plotH - 22);
    for (const t of taken) if (Math.abs(t[0] - lx) < 70 && Math.abs(t[1] - ly) < 20) ly = t[1] + (ly >= t[1] ? 22 : -22);
    halo(c, con.n.toUpperCase(), lx, ly, 'rgba(165,190,240,0.70)', `700 13px ${FM}`);
  }
}

function dotR(key, dist) { return 2.1 + 3.0 * Math.pow(TAB[key].dMin / dist, 1.3); }
function planetR(key, dist) { return 3.2 + 5.2 * Math.pow(TAB[key].dMin / dist, 1.5); }

function drawPlanetPath(c, G, X, Y, st) {
  const key = st.key, p = PL[key], T = TAB[key], rows = T.rows;
  // traversed path
  c.beginPath(); let started = false;
  for (const r of rows) {
    if (r.d < T.W0 - 2) continue;
    if (r.d > st.day) break;
    const x = X(r.u), y = Y(r.lat);
    started ? c.lineTo(x, y) : c.moveTo(x, y); started = true;
  }
  const a = at(key, st.day);
  if (started) { c.lineTo(X(a.u), Y(a.lat)); c.strokeStyle = rgba(p.rgb, 0.6); c.lineWidth = 2; c.stroke(); }
  // observation dots, sized by brightness
  for (let d = Math.ceil(T.W0 / p.cadence) * p.cadence; d <= st.day; d += p.cadence) {
    const q = at(key, d), x = X(q.u), y = Y(q.lat), rr = dotR(key, q.dist);
    c.beginPath(); c.arc(x, y, rr, 0, 2 * Math.PI); c.fillStyle = 'rgba(250,246,236,0.92)'; c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = 1; c.stroke();
  }
  // current position
  const x = X(a.u), y = Y(a.lat), pr = planetR(key, a.dist);
  glowDot(c, x, y, pr, p.rgb, pr * 3.6);

  const loop = rows.filter(r => r.d >= T.s1 && r.d <= T.s2);
  const lcx = loop.reduce((s, r) => s + X(r.u), 0) / loop.length, lcy = loop.reduce((s, r) => s + Y(r.lat), 0) / loop.length;
  const placed = [];
  for (const sn of T.snaps) {
    if (sn.d > st.day + 1e-6) continue;
    const q = at(key, sn.d), sx = X(q.u), sy = Y(q.lat);
    const cands = [];
    if (sn.L === 'B' || sn.L === 'C' || sn.L === 'D') {
      const dx = sx - lcx, dy = sy - lcy, n = Math.hypot(dx, dy);
      if (n > 3) cands.push([dx / n * 22, dy / n * 22]);
    }
    cands.push([0, -22], [0, 22], [-24, -16], [24, -16], [-24, 16], [24, 16]);
    let best = cands[0];
    for (const cd of cands) { if (placed.every(pp => Math.hypot(pp[0] - (sx + cd[0]), pp[1] - (sy + cd[1])) > 24)) { best = cd; break; } }
    placed.push([sx + best[0], sy + best[1]]);
    badge(c, sx + best[0], sy + best[1], sn.L, p.rgb);
  }
}

function drawComparePaths(c, G, X, Y, st) {
  PKEYS.forEach((k, i) => {
    const p = PL[k], T = TAB[k], rows = T.rows;
    // full path faint
    c.beginPath(); let s = false;
    for (const r of rows) { if (Math.abs(r.u) > G.half + 3) { s = false; continue; }
      const x = X(r.u), y = Y(r.lat); s ? c.lineTo(x, y) : c.moveTo(x, y); s = true; }
    c.strokeStyle = rgba(p.rgb, 0.22); c.lineWidth = 1.5; c.stroke();
    // traversed
    c.beginPath(); s = false;
    for (const r of rows) { if (r.d > st.day) break; if (Math.abs(r.u) > G.half + 3) { s = false; continue; }
      const x = X(r.u), y = Y(r.lat); s ? c.lineTo(x, y) : c.moveTo(x, y); s = true; }
    c.strokeStyle = rgba(p.rgb, 0.95); c.lineWidth = 2.6; c.stroke();
    // current
    if (st.day >= T.D0 && st.day <= T.D1) {
      const a = at(k, st.day);
      if (Math.abs(a.u) <= G.half + 1) { const pr = planetR(k, a.dist) * 0.85; glowDot(c, X(a.u), Y(a.lat), pr, p.rgb, pr * 3.2); }
    }
  });
}
function drawCompareBrackets(c, G, X) {
  PKEYS.forEach((k, i) => {
    const p = PL[k], T = TAB[k];
    // retrograde arc brackets, stacked under the sky so the widths lie against each other
    const rp = T.rows.filter(r => r.retro), us = rp.map(r => r.u);
    const xa = X(Math.max(...us)), xb = X(Math.min(...us)), yb = G.plotY + G.plotH + 42 + i * 24;
    c.beginPath(); c.moveTo(xa, yb); c.lineTo(xb, yb);
    c.moveTo(xa, yb - 6); c.lineTo(xa, yb + 6); c.moveTo(xb, yb - 6); c.lineTo(xb, yb + 6);
    c.strokeStyle = rgba(p.rgb, 0.95); c.lineWidth = 2; c.stroke();
    const txt = p.name.toUpperCase() + '  ' + T.arc.toFixed(1) + '° · ' + Math.round(T.dur) + ' d';
    c.font = `700 14px ${FM}`; const tw = c.measureText(txt).width;
    if (xb + 12 + tw <= G.plotX + G.plotW - 6) halo(c, txt, xb + 12, yb, p.color, `700 14px ${FM}`, 'left');
    else if (xa - 12 - tw >= G.plotX + 6) halo(c, txt, xa - 12, yb, p.color, `700 14px ${FM}`, 'right');
    else halo(c, txt, clamp((xa + xb) / 2, G.plotX + tw / 2 + 4, G.plotX + G.plotW - tw / 2 - 4), yb - 12, p.color, `700 14px ${FM}`);
  });
}

/* ══════════════════════════════════════════════════════════════
   THE MECHANISM
   m = 0 : Earth at the frame centre (Ptolemy)
   m = 1 : Sun at the frame centre (heliocentric)
   shown(X) = X_helio − (1−m)·E_helio. Both circles stay centred;
   only the Sun and Earth trade places. The scale is R·k / (a + 1 − m),
   the largest distance anything can reach from the frame centre, so
   the Sun-centred view fills the panel and nothing ever leaves it.
   ══════════════════════════════════════════════════════════════ */
const mechScale = (key, R, m) => R * 0.80 / (PL[key].a + 1 - m);
/* camera: Whole (frame centre, everything fits) blended toward the geocentric close-up of the loop.
   The close-up only exists in the Earth-centred frame, so it releases as the morph runs. */
function mechView(key, r, m, zoom) {
  /* Close-up means the planet's loop around Earth in the Earth-centred frame, and Earth's orbit
     in the Sun-centred frame; the morph blends between the two. */
  const R = r.w / 2, zz = clamp(zoom, 0, 1), zg = zz * (1 - m), zh = zz * m, box = TAB[key].geoBox;
  const lW = Math.log(mechScale(key, R, m)), lG = Math.log(R * 0.84 / box.half), lH = Math.log(R * 0.84 / 1.75);
  const sc = Math.exp(lW + zg * (lG - lW) + zh * Math.max(0, lH - lW));
  return { cx: r.x + r.w / 2, cy: r.y + r.h / 2 + 10, sc, vx: box.x * zg, vy: box.y * zg };
}

function drawMech(c, r, st) {
  if (st.tab === 'compare') return drawMechCompare(c, r);
  const key = st.key, p = PL[key], T = TAB[key], m = st.m;
  const V = mechView(key, r, m, st.zoom || 0), sc = V.sc;
  const SX = (pt, E) => ({ x: V.cx + (pt.x - (1 - m) * E.x - V.vx) * sc, y: V.cy - (pt.y - (1 - m) * E.y - V.vy) * sc });
  const O = SX({ x: 0, y: 0 }, { x: 0, y: 0 }), cx = O.x, cy = O.y;   // frame origin on screen
  const b = bodies(key, st.day), E = b.E, Q = b.P;
  const pe = SX(E, E), ps = SX({ x: 0, y: 0 }, E), pq = SX(Q, E), pc = SX({ x: Q.x + E.x, y: Q.y + E.y }, E);
  const ep = clamp(1 - m / 0.55, 0, 1);      // epicycle construction fades out through the morph
  const aOut = clamp(1 - m / 0.45, 0, 1), aIn = clamp((m - 0.55) / 0.45, 0, 1);
  panel(c, r);
  c.save(); rrect(c, r.x + 1, r.y + 1, r.w - 2, r.h - 2, 6); c.clip();

  // ── the two centred circles ──
  c.lineWidth = 2;
  c.beginPath(); c.arc(cx, cy, p.a * sc, 0, 2 * Math.PI); c.strokeStyle = rgba(p.rgb, 0.55); c.stroke();
  c.beginPath(); c.arc(cx, cy, sc, 0, 2 * Math.PI); c.strokeStyle = rgba(mixRGB(SUN_RGB, EARTH_RGB, m), 0.55); c.stroke();

  // ── epicycle and deferent arm ──
  if (ep > 0.01) {
    c.globalAlpha = ep;
    c.beginPath(); c.arc(pc.x, pc.y, sc, 0, 2 * Math.PI); c.strokeStyle = rgba(p.rgb, 0.85); c.lineWidth = 1.8; c.stroke();
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(pc.x, pc.y); c.strokeStyle = 'rgba(255,255,255,0.38)'; c.lineWidth = 1.4; c.stroke();
    c.beginPath(); c.arc(pc.x, pc.y, 2.6, 0, 2 * Math.PI); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fill();
    c.globalAlpha = 1;
  }

  // ── traces: where each body has been since the window opened ──
  const trace = (fn, rgb, w, al) => {
    c.beginPath(); let first = true;
    for (let d = T.W0; d <= st.day + 1e-9; d += 1) {
      const bb = bodies(key, d), q = SX(fn(bb), bb.E);
      first ? c.moveTo(q.x, q.y) : c.lineTo(q.x, q.y); first = false;
    }
    const q = SX(fn(b), E); c.lineTo(q.x, q.y);
    c.strokeStyle = rgba(rgb, al); c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke();
  };
  if (st.day > T.W0) {
    if (m < 0.99) { c.globalAlpha = 1 - m; trace(() => ({ x: 0, y: 0 }), SUN_RGB, 3, 0.7); c.globalAlpha = 1; }
    if (m > 0.01) { c.globalAlpha = m; trace(bb => bb.E, EARTH_RGB, 3, 0.8); c.globalAlpha = 1; }
    trace(bb => bb.P, p.rgb, 3, 0.9);
  }

  // ── sight lines at the lettered moments ──
  const FAR = r.w * 3;
  const ray = (from, to, col, w, dash) => {
    const dx = to.x - from.x, dy = to.y - from.y, n = Math.hypot(dx, dy) || 1;
    c.setLineDash(dash || []);
    c.beginPath(); c.moveTo(from.x, from.y); c.lineTo(from.x + dx / n * FAR, from.y + dy / n * FAR);
    c.strokeStyle = col; c.lineWidth = w; c.stroke(); c.setLineDash([]);
  };
  const shown = T.snaps.filter(sn => sn.d <= st.day + 1e-6);
  const snapPts = shown.map(sn => { const bb = bodies(key, sn.d); return { sn, e: SX(bb.E, bb.E), q: SX(bb.P, bb.E) }; });
  if (st.sight) snapPts.forEach(o => ray(o.e, o.q, rgba(p.rgb, 0.42), 1.4));
  ray(pe, pq, rgba(p.rgb, 0.85), 1.7, [6, 5]);

  // ── the identity: epicycle arm == Earth→Sun arm ──
  if (ep > 0.01) {
    c.globalAlpha = ep; c.lineWidth = 2.6; c.strokeStyle = ARM_C;
    c.beginPath(); c.moveTo(pc.x, pc.y); c.lineTo(pq.x, pq.y); c.stroke();
    c.beginPath(); c.moveTo(pe.x, pe.y); c.lineTo(ps.x, ps.y); c.stroke();
    const ang = Math.atan2(ps.y - pe.y, ps.x - pe.x), tl = 5;
    [[pc, pq], [pe, ps]].forEach(pr => {
      const mx = (pr[0].x + pr[1].x) / 2, my = (pr[0].y + pr[1].y) / 2;
      c.beginPath(); c.moveTo(mx - Math.cos(ang - 0.9) * tl, my - Math.sin(ang - 0.9) * tl);
      c.lineTo(mx + Math.cos(ang - 0.9) * tl, my + Math.sin(ang - 0.9) * tl); c.lineWidth = 2; c.stroke();
    });
    c.globalAlpha = 1;
  }

  // ── markers at the lettered moments ──
  snapPts.forEach(o => {
    c.beginPath(); c.arc(o.q.x, o.q.y, 3.6, 0, 2 * Math.PI); c.fillStyle = rgba(p.rgb, 1); c.fill();
    c.strokeStyle = 'rgba(10,13,20,0.9)'; c.lineWidth = 1.2; c.stroke();
    if (m > 0.5) {
      c.globalAlpha = (m - 0.5) * 2;
      c.beginPath(); c.arc(o.e.x, o.e.y, 3.4, 0, 2 * Math.PI); c.fillStyle = EARTH_C; c.fill(); c.stroke();
      c.globalAlpha = 1;
    }
  });

  // ── bodies ──
  glowDot(c, ps.x, ps.y, 8, SUN_RGB, 24);
  glowDot(c, pq.x, pq.y, 6.5, p.rgb, 17);
  glowDot(c, pe.x, pe.y, 6, EARTH_RGB, 16);

  // ── letter badges, pushed radially outward ──
  const out = (pt, d) => { const dx = pt.x - cx, dy = pt.y - cy, n = Math.hypot(dx, dy);
    return n < 4 ? { x: pt.x, y: pt.y - d } : { x: pt.x + dx / n * d, y: pt.y + dy / n * d }; };
  snapPts.forEach(o => {
    const bq = out(o.q, 18); badge(c, bq.x, bq.y, o.sn.L, p.rgb);
    if (m > 0.5) { const be = out(o.e, 18); badge(c, be.x, be.y, o.sn.L, EARTH_RGB, (m - 0.5) * 2); }
  });

  // ── body labels ──
  const F15 = `700 15px ${FM}`;
  const badgePts = [];
  snapPts.forEach(o => { badgePts.push(out(o.q, 18)); if (m > 0.5) badgePts.push(out(o.e, 18)); });
  const bodyLabel = (t, pt, dy, col) => {
    for (const yy of [pt.y + dy, pt.y - dy, pt.y + dy * 1.9]) {
      if (badgePts.every(q => Math.abs(q.x - pt.x) > 34 || Math.abs(q.y - yy) > 18)) { halo(c, t, pt.x, yy, col, F15); return; }
    }
    halo(c, t, pt.x, pt.y + dy, col, F15);
  };
  bodyLabel('EARTH', pe, 20, EARTH_C);
  bodyLabel('SUN', ps, 22, SUN_C);
  bodyLabel(p.name.toUpperCase(), pq, -20, p.color);

  // ── circle labels: two-stage so they never overprint mid-morph ──
  if (r.w >= 340) {
    const avoid = [pe, ps, pq, { x: pe.x, y: pe.y + 20 }, { x: ps.x, y: ps.y + 22 }, { x: pq.x, y: pq.y - 20 }, ...snapPts.map(o => out(o.q, 18)), ...(m > 0.5 ? snapPts.map(o => out(o.e, 18)) : [])];
    const clearOf = (txt, lx, ly) => { c.font = `700 13px ${FM}`; const hw = c.measureText(txt).width / 2 + 6;
      return ly > r.y + 60 && ly < r.y + r.h - 44 && lx - hw > r.x + 4 && lx + hw < r.x + r.w - 4 &&
        avoid.every(q => Math.abs(q.x - lx) > hw + 12 || Math.abs(q.y - ly) > 20); };
    const put = (txt, ox, oy, rad, col, al) => {
      if (al <= 0.01) return;
      const cands = [[ox, oy + rad + 14], [ox, oy - rad - 12]];
      for (const ang of [-50, -130, 50, 130, -20, -160, 20, 160]) { const t = ang * DEG;
        cands.push([ox + Math.cos(t) * (rad + 16) + Math.sign(Math.cos(t)) * 34, oy - Math.sin(t) * (rad + 16)]); }
      for (const [x, y] of cands)
        if (clearOf(txt, x, y)) { c.globalAlpha = al; halo(c, txt, x, y, col, `700 13px ${FM}`); c.globalAlpha = 1; return; }
    };
    put('DEFERENT', cx, cy, p.a * sc, rgba(p.rgb, 0.92), aOut);
    put("SUN'S ORBIT", cx, cy, sc, rgba(SUN_RGB, 0.92), aOut);
    put('EPICYCLE', pc.x, pc.y, sc, rgba(p.rgb, 0.92), aOut * ep);
    put(p.name.toUpperCase() + "'S ORBIT", cx, cy, p.a * sc, rgba(p.rgb, 0.92), aIn);
    put("EARTH'S ORBIT", cx, cy, sc, rgba(EARTH_RGB, 0.95), aIn);
  }
  c.restore();

  // ── header and scale bar ──
  c.font = `700 14px ${FM}`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = TXT_MD;
  if (aOut > 0.01) { c.globalAlpha = aOut; c.fillText('GEOCENTRIC  ·  PTOLEMY, c. 150 AD', r.x + 12, r.y + 9); }
  if (aIn > 0.01)  { c.globalAlpha = aIn;  c.fillText('HELIOCENTRIC  ·  COPERNICUS, 1543', r.x + 12, r.y + 9); }
  c.globalAlpha = 1;
  scaleBar(c, r, sc);
}
function scaleBar(c, r, sc) {
  let au = 1; while (au * sc > r.w * 0.4 && au > 0.1) au /= 2;
  const bx = r.x + 14, by = r.y + 42, bw = Math.max(14, au * sc);
  c.beginPath(); c.moveTo(bx, by); c.lineTo(bx + bw, by); c.moveTo(bx, by - 4); c.lineTo(bx, by + 4);
  c.moveTo(bx + bw, by - 4); c.lineTo(bx + bw, by + 4); c.strokeStyle = TXT_LO; c.lineWidth = 2; c.stroke();
  c.font = `400 13px ${FM}`; c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillStyle = TXT_LO;
  c.fillText(+au.toFixed(3) + ' AU', bx + bw + 7, by);
}

/* all four orbits at one shared scale */
function drawMechCompare(c, r) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2 + 10, R = r.w / 2, sc = R * 0.80 / PL.saturn.a;
  panel(c, r);
  c.lineWidth = 2;
  c.beginPath(); c.arc(cx, cy, sc, 0, 2 * Math.PI); c.strokeStyle = rgba(EARTH_RGB, 0.75); c.stroke();
  PKEYS.forEach(k => { c.beginPath(); c.arc(cx, cy, PL[k].a * sc, 0, 2 * Math.PI); c.strokeStyle = rgba(PL[k].rgb, 0.7); c.stroke(); });
  glowDot(c, cx, cy, 6, SUN_RGB, 18);
  const items = [['SATURN', PL.saturn.a, PL.saturn.rgb], ['JUPITER', PL.jupiter.a, PL.jupiter.rgb],
                 ['MARS', PL.mars.a, PL.mars.rgb], ['EARTH', 1, EARTH_RGB]];
  c.textBaseline = 'middle';
  items.forEach((it, i) => {
    const ly = r.y + 40 + i * 21, lx = r.x + r.w - 160;
    c.beginPath(); c.moveTo(lx - 6, ly); c.lineTo(lx + 8, ly); c.strokeStyle = rgba(it[2], 0.95); c.lineWidth = 3; c.stroke();
    c.font = `700 13px ${FM}`; c.textAlign = 'left'; c.fillStyle = TXT_MD; c.fillText(it[0], lx + 16, ly);
    c.textAlign = 'right'; c.fillStyle = TXT_LO; c.fillText(it[1].toFixed(2) + ' AU', r.x + r.w - 12, ly);
  });
  c.font = `700 14px ${FM}`; c.textAlign = 'left'; c.textBaseline = 'top'; c.fillStyle = TXT_MD;
  c.fillText('ORBITS AT ONE SCALE', r.x + 12, r.y + 9);
  scaleBar(c, r, sc);
}

function renderScene(c, w, h, st, capture) {
  const L = layout(w, h, st.tab);
  c.fillStyle = STAGE_BG; c.fillRect(0, 0, w, h);
  if (L.mech) drawMech(c, L.mech, st);
  return { L, G: drawSky(c, L.sky, st, capture) };
}

/* ══════════════════════════════════════════════════════════════
   LIVE CANVAS
   ══════════════════════════════════════════════════════════════ */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stageEl = document.getElementById('stage');
let LAST_W = 0, LAST_H = 0, capturing = false;
function resize() {
  const r = stageEl.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  LAST_W = Math.max(320, Math.floor(r.width)); LAST_H = Math.max(220, Math.floor(r.height));
  cv.width = Math.round(LAST_W * dpr); cv.height = Math.round(LAST_H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  placeChips(); draw();
}
new ResizeObserver(resize).observe(stageEl);
const liveState = () => ({ tab: S.tab, key: S.key, day: S.day, m: S.m, stretch: S.stretch, sight: S.sight, zoom: S.zv });
function draw() { if (!capturing && LAST_W) renderScene(ctx, LAST_W, LAST_H, liveState(), false); }

function placeChips() {
  if (!LAST_W) return;
  const L = layout(LAST_W, LAST_H, S.tab);
  const sky = document.getElementById('skyChips'), mech = document.getElementById('mechChips');
  sky.style.display = 'flex';
  sky.style.right = (LAST_W - (L.sky.x + L.sky.w) + 8) + 'px'; sky.style.top = (L.sky.y + 5) + 'px';
  document.getElementById('nsStretch').textContent = 'N–S ×' + Math.round(stretchFactor(S.key, S.tab === 'compare'));
  document.querySelectorAll('#nsSeg [data-ns]').forEach(b =>
    b.classList.toggle('is-active', (b.dataset.ns === 'stretch') === S.stretch));
  if (L.mech && (S.tab === 'geo' || S.tab === 'helio')) {
    mech.style.display = 'flex';
    mech.style.right = (LAST_W - (L.mech.x + L.mech.w) + 8) + 'px'; mech.style.top = (L.mech.y + L.mech.h - 38) + 'px';
    document.getElementById('bMorph').style.display = S.tab === 'helio' ? '' : 'none';

    document.querySelectorAll('#zSeg [data-z]').forEach(b => b.classList.toggle('is-active', (b.dataset.z === 'close') === S.close));
    document.getElementById('tSight').classList.toggle('is-active', S.sight);
  } else mech.style.display = 'none';
}

/* ══════════════════════════════════════════════════════════════
   CONTROLS & CARD
   ══════════════════════════════════════════════════════════════ */
const controlsEl = document.getElementById('controls'), cardEl = document.getElementById('card');
let playBtn, sliderEl, svEl, snapBtns = [];

function renderControls() {
  const [w0, w1] = win(), sn = snaps();
  controlsEl.innerHTML =
    `<button class="cc-btn primary play" id="bPlay"></button>
     <div class="snaps">${sn.map((s, i) => `<button class="cc-btn snap" data-i="${i}" title="${S.tab === 'compare' ? s.d + ' days' : fmtDate(S.key, s.d)}"><b>${S.tab === 'compare' ? s.L : s.L}</b><span>${S.tab === 'compare' ? 'days' : fmtDate(S.key, s.d, false)}</span></button>`).join('')}</div>
     <div class="slider"><input type="range" id="slider" min="${w0}" max="${w1}" step="0.5" aria-label="Date"><span class="sv" id="sv"></span></div>`;
  playBtn = document.getElementById('bPlay'); sliderEl = document.getElementById('slider'); svEl = document.getElementById('sv');
  snapBtns = [...controlsEl.querySelectorAll('.snap')];
  playBtn.onclick = togglePlay;
  sliderEl.oninput = () => { stop(); S.day = +sliderEl.value; syncHash(); };
  snapBtns.forEach(b => b.onclick = () => { stop(); S.day = sn[+b.dataset.i].d; syncHash(); });
  updateControls();
}
let lastCtl = '';
function updateControls() {
  const [w0, w1] = win(), sn = snaps();
  const atEnd = S.day >= w1 - 0.01;
  const key = (S.playing ? 'p' : atEnd ? 'r' : 's') + '|' + S.day.toFixed(1);
  if (key === lastCtl) return; lastCtl = key;
  playBtn.innerHTML = S.playing ? '❚❚ Pause' : atEnd ? '↺ Replay' : '▶ Play';
  if (document.activeElement !== sliderEl) sliderEl.value = S.day;
  const rd = Math.round(S.day);
  svEl.textContent = S.tab === 'compare' ? (rd > 0 ? '+' : rd < 0 ? '−' : '') + Math.abs(rd) + ' days' : fmtDate(S.key, S.day);
  snapBtns.forEach((b, i) => b.classList.toggle('is-active', Math.abs(S.day - sn[i].d) < 0.26));
}

const SRC = 'Circular orbits with real inclinations and nodes · opposition dates: in-the-sky.org · stars: HYG to mag 5.8 · constellation lines: Stellarium (CC BY-SA 4.0)';
function cardModel() {
  const key = S.key, p = PL[key], fromOpp = Math.round(S.day);
  const fo = (fromOpp > 0 ? '+' : fromOpp < 0 ? '−' : '') + Math.abs(fromOpp);
  if (S.tab === 'compare') return {
    title: 'All three planets', rows: [['Time from opposition', fo, 'days']],
    table: { head: ['Planet', 'Retro arc', 'Retro days', 'Orbit AU'],
             rows: PKEYS.map(k => [PL[k].name, TAB[k].arc.toFixed(1) + '°', Math.round(TAB[k].dur), PL[k].a.toFixed(2)]),
             colors: PKEYS.map(k => PL[k].color) } };
  const a = at(key, S.day);
  return {
    title: p.name + '  ·  opposition ' + p.oppLabel,
    rows: [
      ['Date', fmtDate(key, S.day), ''],
      ['Ecliptic longitude', normDeg(TAB[key].lon0 + a.u).toFixed(1) + '°', ''],
      ['Motion against the stars', motionOf(key, S.day), ''],
      ['Distance from Earth', a.dist.toFixed(2), 'AU'],

}
function renderCard() {
  const showPlanets = S.tab !== 'compare';
  cardEl.innerHTML = (showPlanets ? `<div class="cc-segmented planets" id="planets">${PKEYS.map(k =>
      `<button class="cc-segmented-btn${k === S.key ? ' is-active' : ''}" data-k="${k}">${PL[k].name}</button>`).join('')}</div>` : '') +
    `<div class="eb" id="cEb"></div><div id="cRows"></div><div id="cTable"></div><div class="src">${SRC}</div>`;
  if (showPlanets) cardEl.querySelectorAll('[data-k]').forEach(b => b.onclick = () => selPlanet(b.dataset.k));

}
let lastCard = '';
function updateCard() {
  const M = cardModel(), sig = JSON.stringify(M);

  document.getElementById('cRows').innerHTML = M.rows.map(r =>

}

/* ══════════════════════════════════════════════════════════════
   ACTIONS
   ══════════════════════════════════════════════════════════════ */
function togglePlay() {
  if (morphing()) return;
  const [w0, w1] = win();
  if (S.playing) { stop(); return; }
  if (S.day >= w1 - 0.01) S.day = w0;
  S.playing = true; updateControls();
}
function stop() { if (S.playing) { S.playing = false; syncHash(); } lastCtl = ''; }
function startMorph(to) { S.mFrom = S.m; S.mTo = to; S.mT = 0; }
function setTab(t, animate = true) {
  if (!TABS.includes(t)) return;
  const from = S.tab; S.tab = t;
  const [w0, w1] = win(); S.day = clamp(S.day, w0, w1);
