<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Frequency | ContextClimate</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:        #0f1117;
      --surface:   #1a1d2e;
      --surface2:  #22263a;
      --border:    #2d3250;
      --text:      #e8eaf6;
      --text-dim:  #8890b0;
      --accent:    #BA7517;
      --col-a:     #4a90d9;
      --col-b:     #d4601a;
      --obs:       #3AAFA9;
      --font-body:  'Plus Jakarta Sans', sans-serif;
      --font-label: 'Barlow Condensed', sans-serif;
      --font-mono:  'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

    /* ── Header ── */
    .header { background: var(--surface); border-bottom: 2px solid var(--accent); }
    .header-inner { max-width: 960px; margin: 0 auto; padding: 14px 20px 12px; display: flex; align-items: center; gap: 16px; }
    .header-title-block { flex: 1; min-width: 0; }
    .cc-link-btn {
      font-family: var(--font-label); font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;
      color: var(--accent); border: 1px solid var(--accent); border-radius: 20px;
      padding: 5px 14px; white-space: nowrap; flex-shrink: 0; transition: all 0.15s;
      display: inline-block;
    }
    .cc-link-btn:hover { background: rgba(186,117,23,0.15); }
    .chart-actions { display: flex; justify-content: flex-end; margin: -6px 0 14px; }
    .action-pill {
      font-family: var(--font-label); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      padding: 5px 16px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: all 0.2s;
    }
    .action-pill:hover { border-color: var(--text-dim); color: var(--text); }
    .header-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .header h1 {
      font-family: var(--font-label); font-size: 1.35rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    }
    .header-station { font-family: var(--font-label); font-size: 1rem; font-weight: 600; color: var(--text); }
    .header-meta { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; font-family: var(--font-label); }

    /* ── Layout ── */
    .container { max-width: 960px; margin: 0 auto; padding: 20px 20px 48px; }
    .section-label {
      font-family: var(--font-label); font-size: 0.7rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 7px;
    }

    /* ── Station dropdown ── */
    .station-select-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
      min-width: 220px;
      max-width: 300px;
      width: 100%;
    }
    .station-select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
      font-size: 1rem;
    }
    .station-dropdown {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 8px 36px 8px 14px;
      font-family: var(--font-label);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .station-dropdown:hover, .station-dropdown:focus { border-color: var(--accent); }
    .station-dropdown option, .station-dropdown optgroup {
      background: #1a1d2e;
      color: #e8eaf6;
      font-family: sans-serif;
    }
    .station-dropdown optgroup { font-weight: 700; }

    /* ── Controls section ── */
    .controls-section { margin-bottom: 14px; }
    .top-controls-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .elem-toggle {
      display: flex; background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; overflow: hidden;
    }
    .elem-btn {
      font-family: var(--font-label); font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 18px;
      border: none; background: transparent; color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    }
    .elem-btn + .elem-btn { border-left: 1px solid var(--border); }
    .elem-btn.active { background: var(--surface2); color: var(--text); }

    /* ── Right button group ── */
    .right-btn-group { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
    .obs-btn {
      font-family: var(--font-label); font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 16px;
      border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .obs-btn:hover:not(:disabled) { border-color: var(--obs); color: var(--obs); }
    .obs-btn.active { border-color: var(--obs); color: var(--obs); background: rgba(58,175,169,0.12); }
    .obs-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .obs-pulse {
      width: 9px; height: 9px; border-radius: 50%; background: var(--obs);
      display: none; flex-shrink: 0; animation: obspulse 1.8s ease-in-out infinite;
    }
    .obs-btn.active .obs-pulse { display: block; }
    @keyframes obspulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.55; transform: scale(0.75); }
    }
    .curve-btn {
      font-family: var(--font-label); font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 16px;
      border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .curve-btn:hover { border-color: rgba(255,255,255,0.38); color: var(--text); }
    .curve-btn.active { border-color: rgba(255,255,255,0.52); color: var(--text); background: rgba(255,255,255,0.08); }
    .obs-readout {
      display: none; align-items: center; gap: 11px;
      background: rgba(58,175,169,0.08); border: 1px solid rgba(58,175,169,0.32);
      border-radius: 6px; padding: 10px 16px; margin-bottom: 10px;
    }
    .obs-readout.visible { display: flex; }
    .obs-readout-dot   { width: 10px; height: 10px; border-radius: 50%; background: var(--obs); flex-shrink: 0; }
    .obs-readout-label { font-family: var(--font-label); font-size: 0.94rem; font-weight: 600; color: var(--obs); letter-spacing: 0.04em; }
    .obs-readout-time  { font-family: var(--font-label); font-size: 0.78rem; color: var(--text-dim); margin-left: auto; white-space: nowrap; }
    .compare-toggle-btn {
      font-family: var(--font-label); font-size: 0.82rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 16px;
      border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); cursor: pointer; transition: all 0.2s;
    }
    .compare-toggle-btn::before { content: '⇄  '; font-size: 0.9em; }
    .compare-toggle-btn:hover { border-color: var(--text-dim); color: var(--text); }
    .compare-toggle-btn.active { border-color: var(--col-a); color: var(--col-a); background: rgba(74,144,217,0.1); }

    /* ── Period buttons ── */
    .period-btn-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .period-btn {
      font-family: var(--font-label); font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.04em; padding: 4px 12px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-dim); cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .period-btn:hover:not(:disabled) { border-color: var(--text-dim); color: var(--text); }
    .period-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .period-btn.active-single { background: var(--surface2); border-color: var(--text); color: var(--text); }
    .period-btn.active-a { background: rgba(74,144,217,0.15); border-color: var(--col-a); color: var(--col-a); }
    .period-btn.active-b { background: rgba(212,96,26,0.15);  border-color: var(--col-b); color: var(--col-b); }

    /* ── Single / Compare controls ── */
    #single-controls { display: block; }
    .single-period-row { margin-bottom: 10px; }
    .slider-row { display: flex; align-items: center; gap: 12px; padding: 8px 0 2px; transition: opacity 0.2s; }
    .slider-row.dimmed { opacity: 0.45; }
    .slider-lbl {
      font-family: var(--font-label); font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap;
    }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; flex: 1;
      height: 4px; background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: var(--accent); cursor: pointer; transition: transform 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }
    input[type="range"]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer;
    }
    .slider-window {
      font-family: var(--font-mono); font-size: 0.78rem;
      color: var(--text-dim); white-space: nowrap; min-width: 90px; text-align: right;
    }

    #compare-controls { display: none; }
    .compare-period-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
    .compare-period-label {
      font-family: var(--font-label); font-size: 0.78rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase; min-width: 64px;
    }
    .compare-period-label.a { color: var(--col-a); }
    .compare-period-label.b { color: var(--col-b); }

    /* ── Zone legend ── */
    .zone-legend { display: flex; border-radius: 4px; overflow: hidden; margin-bottom: 14px; height: 24px; }
    .zone-swatch {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-label); font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
      overflow: hidden; color: rgba(255,255,255,0.82);
    }

    /* ── Chart card ── */
    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px 20px 14px; margin-bottom: 14px;
    }
    .compare-legend { display: none; gap: 20px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .compare-legend.visible { display: flex; }
    .cl-item { display: flex; align-items: center; gap: 7px; }
    .cl-dot { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .cl-dot.a { background: var(--col-a); }
    .cl-dot.b { background: var(--col-b); }
    .cl-text { font-family: var(--font-label); font-size: 0.8rem; font-weight: 600; color: var(--text-dim); }
    .cl-text span { color: var(--text); }

    .chart-wrap { position: relative; height: 390px; }
    #main-chart { display: none; }

    .state-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      gap: 12px; color: var(--text-dim); font-family: var(--font-label);
      font-size: 0.9rem; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .spinner {
      width: 28px; height: 28px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Stat chips ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; }
    .stat-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px 16px; transition: border-color 0.15s;
    }
    .stat-chip:hover { border-color: var(--accent); }
    .stat-chip .lbl {
      font-family: var(--font-label); font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin-bottom: 5px;
    }
    .stat-chip .val { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 500; color: var(--text); line-height: 1; }
    .stat-chip .unit { font-family: var(--font-label); font-size: 0.75rem; color: var(--text-dim); margin-left: 3px; }
    .stat-chip .sub  { font-family: var(--font-label); font-size: 0.68rem; color: var(--text-dim); margin-top: 3px; }

    /* ── Shift card ── */
    .shift-card { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 20px; }
    .shift-card.visible { display: block; }
    .shift-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .shift-period { font-family: var(--font-mono); font-size: 1.2rem; font-weight: 500; }
    .shift-period.a { color: var(--col-a); }
    .shift-period.b { color: var(--col-b); }
    .shift-arrow { color: var(--text-dim); font-size: 1.1rem; }
    .shift-delta { font-family: var(--font-mono); font-size: 1.5rem; font-weight: 500; margin-left: auto; }
    .shift-delta.pos  { color: #e07050; }
    .shift-delta.neg  { color: #60b0e0; }
    .shift-delta.zero { color: var(--text-dim); }
    .shift-sub { font-family: var(--font-label); font-size: 0.72rem; letter-spacing: 0.04em; color: var(--text-dim); text-transform: uppercase; }
  </style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-title-block">
      <div class="header-top">
        <h1>Temperature Frequency</h1>
        <span class="header-station" id="hdr-station"></span>
      </div>
      <div class="header-meta" id="hdr-meta">Select a station to begin</div>
    </div>
    <a href="https://contextclimate.io" class="cc-link-btn" target="_top">contextclimate.io</a>
  </div>
</div>

<div class="container">

  <div class="section-label">Location</div>
  <div class="station-select-wrap">
    <select id="station-select" class="station-dropdown"></select>
  </div>

  <div class="controls-section">
    <div class="top-controls-row">
      <div class="elem-toggle">
        <button class="elem-btn active" data-elem="maxt">Daily High</button>
        <button class="elem-btn"        data-elem="mint">Daily Low</button>
        <button class="elem-btn"        data-elem="hourly">Hourly Obs</button>
      </div>
      <div class="right-btn-group">
        <button class="curve-btn" id="curve-btn" onclick="toggleCurve()"><span id="curve-btn-label">&#x223C; KDE Curve</span></button>
        <button class="obs-btn" id="obs-btn" onclick="fetchCurrentObs()">
          <span class="obs-pulse"></span>
          <span id="obs-btn-label">&#x2295; Plot Current Obs</span>
        </button>
        <button class="compare-toggle-btn" id="compare-toggle">Compare Periods</button>
      </div>
    </div>

    <div id="single-controls">
      <div class="single-period-row">
        <div class="period-btn-group" id="single-period-btns"></div>
      </div>
      <div class="slider-row" id="slider-row">
        <span class="slider-lbl">30-yr window</span>
        <input type="range" id="period-slider" min="1960" max="2010" value="2005" step="1">
        <span class="slider-window" id="slider-window-label"></span>
      </div>
    </div>

    <div id="compare-controls">
      <div class="compare-period-row">
        <span class="compare-period-label a">Period A</span>
        <div class="period-btn-group" id="period-a-btns"></div>
      </div>
      <div class="compare-period-row">
        <span class="compare-period-label b">Period B</span>
        <div class="period-btn-group" id="period-b-btns"></div>
      </div>
    </div>
  </div>

  <div class="zone-legend" id="zone-legend"></div>

  <div class="chart-card">
    <div class="compare-legend" id="compare-legend">
      <div class="cl-item"><div class="cl-dot a"></div><div class="cl-text" id="cl-a-text"></div></div>
      <div class="cl-item"><div class="cl-dot b"></div><div class="cl-text" id="cl-b-text"></div></div>
    </div>
    <div class="chart-wrap">
      <div class="state-overlay" id="state-overlay"><div class="spinner"></div> Loading data…</div>
      <canvas id="main-chart"></canvas>
    </div>
  </div>

  <div class="obs-readout" id="obs-readout">
    <div class="obs-readout-dot"></div>
    <div class="obs-readout-label" id="obs-readout-label"></div>
    <div class="obs-readout-time"  id="obs-readout-time"></div>
  </div>

  <div class="chart-actions">
    <button class="action-pill" id="copy-img-btn" onclick="copyChartImage()">⧉ Copy Image</button>
  </div>

  <div class="stats-grid" id="stats-grid"></div>
  <div class="shift-card" id="shift-card"></div>

</div>

<script>
// ═══════════════════════════════════════════════
//  Station data
// ═══════════════════════════════════════════════
const STATION_REGIONS = [
  { region: 'Northeast', stations: [
    { label: 'Portland, ME',      sid: 'KPWM' },
    { label: 'Burlington, VT',    sid: 'KBTV' },
    { label: 'Albany, NY',        sid: 'KALB' },
    { label: 'Buffalo, NY',       sid: 'KBUF' },
    { label: 'Boston, MA',        sid: 'KBOS' },
    { label: 'Providence, RI',    sid: 'KPVD' },
    { label: 'Hartford, CT',      sid: 'KBDL' },
    { label: 'Bridgeport, CT',    sid: 'KBDR' },
    { label: 'Islip (KISP), NY',  sid: 'KISP' },
    { label: 'New York (JFK)',     sid: 'KJFK' },
    { label: 'New York (LGA)',     sid: 'KLGA' },
    { label: 'Central Park, NY',  sid: '94728 6', iemSid: 'KNYC', sidFallbacks: ['305801 3', 'KNYC'] },
  ]},
  { region: 'Mid-Atlantic', stations: [
    { label: 'Newark, NJ',        sid: 'KEWR' },
    { label: 'Trenton, NJ',       sid: 'KTTN' },
    { label: 'Philadelphia, PA',  sid: 'KPHL' },
    { label: 'Pittsburgh, PA',    sid: 'KPIT' },
    { label: 'Baltimore, MD',     sid: 'KBWI' },
    { label: 'Washington DC',     sid: 'KDCA' },
    { label: 'Norfolk, VA',       sid: 'KORF' },
    { label: 'Richmond, VA',      sid: 'KRIC' },
  ]},
  { region: 'Southeast', stations: [
    { label: 'Charlotte, NC',     sid: 'KCLT' },
    { label: 'Raleigh, NC',       sid: 'KRDU' },
    { label: 'Atlanta, GA',       sid: 'KATL' },
    { label: 'Jacksonville, FL',  sid: 'KJAX' },
    { label: 'Tampa, FL',         sid: 'KTPA' },
    { label: 'Orlando, FL',       sid: 'KMCO' },
    { label: 'Miami, FL',         sid: 'KMIA' },
  ]},
  { region: 'Midwest', stations: [
    { label: 'Cleveland, OH',     sid: 'KCLE' },
    { label: 'Columbus, OH',      sid: 'KCMH' },
    { label: 'Detroit, MI',       sid: 'KDTW' },
    { label: 'Chicago, IL',       sid: 'KORD' },
    { label: 'Indianapolis, IN',  sid: 'KIND'  },
    { label: 'Milwaukee, WI',     sid: 'KMKE' },
    { label: 'Minneapolis, MN',   sid: 'KMSP' },
    { label: 'Kansas City, MO',   sid: 'KMCI' },
    { label: 'St. Louis, MO',     sid: 'KSTL' },
    { label: 'Omaha, NE',         sid: 'KOMA' },
    { label: 'Des Moines, IA',    sid: 'KDSM' },
  ]},
  { region: 'South / Central', stations: [
    { label: 'Louisville, KY',    sid: 'KSDF' },
    { label: 'Nashville, TN',     sid: 'KBNA' },
    { label: 'Memphis, TN',       sid: 'KMEM' },
    { label: 'Little Rock, AR',   sid: 'KLIT' },
    { label: 'New Orleans, LA',   sid: 'KMSY' },
    { label: 'Houston, TX',       sid: 'KIAH' },
    { label: 'Dallas/Fort Worth', sid: 'KDFW' },
    { label: 'San Antonio, TX',   sid: 'KSAT' },
    { label: 'Oklahoma City, OK', sid: 'KOKC' },
  ]},
  { region: 'Mountain / Southwest', stations: [
    { label: 'Denver, CO',        sid: 'KDEN' },
    { label: 'Albuquerque, NM',   sid: 'KABQ' },
    { label: 'Salt Lake City, UT',sid: 'KSLC' },
    { label: 'Boise, ID',         sid: 'KBOI' },
    { label: 'Phoenix, AZ',       sid: 'KPHX' },
    { label: 'Tucson, AZ',        sid: 'KTUS' },
    { label: 'Las Vegas, NV',     sid: 'KLAS' },
  ]},
  { region: 'West Coast', stations: [
    { label: 'Seattle, WA',       sid: 'KSEA' },
    { label: 'Portland, OR',      sid: 'KPDX' },
    { label: 'San Francisco, CA', sid: 'KSFO' },
    { label: 'Sacramento, CA',    sid: 'KSMF' },
    { label: 'Los Angeles, CA',   sid: 'KLAX' },
    { label: 'San Diego, CA',     sid: 'KSAN' },
  ]},
];

// Flat lookup map sid → station object
const STATIONS_FLAT = {};
STATION_REGIONS.forEach(r => r.stations.forEach(s => { STATIONS_FLAT[s.sid] = s; }));

// ═══════════════════════════════════════════════
//  Normal distribution helpers
// ═══════════════════════════════════════════════
function normalPDF(x, mean, sigma) {
  return (1 / (sigma * Math.sqrt(2 * Math.PI))) *
         Math.exp(-0.5 * Math.pow((x - mean) / sigma, 2));
}
function computeKDE(bins, bandwidth) {
  // Binned KDE: approximate the kernel sum using existing bin counts as weights.
  // Total area matches the histogram (sum of count * BIN_SIZE).
  return bins.map(target => {
    let sum = 0;
    for (const src of bins) {
      if (src.count > 0) sum += src.count * normalPDF(target.center, src.center, bandwidth);
    }
    return sum * BIN_SIZE;
  });
}


// ═══════════════════════════════════════════════
//  Color helpers
// ═══════════════════════════════════════════════
function zoneForTemp(t) {
  return ZONES.find(z => t >= z.lo && t < z.hi) || ZONES[ZONES.length - 1];
}

function getTempColor(temp, alpha = 0.88) {
  const stops = [
    { t: -20, r: 20,  g: 50,  b: 200 },
    { t: 10,  r: 40,  g: 110, b: 230 },
    { t: 32,  r: 40,  g: 175, b: 200 },
    { t: 50,  r: 60,  g: 190, b: 110 },
    { t: 65,  r: 140, g: 200, b: 50  },
    { t: 78,  r: 240, g: 190, b: 20  },
    { t: 88,  r: 255, g: 110, b: 10  },
    { t: 96,  r: 210, g: 30,  b: 10  },
    { t: 110, r: 140, g: 0,   b: 0   },
  ];
  if (temp <= stops[0].t) return `rgba(${stops[0].r},${stops[0].g},${stops[0].b},${alpha})`;
  const last = stops[stops.length - 1];
  if (temp >= last.t) return `rgba(${last.r},${last.g},${last.b},${alpha})`;
  for (let i = 0; i < stops.length - 1; i++) {
    if (temp <= stops[i + 1].t) {
      const s0 = stops[i], s1 = stops[i + 1], f = (temp - s0.t) / (s1.t - s0.t);
      return `rgba(${Math.round(s0.r+f*(s1.r-s0.r))},${Math.round(s0.g+f*(s1.g-s0.g))},${Math.round(s0.b+f*(s1.b-s0.b))},${alpha})`;
    }
  }
}

// ═══════════════════════════════════════════════
//  Data helpers
// ═══════════════════════════════════════════════
function getFilteredTemps(startYear, endYear) {
  if (!rawData) return [];
  return rawData
    .filter(([date, val]) => {
      if (!val || val === 'M' || val === 'T') return false;
      const y = parseInt(date.substring(0, 4), 10);
      if (startYear && y < startYear) return false;
      if (endYear   && y > endYear)   return false;
      return true;
    })
    .map(([, val]) => parseFloat(val))
    .filter(t => !isNaN(t));
}

function buildBins(temps) {
  const bins = [];
  for (let t = BIN_START; t < 112; t += BIN_SIZE) {
    bins.push({ lo: t, hi: t + BIN_SIZE, center: t + BIN_SIZE / 2, count: 0 });
  }
  temps.forEach(t => {
    const idx = Math.floor((t - BIN_START) / BIN_SIZE);
    if (idx >= 0 && idx < bins.length) bins[idx].count++;
  });
  return bins;
}

function visibleSlice(binsArr) {
  let first = Infinity, last = -Infinity;
  binsArr.forEach(bins => {
    const f = bins.findIndex(b => b.count > 0);
    const r = [...bins].reverse().findIndex(b => b.count > 0);
    const l = bins.length - 1 - r;
    if (f >= 0 && f < first) first = f;
    if (l >= 0 && l > last)  last  = l;
  });
  if (first === Infinity) return { first: 0, last: binsArr[0].length - 1 };
  return { first: Math.max(0, first - 2), last: Math.min(binsArr[0].length - 1, last + 2) };
}

function periodAvailable(period) {
  if (!period.startYear) return true;
  const { firstYear, lastYear } = stationPOR;
  if (!firstYear) return false;
  return Math.min(period.endYear, lastYear) - Math.max(period.startYear, firstYear) >= 15;
}

// ═══════════════════════════════════════════════
//  Stats — interpolated median for decimal precision
// ═══════════════════════════════════════════════
function computeStats(temps, elem) {
  if (!temps.length) return null;
  const sorted   = [...temps].sort((a, b) => a - b);
  const n        = temps.length;
  const meanR    = temps.reduce((s, t) => s + t, 0) / n;
  const variance = temps.reduce((s, t) => s + Math.pow(t - meanR, 2), 0) / n;
  const sigma    = Math.sqrt(variance);
  const mid      = Math.floor(n / 2);
  const medianRaw = n % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];
  return {
    n, sigma, meanRaw: meanR,
    mean:      meanR.toFixed(1),
    medianRaw,
    median:    Math.round(medianRaw),
    hot90:     temps.filter(t => t >= 90).length,
    cold20:    temps.filter(t => t <= 20).length,
    warm75:    temps.filter(t => t >= 75).length,
    cold10:    temps.filter(t => t <= 10).length,
    freeze:    temps.filter(t => t <= 32).length,
  };
}

function pct(n, total) { return ((n / total) * 100).toFixed(1) + '%'; }

function renderStats(stats, elem) {
  const el = document.getElementById('stats-grid');
  if (!stats) { el.innerHTML = ''; return; }
  const isHigh = elem === 'maxt';
  const chips  = isHigh ? [
    { lbl: 'Days on Record',  val: stats.n.toLocaleString(),       unit: '',   sub: '' },
    { lbl: 'Mean Daily High', val: stats.mean,                     unit: '°F', sub: '' },
    { lbl: 'Median High',     val: stats.median,                   unit: '°F', sub: '' },
    { lbl: '≥ 90°F Days',     val: stats.hot90.toLocaleString(),   unit: '',   sub: pct(stats.hot90,  stats.n) + ' of record' },
    { lbl: '≤ 20°F Days',     val: stats.cold20.toLocaleString(),  unit: '',   sub: pct(stats.cold20, stats.n) + ' of record' },
  ] : elem === 'mint' ? [
    { lbl: 'Days on Record', val: stats.n.toLocaleString(),        unit: '',   sub: '' },
    { lbl: 'Mean Daily Low', val: stats.mean,                      unit: '°F', sub: '' },
    { lbl: 'Median Low',     val: stats.median,                    unit: '°F', sub: '' },
    { lbl: '≥ 75°F Nights',  val: stats.warm75.toLocaleString(),   unit: '',   sub: pct(stats.warm75, stats.n) + ' of record' },
    { lbl: '≤ 10°F Nights',  val: stats.cold10.toLocaleString(),   unit: '',   sub: pct(stats.cold10, stats.n) + ' of record' },
  ] : [
    { lbl: 'Hourly Observations', val: stats.n.toLocaleString(),      unit: '',   sub: '' },
    { lbl: 'Mean Temperature',    val: stats.mean,                    unit: '°F', sub: '' },
    { lbl: 'Median Temperature',  val: stats.median,                  unit: '°F', sub: '' },
    { lbl: '≥ 90°F Hours',        val: stats.hot90.toLocaleString(),  unit: '',   sub: pct(stats.hot90,  stats.n) + ' of record' },
    { lbl: '≤ 32°F Hours',        val: stats.freeze.toLocaleString(), unit: '',   sub: pct(stats.freeze, stats.n) + ' of record · at/below freezing' },
  ];
  el.innerHTML = chips.map(c => `
    <div class="stat-chip">
      <div class="lbl">${c.lbl}</div>
      <div class="val">${c.val}<span class="unit">${c.unit}</span></div>
      ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
    </div>`).join('');
}

function renderShiftCard(pA, pB, tempsA, tempsB, elem) {
  const card   = document.getElementById('shift-card');
  const statsA = computeStats(tempsA, elem);
  const statsB = computeStats(tempsB, elem);
  if (!statsA || !statsB) { card.innerHTML = ''; return; }

  // Use medianRaw (float) for true decimal delta
  const delta  = statsB.medianRaw - statsA.medianRaw;
  const sign   = delta > 0 ? '+' : '';
  const cls    = delta > 0 ? 'pos' : delta < 0 ? 'neg' : 'zero';
  const eLabel = elem === 'maxt' ? 'median daily high' : 'median daily low';

  // Format median display: show .5 if not whole, else integer
  const fmtMed = v => Number.isInteger(v) ? v : v.toFixed(1);

  document.getElementById('cl-a-text').innerHTML =
    `<span>${pA.label}</span>  ${fmtMed(statsA.medianRaw)}°F ${eLabel}`;
  document.getElementById('cl-b-text').innerHTML =
    `<span>${pB.label}</span>  ${fmtMed(statsB.medianRaw)}°F ${eLabel}`;

  card.innerHTML = `
    <div class="shift-row">
      <span class="shift-period a">${pA.label}: ${fmtMed(statsA.medianRaw)}°F</span>
      <span class="shift-arrow">→</span>
      <span class="shift-period b">${pB.label}: ${fmtMed(statsB.medianRaw)}°F</span>
      <span class="shift-delta ${cls}">${sign}${delta.toFixed(1)}°F</span>
    </div>
    <div class="shift-sub">Shift in ${eLabel} between selected periods · n = ${statsA.n.toLocaleString()} vs ${statsB.n.toLocaleString()} days</div>
  `;
}

// ═══════════════════════════════════════════════
//  Chart.js threshold lines plugin
// ═══════════════════════════════════════════════
const thresholdLinesPlugin = {
  id: 'thresholdLines',
  afterDraw(ch) {
    const { ctx, chartArea, data, scales } = ch;
    const labels = data.labels;
    const xScale = scales.x;
    THRESHOLDS.forEach(({ temp, label, color }) => {
      const idx = labels.findIndex(l => parseInt(l, 10) >= temp);
      if (idx < 0) return;
      const x = xScale.getPixelForValue(idx);
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(x, chartArea.top + 4); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
      ctx.fillStyle = color; ctx.font = '600 11px "Barlow Condensed", sans-serif';
      ctx.textAlign = 'center'; ctx.setLineDash([]);
      ctx.fillText(label, x, chartArea.top + 13);
      ctx.restore();
    });
  }
};

const sigmaLinesPlugin = {
  id: 'sigmaLines',
  afterDraw(ch) {
    if (!showCurve || !curveStats) return;
    const { ctx, chartArea, data, scales } = ch;
    const labels = data.labels;
    if (!labels.length) return;
    const xScale     = scales.x;
    const firstBinLo = parseInt(labels[0], 10);
    const x0 = xScale.getPixelForValue(0);
    const x1 = labels.length > 1 ? xScale.getPixelForValue(labels.length - 1) : x0;
    const pxPerBin   = labels.length > 1 ? (x1 - x0) / (labels.length - 1) : 1;
    const toPixel    = val => x0 + ((val - firstBinLo) / BIN_SIZE) * pxPerBin;
    const { meanRaw } = curveStats;

    // μ reference line — mean of the distribution; KDE shape is fully data-driven
    const mx = toPixel(meanRaw);
    if (mx >= chartArea.left && mx <= chartArea.right) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 3]);
      ctx.beginPath(); ctx.moveTo(mx, chartArea.top + 4); ctx.lineTo(mx, chartArea.bottom); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '600 11px "Barlow Condensed", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u03bc', mx, chartArea.top + 28);
      ctx.restore();
    }
  }
};

const currentObsPlugin = {
  id: 'currentObs',
  afterDraw(ch) {
    if (currentObsTemp === null) return;
    const { ctx, chartArea, data, scales } = ch;
    const labels = data.labels;
    const xScale = scales.x;
    const OBS_COLOR = '#3AAFA9';

    let idx = -1;
    for (let i = 0; i < labels.length; i++) {
      const lo = parseInt(labels[i], 10);
      if (currentObsTemp >= lo && currentObsTemp < lo + BIN_SIZE) { idx = i; break; }
    }
    if (idx < 0) idx = currentObsTemp < parseInt(labels[0], 10) ? 0 : labels.length - 1;

    const x = xScale.getPixelForValue(idx);

    ctx.save();
    ctx.strokeStyle = OBS_COLOR; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(x, chartArea.top); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
    ctx.setLineDash([]);

    const text = 'NOW \u00b7 ' + Math.round(currentObsTemp) + '\u00b0F';
    ctx.font = '700 13px "Barlow Condensed", sans-serif';
    const tw = ctx.measureText(text).width;
    const padX = 9, boxW = tw + padX * 2, boxH = 23, triH = 7;
    const boxY = chartArea.top + 26;
    let boxX = x - boxW / 2;
    boxX = Math.max(chartArea.left + 2, Math.min(chartArea.right - boxW - 2, boxX));
    const triX = Math.max(boxX + 9, Math.min(boxX + boxW - 9, x));
    const rad = 4;

    ctx.fillStyle = OBS_COLOR;
    ctx.beginPath();
    ctx.moveTo(boxX + rad, boxY);
    ctx.lineTo(boxX + boxW - rad, boxY);
    ctx.arcTo(boxX + boxW, boxY,        boxX + boxW, boxY + rad,        rad);
    ctx.lineTo(boxX + boxW, boxY + boxH - rad);
    ctx.arcTo(boxX + boxW, boxY + boxH, boxX + boxW - rad, boxY + boxH, rad);
    ctx.lineTo(boxX + rad, boxY + boxH);
    ctx.arcTo(boxX,        boxY + boxH, boxX,        boxY + boxH - rad, rad);
    ctx.lineTo(boxX, boxY + rad);
    ctx.arcTo(boxX,        boxY,        boxX + rad,  boxY,              rad);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(triX - 5, boxY + boxH);
    ctx.lineTo(triX + 5, boxY + boxH);
    ctx.lineTo(triX,     boxY + boxH + triH);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, boxX + boxW / 2, boxY + boxH / 2);
    ctx.restore();
  }
};

// ═══════════════════════════════════════════════
//  Chart render
// ═══════════════════════════════════════════════
function renderChart(datasets) {
  const { first, last } = visibleSlice(datasets.map(d => d.bins));
  const visible0 = datasets[0].bins.slice(first, last + 1);
  const labels   = visible0.map(b => String(b.lo));

  const chartDatasets = datasets.map((ds, i) => {
    const visible  = ds.bins.slice(first, last + 1);
    const bgColors = visible.map(b => ds.colorFn ? ds.colorFn(b.center) : ds.solidColor);
    return {
      label: ds.label, data: visible.map(b => b.count),
      backgroundColor: bgColors, borderColor: bgColors,
      borderWidth: 0, borderRadius: 1,
      barPercentage: 1.0, categoryPercentage: 0.97, order: i,
    };
  });

  // KDE curve overlay — non-parametric; captures bimodal / skewed shapes.
  // Bandwidth via Silverman's rule: h = 1.06 * sigma * n^(-0.2)
  if (showCurve && curveStats) {
    const { sigma, n } = curveStats;
    const bandwidth = 1.06 * sigma * Math.pow(n, -0.2);
    chartDatasets.push({
      type: 'line', label: 'KDE',
      data: computeKDE(visible0, bandwidth),
      borderColor: 'rgba(255,255,255,0.82)', backgroundColor: 'transparent',
      borderWidth: 2.5, pointRadius: 0, tension: 0.4, fill: false,
    });
  }

  if (chart) { chart.destroy(); chart = null; }
  const canvas = document.getElementById('main-chart');
  const ctx    = canvas.getContext('2d');

  chart = new Chart(ctx, {
    type: 'bar',
    plugins: [thresholdLinesPlugin, sigmaLinesPlugin, currentObsPlugin],
    data: { labels, datasets: chartDatasets },
    options: {
      grouped: false, responsive: true, maintainAspectRatio: false, animation: { duration: 320 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1d2e', borderColor: '#2d3250', borderWidth: 1, padding: 10,
          titleColor: '#e8eaf6', bodyColor: '#8890b0',
          titleFont: { family: 'Barlow Condensed', size: 13, weight: '600' },
          bodyFont:  { family: 'JetBrains Mono',   size: 12 },
          callbacks: {
            title([item]) {
              const lo = parseInt(item.label, 10);
              const hi = lo + BIN_SIZE;
              const tempLabel = BIN_SIZE === 1 ? `${lo}°F` : `${lo}°F – ${hi}°F`;
              return `${tempLabel}  ·  ${zoneForTemp(lo + BIN_SIZE / 2).label}`;
            },
            label(item) {
              const total = item.dataset.data.reduce((s, v) => s + v, 0);
              const p     = total > 0 ? ((item.raw / total) * 100).toFixed(2) : '0.00';
              const pfx   = datasets.length > 1 ? item.dataset.label + ': ' : '';
              const unit = isHourly() ? 'obs' : 'days';
              return ` ${pfx}${item.raw.toLocaleString()} ${unit} (${p}%)`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false }, border: { color: '#2d3250' },
          ticks: {
            font: { family: 'Barlow Condensed', size: 11 }, color: '#8890b0', maxRotation: 0,
            callback(val, idx) {
              const t = parseInt(this.getLabelForValue(idx), 10);
              return t % 10 === 0 ? t + '°' : '';
            }
          }
        },
        y: {
          grid: { color: 'rgba(45,50,80,0.5)' }, border: { color: '#2d3250' },
          ticks: { font: { family: 'Barlow Condensed', size: 11 }, color: '#8890b0' },
          title: { display: true, text: isHourly() ? 'Hourly Observations' : 'Number of Days', font: { family: 'Barlow Condensed', size: 12 }, color: '#8890b0' }
        }
      }
    }
  });
}

// ═══════════════════════════════════════════════
//  Master update
// ═══════════════════════════════════════════════
function updateChart() {
  if (!rawData) return;
  if (compareMode && !isHourly()) {
    curveStats = null;
    const tempsA = getFilteredTemps(periodA.startYear, periodA.endYear);
    const tempsB = getFilteredTemps(periodB.startYear, periodB.endYear);
    renderChart([
      { bins: buildBins(tempsA), colorFn: null, solidColor: 'rgba(74,144,217,0.75)',  label: periodA.label },
      { bins: buildBins(tempsB), colorFn: null, solidColor: 'rgba(212,96,26,0.62)',   label: periodB.label },
    ]);
    renderShiftCard(periodA, periodB, tempsA, tempsB, currentElem);
  } else {
    const period = sliderActive ? sliderPeriod : singlePeriod;
    const temps  = getFilteredTemps(period.startYear, period.endYear);
    const stats  = computeStats(temps, currentElem);
    curveStats   = (showCurve && stats) ? { meanRaw: stats.meanRaw, sigma: stats.sigma, n: stats.n } : null;
    renderChart([{ bins: buildBins(temps), colorFn: t => getTempColor(t), solidColor: null, label: period.label }]);
    renderStats(stats, currentElem);
  }
}

// ═══════════════════════════════════════════════
//  Slider
// ═══════════════════════════════════════════════
function initSlider() {
  const { firstYear, lastYear } = stationPOR;
  const slider = document.getElementById('period-slider');
  const minC   = (firstYear || 1951) + 15;
  const maxC   = (lastYear  || 2020) - 14;
  slider.min   = minC;
  slider.max   = maxC;
  slider.value = Math.min(maxC, 2006);
  updateSliderLabel(parseInt(slider.value, 10));
  document.getElementById('slider-row').classList.add('dimmed');
}

function updateSliderLabel(center) {
  const start = center - 15, end = center + 14;
  document.getElementById('slider-window-label').textContent = `${start}–${end}`;
  sliderPeriod = { label: `${start}–${end}`, startYear: start, endYear: end };
}

function syncSliderToFixedPeriod(period) {
  const slider = document.getElementById('period-slider');
  const min = parseInt(slider.min, 10), max = parseInt(slider.max, 10);
  const center = !period.startYear
    ? Math.floor((min + max) / 2)
    : Math.floor((period.startYear + period.endYear) / 2);
  slider.value = Math.max(min, Math.min(max, center));
  updateSliderLabel(parseInt(slider.value, 10));
}

// ═══════════════════════════════════════════════
//  Period button builders
// ═══════════════════════════════════════════════
function buildSinglePeriodButtons() {
  const container = document.getElementById('single-period-btns');
  container.innerHTML = '';
  FIXED_PERIODS.forEach(period => {
    const btn = document.createElement('button');
    btn.className   = 'period-btn';
    btn.textContent = period.label;
    btn.disabled    = !periodAvailable(period);
    if (period.label === singlePeriod.label) btn.classList.add('active-single');
    btn.onclick = () => {
      if (btn.disabled) return;
      singlePeriod = period; sliderActive = false;
      document.querySelectorAll('#single-period-btns .period-btn').forEach(b => b.classList.remove('active-single'));
      btn.classList.add('active-single');
      document.getElementById('slider-row').classList.add('dimmed');
      syncSliderToFixedPeriod(period);
      updateChart();
    };
    container.appendChild(btn);
  });
}

function buildComparePeriodButtons(containerId, activeGetter, activeSetter, activeClass) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  FIXED_PERIODS.forEach(period => {
    if (!period.startYear) return;
    const btn = document.createElement('button');
    btn.className   = 'period-btn';
    btn.textContent = period.label;
    btn.disabled    = !periodAvailable(period);
    if (period.label === activeGetter().label) btn.classList.add(activeClass);
    btn.onclick = () => {
      if (btn.disabled) return;
      activeSetter(period);
      container.querySelectorAll('.period-btn').forEach(b => b.classList.remove(activeClass));
      btn.classList.add(activeClass);
      updateChart();
    };
    container.appendChild(btn);
  });
}

function refreshPeriodButtons() {
  buildSinglePeriodButtons();
  buildComparePeriodButtons('period-a-btns', () => periodA, p => { periodA = p; }, 'active-a');
  buildComparePeriodButtons('period-b-btns', () => periodB, p => { periodB = p; }, 'active-b');
}

// ═══════════════════════════════════════════════
//  Current obs
// ═══════════════════════════════════════════════
function clearObs() {
  currentObsTemp = null;
  obsTimestamp   = null;
  const btn   = document.getElementById('obs-btn');
  const label = document.getElementById('obs-btn-label');
  if (btn)   { btn.classList.remove('active'); btn.disabled = false; }
  if (label) label.textContent = '\u2295 Plot Current Obs';
  document.getElementById('obs-readout').classList.remove('visible');
}

async function fetchCurrentObs() {
  if (!currentStation) return;
  const btn   = document.getElementById('obs-btn');
  const label = document.getElementById('obs-btn-label');

  if (currentObsTemp !== null) {
    clearObs();
    if (chart) chart.update();
    return;
  }

  btn.disabled = true;
  label.textContent = 'Fetching\u2026';

  try {
    // Use IEM (same source as historical data) — more reliable than NWS API
    // which can silently return null for sensor values.
    const iemSid = currentStation.iemSid || currentStation.sid;
    const now  = new Date();
    const past = new Date(now.getTime() - 2 * 3600 * 1000);
    const url  =
      `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py` +
      `?station=${encodeURIComponent(iemSid)}` +
      `&data=tmpf&tz=Etc%2FUTC&format=onlycomma&latlon=no&elev=no` +
      `&missing=M&trace=T&direct=no&report_type=3` +
      `&year1=${past.getUTCFullYear()}&month1=${past.getUTCMonth()+1}&day1=${past.getUTCDate()}` +
      `&hour1=${past.getUTCHours()}&minute1=${past.getUTCMinutes()}` +
      `&year2=${now.getUTCFullYear()}&month2=${now.getUTCMonth()+1}&day2=${now.getUTCDate()}` +
      `&hour2=${now.getUTCHours()}&minute2=${now.getUTCMinutes()}`;

    const res  = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text  = await res.text();
    const lines = text.trim().split('\n');

    // IEM CSV is chronological — walk backwards to get most recent valid reading
    let tmpf = null, obsTime = null;
    for (let i = lines.length - 1; i >= 1; i--) {
      const parts = lines[i].split(',');
      if (parts.length < 3) continue;
      const raw = parts[2].trim();
      if (!raw || raw === 'M') continue;
      const val = parseFloat(raw);
      if (isNaN(val)) continue;
      tmpf    = val;
      obsTime = parts[1].trim(); // 'YYYY-MM-DD HH:MM' UTC
      break;
    }
    if (tmpf === null) throw new Error('No valid temperature in recent IEM data');

    currentObsTemp = tmpf;
    obsTimestamp   = obsTime
      ? new Date(obsTime.replace(' ', 'T') + 'Z').toISOString()
      : null;

    btn.disabled = false;
    btn.classList.add('active');
    label.textContent = '\u2715 Clear Obs';

    const timeStr = obsTimestamp
      ? new Date(obsTimestamp).toLocaleString(undefined, {
          month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
        })
      : '';
    const tempC = (tmpf - 32) * 5 / 9;
    document.getElementById('obs-readout-label').textContent =
      `Current Temp: ${Math.round(currentObsTemp)}\u00b0F  (${tempC.toFixed(1)}\u00b0C)`;
    document.getElementById('obs-readout-time').textContent =
      timeStr ? `Observed ${timeStr}` : '';
    document.getElementById('obs-readout').classList.add('visible');

    if (chart) chart.update();

  } catch (err) {
    console.error('fetchCurrentObs:', err);
    label.textContent = '\u26a0 Unavailable';
    btn.style.borderColor = '#b04040'; btn.style.color = '#b04040';
    setTimeout(() => {
      label.textContent = '\u2295 Plot Current Obs';
      btn.style.borderColor = ''; btn.style.color = ''; btn.disabled = false;
    }, 2600);
  }
}

// ═══════════════════════════════════════════════
//  IEM fetch — hourly temperature (tmpf), routine METARs only.
//  report_type=3 = no specials, no backfill.
// ═══════════════════════════════════════════════
async function fetchIEM(station) {
  const iemSid = station.iemSid || station.sid;
  const key    = station.sid + '__hourly';
  if (cache[key]) return cache[key];

  const url =
    'https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py' +
    '?station=' + encodeURIComponent(iemSid) +
    '&data=tmpf&tz=Etc%2FUTC&format=onlycomma' +
    '&latlon=no&elev=no&missing=M&trace=T&direct=no&report_type=3' +
    '&year1=1940&month1=1&day1=1&year2=2099&month2=12&day2=31';

  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();

  const lines   = text.trim().split('\n');
  const records = [];
  let firstDate = null, lastDate = null;

  for (let i = 1; i < lines.length; i++) {
    const parts   = lines[i].split(',');
    if (parts.length < 3) continue;
    const tmpfStr = parts[2].trim();
    if (!tmpfStr || tmpfStr === 'M') continue;
    const tmpf    = parseFloat(tmpfStr);
    if (isNaN(tmpf)) continue;
    const dateStr = parts[1].substring(0, 10);
    records.push([dateStr, String(tmpf)]);
    if (!firstDate) firstDate = dateStr;
    lastDate = dateStr;
  }

  if (!records.length) throw new Error('No temperature observations for ' + iemSid);

  const por = {
    firstYear: parseInt(firstDate.substring(0, 4), 10),
    lastYear:  parseInt(lastDate.substring(0, 4),  10),
    firstDate, lastDate,
  };

  cache[key] = { data: records, por };
  return cache[key];
}

// ═══════════════════════════════════════════════
//  Fetch
// ═══════════════════════════════════════════════
async function fetchACISOne(sid, elem) {
  const res = await fetch('https://data.rcc-acis.org/StnData', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sid, sdate: 'por', edate: 'por', elems: [{ name: elem }], meta: 'name,state,valid_daterange' })
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.data || json.data.length === 0) throw new Error('No data');
  return json;
}

async function fetchACIS(station, elem) {
  const key  = station.sid + '__' + elem;
  if (cache[key]) return cache[key];
  const sids = [station.sid, ...(station.sidFallbacks || [])];
  let lastErr;
  for (const sid of sids) {
    try {
      const json = await fetchACISOne(sid, elem);
      cache[key] = json; return json;
    } catch (err) {
      lastErr = err;
      console.warn('Fallback from "' + sid + '":', err.message);
    }
  }
  throw lastErr || new Error('All sids failed');
}

// ═══════════════════════════════════════════════
//  Load station
// ═══════════════════════════════════════════════
async function load(station, elem) {
  const stationChanged = !currentStation || currentStation.sid !== station.sid;
  currentStation = station;
  currentElem    = elem;
  singlePeriod   = FIXED_PERIODS[0];

  if (stationChanged) clearObs();

  // Sync dropdown
  const sel = document.getElementById('station-select');
  if (sel && sel.value !== station.sid) sel.value = station.sid;

  // Sync element buttons
  document.querySelectorAll('.elem-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.elem === elem)
  );

  // Show loading
  const overlay = document.getElementById('state-overlay');
  const canvas  = document.getElementById('main-chart');
  overlay.innerHTML = '<div class="spinner"></div> Loading data…';
  overlay.style.display = 'flex';
  canvas.style.display  = 'none';
  document.getElementById('stats-grid').innerHTML = '';
  document.getElementById('shift-card').innerHTML = '';

  try {
    if (elem === 'hourly') {
      const result = await fetchIEM(station);
      rawData    = result.data;
      stationPOR = { firstYear: result.por.firstYear, lastYear: result.por.lastYear };
      document.getElementById('hdr-station').textContent = station.label;
      document.getElementById('hdr-meta').textContent =
        `Period of record: ${result.por.firstDate} – ${result.por.lastDate}  ·  Hourly Obs  ·  Data: IEM / ASOS`;
    } else {
      const json = await fetchACIS(station, elem);
      rawData = json.data;
      const meta = json.meta || {};
      const dr   = meta.valid_daterange?.[0] || [];
      stationPOR = {
        firstYear: dr[0] ? parseInt(dr[0].substring(0, 4), 10) : null,
        lastYear:  dr[1] ? parseInt(dr[1].substring(0, 4), 10) : null,
      };
      document.getElementById('hdr-station').textContent =
        meta.name ? `${meta.name}, ${meta.state || ''}` : station.label;
      document.getElementById('hdr-meta').textContent =
        dr.length === 2
          ? `Period of record: ${dr[0]} – ${dr[1]}  ·  Data: NOAA ACIS`
          : 'Data: NOAA ACIS';
    }

    initSlider();
    refreshPeriodButtons();

    overlay.style.display = 'none';
    canvas.style.display  = 'block';
    updateChart();

  } catch (err) {
    overlay.innerHTML = '<span style="color:#e05050">⚠ Error loading data — please try again.</span>';
    console.error(err);
  }
}

// ═══════════════════════════════════════════════
//  Copy chart as image
// ═══════════════════════════════════════════════
async function copyChartImage() {
  const chartCanvas = document.getElementById('main-chart');
  if (!rawData || chartCanvas.style.display === 'none') return;

  const btn = document.getElementById('copy-img-btn');
  btn.textContent = 'Rendering…';
  btn.disabled = true;

  try {
    const cW = chartCanvas.width;
    const cH = chartCanvas.height;
    const r  = window.devicePixelRatio || 1;

    const PAD = Math.round(24 * r);
    const HDR = Math.round(64 * r);
    const LGD = Math.round(24 * r);
    const GAP = Math.round(10 * r);
    const FTR = Math.round(38 * r);

    const W = cW + PAD * 2;
    const H = PAD + HDR + GAP + LGD + GAP + cH + GAP + FTR + PAD;

    const off = document.createElement('canvas');
    off.width  = W;
    off.height = H;
    const c = off.getContext('2d');

    // Background
    c.fillStyle = '#0f1117';
    c.fillRect(0, 0, W, H);

    let y = PAD;

    // Title + station name on same line
    const titleSz = Math.round(20 * r);
    const stnSz   = Math.round(13 * r);
    c.fillStyle   = '#BA7517';
    c.font        = `700 ${titleSz}px "Barlow Condensed", sans-serif`;
    c.textBaseline = 'top';
    const titleStr = 'TEMPERATURE FREQUENCY';
    c.fillText(titleStr, PAD, y);
    const titleW = c.measureText(titleStr).width;

    const stnText = (document.getElementById('hdr-station').textContent || '').toUpperCase();
    c.fillStyle = '#e8eaf6';
    c.font      = `600 ${stnSz}px "Barlow Condensed", sans-serif`;
    c.fillText(stnText, PAD + titleW + Math.round(14 * r), y + Math.round(5 * r));

    y += Math.round(28 * r);

    // Subtitle: element · period · data source
    const periodStr = compareMode
      ? (periodA.label + ' vs ' + periodB.label)
      : (sliderActive ? sliderPeriod.label : singlePeriod.label);
    const elemStr = isHourly() ? 'Hourly Temperature' : (currentElem === 'maxt' ? 'Daily High Temperature' : 'Daily Low Temperature');
    const dataSrc = isHourly() ? 'IEM / ASOS' : 'NOAA ACIS';
    c.fillStyle = '#8890b0';
    c.font      = `${Math.round(11 * r)}px "Barlow Condensed", sans-serif`;
    c.fillText(`${elemStr}  \u00b7  ${periodStr}  \u00b7  Data: ${dataSrc}`, PAD, y);

    if (currentObsTemp !== null) {
      c.fillStyle = '#3AAFA9';
      c.font = `600 ${Math.round(10.5 * r)}px "Barlow Condensed", sans-serif`;
      c.fillText(`Current Obs: ${Math.round(currentObsTemp)}\u00b0F`, PAD, y + Math.round(16 * r));
      y += Math.round(36 * r);
    } else {
      y += Math.round(22 * r);
    }

    // Zone legend strip
    const zW = (W - PAD * 2) / ZONES.length;
    ZONES.forEach((zone, i) => {
      c.fillStyle = zone.color;
      c.fillRect(PAD + i * zW, y, zW, LGD);
      c.fillStyle = 'rgba(255,255,255,0.82)';
      c.font = `700 ${Math.round(8.5 * r)}px "Barlow Condensed", sans-serif`;
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(zone.label.toUpperCase(), PAD + i * zW + zW / 2, y + LGD / 2);
    });
    c.textAlign = 'left';
    c.textBaseline = 'top';
    y += LGD + GAP;

    // Chart canvas (already has bars, axes, threshold lines)
    c.drawImage(chartCanvas, PAD, y);
    y += cH + GAP;

    // Footer: contextclimate.io branding
    c.fillStyle = '#BA7517';
    c.font = `700 ${Math.round(13 * r)}px "Barlow Condensed", sans-serif`;
    c.textBaseline = 'middle';
    c.fillText('contextclimate.io', PAD, y + FTR / 2);

    // Try clipboard (desktop), fall back to download (mobile / Safari)
    const blob = await new Promise(res => off.toBlob(res, 'image/png'));

    let copied = false;
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        copied = true;
      } catch (e) {
        // clipboard blocked — fall through to download
      }
    }

    if (copied) {
      btn.textContent = '✓ Copied!';
      btn.style.borderColor = '#3a9e50';
      btn.style.color = '#3a9e50';
    } else {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      a.href     = url;
      a.download = 'temperature-frequency.png';
      a.click();
      URL.revokeObjectURL(url);
      btn.textContent = '✓ Saved!';
      btn.style.borderColor = '#3a9e50';
      btn.style.color = '#3a9e50';
    }

    setTimeout(() => {
      btn.textContent = '⧉ Copy Image';
      btn.style.borderColor = '';
      btn.style.color = '';
      btn.disabled = false;
    }, 2200);

  } catch (err) {
    console.error('copyChartImage failed:', err);
    btn.textContent = '⚠ Failed';
    btn.style.color = '#e05050';
    setTimeout(() => {
      btn.textContent = '⧉ Copy Image';
      btn.style.color = '';
      btn.disabled = false;
    }, 2200);
  }
}
