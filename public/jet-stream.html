<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Jet Stream</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 22px; display: inline-flex; align-items: center; gap: 8px; }
.tabs .mph { font-family: var(--font-mono); font-size: 13px; letter-spacing: 0; text-transform: none; opacity: .8; }
.top .spacer { flex: 1; min-width: 0; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 180px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu.open { display: flex; }
.menu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.menu button:hover { background: var(--color-surface); }
.exp .menu { left: 0; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
.stage canvas.grab { cursor: grab; }
.stage canvas.grabbing { cursor: grabbing; }
.stage canvas.pick { cursor: pointer; }

/* floating chips */
.chips { position: absolute; top: 8px; display: flex; align-items: center; gap: 8px; z-index: 5; }
.chips .cc-segmented { background: rgba(38,43,39,.94); }
.chips .cc-segmented-btn { padding: 7px 12px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; background: rgba(38,43,39,.94); }
.chip-box { display: flex; align-items: center; gap: 8px; background: rgba(38,43,39,.94); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 3px 4px 3px 10px; }
.chip-box .lab { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.chip-box .cc-segmented { background: none; }
.chip-box .cc-segmented-btn { padding: 6px 10px; font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-size: 14px; }
.lay { position: relative; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 10px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }

/* click readout */
.tip { position: absolute; display: none; z-index: 6; pointer-events: none; min-width: 168px;
  background: var(--color-surface-2); border: 1px solid var(--tool-accent); border-radius: var(--radius-md);
  padding: 8px 12px 9px; box-shadow: 0 6px 24px rgba(0,0,0,.55); }
.tip .c { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.tip .k { font-family: var(--font-display); font-weight: 700; font-size: 19px; line-height: 1.2; margin: 2px 0 3px; }
.tip .d { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); white-space: nowrap; }

/* control bar */
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border); background: var(--color-surface); min-height: 60px; }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; width: 116px; flex: none; align-self: stretch;
  font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg);
  animation: glow 2.4s ease-in-out infinite; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 17px; }
.play.on { animation: none; opacity: .85; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } 50% { box-shadow: 0 0 0 5px rgba(60,163,174,.28); } }
@media (prefers-reduced-motion: reduce) { .play { animation: none; } }
.snaps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex: 0 1 420px; min-width: 0; }
.snap { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px; min-width: 0; }
.snap .n { font-family: var(--font-body); font-weight: 700; font-size: 15px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.snap .n b { font-family: var(--font-display); font-size: 16px; margin-right: 5px; }
.snap .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.15; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
.sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 2px; flex: none; }
.slider { flex: 1; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 8px; row-gap: 1px; min-width: 120px; align-items: baseline; }
.slider .lab { grid-row: 1; grid-column: 1; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; }
.slider .sv { grid-row: 1; grid-column: 2; font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); text-align: right; white-space: nowrap; line-height: 1.1; }
.slider input { grid-row: 2; grid-column: 1 / 3; width: 100%; accent-color: var(--tool-accent); height: 20px; cursor: pointer; min-width: 60px; margin: 0; }

/* readout card */
.card { padding: 11px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .eb .tm { font-size: 13px; letter-spacing: .04em; color: var(--color-text-primary); }
.card .r { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; text-align: right; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--color-text-secondary); margin-left: 5px; }
.card .sub { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; margin-top: 12px; padding-bottom: 5px; border-bottom: 1px solid var(--color-border-hover); }
.card .sub span:last-child { color: var(--color-text-secondary); font-weight: 500; }
.card table { width: 100%; border-collapse: collapse; }
.card th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; font-weight: 500;
  color: var(--color-text-secondary); text-align: right; padding: 6px 2px 4px; border-bottom: 1px solid var(--color-border); }
.card th:first-child, .card td:first-child { text-align: left; }
.card td { font-family: var(--font-mono); font-size: 17px; font-weight: 700; text-align: right; padding: 6px 2px; border-bottom: 1px solid var(--color-border); white-space: nowrap; color: var(--color-text-primary); }
.card td:first-child { font-family: var(--font-display); font-size: 21px; color: var(--color-text-primary); }
.card td:first-child small { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--color-text-secondary); margin-left: 6px; }
.card tr.sel td:first-child { color: var(--tool-accent); }
.card .cold { color: #6E9BF7; }
.card .warm { color: #EE9A48; }
.card .core { color: var(--tool-accent); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (min-height: 820px) {
  .card .r { padding: 9px 0 8px; }
  .card .v { font-size: 24px; }
  .card td { padding: 9px 2px; }
  .card .sub { margin-top: 18px; }
  .controls { min-height: 66px; }
}
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card td { padding: 4px 2px; }
  .card .sub { margin-top: 9px; }
  .card .v { font-size: 20px; }
}
@media (max-height: 640px) {
  .card .src { display: none; }
  .controls { min-height: 56px; padding: 5px 10px; }
  .snap { padding: 3px 4px; }
}
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 16px; } }
@media (max-width: 1366px) {
  .main { grid-template-columns: minmax(0, 1fr) 272px; }
  .card { padding: 10px 14px; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .top { gap: 10px; }
  .top h1 { font-size: 22px; }
  .tabs .mph { display: none; }
  .exp .cc-btn { padding: 6px 9px; }
  .play { width: 100px; }
  .slider .sv { font-size: 15px; }
  .card .v { font-size: 20px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .snaps { flex-basis: 300px; }
  .card .v { font-size: 18px; }
  .x-link .nm { display: none; }
  .snap .v { display: none; }
  .snap { padding: 9px 4px; }
  .chip-box .lab { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">The Jet Stream</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-season="winter">Winter <span class="mph">165 mph</span></button>
      <button class="cc-segmented-btn" data-season="summer">Summer <span class="mph">95 mph</span></button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <a class="cc-btn x-link" id="lkPrev" target="_top" href="#" title="Planetary Wind Belts">&larr;<span class="nm"> Wind Belts</span></a>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="menu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips" id="chipsL">
          <div class="cc-segmented" id="views">
            <button class="cc-segmented-btn is-active" data-v="map">Map</button>
            <button class="cc-segmented-btn" data-v="section">Section</button>
            <button class="cc-segmented-btn" data-v="both">Both</button>
          </div>
          <div class="lay">
            <button class="cc-btn" id="bLayers">Layers ▾</button>
            <div class="menu" id="lmenu">
              <button class="tgl" data-layer="axes">Trough &amp; ridge axes</button>
              <button class="tgl is-active" data-layer="grid">Latitude &amp; longitude lines</button>
            </div>
          </div>
        </div>
        <div class="chips" id="wvChip">
          <div class="chip-box">
            <span class="lab">Waves</span>
            <div class="cc-segmented" id="waves">
              <button class="cc-segmented-btn" data-w="0.5">½</button>
              <button class="cc-segmented-btn" data-w="0.75">¾</button>
              <button class="cc-segmented-btn is-active" data-w="1">1</button>
              <button class="cc-segmented-btn" data-w="1.25">1¼</button>
              <button class="cc-segmented-btn" data-w="1.5">1½</button>
            </div>
          </div>
        </div>
        <div class="chips" id="secChip">
          <div class="chip-box">
            <span class="lab">Section</span>
            <div class="cc-segmented" id="secPick"></div>
          </div>
        </div>
        <div class="tip" id="tip"></div>
      </div>
      <div class="controls">
        <button class="cc-btn play" id="bPlay"><span class="ic">▶</span><span class="tx">Play</span></button>
        <div class="snaps" id="snaps"></div>
        <div class="sep"></div>
        <label class="slider"><span class="lab">Amplitude</span><input id="sAmp" type="range" min="0" max="100" step="1" aria-label="Amplitude, zonal to amplified"><span class="sv" id="vAmp"></span></label>
        <div class="sep"></div>
        <label class="slider"><span class="lab">Trough</span><input id="sTr" type="range" min="-126" max="-66" step="1" aria-label="Trough axis longitude"><span class="sv" id="vTr"></span></label>
      </div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

/* ── Projection: USGS Albers conic equal-area (matches the geometry bake) ── */
const PROJ = MAPDATA.proj;
const _n = (Math.sin(PROJ.PHI1 * DEG) + Math.sin(PROJ.PHI2 * DEG)) / 2;
const _C = Math.cos(PROJ.PHI1 * DEG) ** 2 + 2 * _n * Math.sin(PROJ.PHI1 * DEG);
const _rho = phi => Math.sqrt(_C - 2 * _n * Math.sin(phi * DEG)) / _n;
const _rho0 = _rho(PROJ.PHI0);
function project(lon, lat) {
  const th = _n * (lon - PROJ.LAM0) * DEG, r = _rho(lat);
  return [r * Math.sin(th) * PROJ.SCALE + PROJ.TX, -(_rho0 - r * Math.cos(th)) * PROJ.SCALE + PROJ.TY];
}
function unproject(px, py) {
  const x = (px - PROJ.TX) / PROJ.SCALE, yp = _rho0 + (py - PROJ.TY) / PROJ.SCALE;
  const r = Math.sqrt(x * x + yp * yp), th = Math.atan2(x, yp);
  const sinLat = (_C - (_n * r) ** 2) / (2 * _n);
  return [PROJ.LAM0 + th / DEG / _n, Math.asin(clamp(sinLat, -1, 1)) / DEG];
}

async function exportGIF() {

async function exportMP4() {

}
