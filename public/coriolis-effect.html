<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Coriolis Effect</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 26px; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; background: #0C1211; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
.stage canvas.dragging { cursor: grabbing; }

/* floating chips */
.chips { position: absolute; display: flex; gap: 6px; align-items: center; z-index: 2; }
.chips.tl { top: 10px; left: 10px; }
.chips.tr { top: 10px; right: 10px; flex-direction: column; align-items: flex-end; }
.chips .cc-segmented { background: var(--color-surface); }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 12px; }
.frame .cc-segmented-btn { padding: 10px 18px; font-size: 13px; font-weight: 700; }
.chips .cc-btn { padding: 5px 11px; font-size: 13px; background: var(--color-surface); }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 7px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }

/* legend */
.legend { position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; z-index: 2; }
.lg { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 4px; background: rgba(20,26,24,0.88);
  border: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .06em; color: var(--color-text-primary); }
.lg-line { width: 18px; border-top: 2px solid; }
.lg-dot { width: 8px; height: 8px; border-radius: 50%; }
.lg-ring { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid; }

/* control bar */
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 60px; }
.controls .spacer { flex: 1; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 2px; }
.play { min-width: 96px; padding: 10px 14px; font-size: 15px; font-weight: 700; }
.play.primary { color: var(--color-bg); }
.grp { display: flex; align-items: center; gap: 8px; }
.glbl { font-family: var(--font-mono); font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.controls .cc-segmented-btn { padding: 9px 14px; font-size: 13px; }
.controls .tgl { padding: 9px 12px; font-size: 14px; }
.controls .tgl.big { font-weight: 700; color: var(--color-text-primary); border-color: var(--tool-accent); }
.snaps { display: flex; gap: 5px; }
.snap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 62px; padding: 4px 8px; line-height: 1.1; color: var(--color-text-primary); }
.snap.wide { min-width: 104px; }
.snap b { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.snap span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active b, .snap.is-active span { color: var(--color-bg); }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 90px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); white-space: nowrap; text-align: right; min-width: 56px; }
.hint { font-family: var(--font-body); font-size: 15px; color: var(--color-text-primary); padding-left: 6px; }
.act { padding: 9px 14px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.act:disabled { opacity: .4; cursor: default; }
#bAim:not(:disabled) { border-color: var(--tool-accent); color: var(--tool-accent); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .sublbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin: 2px 0 5px; }
.card-seg { display: flex; width: 100%; margin-bottom: 10px; }
.card-seg .cc-segmented-btn { flex: 1; padding: 9px 4px; font-size: 13px; font-weight: 700; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding: 4px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.card .v.sm { font-size: 20px; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--color-text-secondary); margin-left: 6px; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card-seg .cc-segmented-btn { padding: 7px 4px; }
}
@media (max-width: 1260px) {
  .tabs .cc-segmented-btn { padding: 11px 18px; }
  .snap.wide { min-width: 88px; }
  .snap.wide span { font-size: 12px; }
  .glbl { display: none; }
  #clock { display: none; }
  .controls .tgl { padding: 9px 9px; font-size: 13px; }
  .controls .cc-segmented-btn { padding: 9px 10px; }
  .snap { min-width: 50px; padding: 4px 6px; }
  .act { padding: 9px 10px; font-size: 13px; }
  .play { min-width: 84px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">The Coriolis Effect</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn" data-tab="spin">Spin</button>
      <button class="cc-segmented-btn" data-tab="launch">Launch</button>
      <button class="cc-segmented-btn" data-tab="storms">Storms</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="globe"></canvas>
        <div class="chips tl">
          <div class="cc-segmented" role="group" aria-label="Camera">
            <button class="cc-segmented-btn" data-cam="side">Side</button>
            <button class="cc-segmented-btn" data-cam="north">Over the North Pole</button>
            <button class="cc-segmented-btn" data-cam="south">Over the South Pole</button>
          </div>
        </div>
        <div class="chips tr">
          <div class="cc-segmented frame" role="group" aria-label="Point of view">
            <button class="cc-segmented-btn" data-frame="ground">On the ground</button>
            <button class="cc-segmented-btn" data-frame="space">From space</button>
          </div>
          <button class="cc-btn tgl" id="tNorot">Straight line to target</button>
          <button class="cc-btn tgl" id="tIso">Isobars</button>
        </div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

var LAND = (function(){
  var CH = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789$_";
  var idx = {}; for (var i=0;i<CH.length;i++) idx[CH[i]] = i;
  return LAND_RAW.split("|").map(function(s){
    var p = 0, x = 0, y = 0, ring = [];
    while (p < s.length){
      var vals = [];
      for (var k=0;k<2;k++){
        var n = 0, sh = 0, c;
        do { c = idx[s[p++]]; n |= (c & 31) << sh; sh += 5; } while (c & 32);
        vals.push((n & 1) ? -(n >> 1) : (n >> 1));
      }
      x += vals[0]; y += vals[1];
      var lon = x/20, lat = y/20, cl = Math.cos(lat*D2R);
      ring.push(cl*Math.cos(lon*D2R), cl*Math.sin(lon*D2R), Math.sin(lat*D2R));
    }
    return new Float64Array(ring);
  });
})();

/* is a point inside land ring i?  Stereographic projection centred on 40°N 150°W (open Pacific);
   its antipode, 40°S 30°E, is open ocean too, so every land ring is a bounded planar loop. */
var LAND_IN = (function(){
  var la=40*D2R, lo=-150*D2R, O=[Math.cos(la)*Math.cos(lo), Math.cos(la)*Math.sin(lo), Math.sin(la)];
  var E=[-Math.sin(lo), Math.cos(lo), 0];
  var N=[O[1]*E[2]-O[2]*E[1], O[2]*E[0]-O[0]*E[2], O[0]*E[1]-O[1]*E[0]];
  function st(x,y,z){ var k=1/(1+x*O[0]+y*O[1]+z*O[2]); return [(x*E[0]+y*E[1]+z*E[2])*k, (x*N[0]+y*N[1]+z*N[2])*k]; }
  return LAND.map(function(ring){
    var n=ring.length/3, P=new Float64Array(n*2);
    for (var j=0;j<n;j++){ var q=st(ring[j*3],ring[j*3+1],ring[j*3+2]); P[j*2]=q[0]; P[j*2+1]=q[1]; }
    return function(p){
      if (1+p[0]*O[0]+p[1]*O[1]+p[2]*O[2] < 1e-6) return false;
      var t=st(p[0],p[1],p[2]), x=t[0], y=t[1], inside=false;
      for (var a=0,b=n-1;a<n;b=a++){
        var ya=P[a*2+1], yb=P[b*2+1];
        if ((ya>y)!==(yb>y) && x < (P[b*2]-P[a*2])*(y-ya)/(yb-ya)+P[a*2]) inside=!inside;
      }
      return inside;
    };
  });
})();

/* ── vector helpers (all in ECEF, unit sphere) ─────────────────── */
function vlat(p){ return Math.asin(Math.max(-1,Math.min(1,p[2]))); }
function vlon(p){ return Math.atan2(p[1],p[0]); }
function fromLL(latDeg, lonDeg){
  var a = latDeg*D2R, b = lonDeg*D2R, c = Math.cos(a);
  return [c*Math.cos(b), c*Math.sin(b), Math.sin(a)];
}
function norm(v){ var m = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/m, v[1]/m, v[2]/m]; }
function dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function eastAt(p){
  var e = [-p[1], p[0], 0], m = Math.hypot(e[0],e[1]);
  return m < 1e-9 ? [1,0,0] : [e[0]/m, e[1]/m, 0];
}
function northAt(p){ return cross(p, eastAt(p)); }
function gcDist(a,b){ return R_E * Math.acos(Math.max(-1,Math.min(1,dot(a,b)))); }

/* ── the equations of motion ───────────────────────────────────── */
// y = [px,py,pz, wx,wy,wz]  p unit vector, w tangential velocity (m/s)
function deriv(y, opt, out){
  var px=y[0],py=y[1],pz=y[2], wx=y[3],wy=y[4],wz=y[5];
  var ax=0, ay=0, az=0;
  if (opt.cor){                       // -2 Ω × w , with Ω = (0,0,OM)
    ax =  2*OM*wy;  ay = -2*OM*wx;  az = 0;
  }
  if (opt.pgf){ var g = opt.pgf(y); ax+=g[0]; ay+=g[1]; az+=g[2]; }
  if (opt.fric){ ax-=opt.fric*wx; ay-=opt.fric*wy; az-=opt.fric*wz; }
  var an = ax*px + ay*py + az*pz;                 // vertical part -> normal force
  var w2 = (wx*wx+wy*wy+wz*wz)/R_E;               // centripetal, keeps it on the sphere
  out[0]=wx/R_E; out[1]=wy/R_E; out[2]=wz/R_E;
  out[3]=ax-an*px-w2*px; out[4]=ay-an*py-w2*py; out[5]=az-an*pz-w2*pz;
  return out;
}
var _k1=new Float64Array(6),_k2=new Float64Array(6),_k3=new Float64Array(6),_k4=new Float64Array(6),_tmp=new Float64Array(6);
function rk4(y, dt, opt){
  var i;
  deriv(y,opt,_k1);
  for(i=0;i<6;i++) _tmp[i]=y[i]+_k1[i]*dt/2; deriv(_tmp,opt,_k2);
  for(i=0;i<6;i++) _tmp[i]=y[i]+_k2[i]*dt/2; deriv(_tmp,opt,_k3);
  for(i=0;i<6;i++) _tmp[i]=y[i]+_k3[i]*dt;   deriv(_tmp,opt,_k4);
  for(i=0;i<6;i++) y[i]+=dt/6*(_k1[i]+2*_k2[i]+2*_k3[i]+_k4[i]);
  // re-project onto the sphere (kills integration drift)
  var m = Math.hypot(y[0],y[1],y[2]);
  y[0]/=m; y[1]/=m; y[2]/=m;
  var d = y[0]*y[3]+y[1]*y[4]+y[2]*y[5];
  y[3]-=d*y[0]; y[4]-=d*y[1]; y[5]-=d*y[2];
  return y;
}
function stateAt(p, w){ return new Float64Array([p[0],p[1],p[2],w[0],w[1],w[2]]); }

/* Fly a parcel and return the recorded track.
   Each sample keeps its Earth-fixed position AND the Earth's rotation
   angle at that instant, so the same track can be redrawn in the sky
   frame later (eci = Rz(theta) · ecef). */
function fly(p0, w0, T, opt, steps, theta0){
  steps = steps || 800;
  var dt = T/steps, y = stateAt(p0,w0), track = [], th = theta0||0;
  track.push([y[0],y[1],y[2],th,0]);
  for (var i=1;i<=steps;i++){
    rk4(y, dt, opt);
    th = (theta0||0) + OM*dt*i;
    track.push([y[0],y[1],y[2],th,dt*i]);
  }
  track.endW = [y[3],y[4],y[5]];
  return track;
}

function resize(){

  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);

  Rp = Math.min(W,H) * S.zoom;

var _b = {r:[0,0,0], u:[0,0,0], o:[0,0,0]};
function setCam(lonDeg, latDeg){
  var l = lonDeg*D2R, f = latDeg*D2R;
  var sl=Math.sin(l), cl=Math.cos(l), sf=Math.sin(f), cf=Math.cos(f);
  _b.r[0]=-sl; _b.r[1]=cl;  _b.r[2]=0;
  _b.u[0]=-sf*cl; _b.u[1]=-sf*sl; _b.u[2]=cf;
  _b.o[0]=cf*cl;  _b.o[1]=cf*sl;  _b.o[2]=sf;
}
var _p = [0,0,0];
function px(x,y,z){
  _p[0] = cx + (x*_b.r[0]+y*_b.r[1]+z*_b.r[2])*Rp;
  _p[1] = cy - (x*_b.u[0]+y*_b.u[1]+z*_b.u[2])*Rp;
  _p[2] =      x*_b.o[0]+y*_b.o[1]+z*_b.o[2];
  return _p;
}
function pxv(p){ return px(p[0],p[1],p[2]); }
function pxSpun(x,y,z,th){                    // ECEF -> ECI(th) -> screen
  var c=Math.cos(th), s=Math.sin(th);
  return px(x*c-y*s, x*s+y*c, z);
}
function theta(){ return OM*S.simT; }
function camEarth(){ return S.frame==='ground' ? S.camLon : S.camLon - theta()*R2D; }

function unproject(sx, sy){

/* ═══ stars ═════════════════════════════════════════════════════ */
var STARS = (function(){
  var a=[], seed=20260822;
  function rnd(){ seed=(seed*1664525+1013904223)%4294967296; return seed/4294967296; }
  for (var i=0;i<900;i++){
    var z=rnd()*2-1, t=rnd()*Math.PI*2, r=Math.sqrt(1-z*z);
    a.push([r*Math.cos(t), r*Math.sin(t), z, 0.32+rnd()*1.05, rnd()<0.07]);
  }
  return a;
})();
function drawStars(){
  setCam(camStars(), S.camLat);

  for (var i=0;i<STARS.length;i++){
    var s=STARS[i], q=px(s[0],s[1],s[2]);
    if (q[2] <= 0.02) continue;
    var X=(q[0]-cx)/Rp, Y=(q[1]-cy)/Rp;
    var sx = cx + X*far, sy = cy + Y*far;
    if (sx<-20||sx>W+20||sy<-20||sy>H+20) continue;
    var a = Math.min(1, q[2]*2.2) * (0.30+0.60*s[3]);
    ctx.globalAlpha = a;
    ctx.fillStyle = s[4] ? C.accent : C.star;
    var rad = s[3]*(s[4]?1.35:1.05);
    ctx.beginPath(); ctx.arc(sx, sy, rad, 0, 6.2832); ctx.fill();
  }

}

function drawLand(){
  setCam(camEarth(), S.camLat);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,Rp,0,6.2832); ctx.clip();
  ctx.fillStyle = C.land;
  var RF = Rp*1.05, PI2 = Math.PI*2, fc = [_b.o[0],_b.o[1],_b.o[2]];
  function wrapA(d){ return ((d+Math.PI)%PI2+PI2)%PI2-Math.PI; }
  for (var i=0;i<LAND.length;i++){
    var ring=LAND[i], n=ring.length/3, anyVis=false, anyHid=false, hidA=null, lastA=null, wind=0;
    ctx.beginPath();
    for (var j=0;j<=n;j++){                  // j===n revisits the first point to close the ring
      var jj=j%n, q=px(ring[jj*3],ring[jj*3+1],ring[jj*3+2]), X, Y, a;
      if (q[2] > 0){
        X=q[0]; Y=q[1]; a=Math.atan2(Y-cy, X-cx);
        if (j===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
        if (lastA!==null) wind+=wrapA(a-lastA);
        anyVis=true; hidA=null;
      } else {
        // hidden runs follow the limb as arcs just outside it, instead of chords that can
        // cut across the disc
        a=Math.atan2(q[1]-cy, q[0]-cx); anyHid=true;
        if (hidA===null){
          X=cx+Math.cos(a)*RF; Y=cy+Math.sin(a)*RF;
          if (j===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
          if (lastA!==null) wind+=wrapA(a-lastA);
          hidA=a;
        } else {
          var d=wrapA(a-hidA);
          if (Math.abs(d) > 1e-6) ctx.arc(cx,cy,RF,hidA,hidA+d,d<0);
          hidA+=d; wind+=d;
        }
      }
      lastA=a;
    }
    if (!anyVis) continue;
    ctx.closePath();
    if (anyHid){
      // A ring that encloses the far side's centre winds once more around the disc than the land
      // on the near side does. Every such error is a whole-disc offset, so it is corrected by
      // adding whole limb circles until the winding at the centre of view matches the truth.
      var W = Math.round(wind/PI2), T = LAND_IN[i](fc) ? 1 : 0, k = 0;
      if (!T && W) k = -W; else if (T && !W) k = 1;
      for (var c=0;c<Math.abs(k);c++){ ctx.moveTo(cx+RF,cy); ctx.arc(cx,cy,RF,0,PI2,k<0); }
    }
    ctx.fill();
  }

  ctx.strokeStyle=C.coast; ctx.lineWidth=0.8; ctx.lineJoin='round';
  ctx.beginPath();
  for (i=0;i<LAND.length;i++){
    var rg=LAND[i], m2=rg.length/3, pen=false;
    for (var k=0;k<=m2;k++){
      var idx=k%m2, qq=px(rg[idx*3],rg[idx*3+1],rg[idx*3+2]);
      if (qq[2] > 0){ if(pen) ctx.lineTo(qq[0],qq[1]); else { ctx.moveTo(qq[0],qq[1]); pen=true; } }
      else pen=false;
    }
  }
  ctx.stroke();
  ctx.restore();
}
function drawGraticule(){

function rightmostOnParallel(latDeg){

}

/* points at rest on the ground: due-east arcs in the space frame, still in the ground frame */
var RIDER_LATS = [0,15,-15,30,-30,45,-45,60,-60];
var RIDER_LONS = [-180,-135,-90,-45,0,45,90,135];
var RIDER_ARC  = 25;                                   // degrees of rotation shown as trail
function drawRiders(){
  var spun = S.frame==='space', th = theta(), dth = RIDER_ARC*D2R, st = 24;
  setCam(camFor(spun), S.camLat);
  ctx.save();
  ctx.globalAlpha = S.spinParcels ? 0.45 : 1;
  ctx.strokeStyle = C.accent; ctx.fillStyle = C.accent;
  ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (var a=0;a<RIDER_LATS.length;a++){
    for (var b=0;b<RIDER_LONS.length;b++){
      var p = fromLL(RIDER_LATS[a], RIDER_LONS[b]), q;
      if (!spun){
        q = px(p[0],p[1],p[2]);
        if (q[2] > 0){ ctx.beginPath(); ctx.arc(q[0],q[1],2.3,0,6.2832); ctx.fill(); }
        continue;
      }
      var pen=false, head=null, prev=null;
      ctx.beginPath();
      for (var s=0;s<=st;s++){
        q = pxSpun(p[0],p[1],p[2], th - dth + dth*s/st);

          prev = head; head = [q[0],q[1]];
        } else { pen=false; head=null; prev=null; }

}
function seedDemo(){

var PROJ = {
  shell:{ v:800,  name:'artillery shell', tmin:60,    tmax:900,    tdef:300 },
  jet:  { v:250,  name:'airliner',        tmin:1800,  tmax:43200,  tdef:21600 },
  drift:{ v:60,   name:'free-drifting parcel', tmin:21600, tmax:604800, tdef:172800 },
  custom:{v:250,  name:'projectile',      tmin:60,    tmax:864000, tdef:21600 }
};
function projSpec(){ var s=PROJ[S.proj]; return { v:(S.proj==='custom'?S.speed:s.v), name:s.name, tmin:s.tmin, tmax:s.tmax }; }
function bearingTo(a,b){
  var e=eastAt(a), n=northAt(a);

}

}
function doFly(p0,V,bear,T){

}
function endFrame(track){

}
function fireLaunch(bearOverride, Toverride){
  if (!S.launch) return;

/* frame the flight: a tight inertia loop needs the camera close in */
function fitToFlight(tr){

  for (i=0;i<tr.length;i+=8){
    var d=Math.acos(Math.max(-1,Math.min(1, p0[0]*tr[i][0]+p0[1]*tr[i][1]+p0[2]*tr[i][2])));
    if (d>maxA) maxA=d;

  var span=Math.max(maxA, 0.004);
  var z = 0.24/Math.max(0.05, Math.sin(Math.min(span*1.9, 1.35)));
  S.zoom = Math.max(0.42, Math.min(1.5, z));

function solveAim(){

    var ef=endFrame(tr), miss=gcDist(ef.p, S.target);
    if (!best || miss<best.miss) best={ bear:bear, T:T, miss:miss };
    if (miss < 700) break;
    var o=[S.target[0]-ef.p[0], S.target[1]-ef.p[1], S.target[2]-ef.p[2]];
    var along=dot(o,ef.t)*R_E, right=dot(o,ef.r)*R_E;
    bear += Math.max(-0.6, Math.min(0.6, right/(V*T)));

  }

}

/* the straight (great-circle) line from the launch site to the target, painted on the ground */

/* ═══ mode: STORMS ══════════════════════════════════════════════ */
function lowCentre(){ return fromLL(S.lowLat, S.lowLon); }
var STORM_L = 700000, STORM_A = 3.0e-3, STORM_K = 2.6e-5, STORM_SEED = 1750000;
function stormPGF(y){
  var c=lowCentre();
  var cd = c[0]*y[0]+c[1]*y[1]+c[2]*y[2];
  cd = Math.max(-1,Math.min(1,cd));
  var r = R_E*Math.acos(cd);
  var tx=c[0]-cd*y[0], ty=c[1]-cd*y[1], tz=c[2]-cd*y[2];
  var m=Math.hypot(tx,ty,tz); if (m<1e-9) return [0,0,0];
  var g = STORM_A*(r/STORM_L)*Math.exp(0.5 - r*r/(2*STORM_L*STORM_L));
  return [g*tx/m, g*ty/m, g*tz/m];
}
function spawnParcel(){
  var c=lowCentre(), u=norm(cross(c, Math.abs(c[2])>0.9?[1,0,0]:[0,0,1])), v=cross(c,u);
  var a=Math.random()*6.2832, ang=(STORM_SEED*(0.85+Math.random()*0.35))/R_E;
  var sa=Math.sin(ang), ca=Math.cos(ang);
  var p=norm([c[0]*ca+(u[0]*Math.cos(a)+v[0]*Math.sin(a))*sa,
              c[1]*ca+(u[1]*Math.cos(a)+v[1]*Math.sin(a))*sa,
              c[2]*ca+(u[2]*Math.cos(a)+v[2]*Math.sin(a))*sa]);
  var w=[0,0,0];
  if (S.stormCor && Math.abs(S.lowLat)>2){       // arrive already circling, as real inflow does
    var f=coriolisF(vlat(p)*R2D), g=stormPGF(stateAt(p,[0,0,0]));
    var gm=Math.hypot(g[0],g[1],g[2]);
    if (gm>0 && Math.abs(f)>1e-9){
      var tang=cross(p,[g[0]/gm,g[1]/gm,g[2]/gm]);   // 90 deg from the pressure force
      var V=Math.min(45, gm/Math.abs(f))*(f>0?-1:1);
      w=[tang[0]*V, tang[1]*V, tang[2]*V];
    }
  }
  return { y:stateAt(p,w), trail:[[p[0],p[1],p[2],theta()]], age:0, mark:0 };
}
function seedStorm(){
  S.parcels=[];
  var opt={ cor:S.stormCor, pgf:stormPGF, fric:S.stormFric?STORM_K:0 };
  for (var i=0;i<120;i++){
    var q=spawnParcel();
    var spin=Math.random()*DAY*1.1;                 // stagger the flow into a mature vortex
    for (var t=0;t<spin;t+=300){
      rk4(q.y,300,opt); q.age+=300;
      if (q.age%900<300) q.trail.push([q.y[0],q.y[1],q.y[2],theta()]);
      if (q.trail.length>120) q.trail.shift();
    }
    S.parcels.push(q);
  }
}
function stepStorm(dt){
  var opt={ cor:S.stormCor, pgf:stormPGF, fric:S.stormFric?STORM_K:0 };
  var c=lowCentre();
  for (var i=0;i<S.parcels.length;i++){
    var pa=S.parcels[i];
    rk4(pa.y, dt, opt); pa.age+=dt; pa.mark+=dt;
    if (pa.mark >= 900){ pa.mark=0; pa.trail.push([pa.y[0],pa.y[1],pa.y[2],theta()]); }
    if (pa.trail.length>120) pa.trail.shift();
    var cd=c[0]*pa.y[0]+c[1]*pa.y[1]+c[2]*pa.y[2];
    if (pa.age > DAY*2.6 || R_E*Math.acos(Math.max(-1,Math.min(1,cd))) < 55000) S.parcels[i]=spawnParcel();
  }
}
function drawStorm(){
  var c=lowCentre(), spun=S.frame==='space';
  setCam(camFor(spun), S.camLat);
  if (S.stormIso){
    var u=norm(cross(c, Math.abs(c[2])>0.9?[1,0,0]:[0,0,1])), v=cross(c,u);
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,Rp,0,6.2832); ctx.clip();
    var rings=[400000,750000,1100000,1450000];
    for (var k=0;k<rings.length;k++){

        var co=Math.cos(a), si=Math.sin(a);
        var p=[c[0]*ca+(u[0]*co+v[0]*si)*sa, c[1]*ca+(u[1]*co+v[1]*si)*sa, c[2]*ca+(u[2]*co+v[2]*si)*sa];

      }

  for (var i=0;i<S.parcels.length;i++){
    var pa=S.parcels[i];
    var sp=Math.hypot(pa.y[3],pa.y[4],pa.y[5]);
    var f=Math.min(1, sp/38);
    var col='rgb('+Math.round(60+188*f)+','+Math.round(163-42*f)+','+Math.round(174-100*f)+')';
    ctx.globalAlpha=0.30;

    ctx.globalAlpha=1;
    var tail=pa.trail.slice(Math.max(0,pa.trail.length-26));
    var last=drawTrack(tail, undefined, col, {spun:spun, spunNow:true, width:2, glow:false});
    if (last) marker(last[0],last[1],col,2.2);
  }
  setCam(camFor(spun), S.camLat);
  var qc = spun ? pxSpun(c[0],c[1],c[2],theta()) : pxv(c);
  if (qc[2]>0){
    label(qc[0], qc[1], 'L', C.sky, 'center', 26, 'bold');
    label(qc[0], qc[1]+22, lowLabel(), C.sec, 'center', 13, 'bold');
  }
}

/* ═══ formatting ════════════════════════════════════════════════ */
function fmtLL(p){
  var la=vlat(p)*R2D, lo=vlon(p)*R2D;
  return Math.abs(la).toFixed(1)+'°'+(la>=0?'N':'S')+' '+Math.abs(lo).toFixed(1)+'°'+(lo>=0?'E':'W');
}
function fmtDur(s){
  if (s<90) return s.toFixed(0)+' s';
  if (s<5400) return (s/60).toFixed(s<600?1:0)+' min';
  if (s<172800) return (s/3600).toFixed(s<36000?1:0)+' h';
  return (s/86400).toFixed(1)+' days';
}
function fmtKm(m){
  if (Math.abs(m)<1000) return Math.round(m)+' m';
  if (Math.abs(m)<10000) return (m/1000).toFixed(1)+' km';
  return Math.round(m/1000).toLocaleString()+' km';
}
function fmtClock(s){
  var h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=Math.floor(s%60);
  return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
}
function coriolisF(latDeg){ return 2*OM*Math.sin(latDeg*D2R); }

async function exportGIF(){
