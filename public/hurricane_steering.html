<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hurricane Steering — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 16px; }
.top .spacer { flex: 1; min-width: 0; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu.open { display: flex; }
.menu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.menu button:hover { background: var(--color-surface); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* floating chips */
.chips { position: absolute; display: flex; align-items: center; gap: 8px; z-index: 5; }
.chip-box { display: flex; align-items: center; gap: 8px; background: rgba(30,35,32,.92); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 3px 4px 3px 10px; }
.chip-box .lab { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.chip-box .cc-segmented { background: none; }
.chip-box .cc-segmented-btn { padding: 6px 10px; font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-size: 14px; }
.day-box { display: flex; flex-direction: column; background: rgba(30,35,32,.92); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 5px 12px 6px; min-width: 104px; }
.day-box .d { font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--color-text-primary); line-height: 1.1; white-space: nowrap; }
.day-box .dt { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.legend { position: absolute; z-index: 4; display: flex; flex-wrap: wrap; gap: 4px 14px; max-width: 70%; pointer-events: none;
  background: rgba(30,35,32,.88); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 6px 10px; }
.legend span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.ct { border-top: 1px solid rgba(205,215,230,.6); }
.sw.r588 { border-top-color: #F2A541; }
.sw.flow { border-top-color: rgba(120,200,225,.9); }
.sw.tr { border-top: 2px dashed #D7A86E; }
.sw.obs { border-top: 2px dashed #E8E4D9; }

/* control bar */
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border); background: var(--color-surface); min-height: 60px; }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; width: 132px; flex: none; align-self: stretch;
  font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg);
  animation: glow 2.4s ease-in-out infinite; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play:disabled { opacity: .45; animation: none; cursor: default; filter: none; }
.play .ic { font-size: 17px; }
.play.busy { animation: none; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } 50% { box-shadow: 0 0 0 5px rgba(60,163,174,.28); } }
@media (prefers-reduced-motion: reduce) { .play { animation: none; } }
.snaps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex: 0 1 420px; min-width: 0; }
.snaps.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); flex-basis: 470px; }
.snaps.n5 { grid-template-columns: repeat(5, minmax(0, 1fr)); flex-basis: 560px; }
.snap { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px; min-width: 0; }
.snap .n { font-family: var(--font-body); font-weight: 700; font-size: 15px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.snap .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.15; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
.snap .sw2 { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 2px; flex: none; }
.slider { flex: 1; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 8px; row-gap: 1px; min-width: 120px; align-items: baseline; }
.slider .lab { grid-row: 1; grid-column: 1; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; }
.slider .sv { grid-row: 1; grid-column: 2; font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); text-align: right; white-space: nowrap; line-height: 1.1; }
.slider .ls { display: none; }
.slider input { grid-row: 2; grid-column: 1 / 3; width: 100%; accent-color: var(--tool-accent); height: 20px; cursor: pointer; min-width: 60px; margin: 0; }
.hint { flex: 1; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clr { padding: 8px 12px; font-size: 13px; flex: none; }
.clr:disabled { opacity: .4; cursor: default; }
[hidden] { display: none !important; }

/* readout card */
.card { padding: 11px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .eb .tm { font-size: 13px; letter-spacing: .04em; color: var(--color-text-primary); white-space: nowrap; }
.card .r { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; text-align: right; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--color-text-secondary); margin-left: 5px; }
.card .r.t .v { color: var(--tool-accent); }
.card .r.t .l { color: var(--tool-accent); }
.card .sub { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; margin-top: 12px; padding-bottom: 5px; border-bottom: 1px solid var(--color-border-hover); }
.card .sub span:last-child { color: var(--color-text-secondary); font-weight: 500; }
.card .run { padding: 6px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .run .h { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.card .run .nm { font-family: var(--font-display); font-weight: 700; font-size: 18px; white-space: nowrap; }
.card .run .nm i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.card .run .st { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--color-text-primary); white-space: nowrap; }
.card .run .k { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; }
.card .run .k.col { flex-direction: column; align-items: stretch; gap: 1px; }
.card .run .k .kv { flex: 1; min-width: 0; }
.card .run .k .kl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); padding-top: 2px; }
.card .run .k .kv { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--color-text-primary); line-height: 1.3; }
.card .run .k .kv small { display: block; font-weight: 400; font-size: 13px; color: var(--color-text-secondary); }
.card .run .k .kv .wd { font-weight: 400; font-size: 13px; color: var(--color-text-secondary); margin-left: 4px; }
.card .lf { display: flex; width: 100%; justify-content: space-between; align-items: baseline; gap: 6px; font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--color-text-primary); line-height: 1.25; }
.card .lf .d { white-space: nowrap; }
.card .lfc { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); line-height: 1.2; margin-bottom: 2px; }
.card .empty { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-muted); padding: 8px 0; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
.card .ctl { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 4px; }
.card .ctl .slider { min-width: 0; }
.card .ctl .grp { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; margin-top: 4px; }

@media (min-height: 820px) {
  .card .r { padding: 8px 0 7px; }
  .card .v { font-size: 23px; }
  .card .sub { margin-top: 16px; }
  .controls { min-height: 66px; }
}
@media (max-height: 700px) {
  .card { padding-top: 8px; padding-bottom: 8px; }
  .card .r { padding: 3px 0 2px; }
  .card .sub { margin-top: 8px; }
  .card .v { font-size: 18px; }
  .card .run { padding: 3px 0; }
  .card .run .nm { font-size: 16px; }
  .card .lf, .card .run .k .kv { font-size: 14px; line-height: 1.22; }
  .card .src { padding-top: 6px; line-height: 1.3; }
}
@media (max-height: 640px) {
  .controls { min-height: 56px; padding: 5px 10px; }
  .snap { padding: 3px 4px; }
}
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 12px; } }
@media (max-width: 1366px) {
  .main { grid-template-columns: minmax(0, 1fr) 272px; }
  .card { padding: 10px 14px; }
  .tabs .pre { display: none; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 260px; }
  .top { gap: 10px; }
  .top h1 { font-size: 22px; }
  .exp .cc-btn { padding: 6px 9px; }
  .play { width: 112px; }
  .slider .sv { font-size: 15px; }
  .card .v { font-size: 19px; }
  .tabs .cc-segmented-btn { padding: 11px 10px; letter-spacing: .06em; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 248px; }
  .snaps.n5 .snap .v { display: none; }
  .chip-box .lab { display: none; }
  #status { display: none; }
  .slider .ll { display: none; }
  .slider .ls { display: inline; }
  .snaps { flex-basis: 330px; }
  .snaps.n4 { flex-basis: 380px; }
  .snap .n { font-size: 14px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Hurricane<span class="w2"> Steering</span></h1>
    <div class="cc-segmented tabs" id="tabs" role="tablist" aria-label="Step"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="menu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="map" aria-label="Map of the North Atlantic with 500 hPa height contours, steering flow and storm tracks"></canvas>
        <div class="chips" id="chipDay"><div class="day-box"><span class="d" id="dayV">Day 0.0</span><span class="dt" id="dayD" hidden></span></div></div>
        <div class="chips" id="chipsR">
          <div class="chip-box"><span class="lab">Run</span>
            <div class="cc-segmented" id="runType">
              <button class="cc-segmented-btn is-active" data-m="single">Single</button>
              <button class="cc-segmented-btn" data-m="ensemble">Ensemble ×12</button>
            </div>
          </div>
          <div class="chip-box"><span class="lab">Speed</span>
            <div class="cc-segmented" id="speed">
              <button class="cc-segmented-btn is-active" data-s="1">1×</button>
              <button class="cc-segmented-btn" data-s="2">2×</button>
              <button class="cc-segmented-btn" data-s="4">4×</button>
            </div>
          </div>
        </div>
        <div class="legend" id="legend">
          <span><i class="sw ct"></i>500 hPa height (dam)</span>
          <span><i class="sw r588"></i>588 dam</span>
          <span><i class="sw flow"></i>Steering flow</span>
          <span id="lgTr"><i class="sw tr"></i>Trough axis</span>
          <span id="lgObs" hidden><i class="sw obs" id="lgObsSw"></i>Observed track</span>
        </div>
      </div>
      <div class="controls">
        <button class="cc-btn play" id="bRun"><span class="ic">▶</span><span class="tx">Run storm</span></button>
        <div class="snaps" id="snaps"></div>
        <div class="hint" id="hint" hidden>Click the ocean to place a storm · drag the H or ◆ to move them</div>
        <div class="sep" id="sep1"></div>
        <label class="slider" id="slBox"><span class="lab"><span class="ll" id="slLab"></span><span class="ls" id="slLabS"></span></span><input id="sIn" type="range"><span class="sv" id="slVal"></span></label>
        <div class="sep"></div>
        <button class="cc-btn clr" id="bClear">Clear runs</button>
      </div>
    </div>
    <div class="cc-panel card" id="card">
      <div id="cardTop"></div><div id="cardCtl"></div><div id="cardBot" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
    </div>
  </div>
</div>
