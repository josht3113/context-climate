<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Islip, NY | Fog & Mist Heatmap | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --tool-accent: var(--accent-hourly);
  --tool-accent-light: #60a8d8;
}

/* colors/font/background texture come from core-sample-tools.css body rule */
body {
  padding: 20px 0 48px;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ── Title ── */
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.title-sep { color: var(--color-text-muted); font-weight: 400; }
#title-period { color: var(--color-text-primary); }

/* ── Mode tabs (styling from core-sample-tools.css .cc-tab-bar/.cc-tab) ── */
.tab-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

/* ── Controls row ── */
.controls-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  min-height: 30px;
}
.control-label {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
#year-select { color: var(--tool-accent-light); }

/* ── Stat chips: cc-stat-row/cc-stat-chip/cc-stat-label/cc-stat-value ── */

/* ── Legend ── */
.legend-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.auto-scale-toggle {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  cursor: pointer;
  user-select: none;
}
.auto-scale-toggle input { accent-color: var(--tool-accent-light); cursor: pointer; }
.legend-scale-group { display: flex; align-items: center; gap: 8px; }
.legend-end-label {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-secondary);
  white-space: nowrap;
}
#legend-canvas {
  border-radius: 3px;
  border: 1px solid var(--color-border);
  display: block;
}

/* ── Heatmap outer layout ── */
.heatmap-wrapper { width: 100%; }
.heatmap-inner { display: flex; align-items: flex-start; }

/* ── Hour labels ── */
.hour-labels {
  flex-shrink: 0;
  width: 52px;
  display: flex;
  flex-direction: column;
}
/* spacer to align with the month label row */
.hour-labels-spacer { height: 26px; }
.hour-label {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: #b0b0cc;
  text-align: right;
  padding-right: 9px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  /* height set in JS */
}

/* ── Canvas area ── */
.canvas-area { flex: 1; min-width: 0; position: relative; }

/* Month label bar */
.month-label-bar {
  position: relative;
  height: 26px;
  user-select: none;
}
.month-label {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: #b0b0cc;
  transform: translateX(-50%);
  white-space: nowrap;
  line-height: 26px;
}

/* Canvas container */
.canvas-container { position: relative; }
#heatmap-canvas {
  display: block;
  width: 100%;
  cursor: crosshair;
}

/* Loading overlay */
.loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(7, 7, 15, 0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.loading-text {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.4px;
  color: var(--color-text-secondary);
}
.progress-track {
  width: 280px;
  height: 5px;
  background: var(--color-surface-2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #1a4080, #60a8d8);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.error-text {
  font-family: var(--font-mono);
  font-size: 13px;
  color: #ef4444;
  margin-top: 4px;
}

/* ── Tooltip ── */
#tooltip {
  position: fixed;
  background: rgba(12, 12, 24, 0.97);
  border: 1px solid #2e2e50;
  border-radius: 8px;
  padding: 10px 14px;
  pointer-events: none;
  z-index: 200;
  display: none;
  width: 218px;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.tt-date {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-secondary);
  letter-spacing: 0.3px;
  margin-bottom: 5px;
}
.tt-value {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--tool-accent-light);
  line-height: 1;
  margin-bottom: 4px;
}
.tt-value.has-storm { color: var(--tool-accent-light); }
.tt-value.no-storm  { color: var(--color-text-muted); }
.tt-detail {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.35;
}

/* ── Footer ── */
.footer {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--color-text-muted);
}

/* ── Header eyebrow (matches the other threshold heatmap companions) ── */
.page-eyebrow { margin-bottom: 6px; }

/* ── Station select row ── */
.station-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.station-select { min-width: 220px; }

/* ── BR toggle ── */
.br-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.br-toggle input[type="checkbox"] { display: none; }
.br-track {
  width: 36px;
  height: 20px;
  border-radius: 10px;
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
}
.br-track::after {
  content: '';
  position: absolute;
  top: 3px; left: 3px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--color-text-secondary);
  transition: transform 0.2s, background 0.2s;
}
.br-toggle input:checked + .br-track {
  background: #0d2e4a;
  border-color: var(--tool-accent);
}
.br-toggle input:checked + .br-track::after {
  transform: translateX(16px);
  background: var(--tool-accent-light);
}
.br-label {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  letter-spacing: 0.3px;
}
/* download-btn now uses shared cc-btn cc-btn-sm classes */
</style>
</head>
<body>
<div class="container">

  <p class="cc-eyebrow page-eyebrow">Hourly Data</p>
  <div class="page-title">
    <span id="title-station">Islip, NY</span>
    <span class="title-sep">|</span>
    <span>Fog &amp; Mist Heatmap</span>
    <span class="title-sep">|</span>
    <span id="title-period">1991–2025</span>
    <button class="cc-btn cc-btn-sm download-btn" onclick="downloadPNG()" title="Download PNG with header">&darr; PNG</button>
  </div>

  <div class="tab-bar cc-tab-bar">
    <button class="cc-tab active" id="tab-climo" onclick="setMode('climatology')">Climatology</button>

  <!-- Station selector (always visible) -->
  <div class="station-row">

    <select id="station-select" class="station-select cc-select" onchange="onStationChange()">
      <optgroup label="Northeast">

      </optgroup>
      <optgroup label="Southeast ⚡">
        <option value="KTPA">Tampa, FL</option>
        <option value="KMCO">Orlando, FL</option>
        <option value="KMIA">Miami, FL</option>
        <option value="KATL">Atlanta, GA</option>
        <option value="KCLT">Charlotte, NC</option>
        <option value="KJAX">Jacksonville, FL</option>

        <option value="KMSY">New Orleans, LA</option>
      </optgroup>
      <optgroup label="South Central ⚡">
        <option value="KIAH">Houston, TX</option>

        <option value="KOKC">Oklahoma City, OK</option>

      </optgroup>
      <optgroup label="Midwest">

        <option value="KOMA">Omaha, NE</option>
        <option value="KIND">Indianapolis, IN</option>
      </optgroup>
      <optgroup label="Mountain / Southwest ⚡">
        <option value="KDEN">Denver, CO</option>
        <option value="KPHX">Phoenix, AZ</option>
        <option value="KABQ">Albuquerque, NM</option>

      </optgroup>
      <optgroup label="West Coast">

        <option value="KSEA">Seattle, WA</option>
      </optgroup>
    </select>
  </div>

  <div class="controls-row" id="controls-row">
    <span class="control-label" id="ctrl-label" style="display:none">Year:</span>
    <select id="year-select" class="cc-select" style="display:none" onchange="onYearChange()"></select>
    <!-- BR toggle — always visible -->
    <label class="br-toggle" title="Include mist (BR): visibility ⅝–6 miles. Off = dense fog only (FG, visibility < ¼ mile).">
      <input type="checkbox" id="br-toggle" onchange="onBRToggle()">
      <div class="br-track"></div>
      <span class="br-label">Include mist (BR)</span>
    </label>
  </div>

  <div class="stat-row cc-stat-row" id="stat-row">
    <div class="cc-stat-chip">
      <span class="cc-stat-label" id="sl-period">Period</span>
      <span class="cc-stat-value" id="sv-period">–</span>
    </div>
    <div class="cc-stat-chip">
      <span class="cc-stat-label">Peak Month</span>
      <span class="cc-stat-value" id="sv-month">–</span>
    </div>
    <div class="cc-stat-chip">
      <span class="cc-stat-label">Peak Hour</span>
      <span class="cc-stat-value" id="sv-hour">–</span>
    </div>
    <div class="cc-stat-chip">
      <span class="cc-stat-label" id="sl-annual">Avg Fog Hrs / Yr</span>
      <span class="cc-stat-value" id="sv-annual">–</span>
    </div>

  <div class="legend-row">
    <label class="auto-scale-toggle" id="auto-scale-toggle-wrap" title="Scale colors to this view's actual max value so low-frequency stations aren't lost in near-black">
      <input type="checkbox" id="auto-scale-toggle" checked onchange="toggleAutoScale()"> Auto-scale
    </label>
    <div class="legend-scale-group">
      <span class="legend-end-label" id="legend-lo">0%</span>
      <canvas id="legend-canvas" width="220" height="13"></canvas>
      <span class="legend-end-label" id="legend-hi">40%</span>
    </div>
  </div>

  <div class="heatmap-wrapper">
    <div class="heatmap-inner">

      <!-- Hour labels column -->
      <div class="hour-labels" id="hour-labels">
        <div class="hour-labels-spacer"></div>
      </div>

      <!-- Canvas + month labels -->
      <div class="canvas-area" id="canvas-area">
        <div class="month-label-bar" id="month-label-bar"></div>
        <div class="canvas-container" id="canvas-container">
          <canvas id="heatmap-canvas"></canvas>
          <div class="loading-overlay" id="loading-overlay">

              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="error-text" id="error-text" style="display:none"></div>
            <div id="ts-counter" style="font-family:var(--font-mono);font-size:12px;color:#948F82;margin-top:2px;"></div>

</div><!-- /.container -->

<div id="tooltip">
  <div class="tt-date"   id="tt-date"></div>
  <div class="tt-value"  id="tt-value"></div>
  <div class="tt-detail" id="tt-detail"></div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const CLIMO_START   = 1991;
const CLIMO_END     = 2025;
const TOTAL_YEARS   = CLIMO_END - CLIMO_START + 1;
const CANVAS_HEIGHT = 504; // 21px × 24

// Stations — id, display label, IEM timezone string, footer label
const STATIONS = {
  KISP: { label: 'Islip, NY',             tz: 'America/New_York',    tzLabel: 'Eastern' },
  KJFK: { label: 'New York City, NY',     tz: 'America/New_York',    tzLabel: 'Eastern' },
  KBOS: { label: 'Boston, MA',            tz: 'America/New_York',    tzLabel: 'Eastern' },
  KPHL: { label: 'Philadelphia, PA',      tz: 'America/New_York',    tzLabel: 'Eastern' },
  KDCA: { label: 'Washington, DC',        tz: 'America/New_York',    tzLabel: 'Eastern' },
  KBUF: { label: 'Buffalo, NY',           tz: 'America/New_York',    tzLabel: 'Eastern' },
  KTPA: { label: 'Tampa, FL',             tz: 'America/New_York',    tzLabel: 'Eastern' },
  KMCO: { label: 'Orlando, FL',           tz: 'America/New_York',    tzLabel: 'Eastern' },
  KMIA: { label: 'Miami, FL',             tz: 'America/New_York',    tzLabel: 'Eastern' },
  KATL: { label: 'Atlanta, GA',           tz: 'America/New_York',    tzLabel: 'Eastern' },
  KCLT: { label: 'Charlotte, NC',         tz: 'America/New_York',    tzLabel: 'Eastern' },
  KJAX: { label: 'Jacksonville, FL',      tz: 'America/New_York',    tzLabel: 'Eastern' },
  KBNA: { label: 'Nashville, TN',         tz: 'America/Chicago',     tzLabel: 'Central' },
  KMSY: { label: 'New Orleans, LA',       tz: 'America/Chicago',     tzLabel: 'Central' },
  KIAH: { label: 'Houston, TX',           tz: 'America/Chicago',     tzLabel: 'Central' },
  KDFW: { label: 'Dallas / Ft. Worth, TX',tz: 'America/Chicago',     tzLabel: 'Central' },
  KOKC: { label: 'Oklahoma City, OK',     tz: 'America/Chicago',     tzLabel: 'Central' },
  KSAT: { label: 'San Antonio, TX',       tz: 'America/Chicago',     tzLabel: 'Central' },
  KORD: { label: 'Chicago, IL',           tz: 'America/Chicago',     tzLabel: 'Central' },
  KDTW: { label: 'Detroit, MI',           tz: 'America/New_York',    tzLabel: 'Eastern' },
  KMSP: { label: 'Minneapolis, MN',       tz: 'America/Chicago',     tzLabel: 'Central' },
  KMCI: { label: 'Kansas City, MO',       tz: 'America/Chicago',     tzLabel: 'Central' },
  KSTL: { label: 'St. Louis, MO',         tz: 'America/Chicago',     tzLabel: 'Central' },
  KOMA: { label: 'Omaha, NE',             tz: 'America/Chicago',     tzLabel: 'Central' },
  KIND: { label: 'Indianapolis, IN',      tz: 'America/Indiana/Indianapolis', tzLabel: 'Eastern' },
  KDEN: { label: 'Denver, CO',            tz: 'America/Denver',      tzLabel: 'Mountain' },
  KPHX: { label: 'Phoenix, AZ',           tz: 'America/Phoenix',     tzLabel: 'Arizona' },
  KABQ: { label: 'Albuquerque, NM',       tz: 'America/Denver',      tzLabel: 'Mountain' },
  KLAS: { label: 'Las Vegas, NV',         tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
  KSLC: { label: 'Salt Lake City, UT',    tz: 'America/Denver',      tzLabel: 'Mountain' },
  KLAX: { label: 'Los Angeles, CA',       tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
  KSFO: { label: 'San Francisco, CA',     tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
  KPDX: { label: 'Portland, OR',          tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
  KSEA: { label: 'Seattle, WA',           tz: 'America/Los_Angeles', tzLabel: 'Pacific' },
};

let activeStationId = 'KISP';
function activeStation() { return STATIONS[activeStationId]; }

// Per-station climatology cache so switching back doesn't re-fetch
const climoCache = new Map(); // Map<stationId, {tsCount, dataCount}>

// Month metadata (using 366-day base for DOY indexing)
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL  = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
const MONTH_DAYS_LEAP   = [31,29,31,30,31,30,31,31,30,31,30,31];
const MONTH_DAYS_NOLEAP = [31,28,31,30,31,30,31,31,30,31,30,31];

// Cumulative DOY start per month (0-based, leap-year frame for array indexing)
const MONTH_START_DOY = (() => {
  const arr = [0];
  for (let m = 0; m < 11; m++) arr.push(arr[m] + MONTH_DAYS_LEAP[m]);
  return arr;
})(); // [0,31,60,91,121,152,182,213,244,274,305,335]

// ── Fog color palette ────────────────────────────────────────
// t = 0..1 maps to probability 0 → the current color-scale ceiling (either
// the fixed MAX_PROB, or the view's actual max when auto-scale is on).
// Dark navy → steel blue → blue-grey → silver-white (fog atmosphere)
const MAX_PROB = 0.40;
const COLOR_STOPS = [
  { t: 0.00, rgb: [5,   8,   16 ] },
  { t: 0.05, rgb: [8,   20,  48 ] },
  { t: 0.18, rgb: [18,  52,  98 ] },
  { t: 0.35, rgb: [38,  90,  148] },
  { t: 0.54, rgb: [75,  135, 182] },
  { t: 0.72, rgb: [140, 180, 212] },
  { t: 0.87, rgb: [192, 215, 232] },
  { t: 1.00, rgb: [228, 240, 248] },
];

function lerpColor(t) {
  t = Math.max(0, Math.min(1, t));
  let lo = COLOR_STOPS[0], hi = COLOR_STOPS[COLOR_STOPS.length - 1];
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    if (t <= COLOR_STOPS[i + 1].t) { lo = COLOR_STOPS[i]; hi = COLOR_STOPS[i + 1]; break; }
  }
  const span = hi.t - lo.t;
  const f = span < 1e-6 ? 0 : (t - lo.t) / span;
  return [
    Math.round(lo.rgb[0] + f * (hi.rgb[0] - lo.rgb[0])),
    Math.round(lo.rgb[1] + f * (hi.rgb[1] - lo.rgb[1])),
    Math.round(lo.rgb[2] + f * (hi.rgb[2] - lo.rgb[2])),
  ];
}
// t is already normalized 0..1 against the current scale ceiling — see the
// scaleMax computation in renderHeatmap().
function probToRGB(t)     { return lerpColor(Math.min(1, t)); }
function rgb(r, g, b)     { return `rgb(${r},${g},${b})`; }

function formatPct(p) {
  if (p >= 10) return Math.round(p).toString();
  if (p >= 1)  return p.toFixed(1);
  return p.toFixed(2);
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let mode        = 'climatology';
let loadToken   = 0; // bumped each loadClimatology() call; lets a stale in-flight request detect it's superseded
let currentYear = CLIMO_END;
let singleGrid  = null;   // binary fog-only for single year
let singleGridBR = null;  // binary fog+mist for single year
let tsCount     = null;   // fog-only counts [doy][hour]
let dataCount   = null;
let brCount     = null;   // mist-only additional counts [doy][hour]
let includeBR   = false;  // default: FG only

// Auto-scale: stretch the color gradient to this view's actual max probability
// instead of the fixed 0–MAX_PROB range, so low-frequency stations aren't
// lost to near-black. Toggle-able from the legend row; on by default.
let autoScale      = true;
let currentMaxProb = MAX_PROB; // the max probability found in the current grid (drives legend + color scale)

// ═══════════════════════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════════════════════
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function getDOY0(year, month, day) {
  // 0-based DOY: Jan 1 = 0
  const md = isLeap(year) ? MONTH_DAYS_LEAP : MONTH_DAYS_NOLEAP;
  let d = 0;
  for (let m = 0; m < month - 1; m++) d += md[m];
  return d + day - 1;
}

function doyToMonthDay(doy) {
  // Uses 366-day frame
  let rem = doy;
  for (let m = 0; m < 12; m++) {
    if (rem < MONTH_DAYS_LEAP[m]) return { m, day: rem + 1 };
    rem -= MONTH_DAYS_LEAP[m];
  }
  return { m: 11, day: 31 };
}

function fmtHour(h) {
  if (h === 0)  return 'Midnight';
  if (h === 12) return 'Noon';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

// ═══════════════════════════════════════════════════════════════
// IEM FETCH + PARSE
// One request for the full date range avoids IEM rate limiting
// entirely. The large CSV is parsed in one pass, observations
// keyed by year for correct per-year probability calculation.
// ═══════════════════════════════════════════════════════════════

function buildIEMUrl(y1, y2) {
  const st = activeStation();
  const tz = encodeURIComponent(st.tz);
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?` +
    `station=${activeStationId}&data=metar` +
    `&year1=${y1}&month1=1&day1=1` +
    `&year2=${y2}&month2=12&day2=31` +
    `&tz=${tz}&format=comma&latlon=no&missing=M&trace=T&direct=no`;
}

// Returns { hasFG: bool, hasBR: bool } for the METAR present-weather section.
// FG = true fog (vis < ¼ mi). BR = mist (vis ⅝–6 mi). Checked independently
// so toggling BR is instant without re-fetching.
function detectFog(metar) {
  if (!metar || metar === 'M') return { hasFG: false, hasBR: false };
  const up = metar.toUpperCase();
  const rmk = up.indexOf(' RMK ');
  const body = rmk > 0 ? up.substring(0, rmk) : up;
  const tokens = body.split(' ');
  const hasFG = tokens.some(t =>
    t === 'FG' || t === 'MIFG' || t === 'BCFG' || t === 'PRFG' || t === 'VCFG' || t === 'FZFG'
  );
  const hasBR = tokens.some(t => t === 'BR');
  return { hasFG, hasBR };
}

async function fetchRangeCSV(y1, y2) {
  const resp = await fetch(buildIEMUrl(y1, y2));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

// Parse a (possibly multi-year) IEM CSV.
// Returns Map<year, Array<{doy, hour, hasTS}>> for correct per-year grouping.
function parseIEM(text) {
  const lines = text.split('\n');
  const byYear = new Map();
  let metarIdx = 2;
  let inData = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('station,')) {
      const h = line.split(',');
      const mi = h.indexOf('metar');
      if (mi >= 0) metarIdx = mi;
      inData = true;
      continue;
    }
    if (!inData) continue;

    const parts = line.split(',');
    if (parts.length < 3) continue;

    // "2024-07-04 15:53"
    const valid    = parts[1].trim();
    const spaceIdx = valid.indexOf(' ');
    if (spaceIdx < 1) continue;

    const dp = valid.substring(0, spaceIdx).split('-').map(Number);
    if (dp.length < 3 || isNaN(dp[0])) continue;

    const [yr, mo, dy] = dp;
    const hour = parseInt(valid.substring(spaceIdx + 1));
    if (isNaN(hour) || hour < 0 || hour > 23) continue;

    const doy = getDOY0(yr, mo, dy);
    if (doy < 0 || doy > 365) continue;

    const metarStr = parts.slice(metarIdx).join(',').trim();
    const { hasFG, hasBR } = detectFog(metarStr);

    if (!byYear.has(yr)) byYear.set(yr, []);
    byYear.get(yr).push({ doy, hour, hasTS: hasFG, hasBR });
  }

  return byYear;
}

// ═══════════════════════════════════════════════════════════════
// DATA AGGREGATION
// ═══════════════════════════════════════════════════════════════
function initGrids() {
  tsCount   = Array.from({ length: 366 }, () => new Int16Array(24));
  dataCount = Array.from({ length: 366 }, () => new Int16Array(24));
  brCount   = Array.from({ length: 366 }, () => new Int16Array(24));
  return { tsCount, dataCount, brCount };
}

function processYear(obs, grids) {
  const { tsCount, dataCount, brCount } = grids;
  const yFG   = new Uint8Array(366 * 24);
  const yBR   = new Uint8Array(366 * 24);
  const yData = new Uint8Array(366 * 24);

  for (const { doy, hour, hasTS, hasBR } of obs) {
    const idx = doy * 24 + hour;
    yData[idx] = 1;
    if (hasTS) yFG[idx] = 1;
    if (hasBR) yBR[idx] = 1;
  }

  for (let d = 0; d < 366; d++) {
    for (let h = 0; h < 24; h++) {
      const idx = d * 24 + h;
      if (yData[idx]) {
        dataCount[d][h]++;
        if (yFG[idx]) tsCount[d][h]++;
        if (yBR[idx]) brCount[d][h]++;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// CANVAS / RENDER
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('heatmap-canvas');
const ctx    = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function setupCanvas() {
  const W = document.getElementById('canvas-area').clientWidth;
  const H = CANVAS_HEIGHT;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

function renderHeatmap() {
  const W = canvas.width  / dpr;
  const H = canvas.height / dpr;
  const cellW = W / 366;
  const cellH = H / 24;

  // ImageData for fast pixel drawing
  const imgData = ctx.createImageData(Math.round(W * dpr), Math.round(H * dpr));
  const data = imgData.data;

  const pw = Math.round(W  * dpr);
  const ph = Math.round(H  * dpr);

  const min = Math.ceil(TOTAL_YEARS / 3);

  // Determine the color-scale ceiling. In climatology mode with auto-scale
  // on, stretch the gradient to this view's actual max probability (fog, or
  // fog+mist if the BR toggle is on) so low-frequency stations aren't lost
  // to near-black. Fixed 0–MAX_PROB otherwise.
  let scaleMax = MAX_PROB;
  if (mode === 'climatology') {
    if (autoScale) {
      let maxP = 0;
      for (let doy = 0; doy < 366; doy++) {
        for (let h = 0; h < 24; h++) {
          if (dataCount[doy][h] >= min) {
            const count = tsCount[doy][h] + (includeBR ? brCount[doy][h] : 0);
            const p = count / dataCount[doy][h];
            if (p > maxP) maxP = p;
          }
        }
      }
      scaleMax = maxP > 0 ? maxP : MAX_PROB;
    }
    currentMaxProb = scaleMax;
  }

  for (let doy = 0; doy < 366; doy++) {
    const x0 = Math.round(doy * cellW * dpr);
    const x1 = Math.round((doy + 1) * cellW * dpr);

    for (let h = 0; h < 24; h++) {
      const y0 = Math.round(h * cellH * dpr);
      const y1 = Math.round((h + 1) * cellH * dpr);

      let r, g, b;
      if (mode === 'climatology') {
        const dc = dataCount[doy][h];
        const count = dc >= min
          ? tsCount[doy][h] + (includeBR ? brCount[doy][h] : 0)
          : 0;
        const prob = dc >= min ? count / dc : 0;
        const t = scaleMax > 0 ? prob / scaleMax : 0;
        [r, g, b] = probToRGB(t);
      } else {
        const grid = includeBR ? singleGridBR : singleGrid;
        const hasF = grid && grid[doy * 24 + h] === 1;
        [r, g, b] = hasF ? [180, 220, 242] : [5, 8, 16];
      }

      for (let py = y0; py < y1 && py < ph; py++) {
        for (let px = x0; px < x1 && px < pw; px++) {
          const i = (py * pw + px) * 4;
          data[i]     = r;
          data[i + 1] = g;
          data[i + 2] = b;
          data[i + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Month dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let m = 1; m < 12; m++) {
    const x = Math.round(MONTH_START_DOY[m] * cellW) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Noon divider
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  const noonY = Math.round(12 * cellH) + 0.5;
  ctx.beginPath(); ctx.moveTo(0, noonY); ctx.lineTo(W, noonY); ctx.stroke();
}

// ── Legend ──────────────────────────────────────────────────
function renderLegend() {
  const lc  = document.getElementById('legend-canvas');
  const lx  = lc.getContext('2d');
  const W   = lc.width;
  const H   = lc.height;

  lx.clearRect(0, 0, W, H);

  if (mode === 'climatology') {
    const grad = lx.createLinearGradient(0, 0, W, 0);
    for (const stop of COLOR_STOPS) {
      const [r, g, b] = lerpColor(stop.t);
      grad.addColorStop(stop.t, `rgb(${r},${g},${b})`);
    }
    lx.fillStyle = grad;
    lx.fillRect(0, 0, W, H);
    document.getElementById('legend-lo').textContent = '0%';
    const hiPct = autoScale ? currentMaxProb * 100 : MAX_PROB * 100;
    document.getElementById('legend-hi').textContent = formatPct(hiPct) + '%';
  } else {
    lx.fillStyle = rgb(5, 8, 16);
    lx.fillRect(0, 0, W / 2, H);
    lx.fillStyle = rgb(180, 220, 242);
    lx.fillRect(W / 2, 0, W / 2, H);
    document.getElementById('legend-lo').textContent = 'No fog';
    document.getElementById('legend-hi').textContent = 'Fog / Mist';
  }
}

// ── Hour labels ──────────────────────────────────────────────
function renderHourLabels() {
  const container = document.getElementById('hour-labels');
  // Remove all children except spacer
  while (container.children.length > 1) container.removeChild(container.lastChild);

  const cellH = CANVAS_HEIGHT / 24;

  for (let h = 0; h < 24; h++) {
    const el = document.createElement('div');
    el.className = 'hour-label';
    el.style.height = cellH + 'px';

    if      (h === 0)  el.textContent = 'Midnight';
    else if (h === 12) el.textContent = 'Noon';
    else               el.textContent = h < 12 ? h : h - 12;

    container.appendChild(el);
  }
}

// ── Month labels ─────────────────────────────────────────────
function renderMonthLabels() {
  const bar = document.getElementById('month-label-bar');
  bar.innerHTML = '';
  const W = document.getElementById('canvas-area').clientWidth;
  const cellW = W / 366;

  for (let m = 0; m < 12; m++) {
    const startDOY = MONTH_START_DOY[m];
    const endDOY   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const midDOY   = (startDOY + endDOY) / 2;

    const el = document.createElement('div');
    el.className = 'month-label';
    el.textContent = MONTHS_SHORT[m];
    el.style.left  = (midDOY * cellW) + 'px';
    bar.appendChild(el);
  }
}

// ═══════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════
function updateStats() {
  if (mode === 'climatology' && tsCount) {
    document.getElementById('sv-period').textContent = `${CLIMO_START}–${CLIMO_END}`;
    document.getElementById('sl-period').textContent = 'Period';
    document.getElementById('sl-annual').textContent = 'Avg Fog Hrs / Yr';

    // Peak month
    const monthAvg = MONTHS_SHORT.map((_, m) => {
      const s = MONTH_START_DOY[m];
      const e = m < 11 ? MONTH_START_DOY[m + 1] : 366;
      let sum = 0, n = 0;
      for (let d = s; d < e; d++)
        for (let h = 0; h < 24; h++)
          if (dataCount[d][h] > 2) {
            sum += (tsCount[d][h] + (includeBR ? brCount[d][h] : 0)) / dataCount[d][h];
            n++;
          }
      return n ? sum / n : 0;
    });
    const peakM = monthAvg.indexOf(Math.max(...monthAvg));
    document.getElementById('sv-month').textContent = MONTHS_FULL[peakM];

    // Peak hour
    const hourAvg = Array.from({ length: 24 }, (_, h) => {
      let sum = 0, n = 0;
      for (let d = 0; d < 366; d++)
        if (dataCount[d][h] > 2) {
          sum += (tsCount[d][h] + (includeBR ? brCount[d][h] : 0)) / dataCount[d][h];
          n++;
        }
      return n ? sum / n : 0;
    });
    const peakH = hourAvg.indexOf(Math.max(...hourAvg));
    document.getElementById('sv-hour').textContent = fmtHour(peakH);

    // Avg fog hours per year (FG only or FG+BR)
    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        total += tsCount[d][h] + (includeBR ? brCount[d][h] : 0);
    document.getElementById('sv-annual').textContent = (total / TOTAL_YEARS).toFixed(1);

  } else if (mode === 'single' && singleGrid) {
    document.getElementById('sv-period').textContent = currentYear;
    document.getElementById('sl-period').textContent = 'Year';
    document.getElementById('sl-annual').textContent = 'Total Fog Hours';

    let total = 0;
    for (let i = 0; i < 366 * 24; i++) if (singleGrid[i]) total++;
    document.getElementById('sv-annual').textContent = total;

    // Peak month for single year
    const byMonth = Array(12).fill(0);
    for (let d = 0; d < 366; d++) {
      const { m } = doyToMonthDay(d);
      for (let h = 0; h < 24; h++)
        if (singleGrid[d * 24 + h]) byMonth[m]++;
    }
    const peakM = byMonth.indexOf(Math.max(...byMonth));
    document.getElementById('sv-month').textContent = byMonth[peakM] ? MONTHS_FULL[peakM] : '–';

    // Peak hour for single year
    const byHour = Array(24).fill(0);
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (singleGrid[d * 24 + h]) byHour[h]++;
    const peakH = byHour.indexOf(Math.max(...byHour));
    document.getElementById('sv-hour').textContent = byHour[peakH] ? fmtHour(peakH) : '–';
  }
}

// ═══════════════════════════════════════════════════════════════
// LOADING UI
// ═══════════════════════════════════════════════════════════════
function showLoading(txt) {
  const ov = document.getElementById('loading-overlay');
  ov.style.display = 'flex';
  document.getElementById('loading-text').textContent = txt;
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('error-text').style.display = 'none';
}
function setProgress(pct, txt) {
  document.getElementById('progress-fill').style.width = pct + '%';
  if (txt) document.getElementById('loading-text').textContent = txt;
  // Show running TS count so we can see data is being found (no dev tools needed)
  let tsTotal = 0;
  if (tsCount) {
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++) tsTotal += tsCount[d][h];
  }
  const ctr = document.getElementById('ts-counter');
  if (ctr) ctr.textContent = tsTotal > 0 ? `🌫 ${tsTotal} fog/mist observations found so far` : '';
}
function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}
function showError(msg) {
  document.getElementById('loading-text').textContent = 'Some years failed to load.';
  const et = document.getElementById('error-text');
  et.textContent = msg;
  et.style.display = 'block';
  setTimeout(hideLoading, 3000);
}

// ═══════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  if (!tsCount && mode === 'climatology') { tooltip.style.display = 'none'; return; }
  if (mode === 'single' && !singleGrid)        { tooltip.style.display = 'none'; return; }

  const rect = canvas.getBoundingClientRect();
  const doy  = Math.min(365, Math.max(0, Math.floor((e.clientX - rect.left) / rect.width  * 366)));
  const h    = Math.min(23,  Math.max(0, Math.floor((e.clientY - rect.top)  / rect.height * 24)));

  const { m, day } = doyToMonthDay(doy);
  document.getElementById('tt-date').textContent = `${MONTHS_FULL[m]} ${day}  ·  ${fmtHour(h)}`;

  const val = document.getElementById('tt-value');
  const det = document.getElementById('tt-detail');
  val.className = 'tt-value';

  if (mode === 'climatology') {
    const dc = dataCount[doy][h];
    const tc = tsCount[doy][h] + (includeBR ? brCount[doy][h] : 0);
    if (dc < Math.ceil(TOTAL_YEARS / 3)) {
      val.textContent = '–';
      det.textContent = 'Insufficient data';
    } else {
      const pct = (tc / dc * 100).toFixed(1);
      val.textContent = pct + '%';
      det.textContent = `${tc} of ${dc} years had ${includeBR ? 'fog or mist' : 'fog (FG)'}`;
    }
  } else {
    const grid = includeBR ? singleGridBR : singleGrid;
    const has = grid && grid[doy * 24 + h] === 1;
    val.textContent = has ? '🌫 Fog / Mist' : 'Clear';
    val.classList.add(has ? 'has-storm' : 'no-storm');
    det.textContent = has ? (includeBR ? 'FG or BR observed this hour' : 'FG observed this hour') : '';
  }

  tooltip.style.display = 'block';
  const TW = 218, TH = 90;
  let tx = e.clientX + 16;
  let ty = e.clientY - 10;
  if (tx + TW > window.innerWidth  - 10) tx = e.clientX - TW - 12;
  if (ty + TH > window.innerHeight - 10) ty = window.innerHeight - TH - 10;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════
// LOAD – CLIMATOLOGY (sequential, one NCEI ISD file per year)
// ═══════════════════════════════════════════════════════════════
async function loadClimatology() {
  const st = activeStation();
  const requestStationId = activeStationId;
  const myToken = ++loadToken;

  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = `${CLIMO_START}–${CLIMO_END}`;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;

  // Return cached data immediately if available
  if (climoCache.has(requestStationId)) {
    const c = climoCache.get(requestStationId);
    tsCount = c.tsCount; dataCount = c.dataCount; brCount = c.brCount;
    renderHeatmap(); renderLegend(); updateStats();
    return;
  }

  // Request-local grids so a slower/older request can't clobber a newer one.
  const reqGrids = initGrids();
  showLoading(`Fetching ${CLIMO_START}–${CLIMO_END} from IEM… (one large request, may take ~30s)`);

  try {
    const csv = await fetchRangeCSV(CLIMO_START, CLIMO_END);
    if (myToken !== loadToken) return; // superseded by a later station switch
    setProgress(60, 'Parsing observations…');
    await sleep(30);
    if (myToken !== loadToken) return;
    const byYear = parseIEM(csv);
    setProgress(90, 'Aggregating by year…');
    await sleep(30);
    if (myToken !== loadToken) return;
    for (const obs of byYear.values()) processYear(obs, reqGrids);

    // Cache under the station this request was actually for.
    climoCache.set(requestStationId, {
      tsCount:   reqGrids.tsCount.map(r => Int16Array.from(r)),
      dataCount: reqGrids.dataCount.map(r => Int16Array.from(r)),
      brCount:   reqGrids.brCount.map(r => Int16Array.from(r)),
    });

    if (myToken !== loadToken) return; // abandoned while we were caching
    tsCount = reqGrids.tsCount; dataCount = reqGrids.dataCount; brCount = reqGrids.brCount;
    setProgress(100);
    hideLoading();
  } catch(e) {
    if (myToken !== loadToken) return; // ignore errors from abandoned requests
    showError(`Failed to load: ${e.message}`);
    console.error('Climatology load failed:', e);
    return;
  }

  renderHeatmap(); renderLegend(); updateStats();
}

// ═══════════════════════════════════════════════════════════════
// LOAD – SINGLE YEAR
// ═══════════════════════════════════════════════════════════════
async function loadSingleYear(year) {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = year;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;
  showLoading(`Loading ${year} data…`);

  try {
    const csv = await fetchRangeCSV(year, year);
    const byYear = parseIEM(csv);
    const obs = byYear.get(year) || [];

    singleGrid   = new Uint8Array(366 * 24);
    singleGridBR = new Uint8Array(366 * 24);
    for (const { doy, hour, hasTS, hasBR } of obs) {
      if (hasTS) singleGrid[doy * 24 + hour] = 1;
      if (hasTS || hasBR) singleGridBR[doy * 24 + hour] = 1;
    }

    hideLoading();
    renderHeatmap();
    renderLegend();
    updateStats();
  } catch (err) {
    document.getElementById('loading-text').textContent = 'Failed to load data.';
    document.getElementById('error-text').textContent = err.message;
    document.getElementById('error-text').style.display = 'block';
    console.error(err);
  }
}

// ═══════════════════════════════════════════════════════════════
// MODE / NAV
// ═══════════════════════════════════════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('tab-climo').classList.toggle('active', m === 'climatology');
  document.getElementById('tab-single').classList.toggle('active', m === 'single');

  const showYear = m === 'single';
  document.getElementById('ctrl-label').style.display  = showYear ? 'inline' : 'none';
  document.getElementById('year-select').style.display = showYear ? 'inline' : 'none';
  document.getElementById('auto-scale-toggle-wrap').style.display = m === 'climatology' ? 'flex' : 'none';

  if (m === 'climatology') {
    loadClimatology();
  } else {
    currentYear = parseInt(document.getElementById('year-select').value);
    loadSingleYear(currentYear);
  }
}

function onBRToggle() {
  includeBR = document.getElementById('br-toggle').checked;
  // Re-render immediately — no re-fetch needed, data already in memory.
  // renderHeatmap() recomputes the auto-scale ceiling from scratch each call,
  // so it automatically re-stretches to the new FG-only vs FG+BR max here too.
  renderHeatmap();
  renderLegend();
  updateStats();
}

function toggleAutoScale() {
  autoScale = document.getElementById('auto-scale-toggle').checked;
  if (mode === 'climatology' && tsCount) {
    renderHeatmap();
    renderLegend();
  }
}

function onYearChange() {
  currentYear = parseInt(document.getElementById('year-select').value);
  singleGrid  = null;
  loadSingleYear(currentYear);
}

function onStationChange() {
  activeStationId = document.getElementById('station-select').value;
  singleGrid = null;
  // Reset grids so new station starts fresh
  tsCount = null; dataCount = null; brCount = null;
  if (mode === 'climatology') loadClimatology();
  else loadSingleYear(currentYear);
}

// ═══════════════════════════════════════════════════════════════
// DOWNLOAD PNG — renders a standalone image with full context
// ═══════════════════════════════════════════════════════════════
function downloadPNG() {
  const st       = activeStation();
  const period   = mode === 'single' ? String(currentYear) : `${CLIMO_START}–${CLIMO_END}`;
  const subtitle = mode === 'climatology'
    ? `Probability of fog or mist (FG/BR) by hour and day of year  ·  ${CLIMO_START}–${CLIMO_END}`
    : `Hours with observed fog or mist  ·  ${currentYear}`;

  const EXPORT_SCALE = 3;
  const origDpr = dpr;
  dpr = EXPORT_SCALE;
  setupCanvas();
  renderHeatmap();

  const cw = canvas.width  / dpr;   // CSS-pixel width of heatmap
  const ch = canvas.height / dpr;

  const PAD = 24, HDR = 86, FTR = 28, MONTH_H = 22;
  const ow = cw + PAD * 2;          // add side padding
  const oh = HDR + MONTH_H + ch + FTR;

  const off = document.createElement('canvas');
  off.width  = ow * EXPORT_SCALE;   // fixed high-res export scale, independent of screen dpr
  off.height = oh * EXPORT_SCALE;
  const oc = off.getContext('2d');
  oc.scale(EXPORT_SCALE, EXPORT_SCALE);

  // ── Background ──
  oc.fillStyle = '#1E2320';
  oc.fillRect(0, 0, ow, oh);

  // ── Header accent bar ──
  const grad = oc.createLinearGradient(0, 0, ow, 0);
  COLOR_STOPS.forEach(s => {
    const [r, g, b] = lerpColor(s.t);
    grad.addColorStop(s.t, `rgb(${r},${g},${b})`);
  });
  oc.fillStyle = grad;
  oc.fillRect(0, 0, ow, 3);

  // ── Station + title ──
  oc.fillStyle = '#E8E4D9';
  oc.font = 'bold 20px "Zilla Slab", serif';
  oc.fillText(`${st.label}  ·  Fog & Mist Heatmap  ·  ${period}`, PAD, 28);

  // ── Subtitle ──
  oc.fillStyle = '#A6A499';
  oc.font = '14px "Public Sans", sans-serif';
  oc.fillText(subtitle, PAD, 48);

  // ── Stats row (climatology only) ──
  if (mode === 'climatology' && tsCount) {
    const peak = document.getElementById('sv-month').textContent;
    const hr   = document.getElementById('sv-hour').textContent;
    const avg  = document.getElementById('sv-annual').textContent;
    oc.fillStyle = '#60a8d8';
    oc.font = 'bold 13px "Courier Prime", monospace';
    oc.fillText(`Peak month: ${peak}   Peak hour: ${hr}   Avg fog hrs/yr: ${avg}`, PAD, 68);
  }

  // ── ContextClimate branding (top right) ──
  oc.fillStyle = '#948F82';
  oc.font = '13px "Courier Prime", monospace';
  oc.textAlign = 'right';
  oc.fillText('contextclimate.io', ow - PAD, 28);
  oc.textAlign = 'left';

  // ── Heatmap canvas ──
  // Month labels strip
  oc.fillStyle = '#948F82';
  oc.font = '12px "Courier Prime", monospace';
  oc.textAlign = 'center';
  const cellW = cw / 366;
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e - 1) / 2;
    oc.fillText(MONTHS_SHORT[m], PAD + mid * cellW, HDR + MONTH_H - 6);
  }
  oc.textAlign = 'left';

  oc.drawImage(canvas, PAD, HDR + MONTH_H, cw, ch);

  dpr = origDpr;
  setupCanvas();
  renderHeatmap();

  // ── Footer ──
  oc.fillStyle = '#948F82';
  oc.font = '12px "Courier Prime", monospace';
  oc.fillText(`${st.tzLabel} Local Time  ·  Data: IEM ASOS  ·  contextclimate.io`, PAD, HDR + MONTH_H + ch + 18);

  // ── Bottom accent line ──
  oc.fillStyle = grad;
  oc.fillRect(0, oh - 2, ow, 2);

  const link = document.createElement('a');
  link.download = `fog-heatmap-${activeStationId}-${period}.png`;
  link.href = off.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════════════════════
// UTIL
// ═══════════════════════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function init() {
  // Populate year selector
  const sel = document.getElementById('year-select');
  for (let y = CLIMO_END; y >= CLIMO_START; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  }
  sel.value = currentYear;

  requestAnimationFrame(() => {
    setupCanvas();
    renderHourLabels();
    renderMonthLabels();
    renderLegend();
    loadClimatology();
  });

  window.addEventListener('resize', () => {
    dpr = window.devicePixelRatio || 1;
    setupCanvas();
    renderMonthLabels();
    const hasData = (mode === 'climatology' && tsCount) ||
                    (mode === 'single' && singleGrid);
    if (hasData) renderHeatmap();
  });
}

init();
</script>
</body>
</html>
