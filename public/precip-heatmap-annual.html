  .top-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 14px 22px; margin-bottom: 14px; }
  .top-bar .cc-stat-row { margin-left: auto; margin-bottom: 0; }
  .station-row { display: flex; align-items: center; gap: 10px; margin-bottom: 0; }
  .control-label { font-family: var(--font-label); font-size: 13px; font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
  .station-select { font-size: 15px; min-width: 250px; }
  .controls-row { display: flex; align-items: center; gap: 8px; margin-bottom: 0; flex-wrap: wrap; min-height: 30px; }

  .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .legend-end { font-family: var(--font-label); font-size: 13px; font-weight: 600; color: var(--color-text-muted); white-space: nowrap; }

  .hour-labels { flex-shrink: 0; width: 56px; display: flex; flex-direction: column; }

  .hour-label { font-family: var(--font-label); font-size: 13px; font-weight: 600; color: var(--color-text-secondary); text-align: right; padding-right: 9px; display: flex; align-items: center; justify-content: flex-end; }
  .canvas-area { position: relative; flex: 1; min-width: 0; }
  .month-label-bar { position: relative; height: 26px; user-select: none; }
  .month-label { position: absolute; font-family: var(--font-label); font-size: 12px; font-weight: 600; color: var(--color-text-secondary); transform: translateX(-50%); white-space: nowrap; line-height: 26px; }
  .canvas-container { position: relative; }
  #heatmap-canvas { display: block; width: 100%; cursor: crosshair; border-radius: var(--radius-sm); }

  .loading-overlay { position: absolute; inset: 0; background: rgba(30,35,32,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; backdrop-filter: blur(4px); }

  .loading-text { font-family: var(--font-label); font-size: 14px; font-weight: 600; letter-spacing: .4px; color: var(--color-text-muted); text-align: center; }
  .progress-track { width: 280px; height: 5px; background: var(--color-surface-2); border-radius: var(--radius-sm); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--tool-accent); border-radius: var(--radius-sm); transition: width .4s ease; width: 0%; }
  .error-msg { font-family: var(--font-body); font-size: 13px; color: #ef4444; margin-top: 4px; }

  #tooltip { position: fixed; background: rgba(20,24,21,.97); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 10px 14px; pointer-events: none; z-index: 200; display: none; width: 220px; backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(0,0,0,.5); }
  .tt-date { font-family: var(--font-label); font-size: 13px; font-weight: 700; color: var(--color-text-muted); letter-spacing: .3px; margin-bottom: 4px; }
  .tt-value { font-family: var(--font-mono); font-size: 22px; font-weight: 600; color: var(--color-text-primary); line-height: 1; margin-bottom: 3px; }
  .tt-detail { font-family: var(--font-body); font-size: 12px; color: var(--color-text-secondary); line-height: 1.4; }

  .brand-pill { font-family: var(--font-label); font-size: 12px; font-weight: 700; letter-spacing: .4px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 20px; color: var(--tool-accent); padding: 3px 12px; text-decoration: none; margin-left: 4px; transition: all .15s; white-space: nowrap; }
  .brand-pill:hover { background: var(--color-surface-2); border-color: var(--tool-accent); color: var(--color-text-primary); }
  .footer { margin-top: 14px; font-family: var(--font-label); font-size: 12px; color: var(--color-text-muted); }
  .footer strong { color: var(--color-text-secondary); }

// ═══════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════
function isLeap(y){return(y%4===0&&y%100!==0)||y%400===0}
function getDOY(yr,mo,dy){
  const md=isLeap(yr)?[31,29,31,30,31,30,31,31,30,31,30,31]:[31,28,31,30,31,30,31,31,30,31,30,31];
  let d=0;for(let m=0;m<mo-1;m++)d+=md[m];d+=dy-1;
  if(!isLeap(yr)&&mo>2)d++;return d;
}
function doyToDisplay(doy){
  let rem=doy;
  for(let m=0;m<12;m++){if(rem<MONTH_DAYS_LEAP[m])return`${MONTHS_SHORT[m]} ${rem+1}`;rem-=MONTH_DAYS_LEAP[m];}
  return 'Dec 31';
}
function fmtHour(h){if(h===0)return'Midnight';if(h===12)return'Noon';return h<12?`${h} AM`:`${h-12} PM`;}

// ═══════════════════════════════════════════════
// COLOR UTILITIES
// ═══════════════════════════════════════════════
function hexToRGB(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function getColorRGB(val,scale){
  if(val==null||isNaN(val))return[30,35,32]; // matches --color-bg (#1E2320)
  const{vals,cols}=scale;
  if(val<=vals[0])return hexToRGB(cols[0]);
  if(val>=vals[vals.length-1])return hexToRGB(cols[cols.length-1]);
  for(let i=0;i<vals.length-1;i++){
    if(val>=vals[i]&&val<=vals[i+1]){
      const t=(val-vals[i])/(vals[i+1]-vals[i]);
      const a=hexToRGB(cols[i]),b=hexToRGB(cols[i+1]);
      return[Math.round(a[0]+t*(b[0]-a[0])),Math.round(a[1]+t*(b[1]-a[1])),Math.round(a[2]+t*(b[2]-a[2]))];
    }
  }
  return hexToRGB(cols[cols.length-1]);
}
function lum(r,g,b){return(0.299*r+0.587*g+0.114*b)/255}
function textCol(r,g,b){return lum(r,g,b)>0.30?'rgba(0,0,0,0.80)':'rgba(255,255,255,0.80)';}

// ═══════════════════════════════════════════════
// PARSERS
// ═══════════════════════════════════════════════
function parseP01i(s){
  if(!s||s==='M')return null;
  if(s==='T')return TRACE;
  const v=parseFloat(s);return isNaN(v)?null:v;
}
function parsePcpn(s){
  if(!s||s==='M'||s==='S')return null;
  if(s==='T')return TRACE;
  const v=parseFloat(s);return isNaN(v)?null:v;
}

// ═══════════════════════════════════════════════
// DATA STRUCTURES
// ═══════════════════════════════════════════════
function makeSingleData(){
  return{p01i:new Float32Array(GRID_SIZE).fill(NaN),dayTotal:new Float32Array(366).fill(NaN)};
}
function makeClimoAccum(){
  return{
    p01i:{sum:new Float64Array(GRID_SIZE),sum2:new Float64Array(GRID_SIZE),cnt:new Int32Array(GRID_SIZE)},
    dayTotal:{sum:new Float64Array(366),cnt:new Int32Array(366)}
  };
}
function accumToStats(accum){
  const mp=new Float32Array(GRID_SIZE);
  for(let i=0;i<GRID_SIZE;i++)mp[i]=accum.p01i.cnt[i]?accum.p01i.sum[i]/accum.p01i.cnt[i]:NaN;
  const md=new Float32Array(366);
  for(let i=0;i<366;i++)md[i]=accum.dayTotal.cnt[i]?accum.dayTotal.sum[i]/accum.dayTotal.cnt[i]:NaN;
  return{mean:{p01i:mp,dayTotal:md}};
}

// ═══════════════════════════════════════════════
// GRID ACCESSORS
// ═══════════════════════════════════════════════
function getGridValue(doy,h){
  const idx=doy*24+h;
  if(mode==='climatology'){if(!climoData)return null;const v=climoData.mean.p01i[idx];return isNaN(v)?null:v;}
  if(!singleData)return null;const v=singleData.p01i[idx];return isNaN(v)?null:v;
}
function getDayTotal(doy){
  if(mode==='climatology'){if(!climoData)return null;const v=climoData.mean.dayTotal[doy];return isNaN(v)?null:v;}
  if(!singleData)return null;const v=singleData.dayTotal[doy];return isNaN(v)?null:v;
}

// ═══════════════════════════════════════════════
// FORMATTERS
// ═══════════════════════════════════════════════
function formatPrecip(v){
  if(v==null||isNaN(v))return null;if(v===0)return null;if(v<TRACE+0.0005)return 'T';
  if(v<0.10)return'.'+String(Math.round(v*100)).padStart(2,'0');
  if(v<1.0)return'.'+String(Math.round(v*100));
  return v.toFixed(2);
}
function formatAnnualTot(v){
  if(v==null||isNaN(v))return null;if(v===0)return null;if(v<TRACE+0.0005)return 'T';
  if(v<1.0)return'.'+String(Math.round(v*100)).padStart(2,'0');
  if(v<10.0)return v.toFixed(1);
  return String(Math.round(v));
}
function fmtPrecipDisplay(v){
  if(v==null||isNaN(v))return'—';if(v===0)return'0.00"';if(v<TRACE+0.0005)return'Trace';
  return v.toFixed(2)+'"';
}

function buildURL(stId,tz,y1,y2){
  return`https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?`+
    `station=${stId}&data=p01i&year1=${y1}&month1=1&day1=1&year2=${y2}&month2=12&day2=31`+
    `&tz=${encodeURIComponent(tz)}&format=comma&latlon=no&missing=M&trace=T&direct=no`;
}
async function fetchIEM(stId,tz,y1,y2){const r=await fetch(buildURL(stId,tz,y1,y2));if(!r.ok)throw new Error(`IEM HTTP ${r.status}`);return r.text();}
async function fetchACISDaily(stId,y1,y2){
  const id=stId.startsWith('K')?stId.slice(1):stId;
  const r=await fetch('https://data.rcc-acis.org/StnData',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sid:id,sdate:`${y1}-01-01`,edate:`${y2}-12-31`,elems:['pcpn']})});
  if(!r.ok)throw new Error(`ACIS HTTP ${r.status}`);return r.json();
}

// ═══════════════════════════════════════════════
// PARSE
// ═══════════════════════════════════════════════
function parseCSVInto(text,y1,y2,single,accum){
  const lines=text.split('\n');let p01iI=99,inData=false;
  for(let li=0;li<lines.length;li++){
    const line=lines[li].trim();if(!line||line.startsWith('#'))continue;
    if(line.startsWith('station,')){
      const h=line.split(',');const fi=f=>{const i=h.indexOf(f);return i<0?99:i;};
      p01iI=fi('p01i');inData=true;continue;
    }
    if(!inData)continue;
    const parts=line.split(',');if(parts.length<3)continue;
    const valid=parts[1];if(!valid)continue;
    const sp=valid.indexOf(' ');if(sp<1)continue;
    const dp=valid.substring(0,sp).split('-');if(dp.length<3)continue;
    const yr=parseInt(dp[0]),mo=parseInt(dp[1]),dy=parseInt(dp[2]);
    const h=parseInt(valid.substring(sp+1));
    if(isNaN(yr)||isNaN(mo)||isNaN(dy)||isNaN(h))continue;
    if(yr<y1||yr>y2)continue;if(h<0||h>23)continue;
    const doy=getDOY(yr,mo,dy);if(doy<0||doy>365)continue;
    const idx=doy*24+h;const v=parseP01i(parts[p01iI]);
    if(single&&v!=null)single.p01i[idx]=v;
    if(accum&&v!=null){accum.p01i.sum[idx]+=v;accum.p01i.sum2[idx]+=v*v;accum.p01i.cnt[idx]++;}
  }
}
function parseACISDaily(json,single,accum){
  if(!json||!Array.isArray(json.data))return;
  for(const row of json.data){
    if(!Array.isArray(row)||row.length<2)continue;
    const[dateStr,pcpn]=row;if(!dateStr)continue;
    const dp=dateStr.split('-');if(dp.length<3)continue;
    const yr=parseInt(dp[0]),mo=parseInt(dp[1]),dy=parseInt(dp[2]);
    if(isNaN(yr)||isNaN(mo)||isNaN(dy))continue;
    const doy=getDOY(yr,mo,dy);if(doy<0||doy>365)continue;
    const v=parsePcpn(pcpn);
    if(single&&v!=null)single.dayTotal[doy]=v;
    if(accum&&v!=null){accum.dayTotal.sum[doy]+=v;accum.dayTotal.cnt[doy]++;}
  }
}

function setupCanvas(){
  const W=document.getElementById('canvas-area').clientWidth||900;
  canvas.style.width  = W+'px';
  canvas.style.height = TOTAL_H+'px';
  canvas.width  = Math.round(W*dpr);

function renderHeatmap(){
  const FULL_W = canvas.width/dpr;
  const GRID_W = FULL_W - AVG_GAP - TOT_COL_W;
  const cw     = GRID_W/366;            // per-DOY column width (decimal, ~3px)
  const ch     = CELL_H;
  const AVG_X  = GRID_W + AVG_GAP;
  const pw     = canvas.width, ph = canvas.height;

  // ── Compute Tot column and footer values ──
  const totColVals   = new Array(24).fill(null);   // year total per hour-of-day
  const totalRowVals = new Array(366).fill(null);  // daily total per DOY
  const wetHrRowVals = new Array(366).fill(null);  // wet hours per DOY

  for(let h=0;h<24;h++){
    let s=0,hasAny=false;
    for(let doy=0;doy<366;doy++){const v=getGridValue(doy,h);if(v!=null&&!isNaN(v)){s+=v;hasAny=true;}}
    totColVals[h]=hasAny?s:null;
  }
  for(let doy=0;doy<366;doy++){
    totalRowVals[doy]=getDayTotal(doy);
  }

  // Corner cell
  let totOfTotal=null;
  {let s=0,ok=false;for(let d=0;d<366;d++){const v=totalRowVals[d];if(v!=null&&!isNaN(v)){s+=v;ok=true;}}totOfTotal=ok?s:null;}

  // ── ImageData fill ──
  const img=ctx.createImageData(pw,ph);const data=img.data;
  const BG=[30,35,32]; // #1E2320 — matches --color-bg
  for(let i=0;i<data.length;i+=4){data[i]=BG[0];data[i+1]=BG[1];data[i+2]=BG[2];data[i+3]=255;}

  function fillRect(x0,y0,x1,y1,r,g,b){
    for(let py=y0;py<y1;py++)for(let px=x0;px<x1;px++){const i=(py*pw+px)*4;data[i]=r;data[i+1]=g;data[i+2]=b;data[i+3]=255;}
  }

  // Main grid
  for(let doy=0;doy<366;doy++){
    const x0=Math.round(doy*cw*dpr),x1=Math.round((doy+1)*cw*dpr);
    for(let h=0;h<24;h++){
      const y0=Math.round(h*ch*dpr),y1=Math.round((h+1)*ch*dpr);
      const[r,g,b]=getColorRGB(getGridValue(doy,h),SCALE_HOURLY);
      fillRect(x0,y0,x1,y1,r,g,b);
    }
  }

  // Tot column (annual total per hour-of-day)
  {
    const x0=Math.round(AVG_X*dpr),x1=Math.round((AVG_X+TOT_COL_W)*dpr);
    for(let h=0;h<24;h++){
      const y0=Math.round(h*ch*dpr),y1=Math.round((h+1)*ch*dpr);
      const[r,g,b]=getColorRGB(totColVals[h],SCALE_ANNUAL_HOURLY);
      fillRect(x0,y0,x1,y1,r,g,b);
    }
  }

  // Footer rows per DOY
  const footerDef=[
    {vals:totalRowVals, corner:totOfTotal, sc:SCALE_DAILY, cornerSc:SCALE_CORNER_ANNUAL_TOTAL},
  ];
  for(let fi=0;fi<FOOTER_ROWS;fi++){
    const{vals,corner,sc,cornerSc}=footerDef[fi];
    const fy0=CANVAS_HEIGHT+FOOTER_GAP+fi*ch;
    const y0=Math.round(fy0*dpr),y1=Math.round((fy0+ch)*dpr);
    for(let doy=0;doy<366;doy++){
      const x0=Math.round(doy*cw*dpr),x1=Math.round((doy+1)*cw*dpr);
      const[r,g,b]=getColorRGB(vals[doy],sc);
      fillRect(x0,y0,x1,y1,r,g,b);
    }
    const ax0=Math.round(AVG_X*dpr),ax1=Math.round((AVG_X+TOT_COL_W)*dpr);
    const[r,g,b]=getColorRGB(corner,cornerSc);
    fillRect(ax0,y0,ax1,y1,r,g,b);
  }

  ctx.putImageData(img,0,0);

  // ── Borders ──
  // Fine grid lines (hours only — day columns too narrow)
  ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=0.5;ctx.beginPath();
  for(let h=1;h<24;h++){const y=Math.round(h*ch);ctx.moveTo(0,y+.5);ctx.lineTo(GRID_W,y+.5);}
  // Tot column hour lines
  for(let h=1;h<24;h++){const y=Math.round(h*ch);ctx.moveTo(AVG_X,y+.5);ctx.lineTo(AVG_X+TOT_COL_W,y+.5);}
  // Footer row divider
  for(let fi=1;fi<FOOTER_ROWS;fi++){
    const fy=Math.round(CANVAS_HEIGHT+FOOTER_GAP+fi*ch);
    ctx.moveTo(0,fy+.5);ctx.lineTo(FULL_W,fy+.5);
  }
  ctx.stroke();

  // Month boundary lines
  ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1;
  for(let m=1;m<12;m++){
    const x=Math.round(MONTH_START_DOY[m]*cw);
    ctx.beginPath();ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,TOTAL_H);ctx.stroke();
  }

  // Separators
  ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(GRID_W+.5,0);ctx.lineTo(GRID_W+.5,TOTAL_H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,CANVAS_HEIGHT+.5);ctx.lineTo(FULL_W,CANVAS_HEIGHT+.5);ctx.stroke();

  // Outer borders
  ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=1.5;
  ctx.strokeRect(.75,.75,GRID_W-1.5,CANVAS_HEIGHT-1.5);
  ctx.strokeRect(AVG_X+.75,.75,TOT_COL_W-1.5,CANVAS_HEIGHT-1.5);
  ctx.strokeRect(.75,CANVAS_HEIGHT+FOOTER_GAP+.75,FULL_W-1.5,FOOTER_H-1.5);

  // ── Tot column text (annual totals per hour — cells are wide enough) ──
  ctx.save();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='9px "JetBrains Mono",monospace';
  ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=1.5;
  const totCX=AVG_X+TOT_COL_W/2;
  for(let h=0;h<24;h++){
    const v=totColVals[h];const text=formatAnnualTot(v);if(!text)continue;
    const[r,g,b]=getColorRGB(v,SCALE_ANNUAL_HOURLY);
    ctx.fillStyle=textCol(r,g,b);
    ctx.fillText(text,totCX,(h+0.5)*ch);
  }
  // Corner cell text
  const footerCornerDef=[
    {v:totOfTotal, sc:SCALE_CORNER_ANNUAL_TOTAL, fmt:formatAnnualTot},
  ];
  for(let fi=0;fi<FOOTER_ROWS;fi++){
    const{v,sc,fmt}=footerCornerDef[fi];
    const text=fmt(v);if(!text)continue;
    const cy=CANVAS_HEIGHT+FOOTER_GAP+(fi+0.5)*CELL_H;
    const[r,g,b]=getColorRGB(v,sc);
    ctx.fillStyle=textCol(r,g,b);
    ctx.fillText(text,totCX,cy);
  }
  ctx.restore();
}

function renderLegend(){

  lx.fillStyle=grad;lx.fillRect(0,0,W,H);
}

// ═══════════════════════════════════════════════
function updateStats(){
  let annualTotal=0,wetDays=0,peakV=null,peakDoy=-1,peakH=-1;let hasData=false;
  for(let doy=0;doy<366;doy++){
    const dt=getDayTotal(doy);
    if(dt!=null&&!isNaN(dt)&&dt>=TRACE){wetDays++;hasData=true;}
    if(dt!=null&&!isNaN(dt))annualTotal+=dt;
    for(let h=0;h<24;h++){
      const v=getGridValue(doy,h);if(v!=null&&!isNaN(v)){
        hasData=true;if(peakV==null||v>peakV){peakV=v;peakDoy=doy;peakH=h;}
      }
    }
  }
  if(!hasData){
    ['sv-total','sv-wetdays','sv-peak'].forEach(id=>document.getElementById(id).textContent='—');
    document.getElementById('sv-peak-sub').textContent='highest single hour';return;
  }
  document.getElementById('sv-total').textContent=fmtPrecipDisplay(annualTotal);
  document.getElementById('sv-total-sub').textContent=mode==='climatology'?`avg ${fromYear}–${toYear}`:'liquid equiv.';
  document.getElementById('sv-wetdays').textContent=wetDays+'';
  document.getElementById('sv-peak').textContent=peakV!=null?(peakV<TRACE+0.0005?'Trace':peakV.toFixed(2)+'"'):'—';
  document.getElementById('sv-peak-sub').textContent=peakDoy>=0?`${doyToDisplay(peakDoy)} · ${fmtHour(peakH)}`:'highest single hour';
}

function updateTitle(){
  const st=STATIONS[activeStationId];
  document.getElementById('title-station').textContent=st.label;
  document.getElementById('title-period').textContent=mode==='single'?String(currentYear):`${fromYear}–${toYear} Avg`;
  document.getElementById('footer-tz').textContent=st.tzLabel+' Local Time';
  document.getElementById('live-dot').style.display=(mode==='single'&&currentYear===CURRENT_YEAR)?'inline':'none';
}

// ═══════════════════════════════════════════════
// PROGRESS / LOADING
// ═══════════════════════════════════════════════
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showLoading(msg){const ov=document.getElementById('loading-overlay');ov.classList.remove('hidden');document.getElementById('loading-text').textContent=msg;document.getElementById('error-msg').style.display='none';setProgress(0);}
function hideLoading(){document.getElementById('loading-overlay').classList.add('hidden');}
function showError(msg){document.getElementById('error-msg').textContent=msg;document.getElementById('error-msg').style.display='block';document.getElementById('loading-text').textContent='Error';}
function setProgress(pct,msg){document.getElementById('progress-fill').style.width=pct+'%';if(msg)document.getElementById('loading-text').textContent=msg;}
function startFakeProgress(){let p=5;fakeTimer=setInterval(()=>{p=Math.min(p+(65-p)*0.07,65);setProgress(p);},300);}
function stopFakeProgress(){clearInterval(fakeTimer);fakeTimer=null;}

// ═══════════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════════
function stopLiveRefresh(){clearInterval(liveTimer);liveTimer=null;}
function startLiveRefresh(){
  stopLiveRefresh();
  if(mode!=='single'||currentYear!==CURRENT_YEAR)return;
  liveTimer=setInterval(async()=>{
    try{const st=STATIONS[activeStationId];const text=await fetchIEM(activeStationId,st.tz,currentYear,currentYear);
      parseCSVInto(text,currentYear,currentYear,singleData,null);renderHeatmap();updateStats();}
    catch(e){console.warn('Live refresh failed:',e);}
  },LIVE_INTERVAL);
}

async function loadSingleYear(year){
  stopLiveRefresh();const st=STATIONS[activeStationId];
  const myToken=++loadToken;
  showLoading(`Loading ${year}…`);startFakeProgress();
  try{
    const[iemResult,acisResult]=await Promise.allSettled([
      fetchIEM(activeStationId,st.tz,year,year),
      fetchACISDaily(activeStationId,year,year)
    ]);
    if(myToken!==loadToken)return; // superseded by a newer station/year/mode switch
    stopFakeProgress();setProgress(80,'Parsing…');await sleep(20);
    if(myToken!==loadToken)return;
    singleData=makeSingleData();
    if(iemResult.status==='fulfilled')parseCSVInto(iemResult.value,year,year,singleData,null);
    if(acisResult.status==='fulfilled')parseACISDaily(acisResult.value,singleData,null);
    hideLoading();updateTitle();renderHeatmap();renderLegend();updateStats();startLiveRefresh();
  }catch(e){if(myToken!==loadToken)return;stopFakeProgress();showError(e.message);console.error(e);}
}

async function loadClimatology(fy,ty){
  const st=STATIONS[activeStationId];const cacheKey=`${activeStationId}_${fy}_${ty}`;
  const myToken=++loadToken;
  if(climoCache.has(cacheKey)){climoData=climoCache.get(cacheKey);updateTitle();renderHeatmap();renderLegend();updateStats();return;}
  showLoading(`Fetching ${fy}–${ty}… (${ty-fy+1} years)`);startFakeProgress();
  try{
    const[iemResult,acisResult]=await Promise.allSettled([
      fetchIEM(activeStationId,st.tz,fy,ty),
      fetchACISDaily(activeStationId,fy,ty)
    ]);
    if(myToken!==loadToken)return; // superseded by a newer station/range/mode switch
    stopFakeProgress();setProgress(70,'Parsing…');await sleep(30);
    if(myToken!==loadToken)return;
    const accum=makeClimoAccum();
    if(iemResult.status==='fulfilled')parseCSVInto(iemResult.value,fy,ty,null,accum);
    if(acisResult.status==='fulfilled')parseACISDaily(acisResult.value,null,accum);
    setProgress(90,'Computing…');await sleep(20);
    if(myToken!==loadToken)return; // abandoned while computing
    climoData=accumToStats(accum);climoCache.set(cacheKey,climoData);
    setProgress(100);hideLoading();updateTitle();renderHeatmap();renderLegend();updateStats();
  }catch(e){if(myToken!==loadToken)return;stopFakeProgress();showError(e.message);console.error(e);}
}

// ═══════════════════════════════════════════════
// EVENT HANDLERS
// ═══════════════════════════════════════════════
function setMode(m){
  mode=m;
  document.getElementById('tab-single').classList.toggle('active',m==='single');
  document.getElementById('tab-climo').classList.toggle('active',m==='climatology');
  document.getElementById('single-controls').style.display=m==='single'?'flex':'none';
  document.getElementById('climo-controls').style.display=m==='climatology'?'flex':'none';
  stopLiveRefresh();
  if(m==='single')loadSingleYear(currentYear);else loadClimatology(fromYear,toYear);
}
function onYearChange(){currentYear=parseInt(document.getElementById('year-select').value);singleData=null;stopLiveRefresh();loadSingleYear(currentYear);}
function onClimoLoad(){
  fromYear=parseInt(document.getElementById('from-year').value);toYear=parseInt(document.getElementById('to-year').value);
  if(fromYear>toYear){alert('From year must be ≤ To year');return;}
  climoData=null;loadClimatology(fromYear,toYear);
}
function setPreset(fy,ty){document.getElementById('from-year').value=fy;document.getElementById('to-year').value=ty;fromYear=fy;toYear=ty;climoData=null;loadClimatology(fromYear,toYear);}
function onStationChange(){
  activeStationId=document.getElementById('station-select').value;singleData=null;
  climoData=climoCache.get(`${activeStationId}_${fromYear}_${toYear}`)||null;
  stopLiveRefresh();if(mode==='single')loadSingleYear(currentYear);else loadClimatology(fromYear,toYear);
}

// ═══════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════
const tooltip=document.getElementById('tooltip');
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  const mx=e.clientX-rect.left,my=e.clientY-rect.top;
  const FULL_W=canvas.width/dpr;
  const GRID_W=FULL_W-AVG_GAP-TOT_COL_W;
  const cw=GRID_W/366;
  if(mx<0||mx>FULL_W||my<0||my>TOTAL_H){tooltip.style.display='none';return;}
  if(mx>GRID_W||my>CANVAS_HEIGHT){tooltip.style.display='none';return;}
  const doy=Math.min(365,Math.floor(mx/cw));
  const h=Math.min(23,Math.floor(my/CELL_H));
  const v=getGridValue(doy,h);
  document.getElementById('tt-date').textContent=`${doyToDisplay(doy)}  ·  ${fmtHour(h)}`;
  let valStr='—';
  if(v!=null&&!isNaN(v)){valStr=v===0?'Dry':v<TRACE+0.0005?'Trace':v.toFixed(3)+' in/hr';}
  document.getElementById('tt-value').textContent=valStr;
  document.getElementById('tt-detail').textContent=mode==='climatology'?`${fromYear}–${toYear} avg`:String(currentYear);
  tooltip.style.display='block';
  const TW=220,TH=80;let tx=e.clientX+16,ty=e.clientY-10;
  if(tx+TW>window.innerWidth-10)tx=e.clientX-TW-12;
  if(ty+TH>window.innerHeight-10)ty=window.innerHeight-TH-10;
  tooltip.style.left=tx+'px';tooltip.style.top=ty+'px';
});
canvas.addEventListener('mouseleave',()=>{tooltip.style.display='none';});

// ═══════════════════════════════════════════════
// DOWNLOAD PNG
// ═══════════════════════════════════════════════
function downloadPNG(){
  const st=STATIONS[activeStationId];
  const period=mode==='single'?String(currentYear):`${fromYear}–${toYear} Avg`;
  const EXPORT_SCALE = 3;
  const origDpr = dpr;
  dpr = EXPORT_SCALE;
  setupCanvas();
  renderHeatmap();

  const cw2=canvas.width/dpr,ch2=canvas.height/dpr;
  const PAD=24,HDR=98,MBAR=22,FTR=20; // HDR bumped 90->98: the legend colorbar
  // (y 72-81) was overlapping its own "Dry"/"≥ 1.00 in/hr" endpoint labels
  // (baseline y=84, ascender reaching ~76). Labels moved to y=92 below, bar
  // nudged up to 70-79, and HDR grown so the month-label row / canvas / oh
  // (all offset from HDR) keep their spacing relative to the taller header.
  const HLABEL_W=62;
  const ow=PAD+HLABEL_W+cw2+PAD,oh=HDR+MBAR+ch2+FTR;
  const FULL_W=cw2,GRID_W=FULL_W-AVG_GAP-TOT_COL_W;
  const cw=GRID_W/366;

  const off=document.createElement('canvas');off.width=ow*EXPORT_SCALE;off.height=oh*EXPORT_SCALE;
  const oc=off.getContext('2d');oc.scale(EXPORT_SCALE,EXPORT_SCALE);

  oc.fillStyle='#1E2320';oc.fillRect(0,0,ow,oh);
  const sc=SCALE_HOURLY;const grad=oc.createLinearGradient(0,0,ow,0);
  sc.vals.forEach((v,i)=>{const lo=sc.vals[0],span=sc.vals[sc.vals.length-1]-lo;grad.addColorStop((v-lo)/span,sc.cols[i]);});
  oc.fillStyle=grad;oc.fillRect(0,0,ow,3);

  oc.fillStyle='#E8E4D9';oc.font='bold 18px "Barlow Condensed",sans-serif';
  oc.fillText(`${st.label}  ·  Annual Precipitation Heatmap  ·  ${period}`,PAD,28);
  oc.fillStyle='#A6A499';oc.font='13px "Barlow Condensed",sans-serif';
  oc.fillText(`Hourly liquid-equivalent precipitation  ·  ${st.tzLabel} local time`,PAD,46);
  oc.fillStyle='#D08425';oc.font='bold 12px "Barlow Condensed",sans-serif';
  oc.fillText(`Annual Total: ${document.getElementById('sv-total').textContent}   Wet Days: ${document.getElementById('sv-wetdays').textContent}   Peak Hour: ${document.getElementById('sv-peak').textContent}`,PAD,62);
  oc.fillStyle='#948F82';oc.font='12px "Barlow Condensed",sans-serif';oc.textAlign='right';
  oc.fillText('contextclimate.io',ow-PAD,28);

  // Legend colorbar — between stats and month labels, matching web UI position
  const canvasX=PAD+HLABEL_W;
  oc.fillStyle='#A6A499';oc.font='11px "Barlow Condensed",sans-serif';
  oc.textAlign='left';  oc.fillText('Dry',           canvasX,      92);
  oc.textAlign='right'; oc.fillText('≥ 1.00 in/hr',  canvasX+cw2,  92);
  oc.textAlign='left';
  oc.fillStyle=grad; oc.fillRect(canvasX+24, 70, cw2-24-82, 9);

  // Hour labels
  oc.textAlign='right';oc.textBaseline='middle';oc.font='11px "Barlow Condensed",sans-serif';
  const hLabelX=PAD+HLABEL_W-6;
  for(let h=0;h<24;h++){oc.fillStyle='#A6A499';oc.fillText(HOURS[h],hLabelX,HDR+MBAR+(h+0.5)*CELL_H);}
  oc.fillStyle='#88c8ff';oc.fillText('Total',hLabelX,HDR+MBAR+CANVAS_HEIGHT+FOOTER_GAP+CELL_H*0.5);

  // Month labels
  oc.textAlign='center';oc.textBaseline='alphabetic';oc.font='11px "Barlow Condensed",sans-serif';
  oc.fillStyle='#A6A499';
  for(let m=0;m<12;m++){
    const mid=(MONTH_START_DOY[m]+MONTH_DAYS_LEAP[m]/2)*cw;
    oc.fillText(MONTHS_SHORT[m],canvasX+mid,HDR+MBAR-7);
  }
  oc.fillStyle='#FFD700';oc.fillText('Tot',canvasX+GRID_W+AVG_GAP+TOT_COL_W/2,HDR+MBAR-7);
  oc.textAlign='left';

  oc.drawImage(canvas,canvasX,HDR+MBAR,cw2,ch2);

  dpr = origDpr;
  setupCanvas();
  renderHeatmap();
  oc.fillStyle='#948F82';oc.font='11px "Barlow Condensed",sans-serif';
  oc.fillText(`${st.tzLabel} Local Time  ·  Data: IEM ASOS & NOAA ACIS  ·  contextclimate.io`,PAD,oh-8);
  oc.fillStyle=grad;oc.fillRect(0,oh-2,ow,2);

  const link=document.createElement('a');
  link.download=`precip-heatmap-annual-${activeStationId}-${period.replace(/[\s–]/g,'_')}.png`;
  link.href=off.toDataURL('image/png');link.click();
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function init(){
  const yrSel=document.getElementById('year-select');
  const fromSel=document.getElementById('from-year');
  const toSel=document.getElementById('to-year');
  for(let y=CURRENT_YEAR;y>=FIRST_YEAR;y--){
    const o=document.createElement('option');o.value=y;o.textContent=y;yrSel.appendChild(o);
    const o1=document.createElement('option');o1.value=y;o1.textContent=y;fromSel.appendChild(o1);
    const o2=document.createElement('option');o2.value=y;o2.textContent=y;toSel.appendChild(o2);
  }
  yrSel.value=currentYear;fromSel.value=fromYear;toSel.value=toYear;
  requestAnimationFrame(()=>{
    setupCanvas();renderHourLabels();renderMonthLabels();renderLegend();updateTitle();
    loadSingleYear(currentYear);
  });
  window.addEventListener('resize',()=>{
    dpr=window.devicePixelRatio||1;setupCanvas();renderMonthLabels();renderLegend();
    const hasData=mode==='single'?!!singleData:!!climoData;if(hasData)renderHeatmap();
  });
}
init();
</script>
