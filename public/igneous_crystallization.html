<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igneous Crystallization</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); --rail-w: 392px; --card-w: 290px; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 14px; white-space: nowrap; }
.tabs .cc-segmented-btn .n { opacity: .65; margin-right: 6px; }
.tabs .cc-segmented-btn.is-active .n { opacity: .8; }
.top .spacer { flex: 1; min-width: 0; }
.series { display: flex; gap: 6px; }
.x-link { padding: 6px 11px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.x-link:hover { background: color-mix(in srgb, var(--tool-accent) 14%, transparent); color: var(--color-text-primary); }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.png-menu { position: absolute; top: 38px; left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.png-menu.open { display: flex; }
.png-menu button { background: none; border: 0; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px;
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.png-menu button:hover { background: rgba(232,228,217,0.08); }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--card-w); gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage canvas.ov { pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; row-gap: 6px; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 56px; }
.controls .grp { display: flex; gap: 6px; align-items: center; min-width: 0; }
.snap { padding: 6px 8px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--color-text-secondary); }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.go { min-width: 98px; padding: 11px 14px; font-size: 16px; white-space: nowrap; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tool-accent) 22%, transparent); }
.go:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--tool-accent) 32%, transparent); }
.slider { flex: 1 1 110px; display: flex; align-items: center; gap: 8px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 58px; text-align: right; white-space: nowrap; }
.chips { position: absolute; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chips.r { top: 10px; right: 10px; justify-content: flex-end; max-width: 70%; }
.chips.l { top: 10px; left: 10px; max-width: 60%; }
.chips .cc-segmented { background: var(--color-surface); }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; }
.chip-rot { display: flex; align-items: center; gap: 8px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 4px 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.chip-rot input { width: 110px; accent-color: var(--tool-accent); }
.chip-rot output { min-width: 32px; text-align: right; color: var(--color-text-primary); font-weight: 700; }
.pill { background: rgba(20,24,21,.86); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 5px 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-primary); white-space: nowrap; }
.pill b { font-family: var(--font-display); font-size: 18px; margin-right: 6px; }
.pill.hot { border-color: var(--tool-accent); }

/* tooltip */
.tip { position: absolute; pointer-events: none; display: none; z-index: 6; background: rgba(14,17,13,.95); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-md); padding: 7px 11px 8px; max-width: 240px; }
.tip.on { display: block; }
.tip-n { display: flex; align-items: center; gap: 7px; font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--color-text-primary); }
.tip-d { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.tip-m { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); line-height: 1.4; margin-top: 3px; }

/* readout card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card > * { flex-shrink: 0; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .v.big { font-size: 30px; }
.card .r.dim .v { font-size: 20px; color: var(--color-text-secondary); }
.card .s2 { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-top: 1px; }
.card .s2.hot { color: var(--tool-accent); }
.card .tag { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; border: 1px solid var(--color-border-hover); border-radius: var(--radius-sm); padding: 2px 7px; margin-top: 4px; color: var(--color-text-secondary); }
.card .tag.hot { border-color: var(--tool-accent); color: var(--color-text-primary); }
.card table { width: 100%; border-collapse: collapse; margin-top: 2px; }
.card th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; font-weight: 500;
  color: var(--color-text-secondary); text-align: right; padding: 8px 2px 5px 4px; border-bottom: 1px solid var(--color-border-hover); line-height: 1.25; vertical-align: bottom; }
.card th:first-child, .card td:first-child { text-align: left; }
.card td { font-family: var(--font-mono); font-size: 16px; font-weight: 700; text-align: right; padding: 6px 2px; border-bottom: 1px solid var(--color-border); white-space: nowrap; color: var(--color-text-primary); }
.card td:first-child { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
.card .sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 10px; margin-bottom: 5px; }
.card .x-link { display: block; text-align: center; margin-top: 12px; padding: 9px 12px; }
@media (max-height: 640px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .v.big { font-size: 26px; }
  .card .r.dim .v { font-size: 18px; }
  .card td { padding: 4px 2px; }
}

/* left rail */
.rail { padding: 10px 12px 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.rail .eb { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); margin-bottom: 6px; }
.rail .eb em { font-style: normal; font-weight: 500; letter-spacing: .03em; text-transform: none; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .note { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin-top: 6px; text-align: right; }
.rail .note b { color: var(--color-text-secondary); font-weight: 700; }

@media (max-width: 1440px) {
  .top .sub { display: none; }
}
@media (max-width: 1366px) {
  .tabs .cc-segmented-btn { padding: 11px 11px; }
}
@media (max-width: 1300px) {
  .x-link .nm { display: none; }
  .slider .sv { display: none; }
  .snap { padding: 6px 6px; }
}
@media (max-width: 1180px) {
  .tabs .cc-segmented-btn .lb { display: none; }
  .card td { font-size: 15px; }
  .snap { padding: 6px 7px; font-size: 13px; }
  .slider .sv { display: none; }
  .slider { min-width: 110px; }
  .controls { gap: 6px; }
  .go { min-width: 0; padding: 11px 12px; }
}


/* rock chart — laid out like the ESSRT p. 14 composition scheme */
.chart { flex: 1; min-height: 0; display: grid; grid-template-columns: 20px 98px repeat(4, minmax(0, 1fr)); grid-template-rows: auto repeat(6, minmax(0, 1fr)); gap: 4px; }
.ch-col { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-secondary); text-align: center; line-height: 1.2; padding: 2px 0 4px; align-self: end; }
.ch-col.on { color: var(--tool-accent); font-weight: 700; }
.brk { grid-column: 1; border: 1.5px solid var(--color-border-hover); border-right: 0; border-radius: 4px 0 0 4px; margin: 3px 0 3px 4px; position: relative; }
.brk span { position: absolute; left: -9px; top: 50%; transform: translateY(-50%) rotate(180deg); writing-mode: vertical-rl; background: var(--color-surface); padding: 4px 0;
  font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); }
.ch-row { text-align: right; padding-right: 6px; display: flex; flex-direction: column; justify-content: center; border-right: 3px solid transparent; line-height: 1.15; }
.ch-row b { font-family: var(--font-body); font-weight: 700; font-size: 14px; color: var(--color-text-primary); }
.ch-row span { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }
.ch-row.on { border-right-color: var(--tool-accent); }
.ch-row.on b { color: var(--tool-accent); }
.cell { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 5px; color: var(--color-text-primary);
  font-family: var(--font-body); font-size: 13px; font-weight: 500; line-height: 1.15; padding: 2px 1px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; overflow-wrap: anywhere; hyphens: manual;
  transition: background .12s ease, border-color .12s ease; }
.cell:hover:not(.dead):not(.on) { border-color: var(--tool-accent); background: color-mix(in srgb, var(--tool-accent) 12%, var(--color-surface-2)); }
.cell:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 1px; }
.cell.col { background: color-mix(in srgb, var(--tool-accent) 9%, var(--color-surface-2)); }
.cell.on { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); font-weight: 700; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tool-accent) 26%, transparent); }
.cell.dead { background: transparent; border-color: transparent; color: var(--color-text-muted); cursor: default; }
.cbar { margin: 8px 0 0 122px; }
.cbar i { display: block; height: 8px; border-radius: 3px; background: linear-gradient(to right, #E2DCCF, #22231F); border: 1px solid var(--color-border); }
.cbar div { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 13px; line-height: 1.2; color: var(--color-text-secondary); margin-top: 4px; }
.cbar div span:last-child { text-align: right; }
.chips.r { max-width: calc(100% - 20px); }

/* control bar — second row is the cooling scale */
.controls .slider.tl { flex: 1 1 100%; order: 3; }
.controls .grp { flex: 1 1 0; flex-wrap: wrap; }
.slider .te { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--color-text-secondary); white-space: nowrap; }
.stage.busy::after { content: ''; position: absolute; inset: 0; background: rgba(30,35,32,.35); }

/* card extras */
.mlist { display: flex; flex-direction: column; gap: 1px; }
.mr { display: flex; align-items: center; gap: 8px; padding: 0; line-height: 1.3; opacity: .5; }
.mr i { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.mr b { font-family: var(--font-body); font-size: 14px; font-weight: 600; color: var(--color-text-primary); flex: 1; white-space: nowrap; }
.mr span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.mr.on { opacity: 1; }
.mr.now b { color: var(--tool-accent); }
.shelf { display: flex; gap: 6px; margin-top: auto; padding-top: 6px; }
.shelf:empty { display: none; }
.card.tight .spec span { display: none; }
.card.tight2 .shelf { display: none; }
.card .v.big.long { font-size: 25px; }
.spec { flex: 1 1 0; min-width: 0; max-width: 62px; background: none; border: 1px solid var(--color-border); border-radius: 6px; padding: 3px 2px 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.spec:hover { border-color: var(--tool-accent); }
.spec img { width: 32px; height: 32px; border-radius: 50%; display: block; }
.spec span { font-family: var(--font-body); font-size: 13px; color: var(--color-text-secondary); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 1300px) { :root { --rail-w: 372px; --card-w: 276px; } }
@media (max-width: 1180px) {
  :root { --rail-w: 336px; --card-w: 262px; }
  .rail { padding: 10px 10px; }
  .chart { grid-template-columns: 20px 74px repeat(4, minmax(0, 1fr)); gap: 3px; }
  .ch-row span { display: none; }
  .cbar { margin-left: 97px; }
  .snap small { display: none; }
  .controls .grp { flex-wrap: wrap; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title">Igneous Crystallization</h1><span class="sub">1 of 3 · rock formation</span></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="series" id="series"></div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="png-menu" id="pngMenu">
        <button data-png="all">Whole tool</button>
        <button data-png="stage">Specimen panel</button>
        <button data-png="chart">Rock chart</button>
        <button data-png="card">Readout card</button>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="cc-panel rail">
      <div class="eb">Igneous rock chart <em>ESSRT p. 14</em></div>
      <div class="chart" id="chart"></div>
      <div class="cbar"><i></i><div><span>lighter<br>less dense</span><span>darker<br>denser</span></div></div>
    </div>
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <canvas id="ov" class="ov"></canvas>
        <div class="chips r" id="chipsR"></div>
        <div class="tip" id="tip"><div class="tip-n"><span class="tip-d" id="tipDot"></span><span id="tipName"></span></div><div class="tip-m" id="tipMeta"></div></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

function extAt(phi){ return Math.pow(Math.abs(Math.sin(2*phi)), 1.3) * 0.90 + 0.10; }

var COMPS = [
  { key:'felsic', n:'Felsic', sub:'granitic', dens:2.7, T0:930, T1:640,
    mins:[ {k:'amphibole',pct:15,T:890,sz:0.60},{k:'plag',pct:12,T:860,T2:700,sz:1.00,col:[198,197,193],col2:[222,220,214]},{k:'biotite',pct:13,T:800,sz:0.62},

  { key:'intermediate', n:'Intermediate', sub:'andesitic', dens:2.8, T0:1100, T1:790,
    mins:[ {k:'plag',pct:40,T:1040,T2:850,sz:1.18,col:[170,170,168],col2:[206,205,201]},{k:'amphibole',pct:37,T:960,sz:0.86},{k:'biotite',pct:13,T:880,sz:0.60},

  { key:'mafic', n:'Mafic', sub:'basaltic', dens:3.0, T0:1230, T1:1000,

  { key:'ultramafic', n:'Ultramafic', sub:'peridotitic', dens:3.3, T0:1520, T1:1240,
    mins:[ {k:'olivine',pct:65,T:1480,sz:1.12},{k:'pyroxene',pct:30,T:1340,sz:0.94},{k:'plag',pct:5,T:1290,T2:1250,sz:0.72,col:[128,130,138],col2:[150,152,158]} ] }
];
var DARK = {olivine:1, pyroxene:1, amphibole:1, biotite:1};

/* Grain size is a real millimetre figure. Field of view is NOT a property
   of the rock — it is a property of the view (ZOOM, below), identical for
   every texture, so that switching rocks never rescales the image. */
var TEX = [
  { key:'pegmatitic', n:'Pegmatitic', grainMm:24, dur:15000, depth:9,  secs:6.3e13,
    grain:'> 10 mm', env:'Very slow cooling in a water-rich residual melt' },
  { key:'phaneritic', n:'Phaneritic', grainMm:4.0, dur:12000, depth:15, secs:1.9e13,
    grain:'1–10 mm', env:'Slow cooling deep underground' },
  { key:'porphyritic', n:'Porphyritic', grainMm:0.55, dur:12000, depth:12, secs:7.9e12,
    grain:'two sizes', env:'Slow at depth, then erupted and chilled', two:true, phenoMm:6.5 },
  { key:'aphanitic', n:'Aphanitic', grainMm:0.3, dur:5200, depth:0, secs:7.8e5,
    grain:'< 1 mm', env:'Rapid cooling at the surface' },
  { key:'vesicular', n:'Vesicular', grainMm:0.28, dur:4000, depth:0, secs:2.2e4,
    grain:'< 1 mm + cavities', env:'Gas escaping from erupting lava', ves:true },
  { key:'glassy', n:'Glassy', grainMm:0, dur:2400, depth:0, secs:90,
    grain:'none', env:'Quenched too fast for crystals to form', glass:true }
];

/* One zoom ladder in absolute millimetres, shared by every rock. */
var ZOOM = [ {mm:4, n:'hand lens'}, {mm:40, n:'hand sample'}, {mm:100, n:'slab'} ];

/* The field is seeded over a plane larger than the frame and then cropped,
   so a crystal wider than the view is cut by the edge instead of being the
   only thing in it. The margin is measured in grains, not pixels: fine
   rocks pay nothing for it. */
function padFor(T, fovMm){
  var charMm = Math.max(T.grainMm || 0, T.phenoMm || 0);
  return Math.min(0.45, 1.2 * charMm / fovMm);
}

/* rock[textureIndex][compIndex] — null means the combination is not on
   the chart (ultramafic magma effectively never reaches the surface). */
var ROCK = [
  ['Pegmatite',           'Pegmatite',             'Pegmatite',         null],
  ['Granite',             'Diorite',               'Gabbro',            'Peridotite'],
  ['Porphyritic rhyolite','Porphyritic andesite',  'Porphyritic basalt',null],
  ['Rhyolite',            'Andesite',              'Basalt',            null],
  ['Pumice',              'Vesicular andesite',    'Scoria',            null],

var W = 480, H = 480, NPX = W * H;
var AR_CAP = 2.55;
/* Grid-accelerated Voronoi is flat in seed count per pixel, so the cap is
   set by legibility, not cost: 30000 seeds is a 1.6 px grain radius, below
   which nothing about size is readable anyway. */
var SEED_CAP = 30000;

/* ═══════════════════════════════════════════════════════════════════════

function rng(seed){ var s = seed >>> 0 || 1; return function(){ s = (Math.imul(s,1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function hashStr(k){ var h = 5381; for (var i=0;i<k.length;i++) h = ((h<<5) + h + k.charCodeAt(i)) & 0x7fffffff; return h + 1; }
function cl(v){ return v < 0 ? 0 : v > 255 ? 255 : v | 0; }
function rgbCss(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

/* Incandescence — colour of the melt at a real temperature (°C). */
var GLOW = [[420,44,8,3],[620,140,20,4],[820,206,54,8],[1000,238,92,14],[1200,248,140,34],[1400,254,178,72],[1650,255,214,140]];
function glowAt(T){
  if (T <= GLOW[0][0]) return [GLOW[0][1],GLOW[0][2],GLOW[0][3]];
  for (var i=1;i<GLOW.length;i++){
    if (T <= GLOW[i][0]){
      var a = GLOW[i-1], b = GLOW[i], f = (T - a[0]) / (b[0] - a[0]);
      return [a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f];
    }
  }
  return [GLOW[6][1],GLOW[6][2],GLOW[6][3]];
}

var YR = 3.15576e7;
function fmtTime(sec){
  if (sec < 1) return sec.toFixed(2) + ' s';
  if (sec < 100) return Math.round(sec) + ' s';
  if (sec < 5400) return (sec/60).toFixed(sec < 600 ? 1 : 0) + ' min';
  if (sec < 1.9e5) return (sec/3600).toFixed(sec < 3.6e4 ? 1 : 0) + ' h';
  if (sec < YR*0.6) return (sec/86400).toFixed(sec < 8.64e5 ? 1 : 0) + ' d';
  var y = sec / YR;
  if (y < 1e4) return Math.round(y).toLocaleString('en-US') + ' yr';
  if (y < 1e6) return Math.round(y/1e3).toLocaleString('en-US') + ' kyr';
  return (y/1e6).toFixed(y < 1e7 ? 2 : 1) + ' Myr';
}
var SB_STEPS = [0.1,0.2,0.5,1,2,5,10,20,50,100];
function scaleBarFor(fovMm){
  var want = fovMm / 4, best = SB_STEPS[0];
  for (var i=0;i<SB_STEPS.length;i++) if (SB_STEPS[i] <= want) best = SB_STEPS[i];
  return best;
}
function fmtMm(mm){ return mm >= 10 ? (mm/10) + ' cm' : mm + ' mm'; }

/* ═══════════════════════════════════════════════════════════════════════
   VORONOI — grid-accelerated, anisotropic, additively weighted.
   Weights let a handful of phenocrysts own large territories in the same
   pass as hundreds of groundmass grains. Cost is per-pixel constant in
   seed count, so a 6000-grain aphanitic field costs about what a 30-grain
   granite does.
   ═══════════════════════════════════════════════════════════════════ */
function voronoi(sX, sY, sCos, sSin, sAx, sWt, nHeavy, wMaxL){
  var S = sX.length, L = S - nHeavy;   /* heavy seeds are brute-forced; the
                                          rest go in the bin grid, so the
                                          early-exit bound stays tight */
  var cell = Math.max(4, Math.round(Math.sqrt(W * H / Math.max(1, L))));
  var gw = Math.ceil(W / cell), gh = Math.ceil(H / cell), NC = gw * gh;
  var start = new Int32Array(NC + 1), bin = new Int32Array(S);
  var s, i;
  for (s=nHeavy;s<S;s++){
    var gx = Math.min(gw-1, Math.max(0, (sX[s]/cell)|0)), gy = Math.min(gh-1, Math.max(0, (sY[s]/cell)|0));
    bin[s] = gy*gw + gx; start[bin[s]+1]++;
  }
  for (i=0;i<NC;i++) start[i+1] += start[i];
  var items = new Int32Array(Math.max(1,L)), fill = new Int32Array(NC);
  for (s=nHeavy;s<S;s++){ var c = bin[s]; items[start[c] + fill[c]++] = s; }

  var own = new Int32Array(NPX), d2a = new Float32Array(NPX), d2b = new Float32Array(NPX), de = new Float32Array(NPX);
  var maxR = Math.max(gw, gh), ax2 = AR_CAP * AR_CAP;

  for (var py=0; py<H; py++){
    var cy = Math.min(gh-1, (py/cell)|0);
    for (var px=0; px<W; px++){
      var b1 = 1e18, b2 = 1e18, bs = -1, dx, dy, rx, ry, u, dd, q;

      for (q=0; q<nHeavy; q++){
        dx = px - sX[q]; dy = py - sY[q];
        rx = dx*sCos[q] + dy*sSin[q]; ry = -dx*sSin[q] + dy*sCos[q];
        u = rx / sAx[q];
        dd = u*u + ry*ry - sWt[q];
        if (dd < b1){ b2 = b1; b1 = dd; bs = q; } else if (dd < b2) b2 = dd;
      }

      var cx0 = Math.min(gw-1, (px/cell)|0);
      for (var r=0; r<=maxR; r++){
        if (bs >= 0 && r > 0){
          var rm = (r-1) * cell;
          if (rm > 0 && rm*rm > ax2 * (b2 + wMaxL)) break;
        }
        var y0 = cy-r, y1 = cy+r, x0 = cx0-r, x1 = cx0+r;
        var gyA = y0 < 0 ? 0 : y0, gyB = y1 > gh-1 ? gh-1 : y1;
        for (var gy2=gyA; gy2<=gyB; gy2++){
          var edgeY = (gy2 === y0 || gy2 === y1);
          var gxA = x0 < 0 ? 0 : x0, gxB = x1 > gw-1 ? gw-1 : x1;
          for (var gx2=gxA; gx2<=gxB; gx2++){
            if (!edgeY && gx2 !== x0 && gx2 !== x1) continue;
            var cc = gy2*gw + gx2, e = start[cc+1];
            for (var t=start[cc]; t<e; t++){
              q = items[t];
              dx = px - sX[q]; dy = py - sY[q];
              rx = dx*sCos[q] + dy*sSin[q]; ry = -dx*sSin[q] + dy*sCos[q];
              u = rx / sAx[q];
              dd = u*u + ry*ry - sWt[q];
              if (dd < b1){ b2 = b1; b1 = dd; bs = q; }
              else if (dd < b2) b2 = dd;
            }
          }
        }
      }
      if (bs < 0) bs = 0;
      var ii = py*W + px;
      own[ii] = bs; d2a[ii] = b1; d2b[ii] = b2 > 1e17 ? b1 + 1e6 : b2;
      var ex = px - sX[bs], ey = py - sY[bs];
      de[ii] = Math.sqrt(ex*ex + ey*ey);

/* ═══════════════════════════════════════════════════════════════════════
   FIELD BUILD — seeds, crystallization thresholds, and the two colour
   buffers (plane light / crossed polars), all precomputed once so that
   scrubbing the timeline is a threshold test per pixel.
   ═══════════════════════════════════════════════════════════════════ */

var MOTT = null, MOTT_W = 0;
function buildMottle(){
  if (MOTT && MOTT_W === W) return MOTT;
  MOTT_W = W;
  MOTT = new Float32Array(NPX);
  var CS = 9, gw = Math.ceil(W/CS) + 2, gh = Math.ceil(H/CS) + 2;
  var lat = new Float32Array(gw*gh), rd = rng(20260908);
  for (var i=0;i<lat.length;i++) lat[i] = rd() - 0.5;
  for (var y=0;y<H;y++){
    var fy = y/CS, iy = fy|0, ty = fy-iy, sy = ty*ty*(3-2*ty);
    for (var x=0;x<W;x++){
      var fx = x/CS, ix = fx|0, tx = fx-ix, sx = tx*tx*(3-2*tx);
      var a = lat[iy*gw+ix],     b = lat[iy*gw+ix+1];
      var c = lat[(iy+1)*gw+ix], d = lat[(iy+1)*gw+ix+1];
      MOTT[y*W+x] = (a + (b-a)*sx) * (1-sy) + (c + (d-c)*sx) * sy;
    }
  }
  return MOTT;
}

function mcol(compI, k){
  var C = COMPS[compI];
  for (var i=0;i<C.mins.length;i++) if (C.mins[i].k === k) return C.mins[i].col || MIN[k].col;
  return MIN[k].col;
}

var EZK = 2.4, EZD = 1 - Math.exp(-EZK);
function ez(p){ p = p < 0 ? 0 : p > 1 ? 1 : p; return (1 - Math.exp(-EZK*p)) / EZD; }
function ezI(u){ u = u < 0 ? 0 : u > 1 ? 1 : u; return -Math.log(1 - u*EZD) / EZK; }

function tempCurve(texI, compI){
  var T = TEX[texI], C = COMPS[compI], R = C.T0 - C.T1;
  if (!T.two) return { at:function(p){ return C.T0 - R * ez(p); },
                       inv:function(t){ return ezI((C.T0 - t) / R); } };
  var Tm = C.T0 - 0.40 * R, Tn = Tm - 12;
  return {
    at:function(p){
      if (p <= 0.45) return C.T0 - (C.T0 - Tm) * ez(p / 0.45);
      if (p <= 0.50) return Tm - 12 * ((p - 0.45) / 0.05);
      return Tn - (Tn - C.T1) * ez((p - 0.50) / 0.50);
    },
    inv:function(t){
      if (t >= Tm) return 0.45 * ezI((C.T0 - t) / (C.T0 - Tm));
      if (t >= Tn) return 0.45 + 0.05 * ((Tm - t) / 12);
      return 0.50 + 0.50 * ezI((Tn - t) / (Tn - C.T1));
    }
  };
}

function buildField(texI, compI, fovMm){
  var T = TEX[texI], C = COMPS[compI];
  var rand = rng(hashStr(T.key + '|' + C.key + '|' + fovMm));
  var pxmm = W / fovMm;
  var pad = padFor(T, fovMm), span = 1 + 2*pad, area = span * span;
  var curve = tempCurve(texI, compI);

  /* — seed inventory ————————————————————————————————— */
  var heavyN = 0, mkList = [], wtList = [], nucList = [], dunList = [], colList = [];
  var i, j, k;

  if (T.two){
    heavyN = Math.max(3, Math.min(40, Math.round(Math.pow(fovMm * span / T.phenoMm, 2) * 0.34)));
    var phk = C.mins[0].k, phT = C.mins[0].T;
    var phR = T.phenoMm * pxmm * 0.5;
    for (i=0;i<heavyN;i++){
      var pn = Math.min(0.24, Math.max(0.04, curve.inv(phT)));
      mkList.push(phk); wtList.push(phR*phR); nucList.push(pn); dunList.push(0.43);
      colList.push(mcol(compI, phk));
    }
  }
  if (!T.glass){
    var nLight = Math.round(Math.pow(fovMm * span / T.grainMm, 2));
    nLight = Math.max(3, Math.min(SEED_CAP, nLight));
    var pool = [], wsum = 0, wq = [];
    for (i=0;i<C.mins.length;i++){
      var szi = C.mins[i].sz || 1;
      wq[i] = C.mins[i].pct / (szi * szi);
      wsum += wq[i];
    }
    for (i=0;i<C.mins.length;i++){
      var cnt = Math.max(1, Math.round(wq[i] / wsum * nLight));
      for (j=0;j<cnt;j++) pool.push(i);
    }
    for (i=pool.length-1;i>0;i--){ var q0 = (rand()*(i+1))|0, t0 = pool[i]; pool[i] = pool[q0]; pool[q0] = t0; }
    while (pool.length < nLight) pool.push(0);
    pool.length = nLight;
    for (i=pool.length-1;i>0;i--){ var q = (rand()*(i+1))|0, tmp = pool[i]; pool[i] = pool[q]; pool[q] = tmp; }
    var meanR2 = W * H * area / nLight / Math.PI;
    for (i=0;i<nLight;i++){
      var m = C.mins[pool[i]];
      /* Bowen's continuous series: plagioclase nucleates across a temperature
         band, earlier grains Ca-rich and darker, later ones Na-rich */

      if (m.T2){ zone = rand(); tS = m.T - zone * (m.T - m.T2); }

                                        m.col[1]+(m.col2[1]-m.col[1])*zone,
                                        m.col[2]+(m.col2[2]-m.col[2])*zone]);
      else colList.push(mcol(compI, m.k));
    }
  }

  var S = mkList.length;
  var out = {
    tex:texI, comp:compI, fovMm:fovMm, span:span, curve:curve, S:S, heavyN:heavyN,
    seedMin:mkList, glass:!!T.glass,
    grainPx: S ? Math.sqrt(W*H*area/Math.max(1,S-heavyN)) * 0.5 : W

      var c0 = m.col || MIN[m.k].col;
      fineC[0] += c0[0]*m.pct; fineC[1] += c0[1]*m.pct; fineC[2] += c0[2]*m.pct; tp += m.pct;

  }

  if (S === 0){
    out.crysT = null;
    out.own = null;
  } else {
    var sX = new Float32Array(S), sY = new Float32Array(S), sCos = new Float32Array(S), sSin = new Float32Array(S);
    var sAx = new Float32Array(S), sWt = new Float32Array(S), sTh = new Float32Array(S);
    var sR = new Float32Array(S), sG = new Float32Array(S), sB = new Float32Array(S);
    var xR = new Float32Array(S), xG = new Float32Array(S), xB = new Float32Array(S);
    var xE = new Float32Array(S), xE2 = new Float32Array(S);
    for (i=0;i<S;i++){
      var mk = mkList[i], M = MIN[mk];
      sX[i] = (rand()*span - pad) * W;
      sY[i] = (rand()*span - pad) * H;
      var th = rand() * Math.PI;
      sTh[i] = th; sCos[i] = Math.cos(th); sSin[i] = Math.sin(th);
      sAx[i] = Math.max(1, Math.min(AR_CAP, M.ar + (rand()-0.5)*0.45));
      sWt[i] = wtList[i];
      var nz = (rand()-0.5) * 26, bc = colList[i];
      var br = bc[0] + nz, bg = bc[1] + nz, bb = bc[2] + nz;
      if (fineK > 0){
        br = br*(1-fineK) + fineC[0]*fineK;
        bg = bg*(1-fineK) + fineC[1]*fineK;
        bb = bb*(1-fineK) + fineC[2]*fineK;
      }
      sR[i] = cl(br); sG[i] = cl(bg); sB[i] = cl(bb);
      /* One physical parameter — how favourably this grain happens to be cut
         through the crystal — sets both the interference colour and the
         ceiling on its brightness. A poorly cut grain is low-order AND dark;
         the two are not independent. Extinction position then scales it. */
      var cut = 0.18 + 0.82 * Math.sqrt(rand());
      var xc = michelLevy(M.bi * 30000 * cut);
      if (M.mask){
        xc = [xc[0] + (M.body[0]-xc[0])*M.mask,
              xc[1] + (M.body[1]-xc[1])*M.mask,
              xc[2] + (M.body[2]-xc[2])*M.mask];
      }
      xR[i] = xc[0]; xG[i] = xc[1]; xB[i] = xc[2];
      var phi = th + (M.ea || 0) + (rand()-0.5)*0.35;

      xE2[i] = extAt(phi + 0.36);   /* the other set of twin lamellae */
    }

    var wMaxL = 0;

    var own = V.own, d1 = V.d1, d2 = V.d2, de = V.de;

    var maxDe = new Float32Array(S);

    for (i=0;i<S;i++) if (maxDe[i] <= 0) maxDe[i] = 1;

       groundmass grain is not drawn with the same stripes as a 3 cm
       pegmatite crystal */
    var bwid = new Float32Array(S);
    for (i=0;i<S;i++) bwid[i] = Math.max(1.7, maxDe[i] * 0.155);
    var K = 2.4 * out.grainPx;

    for (i=0;i<NPX;i++){
      var s = own[i], np = nucList[s];
      var nrm = de[i] / maxDe[s]; if (nrm > 1) nrm = 1;
      /* radius grows fast on nucleation and slows as the melt is used up */
      var ct = np + (dunList[s] - np) * Math.pow(nrm, 1.25);
      crysT[i] = ct > 1 ? 1 : ct;

      var gap = d2[i] - d1[i];
      var bs = gap < K ? (1 - gap/K) : 0;
      var f = 1 - 0.50 * bs * bs;

      var px = i % W, py = (i / W) | 0;
      var dx = px - sX[s], dy = py - sY[s];

    if (r.on){ c.fillStyle = COL.accent; c.fillRect(px + bw + lw - 3, ry + 3, 3, rh - 6); }

/* ═══════════════════════════════ CARD ══════════════════════════════ */
function cardModel(){

  it.push({kind:'row', l:'Crystal size', v:grainText(S.tex), u:T.glass ? '' : 'mm', s2:REG[S.tex][0].toLowerCase() + ' · ' + COOL[S.tex], s2hot:true});
  var cu = C.dens.toFixed(1) + ' g/cm³ · ' + colourIndex(S.comp) + '% dark';

var lastCard = '';
function renderCard(){

}

  if (card.scrollHeight > card.clientHeight + 1) card.classList.add('tight2');
}

/* specimen shelf — finished runs, for comparison */
var shelf = [];
function addSpecimen(){

  var t = document.createElement('canvas'); t.width = t.height = 88; var tc = t.getContext('2d');
  tc.beginPath(); tc.arc(44, 44, 44, 0, 6.2832); tc.clip(); tc.drawImage(colorize(field(), 1, S.light), 0, 0, 88, 88);

/* ═══════════════════════════════ CONTROLS ══════════════════════════ */

function renderChips(){
  var R = $('chipsR'), h = '<div class="cc-segmented">' + ZOOM.map(function(z, i){ return '<button class="cc-segmented-btn' + (i === S.zoom ? ' is-active' : '') + '" data-zoom="' + i + '" title="' + z.n + '">' + fmtMm(z.mm) + '</button>'; }).join('') + '</div>';
  h += '<div class="cc-segmented"><button class="cc-segmented-btn' + (S.light === 'ppl' ? ' is-active' : '') + '" data-light="ppl">Plane light</button><button class="cc-segmented-btn' + (S.light === 'xpl' ? ' is-active' : '') + '" data-light="xpl">Crossed polars</button></div>';

/* ═══════════════════════════════ PLAY ══════════════════════════════ */
function stopTween(){ S.tween = null; }
function play(){

}
function stepTween(now){

  refresh(false);
  requestAnimationFrame(stepTween);
}

/* ═══════════════════════════════ ACTIONS ═══════════════════════════ */
function select(ti, ci){
  if (!ROCK[ti][ci]) return;
  stopTween(); S.tex = ti; S.comp = ci;

  S.played = false; loadField();
}
var loadTok = 0;
function loadField(){
  var tk = ++loadTok;

  $('stage').classList.add('busy');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ if (tk !== loadTok) return; field(); $('stage').classList.remove('busy'); refresh(true); }); });
}

/* ═══════════════════════════════ CANVAS ════════════════════════════ */
var stageEl = $('stage'), cv = $('cv'), ctx = cv.getContext('2d'), ov = $('ov'), octx = ov.getContext('2d');
var CW = 0, CH = 0, DPR = 1;
function resize(){
  var r = stageEl.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = Math.max(200, Math.round(r.width)); CH = Math.max(200, Math.round(r.height));
  cv.width = ov.width = Math.round(CW*DPR); cv.height = ov.height = Math.round(CH*DPR);
  chartBuilt = ''; renderChart(); draw();
}
function draw(){
  if (capturing || !CW) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  renderScene(ctx, CW, CH, {pr:DPR});
  clearHover();
}
function refresh(full){
  if (full){ renderControls(); renderChips(); } else syncControls();
  renderChart(); renderCard(); draw();
}

/* hover */
var tip = $('tip'), hoverSeed = -1;
function clearHover(){ hoverSeed = -1; tip.classList.remove('on'); octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, ov.width, ov.height); }
cv.addEventListener('mousemove', function(e){
  if (!GEOM || S.tween) return clearHover();
  var r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, G = GEOM, F = G.F, R = F.R;
  var dx = mx - (G.x + G.D/2), dy = my - (G.y + G.D/2); if (dx*dx + dy*dy > G.D*G.D/4) return clearHover();
  var x = clamp(((mx - G.x)/G.D*R) | 0, 0, R - 1), y = clamp(((my - G.y)/G.D*R) | 0, 0, R - 1), i = y*R + x, name, meta, dot;
  if (F.ves && F.ves.t[i] <= S.p){ name = 'Gas cavity'; meta = 'vesicle'; dot = '#15130F'; if (hoverSeed !== -2){ hoverSeed = -2; octx.clearRect(0, 0, ov.width, ov.height); } }
  else if (!F.crysT || F.crysT[i] > S.p){
    var Tc = F.curve.at(S.p); name = F.glass && S.p > 0.75 ? 'Volcanic glass' : 'Melt'; meta = F.glass && S.p > 0.75 ? 'no crystal structure' : Math.round(Tc) + ' °C · not yet crystallized';

        var edge = (xx === 0 || own[j-1] !== s) || (xx === R-1 || own[j+1] !== s) || (yy === 0 || own[j-R] !== s) || (yy === R-1 || own[j+R] !== s);
        var o4 = j*4; dd[o4] = 255; dd[o4+1] = 252; dd[o4+2] = 235; dd[o4+3] = edge ? 220 : 30; }

/* ═══════════════════════════════ EXPORT HOOKS ══════════════════════ */

var FOOT = 'Mineral percentages: ESSRT p. 14 Mineral Composition of Igneous Rocks · crystallization order: ESSRT p. 14 Bowen’s Reaction Series · temperatures approximate';
function compose(c, sc, fi){

  c.font = '700 26px ' + FD; c.fillStyle = COL.t1; c.fillText('Igneous Crystallization', 18, 30);
  c.font = '500 14px ' + FM; c.fillStyle = COL.t2; c.fillText(stampText(), 18, 56);
  c.textAlign = 'right'; c.font = '700 14px ' + FM; c.fillStyle = COL.accent; c.fillText('contextclimate.io', EW - 18, 30);
  var y0 = 74, h = EH - y0 - 34, chW = 360, cdW = 256, sw = EW - 32 - chW - cdW - 24, sx = 16 + chW + 12;

function afterExport(){ refresh(true); }

/* ═══════════════════════════════ INIT ══════════════════════════════ */
var LEGACY = { slow:'phaneritic', fast:'aphanitic', glassy:'glassy', porphyritic:'porphyritic' };
(function init(){
  var ser = $('series'), a = mk('a', 'cc-btn x-link', '<span class="nm">Bowen’s Reaction Series</span> &rarr;');
  a.href = routeHref(ROUTE_NEXT); a.target = '_top'; a.title = 'Bowen’s Reaction Series'; ser.appendChild(a);

})();
