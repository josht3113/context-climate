<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Inverse Square Law — ContextClimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #090b12;
      color: #f0eee9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px 72px;
    }

    /* ── Back link ── */
    .back-link {
      align-self: flex-start;
      margin-top: 18px;
      padding: 5px 12px 5px 8px;
      border-radius: 100px;
      background: rgba(58,175,169,0.07);
      border: 1px solid rgba(58,175,169,0.2);
      color: #3AAFA9;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }
    .back-link:hover { background: rgba(58,175,169,0.14); }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 22px 0 18px;
      max-width: 560px;
      width: 100%;
    }

    .eyebrow {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #3AAFA9;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(32px, 6.5vw, 48px);
      font-weight: 800;
      line-height: 1;
      color: #f0eee9;
      letter-spacing: -0.02em;
      white-space: nowrap;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #555a74;
      letter-spacing: 0.01em;
    }

    /* ── Canvas block (canvas + ratio strip as one unit) ── */
    .canvas-block {
      width: 100%;
      max-width: 560px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      overflow: hidden;
    }

    #isl-canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #090b12;
    }

    /* ── Ratio strip ── */
    .ratio-strip {
      display: flex;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .ratio-item {
      flex: 1;
      text-align: center;
      padding: 13px 8px 15px;
    }
    .ratio-item + .ratio-item {
      border-left: 1px solid rgba(255,255,255,0.07);
    }

    .ratio-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 19px;
      font-weight: 600;
      display: block;
      line-height: 1;
      margin-bottom: 6px;
      transition: color 0.4s ease;
    }

    .ratio-dist {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #343748;
    }

    /* ── Toggle ── */
    .toggle-section {
      width: 100%;
      max-width: 560px;
      margin-top: 28px;
      text-align: center;
    }

    .toggle-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #343748;
      margin-bottom: 12px;
    }

    .toggle-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .app-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 9px 22px;
      border-radius: 100px;
      border: 1.5px solid rgba(255,255,255,0.1);
      background: transparent;
      color: rgba(240,238,233,0.32);
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s, background-color 0.3s;
    }
    .app-btn:hover {
      border-color: rgba(255,255,255,0.2);
      color: rgba(240,238,233,0.6);
    }

    /* ── App card ── */
    .app-card {
      width: 100%;
      max-width: 560px;
      margin-top: 14px;
      background: #111321;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      overflow: hidden;
    }

    .card-accent-bar {
      height: 2px;
      transition: background 0.4s ease;
    }

    .card-body {
      padding: 22px 26px 26px;
    }

    .card-inner {
      transition: opacity 0.15s ease;
    }
    .card-inner.fading { opacity: 0; }

    .card-source-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #343748;
      margin-bottom: 4px;
    }

    .card-source-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 26px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 5px;
    }

    .card-spreading {
      font-size: 12px;
      color: #3d415a;
      font-style: italic;
      margin-bottom: 18px;
    }

    .card-callout {
      font-size: 14px;
      color: #72778e;
      line-height: 1.75;
      padding: 14px 16px;
      background: rgba(255,255,255,0.025);
      border-radius: 8px;
      border-left: 2px solid;
      transition: border-color 0.4s ease;
    }

    /* ── Geometry note ── */
    .geo-note {
      margin-top: 20px;
      font-size: 12px;
      color: #2e3247;
      text-align: center;
      font-style: italic;
      max-width: 480px;
      line-height: 1.65;
    }

    @media (max-width: 440px) {
      .app-btn { padding: 8px 15px; font-size: 13px; }
      .card-body { padding: 18px 18px 22px; }
      .ratio-value { font-size: 16px; }
    }
  </style>
</head>
<body>

  <a class="back-link" href="/earthandspace">← Earth &amp; Space</a>

  <header>
    <p class="eyebrow">A Law of Nature</p>
    <h1>The Inverse Square Law</h1>
    <p class="subtitle">Applications in Earth and Space Science.</p>
  </header>

  <div class="canvas-block">
    <canvas id="isl-canvas" width="560" height="580"></canvas>
    <div class="ratio-strip">
      <div class="ratio-item">
        <span class="ratio-value" id="rv1">1×</span>
        <span class="ratio-dist">at r</span>
      </div>
      <div class="ratio-item">
        <span class="ratio-value" id="rv2">1/4×</span>
        <span class="ratio-dist">at 2r</span>
      </div>
      <div class="ratio-item">
        <span class="ratio-value" id="rv3">1/9×</span>
        <span class="ratio-dist">at 3r</span>
      </div>
    </div>
  </div>

  <div class="toggle-section">
    <p class="toggle-label">Now see it as</p>
    <div class="toggle-group">
      <button class="app-btn" data-app="gravity">Gravity</button>
      <button class="app-btn" data-app="solar">Solar Irradiance</button>
      <button class="app-btn" data-app="starlight">Starlight</button>
    </div>
  </div>

  <div class="app-card">
    <div class="card-accent-bar" id="accentBar"></div>
    <div class="card-body">
      <div class="card-inner" id="cardInner"></div>
    </div>
  </div>

  <p class="geo-note">This is a 2D cross-section. In 3D, distance spreads in two angular directions — so area grows as r² and intensity falls as exactly 1/r².</p>

  <script>
    // ── Application data ──────────────────────────────────────────────────────────

    const APPS = {
      gravity: {
        color: '#8B9BF5',
        rgb:   [139, 155, 245],
        name:  'A Massive Body',
        spreading: 'gravitational field lines radiate spherically outward in all directions',
        callout: 'Jupiter sits 5.2× farther from the Sun than Earth. The Sun\'s gravitational pull on Jupiter is 27× weaker — not approximately, but by exactly the square of the distance ratio (5.2² ≈ 27). The same geometry that fills this diagram shapes every orbit in the Solar System.'
      },
      solar: {
        color: '#F5A340',
        rgb:   [245, 163, 64],
        name:  'The Sun',
        spreading: 'radiant energy (watts per square meter) spreads over an expanding sphere',
        callout: 'Mars sits 1.52× farther from the Sun than Earth and receives just 43% of Earth\'s solar irradiance — exactly 1/1.52², the inverse square. Small shifts in Earth\'s orbital distance, driven by Milankovitch cycles over thousands of years, alter global insolation through this same law.'
      },
      starlight: {
        color: '#9EC8F5',
        rgb:   [158, 200, 245],
        name:  'A Distant Star',
        spreading: 'photons radiate outward in all directions from the stellar surface',
        callout: 'Two stars with identical luminosity — one twice as far away — the distant star appears only ¼ as bright. This gap between a star\'s true power (luminosity) and how we perceive it (apparent magnitude) is exactly what the H-R Diagram is built to separate.'
      }
    };

    // ── Canvas setup ──────────────────────────────────────────────────────────────

    const canvas = document.getElementById('isl-canvas');
    const ctx    = canvas.getContext('2d');
    const CW     = canvas.width;   // 560
    const CH     = canvas.height;  // 580
    const cx     = CW / 2;         // 280
    const cy     = CH / 2;         // 290

    // Ring radii
    const r1 = 82, r2 = 164, r3 = 246;

    // Wedge: pointing upper-right at -45°
    const WM      = -Math.PI / 4;
    const WS      = Math.PI / 5;        // 36° total
    const W_START = WM - WS / 2;
    const W_END   = WM + WS / 2;

    // Distance label angle: lower-left at ~135°
    const DLA = (3 * Math.PI) / 4 + 0.06;

    let currentApp = 'gravity';

    // ── Drawing ───────────────────────────────────────────────────────────────────

    function draw(ts) {
      const app       = APPS[currentApp];
      const [rC,gC,bC] = app.rgb;

      ctx.clearRect(0, 0, CW, CH);

      // Background: very dark with subtle color bleed from center
      const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, r3 * 1.8);
      bg.addColorStop(0,    `rgba(${rC},${gC},${bC},0.09)`);
      bg.addColorStop(0.35, '#101320');
      bg.addColorStop(1,    '#07090f');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, CW, CH);

      // Background rays — full 360°, very faint
      for (let i = 0; i < 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * r3 * 1.05, cy + Math.sin(a) * r3 * 1.05);
        ctx.strokeStyle = `rgba(${rC},${gC},${bC},0.028)`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }

      // Ring circles
      [r1, r2, r3].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,255,255,0.055)';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      // ── Wedge sector fills (three bands, decreasing brightness) ──

      // Band 1: center → r1
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r1, W_START, W_END);
      ctx.closePath();
      ctx.fillStyle = `rgba(${rC},${gC},${bC},0.27)`;
      ctx.fill();

      // Band 2: r1 → r2
      ctx.beginPath();
      ctx.arc(cx, cy, r2, W_START, W_END);
      ctx.arc(cx, cy, r1, W_END, W_START, true);
      ctx.closePath();
      ctx.fillStyle = `rgba(${rC},${gC},${bC},0.085)`;
      ctx.fill();

      // Band 3: r2 → r3
      ctx.beginPath();
      ctx.arc(cx, cy, r3, W_START, W_END);
      ctx.arc(cx, cy, r2, W_END, W_START, true);
      ctx.closePath();
      ctx.fillStyle = `rgba(${rC},${gC},${bC},0.032)`;
      ctx.fill();

      // Wedge boundary rays
      for (let i = 0; i <= 5; i++) {
        const a = W_START + (i / 5) * WS;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(a) * r3, cy + Math.sin(a) * r3);
        ctx.strokeStyle = `rgba(${rC},${gC},${bC},0.26)`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // ── Highlighted arc segments within wedge ──
      const arcDef = [
        { r: r1, core: 0.95, glow: 0.22, cw: 4.0, gw: 14 },
        { r: r2, core: 0.46, glow: 0.10, cw: 2.5, gw: 9  },
        { r: r3, core: 0.19, glow: 0.04, cw: 1.8, gw: 6  },
      ];

      arcDef.forEach(({ r, core, glow, cw, gw }) => {
        // Outer glow
        ctx.beginPath();
        ctx.arc(cx, cy, r, W_START, W_END);
        ctx.strokeStyle = `rgba(${rC},${gC},${bC},${glow})`;
        ctx.lineWidth = gw;
        ctx.stroke();
        // Core arc
        ctx.beginPath();
        ctx.arc(cx, cy, r, W_START, W_END);
        ctx.strokeStyle = `rgba(${rC},${gC},${bC},${core})`;
        ctx.lineWidth = cw;
        ctx.stroke();
      });

      // ── Energy particles: same 7 on each ring, spreading outward ──
      // At r2 they're 2× more spread out; at r3, 3× — same energy, more area
      // Opacity follows 1/r² to show intensity drop
      const N         = 7;
      const pOpacity  = [0.88, 0.34, 0.15];
      const pRadius   = [3.5,  3.0,  2.4 ];

      [r1, r2, r3].forEach((r, ri) => {
        const op = pOpacity[ri];
        const pr = pRadius[ri];

        for (let i = 0; i < N; i++) {
          const a  = W_START + (i / (N - 1)) * WS;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r;

          // Glow halo
          const gr = ctx.createRadialGradient(px, py, 0, px, py, pr * 4);
          gr.addColorStop(0, `rgba(${rC},${gC},${bC},${op * 0.45})`);
          gr.addColorStop(1, `rgba(${rC},${gC},${bC},0)`);
          ctx.beginPath();
          ctx.arc(px, py, pr * 4, 0, Math.PI * 2);
          ctx.fillStyle = gr;
          ctx.fill();

          // Colored dot
          ctx.beginPath();
          ctx.arc(px, py, pr, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${rC},${gC},${bC},${op})`;
          ctx.fill();

          // White-hot center
          ctx.beginPath();
          ctx.arc(px, py, pr * 0.38, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${op * 0.78})`;
          ctx.fill();
        }
      });

      // ── Source point ──
      const pulse = 0.5 + 0.5 * Math.sin(ts * 0.0018);
      const sr    = 7.5 + pulse * 2.5;

      // Large ambient glow
      const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, sr * 7);
      sg.addColorStop(0,    `rgba(${rC},${gC},${bC},0.7)`);
      sg.addColorStop(0.18, `rgba(${rC},${gC},${bC},0.22)`);
      sg.addColorStop(0.45, `rgba(${rC},${gC},${bC},0.05)`);
      sg.addColorStop(1,    `rgba(${rC},${gC},${bC},0)`);
      ctx.beginPath();
      ctx.arc(cx, cy, sr * 7, 0, Math.PI * 2);
      ctx.fillStyle = sg;
      ctx.fill();

      // Core dot
      ctx.beginPath();
      ctx.arc(cx, cy, sr, 0, Math.PI * 2);
      ctx.fillStyle = app.color;
      ctx.fill();

      // White-hot center
      ctx.beginPath();
      ctx.arc(cx, cy, sr * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.fill();

      // "source" label below the dot
      ctx.font      = '500 12px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillStyle = `rgba(${rC},${gC},${bC},0.60)`;
      ctx.fillText('source', cx, cy + sr * 2.4);

      // ── Distance labels — lower-left, just outside each ring ──
      ctx.font = '600 14px "JetBrains Mono", monospace';
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ['r', '2r', '3r'].forEach((lbl, i) => {
        const rd = [r1, r2, r3][i];
        ctx.fillStyle = 'rgba(255,255,255,0.36)';
        ctx.fillText(lbl,
          cx + Math.cos(DLA) * (rd + 24),
          cy + Math.sin(DLA) * (rd + 24)
        );
      });

      // ── Intensity labels — upper-right, just outside each ring along wedge ──
      const iLabels  = ['1×', '1/4×', '1/9×'];
      const iOpacity = [0.92, 0.62, 0.36];
      const iFontSz  = [19,   15,    13   ];

      iLabels.forEach((lbl, i) => {
        const rd = [r1, r2, r3][i];
        const ox = cx + Math.cos(WM) * (rd + 26);
        const oy = cy + Math.sin(WM) * (rd + 26);
        ctx.font         = `600 ${iFontSz[i]}px "JetBrains Mono", monospace`;
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle    = `rgba(${rC},${gC},${bC},${iOpacity[i]})`;
        ctx.fillText(lbl, ox, oy);
      });
    }

    // ── Animation loop ────────────────────────────────────────────────────────────

    function tick(ts) {
      draw(ts);
      requestAnimationFrame(tick);
    }

    // ── UI ────────────────────────────────────────────────────────────────────────

    function setApp(key) {
      currentApp = key;
      const app        = APPS[key];
      const [rC,gC,bC] = app.rgb;
      const c          = app.color;

      // Ratio strip
      const stripOps = [1.0, 0.58, 0.30];
      ['rv1','rv2','rv3'].forEach((id, i) => {
        document.getElementById(id).style.color = `rgba(${rC},${gC},${bC},${stripOps[i]})`;
      });

      // Buttons
      document.querySelectorAll('.app-btn').forEach(btn => {
        const on = btn.dataset.app === key;
        btn.style.borderColor    = on ? c : '';
        btn.style.backgroundColor = on ? `${c}1c` : '';
        btn.style.color           = on ? c : '';
      });

      // Accent bar
      document.getElementById('accentBar').style.background = c;

      // Card: fade out → update content → fade in
      const inner = document.getElementById('cardInner');
      inner.classList.add('fading');
      setTimeout(() => {
        inner.innerHTML = `
          <p class="card-source-label">Source</p>
          <p class="card-source-name" style="color:${c}">${app.name}</p>
          <p class="card-spreading">${app.spreading}</p>
          <p class="card-callout" style="border-left-color:${c}">${app.callout}</p>
        `;
        inner.classList.remove('fading');
      }, 175);
    }

    document.querySelectorAll('.app-btn').forEach(btn => {
      btn.addEventListener('click', () => setApp(btn.dataset.app));
    });

    // Init
    setApp('gravity');
    requestAnimationFrame(tick);
  </script>

</body>
</html>
