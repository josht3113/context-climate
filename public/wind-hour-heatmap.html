<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Climatology Charts &middot; ContextClimate</title>
  <link rel="stylesheet" href="core-sample-tools.css">
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    :root {
      --tool-accent: var(--accent-hourly);
      --tool-accent-tint: rgba(109,150,216,0.12);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { padding: 26px 20px 56px; }
    .app { max-width: 1000px; margin: 0 auto; }
    [hidden] { display: none !important; }

    header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--color-border); }
    header .cc-title { margin: 4px 0 6px; }
    header .cc-subtitle { margin: 0; }

    /* ── Top controls ─────────────────────────────────────────── */
    .top-controls { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
    .ctrl-g { display: flex; flex-direction: column; gap: 6px; }
    .ctrl-lbl { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-secondary); }
    .top-controls .cc-select { min-width: 220px; font-size: 16px; }
    .top-controls .tabs-g { flex: 1; min-width: 300px; }
    .cc-tab-bar .cc-tab { flex: 1; text-align: center; font-size: 16px; padding: 9px 18px; }
    .cc-segmented-btn { font-size: 14px; }

    /* ── Diurnal controls ─────────────────────────────────────── */
    .ctrl-row { display: flex; gap: 14px 22px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
    .field-seg { max-width: 100%; overflow-x: auto; }
    .field-seg .cc-segmented-btn { padding: 9px 15px; }
    .cc-btn { font-size: 15px; }
    .cc-btn.on { background: var(--color-surface-2); border-color: var(--tool-accent); color: var(--color-text-primary); font-weight: 600; }

    /* ── Cards / canvases ─────────────────────────────────────── */
    .chart-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 20px 18px 16px; margin-bottom: 12px; }
    .chart-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; text-align: center; color: var(--color-text-primary); line-height: 1.2; margin: 0 0 2px; }
    .chart-city { font-family: var(--font-display); font-size: 30px; font-weight: 700; text-align: center; color: var(--color-text-primary); line-height: 1.15; margin-bottom: 4px; }
    .chart-subtitle { font-family: var(--font-mono); font-size: 14px; text-align: center; color: var(--color-text-secondary); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 18px; }
    .canvas-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .canvas-scroll canvas { display: block; }
    .data-note { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); text-align: center; margin-top: 14px; letter-spacing: .04em; }

    /* ── Legends ──────────────────────────────────────────────── */
    .legend-row { display: flex; justify-content: center; align-items: center; gap: 18px 34px; flex-wrap: wrap; margin-top: 16px; }
    .grad-legend { display: flex; flex-direction: column; gap: 4px; min-width: 300px; max-width: 460px; flex: 1; }
    .grad-legend .lg-title { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); text-align: center; }
    .grad-bar { height: 14px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); background-origin: border-box; background-repeat: no-repeat; }
    .grad-ticks { position: relative; height: 18px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
    .grad-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
    .arrow-key, .stdy-key { display: flex; align-items: center; gap: 12px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
    .arrow-key .lg-title, .stdy-key .lg-title { letter-spacing: .08em; text-transform: uppercase; }
    .arrow-key svg, .stdy-key svg { display: block; }
    .compass-legend { display: flex; align-items: center; gap: 14px; }
    .compass-legend svg { display: block; cursor: pointer; }
    .compass-legend .sector { transition: opacity .15s; }
    .compass-legend .cl-side { display: flex; flex-direction: column; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
    .compass-legend .cl-sel { font-size: 15px; color: var(--color-text-primary); }

    /* ── Actions ──────────────────────────────────────────────── */
    .action-bar { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .export-btn.busy { opacity: .6; pointer-events: none; }
    .export-btn.success { color: #8FD4B5 !important; border-color: #2E6B55 !important; }

    /* ── State screens ────────────────────────────────────────── */
    .state-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 380px; gap: 12px; text-align: center; }
    .spinner { width: 30px; height: 30px; border: 3px solid var(--color-surface-2); border-top-color: var(--tool-accent); border-radius: 50%; animation: spin .75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-label { font-family: var(--font-mono); font-size: 15px; letter-spacing: .12em; color: var(--color-text-secondary); text-transform: uppercase; }
    .state-sublabel { font-family: var(--font-mono); font-size: 14px; letter-spacing: .04em; color: var(--color-text-muted); }
    .state-label.err { color: #E07A6A; }

    /* ── Tooltip ──────────────────────────────────────────────── */
    #tip { position: fixed; display: none; pointer-events: none; z-index: 9999; background: #2C322D; border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); padding: 10px 14px; min-width: 200px; box-shadow: 0 6px 22px rgba(0,0,0,.5); }
    .tip-h { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--color-text-secondary); text-transform: uppercase; margin-bottom: 4px; }
    .tip-v { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--color-text-primary); line-height: 1.1; margin-bottom: 6px; }
    .tip-v small { font-family: var(--font-mono); font-size: 14px; font-weight: 400; color: var(--color-text-secondary); margin-left: 4px; }
    .tip-r { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); line-height: 1.55; display: flex; justify-content: space-between; gap: 16px; }
    .tip-r b { color: var(--color-text-primary); font-weight: 700; }
    .tip-hr { border: none; border-top: 1px solid var(--color-border); margin: 6px 0; }
    .pos { color: #E8939A !important; }
    .neg { color: #8EC1E0 !important; }

    /* ── Tab 2 ────────────────────────────────────────────────── */
    .station-heading { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--color-text-primary); line-height: 1.15; }
    .meta-bar { display: flex; gap: 8px; margin: 2px 0 14px; font-family: var(--font-mono); font-size: 15px; color: var(--color-text-secondary); flex-wrap: wrap; }
    .meta-bar .sep { color: var(--color-text-muted); }
    .ctrl-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 14px; }
    .slider-yr { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--color-text-primary); margin-bottom: 4px; }
    .dual-slider { position: relative; height: 24px; display: flex; align-items: center; }
    .dual-slider .track-bg { position: absolute; left: 0; right: 0; height: 4px; border-radius: 2px; background: var(--color-surface-2); }
    .dual-slider .track-fill { position: absolute; height: 4px; border-radius: 2px; background: var(--tool-accent); pointer-events: none; }
    .dual-slider input[type=range] { position: absolute; width: 100%; appearance: none; -webkit-appearance: none; background: transparent; pointer-events: none; outline: none; height: 0; margin: 0; }
    .dual-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--tool-accent); border: 2px solid var(--color-text-primary); cursor: ew-resize; pointer-events: all; }
    .dual-slider input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--tool-accent); border: 2px solid var(--color-text-primary); cursor: ew-resize; pointer-events: all; }
    .phase-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .phase-pill { background: transparent; border: 1px solid var(--color-border); color: var(--color-text-secondary); font-family: var(--font-mono); font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all .15s; }
    .phase-pill .pd { width: 9px; height: 9px; border-radius: 50%; opacity: .5; }
    .phase-pill:hover { border-color: var(--color-border-hover); color: var(--color-text-primary); }
    .phase-pill.on .pd { opacity: 1; }
    .ctrl-card.decade-mode .phase-pill { opacity: .35; pointer-events: none; }
    .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-row .cc-btn-sm { font-size: 14px; padding: 6px 13px; }
    .cby-ind { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
    .plot-wrap { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 12px 14px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); margin-bottom: 10px; }
    .leg-item { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--color-text-secondary); cursor: pointer; padding: 4px 11px; border-radius: 20px; border: 1px solid transparent; user-select: none; }
    .leg-item:hover { border-color: var(--color-border); color: var(--color-text-primary); }
    .leg-item.iso { border-color: var(--tool-accent); background: var(--tool-accent-tint); color: var(--color-text-primary); }
    .leg-item.noclick { cursor: default; font-weight: 400; color: var(--color-text-muted); }
    .leg-item.noclick:hover { border-color: transparent; }
    .leg-dot { width: 10px; height: 10px; border-radius: 50%; }
    .leg-line { width: 20px; height: 3px; border-radius: 2px; }
    .leg-divider { width: 1px; background: var(--color-border); align-self: stretch; margin: 0 3px; }
    .stats-panel { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 10px; }
    .stats-table { width: 100%; border-collapse: collapse; }
    .stats-table th { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); text-align: center; padding: 10px 12px; background: var(--color-surface-2); border-bottom: 1px solid var(--color-border); }
    .stats-table td { font-family: var(--font-mono); font-size: 15px; color: var(--color-text-primary); padding: 7px 12px; border-bottom: 1px solid var(--color-border); text-align: center; }
    .stats-table th:first-child, .stats-table td:first-child { text-align: left; }
    .stats-table tr:last-child td { border-bottom: none; }
    .stats-table .ns { color: var(--color-text-muted); }
    .phase-cell { display: flex; align-items: center; gap: 8px; font-weight: 700; }
    .footnote { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); text-align: center; margin-top: 6px; }

    /* ── Export modal ─────────────────────────────────────────── */
    #exp-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.86); z-index: 9998; align-items: center; justify-content: center; }
    .modal-inner { background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: 10px; padding: 22px; max-width: 92vw; max-height: 92vh; display: flex; flex-direction: column; align-items: center; gap: 14px; overflow-y: auto; }
    #modal-loading { color: var(--color-text-secondary); font-family: var(--font-mono); font-size: 15px; padding: 40px 60px; }
    #modal-img { display: none; max-width: 100%; max-height: 62vh; border-radius: var(--radius-md); border: 1px solid var(--color-border); }
    .modal-actions { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .modal-hint { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin: 0; }
    #modal-toast { display: none; background: var(--tool-accent); color: var(--color-bg); font-family: var(--font-mono); font-size: 14px; font-weight: 700; padding: 7px 16px; border-radius: var(--radius-md); }

    @media (max-width: 640px) {
      .top-controls .ctrl-g, .top-controls .cc-select { width: 100%; }
      .top-controls .tabs-g { min-width: 100%; }
      .action-bar { flex-direction: column; }
      .action-bar .cc-btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <p class="cc-eyebrow">Hourly Data</p>
    <h1 class="cc-title">Wind Climatology Charts</h1>
    <p class="cc-subtitle">Diurnal patterns &amp; year-by-year trends &middot; <span id="station-count"></span> stations</p>
  </header>

  <div class="top-controls">
    <div class="ctrl-g">
      <div class="ctrl-lbl">Station</div>
      <select id="station-sel" class="cc-select"></select>
    </div>
    <div class="ctrl-g tabs-g">
      <div class="ctrl-lbl">View</div>
      <div class="cc-tab-bar">
        <button class="cc-tab on" data-tab="diurnal" onclick="switchTab('diurnal')">Diurnal Pattern</button>
        <button class="cc-tab" data-tab="monthly" onclick="switchTab('monthly')">Monthly Averages</button>
      </div>
    </div>
    <div class="ctrl-g">
      <div class="ctrl-lbl">Units</div>
      <div class="cc-segmented" id="unit-seg">
        <button class="cc-segmented-btn is-active" data-unit="mph" onclick="switchUnit('mph')">mph</button>
        <button class="cc-segmented-btn" data-unit="kt" onclick="switchUnit('kt')">kt</button>
      </div>
    </div>
  </div>

  <!-- ── TAB 1: DIURNAL PATTERN ─────────────────────────────── -->
  <div id="tab-diurnal">
    <div class="ctrl-row">
      <div class="ctrl-g">
        <div class="ctrl-lbl">Field</div>
        <div class="cc-segmented field-seg" id="field-seg"></div>
      </div>
      <div class="ctrl-g">
        <div class="ctrl-lbl">Overlay</div>
        <button class="cc-btn" id="btn-arrows" onclick="toggleArrows()">&#8599; Direction Arrows</button>
      </div>
    </div>

    <div class="state-wrap" id="d-state">
      <div class="spinner"></div>
      <div class="state-label">Loading wind climatology</div>
    </div>

    <div id="d-content" hidden>
      <div class="chart-card">
        <div class="chart-title" id="d-title"></div>
        <div class="chart-city" id="d-city"></div>
        <div class="chart-subtitle" id="d-sub"></div>
        <div class="canvas-scroll" id="d-scroll"><canvas id="d-canvas"></canvas></div>
        <div class="legend-row" id="d-legend"></div>
        <div class="data-note" id="d-note"></div>
      </div>
      <div class="action-bar">
        <button class="cc-btn primary export-btn" id="copy-btn" onclick="copyDiurnal()">Copy Image</button>
        <button class="cc-btn export-btn" id="download-btn" onclick="downloadDiurnal()">&#8595; Download PNG</button>
      </div>
    </div>
  </div>

  <!-- ── TAB 2: MONTHLY AVERAGES ────────────────────────────── -->
  <div id="tab-monthly" hidden>
    <div class="state-wrap" id="m-state">
      <div class="spinner"></div>
      <div class="state-label">Loading wind climatology</div>
    </div>

    <div id="m-content" hidden>
      <div class="station-heading" id="m-station-name"></div>
      <div class="meta-bar"><span id="m-meta-range"></span><span class="sep">&middot;</span><span id="m-meta-n"></span><span class="sep" id="m-asos-sep">&middot;</span><span id="m-meta-asos"></span></div>

      <div class="ctrl-card" id="m-ctrl-card">
        <div class="ctrl-row" style="margin:0">
          <div class="ctrl-g">
            <div class="ctrl-lbl">Chart</div>
            <div class="cc-segmented" id="view-seg">
              <button class="cc-segmented-btn is-active" data-view="scatter" onclick="setView2('scatter')">Scatter</button>
              <button class="cc-segmented-btn" data-view="grid" onclick="setView2('grid')">Year &times; Month</button>
            </div>
          </div>
          <div class="ctrl-g" id="grid-mode-g" hidden>
            <div class="ctrl-lbl">Color by</div>
            <div class="cc-segmented" id="gridmode-seg">
              <button class="cc-segmented-btn is-active" data-gm="anom" onclick="setGridMode('anom')">Anomaly</button>
              <button class="cc-segmented-btn" data-gm="spd" onclick="setGridMode('spd')">Speed</button>
            </div>
          </div>
        </div>
        <div class="ctrl-g">
          <div class="ctrl-lbl">Year Range</div>
          <div class="slider-yr"><span id="m-yr-lo"></span><span id="m-yr-hi"></span></div>
          <div class="dual-slider">
            <div class="track-bg"></div>
            <div class="track-fill" id="m-slider-fill"></div>
            <input type="range" id="m-rlo" aria-label="First year">
            <input type="range" id="m-rhi" aria-label="Last year">
          </div>
        </div>
        <div id="scatter-ctrls">
          <div class="ctrl-lbl" style="margin-bottom:8px">Isolate Month</div>
          <div class="phase-row" id="m-month-pills"></div>
        </div>
        <div class="btn-row" id="scatter-btns">
          <button class="cc-btn cc-btn-sm" id="btn-anomaly2" onclick="toggleAnomaly2()">Anomaly</button>
          <button class="cc-btn cc-btn-sm" id="btn-boxplot2" onclick="toggleBoxplot2()">Box Plot</button>
          <button class="cc-btn cc-btn-sm" id="btn-trend2" onclick="toggleTrend2()">Trend &nearr;</button>
          <button class="cc-btn cc-btn-sm" id="btn-decade2" onclick="toggleDecade2()">Decade Colors</button>
          <span class="cby-ind" id="m-cby-ind">Month</span>
          <button class="cc-btn cc-btn-sm" id="btn-summary2" onclick="toggleStats2()">Summary &and;</button>
          <button class="cc-btn cc-btn-sm" onclick="clearIso2()">&times; Clear</button>
          <button class="cc-btn cc-btn-sm" onclick="resetAll2()">&#8634; Reset</button>
          <button class="cc-btn cc-btn-sm export-btn" id="btn-export2" onclick="showExport2()">&#8599; Export PNG</button>
        </div>
        <div class="btn-row" id="grid-btns" hidden>
          <button class="cc-btn cc-btn-sm" onclick="resetGrid2()">&#8634; Reset Range</button>
          <button class="cc-btn cc-btn-sm export-btn" id="btn-gridcopy" onclick="copyGrid()">Copy Image</button>
          <button class="cc-btn cc-btn-sm export-btn" id="btn-griddl" onclick="downloadGrid()">&#8595; Download PNG</button>
        </div>
      </div>

      <div id="scatter-view">
        <div class="plot-wrap"><div id="plt-scatter"></div></div>
        <div class="legend" id="m-legend"></div>
        <div class="stats-panel" id="m-stats-panel" hidden><table class="stats-table" id="m-stats-table"></table></div>
        <div class="footnote" id="m-footnote"></div>
      </div>

      <div id="grid-view" hidden>
        <div class="chart-card">
          <div class="chart-title" id="g-title"></div>
          <div class="chart-city" id="g-city"></div>
          <div class="chart-subtitle" id="g-sub"></div>
          <div class="canvas-scroll" id="g-scroll"><canvas id="g-canvas"></canvas></div>
          <div class="legend-row" id="g-legend"></div>
          <div class="data-note" id="g-note"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="tip"></div>

<div id="exp-modal">
  <div class="modal-inner">
    <p id="modal-loading">Generating image&hellip;</p>
    <img id="modal-img" alt="Chart export">
    <div class="modal-actions" id="modal-actions">
      <button class="cc-btn primary" onclick="clipboardCopy2()">Copy to Clipboard</button>
      <button class="cc-btn" onclick="downloadImg2()">&#8595; Download PNG</button>
      <button class="cc-btn" onclick="closeModal2()">&times; Close</button>
    </div>
    <p class="modal-hint">4800 &times; 2700 px</p>
    <div id="modal-toast">&#10003; Copied to clipboard</div>
  </div>
</div>

<script>
// =============================================================================
// CONSTANTS
// =============================================================================
const MONTHS     = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LNG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTH_COLORS = ['#c374e8','#9b5ecf','#5899e8','#4fbd61','#d4c038','#e8a030','#e83838','#f07030','#e8a040','#68b860','#5898d8','#8878d0'];
const DECADE_MAP = {
  '1860s':'#3967EF','1870s':'#3948EF','1880s':'#4839EF','1890s':'#6739EF',
  '1900s':'#8539EF','1910s':'#A339EF','1920s':'#C239EF','1930s':'#E039EF',
  '1940s':'#EF39E0','1950s':'#EF39C2','1960s':'#EF39A3','1970s':'#EF3985',
  '1980s':'#EF3967','1990s':'#EF3948','2000s':'#EF4839','2010s':'#EF6739',
  '2020s':'#EF8539',
};
const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const DIR_HUES = [234,220,196,172,148,124,100,76,42,8,340,318,296,274,258,246];
const KT_PER_MPH = 1/1.15078;
const EXPORT_SCALE = 3;
const DATA_DIR = 'wind-climo/';

// Colour scales — `wind` is the heatmap suite's Wind Speed scale (mph)

function hexToRGB(h) { return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }

function hexToRgba(hex, a) { const c = hexToRGB(hex); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function scaleRGB(val, sc) {
  const { vals, cols } = sc;
  if (val <= vals[0]) return hexToRGB(cols[0]);
  if (val >= vals[vals.length-1]) return hexToRGB(cols[cols.length-1]);
  for (let i = 0; i < vals.length-1; i++) {
    if (val >= vals[i] && val <= vals[i+1]) {
      const t = (val-vals[i])/(vals[i+1]-vals[i]), a = hexToRGB(cols[i]), b = hexToRGB(cols[i+1]);
      return [0,1,2].map(k => Math.round(a[k]+t*(b[k]-a[k])));

}
function hslToRGB(h, s, l) {

function stdDevVal(arr) {

// Student t: two-sided p-value via the regularised incomplete beta function
function betacf(a, b, x) {
  const MAXIT = 200, EPS = 3e-12, FPMIN = 1e-300;
  let qab = a+b, qap = a+1, qam = a-1, c = 1, d = 1 - qab*x/qap;
  if (Math.abs(d) < FPMIN) d = FPMIN;
  d = 1/d; let h = d;
  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2*m;
    let aa = m*(b-m)*x/((qam+m2)*(a+m2));
    d = 1+aa*d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1+aa/c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1/d; h *= d*c;
    aa = -(a+m)*(qab+m)*x/((a+m2)*(qap+m2));
    d = 1+aa*d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1+aa/c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1/d; const del = d*c; h *= del;
    if (Math.abs(del-1) < EPS) break;
  }
  return h;
}
function lnGamma(z) {
  const g = [76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];
  let x = z, y = z, tmp = x+5.5; tmp -= (x+0.5)*Math.log(tmp);
  let ser = 1.000000000190015; for (let j = 0; j < 6; j++) ser += g[j]/++y;
  return -tmp + Math.log(2.5066282746310005*ser/x);
}
function betai(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lnGamma(a+b) - lnGamma(a) - lnGamma(b) + a*Math.log(x) + b*Math.log(1-x));
  return x < (a+1)/(a+b+2) ? bt*betacf(a, b, x)/a : 1 - bt*betacf(b, a, 1-x)/b;
}
function tTwoSidedP(t, df) { return betai(df/2, 0.5, df/(df + t*t)); }
// OLS slope with its two-sided p-value
function ols(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = mean(xs), my = mean(ys);
  let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i]-mx, dy = ys[i]-my; sxx += dx*dx; sxy += dx*dy; syy += dy*dy; }
  if (sxx <= 0) return null;
  const slope = sxy/sxx, sse = Math.max(0, syy - slope*sxy), df = n-2;
  const se = Math.sqrt(sse/df/sxx);
  const t = se > 0 ? slope/se : (slope === 0 ? 0 : Infinity);
  const p = isFinite(t) ? tTwoSidedP(t, df) : 0;
  return { slope, t, p, n };
}

(function populateDropdown() {

function setStates(html, show) {
  ['d-state','m-state'].forEach(id => { const el = document.getElementById(id); el.innerHTML = html; el.hidden = !show; });
  document.getElementById('d-content').hidden = show;
  document.getElementById('m-content').hidden = show;
}

async function loadStation(id) {
  STATION = id;
  const token = ++LOAD_TOKEN;
  DATA = null;
  hideTip();
  resetS2();
  DSTATE.dirFilter = null;
  setStates(`<div class="spinner"></div><div class="state-label">Loading wind climatology</div>
    <div class="state-sublabel">${STATION_NAME[id]}</div>`, true);
  try {
    const r = await fetch(DATA_DIR + id + '.json', { cache: 'no-cache' });
    if (r.status === 404) throw new Error('missing');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (token !== LOAD_TOKEN) return;
    prepareData(d);
    DATA = d;
    setStates('', false);
    renderActive();
  } catch (err) {
    if (token !== LOAD_TOKEN) return;
    if (err.message !== 'missing') console.error(err);
    const missing = err.message === 'missing';
    setStates(`<div class="state-label err">${missing ? 'No data file for this station yet' : 'Could not load data'}</div>
      <div class="state-sublabel">${STATION_NAME[id]}${missing ? '' : ' · ' + err.message}</div>
      ${missing ? '' : `<button class="cc-btn" onclick="loadStation('${id}')">Retry</button>`}`, true);
  }
}

// Derived values computed once per station load
function prepareData(d) {
  const D = d.diurnal;
  // Vector components of each cell's mean wind (mph): resultant = stdy × mean speed
  D.u = D.spd.map((row, m) => row.map((s, h) => (s == null || D.dir[m][h] == null || D.stdy[m][h] == null) ? null
      : -s*D.stdy[m][h]*Math.sin(D.dir[m][h]*Math.PI/180)));
  D.v = D.spd.map((row, m) => row.map((s, h) => (s == null || D.dir[m][h] == null || D.stdy[m][h] == null) ? null
      : -s*D.stdy[m][h]*Math.cos(D.dir[m][h]*Math.PI/180)));
  // Year-month points for Tab 2
  const M = d.monthly, pts = [];
  let minY = Infinity, maxY = -Infinity;
  M.spd.forEach((row, i) => row.forEach((v, m) => {
    if (v == null) return;
    const yr = M.y0 + i;
    const jitter = (((yr*37 + m*11) % 97)/97 - 0.5)*0.5;
    pts.push({ yr, mo: m, val_mph: v, x_pos: m + jitter, decade: decadeOf(yr), n: M.n[i][m] });
    if (yr < minY) minY = yr; if (yr > maxY) maxY = yr;
  }));
  // 1991–2020 monthly baseline for anomalies
  const [b0, b1] = d.normals;
  const base = MONTHS.map((_, m) => {
    const v = pts.filter(p => p.mo === m && p.yr >= b0 && p.yr <= b1).map(p => p.val_mph);
    return v.length >= 10 ? mean(v) : null;
  });
  pts.forEach(p => { p.anom_mph = base[p.mo] == null ? null : p.val_mph - base[p.mo]; });
  d._pts = pts; d._minYear = minY; d._maxYear = maxY; d._base = base;
}

const FONT_MONO = "'Courier Prime', monospace";

const C_TEXT = '#E8E4D9', C_TEXT2 = '#A6A499', C_MUTED = '#948F82', C_LINE = 'rgba(232,228,217,0.14)';

function setupCanvas(canvas, w, h) {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}
// Arrow pointing the way the air moves (wind FROM `dir`), length by steadiness
function drawArrow(ctx, cx, cy, dir, stdy, maxLen, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  if (stdy < 0.12) {
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, 2.6, 0, Math.PI*2); ctx.stroke();
    ctx.restore(); return;
  }
  const len = 5 + Math.min(1, stdy)*(maxLen - 5);
  const rad = (dir + 180)*Math.PI/180, dx = Math.sin(rad), dy = -Math.cos(rad);
  const x0 = cx - dx*len/2, y0 = cy - dy*len/2, x1 = cx + dx*len/2, y1 = cy + dy*len/2;
  const hl = Math.min(6, len*0.45), hw = hl*0.62;
  ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - dx*hl*0.6, y1 - dy*hl*0.6); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - dx*hl - dy*hw, y1 - dy*hl + dx*hw);
  ctx.lineTo(x1 - dx*hl + dy*hw, y1 - dy*hl - dx*hw);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), f = v/p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10)*p;
}

// Clipboard / download helpers shared by every canvas export
function canvasToBlob(c) { return new Promise(res => c.toBlob(res, 'image/png')); }
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function runExport(btnId, buildCanvas, filename, copy) {
  const btn = document.getElementById(btnId);
  if (!btn || btn.classList.contains('busy')) return;
  const label = btn.innerHTML;
  btn.classList.add('busy'); btn.textContent = 'Rendering…';
  try {
    const blob = await canvasToBlob(buildCanvas());
    let done = 'Downloaded';
    if (copy) {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); done = 'Copied'; }
      catch (_) { downloadBlob(blob, filename); done = 'Saved'; }
    } else downloadBlob(blob, filename);
    btn.classList.remove('busy'); btn.classList.add('success'); btn.textContent = '✓ ' + done;
    setTimeout(() => { btn.classList.remove('success'); btn.innerHTML = label; }, 2200);
  } catch (err) {
    console.error(err); btn.classList.remove('busy'); btn.innerHTML = label;
  }
}
// Export canvas: draws at a fixed EXPORT_SCALE, never the screen's devicePixelRatio
function makeExportCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.round(w*EXPORT_SCALE); c.height = Math.round(h*EXPORT_SCALE);
  const ctx = c.getContext('2d'); ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
  ctx.fillStyle = C_BG; ctx.fillRect(0, 0, w, h);
  return { c, ctx };
}
function exportHeader(ctx, w, kicker, title, sub, scale) {
  if (scale) {
    const g = ctx.createLinearGradient(0, 0, w, 0), lo = scale.vals[0], span = scale.vals[scale.vals.length-1] - lo;
    scale.vals.forEach((v, i) => g.addColorStop((v-lo)/span, scale.cols[i]));
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, 4);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C_TEXT2; ctx.font = `600 20px ${FONT_DISP}`; ctx.fillText(kicker, w/2, 40);
  ctx.fillStyle = C_TEXT;  ctx.font = `700 34px ${FONT_DISP}`; ctx.fillText(title, w/2, 78);
  ctx.fillStyle = C_TEXT2; ctx.font = `15px ${FONT_MONO}`; ctx.fillText(sub.toUpperCase(), w/2, 104);
}
function exportFooter(ctx, w, h, extra) {
  ctx.textAlign = 'center'; ctx.fillStyle = C_MUTED; ctx.font = `14px ${FONT_MONO}`;

}
// Horizontal gradient legend drawn on a canvas (exports)
function drawGradLegend(ctx, x, y, w, scale, title, ticks, fmt) {
  ctx.textAlign = 'center'; ctx.fillStyle = C_TEXT2; ctx.font = `14px ${FONT_MONO}`;
  ctx.fillText(title.toUpperCase(), x + w/2, y);
  const lo = scale.vals[0], span = scale.vals[scale.vals.length-1] - lo;
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  scale.vals.forEach((v, i) => g.addColorStop((v-lo)/span, scale.cols[i]));
  ctx.fillStyle = g; ctx.fillRect(x, y + 8, w, 14);
  ctx.strokeStyle = C_LINE; ctx.strokeRect(x + .5, y + 8.5, w - 1, 13);
  ctx.fillStyle = C_TEXT2; ctx.font = `14px ${FONT_MONO}`;
  ticks.forEach(t => ctx.fillText(fmt(t), x + (t.pos - lo)/span*w, y + 40));
}

  document.getElementById('btn-arrows').classList.toggle('on', DSTATE.arrows);
  renderDiurnal();
}

// ── Values ────────────────────────────────────────────────────────────────────
function cellVal(f, m, h) {
  const D = DATA.diurnal;
  return D[f] ? D[f][m][h] : null;
}
function fieldRGB(f, v, stdy) {
  if (f === 'dir') {
    const t = Math.max(0, Math.min(1, (stdy == null ? 0 : stdy)/0.6));
    return mixRGB(hexToRGB(C_SURF2), dirRGB(v), 0.22 + 0.78*t);
  }
  return scaleRGB(v, FIELDS[f].scale);
}
// Aggregate a set of [m,h] cells into one marginal value per field
function aggregate(cells) {
  const D = DATA.diurnal, out = {};
  const pick = k => cells.map(([m,h]) => D[k][m][h]).filter(v => v != null);
  out.spd = mean(pick('spd'));
  out.gust = mean(pick('gust'));
  out.calm = mean(pick('calm'));
  const vec = cells.filter(([m,h]) => D.u[m][h] != null);
  if (vec.length) {
    const u = mean(vec.map(([m,h]) => D.u[m][h])), v = mean(vec.map(([m,h]) => D.v[m][h]));
    const s = mean(vec.map(([m,h]) => D.spd[m][h]));
    out.stdy = s > 0 ? Math.hypot(u, v)/s : null;
    out.dir = (Math.atan2(-u, -v)*180/Math.PI + 360) % 360;
  } else { out.stdy = null; out.dir = null; }
  return out;
}
function margins() {
  const byHour = [], byMonth = [];
  for (let h = 0; h < 24; h++) byHour.push(aggregate(MONTHS.map((_, m) => [m, h])));
  for (let m = 0; m < 12; m++) byMonth.push(aggregate(Array.from({ length: 24 }, (_, h) => [m, h])));
  return { byHour, byMonth };
}
function margBarFrac(f, a, max) {
  if (f === 'dir') return a.stdy == null ? 0 : Math.min(1, a.stdy);
  const v = a[f]; if (v == null) return 0;
  return f === 'stdy' ? Math.min(1, v) : Math.min(1, v/max);
}
function margColor(f, a) {
  if (f === 'dir') return a.dir == null ? hexToRGB(C_SURF2) : fieldRGB('dir', a.dir, a.stdy);
  return a[f] == null ? hexToRGB(C_SURF2) : fieldRGB(f, a[f]);
}

// ── Layout ────────────────────────────────────────────────────────────────────
function diurnalLayout(W) {
  const L = 54, TOP = 32, RG = 18, RW = 146, ROW = 26, BG = 16, BH = 96;
  const gridW = W - L - RG - RW, colW = gridW/12, gridH = 24*ROW;
  return { W, L, TOP, RG, RW, ROW, BG, BH, colW, gridW, gridH,
           gx: L, gy: TOP, rx: L + gridW + RG, by: TOP + gridH + BG,
           H: TOP + gridH + BG + BH + 4 };
}

// ── Drawing (shared by screen and export) ─────────────────────────────────────
function drawDiurnal(ctx, lay, opt) {
  const f = DSTATE.field, D = DATA.diurnal, F = FIELDS[f];
  const { L, TOP, ROW, colW, gridW, gridH, rx, RW, by, BH } = lay;
  const mg = margins();

  // Month labels + marginal header
  ctx.textBaseline = 'alphabetic';
  ctx.font = `700 14px ${FONT_MONO}`; ctx.fillStyle = C_TEXT2; ctx.textAlign = 'center';
  MONTHS.forEach((mn, m) => ctx.fillText(mn, L + (m + 0.5)*colW, TOP - 11));
  ctx.textAlign = 'left'; ctx.fillStyle = C_MUTED; ctx.font = `13px ${FONT_MONO}`;
  ctx.fillText('ALL MONTHS', rx, TOP - 11);

  // Hour labels
  ctx.font = `13px ${FONT_MONO}`; ctx.fillStyle = C_TEXT2; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let h = 0; h < 24; h++) ctx.fillText(hourLabel(h), L - 9, TOP + (h + 0.5)*ROW);

  // Cells
  const filterOn = f === 'dir' && DSTATE.dirFilter != null;
  for (let m = 0; m < 12; m++) {
    for (let h = 0; h < 24; h++) {
      const x = L + m*colW, y = TOP + h*ROW, v = cellVal(f, m, h);
      if (v == null) {
        ctx.fillStyle = C_BG; ctx.fillRect(x + 0.5, y + 0.5, colW - 1, ROW - 1);
        ctx.fillStyle = C_MUTED; ctx.font = `12px ${FONT_MONO}`; ctx.textAlign = 'center';
        ctx.fillText('M', x + colW/2, y + ROW/2 + 1);
        continue;
      }
      const stdy = D.stdy[m][h];
      const rgb = fieldRGB(f, v, stdy);
      ctx.globalAlpha = filterOn && dirIndex(v) !== DSTATE.dirFilter ? 0.16 : 1;
      ctx.fillStyle = rgbStr(rgb); ctx.fillRect(x + 0.5, y + 0.5, colW - 1, ROW - 1);
      const ink = inkFor(rgb);
      ctx.fillStyle = ink;
      const arrowOK = DSTATE.arrows && D.dir[m][h] != null && stdy != null;
      if (arrowOK) {
        ctx.font = `700 12px ${FONT_MONO}`; ctx.textAlign = 'left'; ctx.fillText(F.text(v), x + 5, y + ROW/2 + 1);
        drawArrow(ctx, x + colW - 12, y + ROW/2, D.dir[m][h], stdy, ROW - 8, ink);
      } else {
        ctx.font = `700 13px ${FONT_MONO}`;
        ctx.textAlign = 'center'; ctx.fillText(F.text(v), x + colW/2, y + ROW/2 + 1);
      }
      ctx.globalAlpha = 1;
    }
  }

  // Bar scale shared by both marginals
  let max = 1;
  if (f === 'spd' || f === 'gust' || f === 'calm') {
    const all = mg.byHour.concat(mg.byMonth).map(a => a[f]).filter(v => v != null);
    max = Math.max(...all, 0.1)*1.04;
  }

  // Right marginal: one bar per hour row
  const barMax = RW - 62;
  for (let h = 0; h < 24; h++) {
    const a = mg.byHour[h], y = TOP + h*ROW, cy = y + ROW/2;
    const frac = margBarFrac(f, a, max), rgb = margColor(f, a);
    ctx.fillStyle = C_SURF2; ctx.fillRect(rx, y + 4, barMax, ROW - 8);
    if (frac > 0) { ctx.fillStyle = rgbStr(rgb); roundRect(ctx, rx, y + 4, Math.max(2, frac*barMax), ROW - 8, 2); ctx.fill(); }
    const val = f === 'dir' ? a.dir : a[f];
    let tx = rx + barMax + 7;
    if (DSTATE.arrows && a.dir != null && a.stdy != null) {
      drawArrow(ctx, tx + 8, cy, a.dir, a.stdy, ROW - 6, C_TEXT);
      tx += 20;
    }
    ctx.fillStyle = C_TEXT; ctx.font = `700 13px ${FONT_MONO}`; ctx.textAlign = 'left';
    ctx.fillText(val == null ? '—' : F.marg(val), tx, cy + 1);
  }

  // Bottom marginal: one bar per month column
  const bTop = by + 22, bBase = by + BH - 22, bMax = bBase - bTop;
  ctx.textAlign = 'right'; ctx.fillStyle = C_MUTED; ctx.font = `13px ${FONT_MONO}`;
  ctx.fillText('ALL', L - 9, bBase - bMax/2 - 7);
  ctx.fillText('HOURS', L - 9, bBase - bMax/2 + 9);
  for (let m = 0; m < 12; m++) {
    const a = mg.byMonth[m], x = L + m*colW, frac = margBarFrac(f, a, max), rgb = margColor(f, a);
    const bw = Math.min(colW - 14, 34), bx = x + (colW - bw)/2;
    ctx.fillStyle = C_SURF2; ctx.fillRect(bx, bTop, bw, bMax);
    if (frac > 0) { const bh = Math.max(2, frac*bMax); ctx.fillStyle = rgbStr(rgb); roundRect(ctx, bx, bBase - bh, bw, bh, 2); ctx.fill(); }
    const val = f === 'dir' ? a.dir : a[f];
    ctx.fillStyle = C_TEXT; ctx.font = `700 13px ${FONT_MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(val == null ? '—' : F.marg(val), x + colW/2, bTop - 7);
    if (DSTATE.arrows && a.dir != null && a.stdy != null) {
      drawArrow(ctx, x + colW/2, bBase + 12, a.dir, a.stdy, 18, C_TEXT);
    }
  }
  ctx.textBaseline = 'middle';

  // Hover outline
  const hv = opt && opt.hover;
  if (hv) {
    ctx.strokeStyle = C_TEXT; ctx.lineWidth = 2;
    if (hv.type === 'cell') ctx.strokeRect(L + hv.m*colW + 1, TOP + hv.h*ROW + 1, colW - 2, ROW - 2);
    else if (hv.type === 'hour') ctx.strokeRect(rx - 2, TOP + hv.h*ROW + 2, RW, ROW - 4);
    else if (hv.type === 'month') ctx.strokeRect(L + hv.m*colW + 2, by + 4, colW - 4, BH - 8);
  }
  ctx.textBaseline = 'alphabetic';
}

// ── Legends (DOM) ─────────────────────────────────────────────────────────────
function gradTicks(f) {
  if (f === 'spd') {
    const maxMph = SCALES.wind.vals[SCALES.wind.vals.length-1];
    const step = 5, maxDisp = toDisplay(maxMph), ticks = [];
    for (let t = 0; t <= maxDisp + 0.01; t += step) ticks.push({ label: String(t), pos: UNIT === 'kt' ? t/KT_PER_MPH : t });
    return ticks;
  }
  const sc = SCALES[f];
  return sc.vals.map(v => ({ label: f === 'stdy' ? v.toFixed(1) : String(v), pos: v }));
}
function gradCss(sc) {
  const lo = sc.vals[0], span = sc.vals[sc.vals.length-1] - lo;
  return 'linear-gradient(to right,' + sc.cols.map((c, i) => `${c} ${((sc.vals[i]-lo)/span*100).toFixed(1)}%`).join(',') + ')';
}
function gradLegendHTML(sc, title, ticks) {
  const lo = sc.vals[0], span = sc.vals[sc.vals.length-1] - lo;
  return `<div class="grad-legend"><div class="lg-title">${title}</div>
    <div class="grad-bar" style="background-image:${gradCss(sc)}"></div>
    <div class="grad-ticks">${ticks.map(t => `<span style="left:${((t.pos-lo)/span*100).toFixed(2)}%">${t.label}</span>`).join('')}</div></div>`;
}
function arrowSVG(dir, stdy, size, color) {
  if (stdy < 0.12) return `<circle cx="${size/2}" cy="${size/2}" r="2.6" fill="none" stroke="${color}" stroke-width="1.6"/>`;
  const maxLen = size - 4, len = 5 + Math.min(1, stdy)*(maxLen - 5), rad = (dir + 180)*Math.PI/180;
  const dx = Math.sin(rad), dy = -Math.cos(rad), c = size/2;
  const x0 = c - dx*len/2, y0 = c - dy*len/2, x1 = c + dx*len/2, y1 = c + dy*len/2, hl = Math.min(6, len*.45), hw = hl*.62;
  return `<line x1="${x0}" y1="${y0}" x2="${x1-dx*hl*.6}" y2="${y1-dy*hl*.6}" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>` +
    `<polygon points="${x1},${y1} ${x1-dx*hl-dy*hw},${y1-dy*hl+dx*hw} ${x1-dx*hl+dy*hw},${y1-dy*hl-dx*hw}" fill="${color}"/>`;
}
function arrowKeyHTML() {
  const items = [0.1, 0.25, 0.5, 1].map(s => `<span style="display:flex;align-items:center;gap:3px">
    <svg width="26" height="26">${arrowSVG(270, s, 26, C_TEXT)}</svg>${s < 0.12 ? '&lt;0.12' : s.toFixed(2)}</span>`).join('');
  return `<div class="arrow-key"><span class="lg-title">Arrow length = steadiness</span>${items}</div>`;
}
function compassLegendHTML() {
  const R = 64, r0 = 22, c = 76, size = 152;
  let paths = '';
  for (let i = 0; i < 16; i++) {
    const a0 = (i*22.5 - 11.25 - 90)*Math.PI/180, a1 = (i*22.5 + 11.25 - 90)*Math.PI/180;
    const p = (rr, a) => `${(c + rr*Math.cos(a)).toFixed(2)},${(c + rr*Math.sin(a)).toFixed(2)}`;
    const col = rgbStr(dirRGB(i*22.5));
    const op = DSTATE.dirFilter == null || DSTATE.dirFilter === i ? 1 : 0.22;
    paths += `<path class="sector" data-i="${i}" d="M${p(r0,a0)} L${p(R,a0)} A${R},${R} 0 0 1 ${p(R,a1)} L${p(r0,a1)} A${r0},${r0} 0 0 0 ${p(r0,a0)} Z"
      fill="${col}" stroke="${C_SURF}" stroke-width="1.5" opacity="${op}"><title>${DIRS[i]}</title></path>`;
  }
  const lbl = [['N',c,c-R-3],['E',c+R+8,c+4],['S',c,c+R+14],['W',c-R-8,c+4]]
    .map(([t,x,y]) => `<text x="${x}" y="${y}" fill="${C_TEXT2}" font-family="Courier Prime, monospace" font-size="13" font-weight="700" text-anchor="middle">${t}</text>`).join('');
  const fade = [0.1, 0.3, 0.6].map(s => `<span style="display:flex;align-items:center;gap:5px"><span style="width:18px;height:14px;border-radius:2px;background:${rgbStr(fieldRGB('dir', 225, s))}"></span>${s === 0.6 ? '≥0.6' : s.toFixed(1)}</span>`).join('');
  const sel = DSTATE.dirFilter == null ? '' :
    `<span class="cl-sel">${DIRS[DSTATE.dirFilter]}</span><button class="cc-btn cc-btn-sm" onclick="setDirFilter(null)">&times; Clear</button>`;
  return `<div class="compass-legend"><svg width="${size}" height="${size+6}" viewBox="0 -4 ${size} ${size+6}" id="compass-svg">${paths}${lbl}</svg>
    <div class="cl-side"><span class="lg-title" style="letter-spacing:.08em;text-transform:uppercase">Prevailing direction (from)</span>
    <span style="display:flex;gap:10px;align-items:center">Steadiness ${fade}</span>${sel}</div></div>`;
}
function setDirFilter(i) {

}

  if (DSTATE.arrows) html += arrowKeyHTML();

// ── Hover ─────────────────────────────────────────────────────────────────────
function diurnalHit(x, y) {
  const lay = DSTATE.layout; if (!lay) return null;
  const { L, TOP, ROW, colW, gridW, gridH, rx, RW, by, BH } = lay;
  if (x >= L && x < L + gridW && y >= TOP && y < TOP + gridH) return { type: 'cell', m: Math.floor((x-L)/colW), h: Math.floor((y-TOP)/ROW) };
  if (x >= rx && x < rx + RW && y >= TOP && y < TOP + gridH) return { type: 'hour', h: Math.floor((y-TOP)/ROW) };
  if (x >= L && x < L + gridW && y >= by && y < by + BH) return { type: 'month', m: Math.floor((x-L)/colW) };
  return null;
}
function fmtSpd(mph) { return mph == null ? '—' : `${toDisplay(mph).toFixed(1)} ${UNIT}`; }
function diurnalTipHTML(hv) {
  const D = DATA.diurnal, f = DSTATE.field;
  let head, a, extra = '';
  if (hv.type === 'cell') {
    const { m, h } = hv;
    head = `${MONTHS_LNG[m]} · ${hourLabelLong(h)}`;
    a = { spd: D.spd[m][h], dir: D.dir[m][h], stdy: D.stdy[m][h], gust: D.gust[m][h], calm: D.calm[m][h] };
    if (a.spd != null) {
      const col = MONTHS.map((_, mm) => D.spd[mm][h]).filter(v => v != null);
      const rank = 1 + col.filter(v => v > a.spd).length;
      const dev = a.spd - mean(col);
      extra = tipRow('vs this hour’s avg', `${dev >= 0 ? '+' : '−'}${toDisplay(Math.abs(dev)).toFixed(1)} ${UNIT}`, dev >= 0 ? 'pos' : 'neg') +
              tipRow('Windiest month at this hour', ordinal(rank));
    }
    extra += tipRow('Hours sampled', D.n[m][h].toLocaleString());
  } else if (hv.type === 'hour') {
    head = `${hourLabelLong(hv.h)} · All months`;
    a = margins().byHour[hv.h];
  } else {
    head = `${MONTHS_LNG[hv.m]} · All hours`;
    a = margins().byMonth[hv.m];
  }
  const F = FIELDS[f], main = f === 'dir' ? a.dir : a[f];
  let big;
  if (main == null) big = '—';
  else if (f === 'spd') big = `${toDisplay(main).toFixed(1)}<small>${UNIT}</small>`;
  else if (f === 'dir') big = `${dirLabel(main)}<small>${Math.round(main)}°</small>`;
  else if (f === 'stdy') big = main.toFixed(2);
  else big = `${main.toFixed(1)}<small>%</small>`;
  const rows = [];
  if (f !== 'spd') rows.push(tipRow('Mean speed', fmtSpd(a.spd)));
  if (f !== 'dir') rows.push(tipRow('Direction', a.dir == null ? '—' : `${dirLabel(a.dir)} (${Math.round(a.dir)}°)`));
  if (f !== 'stdy') rows.push(tipRow('Steadiness', a.stdy == null ? '—' : a.stdy.toFixed(2)));
  if (f !== 'gust') rows.push(tipRow('Gusts', a.gust == null ? '—' : `${a.gust.toFixed(1)}% of hours`));
  if (f !== 'calm') rows.push(tipRow('Calm', a.calm == null ? '—' : `${a.calm.toFixed(1)}%`));
  return `<div class="tip-h">${head}</div><div class="tip-v">${big}</div><hr class="tip-hr">${rows.join('')}${extra ? '<hr class="tip-hr">' + extra : ''}`;
}
(function wireDiurnalHover() {
  const cv = document.getElementById('d-canvas');
  cv.addEventListener('mousemove', e => {
    if (!DATA) return;
    const r = cv.getBoundingClientRect(), hv = diurnalHit(e.clientX - r.left, e.clientY - r.top);

// ── Export ────────────────────────────────────────────────────────────────────

  ctx.save(); ctx.translate(PAD, HEAD); drawDiurnal(ctx, lay, {}); ctx.restore();
  const ly = HEAD + lay.H + 24;

  } else {

      gradTicks(f), t => t.label);

    });

}

// =============================================================================
// YEAR × MONTH GRID
// =============================================================================
function setGridMode(m) {
  if (S2.gridMode === m) return;
  S2.gridMode = m;
  document.querySelectorAll('#gridmode-seg .cc-segmented-btn').forEach(b => b.classList.toggle('is-active', b.dataset.gm === m));
  renderGrid();
}
function resetGrid2() { resetSlider2(); refreshActive2(); }

function gridScale() { return S2.gridMode === 'anom' ? SCALES.windAnom : SCALES.wind; }
function gridValue(p) { return p ? (S2.gridMode === 'anom' ? p.anom_mph : p.val_mph) : null; }

function gridLayout(W, nYears) {
  const L = 62, TOP = 30, RG = 18, RW = 176;
  const ROW = Math.max(10, Math.min(20, Math.floor(820/nYears)));
  const gridW = W - L - RG - RW, colW = gridW/12, gridH = nYears*ROW;
  return { W, L, TOP, RG, RW, ROW, colW, gridW, gridH, rx: L + gridW + RG, H: TOP + gridH + 10, nYears };
}
function gridLookup() {
  const map = {};
  filteredPts2().forEach(p => { map[p.yr*12 + p.mo] = p; });
  return map;
}
function annualRows(map) {
  const out = {};
  for (let y = S2.lo; y <= S2.hi; y++) {
    const ps = MONTHS.map((_, m) => map[y*12 + m]);
    if (ps.some(p => !p)) { out[y] = null; continue; }
    const spd = mean(ps.map(p => p.val_mph));
    const anom = ps.some(p => p.anom_mph == null) ? null : mean(ps.map(p => p.anom_mph));
    out[y] = { spd, anom };
  }
  return out;
}

function drawGrid(ctx, lay, opt) {
  const { L, TOP, ROW, colW, gridW, gridH, rx, RW } = lay;
  const map = gridLookup(), ann = annualRows(map), sc = gridScale(), anomMode = S2.gridMode === 'anom';

  ctx.textBaseline = 'alphabetic';
  ctx.font = `700 14px ${FONT_MONO}`; ctx.fillStyle = C_TEXT2; ctx.textAlign = 'center';
  MONTHS.forEach((mn, m) => ctx.fillText(mn, L + (m + 0.5)*colW, TOP - 11));
  ctx.textAlign = 'left'; ctx.fillStyle = C_MUTED; ctx.font = `13px ${FONT_MONO}`;
  ctx.fillText('ANNUAL', rx, TOP - 11);

  const every = ROW >= 15 ? 1 : ROW >= 11 ? 2 : 5;
  let asosY = null;
  if (DATA.asos) {
    const [yc, mc1] = DATA.asos.split('-').map(Number);
    asosY = TOP + (yc - S2.lo)*ROW + (mc1 > 1 ? ROW : 0);
  }
  ctx.textBaseline = 'middle';
  for (let y = S2.lo; y <= S2.hi; y++) {
    const i = y - S2.lo, top = TOP + i*ROW;
    const nearAsos = asosY != null && Math.abs(top + ROW/2 - asosY) < 13;
    if ((y % every === 0 || every === 1) && !nearAsos) {
      ctx.font = `13px ${FONT_MONO}`; ctx.fillStyle = C_TEXT2; ctx.textAlign = 'right';
      ctx.fillText(String(y), L - 9, top + ROW/2 + 1);
    }
    for (let m = 0; m < 12; m++) {
      const p = map[y*12 + m], v = gridValue(p), x = L + m*colW;
      if (v == null) { ctx.fillStyle = C_BG; ctx.fillRect(x + 0.5, top + 0.5, colW - 1, ROW - 1); continue; }
      const rgb = scaleRGB(v, sc);
      ctx.fillStyle = rgbStr(rgb); ctx.fillRect(x + 0.5, top + 0.5, colW - 1, ROW - 1);
      if (ROW >= 13) {
        ctx.fillStyle = inkFor(rgb); ctx.font = `12px ${FONT_MONO}`; ctx.textAlign = 'center';
        const dv = toDisplay(v);
        ctx.fillText(anomMode ? `${dv > 0.05 ? '+' : dv < -0.05 ? '−' : ''}${Math.abs(dv).toFixed(1)}` : dv.toFixed(1), x + colW/2, top + ROW/2 + 1);
      }
    }
  }

  // Annual marginal
  const BW = RW - 60;
  const vals = Object.values(ann).filter(Boolean).map(a => anomMode ? a.anom : a.spd).filter(v => v != null);
  const max = anomMode ? niceMax(Math.max(0.2, ...vals.map(Math.abs))) : niceMax(Math.max(1, ...vals));
  const zeroX = anomMode ? rx + BW/2 : rx;
  ctx.fillStyle = C_SURF2; ctx.fillRect(rx, TOP, BW, gridH);
  if (anomMode) { ctx.fillStyle = 'rgba(232,228,217,0.30)'; ctx.fillRect(zeroX - 0.5, TOP, 1, gridH); }
  for (let y = S2.lo; y <= S2.hi; y++) {
    const a = ann[y], i = y - S2.lo, top = TOP + i*ROW, v = a ? (anomMode ? a.anom : a.spd) : null;
    if (v == null) continue;
    const len = anomMode ? (v/max)*(BW/2) : (v/max)*BW;
    ctx.fillStyle = rgbStr(scaleRGB(v, sc));
    const bh = Math.max(3, ROW - 4);
    if (len >= 0) ctx.fillRect(zeroX, top + (ROW - bh)/2, Math.max(1.5, len), bh);
    else ctx.fillRect(zeroX + len, top + (ROW - bh)/2, -len, bh);
    if (ROW >= 12) {
      const dv = toDisplay(v);
      ctx.fillStyle = C_TEXT; ctx.font = `12px ${FONT_MONO}`; ctx.textAlign = 'left';
      ctx.fillText(anomMode ? `${dv >= 0.005 ? '+' : dv <= -0.005 ? '−' : ''}${Math.abs(dv).toFixed(2)}` : dv.toFixed(1), rx + BW + 7, top + ROW/2 + 1);
    }
  }

  // ASOS commissioning boundary
  if (DATA.asos) {
    const [yc, mc1] = DATA.asos.split('-').map(Number), mc = mc1 - 1;
    if (yc >= S2.lo && yc <= S2.hi + 1) {
      const yTop = TOP + (yc - S2.lo)*ROW, yBot = yTop + ROW;
      ctx.save();
      ctx.strokeStyle = C_TEXT; ctx.lineWidth = 2.5; ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(L - 4, mc === 0 ? yTop : yBot);
      if (mc > 0) { ctx.lineTo(L + mc*colW, yBot); ctx.lineTo(L + mc*colW, yTop); }
      ctx.lineTo(L + gridW + 4, yTop);
      ctx.stroke();
      ctx.restore();
      const ly = mc === 0 ? yTop : yBot;
      ctx.font = `700 13px ${FONT_MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      const tw = ctx.measureText('ASOS').width;
      ctx.fillStyle = C_SURF; ctx.fillRect(2, ly - 9, tw + 8, 18);
      ctx.strokeStyle = C_TEXT; ctx.lineWidth = 1; ctx.strokeRect(2.5, ly - 8.5, tw + 7, 17);
      ctx.fillStyle = C_TEXT; ctx.fillText('ASOS', 6, ly + 1);
    }
  }

  const hv = opt && opt.hover;
  if (hv) {
    ctx.strokeStyle = C_TEXT; ctx.lineWidth = 2;
    const top = TOP + (hv.y - S2.lo)*ROW;
    if (hv.type === 'cell') ctx.strokeRect(L + hv.m*colW + 1, top + 1, colW - 2, ROW - 2);
    else ctx.strokeRect(rx - 2, top + 1, RW, ROW - 2);
  }
  ctx.textBaseline = 'alphabetic';
}

function gridTitles() {
  const anom = S2.gridMode === 'anom';
  return {
    kicker: anom ? `Monthly Mean Wind Speed Anomaly (${UNIT})` : `Monthly Mean Wind Speed (${UNIT})`,
    sub: `${S2.lo}–${S2.hi}` + (anom ? ` · vs ${DATA.normals[0]}–${DATA.normals[1]} Normals` : '') + ' · Local Time',
  };
}
function gridTicks() {
  if (S2.gridMode === 'anom') {
    const vals = UNIT === 'kt' ? [-2.5, -1.5, -0.5, 0, 0.5, 1.5, 2.5] : [-3, -2, -1, 0, 1, 2, 3];
    return vals.map(t => ({ label: (t > 0 ? '+' : t < 0 ? '−' : '') + Math.abs(t), pos: UNIT === 'kt' ? t/KT_PER_MPH : t }));
  }
  return gradTicks('spd');
}
function renderGrid() {
  if (!DATA) return;
  const t = gridTitles();
  document.getElementById('g-title').textContent = t.kicker;
  document.getElementById('g-city').textContent = STATION_NAME[STATION];
  document.getElementById('g-sub').textContent = t.sub;
  const asos = fmtMonthYear(DATA.asos);
  document.getElementById('g-note').textContent = 'Data: Iowa Environmental Mesonet (IEM) · contextclimate.io';
  let leg = gradLegendHTML(gridScale(), S2.gridMode === 'anom' ? `Anomaly (${UNIT})` : `Mean wind speed (${UNIT})`, gridTicks());
  if (asos) leg += `<div class="arrow-key"><svg width="34" height="14"><line x1="1" y1="7" x2="33" y2="7" stroke="${C_TEXT}" stroke-width="2.5"/></svg>ASOS commissioned ${asos}</div>`;
  document.getElementById('g-legend').innerHTML = leg;
  drawGridScreen();
}
function drawGridScreen() {
  const scroll = document.getElementById('g-scroll');
  const W = Math.max(720, Math.floor(scroll.clientWidth));
  const lay = gridLayout(W, S2.hi - S2.lo + 1);
  S2.layout = lay;
  const ctx = setupCanvas(document.getElementById('g-canvas'), W, lay.H);
  ctx.fillStyle = C_SURF; ctx.fillRect(0, 0, W, lay.H);
  drawGrid(ctx, lay, { hover: S2.hover });
}
function gridHit(x, y) {
  const lay = S2.layout; if (!lay) return null;
  const { L, TOP, ROW, colW, gridW, gridH, rx, RW } = lay;
  if (y < TOP || y >= TOP + gridH) return null;
  const yr = S2.lo + Math.floor((y - TOP)/ROW);
  if (x >= L && x < L + gridW) return { type:'cell', y: yr, m: Math.floor((x - L)/colW) };
  if (x >= rx && x < rx + RW) return { type:'annual', y: yr };
  return null;
}
function gridTipHTML(hv) {
  const map = gridLookup(), b0 = DATA.normals[0], b1 = DATA.normals[1];
  if (hv.type === 'cell') {
    const p = map[hv.y*12 + hv.m];
    const head = `${MONTHS_LNG[hv.m]} ${hv.y}`;
    if (!p) return `<div class="tip-h">${head}</div><div class="tip-v">—</div>${tipRow('Status', 'Insufficient data')}`;
    const anom = p.anom_mph;
    const big = S2.gridMode === 'anom' && anom != null
      ? `${anom >= 0 ? '+' : '−'}${toDisplay(Math.abs(anom)).toFixed(2)}<small>${UNIT}</small>`
      : `${toDisplay(p.val_mph).toFixed(1)}<small>${UNIT}</small>`;
    return `<div class="tip-h">${head}</div><div class="tip-v">${big}</div><hr class="tip-hr">` +
      tipRow('Mean speed', fmtSpd(p.val_mph)) +
      tipRow(`${b0}–${b1} mean`, fmtSpd(DATA._base[p.mo])) +
      tipRow('Anomaly', anom == null ? '—' : `${anom >= 0 ? '+' : '−'}${toDisplay(Math.abs(anom)).toFixed(2)} ${UNIT}`, anom == null ? '' : anom >= 0 ? 'pos' : 'neg') +
      tipRow('Hours sampled', p.n.toLocaleString());
  }
  const a = annualRows(map)[hv.y];
  if (!a) return `<div class="tip-h">${hv.y} · Annual</div><div class="tip-v">—</div>${tipRow('Status', 'Missing months')}`;
  return `<div class="tip-h">${hv.y} · Annual</div><div class="tip-v">${toDisplay(a.spd).toFixed(2)}<small>${UNIT}</small></div><hr class="tip-hr">` +
    tipRow('Anomaly', a.anom == null ? '—' : `${a.anom >= 0 ? '+' : '−'}${toDisplay(Math.abs(a.anom)).toFixed(2)} ${UNIT}`, a.anom == null ? '' : a.anom >= 0 ? 'pos' : 'neg');
}
(function wireGridHover() {
  const cv = document.getElementById('g-canvas');
  cv.addEventListener('mousemove', e => {
    if (!DATA || S2.view !== 'grid') return;
    const r = cv.getBoundingClientRect(), hv = gridHit(e.clientX - r.left, e.clientY - r.top);
    const key = hv ? JSON.stringify(hv) : null;
    if (key !== (S2.hover ? JSON.stringify(S2.hover) : null)) { S2.hover = hv; drawGridScreen(); }
    if (!hv) { hideTip(); return; }
    showTip(e, gridTipHTML(hv));
  });
  cv.addEventListener('mouseleave', () => { S2.hover = null; hideTip(); if (DATA && S2.view === 'grid') drawGridScreen(); });
})();

function buildGridExport() {
  const W = 1180, PAD = 30, HEAD = 128;
  const lay = gridLayout(W - 2*PAD, S2.hi - S2.lo + 1);
  const LEG = 92, FOOT = 46, H = HEAD + lay.H + LEG + FOOT, t = gridTitles();
  const { c, ctx } = makeExportCanvas(W, H);
  exportHeader(ctx, W, t.kicker, STATION_NAME[STATION], t.sub, gridScale());
  ctx.save(); ctx.translate(PAD, HEAD); drawGrid(ctx, lay, {}); ctx.restore();
  const ly = HEAD + lay.H + 24, asos = fmtMonthYear(DATA.asos);
  const lx = W/2 - (asos ? 330 : 210);
  drawGradLegend(ctx, lx, ly, 420, gridScale(), S2.gridMode === 'anom' ? `Anomaly (${UNIT})` : `Mean wind speed (${UNIT})`, gridTicks(), x => x.label);
  if (asos) {
    ctx.strokeStyle = C_TEXT; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(lx + 460, ly + 15); ctx.lineTo(lx + 494, ly + 15); ctx.stroke();
    ctx.fillStyle = C_TEXT2; ctx.font = `14px ${FONT_MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`ASOS commissioned ${asos}`, lx + 502, ly + 16);
    ctx.textBaseline = 'alphabetic';
  }
  exportFooter(ctx, W, H, null);
  return c;
}
function gridFilename() { return `wind-year-month-${S2.gridMode}-${STATION.toLowerCase()}-${UNIT}.png`; }
function copyGrid() { if (DATA) runExport('btn-gridcopy', buildGridExport, gridFilename(), true); }
function downloadGrid() { if (DATA) runExport('btn-griddl', buildGridExport, gridFilename(), false); }

// =============================================================================
// INIT
// =============================================================================
let _resizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeT);
  _resizeT = setTimeout(() => {
    if (!DATA) return;
    if (ACTIVE_TAB === 'diurnal') drawDiurnalScreen();
    else if (S2.view === 'grid') drawGridScreen();
  }, 120);
});
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => renderActive());
loadStation(STATION);

</script>
