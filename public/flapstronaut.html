<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flapstronaut</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
/* Tool-specific layout only — shared chrome lives in core-sample-tools.css.
   Fixed-viewport game: body/layout rules override the shared page defaults.
   Body themes inside the canvas are content colors and stay per-body. */
:root{--tool-accent:var(--accent-earth);--gold:#F5C842;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;padding:0;min-height:0;}

#hdr{flex-shrink:0;background:var(--color-surface);border-bottom:1px solid var(--color-border-hover);display:flex;align-items:center;gap:10px;padding:8px 14px;position:relative;z-index:10;flex-wrap:wrap;}
#hdr::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--tool-accent) 35%,var(--gold) 65%,transparent);}
.hdr-title{font-family:var(--font-display);font-size:1.35rem;font-weight:700;color:var(--tool-accent);white-space:nowrap;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;order:3;flex-basis:100%;}
.tabs::-webkit-scrollbar{display:none;}
.tabs .cc-btn{flex-shrink:0;}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:auto;flex-wrap:wrap;}
.cc-segmented-btn{padding:5px 11px;font-size:.66rem;}
.back-link{font-family:var(--font-body);font-size:.8rem;color:var(--color-text-muted);text-decoration:none;border:1px solid var(--color-border);border-radius:20px;padding:4px 11px;white-space:nowrap;}
.back-link:hover{color:var(--tool-accent);border-color:var(--tool-accent);}

#wrap{position:relative;flex:1;overflow:hidden;min-height:0;}
#c{display:block;width:100%;height:100%;}

.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,24,21,.62);backdrop-filter:blur(5px);}
.ov.show{display:flex;}
#ov-bh{background:#000;backdrop-filter:none;flex-direction:column;}
.card{background:var(--color-surface);border:1px solid var(--color-border-hover);border-radius:var(--radius-lg);padding:22px 24px;width:min(460px,92%);text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.55);}
.card h2{font-family:var(--font-display);font-size:1.9rem;font-weight:700;color:var(--color-text-primary);margin-bottom:12px;}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.cc-stat-chip{padding:7px 8px;align-items:center;}
.cc-stat-chip .cc-stat-label{font-size:10px;}
.cc-stat-chip .v{font-family:var(--font-mono);font-size:17px;font-weight:700;color:var(--color-text-primary);}
.hint{font-family:var(--font-mono);font-size:.74rem;color:var(--color-text-muted);margin:0 0 14px;}
.card .cc-btn.primary{font-size:1.05rem;padding:10px 34px;}

#hud{position:absolute;top:10px;left:0;right:0;z-index:5;display:none;justify-content:space-between;gap:8px;padding:0 12px 0 62px;pointer-events:none;}
#hud.show{display:flex;}
.pill{background:rgba(20,24,21,.82);border:1px solid var(--color-border-hover);border-radius:20px;padding:4px 12px;font-size:.74rem;font-family:var(--font-mono);color:var(--color-text-primary);white-space:nowrap;}
.pill b{color:var(--tool-accent);font-weight:700;}
#prog-wrap{position:absolute;bottom:10px;left:60px;right:14px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;display:none;pointer-events:none;}
#prog-wrap.show{display:block;}
#prog-bar{height:100%;width:0;background:var(--tool-accent);border-radius:2px;}
</style>
</head>
<body>

<div id="hdr">
  <div class="hdr-title">Flapstronaut</div>
  <div class="tabs" id="tabs"></div>
  <div class="hdr-right">
    <div class="cc-segmented" id="seg-view">
      <button class="cc-segmented-btn is-active" data-v="fit">Fit course</button>
      <button class="cc-segmented-btn" data-v="true">True scale</button>
    </div>
    <div class="cc-segmented" id="seg-time">
      <button class="cc-segmented-btn is-active" data-t="auto">Auto time</button>
      <button class="cc-segmented-btn" data-t="real">Real time</button>
    </div>
    <a href="/earthandspace" target="_parent" class="back-link">← Earth &amp; Space</a>
  </div>
</div>

<div id="wrap">
  <canvas id="c"></canvas>

  <div class="ov show" id="ov-start">
    <div class="card">
      <h2 id="s-title">Earth</h2>
      <div class="chips" id="s-chips"></div>
      <p class="hint">Space / click = burst · 7.0 m/s up · 4.0 m/s forward</p>
      <button class="cc-btn primary" id="s-btn">Launch</button>
    </div>
  </div>

  <div class="ov" id="ov-end">
    <div class="card">
      <h2 id="e-title">Crash</h2>
      <div class="chips" id="e-chips"></div>
      <button class="cc-btn primary" id="e-btn">Try again</button>
    </div>
  </div>

  <div class="ov" id="ov-bh">
    <div style="text-align:center;font-family:var(--font-mono);user-select:none;">
      <div id="bh-err" style="color:#fff;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;margin-bottom:30px;">ERROR 000</div>
      <div style="color:#fff;font-size:.85rem;line-height:2.6;letter-spacing:.05em;">
        escape velocity &gt; c<br>
        no information escapes this boundary<br>
        physics not rendering
      </div>
      <div style="margin-top:44px;color:rgba(255,255,255,.35);font-size:.58rem;letter-spacing:.18em;">click anywhere to remain trapped</div>
    </div>
  </div>

  <div id="hud">
    <div class="pill" id="h-left"></div>
    <div class="pill" id="h-mid"></div>
    <div class="pill" id="h-right"></div>
  </div>
  <div id="prog-wrap"><div id="prog-bar"></div></div>
</div>

<script>
'use strict';
// ══════════════════════════════════════════
//  BODIES
//  g: NASA Planetary Fact Sheet (giants at the 1-bar level)
//  rho: surface / 1-bar atmospheric density, kg/m³ (NASA per-planet fact sheets);
//       0 = no atmosphere or negligible (< 0.001)
// ══════════════════════════════════════════
const BODIES=[
  {id:'sun',name:'Sun',emoji:'☀️',g:274,gLabel:'274',rho:0,rhoLabel:'< 0.001',
   th:{sky:['#aa1000','#dd4400','#ff8800'],stars:false,rings:false,gnd:'#ff4400',gndStyle:'plasma',obs:'flare',oFill:'#ff5500',oHi:'#ffee00',oSh:'#992200',bg:'plasma'}},
  {id:'mercury',name:'Mercury',emoji:'☿',g:3.70,gLabel:'3.70',rho:0,rhoLabel:'0',
   th:{sky:['#080604','#1a1410','#2a2018'],stars:true,rings:false,gnd:'#5a4a38',gndStyle:'rocky',obs:'rocky',oFill:'#5a4a38',oHi:'#908070',oSh:'#221c16',bg:'craters'}},
  {id:'venus',name:'Venus',emoji:'♀️',g:8.87,gLabel:'8.87',rho:65,rhoLabel:'65',
   th:{sky:['#5a3800','#a07010','#d8b030'],stars:false,rings:false,gnd:'#8a5010',gndStyle:'rocky',obs:'gas',oFill:'#9a7010',oHi:'#e8c040',oSh:'#402808',bg:'venushaze'}},
  {id:'earth',name:'Earth',emoji:'🌍',g:9.81,gLabel:'9.81',rho:1.217,rhoLabel:'1.217',
   th:{sky:['#1558a0','#3a98d8','#7dc8ee'],stars:false,rings:false,gnd:'#3a7a30',gndStyle:'grass',obs:'pipe',oFill:'#3a8c30',oHi:'#58c044',oSh:'#1a5018',bg:'clouds'}},
  {id:'moon',name:'Moon',emoji:'🌕',g:1.62,gLabel:'1.62',rho:0,rhoLabel:'0',
   th:{sky:['#000008','#03031a','#06062a'],stars:true,rings:false,gnd:'#6e6e6e',gndStyle:'lunar',obs:'rocky',oFill:'#585858',oHi:'#949494',oSh:'#282828',bg:'craters'}},
  {id:'mars',name:'Mars',emoji:'🔴',g:3.72,gLabel:'3.72',rho:0.016,rhoLabel:'0.016',
   th:{sky:['#7a2008','#c03818','#e06840'],stars:false,rings:false,gnd:'#782a10',gndStyle:'rocky',obs:'rocky',oFill:'#8a2e12',oHi:'#c05030',oSh:'#481408',bg:'dust'}},
  {id:'ceres',name:'Ceres',emoji:'🪨',g:0.27,gLabel:'0.27',rho:0,rhoLabel:'0',
   th:{sky:['#020202','#080808','#0e0e12'],stars:true,rings:false,gnd:'#1e1e1e',gndStyle:'lunar',obs:'rocky',oFill:'#242424',oHi:'#484848',oSh:'#0c0c0c',bg:'craters'}},
  {id:'pallas',name:'Pallas',emoji:'🌑',g:0.21,gLabel:'0.21',rho:0,rhoLabel:'0',
   th:{sky:['#010106','#060612','#0a0a1c'],stars:true,rings:false,gnd:'#181824',gndStyle:'lunar',obs:'rocky',oFill:'#20202e',oHi:'#3e3e52',oSh:'#08080e',bg:'craters'}},
  {id:'jupiter',name:'Jupiter',emoji:'🟠',g:23.1,gLabel:'23.1',rho:0.16,rhoLabel:'0.16',
   th:{sky:['#3a1a06','#784a18','#c08038'],stars:false,rings:false,gnd:null,gndStyle:'bands',obs:'gas',oFill:'#5a2808',oHi:'#b87838',oSh:'#200c02',bg:'bands'}},
  {id:'saturn',name:'Saturn',emoji:'🪐',g:9.0,gLabel:'9.0',rho:0.19,rhoLabel:'0.19',
   th:{sky:['#3a3010','#7a6828','#b89850'],stars:true,rings:true,gnd:'#887830',gndStyle:'clouds',obs:'ice',oFill:'#7ab8d0',oHi:'#c8eeff',oSh:'#305878',bg:'rings'}},
  {id:'uranus',name:'Uranus',emoji:'🔵',g:8.69,gLabel:'8.69',rho:0.42,rhoLabel:'0.42',
   th:{sky:['#0a2830','#1a5860','#28a088'],stars:true,rings:false,gnd:'#106048',gndStyle:'lunar',obs:'ice',oFill:'#30a898',oHi:'#80eedd',oSh:'#083828',bg:'icehazeU'}},
  {id:'neptune',name:'Neptune',emoji:'🔹',g:11.15,gLabel:'11.15',rho:0.45,rhoLabel:'0.45',
   th:{sky:['#020820','#082068','#1040c0'],stars:false,rings:false,gnd:null,gndStyle:'bands',obs:'gas',oFill:'#1040a0',oHi:'#4080ff',oSh:'#040818',bg:'nepbands'}},
  {id:'pluto',name:'Pluto',emoji:'🩶',g:0.62,gLabel:'0.62',rho:0,rhoLabel:'< 0.001',
   th:{sky:['#04040e','#0a0a20','#14143a'],stars:true,rings:false,gnd:'#202038',gndStyle:'lunar',obs:'ice',oFill:'#303058',oHi:'#7070a8',oSh:'#101020',bg:'craters'}},
  {id:'eris',name:'Eris',emoji:'⚪',g:0.82,gLabel:'0.82',rho:0,rhoLabel:'0',
   th:{sky:['#060608','#0c0c14','#141420'],stars:true,rings:false,gnd:'#242428',gndStyle:'lunar',obs:'ice',oFill:'#484850',oHi:'#9090a0',oSh:'#181820',bg:'craters'}},
  {id:'blackhole',name:'Black Hole',emoji:'⚫',g:Infinity,gLabel:'∞',isBH:true,th:{}}
];

// ══════════════════════════════════════════
//  PHYSICS + COURSE (SI units throughout)
// ══════════════════════════════════════════
const G_EARTH=9.81;
const BURST=7.0;          // m/s — each burst sets upward speed to this, on every body
const VX=4.0;             // m/s — forward cruise speed, on every body
const RA=0.45;            // m — astronaut hit radius
const MASS=150;           // kg — astronaut + suit + pack
const CDA=0.8;            // m² — drag coefficient × frontal area
// Earth course template (m). Other bodies scale it by gE/g so each course fits the hop it allows;
// floors keep a gap wider than the astronaut and columns spaced wider than they are.
const HW=16,GAP=5,COLW=1.6,SPACING=14,FIRST=22,N_OBS=10;
const SV_MIN=0.6,SH_MIN=0.5;
const GY=[0.50,0.38,0.56,0.33,0.63,0.43,0.30,0.60,0.47,0.42];   // gap centre, fraction from top

function courseFor(b){
  const sPhys=G_EARTH/b.g,sV=Math.max(sPhys,SV_MIN),sH=Math.max(sPhys,SH_MIN);
  const top=HW*sV,gap=GAP*sV,colW=COLW*sV,spacing=SPACING*sH,first=FIRST*sH;
  const obs=GY.map((f,i)=>({x:first+i*spacing,yc:top*(1-f)}));
  return{sPhys,sV,sH,top,gap,colW,spacing,obs,finish:obs[N_OBS-1].x+spacing*0.75,
         warpAuto:Math.min(64,Math.max(1/8,Math.pow(2,Math.round(Math.log2(sPhys)))))};
}
function accel(b,vy){
  let a=-b.g;
  if(b.rho>0) a-=Math.sign(vy)*0.5*b.rho*CDA*vy*vy/MASS;
  return a;
}
function simDt(b){return Math.min(1/240,(BURST/b.g)/400);}
// rise and time to apex for one burst from rest (drag included)
function burstProfile(b){
  let y=0,vy=BURST,t=0;const dt=simDt(b);
  while(vy>0&&t<1e4){vy+=accel(b,vy)*dt;y+=vy*dt;t+=dt;}
  return{rise:y,tApex:t};
}
function terminalV(b){return b.rho>0?Math.sqrt(2*MASS*b.g/(b.rho*CDA)):Infinity;}

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let body=BODIES.find(b=>b.id==='earth');
let C=courseFor(body);
let phase='start';           // start | playing | dead | win | blackhole
let viewMode='fit';          // fit | true
let timeMode='auto';         // auto | real
let px=0,py=0,vy=0,tSim=0,maxY=0;
let burstY=0,burstT=0,tracking=false,lastRise=null,lastRiseT=null;
let passed=new Set();
let canvas,ctx,W,H,playH,dpr=1,lastFrame=null,acc=0;
const $=id=>document.getElementById(id);

function warp(){ if(timeMode==='real'||viewMode==='true') return 1; return C.warpAuto; }
function warpLabel(w){return w>=1?'×'+w:'×1/'+Math.round(1/w);}
function fmtClock(s){const d=Math.round(s*10),m=Math.floor(d/600),r=(d-m*600)/10;return m+':'+(r<10?'0':'')+r.toFixed(1);}
function fmtM(m){return m>=100?Math.round(m)+' m':m>=10?m.toFixed(1)+' m':m>=1?m.toFixed(2)+' m':(m*100).toFixed(1)+' cm';}
function fmtS(s){return s>=10?s.toFixed(1)+' s':s>=1?s.toFixed(2)+' s':(s*1000).toFixed(0)+' ms';}

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
function init(){
  canvas=$('c');ctx=canvas.getContext('2d');
  resize();window.addEventListener('resize',resize);
  const tabEl=$('tabs');
  BODIES.forEach(b=>{
    const btn=document.createElement('button');
    btn.className='cc-btn cc-btn-sm'+(b===body?' is-active':'');
    btn.textContent=b.emoji+' '+b.name;
    btn.onclick=()=>selectBody(b);
    tabEl.appendChild(btn);
  });
  document.querySelectorAll('#seg-view .cc-segmented-btn').forEach(bt=>bt.onclick=()=>{
    viewMode=bt.dataset.v;
    document.querySelectorAll('#seg-view .cc-segmented-btn').forEach(x=>x.classList.toggle('is-active',x===bt));
    syncTimeSeg();if(phase==='start') syncStartCard();
  });
  document.querySelectorAll('#seg-time .cc-segmented-btn').forEach(bt=>bt.onclick=()=>{
    timeMode=bt.dataset.t;syncTimeSeg();if(phase==='start') syncStartCard();
  });
  $('s-btn').onclick=startGame;$('e-btn').onclick=toStart;
  window.addEventListener('keydown',e=>{
    if(e.code!=='Space') return;
    e.preventDefault();if(e.repeat) return;
    if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
    if(phase==='playing') doBurst(); else if(phase==='start') startGame(); else if(phase==='dead'||phase==='win') toStart();
  });
  canvas.addEventListener('mousedown',tap);
  canvas.addEventListener('touchstart',e=>{e.preventDefault();tap();},{passive:false});
  setInterval(()=>{const el=$('bh-err');if(el) el.textContent='ERROR '+(Math.floor(Math.random()*900)+100);},700);
  syncTimeSeg();syncStartCard();toStart();
  requestAnimationFrame(loop);
}
function syncTimeSeg(){
  document.querySelectorAll('#seg-time .cc-segmented-btn').forEach(x=>{
    x.classList.toggle('is-active',x.dataset.t===timeMode);
    if(x.dataset.t==='auto') x.textContent='Auto time '+(viewMode==='true'?'×1':warpLabel(C.warpAuto));
  });
}
function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  dpr=window.devicePixelRatio||1;
  W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  playH=H-40;
}

// ══════════════════════════════════════════
//  BODY SELECT + FLOW
// ══════════════════════════════════════════
function selectBody(b){
  body=b;
  document.querySelectorAll('#tabs .cc-btn').forEach((el,i)=>el.classList.toggle('is-active',BODIES[i]===b));
  if(b.isBH){hideOvs();phase='blackhole';$('hud').classList.remove('show');$('prog-wrap').classList.remove('show');showOv('ov-bh');return;}
  C=courseFor(b);syncTimeSeg();toStart();
}
function chip(label,val){return `<div class="cc-stat-chip"><span class="cc-stat-label">${label}</span><span class="v">${val}</span></div>`;}
function syncStartCard(){
  if(body.isBH) return;
  const bp=burstProfile(body),vt=terminalV(body);
  $('s-title').textContent=body.emoji+' '+body.name;
  $('s-chips').innerHTML=
    chip('g',body.gLabel+' m/s²')+chip('air density',body.rhoLabel+' kg/m³')+chip('terminal v',isFinite(vt)?vt.toFixed(1)+' m/s':'none')+
    chip('rise / burst',fmtM(bp.rise))+chip('time to apex',fmtS(bp.tApex))+chip('time warp',warpLabel(warp()))+
    chip('gap',fmtM(C.gap))+chip('course height',fmtM(C.top))+chip('column spacing',fmtM(C.spacing));
}
function resetRun(){
  px=0;py=C.top*0.5;vy=0;tSim=0;maxY=py;passed=new Set();
  tracking=false;lastRise=null;lastRiseT=null;acc=0;
}
function toStart(){
  phase='start';resetRun();hideOvs();showOv('ov-start');
  $('hud').classList.remove('show');$('prog-wrap').classList.remove('show');
  syncStartCard();
}
function startGame(){
  hideOvs();resetRun();phase='playing';
  $('hud').classList.add('show');$('prog-wrap').classList.add('show');
  doBurst();
}
function tap(){ if(phase==='playing') doBurst(); }
function doBurst(){vy=BURST;burstY=py;burstT=tSim;tracking=true;}
function endRun(won){
  phase=won?'win':'dead';
  $('hud').classList.remove('show');$('prog-wrap').classList.remove('show');
  $('e-title').textContent=won?body.emoji+' '+body.name+' complete':'Crash';
  $('e-chips').innerHTML=chip('cleared',passed.size+' / '+N_OBS)+chip('real time',fmtClock(tSim))+chip('peak altitude',fmtM(maxY))+
    chip('g',body.gLabel+' m/s²')+chip('time warp',warpLabel(warp()))+chip('distance',fmtM(px));
  $('e-btn').textContent=won?'Play again':'Try again';
  showOv('ov-end');
}
function showOv(id){$(id).classList.add('show');}
function hideOvs(){document.querySelectorAll('.ov').forEach(el=>el.classList.remove('show'));}

// ══════════════════════════════════════════
//  UPDATE (fixed sim timestep, independent of display refresh rate)
// ══════════════════════════════════════════
function stepSim(dt){
  vy+=accel(body,vy)*dt;py+=vy*dt;px+=VX*dt;tSim+=dt;
  if(py>maxY) maxY=py;
  if(tracking&&vy<=0){tracking=false;lastRise=py-burstY;lastRiseT=tSim-burstT;}
  if(py-RA<0||py+RA>C.top) return 'dead';
  const h=C.colW/2;
  for(let i=0;i<C.obs.length;i++){
    const o=C.obs[i];
    if(Math.abs(px-o.x)<h+RA){
      if(py-RA<o.yc-C.gap/2||py+RA>o.yc+C.gap/2) return 'dead';
    }
    if(!passed.has(i)&&px-RA>o.x+h) passed.add(i);
  }
  if(px>C.finish) return 'win';
  return null;
}
function advance(realDt){
  if(phase!=='playing') return;
  acc+=Math.min(realDt,0.05)*warp();
  const dt=simDt(body);
  let n=0;
  while(acc>=dt&&n<20000){
    acc-=dt;n++;
    const r=stepSim(dt);
    if(r){endRun(r==='win');acc=0;return;}
  }
}
function updateHud(){
  if(phase!=='playing') return;
  $('h-left').innerHTML=`${body.emoji} ${body.name} · g <b>${body.gLabel}</b> m/s² · ρ <b>${body.rhoLabel}</b> kg/m³`;
  const lr=lastRise!=null?` · last burst <b>+${fmtM(lastRise)}</b> in <b>${fmtS(lastRiseT)}</b>`:'';
  $('h-mid').innerHTML=`alt <b>${fmtM(Math.max(0,py))}</b> · v <b>${vy>=0?'+':'−'}${Math.abs(vy).toFixed(1)}</b> m/s${lr}`;
  $('h-right').innerHTML=`✓ <b>${passed.size}</b> / ${N_OBS} · real <b>${fmtClock(tSim)}</b> · <b>${warpLabel(warp())}</b>`;
  $('prog-bar').style.width=(Math.min(1,px/C.finish)*100)+'%';
}

// ══════════════════════════════════════════
//  CAMERA  (world m → screen px)
// ══════════════════════════════════════════
const BX_FRAC=0.24;
function cam(){
  if(viewMode==='fit'){
    const z=playH/C.top;
    return{z,sx:wx=>W*BX_FRAC+(wx-px)*z,sy:wy=>playH-wy*z,camX:px};
  }
  const z=playH/HW,half=HW/2;
  let cy=C.top<=HW?HW/2:Math.min(Math.max(py,half),C.top-half);
  if(C.top<=HW) cy=half;
  return{z,sx:wx=>W*BX_FRAC+(wx-px)*z,sy:wy=>playH/2-(wy-cy)*z,camX:px,cy};
}

// ══════════════════════════════════════════
//  DRAW
// ══════════════════════════════════════════
function draw(now){
  if(phase==='blackhole'){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);return;}
  const th=body.th,K=cam();
  ctx.clearRect(0,0,W,H);
  drawBg(th,K);
  drawObs(th,K);
  drawFinish(K);
  if(phase==='playing'||phase==='start') drawAstro(K,now);
  drawGnd(th,K);
  drawCeiling(K);
  drawRuler(K);
  if(viewMode==='true') drawMiniMap();
}
function drawBg(th,K){
  const g=ctx.createLinearGradient(0,0,0,H);
  th.sky.forEach((c,i)=>g.addColorStop(i/(th.sky.length-1),c));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const parX=K.camX*K.z;
  if(th.stars) drawStars();
  if(th.rings) drawRings();
  if(th.bg==='clouds') drawClouds(parX,'#fff',0.22,1);
  if(th.bg==='bands') drawBands([[0.07,0.055,'#c07030',0.33],[0.18,0.045,'#804818',0.28],[0.29,0.095,'#d88848',0.26],[0.48,0.055,'#703018',0.32],[0.61,0.075,'#c07838',0.23],[0.75,0.048,'#884020',0.28]]);
  if(th.bg==='nepbands') drawBands([[0.10,0.05,'#1850d0',0.28],[0.22,0.04,'#0828a0',0.22],[0.38,0.08,'#2060e8',0.20],[0.55,0.045,'#0e3090',0.25],[0.70,0.06,'#1848c0',0.18]]);
  if(th.bg==='dust'){const d=ctx.createLinearGradient(0,playH*.52,0,playH);d.addColorStop(0,'rgba(175,75,25,0)');d.addColorStop(1,'rgba(175,75,25,.24)');ctx.fillStyle=d;ctx.fillRect(0,0,W,playH);}
  if(th.bg==='plasma') drawPlasma(parX);
  if(th.bg==='craters') drawCraters(parX);
  if(th.bg==='venushaze'){const v=ctx.createLinearGradient(0,0,0,playH);v.addColorStop(0,'rgba(200,160,0,.08)');v.addColorStop(1,'rgba(160,100,0,.25)');ctx.fillStyle=v;ctx.fillRect(0,0,W,playH);drawClouds(parX,'#e0c060',0.18,0.55);}
  if(th.bg==='icehazeU'){const u=ctx.createLinearGradient(0,0,0,playH);u.addColorStop(0,'rgba(40,200,160,.05)');u.addColorStop(1,'rgba(20,160,130,.12)');ctx.fillStyle=u;ctx.fillRect(0,0,W,playH);}
}
function fr(s){const x=Math.sin(s+1)*1e5;return x-Math.floor(x);}
const STARS=Array.from({length:110},(_,i)=>({x:fr(i*3),y:fr(i*3+1),r:fr(i*3+2)*1.3+.35,ts:i*.4}));
const CLOUDS=Array.from({length:14},(_,i)=>({wx:i*520+fr(i*9)*180,wy:.07+fr(i*9+1)*.28,sz:52+fr(i*9+2)*38,al:.38+fr(i*9+3)*.38}));
function drawStars(){
  ctx.save();ctx.fillStyle='#fff';const t=performance.now()*.001;
  STARS.forEach(s=>{ctx.globalAlpha=.22+.6*Math.abs(Math.sin(t*.5+s.ts));ctx.beginPath();ctx.arc(s.x*W,s.y*playH*.9,s.r,0,Math.PI*2);ctx.fill();});
  ctx.restore();
}
function drawRings(){
  ctx.save();const cx=W*.5,cy=playH*1.4;
  [160,195,238].forEach(r=>{ctx.strokeStyle='rgba(190,168,90,.18)';ctx.lineWidth=r*.08;ctx.beginPath();ctx.ellipse(cx,cy,r*2.9,r*.36,-.07,Math.PI*1.1,Math.PI*1.9);ctx.stroke();});
  ctx.restore();
}
function drawClouds(parX,col,par,alpha){
  ctx.save();const TILE=7280;
  CLOUDS.forEach(c=>{
    const sx=((c.wx-parX*par)%TILE+TILE)%TILE-120;if(sx>W+150) return;
    ctx.globalAlpha=c.al*alpha;ctx.fillStyle=col;ctx.beginPath();
    ctx.arc(sx,c.wy*playH,c.sz*.9,0,Math.PI*2);
    ctx.arc(sx+c.sz*.65,c.wy*playH-c.sz*.22,c.sz*.65,0,Math.PI*2);
    ctx.arc(sx-c.sz*.55,c.wy*playH-c.sz*.12,c.sz*.55,0,Math.PI*2);ctx.fill();
  });
  ctx.restore();
}
function drawBands(s){ctx.save();s.forEach(([y,h,c,a])=>{ctx.globalAlpha=a;ctx.fillStyle=c;ctx.fillRect(0,y*playH,W,h*playH);});ctx.restore();}
function drawPlasma(parX){
  ctx.save();
  for(let i=0;i<5;i++){
    const x=((fr(i*13)*W*2-parX*.07+i*380)%(W+300)+W+300)%(W+300)-150,y=fr(i*13+1)*playH,r=65+fr(i*13+2)*95;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,170,0,.18)');g.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawCraters(parX){
  ctx.save();ctx.strokeStyle='rgba(110,110,110,.13)';ctx.lineWidth=2;
  [{x:.15,y:.3,r:48},{x:.52,y:.62,r:30},{x:.76,y:.22,r:60},{x:.36,y:.74,r:36}].forEach(c=>{
    const sx=((c.x*W*3-parX*.04)%(W*3+200)+W*3+200)%(W*3+200)-100;
    ctx.beginPath();ctx.arc(sx,c.y*playH,c.r,0,Math.PI*2);ctx.stroke();
    ctx.globalAlpha=.06;ctx.fillStyle='#000';ctx.beginPath();ctx.arc(sx,c.y*playH,c.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  });
  ctx.restore();
}
function drawGnd(th,K){
  const gy=K.sy(0);if(gy>H+2) return;
  ctx.save();
  if(!th.gnd){
    const g=ctx.createLinearGradient(0,gy-35,0,Math.max(H,gy+40));
    g.addColorStop(0,'rgba(30,14,4,0)');g.addColorStop(.45,'rgba(30,14,4,.9)');g.addColorStop(1,'#0e0500');
    ctx.fillStyle=g;ctx.fillRect(0,gy-35,W,Math.max(H-gy,40)+35);ctx.restore();return;
  }
  const gh=Math.max(H-gy,40);
  ctx.fillStyle=th.gnd;ctx.fillRect(0,gy,W,gh);
  const off=Math.floor(K.camX*K.z);
  if(th.gndStyle==='grass'){
    ctx.strokeStyle='#275820';ctx.lineWidth=2;
    for(let x=0;x<W;x+=7){const h=3+fr((x+off)*.05)*7;ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+1,gy-h);ctx.stroke();}
  } else if(th.gndStyle==='rocky'||th.gndStyle==='lunar'){
    ctx.fillStyle=th.oSh||'#333';
    for(let x=-(off%18);x<W;x+=18){const h=2+fr(Math.floor((x+off)/18)*.07)*5;ctx.fillRect(x,gy,12,h);}
  } else if(th.gndStyle==='plasma'){
    const g=ctx.createLinearGradient(0,gy,0,gy+gh);g.addColorStop(0,'#ff6600');g.addColorStop(1,'#990800');
    ctx.fillStyle=g;ctx.fillRect(0,gy,W,gh);ctx.fillStyle='rgba(255,220,40,.45)';ctx.fillRect(0,gy,W,3);
  } else if(th.gndStyle==='clouds'){
    const g=ctx.createLinearGradient(0,gy-18,0,gy+gh);g.addColorStop(0,'rgba(140,115,45,0)');g.addColorStop(.4,'rgba(120,100,38,.9)');g.addColorStop(1,'#4a3810');
    ctx.fillStyle=g;ctx.fillRect(0,gy-18,W,gh+18);
  }
  ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(0,gy,W,2);
  ctx.restore();
}
function drawCeiling(K){
  const y=K.sy(C.top);if(y<-2||y>H) return;
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.setLineDash([6,6]);ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5);ctx.stroke();ctx.restore();
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10]) if(m*p>=raw) return m*p;return 10*p;}
function drawRuler(K){
  const visTop=viewMode==='fit'?C.top:(K.cy+playH/(2*K.z)),visBot=viewMode==='fit'?0:(K.cy-playH/(2*K.z));
  const step=niceStep((visTop-visBot)/7);
  ctx.save();
  ctx.fillStyle='rgba(20,24,21,.55)';ctx.fillRect(0,0,52,H);
  ctx.strokeStyle='rgba(232,228,217,.7)';ctx.fillStyle='rgba(232,228,217,.9)';ctx.lineWidth=1;
  ctx.font='11px "Courier Prime",monospace';ctx.textAlign='right';
  for(let m=Math.max(0,Math.ceil(visBot/step)*step);m<=Math.min(C.top,visTop)+1e-9;m+=step){
    const y=K.sy(m);if(y<8||y>H-4) continue;
    ctx.beginPath();ctx.moveTo(44,y+.5);ctx.lineTo(52,y+.5);ctx.stroke();
    ctx.fillText(step<1?(m*100).toFixed(0)+' cm':(Number.isInteger(Math.round(m*1000)/1000)?Math.round(m):m.toFixed(1))+' m',42,y+4);
  }
  for(let m=Math.max(0,Math.ceil(visBot/(step/5))*(step/5));m<=Math.min(C.top,visTop);m+=step/5){
    const y=K.sy(m);if(y<0||y>H) continue;ctx.beginPath();ctx.moveTo(48,y+.5);ctx.lineTo(52,y+.5);ctx.stroke();
  }
  ctx.restore();
}
function drawMiniMap(){
  const x=W-18,y0=46,h=playH-70;
  ctx.save();
  ctx.fillStyle='rgba(20,24,21,.6)';ctx.fillRect(x-6,y0-6,12,h+12);
  ctx.strokeStyle='rgba(232,228,217,.4)';ctx.strokeRect(x-3,y0,6,h);
  const K=cam(),vt=(K.cy+HW/2)/C.top,vb=(K.cy-HW/2)/C.top;
  ctx.fillStyle='rgba(60,163,174,.35)';ctx.fillRect(x-3,y0+h*(1-Math.min(1,vt)),6,h*(Math.min(1,vt)-Math.max(0,vb)));
  ctx.fillStyle='#F5C842';ctx.beginPath();ctx.arc(x,y0+h*(1-py/C.top),3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(232,228,217,.8)';ctx.font='10px "Courier Prime",monospace';ctx.textAlign='right';
  ctx.fillText(fmtM(C.top),x-9,y0+8);ctx.fillText('0',x-9,y0+h);
  ctx.restore();
}

// ── OBSTACLES ──
function drawObs(th,K){
  const ow=C.colW*K.z,topY=K.sy(C.top),botY=K.sy(0);
  C.obs.forEach((o,i)=>{
    const sx=K.sx(o.x);if(sx+ow<-8||sx-ow>W+8) return;
    const gt=K.sy(o.yc+C.gap/2),gb=K.sy(o.yc-C.gap/2);
    ctx.save();if(passed.has(i)) ctx.globalAlpha=.42;
    const f={pipe:drawPipe,rocky:drawRocky,gas:drawGas,ice:drawIce,flare:drawFlare}[th.obs];
    f(sx,gt,gb,th,ow,topY,botY);
    ctx.restore();
  });
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function drawPipe(sx,gt,gb,th,OW,T,B){
  const hw=OW/2,cH=Math.min(14,OW*.22),ce=Math.min(7,OW*.1);
  ctx.fillStyle=th.oSh;ctx.fillRect(sx-hw,T,OW,gt-T);
  ctx.fillStyle=th.oFill;ctx.fillRect(sx-hw+2,T,OW-4,gt-T-1);
  ctx.fillStyle=th.oHi;rr(sx-hw-ce,gt-cH,OW+ce*2,cH,4);ctx.fill();
  ctx.fillStyle=th.oSh;ctx.fillRect(sx-hw,gb,OW,B-gb);
  ctx.fillStyle=th.oFill;ctx.fillRect(sx-hw+2,gb+1,OW-4,B-gb);
  ctx.fillStyle=th.oHi;rr(sx-hw-ce,gb,OW+ce*2,cH,4);ctx.fill();
}
function drawRocky(sx,gt,gb,th,OW,T,B){
  const hw=OW/2,tip=Math.min(16,OW*.25);
  function rock(y1,y2,down){
    ctx.fillStyle=th.oFill;ctx.beginPath();ctx.moveTo(sx-hw,y1);ctx.lineTo(sx+hw,y1);ctx.lineTo(sx+hw,y2);
    const N=5;for(let i=N;i>=0;i--){const x=sx-hw+OW*(i/N);ctx.lineTo(x,down?(i%2===0?y2:y2-tip):(i%2===0?y2:y2+tip));}
    ctx.closePath();ctx.fill();
    ctx.save();ctx.globalAlpha*=.28;ctx.fillStyle=th.oHi;ctx.fillRect(sx-hw+2,Math.min(y1,y2)+4,Math.max(2,OW*.08),Math.abs(y2-y1)-10);ctx.restore();
  }
  rock(T,gt,true);rock(B,gb,false);
}
function drawGas(sx,gt,gb,th,OW,T,B){
  const hw=OW/2,t=performance.now()*.001,amp=Math.min(7,OW*.1);
  function col(y1,y2){
    const g=ctx.createLinearGradient(sx-hw,0,sx+hw,0);
    g.addColorStop(0,th.oSh);g.addColorStop(.4,th.oFill);g.addColorStop(.6,th.oHi);g.addColorStop(1,th.oSh);ctx.fillStyle=g;
    const N=Math.max(4,Math.min(200,Math.floor(Math.abs(y2-y1)/10)));
    ctx.beginPath();ctx.moveTo(sx-hw,y1);ctx.lineTo(sx+hw,y1);
    for(let i=1;i<=N;i++){const y=y1+(y2-y1)*i/N;ctx.lineTo(sx+hw+Math.sin(y*.07+t)*amp,y);}
    ctx.lineTo(sx-hw,y2);
    for(let i=N-1;i>=0;i--){const y=y1+(y2-y1)*i/N;ctx.lineTo(sx-hw+Math.sin(y*.07+t+Math.PI)*amp,y);}
    ctx.closePath();ctx.fill();
  }
  col(T,gt);col(gb,B);
}
function drawIce(sx,gt,gb,th,OW,T,B){
  const hw=OW/2,tp=Math.min(17,OW*.26);
  function col(y1,y2,down){
    ctx.fillStyle=th.oFill;ctx.beginPath();
    if(down){ctx.moveTo(sx-hw,y1);ctx.lineTo(sx+hw,y1);ctx.lineTo(sx+hw,y2-tp);ctx.lineTo(sx+hw*.5,y2);ctx.lineTo(sx,y2-tp*.4);ctx.lineTo(sx-hw*.5,y2);ctx.lineTo(sx-hw,y2-tp);}
    else{ctx.moveTo(sx-hw,y1);ctx.lineTo(sx+hw,y1);ctx.lineTo(sx+hw,y2+tp);ctx.lineTo(sx+hw*.5,y2);ctx.lineTo(sx,y2+tp*.4);ctx.lineTo(sx-hw*.5,y2);ctx.lineTo(sx-hw,y2+tp);}
    ctx.closePath();ctx.fill();
    ctx.save();ctx.globalAlpha*=.4;ctx.fillStyle=th.oHi;ctx.fillRect(sx-hw+OW*.08,Math.min(y1,y2)+tp,Math.max(2,OW*.09),Math.max(0,Math.abs(y2-y1)-tp*2));ctx.restore();
  }
  col(T,gt,true);col(B,gb,false);
}
function drawFlare(sx,gt,gb,th,OW,T,B){
  const hw=OW/2,t=performance.now()*.0022;
  function col(y1,y2,dir){
    const g=ctx.createLinearGradient(sx-hw,0,sx+hw,0);g.addColorStop(0,th.oSh);g.addColorStop(.5,th.oFill);g.addColorStop(1,th.oSh);
    ctx.fillStyle=g;ctx.fillRect(sx-hw,Math.min(y1,y2),OW,Math.abs(y2-y1));
    const tip=y2+dir*(12+Math.sin(t*2+sx*.012)*9);
    ctx.save();ctx.globalAlpha*=.88;ctx.fillStyle=th.oHi;
    ctx.beginPath();ctx.moveTo(sx-hw,y2);ctx.quadraticCurveTo(sx-hw*.35,tip,sx,y2+dir*5);ctx.quadraticCurveTo(sx+hw*.35,tip,sx+hw,y2);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  col(T,gt,1);col(B,gb,-1);
}
function drawFinish(K){
  const sx=K.sx(C.finish);if(sx<-10||sx>W+10) return;
  const t=Math.max(0,K.sy(C.top)),b=Math.min(H,K.sy(0));
  ctx.save();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2.5;ctx.setLineDash([9,9]);
  ctx.beginPath();ctx.moveTo(sx,t);ctx.lineTo(sx,b);ctx.stroke();ctx.setLineDash([]);
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){ctx.fillStyle=(r+c)%2===0?'#fff':'#111';ctx.fillRect(sx+c*10,t+16+r*10,10,10);}
  ctx.restore();
}

// ── ASTRONAUT ── (drawn to scale when ≥ 11 px radius, otherwise as a fixed-size marker)
function drawAstro(K,now){
  let y=py;if(phase==='start') y=C.top*.5+Math.sin(now*.0018)*C.top*.02;
  const X=K.sx(px),Y=K.sy(y),BR=Math.max(RA*K.z,11),s=BR/13;
  const ang=Math.max(-.44,Math.min(.72,-vy/BURST*.5));
  ctx.save();ctx.translate(X,Y);ctx.rotate(phase==='playing'?ang:0);ctx.scale(s,s);
  const R=13;
  ctx.fillStyle='#18468a';ctx.fillRect(-R*1.95,-5,R*.9,10);ctx.fillRect(R*.95,-5,R*.9,10);
  ctx.fillStyle='#2c6ec2';ctx.fillRect(-R*1.95,-5,R*.9,4);ctx.fillRect(R*.95,-5,R*.9,4);
  ctx.fillStyle='#ccd4e4';ctx.beginPath();ctx.ellipse(0,0,R,R*.8,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(80,100,140,.4)';ctx.beginPath();ctx.ellipse(3,3,R*.72,R*.54,.3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#1a3a78';ctx.beginPath();ctx.ellipse(2,-1,R*.44,R*.34,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(120,190,255,.35)';ctx.beginPath();ctx.ellipse(-1,-3,R*.22,R*.14,-.25,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#9090a8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-R*.8);ctx.lineTo(0,-R*.8-9);ctx.stroke();
  ctx.fillStyle='#ff2828';ctx.beginPath();ctx.arc(0,-R*.8-9,2.5,0,Math.PI*2);ctx.fill();
  if(phase==='playing'&&vy>BURST*.3){
    ctx.globalAlpha=Math.min(1,vy/BURST)*.9;
    const tg=ctx.createRadialGradient(0,R,0,0,R+12,18);tg.addColorStop(0,'#ffaa00');tg.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=tg;ctx.beginPath();ctx.arc(0,R+5,18,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}

// ══════════════════════════════════════════
//  LOOP
// ══════════════════════════════════════════
function loop(now){
  const dt=lastFrame==null?0:(now-lastFrame)/1000;lastFrame=now;
  advance(dt);updateHud();draw(now);
  requestAnimationFrame(loop);
}
window.addEventListener('load',init);
</script>
