<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radiometric Dating &amp; Hotspots · ESSRT p. 12</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.ttl { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #A6A499; line-height: 1.1; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; line-height: 1.1; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 13px; white-space: nowrap; }
.tabs .ls { display: none; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.exp .cc-btn.gone { display: none; }
.pngwrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.menu.open { display: flex; }
.menu button { all: unset; cursor: pointer; font-family: var(--font-body); font-size: 14px; color: var(--color-text-primary); padding: 8px 12px; border-radius: 4px; }
.menu button:hover, .menu button:focus-visible { background: var(--color-surface); color: var(--tool-accent); }
.menu button.gone { display: none; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#cv.grab { cursor: grab; } #cv.drag { cursor: grabbing; } #cv.hot { cursor: pointer; } #cv.ew { cursor: ew-resize; }
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: stretch; align-self: stretch; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 2px; }
.play { min-width: 98px; padding: 9px 12px; font-size: 15px; font-weight: 700; color: var(--color-text-primary); white-space: nowrap; }
.snap { min-width: 0; padding: 5px 10px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.12; gap: 1px; color: var(--color-text-primary); }
.snap b { font-family: var(--font-display); font-size: 17px; font-weight: 700; white-space: nowrap; }
.snap span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active span { color: var(--color-bg); }
.snap.gold.is-active { background: #E8B84A; border-color: #E8B84A; }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider.gold input { accent-color: #E8B84A; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 62px; text-align: right; white-space: nowrap; }
.seg { display: flex; align-self: stretch; }
.seg .cc-segmented-btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.tgl { padding: 6px 12px; font-size: 13px; background: var(--color-surface); white-space: nowrap; align-self: stretch; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.big-act { align-self: stretch; display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap;
  font-family: var(--font-body); font-weight: 700; font-size: 15px; background: var(--tool-accent); border: 1px solid var(--tool-accent); color: var(--color-bg); }
.big-act:hover { filter: brightness(1.1); }

/* floating chips over the stage */
.chip { position: absolute; display: flex; gap: 6px; z-index: 4; }
.chip .cc-segmented-btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.chip .cc-segmented { background: var(--color-surface); }
.chip .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #A6A499; align-self: center; margin-right: 2px; }

/* page tab: markers */
#pmarks { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.mk { position: absolute; transform: translate(-50%, -50%); padding: 0; border: 0; background: none; cursor: pointer; pointer-events: auto; }
.mk .d { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--c); border: 2px solid #FFF; box-shadow: 0 1px 4px rgba(0,0,0,.55);
  color: #14181A; font-family: var(--font-body); font-size: 13px; font-weight: 800; line-height: 1; transition: box-shadow .15s ease, opacity .2s ease; }
.mk:hover .d { box-shadow: 0 0 0 4px rgba(255,255,255,.5), 0 1px 4px rgba(0,0,0,.55); }
.mk.on .d { box-shadow: 0 0 0 5px rgba(255,255,255,.9), 0 1px 6px rgba(0,0,0,.6); }
.mk.faded .d { opacity: .45; }
.mk.off { display: none; }
.mk:focus-visible .d { outline: 3px solid #FFF; outline-offset: 2px; }
.zoomer { position: absolute; right: 10px; bottom: 10px; z-index: 4; display: flex; align-items: center; gap: 4px;
  background: rgba(38,43,39,.94); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; }
.tbtn { background: var(--color-surface-2); border: 1px solid var(--color-border-hover); color: var(--color-text-primary);
  font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.tbtn:hover:not(:disabled) { border-color: var(--tool-accent); }
.tbtn:disabled { opacity: .35; cursor: default; }
.tbtn:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 2px; }
.zb { width: 30px; padding: 5px 0; font-family: var(--font-mono); font-size: 15px; text-align: center; }
.zpct { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 46px; text-align: center; }
.phint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 4; font-size: 13.5px; color: var(--color-text-primary);
  background: rgba(30,35,32,.92); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 6px 12px; white-space: nowrap;
  transition: opacity .5s ease; pointer-events: none; }
.phint.gone { opacity: 0; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: #11140F; color: var(--color-text-primary); font: 600 13px var(--font-body);
  padding: 4px 9px; border-radius: 4px; border: 1px solid var(--color-border-hover); opacity: 0; transition: opacity .12s; white-space: nowrap; }
.tip.on { opacity: 1; }

/* page control bar */
.tour { flex: 0 0 auto; min-width: 150px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: stretch;
  background: var(--tool-accent); border: 1px solid var(--tool-accent); color: var(--color-bg); font-weight: 700; font-size: 15px;
  padding: 6px 16px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.tour:hover { filter: brightness(1.1); }
.tour.invite { animation: invite 2.2s ease-out infinite; }
@keyframes invite { 0% { box-shadow: 0 0 0 0 rgba(60,163,174,.55); } 70% { box-shadow: 0 0 0 10px rgba(60,163,174,0); } 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } }
.stepper { display: flex; align-items: stretch; gap: 4px; align-self: stretch; min-width: 0; flex: 1 1 auto; }
.nb { width: 36px; padding: 0; font-size: 20px; line-height: 1; }
.stepinfo { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1 1 auto; padding: 4px 12px;
  background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.stepinfo b { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: #A6A499; font-weight: 700; white-space: nowrap; }
.stepinfo i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thru { align-self: stretch; }
.thru.on { background: rgba(60,163,174,0.16); border-color: var(--tool-accent); }
.mode { align-self: stretch; display: inline-flex; align-items: center; gap: 9px; padding: 6px 15px; font-size: 15px; font-weight: 700; white-space: nowrap;
  border-radius: var(--radius-md); cursor: pointer; font-family: var(--font-body); color: var(--color-text-primary);
  background: var(--color-surface-2); border: 1.5px solid var(--mc); }
.mode::before { content: ''; flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--mc); }
.mode:hover { background: color-mix(in srgb, var(--mc) 18%, var(--color-surface-2)); }
.mode.on { background: var(--mc); color: #14181A; }
.mode.on::before { background: #14181A; border-color: #14181A; }
.mode.probe { --mc: #E8B84A; }
.tsw .cc-segmented-btn { padding: 6px 12px; font-size: 14px; font-weight: 600; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.k-eb { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); min-height: 28px; flex: none; }
.k-eb .sw { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.k-title { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.15; margin: 10px 0 6px; color: var(--color-text-primary); flex: none; }
.k-t { font-size: 15px; line-height: 1.45; color: var(--color-text-primary); margin: 0 0 10px; flex: none; }
.k-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #A6A499; margin: 0 0 3px; flex: none; }
.k-pg { font-size: 14px; line-height: 1.45; color: var(--color-text-secondary); margin: 0 0 12px; border-left: 2px solid var(--c, var(--tool-accent)); padding-left: 9px; flex: none; }
.k-act { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 9px 12px; border-radius: var(--radius-md); flex: none;
  background: var(--tool-accent); border: 1px solid var(--tool-accent); color: var(--color-bg); font-weight: 700; font-size: 15px; cursor: pointer;
  text-decoration: none; margin: 2px 0 7px; font-family: var(--font-body); }
.k-act:hover { filter: brightness(1.1); }
.k-act.alt { background: var(--color-surface-2); color: var(--color-text-primary); border-color: var(--tool-accent); }
.k-back { align-self: flex-start; background: none; border: 0; color: var(--tool-accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; margin-top: 2px; font-family: var(--font-body); flex: none; }
.k-back:hover { text-decoration: underline; }
.k-list { display: flex; flex-direction: column; gap: 1px; margin: 6px 0 4px; flex: none; }
.k-sec { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #A6A499; margin: 10px 0 4px; flex: none; }
.k-it { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: 1px solid transparent; color: var(--color-text-secondary);
  font-size: 14px; text-align: left; padding: 3px 6px; border-radius: var(--radius-sm); cursor: pointer; font-family: var(--font-body); }
.k-it:hover { background: var(--color-surface-2); color: var(--color-text-primary); }
.k-it .bd { width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: #14181A; font-size: 12px; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center; flex: none; border: 1.5px solid rgba(255,255,255,.8); }
.k-it .bd.sq { border-radius: 4px; width: 14px; height: 14px; margin: 0 4px; }
.k-it .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.k-it .vl { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.k-it.dim { opacity: .45; }
.k-it.cur { background: rgba(232,184,74,.12); color: var(--color-text-primary); }
.k-it.static { cursor: default; } .k-it.static:hover { background: none; color: var(--color-text-secondary); }
.k-rows { margin: 4px 0 10px; flex: none; }
.k-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--color-border); }
.k-row:first-child { border-top: 1px solid var(--color-border); }
.k-row .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: #A6A499; flex: none; }
.k-row .v { font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--color-text-primary); text-align: right; line-height: 1.2; }
.k-row .v.sm { font-family: var(--font-body); font-size: 14px; font-weight: 600; }
.k-big { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1.1; color: var(--color-text-primary); margin: 10px 0 2px; flex: none; }
.k-sub { font-size: 14px; color: var(--color-text-secondary); margin: 0 0 8px; flex: none; }
.k-note { font-size: 14px; line-height: 1.45; color: var(--color-text-secondary); margin: 6px 0 8px; flex: none; }
.k-chart { position: relative; flex: none; margin: 4px 0 8px; background: #1B1F1C; border: 1px solid var(--color-border); border-radius: 5px; }
.k-chart canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.k-chart.drag canvas { cursor: ew-resize; }
.k-src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); padding-top: 8px; line-height: 1.4; margin-top: auto; flex: none; }
.k-st { font-family: var(--font-body); font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 4px; color: #14181A; white-space: nowrap; }
.st-ok { background: #7FD3A0; } .st-young { background: #E8C36A; } .st-old { background: #F08A6E; }
.k-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 4px; margin: 4px 0 2px; flex: none; }
.k-grid .k-it { white-space: nowrap; overflow: hidden; }
@media (max-height: 700px) {
  .k-title { font-size: 21px; margin: 8px 0 4px; }
  .k-t { font-size: 14.5px; margin-bottom: 8px; }
  .k-it { padding: 1px 6px; font-size: 13.5px; }
  .k-it .bd { width: 20px; height: 20px; font-size: 11.5px; }
  .k-row { padding: 3px 0; }
  .k-row .v { font-size: 17px; }
  .k-big { font-size: 30px; margin-top: 6px; }
  .k-act { padding: 7px 12px; margin-bottom: 5px; }
  .k-src { padding-top: 4px; }
  .k-sec { margin: 6px 0 2px; }
}
@media (max-height: 640px) { .k-it { padding: 0 6px; } .k-eb { min-height: 24px; padding-bottom: 4px; } .k-src.ix { display: none; } .k-title { margin: 6px 0 3px; } .k-big { font-size: 28px; margin-top: 4px; } .k-sub { margin-bottom: 4px; } .k-act { padding: 6px 12px; margin-bottom: 4px; } .k-list { margin: 3px 0 2px; gap: 0; } .k-rows { margin: 2px 0 6px; } .k-chart { margin: 2px 0 6px; } }
@media (max-height: 580px) { .k-src { display: none; } }

/* narrow widths: drop words, never shrink type */
.tour .ls, .mode .ls, .thru .ls, .big-act .ls { display: none; }
@media (max-width: 1500px) { .tabs .lf { display: none; } .tabs .ls { display: inline; } }
@media (max-width: 1300px) { .snap span { display: none; } }
@media (max-width: 1240px) {
  .main { grid-template-columns: minmax(0, 1fr) 262px; }
  .tour { min-width: 92px; } .tour .lb, .thru .lb, .mode .lb, .big-act .lb { display: none; } .tour .ls, .mode .ls, .big-act .ls { display: inline; }
  .seg .lf { display: none; } .seg .ls { display: inline; }
}
.seg .ls { display: none; }
@media (max-width: 1140px) { .eyebrow { display: none; } .slider .sv { display: none; } }
@media (prefers-reduced-motion: reduce) { .tour.invite { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><span class="eyebrow">ESSRT 2026 &middot; p.&nbsp;12</span><h1 class="cc-title">Radiometric Dating &amp; Hotspots</h1></div>
    <div class="cc-segmented tabs" id="tabs" role="tablist">
      <button class="cc-segmented-btn" data-tab="page" role="tab"><span class="lf">Printed page</span><span class="ls">Page</span></button>
      <button class="cc-segmented-btn" data-tab="dating" role="tab"><span class="lf">Radiometric dating</span><span class="ls">Dating</span></button>
      <button class="cc-segmented-btn" data-tab="hotspots" role="tab"><span class="lf">Hotspots</span><span class="ls">Hotspots</span></button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <div class="pngwrap">
        <button class="cc-btn" id="bPNG" aria-haspopup="true" aria-expanded="false">↓ PNG ▾</button>
        <div class="menu" id="pngMenu" role="menu">
          <button data-png="all" role="menuitem">Whole tool</button>
          <button data-png="page" role="menuitem" id="pngPage">Full page</button>
          <button data-png="scene" role="menuitem" id="pngScene">Map</button>
          <button data-png="card" role="menuitem">Card</button>
        </div>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div id="pmarks"></div>
        <div class="chip" id="chipFilt" style="right:10px;top:10px">
          <div class="cc-segmented" id="filtSeg">
            <button class="cc-segmented-btn is-active" data-f="all">All</button>
            <button class="cc-segmented-btn" data-f="on">On a boundary</button>
            <button class="cc-segmented-btn" data-f="near">Near one</button>
            <button class="cc-segmented-btn" data-f="in">Inside a plate</button>
          </div>
        </div>
        <div class="chip" id="chipView" style="left:10px;top:10px">
          <div class="cc-segmented" id="viewSeg">
            <button class="cc-segmented-btn is-active" data-v="world">World map</button>
            <button class="cc-segmented-btn" data-v="chain">Build the chain</button>
          </div>
          <div class="cc-segmented" id="trackSeg">
            <button class="cc-segmented-btn" data-k="hawaii">Hawaii</button>
            <button class="cc-segmented-btn" data-k="yellowstone">Yellowstone</button>
          </div>
        </div>
        <div class="zoomer" id="zoomer"><button class="tbtn zb" id="zOut" aria-label="Zoom out">&minus;</button><span class="zpct" id="zPct">100%</span><button class="tbtn zb" id="zIn" aria-label="Zoom in">+</button><button class="tbtn" id="zFit">Fit</button></div>
        <div class="phint" id="phint">Scroll or pinch to zoom &middot; drag to pan &middot; click a row, a hotspot or a marker</div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
