<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>U.S. Annual Precipitation | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<script src="threadex-roster.js"></script>
<style>
  :root { --tool-accent: var(--accent-climate); --cc-card-width: 330px; }
  [hidden] { display: none !important; }

  .cc-app { max-width: 1760px; margin: 0 auto; }
  .cc-scene-head, .lg-strip, .note-strip, .cc-scene-bar { flex-shrink: 0; }

  /* ── Top row ── */
  .exp { display: flex; gap: 6px; }
  .exp .cc-btn { padding: 8px 12px; font-size: 14px; font-weight: 700; }
  .cc-btn.is-error { border-color: #C05050; color: #E07070; }
  .cc-btn.is-ok { border-color: #3A9E50; color: #5CC070; }
  .vtabs { display: flex; gap: 0; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); overflow: hidden; flex-shrink: 0; }
  .vtabs button { background: transparent; border: none; border-right: 1px solid var(--color-border); color: var(--color-text-secondary);
    font-family: var(--font-body); font-size: 15px; font-weight: 700; padding: 8px 16px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  .vtabs button:last-child { border-right: none; }
  .vtabs button:hover { color: var(--color-text-primary); background: rgba(232,228,217,.05); }
  .vtabs button.is-active { background: var(--tool-accent); color: #1E2320; }

  /* Station finder (shared pattern) */
  .finder-group { position: relative; flex: 0 0 auto; display: flex; align-items: stretch; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); background: var(--color-surface); transition: border-color .15s; }
  .finder-group:focus-within { border-color: var(--tool-accent); }
  .finder-group .search-icon { display: flex; align-items: center; padding-left: 12px; color: var(--color-text-muted); font-size: 16px; pointer-events: none; }
  .finder-group .search-input { width: 230px; background: transparent; border: none; border-radius: 0; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
  .finder-group .search-input::placeholder { color: var(--color-text-muted); }
  .finder-sep { width: 1px; align-self: stretch; margin: 7px 0; background: var(--color-border); }
  .finder-group .locate-btn { border: none; border-radius: 0; background: transparent; white-space: nowrap; font-size: 14px; padding: 6px 12px; color: var(--color-text-primary); }
  .locate-btn.loading { opacity: .5; pointer-events: none; }
  .dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; min-width: 340px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 300px; overflow-y: auto; z-index: 300; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .dropdown.open { display: block; }
  .d-item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); transition: background .1s; }
  .d-item:last-child { border-bottom: none; }
  .d-item:hover, .d-item.hi { background: rgba(208,132,37,.18); }
  .d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 50px; flex-shrink: 0; }
  .d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .d-item .d-st { color: var(--color-text-muted); font-size: 13px; width: 22px; text-align: right; }
  .d-item .d-por, .d-item .d-dist { color: var(--color-text-secondary); font-size: 12px; width: 50px; flex-shrink: 0; text-align: right; }
  .d-item .d-dist { color: var(--tool-accent); }

  /* ── Scene head ── */
  .cc-scene-head { gap: 6px 22px; padding: 8px 14px 7px; align-items: flex-end; }
  .hd-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hm-heading { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
  .hm-period { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
  .ro-row { display: flex; align-items: flex-end; gap: 4px 22px; flex-wrap: wrap; margin-left: auto; }
  .ro { display: flex; flex-direction: column; min-width: 0; }
  .ro-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .ro-l i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .ro-v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; }
  .ro-n { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }

  /* ── Legend + note strips ── */
  .lg-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; padding: 6px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 32px; }
  .lg-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sw-line { width: 22px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .sw-line.thick { border-top-width: 3px; }
  .sw-line.dash { border-top-style: dashed; }
  .sw-band { width: 22px; height: 12px; flex-shrink: 0; position: relative; background: rgba(232,228,217,.10); }
  .sw-band::after { content: ''; position: absolute; left: 0; right: 0; top: 3px; bottom: 3px; background: rgba(232,228,217,.16); }
  .sw-grad { width: 84px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .sw-box { width: 14px; height: 12px; flex-shrink: 0; border: 1.5px solid; }
  .sw-hatch { width: 14px; height: 12px; flex-shrink: 0; background: repeating-linear-gradient(135deg, rgba(232,228,217,.32) 0 1.5px, transparent 1.5px 4px); border: 1px solid rgba(232,228,217,.25); }
  .dec-chip { font-family: var(--font-mono); font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 10px; border: 1.5px solid; background: transparent; cursor: pointer; line-height: 1.5; }
  .dec-chip.is-on { color: #1E2320 !important; }
  .note-strip { padding: 5px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: #D9A441; line-height: 1.5; }

  /* ── Stage ── */
  .cc-scene-stage { overflow: hidden; }
  #cv, #ov { position: absolute; left: 0; top: 0; display: block; }
  #ov { cursor: crosshair; outline: none; touch-action: pan-y; }
  .state-overlay { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px;
    background: #262B27; color: var(--color-text-secondary); font-family: var(--font-mono); font-size: 14px; text-align: center; }
  .state-overlay .err { color: #E07070; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--color-border); border-top-color: var(--tool-accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tbl-wrap { position: absolute; inset: 0; z-index: 2; overflow: auto; background: #262B27; }
  table.yt { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; }
  .yt th { position: sticky; top: 0; background: var(--color-surface-2); padding: 8px 12px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); font-weight: 400;
    text-align: right; border-bottom: 1px solid var(--color-border-hover); cursor: pointer; user-select: none; white-space: nowrap; }
  .yt th:first-child, .yt td:first-child { text-align: left; }
  .yt th:hover { color: var(--color-text-primary); }
  .yt th .ar { display: inline-block; width: 10px; font-size: 10px; margin-left: 3px; }
  .yt td { padding: 5px 12px; border-bottom: 1px solid rgba(232,228,217,.06); color: var(--color-text-primary); text-align: right; white-space: nowrap; }
  .yt tr { cursor: pointer; }
  .yt tbody tr:hover td { background: rgba(232,228,217,.04); }
  .yt tr.sel td { background: rgba(208,132,37,.14); }
  .yt tr.inc td { color: var(--color-text-muted); }
  .yt .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-muted); margin-left: 6px; }
  .yt .pc { display: inline-block; min-width: 46px; padding: 0 5px; border-radius: 3px; color: #1E2320; font-weight: 700; text-align: center; }

  /* ── Control bar ── */
  .cc-scene-bar { flex-wrap: wrap; gap: 8px 10px; min-height: 0; padding: 7px 12px; }
  .grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .grp-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-right: 3px; white-space: nowrap; }
  .grp .cc-btn { font-size: 14px; padding: 6px 11px; color: var(--color-text-primary); }
  .grp .cc-btn:not(.is-active) { color: var(--color-text-secondary); }
  .grp .cc-btn.is-active { color: #F2EEE3; }
  .grp .cc-btn:disabled { opacity: .35; cursor: not-allowed; }
  .grp .cc-select { font-size: 14px; font-weight: 600; padding: 6px 8px; width: auto; min-width: 104px; }
  .grp #yr-sel { width: 136px; min-width: 0; }
  .day-in { width: 52px; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: var(--color-text-primary); font-family: var(--font-mono); font-size: 14px; padding: 5px 6px; }

  /* ── Rail card ── */
  .cc-card { gap: 0; padding: 10px 14px; overflow-x: hidden; }
  .rd-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
  .rd-date { font-family: var(--font-display); font-weight: 700; font-size: 22px; color: var(--color-text-primary); line-height: 1.1; }
  .rd-tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
  .rd-tag button { background: none; border: 1px solid var(--tool-accent); color: var(--tool-accent); border-radius: 10px; font-family: var(--font-mono); font-size: 12px; padding: 0 6px; margin-left: 4px; cursor: pointer; }
  .rd-hint { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); white-space: nowrap; }
  table.rd-t { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; margin: 4px 0 2px; flex-shrink: 0; table-layout: fixed; }
  .rd-t col.l { width: 36%; }
  .rd-t td:last-child { overflow: hidden; text-overflow: ellipsis; }
  .rd-t td { padding: 3px 0; color: var(--color-text-primary); text-align: right; white-space: nowrap; border-top: 1px solid rgba(232,228,217,.06); }
  .rd-t tr:first-child td { border-top: none; }
  .rd-t td:first-child { text-align: left; color: var(--color-text-secondary); font-size: 13px; padding-right: 8px; }
  .rd-t td b { font-family: var(--font-display); font-size: 18px; }
  .rd-t .sub { color: var(--color-text-muted); font-size: 12px; margin-left: 4px; }
  .rd-t .pct { font-size: 13px; margin-left: 5px; font-weight: 700; }
  .rd-t tr.yr td:first-child { color: var(--color-text-primary); font-weight: 700; }
  .rd-t tr.hy td:first-child { color: #F2EEE3; }
  .sec-h { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-bottom: 5px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 12px;
    letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); flex-shrink: 0; }
  .mb-wrap { position: relative; flex: 1 1 auto; min-height: 120px; max-height: 220px; }
  #mb { position: absolute; left: 0; top: 0; display: block; }
  .mb-read { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 20px; line-height: 1.4; padding-top: 3px; flex-shrink: 0; }
  .mb-read b { color: var(--color-text-primary); }
  .rk { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; padding-top: 4px; flex-shrink: 0; }
  .rk-h { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; padding: 3px 0; }
  .rk-i { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 14px; padding: 2px 4px; border-radius: 3px; cursor: pointer; color: var(--color-text-primary); }
  .rk-i:hover { background: rgba(232,228,217,.07); }
  .rk-i.sel { background: rgba(208,132,37,.18); }
  .rk-i span:first-child { color: var(--color-text-secondary); }
  table.mn-t { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; margin-top: 2px; flex-shrink: 0; }
  .mn-t th { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); font-weight: 400; text-align: right; padding: 3px 0; }
  .mn-t th:first-child, .mn-t td:first-child { text-align: left; }
  .mn-t td { text-align: right; padding: 2px 0; color: var(--color-text-primary); border-top: 1px solid rgba(232,228,217,.06); white-space: nowrap; }
  .mn-t tr.on td { background: rgba(208,132,37,.14); }
  .mn-t .sub { color: var(--color-text-muted); font-size: 11px; margin-left: 3px; }
  .cc-card-src { padding-top: 8px; flex-shrink: 0; }
  .cc-card-src span { cursor: help; border-bottom: 1px dotted var(--color-text-muted); }

  /* ── Narrower windows ── */
  @media (max-width: 1500px) {
    .cc-app-title { display: none; }
    .finder-group .search-input { width: 170px; }
    .ro-row { gap: 4px 16px; }
    .grp .cc-btn { padding: 6px 8px; }
    .cc-scene-bar { gap: 8px 8px; }
  }
  @media (max-width: 1400px) { :root { --cc-card-width: 300px; } .ro-row { gap: 4px 14px; } .ro-l { letter-spacing: .03em; } .vtabs button { padding: 8px 12px; } }
  @media (max-width: 1280px) {
    .locate-btn .nm { display: none; }
    .grp .cc-btn { padding: 6px 7px; font-size: 13px; }
    .grp-show-l { display: none; }
    .exp .cc-btn { padding: 8px 8px; font-size: 13px; }
    .vtabs button { padding: 8px 10px; font-size: 14px; }
  }
  @media (max-height: 700px) and (min-width: 761px) {
    .cc-app { padding-top: 6px; padding-bottom: 8px; gap: 6px; }
    .cc-app-top { min-height: 0; }
    .finder-group .search-input { padding-top: 6px; padding-bottom: 6px; }
    .exp .cc-btn, .vtabs button { padding-top: 5px; padding-bottom: 5px; }
    .cc-scene-head { padding-top: 4px; padding-bottom: 4px; }
    .ro-n { display: none; }
    .lg-strip { padding-top: 3px; padding-bottom: 3px; min-height: 0; }
    .cc-scene-bar { padding-top: 4px; padding-bottom: 4px; }
    .grp .cc-btn, .grp .cc-select { padding-top: 4px; padding-bottom: 4px; }
    .rd-t td { padding: 2px 0; }
  }
  @media (max-width: 760px) {
    .cc-app-title { display: block; width: 100%; font-size: 20px; }
    .cc-app-spacer { display: none; }
    .finder-group { flex: 1 1 100%; }
    .finder-group .search-input { width: 100%; min-width: 0; }
    .vtabs { flex: 1 1 auto; }
    .vtabs button { flex: 1; padding: 8px 6px; }
    .hm-heading { white-space: normal; font-size: 19px; }
    .ro-row { margin-left: 0; }
    .cc-scene-head { display: contents; }
    .hd-id { order: 0; padding: 8px 14px; border-bottom: 1px solid var(--color-border); }
    .cc-scene-stage { order: 1; }
    .lg-strip { order: 2; border-top: 1px solid var(--color-border); }
    .ro-row { order: 3; padding: 8px 14px; border-bottom: 1px solid var(--color-border); gap: 8px 20px; }
    .note-strip { order: 4; }
    .cc-scene-bar { order: 5; }
    .mb-wrap { flex: none; height: 170px; }
  }
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">

  <div class="cc-app-top">
    <h1 class="cc-app-title">U.S. Annual Precipitation</h1>
    <div class="finder-group" id="sw">
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si" placeholder="Search station or city..." autocomplete="off" spellcheck="false">
      <div class="dropdown" id="dd"></div>
      <div class="finder-sep"></div>
      <button class="cc-btn locate-btn" id="locate-btn" title="Use my location to find the nearest station">&#128205;<span class="nm"> Near Me</span></button>
    </div>
    <div class="vtabs" id="vtabs">
      <button data-v="acc">Accumulation</button>
      <button data-v="yrs">Years</button>
      <button data-v="grid">Month Grid</button>
    </div>
    <div class="cc-app-spacer"></div>
    <div class="exp">
      <button class="cc-btn" id="copy-btn" title="Copy the chart image">&#x29C9; Copy</button>
      <button class="cc-btn" id="png-btn" title="Download the chart as PNG">&#x2193; PNG</button>
      <button class="cc-btn" id="csv-btn" title="Download this view's data as CSV">&#x2193; CSV</button>
    </div>
  </div>

  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head">
        <div class="hd-id">
          <div class="hm-heading" id="hd-station">&nbsp;</div>
          <div class="hm-period" id="hd-period">&nbsp;</div>
        </div>
        <div class="ro-row" id="readouts"></div>
      </div>
      <div class="lg-strip" id="legend"></div>
      <div class="note-strip" id="note" hidden></div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="cv"></canvas>
        <canvas id="ov" tabindex="0" aria-label="Precipitation chart. Hover to read values; arrow keys step through the chart."></canvas>
        <div class="tbl-wrap" id="tbl" hidden></div>
        <div class="state-overlay" id="state"><div class="spinner"></div><div>Loading station record…</div></div>
      </div>
      <div class="cc-scene-bar" id="bar"></div>
    </div>

    <div class="cc-card" id="card">
      <div class="rd-head"><span class="rd-date" id="rd-date">&nbsp;</span><span class="rd-tag" id="rd-tag"></span><span class="rd-hint" id="rd-hint"></span></div>
      <table class="rd-t" id="rd-t"></table>
      <div id="sec-mb">
        <div class="sec-h" id="mb-h">Monthly totals</div>
      </div>
      <div class="mb-wrap" id="mb-wrap"><canvas id="mb"></canvas></div>
      <div class="mb-read" id="mb-read"></div>
      <div id="sec-x"></div>
      <div class="cc-card-src" id="src"></div>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ════════════════════════════════════════════════════════════════════
   Constants
   ════════════════════════════════════════════════════════════════════ */
const ACIS_URL = 'https://data.rcc-acis.org/StnData';
const N = 366;                                   // day slots on a leap-year template (Feb 29 = slot 59)
const MSTART = [0, 31, 60, 91, 121, 152, 182, 213, 244, 274, 305, 335];
const MLEN = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WY = 274;                                  // slot of Oct 1 — water years run Oct 1 – Sep 30, named by the year they end
const BASE = [1991, 2020], BASE_MIN = 20;
const MISS_PCT = 0.15, MISS_RUN = 5;             // a period counts when ≤ 15% of its days are missing and no gap exceeds 5 days
const WET = 0.01, HEAVY = 1.0;
const QS = [10, 25, 50, 75, 90];
const SEASONS = { DJF: [335, 59], MAM: [60, 151], JJA: [152, 243], SON: [244, 334] };
const SEASON_NAME = { DJF: 'Winter (Dec–Feb)', MAM: 'Spring (Mar–May)', JJA: 'Summer (Jun–Aug)', SON: 'Autumn (Sep–Nov)' };
const EXPORT_SCALE = 2;
const C = { bg: '#1E2320', surface: '#262B27', surface2: '#2C322D', grid: 'rgba(232,228,217,0.08)', axis: 'rgba(232,228,217,0.16)',
  text: '#E8E4D9', text2: '#A6A499', muted: '#948F82', accent: '#D08425', sel: '#F2EEE3', norm: '#E8E4D9',
  wet: '#3DB07A', dry: '#D9A35B', faint: 'rgba(232,228,217,0.11)', miss: '#30352F' };
const FONT = { mono: "'Courier Prime', monospace", body: "'Public Sans', sans-serif", disp: "'Zilla Slab', serif" };
// Share of normal, on a log2 axis: 25% · 50% · 71% · 100% · 141% · 200% · 400% — drier (brown) ↔ wetter (green)
const RATIO = { vals: [-2, -1, -0.5, 0, 0.5, 1, 2], cols: ['#B8651E', '#D9A35B', '#C9B48E', '#A29F95', '#7DBF95', '#3DB07A', '#12936A'] };
// Decade lines: sequential, oldest (violet) → newest (pale cyan) — kept clear of the wet green, dry tan and selected white
const DEC = { vals: [0, 0.17, 0.33, 0.5, 0.67, 0.83, 1], cols: ['#9A6AD6', '#7C73E3', '#6286E8', '#4F9DE6', '#4BB4DF', '#5FC9DA', '#8ADCDC'] };

  if (!matches.length) { dd.classList.remove('open'); return; }
  dd.innerHTML = matches.map((s, i) => `<div class="d-item"><span class="d-id">${esc(s.id)}</span><span class="d-name">${esc(s.name)}</span>` +
    (dists ? `<span class="d-dist">${dists[i].toFixed(0)} mi</span>` : `<span class="d-por">${s.y0}–</span>`) + `<span class="d-st">${s.st}</span></div>`).join('');
  dd.classList.add('open');
  dd.querySelectorAll('.d-item').forEach((el, i) => el.addEventListener('click', () => { $('si').value = ''; dd.classList.remove('open'); selectStation(matches[i].id); }));
}
function initSearch() {
  const inp = $('si'), dd = $('dd');
  inp.addEventListener('input', () => {
    ddIdx = -1; const q = inp.value.trim().toLowerCase();
    if (!q) { dd.classList.remove('open'); return; }
    const rank = s => { const id = s.id.toLowerCase(), nm = s.name.toLowerCase();
      if (id === q || 'k' + id === q) return 0;
      if (nm.startsWith(q)) return 1;
      if (nm.split(/[\s\-\/]+/).some(w => w.startsWith(q))) return 2;
      if (id.startsWith(q)) return 3;
      if (nm.includes(q)) return 4;
      if (s.st.toLowerCase() === q) return 5;
      return 9; };
    renderDD(STATIONS.map(s => [rank(s), s]).filter(r => r[0] < 9).sort((a, b) => a[0] - b[0] || a[1].name.localeCompare(b[1].name)).map(r => r[1]).slice(0, 30));
  });
  inp.addEventListener('keydown', e => {
    const items = dd.querySelectorAll('.d-item');
    const hl = () => items.forEach((el, i) => { el.classList.toggle('hi', i === ddIdx); if (i === ddIdx) el.scrollIntoView({ block: 'nearest' }); });
    if (e.key === 'ArrowDown') { e.preventDefault(); ddIdx = Math.min(ddIdx + 1, items.length - 1); hl(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); ddIdx = Math.max(ddIdx - 1, 0); hl(); }
    else if (e.key === 'Enter') { e.preventDefault(); const i = ddIdx >= 0 ? ddIdx : 0; if (items[i]) items[i].click(); }
    else if (e.key === 'Escape') dd.classList.remove('open');
  });
  document.addEventListener('click', e => { if (!$('sw').contains(e.target)) dd.classList.remove('open'); });
  $('locate-btn').onclick = () => {
    const btn = $('locate-btn');
    if (!navigator.geolocation) { btn.classList.add('is-error'); return; }
    const orig = btn.innerHTML; btn.classList.add('loading'); btn.innerHTML = '&#8987; Locating…';
    navigator.geolocation.getCurrentPosition(pos => {
      btn.classList.remove('loading'); btn.innerHTML = orig;
      const r = STATIONS.map(s => ({ s, d: haversineMiles(pos.coords.latitude, pos.coords.longitude, s.lat, s.lon) })).sort((a, b) => a.d - b.d).slice(0, 8);
      $('si').value = ''; renderDD(r.map(k => k.s), r.map(k => k.d));
    }, () => { btn.classList.remove('loading'); btn.innerHTML = orig; btn.classList.add('is-error'); setTimeout(() => btn.classList.remove('is-error'), 2500); },
    { enableHighAccuracy: false, timeout: 8000, maximumAge: 600000 });
  };
}

function drawLegendCanvas(c, x, y, maxW) {
  c.font = `14px ${FONT.mono}`; c.textBaseline = 'middle'; c.textAlign = 'left';
  let cx = x, cy = y;
  const items = legendItems();
  if (S.view === 'acc' && S.show.dec) A.decs.forEach(o => items.push({ t: 'line', col: o.col, label: `${o.d}s avg` }));
  for (const o of items) {
    const sw = o.t === 'grad' ? 84 : o.t === 'hatch' || o.t === 'box' ? 14 : 22, w = sw + 8 + c.measureText(o.label).width + 22;
    if (cx + w > x + maxW) { cx = x; cy += 24; }
    if (o.t === 'band') { c.fillStyle = 'rgba(232,228,217,0.10)'; c.fillRect(cx, cy - 6, 22, 12); c.fillStyle = 'rgba(232,228,217,0.16)'; c.fillRect(cx, cy - 3, 22, 6); }
    else if (o.t === 'grad') { const gr = c.createLinearGradient(cx, 0, cx + 84, 0); RATIO.cols.forEach((col, k) => gr.addColorStop(k / (RATIO.cols.length - 1), col)); c.fillStyle = gr; c.fillRect(cx, cy - 5, 84, 10); }
    else if (o.t === 'hatch') { c.fillStyle = 'rgba(232,228,217,0.08)'; c.fillRect(cx, cy - 6, 14, 12); hatch(c, cx, cy - 6, 14, 12, 'rgba(232,228,217,0.4)'); }
    else if (o.t === 'box') { c.strokeStyle = o.col; c.setLineDash([3, 2]); c.lineWidth = 1.5; c.strokeRect(cx + .5, cy - 5.5, 13, 11); c.setLineDash([]); }
    else { c.strokeStyle = o.col; c.lineWidth = o.t === 'thick' ? 3 : 2; c.setLineDash(o.t === 'dash' ? [6, 5] : []); c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + 22, cy); c.stroke(); c.setLineDash([]); }
    c.fillStyle = C.text2; c.fillText(o.label, cx + sw + 8, cy);
    cx += w;
  }
  return cy + 12;
}
function exportSub() {
  const R = selR(), h = headStats(), parts = [];
  if (S.view === 'acc') {
    parts.push(`Record ${D.fy}–${D.ly}`);
    if (R) parts.push(`${pLabel(R.P)}${R.inProg ? ` through ${slotLabel(slotAt(R.endP))}` : ''}: ${fIn(h.v)}${ok(h.r) ? ` (${fPct(h.r)} of normal)` : ''}${h.rk ? `, ${rankText(h.rk)} of ${h.rk.n}` : ''}`);
  } else if (S.view === 'yrs') {
    parts.push(`${W.spec.name}${W.toDate ? ` · each year through ${slotLabel((W.spec.s + W.qEnd) % N)}` : ''}`, MEAS[S.meas].label);
  } else parts.push(`Monthly totals as % of normal · ${S.ax === 'wy' ? 'water years' : 'calendar years'}`);
  return parts.join('  ·  ');
}
function buildPNG() {
  const Wd = 1600, H = S.view === 'grid' ? Math.max(920, Math.min(1800, 200 + A.list.length * 9)) : 920, sc = EXPORT_SCALE;
  const cv = document.createElement('canvas'); cv.width = Wd * sc; cv.height = H * sc;
  const c = cv.getContext('2d'); c.scale(sc, sc);
  c.fillStyle = C.bg; c.fillRect(0, 0, Wd, H);
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  const title = S.view === 'acc' ? 'Precipitation Accumulation' : S.view === 'yrs' ? 'Precipitation by Year' : 'Monthly Precipitation';
  c.font = `700 34px ${FONT.disp}`; c.fillStyle = C.text; c.fillText(`${title} — ${STN.name}, ${STN.st}`, 36, 56);
  c.font = `17px ${FONT.mono}`; c.fillStyle = C.text2; c.fillText(exportSub(), 36, 86);
  const ly = drawLegendCanvas(c, 36, 116, Wd - 72);
  const top = ly + 12, footer = 52, cw = Wd - 56, ch = H - top - footer;
  c.fillStyle = C.surface; c.fillRect(28, top, cw, ch); c.strokeStyle = 'rgba(232,228,217,0.14)'; c.strokeRect(28.5, top + .5, cw - 1, ch - 1);
  const keep = G; drawView(c, 28, top + 6, cw, ch - 10); G = keep;
  c.font = `14px ${FONT.mono}`; c.fillStyle = C.muted; c.textAlign = 'left';
  c.fillText(`Data: NOAA RCC ACIS · ThreadEx ${STN.id}${A.normSrc === 'ncei' ? ' · NCEI 1991–2020 normals' : ''} · years with > ${Math.round(MISS_PCT * 100)}% of days missing or a gap over ${MISS_RUN} days excluded`, 36, H - 22);
  c.textAlign = 'right'; c.fillStyle = C.text2; c.font = `700 15px ${FONT.mono}`; c.fillText('contextclimate.io', Wd - 36, H - 22);
  return cv;
}
const slug = () => `${STN.id}-precip-${S.view === 'acc' ? 'accumulation' : S.view === 'yrs' ? 'years-' + winValue().replace('year:jan', 'year').replace('year:wy', 'water-year').replace(':', '-') : 'month-grid'}${S.yr != null && S.view !== 'grid' ? '-' + S.yr : ''}${S.ax === 'wy' ? '-wy' : ''}`.toLowerCase();
function flash(btn, cls) { btn.classList.add(cls); setTimeout(() => btn.classList.remove(cls), 1600); }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
$('png-btn').onclick = async () => { if (!A) return; await document.fonts.ready; buildPNG().toBlob(b => download(b, `${slug()}.png`), 'image/png'); };
$('copy-btn').onclick = async () => {
  if (!A) return; const btn = $('copy-btn');
  try { await document.fonts.ready; const blob = await new Promise(r => buildPNG().toBlob(r, 'image/png')); await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); flash(btn, 'is-ok'); }
  catch (e) { flash(btn, 'is-error'); }
};
function csvText() {
  const f = v => (ok(v) ? (Math.round(v * 100) / 100).toFixed(2) : '');
  const head = `# ${STN.name}, ${STN.st} (ACIS ${STN.id}thr). Inches. Periods with > ${Math.round(MISS_PCT * 100)}% of days missing or a gap over ${MISS_RUN} days are marked incomplete. Source: NOAA RCC ACIS.`;
  const lines = [head];
  if (S.view === 'acc') {
    const R = selR();
    const h = ['month', 'day', 'normal_to_date'].concat(A.Q ? QS.map(q => `p${q}_to_date`) : [], ['wettest_to_date', 'wettest_year', 'driest_to_date', 'driest_year']);
    if (R) h.push(`${S.ax === 'wy' ? 'wy' : 'year'}_${R.P}_to_date`);
    lines.push(h.join(','));

      const r = [sd.m, sd.d, f(A.normC ? A.normC[p] : NaN)];
      if (A.Q) QS.forEach(q => r.push(f(A.Q[q][p])));
      r.push(f(ex.w ? ex.w.v : NaN), ex.w ? ex.w.P : '', f(ex.d ? ex.d.v : NaN), ex.d ? ex.d.P : '');
      if (R) r.push(R.endP >= p && !R.gap[p] ? f(R.cum[p]) : '');

    lines.push('year,start,end,total_in,pct_of_normal,wet_days,heavy_days,wettest_day_in,wettest_day_date,days,missing_days,complete');
    const nt = winStats(W, 'total').norm;
    W.list.forEach(o => lines.push([o.L, keyIso(o.sk), keyIso(o.ek), f(o.t), o.ok && ok(nt) && nt > 0 ? Math.round(o.t / nt * 100) : '', o.wet, o.hv, o.mx ? f(o.mx.v) : '', o.mx ? keyIso(o.mx.k) : '', o.days, o.miss, o.ok ? 1 : 0].join(',')));
  } else {
    const ms = Array.from({ length: 12 }, (_, k) => MON[monthAt(k)].toLowerCase());
    lines.push([S.ax === 'wy' ? 'water_year' : 'year', ...ms, 'total', 'complete'].join(','));
    lines.push(['normal', ...Array.from({ length: 12 }, (_, k) => f(A.moNorm[monthAt(k)])), f(A.normC ? A.normC[N - 1] : NaN), ''].join(','));
    [...A.list].reverse().forEach(R => { const a = A.mo.get(R.P); lines.push([R.P, ...a.map(o => (o.any ? f(o.t) + (o.ok ? '' : '*') : '')), f(R.cum[R.endP]) + (R.complete ? '' : '*'), R.complete ? 1 : 0].join(',')); });
    lines.push('# * = incomplete (month or year in progress, or too many missing days)');
  }
  return lines.join('\n');
}
const keyIso = k => { const y = Math.floor(k / 1000), sd = slotDate(k % 1000); return `${y}-${String(sd.m).padStart(2, '0')}-${String(sd.d).padStart(2, '0')}`; };
$('csv-btn').onclick = () => { if (!A) return; download(new Blob([csvText()], { type: 'text/csv' }), `${slug()}.csv`); };

(function init() {
  const q = new URLSearchParams(location.search);
  let start = DEFAULT_ID;
  try { const s = localStorage.getItem('cc-precip-stn'); if (s && byId[s]) start = s; } catch (e) {}
  const st = (q.get('st') || '').toUpperCase();
  if (byId[st]) start = st; else if (st.length === 4 && byId[st.slice(1)]) start = st.slice(1);
  if (q.get('ax') === 'wy') S.ax = 'wy';

  const w = q.get('w') || '';

  else if (/^m:(\d|1[01])$/.test(w)) { S.win.t = 'month'; S.win.month = +w.slice(2); }
