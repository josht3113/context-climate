<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metamorphic Transformation</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); --rail-w: 392px; --card-w: 290px; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 14px; white-space: nowrap; }
.tabs .cc-segmented-btn .n { opacity: .65; margin-right: 6px; }
.tabs .cc-segmented-btn.is-active .n { opacity: .8; }
.top .spacer { flex: 1; min-width: 0; }
.series { display: flex; gap: 6px; }
.x-link { padding: 6px 11px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.x-link:hover { background: color-mix(in srgb, var(--tool-accent) 14%, transparent); color: var(--color-text-primary); }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.png-menu { position: absolute; top: 38px; left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.png-menu.open { display: flex; }
.png-menu button { background: none; border: 0; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px;
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.png-menu button:hover { background: rgba(232,228,217,0.08); }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--card-w); gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage canvas.ov { pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; row-gap: 6px; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 56px; }
.controls .grp { display: flex; gap: 6px; align-items: center; min-width: 0; }
.snap { padding: 6px 8px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--color-text-secondary); }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.go { min-width: 98px; padding: 11px 14px; font-size: 16px; white-space: nowrap; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tool-accent) 22%, transparent); }
.go:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--tool-accent) 32%, transparent); }
.slider { flex: 1 1 110px; display: flex; align-items: center; gap: 8px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 58px; text-align: right; white-space: nowrap; }
.chips { position: absolute; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chips.r { top: 10px; right: 10px; justify-content: flex-end; max-width: 70%; }
.chips.l { top: 10px; left: 10px; max-width: 60%; }
.chips .cc-segmented { background: var(--color-surface); }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; }
.chip-rot { display: flex; align-items: center; gap: 8px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 4px 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.chip-rot input { width: 110px; accent-color: var(--tool-accent); }
.chip-rot output { min-width: 32px; text-align: right; color: var(--color-text-primary); font-weight: 700; }
.pill { background: rgba(20,24,21,.86); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 5px 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-primary); white-space: nowrap; }
.pill b { font-family: var(--font-display); font-size: 18px; margin-right: 6px; }
.pill.hot { border-color: var(--tool-accent); }

/* tooltip */
.tip { position: absolute; pointer-events: none; display: none; z-index: 6; background: rgba(14,17,13,.95); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-md); padding: 7px 11px 8px; max-width: 240px; }
.tip.on { display: block; }
.tip-n { display: flex; align-items: center; gap: 7px; font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--color-text-primary); }
.tip-d { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.tip-m { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); line-height: 1.4; margin-top: 3px; }

/* readout card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card > * { flex-shrink: 0; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .v.big { font-size: 30px; }
.card .r.dim .v { font-size: 20px; color: var(--color-text-secondary); }
.card .s2 { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-top: 1px; }
.card .s2.hot { color: var(--tool-accent); }
.card .tag { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; border: 1px solid var(--color-border-hover); border-radius: var(--radius-sm); padding: 2px 7px; margin-top: 4px; color: var(--color-text-secondary); }
.card .tag.hot { border-color: var(--tool-accent); color: var(--color-text-primary); }
.card table { width: 100%; border-collapse: collapse; margin-top: 2px; }
.card th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; font-weight: 500;
  color: var(--color-text-secondary); text-align: right; padding: 8px 2px 5px 4px; border-bottom: 1px solid var(--color-border-hover); line-height: 1.25; vertical-align: bottom; }
.card th:first-child, .card td:first-child { text-align: left; }
.card td { font-family: var(--font-mono); font-size: 16px; font-weight: 700; text-align: right; padding: 6px 2px; border-bottom: 1px solid var(--color-border); white-space: nowrap; color: var(--color-text-primary); }
.card td:first-child { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
.card .sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 10px; margin-bottom: 5px; }
.card .x-link { display: block; text-align: center; margin-top: 12px; padding: 9px 12px; }
@media (max-height: 640px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .v.big { font-size: 26px; }
  .card .r.dim .v { font-size: 18px; }
  .card td { padding: 4px 2px; }
}

/* left rail */
.rail { padding: 10px 12px 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.rail .eb { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); margin-bottom: 6px; }
.rail .eb em { font-style: normal; font-weight: 500; letter-spacing: .03em; text-transform: none; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .note { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin-top: 6px; text-align: right; }
.rail .note b { color: var(--color-text-secondary); font-weight: 700; }

@media (max-width: 1440px) {
  .top .sub { display: none; }
}
@media (max-width: 1366px) {
  .tabs .cc-segmented-btn { padding: 11px 11px; }
}
@media (max-width: 1300px) {
  .x-link .nm { display: none; }
  .slider .sv { display: none; }
  .snap { padding: 6px 6px; }
}
@media (max-width: 1180px) {
  .tabs .cc-segmented-btn .lb { display: none; }
  .card td { font-size: 15px; }
  .snap { padding: 6px 7px; font-size: 13px; }
  .slider .sv { display: none; }
  .slider { min-width: 110px; }
  .controls { gap: 6px; }
  .go { min-width: 0; padding: 11px 12px; }
}


/* rock chart — the control surface */
.chart { flex: 1; min-height: 0; display: grid; grid-template-columns: 80px repeat(4, minmax(0, 1fr)); grid-template-rows: auto repeat(8, minmax(0, 1fr)); gap: 4px; }
.ch-col { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-secondary); text-align: center; line-height: 1.2; padding: 2px 0 4px; align-self: end; }
.ch-col i { display: block; font-style: normal; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--color-text-muted); }
.ch-col.on, .ch-col.on i { color: var(--tool-accent); font-weight: 700; }
.ch-row { text-align: right; padding-right: 6px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; border-right: 3px solid transparent; line-height: 1.15; }
.ch-row b { font-family: var(--font-body); font-weight: 700; font-size: 13px; color: var(--color-text-primary); hyphens: manual; }
.ch-row span { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }
.ch-row:hover b { color: var(--tool-accent); }
.ch-row.on { border-right-color: var(--tool-accent); }
.ch-row.on b { color: var(--tool-accent); }
.ch-row.inq { border-right-color: color-mix(in srgb, var(--tool-accent) 45%, transparent); }
.ch-row:focus-visible, .cell:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 1px; }
.cell { position: relative; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 5px; color: var(--color-text-primary);
  font-family: var(--font-body); font-size: 13px; font-weight: 500; line-height: 1.15; padding: 2px 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; overflow-wrap: anywhere; hyphens: manual;
  transition: background .12s ease, border-color .12s ease, color .12s ease; }
.cell:hover:not(.dead):not(.on) { border-color: var(--tool-accent); background: color-mix(in srgb, var(--tool-accent) 12%, var(--color-surface-2)); }
.cell.col { background: color-mix(in srgb, var(--tool-accent) 9%, var(--color-surface-2)); }
.cell.q { border-color: var(--tool-accent); border-width: 1.5px; }
.cell.on { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); font-weight: 700; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tool-accent) 26%, transparent); }
.cell.dead { background: transparent; border-color: transparent; color: var(--color-text-muted); cursor: default; }
.cell.off::after { content: '°'; position: absolute; top: 1px; right: 3px; font-family: var(--font-mono); font-size: 13px; line-height: 1; color: var(--color-text-secondary); }
.cell.on.off::after { color: var(--color-bg); }

/* card extras */
.imrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.im { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 4px; padding: 4px 6px 4px 22px; position: relative; min-width: 0; }
.im i { position: absolute; left: 7px; top: 9px; width: 9px; height: 9px; border-radius: 2px; opacity: .4; }
.im b { display: block; font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.im span { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }
.im.on { border-color: var(--tool-accent); background: color-mix(in srgb, var(--tool-accent) 16%, var(--color-surface-2)); }
.im.on i { opacity: 1; }
.im.on b { color: var(--color-text-primary); }
.im.on span { color: var(--color-text-secondary); }
.ptc { display: block; width: 100%; margin-top: 8px; }
.ptleg { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin: 2px 0 6px; }
.ptleg i { display: inline-block; width: 16px; border-top: 2px dashed; vertical-align: 4px; margin-right: 6px; }
.ptleg i.w { border-color: rgba(238,120,80,0.95); }
.ptleg i.m { border-color: rgba(240,178,96,0.95); }
.pths { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 4px; }
.pth { padding: 6px 8px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); }
.card .x-link { white-space: normal; }
.pth.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }

.main.wide { --card-w: 336px; }
@media (max-width: 1300px) { :root { --rail-w: 380px; --card-w: 272px; } .main.wide { --card-w: 310px; } }
@media (max-width: 1180px) {
  :root { --rail-w: 340px; --card-w: 268px; }
  .rail { padding: 10px 10px; }
  .chart { grid-template-columns: 62px repeat(4, minmax(0, 1fr)); gap: 3px; }
  .ch-row span { display: none; }
  .main.wide { --card-w: 290px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title">Metamorphic Transformation</h1><span class="sub">3 of 3 · rock formation</span></div>
    <div class="cc-segmented tabs" id="tabs"></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="series" id="series"></div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="png-menu" id="pngMenu">
        <button data-png="all">Whole tool</button>
        <button data-png="stage">Specimen panel</button>
        <button data-png="chart">Rock chart</button>
        <button data-png="card">Readout card</button>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="cc-panel rail">
      <div class="eb">Rock chart <em id="chartSub"></em></div>
      <div class="chart" id="chart"></div>
      <div class="note"><b>°</b> not named on ESSRT p. 15</div>
    </div>
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <canvas id="ov" class="ov"></canvas>
        <div class="chips l" id="chipsL"></div>
        <div class="chips r" id="chipsR"></div>
        <div class="tip" id="tip"><div class="tip-n"><span class="tip-d" id="tipDot"></span><span id="tipName"></span></div><div class="tip-m" id="tipMeta"></div></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

  if (T < 560 && P > 4.5 + 0.0245*(T-150))  return 'bs';

function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,t){ return a+(b-a)*t; }

function buildPath(P){
  var k = P.knots, seg = [], total = 0, i;
  for (i=1;i<k.length;i++){
    var dT = (k[i][0]-k[i-1][0])/900, dP = (k[i][1]-k[i-1][1])/22;
    var L = Math.sqrt(dT*dT + dP*dP);
    seg.push(L); total += L;
  }
  var T = new Float64Array(NSAMP), Pr = new Float64Array(NSAMP), t = new Float64Array(NSAMP);
  var acc = 0, si = 0, accPrev = 0;
  for (var s=0;s<NSAMP;s++){
    var want = total * s/(NSAMP-1);
    si = 0; acc = 0;
    while (si < seg.length-1 && acc + seg[si] < want){ acc += seg[si]; si++; }
    var f = seg[si] > 0 ? (want - acc)/seg[si] : 0;
    f = clamp(f,0,1);
    T[s]  = lerp(k[si][0], k[si+1][0], f);
    Pr[s] = lerp(k[si][1], k[si+1][1], f);
    t[s]  = lerp(k[si][2], k[si+1][2], f);
  }
  /* integrate grain growth and ductile strain forward along the path */
  var gsq = new Float64Array(NSAMP), str = new Float64Array(NSAMP);
  var pkT = new Float64Array(NSAMP), pkP = new Float64Array(NSAMP), pkI = new Int32Array(NSAMP);
  var g = 0, r = 0, bT = -1, bP = 0, bI = 0;
  for (s=0;s<NSAMP;s++){
    if (s > 0){
      var dt = Math.max(0, t[s] - t[s-1]);
      var Tm = (T[s] + T[s-1]) * 0.5;
      g += GG_K0 * Math.exp(-GG_QR/(Tm + 273.15)) * dt;
      r += P.stress * clamp((Tm - 100)/150, 0.05, 1) * STRAIN_RATE * dt;
    }
    if (T[s] > bT){ bT = T[s]; bP = Pr[s]; bI = s; }
    gsq[s] = g; str[s] = Math.min(r, 6);
    pkT[s] = bT; pkP[s] = bP; pkI[s] = bI;
  }
  P.S = {T:T, P:Pr, t:t, gsq:gsq, str:str, pkT:pkT, pkP:pkP, pkI:pkI, peakU:bI/(NSAMP-1), peakIdx:bI};
}
for (var pj=0; pj<PATHS.length; pj++) buildPath(PATHS[pj]);
var PATH_BY = {};
for (var pk2=0; pk2<PATHS.length; pk2++) PATH_BY[PATHS[pk2].key] = PATHS[pk2];

/* ═══════════════════════════════════════════════════════════════════════
   ASSEMBLAGE
   ═══════════════════════════════════════════════════════════════════ */
function smoothstep(e0,e1,x){ var v = clamp((x-e0)/(e1-e0),0,1); return v*v*(3-2*v); }

function interpNodes(nodes, T){
  var i = 0;
  while (i < nodes.length-2 && T > nodes[i+1][0]) i++;
  var a = nodes[i], b = nodes[i+1];
  var f = clamp((T - a[0]) / (b[0] - a[0]), 0, 1);
  var out = {}, kk;
  for (kk in a[1]) out[kk] = a[1][kk] * (1-f);
  for (kk in b[1]) out[kk] = (out[kk] || 0) + b[1][kk] * f;
  return out;
}
function mixModes(m1, m2, w){
  var out = {}, kk;
  for (kk in m1) out[kk] = m1[kk] * (1-w);
  for (kk in m2) out[kk] = (out[kk] || 0) + m2[kk] * w;
  return out;
}
function normModes(m){
  var s = 0, kk;
  for (kk in m) if (m[kk] > 0.02) s += m[kk]; else m[kk] = 0;
  if (s <= 0) return m;
  for (kk in m) m[kk] = m[kk] * 100 / s;
  return m;
}

/* Modes at the peak conditions the rock has seen. Prograde reactions drive
   water out of the rock, so they do not run backwards on the way up — the
   assemblage records the peak, which is why the path matters and the
   present-day surface conditions do not. */
function modesAt(proto, T, P){
  var m;
  if (proto.loP){
    var w = smoothstep(4.6, 3.0, P);                 /* 1 → low-pressure suite */
    m = mixModes(interpNodes(proto.nodes, T), interpNodes(proto.loP, T), w);
  } else if (proto.hiP){
    var bsB = 5 + 0.010*(T-150);
    var wh = smoothstep(-1.6, 1.6, P - bsB);         /* 1 → blueschist/eclogite suite */
    m = mixModes(interpNodes(proto.nodes, T), interpNodes(proto.hiP, T), wh);
  } else {
    m = interpNodes(proto.nodes, T);
  }
  /* swap the Al₂SiO₅ placeholder for the polymorph stable at this pressure */
  if (m.alsi){ var poly = alsiPoly(T, P); m[poly] = (m[poly]||0) + m.alsi; m.alsi = 0; }
  /* melt only exists above the water-saturated solidus */
  if (m.melt > 0){
    var allowed = clamp((T - dehydT(P)) / 110, 0, 1);
    var back = m.melt * (1 - allowed);
    m.melt *= allowed;

    for (i=0;i<host.length;i++) hs += m[host[i]] || 0;

/* Retrograde overprint — a little chlorite grows on ferromagnesian rims as

function retroOverprint(m, past){

/* Whether the fabric is built from micas (schistose) or from prismatic

   different-looking rock depending on which habit dominates. */
function fabricKind(st){
  var mica = 0, prism = 0, kk;
  for (kk in st.modes){
    var v = st.modes[kk]; if (!v) continue;
    var M = MIN[kk]; if (M.platy < 0.3) continue;
    if (M.fx === 'mica' || kk === 'sillimanite' || kk === 'graphite' || kk === 'clay') mica += v*M.platy;

function boundH2O(m){ var s=0,kk; for (kk in m) if (m[kk]>0) s += m[kk]*(MIN[kk].h2o||0); return s/100; }
function density(m){ var s=0,kk; for (kk in m) if (m[kk]>0) s += m[kk]*MIN[kk].dens; return s/100; }
function platyFrac(m){ var s=0,kk; for (kk in m) if (m[kk]>0) s += m[kk]*MIN[kk].platy; return s/100; }

/* ═══════════════════════════════════════════════════════════════════════
   STATE AT A POSITION ALONG A PATH
   ═══════════════════════════════════════════════════════════════════ */
function stateAt(protoKey, pathKey, u){
  var pr = PROTO_BY[protoKey], pa = PATH_BY[pathKey], S = pa.S;
  var idx = clamp(Math.round(u * (NSAMP-1)), 0, NSAMP-1);
  var T = S.T[idx], P = S.P[idx], tm = S.t[idx];
  var peakT = S.pkT[idx], peakP = S.pkP[idx];
  var past = idx > S.peakIdx ? (idx - S.peakIdx) / (NSAMP - 1 - S.peakIdx || 1) : 0;

  var m = modesAt(pr, peakT, peakP);
  /* the rock's water budget peaks part-way up the path — chlorite and clays
     hold far more than the anhydrous assemblage that replaces them — so the
     reference is the wettest the rock ever was, not its starting value */
  var h2o0 = 0;
  for (var w=0; w<=14; w++){
    var Tw = 25 + (peakT - 25) * w/14;
    var hw = boundH2O(modesAt(pr, Tw, peakP));
    if (hw > h2o0) h2o0 = hw;
  }
  var h2o = boundH2O(m);

  var d = Math.sqrt(pr.d0*pr.d0 + S.gsq[idx]);
  var Rs = 1 + S.str[idx];
  var align = clamp((Rs - 1) / 2.6, 0, 1);
  /* A rock foliates only if it owns enough platy or prismatic minerals to
     build a continuous fabric. This is why marble and quartzite come out of
     the same collision non-foliated: calcite and quartz are equant, so no
     amount of directed stress gives them a schistosity. */
  var pf = platyFrac(m);
  var fol = align * smoothstep(0.06, 0.26, pf);
  var df = darkFrac(m);
  var contrast = Math.min(1, df/0.10) * Math.min(1, (1-df)/0.25);
  var seg = (pr.bands ? 1 : 0) * clamp((peakT - 590)/110, 0, 1) * align * contrast;
  var melt = (m.melt || 0) / 100;

    proto:pr, path:pa, u:u, idx:idx, T:T, P:P, t:tm, past:past,
    peakT:peakT, peakP:peakP, depth:P*KM_PER_KBAR, peakDepth:peakP*KM_PER_KBAR,
    modes:m, grain:d, Rs:Rs, align:align, platy:pf, fol:fol, seg:seg, melt:melt,

}

/* ═══════════════════════════════════════════════════════════════════════
   ROCK AND TEXTURE NAMES — derived from the state, never stored per case,
   so a rock cannot be labelled something the simulation did not produce.
   ═══════════════════════════════════════════════════════════════════ */
/* The metamorphic rocks actually named on ESSRT p. 15. Anything this tool
   produces that is not on this list is marked in the chart and carries its
   ESSRT equivalent as a tag, so a student can tell testable vocabulary from
   the level above it. */
var ESSRT_ROCK = {

  'Metasandstone':1, 'Metaconglomerate':1, 'Metachert':1, 'Marble':1,
  'Anthracite coal':1,
  /* protolith names on the same page, shown before metamorphism */
  'Shale':1, 'Sandstone':1, 'Conglomerate':1, 'Chert':1, 'Limestone':1,
  'Dolostone':1, 'Basalt':1, 'Granite':1, 'Bituminous coal':1

function textureName(st){
  if (st.melt > 0.10) return 'Migmatitic';
  if (!st.foliated)   return st.grain < 0.06 ? 'Hornfelsic' : 'Granoblastic';
  if (fabricKind(st) === 'prismatic') return 'Nematoblastic';
  if (st.seg > 0.42)  return 'Gneissic banding';
  if (st.grain < 0.008) return 'Slaty cleavage';
  if (st.grain < 0.060) return 'Phyllitic';
  return 'Schistosity';
}
function rockName(st){

  var gsz = st.grain < 0.008 ? 'slate' : st.grain < 0.060 ? 'phyllite' : 'schist';
  if (T < 150){
    return {n:st.proto.n, note:'not yet metamorphosed'};
  }
  if (k === 'pelite'){
    if (st.melt > 0.12) return {n:'Migmatite', essrt:'Gneiss', note:'gneiss past its melting point'};
    if (!fol){
      if (T < 420) return {n:'Spotted slate', essrt:'Slate', note:'porphyroblasts, no fabric'};
      if (st.alsi === 'sillimanite') return {n:'Sillimanite hornfels', sh:'Sil. hornfels', note:'inner aureole'};
      if (st.alsi === 'andalusite')  return {n:'Andalusite hornfels', sh:'And. hornfels', note:'contact, non-foliated'};
      return {n:'Hornfels', note:'contact, non-foliated'};
    }
    var Egs = gsz.charAt(0).toUpperCase() + gsz.slice(1);
    if (fac === 'bs')  return {n:'Blueschist-facies ' + gsz, sh:'BS-facies ' + gsz, essrt:Egs, note:'high P, low T'};
    if (fac === 'ecl') return {n:'High-pressure ' + gsz, sh:'HP ' + gsz, essrt:Egs, note:'kyanite + garnet, no andalusite'};
    if (st.seg > 0.42) return {n:'Gneiss', note:'felsic and mafic bands'};
    if (st.grain < 0.008) return {n:'Slate', note:'grains below eye resolution'};
    if (st.grain < 0.060) return {n:'Phyllite', note:'mica sheen, grains still fine'};
    return {n:'Schist', note:'platy grains visible'};
  }
  if (k === 'mafic'){
    if (fac === 'ecl')  return {n:'Eclogite', note:'omphacite + garnet, no plagioclase'};
    if (fac === 'bs')   return {n:'Blueschist', essrt:'Schist', note:'glaucophane-bearing'};
    if (fac === 'gran') return {n:'Mafic granulite', note:'two pyroxenes'};
    if (fac === 'amp')  return {n:fol ? 'Amphibolite' : 'Amphibolite (hornfels)', essrt:fol ? 'Schist' : null, note:'hornblende + plagioclase'};
    if (fac === 'aeh' || fac === 'hbh' || fac === 'pxh'){
      if (!fol) return {n:'Mafic hornfels', note:'contact, non-foliated'};
      if (T < 300) return {n:'Metabasalt', note:'very low grade'};
      return T < 500 ? {n:'Greenschist', essrt:'Schist', note:'chlorite–actinolite–albite–epidote'}
                     : {n:'Amphibolite', essrt:'Schist', note:'hornblende + plagioclase'};
    }
    if (T > 300) return fol ? {n:'Greenschist', essrt:'Schist', note:'chlorite–actinolite–albite–epidote'}
                            : {n:'Metabasalt', note:'chlorite–actinolite–albite–epidote'};
    return {n:'Metabasalt', note:'very low grade'};
  }
  if (k === 'granite'){
    if (st.melt > 0.10) return {n:'Migmatite', essrt:'Gneiss', note:'gneiss past its melting point'};
    if (st.seg > 0.42)  return {n:'Gneiss', note:'igneous parent — same minerals, new texture'};
    if (fol) return {n:'Foliated metagranite', note:'biotite lining up, no bands yet'};
    return {n:'Metagranite', note:'igneous texture largely intact'};
  }
  if (k === 'sandstone'){
    if (st.poro > 0.15) return {n:'Metasandstone', note:'grains welding, pore space closing'};
    return {n:'Quartzite', note:'monomineralic — records no grade'};
  }
  if (k === 'chert'){
    return {n:'Metachert', note:'monomineralic — records no grade'};
  }
  if (k === 'limestone'){
    if (st.modes.wollastonite > 6) return {n:'Wollastonite marble', sh:'Wo. marble', essrt:'Marble', note:'calcite + quartz reacted'};
    if (T < 250) return {n:'Marble', note:'recrystallization — any fossils destroyed'};
    return {n:'Marble', note:'monomineralic — records no grade'};
  }
  if (k === 'conglomerate'){
    if (st.Rs > 3.0 && T > 350) return {n:'Metaconglomerate', sh:'Metaconglom.', stretched:1, note:'pebbles stretched to the strain ellipse'};
    return {n:'Metaconglomerate', sh:'Metaconglom.', note:'pebbles still round'};
  }
  if (k === 'coal'){
    return {n:'Anthracite coal', note: T < 350 ? 'volatiles driven off' : 'carbon ordering toward graphite'};
  }
  return {n:'—', note:''};
}

/* ═══════════════════════════════════════════════════════════════════════
   NESTED SEED SEQUENCE
   One progressive best-candidate point set. Because every prefix of it is
   still well spread, dropping the seed count coarsens the rock — grains
   merge into their neighbours instead of the whole texture re-rolling.
   That is what makes grain growth continuous as you scrub.
   ═══════════════════════════════════════════════════════════════════ */
var MAXSEED = 2800;
var BX = new Float32Array(MAXSEED), BY = new Float32Array(MAXSEED);
var RM = new Float32Array(MAXSEED), RA = new Float32Array(MAXSEED),
    RC = new Float32Array(MAXSEED), RJ = new Float32Array(MAXSEED),
    RB = new Float32Array(MAXSEED);
function rng(seed){ var s = seed >>> 0 || 1; return function(){ s = (Math.imul(s,1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
(function buildBase(){
  var rand = rng(20260909), G = 64, grid = [], i, j;
  for (i=0;i<G*G;i++) grid.push([]);
  function nearest2(x,y){
    var gx = Math.min(G-1, (x*G)|0), gy = Math.min(G-1, (y*G)|0), best = 4;
    for (var r=0;r<3;r++){
      for (var jy=Math.max(0,gy-r); jy<=Math.min(G-1,gy+r); jy++)
        for (var jx=Math.max(0,gx-r); jx<=Math.min(G-1,gx+r); jx++){
          var cellL = grid[jy*G+jx];
          for (var q=0;q<cellL.length;q++){
            var dx = x-cellL[q][0], dy = y-cellL[q][1], d2 = dx*dx+dy*dy;
            if (d2 < best) best = d2;

      if (best < 4 && r >= 1) break;
    }
    return best;
  }
  for (i=0;i<MAXSEED;i++){
    var bx = 0, by = 0, bd = -1, K = i < 8 ? 1 : 10;
    for (j=0;j<K;j++){
      var cx = rand(), cy = rand(), d = i === 0 ? 1 : nearest2(cx, cy);
      if (d > bd){ bd = d; bx = cx; by = cy; }
    }
    BX[i] = bx; BY[i] = by;
    grid[Math.min(G-1,(by*G)|0)*G + Math.min(G-1,(bx*G)|0)].push([bx,by]);
    RM[i] = rand(); RA[i] = rand(); RC[i] = rand(); RJ[i] = rand(); RB[i] = rand();
  }
})();

/* ═══════════════════════════════════════════════════════════════════════
   FIELD BUILDER
   Everything the canvas shows is derived from the state: grain size sets
   the seed count, the strain ellipse sets the anisotropy, and how strongly
   a grain lines up with the foliation plane is its own habit's business —
   which is why a mica-rich rock foliates and a quartzite does not, at the
   same strain.
   ═══════════════════════════════════════════════════════════════════ */
var AR_CAP = 2.6;

function effGrain(st){
  var s = 0, kk;
  for (kk in st.modes) if (st.modes[kk] > 0) s += st.modes[kk] * MIN[kk].sz;
  return st.grain * Math.max(0.6, s/100);
}
function fovFor(st, scaleMode){
  if (scaleMode === 'hand') return 40;
  if (st.proto.clastMm) return clamp(st.proto.clastMm * 3.8, 8, 46);
  return clamp(effGrain(st) * 22, 0.32, 46);
}

/* ── PEBBLES ──────────────────────────────────────────────────────────────
   Packed as circles in the UNSTRAINED frame, then mapped through the strain
   ellipse, so they end up as non-overlapping ellipses whose axial ratio is
   the finite strain itself. A stretched-pebble conglomerate is the cleanest
   strain gauge in geology: the ratio you measure off the picture is the
   number in the readout. The matrix recrystallises and so records less. */
function buildClasts(st, fovMm, RW){
  if (!st.proto.clastMm) return [];

  var Rs = st.Rs, sq = Math.sqrt(Rs);
  var UW = RW / sq, UH = RW * sq;               /* the unstrained frame */
  var tries = 0, target = Math.round(0.62 * UW * UH / (Math.PI * baseR * baseR * 0.62));
  target = Math.min(34, Math.max(6, target));
  while (out.length < target && tries < 2600){
    tries++;
    var r = baseR * (0.32 + rand()*1.18);
    var ux = rand() * UW, uy = rand() * UH, ok = true;
    for (var i=0;i<out.length;i++){
      var o = out[i], dx = ux-o.ux, dy = uy-o.uy;
      if (dx*dx + dy*dy < (r + o.r) * (r + o.r) * 0.80){ ok = false; break; }
    }
    if (!ok) continue;
    var q = rand(), li = 0;
    while (li < CLAST_CDF.length-1 && q > CLAST_CDF[li]) li++;
    out.push({ ux:ux, uy:uy, r:r, lith:li,
               x: ux*sq, y: uy/sq, a: r*sq, b: r/sq,
               w2:(rand()-0.5)*0.15, w3:(rand()-0.5)*0.12, w4:(rand()-0.5)*0.09,

/* One hash per cell, three values sliced out of it: two for the jitter that

   must not look like. */

  var n = (Math.imul(gx, 374761393) + Math.imul(gy, 668265263) + Math.imul(sd, 1013904223)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177) | 0;

    var jx = (ix+ox) + (n & 1023)/1024, jy = (iy+oy) + ((n >>> 10) & 1023)/1024;
    var dx = fx-jx, dy = fy-jy, dd = dx*dx + dy*dy;
    if (dd < b1){ b2 = b1; b1 = dd; bv = ((n >>> 20) & 4095)/4096; }
    else if (dd < b2) b2 = dd;

/* radius multiplier of a pebble outline at angle theta — pebbles are worn
   round but not circular */
function clastEdge(c, th){

  var dx = px - c.x, dy = py - c.y;
  var u = dx / c.a, v = dy / c.b, rr = Math.sqrt(u*u + v*v);
  if (rr > 1.35) return -1;
  var e = clastEdge(c, Math.atan2(v, u));
  return rr <= e ? rr / e : -1;
}

function buildField(st, fovMm, RW, RH){
  var NPX = RW*RH;
  var d = effGrain(st);
  var across = fovMm / Math.max(d, 1e-4);
  var N = clamp(Math.round(0.80 * across * across), 14, MAXSEED);

  /* mineral CDF, weighted by 1/size² so a coarse mineral takes fewer, bigger
     grains rather than the same number of oversized ones */
  var keys = [], wts = [], tot = 0, kk;
  for (kk in st.modes){
    var v = st.modes[kk];
    if (v > 0.05){ var sz = MIN[kk].sz; keys.push(kk); var w = v / (sz*sz); wts.push(w); tot += w; }
  }
  if (!keys.length){ keys = ['quartz']; wts = [1]; tot = 1; }
  var cdf = new Float64Array(keys.length), run = 0, i;
  for (i=0;i<keys.length;i++){ run += wts[i]/tot; cdf[i] = run; }

  var cellA = RW*RH / N;
  var lam = clamp(Math.pow(st.Rs, 0.34), 1, 1.62);  /* strain ellipse, area preserving */
  var pxPerMm = RW / fovMm;

  var sX = new Float32Array(N), sY = new Float32Array(N), sC = new Float32Array(N),
      sS = new Float32Array(N), sAx = new Float32Array(N), sWt = new Float32Array(N),
      sPhi = new Float32Array(N), sCut = new Float32Array(N);
  var sMin = new Array(N);
  var order = [], heavy = [];

  /* gneissic banding: dark and light minerals migrate into alternating bands */
  var bandPx = clamp(9 * d * pxPerMm, 22, 96);
  var nBands = Math.max(3, Math.round(RH / bandPx));
  var bandH = RH / nBands;

  var arMax = 1;
  for (i=0;i<N;i++){
    var r = RM[i], ki = 0;
    while (ki < cdf.length-1 && r > cdf[ki]) ki++;
    var mk = keys[ki], M = MIN[mk];
    sMin[i] = mk;

    var x = BX[i]*RW, y = BY[i]*RH;
    if (st.seg > 0.01){
      var dark = !!DARKM[mk];
      var tb = Math.floor(RB[i] * (nBands/2)) * 2 + (dark ? 1 : 0);
      tb = Math.min(nBands-1, tb);
      var ty = (tb + 0.5)*bandH + (RJ[i]-0.5)*bandH*0.62;
      y = y + (ty - y) * st.seg;
    }
    sX[i] = x; sY[i] = y;

    var a = st.fol * M.platy;
    var base = (RA[i]-0.5) * Math.PI;               /* unaligned habit direction */
    var phi = base * (1-a) + (RJ[i]-0.5) * 0.55 * a;
    sPhi[i] = phi; sC[i] = Math.cos(phi); sS[i] = Math.sin(phi);
    var ax = Math.min(AR_CAP, M.ar);
    sAx[i] = ax; if (ax > arMax) arMax = ax;
    sCut[i] = clamp(1 - RC[i]*RC[i], 0.12, 1);

    var szf = M.sz;
    var w = (szf*szf - 1) * cellA / Math.PI;
    sWt[i] = w;
    if (M.pb && szf >= 2.2) heavy.push(i); else order.push(i);
  }
  /* heavy porphyroblast seeds are brute-forced so the ring bound stays tight */
  var idx = heavy.concat(order), nHeavy = heavy.length;
  var qX = new Float32Array(N), qY = new Float32Array(N), qC = new Float32Array(N),
      qS = new Float32Array(N), qA = new Float32Array(N), qW = new Float32Array(N),
      qPhi = new Float32Array(N), qCut = new Float32Array(N);
  var qMin = new Array(N);
  for (i=0;i<N;i++){
    var j = idx[i];
    qX[i]=sX[j]; qY[i]=sY[j]; qC[i]=sC[j]; qS[i]=sS[j]; qA[i]=sAx[j];
    qW[i]=sWt[j]; qPhi[i]=sPhi[j]; qCut[i]=sCut[j]; qMin[i]=sMin[j];
  }

  /* ── foliation surface: a wavy plane, deflected around porphyroblasts ── */
  var clasts = buildClasts(st, fovMm, RW);
  var wavy = clamp((d*pxPerMm - 3) / 26, 0, 1);
  var wA = st.fol * (2.5 + 24*wavy);
  var warpCol = new Float32Array(RW);
  for (i=0;i<RW;i++) warpCol[i] = wA*(Math.sin(i*6.283/RW*2.1)*0.60 + Math.sin(i*6.283/RW*0.85 + 1.4)*0.40);
  var warp = new Float32Array(NPX);
  for (var py=0; py<RH; py++){ var ro = py*RW; for (var px=0; px<RW; px++) warp[ro+px] = warpCol[px]; }
  if (st.fol > 0.10 && clasts.length){
    /* the matrix foliation wraps a pebble the same way it wraps a porphyroblast */
    for (i=0;i<clasts.length;i++){
      var C0 = clasts[i], infl0 = C0.b * 2.6;
      var cx0b = C0.x, cy0b = C0.y;
      var xa = Math.max(0,(cx0b-C0.a-infl0)|0), xb = Math.min(RW-1,(cx0b+C0.a+infl0)|0);
      var ya = Math.max(0,(cy0b-C0.b-infl0)|0), yb = Math.min(RH-1,(cy0b+C0.b+infl0)|0);
      for (var y2=ya; y2<=yb; y2++) for (var x2=xa; x2<=xb; x2++){
        var ex = (x2-cx0b)/C0.a, ey = (y2-cy0b)/C0.b, er = Math.sqrt(ex*ex+ey*ey);
        if (er < 1 || er > 2.4) continue;
        warp[y2*RW+x2] += clamp(C0.b*0.55*(ey>0?1:-1)/(er*er) * st.fol, -C0.b*0.55, C0.b*0.55);
      }
    }
  }
  if (st.fol > 0.15){
    for (i=0;i<nHeavy;i++){
      var bR = Math.sqrt(Math.max(qW[i],1)*Math.PI) * 1.0;
      var infl = bR * 2.3, cx0 = qX[i], cy0 = qY[i];
      var x0 = Math.max(0, (cx0-infl)|0), x1 = Math.min(RW-1, (cx0+infl)|0);
      var y0 = Math.max(0, (cy0-infl)|0), y1 = Math.min(RH-1, (cy0+infl)|0);
      for (var yy=y0; yy<=y1; yy++) for (var xx=x0; xx<=x1; xx++){
        var ddx = xx-cx0, ddy = yy-cy0, rr = Math.sqrt(ddx*ddx+ddy*ddy);
        if (rr < 1 || rr > infl) continue;
        var push = bR*bR/(rr*rr) * (ddy>0?1:-1) * 0.45 * st.fol;
        warp[yy*RW+xx] += clamp(push, -bR*0.50, bR*0.50);
      }
    }
  }

  /* ── grid-accelerated, anisotropic, additively weighted Voronoi ────────
     The bin grid is laid out in UNSTRAINED coordinates — every position is
     divided by the strain ellipse before binning — so the strain drops out
     of the ring bound entirely and only the habit aspect ratio is left in
     it. Without that the search radius scales with (aspect × strain)², and
     a strongly foliated gneiss costs an order of magnitude more per pixel
     than an unstrained hornfels for no reason. */
  var L = N - nHeavy, ilam = 1/lam;
  var uX = new Float32Array(N), uY = new Float32Array(N), s;
  for (s=0;s<N;s++){ uX[s] = qX[s]*ilam; uY[s] = qY[s]*lam; }
  var UW = RW*ilam, UH = RH*lam;
  var cell = Math.max(3, 1.5 * Math.sqrt(UW*UH / Math.max(1,L)));
  var gw = Math.max(1, Math.ceil(UW/cell)), gh = Math.max(1, Math.ceil(UH/cell)), NC = gw*gh;
  var start = new Int32Array(NC+1), bin = new Int32Array(N);
  for (s=nHeavy;s<N;s++){
    var gx0 = Math.min(gw-1, Math.max(0,(uX[s]/cell)|0)), gy0 = Math.min(gh-1, Math.max(0,(uY[s]/cell)|0));
    bin[s] = gy0*gw+gx0; start[bin[s]+1]++;
  }
  for (i=0;i<NC;i++) start[i+1] += start[i];
  var items = new Int32Array(Math.max(1,L)), fill = new Int32Array(NC);
  for (s=nHeavy;s<N;s++){ var c0 = bin[s]; items[start[c0]+fill[c0]++] = s; }
  var wMaxL = 0;
  for (s=nHeavy;s<N;s++) if (qW[s] > wMaxL) wMaxL = qW[s];

  var own = new Int32Array(NPX), dA = new Float32Array(NPX), dB = new Float32Array(NPX);
  var maxR = gw + gh, bnd = arMax*arMax;

  for (var py2=0; py2<RH; py2++){
    var rowo = py2*RW;
    for (var px2=0; px2<RW; px2++){
      var Ux = px2*ilam, Uy = (py2 + warp[rowo+px2])*lam;
      var b1 = 1e18, b2 = 1e18, bs = -1, dx, dy, rx, ry, uu, dd, q;
      for (q=0; q<nHeavy; q++){
        dx = Ux-uX[q]; dy = Uy-uY[q];
        rx = dx*qC[q] + dy*qS[q]; ry = -dx*qS[q] + dy*qC[q];
        uu = rx/qA[q];
        dd = uu*uu + ry*ry - qW[q];
        if (dd < b1){ b2 = b1; b1 = dd; bs = q; } else if (dd < b2) b2 = dd;
      }
      var cx1 = Math.min(gw-1, Math.max(0,(Ux/cell)|0));
      var cy  = Math.min(gh-1, Math.max(0,(Uy/cell)|0));
      for (var r2=0; r2<=maxR; r2++){
        if (bs >= 0 && r2 > 0){
          var rm = (r2-1)*cell;
          if (rm > 0 && rm*rm > bnd*(b2 + wMaxL)) break;
        }
        var yA = cy-r2, yB = cy+r2, xA = cx1-r2, xB = cx1+r2;
        if (yA < 0 && yB > gh-1 && xA < 0 && xB > gw-1 && r2 > 0) break;
        var gyA = yA<0?0:yA, gyB = yB>gh-1?gh-1:yB;
        for (var gy2=gyA; gy2<=gyB; gy2++){
          var edgeY = (gy2===yA || gy2===yB);
          var gxA = xA<0?0:xA, gxB = xB>gw-1?gw-1:xB;
          for (var gx2=gxA; gx2<=gxB; gx2++){
            if (!edgeY && gx2!==xA && gx2!==xB) continue;
            var cc = gy2*gw+gx2, e2 = start[cc+1];
            for (var tI=start[cc]; tI<e2; tI++){
              q = items[tI];
              dx = Ux-uX[q]; dy = Uy-uY[q];
              rx = dx*qC[q] + dy*qS[q]; ry = -dx*qS[q] + dy*qC[q];
              uu = rx/qA[q];
              dd = uu*uu + ry*ry - qW[q];
              if (dd < b1){ b2 = b1; b1 = dd; bs = q; } else if (dd < b2) b2 = dd;
            }
          }
        }
      }
      if (bs < 0) bs = 0;
      var ii = rowo+px2;
      own[ii] = bs; dA[ii] = b1; dB[ii] = b2 > 1e17 ? b1 + 1e6 : b2;
    }
  }

  /* mean assemblage colour, used to blend unresolved grains together */
  var mr=0, mg=0, mb=0, mw=0;
  for (kk in st.modes) if (st.modes[kk] > 0){
    var C = MIN[kk].col, f = st.modes[kk]/100 * (MIN[kk].op ? 5 : 1);
    mr += C[0]*f; mg += C[1]*f; mb += C[2]*f; mw += f;
  }
  if (mw > 0){ mr /= mw; mg /= mw; mb /= mw; }
  var grainPx = d * pxPerMm;
  var fineRamp = clamp((7 - grainPx)/6, 0, 1);
  var fine = fineRamp * 0.86, fineK = 0.75 - 0.30*fineRamp;

  return { RW:RW, RH:RH, N:N, own:own, d1:dA, d2:dB, warp:warp,
           qX:qX, qY:qY, qPhi:qPhi, qCut:qCut, qMin:qMin, qA:qA, qW:qW,
           lam:lam, fine:fine, fineK:fineK, mean:[mr,mg,mb], grainPx:grainPx, pxPerMm:pxPerMm,
           clasts:clasts, poro:st.poro,
           fovMm:fovMm, nHeavy:nHeavy, d:d };
}

/* ═══════════════════════════════════════════════════════════════════════
   COLOURING — two buffers off one geometry, so switching light or turning
   the stage is a recolour, not a rebuild.
   ═══════════════════════════════════════════════════════════════════ */
function cl(v){ return v<0?0:v>255?255:v|0; }

function colourField(F, st, light, stageDeg){
  var RW = F.RW, RH = F.RH, NPX = RW*RH, own = F.own, d1 = F.d1, d2 = F.d2;
  var img = new Uint8ClampedArray(NPX*4);
  var N = F.N, i;
  var stage = stageDeg * Math.PI / 180;

  /* per-grain colour, resolved once */
  var gR = new Float32Array(N), gG = new Float32Array(N), gB = new Float32Array(N);
  var gFx = new Array(N), gPhi = F.qPhi, gLam = new Float32Array(N);
  for (i=0;i<N;i++){
    var mk = F.qMin[i], M = MIN[mk], jt = (F.qCut[i]-0.5)*17;
    gFx[i] = M.fx || '';
    if (light === 'xpl'){
      if (M.op || M.iso){ gR[i]=gG[i]=gB[i]=M.op?4:2; gFx[i]=''; continue; }
      var ret = M.bi * 30000 * F.qCut[i];
      var c = mlWash(michelLevy(ret), ret);
      if (M.body){
        var mask = M.mask;
        c = [c[0]*(1-mask) + M.body[0]*mask*(c[0]/255*0.75+0.25),
             c[1]*(1-mask) + M.body[1]*mask*(c[1]/255*0.75+0.25),
             c[2]*(1-mask) + M.body[2]*mask*(c[2]/255*0.75+0.25)];
      }
      var br = extAt(gPhi[i] + M.ea + stage);
      gR[i]=c[0]*br; gG[i]=c[1]*br; gB[i]=c[2]*br;
      gLam[i] = extAt(gPhi[i] + M.ea + 0.36 + stage);   /* the other twin set */
    } else {
      var C = M.col;
      gR[i]=C[0]+jt; gG[i]=C[1]+jt; gB[i]=C[2]+jt;
      /* platy grains lying in the section plane catch the light — this is
         the sheen that separates phyllite from slate */
      if (M.platy > 0.6){
        var sh = Math.pow(Math.abs(Math.cos(gPhi[i])), 6) * M.platy * 0.42;
        gR[i] += (245-gR[i])*sh; gG[i] += (245-gG[i])*sh; gB[i] += (245-gB[i])*sh;
      }
      gLam[i] = 1;
    }
  }

  var mean = F.mean, fine = F.fine, fk = light === 'xpl' ? 0.90 : F.fineK;
  var meanR = light==='xpl' ? 46 : mean[0], meanG = light==='xpl' ? 46 : mean[1], meanB = light==='xpl' ? 44 : mean[2];
  if (light === 'xpl'){
    var sr=0,sg=0,sb=0,sw=0;
    for (i=0;i<N;i++){ sr+=gR[i]; sg+=gG[i]; sb+=gB[i]; sw++; }
    meanR = sr/sw; meanG = sg/sw; meanB = sb/sw;
  }

  /* relict sedimentary bedding, still visible at low grade and cut across
     by the cleavage — the observation that separates the two */
  var bed = 0;
  if ((st.proto.bedding || st.proto.clastic) && st.peakT < 520)
    bed = (1 - smoothstep(300, 520, st.peakT)) * (light==='xpl' ? 0.05 : 0.13);
  var bedK = 6.283 / (RH/5.5), bc = Math.cos(0.42), bs2 = Math.sin(0.42);
  var micaK = 6.283 / Math.max(3.4, F.grainPx * 0.52);
  /* pore space is wide and dark early, then fills with cement and closes */
  var poBand = (F.poro || 0) * 0.30 * clamp(F.grainPx/5, 0, 1);
  var cem = clamp((F.poro||0), 0, 1);
  var poR = 92 - 44*cem, poG = 82 - 44*cem, poB = 68 - 40*cem;
  if (light === 'xpl'){ poR = 10; poG = 10; poB = 12; }
  var twinK = 1 / Math.max(1.6, F.grainPx * 0.16);

  for (var py=0; py<RH; py++){
    var ro = py*RW;
    for (var px=0; px<RW; px++){
      var ii = ro+px, o = own[ii];
      var a = d1[ii], b = d2[ii];
      var edge = b > 0 ? a/b : 0;
      var bf = edge > 0.87 ? (light==='xpl' ? 0.74 : 0.56) + (1-edge)*3.2 : 1;
      if (bf > 1) bf = 1;

      var r = gR[o], g = gG[o], bl = gB[o];

      /* pore space between detrital grains, closing as they weld */
      if (poBand > 0 && edge > 1 - poBand){
        var pf2 = Math.min(1, (edge - (1 - poBand)) / (poBand * 0.72));
        var o4p = ii*4;
        img[o4p]   = cl(r + (poR - r)*pf2);
        img[o4p+1] = cl(g + (poG - g)*pf2);
        img[o4p+2] = cl(bl + (poB - bl)*pf2);
        img[o4p+3] = 255;
        continue;
      }

      var fx = gFx[o];
      if (fx === 'mica' || fx === 'twin'){
        var dx = px - F.qX[o], dy = py - F.qY[o];
        var across = -dx*Math.sin(gPhi[o]) + dy*Math.cos(gPhi[o]);
        if (fx === 'mica'){
          var lam2 = 0.5 + 0.5*Math.sin(across*micaK);
          var amp = light==='xpl' ? 0.015 : 0.075;
          r *= 1 - amp + amp*2*lam2*0.5; g *= 1 - amp + amp*2*lam2*0.5; bl *= 1 - amp + amp*2*lam2*0.5;
        } else if (light === 'xpl'){
          if ((((across*twinK)|0) & 1) === 0){
            var q2 = clamp(gLam[o] / Math.max(0.10, extAt(gPhi[o]+MIN[F.qMin[o]].ea+stage)), 0.58, 1.32);
            r *= q2; g *= q2; bl *= q2;
          }
        }
      } else if (fx === 'undul' && light === 'xpl'){
        var sw2 = 0.72 + 0.42*Math.sin((px - F.qX[o])*0.05 + (py - F.qY[o])*0.03);
        r *= sw2; g *= sw2; bl *= sw2;
      }

      var nz = (((py*53 + px*97) & 255) * 0.030 - 3.8);
      r += nz; g += nz; bl += nz;
      r *= bf; g *= bf; bl *= bf;

      if (bed > 0){
        var bp = (px*bc + py*bs2) * bedK;
        var bm = 1 + Math.sin(bp) * bed;
        r *= bm; g *= bm; bl *= bm;
      }

      if (fine > 0){
        r += (meanR*fk - r)*fine; g += (meanG*fk - g)*fine; bl += (meanB*fk - bl)*fine;
      }

      var o4 = ii*4;
      img[o4] = cl(r); img[o4+1] = cl(g); img[o4+2] = cl(bl); img[o4+3] = 255;
    }
  }

  /* ── pebbles, drawn over the matrix ────────────────────────────────────
     Each is a whole rock: its own lithology, its own internal grain size,
     a worn-round outline, and an axial ratio equal to the finite strain.
     With rising grade the internal fabric recrystallises and the boundary
     against the matrix goes diffuse. */
  var CL = F.clasts;
  if (CL && CL.length){
    var recry = smoothstep(380, 720, st.peakT);
    var mR = mean[0], mG = mean[1], mB = mean[2];
    for (var ci=0; ci<CL.length; ci++){
      var C = CL[ci], L = CLAST[C.lith];
      var gsz = Math.max(1.6, L.gs * (0.55 + 0.9*recry)) * (RW/452);
      var spk = L.spk * (1 - 0.45*recry);
      var x0 = Math.max(0, Math.floor(C.x - C.a*1.4)), x1 = Math.min(RW-1, Math.ceil(C.x + C.a*1.4));
      var y0 = Math.max(0, Math.floor(C.y - C.b*1.4)), y1 = Math.min(RH-1, Math.ceil(C.y + C.b*1.4));
      for (var cy=y0; cy<=y1; cy++){
        for (var cxp=x0; cxp<=x1; cxp++){
          var rr = clastHit(C, cxp, cy);
          if (rr < 0) continue;
          /* internal grain */
          var wv = worley(cxp, cy, light==='xpl' ? gsz*1.8 : gsz, C.sd);
          var hu = wv[0], wEdge = wv[1];
          var cr, cg, cb;
          if (light === 'xpl'){
            /* a pebble is polycrystalline: a mosaic of first-order greys,
               each internal grain at its own extinction position */
            if (L.k === 'basaltic' || L.k === 'chert' || L.k === 'jasper'){
              var vdk = 12 + hu*34; cr = vdk; cg = vdk; cb = vdk*0.96;
            } else {
              var br2 = 0.30 + 0.70*extAt(hu*3.1416 + stage);
              var lev = 150 + hu*70;
              cr = lev*br2; cg = lev*br2; cb = (lev-7)*br2;
            }
          } else {
            var jt2 = (hu - 0.5) * 2 * spk;
            if (L.k === 'granitoid'){
              cr = hu < 0.40 ? 202 : hu < 0.70 ? 214 : hu < 0.90 ? 218 : 74;
              cg = hu < 0.40 ? 158 : hu < 0.70 ? 214 : hu < 0.90 ? 214 : 70;
              cb = hu < 0.40 ? 140 : hu < 0.70 ? 212 : hu < 0.90 ? 206 : 64;
              cr += jt2*0.3; cg += jt2*0.3; cb += jt2*0.3;
              /* pull the speckle together so a 9 mm pebble reads as one rock */
              cr += (196-cr)*0.22; cg += (178-cg)*0.22; cb += (164-cb)*0.22;
            } else {
              cr = L.col[0] + jt2; cg = L.col[1] + jt2; cb = L.col[2] + jt2;
            }
            /* fine intra-grain noise so a flat pebble does not read as plastic */
            var nz2 = (((cy*53 + cxp*97) & 255) * 0.026 - 3.3);
            cr += nz2; cg += nz2; cb += nz2;
            /* recrystallised pebbles drift toward the matrix composition */
            cr += (mR - cr)*0.20*recry; cg += (mG - cg)*0.20*recry; cb += (mB - cb)*0.20*recry;
          }
          if (gsz > 2.2 && wEdge > 0.80){
            var wf = 0.62 + (1-wEdge)*1.9; if (wf > 1) wf = 1;
            cr *= wf; cg *= wf; cb *= wf;
          }
          /* rim: pressed against the matrix, diffuse at high grade */
          var rimW = 0.055 + 0.10*recry;
          if (rr > 1 - rimW){
            var t2 = (rr - (1 - rimW)) / rimW;
            var dk = 1 - 0.34*t2*(1 - 0.55*recry);
            cr *= dk; cg *= dk; cb *= dk;
          }
          var oo = (cy*RW + cxp)*4;
          img[oo] = cl(cr); img[oo+1] = cl(cg); img[oo+2] = cl(cb); img[oo+3] = 255;
        }
      }
    }
  }
  return img;
}

    h += '<div class="cc-segmented" id="segLight"><button class="cc-segmented-btn' + (S.light === 'ppl' ? ' is-active' : '') + '" data-light="ppl">Plane light</button><button class="cc-segmented-btn' + (S.light === 'xpl' ? ' is-active' : '') + '" data-light="xpl">Crossed polars</button></div>';
    if (S.light === 'xpl') h += '<label class="chip-rot">Rotate stage<input type="range" min="0" max="90" step="1" value="' + S.stage + '" id="rot"><output id="rotOut">' + S.stage + '°</output></label>';
  }
  R.innerHTML = h;
  R.querySelectorAll('[data-scale]').forEach(function(b){ b.onclick = function(){ S.scale = b.dataset.scale; renderChips(); draw(false); renderCard(); }; });
  R.querySelectorAll('[data-light]').forEach(function(b){ b.onclick = function(){ S.light = b.dataset.light; renderChips(); draw(false); }; });
  var rot = $('rot'); if (rot) rot.oninput = function(){ S.stage = +rot.value; $('rotOut').textContent = S.stage + '°'; draw(true); settle(); };
  syncPills();
}
function syncPills(){
  var L = $('chipsL'), h = '';
  if (S.step === 3){
    var st = slotStates()[0].st, rk = rockName(st);
    h += '<span class="pill"><b>' + esc(rk.n) + '</b>' + (st.peakT < 150 ? 'parent rock' : esc(FACIES[st.facies].n.toLowerCase()) + ' facies') + '</span>';
    if (st.past > 0.02) h += '<span class="pill hot">past peak — assemblage frozen</span>';
    if (st.melt > 0.005) h += '<span class="pill hot">melting · ' + Math.round(st.melt*100) + ' %</span>';
  }
  if (L.innerHTML !== h) L.innerHTML = h;
}

/* ═══════════════════════════════ PLAY ══════════════════════════════ */
function stopTween(){ S.tween = null; }
function play(){
  if (S.tween){ S.tween = null; refresh(false); return; }
  var L = stepDef().snaps(), i = nextSnap();
  if (i < 0){ S.v[S.step] = L[0].v; i = 1; }
  var r = rangeNow(), from = S.v[S.step], to = L[i].v, frac = Math.abs(to - from)/(r[1] - r[0]);
  S.tween = {from:from, to:to, t0:performance.now(), dur:(1.3 + 4.2*frac)*1000, step:S.step};
  S.played = true; syncControls(); requestAnimationFrame(stepTween);
}
function stepTween(now){
  var tw = S.tween; if (!tw || tw.step !== S.step) return;
  var f = clamp((now - tw.t0)/tw.dur, 0, 1);
  S.v[S.step] = tw.from + (tw.to - tw.from)*easeIO(f);
  if (f >= 1){ S.v[S.step] = tw.to; S.tween = null; refresh(false); return; }
  refresh(false, true);
  requestAnimationFrame(stepTween);
}

/* ═══════════════════════════════ ACTIONS ═══════════════════════════ */
function pickCell(proto, k){
  stopTween();
  var path = stepDef().chartPath(), u = colU(path, k); if (u === null) return;
  if (S.step === 1){ var qi = S.quad.indexOf(proto); if (qi < 0) S.quad[S.qsel] = proto; else S.qsel = qi; S.v[1] = u; }
  else if (S.step === 2){ S.proto = proto; S.v[2] = Math.min(colT('barrovian', k), pkT('contact')); }
  else { S.proto = proto; S.v[S.step] = u; }
  refresh(true);
}
function rowClick(proto){
  stopTween();
  if (S.step === 1){ var qi = S.quad.indexOf(proto); if (qi < 0) S.quad[S.qsel] = proto; else S.qsel = qi; }
  else S.proto = proto;
  refresh(true);
}
function setPath4(key){
  if (S.path4 === key) return;
  stopTween();
  var st = slotStates()[0].st;
  S.path4 = key;
  S.v[3] = uForTemp(key, Math.min(st.peakT, pkT(key)));
  refresh(true);
}
function setStep(i){
  stopTween(); S.step = i; S.played = false;
  document.querySelectorAll('#tabs [data-step]').forEach(function(b){ b.classList.toggle('is-active', +b.dataset.step === i); });
  refresh(true);
}

/* ═══════════════════════════════ CANVAS ════════════════════════════ */
var stageEl = $('stage'), cv = $('cv'), ctx = cv.getContext('2d'), ov = $('ov'), octx = ov.getContext('2d');
var CW = 0, CH = 0, DPR = 1, SLOTS = [];
function resize(){
  var r = stageEl.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = Math.max(200, Math.round(r.width)); CH = Math.max(200, Math.round(r.height));
  cv.width = ov.width = Math.round(CW*DPR); cv.height = ov.height = Math.round(CH*DPR);
  draw(false);
}
function draw(quick){
  if (capturing || !CW) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SLOTS = renderScene(ctx, CW, CH, {pr:DPR, quick:!!quick});
  SLOTS.quick = !!quick;
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, ov.width, ov.height); hideTip();
}
function refresh(full, quick){
  if (full){ renderControls(); renderChips(); } else syncControls();
  renderChart(); renderCard(); syncPills(); draw(!!quick);
}

/* hover: identify a grain or pebble */
var tip = $('tip');
function hideTip(){ tip.classList.remove('on'); }
function slotAt(mx, my){
  for (var i = 0; i < SLOTS.length; i++){ var s = SLOTS[i], cx = s.x + s.D/2, cy = s.y + s.D/2;
    if (s.hand ? (mx >= s.x && mx < s.x + s.D && my >= s.y && my < s.y + s.D) : (Math.hypot(mx - cx, my - cy) < s.D/2)) return s; }
  return null;
}
cv.addEventListener('mousemove', function(e){
  var r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, s = slotAt(mx, my);
  cv.style.cursor = s && S.step === 1 ? 'pointer' : 'default';
  if (!s || SLOTS.quick || S.tween){ hideTip(); octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, ov.width, ov.height); return; }
  var F = s.F, RW = F.RW, px = Math.floor((mx - s.x)/s.D*RW), py = Math.floor((my - s.y)/s.D*RW);
  if (px < 0 || py < 0 || px >= RW || py >= RW){ hideTip(); return; }
  var st = s.st, name, meta = [], dot;
  var clast = null;
  if (F.clasts && F.clasts.length) for (var ci = 0; ci < F.clasts.length; ci++) if (clastHit(F.clasts[ci], px, py) >= 0){ clast = F.clasts[ci]; break; }
  octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, ov.width, ov.height);
  if (clast){
    var Lc = CLAST[clast.lith]; name = Lc.n; dot = rgb(Lc.col);
    meta = ['pebble · a whole rock', 'axial ratio ' + (clast.a/clast.b).toFixed(1) + ' : 1', 'long axis ' + (clast.a*2/F.pxPerMm).toFixed(1) + ' mm'];
  } else {
    var id = F.own[py*RW + px], mk2 = F.qMin[id], M = MIN[mk2]; name = M.n; dot = rgb(M.col);
    meta.push((st.modes[mk2] || 0).toFixed(0) + ' vol %');
    if (ISOGRAD[mk2]) meta.push('appears ~' + ISOGRAD[mk2] + ' °C');
    if (M.pb) meta.push('porphyroblast');
    meta.push(M.platy >= 0.6 ? 'platy' : M.platy === 0 ? 'equant' : 'prismatic');
    if (lightNow() === 'xpl') meta.push(M.iso ? 'isotropic' : 'max birefringence ' + M.bi.toFixed(3));
    var od = new ImageData(RW, RW), dd = od.data;
    for (var y = 1; y < RW - 1; y++) for (var x = 1; x < RW - 1; x++){ var i2 = y*RW + x; if (F.own[i2] !== id) continue;
      if (F.own[i2-1] === id && F.own[i2+1] === id && F.own[i2-RW] === id && F.own[i2+RW] === id) continue;
      var o4 = i2*4; dd[o4] = 255; dd[o4+1] = 214; dd[o4+2] = 120; dd[o4+3] = 235; }
    var oc = document.createElement('canvas'); oc.width = RW; oc.height = RW; oc.getContext('2d').putImageData(od, 0, 0);
    octx.setTransform(DPR, 0, 0, DPR, 0, 0); octx.imageSmoothingEnabled = false; octx.drawImage(oc, s.x, s.y, s.D, s.D);
  }
  $('tipDot').style.background = dot; $('tipName').textContent = name; $('tipMeta').innerHTML = meta.map(esc).join('<br>');
  tip.classList.add('on');
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(CW - tw - 6, mx + 16) + 'px'; tip.style.top = Math.min(CH - th - 6, my + 14) + 'px';
});
cv.addEventListener('mouseleave', function(){ hideTip(); octx.setTransform(1, 0, 0, 1, 0, 0); octx.clearRect(0, 0, ov.width, ov.height); });
cv.addEventListener('click', function(e){
  if (S.step !== 1) return;
  var r = cv.getBoundingClientRect(), s = slotAt(e.clientX - r.left, e.clientY - r.top);
  if (s && s.qi !== undefined && s.qi !== S.qsel){ S.qsel = s.qi; refresh(false); }
});

/* ═══════════════════════════════ EXPORT HOOKS ══════════════════════ */
function stampText(){
  var sl = slotStates(), st = sl[0].st;
  if (S.step === 0) return 'Grade · ' + PROTO_BY[S.proto].n + ' · regional (collision) path · ' + Math.round(st.T) + ' °C · ' + Math.round(st.depth) + ' km';
  if (S.step === 1) return 'Parent rock · same path, same conditions · ' + Math.round(st.T) + ' °C · ' + Math.round(st.depth) + ' km';
  if (S.step === 2) return 'Contact vs regional · ' + PROTO_BY[S.proto].n + ' · ' + Math.round(curV()) + ' °C reached';
  return 'P–T space · ' + PROTO_BY[S.proto].n + ' · ' + PATH_BY[S.path4].n + ' · ' + Math.round(st.T) + ' °C · ' + st.P.toFixed(1) + ' kbar';
}
var FOOT = 'Rock names: ESSRT p. 15 · facies after Eskola / Bucher & Grapes · Al₂SiO₅ triple point after Holdaway (1971)';
function compose(c, sc, fi){
  c.setTransform(sc, 0, 0, sc, 0, 0);
  c.fillStyle = COL.bg; c.fillRect(0, 0, EW, EH);
  c.textBaseline = 'middle'; c.textAlign = 'left';
  c.font = '700 26px ' + FD; c.fillStyle = COL.t1; c.fillText('Metamorphic Transformation', 18, 30);
  c.font = '500 14px ' + FM; c.fillStyle = COL.t2; c.fillText(stampText(), 18, 56);
  c.textAlign = 'right'; c.font = '700 14px ' + FM; c.fillStyle = COL.accent; c.fillText('contextclimate.io', EW - 18, 30);
  var y0 = 74, h = EH - y0 - 34, chW = 360, cdW = 256, sw = EW - 32 - chW - cdW - 24, sx = 16 + chW + 12;
  drawChartCanvas(c, 16, y0, chW, h);
  c.save(); rrect(c, sx, y0, sw, h, 6); c.clip(); c.translate(sx, y0);
  renderScene(c, sw, h, {pr:sc, export:true, quick:fi >= 0 && EXQ === 'quick'});
  c.restore();
  c.strokeStyle = COL.line; c.lineWidth = 1; rrect(c, sx + 0.5, y0 + 0.5, sw - 1, h - 1, 6); c.stroke();
  drawCardCanvas(c, sx + sw + 12, y0, cdW, h, cardModel());
  c.textAlign = 'left'; c.font = '500 12px ' + FM; c.fillStyle = COL.t3; c.fillText(FOOT, 18, EH - 16);
}
function panelPNG(kind){
  if (kind === 'stage') return {w:1000, h:780, s:2, draw:function(c){ renderScene(c, 1000, 780, {pr:2, export:true}); }};
  if (kind === 'chart') return {w:420, h:660, s:3, draw:function(c){ drawChartCanvas(c, 12, 12, 396, 636); }};
  return {w:314, h:660, s:3, draw:function(c){ drawCardCanvas(c, 12, 12, 290, 636, cardModel()); }};
}
function slug(){
  var st = slotStates()[0].st;
  return 'metamorphic-' + STEP_KEY[S.step] + '-' + (S.step === 1 ? 'four-parents' : S.proto) + (S.step === 3 ? '-' + S.path4 : '') + '-' + Math.round(S.step === 2 ? curV() : st.T) + 'c';
}
function animSlug(){ return 'metamorphic-' + STEP_KEY[S.step] + '-' + (S.step === 1 ? 'four-parents' : S.proto) + (S.step === 3 ? '-' + S.path4 : '') + '-animation'; }
function sweep(kind){
  var L = stepDef().snaps().map(function(s){ return s.v; });
  return snapSweep(kind, L, function(v, hold){ S.v[S.step] = v; EXQ = hold ? 'full' : 'quick'; }, curV);
}
function afterExport(){ EXQ = 'full'; refresh(true); }

/* ═══════════════════════════════ INIT ══════════════════════════════ */
var LEGACY = {
  shlSl:  ['pelite',    330], slPh:   ['pelite',    440], phSch:  ['pelite',    575], schGn:  ['pelite',    999],
  grGn:   ['granite',   999], lmMbl:  ['limestone', 560], sndQtz: ['sandstone', 520]
};
(function init(){
  var tabs = $('tabs');
  STEP_LBL.forEach(function(t, i){ var b = mk('button', 'cc-segmented-btn' + (i === 0 ? ' is-active' : ''), '<span class="n">' + (i + 1) + '</span><span class="lb">' + esc(t) + '</span>'); b.dataset.step = i; b.title = t; b.onclick = function(){ setStep(i); }; tabs.appendChild(b); });
  var ser = $('series'), a = mk('a', 'cc-btn x-link', '&larr; <span class="nm">Bowen’s Reaction Series</span>');
  a.href = routeHref(ROUTE_BOWENS); a.target = '_top'; a.title = 'Bowen’s Reaction Series'; ser.appendChild(a);
  wireExports();

  S.v[0] = colU('barrovian', 0);
  S.v[1] = colU('barrovian', 2);
  var q = urlParams(), auto = null;
  var k = q.get('k');
  if (k && LEGACY[k]){ S.step = 0; S.proto = LEGACY[k][0]; var tu = uForTemp('barrovian', LEGACY[k][1]); auto = tu; S.v[0] = tu; }
  var pp = q.get('p'), pa = q.get('path'), gg = q.get('g');
  if (pp && PROTO_BY[pp]) S.proto = pp;
  if (pa && PATH_BY[pa] || gg !== null){
    var path = pa && PATH_BY[pa] ? pa : 'barrovian', g = gg !== null ? clamp(parseFloat(gg) || 0, 0, 1) : pkU(path);
    if (path === 'barrovian' && g <= pkU('barrovian') + 1e-6){ S.step = 0; S.v[0] = g; auto = g; }
    else { S.step = 3; S.path4 = path; S.v[3] = g; auto = g; }
  }
  var sp = parseInt(q.get('step'), 10); if (sp >= 1 && sp <= 4) S.step = sp - 1;
  document.querySelectorAll('#tabs [data-step]').forEach(function(b){ b.classList.toggle('is-active', +b.dataset.step === S.step); });
  new ResizeObserver(resize).observe(stageEl);
  refresh(true);
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (auto !== null && auto > 0.001 && !reduce){
    S.v[S.step] = 0; S.tween = {from:0, to:auto, t0:performance.now() + 300, dur:2800 + 3000*auto, step:S.step}; S.played = true;
    refresh(false); requestAnimationFrame(stepTween);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ chartSig = ''; lastCard = ''; refresh(false); });
  document.addEventListener('keydown', function(e){
    if (e.target && /^(INPUT|BUTTON|A|SELECT|LABEL)$/.test(e.target.tagName)) return;
    if (S.step === 1 || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
    var i = PROTO.findIndex(function(p){ return p.key === S.proto; });
    e.preventDefault(); rowClick(PROTO[clamp(i + (e.key === 'ArrowDown' ? 1 : -1), 0, PROTO.length - 1)].key);
  });
  window.__META = {S:S, refresh:refresh, setStep:setStep, stepDef:stepDef, slotStates:slotStates, cardModel:cardModel, chartModel:chartModel, compose:compose, play:play, pickCell:pickCell, setPath4:setPath4, exportPNG:exportPNG, sweep:sweep, renderScene:renderScene, specimen:specimen};
})();

</script>
