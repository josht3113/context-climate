<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --tool-accent: var(--accent-hourly);
  --tool-accent-light: #94c8da;
}

/* colors/font/background texture come from core-sample-tools.css body rule */
body {
  padding: 20px 0 48px;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ── Title ── */
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.title-sep { color: var(--color-text-muted); font-weight: 400; }
#title-period { color: var(--color-text-primary); }

/* ── Mode tabs (styling from core-sample-tools.css .cc-tab-bar/.cc-tab) ── */
.tab-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}

/* ── Station finder row — search + Near Me, matches current-conditions.html ── */
.station-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.finder-group {
  position: relative;
  display: flex;
  align-items: stretch;
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  transition: border-color .15s;
  flex: 0 0 auto;
}
.finder-group:focus-within { border-color: var(--tool-accent); }
.finder-group .search-icon { display: flex; align-items: center; padding-left: 12px; color: var(--color-text-muted); font-size: 16px; pointer-events: none; }
.finder-group .search-input { width: 260px; background: transparent; border: none; border-radius: 0; padding: 9px 10px; color: var(--color-text-primary); font-family: var(--font-mono); font-size: 15px; outline: none; }
.finder-group .search-input::placeholder { color: var(--color-text-muted); }
.finder-sep { width: 1px; align-self: stretch; margin: 7px 0; background: var(--color-border); }
.finder-group .locate-btn { border: none; border-radius: 0; background: transparent; white-space: nowrap; }
.dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); max-height: 272px; overflow-y: auto; z-index: 200; display: none; box-shadow: 0 10px 32px rgba(0,0,0,.6); }
.dropdown.open { display: block; }
.d-item { padding: 8px 12px; cursor: pointer; font-family: var(--font-mono); font-size: 14px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--color-border); transition: background .1s; }
.d-item:last-child { border-bottom: none; }
.d-item:hover, .d-item.hi { background: rgba(109,150,216,.18); }
.d-item .d-id { color: var(--tool-accent); font-weight: 700; width: 46px; flex-shrink: 0; }
.d-item .d-name { color: var(--color-text-primary); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-item .d-st { color: var(--color-text-muted); font-size: 13px; width: 22px; text-align: right; }
.d-item .d-dist { color: var(--tool-accent); font-size: 12px; width: 46px; flex-shrink: 0; text-align: right; }
.locate-btn.loading { opacity: .5; pointer-events: none; }

/* ── Controls row ── */
.controls-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  min-height: 30px;
}
.control-label {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
#year-select { color: var(--tool-accent-light); }

/* ── Stat chips: cc-stat-row/cc-stat-chip/cc-stat-label/cc-stat-value ── */

/* ── Legend ── */
.legend-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 6px;
}
.legend-end-label {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--color-text-secondary);
  white-space: nowrap;
}
#legend-canvas {
  border-radius: 3px;
  border: 1px solid var(--color-border);
  display: block;
}

/* ── Heatmap outer layout ── */
.heatmap-wrapper { width: 100%; }
.heatmap-inner { display: flex; align-items: flex-start; }

/* ── Hour labels ── */
.hour-labels {
  flex-shrink: 0;
  width: 52px;
  display: flex;
  flex-direction: column;
}
/* spacer to align with the month label row */
.hour-labels-spacer { height: 26px; }
.hour-label {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  color: #A6A499;
  text-align: right;
  padding-right: 9px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  /* height set in JS */
}

/* ── Canvas area ── */
.canvas-area { flex: 1; min-width: 0; position: relative; }

/* Month label bar */
.month-label-bar {
  position: relative;
  height: 26px;
  user-select: none;
}
.month-label {
  position: absolute;
  font-family: var(--font-mono);
  font-size: 15px;
  font-weight: 700;
  color: #A6A499;
  transform: translateX(-50%);
  white-space: nowrap;
  line-height: 26px;
}

/* Canvas container */
.canvas-container { position: relative; }
#heatmap-canvas {
  display: block;
  width: 100%;
  cursor: crosshair;
}

/* Loading overlay */
.loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(7, 7, 15, 0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.loading-text {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.4px;
  color: var(--color-text-secondary);
}
.progress-track {
  width: 280px;
  height: 5px;
  background: var(--color-surface-2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #5c3417, #e08a2e);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.error-text {
  font-family: var(--font-mono);
  font-size: 13px;
  color: #ef4444;
  margin-top: 4px;
}

/* ── Tooltip ── */
#tooltip {
  position: fixed;
  background: rgba(12, 12, 24, 0.97);
  border: 1px solid #2e2e50;
  border-radius: 8px;
  padding: 10px 14px;
  pointer-events: none;
  z-index: 200;
  display: none;
  width: 218px;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.tt-date {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--color-text-secondary);
  letter-spacing: 0.3px;
  margin-bottom: 5px;
}
.tt-value {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--tool-accent-light);
  line-height: 1;
  margin-bottom: 4px;
}
.tt-value.has-smoke { color: #f2a35c; }
.tt-value.no-smoke  { color: var(--color-text-muted); }
.tt-detail {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--color-text-secondary);
  line-height: 1.35;
}

/* ── Footer ── */
.footer {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--color-text-muted);
}

/* ── Header eyebrow ── */
.page-eyebrow { margin-bottom: 6px; }
</style>

    </div>
  </div>

  <div class="legend-row">

  </div>

  <div class="heatmap-wrapper">
    <div class="heatmap-inner">

      </div>

        </div>
      </div>

    </div>
  </div>

  <div class="footer">
    <span id="footer-tz">Eastern Local Time</span> &nbsp;|&nbsp; Data: IEM ASOS &middot; present-weather code FU (smoke)

</div><!-- /.container -->

// Month metadata (using 366-day base for DOY indexing)
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL  = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
const MONTH_DAYS_LEAP   = [31,29,31,30,31,30,31,31,30,31,30,31];
const MONTH_DAYS_NOLEAP = [31,28,31,30,31,30,31,31,30,31,30,31];

// Cumulative DOY start per month (0-based, leap-year frame for array indexing)
const MONTH_START_DOY = (() => {
  const arr = [0];
  for (let m = 0; m < 11; m++) arr.push(arr[m] + MONTH_DAYS_LEAP[m]);
  return arr;
})(); // [0,31,60,91,121,152,182,213,244,274,305,335]

// ── Smoke color palette ──────────────────────────────────────
// t = 0..1 maps to probability 0 → MAX_PROB. Ramp runs charcoal (no
// reports) → smoky brown-grey → amber haze → deep orange-red, echoing
// the color of a sky thick with wildfire/agricultural smoke.
const MAX_PROB = 0.10;
const COLOR_STOPS = [
  { t: 0.00, rgb: [8,   8,   10 ] },
  { t: 0.10, rgb: [32,  27,  24 ] },
  { t: 0.28, rgb: [82,  54,  34 ] },
  { t: 0.48, rgb: [150, 84,  36 ] },
  { t: 0.68, rgb: [205, 112, 34 ] },
  { t: 0.85, rgb: [217, 76,  32 ] },
  { t: 1.00, rgb: [178, 32,  26 ] },
];

function lerpColor(t) {
  t = Math.max(0, Math.min(1, t));
  let lo = COLOR_STOPS[0], hi = COLOR_STOPS[COLOR_STOPS.length - 1];
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    if (t <= COLOR_STOPS[i + 1].t) { lo = COLOR_STOPS[i]; hi = COLOR_STOPS[i + 1]; break; }
  }
  const span = hi.t - lo.t;
  const f = span < 1e-6 ? 0 : (t - lo.t) / span;
  return [
    Math.round(lo.rgb[0] + f * (hi.rgb[0] - lo.rgb[0])),
    Math.round(lo.rgb[1] + f * (hi.rgb[1] - lo.rgb[1])),
    Math.round(lo.rgb[2] + f * (hi.rgb[2] - lo.rgb[2])),
  ];
}
function probToRGB(prob)  { return lerpColor(Math.min(1, prob / MAX_PROB)); }
function rgb(r, g, b)     { return `rgb(${r},${g},${b})`; }

// ═══════════════════════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════════════════════
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function getDOY0(year, month, day) {
  // 0-based DOY: Jan 1 = 0
  const md = isLeap(year) ? MONTH_DAYS_LEAP : MONTH_DAYS_NOLEAP;
  let d = 0;
  for (let m = 0; m < month - 1; m++) d += md[m];
  return d + day - 1;
}

function doyToMonthDay(doy) {
  // Uses 366-day frame
  let rem = doy;
  for (let m = 0; m < 12; m++) {
    if (rem < MONTH_DAYS_LEAP[m]) return { m, day: rem + 1 };
    rem -= MONTH_DAYS_LEAP[m];
  }
  return { m: 11, day: 31 };
}

function fmtHour(h) {
  if (h === 0)  return 'Midnight';
  if (h === 12) return 'Noon';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

// ═══════════════════════════════════════════════════════════════
// IEM FETCH + PARSE
// One request for the full date range avoids IEM rate limiting
// entirely. The large CSV is parsed in one pass, observations
// keyed by year for correct per-year probability calculation.
// ═══════════════════════════════════════════════════════════════

function buildIEMUrl(y1, y2) {
  const st = activeStation();
  const tz = encodeURIComponent(st.tz);
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?` +
    `station=${activeStationId}&data=metar` +
    `&year1=${y1}&month1=1&day1=1` +
    `&year2=${y2}&month2=12&day2=31` +
    `&tz=${tz}&format=comma&latlon=no&missing=M&trace=T&direct=no`;
}

// Detect a smoke report in the raw METAR string — present-weather code FU
// (and "VCFU", smoke in the vicinity), checked before RMK to avoid remarks
// text (e.g. "RMK ... SMOKE FU") double-counting the same observation.
function detectSmoke(metar) {
  if (!metar || metar === 'M') return false;
  const up = metar.toUpperCase();
  if (!up.includes('FU')) return false;
  const rmk = up.indexOf(' RMK ');
  const body = rmk > 0 ? up.substring(0, rmk) : up;
  return /(^|\s)(VC)?FU(?=\s|$)/.test(body);
}

async function fetchRangeCSV(y1, y2) {
  const resp = await fetch(buildIEMUrl(y1, y2));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

// Parse a (possibly multi-year) IEM CSV.
// Returns Map<year, Array<{doy, hour, hasSmoke}>> for correct per-year grouping.
function parseIEM(text) {
  const lines = text.split('\n');
  const byYear = new Map();
  let metarIdx = 2;
  let inData = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('station,')) {
      const h = line.split(',');
      const mi = h.indexOf('metar');
      if (mi >= 0) metarIdx = mi;
      inData = true;
      continue;
    }
    if (!inData) continue;

    const parts = line.split(',');
    if (parts.length < 3) continue;

    // "2024-07-04 15:53"
    const valid    = parts[1].trim();
    const spaceIdx = valid.indexOf(' ');
    if (spaceIdx < 1) continue;

    const dp = valid.substring(0, spaceIdx).split('-').map(Number);
    if (dp.length < 3 || isNaN(dp[0])) continue;

    const [yr, mo, dy] = dp;
    const hour = parseInt(valid.substring(spaceIdx + 1));
    if (isNaN(hour) || hour < 0 || hour > 23) continue;

    const doy = getDOY0(yr, mo, dy);
    if (doy < 0 || doy > 365) continue;

    const metarStr = parts.slice(metarIdx).join(',').trim();

    if (!byYear.has(yr)) byYear.set(yr, []);
    byYear.get(yr).push({ doy, hour, hasSmoke: detectSmoke(metarStr) });
  }

  return byYear;
}

function initGrids() {
  smokeCount = Array.from({ length: 366 }, () => new Int16Array(24));
  dataCount  = Array.from({ length: 366 }, () => new Int16Array(24));
}

function processYear(obs) {
  // Use typed arrays for per-year tracking (366*24 flat)
  const yFU   = new Uint8Array(366 * 24);
  const yData = new Uint8Array(366 * 24);

  for (const { doy, hour, hasSmoke } of obs) {
    const idx = doy * 24 + hour;
    yData[idx] = 1;
    if (hasSmoke) yFU[idx] = 1;
  }

  for (let d = 0; d < 366; d++) {
    for (let h = 0; h < 24; h++) {
      const idx = d * 24 + h;
      if (yData[idx]) {
        dataCount[d][h]++;
        if (yFU[idx]) smokeCount[d][h]++;
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
// NOW-MARKER HELPERS
// ═══════════════════════════════════════════════════════════════
function getNowInStationTZ() {
  const st  = activeStation();
  const dtf = new Intl.DateTimeFormat('en-CA', {
    timeZone: st.tz,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', hourCycle: 'h23',
  });
  const parts = dtf.formatToParts(new Date());
  const get   = type => parseInt(parts.find(p => p.type === type).value);
  return { year: get('year'), month: get('month'), day: get('day'), hour: get('hour') % 24 };
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.arcTo(x + w, y,     x + w, y + r,     r);
  c.lineTo(x + w, y + h - r);
  c.arcTo(x + w, y + h, x + w - r, y + h, r);
  c.lineTo(x + r, y + h);
  c.arcTo(x,     y + h, x,     y + h - r, r);
  c.lineTo(x, y + r);
  c.arcTo(x,     y,     x + r, y,         r);
  c.closePath();
}

// ═══════════════════════════════════════════════════════════════
// CANVAS / RENDER
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('heatmap-canvas');
const ctx    = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function setupCanvas() {
  const W = document.getElementById('canvas-area').clientWidth;
  const H = CANVAS_HEIGHT;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

function renderHeatmap() {
  const W = canvas.width  / dpr;
  const H = canvas.height / dpr;
  const cellW = W / 366;
  const cellH = H / 24;

  // ImageData for fast pixel drawing
  const imgData = ctx.createImageData(Math.round(W * dpr), Math.round(H * dpr));
  const data = imgData.data;

  const pw = Math.round(W  * dpr);
  const ph = Math.round(H  * dpr);

  for (let doy = 0; doy < 366; doy++) {
    const x0 = Math.round(doy * cellW * dpr);
    const x1 = Math.round((doy + 1) * cellW * dpr);

    for (let h = 0; h < 24; h++) {
      const y0 = Math.round(h * cellH * dpr);
      const y1 = Math.round((h + 1) * cellH * dpr);

      let r, g, b;
      if (mode === 'climatology') {
        const dc = dataCount[doy][h];
        // Require ≥ 1/3 of years to avoid inflated % on leap-year-only DOYs
        const prob = dc >= Math.ceil(TOTAL_YEARS / 3) ? smokeCount[doy][h] / dc : 0;
        [r, g, b] = probToRGB(prob);
      } else {
        const hasSmoke = singleGrid && singleGrid[doy * 24 + h] === 1;
        [r, g, b] = hasSmoke ? [217, 90, 34] : [8, 8, 10];
      }

      for (let py = y0; py < y1 && py < ph; py++) {
        for (let px = x0; px < x1 && px < pw; px++) {
          const i = (py * pw + px) * 4;
          data[i]     = r;
          data[i + 1] = g;
          data[i + 2] = b;
          data[i + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Month dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let m = 1; m < 12; m++) {
    const x = Math.round(MONTH_START_DOY[m] * cellW) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Noon divider
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  const noonY = Math.round(12 * cellH) + 0.5;
  ctx.beginPath(); ctx.moveTo(0, noonY); ctx.lineTo(W, noonY); ctx.stroke();

  // Now marker overlay (climatology mode only)
  if (nowMarkerActive && mode === 'climatology') drawNowMarker();
}

// ── Legend ──────────────────────────────────────────────────
function renderLegend() {
  const lc  = document.getElementById('legend-canvas');
  const lx  = lc.getContext('2d');
  const W   = lc.width;
  const H   = lc.height;

  lx.clearRect(0, 0, W, H);

  if (mode === 'climatology') {
    const grad = lx.createLinearGradient(0, 0, W, 0);
    for (const stop of COLOR_STOPS) {
      const [r, g, b] = lerpColor(stop.t);
      grad.addColorStop(stop.t, `rgb(${r},${g},${b})`);
    }
    lx.fillStyle = grad;
    lx.fillRect(0, 0, W, H);
    document.getElementById('legend-lo').textContent = '0%';
    document.getElementById('legend-hi').textContent = '≥ 10%';
  } else {
    lx.fillStyle = rgb(8, 8, 10);
    lx.fillRect(0, 0, W / 2, H);
    lx.fillStyle = rgb(217, 90, 34);
    lx.fillRect(W / 2, 0, W / 2, H);
    document.getElementById('legend-lo').textContent = 'No smoke';
    document.getElementById('legend-hi').textContent = 'Smoke reported';
  }
}

// ── Now marker ───────────────────────────────────────────────
function drawNowMarker() {
  const { year, month, day, hour } = getNowInStationTZ();
  const doy = getDOY0(year, month, day);
  if (doy < 0 || doy > 365) return;

  const W     = canvas.width  / dpr;
  const H     = canvas.height / dpr;
  const cellW = W / 366;
  const cellH = H / 24;
  const x     = (doy  + 0.5) * cellW;
  const y     = (hour + 0.5) * cellH;

  ctx.save();

  // Dashed crosshair lines
  ctx.strokeStyle = 'rgba(255,255,255,0.70)';
  ctx.lineWidth   = 1.5;
  ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  ctx.setLineDash([]);

  // Intersection dot
  ctx.fillStyle   = '#ffffff';
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // Callout label
  const label = `${MONTHS_SHORT[month - 1]} ${day}  ·  ${fmtHour(hour)}`;
  ctx.font     = 'bold 13px "Courier Prime", monospace';
  const tw     = ctx.measureText(label).width;
  const BP = 7, BH = 23, BW = tw + BP * 2;

  let bx = x + 10, by = y - BH - 7;
  if (bx + BW > W - 4) bx = x - BW - 10;
  if (by < 4)           by = y + 8;

  ctx.fillStyle   = 'rgba(8,8,24,0.93)';
  ctx.strokeStyle = 'rgba(148,200,218,0.85)';
  ctx.lineWidth   = 1;
  roundRect(ctx, bx, by, BW, BH, 4); ctx.fill(); ctx.stroke();

  ctx.fillStyle = '#E8E4D9';
  ctx.font      = 'bold 13px "Courier Prime", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(label, bx + BP, by + BH - 6);

  ctx.restore();
}

function toggleNow() {
  nowMarkerActive = !nowMarkerActive;
  document.getElementById('btn-now').classList.toggle('active', nowMarkerActive);
  if (mode === 'climatology' && smokeCount) renderHeatmap();
}

// ── Hour labels ──────────────────────────────────────────────
function renderHourLabels() {
  const container = document.getElementById('hour-labels');
  // Remove all children except spacer
  while (container.children.length > 1) container.removeChild(container.lastChild);

  const cellH = CANVAS_HEIGHT / 24;

  for (let h = 0; h < 24; h++) {
    const el = document.createElement('div');
    el.className = 'hour-label';
    el.style.height = cellH + 'px';

    if      (h === 0)  el.textContent = 'Midnight';
    else if (h === 12) el.textContent = 'Noon';
    else               el.textContent = h < 12 ? h : h - 12;

    container.appendChild(el);
  }
}

// ── Month labels ─────────────────────────────────────────────
function renderMonthLabels() {
  const bar = document.getElementById('month-label-bar');
  bar.innerHTML = '';
  const W = document.getElementById('canvas-area').clientWidth;
  const cellW = W / 366;

  for (let m = 0; m < 12; m++) {
    const startDOY = MONTH_START_DOY[m];
    const endDOY   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const midDOY   = (startDOY + endDOY) / 2;

    const el = document.createElement('div');
    el.className = 'month-label';
    el.textContent = MONTHS_SHORT[m];
    el.style.left  = (midDOY * cellW) + 'px';
    bar.appendChild(el);
  }
}

// ═══════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════
function updateStats() {
  if (mode === 'climatology' && smokeCount) {
    document.getElementById('sv-period').textContent = `${CLIMO_START}–${CLIMO_END}`;
    document.getElementById('sl-period').textContent = 'Period';
    document.getElementById('sl-annual').textContent = 'Avg Smoke Hrs / Yr';

    // Peak month
    const monthAvg = MONTHS_SHORT.map((_, m) => {
      const s = MONTH_START_DOY[m];
      const e = m < 11 ? MONTH_START_DOY[m + 1] : 366;
      let sum = 0, n = 0;
      for (let d = s; d < e; d++)
        for (let h = 0; h < 24; h++)
          if (dataCount[d][h] > 2) { sum += smokeCount[d][h] / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakM = monthAvg.indexOf(Math.max(...monthAvg));
    document.getElementById('sv-month').textContent = MONTHS_FULL[peakM];

    // Peak hour
    const hourAvg = Array.from({ length: 24 }, (_, h) => {
      let sum = 0, n = 0;
      for (let d = 0; d < 366; d++)
        if (dataCount[d][h] > 2) { sum += smokeCount[d][h] / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakH = hourAvg.indexOf(Math.max(...hourAvg));
    document.getElementById('sv-hour').textContent = fmtHour(peakH);

    // Avg smoke hours per year
    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++) total += smokeCount[d][h];
    document.getElementById('sv-annual').textContent = (total / TOTAL_YEARS).toFixed(1);

  } else if (mode === 'single' && singleGrid) {
    document.getElementById('sv-period').textContent = currentYear;
    document.getElementById('sl-period').textContent = 'Year';
    document.getElementById('sl-annual').textContent = 'Total Smoke Hours';

    let total = 0;
    for (let i = 0; i < 366 * 24; i++) if (singleGrid[i]) total++;
    document.getElementById('sv-annual').textContent = total;

    // Peak month for single year
    const byMonth = Array(12).fill(0);
    for (let d = 0; d < 366; d++) {
      const { m } = doyToMonthDay(d);
      for (let h = 0; h < 24; h++)
        if (singleGrid[d * 24 + h]) byMonth[m]++;
    }
    const peakM = byMonth.indexOf(Math.max(...byMonth));
    document.getElementById('sv-month').textContent = byMonth[peakM] ? MONTHS_FULL[peakM] : '–';

    // Peak hour for single year
    const byHour = Array(24).fill(0);
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (singleGrid[d * 24 + h]) byHour[h]++;
    const peakH = byHour.indexOf(Math.max(...byHour));
    document.getElementById('sv-hour').textContent = byHour[peakH] ? fmtHour(peakH) : '–';
  }
}

// ═══════════════════════════════════════════════════════════════
// LOADING UI
// ═══════════════════════════════════════════════════════════════
function showLoading(txt) {
  const ov = document.getElementById('loading-overlay');
  ov.style.display = 'flex';
  document.getElementById('loading-text').textContent = txt;
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('error-text').style.display = 'none';
}
function setProgress(pct, txt) {
  document.getElementById('progress-fill').style.width = pct + '%';
  if (txt) document.getElementById('loading-text').textContent = txt;
  // Show running smoke-report count so we can see data is being found (no dev tools needed)
  let fuTotal = 0;
  if (smokeCount) {
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++) fuTotal += smokeCount[d][h];
  }
  const ctr = document.getElementById('smoke-counter');
  if (ctr) ctr.textContent = fuTotal > 0 ? `🌫 ${fuTotal} smoke reports found so far` : '';
}
function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}
function showError(msg) {
  document.getElementById('loading-text').textContent = 'Some years failed to load.';
  const et = document.getElementById('error-text');
  et.textContent = msg;
  et.style.display = 'block';
  setTimeout(hideLoading, 3000);
}

// ═══════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  if (!smokeCount && mode === 'climatology') { tooltip.style.display = 'none'; return; }
  if (mode === 'single' && !singleGrid)        { tooltip.style.display = 'none'; return; }

  const rect = canvas.getBoundingClientRect();
  const doy  = Math.min(365, Math.max(0, Math.floor((e.clientX - rect.left) / rect.width  * 366)));
  const h    = Math.min(23,  Math.max(0, Math.floor((e.clientY - rect.top)  / rect.height * 24)));

  const { m, day } = doyToMonthDay(doy);
  document.getElementById('tt-date').textContent = `${MONTHS_FULL[m]} ${day}  ·  ${fmtHour(h)}`;

  const val = document.getElementById('tt-value');
  const det = document.getElementById('tt-detail');
  val.className = 'tt-value';

  if (mode === 'climatology') {
    const dc = dataCount[doy][h];
    const tc = smokeCount[doy][h];
    if (dc < Math.ceil(TOTAL_YEARS / 3)) {
      val.textContent = '–';
      det.textContent = 'Insufficient data';
    } else {
      const pct = (tc / dc * 100).toFixed(1);
      val.textContent = pct + '%';
      det.textContent = `${tc} of ${dc} years had smoke reported`;
    }
  } else {
    const has = singleGrid && singleGrid[doy * 24 + h] === 1;
    val.textContent = has ? '🌫 Smoke' : 'No smoke';
    val.classList.add(has ? 'has-smoke' : 'no-smoke');
    det.textContent = has ? 'FU observed in METAR this hour' : '';
  }

  tooltip.style.display = 'block';
  const TW = 218, TH = 90;
  let tx = e.clientX + 16;
  let ty = e.clientY - 10;
  if (tx + TW > window.innerWidth  - 10) tx = e.clientX - TW - 12;
  if (ty + TH > window.innerHeight - 10) ty = window.innerHeight - TH - 10;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════
// LOAD – CLIMATOLOGY (one large request per station)
// ═══════════════════════════════════════════════════════════════
async function loadClimatology() {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = `${CLIMO_START}–${CLIMO_END}`;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;

  // Return cached data immediately if available
  if (climoCache.has(activeStationId)) {
    const c = climoCache.get(activeStationId);
    smokeCount = c.smokeCount; dataCount = c.dataCount;
    renderHeatmap(); renderLegend(); updateStats();
    return;
  }

  initGrids();
  showLoading(`Fetching ${CLIMO_START}–${CLIMO_END} from IEM… (one large request, may take ~30s)`);

  try {
    const csv = await fetchRangeCSV(CLIMO_START, CLIMO_END);
    setProgress(60, 'Parsing observations…');
    await sleep(30);
    const byYear = parseIEM(csv);
    setProgress(90, 'Aggregating by year…');
    await sleep(30);
    for (const obs of byYear.values()) processYear(obs);
    setProgress(100);

    // Cache so switching back is instant
    climoCache.set(activeStationId, {
      smokeCount: smokeCount.map(r => Int16Array.from(r)),
      dataCount:  dataCount.map(r => Int16Array.from(r)),
    });

    hideLoading();
  } catch(e) {
    showError(`Failed to load: ${e.message}`);
    console.error('Climatology load failed:', e);
    return;
  }

  renderHeatmap(); renderLegend(); updateStats();
}

// ═══════════════════════════════════════════════════════════════
// LOAD – SINGLE YEAR
// ═══════════════════════════════════════════════════════════════
async function loadSingleYear(year) {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = year;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;
  showLoading(`Loading ${year} data…`);

  try {
    const csv = await fetchRangeCSV(year, year);
    const byYear = parseIEM(csv);
    const obs = byYear.get(year) || [];

    singleGrid = new Uint8Array(366 * 24);
    for (const { doy, hour, hasSmoke } of obs) {
      if (hasSmoke) singleGrid[doy * 24 + hour] = 1;
    }

    hideLoading();
    renderHeatmap();
    renderLegend();
    updateStats();
  } catch (err) {
    document.getElementById('loading-text').textContent = 'Failed to load data.';
    document.getElementById('error-text').textContent = err.message;
    document.getElementById('error-text').style.display = 'block';
    console.error(err);
  }
}

// ═══════════════════════════════════════════════════════════════
// STATION SEARCH / NEAR-ME — mirrors current-conditions.html's finder
// ═══════════════════════════════════════════════════════════════
let ddIdx = -1;

// Great-circle distance in miles — used to rank the roster by proximity to a point.
function haversineMiles(lat1,lon1,lat2,lon2){
  const R=3958.8,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

function selectStation(entry) {
  activeStationId = entry[0];
  singleGrid = null;
  smokeCount = null; dataCount = null;
  document.getElementById('station-search').value = '';
  document.getElementById('station-dd').classList.remove('open');
  if (mode === 'climatology') loadClimatology();
  else loadSingleYear(currentYear);
}

// "Near Me" — geolocate the browser, rank the static roster by haversine
// distance, and surface the closest matches in the dropdown (with mile
// badges) rather than silently auto-picking one, so the user can confirm.
function findNearestStation(){
  const btn=document.getElementById('locate-btn');
  if(!navigator.geolocation){alert('Geolocation is not supported by this browser.');return;}
  const orig=btn.innerHTML;btn.classList.add('loading');btn.innerHTML='&#8987; Locating…';
  navigator.geolocation.getCurrentPosition(pos=>{
    btn.classList.remove('loading');btn.innerHTML=orig;
    const{latitude:lat,longitude:lon}=pos.coords;
    const ranked=STATIONS.map(s=>({s,dist:haversineMiles(lat,lon,s[3],s[4])})).sort((a,b)=>a.dist-b.dist).slice(0,8);
    document.getElementById('station-search').value='';
    renderDD(ranked.map(r=>r.s),ranked.map(r=>r.dist));
  },err=>{
    btn.classList.remove('loading');btn.innerHTML=orig;
    alert('Could not get your location: '+(err&&err.message?err.message:'permission denied or unavailable.'));
  },{enableHighAccuracy:false,timeout:8000,maximumAge:600000});
}

function initSearch(){
  const inp=document.getElementById('station-search'),dd=document.getElementById('station-dd');
  inp.addEventListener('input',()=>{
    ddIdx=-1;const q=inp.value.trim().toLowerCase();
    if(!q){dd.classList.remove('open');return;}
    const matches=STATIONS.filter(s=>s[0].toLowerCase().startsWith(q)||s[0].slice(1).toLowerCase().startsWith(q)||s[1].toLowerCase().includes(q)||(s[2]&&s[2].toLowerCase()===q)).slice(0,18);
    renderDD(matches);
  });
  inp.addEventListener('keydown',e=>{
    const items=dd.querySelectorAll('.d-item');
    if(e.key==='ArrowDown'){e.preventDefault();ddIdx=Math.min(ddIdx+1,items.length-1);highlightDD(items);}
    else if(e.key==='ArrowUp'){e.preventDefault();ddIdx=Math.max(ddIdx-1,0);highlightDD(items);}
    else if(e.key==='Enter'){e.preventDefault();if(ddIdx>=0&&items[ddIdx])items[ddIdx].click();}
    else if(e.key==='Escape'){dd.classList.remove('open');}
  });
  document.addEventListener('click',e=>{if(!document.getElementById('station-finder').contains(e.target))dd.classList.remove('open');});
}
function highlightDD(items){items.forEach((el,i)=>{el.classList.toggle('hi',i===ddIdx);if(i===ddIdx)el.scrollIntoView({block:'nearest'});});}
function renderDD(matches,dists){
  const dd=document.getElementById('station-dd');
  if(!matches.length){dd.classList.remove('open');return;}
  dd.innerHTML=matches.map((s,i)=>`<div class="d-item" data-idx="${i}"><span class="d-id">${s[0]}</span><span class="d-name">${s[1]}</span>${dists?`<span class="d-dist">${dists[i].toFixed(0)}mi</span>`:''}<span class="d-st">${s[2]}</span></div>`).join('');
  dd.querySelectorAll('.d-item').forEach((el,i)=>el.addEventListener('click',()=>{selectStation(matches[i]);}));
  dd.classList.add('open');
}

// ═══════════════════════════════════════════════════════════════
// DOWNLOAD PNG — renders a standalone image with full context
// ═══════════════════════════════════════════════════════════════
function downloadPNG() {
  const st       = activeStation();
  const period   = mode === 'single' ? String(currentYear) : `${CLIMO_START}–${CLIMO_END}`;
  const subtitle = mode === 'climatology'
    ? `Probability of smoke reported by hour and day of year  ·  ${CLIMO_START}–${CLIMO_END}`
    : `Hours with smoke reported (METAR code FU)  ·  ${currentYear}`;

  const cw = canvas.width  / dpr;
  const ch = canvas.height / dpr;

  // Layout constants
  const PAD_TOP    = 24;   // top padding inside header
  const HDR        = 90;   // header area height
  const MONTH_H    = 28;   // month label strip height
  const FTR        = 46;   // footer area (x-axis label + source line)
  const YTITLE_W   = 22;   // rotated y-axis title column width
  const HLABEL_W   = 72;   // hour label column width
  const LEFT       = YTITLE_W + HLABEL_W;
  const RIGHT_PAD  = 28;

  const ow = LEFT + cw + RIGHT_PAD;
  const oh = HDR + MONTH_H + ch + FTR;

  const off = document.createElement('canvas');
  off.width  = ow * 2;
  off.height = oh * 2;
  const oc = off.getContext('2d');
  oc.scale(2, 2);

  // ── Background ──
  oc.fillStyle = '#1E2320';
  oc.fillRect(0, 0, ow, oh);

  // ── Top accent bar ──
  const grad = oc.createLinearGradient(0, 0, ow, 0);
  COLOR_STOPS.forEach(s => {
    const [r, g, b] = lerpColor(s.t);
    grad.addColorStop(s.t, `rgb(${r},${g},${b})`);
  });
  oc.fillStyle = grad;
  oc.fillRect(0, 0, ow, 3);

  // ── Station + title ──
  oc.fillStyle = '#E8E4D9';
  oc.font = 'bold 20px "Zilla Slab", serif';
  oc.fillText(`${st.label}  ·  Smoke Heatmap  ·  ${period}`, PAD_TOP, 28);

  // ── Subtitle ──
  oc.fillStyle = '#A6A499';
  oc.font = '14px "Public Sans", sans-serif';
  oc.fillText(subtitle, PAD_TOP, 48);

  // ── Stats row (climatology only) ──
  if (mode === 'climatology' && smokeCount) {
    const peak = document.getElementById('sv-month').textContent;
    const hr   = document.getElementById('sv-hour').textContent;
    const avg  = document.getElementById('sv-annual').textContent;
    oc.fillStyle = '#94c8da';
    oc.font = 'bold 13px "Courier Prime", monospace';
    oc.fillText(`Peak month: ${peak}   Peak hour: ${hr}   Avg smoke hrs/yr: ${avg}`, PAD_TOP, 68);
  }

  // ── ContextClimate branding (top right) ──
  oc.fillStyle = '#948F82';
  oc.font = '13px "Courier Prime", monospace';
  oc.textAlign = 'right';
  oc.fillText('contextclimate.io', ow - RIGHT_PAD, 28);
  oc.textAlign = 'left';

  // ── Y-axis title (rotated) ──
  const heatTop  = HDR + MONTH_H;
  const heatLeft = LEFT;
  const cellH    = ch / 24;
  const cellW    = cw / 366;

  oc.save();
  oc.fillStyle = '#A6A499';
  oc.font = 'bold 12px "Courier Prime", monospace';
  oc.textAlign = 'center';
  oc.translate(YTITLE_W / 2, heatTop + ch / 2);
  oc.rotate(-Math.PI / 2);
  oc.fillText(`${st.tzLabel.toUpperCase()} LOCAL TIME`, 0, 4);
  oc.restore();
  oc.textAlign = 'left';

  // ── Hour axis labels (every 3 hours) ──
  const HOUR_TICKS = [0, 3, 6, 9, 12, 15, 18, 21];
  oc.font = 'bold 13px "Courier Prime", monospace';
  oc.textAlign = 'right';
  for (const h of HOUR_TICKS) {
    const label = h === 0 ? 'Midnight' : h === 12 ? 'Noon'
                : h < 12  ? `${h} AM`  : `${h - 12} PM`;
    const ty = heatTop + h * cellH + cellH / 2;
    oc.fillStyle = '#A6A499';
    oc.fillText(label, heatLeft - 8, ty + 4);
    // Tick mark
    oc.strokeStyle = 'rgba(166,164,153,0.45)';
    oc.lineWidth = 1;
    oc.beginPath(); oc.moveTo(heatLeft - 5, ty); oc.lineTo(heatLeft, ty); oc.stroke();
  }
  oc.textAlign = 'left';

  // ── Month label strip ──
  oc.font = 'bold 14px "Courier Prime", monospace';
  oc.textAlign = 'center';
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e - 1) / 2;
    oc.fillStyle = '#A6A499';
    oc.fillText(MONTHS_SHORT[m], heatLeft + mid * cellW, HDR + MONTH_H - 7);
    // Tick mark below month label
    const tx = heatLeft + MONTH_START_DOY[m] * cellW;
    if (m > 0) {
      oc.strokeStyle = 'rgba(166,164,153,0.35)';
      oc.lineWidth = 1;
      oc.beginPath(); oc.moveTo(tx, HDR + MONTH_H); oc.lineTo(tx, HDR + MONTH_H - 5); oc.stroke();
    }
  }
  oc.textAlign = 'left';

  // ── Heatmap image ──
  oc.drawImage(canvas, heatLeft, heatTop, cw, ch);

  // ── Heatmap border ──
  oc.strokeStyle = 'rgba(255,255,255,0.09)';
  oc.lineWidth = 1;
  oc.strokeRect(heatLeft, heatTop, cw, ch);

  // ── Month dividers over heatmap ──
  oc.strokeStyle = 'rgba(255,255,255,0.13)';
  oc.lineWidth = 1;
  for (let m = 1; m < 12; m++) {
    const mx = heatLeft + MONTH_START_DOY[m] * cellW;
    oc.beginPath(); oc.moveTo(mx, heatTop); oc.lineTo(mx, heatTop + ch); oc.stroke();
  }

  // ── X-axis label ──
  oc.fillStyle = '#A6A499';
  oc.font = 'bold 12px "Courier Prime", monospace';
  oc.textAlign = 'center';
  oc.fillText('MONTH OF YEAR', heatLeft + cw / 2, heatTop + ch + 20);
  oc.textAlign = 'left';

  // ── Now marker on export (climatology only) ──
  if (nowMarkerActive && mode === 'climatology') {
    const { year, month, day, hour } = getNowInStationTZ();
    const doy = getDOY0(year, month, day);
    if (doy >= 0 && doy <= 365) {
      const nx = heatLeft + (doy  + 0.5) * cellW;
      const ny = heatTop  + (hour + 0.5) * cellH;

      oc.save();
      oc.strokeStyle = 'rgba(255,255,255,0.70)';
      oc.lineWidth   = 1.5;
      oc.setLineDash([5, 3]);
      oc.beginPath(); oc.moveTo(nx, heatTop);  oc.lineTo(nx, heatTop + ch);  oc.stroke();
      oc.beginPath(); oc.moveTo(heatLeft, ny); oc.lineTo(heatLeft + cw, ny); oc.stroke();
      oc.setLineDash([]);

      oc.fillStyle   = '#ffffff';
      oc.strokeStyle = 'rgba(0,0,0,0.55)';
      oc.lineWidth   = 1;
      oc.beginPath(); oc.arc(nx, ny, 5, 0, Math.PI * 2); oc.fill(); oc.stroke();

      const nowLabel = `${MONTHS_SHORT[month - 1]} ${day}  ·  ${fmtHour(hour)}`;
      oc.font = 'bold 13px "Courier Prime", monospace';
      const tw = oc.measureText(nowLabel).width;
      const BP = 7, BH = 23, BW = tw + BP * 2;
      let bx = nx + 10, by = ny - BH - 7;
      if (bx + BW > heatLeft + cw - 4) bx = nx - BW - 10;
      if (by < heatTop + 4)            by = ny + 8;

      oc.fillStyle   = 'rgba(8,8,24,0.93)';
      oc.strokeStyle = 'rgba(148,200,218,0.85)';
      oc.lineWidth   = 1;
      roundRect(oc, bx, by, BW, BH, 4); oc.fill(); oc.stroke();

      oc.fillStyle = '#E8E4D9';
      oc.textAlign = 'left';
      oc.fillText(nowLabel, bx + BP, by + BH - 6);
      oc.restore();
    }
  }

  // ── Footer / source line ──
  oc.fillStyle = '#948F82';
  oc.font = '12px "Courier Prime", monospace';
  oc.fillText(
    `${st.tzLabel} Local Time  ·  Data: IEM ASOS  ·  contextclimate.io`,
    PAD_TOP, heatTop + ch + 38
  );

  // ── Bottom accent line ──
  oc.fillStyle = grad;
  oc.fillRect(0, oh - 2, ow, 2);

  const link = document.createElement('a');
  link.download = `smoke-heatmap-${activeStationId}-${period}.png`;
  link.href = off.toDataURL('image/png');
  link.click();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
function init() {
  // Populate year selector
  const sel = document.getElementById('year-select');
  for (let y = CLIMO_END; y >= CLIMO_START; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  }
  sel.value = currentYear;

  initSearch();

  requestAnimationFrame(() => {
    setupCanvas();
    renderHourLabels();
    renderMonthLabels();
    renderLegend();
    loadClimatology();
  });

  window.addEventListener('resize', () => {
    dpr = window.devicePixelRatio || 1;
    setupCanvas();
    renderMonthLabels();
    const hasData = (mode === 'climatology' && smokeCount) ||
                    (mode === 'single' && singleGrid);
    if (hasData) renderHeatmap();
  });
}

init();
</script>
