<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission to Mars</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-solar); --tier-hit: #4FAE7C; --tier-close: #D9A441; --tier-miss: #C1544B; --craft: #F5D061; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 20px; }
.top .spacer { flex: 1; min-width: 0; }
.realbox { display: none; align-items: center; gap: 8px; position: relative; }
.realbox.on { display: flex; }
.date-in { font-family: var(--font-mono); font-size: 14px; color-scheme: dark; padding: 6px 8px; background: var(--color-surface); color: var(--color-text-primary);
  border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn, .realbox .cc-btn, .icon-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; padding: 6px 0; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 190px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu.open { display: flex; }
.menu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.menu button:hover { background: var(--color-surface); }
.menu button small { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-left: 8px; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted); border-radius: 2px; margin-right: 10px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; display: flex; gap: 12px; padding: 10px; }
.orbit-wrap { position: relative; flex: none; }
#orbitCanvas { display: block; border-radius: var(--radius-md); touch-action: none; }
.chips { position: absolute; top: 8px; left: 8px; display: flex; gap: 8px; z-index: 5; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; background: rgba(38,43,39,.92); }
.lay { position: relative; }
.side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; }

/* mission log */
.panel { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 9px 11px; }
.log { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.ph .t { white-space: nowrap; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
.ph .cc-segmented-btn { padding: 5px 11px; font-size: 12px; }
.log-wrap { flex: 1; min-height: 130px; position: relative; }
#logCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: var(--radius-md); }
.log-foot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.lg { display: flex; gap: 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.lg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.log-foot .cnt { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-right: 8px; }
.log-foot .cc-btn { padding: 4px 10px; font-size: 12px; }

/* result */
.result { display: none; }
.result.on { display: block; }
.result .badge { display: inline-block; font-family: var(--font-mono); font-weight: 700; font-size: 14px; letter-spacing: .08em; padding: 4px 11px; border: 1px solid; border-radius: var(--radius-md); }
.rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; margin-top: 8px; }
.rgrid .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.rgrid .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--color-text-primary); white-space: nowrap; line-height: 1.2; }
.tl { margin-top: 10px; }
.tl .bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; }
.tl .bar div { display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: #1E2320; white-space: nowrap; overflow: hidden; }
.tl .keys { display: flex; justify-content: space-between; margin-top: 4px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
.pop { animation: pop .5s cubic-bezier(.34,1.56,.64,1); }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }

/* control bar */
.controls { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--color-border); background: var(--color-surface); min-height: 60px; }
.go { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 170px; flex: none; align-self: stretch;
  font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: .03em;
  background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); animation: glow 2.4s ease-in-out infinite; }
.go:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.go:disabled { animation: none; opacity: .45; cursor: default; filter: none; }
.go.alt { background: var(--color-surface-2); color: var(--color-text-primary); border-color: var(--color-border-hover); animation: none; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(166,150,48,0); } 50% { box-shadow: 0 0 0 5px rgba(166,150,48,.32); } }
@media (prefers-reduced-motion: reduce) { .go { animation: none; } }
.grp { display: flex; align-items: center; gap: 6px; }
.grp .lab { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.grp .cc-segmented-btn { padding: 8px 10px; font-family: var(--font-mono); font-size: 14px; letter-spacing: 0; text-transform: none; }
.grp .cc-btn { padding: 8px 10px; font-family: var(--font-mono); font-size: 14px; }
.grp .cc-btn:disabled { opacity: .35; cursor: default; }
.pause { width: 46px; padding: 8px 0 !important; font-size: 16px !important; }
.pause.paused { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 0; flex: none; }
.controls .fill { flex: 1; }
.newbtn { padding: 8px 14px; font-size: 14px; white-space: nowrap; }

/* card */
.card { padding: 11px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tool-accent); font-weight: 700; padding-bottom: 7px; border-bottom: 1px solid var(--color-border); }
.card .eb .bd { font-size: 12px; letter-spacing: .04em; white-space: nowrap; padding: 3px 8px; border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); color: var(--color-text-primary); }
.card .r { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; text-align: right; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--color-text-secondary); margin-left: 4px; }
.card .v .e { color: #7FA8F5; } .card .v .m { color: #E0775C; }
.card .sub { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; margin-top: 12px; padding-bottom: 5px; border-bottom: 1px solid var(--color-border-hover); }
.card .sub span:last-child { color: var(--color-text-secondary); font-weight: 500; }
.card .win { margin-top: 10px; font-family: var(--font-mono); font-size: 14px; font-weight: 700; padding: 6px 9px; border-radius: var(--radius-md); border: 1px dashed var(--color-border-hover); color: var(--color-text-primary); }
.card .win.open { border: 1px solid var(--tier-hit); color: var(--tier-hit); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 19px; }
  .card .sub { margin-top: 8px; }
  .card .src { display: none; }
  .rgrid .v { font-size: 16px; }
}
@media (max-width: 1366px) { .main { grid-template-columns: minmax(0, 1fr) 272px; } .card { padding: 10px 14px; } }
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .top { gap: 10px; } .top h1 { font-size: 22px; }
  .tabs .cc-segmented-btn { padding: 11px 13px; }
  .grp .lab { display: none; }
  .go { min-width: 140px; font-size: 17px; }
  .card .v { font-size: 19px; }
  .rgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .card .l { letter-spacing: .03em; }
  .card .v { font-size: 18px; }
  .card .v .u { font-size: 13px; margin-left: 3px; }
  .grp .cc-segmented-btn, .grp .cc-btn { padding: 8px 7px; }
  .newbtn { padding: 8px 9px; }
  .exp .cc-btn { padding: 6px 9px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Mission to Mars</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-mode="practice">Practice</button>
      <button class="cc-segmented-btn" data-mode="real">Real dates</button>
    </div>
    <div class="realbox" id="realbox">
      <input type="date" id="dateIn" class="date-in" min="1990-01-01" max="2060-12-31" aria-label="Start date">
      <button class="cc-btn" id="bMissions">Real launches ▾</button>
      <div class="menu" id="mmenu"></div>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <button class="cc-btn icon-btn" id="bMute" aria-label="Mute sound"></button>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="menu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <div class="orbit-wrap" id="orbitWrap">
          <canvas id="orbitCanvas"></canvas>
          <div class="chips">
            <div class="lay">
              <button class="cc-btn" id="bLayers">Layers ▾</button>
              <div class="menu" id="lmenu">
                <button class="tgl is-active" data-layer="wedge">Phase angle</button>
                <button class="tgl is-active" data-layer="trails">Motion trails</button>
                <button class="tgl" data-layer="window">Launch window</button>
              </div>
            </div>
          </div>
        </div>
        <div class="side">
          <div class="panel log">
            <div class="ph">
              <span class="t">Mission log</span>
              <div class="cc-segmented" id="logTabs">
                <button class="cc-segmented-btn is-active" data-v="out">Outbound</button>
                <button class="cc-segmented-btn" data-v="ret">Return</button>
              </div>
            </div>
            <div class="log-wrap" id="logWrap"><canvas id="logCanvas"></canvas></div>
            <div class="log-foot">
              <div class="lg"><span><i style="background:#4FAE7C"></i>≤5°</span><span><i style="background:#D9A441"></i>≤15°</span><span><i style="background:#C1544B"></i>&gt;15°</span></div>
              <div><span class="cnt" id="logCount">0 launches</span><button class="cc-btn" id="bClear">Clear</button></div>
            </div>
          </div>
          <div class="panel result" id="result"></div>
        </div>
      </div>
      <div class="controls">
        <button class="cc-btn go" id="bGo">Launch</button>
        <div class="grp">
          <button class="cc-btn pause" id="bPause" aria-label="Pause">❚❚</button>
          <span class="lab">Speed</span>
          <div class="cc-segmented" id="speeds">
            <button class="cc-segmented-btn" data-s="0.5">½×</button>
            <button class="cc-segmented-btn is-active" data-s="1">1×</button>
            <button class="cc-segmented-btn" data-s="2">2×</button>
            <button class="cc-segmented-btn" data-s="5">5×</button>
            <button class="cc-segmented-btn" data-s="10">10×</button>
          </div>
        </div>
        <div class="sep"></div>
        <div class="grp" id="steps">
          <span class="lab">Step</span>
          <button class="cc-btn" data-d="-10">−10d</button>
          <button class="cc-btn" data-d="-1">−1d</button>
          <button class="cc-btn" data-d="1">+1d</button>
          <button class="cc-btn" data-d="10">+10d</button>
        </div>
        <div class="fill"></div>
        <button class="cc-btn newbtn" id="bNew">New mission</button>
      </div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

'use strict';
/* ════════════════════════════════════════════════════════════════
   MISSION TO MARS — contextclimate.io
   Hohmann transfer between circular, coplanar orbits (ESSRT values).
   ════════════════════════════════════════════════════════════════ */

/* ── Orbital constants ── */
const R_EARTH_AU = 1.00, R_MARS_AU = 1.524;
const T_EARTH = 365.25, T_MARS = 687.0;
const OMEGA_EARTH = 360 / T_EARTH, OMEGA_MARS = 360 / T_MARS;
const DRIFT = OMEGA_EARTH - OMEGA_MARS, SYNODIC = 360 / DRIFT;
const A_T = (R_EARTH_AU + R_MARS_AU) / 2, ECC = 1 - R_EARTH_AU / A_T;
const T_TRANSFER = Math.sqrt(A_T ** 3) * 365.25 / 2;
const TOL = 5, TIER_CLOSE = 15;
const KM_PER_AU = 149597870;
const V_EARTH_KMS = 29.78;                       // circular speed at 1 AU
const vis = (r, a) => V_EARTH_KMS * Math.sqrt(2 / r - 1 / a);   // vis-viva, km/s
const J2000_MS = Date.UTC(2000, 0, 1, 12, 0, 0);
const L0_EARTH = 100.46457, L0_MARS = 355.45332; // JPL mean longitudes at J2000
const DAYS_PER_SEC = 10;                         // sim days per real second at 1×

const COL = {
  bg: '#1E2320', surf: '#262B27', surf2: '#2C322D', text: '#E8E4D9', text2: '#A6A499', text3: '#948F82',
  accent: '#A69630', earth: '#5B8DEF', mars: '#C1543A', craft: '#F5D061',
  hit: '#4FAE7C', close: '#D9A441', miss: '#C1544B',
};
const FM = "'Courier Prime', monospace", FB = "'Public Sans', sans-serif", FD = "'Zilla Slab', serif";
const el = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

/* ── Legs ── sign: direction the phase angle moves relative to req. M0: 0 = depart perihelion. */
const LEGS = {
  out: { key: 'out', origin: 'EARTH', target: 'MARS', craft: 'ROVER', originR: R_EARTH_AU, targetR: R_MARS_AU,
    originCol: COL.earth, targetCol: COL.mars, sign: -1, M0: 0, req: 180 - OMEGA_MARS * T_TRANSFER,
    angleLabel: 'Mars ahead of Earth', tiers: { hit: 'PRECISION RENDEZVOUS', close: 'CLOSE FLYBY', miss: 'LOST IN SPACE' },
    hitLines: ['Mars capture confirmed.', 'Signal acquired from Mars orbit.', 'Orbit insertion burn complete.', 'Contact established.'] },
  ret: { key: 'ret', origin: 'MARS', target: 'EARTH', craft: 'CAPSULE', originR: R_MARS_AU, targetR: R_EARTH_AU,
    originCol: COL.mars, targetCol: COL.earth, sign: +1, M0: Math.PI, req: 180 - OMEGA_EARTH * T_TRANSFER,
    angleLabel: 'Earth ahead of Mars', tiers: { hit: 'SAFE RETURN', close: 'CLOSE PASS', miss: 'LOST IN SPACE' },
    hitLines: ['Splashdown confirmed.', 'Welcome home.', 'Capsule recovered.', 'Recovery team on site.'] },
};
const MISS_LINES = ['Still out there, somewhere.', 'Last transmission: static.', 'No signal returned.', 'Drifting on, alone.'];
const MISSIONS = [['Curiosity', '2011-11-26'], ['InSight', '2018-05-05'], ['Perseverance', '2020-07-30']];

/* ── State ── */
const REDUCE_MOTION = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const state = {
  mode: 'practice', epochDay: 0, leg: 'out', phase: 'watching', simDay: 0, earthAngle0: 0, gammaStart: 0,
  speed: 1, paused: false, muted: false, layers: { wedge: true, trails: true, window: false },
