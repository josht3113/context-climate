<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wind Threshold Heatmap | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --tool-accent: var(--accent-hourly);
  --tool-accent-light: #94c8da;
  --type-glow: var(--tool-accent-light); /* JS overrides per wind-type (sust/gust) — content-encoded */
}

/* colors/font/background texture come from core-sample-tools.css body rule */
body { padding: 20px 0 48px; }

.container { max-width: 1400px; margin: 0 auto; padding: 0 28px; }

/* ── Title ── */
.page-title {
  font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
  margin-bottom: 14px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
}
.title-sep { color: var(--color-text-muted); font-weight: 400; }

/* ── Mode tabs (styling from core-sample-tools.css .cc-tab-bar/.cc-tab) ── */
.tab-bar { display: flex; gap: 6px; margin-bottom: 12px; }

/* ── Station row ── */
.station-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.station-select { min-width: 260px; }
.control-label {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px;
}

/* ── Threshold + type row ── */
.threshold-row {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.thresh-group-label {
  font-family: var(--font-mono); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px; color: var(--color-text-secondary);
}
.thresh-group { display: flex; gap: 5px; }
.thresh-unit {
  font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  color: var(--color-text-muted); letter-spacing: 0.3px; align-self: center;
}
.thresh-divider { color: var(--color-text-muted); font-size: 18px; margin: 0 6px; line-height: 1; }
.thresh-btn {
  font-family: var(--font-mono); font-size: 14px; font-weight: 600;
  letter-spacing: 0.3px; padding: 5px 14px; border-radius: 6px;
  border: 1px solid var(--color-border); background: transparent;
  color: var(--color-text-secondary); cursor: pointer; transition: all 0.15s;
}
.thresh-btn:hover:not([class*="thresh-active"]):not([class*="type-active"]) {
  border-color: #3a4a6c; color: var(--color-text-primary);
}
/* Wind threshold active — blue (sustained default) */
.thresh-btn.thresh-active-sust { background: #0a1828; border-color: #378add; color: #94c8da; }
/* Wind threshold active — salmon (gusts) */
.thresh-btn.thresh-active-gust { background: #1a0e0a; border-color: #cc6644; color: #e0a080; }
/* Type toggle active states */
.thresh-btn.type-active-sust { background: #0a1828; border-color: #378add; color: #94c8da; }
.thresh-btn.type-active-gust { background: #1a0e0a; border-color: #cc6644; color: #e0a080; }

/* ── Year selector ── */
.controls-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 30px;
}
#year-select { color: var(--tool-accent-light); }

/* ── Stat chips (cc-stat-row/cc-stat-chip/cc-stat-label/cc-stat-value) ──
   Value color is content-encoded (tracks active wind type sust/gust via
   --type-glow), so it's the one override kept here. ─────────────────── */
.stat-row .cc-stat-value { color: var(--type-glow); }

/* ── Legend ── */
.legend-row {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px;
}
.auto-scale-toggle {
  display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 12px;
  font-weight: 600; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.4px;
  cursor: pointer; user-select: none;
}
.auto-scale-toggle input { accent-color: var(--tool-accent-light); cursor: pointer; }
.legend-scale-group { display: flex; align-items: center; gap: 8px; }
.legend-end-label {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--color-text-secondary); white-space: nowrap;
}
#legend-canvas { border-radius: 3px; border: 1px solid var(--color-border); display: block; }

/* ── Heatmap layout ── */
.heatmap-wrapper { width: 100%; }
.heatmap-inner { display: flex; align-items: flex-start; }
.hour-labels { flex-shrink: 0; width: 52px; display: flex; flex-direction: column; }
.hour-labels-spacer { height: 26px; }
.hour-label {
  font-family: var(--font-mono); font-size: 14px; font-weight: 600; color: #b0b0cc;
  text-align: right; padding-right: 9px; display: flex; align-items: center; justify-content: flex-end;
}
.canvas-area { flex: 1; min-width: 0; position: relative; }
.month-label-bar { position: relative; height: 26px; user-select: none; }
.month-label {
  position: absolute; font-family: var(--font-mono); font-size: 15px; font-weight: 700;
  color: #b0b0cc; transform: translateX(-50%); white-space: nowrap; line-height: 26px;
}
.canvas-container { position: relative; }
#heatmap-canvas { display: block; width: 100%; cursor: crosshair; }

/* ── Loading overlay ── */
.loading-overlay {
  position: absolute; inset: 0; background: rgba(7,7,15,0.88); display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; z-index: 10; backdrop-filter: blur(4px);
}
.loading-text { font-family: var(--font-mono); font-size: 14px; font-weight: 600; letter-spacing: 0.4px; color: var(--color-text-secondary); }
.progress-track { width: 280px; height: 5px; background: var(--color-surface-2); border-radius: 3px; overflow: hidden; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #1a4080, #378add);
  border-radius: 3px; transition: width 0.4s ease; width: 0%;
}
.error-text { font-family: var(--font-mono); font-size: 13px; color: #ef4444; margin-top: 4px; }

/* ── Tooltip ── */
#tooltip {
  position: fixed; background: rgba(8,12,22,0.97); border: 1px solid #1e3050;
  border-radius: 8px; padding: 10px 14px; pointer-events: none; z-index: 200;
  display: none; width: 240px; backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.tt-date { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: var(--color-text-secondary); letter-spacing: 0.3px; margin-bottom: 5px; }
.tt-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--type-glow); line-height: 1; margin-bottom: 4px; }
.tt-value.has-thresh { color: var(--type-glow); }
.tt-value.no-thresh  { color: var(--color-text-muted); }
.tt-detail { font-family: var(--font-body); font-size: 12px; color: var(--color-text-secondary); line-height: 1.4; }

/* ── Footer ── */
.footer { margin-top: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); }

/* ── Header eyebrow (matches wind-hour-heatmap.html's companion tool) ── */
.page-eyebrow { margin-bottom: 6px; }
</style>
</head>

let activeStationId = 'KISP';
function activeStation() { return STATIONS[activeStationId]; }

const climoCache = new Map();

// ═══════════════════════════════════════════════════════════════
// COLOR HELPERS
// ═══════════════════════════════════════════════════════════════
function lerpColor(t) {
  t = Math.max(0, Math.min(1, t));
  let lo = COLOR_STOPS[0], hi = COLOR_STOPS[COLOR_STOPS.length - 1];
  for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
    if (t <= COLOR_STOPS[i + 1].t) { lo = COLOR_STOPS[i]; hi = COLOR_STOPS[i + 1]; break; }
  }
  const span = hi.t - lo.t;
  const f    = span < 1e-6 ? 0 : (t - lo.t) / span;
  return [
    Math.round(lo.rgb[0] + f * (hi.rgb[0] - lo.rgb[0])),
    Math.round(lo.rgb[1] + f * (hi.rgb[1] - lo.rgb[1])),
    Math.round(lo.rgb[2] + f * (hi.rgb[2] - lo.rgb[2])),
  ];
}

// t is already normalized 0..1 against the current scale ceiling — see the
// scaleMax computation in renderHeatmap() (either the fixed MAX_PROB cap for
// this threshold/type, or the view's actual max when auto-scale is on).
function probToRGB(t) {
  return lerpColor(Math.min(1, t));
}

function rgb(r, g, b) { return `rgb(${r},${g},${b})`; }

function formatPct(p) {
  if (p >= 10) return Math.round(p).toString();
  if (p >= 1)  return p.toFixed(1);
  return p.toFixed(2);
}

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let mode      = 'climatology';
let loadToken = 0; // bumped each loadClimatology() call; lets a stale in-flight request detect it's superseded
let windType  = 'sust';  // 'sust' | 'gust'
let threshIdx = 0;       // index into THRESHOLDS_MPH

let currentYear = CLIMO_END;

// Climatology grids — built once per station, all thresholds together.
// sustCount[threshIdx][doy][hour] = years where max sustained ≥ threshold
// gustCount[threshIdx][doy][hour] = years where any gust ≥ threshold
// dataCount[doy][hour]            = years with any sped observation
let sustCount = null;
let gustCount = null;
let dataCount = null;

// Single-year grids — max value seen per (doy, hour)
let singleMaxSped = null;  // Float32Array[366*24], NaN = no obs
let singleMaxGust = null;  // Float32Array[366*24], NaN = no gust reported

// Auto-scale: stretch the color gradient to this view's actual max probability
// instead of the fixed per-threshold MAX_PROB cap, so thresholds far from the
// tuned default (or unusual stations) aren't lost to near-black. Toggle-able
// from the legend row; on by default.
let autoScale      = true;
let currentMaxProb = MAX_PROB.sust[0]; // the max probability found in the current grid (drives legend + color scale)

// ═══════════════════════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════════════════════
const MONTHS_SHORT    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL     = ['January','February','March','April','May','June',
                         'July','August','September','October','November','December'];
const MONTH_DAYS_LEAP   = [31,29,31,30,31,30,31,31,30,31,30,31];
const MONTH_DAYS_NOLEAP = [31,28,31,30,31,30,31,31,30,31,30,31];

const MONTH_START_DOY = (() => {
  const arr = [0];
  for (let m = 0; m < 11; m++) arr.push(arr[m] + MONTH_DAYS_LEAP[m]);
  return arr;
})();

function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function getDOY0(year, month, day) {
  const md = isLeap(year) ? MONTH_DAYS_LEAP : MONTH_DAYS_NOLEAP;
  let d = 0;
  for (let m = 0; m < month - 1; m++) d += md[m];
  return d + day - 1;
}

function doyToMonthDay(doy) {
  let rem = doy;
  for (let m = 0; m < 12; m++) {
    if (rem < MONTH_DAYS_LEAP[m]) return { m, day: rem + 1 };
    rem -= MONTH_DAYS_LEAP[m];
  }
  return { m: 11, day: 31 };
}

function fmtHour(h) {
  if (h === 0)  return 'Midnight';
  if (h === 12) return 'Noon';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

// ═══════════════════════════════════════════════════════════════
// IEM FETCH + PARSE
// Fetches sustained speed (sped, mph) and peak gust (gust, mph)
// in a single request. Gust column is 'M' when no gust was
// reported in that METAR (sustained < 10 kt variation).
// ═══════════════════════════════════════════════════════════════
function buildIEMUrl(y1, y2) {
  const st = activeStation();
  const tz = encodeURIComponent(st.tz);
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?` +
    `station=${activeStationId}&data=sped,gust` +
    `&year1=${y1}&month1=1&day1=1` +
    `&year2=${y2}&month2=12&day2=31` +
    `&tz=${tz}&format=comma&latlon=no&missing=M&trace=T&direct=no`;
}

async function fetchRangeCSV(y1, y2) {
  const resp = await fetch(buildIEMUrl(y1, y2));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

// Returns Map<year, Array<{doy, hour, sped, gust}>>
// sped is always a number (mph); gust is a number (mph) or NaN if 'M'.
function parseIEM(text) {
  const lines  = text.split('\n');
  const byYear = new Map();
  let spedIdx  = 2;
  let gustIdx  = 3;
  let inData   = false;
  let totalObs = 0;

  for (const line of lines) {
    const l = line.trim();
    if (!l) continue;

    if (l.startsWith('station,')) {
      const h = l.split(',');
      const si = h.indexOf('sped'); if (si >= 0) spedIdx = si;
      const gi = h.indexOf('gust'); if (gi >= 0) gustIdx = gi;
      inData = true;
      continue;
    }
    if (!inData) continue;

    const parts = l.split(',');
    if (parts.length <= Math.max(spedIdx, gustIdx)) continue;

    const valid    = parts[1]?.trim();
    if (!valid) continue;
    const spaceIdx = valid.indexOf(' ');
    if (spaceIdx < 1) continue;

    const dp = valid.substring(0, spaceIdx).split('-').map(Number);
    if (dp.length < 3 || isNaN(dp[0])) continue;

    const [yr, mo, dy] = dp;
    const hour = parseInt(valid.substring(spaceIdx + 1));
    if (isNaN(hour) || hour < 0 || hour > 23) continue;

    const doy = getDOY0(yr, mo, dy);
    if (doy < 0 || doy > 365) continue;

    const spedStr = parts[spedIdx]?.trim();
    if (!spedStr || spedStr === 'M') continue;
    const sped = parseFloat(spedStr);
    if (isNaN(sped) || sped < 0 || sped > 250) continue;

    const gustStr = parts[gustIdx]?.trim();
    const gust    = (!gustStr || gustStr === 'M') ? NaN : parseFloat(gustStr);

    if (!byYear.has(yr)) byYear.set(yr, []);
    byYear.get(yr).push({ doy, hour, sped, gust });
    totalObs++;
  }

  return { byYear, totalObs };
}

// ═══════════════════════════════════════════════════════════════
// DATA AGGREGATION
// ═══════════════════════════════════════════════════════════════
function initGrids() {
  sustCount = THRESHOLDS_MPH.map(() =>
    Array.from({ length: 366 }, () => new Int16Array(24))
  );
  gustCount = THRESHOLDS_MPH.map(() =>
    Array.from({ length: 366 }, () => new Int16Array(24))
  );
  dataCount = Array.from({ length: 366 }, () => new Int16Array(24));
  return { sustCount, gustCount, dataCount };
}

function processYear(obs, grids) {
  const { sustCount, gustCount, dataCount } = grids;
  // Per-(doy, hour): max sustained and max gust for this year.
  const maxSped = new Float32Array(366 * 24).fill(-1);
  const maxGust = new Float32Array(366 * 24).fill(NaN);
  const hasData = new Uint8Array(366 * 24);

  for (const { doy, hour, sped, gust } of obs) {
    const idx = doy * 24 + hour;
    hasData[idx] = 1;
    if (sped > maxSped[idx]) maxSped[idx] = sped;
    if (!isNaN(gust) && (isNaN(maxGust[idx]) || gust > maxGust[idx])) maxGust[idx] = gust;
  }

  for (let d = 0; d < 366; d++) {
    for (let h = 0; h < 24; h++) {
      const idx = d * 24 + h;
      if (!hasData[idx]) continue;
      dataCount[d][h]++;
      THRESHOLDS_MPH.forEach((t, i) => {
        if (maxSped[idx] >= t)                           sustCount[i][d][h]++;
        if (!isNaN(maxGust[idx]) && maxGust[idx] >= t)  gustCount[i][d][h]++;
      });
    }
  }
}

// ── Active-type helpers ──────────────────────────────────────
function getCount(d, h) {
  return windType === 'sust' ? sustCount[threshIdx][d][h] : gustCount[threshIdx][d][h];
}

function getSingleHas(doy, h) {
  const idx = doy * 24 + h;
  const thr = THRESHOLDS_MPH[threshIdx];
  if (windType === 'sust') {
    const v = singleMaxSped?.[idx];
    return (v !== undefined && !isNaN(v) && v >= thr) ? 1 : 0;
  } else {
    const v = singleMaxGust?.[idx];
    return (v !== undefined && !isNaN(v) && v >= thr) ? 1 : 0;
  }
}

function activeLabel() { return THRESH_LABELS[threshIdx]; }

// ═══════════════════════════════════════════════════════════════
// CANVAS / RENDER
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('heatmap-canvas');
const ctx    = canvas.getContext('2d');
let dpr      = window.devicePixelRatio || 1;

function setupCanvas() {
  const W = document.getElementById('canvas-area').clientWidth;
  const H = CANVAS_HEIGHT;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

function renderHeatmap() {
  const W     = canvas.width  / dpr;
  const H     = canvas.height / dpr;
  const cellW = W / 366;
  const cellH = H / 24;
  const pw    = Math.round(W * dpr);
  const ph    = Math.round(H * dpr);

  const imgData = ctx.createImageData(pw, ph);
  const data    = imgData.data;
  const minYrs  = Math.ceil(TOTAL_YEARS / 3);
  const [sr, sg, sb] = SINGLE_COLOR[windType];

  // Determine the color-scale ceiling. In climatology mode with auto-scale
  // on, stretch the gradient to this view's actual max probability so
  // low-probability thresholds aren't lost to near-black. Fixed to the
  // hand-tuned per-threshold/type cap otherwise.
  let scaleMax = MAX_PROB[windType][threshIdx];
  if (mode === 'climatology') {
    if (autoScale) {
      let maxP = 0;
      for (let doy = 0; doy < 366; doy++) {
        for (let h = 0; h < 24; h++) {
          if (dataCount[doy][h] >= minYrs) {
            const p = getCount(doy, h) / dataCount[doy][h];
            if (p > maxP) maxP = p;
          }
        }
      }
      scaleMax = maxP > 0 ? maxP : MAX_PROB[windType][threshIdx];
    }
    currentMaxProb = scaleMax;
  }

  for (let doy = 0; doy < 366; doy++) {
    const x0 = Math.round(doy       * cellW * dpr);
    const x1 = Math.round((doy + 1) * cellW * dpr);

    for (let h = 0; h < 24; h++) {
      const y0 = Math.round(h       * cellH * dpr);
      const y1 = Math.round((h + 1) * cellH * dpr);

      let r, g, b;
      if (mode === 'climatology') {
        const dc   = dataCount[doy][h];
        const prob = dc >= minYrs ? getCount(doy, h) / dc : 0;
        const t    = scaleMax > 0 ? prob / scaleMax : 0;
        [r, g, b]  = probToRGB(t);
      } else {
        if (getSingleHas(doy, h)) { r = sr; g = sg; b = sb; }
        else                      { r = 14; g = 17; b = 30; }
      }

      for (let py = y0; py < y1 && py < ph; py++) {
        for (let px = x0; px < x1 && px < pw; px++) {
          const i = (py * pw + px) * 4;
          data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Month dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  for (let m = 1; m < 12; m++) {
    const x = Math.round(MONTH_START_DOY[m] * cellW) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  // Noon divider
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  const noonY = Math.round(12 * cellH) + 0.5;
  ctx.beginPath(); ctx.moveTo(0, noonY); ctx.lineTo(W, noonY); ctx.stroke();
}

// ── Legend ───────────────────────────────────────────────────
function renderLegend() {
  const lc = document.getElementById('legend-canvas');
  const lx = lc.getContext('2d');
  const W  = lc.width, H = lc.height;
  lx.clearRect(0, 0, W, H);

  if (mode === 'climatology') {
    const grad = lx.createLinearGradient(0, 0, W, 0);
    for (const s of COLOR_STOPS) grad.addColorStop(s.t, rgb(...s.rgb));
    lx.fillStyle = grad;
    lx.fillRect(0, 0, W, H);
    document.getElementById('legend-lo').textContent = '0%';
    const hiPct = autoScale ? currentMaxProb * 100 : MAX_PROB[windType][threshIdx] * 100;
    document.getElementById('legend-hi').textContent = formatPct(hiPct) + '%';
  } else {
    lx.fillStyle = rgb(14, 17, 30);
    lx.fillRect(0, 0, W / 2, H);
    lx.fillStyle = rgb(...SINGLE_COLOR[windType]);
    lx.fillRect(W / 2, 0, W / 2, H);
    document.getElementById('legend-lo').textContent = 'None';
    document.getElementById('legend-hi').textContent = activeLabel();
  }
}

// ── Hour labels ──────────────────────────────────────────────
function renderHourLabels() {
  const c = document.getElementById('hour-labels');
  while (c.children.length > 1) c.removeChild(c.lastChild);
  const cellH = CANVAS_HEIGHT / 24;
  for (let h = 0; h < 24; h++) {
    const el = document.createElement('div');
    el.className    = 'hour-label';
    el.style.height = cellH + 'px';
    el.textContent  = h === 0 ? 'Midnight' : h === 12 ? 'Noon' : h < 12 ? h : h - 12;
    c.appendChild(el);
  }
}

// ── Month labels ─────────────────────────────────────────────
function renderMonthLabels() {
  const bar   = document.getElementById('month-label-bar');
  bar.innerHTML = '';
  const W     = document.getElementById('canvas-area').clientWidth;
  const cellW = W / 366;
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e) / 2;
    const el  = document.createElement('div');
    el.className   = 'month-label';
    el.textContent = MONTHS_SHORT[m];
    el.style.left  = (mid * cellW) + 'px';
    bar.appendChild(el);
  }
}

// ═══════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════
function updateStats() {
  const lbl = activeLabel();

  if (mode === 'climatology' && sustCount) {
    document.getElementById('sv-period').textContent = `${CLIMO_START}–${CLIMO_END}`;
    document.getElementById('sl-period').textContent = 'Period';
    document.getElementById('sl-annual').textContent = `Avg Hrs ${lbl} / Yr`;

    // Peak month
    const monthAvg = MONTHS_SHORT.map((_, m) => {
      const s = MONTH_START_DOY[m];
      const e = m < 11 ? MONTH_START_DOY[m + 1] : 366;
      let sum = 0, n = 0;
      for (let d = s; d < e; d++)
        for (let h = 0; h < 24; h++)
          if (dataCount[d][h] > 2) { sum += getCount(d, h) / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakM = monthAvg.indexOf(Math.max(...monthAvg));
    document.getElementById('sv-month').textContent = MONTHS_FULL[peakM];

    // Peak hour
    const hourAvg = Array.from({ length: 24 }, (_, h) => {
      let sum = 0, n = 0;
      for (let d = 0; d < 366; d++)
        if (dataCount[d][h] > 2) { sum += getCount(d, h) / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakH = hourAvg.indexOf(Math.max(...hourAvg));
    document.getElementById('sv-hour').textContent = fmtHour(peakH);

    // Avg hours per year
    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        total += getCount(d, h);
    document.getElementById('sv-annual').textContent = (total / TOTAL_YEARS).toFixed(1);

  } else if (mode === 'single' && singleMaxSped) {
    document.getElementById('sv-period').textContent = currentYear;
    document.getElementById('sl-period').textContent = 'Year';
    document.getElementById('sl-annual').textContent = `Total Hrs ${lbl}`;

    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (getSingleHas(d, h)) total++;
    document.getElementById('sv-annual').textContent = total;

    const byMonth = Array(12).fill(0);
    for (let d = 0; d < 366; d++) {
      const { m } = doyToMonthDay(d);
      for (let h = 0; h < 24; h++) if (getSingleHas(d, h)) byMonth[m]++;
    }
    const peakM = byMonth.indexOf(Math.max(...byMonth));
    document.getElementById('sv-month').textContent = byMonth[peakM] ? MONTHS_FULL[peakM] : '–';

    const byHour = Array(24).fill(0);
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (getSingleHas(d, h)) byHour[h]++;
    const peakH = byHour.indexOf(Math.max(...byHour));
    document.getElementById('sv-hour').textContent = byHour[peakH] ? fmtHour(peakH) : '–';
  }
}

// LOADING UI
// ═══════════════════════════════════════════════════════════════
function showLoading(txt) {
  document.getElementById('loading-overlay').style.display = 'flex';
  document.getElementById('loading-text').textContent = txt;
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('error-text').style.display = 'none';
  const ctr = document.getElementById('obs-counter');
  if (ctr) ctr.textContent = '';
}
function setProgress(pct, txt, obs) {
  document.getElementById('progress-fill').style.width = pct + '%';
  if (txt) document.getElementById('loading-text').textContent = txt;
  const ctr = document.getElementById('obs-counter');
  if (ctr && obs > 0) ctr.textContent = `${obs.toLocaleString()} wind observations parsed`;
}
function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }
function showError(msg) {
  document.getElementById('loading-text').textContent = 'Failed to load data.';
  const et = document.getElementById('error-text');
  et.textContent = msg; et.style.display = 'block';
  setTimeout(hideLoading, 3000);
}

// ═══════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  if (!sustCount && mode === 'climatology')  { tooltip.style.display = 'none'; return; }
  if (mode === 'single' && !singleMaxSped)   { tooltip.style.display = 'none'; return; }

  const rect = canvas.getBoundingClientRect();
  const doy  = Math.min(365, Math.max(0, Math.floor((e.clientX - rect.left) / rect.width  * 366)));
  const h    = Math.min(23,  Math.max(0, Math.floor((e.clientY - rect.top)  / rect.height * 24)));

  const { m, day } = doyToMonthDay(doy);
  document.getElementById('tt-date').textContent = `${MONTHS_FULL[m]} ${day}  ·  ${fmtHour(h)}`;

  const val = document.getElementById('tt-value');
  const det = document.getElementById('tt-detail');
  val.className = 'tt-value';

  if (mode === 'climatology') {
    const dc  = dataCount[doy][h];
    const min = Math.ceil(TOTAL_YEARS / 3);
    if (dc < min) {
      val.textContent = '–';
      det.textContent = 'Insufficient data';
    } else {
      const cnt = getCount(doy, h);
      val.textContent = (cnt / dc * 100).toFixed(1) + '%';
      det.textContent = `${cnt} of ${dc} years — wind ${activeLabel()} this hour`;
    }
  } else {
    const idx     = doy * 24 + h;
    const hasSust = singleMaxSped?.[idx];
    const hasGust = singleMaxGust?.[idx];
    const has     = getSingleHas(doy, h);
    val.classList.add(has ? 'has-thresh' : 'no-thresh');

    if (windType === 'sust') {
      if (hasSust !== undefined && !isNaN(hasSust) && hasSped(idx)) {
        val.textContent = has ? `≥ ${THRESHOLDS_MPH[threshIdx]} mph` : 'Below threshold';
        det.textContent = `${hasSped(idx).toFixed(0)} mph sustained`;
      } else {
        val.textContent = 'No data'; det.textContent = '';
      }
    } else {
      const gv = singleMaxGust?.[idx];
      if (!isNaN(gv) && gv > 0) {
        val.textContent = has ? `≥ ${THRESHOLDS_MPH[threshIdx]} mph` : 'Below threshold';
        det.textContent = `${gv.toFixed(0)} mph gust`;
      } else {
        val.textContent = has ? `≥ ${THRESHOLDS_MPH[threshIdx]} mph` : 'No gust recorded';
        const sv = singleMaxSped?.[idx];
        det.textContent = (!isNaN(sv) && sv >= 0) ? `${sv.toFixed(0)} mph sustained — no discrete gust` : '';
      }
    }
  }

  tooltip.style.display = 'block';
  const TW = 240, TH = 95;
  let tx = e.clientX + 16, ty = e.clientY - 10;
  if (tx + TW > window.innerWidth  - 10) tx = e.clientX - TW - 12;
  if (ty + TH > window.innerHeight - 10) ty = window.innerHeight - TH - 10;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// Helper to safely read singleMaxSped
function hasSped(idx) {
  const v = singleMaxSped?.[idx];
  return (v !== undefined && !isNaN(v) && v >= 0) ? v : null;
}

// ═══════════════════════════════════════════════════════════════
// LOAD – CLIMATOLOGY
// ═══════════════════════════════════════════════════════════════
async function loadClimatology() {
  const st = activeStation();
  const requestStationId = activeStationId;
  const myToken = ++loadToken;

  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = `${CLIMO_START}–${CLIMO_END}`;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;

  if (climoCache.has(requestStationId)) {
    const c = climoCache.get(requestStationId);
    sustCount = c.sustCount; gustCount = c.gustCount; dataCount = c.dataCount;
    renderHeatmap(); renderLegend(); updateStats();
    return;
  }

  // Request-local grids so a slower/older request can't clobber a newer one.
  const reqGrids = initGrids();
  showLoading(`Fetching ${CLIMO_START}–${CLIMO_END} from IEM… (may take ~30s)`);

  try {
    const csv = await fetchRangeCSV(CLIMO_START, CLIMO_END);
    if (myToken !== loadToken) return; // superseded by a later station switch
    setProgress(55, 'Parsing wind observations…', 0);
    await sleep(30);
    if (myToken !== loadToken) return;
    const { byYear, totalObs } = parseIEM(csv);
    setProgress(80, 'Aggregating by year…', totalObs);
    await sleep(30);
    if (myToken !== loadToken) return;
    for (const obs of byYear.values()) processYear(obs, reqGrids);

    climoCache.set(requestStationId, {
      sustCount: reqGrids.sustCount.map(arr => arr.map(r => Int16Array.from(r))),
      gustCount: reqGrids.gustCount.map(arr => arr.map(r => Int16Array.from(r))),
      dataCount: reqGrids.dataCount.map(r => Int16Array.from(r)),
    });

    if (myToken !== loadToken) return; // abandoned while we were caching
    sustCount = reqGrids.sustCount; gustCount = reqGrids.gustCount; dataCount = reqGrids.dataCount;
    setProgress(100, 'Done', totalObs);
    hideLoading();
  } catch (e) {
    if (myToken !== loadToken) return; // ignore errors from abandoned requests
    showError(e.message);
    console.error('Climatology load failed:', e);
    return;
  }

  renderHeatmap(); renderLegend(); updateStats();
}

// ═══════════════════════════════════════════════════════════════
// LOAD – SINGLE YEAR
// ═══════════════════════════════════════════════════════════════
async function loadSingleYear(year) {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = year;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;
  showLoading(`Loading ${year} wind data…`);

  try {
    const csv = await fetchRangeCSV(year, year);
    const { byYear } = parseIEM(csv);
    const obs = byYear.get(year) || [];

    singleMaxSped = new Float32Array(366 * 24).fill(NaN);
    singleMaxGust = new Float32Array(366 * 24).fill(NaN);

    for (const { doy, hour, sped, gust } of obs) {
      const idx = doy * 24 + hour;
      if (isNaN(singleMaxSped[idx]) || sped > singleMaxSped[idx]) singleMaxSped[idx] = sped;
      if (!isNaN(gust)) {
        if (isNaN(singleMaxGust[idx]) || gust > singleMaxGust[idx]) singleMaxGust[idx] = gust;
      }
    }

    hideLoading();
    renderHeatmap(); renderLegend(); updateStats();
  } catch (err) {
    showError(err.message);
    console.error(err);
  }
}

// ═══════════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('tab-climo').classList.toggle('active', m === 'climatology');
  document.getElementById('tab-single').classList.toggle('active', m === 'single');
  const showYear = m === 'single';
  document.getElementById('ctrl-label').style.display  = showYear ? 'inline' : 'none';
  document.getElementById('year-select').style.display = showYear ? 'inline' : 'none';
  document.getElementById('auto-scale-toggle-wrap').style.display = m === 'climatology' ? 'flex' : 'none';
  if (m === 'climatology') loadClimatology();
  else { currentYear = parseInt(document.getElementById('year-select').value); loadSingleYear(currentYear); }
}

function setThresh(idx) {
  threshIdx = idx;
  syncButtons();
  renderHeatmap(); renderLegend(); updateStats();
}

function setType(type) {
  windType = type;
  syncButtons();
  renderHeatmap(); renderLegend(); updateStats();
}

function syncButtons() {
  const activeThreshClass = `thresh-active-${windType}`;
  const activeTypeClass   = `type-active-${windType}`;

  for (let i = 0; i < THRESHOLDS_MPH.length; i++) {
    document.getElementById('thresh-' + i).className =
      'thresh-btn' + (i === threshIdx ? ' ' + activeThreshClass : '');
  }
  document.getElementById('type-sust').className =
    'thresh-btn' + (windType === 'sust' ? ' type-active-sust' : '');
  document.getElementById('type-gust').className =
    'thresh-btn' + (windType === 'gust' ? ' type-active-gust' : '');

  // Update the CSS glow variable so stat chip values match the active type
  document.documentElement.style.setProperty('--type-glow', GLOW[windType]);
}

function toggleAutoScale() {
  autoScale = document.getElementById('auto-scale-toggle').checked;
  if (mode === 'climatology' && sustCount) {
    renderHeatmap();
    renderLegend();
  }
}

function onYearChange() {
  currentYear   = parseInt(document.getElementById('year-select').value);
  singleMaxSped = null; singleMaxGust = null;
  loadSingleYear(currentYear);
}

function onStationChange() {
  activeStationId = document.getElementById('station-select').value;
  singleMaxSped = null; singleMaxGust = null;
  sustCount = null; gustCount = null; dataCount = null;
  if (mode === 'climatology') loadClimatology();
  else loadSingleYear(currentYear);
}

// ═══════════════════════════════════════════════════════════════
// DOWNLOAD PNG
// ═══════════════════════════════════════════════════════════════
function downloadPNG() {
  const st       = activeStation();
  const period   = mode === 'single' ? String(currentYear) : `${CLIMO_START}–${CLIMO_END}`;
  const lbl      = activeLabel();
  const typeLbl  = windType === 'sust' ? 'Sustained' : 'Gusts';
  const subtitle = mode === 'climatology'
    ? `Probability of ${lbl} ${typeLbl.toLowerCase()} by hour and day of year  ·  ${CLIMO_START}–${CLIMO_END}`
    : `Hours with ${lbl} ${typeLbl.toLowerCase()}  ·  ${currentYear}`;

  const EXPORT_SCALE = 3;
  const origDpr = dpr;
  dpr = EXPORT_SCALE;
  setupCanvas();
  renderHeatmap();

  const cw = canvas.width  / dpr;
  const ch = canvas.height / dpr;
  const PAD = 24, HDR = 86, FTR = 28, MONTH_H = 22;
  const ow  = cw + PAD * 2;
  const oh  = HDR + MONTH_H + ch + FTR;

  const off = document.createElement('canvas');
  off.width  = ow * EXPORT_SCALE; off.height = oh * EXPORT_SCALE;
  const oc   = off.getContext('2d');
  oc.scale(EXPORT_SCALE, EXPORT_SCALE);

  oc.fillStyle = '#1E2320';
  oc.fillRect(0, 0, ow, oh);

  // Accent bar — color matches active type glow
  oc.fillStyle = GLOW[windType];
  oc.fillRect(0, 0, ow, 3);

  oc.fillStyle = '#E8E4D9';
  oc.font = 'bold 20px "Zilla Slab", serif';
  oc.fillText(`${st.label}  ·  Wind Threshold Heatmap  ·  ${period}`, PAD, 28);

  oc.fillStyle = '#A6A499';
  oc.font = '14px "Public Sans", sans-serif';
  oc.fillText(subtitle, PAD, 48);

  if (mode === 'climatology' && sustCount) {
    const peak  = document.getElementById('sv-month').textContent;
    const hr    = document.getElementById('sv-hour').textContent;
    const avg   = document.getElementById('sv-annual').textContent;
    oc.fillStyle = GLOW[windType];
    oc.font = 'bold 13px "Courier Prime", monospace';
    oc.fillText(`Peak month: ${peak}   Peak hour: ${hr}   Avg hrs/yr: ${avg}`, PAD, 68);
  }

  oc.fillStyle = '#948F82';
  oc.font = '13px "Courier Prime", monospace';
  oc.textAlign = 'right';
  oc.fillText('contextclimate.io', ow - PAD, 28);
  oc.textAlign = 'left';

  // Legend bar
  const lc  = document.getElementById('legend-canvas');
  const loT = document.getElementById('legend-lo').textContent;
  const hiT = document.getElementById('legend-hi').textContent;
  oc.font = '11px "Courier Prime", monospace';
  oc.textBaseline = 'middle';
  const loW  = oc.measureText(loT).width + 4;
  const hiW  = oc.measureText(hiT).width;
  const barW = ow - PAD * 2 - loW - hiW - 12;
  oc.fillStyle = '#948F82';
  oc.fillText(loT, PAD, 79);
  oc.drawImage(lc, PAD + loW, 74, barW, 8);
  oc.strokeStyle = 'rgba(232,228,217,0.14)'; oc.lineWidth = 0.5;
  oc.strokeRect(PAD + loW, 74, barW, 8);
  oc.fillText(hiT, PAD + loW + barW + 4, 79);
  oc.textBaseline = 'alphabetic';

  // Month label strip
  oc.fillStyle = '#948F82';
  oc.font = '12px "Courier Prime", monospace';
  oc.textAlign = 'center';
  const cellW = cw / 366;
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e - 1) / 2;
    oc.fillText(MONTHS_SHORT[m], PAD + mid * cellW, HDR + MONTH_H - 6);
  }
  oc.textAlign = 'left';

  oc.drawImage(canvas, PAD, HDR + MONTH_H, cw, ch);

  dpr = origDpr;
  setupCanvas();
  renderHeatmap();

  oc.fillStyle = '#948F82';
  oc.font = '12px "Courier Prime", monospace';
  oc.fillText(
    `${st.tzLabel} Local Time  ·  Data: IEM ASOS (sped, gust)  ·  contextclimate.io`,
    PAD, HDR + MONTH_H + ch + 18
  );

  oc.fillStyle = GLOW[windType];
  oc.fillRect(0, oh - 2, ow, 2);

  const link = document.createElement('a');
  link.download = `wind-threshold-heatmap-${activeStationId}-${windType}-${THRESHOLDS_MPH[threshIdx]}mph-${period}.png`;
  link.href = off.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════════════════════
// UTIL + INIT
// ═══════════════════════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function init() {
  const sel = document.getElementById('year-select');
  for (let y = CLIMO_END; y >= CLIMO_START; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  }
  sel.value = currentYear;

  // Set initial glow and button states
  document.documentElement.style.setProperty('--type-glow', GLOW[windType]);
  syncButtons();

  requestAnimationFrame(() => {
    setupCanvas();
    renderHourLabels();
    renderMonthLabels();
    renderLegend();
    loadClimatology();
  });

  window.addEventListener('resize', () => {
    dpr = window.devicePixelRatio || 1;
    setupCanvas();
    renderMonthLabels();
    const hasData = (mode === 'climatology' && sustCount) ||
                    (mode === 'single' && singleMaxSped);
    if (hasData) renderHeatmap();
  });
}

init();
</script>
