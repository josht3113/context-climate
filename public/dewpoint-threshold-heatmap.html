<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dewpoint Threshold Heatmap | ContextClimate</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #07070f;
  --surface:      #0c1220;
  --surface2:     #141e30;
  --border:       #1e2d44;
  --text:         #e6e8f0;
  --text-muted:   #6888aa;
  --text-dim:     #2e4060;
  --accent:       #2468a8;
  --accent-glow:  #60a8d8;
  --type-glow:    #44cc99;
  --font-body:    'Plus Jakarta Sans', sans-serif;
  --font-label:   'Barlow Condensed', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
}
body { padding: 20px 0 48px; }

.container { max-width: 1400px; margin: 0 auto; padding: 0 28px; }

/* ── Title ── */
.page-title {
  font-size: 22px; font-weight: 700; letter-spacing: -0.3px;
  margin-bottom: 14px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.title-sep { color: var(--text-dim); font-weight: 400; }

/* ── Mode tabs ── */
.tab-bar { display: flex; gap: 6px; margin-bottom: 12px; }
.tab-btn {
  font-family: var(--font-label); font-size: 14px; font-weight: 600;
  letter-spacing: 0.3px; padding: 5px 16px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.tab-btn.active { background: #0a1e38; border-color: var(--accent); color: var(--accent-glow); }
.tab-btn:hover:not(.active) { border-color: #3a3a5c; color: var(--text); }

/* ── Station row ── */
.station-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.station-select {
  font-family: var(--font-label); font-size: 15px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); padding: 5px 12px; cursor: pointer; outline: none; min-width: 260px;
}
.station-select:focus { border-color: var(--accent); }
.control-label {
  font-family: var(--font-label); font-size: 13px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;
}

/* ── Threshold toggle row ── */
.threshold-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
}
.thresh-group-label {
  font-family: var(--font-label); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted);
}
.thresh-group { display: flex; gap: 5px; }
.thresh-divider { color: var(--text-dim); font-size: 18px; margin: 0 6px; line-height: 1; }
.thresh-btn {
  font-family: var(--font-label); font-size: 14px; font-weight: 600;
  letter-spacing: 0.3px; padding: 5px 14px; border-radius: 6px;
  border: 1px solid var(--border); background: transparent;
  color: var(--text-muted); cursor: pointer; transition: all 0.15s;
}
.thresh-btn:hover:not([class*="thresh-active"]) { border-color: #3a3a5c; color: var(--text); }
.thresh-btn.thresh-active-humid { background: #061a12; border-color: #22aa78; color: #44cc99; }
.thresh-btn.thresh-active-dry   { background: #1a1500; border-color: #b89a18; color: #e8cc44; }

/* ── Year selector row ── */
.controls-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 30px;
}
select {
  font-family: var(--font-label); font-size: 14px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  color: var(--accent-glow); padding: 4px 10px; cursor: pointer; outline: none; appearance: auto;
}
select:focus { border-color: var(--accent); }

/* ── Stat chips ── */
.stat-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-chip {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 16px; display: flex; flex-direction: column; gap: 1px;
}
.stat-label {
  font-family: var(--font-label); font-size: 11px; font-weight: 600;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px;
}
.stat-value {
  font-family: var(--font-mono); font-size: 26px; font-weight: 600;
  color: var(--type-glow); line-height: 1.1;
}

/* ── Legend ── */
.legend-row {
  display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-bottom: 6px;
}
.legend-end-label {
  font-family: var(--font-label); font-size: 13px; font-weight: 600;
  color: var(--text-muted); white-space: nowrap;
}
#legend-canvas { border-radius: 3px; border: 1px solid var(--border); display: block; }

/* ── Heatmap layout ── */
.heatmap-wrapper { width: 100%; }
.heatmap-inner { display: flex; align-items: flex-start; }
.hour-labels { flex-shrink: 0; width: 52px; display: flex; flex-direction: column; }
.hour-labels-spacer { height: 26px; }
.hour-label {
  font-family: var(--font-label); font-size: 14px; font-weight: 600; color: #b0b0cc;
  text-align: right; padding-right: 9px; display: flex; align-items: center; justify-content: flex-end;
}
.canvas-area { flex: 1; min-width: 0; position: relative; }
.month-label-bar { position: relative; height: 26px; user-select: none; }
.month-label {
  position: absolute; font-family: var(--font-label); font-size: 15px; font-weight: 700;
  color: #b0b0cc; transform: translateX(-50%); white-space: nowrap; line-height: 26px;
}
.canvas-container { position: relative; }
#heatmap-canvas { display: block; width: 100%; cursor: crosshair; }

/* ── Loading overlay ── */
.loading-overlay {
  position: absolute; inset: 0; background: rgba(7,7,15,0.88); display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; z-index: 10; backdrop-filter: blur(4px);
}
.loading-text { font-family: var(--font-label); font-size: 14px; font-weight: 600; letter-spacing: 0.4px; color: var(--text-muted); }
.progress-track { width: 280px; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-fill {
  height: 100%; background: linear-gradient(90deg, #0a4028, #22aa78);
  border-radius: 3px; transition: width 0.4s ease; width: 0%;
}
.error-text { font-family: var(--font-label); font-size: 13px; color: #ef4444; margin-top: 4px; }

/* ── Tooltip ── */
#tooltip {
  position: fixed; background: rgba(12,12,24,0.97); border: 1px solid #2e2e50;
  border-radius: 8px; padding: 10px 14px; pointer-events: none; z-index: 200;
  display: none; width: 236px; backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.tt-date { font-family: var(--font-label); font-size: 13px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.3px; margin-bottom: 5px; }
.tt-value { font-family: var(--font-mono); font-size: 20px; font-weight: 600; color: var(--type-glow); line-height: 1; margin-bottom: 4px; }
.tt-value.has-thresh { color: var(--type-glow); }
.tt-value.no-thresh  { color: var(--text-dim); }
.tt-detail { font-family: var(--font-body); font-size: 12px; color: var(--text-muted); line-height: 1.4; }

/* ── Footer ── */
.footer { margin-top: 14px; font-family: var(--font-label); font-size: 12px; color: var(--text-dim); }
.footer strong { color: #555575; }

/* ── CC pill ── */
.cc-pill {
  font-family: var(--font-label); font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
  background: #0a1628; border: 1px solid #1e3a5c; border-radius: 20px;
  color: var(--accent-glow); padding: 3px 12px; text-decoration: none;
  margin-left: 8px; transition: all 0.15s; white-space: nowrap;
}
.cc-pill:hover { background: #0f2040; border-color: var(--accent); color: #88c8f0; }

.download-btn {
  font-family: var(--font-label); font-size: 12px; font-weight: 600; letter-spacing: 0.3px;
  background: transparent; border: 1px solid var(--border); border-radius: 5px;
  color: var(--text-muted); padding: 3px 10px; cursor: pointer; transition: all 0.15s; margin-left: 8px;
}
.download-btn:hover { border-color: #3a3a5c; color: var(--text); }
</style>
</head>

                      'July','August','September','October','November','December'];
const MONTH_DAYS_LEAP   = [31,29,31,30,31,30,31,31,30,31,30,31];
const MONTH_DAYS_NOLEAP = [31,28,31,30,31,30,31,31,30,31,30,31];

const MONTH_START_DOY = (() => {
  const arr = [0];
  for (let m = 0; m < 11; m++) arr.push(arr[m] + MONTH_DAYS_LEAP[m]);

// ── Color palettes ───────────────────────────────────────────
// Humid: dark bg → dark green → medium green → teal → deep blue
// Dry:   dark bg → pale sandy yellow → bright yellow → amber → rich brown
const COLOR_STOPS = {
  humid: [
    { t: 0.00, rgb: [5,    8,  16] },
    { t: 0.07, rgb: [5,   20,  15] },
    { t: 0.18, rgb: [8,   62,  42] },
    { t: 0.32, rgb: [14, 115,  72] },
    { t: 0.48, rgb: [22, 162, 105] },
    { t: 0.62, rgb: [22, 172, 148] },
    { t: 0.76, rgb: [20, 158, 192] },
    { t: 0.90, rgb: [24, 118, 218] },
    { t: 1.00, rgb: [32,  80, 222] },
  ],
  dry: [
    { t: 0.00, rgb: [5,    8,  16] },
    { t: 0.06, rgb: [18,  15,   5] },
    { t: 0.16, rgb: [58,  50,  12] },
    { t: 0.30, rgb: [132, 120,  32] },
    { t: 0.48, rgb: [215, 200,  55] },
    { t: 0.64, rgb: [228, 195,  50] },
    { t: 0.78, rgb: [198, 150,  30] },
    { t: 0.90, rgb: [158, 102,  18] },
    { t: 1.00, rgb: [115,  62,  10] },
  ],
};

// Per-threshold UI glow colors (stat chips, tooltip, PNG accent)
const THRESH_GLOW = {
  humid: ['#44cc88', '#28b872', '#20a8a8', '#2290c8', '#2070d8'],
  dry:   ['#e8d855', '#d4b830', '#c09020', '#a06818', '#804010'],
};

// Single-year event pixel colors
const SINGLE_COLOR = {
  humid: [22, 165, 148],
  dry:   [215, 195, 52],
};

const MAX_PROB = 1.0; // 0–100% scale for all thresholds

function lerpColor(t, dir) {
  const stops = COLOR_STOPS[dir];
  t = Math.max(0, Math.min(1, t));
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t <= stops[i + 1].t) { lo = stops[i]; hi = stops[i + 1]; break; }
  }
  const span = hi.t - lo.t;
  const f = span < 1e-6 ? 0 : (t - lo.t) / span;
  return [
    Math.round(lo.rgb[0] + f * (hi.rgb[0] - lo.rgb[0])),
    Math.round(lo.rgb[1] + f * (hi.rgb[1] - lo.rgb[1])),
    Math.round(lo.rgb[2] + f * (hi.rgb[2] - lo.rgb[2])),
  ];
}
function probToRGB(prob, dir) { return lerpColor(Math.min(1, prob), dir); }
function rgb(r, g, b) { return `rgb(${r},${g},${b})`; }

// STATE
// ═══════════════════════════════════════════════════════════════
let mode    = 'climatology';
let dpDir   = 'humid'; // 'humid' | 'dry'
let dpIdx   = 0;       // 0–4

let currentYear   = CLIMO_END;
let singleMinGrid = null;  // Float32Array(366*24), min DP per hour (for dry checks)
let singleMaxGrid = null;  // Float32Array(366*24), max DP per hour (for humid checks)

// humidCount[threshIdx][doy][hour] — years with DP ≥ threshold
// dryCount[threshIdx][doy][hour]   — years with DP ≤ threshold
let humidCount = null;
let dryCount   = null;
let dataCount  = null;

// ═══════════════════════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════════════════════
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function getDOY0(year, month, day) {
  const md = isLeap(year) ? MONTH_DAYS_LEAP : MONTH_DAYS_NOLEAP;
  let d = 0;
  for (let m = 0; m < month - 1; m++) d += md[m];
  return d + day - 1;
}

function doyToMonthDay(doy) {
  let rem = doy;
  for (let m = 0; m < 12; m++) {
    if (rem < MONTH_DAYS_LEAP[m]) return { m, day: rem + 1 };
    rem -= MONTH_DAYS_LEAP[m];
  }
  return { m: 11, day: 31 };
}

function fmtHour(h) {
  if (h === 0)  return 'Midnight';
  if (h === 12) return 'Noon';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

// ═══════════════════════════════════════════════════════════════
// IEM FETCH + PARSE
// ═══════════════════════════════════════════════════════════════
function buildIEMUrl(y1, y2) {
  const st = activeStation();
  const tz = encodeURIComponent(st.tz);
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?` +
    `station=${activeStationId}&data=dwpf` +
    `&year1=${y1}&month1=1&day1=1` +
    `&year2=${y2}&month2=12&day2=31` +
    `&tz=${tz}&format=comma&latlon=no&missing=M&trace=T&direct=no`;
}

async function fetchRangeCSV(y1, y2) {
  const resp = await fetch(buildIEMUrl(y1, y2));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

function parseIEM(text) {
  const lines  = text.split('\n');
  const byYear = new Map();
  let dwpfIdx  = 2;
  let inData   = false;

  for (const line of lines) {
    const l = line.trim();
    if (!l) continue;

    if (l.startsWith('station,')) {
      const h  = l.split(',');
      const di = h.indexOf('dwpf');
      if (di >= 0) dwpfIdx = di;
      inData = true;
      continue;
    }
    if (!inData) continue;

    const parts = l.split(',');
    if (parts.length <= dwpfIdx) continue;

    const valid    = parts[1].trim();
    const spaceIdx = valid.indexOf(' ');
    if (spaceIdx < 1) continue;

    const dp = valid.substring(0, spaceIdx).split('-').map(Number);
    if (dp.length < 3 || isNaN(dp[0])) continue;

    const [yr, mo, dy] = dp;
    const hour = parseInt(valid.substring(spaceIdx + 1));
    if (isNaN(hour) || hour < 0 || hour > 23) continue;

    const doy = getDOY0(yr, mo, dy);
    if (doy < 0 || doy > 365) continue;

    const dwpfStr = parts[dwpfIdx].trim();
    if (!dwpfStr || dwpfStr === 'M') continue;
    const dwpf = parseFloat(dwpfStr);
    if (isNaN(dwpf)) continue;

    if (!byYear.has(yr)) byYear.set(yr, []);
    byYear.get(yr).push({ doy, hour, dwpf });
  }
  return byYear;
}

// ═══════════════════════════════════════════════════════════════
// DATA AGGREGATION
// ═══════════════════════════════════════════════════════════════
function initGrids() {
  humidCount = HUMID_THRESHOLDS.map(() =>
    Array.from({ length: 366 }, () => new Int16Array(24))
  );
  dryCount = DRY_THRESHOLDS.map(() =>
    Array.from({ length: 366 }, () => new Int16Array(24))
  );
  dataCount = Array.from({ length: 366 }, () => new Int16Array(24));
}

function processYear(obs) {
  const maxDP = new Float32Array(366 * 24).fill(-Infinity);
  const minDP = new Float32Array(366 * 24).fill(Infinity);
  const hasD  = new Uint8Array(366 * 24);

  for (const { doy, hour, dwpf } of obs) {
    const idx = doy * 24 + hour;
    hasD[idx] = 1;
    if (dwpf > maxDP[idx]) maxDP[idx] = dwpf;
    if (dwpf < minDP[idx]) minDP[idx] = dwpf;
  }

  for (let d = 0; d < 366; d++) {
    for (let h = 0; h < 24; h++) {
      const idx = d * 24 + h;
      if (hasD[idx]) {
        dataCount[d][h]++;
        // Humid: was max DP ≥ threshold?
        HUMID_THRESHOLDS.forEach((t, i) => { if (maxDP[idx] >= t) humidCount[i][d][h]++; });
        // Dry: was min DP ≤ threshold?
        DRY_THRESHOLDS.forEach((t, i) => { if (minDP[idx] <= t) dryCount[i][d][h]++; });
      }
    }
  }
}

// ── Active-threshold helpers ─────────────────────────────────
function getCount(d, h) {
  return dpDir === 'humid' ? humidCount[dpIdx][d][h] : dryCount[dpIdx][d][h];
}

function getSingleHas(doy, h) {
  const idx = doy * 24 + h;
  if (dpDir === 'humid') {
    const v = singleMaxGrid[idx];
    return (!isNaN(v) && v >= HUMID_THRESHOLDS[dpIdx]) ? 1 : 0;
  } else {
    const v = singleMinGrid[idx];
    return (!isNaN(v) && v <= DRY_THRESHOLDS[dpIdx]) ? 1 : 0;
  }
}

// ═══════════════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('heatmap-canvas');
const ctx    = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function setupCanvas() {
  const W = document.getElementById('canvas-area').clientWidth;
  const H = CANVAS_HEIGHT;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

// ═══════════════════════════════════════════════════════════════
// RENDER – HEATMAP
// ═══════════════════════════════════════════════════════════════
function renderHeatmap() {
  const W = canvas.width  / dpr;
  const H = canvas.height / dpr;
  const cellW = W / 366;
  const cellH = H / 24;
  const pw = Math.round(W * dpr);
  const ph = Math.round(H * dpr);

  const imgData = ctx.createImageData(pw, ph);
  const data    = imgData.data;
  const dir     = dpDir;

  for (let doy = 0; doy < 366; doy++) {
    const x0 = Math.round(doy       * cellW * dpr);
    const x1 = Math.round((doy + 1) * cellW * dpr);

    for (let h = 0; h < 24; h++) {
      const y0 = Math.round(h       * cellH * dpr);
      const y1 = Math.round((h + 1) * cellH * dpr);

      let r, g, b;
      if (mode === 'climatology') {
        const dc   = dataCount[doy][h];
        const min  = Math.ceil(TOTAL_YEARS / 3);
        const prob = (dc >= min) ? getCount(doy, h) / dc : 0;
        [r, g, b] = probToRGB(prob, dir);
      } else {
        if (getSingleHas(doy, h)) { [r, g, b] = SINGLE_COLOR[dir]; }
        else                      { [r, g, b] = [5, 8, 16]; }
      }

      for (let py = y0; py < y1 && py < ph; py++) {
        for (let px = x0; px < x1 && px < pw; px++) {
          const i = (py * pw + px) * 4;
          data[i] = r; data[i+1] = g; data[i+2] = b; data[i+3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Month dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1;
  for (let m = 1; m < 12; m++) {
    const x = Math.round(MONTH_START_DOY[m] * cellW) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  // Noon divider
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  const noonY = Math.round(12 * cellH) + 0.5;
  ctx.beginPath(); ctx.moveTo(0, noonY); ctx.lineTo(W, noonY); ctx.stroke();
}

// ═══════════════════════════════════════════════════════════════
// RENDER – LEGEND
// ═══════════════════════════════════════════════════════════════
function renderLegend() {
  const lc = document.getElementById('legend-canvas');
  const lx = lc.getContext('2d');
  const W  = lc.width, H = lc.height;
  lx.clearRect(0, 0, W, H);

  if (mode === 'climatology') {
    const grad = lx.createLinearGradient(0, 0, W, 0);
    for (const s of COLOR_STOPS[dpDir]) {
      const [r, g, b] = lerpColor(s.t, dpDir);
      grad.addColorStop(s.t, `rgb(${r},${g},${b})`);
    }
    lx.fillStyle = grad;
    lx.fillRect(0, 0, W, H);
    document.getElementById('legend-lo').textContent = '0%';
    document.getElementById('legend-hi').textContent = '100%';
  } else {
    lx.fillStyle = rgb(5, 8, 16);
    lx.fillRect(0, 0, W / 2, H);
    const [r, g, b] = SINGLE_COLOR[dpDir];
    lx.fillStyle = rgb(r, g, b);
    lx.fillRect(W / 2, 0, W / 2, H);
    document.getElementById('legend-lo').textContent = 'None';
    document.getElementById('legend-hi').textContent =
      dpDir === 'humid' ? HUMID_LABELS[dpIdx] : DRY_LABELS[dpIdx];
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER – HOUR & MONTH LABELS
// ═══════════════════════════════════════════════════════════════
function renderHourLabels() {
  const container = document.getElementById('hour-labels');
  while (container.children.length > 1) container.removeChild(container.lastChild);
  const cellH = CANVAS_HEIGHT / 24;
  for (let h = 0; h < 24; h++) {
    const el = document.createElement('div');

    el.style.height = cellH + 'px';
    el.textContent  = h === 0 ? 'Midnight' : h === 12 ? 'Noon' : h < 12 ? h : h - 12;
    container.appendChild(el);
  }
}

function renderMonthLabels() {
  const bar   = document.getElementById('month-label-bar');
  bar.innerHTML = '';
  const W     = document.getElementById('canvas-area').clientWidth;
  const cellW = W / 366;
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e) / 2;
    const el  = document.createElement('div');
    el.className   = 'month-label';
    el.textContent = MONTHS_SHORT[m];

}

// ═══════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════
function activeLabel() {
  return dpDir === 'humid' ? HUMID_LABELS[dpIdx] : DRY_LABELS[dpIdx];
}

function updateStats() {
  const lbl = activeLabel();

  if (mode === 'climatology' && humidCount) {
    document.getElementById('sv-period').textContent = `${CLIMO_START}–${CLIMO_END}`;
    document.getElementById('sl-period').textContent = 'Period';
    document.getElementById('sl-annual').textContent = `Avg Hrs ${lbl} DP / Yr`;

    // Peak month
    const monthAvg = MONTHS_SHORT.map((_, m) => {
      const s = MONTH_START_DOY[m];
      const e = m < 11 ? MONTH_START_DOY[m + 1] : 366;
      let sum = 0, n = 0;
      for (let d = s; d < e; d++)
        for (let h = 0; h < 24; h++)
          if (dataCount[d][h] > 2) { sum += getCount(d, h) / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakM = monthAvg.indexOf(Math.max(...monthAvg));
    document.getElementById('sv-month').textContent = MONTHS_FULL[peakM];

    // Peak hour
    const hourAvg = Array.from({ length: 24 }, (_, h) => {
      let sum = 0, n = 0;
      for (let d = 0; d < 366; d++)
        if (dataCount[d][h] > 2) { sum += getCount(d, h) / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakH = hourAvg.indexOf(Math.max(...hourAvg));
    document.getElementById('sv-hour').textContent = fmtHour(peakH);

    // Avg hours per year
    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        total += getCount(d, h);
    document.getElementById('sv-annual').textContent = (total / TOTAL_YEARS).toFixed(1);

  } else if (mode === 'single' && singleMinGrid) {
    document.getElementById('sv-period').textContent = currentYear;
    document.getElementById('sl-period').textContent = 'Year';
    document.getElementById('sl-annual').textContent = `Total Hrs ${lbl} DP`;

    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (getSingleHas(d, h)) total++;
    document.getElementById('sv-annual').textContent = total;

    const byMonth = Array(12).fill(0);
    for (let d = 0; d < 366; d++) {
      const { m } = doyToMonthDay(d);
      for (let h = 0; h < 24; h++) if (getSingleHas(d, h)) byMonth[m]++;
    }
    const peakM = byMonth.indexOf(Math.max(...byMonth));
    document.getElementById('sv-month').textContent = byMonth[peakM] ? MONTHS_FULL[peakM] : '–';

    const byHour = Array(24).fill(0);
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (getSingleHas(d, h)) byHour[h]++;
    const peakH = byHour.indexOf(Math.max(...byHour));
    document.getElementById('sv-hour').textContent = byHour[peakH] ? fmtHour(peakH) : '–';
  }
}

// ═══════════════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════════════
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  if (!humidCount && mode === 'climatology') { tooltip.style.display = 'none'; return; }
  if (mode === 'single' && !singleMinGrid)   { tooltip.style.display = 'none'; return; }

  const rect = canvas.getBoundingClientRect();
  const doy  = Math.min(365, Math.max(0, Math.floor((e.clientX - rect.left) / rect.width  * 366)));
  const h    = Math.min(23,  Math.max(0, Math.floor((e.clientY - rect.top)  / rect.height * 24)));

  const { m, day } = doyToMonthDay(doy);
  document.getElementById('tt-date').textContent = `${MONTHS_FULL[m]} ${day}  ·  ${fmtHour(h)}`;

  const val = document.getElementById('tt-value');
  const det = document.getElementById('tt-detail');
  val.className = 'tt-value';

  if (mode === 'climatology') {
    const dc  = dataCount[doy][h];
    const min = Math.ceil(TOTAL_YEARS / 3);
    if (dc < min) {
      val.textContent = '–';
      det.textContent = 'Insufficient data';
    } else {
      const cnt = getCount(doy, h);
      val.textContent = (cnt / dc * 100).toFixed(1) + '%';
      det.textContent = `${cnt} of ${dc} years — DP ${activeLabel()} this hour`;
    }
  } else {
    const has = getSingleHas(doy, h);
    val.textContent = has ? activeLabel() + ' DP' : 'Not reached';
    val.classList.add(has ? 'has-thresh' : 'no-thresh');
    const idx  = doy * 24 + h;
    const maxV = singleMaxGrid[idx];
    const minV = singleMinGrid[idx];
    if (!isNaN(maxV)) {
      const reported = dpDir === 'humid' ? maxV.toFixed(0) : minV.toFixed(0);
      det.textContent = has
        ? `${reported}°F dewpoint observed`
        : `${reported}°F dewpoint — threshold not reached`;
    } else {
      det.textContent = 'No data';
    }
  }

  tooltip.style.display = 'block';
  const TW = 236, TH = 95;
  let tx = e.clientX + 16;
  let ty = e.clientY - 10;
  if (tx + TW > window.innerWidth  - 10) tx = e.clientX - TW - 12;
  if (ty + TH > window.innerHeight - 10) ty = window.innerHeight - TH - 10;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════
// LOAD – CLIMATOLOGY
// ═══════════════════════════════════════════════════════════════
async function loadClimatology() {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = `${CLIMO_START}–${CLIMO_END}`;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;

  if (climoCache.has(activeStationId)) {
    const c = climoCache.get(activeStationId);
    humidCount = c.humidCount; dryCount = c.dryCount; dataCount = c.dataCount;
    renderHeatmap(); renderLegend(); updateStats();
    return;
  }

  initGrids();
  showLoading(`Fetching ${CLIMO_START}–${CLIMO_END} from IEM… (may take ~30s)`);

  try {
    const csv = await fetchRangeCSV(CLIMO_START, CLIMO_END);
    setProgress(55, 'Parsing dewpoint observations…');
    await sleep(30);
    const byYear = parseIEM(csv);
    for (const obs of byYear.values()) totalObsParsed += obs.length;
    setProgress(80, 'Aggregating by year…');
    await sleep(30);
    for (const obs of byYear.values()) processYear(obs);
    setProgress(100);

    climoCache.set(activeStationId, {
      humidCount: humidCount.map(arr => arr.map(r => Int16Array.from(r))),
      dryCount:   dryCount.map(arr => arr.map(r => Int16Array.from(r))),
      dataCount:  dataCount.map(r => Int16Array.from(r)),
    });

    hideLoading();
  } catch (e) {
    showError(`Failed to load: ${e.message}`);
    console.error('Climatology load failed:', e);
    return;
  }

  renderHeatmap(); renderLegend(); updateStats();
}

// ═══════════════════════════════════════════════════════════════
// LOAD – SINGLE YEAR
// ═══════════════════════════════════════════════════════════════
async function loadSingleYear(year) {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = year;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;
  showLoading(`Loading ${year} data…`);

  try {
    const csv = await fetchRangeCSV(year, year);
    const byYear = parseIEM(csv);
    const obs = byYear.get(year) || [];

    const INF = Infinity;
    singleMaxGrid = new Float32Array(366 * 24).fill(-INF);
    singleMinGrid = new Float32Array(366 * 24).fill(INF);

    for (const { doy, hour, dwpf } of obs) {
      const idx = doy * 24 + hour;
      if (dwpf > singleMaxGrid[idx]) singleMaxGrid[idx] = dwpf;
      if (dwpf < singleMinGrid[idx]) singleMinGrid[idx] = dwpf;
    }
    for (let i = 0; i < singleMaxGrid.length; i++) {
      if (singleMaxGrid[i] === -INF) singleMaxGrid[i] = NaN;
      if (singleMinGrid[i] ===  INF) singleMinGrid[i] = NaN;
    }

    hideLoading();
    renderHeatmap(); renderLegend(); updateStats();
  } catch (err) {
    showError(err.message);
    console.error(err);
  }
}

// ═══════════════════════════════════════════════════════════════
// MODE / THRESHOLD / NAV
// ═══════════════════════════════════════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('tab-climo').classList.toggle('active', m === 'climatology');
  document.getElementById('tab-single').classList.toggle('active', m === 'single');

  const showYear = m === 'single';
  document.getElementById('ctrl-label').style.display  = showYear ? 'inline' : 'none';
  document.getElementById('year-select').style.display = showYear ? 'inline' : 'none';

  if (m === 'climatology') loadClimatology();
  else {
    currentYear = parseInt(document.getElementById('year-select').value);
    loadSingleYear(currentYear);
  }
}

function setThresh(dir, idx) {
  dpDir = dir;
  dpIdx = idx;

  document.documentElement.style.setProperty('--type-glow', THRESH_GLOW[dir][idx]);

  for (let i = 0; i < 5; i++) {
    document.getElementById('thresh-h' + i).className =
      'thresh-btn' + (dir === 'humid' && i === idx ? ' thresh-active-humid' : '');
    document.getElementById('thresh-d' + i).className =
      'thresh-btn' + (dir === 'dry'   && i === idx ? ' thresh-active-dry'   : '');
  }

  renderHeatmap();
  renderLegend();
  updateStats();
}

function onYearChange() {
  currentYear   = parseInt(document.getElementById('year-select').value);
  singleMinGrid = null; singleMaxGrid = null;
  loadSingleYear(currentYear);
}

function onStationChange() {
  activeStationId = document.getElementById('station-select').value;
  singleMinGrid = null; singleMaxGrid = null;
  humidCount = null; dryCount = null; dataCount = null;
  if (mode === 'climatology') loadClimatology();
  else loadSingleYear(currentYear);
}

// ═══════════════════════════════════════════════════════════════
// DOWNLOAD PNG
// ═══════════════════════════════════════════════════════════════
function downloadPNG() {
  const st       = activeStation();
  const period   = mode === 'single' ? String(currentYear) : `${CLIMO_START}–${CLIMO_END}`;
  const lbl      = activeLabel();
  const dirLabel = dpDir === 'humid' ? 'Humid' : 'Dry';
  const subtitle = mode === 'climatology'
    ? `Probability of hourly dewpoint ${lbl} by hour and day of year  ·  ${CLIMO_START}–${CLIMO_END}`
    : `Hours with dewpoint ${lbl}  ·  ${currentYear}`;

  const cw = canvas.width  / dpr;
  const ch = canvas.height / dpr;
  const PAD = 24, HDR = 88, FTR = 28;
  const ow = cw + PAD * 2;
  const oh = HDR + ch + FTR;

  const off = document.createElement('canvas');
  off.width  = ow * 2; off.height = oh * 2;
  const oc = off.getContext('2d');
  oc.scale(2, 2);

  oc.fillStyle = '#07070f';
  oc.fillRect(0, 0, ow, oh);

  // Accent bar in threshold glow color
  oc.fillStyle = THRESH_GLOW[dpDir][dpIdx];
  oc.fillRect(0, 0, ow, 3);

  oc.fillStyle = '#e6e6f0';
  oc.font = 'bold 20px "Barlow Condensed", Arial, sans-serif';
  oc.fillText(`${st.label}  ·  Dewpoint Threshold Heatmap  ·  ${period}`, PAD, 28);

  oc.fillStyle = '#7878a0';
  oc.font = '14px "Barlow Condensed", Arial, sans-serif';
  oc.fillText(subtitle, PAD, 48);

  if (mode === 'climatology' && humidCount) {
    const peak = document.getElementById('sv-month').textContent;
    const hr   = document.getElementById('sv-hour').textContent;
    const avg  = document.getElementById('sv-annual').textContent;
    oc.fillStyle = THRESH_GLOW[dpDir][dpIdx];
    oc.font = 'bold 13px "Barlow Condensed", Arial, sans-serif';
    oc.fillText(`Peak month: ${peak}   Peak hour: ${hr}   Avg hrs/yr: ${avg}`, PAD, 68);
  }

  oc.fillStyle = '#555575';
  oc.font = '13px "Barlow Condensed", Arial, sans-serif';
  oc.textAlign = 'right';
  oc.fillText('contextclimate.io', ow - PAD, 28);
  oc.textAlign = 'left';

  oc.drawImage(canvas, PAD, HDR, cw, ch);

  oc.fillStyle = '#3e3e58';
  oc.font = '12px "Barlow Condensed", Arial, sans-serif';
  oc.fillText(`${st.tzLabel} Local Time  ·  Data: IEM ASOS (dwpf)  ·  contextclimate.io`, PAD, HDR + ch + 18);

  oc.fillStyle = THRESH_GLOW[dpDir][dpIdx];
  oc.fillRect(0, oh - 2, ow, 2);

  const threshVal  = dpDir === 'humid' ? HUMID_THRESHOLDS[dpIdx] : DRY_THRESHOLDS[dpIdx];
  const threshSlug = String(threshVal).replace('-', 'neg');
  const link       = document.createElement('a');
  link.download    = `dewpoint-heatmap-${activeStationId}-${dpDir}${threshSlug}-${period}.png`;
  link.href        = off.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════════════════════
// UTIL + INIT
// ═══════════════════════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function init() {
  const sel = document.getElementById('year-select');
  for (let y = CLIMO_END; y >= CLIMO_START; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  }
  sel.value = currentYear;

  document.documentElement.style.setProperty('--type-glow', THRESH_GLOW[dpDir][dpIdx]);

  requestAnimationFrame(() => {
    setupCanvas();
    renderHourLabels();
    renderMonthLabels();
    renderLegend();
    loadClimatology();
  });

  window.addEventListener('resize', () => {
    dpr = window.devicePixelRatio || 1;
    setupCanvas();
    renderMonthLabels();
    const hasData = (mode === 'climatology' && humidCount) ||
                    (mode === 'single' && singleMinGrid);
    if (hasData) renderHeatmap();
  });
}

init();
</script>
