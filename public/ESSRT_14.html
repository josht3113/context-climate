/* body */

/* printed page */

#pcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }

.chip.pg { left: 10px; top: 10px; }

  transition: opacity .5s ease; pointer-events: none; }

  background: var(--tool-accent); border: 0; border-radius: var(--radius-md); cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.45); font-family: var(--font-body); white-space: nowrap; }

/* page control bar */
.tour { flex: 0 0 auto; min-width: 176px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: stretch;
  background: var(--tool-accent); border: 1px solid var(--tool-accent); color: var(--color-bg); font-weight: 700; font-size: 15px;

.tour .ls { display: none; }

.nb { width: 36px; padding: 0; font-size: 20px; line-height: 1; }

.thru { align-self: stretch; }
.thru.on { background: rgba(60,163,174,0.16); border-color: var(--tool-accent); }
.msel { align-self: stretch; display: flex; align-items: center; gap: 8px; }
.msel select { height: 100%; min-width: 0; max-width: 220px; background: var(--color-surface-2); color: var(--color-text-primary); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-md); font-family: var(--font-body); font-size: 15px; font-weight: 600; padding: 0 8px; cursor: pointer; }
.msel select:focus-visible { outline: 2px solid var(--tool-accent); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.k-eb { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); min-height: 28px; }
.k-eb .r { margin-left: auto; color: #A6A499; }
.k-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.12; margin: 8px 0 2px; color: var(--color-text-primary); }

.k-sec { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #A6A499; margin: 10px 0 4px; display: flex; align-items: baseline; gap: 6px; }
.k-sec .n { color: var(--color-text-primary); font-weight: 700; }
.k-src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); padding-top: 8px; line-height: 1.4; margin-top: auto; }
.k-src a { color: var(--color-text-secondary); }

.rows { margin: 2px 0 4px; }
.row { display: grid; grid-template-columns: 82px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--color-border); align-items: baseline; }

.row canvas { display: block; margin-top: 4px; }
.forms { display: flex; gap: 4px; margin: 4px 0 2px; }
.forms .tbtn { flex: 1; padding: 5px 6px; font-size: 13.5px; }
.ix { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 4px; margin: 2px 0 2px; }
.ix button { all: unset; cursor: pointer; font-size: 14px; line-height: 1.35; color: var(--color-text-secondary); padding: 1px 6px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-body); }
.ix button:hover, .ix button:focus-visible { background: var(--color-surface-2); color: var(--color-text-primary); }
.ix button.on { color: var(--color-text-primary); background: rgba(60,163,174,.18); }
.ix button .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--c, #A6A499); }
.starts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 2px; }
.starts .k-act { margin: 0; flex-direction: column; gap: 0; padding: 8px 6px; line-height: 1.2; }
.starts .k-act span { font-family: var(--font-mono); font-size: 12px; font-weight: 400; opacity: .85; }

/* narrow widths: drop words, never shrink type */
@media (max-width: 1500px) { .tabs .lf { display: none; } .tabs .ls { display: inline; } }
@media (max-width: 1360px) { .x-link .nm { display: none; } .thru .lb { display: none; } }

  .q-h { font-size: 23px; margin-bottom: 8px; }
  .tile .tl { font-size: 15px; }
  .tile .td { font-size: 13px; -webkit-line-clamp: 2; }

}
