<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mineral Identification · ESSRT pp. 16–17</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.ttl { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #A6A499; line-height: 1.1; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; line-height: 1.1; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 13px; white-space: nowrap; }
.tabs .ls { display: none; }
.top .spacer { flex: 1; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.pngwrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.menu.open { display: flex; }
.menu button { all: unset; cursor: pointer; font-family: var(--font-body); font-size: 14px; color: var(--color-text-primary); padding: 8px 12px; border-radius: 4px; }
.menu button:hover, .menu button:focus-visible { background: var(--color-surface); color: var(--tool-accent); }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 2px; }
.view { position: absolute; inset: 0; display: none; }
body.t-page #pageView, body.t-key #keyView, body.t-hard #hardView { display: block; }
body.t-key #keyView { display: grid; }
body:not(.t-page) .page-only, body:not(.t-key) .key-only, body:not(.t-hard) .hard-only { display: none !important; }
body.t-key .anim-only { display: none !important; }

.tbtn { background: var(--color-surface-2); border: 1px solid var(--color-border-hover); color: var(--color-text-primary);
  font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.tbtn:hover:not(:disabled) { border-color: var(--tool-accent); }
.tbtn:disabled { opacity: .35; cursor: default; }
.tbtn:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 2px; }
.tbtn.on { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); font-weight: 700; }
.chip { position: absolute; display: flex; gap: 6px; z-index: 4; align-items: center; }
.chip .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chip .cl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #A6A499; margin-right: 2px; }

/* printed page */
#pageView { background: #171B18; overflow: hidden; }
#pcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#pcv.drag { cursor: grabbing; }
#pcv.hot { cursor: pointer; }
.chip.pg { left: 10px; top: 10px; }
.zoomer { position: absolute; right: 10px; bottom: 10px; z-index: 4; display: flex; align-items: center; gap: 4px;
  background: rgba(38,43,39,.94); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; }
.zb { width: 30px; padding: 5px 0; font-family: var(--font-mono); font-size: 15px; text-align: center; }
.zpct { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 46px; text-align: center; }
.phint { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 4; font-size: 13.5px; color: var(--color-text-primary);
  background: rgba(30,35,32,.92); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 6px 12px; white-space: nowrap;
  transition: opacity .5s ease; pointer-events: none; }
.phint.gone { opacity: 0; }
.jump { position: absolute; z-index: 5; display: none; padding: 7px 13px; font-size: 14px; font-weight: 700; color: var(--color-bg);
  background: var(--tool-accent); border: 0; border-radius: var(--radius-md); cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.45); font-family: var(--font-body); white-space: nowrap; }
.jump:hover { filter: brightness(1.1); }

/* page control bar */
.tour { flex: 0 0 auto; min-width: 176px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: stretch;
  background: var(--tool-accent); border: 1px solid var(--tool-accent); color: var(--color-bg); font-weight: 700; font-size: 15px;
  padding: 6px 16px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; font-family: var(--font-body); }
.tour:hover { filter: brightness(1.1); }
.tour.invite { animation: invite 2.2s ease-out infinite; }
@keyframes invite { 0% { box-shadow: 0 0 0 0 rgba(60,163,174,.55); } 70% { box-shadow: 0 0 0 10px rgba(60,163,174,0); } 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } }
.tour .ls { display: none; }
.stepper { display: flex; align-items: stretch; gap: 4px; align-self: stretch; min-width: 0; flex: 1 1 auto; }
.nb { width: 36px; padding: 0; font-size: 20px; line-height: 1; }
.stepinfo { display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1 1 auto; padding: 4px 12px;
  background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.stepinfo b { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: #A6A499; font-weight: 700; white-space: nowrap; }
.stepinfo i { font-style: normal; font-size: 15px; font-weight: 600; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thru { align-self: stretch; }
.thru.on { background: rgba(60,163,174,0.16); border-color: var(--tool-accent); }
.msel { align-self: stretch; display: flex; align-items: center; gap: 8px; }
.msel select { height: 100%; min-width: 0; max-width: 220px; background: var(--color-surface-2); color: var(--color-text-primary); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-md); font-family: var(--font-body); font-size: 15px; font-weight: 600; padding: 0 8px; cursor: pointer; }
.msel select:focus-visible { outline: 2px solid var(--tool-accent); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.k-eb { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); min-height: 28px; }
.k-eb .r { margin-left: auto; color: #A6A499; }
.k-title { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.12; margin: 8px 0 2px; color: var(--color-text-primary); }
.k-sub { font-size: 14px; color: var(--color-text-secondary); margin: 0 0 6px; }
.k-sec { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #A6A499; margin: 10px 0 4px; display: flex; align-items: baseline; gap: 6px; }
.k-sec .n { color: var(--color-text-primary); font-weight: 700; }
.k-src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); padding-top: 8px; line-height: 1.4; margin-top: auto; }
.k-src a { color: var(--color-text-secondary); }
.k-act { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 9px 12px; border-radius: var(--radius-md);
  background: var(--tool-accent); border: 1px solid var(--tool-accent); color: var(--color-bg); font-weight: 700; font-size: 15px; cursor: pointer;
  text-decoration: none; margin: 8px 0 2px; font-family: var(--font-body); }
.k-act:hover { filter: brightness(1.1); }
.k-act.alt { background: var(--color-surface-2); color: var(--color-text-primary); border-color: var(--tool-accent); }
.k-back { align-self: flex-start; background: none; border: 0; color: var(--tool-accent); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; margin-top: 4px; font-family: var(--font-body); }
.k-back:hover { text-decoration: underline; }
.ph { position: relative; margin: 6px 0 4px; border-radius: var(--radius-md); overflow: hidden; background: #111412; aspect-ratio: 3 / 2; flex: none; }
.ph img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph .vars { position: absolute; right: 6px; bottom: 6px; display: flex; gap: 4px; }
.ph .vars button { width: 13px; height: 13px; border-radius: 50%; border: 2px solid #FFF; background: rgba(0,0,0,.35); padding: 0; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.ph .vars button.on { background: #FFF; }
.cred { font-size: 12.5px; line-height: 1.3; color: var(--color-text-muted); margin: 0 0 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.cred a { color: var(--color-text-muted); }
.path { display: flex; flex-wrap: wrap; gap: 3px 3px; align-items: center; margin: 2px 0 6px; }
.path .pn { font-size: 13px; line-height: 1.2; padding: 3px 7px; border-radius: 3px; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); color: var(--color-text-primary); cursor: pointer; font-family: var(--font-body); }
.path .pn:hover { border-color: var(--tool-accent); }
.path .pn.fin { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); font-weight: 700; cursor: default; }
.path .pa { color: #A6A499; font-size: 13px; }
.rows { margin: 2px 0 4px; }
.row { display: grid; grid-template-columns: 82px 1fr; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--color-border); align-items: baseline; }
.row:first-child { border-top: 1px solid var(--color-border); }
.row .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #A6A499; }
.row .v { font-size: 14.5px; line-height: 1.3; color: var(--color-text-primary); }
.row canvas { display: block; margin-top: 4px; }
.forms { display: flex; gap: 4px; margin: 4px 0 2px; }
.forms .tbtn { flex: 1; padding: 5px 6px; font-size: 13.5px; }
.ix { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 4px; margin: 2px 0 2px; }
.ix button { all: unset; cursor: pointer; font-size: 14px; line-height: 1.35; color: var(--color-text-secondary); padding: 1px 6px; border-radius: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-body); }
.ix button:hover, .ix button:focus-visible { background: var(--color-surface-2); color: var(--color-text-primary); }
.ix button.on { color: var(--color-text-primary); background: rgba(60,163,174,.18); }
.ix button .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--c, #A6A499); }
.starts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0 2px; }
.starts .k-act { margin: 0; flex-direction: column; gap: 0; padding: 8px 6px; line-height: 1.2; }
.starts .k-act span { font-family: var(--font-mono); font-size: 12px; font-weight: 400; opacity: .85; }

/* key it out */
#keyView { grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); }
.qp { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 14px 16px 12px; border-right: 1px solid var(--color-border); overflow: hidden; }
.q-eb { font-family: var(--font-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
.q-h { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--color-text-primary); margin: 2px 0 10px; }
.tiles { flex: 1; min-height: 0; display: grid; gap: 10px; align-content: start; }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden;
  background: var(--color-surface-2); border: 1.5px solid var(--color-border-hover); border-radius: var(--radius-lg); transition: border-color .15s, transform .15s, box-shadow .15s; }
.tile:hover, .tile:focus-visible { border-color: var(--tool-accent); box-shadow: 0 0 0 3px rgba(60,163,174,.22); }
.tile .vis { position: relative; flex: 1 1 auto; min-height: 60px; background: #151816; }
.tile .vis canvas, .tile .vis img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.tile .vis .two { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.tile .vis .two img { position: static; width: 100%; height: 100%; }
.tile .tx { flex: none; padding: 7px 10px 8px; }
.tile .tl { font-size: 16px; font-weight: 700; line-height: 1.2; color: var(--color-text-primary); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tile .td { font-size: 13.5px; line-height: 1.3; color: var(--color-text-secondary); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.res { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.res .ph { margin: 0; }
.res .rn { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; color: var(--color-text-primary); }
.res .rs { font-size: 15px; color: var(--color-text-secondary); margin: 2px 0 8px; }
.res .rd { font-size: 15px; line-height: 1.45; color: var(--color-text-primary); border-left: 3px solid var(--tool-accent); padding-left: 10px; }
.res .rb { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.res .rb .k-act { margin: 0; }
#mapCv { display: block; width: 100%; height: 100%; min-width: 0; cursor: default; }
#mapCv.hot { cursor: pointer; }
.crumbs { display: flex; align-items: stretch; gap: 4px; flex: 1 1 auto; min-width: 0; align-self: stretch; overflow: hidden; }
.crumb { flex: 0 1 auto; min-width: 54px; display: flex; flex-direction: column; justify-content: center; padding: 3px 10px; line-height: 1.12;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); cursor: pointer; color: var(--color-text-primary); font-family: var(--font-body); overflow: hidden; }
.crumb:hover { border-color: var(--tool-accent); }
.crumb span { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }
.crumb b { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb.cur { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); cursor: default; }
.crumb.cur span { color: var(--color-bg); }
.crumb.ghost { border-style: dashed; color: var(--color-text-secondary); cursor: default; }
.crumb.ghost:hover { border-color: var(--color-border-hover); }
.restart { align-self: stretch; }
.cands { display: flex; flex-direction: column; gap: 2px; margin: 2px 0; }
.cand { all: unset; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 2px 4px; border-radius: 4px; font-size: 14px; color: var(--color-text-primary); font-family: var(--font-body); }
.cand:hover, .cand:focus-visible, .cand.hl { background: var(--color-surface-2); }
.cand img { width: 40px; height: 27px; object-fit: cover; border-radius: 3px; flex: none; background: #111; }
.cand .s { color: var(--color-text-secondary); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* hardness */
#hardView { background: #171B18; }
#hcv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#hcv.hot { cursor: pointer; }
.chip.tools { left: 10px; top: 10px; }
.chip.tools .tbtn { padding: 6px 11px; }
.snap { min-width: 0; padding: 5px 12px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.12; gap: 1px; color: var(--color-text-primary); align-self: stretch; }
.snap b { font-family: var(--font-display); font-size: 17px; font-weight: 700; white-space: nowrap; }
.snap span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active span { color: var(--color-bg); }
.play { min-width: 160px; padding: 9px 14px; font-size: 15px; font-weight: 700; align-self: stretch; }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--color-text-primary); min-width: 84px; text-align: right; white-space: nowrap; }
.lists { display: flex; flex-direction: column; gap: 2px; }
.lst { margin: 1px 0 2px; font-size: 14px; line-height: 1.5; color: var(--color-text-muted); }
.lst button { all: unset; cursor: pointer; font-size: 14px; color: var(--color-text-primary); font-family: var(--font-body); border-bottom: 2px solid var(--c); line-height: 1.25; }
.lst button:hover, .lst button:focus-visible { color: var(--tool-accent); }
.lst .none { font-size: 13px; color: var(--color-text-muted); }
.hbig { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1.05; color: var(--color-text-primary); margin: 6px 0 0; }
.hbig small { font-family: var(--font-body); font-size: 14px; font-weight: 500; color: var(--color-text-secondary); margin-left: 6px; }
.leg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 2px; }
.leg div { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.leg i { display: inline-block; width: 16px; height: 10px; border-radius: 2px; }

/* narrow widths: drop words, never shrink type */
@media (max-width: 1500px) { .tabs .lf { display: none; } .tabs .ls { display: inline; } }
@media (max-width: 1360px) { .x-link .nm { display: none; } .thru .lb { display: none; } }
@media (max-width: 1280px) { .tour { min-width: 112px; } .tour .lb { display: none; } .tour .ls { display: inline; } .snap span { display: none; } .crumb span { display: none; } }
@media (max-width: 1240px) { .main { grid-template-columns: minmax(0, 1fr) 262px; } #keyView { grid-template-columns: minmax(0, 1.25fr) minmax(260px, 1fr); } .chip.tools .cl { display: none; } }
@media (max-width: 1160px) { .eyebrow { display: none; } .slider .sv { display: none; } .msel select { max-width: 150px; } }
@media (max-height: 700px) {
  .k-title { font-size: 21px; margin: 6px 0 2px; }
  .row { padding: 3px 0; }
  .row .v { font-size: 14px; }
  .k-sec { margin: 6px 0 3px; }
  .q-h { font-size: 23px; margin-bottom: 8px; }
  .tile .tl { font-size: 15px; }
  .tile .td { font-size: 13px; -webkit-line-clamp: 2; }
  .card .ph { aspect-ratio: 16 / 9; }
}
</style>
</head>
<body class="t-page">
<div class="app">
  <div class="top">
    <div class="ttl"><span class="eyebrow">ESSRT 2026 &middot; pp.&nbsp;16&ndash;17</span><h1 class="cc-title">Mineral Identification</h1></div>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn" data-step="page"><span class="lf">Printed page</span><span class="ls">Page</span></button>
      <button class="cc-segmented-btn" data-step="key"><span class="lf">Key it out</span><span class="ls">Key</span></button>
      <button class="cc-segmented-btn" data-step="hard"><span class="lf">Hardness</span><span class="ls">Hardness</span></button>
    </div>
    <div class="spacer"></div>
    <span id="status" aria-live="polite"></span>
    <a class="cc-btn x-link" id="lkLab" target="_top" href="#" title="Mineral Properties Lab">Mineral Lab<span class="nm"> &rarr;</span></a>
    <div class="exp">
      <div class="pngwrap">
        <button class="cc-btn" id="bPNG" aria-haspopup="true" aria-expanded="false">&darr; PNG &#9662;</button>
        <div class="menu" id="pngMenu" role="menu">
          <button data-png="all" role="menuitem">Whole tool</button>
          <button data-png="p16" role="menuitem" class="page-only">Page 16</button>
          <button data-png="p17" role="menuitem" class="page-only">Page 17</button>
          <button data-png="map" role="menuitem" class="key-only">Flowchart map</button>
          <button data-png="ladder" role="menuitem" class="hard-only">Hardness chart</button>

      </div>
