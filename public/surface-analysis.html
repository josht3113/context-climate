<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Analysis Builder</title>
<link rel="stylesheet" href="core-sample-tools.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root { --tool-accent: var(--accent-live); --cc-card-width: 330px; }
[hidden] { display: none !important; }
.cc-tab { font-size: 15px; padding: 8px 12px; }
.sm-select { font-family: var(--font-mono); font-size: 14px; padding: 7px 10px; border-radius: var(--radius-md); }
.status { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tool-accent); box-shadow: 0 0 0 3px rgba(42,168,126,.18); }
.status.err .dot { background: #E5534B; box-shadow: 0 0 0 3px rgba(229,83,75,.18); }
.status.busy .dot { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.sab-head { gap: 6px 8px; flex-wrap: wrap; }
.pchip { font-family: var(--font-mono); font-size: 13px; letter-spacing: .03em; padding: 5px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: transparent; color: var(--color-text-muted); cursor: pointer; }
.pchip.is-active { color: var(--color-text-primary); border-color: var(--tool-accent); background: var(--color-surface-2); }
.pchip:hover { border-color: var(--tool-accent); }
.pchip:disabled { opacity: .35; cursor: default; border-color: var(--color-border); }
.zoom { display: inline-flex; gap: 4px; }
.zoom button { width: 30px; height: 30px; font-size: 17px; line-height: 1; padding: 0; }
#stage canvas { position: absolute; left: 0; top: 0; }
#cvDraw { touch-action: none; }
#cvDraw.panning { cursor: grabbing; }
.stage-msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 14px; letter-spacing: .08em; color: var(--color-text-muted); pointer-events: none; text-align: center; padding: 20px; }
.legend { position: absolute; left: 10px; bottom: 10px; z-index: 3; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; max-width: calc(100% - 120px); padding: 6px 10px; background: rgba(30,35,32,.88); border: 1px solid var(--color-border); border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); pointer-events: none; }
.legend:empty { display: none; }
.lg-bar { position: relative; display: inline-block; width: 260px; height: 30px; margin: 0 10px; }
.lg-grad { position: absolute; left: 0; right: 0; top: 2px; height: 10px; border-radius: 2px; }
.lg-ticks span { position: absolute; top: 15px; transform: translateX(-50%); font-size: 12px; color: var(--color-text-primary); white-space: nowrap; }
.lg-unit, .lg-item { white-space: nowrap; }
.lg-radar { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-radar span { display: inline-flex; } .lg-radar i { width: 8px; height: 11px; }
.fc-tag { position: absolute; right: 12px; top: 10px; z-index: 3; padding: 4px 10px; border-radius: var(--radius-md); background: rgba(30,35,32,.88); border: 1px solid #C9A227; color: #E9C85B; font-family: var(--font-mono); font-size: 13px; letter-spacing: .06em; pointer-events: none; }
.sab-bar { gap: 8px; }
.t-range { flex: 1 1 200px; min-width: 100px; accent-color: var(--tool-accent); }
.t-label { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); white-space: nowrap; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.t-label em { font-style: normal; color: #E9C85B; }
.xstat { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); white-space: nowrap; }
.x-sel { font-family: var(--font-mono); font-size: 13px; padding: 5px 8px; width: auto; flex: 0 0 auto; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 2px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: transparent; color: var(--color-text-secondary); font-family: var(--font-body); font-size: 12.5px; cursor: pointer; }
.tool svg { width: 34px; height: 16px; }
.tool:hover { border-color: var(--color-border-hover); color: var(--color-text-primary); }
.tool.is-active { color: var(--color-text-primary); border-color: var(--tool-accent); background: var(--color-surface-2); box-shadow: inset 0 -2px 0 var(--tool-accent); }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.acts .cc-btn-sm { font-size: 13px; padding: 5px 10px; }
.cc-card-grp + .cc-card-eb { margin-top: 14px; }
.cc-card-grp:has(+ .cc-card-src) { border-bottom: 0; }
.hint { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.45; color: var(--color-text-muted); margin-top: 8px; min-height: 36px; }
.readout { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-family: var(--font-mono); font-size: 14px; color: var(--color-text-primary); }
.readout span { color: var(--color-text-muted); font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; align-self: center; }
.readout.empty { display: block; color: var(--color-text-muted); font-size: 13px; }
.keyrow { display: flex; align-items: center; gap: 10px; font-family: var(--font-body); font-size: 13.5px; color: var(--color-text-primary); padding: 2px 0; }
.keyrow svg { width: 46px; height: 18px; flex-shrink: 0; }
@media (max-width: 1440px) { .cc-app-title { font-size: 21px; } .cc-tab { padding: 8px 9px; font-size: 14px; } .cc-app-top { column-gap: 10px; } }
@media (max-width: 1180px) { :root { --cc-card-width: 300px; } .status #stext { display: none; } .t-label { min-width: 0; } }
@media (max-width: 760px) {
  .cc-app-top { flex-wrap: wrap; row-gap: 8px; }
  .cc-tab-bar { flex: 1 1 100%; order: 6; overflow-x: auto; } .cc-tab { flex: 1; padding: 9px 6px; font-size: 13px; white-space: nowrap; }
  .sab-bar { flex-wrap: wrap; }
  .legend { max-width: calc(100% - 20px); }
}
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">
  <div class="cc-app-top">
    <h1 class="cc-app-title">Surface Analysis Builder</h1>
    <div class="cc-tab-bar" id="bg-tabs" role="tablist"></div>
    <div class="cc-app-spacer"></div>
    <select class="cc-select sm-select" id="region" aria-label="Region"></select>
    <div class="status busy" id="status"><span class="dot"></span><span id="stext">Loading…</span></div>
  </div>
  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head sab-head">
        <div id="chips" style="display:contents"></div>
        <div class="cc-app-spacer"></div>
        <div class="zoom"><button class="cc-btn cc-btn-sm" id="zoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button><button class="cc-btn cc-btn-sm" id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button></div>
      </div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="cvField"></canvas><canvas id="cvWind"></canvas><canvas id="cvOver"></canvas><canvas id="cvDraw"></canvas>
        <div class="stage-msg" id="msg">LOADING…</div>
        <div class="fc-tag" id="fcTag" hidden></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="cc-scene-bar sab-bar">
        <button class="cc-btn cc-btn-sm" id="t-prev" title="Previous hour" aria-label="Previous hour">&#9664;</button>
        <input type="range" class="t-range" id="t-range" min="0" max="0" step="1" value="0" aria-label="Hour">
        <button class="cc-btn cc-btn-sm" id="t-next" title="Next hour" aria-label="Next hour">&#9654;</button>
        <button class="cc-btn cc-btn-sm" id="t-play">&#9654; Play</button>
        <button class="cc-btn cc-btn-sm" id="t-now">Now</button>
        <span class="t-label" id="t-label"></span>
        <div class="cc-app-spacer"></div>
        <span class="xstat" id="xstat"></span>
        <button class="cc-btn cc-btn-sm" id="x-png">&#8595; PNG</button>
        <select class="cc-select x-sel" id="x-what" aria-label="Animation"><option value="hours">Hours</option><option value="wind">Wind motion</option></select>
        <button class="cc-btn cc-btn-sm" id="x-gif">&#8595; GIF</button>
        <button class="cc-btn cc-btn-sm" id="x-mp4">&#8595; MP4</button>
      </div>
    </div>
    <div class="cc-card">
      <div class="cc-card-eb">Draw</div>
      <div class="cc-card-grp">
      <div class="tools" id="tools"></div>
      <div class="acts">
        <button class="cc-btn cc-btn-sm" id="flipBtn" disabled>Flip</button>
        <button class="cc-btn cc-btn-sm" id="delBtn" disabled>Delete</button>
        <button class="cc-btn cc-btn-sm" id="undoBtn">Undo</button>
        <button class="cc-btn cc-btn-sm" id="clearBtn">Clear</button>
      </div>
      <div class="hint" id="hint"></div>
      <div class="acts">
        <button class="cc-btn cc-btn-sm" id="saveBtn">Save map</button>
        <button class="cc-btn cc-btn-sm" id="loadBtn">Open map</button>
        <input type="file" id="loadInput" accept=".json,application/json" hidden>
      </div>
      </div>
      <div class="cc-card-eb">At the cursor</div>
      <div class="cc-card-grp"><div class="readout empty" id="readout">Point at the map.</div></div>
      <div class="cc-card-eb">Key</div>
      <div class="cc-card-grp" id="key"></div>
      <div class="cc-card-src" id="src"></div>
    </div>
  </div>
</div>

<script src="map-base.js"></script>
<script src="map-regions.js"></script>
<script src="station-model.js"></script>
<script src="field-analysis.js"></script>
<script src="station-roster.js"></script>
<script src="surface-obs.js"></script>
<script>
'use strict';
const SM = STATION_MODEL, F = FIELD, OBS = SURFACE_OBS, HOUR = 3600e3, KT = 1.15078, MPS_MPH = 2.23694;
const $ = id => document.getElementById(id);
const setText = (id, s) => { const e = $(id); if (e) e.textContent = s; };
const escH = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const MONO = '"Courier Prime", monospace', SERIF = '"Zilla Slab", serif', SANS = '"Public Sans", sans-serif';
const CREAM = '#E8E4D9', C_SEC = '#B9B4A7', C_MUTE = '#948F82', C_ACC = '#2AA87E';
const SURF = '#262B27', LAND = '#323a34', HALO = '#161A17';
const DATA = new URLSearchParams(location.search).get('data') || 'https://josht3113.github.io/contextclimate-surface-data/';
const STORAGE_KEY = 'cc-surface-analysis-v3', FILE_FORMAT = 'contextclimate-surface-analysis';

Object.assign(SM.COLORS, { ink: '#E8E4D9', temp: '#F07E6E', dew: '#5CC98A', id: '#948F82', halo: '#262B27', disc: '#262B27', thinned: 'rgba(232,228,217,.45)', ghost: 'rgba(232,228,217,.25)' });
Object.assign(SM.WX_COLORS, { rain: '#4CC07A', snow: '#86B8F2', mix: '#B79AEB', ice: '#EE8FC8', thunder: '#F2645A', obscur: '#A8B0B6', dust: '#D19A5E', other: '#E8E4D9' });

// ═══════════════════════════════════════════════════
// COLOUR SCALES — monthly heatmap suite; SLP heatmap; tendency from the SLP palette
// ═══════════════════════════════════════════════════
const SCALES = {
  temp: { vals: [-60,-40,-20,-5,25,50,75,102,113,119,130], cols: ['#2A0440','#7C18C0','#D42070','#FFB3C6','#A8D4F0','#5DBF6A','#FFE033','#D41A1A','#FF5555','#FFFFFF','#FFC0D0'] },
  td:   { vals: [-25,5,18,30,55,68,80], cols: ['#4A3410','#B89870','#D4C060','#FFEE00','#3DB84A','#2A8C30','#2A72C8'] },
  wind: { vals: [0,5,10,15,20,25,30,55], cols: ['#232323','#545E6B','#7D9BB5','#B4C8E3','#CEB8CC','#E09999','#E3625C','#FFE033'] },
  slp:  { vals: [960,985,1000,1013,1025,1040], cols: ['#1C0848','#301E9B','#2669BE','#94A2B2','#CD962D','#F5AA00'] },
  tend: { vals: [-6,-3,-1.5,-.5,0,.5,1.5,3,6], cols: ['#5A3CC8','#3F55C8','#3A80C4','#7C96B4','#94A2B2','#B8A27A','#CD962D','#E3A010','#F5AA00'] },
  refc: { vals: [5,10,15,20,25,30,35,40,45,50,55,60,65,70], cols: ['#04e9e7','#019ff4','#0300f4','#02fd02','#01c501','#008e00','#fdf802','#e5bc00','#fd9500','#fd0000','#d40000','#bc0000','#f800fd','#9854c6'] },
};
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function colorRGB(v, sc) {
  const { vals, cols } = sc;
  if (v <= vals[0]) return hexRGB(cols[0]);
  if (v >= vals[vals.length - 1]) return hexRGB(cols[cols.length - 1]);
  for (let i = 0; i < vals.length - 1; i++) if (v <= vals[i + 1]) { const t = (v - vals[i]) / (vals[i + 1] - vals[i]), A = hexRGB(cols[i]), B = hexRGB(cols[i + 1]); return [0, 1, 2].map(j => Math.round(A[j] + (B[j] - A[j]) * t)); }
  return hexRGB(cols[0]);
}
const rgbStr = c => `rgb(${c[0]},${c[1]},${c[2]})`;
// 256-entry lookup per background over its display range
function lut(sc, lo, hi) { const t = new Uint8ClampedArray(256 * 3); for (let i = 0; i < 256; i++) { const c = colorRGB(lo + (hi - lo) * i / 255, sc); t[i * 3] = c[0]; t[i * 3 + 1] = c[1]; t[i * 3 + 2] = c[2]; } return t; }

const BGS = {
  temp: { label: 'Temperature', unit: '°F', sc: SCALES.temp, lo: -40, hi: 115, ticks: 10 },
  dew:  { label: 'Dewpoint', unit: '°F', sc: SCALES.td, lo: -30, hi: 80, ticks: 10 },
  pres: { label: 'Pressure', unit: 'mb', sc: SCALES.slp, lo: 965, hi: 1045, ticks: 8 },
  wind: { label: 'Wind Speed', unit: 'mph', sc: SCALES.wind, lo: 0, hi: 55, ticks: 5 },
  tend: { label: '3-h Pressure Change', unit: 'mb in 3 h', sc: SCALES.tend, lo: -6, hi: 6, ticks: 1, sign: true },
  none: { label: 'None' },
};
const BG_ORDER = ['temp', 'dew', 'pres', 'wind', 'tend', 'none'];
for (const k of BG_ORDER) if (BGS[k].sc) BGS[k].lut = lut(BGS[k].sc, BGS[k].lo, BGS[k].hi);
const CHIPS = [
  ['wind', 'Wind motion'], ['isobars', 'Isobars'], ['stations', 'Stations'], ['radar', 'Radar'], ['nws', 'NWS fronts'], ['grad', 'Temp gradient'],
];

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
const S = {
  region: 'conus', bg: 'temp', layers: { wind: true, isobars: true, stations: false, radar: false, nws: false, grad: false },
  view: null, man: null, times: [], ti: 0, frames: new Map(), bulletins: [], obs: null, obsKey: '',
  state: 'loading', playT: null, exporting: false, base: {}, baseVal: {}, G: null, cursor: null,
};

// ═══════════════════════════════════════════════════
// DATA — gridded HRRR frames from contextclimate-surface-data
// ═══════════════════════════════════════════════════
async function loadManifest() {
  const r = await fetch(DATA + 'manifest.json', { cache: 'no-cache' });
  if (!r.ok) throw new Error('manifest ' + r.status);
  const m = await r.json();
  const parse = k => Date.UTC(+k.slice(0, 4), +k.slice(4, 6) - 1, +k.slice(6, 8), +k.slice(8, 10));
  const times = m.analyses.map(k => ({ t: parse(k), kind: 'a', url: `a/${k}.bin.gz` }));
  const lastA = times.length ? times[times.length - 1].t : 0;
  if (m.forecast) {
    const c = parse(m.forecast.cycle);
    for (const h of m.forecast.hours) { const t = c + h * HOUR; if (t > lastA) times.push({ t, kind: 'f', fh: h, cycle: c, url: `f/${m.forecast.cycle}/${String(h).padStart(2, '0')}.bin.gz` }); }
  }
  times.sort((a, b) => a.t - b.t);
  S.man = m; S.times = times;
  if (m.terrain && !S.terrain) S.terrainP = fetch(DATA + m.terrain.url).then(r => r.ok ? r.arrayBuffer() : null).then(b => b && gunzip(b)).then(raw => {
    if (!raw) return null; const n = raw.length / 2, z = new Float32Array(n);
    for (let j = 0; j < n; j++) { const q = (raw[j] | (raw[n + j] << 8)) << 16 >> 16; z[j] = q === m.missing ? NaN : q * m.terrain.scale + m.terrain.offset; }
    S.terrain = z; if (S.layers.grad) { renderField(); renderLegend(); } return z;
  }).catch(() => null);
  const ai = times.map(x => x.kind).lastIndexOf('a');
  S.ti = ai >= 0 ? ai : 0; S.nowIndex = S.ti;
  if (m.fronts) fetch(DATA + m.fronts, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).then(j => { if (j) { S.bulletins = j.bulletins || []; renderOver(); renderKey(); } }).catch(() => {});
}
async function gunzip(buf) {
  const ds = new DecompressionStream('gzip');
  return new Uint8Array(await new Response(new Blob([buf]).stream().pipeThrough(ds)).arrayBuffer());
}
function getFrame(i) {
  const T = S.times[i]; if (!T) return Promise.resolve(null);
  if (S.frames.has(T.url)) return S.frames.get(T.url);
  const p = fetch(DATA + T.url).then(r => { if (!r.ok) throw new Error(T.url + ' ' + r.status); return r.arrayBuffer(); }).then(gunzip).then(raw => {
    const g = S.man.grid, n = g.nx * g.ny, nv = S.man.vars.length, half = raw.length / 2;
    const out = { nx: g.nx, ny: g.ny };
    S.man.vars.forEach((v, k) => {
      const a = new Float32Array(n);
      for (let j = 0; j < n; j++) {
        const o = k * n + j, q = (raw[o] | (raw[half + o] << 8)) << 16 >> 16;
        a[j] = q === S.man.missing ? NaN : q * v.scale + v.offset;
      }
      out[v.name] = a;
    });
    return out;
  });
  S.frames.set(T.url, p);
  p.catch(() => S.frames.delete(T.url));
  if (S.frames.size > 16) S.frames.delete(S.frames.keys().next().value);
  return p;
}
// NaN-aware smoothing on the data grid (three box passes ≈ Gaussian); cached on the frame.
function smoothed(fr, name, r) {
  const key = name + r; fr._s = fr._s || {}; if (fr._s[key]) return key;
  const { nx, ny } = fr, src = fr[name], n = nx * ny;
  let v = new Float32Array(n), w = new Float32Array(n);
  for (let k = 0; k < n; k++) { const ok = src[k] === src[k]; v[k] = ok ? src[k] : 0; w[k] = ok ? 1 : 0; }
  const tv = new Float32Array(n), tw = new Float32Array(n);
  const pass = (a, b, along) => {           // box filter along x (along=1) or y
    const L = along ? nx : ny, M = along ? ny : nx, st = along ? 1 : nx, ln = along ? nx : 1;
    for (let m = 0; m < M; m++) {
      const o = m * ln; let acc = 0;
      for (let i = -r; i <= r; i++) acc += a[o + clamp(i, 0, L - 1) * st];
      for (let i = 0; i < L; i++) { b[o + i * st] = acc / (2 * r + 1); acc += a[o + Math.min(i + r + 1, L - 1) * st] - a[o + Math.max(i - r, 0) * st]; }
    }
  };
  for (let p = 0; p < 3; p++) { pass(v, tv, 1); pass(tv, v, 0); pass(w, tw, 1); pass(tw, w, 0); }
  const out = new Float32Array(n);
  for (let k = 0; k < n; k++) out[k] = src[k] === src[k] && w[k] > .3 ? v[k] / w[k] : NaN;
  fr[key] = out; fr._s[key] = true; return key;
}
function prevIndex(i, hours) { const t = S.times[i].t - hours * HOUR; return S.times.findIndex(x => x.t === t); }
// Bilinear sample of a grid variable at lon/lat (NaN outside the data).
function gsample(fr, name, lon, lat) {
  const g = S.man.grid, x = (lon - g.west) / g.res, y = (lat - g.south) / g.res;
  const i = Math.floor(x), j = Math.floor(y);
  if (i < 0 || j < 0 || i >= g.nx - 1 || j >= g.ny - 1) return NaN;
  const a = fr[name], k = j * g.nx + i, tx = x - i, ty = y - j;
  return (a[k] * (1 - tx) + a[k + 1] * tx) * (1 - ty) + (a[k + g.nx] * (1 - tx) + a[k + g.nx + 1] * tx) * ty;
}
function bgValue(fr, prev, lon, lat) {
  switch (S.bg) {
    case 'temp': return gsample(fr, 't', lon, lat);
    case 'dew': return gsample(fr, 'td', lon, lat);
    case 'pres': return gsample(fr, 'p', lon, lat);
    case 'wind': return Math.hypot(gsample(fr, 'u', lon, lat), gsample(fr, 'v', lon, lat)) * MPS_MPH;
    case 'tend': return prev ? gsample(fr, fr._tp, lon, lat) - gsample(prev, prev._tp, lon, lat) : NaN;
  }
  return NaN;
}

// ═══════════════════════════════════════════════════
// VIEW — region box fitted to the canvas, then zoom / pan
// ═══════════════════════════════════════════════════
function regionView(key) { const B = MAP_REGIONS[key].bounds; return { lon: (B.west + B.east) / 2, lat: (B.south + B.north) / 2, lonR: B.east - B.west, latR: B.north - B.south }; }
function geom(W, H) {

}

// ── MP4: WebCodecs H.264 → hand-built MP4 (frame-exact, faster than real time) ──
function splitAnnexB(u8) {
  const nals = [], n = u8.length;
  let i = 0, start = -1;
  while (i + 2 < n) {
    if (u8[i] === 0 && u8[i + 1] === 0 && (u8[i + 2] === 1 || (u8[i + 2] === 0 && i + 3 < n && u8[i + 3] === 1))) {
      if (start >= 0) nals.push(u8.subarray(start, i));
      i += u8[i + 2] === 1 ? 3 : 4; start = i;
    } else i++;
  }
  if (start >= 0) nals.push(u8.subarray(start));
  return nals.map(x => { let e = x.length; while (e > 1 && x[e - 1] === 0) e--; return x.subarray(0, e); });
}
// True when 4-byte big-endian NAL lengths tile the buffer exactly (AVCC). Checking
// the first bytes for 00 00 01 is not enough: a 256–511-byte NAL's length prefix
// is 00 00 01 xx.
function isAvccFramed(u8) {
  let o = 0;
  while (o + 4 <= u8.length) {
    const n = u8[o] * 16777216 + (u8[o + 1] << 16) + (u8[o + 2] << 8) + u8[o + 3];
    if (n === 0 || o + 4 + n > u8.length) return false;
    o += 4 + n;
  }
  return o === u8.length;
}
function avcCFrom(sps, pps) {

  out.set([1, sps[1], sps[2], sps[3], 0xFF, 0xE1, sps.length >> 8, sps.length & 255], 0);
  out.set(sps, 8);
  const o = 8 + sps.length;
  out.set([1, pps.length >> 8, pps.length & 255], o);
  out.set(pps, o + 3);
  return out;
}
function nalsToAvcc(nals) {                      // 4-byte length prefixes; parameter sets live in avcC
  const keep = nals.filter(x => { const t = x[0] & 31; return t !== 7 && t !== 8 && t !== 9; });
  const out = new Uint8Array(keep.reduce((s, x) => s + 4 + x.length, 0));
  let o = 0;
  for (const x of keep) { out.set([x.length >>> 24, (x.length >> 16) & 255, (x.length >> 8) & 255, x.length & 255], o); out.set(x, o + 4); o += 4 + x.length; }
  return out;
}

// samples: [{data, cts, key}] in decode order (cts in timescale units); returns Blob parts.
function muxMp4({ width, height, timescale, frameDur, samples, avcC }) {

    let len = 8; for (const p of parts) len += p.length;

    out.set(u32(len), 0); out.set(str(type), 4);
    let o = 8; for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  };
  const full = (type, v, flags, ...parts) => box(type, [v, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255], ...parts);
  const n = samples.length;

  const dts = cts.slice().sort((a, b) => a - b);

  const offs = cts.map((c, i) => c - dts[i]);
  const mediaDur = dts[n - 1] - dts[0] + dur[n - 1];
  const movieDur = Math.round(mediaDur * 1000 / timescale);
  const matrix = [...u32(0x00010000), ...u32(0), ...u32(0), ...u32(0), ...u32(0x00010000), ...u32(0), ...u32(0), ...u32(0), ...u32(0x40000000)];
  const runs = (arr) => { const r = []; for (const v of arr) { if (r.length && r[r.length - 1][1] === v) r[r.length - 1][0]++; else r.push([1, v]); } return r; };

  const sttsR = runs(dur), cttsR = runs(offs);
  const keys = []; samples.forEach((s, i) => { if (s.key) keys.push(i + 1); });
  const dataLen = samples.reduce((s, x) => s + x.data.length, 0);

  const ftyp = box('ftyp', str('isom'), u32(512), str('isom'), str('iso2'), str('avc1'), str('mp41'));
  const moovWith = (chunkOffset) => {
    const stsd = full('stsd', 0, 0, u32(1), box('avc1',
      zeros(6), u16(1), zeros(16), u16(width), u16(height), u32(0x00480000), u32(0x00480000), u32(0), u16(1),
      zeros(32), u16(0x18), u16(0xFFFF), box('avcC', avcC)));
    const stts = full('stts', 0, 0, u32(sttsR.length), sttsR.flatMap(([c, d]) => [...u32(c), ...u32(d)]));

      ? full('ctts', 1, 0, u32(cttsR.length), cttsR.flatMap(([c, d]) => [...u32(c), ...u32(d >>> 0)])) : null;
    const stss = full('stss', 0, 0, u32(keys.length), keys.flatMap(u32));
    const stsc = full('stsc', 0, 0, u32(1), u32(1), u32(n), u32(1));
    const szs = new Uint8Array(4 * n); samples.forEach((s, i) => szs.set(u32(s.data.length), 4 * i));
    const stsz = full('stsz', 0, 0, u32(0), u32(n), szs);
    const stco = full('stco', 0, 0, u32(1), u32(chunkOffset));
    const stbl = box('stbl', stsd, stts, ...(ctts ? [ctts] : []), stss, stsc, stsz, stco);
    const minf = box('minf', full('vmhd', 0, 1, zeros(8)), box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))), stbl);
    const mdia = box('mdia',
      full('mdhd', 0, 0, u32(0), u32(0), u32(timescale), u32(mediaDur), u16(0x55C4), u16(0)),
      full('hdlr', 0, 0, u32(0), str('vide'), zeros(12), [...str('VideoHandler'), 0]),
      minf);
    const tkhd = full('tkhd', 0, 3, u32(0), u32(0), u32(1), u32(0), u32(movieDur), zeros(8), u16(0), u16(0), u16(0), u16(0),
      matrix, u32(width * 65536), u32(height * 65536));
    const mvhd = full('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(movieDur), u32(0x00010000), u16(0x0100), zeros(10),
      matrix, zeros(24), u32(2));
    return box('moov', mvhd, box('trak', tkhd, mdia));
  };
  const probe = moovWith(0);
  const moov = moovWith(ftyp.length + probe.length + 8);
  const mdatHdr = new Uint8Array([...u32(8 + dataLen), ...str('mdat')]);
  return [ftyp, moov, mdatHdr, ...samples.map(s => s.data)];
}

async function pickAvcConfig(width, height) {
  if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') return null;
  for (const codec of AVC_CODECS) {
    const cfg = { codec, width, height, bitrate: VIDEO_BITRATE, bitrateMode: 'variable', framerate: VIDEO_FPS, avc: { format: 'avc' } };
    try { if ((await VideoEncoder.isConfigSupported(cfg)).supported) return cfg; } catch (e) { /* try next */ }
  }
  return null;
}
function recorderMime() {
  if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return null;
  return VIDEO_MIMES.find(m => MediaRecorder.isTypeSupported(m)) || null;
}
const videoDims = anim => [Math.round(anim.W * VIDEO_SCALE / 2) * 2, Math.round(anim.H * VIDEO_SCALE / 2) * 2];

async function encodeMp4(anim, cfg, fps, job, onProgress) {
  const [W, H] = [cfg.width, cfg.height], N = anim.frames;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const out = []; let desc = null, encErr = null;
  const enc = new VideoEncoder({
    output: (chunk, meta) => {
      const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b);
      out.push({ data: b, ts: chunk.timestamp, key: chunk.type === 'key' });
      const d = meta && meta.decoderConfig && meta.decoderConfig.description;
      if (d && !desc) desc = d instanceof ArrayBuffer ? new Uint8Array(d.slice(0)) : new Uint8Array(d.buffer.slice(d.byteOffset, d.byteOffset + d.byteLength));
    },
    error: e => { encErr = e; },
  });
  enc.configure(cfg);
  const rep = Math.round(VIDEO_FPS / fps), hold = HOLD_S * VIDEO_FPS, total = N * rep + hold, us = 1e6 / VIDEO_FPS;
  let idx = 0;
  const push = async () => {
    const vf = new VideoFrame(cv, { timestamp: Math.round(idx * us), duration: Math.round(us), alpha: 'discard' });
    enc.encode(vf, { keyFrame: idx % (VIDEO_FPS * 2) === 0 });
    vf.close(); idx++;
    while (enc.encodeQueueSize > 6 && !encErr) {
      await new Promise(r => { enc.addEventListener('dequeue', r, { once: true }); setTimeout(r, 40); });
    }
    if (encErr) throw encErr;
  };
  try {
    for (let k = 0; k < N; k++) {
      if (job.cancelled) throw new ExportCancelled();
      const fr = await anim.prepare(k);
      ctx.setTransform(W / anim.W, 0, 0, H / anim.H, 0, 0);
      anim.draw(ctx, fr, k, W / anim.W);
      for (let r = 0; r < rep; r++) await push();
      onProgress(idx / total);
    }
    for (let r = 0; r < hold; r++) await push();
    await enc.flush();
    if (encErr) throw encErr;
  } finally {
    if (enc.state !== 'closed') enc.close();
  }
  // With a description the chunks are AVCC by spec; without one they are Annex B
  // → build avcC from SPS/PPS and length-prefix the samples.
  if (!desc) {
    let sps = null, pps = null;
    for (const s of out) {
      if (isAvccFramed(s.data)) continue;
      const nals = splitAnnexB(s.data);
      for (const x of nals) { const t = x[0] & 31; if (t === 7 && !sps) sps = x; if (t === 8 && !pps) pps = x; }
      s.data = nalsToAvcc(nals);
    }
    if (!sps || !pps) throw new Error('encoder produced no SPS/PPS');
    desc = avcCFrom(sps, pps);
  }
  const TS = 90000, frameDur = TS / VIDEO_FPS;
  const parts = muxMp4({
    width: W, height: H, timescale: TS, frameDur, avcC: desc,
    samples: out.map(s => ({ data: s.data, key: s.key, cts: Math.round(s.ts * TS / 1e6) })),
  });
  return new Blob(parts, { type: 'video/mp4' });
}

// Fallback: real-time MediaRecorder capture. Next frame is composed on a back
// canvas while the current one is on screen, then blitted at its due time.
async function recordVideo(anim, mime, fps, job, onProgress) {
  const [W, H] = videoDims(anim), N = anim.frames;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  const back = document.createElement('canvas'); back.width = W; back.height = H;
  const bctx = back.getContext('2d');
  const paintBack = async k => {
    bctx.setTransform(W / anim.W, 0, 0, H / anim.H, 0, 0);
    anim.draw(bctx, await anim.prepare(k), k, W / anim.W);
  };
  const stream = cv.captureStream(0), track = stream.getVideoTracks()[0];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6e6 }), chunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res, rej) => { rec.onstop = res; rec.onerror = e => rej(e.error || e); });
  const frameMs = 1000 / fps, total = N * frameMs + HOLD_S * 1000;
  const blit = () => { ctx.drawImage(back, 0, 0); if (track.requestFrame) track.requestFrame(); };
  const sleepUntil = t => new Promise(r => setTimeout(r, Math.max(0, t - performance.now())));
  await paintBack(0);
  rec.start(250);
  const t0 = performance.now();
  try {
    for (let k = 0; k < N; k++) {
      if (job.cancelled) throw new ExportCancelled();
      await sleepUntil(t0 + k * frameMs);
      blit();
      if (k + 1 < N) await paintBack(k + 1);
      onProgress((performance.now() - t0) / total);
    }
    const end = t0 + total;
    while (performance.now() < end) {              // keep repainting through the hold
      if (job.cancelled) throw new ExportCancelled();
      blit(); onProgress((performance.now() - t0) / total);
      await sleepUntil(Math.min(end, performance.now() + 1000 / 30));
    }
  } finally {
    if (rec.state !== 'inactive') rec.stop();
  }
  await stopped;
  const type = mime.split(';')[0], blob = new Blob(chunks, { type });
  if (type === 'video/mp4') return { blob, ext: 'mp4' };
  return { blob: await fixWebmDuration(blob, total), ext: 'webm' };
}

// MediaRecorder WebM files carry no Duration; insert one into Segment › Info.
function fixWebmDuration(blob, durationMs) {
  return blob.slice(0, Math.min(blob.size, 65536)).arrayBuffer().then(buf => {
    const b = new Uint8Array(buf);
    const vint = (pos, keepMarker) => {
      const first = b[pos]; let len = 1, mask = 0x80;
      while (len <= 8 && !(first & mask)) { len++; mask >>= 1; }
      if (len > 8) throw new Error('bad vint');
      let val = keepMarker ? first : first & (mask - 1);
      for (let i = 1; i < len; i++) val = val * 256 + b[pos + i];
      return { len, val };
    };
    let pos = 0, id = vint(pos, true);
    if (id.val !== 0x1A45DFA3) throw new Error('not EBML');
    let sz = vint(pos + id.len, false); pos += id.len + sz.len + sz.val;
    id = vint(pos, true); if (id.val !== 0x18538067) throw new Error('no Segment');
    sz = vint(pos + id.len, false); pos += id.len + sz.len;
    for (let guard = 0; guard < 16 && pos < b.length - 8; guard++) {
      id = vint(pos, true); sz = vint(pos + id.len, false);
      const dataStart = pos + id.len + sz.len;
      if (id.val === 0x1549A966) {
        let q = dataStart; const end = dataStart + sz.val;
        while (q < end) { const cid = vint(q, true), csz = vint(q + cid.len, false); if (cid.val === 0x4489) return blob; q += cid.len + csz.len + csz.val; }
        const dur = new Uint8Array(11); dur[0] = 0x44; dur[1] = 0x89; dur[2] = 0x88;
        new DataView(dur.buffer).setFloat64(3, durationMs);
        const sizeBytes = new Uint8Array(8); sizeBytes[0] = 0x01;
        for (let i = 7, v = sz.val + 11; i >= 1; i--) { sizeBytes[i] = v & 255; v = Math.floor(v / 256); }
        const head = new Uint8Array(buf, 0, pos + id.len), body = new Uint8Array(buf, dataStart, sz.val);
        return new Blob([head, sizeBytes, body, dur, blob.slice(end)], { type: blob.type });
      }
      pos = dataStart + sz.val;
    }
    return blob;
  }).catch(() => blob);
}

function syncURL() {
  const p = new URLSearchParams(location.search);
  p.set('region', S.region); p.set('bg', S.bg); p.set('layers', Object.keys(S.layers).filter(k => S.layers[k]).join(','));
  history.replaceState(null, '', location.pathname + '?' + p.toString());
}
const TOOL_ICONS = {
  select: '<svg viewBox="0 0 34 16"><path d="M13 2 L13 14 L16 11 L18.5 15 L20 14.2 L17.6 10.4 L21.5 10 Z" fill="currentColor"/></svg>',
  H: '<svg viewBox="0 0 34 16"><text x="17" y="14" text-anchor="middle" font-family="Public Sans" font-weight="800" font-size="16" fill="#4C8DF0">H</text></svg>',
  L: '<svg viewBox="0 0 34 16"><text x="17" y="14" text-anchor="middle" font-family="Public Sans" font-weight="800" font-size="16" fill="#F05548">L</text></svg>',
};
function toolIcon(t) { return TOOL_ICONS[t] || frontIcon(t).replace('width="46" height="18"', 'width="34" height="16"'); }
async function init() {
  const p = new URLSearchParams(location.search);
  if (MAP_REGIONS[p.get('region')]) S.region = p.get('region');
  if (BGS[p.get('bg')]) S.bg = p.get('bg');
  if (p.has('layers')) { const on = new Set(p.get('layers').split(',')); for (const k of Object.keys(S.layers)) S.layers[k] = on.has(k); }
  S.view = regionView(S.region);
  $('bg-tabs').innerHTML = BG_ORDER.map(k => `<button class="cc-tab" role="tab" data-bg="${k}">${BGS[k].label}</button>`).join('');
  $('chips').innerHTML = CHIPS.map(([k, l]) => `<button class="pchip" data-k="${k}">${l}</button>`).join('');
  $('region').innerHTML = ['conus', 'tristate', 'northeast', 'southeast', 'midwest', 'northernplains', 'southernplains', 'mountainwest', 'southwest', 'pacificnw', 'california'].map(k => `<option value="${k}">${k === 'conus' ? 'National' : MAP_REGIONS[k].label}</option>`).join('');
  $('region').value = S.region;
  $('tools').innerHTML = [['select', 'Select'], ['cold', 'Cold'], ['warm', 'Warm'], ['stationary', 'Stationary'], ['occluded', 'Occluded'], ['trough', 'Trough'], ['H', 'High'], ['L', 'Low']]
    .map(([t, l]) => `<button class="tool" data-t="${t}">${toolIcon(t)}${l}</button>`).join('');
  $('bg-tabs').addEventListener('click', e => { const b = e.target.closest('.cc-tab'); if (!b) return; S.bg = b.dataset.bg; renderAll(); });
  $('chips').addEventListener('click', e => { const b = e.target.closest('.pchip'); if (!b || b.disabled) return; S.layers[b.dataset.k] = !S.layers[b.dataset.k]; if (b.dataset.k === 'wind' || b.dataset.k === 'radar' || b.dataset.k === 'grad') renderAll(); else { renderOver(); renderLegend(); renderKey(); } });
  $('region').addEventListener('change', e => { S.region = e.target.value; S.view = regionView(S.region); S.obs = null; S.obsKey = ''; renderAll(); });
  $('tools').addEventListener('click', e => { const b = e.target.closest('.tool'); if (b) setTool(b.dataset.t); });
  $('flipBtn').addEventListener('click', () => { if (selected && selected.kind === 'front') { pushUndo(); selected.obj.side = -(selected.obj.side || 1); afterEdit(); } });
  $('delBtn').addEventListener('click', deleteSelected);
  $('undoBtn').addEventListener('click', undo);
  $('clearBtn').addEventListener('click', () => { if (!analysis.centers.length && !analysis.fronts.length) return; if (!confirm('Clear everything you have drawn?')) return; pushUndo(); analysis = { centers: [], fronts: [] }; selected = null; afterEdit(); });
  $('saveBtn').addEventListener('click', saveMap);
  $('loadBtn').addEventListener('click', () => $('loadInput').click());
  $('loadInput').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) openMap(f); });
  $('zoomIn').addEventListener('click', () => { const [W, H] = stageSize(); zoomAt(W / 2, H / 2, 1.5); });
  $('zoomOut').addEventListener('click', () => { const [W, H] = stageSize(); zoomAt(W / 2, H / 2, 1 / 1.5); });
  $('t-range').addEventListener('input', e => { stop(); setTime(+e.target.value); });
  $('t-prev').addEventListener('click', () => { stop(); setTime(S.ti - 1); });
  $('t-next').addEventListener('click', () => { stop(); setTime(S.ti + 1); });
  $('t-now').addEventListener('click', () => { stop(); setTime(S.nowIndex); });
  $('t-play').addEventListener('click', play);
  $('x-png').addEventListener('click', exportPNG);
  $('x-gif').addEventListener('click', () => exportAnim('gif'));
  $('x-mp4').addEventListener('click', () => exportAnim('mp4'));

  let key = '';
  new ResizeObserver(() => { const [W, H] = stageSize(), k = W + 'x' + H; if (k !== key && W) { key = k; renderAll(true); } }).observe($('stage'));
  if (SM.ready) SM.ready().then(() => renderOver()).catch(() => {});

    await loadManifest(); S.state = 'ready';

  } catch (e) { console.error('Surface data:', e); S.state = 'error'; status('err', 'Gridded data unavailable'); }

    if (S.exporting || S.playT) return;
    const at = S.ti === S.nowIndex, t = S.times[S.ti] && S.times[S.ti].t;
