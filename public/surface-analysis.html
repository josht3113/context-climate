<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Analysis Builder</title>
<link rel="stylesheet" href="core-sample-tools.css">
<!-- Station-plot content font (condensed numerals keep station models compact) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&display=swap">
<style>
:root {
  --tool-accent: var(--accent-live);
  --click-text: #F2EEE3;
}
[hidden] { display: none !important; }
body { padding: 28px 20px 48px; }
.wrap { max-width: 1240px; margin: 0 auto; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.head .cc-title { margin: 4px 0 0; }
.status { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tool-accent); box-shadow: 0 0 0 3px rgba(42,168,126,0.18); }
.status.err .dot { background: #E5534B; box-shadow: 0 0 0 3px rgba(229,83,75,0.18); }

.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.bar .lbl { min-width: 52px; }
.bar { gap: 6px; }
.bar .spacer { flex: 1; }
.bar .sep { width: 1px; height: 26px; background: var(--color-border); margin: 0 4px; }

/* Layer chips: click to toggle, caret for options */
.chip { display: inline-flex; align-items: stretch; border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); }
.chip button { background: none; border: 0; color: var(--color-text-secondary); font-family: var(--font-body); font-size: 14px; font-weight: 600; cursor: pointer; }
.chip .tg { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; }
.chip .tg .sw { width: 12px; height: 12px; border-radius: 3px; opacity: .45; }
.chip .opt { padding: 0 7px; border-left: 1px solid var(--color-border); font-size: 12px; }
.chip.on { border-color: var(--tool-accent); background: var(--color-surface-2); }
.chip.on .tg { color: var(--click-text); }
.chip.on .tg .sw { opacity: 1; }
.chip button:hover { color: var(--click-text); }
.chip button:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: -2px; }

.tool { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  color: var(--color-text-secondary); font-family: var(--font-body); font-size: 14px; font-weight: 600;
  padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.tool:hover { color: var(--click-text); border-color: var(--color-border-hover); }
.tool.is-active { color: var(--click-text); border-color: var(--tool-accent); background: var(--color-surface-2); box-shadow: inset 0 -2px 0 var(--tool-accent); }
.tool:disabled { opacity: .4; cursor: default; }
.tool svg { display: block; }
.cc-select { font-size: 14px; }

.pop { position: absolute; z-index: 50; background: var(--color-surface); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-lg); padding: 12px; box-shadow: 0 12px 28px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 10px; }
.pop .row { display: flex; align-items: center; gap: 10px; }
.pop .row .cc-btn-row-label { min-width: 70px; }
.cc-segmented-btn { font-size: 12px; padding: 7px 12px; }
.cc-segmented-btn.is-active { color: var(--click-text); }

.hint { min-height: 34px; margin: 2px 0 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); display: flex; gap: 12px; align-items: center; }
.hint button { font-size: 13px; padding: 4px 10px; }

.map-frame { position: relative; max-width: 1202px; margin: 0 auto; background: #d6e0e7; overflow: hidden; user-select: none; }
.map-frame canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.map-frame canvas#cvBase { position: relative; display: block; height: auto; }
.map-frame .stack { position: relative; }
#cvDraw { cursor: crosshair; }
#cvDraw.pan { cursor: grab; }
#cvDraw.panning { cursor: grabbing; }
.ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(30,35,32,0.55); color: var(--color-text-primary); font-family: var(--font-mono); font-size: 14px;
  letter-spacing: .06em; pointer-events: none; z-index: 5; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 6; }
.zoom button { width: 34px; height: 34px; border-radius: var(--radius-md); border: 1px solid rgba(27,31,36,.25);
  background: rgba(247,246,242,.94); color: #1b1f24; font-size: 18px; font-weight: 700; cursor: pointer; }
.zoom button:hover { background: #fff; }

/* Selection controls and panels float over the map */
.float { position: absolute; z-index: 8; background: var(--color-surface); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-lg); padding: 8px; box-shadow: 0 10px 24px rgba(0,0,0,.4); display: flex; gap: 6px; align-items: center; }
.float input[type=text], .float input[type=number], .float select { background: var(--color-bg); color: var(--click-text);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-family: var(--font-body); font-size: 14px; padding: 5px 7px; }
.float input[type=color] { width: 32px; height: 30px; border: 1px solid var(--color-border); background: none; padding: 0; }
.float .cc-btn { font-size: 13px; padding: 5px 10px; }
#labelPanel { flex-direction: column; align-items: stretch; width: 290px; }
#labelPanel .row { display: flex; gap: 6px; align-items: center; }
#labelPanel #lblText { flex: 1; }
.wxbtn { font-family: 'CCWxSymbols'; font-size: 20px; width: 34px; height: 32px; background: var(--color-bg);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); color: var(--click-text); cursor: pointer; }
.cc-btn.is-active { color: var(--click-text); border-color: var(--tool-accent); }

.legend { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.cc-legend-chip { font-size: 13px; }
.lg-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.lg-line { width: 22px; height: 0; border-top: 2px solid; flex-shrink: 0; }
.lg-gradient { width: 110px; height: 10px; border-radius: 2px; border: 1px solid var(--color-border); }
.lg-credits { font-size: 12px; color: var(--color-text-muted); text-align: center; line-height: 1.5; }

#tip { position: fixed; display: none; pointer-events: none; z-index: 200; background: var(--color-surface);
  border: 1px solid var(--color-border-hover); border-radius: var(--radius-lg); padding: 10px 12px; min-width: 200px;
  font-size: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.45); }
#tip .tip-id { font-family: var(--font-display); font-weight: 700; font-size: 17px; margin-bottom: 4px; }
#tip .tip-id span { font-family: var(--font-mono); font-weight: 400; font-size: 13px; color: var(--tool-accent); margin-right: 6px; }
#tip .tip-row { display: flex; justify-content: space-between; gap: 14px; line-height: 1.65; }
#tip .tip-lbl { color: var(--color-text-muted); white-space: nowrap; }
#tip .tip-raw { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--color-border); font-family: var(--font-mono);
  font-size: 12px; color: var(--color-text-secondary); max-width: 360px; word-break: break-word; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <div class="cc-eyebrow">Live · Surface analysis · ASOS / AWOS observations</div>
      <h1 class="cc-title">Surface Analysis Builder</h1>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="stext">Loading…</span></div>
  </div>

  <!-- LAYERS -->
  <div class="bar" id="layerBar">
    <span class="cc-btn-row-label lbl">Layers</span>
    <!-- chips are built by script from LAYERS -->
    <span class="spacer"></span>
    <select class="cc-select" id="regionSel" aria-label="Jump to region"></select>
  </div>

  <!-- DRAW -->
  <div class="bar" id="drawBar">
    <span class="cc-btn-row-label lbl">Draw</span>
    <!-- tools are built by script from TOOLS -->
    <span class="sep"></span>
    <button class="tool" id="undoBtn">Undo</button>
    <button class="tool" id="clearBtn">Clear</button>
  </div>

  <div class="hint" id="hint"><span id="hintText"></span>
    <button class="cc-btn" id="finishBtn" hidden>Finish</button>
    <button class="cc-btn" id="cancelBtn" hidden>Cancel</button>
    <span class="spacer" style="flex:1"></span>
    <button class="tool" id="saveBtn">Save map</button>
    <button class="tool" id="loadBtn">Open map</button>
    <input type="file" id="loadInput" accept=".json,application/json" hidden>
    <button class="cc-btn" id="pngBtn" style="color:var(--click-text)" disabled>Download PNG</button>
  </div>

  <div class="cc-canvas-frame map-frame" id="frame">
    <div class="stack" id="stack">
      <canvas id="cvBase"></canvas>
      <canvas id="cvRadar"></canvas>
      <canvas id="cvField"></canvas>
      <canvas id="cvPulse"></canvas>
      <canvas id="cvData"></canvas>
      <canvas id="cvDraw"></canvas>
    </div>
    <div class="ov" id="ov">Loading…</div>
    <div class="zoom">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">&minus;</button>
    </div>

    <div class="float" id="selCtrls" hidden>
      <span class="cc-btn-row-label" id="selKind"></span>
      <input type="text" id="centerVal" size="6" maxlength="6" placeholder="mb" hidden>
      <button class="cc-btn" id="flipBtn" hidden>Flip side</button>
      <button class="cc-btn" id="delBtn">Delete</button>
    </div>

    <div class="float" id="labelPanel" hidden>
      <div class="row"><input type="text" id="lblText" maxlength="80" placeholder="Label text"></div>
      <div class="row">
        <select id="lblFont">
          <option value="Public Sans">Public Sans</option>
          <option value="Zilla Slab">Zilla Slab</option>
          <option value="Courier Prime">Courier Prime</option>
          <option value="CCWxSymbols">Weather symbols</option>
        </select>
        <input type="number" id="lblSize" min="10" max="56" step="1" title="Size (px)" style="width:64px">
      </div>
      <div class="row" id="lblWxRow" hidden></div>
      <div class="row">
        <button class="cc-btn" id="lblBold" title="Bold"><b>B</b></button>
        <button class="cc-btn" id="lblItalic" title="Italic"><i>I</i></button>
        <input type="color" id="lblColor" title="Text color">
        <input type="number" id="lblRot" min="-180" max="180" step="5" title="Rotation (°)" style="width:64px">
      </div>
      <div class="row">
        <div class="cc-segmented" id="lblBg">
          <button class="cc-segmented-btn" data-bg="none">None</button>
          <button class="cc-segmented-btn is-active" data-bg="halo">Halo</button>
          <button class="cc-segmented-btn" data-bg="plate">Plate</button>
        </div>
        <input type="color" id="lblBgColor" title="Plate color" hidden>
      </div>
      <div class="row"><button class="cc-btn" id="lblDelete">Delete</button><span class="spacer" style="flex:1"></span><button class="cc-btn" id="lblDone">Done</button></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>
</div>

<div id="tip"></div>

<script src="map-base.js"></script>
<script src="station-model.js"></script>
<script src="field-analysis.js"></script>

// VIEW + PROJECTION
// View = centre (lon, lat) + zoom; zoom 1 shows FULL.
// ═══════════════════════════════════════════════════
const view = { lon: (FULL.west + FULL.east) / 2, lat: (FULL.north + FULL.south) / 2, zoom: 1 };
let B, project, unproject;
const dims = { CW, CH };

function viewBounds(v = view) {
  const lonSpan = (FULL.east - FULL.west) / v.zoom;
  const latSpan = CH * lonSpan * Math.cos(v.lat * Math.PI / 180) / CW;
  return { west: v.lon - lonSpan / 2, east: v.lon + lonSpan / 2, north: v.lat + latSpan / 2, south: v.lat - latSpan / 2 };
}
function applyView() {
  view.zoom = Math.max(1, Math.min(16, view.zoom));
  B = viewBounds();
  project = MAP.makeProjection(B, dims);
  unproject = MAP.makeUnproject(B, dims);
}
function fitBounds(b) {
  const lonSpan = b.east - b.west;
  const midLat = (b.north + b.south) / 2;
  const zLon = (FULL.east - FULL.west) / lonSpan;
  const latSpanAt1 = CH * (FULL.east - FULL.west) * Math.cos(midLat * Math.PI / 180) / CW;
  const zLat = latSpanAt1 / (b.north - b.south);
  view.zoom = Math.min(zLon, zLat) * 0.97;
  view.lon = (b.west + b.east) / 2;
  view.lat = midLat;
  applyView();
}
const kmPerPx = () => (B.east - B.west) * 111.32 * Math.cos(view.lat * Math.PI / 180) / CW;

// OBSERVATIONS
// IEM: one request for every station's routine METARs (US + Canada).
// Fallbacks: NWS per US station, MSC GeoMet swob-realtime for Canada.
// ═══════════════════════════════════════════════════
let obs = [];
let obsSource = '';
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchWithRetry(url, opts = {}, retries = 3) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    if (attempt) await sleep(1200 * Math.pow(2, attempt - 1));
    let r;
    try { r = await fetch(url, opts); }
    catch (e) { lastErr = e; continue; }
    if (r.ok) return r;
    lastErr = new Error(`HTTP ${r.status}`);
    if (!(r.status >= 500 || [408, 425, 429].includes(r.status))) throw lastErr;
  }
  throw lastErr;
}

function iemUrl(ids) {
  const now = new Date(), start = new Date(now.getTime() - HISTORY_MS), end = new Date(now.getTime() + 10 * 60e3);
  const p = (t, d) => `year${t}=${d.getUTCFullYear()}&month${t}=${d.getUTCMonth() + 1}&day${t}=${d.getUTCDate()}`
                    + `&hour${t}=${d.getUTCHours()}&minute${t}=${d.getUTCMinutes()}`;
  return 'https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?'
    + ids.map(id => `station=${id}`).join('&')
    + `&data=metar&${p('1', start)}&${p('2', end)}`
    + '&tz=UTC&format=onlycomma&latlon=yes&missing=empty&trace=T&direct=no&report_type=3';
}

function parseIEM(text) {
  const out = new Map();
  let head = null;
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t || t[0] === '#') continue;
    const parts = t.split(',');
    if (!head || parts[0] === 'station') { head = parts; continue; }
    const get = k => { const i = head.indexOf(k); return i < 0 ? '' : (parts[i] || '').trim(); };
    const valid = get('valid'), metar = get('metar');
    const lon = parseFloat(get('lon')), lat = parseFloat(get('lat'));
    if (!valid || !metar || isNaN(lon) || isNaN(lat)) continue;
    const ts = new Date(valid.replace(' ', 'T') + ':00Z');
    if (isNaN(ts)) continue;
    const key = get('station');
    if (!out.has(key)) out.set(key, []);
    out.get(key).push({ ts: ts.toISOString(), lon, lat, metar });
  }
  for (const rows of out.values()) rows.sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts));
  return out;
}

function obFromHistory(id, list) {
  const now = list[0];
  if (!now || now.lat == null || Date.now() - Date.parse(now.ts) > STALE_MS) return null;
  return Object.assign(now, { id, tend: SM.tendencyFromHistory(now, list) });
}

async function loadIEM(ids) {
  const r = await fetchWithRetry(iemUrl(ids));
  const rows = parseIEM(await r.text());
  const got = new Map();
  for (const id of ids) {
    const k3 = id.length === 4 && id[0] === 'K' ? id.slice(1) : id;
    const list = rows.get(id) || rows.get(k3);
    if (!list) continue;
    const ob = obFromHistory(id, list.map(o => SM.fromMetar(o.metar, o)));
    if (ob) got.set(id, ob);
  }
  return got;
}

const isRoutine = ts => { const m = new Date(ts).getUTCMinutes(); return m >= 45 || m <= 5; };
async function fetchNws(id) {
  try {
    const r = await fetch(`https://api.weather.gov/stations/${id}/observations?limit=12`);
    if (!r.ok) return null;
    const j = await r.json();
    const all = (j.features || []).map(SM.fromNws).filter(o => o.ts && isRoutine(o.ts))
      .sort((a, b) => Date.parse(b.ts) - Date.parse(a.ts));
    return obFromHistory(id, all);
  } catch { return null; }
}

// Canada fallback: one newest-first bbox sweep of swob-realtime, matched by ICAO / TC id.
async function loadSwob(stations) {
  const want = new Map(stations.map(s => [s.id, s]));
  const byTc = new Map(stations.map(s => [s.id.slice(1), s]));
  const got = new Map();
  const v = p => (p == null ? null : p);
  for (let page = 0; page < 4 && got.size < want.size; page++) {
    const url = `https://api.weather.gc.ca/collections/swob-realtime/items?f=json&bbox=-141,41,-52,60`
      + `&sortby=-date_tm-value&limit=2000&offset=${page * 2000}`;
    let j;
    try { const r = await fetch(url); if (!r.ok) break; j = await r.json(); } catch { break; }
    const feats = j.features || [];
    if (!feats.length) break;
    for (const f of feats) {
      const p = f.properties || {};
      const s = want.get(p['icao_stn_id-value']) || byTc.get(p['tc_id-value']);
      if (!s || got.has(s.id)) continue;
      const kmh = v(p['avg_wnd_spd_10m_pst1mt-value'] ?? p['avg_wnd_spd_10m_pst1hr-value']);
      const dir = v(p['avg_wnd_dir_10m_pst1mt-value'] ?? p['avg_wnd_dir_10m_pst1hr-value']);
      const gst = v(p['max_wnd_gst_spd_10m_pst10mts-value'] ?? p['max_wnd_spd_10m_pst1mt-value']);
      const mslp = v(p['mslp-value']);
      const ob = {
        id: s.id, lon: s.lon, lat: s.lat, ts: p['date_tm-value'] || null, raw: '',
        tempC: v(p['air_temp-value']), dewC: v(p['dwpt_temp-value']),
        wind: kmh != null ? { dir: Math.round(kmh / 1.852) === 0 ? null : dir, kt: Math.round(kmh / 1.852),
                              gust: gst != null ? Math.round(gst / 1.852) : null } : null,
        visSM: null, visLT: false, wx: [], ww: null, sky: null,
        slp: mslp != null ? Math.round(mslp * 10) / 10 : null, altMb: null, tend: null,
      };
      if (ob.ts && Date.now() - Date.parse(ob.ts) <= STALE_MS) got.set(s.id, ob);
    }
    if (feats.length < 2000) break;
  }
  return got;
}

async function loadObs() {
  const ids = STATIONS_US.concat(STATIONS_CA.map(s => s.id));
  let got = new Map(), iemOk = false;
  try { got = await loadIEM(ids); iemOk = true; }
  catch (e) { console.warn('[surface-analysis] IEM request failed, falling back:', e.message || e); }

  const usMissing = STATIONS_US.filter(id => !got.has(id));
  const caMissing = STATIONS_CA.filter(s => !got.has(s.id));
  const jobs = [];
  if (usMissing.length && (!iemOk || usMissing.length <= 40)) {
    jobs.push(Promise.all(usMissing.map(fetchNws)).then(res => res.forEach((o, i) => o && got.set(usMissing[i], o))));
  }
  if (caMissing.length > STATIONS_CA.length / 2) {
    jobs.push(loadSwob(caMissing).then(m => m.forEach((o, id) => got.set(id, o))).catch(() => {}));
  }
  await Promise.all(jobs);
  obsSource = iemOk ? 'IEM' : 'NWS';
  obs = [...got.values()];
}

function getValidTime() {
  const t = obs.map(o => Date.parse(o.ts)).filter(x => !isNaN(x));
  return t.length ? new Date(Math.max(...t)) : null;
}

// Derived values per station
const cToF = SM.cToF;
function feelsLikeF(o) {
  const T = o.tempC != null ? o.tempC * 9 / 5 + 32 : null;
  if (T == null) return null;
  const mph = o.wind && o.wind.kt != null ? o.wind.kt * 1.15078 : 0;
  if (T <= 50 && mph >= 3) {
    return Math.round(35.74 + 0.6215 * T - 35.75 * Math.pow(mph, 0.16) + 0.4275 * T * Math.pow(mph, 0.16));
  }
  if (T >= 80 && o.dewC != null) {
    const Td = o.dewC;
    const RH = 100 * Math.exp(17.625 * Td / (243.04 + Td)) / Math.exp(17.625 * o.tempC / (243.04 + o.tempC));
    let HI = -42.379 + 2.04901523 * T + 10.14333127 * RH - 0.22475541 * T * RH - 0.00683783 * T * T
      - 0.05481717 * RH * RH + 0.00122874 * T * T * RH + 0.00085282 * T * RH * RH - 0.00000199 * T * T * RH * RH;
    if (RH < 13 && T <= 112) HI -= ((13 - RH) / 4) * Math.sqrt((17 - Math.abs(T - 95)) / 17);
    else if (RH > 85 && T <= 87) HI += ((RH - 85) / 10) * ((87 - T) / 5);
    return Math.round(HI);
  }
  return Math.round(T);
}
// Screen-space wind vector (mph), toward where the air is going; y is down.
function windXY(o) {
  const w = o.wind;
  if (!w || w.kt == null) return null;
  if (w.kt === 0) return [0, 0];
  if (w.dir == null) return null;
  const mph = w.kt * 1.15078, r = w.dir * Math.PI / 180;
  return [-mph * Math.sin(r), mph * Math.cos(r)];
}

const DEW_SCALE = { vals: [-25, 5, 18, 30, 55, 68, 80], cols: ['#4A3410','#B89870','#D4C060','#FFEE00','#3DB84A','#2A8C30','#2A72C8'] };
// Streamline speed ramp (mph), tuned for the light basemap.
const WIND_RAMP = { vals: [0, 9, 17, 27, 38], cols: ['#9FB0C4', '#6F86C3', '#A1469E', '#D62B5C', '#FF3B30'] };
const WIND_MAX = 38;
const CONV_MIN = 0.5e-5, CONV_MAX = 4e-5;     // s⁻¹ shading range
const CONV_RGB = [38, 150, 92];
const ISOBAR_INK = '#3a4049';

function h2r(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function rampRGB(val, sc) {
  const { vals: vs, cols: cs } = sc;
  if (val <= vs[0]) return h2r(cs[0]);
  if (val >= vs[vs.length - 1]) return h2r(cs[cs.length - 1]);
  for (let i = 0; i < vs.length - 1; i++) {
    if (val <= vs[i + 1]) {
      const t = (val - vs[i]) / (vs[i + 1] - vs[i]), a = h2r(cs[i]), b = h2r(cs[i + 1]);
      return [0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * t));
    }
  }
  return h2r(cs[cs.length - 1]);
}
const rgb = a => `rgb(${a[0]},${a[1]},${a[2]})`;
const gradientCss = sc => {
  const v0 = sc.vals[0], v1 = sc.vals[sc.vals.length - 1];
  return `linear-gradient(to right, ${sc.vals.map((v, i) => `${sc.cols[i]} ${((v - v0) / (v1 - v0) * 100).toFixed(1)}%`).join(', ')})`;
};

// ═══════════════════════════════════════════════════
// ANALYSIS FIELDS (recomputed when data or view changes)
// ═══════════════════════════════════════════════════
let fields = null;

function stationPoints() {
  const mx = CW * 0.35, my = CH * 0.35;
  const pts = [];
  for (const o of obs) {
    const [x, y] = project(o.lon, o.lat);
    if (x < -mx || x > CW + mx || y < -my || y > CH + my) continue;
    pts.push({ o, x, y });
  }
  return pts;
}

function computeFields() {
  const grid = F.makeGrid(CW, CH, GRID_STEP);
  const pts = stationPoints();
  const inView = pts.filter(p => p.x >= 0 && p.x <= CW && p.y >= 0 && p.y <= CH);
  const spacing = Math.sqrt((CW * CH) / Math.max(inView.length, 4));
  // Median nearest-neighbour distance sets how far from a station the analysis is drawn.
  const nnd = inView.map(a => {
    let m = Infinity;
    for (const q of inView) if (q !== a) { const d = (q.x - a.x) ** 2 + (q.y - a.y) ** 2; if (d < m) m = d; }
    return Math.sqrt(m);
  }).sort((a, b) => a - b);
  const nn = nnd.length ? nnd[nnd.length >> 1] : spacing;
  const field = fn => {
    const P = [];
    for (const p of pts) { const v = fn(p.o); if (v != null && isFinite(v)) P.push({ x: p.x, y: p.y, v }); }
    return { grid: F.barnes(P, grid, { spacing }), n: P.length, P };
  };
  const cov = pl => F.coverage(pl, grid, Math.max(18, nn * 1.6), Math.max(50, nn * 3.4));

  const out = { grid, spacing, nn };
  const slp = field(o => o.slp);
  out.slp = slp.grid; out.slpMask = cov(slp.P);
  const need = k => layers[k];
  if (need('temp')) { const f = field(o => cToF(o.tempC)); out.temp = f.grid; out.tempMask = cov(f.P); }
  if (need('dew'))  { const f = field(o => cToF(o.dewC)); out.dew = f.grid; out.dewMask = cov(f.P); }
  if (need('feels')) { const f = field(feelsLikeF); out.feels = f.grid; out.feelsMask = cov(f.P); }

  const wpts = [];
  for (const p of pts) { const w = windXY(p.o); if (w) wpts.push({ x: p.x, y: p.y, u: w[0], v: w[1] }); }
  out.U = F.barnes(wpts.map(p => ({ x: p.x, y: p.y, v: p.u })), grid, { spacing });
  out.V = F.barnes(wpts.map(p => ({ x: p.x, y: p.y, v: p.v })), grid, { spacing });
  out.windMask = cov(wpts);

  const dsep = { sparse: 42, normal: 30, dense: 21 }[layers.windDensity];
  out.lines = F.streamlines(grid, out.U, out.V, out.windMask, { dsep, minSpeed: 0.6, maskMin: 0.4 });
  for (const l of out.lines) {
    const acc = [0];
    for (let k = 1; k < l.pts.length; k++) acc.push(acc[k - 1] + Math.hypot(l.pts[k][0] - l.pts[k - 1][0], l.pts[k][1] - l.pts[k - 1][1]));
    l.acc = acc;
    l.phase = Math.random() * l.len;
  }
  out.div = F.divergence(grid, out.U, out.V);
  out.centres = F.extrema(grid, out.slp, out.slpMask, { radius: 100, prominence: 1.2 });
  fields = out;
}

// RENDER — basemap + radar
// ═══════════════════════════════════════════════════
let basemap = null, basemapRes = null;

async function ensureBasemap() {
  const res = MAP.basemapResFor(B, CW);
  if (res === basemapRes && basemap) return;
  basemap = await MAP.loadBasemap(res);
  basemapRes = res;
}

function renderBase(c = bctx) {
  MAP.renderBase(c, basemap, project, dims, B);
}

let radarImg = null, radarKey = '';
function radarTime() {
  const t = new Date(Date.now() - 5 * 60e3);
  t.setUTCMinutes(t.getUTCMinutes() - (t.getUTCMinutes() % 5), 0, 0);
  return t;
}
function radarUrl(b) {
  const W = 1200, H = Math.round(W * (b.north - b.south) / (b.east - b.west));
  return 'https://mesonet.agron.iastate.edu/cgi-bin/wms/nexrad/n0q-t.cgi?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap'
    + `&LAYERS=nexrad-n0q-wmst&STYLES=&SRS=EPSG:4326&BBOX=${b.west},${b.south},${b.east},${b.north}`
    + `&WIDTH=${W}&HEIGHT=${H}&FORMAT=image%2Fpng&TRANSPARENT=true`
    + `&TIME=${radarTime().toISOString().split('.')[0]}Z&EXCEPTIONS=application/vnd.ogc.se_inimage`;
}
// The WMS image is plate carrée; draw it in thin latitude strips so it follows
// this map's cos(lat)-corrected x scale.
function drawRadar(c, img, b) {
  const rows = 60;
  const lonR = b.east - b.west, latR = b.north - b.south;
  for (let k = 0; k < rows; k++) {
    const lat0 = b.north - latR * k / rows, lat1 = b.north - latR * (k + 1) / rows, latM = (lat0 + lat1) / 2;
    const sy = img.naturalHeight * k / rows, sh = img.naturalHeight / rows;
    const [x0, y0] = project(b.west, lat0), [x1] = project(b.east, latM), [xw] = project(b.west, latM);
    const [, y1] = project(b.west, lat1);
    c.drawImage(img, 0, sy, img.naturalWidth, sh, xw, y0, x1 - xw, y1 - y0 + 0.5);
  }
}
function renderRadar(c = rctx) {
  if (c === rctx) clear(rctx);
  if (!layers.radar) return;
  const b = { west: B.west - 2, east: B.east + 2, north: Math.min(B.north + 1, 53), south: Math.max(B.south - 1, 20) };
  const key = JSON.stringify(b) + radarTime().getTime();
  if (radarImg && radarKey === key && radarImg.complete) { c.save(); c.globalAlpha = 0.8; drawRadar(c, radarImg, b); c.restore(); return; }
  if (c !== rctx) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { if (radarKey === key && layers.radar) { clear(rctx); rctx.save(); rctx.globalAlpha = 0.8; drawRadar(rctx, img, b); rctx.restore(); } };
  img.onerror = () => console.warn('[surface-analysis] radar image failed to load');
  radarImg = img; radarKey = key;
  img.src = radarUrl(b);
}

// ═══════════════════════════════════════════════════
// RENDER — analysis fields
// ═══════════════════════════════════════════════════
function renderConvergence(c) {
  const { grid, div, windMask } = fields;
  const toS = 0.44704 / (kmPerPx() * 1000);      // mph/px → s⁻¹
  const off = document.createElement('canvas');
  off.width = grid.nx; off.height = grid.ny;
  const o = off.getContext('2d'), img = o.createImageData(grid.nx, grid.ny);
  for (let k = 0; k < div.length; k++) {
    const conv = isNaN(div[k]) ? 0 : -div[k] * toS;
    const a = Math.max(0, Math.min(1, (conv - CONV_MIN) / (CONV_MAX - CONV_MIN))) * windMask[k];
    img.data[k * 4] = CONV_RGB[0]; img.data[k * 4 + 1] = CONV_RGB[1]; img.data[k * 4 + 2] = CONV_RGB[2];
    img.data[k * 4 + 3] = Math.round(a * 0.5 * 255);
  }
  o.putImageData(img, 0, 0);
  c.save();
  c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
  c.drawImage(off, 0, 0, grid.nx, grid.ny, 0, 0, (grid.nx - 1) * grid.step + grid.step, (grid.ny - 1) * grid.step + grid.step);
  c.restore();
}

function levelsFor(f, step) {
  let lo = Infinity, hi = -Infinity;
  for (const v of f) if (!isNaN(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const out = [];
  if (!isFinite(lo)) return out;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) out.push(v);
  return out;
}

function strokePath(c, pts) {
  c.beginPath();
  pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]));
  c.stroke();
}

// Labels placed along each line every ~260 px, with a halo; returns nothing.
function labelLine(c, pts, text, color) {
  let acc = 0, next = 90;
  c.font = '600 13px "Public Sans"';
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  for (let k = 1; k < pts.length; k++) {
    acc += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
    if (acc >= next) {
      const [x, y] = pts[k];
      if (x > 20 && x < CW - 20 && y > 12 && y < CH - 12) {
        c.lineWidth = 4; c.strokeStyle = 'rgba(247,246,242,0.95)'; c.strokeText(text, x, y);
        c.fillStyle = color; c.fillText(text, x, y);
      }
      next += 260;
    }
  }
}

const ISO_DEFS = {
  temp:  { scale: TEMP_SCALE, step: 5, dash: [7, 4], width: 1.7 },
  dew:   { scale: DEW_SCALE,  step: 5, dash: [],     width: 1.7 },
  feels: { scale: TEMP_SCALE, step: 5, dash: [2, 3], width: 1.9 },
};

function renderIsolines(c) {
  const { grid } = fields;
  for (const k of ['feels', 'dew', 'temp']) {
    if (!layers[k] || !fields[k]) continue;
    const d = ISO_DEFS[k];
    const sets = F.contours(grid, fields[k], levelsFor(fields[k], d.step), fields[k + 'Mask'], 0.45);
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = d.width; c.setLineDash(d.dash);
    for (const s of sets) { c.strokeStyle = rgb(rampRGB(s.level, d.scale)); strokePath(c, s.pts); }
    c.setLineDash([]);
    for (const s of sets) labelLine(c, s.pts, `${s.level}°`, rgb(rampRGB(s.level, d.scale)));
    c.restore();
  }
  if (layers.isobars && fields.slp) {
    const sets = F.contours(grid, fields.slp, levelsFor(fields.slp, layers.isobarStep), fields.slpMask, 0.45);
    c.save(); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = ISOBAR_INK;
    for (const s of sets) { c.lineWidth = s.level % 20 === 0 ? 2.1 : 1.4; strokePath(c, s.pts); }
    for (const s of sets) labelLine(c, s.pts, String(s.level), ISOBAR_INK);
    c.restore();
  }
}

function windStyle(spd) {
  const t = Math.min(1, spd / WIND_MAX);
  return { color: rampRGB(spd, WIND_RAMP), width: 1.3 + t * 2.2 };
}

// Streamlines: coloured and weighted by speed, tapered ends, arrowheads every 110 px.
function renderStreamlines(c) {
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  for (const l of fields.lines) {
    const P = l.pts, n = P.length, taper = 14;
    for (let k = 1; k < n; k += 3) {
      const k1 = Math.min(n - 1, k + 3);
      const spd = P[k][2], st = windStyle(spd);
      const edge = Math.min(l.acc[k], l.len - l.acc[k]);
      const f = Math.max(0.25, Math.min(1, edge / taper));
      c.strokeStyle = rgb(st.color); c.lineWidth = st.width * f;
      c.beginPath(); c.moveTo(P[k - 1][0], P[k - 1][1]);
      for (let q = k; q <= k1; q++) c.lineTo(P[q][0], P[q][1]);
      c.stroke();
    }
    for (let s = 55; s < l.len - 20; s += 110) drawArrow(c, l, s);
  }
  c.restore();
}

function pointAt(l, s) {
  const a = l.acc;
  let lo = 0, hi = a.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (a[m] < s) lo = m; else hi = m; }
  const t = (s - a[lo]) / ((a[hi] - a[lo]) || 1);
  const p = l.pts[lo], q = l.pts[hi];
  return { x: p[0] + (q[0] - p[0]) * t, y: p[1] + (q[1] - p[1]) * t, dx: q[0] - p[0], dy: q[1] - p[1], spd: p[2], i: lo };
}

function drawArrow(c, l, s) {
  const p = pointAt(l, s), n = Math.hypot(p.dx, p.dy) || 1;
  const ux = p.dx / n, uy = p.dy / n, st = windStyle(p.spd);
  const L = 6 + st.width * 1.6, Wd = 3.5 + st.width * 1.1;
  c.fillStyle = rgb(st.color);
  c.beginPath();
  c.moveTo(p.x + ux * L * 0.6, p.y + uy * L * 0.6);
  c.lineTo(p.x - ux * L * 0.4 - uy * Wd, p.y - uy * L * 0.4 + ux * Wd);
  c.lineTo(p.x - ux * L * 0.4 + uy * Wd, p.y - uy * L * 0.4 - ux * Wd);
  c.closePath(); c.fill();
}

function renderFields(c = fctx) {
  if (c === fctx) clear(fctx);
  if (!fields) return;
  if (layers.conv) renderConvergence(c);
  renderIsolines(c);
  if (layers.wind) renderStreamlines(c);
}

// ── Pulses travelling along the streamlines ──────────
const PULSE_SPACING = 240, PULSE_LEN = 26, PULSE_RATE = 0.075;   // px per frame per mph
let pulseId = null, lastT = 0;
function pulseFrame(t) {
  pulseId = null;
  if (!layers.wind || !layers.animate || !fields || document.hidden) { clear(pctx); return; }
  const dt = lastT ? Math.min(3, (t - lastT) / 16.7) : 1;
  lastT = t;
  clear(pctx);
  pctx.lineCap = 'round';
  for (const l of fields.lines) {
    if (l.len < 50) continue;
    const count = Math.max(1, Math.floor(l.len / PULSE_SPACING));
    const here = pointAt(l, l.phase % l.len);
    l.phase += Math.max(0.35, here.spd * PULSE_RATE) * dt;
    for (let q = 0; q < count; q++) {
      const s = (l.phase + q * l.len / count) % l.len;
      if (s < PULSE_LEN) continue;
      const head = pointAt(l, s), st = windStyle(head.spd);
      const col = st.color.map(v => Math.round(v + (255 - v) * 0.62)).join(',');
      const tail = pointAt(l, s - PULSE_LEN);
      const grad = pctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
      grad.addColorStop(0, `rgba(${col},0)`); grad.addColorStop(1, `rgba(${col},0.95)`);
      pctx.strokeStyle = grad; pctx.lineWidth = st.width + 1.6;
      pctx.beginPath();
      pctx.moveTo(tail.x, tail.y);
      for (let i = tail.i + 1; i <= head.i; i++) pctx.lineTo(l.pts[i][0], l.pts[i][1]);
      pctx.lineTo(head.x, head.y);
      pctx.stroke();
    }
  }
  pulseId = requestAnimationFrame(pulseFrame);
}
function startPulses() { if (pulseId == null) { lastT = 0; pulseId = requestAnimationFrame(pulseFrame); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) startPulses(); });

// ═══════════════════════════════════════════════════
// RENDER — stations
// ═══════════════════════════════════════════════════
let plotted = [], thinned = [];
function renderStations(c = sctx) {
  if (c === sctx) clear(sctx);
  plotted = []; thinned = [];
  if (!layers.stations || layers.stationMode === 'off') return;
  const items = [];
  for (const o of obs) {
    const [x, y] = project(o.lon, o.lat);
    if (x < -20 || x > CW + 20 || y < -20 || y > CH + 20) continue;
    items.push({ x, y, ob: o, priority: priority(o.id) });
  }
  const opts = {
    windOnly: layers.stationMode === 'wind', ghost: layers.ghost,
    clip: { x0: 2, y0: 2, x1: CW - 2, y1: CH - 2 },
    reserved: [{ x0: 0, y0: CH - 36, x1: 330, y1: CH }, { x0: CW - 56, y0: CH - 90, x1: CW, y1: CH }],
  };
  const { kept, dropped } = SM.thin(c, items, opts);
  plotted = kept; thinned = dropped;
  if (!layers.ghost) for (const it of dropped) SM.drawThinned(c, it.x, it.y);
  for (const it of kept) SM.draw(c, it.x, it.y, it.ob, Object.assign({ lay: it.lay }, opts));
}

// ═══════════════════════════════════════════════════
// DRAWING — objects are stored in lon/lat so they follow zoom and pan
// ═══════════════════════════════════════════════════
const COLD = '#2D6FE0', WARM = '#D03A2E', OCC = '#7B3FA0', STN = '#5b5f68', TROUGH = '#B8621B';
const FRONT_COLOR = { cold: COLD, warm: WARM, occluded: OCC, stationary: STN, trough: TROUGH };
const PIP_SPACING = 42;
const SEL = '#111111';

let analysis = { centers: [], fronts: [], labels: [] };
let nextId = 1;
let tool = 'select';
let drawing = null;        // front being drawn: { type, pts:[[lon,lat]], side }
let cursor = null;         // [x, y] canvas px, for the rubber-band preview
let selected = null;       // { kind:'center'|'front'|'label', obj }

const toPx = ll => project(ll[0], ll[1]);

// Catmull-Rom through the clicked points, sampled every few px.
function smoothPx(llPts) {
  const p = llPts.map(toPx);
  if (p.length < 3) return p;
  const out = [];
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[Math.max(0, i - 1)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(p.length - 1, i + 2)];
    const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 6));
    for (let k = 0; k < n; k++) {
      const t = k / n, t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(d => 0.5 * ((2 * p1[d]) + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2
        + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3)));
    }
  }
  out.push(p[p.length - 1]);
  return out;
}
function pathLength(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function pointAtLength(pts, d) {
  let rem = d;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], L = Math.hypot(x1 - x0, y1 - y0);
    if (rem <= L || i === pts.length - 1) {
      const t = L > 0 ? Math.min(rem / L, 1) : 0;
      return { x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, tx: L ? (x1 - x0) / L : 1, ty: L ? (y1 - y0) / L : 0 };
    }
    rem -= L;
  }
  const q = pts[pts.length - 1];
  return { x: q[0], y: q[1], tx: 1, ty: 0 };
}
const normal = (s, side) => side >= 0 ? { x: -s.ty, y: s.tx } : { x: s.ty, y: -s.tx };
function triPip(c, s, n, color) {
  c.save(); c.translate(s.x, s.y); c.rotate(Math.atan2(n.y, n.x));
  c.beginPath(); c.moveTo(0, -9); c.lineTo(0, 9); c.lineTo(15, 0); c.closePath();
  c.fillStyle = color; c.fill(); c.restore();
}
function semiPip(c, s, n, color) {
  c.save(); c.translate(s.x, s.y); c.rotate(Math.atan2(n.y, n.x));
  c.beginPath(); c.arc(0, 0, 10, -Math.PI / 2, Math.PI / 2); c.closePath();
  c.fillStyle = color; c.fill(); c.restore();
}

function drawFront(c, f, isSel) {
  const pts = smoothPx(f.pts);
  if (pts.length < 2) return;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  const total = pathLength(pts);
  if (f.type === 'stationary') {
    // Alternating red / blue segments, pips on opposite sides.
    const n = Math.max(2, Math.round(total / PIP_SPACING));
    for (let i = 0; i < n; i++) {
      const seg = [];
      for (let d = total * i / n; d <= total * (i + 1) / n + 0.1; d += 4) { const s = pointAtLength(pts, d); seg.push([s.x, s.y]); }
      c.strokeStyle = i % 2 ? WARM : COLD; c.lineWidth = 3.2; strokePath(c, seg);
      const s = pointAtLength(pts, total * (i + 0.5) / n);
      if (i % 2) semiPip(c, s, normal(s, -f.side), WARM); else triPip(c, s, normal(s, f.side), COLD);
    }
  } else {
    c.strokeStyle = FRONT_COLOR[f.type]; c.lineWidth = f.type === 'trough' ? 2.8 : 3.2;
    c.setLineDash(f.type === 'trough' ? [14, 9] : []);
    strokePath(c, pts);
    c.setLineDash([]);
    if (f.type !== 'trough') {
      const n = Math.max(1, Math.round(total / PIP_SPACING));
      for (let i = 0; i < n; i++) {
        const s = pointAtLength(pts, total * (i + 0.5) / n), nm = normal(s, -f.side);
        if (f.type === 'cold') triPip(c, s, nm, COLD);
        else if (f.type === 'warm') semiPip(c, s, nm, WARM);
        else if (i % 2 === 0) triPip(c, s, nm, OCC); else semiPip(c, s, nm, OCC);
      }
    }
  }
  if (isSel) {
    c.strokeStyle = 'rgba(17,17,17,0.55)'; c.lineWidth = 1.2; c.setLineDash([5, 4]); strokePath(c, pts); c.setLineDash([]);
    for (const ll of f.pts) {
      const [x, y] = toPx(ll);
      c.beginPath(); c.arc(x, y, 5.5, 0, Math.PI * 2); c.fillStyle = '#fff'; c.fill();
      c.lineWidth = 1.6; c.strokeStyle = SEL; c.stroke();
    }
  }
  c.restore();
}

function drawCenter(c, ctr, isSel, ghost = false) {
  const [x, y] = toPx([ctr.lon, ctr.lat]);
  c.save();
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.font = '800 40px "Public Sans"';
  const col = ctr.type === 'H' ? COLD : WARM;
  if (ghost) {
    c.setLineDash([4, 3]); c.lineWidth = 1.6; c.strokeStyle = col; c.globalAlpha = 0.75;
    c.strokeText(ctr.type, x, y);
    c.setLineDash([]);
    c.font = '600 12px "Public Sans"'; c.fillStyle = col; c.fillText(Math.round(ctr.value), x, y + 27);
    c.restore(); return;
  }
  if (isSel) { c.beginPath(); c.arc(x, y, 27, 0, Math.PI * 2); c.strokeStyle = SEL; c.lineWidth = 1.8; c.setLineDash([5, 4]); c.stroke(); c.setLineDash([]); }
  c.lineWidth = 7; c.strokeStyle = '#ffffff'; c.strokeText(ctr.type, x, y);
  c.fillStyle = col; c.fillText(ctr.type, x, y);
  if (ctr.value) {
    c.font = '700 14px "Public Sans"';
    c.lineWidth = 4; c.strokeText(ctr.value, x, y + 29);
    c.fillStyle = '#1b1f24'; c.fillText(ctr.value, x, y + 29);
  }
  c.restore();
}

function labelFont(lb) { return `${lb.italic ? 'italic ' : ''}${lb.bold ? '700' : '500'} ${lb.size}px "${lb.font}"`; }
function labelBox(c, lb) {
  c.font = labelFont(lb);
  const w = c.measureText(lb.text || ' ').width, h = lb.size;
  return { w, h };
}
function drawLabel(c, lb, isSel) {
  if (!lb.text) return;
  const [x, y] = toPx([lb.lon, lb.lat]);
  const { w, h } = labelBox(c, lb);
  c.save(); c.translate(x, y); c.rotate((lb.rot || 0) * Math.PI / 180);
  c.font = labelFont(lb); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (lb.bg === 'plate') { c.fillStyle = lb.bgColor; c.fillRect(-w / 2 - 6, -h / 2 - 4, w + 12, h + 8); }
  if (lb.bg === 'halo') { c.lineWidth = Math.max(3, lb.size / 5); c.strokeStyle = 'rgba(255,255,255,0.95)'; c.strokeText(lb.text, 0, 1); }
  c.fillStyle = lb.color; c.fillText(lb.text, 0, 1);
  if (isSel) { c.strokeStyle = SEL; c.lineWidth = 1.2; c.setLineDash([4, 3]); c.strokeRect(-w / 2 - 8, -h / 2 - 6, w + 16, h + 12); }
  c.restore();
}

// Pressure centres found in the analysed SLP field, not yet placed by the user.
function suggestions(type) {
  if (!fields || !fields.centres) return [];
  const out = [];
  for (const s of fields.centres) {
    if (s.type !== type || s.x < 20 || s.x > CW - 20 || s.y < 20 || s.y > CH - 20) continue;
    const taken = analysis.centers.some(c => {
      const [px, py] = toPx([c.lon, c.lat]);
      return c.type === type && Math.hypot(px - s.x, py - s.y) < 40;
    });
    if (taken) continue;
    const [lon, lat] = unproject(s.x, s.y);
    out.push({ type, lon, lat, value: s.value, x: s.x, y: s.y });
  }
  return out;
}

function renderDraw(c = dctx, forExport = false) {
  if (c === dctx) clear(dctx);
  if (!forExport && (tool === 'H' || tool === 'L')) for (const s of suggestions(tool)) drawCenter(c, s, false, true);
  for (const f of analysis.fronts) drawFront(c, f, !forExport && selected && selected.obj === f);
  if (drawing && !forExport) {
    const pts = drawing.pts.map(toPx);
    if (cursor) pts.push(cursor);
    c.save(); c.strokeStyle = FRONT_COLOR[drawing.type]; c.lineWidth = 2.5; c.setLineDash([7, 5]);
    strokePath(c, pts); c.setLineDash([]);
    for (const ll of drawing.pts) { const [x, y] = toPx(ll); c.beginPath(); c.arc(x, y, 4, 0, Math.PI * 2); c.fillStyle = FRONT_COLOR[drawing.type]; c.fill(); }
    c.restore();
  }
  for (const ctr of analysis.centers) drawCenter(c, ctr, !forExport && selected && selected.obj === ctr);
  for (const lb of analysis.labels) drawLabel(c, lb, !forExport && selected && selected.obj === lb);
  if (c === dctx) positionFloats();
}

// ═══════════════════════════════════════════════════
// UNDO + PERSISTENCE
// ═══════════════════════════════════════════════════
const undoStack = [];
const snapshot = () => JSON.stringify({ analysis, nextId });
function pushUndo() { undoStack.push(snapshot()); if (undoStack.length > 80) undoStack.shift(); }
function undo() {
  if (!undoStack.length) return;
  const s = JSON.parse(undoStack.pop());
  analysis = s.analysis; nextId = s.nextId; selected = null; drawing = null;
  afterEdit();
}
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ analysis, nextId, layers, view })); } catch { /* storage full or blocked */ }
}
function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!s) return;
    applyState(s);
  } catch { /* ignore a corrupt save */ }
}
function applyState(s) {
  if (s.analysis) {
    analysis = {
      centers: (s.analysis.centers || []).filter(c => isFinite(c.lon) && isFinite(c.lat)),
      fronts: (s.analysis.fronts || []).filter(f => Array.isArray(f.pts) && f.pts.length >= 2),
      labels: (s.analysis.labels || []).filter(l => isFinite(l.lon) && isFinite(l.lat)),
    };
  }
  if (s.nextId) nextId = s.nextId;
  if (s.layers) for (const k of Object.keys(layers)) if (k in s.layers) layers[k] = s.layers[k];
  if (s.view && isFinite(s.view.lon) && isFinite(s.view.lat) && isFinite(s.view.zoom)) Object.assign(view, s.view);
}
function afterEdit() { renderDraw(); saveLocal(); updateLegend(); }

// ═══════════════════════════════════════════════════
// HIT TESTING
// ═══════════════════════════════════════════════════
function distToPolyline(x, y, pts) {
  let best = Infinity;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / L2));
    best = Math.min(best, Math.hypot(x - ax - t * dx, y - ay - t * dy));
  }
  return best;
}
function hitTest(x, y) {
  if (selected && selected.kind === 'front') {
    const i = selected.obj.pts.findIndex(ll => { const [px, py] = toPx(ll); return Math.hypot(px - x, py - y) < 9; });
    if (i >= 0) return { kind: 'handle', obj: selected.obj, index: i };
  }
  for (const lb of [...analysis.labels].reverse()) {
    const [px, py] = toPx([lb.lon, lb.lat]), { w, h } = labelBox(dctx, lb);
    if (Math.abs(x - px) < w / 2 + 8 && Math.abs(y - py) < h / 2 + 6) return { kind: 'label', obj: lb };
  }
  for (const c of [...analysis.centers].reverse()) {
    const [px, py] = toPx([c.lon, c.lat]);
    if (Math.hypot(px - x, py - y) < 24) return { kind: 'center', obj: c };
  }
  for (const f of [...analysis.fronts].reverse()) {
    if (distToPolyline(x, y, smoothPx(f.pts)) < 9) return { kind: 'front', obj: f };
  }
  return null;
}

function showPop(chip, L) {

}
function syncChips() {

function setLayer(key, val, quiet = false) {

  if (quiet) return;
  if (RECOMPUTE.has(key) && val !== false) { computeFields(); renderFields(); }
  else if (key === 'radar') renderRadar();
  else if (['stations', 'stationMode', 'ghost'].includes(key)) renderStations();
  else renderFields();

const ICON = {

  stationary: `<svg width="26" height="16" viewBox="0 0 26 16"><path d="M1 8h12" stroke="${COLD}" stroke-width="2.4"/><path d="M13 8h12" stroke="${WARM}" stroke-width="2.4"/><path d="M4 8l3-6 3 6z" fill="${COLD}"/><path d="M16 8a4 4 0 0 0 8 0z" fill="${WARM}"/></svg>`,

const TOOLS = [
  { key: 'select', label: 'Select' },
  { key: 'H', label: `<b style="color:${COLD};font-size:17px">H</b>` },
  { key: 'L', label: `<b style="color:${WARM};font-size:17px">L</b>` },
  { key: 'cold', label: 'Cold' }, { key: 'warm', label: 'Warm' }, { key: 'stationary', label: 'Stationary' },
  { key: 'occluded', label: 'Occluded' }, { key: 'trough', label: 'Trough' },
  { key: 'label', label: '<span style="font-family:var(--font-display);font-weight:700">Aa</span> Label' },
];
const HINTS = {
  select: 'Click a symbol to select it · drag to move it or pan the map · Ctrl/⌘ + scroll to zoom',
  H: 'Click to place a high · dashed H marks are pressure maxima in the analysis — click one to use it',
  L: 'Click to place a low · dashed L marks are pressure minima in the analysis — click one to use it',
  front: 'Click to add points · double-click or Enter to finish · Backspace removes the last point · Esc cancels',
  label: 'Click the map to place a label',
};
function buildDrawBar() {
  const bar = $('drawBar'), anchor = bar.querySelector('.sep');
  for (const t of TOOLS) {
    const b = document.createElement('button');
    b.className = 'tool'; b.dataset.tool = t.key;
    b.innerHTML = (ICON[t.key] || '') + t.label;
    b.addEventListener('click', () => setTool(t.key));
    bar.insertBefore(b, anchor);
  }
}
const isFrontTool = t => ['cold', 'warm', 'stationary', 'occluded', 'trough'].includes(t);
function setTool(t) {
  if (drawing) finishFront();
  tool = t;
  document.querySelectorAll('#drawBar .tool[data-tool]').forEach(b => b.classList.toggle('is-active', b.dataset.tool === t));
  if (t !== 'select') { selected = null; hideLabelPanel(); }
  $('cvDraw').classList.toggle('pan', t === 'select');

  renderDraw();

function updateHint() {

  $('finishBtn').hidden = $('cancelBtn').hidden = !drawing;
}

// ═══════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════
const cvDraw = $('cvDraw'), stack = $('stack');
function canvasXY(e) {
  const r = cvDraw.getBoundingClientRect();
  return [(e.clientX - r.left) * CW / r.width, (e.clientY - r.top) * CH / r.height];
}
let drag = null;

cvDraw.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  e.preventDefault();          // keep focus where the handler puts it (label text box)
  const [x, y] = canvasXY(e);
  const ll = unproject(x, y);
  if (tool === 'select') {
    const hit = hitTest(x, y);
    if (hit) {
      if (hit.kind !== 'handle') { selected = { kind: hit.kind, obj: hit.obj }; if (hit.kind === 'label') showLabelPanel(hit.obj); else hideLabelPanel(); }
      drag = { hit, start: [x, y], last: [x, y], snap: snapshot(), moved: false };
    } else {
      selected = null; hideLabelPanel();
      drag = { pan: true, start: [x, y], cx: e.clientX, cy: e.clientY };
      cvDraw.classList.add('panning');
    }
    renderDraw();
  } else if (tool === 'H' || tool === 'L') {
    const sug = suggestions(tool).find(s => Math.hypot(s.x - x, s.y - y) < 30);
    pushUndo();
    const src = sug || { lon: ll[0], lat: ll[1], value: fields ? F.sample(fields.grid, fields.slp, x, y) : null };
    const c = { id: nextId++, type: tool, lon: src.lon, lat: src.lat, value: src.value != null ? String(Math.round(src.value)) : '' };
    analysis.centers.push(c);
    selected = { kind: 'center', obj: c };
    afterEdit();
  } else if (isFrontTool(tool)) {
    if (!drawing) drawing = { type: tool, pts: [], side: 1 };
    const last = drawing.pts[drawing.pts.length - 1];
    if (!last || Math.hypot(...toPx(last).map((v, i) => v - [x, y][i])) > 4) drawing.pts.push(ll);
    updateHint(); renderDraw();
  } else if (tool === 'label') {
    pushUndo();
    const lb = { id: nextId++, lon: ll[0], lat: ll[1], text: 'Label', font: 'Public Sans', size: 18, bold: true, italic: false,
                 color: '#1b1f24', rot: 0, bg: 'halo', bgColor: '#f7f6f2' };
    analysis.labels.push(lb);
    selected = { kind: 'label', obj: lb };
    setTool('select');
    selected = { kind: 'label', obj: lb };
    showLabelPanel(lb, true);
    afterEdit();
  }
});

window.addEventListener('mousemove', e => {
  if (drag && drag.pan) {
    const r = cvDraw.getBoundingClientRect();
    stack.style.transform = `translate(${e.clientX - drag.cx}px, ${e.clientY - drag.cy}px)`;
    drag.dx = (e.clientX - drag.cx) * CW / r.width; drag.dy = (e.clientY - drag.cy) * CH / r.height;
    return;
  }
  if (drag) {
    const [x, y] = canvasXY(e);
    const [dx, dy] = [x - drag.last[0], y - drag.last[1]];
    if (!drag.moved && Math.hypot(x - drag.start[0], y - drag.start[1]) < 3) return;
    drag.moved = true; drag.last = [x, y];
    const move = ll => { const [px, py] = toPx(ll); return unproject(px + dx, py + dy); };
    const h = drag.hit;
    if (h.kind === 'handle') h.obj.pts[h.index] = unproject(x, y);
    else if (h.kind === 'front') h.obj.pts = h.obj.pts.map(move);
    else { const [lon, lat] = move([h.obj.lon, h.obj.lat]); h.obj.lon = lon; h.obj.lat = lat; }
    renderDraw();
    return;
  }
  if (e.target !== cvDraw) { hideTip(); return; }
  const [x, y] = canvasXY(e);
  if (drawing) { cursor = [x, y]; renderDraw(); }
  if (tool === 'select') showTip(e, x, y); else hideTip();
});

window.addEventListener('mouseup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  cvDraw.classList.remove('panning');
  if (d.pan) {
    stack.style.transform = '';
    if (d.dx || d.dy) {
      const [lon, lat] = unproject(CW / 2 - (d.dx || 0), CH / 2 - (d.dy || 0));
      view.lon = lon; view.lat = lat;
      refreshView();
    }
    return;
  }
  if (d.moved) { undoStack.push(d.snap); afterEdit(); }
});

cvDraw.addEventListener('dblclick', () => { if (drawing) finishFront(); });
cvDraw.addEventListener('mouseleave', () => { cursor = null; hideTip(); if (drawing) renderDraw(); });

function finishFront() {
  if (drawing && drawing.pts.length >= 2) {
    pushUndo();
    const f = { id: nextId++, type: drawing.type, pts: drawing.pts, side: 1 };
    analysis.fronts.push(f);
  }
  drawing = null; cursor = null;
  updateHint(); afterEdit();
}
function cancelFront() { drawing = null; cursor = null; updateHint(); renderDraw(); }
$('finishBtn').addEventListener('click', finishFront);
$('cancelBtn').addEventListener('click', cancelFront);

function deleteSelected() {
  if (!selected) return;
  pushUndo();
  const k = { center: 'centers', front: 'fronts', label: 'labels' }[selected.kind];
  analysis[k] = analysis[k].filter(o => o !== selected.obj);
  selected = null; hideLabelPanel(); afterEdit();
}

document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); undo(); return; }
  if (typing) return;
  if (e.key === 'Escape') { if (drawing) cancelFront(); else { selected = null; hideLabelPanel(); renderDraw(); } }
  else if (e.key === 'Enter' && drawing) finishFront();
  else if (e.key === 'Backspace' && drawing) { e.preventDefault(); drawing.pts.pop(); if (!drawing.pts.length) drawing = null; updateHint(); renderDraw(); }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); deleteSelected(); }
});

// Zoom: Ctrl/⌘ + wheel around the cursor, or the +/− buttons around the centre.
let zoomTimer = null;
function zoomAt(x, y, factor) {
  const ll = unproject(x, y);
  view.zoom = Math.max(1, Math.min(16, view.zoom * factor));
  applyView();
  const [px, py] = project(ll[0], ll[1]);
  const [lon, lat] = unproject(CW / 2 + (px - x), CH / 2 + (py - y));
  view.lon = lon; view.lat = lat;
  applyView();
  clear(fctx); clear(pctx); clear(sctx); clear(rctx); fields = null;
  if (basemap) renderBase();
  renderDraw();
  clearTimeout(zoomTimer);
  zoomTimer = setTimeout(refreshView, 220);
}
cvDraw.addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  const [x, y] = canvasXY(e);
  zoomAt(x, y, e.deltaY < 0 ? 1.25 : 0.8);
}, { passive: false });
$('zoomIn').addEventListener('click', () => zoomAt(CW / 2, CH / 2, 1.5));
$('zoomOut').addEventListener('click', () => zoomAt(CW / 2, CH / 2, 1 / 1.5));

$('undoBtn').addEventListener('click', undo);
$('clearBtn').addEventListener('click', () => {
  if (!analysis.centers.length && !analysis.fronts.length && !analysis.labels.length) return;
  if (!confirm('Clear everything you have drawn?')) return;
  pushUndo();
  analysis = { centers: [], fronts: [], labels: [] }; selected = null; hideLabelPanel(); afterEdit();
});

// ═══════════════════════════════════════════════════
// FLOATING CONTROLS — selection bar + label panel
// ═══════════════════════════════════════════════════
const frame = $('frame');
function cssXY(x, y) { const r = cvDraw.getBoundingClientRect(); return [x * r.width / CW, y * r.height / CH]; }
function positionFloats() {
  const bar = $('selCtrls');
  if (!selected || selected.kind === 'label') { bar.hidden = true; }
  else {
    bar.hidden = false;
    $('selKind').textContent = selected.kind === 'center' ? (selected.obj.type === 'H' ? 'High' : 'Low') : ({ cold: 'Cold front', warm: 'Warm front', stationary: 'Stationary front', occluded: 'Occluded front', trough: 'Trough' })[selected.obj.type];
    $('flipBtn').hidden = !(selected.kind === 'front' && selected.obj.type !== 'trough');
    $('centerVal').hidden = selected.kind !== 'center';
    if (selected.kind === 'center' && document.activeElement !== $('centerVal')) $('centerVal').value = selected.obj.value || '';
    const [x, y] = selected.kind === 'center' ? toPx([selected.obj.lon, selected.obj.lat]) : toPx(selected.obj.pts[0]);
    const [cx, cy] = cssXY(x, y);
    bar.style.left = Math.max(6, Math.min(frame.clientWidth - bar.offsetWidth - 6, cx - bar.offsetWidth / 2)) + 'px';
    bar.style.top = (cy > 70 ? cy - 64 : cy + 34) + 'px';
  }
  const lp = $('labelPanel');
  if (!lp.hidden && selected && selected.kind === 'label') {
    const [x, y] = toPx([selected.obj.lon, selected.obj.lat]);
    const [cx, cy] = cssXY(x, y);
    lp.style.left = Math.max(6, Math.min(frame.clientWidth - lp.offsetWidth - 6, cx + 24)) + 'px';
    lp.style.top = Math.max(6, Math.min(frame.clientHeight - lp.offsetHeight - 6, cy - 40)) + 'px';
  }
}
$('flipBtn').addEventListener('click', () => { if (selected && selected.kind === 'front') { pushUndo(); selected.obj.side *= -1; afterEdit(); } });
$('delBtn').addEventListener('click', deleteSelected);
$('centerVal').addEventListener('input', e => { if (selected && selected.kind === 'center') { selected.obj.value = e.target.value.trim(); renderDraw(); saveLocal(); } });
$('centerVal').addEventListener('focus', () => pushUndo());

const WX_PICKS = [51, 63, 67, 79, 73, 45, 1095, 90];
function showLabelPanel(lb, focus = false) {
  const lp = $('labelPanel');
  lp.hidden = false;
  $('lblText').value = lb.text; $('lblFont').value = lb.font; $('lblSize').value = lb.size;
  $('lblColor').value = lb.color; $('lblRot').value = lb.rot || 0; $('lblBgColor').value = lb.bgColor;
  $('lblBold').classList.toggle('is-active', lb.bold); $('lblItalic').classList.toggle('is-active', lb.italic);
  document.querySelectorAll('#lblBg button').forEach(b => b.classList.toggle('is-active', b.dataset.bg === lb.bg));
  $('lblBgColor').hidden = lb.bg !== 'plate';
  $('lblWxRow').hidden = lb.font !== 'CCWxSymbols';
  positionFloats();
  if (focus) { $('lblText').focus(); $('lblText').select(); }
}
function hideLabelPanel() { $('labelPanel').hidden = true; }
function editLabel(fn) {
  if (!selected || selected.kind !== 'label') return;
  fn(selected.obj); renderDraw(); saveLocal();
}
$('lblText').addEventListener('focus', () => pushUndo());
$('lblText').addEventListener('input', e => editLabel(l => { l.text = e.target.value; }));
$('lblFont').addEventListener('change', e => editLabel(l => { pushUndo(); l.font = e.target.value; if (l.font === 'CCWxSymbols' && !/[\uE900-\uEAFF]/.test(l.text)) { l.text = SM.wxChar(63); l.size = 28; } showLabelPanel(l); }));
$('lblSize').addEventListener('input', e => editLabel(l => { l.size = Math.max(10, Math.min(56, +e.target.value || 18)); }));
$('lblColor').addEventListener('input', e => editLabel(l => { l.color = e.target.value; }));
$('lblRot').addEventListener('input', e => editLabel(l => { l.rot = +e.target.value || 0; }));
$('lblBgColor').addEventListener('input', e => editLabel(l => { l.bgColor = e.target.value; }));
$('lblBold').addEventListener('click', () => editLabel(l => { pushUndo(); l.bold = !l.bold; $('lblBold').classList.toggle('is-active', l.bold); }));
$('lblItalic').addEventListener('click', () => editLabel(l => { pushUndo(); l.italic = !l.italic; $('lblItalic').classList.toggle('is-active', l.italic); }));
document.querySelectorAll('#lblBg button').forEach(b => b.addEventListener('click', () => editLabel(l => { pushUndo(); l.bg = b.dataset.bg; showLabelPanel(l); })));
$('lblDelete').addEventListener('click', deleteSelected);
$('lblDone').addEventListener('click', () => { selected = null; hideLabelPanel(); renderDraw(); });
for (const code of WX_PICKS) {
  const b = document.createElement('button');
  b.className = 'wxbtn'; b.textContent = SM.wxChar(code);
  b.style.color = SM.WX_COLORS[SM.wxClass(code)];
  b.addEventListener('click', () => editLabel(l => { pushUndo(); l.text = SM.wxChar(code); l.color = SM.WX_COLORS[SM.wxClass(code)]; showLabelPanel(l); }));
  $('lblWxRow').appendChild(b);
}

// ═══════════════════════════════════════════════════
// STATION TOOLTIP
// ═══════════════════════════════════════════════════
const tip = $('tip');
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const trow = (l, v) => v == null || v === '' ? '' : `<div class="tip-row"><span class="tip-lbl">${l}</span><span>${v}</span></div>`;
function showTip(e, x, y) {
  let best = null, bd = 16;
  for (const it of plotted.concat(thinned)) { const d = Math.hypot(it.x - x, it.y - y); if (d < bd) { bd = d; best = it.ob; } }
  if (!best || !layers.stations || layers.stationMode === 'off') { hideTip(); return; }
  const w = best.wind;
  const wind = w && w.kt != null ? (w.kt === 0 ? 'Calm' : `${w.dir != null ? String(w.dir).padStart(3, '0') + '&deg;' : 'Variable'} ${w.kt} kt${w.gust ? `, gust ${w.gust}` : ''}`) : null;
  tip.innerHTML = `<div class="tip-id"><span>${best.id}</span>${esc(NAMES[best.id] || '')}</div>`
    + trow('Temperature', best.tempC != null ? `${cToF(best.tempC)}&deg;F` : null)
    + trow('Dewpoint', best.dewC != null ? `${cToF(best.dewC)}&deg;F` : null)
    + trow('Feels like', feelsLikeF(best) != null ? `${feelsLikeF(best)}&deg;F` : null)
    + trow('Sea-level pressure', best.slp != null ? `${best.slp.toFixed(1)} mb` : null)
    + trow('Wind', wind)
    + (best.raw ? `<div class="tip-raw">${esc(best.raw)}</div>` : '');
  tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let lx = e.clientX + 16, ly = e.clientY - th / 2;
  if (lx + tw > innerWidth - 8) lx = e.clientX - tw - 16;
  tip.style.left = lx + 'px'; tip.style.top = Math.max(4, Math.min(innerHeight - th - 4, ly)) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

// ═══════════════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════════════
const FRONT_NAMES = { cold: 'Cold front', warm: 'Warm front', stationary: 'Stationary front', occluded: 'Occluded front', trough: 'Trough' };
function creditsText() {
  const land = basemapRes === 'regional' ? 'Coastline © OpenStreetMap contributors' : 'Coastline: Natural Earth';
  return `Observations: Iowa Environmental Mesonet (IEM), NWS, Environment and Climate Change Canada · `
    + (layers.radar ? 'Radar: IEM NEXRAD composite · ' : '')
    + `${land} · State lines: U.S. Census Bureau · Weather symbols: OGC MetOcean DWG World Weather Symbols (CC BY 4.0)`;
}
function legendItems() {
  const items = [];
  if (layers.isobars) items.push({ line: ISOBAR_INK, text: `Isobars, ${layers.isobarStep} mb` });
  if (layers.temp) items.push({ grad: TEMP_SCALE, text: 'Temperature °F, dashed' });
  if (layers.dew) items.push({ grad: DEW_SCALE, text: 'Dewpoint °F' });
  if (layers.feels) items.push({ grad: TEMP_SCALE, text: 'Feels like °F, dotted' });
  if (layers.wind) items.push({ grad: WIND_RAMP, text: `Streamlines, wind 0–${WIND_MAX}+ mph` });
  if (layers.conv) items.push({ grad: { vals: [0, 1], cols: ['#f7f6f2', '#8CC6A6'] }, text: 'Convergence 0.5–4 ×10⁻⁵ s⁻¹' });
  if (layers.radar) items.push({ grad: { vals: [0, 1, 2, 3], cols: ['#04E87A', '#FCF434', '#FC9403', '#FC1C03'] }, text: 'Radar reflectivity' });
  const used = [...new Set(analysis.fronts.map(f => f.type))];
  for (const t of used) items.push({ line: FRONT_COLOR[t], text: FRONT_NAMES[t] });
  return items;
}
function updateLegend() {
  const html = legendItems().map(it => `<div class="cc-legend-chip">${
    it.line ? `<span class="lg-line" style="border-color:${it.line}"></span>`
    : it.grad ? `<span class="lg-gradient" style="background:${gradientCss(it.grad)}"></span>`
    : `<span class="lg-swatch" style="background:${it.swatch}"></span>`}${it.text}</div>`).join('');
  $('legend').innerHTML = `<div class="cc-legend-row">${html}</div><div class="lg-credits">${creditsText()}</div>`;
}

// ═══════════════════════════════════════════════════
// SAVE / OPEN MAP FILE
// ═══════════════════════════════════════════════════
function fmtValid(d) {
  if (!d) return '';
  const mo = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
  return `${String(d.getUTCHours()).padStart(2, '0')}${String(d.getUTCMinutes()).padStart(2, '0')}Z ${d.getUTCDate()} ${mo} ${d.getUTCFullYear()}`;
}
function fileStamp() {
  const d = getValidTime() || new Date();
  return d.toISOString().slice(0, 16).replace(/[-:]/g, '').replace('T', '-') + 'Z';
}
function download(name, href) { const a = document.createElement('a'); a.download = name; a.href = href; a.click(); }

$('saveBtn').addEventListener('click', () => {
  const doc = { format: FILE_FORMAT, version: 1, saved: new Date().toISOString(),
                validTime: getValidTime() ? getValidTime().toISOString() : null,
                view: { ...view }, layers: { ...layers }, analysis, nextId };
  const url = URL.createObjectURL(new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' }));
  download(`surface-analysis_${fileStamp()}.json`, url);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});
$('loadBtn').addEventListener('click', () => $('loadInput').click());
$('loadInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const doc = JSON.parse(await file.text());
    if (doc.format !== FILE_FORMAT) throw new Error('not a Surface Analysis Builder map file');
    pushUndo();
    applyState(doc);
    selected = null; drawing = null; hideLabelPanel();
    syncChips(); updateHint();
    await refreshView();
    setStatus(`Opened ${file.name}${doc.validTime ? ` · drawn for ${fmtValid(new Date(doc.validTime))}` : ''}`);
  } catch (err) {
    setStatus(`Could not open ${file.name}: ${err.message}`, true);
  }
});

// ═══════════════════════════════════════════════════
// PNG EXPORT — composed image at a fixed 3× scale
// ═══════════════════════════════════════════════════
const EXP = { pad: 28, head: 110, legend: 70, foot: 58 };
function drawLegendStrip(c, x, y, w) {
  const items = legendItems();
  c.save(); c.textBaseline = 'middle'; c.font = '13px "Courier Prime"';
  let cx = x, cy = y + 14;
  for (const it of items) {
    const tw = (it.grad ? 72 : 30) + c.measureText(it.text).width + 22;
    if (cx + tw > x + w) { cx = x; cy += 26; }
    let ix = cx;
    if (it.line) { c.strokeStyle = it.line; c.lineWidth = 2.5; c.beginPath(); c.moveTo(ix, cy); c.lineTo(ix + 22, cy); c.stroke(); ix += 30; }
    else if (it.grad) {
      const g = c.createLinearGradient(ix, 0, ix + 62, 0), v0 = it.grad.vals[0], v1 = it.grad.vals[it.grad.vals.length - 1];
      it.grad.vals.forEach((v, k) => g.addColorStop((v - v0) / (v1 - v0), it.grad.cols[k]));
      c.fillStyle = g; c.fillRect(ix, cy - 5, 62, 10); ix += 72;
    } else { c.fillStyle = it.swatch; c.fillRect(ix, cy - 5, 10, 10); ix += 18; }
    c.fillStyle = '#A6A499'; c.fillText(it.text, ix, cy);
    cx += tw;
  }
  c.restore();
}
function exportCanvas() {
  const W = CW + EXP.pad * 2, H = EXP.head + CH + EXP.legend + EXP.foot;
  const off = document.createElement('canvas');
  off.width = W * EXPORT_SCALE; off.height = H * EXPORT_SCALE;
  const c = off.getContext('2d');
  c.scale(EXPORT_SCALE, EXPORT_SCALE);
  c.fillStyle = '#1E2320'; c.fillRect(0, 0, W, H);
  c.font = '700 14px "Courier Prime"'; c.fillStyle = '#2AA87E'; c.fillText('[ contextclimate ]  LIVE', EXP.pad, 34);
  c.font = '700 30px "Zilla Slab"'; c.fillStyle = '#E8E4D9'; c.fillText('Surface Analysis', EXP.pad, 68);
  c.font = '14px "Public Sans"'; c.fillStyle = '#A6A499';
  c.fillText(`Valid ${fmtValid(getValidTime())} · ASOS / AWOS observations`, EXP.pad, 90);

  c.save(); c.translate(EXP.pad, EXP.head);
  c.beginPath(); c.rect(0, 0, CW, CH); c.clip();
  renderBase(c);
  renderRadar(c);
  renderFields(c);
  renderStations(c);
  renderDraw(c, true);
  MAP.drawStamp(c, getValidTime(), dims);
  c.restore();
  c.strokeStyle = 'rgba(232,228,217,0.26)'; c.strokeRect(EXP.pad + 0.5, EXP.head + 0.5, CW - 1, CH - 1);

  drawLegendStrip(c, EXP.pad, EXP.head + CH + 10, CW);
  // Credits wrap at the " · " separators to fit the map width.
  c.font = '12px "Public Sans"'; c.fillStyle = '#948F82';
  const lines = [''];
  for (const part of creditsText().split(' · ')) {
    const tryLine = lines[lines.length - 1] ? lines[lines.length - 1] + ' · ' + part : part;
    if (c.measureText(tryLine).width > CW && lines[lines.length - 1]) lines.push(part);
    else lines[lines.length - 1] = tryLine;
  }
  lines.forEach((t, i) => c.fillText(t, EXP.pad, H - 16 - (lines.length - 1 - i) * 17));
  return off;
}
$('pngBtn').addEventListener('click', () => {
  const off = exportCanvas();
  renderStations();          // restore on-screen hit-testing state
  download(`surface-analysis_${fileStamp()}.png`, off.toDataURL('image/png'));
});

// ═══════════════════════════════════════════════════
// STATUS, REGIONS, REFRESH, INIT
// ═══════════════════════════════════════════════════
function setStatus(msg, err = false) { $('stext').textContent = msg; $('status').classList.toggle('err', err); }
function statusLine() {
  const d = getValidTime();
  return d ? `Valid ${fmtValid(d)} · ${obs.length} stations · ${obsSource}` : 'No observations loaded';
}

function buildRegions() {
  const sel = $('regionSel');
  sel.innerHTML = '<option value="">Jump to…</option><option value="full">Full view</option>'
    + REGIONS.map(r => `<option value="${r.key}">${r.label}</option>`).join('');
  sel.addEventListener('change', () => {
    const v = sel.value; sel.value = '';
    if (!v) return;
    if (v === 'full') { Object.assign(view, { lon: (FULL.west + FULL.east) / 2, lat: (FULL.north + FULL.south) / 2, zoom: 1 }); applyView(); }
    else fitBounds(REGIONS.find(r => r.key === v).bounds);
    refreshView();
  });
}

let refreshing = null;
async function refreshView() {
  applyView();
  saveLocal();
  const run = (async () => {
    await ensureBasemap();
    renderBase();
    renderRadar();
    if (obs.length) computeFields(); else fields = null;
    renderFields();
    renderStations();
    renderDraw();
    updateLegend();
    startPulses();
  })();
  refreshing = run;
  return run;
}

async function loadData() {
  setStatus('Fetching observations…');
  await loadObs();
  if (!obs.length) { setStatus('No observations available — check your connection', true); return; }
  await refreshView();
  setStatus(statusLine());
  $('pngBtn').disabled = false;
}

async function init() {
  loadLocal();
  applyView();
  buildLayerBar(); buildDrawBar(); buildRegions();
  setTool('select');
  try {
    await Promise.all([SM.ready(), document.fonts.ready]);
    await refreshView();
    $('ov').textContent = 'Fetching observations…';
    await loadData();
  } catch (e) {
    console.error(e);
    setStatus('Load failed — see browser console for details', true);
  }
  $('ov').style.display = 'none';
  setInterval(loadData, REFRESH_MS);
}
init();

</script>
