<html lang="en">

<title>Sediment Transport · ContextClimate</title>

<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
[hidden] { display: none !important; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 16px; }
.top .spacer { flex: 1; }
.series { display: flex; gap: 6px; }
.x-link { padding: 6px 11px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: none; gap: 8px; padding: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
.view.is-active { display: grid; }
.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

.pn { display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
.ph { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 3px 6px 3px 10px; border-bottom: 1px solid var(--color-border); flex-wrap: nowrap; }
.pl { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ph .sp { flex: 1; }
.ph .cc-segmented-btn { padding: 5px 10px; font-size: 13px; white-space: nowrap; }
.ph .cc-btn { padding: 5px 11px; font-size: 13px; white-space: nowrap; }
.ph .cc-btn.hot, .controls .cc-btn.hot { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); font-weight: 700; }
.ph .cc-btn.hot:hover { filter: brightness(1.1); }
.ph .cc-btn:disabled { opacity: .4; cursor: default; }
.cw { flex: 1; position: relative; min-height: 0; min-width: 0; }

.tgl::before { content: ''; display: inline-block; width: 10px; height: 10px; border: 1.5px solid var(--color-text-muted);

.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.ph select { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--color-text-primary); min-width: 0;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: 4px; padding: 4px 6px; }

.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }

.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .n { font-family: var(--font-body); font-size: 14px; color: var(--color-text-secondary); line-height: 1.3; }

@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .r.dim .v { font-size: 18px; }
  .card .lg { padding: 6px 0; }
  .card .n { font-size: 13px; }

@media (max-width: 1440px) {
  .top .sub { display: none; }

  .pl.nx { display: none; }

  .slider .sv { display: none; }
  .slider { min-width: 90px; }
  .controls { gap: 6px; }
  .go { min-width: 0; padding: 9px 12px; }
}

//  SEDIMENT PHYSICS — shared by every tab

// Units: SI internally (m, s, kg); grain sizes passed in mm, velocities

    for (var i = 0; i < 40; i++) {

    largestMoving: largestMoving,
    g: g, RHO: RHO, NU: NU, KAPPA: KAPPA, CLASSES: CLASSES, SHAPES: SHAPES, classOf: classOf,
    settling: settling, ustarCrit: ustarCrit, velFromUstar: velFromUstar, ustarFromVel: ustarFromVel,
    thresholds: thresholds, state: state, manningV: manningV, geometry: geometry

})();

      p.y = clamp(p.y, g.surf + 3, g.bedTop - p.r);
      var hz = clamp((g.bedTop - p.y) / water, 0.02, 1);
      p.x += vis * (0.55 + 0.35 * Math.log10(1 + 9 * hz)) * dt;
    } else if (mode === 'settling') {
      p.y = Math.min(p.restY, p.y + clamp(p.ws * 400, 6, 220) * g.scale * dt);
      p.x += vis * 0.2 * dt;
    }
    if (mode !== 'rest' && mode !== 'settling') p.restY = g.bedTop - p.r * (0.35 + 0.4 * p.jit);
    if (p.x > W + p.r) p.x -= W + 2 * p.r;
  }
  function advance(dt) {
    var g = geom(); S.simT += dt;
    parts.forEach(function (p) { stepGrain(p, dt, g); }); stepGrain(tracer, dt, g);
    var vis = 95 * Math.sqrt(S.U) * g.scale;
    streaks.forEach(function (s) { s.x += vis * (0.5 + 0.5 * Math.log10(1 + 9 * s.z)) * dt; if (s.x > W + 40) s.x -= W + 80; });
  }

  // ── drawing ──
  function drawFlume(c, w, h) {
    var sx = w / W, sy = h / H; c.save(); c.scale(sx, sy);
    var g = geom();
    c.fillStyle = '#2b3330'; c.fillRect(0, 0, W, H);
    var mudN = 0, mudTot = 0;
    parts.forEach(function (p) { if (p.cls === 'clay' || p.cls === 'silt') { mudTot++; if (p.mode === 'suspension') mudN++; } });
    var mud = mudTot ? mudN / mudTot : 0;
    var wg = c.createLinearGradient(0, g.surf, 0, g.bedTop);
    wg.addColorStop(0, mixHex(COL.waterTop, COL.mud, mud * 0.75)); wg.addColorStop(1, mixHex(COL.waterBot, '#5a4a32', mud * 0.8));
    c.fillStyle = wg; c.fillRect(0, g.surf, W, g.bedTop - g.surf);
    c.strokeStyle = 'rgba(232,228,217,0.5)'; c.lineWidth = 1.2; c.beginPath();
    for (var x = 0; x <= W; x += 8) { var yy = g.surf + Math.sin(x / 26 + S.simT * 2.5) * Math.min(3, S.U * 0.9); if (x === 0) c.moveTo(x, yy); else c.lineTo(x, yy); }
    c.stroke();
    if (S.U > 0.02) {
      c.strokeStyle = 'rgba(232,228,217,' + clamp(0.08 + S.U * 0.05, 0, 0.3) + ')'; c.lineWidth = 1;
      streaks.forEach(function (s) {
        var y = g.bedTop - (g.bedTop - g.surf) * s.z, L = s.len * (0.4 + 0.6 * Math.log10(1 + 9 * s.z)) * Math.min(2, 0.6 + S.U * 0.5);
        c.beginPath(); c.moveTo(s.x, y); c.lineTo(s.x - L, y); c.stroke();
      });
    }
    var bg = c.createLinearGradient(0, g.bedTop, 0, H); bg.addColorStop(0, '#6d5c45'); bg.addColorStop(1, '#3a3127');
    c.fillStyle = bg; c.fillRect(0, g.bedTop, W, H - g.bedTop);
    parts.forEach(function (p) { drawGrain(c, p); });
    drawGrain(c, tracer, true);
    c.restore();
    // text at screen scale
    c.font = F.mono(13, 700); c.textBaseline = 'top'; c.textAlign = 'left'; c.fillStyle = COL.text;
    c.fillText('flow →', 10, 8);
    c.textAlign = 'right'; c.fillText('1 m deep', w - 10, g.surf * sy + 6);
    c.fillStyle = COL.text2; c.textBaseline = 'bottom'; c.font = F.mono(13); c.fillText('grains not to scale', w - 10, h - 6);
  }
  function drawGrain(c, p, isTracer) {
    var col = CCOL[p.cls];
    if (p.r < 1.6) { c.fillStyle = col; c.globalAlpha = p.mode === 'suspension' ? 0.75 : 0.95; c.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2); c.globalAlpha = 1; }
    else drawGrainAt(c, p.x, p.y, p.r, col, p.rot);
    if (isTracer) { c.strokeStyle = '#FFFFFF'; c.lineWidth = 2; c.beginPath(); c.arc(p.x, p.y, Math.max(p.r, 3) + 5, 0, Math.PI * 2); c.stroke(); }
  }

  // velocity vs grain size, computed for 1 m depth
  var DLO = 0.0005, DHI = 2000, VLO = 0.1, VHI = 1000, CM = { l: 62, r: 14, t: 34, b: 74 };
  var CURVES = null;
  function curves() {
    if (CURVES) return CURVES;
    var er = [], dep = [], sus = [];
    for (var i = 0; i <= 200; i++) {
      var d = DLO * Math.pow(DHI / DLO, i / 200), t = SED.thresholds(d, DEPTH);
      er.push([d, t.erode * 100]); dep.push([d, t.deposit * 100]); sus.push([d, t.suspend * 100]);
    }
    return (CURVES = { er: er, dep: dep, sus: sus });
  }
  function chartX(d, w) { return CM.l + Math.log(d / DLO) / Math.log(DHI / DLO) * (w - CM.l - CM.r); }
  function drawChart(c, w, h) {
    var m = CM;
    var X = function (d) { return chartX(d, w); };
    var Y = function (cms) { return m.t + (1 - Math.log(clamp(cms, VLO, VHI) / VLO) / Math.log(VHI / VLO)) * (h - m.t - m.b); };
    var y0 = h - m.b, x1 = w - m.r, cv = curves(), er = cv.er, dep = cv.dep, sus = cv.sus;
    c.fillStyle = COL.surf; c.fillRect(0, 0, w, h);
    c.save(); c.beginPath(); c.rect(m.l, m.t, x1 - m.l, y0 - m.t); c.clip();
    function band(upper, lower, col, topEdge, botEdge) {
      c.fillStyle = col; c.beginPath();
      upper.forEach(function (p, k) { var px = X(p[0]), py = topEdge ? m.t : Y(p[1]); if (k === 0) c.moveTo(px, py); else c.lineTo(px, py); });
      for (var k = lower.length - 1; k >= 0; k--) c.lineTo(X(lower[k][0]), botEdge ? y0 : Y(lower[k][1]));
      c.closePath(); c.fill();
    }
    band(er, er, 'rgba(240,138,110,0.12)', true, false);
    band(er, dep, 'rgba(127,211,219,0.09)');
    band(dep, dep, 'rgba(217,184,102,0.10)', false, true);
    c.strokeStyle = COL.grid; c.lineWidth = 1;
    [0.0039, 0.0625, 2, 64, 256].forEach(function (d) { c.beginPath(); c.moveTo(X(d), m.t); c.lineTo(X(d), y0); c.stroke(); });
    logTicks(VLO, VHI).forEach(function (v) { c.beginPath(); c.moveTo(m.l, Y(v)); c.lineTo(x1, Y(v)); c.stroke(); });
    function line(pts, col, dash, lw) {
      c.strokeStyle = col; c.lineWidth = lw; c.setLineDash(dash); c.beginPath(); var on = false;
      pts.forEach(function (p) { if (p[1] <= 0) { on = false; return; } if (!on) { c.moveTo(X(p[0]), Y(p[1])); on = true; } else c.lineTo(X(p[0]), Y(p[1])); });
      c.stroke(); c.setLineDash([]);
    }
    line(sus.filter(function (p, k) { return p[1] > er[k][1] * 1.02; }), COL.susp, [2, 3], 1.8);
    line(dep, COL.deposit, [6, 4], 2);
    line(er, COL.erode, [], 2.4);
    c.font = F.mono(14, 700); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(240,138,110,0.95)'; c.fillText('EROSION', X(0.03), Y(400));
    c.fillStyle = 'rgba(127,211,219,0.95)'; c.fillText('TRANSPORT', X(0.004), Y(4));
    c.fillStyle = 'rgba(217,184,102,0.95)'; c.fillText('DEPOSITION', X(60), Y(1));
    if (S.U * 100 >= VLO) {
      var yu = Y(S.U * 100);
      c.strokeStyle = '#FFFFFF'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(m.l, yu); c.lineTo(x1, yu); c.stroke();
      c.fillStyle = '#FFFFFF'; c.font = F.mono(16, 700); c.textAlign = 'right'; c.textBaseline = 'bottom'; c.fillText(fmtCms(S.U), x1 - 4, yu - 3);
    }
    var xt = X(S.probe);
    c.strokeStyle = 'rgba(255,255,255,0.6)'; c.setLineDash([3, 3]); c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(xt, m.t); c.lineTo(xt, y0); c.stroke(); c.setLineDash([]);
    if (S.U * 100 >= VLO) {
      c.fillStyle = MODE_COL[tracer.mode]; c.strokeStyle = '#FFFFFF'; c.lineWidth = 2;
      c.beginPath(); c.arc(xt, Y(S.U * 100), 6, 0, Math.PI * 2); c.fill(); c.stroke();
    }
    c.restore();
    // tracer handle on the axis
    c.fillStyle = '#FFFFFF'; c.beginPath(); c.moveTo(xt, m.t - 2); c.lineTo(xt - 7, m.t - 12); c.lineTo(xt + 7, m.t - 12); c.closePath(); c.fill();
    c.strokeStyle = COL.axis; c.lineWidth = 1; c.beginPath(); c.moveTo(m.l, m.t); c.lineTo(m.l, y0); c.lineTo(x1, y0); c.stroke();
    c.fillStyle = COL.text2; c.font = F.mono(13, 700); c.textAlign = 'right'; c.textBaseline = 'middle';
    logTicks(VLO, VHI).forEach(function (v) { c.fillText(fmtTick(v), m.l - 6, Y(v)); });
    c.textAlign = 'center'; c.textBaseline = 'top';
    [0.001, 0.01, 0.1, 1, 10, 100, 1000].forEach(function (d) { c.fillText(fmtTick(d), X(d), y0 + 5); });
    SED.CLASSES.forEach(function (cl) {
      var a = X(Math.max(cl.lo, DLO)), b = X(Math.min(cl.hi, DHI));
      c.fillStyle = cl.col; c.globalAlpha = 0.9; c.fillRect(a + 1, y0 + 22, b - a - 2, 17); c.globalAlpha = 1;
      c.fillStyle = '#1E2320'; c.font = F.mono(13, 700); c.textBaseline = 'middle';
      var nm = cl.name.toUpperCase();
      if (b - a <= c.measureText(nm).width + 6) nm = { COBBLE: 'COB', BOULDER: 'BLDR', CLAY: 'CL' }[nm] || '';
      if (nm && b - a > c.measureText(nm).width + 4) c.fillText(nm, (a + b) / 2, y0 + 31);
    });
    c.fillStyle = COL.text2; c.font = F.mono(13); c.textBaseline = 'top';
    c.fillText('grain diameter (mm)', (m.l + x1) / 2, y0 + 45);
    c.save(); c.translate(15, (m.t + y0) / 2); c.rotate(-Math.PI / 2); c.textBaseline = 'middle'; c.fillText('water velocity (cm/s)', 0, 0); c.restore();
    c.textAlign = 'left'; c.textBaseline = 'middle'; c.font = F.mono(13, 700);
    c.font = F.mono(13, 700);
    var items = [[COL.erode, [], 'starts moving', 'starts'], [COL.deposit, [6, 4], 'stops moving', 'stops'], [COL.susp, [2, 3], 'suspended', 'suspended']];
    var wOf = function (k) { var t = 0; items.forEach(function (it) { t += 28 + c.measureText(it[k]).width + 14; }); return t - 14; };
    var key = wOf(2) <= w - m.r - m.l ? 2 : 3, lx = Math.max(8, Math.min(m.l + 18, w - m.r - wOf(key))), ly = 15;
    items.forEach(function (it) {
      c.strokeStyle = it[0]; c.lineWidth = 2.2; c.setLineDash(it[1]); c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx + 22, ly); c.stroke(); c.setLineDash([]);
      c.fillStyle = COL.text2; c.fillText(it[key], lx + 28, ly); lx += 28 + c.measureText(it[key]).width + 14;
    });
  }

  function largestMovingGrain() {
    var big = null;
    parts.forEach(function (p) { if ((p.mode === 'traction' || p.mode === 'saltation' || p.mode === 'suspension') && (!big || p.d > big.d)) big = p; });
    return big;
  }
  function waterState() {
    var mudN = 0, mudTot = 0;
    parts.forEach(function (p) { if (p.cls === 'clay' || p.cls === 'silt') { mudTot++; if (p.mode === 'suspension') mudN++; } });
    var f = mudTot ? mudN / mudTot : 0;
    return f === 0 ? 'Clear' : f < 0.4 ? 'Cloudy' : 'Muddy';
  }

  // ── controls ──
  function velFromSl(x) { return VMAX * Math.pow(x / 1000, 2); }
  function slFromVel(v) { return Math.round(1000 * Math.sqrt(clamp(v / VMAX, 0, 1))); }
  function nextSnap() { for (var i = 0; i < SNAPS.length; i++) if (SNAPS[i][0] > S.U + 1e-4) return i; return -1; }
  var ctl = {
    snaps: SNAPS.map(function (s) { return { v: s[0], l: String(Math.round(s[0] * 100)), s: s[1] }; }),
    slider: { min: 0, max: 1000, step: 1, label: 'Water velocity', to: slFromVel, from: velFromSl, fmt: fmtCms },
    eps: 0.002,
    value: function () { return S.U; },
    jump: function (v) { S.tween = null; S.U = v; },
    play: function () {
      if (S.tween) { S.tween = null; return; }
      var i = nextSnap();
      if (i < 0) { S.U = 0; i = 1; }
      S.tween = { from: Math.sqrt(S.U), to: Math.sqrt(SNAPS[i][0]), t: 0, dur: 2.2 }; S.played = true;
    },
    playing: function () { return !!S.tween; },
    atEnd: function () { return S.played && nextSnap() < 0; }
  };

  function mount(v) {
    v.style.gridTemplateColumns = 'minmax(0, 1.25fr) minmax(0, 1fr)';
    v.innerHTML = '<div class="pn"><div class="ph"><span class="pl">Stream bed · side view</span></div><div class="cw" id="flA"><canvas id="flCv"></canvas></div></div>'
      + '<div class="pn"><div class="ph"><span class="pl nx">Velocity vs. grain size</span><span class="sp"></span><span class="pl" id="flTr" style="color:var(--color-text-primary)"></span></div><div class="cw" id="flB"><canvas id="flChart" style="cursor:ew-resize"></canvas></div></div>';
    el.cv = $('flCv'); el.ch = $('flChart');
    var drag = false;
    function setFromX(e) { var p = ptr(e, el.ch); var f = (p[0] - CM.l) / (CW - CM.l - CM.r); setTracer(DLO * Math.pow(DHI / DLO, clamp(f, 0, 1))); }
    el.ch.addEventListener('pointerdown', function (e) { drag = true; el.ch.setPointerCapture(e.pointerId); setFromX(e); });
    el.ch.addEventListener('pointermove', function (e) { if (drag) setFromX(e); });
    el.ch.addEventListener('pointerup', function () { drag = false; });
    makeBed();
  }
  function layout() {
    var a = boxOf($('flA')), b = boxOf($('flB'));
    var g0 = W; W = a.w; H = a.h;
    if (g0 !== W) { var g = geom(); parts.forEach(function (p) { p.r = radius(p.d) * g.scale; p.x = p.x * W / g0; }); tracer.r = Math.max(3, radius(tracer.d) * g.scale); }
    var g2 = geom(); parts.forEach(function (p) { if (p.mode === 'rest') { p.restY = g2.bedTop - p.r * (0.35 + 0.4 * p.jit); p.y = p.restY; } });
    CW = b.w; CH = b.h;
  }
  function frame(dt) {
    if (S.tween) {
      var tw = S.tween; tw.t += dt / tw.dur; var s = lerp(tw.from, tw.to, ease(tw.t)); S.U = s * s;
      if (tw.t >= 1) { S.U = tw.to * tw.to; S.tween = null; }
    }
    advance(dt);
    drawFlume(sizeCanvas(el.cv, W, H), W, H);
    drawChart(sizeCanvas(el.ch, CW, CH), CW, CH);
    var t = 'Tracer ' + fmtMm(S.probe); if ($('flTr').textContent !== t) $('flTr').textContent = t;
  }
  function card() {
    var big = largestMovingGrain();
    return {
      eb: 'Flume · 1 m of water',
      rows: [
        { l: 'Water velocity', v: fmtCms(S.U).replace(' cm/s', ''), u: 'cm/s', n: (S.U).toFixed(2) + ' m/s' },
        { l: 'Largest grain moving', v: big ? SED.classOf(big.d).name : 'None', u: big ? fmtMm(big.d) : '' },
        { l: 'Tracer grain · ' + fmtMm(S.probe) + ' ' + SED.classOf(S.probe).name.toLowerCase(), v: MODE_NAME[tracer.mode], n: 'starts moving at ' + fmtCms(tracer.erode) },
        { l: 'Water', v: waterState() }
      ],
      legend: [['dot', MODE_COL.traction, 'traction · rolling'], ['dot', MODE_COL.saltation, 'saltation · bouncing'], ['dot', MODE_COL.suspension, 'suspension · carried']],
      src: 'Shields threshold (Soulsby &amp; Whitehouse, 1997) with a mud cohesion term calibrated to Hjulstr&ouml;m (1935); settling: Dietrich (1982); depth-averaged log-law velocity. Natural quartz, 2.65 g/cm&sup3;.'
    };
  }
  function png() {
    var big = largestMovingGrain();
    return { name: 'sediment-transport-' + Math.round(S.U * 100) + 'cms', title: 'Sediment Transport',
      sub: 'Flume · 1 m of water · velocity ' + fmtCms(S.U) + ' · tracer ' + fmtMm(S.probe) + ' (' + MODE_NAME[tracer.mode].toLowerCase() + ')',
      readout: fmtCms(S.U), readout2: big ? 'largest moving: ' + SED.classOf(big.d).name.toLowerCase() + ' ' + fmtMm(big.d) : 'nothing moving',
      foot: 'Shields threshold (Soulsby & Whitehouse 1997) + mud cohesion calibrated to Hjulström (1935) · settling: Dietrich (1982)',
      draw: function (c, w, h) {
        var fw = Math.round(w * 0.55);
        c.save(); drawFlume(c, fw, h); c.restore();
        c.save(); c.translate(fw + 12, 0); drawChart(c, w - fw - 12, h); c.restore();
      } };
  }
  // sweep: velocity steps through every snap on a private copy of the bed
  function sweep() {
    var plan = sweepPlan(SNAPS.map(function (s) { return Math.sqrt(s[0]); }), 12, 8);
    var live = { parts: parts, tracer: tracer, streaks: streaks, U: S.U, simT: S.simT };
    var base = { parts: parts.map(function (p) { var q = Object.assign({}, p); q.moving = false; q.mode = 'rest'; q.y = q.restY; return q; }), tracer: Object.assign({}, tracer), streaks: streaks.map(function (s) { return Object.assign({}, s); }) };
    var sc = null, at = -1;
    function swap(fn) {
      var keep = { parts: parts, tracer: tracer, streaks: streaks, U: S.U, simT: S.simT };
      parts = sc.parts; tracer = sc.tracer; streaks = sc.streaks; S.U = sc.U; S.simT = sc.simT;
      try { return fn(); } finally { sc.U = S.U; sc.simT = S.simT; parts = keep.parts; tracer = keep.tracer; streaks = keep.streaks; S.U = keep.U; S.simT = keep.simT; }
    }
    function reset() { sc = { parts: base.parts.map(function (p) { return Object.assign({}, p); }), tracer: Object.assign({}, base.tracer), streaks: base.streaks.map(function (s) { return Object.assign({}, s); }), U: 0, simT: 0 }; at = -1; }
    return {
      name: 'sediment-transport-velocity-sweep', title: 'Sediment Transport', fps: 10, frames: plan.length,
      sub: 'Flume · 1 m of water · velocity stepped from 0 to 600 cm/s · grains not to scale',
      foot: 'Shields threshold (Soulsby & Whitehouse 1997) + mud cohesion calibrated to Hjulström (1935) · settling: Dietrich (1982)',
      prepare: function (k) {
        if (!sc || k < at) reset();
        swap(function () { while (at < k) { at++; for (var i = 0; i < 4; i++) { var s = plan[at].v; S.U = s * s; advance(0.1 / 4); } } });
        return k;
      },
      readout: function (k) { var s = plan[k].v; return fmtCms(s * s); },
      readout2: function () { return swap(function () { var b = largestMovingGrain(); return b ? 'largest moving: ' + SED.classOf(b.d).name.toLowerCase() + ' ' + fmtMm(b.d) : 'nothing moving'; }); },
      body: function (c, w, h) { swap(function () { var fw = Math.round(w * 0.55); c.save(); drawFlume(c, fw, h); c.restore(); c.save(); c.translate(fw + 10, 0); drawChart(c, w - fw - 10, h); c.restore(); }); },
      done: function () { sc = null; }
    };
  }
  return { label: 'Flume', mount: mount, layout: layout, frame: frame, card: card, png: png, sweep: sweep, ctl: ctl,
           _test: { S: S, parts: function () { return parts; }, tracer: function () { return tracer; }, advance: advance } };
})();

shellInit({ title: 'Sediment Transport', sub: 'Stream processes · 1 of 3', eyebrow: 'CONTEXTCLIMATE · STREAM PROCESSES · 1 OF 3', prev: null, next: { t: 'Deposition & Sorting', r: '/earthandspace/deposition-sorting' }, tabs: [FLUME] });
</script>
