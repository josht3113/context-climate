// DOWNLOAD PNG
// ═══════════════════════════════════════════════
function downloadPNG(){
  const st=STATIONS[activeStationId];
  if(mode==='compare'&&!compareYears.length){alert('Add at least one year to export.');return;}
  const period=mode==='single'
    ?`${MONTHS_FULL[activeMonth]} ${currentYear}`
    :mode==='climatology'?`${MONTHS_FULL[activeMonth]} ${fromYear}–${toYear} Avg`
    :`${MONTHS_FULL[activeMonth]} · Compare ${compareYears[0]}–${compareYears[compareYears.length-1]}`;

  // Export at a fixed high-res multiplier, independent of the viewing screen's
  // devicePixelRatio -- otherwise on a standard 1x display the grid gets
  // rendered at 1x and then upscaled into the export canvas, which is what
  // caused the blurry/fuzzy PNGs. Temporarily re-render the source canvas at
  // EXPORT_SCALE so the export is pixel-crisp on any screen.
  const EXPORT_SCALE = 3;
  const origDpr = dpr;
  dpr = EXPORT_SCALE;
  exportCells = true;
  setupCanvas();
  renderActiveHeatmap();

  const cw2=canvas.width/dpr,ch2=canvas.height/dpr;
  const PAD=24,HDR=72,DBAR=22,FTR=36;
  const HLABEL_W=62;
  const ow=PAD+HLABEL_W+cw2+PAD,oh=HDR+DBAR+ch2+FTR;
  // Compare mode's day strip has to span the widest selected year's month
  const mDays=mode==='compare'
    ? Math.max(...compareYears.map(getMonthDaysForYear))
    : getMonthDays();
  const dayCW=CELL_W;

  const off=document.createElement('canvas');
  off.width=ow*EXPORT_SCALE;off.height=oh*EXPORT_SCALE;
  const oc=off.getContext('2d');
  oc.scale(EXPORT_SCALE,EXPORT_SCALE);

  oc.fillStyle='#1E2320';
  oc.fillRect(0,0,ow,oh);

  const sc=activeScale();
  const grad=oc.createLinearGradient(0,0,ow,0);
  sc.vals.forEach((v,i)=>{
    const lo=sc.vals[0],span=sc.vals[sc.vals.length-1]-lo;
    grad.addColorStop((v-lo)/span,sc.cols[i]);
  });
  oc.fillStyle=grad;
  oc.fillRect(0,0,ow,3);

  oc.fillStyle='#E8E4D9';
  oc.font='bold 18px "Barlow Condensed",sans-serif';
  oc.fillText(`${st.label}  ·  Precipitation Heatmap  ·  ${period}`,PAD,28);

  oc.fillStyle='#A6A499';
  oc.font='13px "Barlow Condensed",sans-serif';
  oc.fillText(mode==='compare'
    ? `Daily precipitation totals  ·  liquid equivalent  ·  Data: NOAA ACIS`
    : `Hourly liquid-equivalent precipitation  ·  ${st.tzLabel} local time`,PAD,46);

  oc.fillStyle='#D08425';
  oc.font='bold 12px "Barlow Condensed",sans-serif';
  const tot=document.getElementById('sv-total').textContent;
  const wet=document.getElementById('sv-wetdays').textContent;
  const peak=document.getElementById('sv-peak').textContent;
  oc.fillText(`${document.getElementById('sl-total').textContent}: ${tot}   ${document.getElementById('sl-wetdays').textContent}: ${wet}   ${document.getElementById('sl-peak').textContent}: ${peak}`,PAD,62);

  oc.fillStyle='#948F82';
  oc.font='12px "Barlow Condensed",sans-serif';
  oc.textAlign='right';
  oc.fillText('contextclimate.io',ow-PAD,28);

  // Row labels — hours in single/climatology, one year per strip in compare
  oc.textAlign='right';
  oc.textBaseline='middle';
  oc.font='11px "Barlow Condensed",sans-serif';
  const hLabelX=PAD+HLABEL_W-6;
  if(mode==='compare'){
    oc.font='bold 12px "Barlow Condensed",sans-serif';
    oc.fillStyle='#FFD700';
    compareYears.forEach((year,ri)=>{
      oc.fillText(String(year),hLabelX,HDR+DBAR+(ri+0.5)*compareStripH);
    });
    oc.font='11px "Barlow Condensed",sans-serif';
  }else{
    for(let h=0;h<24;h++){
      oc.fillStyle='#A6A499';
      oc.fillText(HOURS[h],hLabelX,HDR+DBAR+(h+0.5)*CELL_H);
    }
    const footerPNGLabels=[{text:'Total',color:'#D08425'},{text:'Wet',color:'#E8E4D9'}];
    for(let fi=0;fi<FOOTER_ROWS;fi++){
      oc.fillStyle=footerPNGLabels[fi].color;
      oc.fillText(footerPNGLabels[fi].text,hLabelX,HDR+DBAR+CANVAS_HEIGHT+FOOTER_GAP+(fi+0.5)*CELL_H);
    }
  }

  // Day labels
  oc.fillStyle='#A6A499';
  oc.font='11px "Barlow Condensed",sans-serif';
  oc.textAlign='center';
  oc.textBaseline='alphabetic';
  const canvasX=PAD+HLABEL_W;
  for(let d=0;d<mDays;d++) oc.fillText(String(d+1),canvasX+(d+0.5)*dayCW,HDR+DBAR-7);
  oc.fillStyle='#D08425';
  oc.fillText('Tot',canvasX+31*dayCW+AVG_GAP+dayCW/2,HDR+DBAR-7);
  oc.textAlign='left';

  oc.drawImage(canvas,canvasX,HDR+DBAR,cw2,ch2);

  // Restore the on-screen canvas to its normal screen resolution now that
  // we've captured the high-res version into the export canvas above.
  dpr = origDpr;
  exportCells = false;
  setupCanvas();
  renderActiveHeatmap();

  oc.fillStyle=grad;
  oc.fillRect(canvasX,HDR+DBAR+ch2+8,cw2,6);

  oc.fillStyle='#948F82';
  oc.font='11px "Barlow Condensed",sans-serif';
  oc.fillText(`${st.tzLabel} Local Time  ·  Data: IEM ASOS & NOAA ACIS  ·  contextclimate.io`,PAD,oh-8);

  oc.fillStyle=grad;
  oc.fillRect(0,oh-2,ow,2);

  const link=document.createElement('a');
  // Listing every year inline blows past the 255-char filename limit once a
  // big preset is selected, so long selections collapse to a range + count.
  const slug=mode==='compare'
    ? `${MONTHS_SHORT[activeMonth]}_compare_${compareYears.length>6
        ? `${compareYears[0]}-${compareYears[compareYears.length-1]}_${compareYears.length}yr`
        : compareYears.join('-')}`
    : period.replace(/[\s–]/g,'_');
  link.download=`precip-heatmap-${activeStationId}-${slug}.png`;
  link.href=off.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════
// MONTH IN CONTEXT — every year's total for this month
// ═══════════════════════════════════════════════
// One ACIS request per station for the whole period of record, monthly
// sums. A month with any missing day comes back 'M' and is left out, so a
// gap never reads as a dry month.
const monthlyCache=new Map();   // stationId -> { status, by: Map(year -> 12 totals|null) }
const NORMAL_FROM=1991,NORMAL_TO=2020,NORMAL_MIN_YEARS=24;
async function ensureMonthly(stId){
  if(monthlyCache.has(stId))return;
  monthlyCache.set(stId,{status:'loading'});
  try{
    const sid=stId.startsWith('K')?stId.slice(1):stId;
    const r=await fetch('https://data.rcc-acis.org/StnData',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sid,sdate:'por',edate:'por',
        elems:[{name:'pcpn',interval:'mly',duration:'mly',reduce:'sum',maxmissing:0}]})
    });
    if(!r.ok)throw new Error(`ACIS HTTP ${r.status}`);
    const json=await r.json();
    const by=new Map();
    for(const row of(json.data||[])){
      if(!Array.isArray(row)||row.length<2)continue;
      const y=parseInt(row[0].slice(0,4),10),m=parseInt(row[0].slice(5,7),10)-1;
      if(isNaN(y)||isNaN(m))continue;
      if(!by.has(y))by.set(y,new Array(12).fill(null));
      const v=row[1]==='T'?TRACE:parseFloat(row[1]);
      by.get(y)[m]=isNaN(v)?null:v;
    }
    monthlyCache.set(stId,{status:'ok',by});
  }catch(e){
    monthlyCache.set(stId,{status:'err'});
  }
  if(stId===activeStationId)renderContext();
}
function niceStep(raw){
  const p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
function niceDomain(lo,hi,n){
  if(!(hi>lo))hi=lo+1;
  const step=niceStep((hi-lo)/n);
  return{lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step};
}
function ordinal(n){
  const s=['th','st','nd','rd'],v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}
const fIn=v=>(v<TRACE+0.0005?'T':v.toFixed(2))+'"';

function renderContext(){
  const grp=document.getElementById('ctx-grp');
  if(!grp||exportCells)return;
  const mc=monthlyCache.get(activeStationId);
  if(!mc)ensureMonthly(activeStationId);
  if(!mc||mc.status!=='ok'){grp.style.display='none';return;}

  const pts=[];
  for(const[y,months]of mc.by){const v=months[activeMonth];if(v!=null)pts.push({y,v});}
  if(pts.length<5){grp.style.display='none';return;}

  // The month still in progress: its total so far, from the daily totals
  // this view already loaded. Shown, but not ranked -- it can only grow.
  const now=new Date();
  let partial=null;
  if(mode==='single'&&singleData&&currentYear===CURRENT_YEAR&&activeMonth===now.getMonth()
     &&!pts.some(p=>p.y===currentYear)){
    let s=0,n=0;
    for(let d=0;d<getMonthDays();d++){
      const v=singleData.dayTotal[MONTH_START_DOY[activeMonth]+d];
      if(!isNaN(v)){s+=v;n++;}
    }
    if(n)partial={y:currentYear,v:s,days:n};
  }
  grp.style.display='';

  const normSet=pts.filter(p=>p.y>=NORMAL_FROM&&p.y<=NORMAL_TO);
  const normal=normSet.length>=NORMAL_MIN_YEARS?normSet.reduce((a,p)=>a+p.v,0)/normSet.length:null;

  const all=partial?pts.concat([partial]):pts.slice();
  const yrs=pts.map(p=>p.y);
  const y0=Math.min(...yrs),y1=Math.max(...yrs);
  const hl=mode==='single'?new Set([currentYear])
         :mode==='climatology'?new Set(all.filter(p=>p.y>=fromYear&&p.y<=toYear).map(p=>p.y))
         :new Set(compareYears);
  document.getElementById('ctx-label').textContent=`${MONTHS_FULL[activeMonth]} totals · ${y0}–${y1}`;

  // Dot plot: one dot per year, stacked in value bins from zero
  const cv=document.getElementById('ctx-canvas');
  const W=Math.max(160,cv.parentElement.clientWidth);
  const dom=niceDomain(0,Math.max(...all.map(p=>p.v)),4);
  let D=8;
  const binsFor=d=>Math.max(8,Math.floor((W-8)/(d+1)));
  let nb=binsFor(D),stacks;
  const place=()=>{
    stacks=new Map();
    for(const p of all.slice().sort((a,b)=>(hl.has(a.y)-hl.has(b.y))||a.y-b.y)){
      const b=Math.round((p.v-dom.lo)/(dom.hi-dom.lo)*(nb-1));
      if(!stacks.has(b))stacks.set(b,[]);
      stacks.get(b).push(p);
    }
    return Math.max(...[...stacks.values()].map(s=>s.length));
  };
  let tall=place();
  while(tall*(D+1)>72&&D>4){D--;nb=binsFor(D);tall=place();}
  const H=tall*(D+1)+6;
  cv.style.width=W+'px';cv.style.height=H+'px';
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  const c=cv.getContext('2d');
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);
  const bx=b=>4+(b+0.5)*((W-8)/nb);
  const xOf=v=>Math.round(4+(v-dom.lo)/(dom.hi-dom.lo)*(W-8))+0.5;
  for(const[b,stack]of stacks){
    stack.forEach((p,i)=>{
      const cx=bx(b),cy=H-3-(i+0.5)*(D+1);
      const[r,g,bb]=getColorRGB(p.v,SCALE_MONTH_TOTAL);
      const on=hl.has(p.y);
      c.globalAlpha=on||!hl.size?1:0.4;
      c.fillStyle=`rgb(${r},${g},${bb})`;
      c.beginPath();c.arc(cx,cy,D/2,0,Math.PI*2);c.fill();
      // Hairline ring so the near-black dry months stay visible on the card
      c.strokeStyle='rgba(232,228,217,0.28)';c.lineWidth=1;
      c.beginPath();c.arc(cx,cy,D/2-0.5,0,Math.PI*2);c.stroke();
      if(on&&mode!=='climatology'){
        c.globalAlpha=1;c.strokeStyle='#FFFFFF';c.lineWidth=2;
        if(p===partial)c.setLineDash([2,2]);
        c.beginPath();c.arc(cx,cy,D/2+1.5,0,Math.PI*2);c.stroke();c.setLineDash([]);
      }
    });
  }
  c.globalAlpha=1;
  // Reference line: the selected range's mean in Multi-Year Avg, the
  // 1991-2020 average otherwise
  const sel=all.filter(p=>hl.has(p.y));
  const refV=mode==='climatology'?(sel.length?sel.reduce((a,p)=>a+p.v,0)/sel.length:null):normal;
  const key=document.getElementById('ctx-k');
  if(refV!=null){
    c.strokeStyle='#D08425';c.lineWidth=2;c.setLineDash([3,3]);
    c.beginPath();c.moveTo(xOf(refV),0);c.lineTo(xOf(refV),H);c.stroke();c.setLineDash([]);
    document.getElementById('ctx-k-t').textContent=
      `${mode==='climatology'?`${fromYear}–${toYear}`:`${NORMAL_FROM}–${NORMAL_TO}`} avg ${fIn(refV)}`;
    key.style.display='';
  }else key.style.display='none';
  const dp=dom.step<0.1?2:dom.step<1?1:0;
  document.getElementById('ctx-lo').textContent=dom.lo.toFixed(dp)+'"';
  document.getElementById('ctx-hi').textContent=dom.hi.toFixed(dp)+'"';

  // Readout. Ranks count from the nearer end; equal totals share a rank.
  const rankOf=p=>{
    const n=pts.length,wet=1+pts.filter(q=>q.v>p.v).length,dry=1+pts.filter(q=>q.v<p.v).length;
    const tie=pts.filter(q=>q.v===p.v).length>1?' (tie)':'';
    return wet<=dry?`${ordinal(wet)} wettest of ${n}${tie}`:`${ordinal(dry)} driest of ${n}${tie}`;
  };
  const pctN=v=>normal?`${Math.round(v/normal*100)}% of ${NORMAL_FROM}–${NORMAL_TO} avg`:'';
  let v='',r='';
  if(mode==='single'){
    const p=pts.find(q=>q.y===currentYear);
    if(p){
      v=`${currentYear}: ${fIn(p.v)}`;
      r=[rankOf(p),pctN(p.v)].filter(Boolean).join(' · ');
    }else if(partial){
      v=`${currentYear}: ${fIn(partial.v)} so far`;
      const k=pts.filter(q=>q.v<partial.v).length;
      r=`${partial.days} day${partial.days>1?'s':''} · `+(k?`wetter than ${k} of ${pts.length} full months`:pctN(partial.v)||'no full months below it yet');
    }else{
      v=`${currentYear}: ${currentYear===CURRENT_YEAR&&activeMonth>=now.getMonth()?'no data yet':'incomplete record'}`;
    }
  }else if(mode==='climatology'){
    if(sel.length){
      v=`${fromYear}–${toYear}: ${fIn(refV)} avg`;
      r=`${sel.length} of ${all.length} years`;
    }
  }else{
    const s=pts.filter(p=>hl.has(p.y));
    if(s.length){
      const hi=s.reduce((a,p)=>p.v>a.v?p:a),lo=s.reduce((a,p)=>p.v<a.v?p:a);
      v=`Wettest: ${hi.y} ${fIn(hi.v)}`;
      r=`Driest: ${lo.y} ${fIn(lo.v)}`;
    }
  }
  document.getElementById('ctx-v').textContent=v;
  document.getElementById('ctx-r').textContent=r;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function init(){
  const msSingle=document.getElementById('month-select');
  const msClimo =document.getElementById('month-select-climo');
  const msCmp   =document.getElementById('month-select-compare');
  for(let m=0;m<12;m++){
    const o1=document.createElement('option');o1.value=m;o1.textContent=MONTHS_FULL[m];msSingle.appendChild(o1);
    const o2=document.createElement('option');o2.value=m;o2.textContent=MONTHS_FULL[m];msClimo.appendChild(o2);
    const o3=document.createElement('option');o3.value=m;o3.textContent=MONTHS_FULL[m];msCmp.appendChild(o3);
  }
  msSingle.value=activeMonth;msClimo.value=activeMonth;msCmp.value=activeMonth;

  const yrSel  =document.getElementById('year-select');
  const fromSel=document.getElementById('from-year');
  const toSel  =document.getElementById('to-year');
  const cmpSel =document.getElementById('compare-year-add');
  for(let y=CURRENT_YEAR;y>=FIRST_YEAR;y--){
    const o=document.createElement('option');o.value=y;o.textContent=y;yrSel.appendChild(o);
    const o1=document.createElement('option');o1.value=y;o1.textContent=y;fromSel.appendChild(o1);
    const o2=document.createElement('option');o2.value=y;o2.textContent=y;toSel.appendChild(o2);
    const o3=document.createElement('option');o3.value=y;o3.textContent=y;cmpSel.appendChild(o3);
  }
  yrSel.value=currentYear;fromSel.value=fromYear;toSel.value=toYear;
  initSearch();

  requestAnimationFrame(()=>{
    setupCanvas();renderHourLabels();renderDayLabels();renderLegend();updateTitle();
    loadSingleYear(currentYear);
  });

  const relayout=()=>{
    dpr=window.devicePixelRatio||1;
    setupCanvas();renderHourLabels();renderDayLabels();renderLegend();
    if(mode==='compare')updateCompareValuesBtn();
    const hasData=mode==='single'?!!singleData:mode==='climatology'?!!climoData:compareYears.length>0;
    if(hasData) renderActiveHeatmap();
  };
  window.addEventListener('resize',relayout);
  // Keyed on offsetHeight, which a scrollbar inside the stage doesn't change,
  // so a scrollbar appearing can't re-trigger a fit.
  let lastStage='';
  if(window.ResizeObserver)new ResizeObserver(()=>{
    const st=document.getElementById('hm-stage');
    const key=st.offsetWidth+'x'+st.offsetHeight;
    if(key!==lastStage){lastStage=key;relayout();}
  }).observe(document.getElementById('hm-stage'));
}

init();
</script>
