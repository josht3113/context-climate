<body>

  <a class="back-link" href="/earthandspace">← Earth &amp; Space</a>

  <header>
    <p class="eyebrow">Plate Tectonics · ESS2</p>
    <h1>Seafloor Spreading</h1>
    <p class="subtitle">Magma rises at the mid-ocean ridge, solidifies into new oceanic crust, and carries a frozen record of Earth's magnetic field. Drag the timeline to watch the polarity record accumulate.</p>
  </header>

  <div class="canvas-wrapper">
    <canvas id="main-canvas" width="960" height="700"></canvas>
  </div>

  <div class="controls">
    <div class="mode-row">
      <span class="ctrl-label">View Mode</span>
      <button class="mode-btn active-pol" id="btn-pol">Magnetic Polarity</button>
      <button class="mode-btn" id="btn-age">Crustal Age</button>
      <div class="mode-sep"></div>
      <button class="mode-btn" id="btn-heat">Heat Flow: Off</button>
    </div>
    <div class="scrubber-row">
      <button id="play-btn" title="Play/Pause">▶</button>
      <span class="scrub-end">0 Ma</span>
      <input type="range" id="scrubber" min="0.04" max="5" step="0.01" value="5">
      <span class="scrub-end">5 Ma</span>
      <span id="time-display">5.00 Ma</span>
    </div>
  </div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════════════════════════════════════

const CW = 960, CH = 700;
const CX = CW / 2;               // 480

// Panel Y boundaries
const XS0 = 0,   XS1 = 450;    // Cross-section
const SP0 = 450, SP1 = 476;    // Separator (26px — room for readable labels)
const TD0 = 476, TD1 = 642;    // Top-down
const IB0 = 642, IB1 = 700;    // Info bar

const SR   = 88;    // Spreading rate: pixels per Ma
const MAXAGE = 5;   // Ma
const CT   = 76;    // Crust thickness (px)
const SFB  = 264;   // Seafloor base Y for formula

// ══════════════════════════════════════════════════════════════════════════════
// GEOMAGNETIC POLARITY TIMESCALE  0–5 Ma  (Gradstein et al. 2012)
// ══════════════════════════════════════════════════════════════════════════════

const GPTS = [
  {s:0,     e:0.773, nm:'Brunhes',   n:true  },
  {s:0.773, e:0.988, nm:'Matuyama',  n:false },
  {s:0.988, e:1.072, nm:'Jaramillo', n:true  },
  {s:1.072, e:1.778, nm:'Matuyama',  n:false },
  {s:1.778, e:1.945, nm:'Olduvai',   n:true  },
  {s:1.945, e:2.581, nm:'Matuyama',  n:false },
  {s:2.581, e:3.032, nm:'Gauss',     n:true  },
  {s:3.032, e:3.116, nm:'Kaena',     n:false },
  {s:3.116, e:3.207, nm:'Gauss',     n:true  },
  {s:3.207, e:3.330, nm:'Mammoth',   n:false },
  {s:3.330, e:3.596, nm:'Gauss',     n:true  },
  {s:3.596, e:4.187, nm:'Gilbert',   n:false },
  {s:4.187, e:4.300, nm:'Cochiti',   n:true  },
  {s:4.300, e:4.493, nm:'Gilbert',   n:false },
  {s:4.493, e:4.631, nm:'Nunivak',   n:true  },
  {s:4.631, e:4.799, nm:'Gilbert',   n:false },
  {s:4.799, e:4.896, nm:'Sidufjall', n:true  },
  {s:4.896, e:4.998, nm:'Gilbert',   n:false },
  {s:4.998, e:5.000, nm:'Thvera',    n:true  },
];

function polarityAt(age) {
  for (const iv of GPTS) { if (age >= iv.s && age < iv.e) return iv; }
  return GPTS[GPTS.length-1];
}

// ══════════════════════════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════════════════════════

let mode     = 'polarity'; // 'polarity' | 'age'
let showHeat = false;
let timeS    = 5.0;
let playing  = false;
let lastTS   = null;

// ══════════════════════════════════════════════════════════════════════════════
// GEOMETRY
// ══════════════════════════════════════════════════════════════════════════════

function sfY(x) {
  const dist = Math.abs(x - CX);
  const age  = dist / SR;
  const ridge  = -80 * Math.exp(-Math.pow(age * 1.45, 2));
  const rift   =  20 * Math.exp(-Math.pow(age * 27,   2));
  const sub    =  33 * Math.sqrt(Math.max(age, 0.005));
  return SFB + ridge + rift + sub;
}
function cbY(x) { return sfY(x) + CT; }

// Pre-sample
const SFY = new Float32Array(CW);
const CBY = new Float32Array(CW);
for (let x=0; x<CW; x++) { SFY[x]=sfY(x); CBY[x]=sfY(x)+CT; }

function sedThk(age) { return Math.min(22, 5.5 * Math.sqrt(age)); }

// ══════════════════════════════════════════════════════════════════════════════
// COLORS
// ══════════════════════════════════════════════════════════════════════════════

function polColor(isN) {
  return isN ? '#161929' : '#8e97ae';
}

const AGE_RAMP = [
  [0,   [255,55,0  ]],
  [0.8, [255,138,0 ]],
  [1.8, [228,208,0 ]],
  [2.6, [55,195,55 ]],
  [3.6, [0,128,255 ]],
  [5.0, [105,0,185 ]],
];
function ageCol(age, a=1) {
  const r = AGE_RAMP;
  for (let i=0; i<r.length-1; i++) {
    if (age >= r[i][0] && age <= r[i+1][0]) {
      const t = (age-r[i][0]) / (r[i+1][0]-r[i][0]);
      const c = r[i][1].map((v,j) => Math.round(v + t*(r[i+1][1][j]-v)));
      return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
    }
  }
  return `rgba(105,0,185,${a})`;
}

// ══════════════════════════════════════════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════════════════════════════════════════

// Water drift
const WP = Array.from({length:60}, () => ({
  x: Math.random()*CW, y: Math.random()*190,
  vx: (Math.random()-.5)*.12, vy: -.07-Math.random()*.1,
  r: .7+Math.random()*1.3, op: .03+Math.random()*.07
}));

// Vent plumes (two vents flanking rift)
const VX = [CX-10, CX+10];
function makeVent(i) {
  const vi=i%2;
  return {vi, x:VX[vi]+(Math.random()-.5)*5, y:SFY[VX[vi]]-Math.random()*50,
    vx:(Math.random()-.5)*.28, vy:-.52-Math.random()*.6,
    r:1.4+Math.random()*2.2, op:.38+Math.random()*.3,
    maxY: SFY[VX[vi]]-50-Math.random()*35};
}
const VP = Array.from({length:36}, (_,i) => makeVent(i));

// Magma upwelling
function makeUp() {
  return {x:CX+(Math.random()-.5)*13, y:400+Math.random()*40,
    vy:-.62-Math.random()*.5, r:1.8+Math.random()*2.2,
    op:.7+Math.random()*.28, life:Math.random()};
}
const UP = Array.from({length:22}, () => { const p=makeUp(); p.y-=Math.random()*100; return p; });

function tickParticles() {
  WP.forEach(p => {
    p.x+=p.vx; p.y+=p.vy;
    if (p.y<-4) { p.y=190; p.x=Math.random()*CW; }
    if (p.x<0) p.x=CW; if (p.x>CW) p.x=0;
  });
  VP.forEach((p,i) => {
    p.y+=p.vy; p.x+=p.vx; p.op-=.006;
    if (p.op<=0||p.y<p.maxY) { Object.assign(p,makeVent(i)); }
  });
  UP.forEach(p => {
    p.y+=p.vy; p.life-=.011; p.op=Math.max(0,p.life*.9);
    if (p.life<=0||p.y<SFY[CX]-4) Object.assign(p,makeUp());
  });
}

// ══════════════════════════════════════════════════════════════════════════════
// DRAWING UTILITIES
// ══════════════════════════════════════════════════════════════════════════════

function arrow(ctx,x1,y1,x2,y2,col,lw,hs) {
  const a=Math.atan2(y2-y1,x2-x1);
  ctx.save();
  ctx.strokeStyle=ctx.fillStyle=col; ctx.lineWidth=lw; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x1,y1);
  ctx.lineTo(x2-Math.cos(a)*hs*.75, y2-Math.sin(a)*hs*.75); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-Math.cos(a-.42)*hs, y2-Math.sin(a-.42)*hs);
  ctx.lineTo(x2-Math.cos(a+.42)*hs, y2-Math.sin(a+.42)*hs);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// Fill a crust band between x1 and x2 using SFY/CBY
function fillCrustBand(ctx, x1, x2, col) {
  if (x2<=x1) return;
  const i1=Math.max(0,Math.floor(x1)), i2=Math.min(CW-1,Math.ceil(x2));
  if (i2<=i1) return;
  ctx.beginPath();
  ctx.moveTo(i1, SFY[i1]);
  for (let x=i1+1; x<=i2; x++) ctx.lineTo(x, SFY[x]);
  ctx.lineTo(i2, CBY[i2]);
  for (let x=i2-1; x>=i1; x--) ctx.lineTo(x, CBY[x]);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}

// ══════════════════════════════════════════════════════════════════════════════
// CROSS-SECTION
// ══════════════════════════════════════════════════════════════════════════════

function drawXS(ctx, ts) {

  // ── 1. Water column ──────────────────────────────────────────────────────
  const wg = ctx.createLinearGradient(0,0,0,XS1);
  wg.addColorStop(0,   '#030610');
  wg.addColorStop(.12, '#040912');
  wg.addColorStop(.45, '#040d1f');
  wg.addColorStop(1,   '#050f24');
  ctx.fillStyle=wg; ctx.fillRect(0,0,CW,XS1);

  // Subtle depth layers
  for (let i=0;i<4;i++) {
    const y=28+i*42;
    const bg=ctx.createLinearGradient(0,y-10,0,y+10);
    bg.addColorStop(0,'rgba(0,25,70,0)'); bg.addColorStop(.5,'rgba(0,25,70,0.045)'); bg.addColorStop(1,'rgba(0,25,70,0)');
    ctx.fillStyle=bg; ctx.fillRect(0,y-10,CW,20);
  }

  // Water particles
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,CW,XS1); ctx.clip();
  WP.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(120,180,240,${p.op})`; ctx.fill();
  });
  ctx.restore();

  // ── 2. Mantle ─────────────────────────────────────────────────────────────
  ctx.beginPath(); ctx.moveTo(0,CBY[0]);
  for (let x=1;x<CW;x++) ctx.lineTo(x,CBY[x]);
  ctx.lineTo(CW,XS1); ctx.lineTo(0,XS1); ctx.closePath();
  const mg=ctx.createLinearGradient(0,310,0,XS1);
  mg.addColorStop(0,'#130804'); mg.addColorStop(.5,'#1e0d06'); mg.addColorStop(1,'#2c1108');
  ctx.fillStyle=mg; ctx.fill();

  // ── 3. Mantle convection arrows ───────────────────────────────────────────
  const ma = .22+.08*Math.sin(ts*.00085);
  // Rising
  arrow(ctx, CX,XS1-6, CX,400, `rgba(210,75,20,${ma})`, 5.5, 18);
  // Lateral spreading at base of lithosphere
  arrow(ctx, CX+22,392, CX+220,392, `rgba(190,65,15,${ma*.85})`, 3.5, 14);
  arrow(ctx, CX-22,392, CX-220,392, `rgba(190,65,15,${ma*.85})`, 3.5, 14);

  // ── 4. Magma chamber ─────────────────────────────────────────────────────
  const pulse = .5+.5*Math.sin(ts*.0013);
  const mcY=386, rX=120+pulse*8, rY=46+pulse*4;

  for (let i=5;i>=0;i--) {
    ctx.save(); ctx.translate(CX,mcY); ctx.scale(1+i*.13,1+i*.13);
    ctx.beginPath(); ctx.ellipse(0,0,rX,rY,0,0,Math.PI*2);
    const g=ctx.createRadialGradient(0,0,0,0,0,rX);
    g.addColorStop(0,`rgba(255,138,28,${.30-i*.042})`); g.addColorStop(1,'rgba(255,55,0,0)');
    ctx.fillStyle=g; ctx.fill(); ctx.restore();
  }
  ctx.save(); ctx.translate(CX,mcY);
  ctx.beginPath(); ctx.ellipse(0,0,rX,rY,0,0,Math.PI*2);
  const cg=ctx.createRadialGradient(-rX*.12,-rY*.3,0,0,0,rX);
  cg.addColorStop(0,'#ffd04a'); cg.addColorStop(.35,'#ff8910'); cg.addColorStop(.78,'#dd3000'); cg.addColorStop(1,'#991000');
  ctx.fillStyle=cg; ctx.fill(); ctx.restore();

  // Feeder dike
  const dkTop=SFY[CX]+1, dkBot=mcY-rY;
  if (dkBot>dkTop) {
    const dg=ctx.createLinearGradient(0,dkTop,0,dkBot);
    dg.addColorStop(0,'rgba(255,100,0,0.0)'); dg.addColorStop(.25,'rgba(255,100,0,0.35)');
    dg.addColorStop(.7,'rgba(255,140,0,0.52)'); dg.addColorStop(1,'rgba(255,160,30,0.65)');
    ctx.fillStyle=dg; ctx.fillRect(CX-9,dkTop,18,dkBot-dkTop);
    // Upwelling particles in dike
    UP.forEach(p => {
      if (p.y>dkTop&&p.y<dkBot) {
        const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2.5);
        pg.addColorStop(0,`rgba(255,195,50,${p.op})`); pg.addColorStop(1,'rgba(255,90,0,0)');
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.5,0,Math.PI*2);
        ctx.fillStyle=pg; ctx.fill();
      }
    });
  }

  // ── 5. Base crust fill (where crust exists) ───────────────────────────────
  const maxDist = timeS * SR;
  fillCrustBand(ctx, CX-maxDist, CX+maxDist, '#1b1e2c');

  // ── 6. Magnetic / age stripes ─────────────────────────────────────────────
  if (mode==='polarity') {
    for (const iv of GPTS) {
      if (iv.s>=timeS) break;
      const ce=Math.min(iv.e,timeS), d1=iv.s*SR, d2=ce*SR;
      const col=polColor(iv.n);
      fillCrustBand(ctx, CX+d1, CX+d2, col);
      fillCrustBand(ctx, CX-d2, CX-d1, col);
    }
  } else {
    // Age: scan every 3px for smooth gradient
    for (let dx=0; dx<=maxDist; dx+=3) {
      const dx2=Math.min(dx+3,maxDist), age=((dx+dx2)*.5)/SR;
      const col=ageCol(age);
      fillCrustBand(ctx, CX+dx, CX+dx2, col);
      fillCrustBand(ctx, CX-dx2, CX-dx, col);
    }
  }

  // ── 7. Sediment layer ────────────────────────────────────────────────────
  for (let dx=4; dx<=maxDist; dx+=3) {
    const dx2=Math.min(dx+3,maxDist), age=((dx+dx2)*.5)/SR;
    const thk=sedThk(age); if (thk<0.6) continue;
    const sc=`rgba(108,92,70,0.80)`;
    const rx1=Math.max(0,CX+dx), rx2=Math.min(CW,CX+dx2);
    if (rx2>rx1) {
      ctx.beginPath(); ctx.moveTo(rx1,SFY[rx1]);
      for (let x=rx1+1;x<=rx2;x++) ctx.lineTo(x,SFY[x]);
      ctx.lineTo(rx2,SFY[rx2]-thk);
      for (let x=rx2-1;x>=rx1;x--) ctx.lineTo(x,SFY[x]-thk);
      ctx.closePath(); ctx.fillStyle=sc; ctx.fill();
    }
    const lx1=Math.max(0,CX-dx2), lx2=Math.min(CW,CX-dx);
    if (lx2>lx1) {
      ctx.beginPath(); ctx.moveTo(lx1,SFY[lx1]);
      for (let x=lx1+1;x<=lx2;x++) ctx.lineTo(x,SFY[x]);
      ctx.lineTo(lx2,SFY[lx2]-thk);
      for (let x=lx2-1;x>=lx1;x--) ctx.lineTo(x,SFY[x]-thk);
      ctx.closePath(); ctx.fillStyle=sc; ctx.fill();
    }
  }

  // ── 8. Seafloor surface topography ───────────────────────────────────────
  // Surface rock
  ctx.beginPath(); ctx.moveTo(0,SFY[0]);
  for (let x=1;x<CW;x++) ctx.lineTo(x,SFY[x]);
  ctx.lineTo(CW,XS1); ctx.lineTo(0,XS1); ctx.closePath();
  const sfg=ctx.createLinearGradient(0,185,0,345);
  sfg.addColorStop(0,'#272b3c'); sfg.addColorStop(.5,'#1e212f'); sfg.addColorStop(1,'#16192a');
  ctx.fillStyle=sfg; ctx.fill();

  // Water–rock interface highlight
  ctx.beginPath(); ctx.moveTo(0,SFY[0]);
  for (let x=1;x<CW;x++) ctx.lineTo(x,SFY[x]);
  ctx.strokeStyle='rgba(90,120,175,0.28)'; ctx.lineWidth=2; ctx.stroke();

  // Ridge volcanic glow (near rift)
  for (let x=CX-70; x<=CX+70; x++) {
    const n=Math.abs(x-CX)/70, g=(1-n*n)*.22;
    if (g<.01) continue;
    ctx.fillStyle=`rgba(190,145,65,${g})`;
    ctx.fillRect(x,SFY[x]-1,1,4);
  }
  // Rift lava
  for (let x=CX-11; x<=CX+11; x++) {
    const n=1-Math.abs(x-CX)/11;
    ctx.fillStyle=`rgba(255,80,0,${n*.38})`;
    ctx.fillRect(x,SFY[x],1,5);
  }

  // ── 9. Vent plumes ───────────────────────────────────────────────────────
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,CW,XS1); ctx.clip();
  VP.forEach(p => {
    const pg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3.5);
    pg.addColorStop(0,`rgba(210,228,255,${p.op})`); pg.addColorStop(1,'rgba(170,205,255,0)');
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*3.5,0,Math.PI*2);
    ctx.fillStyle=pg; ctx.fill();
  });
  ctx.restore();

  // ── 10. Divergence arrows ─────────────────────────────────────────────────
  const arY = SFY[CX+22]-38;
  const ap  = .75+.25*Math.sin(ts*.001+1.2);
  const ac  = `rgba(240,238,233,${.9*ap})`;
  arrow(ctx, CX+38,arY, CX+180,arY, ac, 5.5, 22);
  arrow(ctx, CX-38,arY, CX-180,arY, ac, 5.5, 22);

  // ── 11. Heat overlay ──────────────────────────────────────────────────────
  if (showHeat) {
    const hg=ctx.createRadialGradient(CX,SFY[CX],0,CX,SFY[CX],MAXAGE*SR*.88);
    hg.addColorStop(0,  'rgba(255,65,0,0.36)');
    hg.addColorStop(.14,'rgba(255,115,0,0.22)');
    hg.addColorStop(.38,'rgba(200,55,0,0.1)');
    hg.addColorStop(.68,'rgba(100,0,100,0.04)');
    hg.addColorStop(1,  'rgba(0,0,80,0)');
    ctx.fillStyle=hg; ctx.fillRect(0,0,CW,XS1);
  }

  // ── 12. Labels ───────────────────────────────────────────────────────────
  ctx.save();

  // Water column
  ctx.font='700 19px "Barlow Condensed",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(90,145,215,0.52)';
  ctx.fillText('WATER COLUMN', 18, 62);

  // Mid-ocean ridge label — push high above arrows
  const ridgeTopY=SFY[CX+16]-18;
  ctx.font='700 19px "Barlow Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='bottom';
  ctx.fillStyle='rgba(195,168,100,0.88)';
  ctx.fillText('MID-OCEAN RIDGE', CX, ridgeTopY-52);
  ctx.strokeStyle='rgba(195,168,100,0.38)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(CX,ridgeTopY-50); ctx.lineTo(CX,ridgeTopY-6); ctx.stroke();

  // Divergent plate motion — sits directly below MID-OCEAN RIDGE, above rift valley
  // MID-OCEAN RIDGE bottom = ridgeTopY-52; this label's top = ridgeTopY-52+4
  const divLabelY = ridgeTopY - 52 + 4;
  ctx.font='700 16px "Barlow Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(240,238,233,0.70)';
  ctx.fillText('DIVERGENT PLATE MOTION', CX, divLabelY);

  // Rift valley
  ctx.font='700 18px "Barlow Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,125,55,0.88)';
  ctx.fillText('RIFT VALLEY', CX, SFY[CX]+10);

  // Oceanic crust labels (left+right) — brighter, Math.round for sharpness
  const clY=(SFY[CX+150]+CBY[CX+150])*.5;
  ctx.font='700 17px "Barlow Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(240,238,233,0.72)';
  ctx.save(); ctx.translate(Math.round(CX-225),Math.round(clY)); ctx.rotate(-Math.PI/2);
  ctx.fillText('OCEANIC CRUST',0,0); ctx.restore();
  ctx.save(); ctx.translate(Math.round(CX+225),Math.round(clY)); ctx.rotate(-Math.PI/2);
  ctx.fillText('OCEANIC CRUST',0,0); ctx.restore();

  // Mantle label
  const mly=(CBY[CX]+XS1)*.5+6;
  ctx.font='700 19px "Barlow Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(205,90,35,0.58)';
  ctx.fillText('UPPER MANTLE / ASTHENOSPHERE', CX, mly);

  // Magma chamber label — clamped to stay inside panel
  const mcLabelY = Math.min(Math.round(mcY+rY+18), XS1-14);
  ctx.font='700 19px "Barlow Condensed",sans-serif';
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,180,65,0.85)';
  ctx.fillText('MAGMA CHAMBER', CX, mcLabelY);

  // Chron name labels in crust stripes — Math.round for sharpness
  GPTS.forEach(iv => {
    if (iv.s>=timeS) return;
    const ce=Math.min(iv.e,timeS), d1=iv.s*SR, d2=ce*SR;
    const w=d2-d1; if (w<20) return;
    const midD=(d1+d2)*.5;
    const rmx=CX+midD, lmx=CX-midD;
    const mY=(SFY[Math.min(CW-1,Math.round(rmx))]+CBY[Math.min(CW-1,Math.round(rmx))])*.5;
    const fs=Math.min(15,Math.max(11,Math.round(w/6)));
    const tc=iv.n?'rgba(210,220,240,0.80)':'rgba(22,22,42,0.85)';
    ctx.font=`700 ${fs}px "Barlow Condensed",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=tc;
    if (rmx<CW-4) { ctx.save(); ctx.translate(Math.round(rmx),Math.round(mY)); ctx.rotate(-Math.PI/2); ctx.fillText(iv.nm,0,0); ctx.restore(); }
    if (lmx>4)   { ctx.save(); ctx.translate(Math.round(lmx),Math.round(mY)); ctx.rotate(-Math.PI/2); ctx.fillText(iv.nm,0,0); ctx.restore(); }
  });

  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════════════
// TOP-DOWN PANEL
// ══════════════════════════════════════════════════════════════════════════════

function drawTopDown(ctx) {
  const pH = TD1-TD0;
  ctx.fillStyle='#070910'; ctx.fillRect(0,TD0,CW,pH);

  // Section label
  ctx.save();
  ctx.font='700 16px "Barlow Condensed",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.60)';
  ctx.fillText('SHIPBOARD MAGNETIC ANOMALY SURVEY  (looking down at ocean floor)', 18, TD0+15);

  // ── Anomaly profile ───────────────────────────────────────────────────────
  const aY0=TD0+28, aH=46, aBase=aY0+aH*.5, aAmp=18;
  ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(0,aY0,CW,aH);
  ctx.strokeStyle='rgba(255,255,255,0.14)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,aBase); ctx.lineTo(CW,aBase); ctx.stroke();

  // Filled anomaly zones
  const maxDist=timeS*SR;
  for (const iv of GPTS) {
    if (iv.s>=timeS) break;
    const ce=Math.min(iv.e,timeS), d1=iv.s*SR, d2=ce*SR;
    const yF=iv.n?aBase-aAmp:aBase, fH=aAmp;
    const fc=iv.n?'rgba(62,162,255,0.52)':'rgba(215,110,18,0.44)';
    ctx.fillStyle=fc;
    const rx1=Math.max(0,CX+d1), rx2=Math.min(CW,CX+d2);
    if (rx2>rx1) ctx.fillRect(rx1,yF,rx2-rx1,fH);
    const lx1=Math.max(0,CX-d2), lx2=Math.min(CW,CX-d1);
    if (lx2>lx1) ctx.fillRect(lx1,yF,lx2-lx1,fH);
  }

  // Anomaly line
  ctx.beginPath(); let ls=false;
  for (let x=Math.max(0,Math.round(CX-maxDist)); x<=Math.min(CW,Math.round(CX+maxDist)); x++) {
    const age=Math.abs(x-CX)/SR; if (age>timeS) continue;
    const iv=polarityAt(age);
    const ly=aBase+(iv.n?-aAmp:aAmp);
    if (!ls) { ctx.moveTo(x,ly); ls=true; } else ctx.lineTo(x,ly);
  }
  ctx.strokeStyle='rgba(240,238,233,0.92)'; ctx.lineWidth=2.5; ctx.stroke();

  // Axis labels — bigger and brighter
  ctx.font='700 15px "Plus Jakarta Sans",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(80,175,255,0.95)'; ctx.fillText('▲ Normal',   10, aY0+9);
  ctx.fillStyle='rgba(225,120,25,0.95)'; ctx.fillText('▼ Reversed', 10, aY0+aH-9);

  // ── Stripe bands ──────────────────────────────────────────────────────────
  const sY0=aY0+aH+6, sH=64;
  ctx.fillStyle='#05070f'; ctx.fillRect(0,sY0,CW,sH);

  for (const iv of GPTS) {
    if (iv.s>=timeS) break;
    const ce=Math.min(iv.e,timeS), d1=iv.s*SR, d2=ce*SR;
    const col=mode==='age'?ageCol((iv.s+ce)*.5):polColor(iv.n);
    const rx1=Math.max(0,CX+d1), rx2=Math.min(CW,CX+d2);
    if (rx2>rx1) { ctx.fillStyle=col; ctx.fillRect(rx1,sY0,rx2-rx1,sH); }
    const lx1=Math.max(0,CX-d2), lx2=Math.min(CW,CX-d1);
    if (lx2>lx1) { ctx.fillStyle=col; ctx.fillRect(lx1,sY0,lx2-lx1,sH); }
  }

  // Ridge axis marker
  ctx.strokeStyle='rgba(255,255,255,0.65)'; ctx.lineWidth=2;
  ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(CX,sY0-2); ctx.lineTo(CX,sY0+sH+2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font='600 14px "Barlow Condensed",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.fillText('RIDGE AXIS', CX, sY0+sH+5);

  // Chron labels in stripe bands
  GPTS.forEach(iv => {
    if (iv.s>=timeS) return;
    const ce=Math.min(iv.e,timeS), d1=iv.s*SR, d2=ce*SR, w=d2-d1;
    if (w<26) return;
    const midD=(d1+d2)*.5, tc=iv.n?'rgba(195,208,230,0.72)':'rgba(25,25,45,0.75)';
    const fs=Math.min(14,Math.max(9,Math.round(w/7)));
    ctx.font=`700 ${fs}px "Barlow Condensed",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=tc;
    const rX=CX+midD, lX=CX-midD, mY=sY0+sH*.5;
    if (rX+w*.5<CW) ctx.fillText(iv.nm,rX,mY);
    if (lX-w*.5>0)  ctx.fillText(iv.nm,lX,mY);
  });

  // Age axis labels
  const axY=sY0+sH+22;
  ctx.font='600 13px "JetBrains Mono",monospace';
  ctx.textAlign='center'; ctx.textBaseline='top';
  [1,2,3,4,5].forEach(age => {
    if (age>timeS) return;
    const d=age*SR;
    ctx.fillStyle='rgba(240,238,233,0.4)';
    ctx.fillText(age+' Ma', CX+d, axY);
    ctx.fillText(age+' Ma', CX-d, axY);
    ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(CX+d,sY0+sH); ctx.lineTo(CX+d,sY0+sH+6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(CX-d,sY0+sH); ctx.lineTo(CX-d,sY0+sH+6); ctx.stroke();
  });

  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════════════
// INFO BAR
// ══════════════════════════════════════════════════════════════════════════════

function drawInfoBar(ctx) {
  ctx.fillStyle='#050710'; ctx.fillRect(0,IB0,CW,IB1-IB0);
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,IB0); ctx.lineTo(CW,IB0); ctx.stroke();

  const mY=(IB0+IB1)*.5;
  const oldIv=polarityAt(Math.min(timeS,MAXAGE-.001));
  const pc=oldIv.n?'#3AAFA9':'#F5A340';
  const ps=oldIv.n?'NORMAL':'REVERSED';

  ctx.save();
  ctx.font='600 14px "Barlow Condensed",sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillStyle='rgba(255,255,255,0.28)';
  ctx.fillText('OLDEST CRUST VISIBLE:', 20, mY-10);
  ctx.font='700 18px "Barlow Condensed",sans-serif';
  ctx.fillStyle=pc;
  ctx.fillText(`${oldIv.nm.toUpperCase()}  ·  ${oldIv.s.toFixed(2)} – ${Math.min(oldIv.e,5).toFixed(2)} Ma  ·  ${ps}`, 20, mY+10);

  // Legend right side
  const lgX=CW-210;
  if (mode==='polarity') {
    ctx.fillStyle='#161929'; ctx.fillRect(lgX,mY-9,18,15);
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.lineWidth=1; ctx.strokeRect(lgX,mY-9,18,15);
    ctx.font='500 15px "Plus Jakarta Sans",sans-serif';
    ctx.fillStyle='rgba(240,238,233,0.72)'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText('Normal', lgX+24, mY-2);
    ctx.fillStyle='#8e97ae'; ctx.fillRect(lgX+100,mY-9,18,15);
    ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.strokeRect(lgX+100,mY-9,18,15);
    ctx.fillStyle='rgba(240,238,233,0.72)'; ctx.fillText('Reversed', lgX+124, mY-2);
  } else {
    const bW=185, bH=15;
    const ag=ctx.createLinearGradient(lgX,0,lgX+bW,0);
    [0,.2,.4,.6,.8,1].forEach((t,i) => ag.addColorStop(t, ageCol(i*5/5)));
    ctx.fillStyle=ag; ctx.fillRect(lgX,mY-10,bW,bH);
    ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.lineWidth=1; ctx.strokeRect(lgX,mY-10,bW,bH);
    ctx.font='500 13px "Plus Jakarta Sans",sans-serif'; ctx.textBaseline='top';
    ctx.fillStyle='rgba(240,238,233,0.62)'; ctx.textAlign='left'; ctx.fillText('0 Ma', lgX, mY+7);
    ctx.textAlign='right'; ctx.fillText('5 Ma', lgX+bW, mY+7);
  }
  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════════════
// SEPARATORS
// ══════════════════════════════════════════════════════════════════════════════

function drawSeps(ctx) {
  ctx.fillStyle='#060810'; ctx.fillRect(0,SP0,CW,SP1-SP0);
  // Hairline borders
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,SP0); ctx.lineTo(CW,SP0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,SP1); ctx.lineTo(CW,SP1); ctx.stroke();

  const spy=Math.round((SP0+SP1)*.5);
  ctx.font='700 15px "Barlow Condensed",sans-serif';
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(240,238,233,0.78)';
  ctx.textAlign='left';  ctx.fillText('▲  CROSS SECTION', 18, spy);
  ctx.textAlign='right'; ctx.fillText('BIRD\'S EYE VIEW  ▼', CW-18, spy);
}

// ══════════════════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════════════════

const canvas=document.getElementById('main-canvas');
const ctx=canvas.getContext('2d');

function render(ts) {
  ctx.clearRect(0,0,CW,CH);
  tickParticles();
  drawXS(ctx,ts);
  drawSeps(ctx);
  drawTopDown(ctx);
  drawInfoBar(ctx);
}

// ══════════════════════════════════════════════════════════════════════════════
// ANIMATION
// ══════════════════════════════════════════════════════════════════════════════

function tick(ts) {
  if (playing) {
    const dt=lastTS!==null?(ts-lastTS)/1000:0;
    lastTS=ts;
    timeS=Math.min(MAXAGE, timeS+dt*.38);
    scrubEl.value=timeS;
    timeEl.textContent=timeS.toFixed(2)+' Ma';
    if (timeS>=MAXAGE) { playing=false; playBtn.textContent='▶'; lastTS=null; }
  } else { lastTS=null; }
  render(ts);
  requestAnimationFrame(tick);
}

// ══════════════════════════════════════════════════════════════════════════════
// UI EVENTS
// ══════════════════════════════════════════════════════════════════════════════

const scrubEl=document.getElementById('scrubber');
const timeEl=document.getElementById('time-display');
const playBtn=document.getElementById('play-btn');

scrubEl.addEventListener('input', () => {
  timeS=parseFloat(scrubEl.value);
  timeEl.textContent=timeS.toFixed(2)+' Ma';
  if (playing) { playing=false; playBtn.textContent='▶'; }
});

playBtn.addEventListener('click', () => {
  if (timeS>=MAXAGE-0.05) timeS=0.04;
  playing=!playing;
  playBtn.textContent=playing?'⏸':'▶';
});

function setMode(m) {
  mode=m;
  document.getElementById('btn-pol').className='mode-btn'+(m==='polarity'?' active-pol':'');
  document.getElementById('btn-age').className='mode-btn'+(m==='age'?' active-age':'');
}
document.getElementById('btn-pol').addEventListener('click',()=>setMode('polarity'));
document.getElementById('btn-age').addEventListener('click',()=>setMode('age'));

document.getElementById('btn-heat').addEventListener('click',()=>{
  showHeat=!showHeat;
  const b=document.getElementById('btn-heat');
  b.textContent='Heat Flow: '+(showHeat?'On':'Off');
  b.className='mode-btn'+(showHeat?' heat-on':'');
});

setMode('polarity');
requestAnimationFrame(tick);
</script>
