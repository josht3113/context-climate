<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="core-sample-tools.css">
<title>Anatomy of a Front — ContextClimate</title>
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 16px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 20px; display: inline-flex; align-items: center; gap: 8px; }
.tabs .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1.5px rgba(30,35,32,.55); }
.top .spacer { flex: 1; min-width: 0; }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.menu.open { display: flex; }
.menu button { background: none; border: none; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px; padding: 8px 10px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
.menu button:hover { background: var(--color-surface); }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* floating chips */
.chips { position: absolute; top: 8px; display: flex; align-items: center; gap: 8px; z-index: 5; }
.chips-l { left: 62px; }
.chips-r { right: 10px; }
.chips .cc-segmented-btn { padding: 7px 13px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; }
.lay { position: relative; }
.lmenu { min-width: 210px; }
.lmenu .tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 10px; vertical-align: -1px; }
.lmenu .tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.ve { display: flex; align-items: center; gap: 8px; background: rgba(38,43,39,.92); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 3px 10px 3px 4px; }
.ve .cc-btn.vt { font-weight: 700; color: var(--tool-accent); border-color: var(--tool-accent); padding: 5px 12px; white-space: nowrap; }
.ve .cc-btn.vt.is-active { background: var(--tool-accent); color: var(--color-bg); }
.ve .cc-segmented-btn { padding: 6px 11px; }
.ve input { width: 104px; accent-color: var(--tool-accent); cursor: pointer; }
.ve .vv { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--color-text-primary); min-width: 44px; text-align: right; }

/* control bar */
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border); background: var(--color-surface); min-height: 60px; }
.play { display: flex; align-items: center; justify-content: center; gap: 8px; width: 112px; flex: none; align-self: stretch;
  font-size: 16px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg);
  animation: glow 2.4s ease-in-out infinite; }
.play:hover { filter: brightness(1.12); color: var(--color-bg); border-color: var(--tool-accent); }
.play .ic { font-size: 17px; }
.play.on { animation: none; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(60,163,174,0); } 50% { box-shadow: 0 0 0 5px rgba(60,163,174,.28); } }
@media (prefers-reduced-motion: reduce) { .play { animation: none; } }
.snaps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; flex: 0 1 690px; min-width: 0; }
.snap { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 4px; min-width: 0; }
.snap .n { font-family: var(--font-body); font-weight: 700; font-size: 15px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
.snap .v { font-family: var(--font-mono); font-size: 13px; line-height: 1.15; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); }
.snap.is-active .n, .snap.is-active .v { color: var(--color-bg); }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 74px; text-align: right; white-space: nowrap; }

/* readout card */
.card { padding: 11px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .eb .tm { font-size: 18px; letter-spacing: .02em; color: var(--color-text-primary); text-transform: none; }
.card canvas.stn { width: 100%; height: 136px; display: block; margin: 2px 0; }
.card .r { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 5px 0 4px; border-top: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; text-align: right; }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 14px; color: var(--color-text-secondary); margin-left: 5px; }
.card .sub { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; margin-top: 10px; padding-bottom: 5px; }
.card .sub span:last-child { color: var(--color-text-secondary); font-weight: 500; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (min-height: 820px) {
  .card canvas.stn { height: 170px; margin: 6px 0; }
  .card .r { padding: 8px 0 7px; }
  .card .v { font-size: 23px; }
  .card .sub { margin-top: 16px; }
  .controls { min-height: 66px; }
}
@media (max-height: 700px) {
  .card .r { padding: 4px 0 3px; }
  .card canvas.stn { height: 128px; margin: 0; }
  .card .src { display: none; }
}
@media (max-height: 640px) {
  .card .r { padding: 3px 0 2px; }
  .card .v { font-size: 20px; }
  .card canvas.stn { height: 120px; margin: 0; }
  .card .sub { margin-top: 7px; padding-bottom: 3px; }
  .card .src { display: none; }
  .controls { min-height: 56px; padding: 5px 10px; }
  .snap { padding: 3px 4px; }
}
@media (max-height: 580px) {
  .card { padding: 8px 14px; }
  .card .eb { padding-bottom: 4px; }
  .card .r { padding: 2px 0 1px; }
  .card .v { font-size: 18px; }
  .card .v .u { font-size: 13px; }
  .card canvas.stn { height: 104px; }
  .card .sub { margin-top: 5px; padding-bottom: 2px; }
}
@media (max-width: 1440px) { .tabs .cc-segmented-btn { padding: 11px 16px; } }
@media (max-width: 1366px) {
  .main { grid-template-columns: minmax(0, 1fr) 272px; }
  .card { padding: 10px 14px; }
}
@media (max-width: 1280px) {
  .main { grid-template-columns: minmax(0, 1fr) 256px; }
  .top { gap: 10px; }
  .top h1 { font-size: 22px; }
  .tabs .cc-segmented-btn { padding: 11px 12px; }
  .exp .cc-btn { padding: 6px 9px; }
  .play { width: 96px; }
  .slider .sv { display: none; }
  .ve .vv { display: none; }
  .ve input { width: 80px; }
  .card .v { font-size: 20px; }
}
@media (max-width: 1180px) {
  .main { grid-template-columns: minmax(0, 1fr) 244px; }
  .snap .v { display: none; }
  .snap { padding: 9px 4px; }
  .ve input { display: none; }
  .tabs .sw { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Anatomy of a Front</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-front="cold"><span class="sw" style="background:#6D96D8"></span>Cold</button>
      <button class="cc-segmented-btn" data-front="warm"><span class="sw" style="background:#D9603F"></span>Warm</button>
      <button class="cc-segmented-btn" data-front="stationary"><span class="sw" style="background:linear-gradient(90deg,#6D96D8 50%,#D9603F 50%)"></span>Stationary</button>
      <button class="cc-segmented-btn" data-front="occluded"><span class="sw" style="background:#A08CC6"></span>Occluded</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="menu" id="pmenu"></div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chips chips-l">
          <div class="cc-segmented" id="views">
            <button class="cc-segmented-btn" data-v="section">Section</button>
            <button class="cc-segmented-btn" data-v="map">Map</button>
            <button class="cc-segmented-btn is-active" data-v="both">Both</button>
          </div>
          <div class="lay">
            <button class="cc-btn" id="bLayers">Layers ▾</button>
            <div class="menu lmenu" id="lmenu">
              <button class="tgl is-active" data-layer="airmass">Air-mass shading</button>
              <button class="tgl is-active" data-layer="motion">Air motion arrows</button>
              <button class="tgl is-active" data-layer="clouds">Clouds &amp; precipitation</button>
              <button class="tgl is-active" data-layer="labels">Cloud names</button>
            </div>
          </div>
        </div>
        <div class="chips chips-r" id="veChip">
          <div class="ve">
            <button class="cc-btn vt" data-ve="1">1× True scale</button>
            <div class="cc-segmented">
              <button class="cc-segmented-btn" data-ve="10">10×</button>
              <button class="cc-segmented-btn is-active" data-ve="50">50×</button>
              <button class="cc-segmented-btn" data-ve="100">100×</button>
            </div>
            <input type="range" id="veSlider" min="0" max="1000" step="1" aria-label="Vertical exaggeration">
            <span class="vv" id="veVal">50×</span>
          </div>
        </div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

/* ═══════════════════════════════════════════════════════════════════
   STATE — time is hours from frontal passage at the station (− before,
   + after); every front moves at its own speed, so position = t × speed
   ═══════════════════════════════════════════════════════════════════ */
const T_MIN = -24, T_MAX = 24;
const SNAPS = [-12, -6, -3, 0, 3, 12];
const MINUS = '−';
const S = {
  front: 'cold',
  t: -12,
  ve: 50,
  view: 'both',
  play: null,
  layers: { airmass:true, motion:true, clouds:true, labels:true }
};
Object.defineProperty(S, 'xf', { get(){ return S.t * FRONTS[S.front].speedKmh; } });
const ZMAX = 12;      // km shown vertically

/* ── deterministic pseudo-random (stable across redraws) ────────── */
function rng(seed){ let s = seed>>>0; return () => { s = (s*1664525 + 1013904223)>>>0; return s/4294967296; }; }

/* ── generic canvas helpers ─────────────────────────────────────── */
function setup(cv, W, H, scale){
  cv.width = Math.round(W*scale); cv.height = Math.round(H*scale);
  const ctx = cv.getContext('2d');
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,W,H);
  return ctx;
}
function txt(ctx, s, x, y, font, color, align, base){
  ctx.font = font; ctx.fillStyle = color;
  ctx.textAlign = align || 'left'; ctx.textBaseline = base || 'alphabetic';
  ctx.fillText(s, x, y);
}
function line(ctx, x1,y1,x2,y2, color, w, dash){
  ctx.save(); ctx.beginPath(); ctx.setLineDash(dash||[]);
  ctx.strokeStyle = color; ctx.lineWidth = w||1;
  ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
}
function arrow(ctx, x1,y1,x2,y2, color, w, head){
  const a = Math.atan2(y2-y1, x2-x1), h = head||7;
  ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w||2;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2 - Math.cos(a)*h*0.7, y2 - Math.sin(a)*h*0.7); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2 - Math.cos(a-0.42)*h, y2 - Math.sin(a-0.42)*h);
  ctx.lineTo(x2 - Math.cos(a+0.42)*h, y2 - Math.sin(a+0.42)*h);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function hexA(hex, a){
  const n = parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

/* ═══════════════════════════════════════════════════════════════════
   FRONTAL SURFACE GEOMETRY
   Returns the height (km) of the frontal surface at horizontal
   distance dx (km) back from the surface front position, along the
   side that holds the cold air. Includes the blunt nose that real
   cold fronts have in the lowest kilometer.
   ═══════════════════════════════════════════════════════════════════ */
function surfaceZ(F, dx, arm){
  if (dx <= 0) return 0;
  if (F.key === 'cold')       return F.slope*dx + 0.55*(1 - Math.exp(-dx/22));
  if (F.key === 'occluded')   return arm === 'back' ? (1/110)*dx + 0.45*(1-Math.exp(-dx/25)) : (1/200)*dx;
  return F.slope*dx;                       // warm & stationary: gentle all the way
}

/* ═══════════════════════════════════════════════════════════════════
   CLOUD SPRITES
   A cloud reads as real when it is ONE soft-edged mass that is lit from
   above — not a wash of overlapping discs. Each cloud is built once on an
   offscreen canvas in three passes and then cached by size:
     1. accumulate soft blobs        → the silhouette (alpha only)
     2. 'source-in' a vertical ramp  → bright top, shaded base
     3. 'source-atop' form           → crown light, base shade, lobe modelling
   Sprites depend only on a cloud's pixel size, never its position, so an
   animating front redraws with a single drawImage per cloud.
   ═══════════════════════════════════════════════════════════════════ */
function crnd(n){ const x = Math.sin(n*12.9898)*43758.5453; return x - Math.floor(x); }

const CLOUD_PAL = {
  deck: { top:'#EFF4FA', mid:'#D6DFEA', low:'#A9B6C7', base:'#7E8C9E', shade:0.55 },
  ice:  { top:'#F2F6FB', mid:'#E2E9F2', low:'#CBD5E1', base:'#B4C0CE', shade:0.14 },
  cb:   { top:'#F4F8FD', mid:'#DDE5F0', low:'#A6B3C6', base:'#6F7E92', shade:0.62 }
};

/* blob field in sprite-local pixels; (0,0) is the sprite's top-left */
function xsBlobs(kind, W, H, seed){
  const out = [];
  const put = (x,y,r,ex,ey) => out.push({x,y,r,ex:ex||1,ey:ey||1});

  if (kind === 'cb'){
    // a convective tower: widens a little with height, cauliflower lobes that
    // shrink toward the crown, and occasional bulging turrets
    const R0 = Math.max(5, Math.min(W*0.26, H*0.15));
    const rows = Math.max(3, Math.round(H/(R0*0.62)));
    for (let i=0;i<rows;i++){
      const f = i/(rows-1);
      const hw = (W/2)*(0.80 + 0.24*f + 0.06*Math.sin(f*6.7+seed));
      const r  = R0*(1 - 0.30*f);
      const n  = Math.max(2, Math.round(hw/(r*0.52)));
      for (let j=0;j<n;j++){
        const t = n===1?0.5:j/(n-1);
        const sd = seed + i*17.3 + j*4.1;
        let rr = r*(0.74 + crnd(sd+0.77)*0.55);
        if (crnd(sd+1.4) > 0.80) rr *= 1.35;
        put(W/2 + (t-0.5)*2*Math.max(0,hw-r*0.28) + (crnd(sd)-0.5)*r*0.5,
            H - f*H*0.97 + (crnd(sd+0.31)-0.5)*r*0.45, rr);
      }
    }
    return out;
  }

  if (kind === 'anvil'){
    // wide flat lenses — circles would scallop what should be a smooth shelf
    const R0 = Math.max(4, Math.min(H*0.50, W*0.085));
    const rows = Math.max(2, Math.round(H/(R0*0.8)));
    for (let i=0;i<rows;i++){
      const f = rows===1?0:i/(rows-1);
      const y = H - f*H*0.9 - R0*0.3;
      const ex = 1.8 + f*0.9, ey = 0.82 - f*0.22;
      const n = Math.max(4, Math.round(W/(R0*ex*0.5)));
      for (let j=0;j<n;j++){
        const t = n===1?0.5:j/(n-1);
        const sd = seed + i*23.1 + j*3.7;
        const fade = 0.45 + 0.55*Math.sin(Math.PI*Math.min(1,Math.max(0,t*1.05)));
        put(t*W, y + (crnd(sd)-0.5)*R0*0.3, R0*fade*(0.8+crnd(sd+0.5)*0.4), ex, ey);
      }
    }
    return out;
  }

  // A layered deck seen edge-on is a smooth lens, not a row of bubbles. Blobs
  // are flattened (wide ex, small ey) and stacked in overlapping rows dense
  // enough to fuse into a continuous sheet, with a flat base and a ragged top.
  // High ice cloud is thinner, wispier and more streaked.
  const ice = kind === 'ice';
  const base = Math.max(3, Math.min(H*(ice?0.42:0.36), W*(ice?0.055:0.06)));
  const EX = ice ? 3.6 : 2.4, EY = ice ? 0.62 : 0.92;
  const ROWS = ice ? [[0.66,1.0,0.06],[0.40,0.72,0.14]]
                   : [[0.80,1.00,0.05],[0.60,0.98,0.10],[0.40,0.78,0.18]];
  ROWS.forEach(([yf,mul,rag],ri) => {
    const n = Math.max(6, Math.round(W/(base*EX*0.30)));
    for (let i=0;i<n;i++){
      const t = n===1?0.5:i/(n-1);
      const sd = seed + ri*211 + i*7.31;
      const edge = Math.sin(Math.PI*Math.min(1,Math.max(0,t)));
      const taper = (ri===0 ? 0.70 : 0.48) + (ri===0 ? 0.30 : 0.52)*edge;
      const r = base*mul*taper*(0.86 + crnd(sd)*0.28);
      put(t*W + (crnd(sd+0.2)-0.5)*base*EX*0.25,
          H*yf + (crnd(sd+0.4)-0.5)*H*rag,
          r, EX, EY);
    }
  });
  return out;
}

const CLOUD_CACHE = new Map();
function xsCloudSprite(kind, W, H, palKey, seed){
  W = Math.max(8, Math.round(W)); H = Math.max(6, Math.round(H));
  const key = kind+'|'+W+'|'+H+'|'+palKey+'|'+Math.round(seed);
  const hit = CLOUD_CACHE.get(key);
  if (hit) return hit;
  if (CLOUD_CACHE.size > 90) CLOUD_CACHE.clear();

  const blobs = xsBlobs(kind, W, H, seed);
  // The sprite is sized to the blobs' real extent, not to the nominal W×H box.
  // Sizing it to the box clips any lobe that overhangs the edge, and a clipped
  // soft blob leaves a hard straight edge — which is exactly what makes a
  // cloud read as a gray rectangle.
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  blobs.forEach(b=>{const rx=b.r*(b.ex||1), ry=b.r*(b.ey||1);
    x0=Math.min(x0,b.x-rx); x1=Math.max(x1,b.x+rx);
    y0=Math.min(y0,b.y-ry); y1=Math.max(y1,b.y+ry);});
  const pad = 3;
  const cw = Math.max(8, Math.ceil(x1-x0)+pad*2), ch = Math.max(6, Math.ceil(y1-y0)+pad*2);
  const ox = -x0+pad, oy = -y0+pad;
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const c = cv.getContext('2d');

  /* 1 — silhouette */
  blobs.forEach(b => {
    const ex = b.ex||1, ey = b.ey||1;
    c.save(); c.translate(b.x+ox, b.y+oy); c.scale(ex,ey);
    const g = c.createRadialGradient(0,0,0,0,0,b.r);
    g.addColorStop(0,'rgba(255,255,255,1)');
    g.addColorStop(0.64,'rgba(255,255,255,1)');
    g.addColorStop(0.85,'rgba(255,255,255,0.46)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0,0,b.r,0,7); c.fill(); c.restore();
  });

  /* 2 — lighting, painted through the silhouette's alpha */
  const P = CLOUD_PAL[palKey] || CLOUD_PAL.deck;
  c.globalCompositeOperation = 'source-in';
  const lg = c.createLinearGradient(0,0,0,ch);
  lg.addColorStop(0,P.top); lg.addColorStop(0.32,P.mid);
  lg.addColorStop(0.72,P.low); lg.addColorStop(1,P.base);
  c.fillStyle = lg; c.fillRect(0,0,cw,ch);

  /* 3 — form */
  c.globalCompositeOperation = 'source-atop';
  const dl = c.createLinearGradient(0,ch,cw,0);
  dl.addColorStop(0,'rgba(44,58,80,0.20)');
  dl.addColorStop(0.5,'rgba(120,140,170,0)');
  dl.addColorStop(1,'rgba(255,252,244,0.22)');
  c.fillStyle = dl; c.fillRect(0,0,cw,ch);

  if (kind === 'cb'){
    const stride = Math.max(1, Math.ceil(blobs.length/44));
    blobs.forEach((b,i) => {
      if (b.r < 5 || i%stride) return;
      const bx = b.x+ox, by = b.y+oy, rx = b.r*(b.ex||1);
      const sxp = bx-rx*0.20, syp = by+b.r*0.28;
      const d = c.createRadialGradient(sxp,syp,0,sxp,syp,rx*0.70);
      d.addColorStop(0,'rgba(64,82,110,0.17)'); d.addColorStop(1,'rgba(64,82,110,0)');
      c.fillStyle = d; c.beginPath(); c.arc(sxp,syp,rx*0.70,0,7); c.fill();
      const lxp = bx+rx*0.24, lyp = by-b.r*0.32;
      const l = c.createRadialGradient(lxp,lyp,0,lxp,lyp,rx*0.60);
      l.addColorStop(0,'rgba(255,255,252,0.26)'); l.addColorStop(1,'rgba(255,255,255,0)');
      c.fillStyle = l; c.beginPath(); c.arc(lxp,lyp,rx*0.60,0,7); c.fill();
    });
  }

  const bandH = Math.max(6, ch*0.34);
  const bg = c.createLinearGradient(0, ch-bandH, 0, ch);
  bg.addColorStop(0,'rgba(48,62,86,0)');
  bg.addColorStop(1,`rgba(44,58,84,${P.shade})`);
  c.fillStyle = bg; c.fillRect(0,0,cw,ch);

  const rimH = Math.max(4, ch*0.14);
  const rg = c.createLinearGradient(0,0,0,rimH);
  rg.addColorStop(0,'rgba(255,255,255,0.26)'); rg.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle = rg; c.fillRect(0,0,cw,ch);

  c.globalCompositeOperation = 'source-over';
  // dx/dy are the sprite's top-left in the generation frame, so the caller can
  // place it against the cloud's nominal box without any clipping
  const out = {cv, dx:x0-pad, dy:y0-pad, W, H};
  CLOUD_CACHE.set(key, out);
  return out;
}

/* ═══════════════════════════════════════════════════════════════════
   CROSS-SECTION
   ═══════════════════════════════════════════════════════════════════ */
function drawXS(ctx, W, H, o){
  o = o || {};
  const F = FRONTS[S.front];
  const M = {l:56, r:14, t:(o.top||16), b:34};
  const CH_ = o.chipH || 0;
  const Wp = W - M.l - M.r, Hp = H - M.t - M.b;
  const Xr = S.ve * ZMAX * (Wp/Hp);
  const xmin = -Xr/2, xmax = Xr/2;
  const PX = x => M.l + (x - xmin)/Xr*Wp;
  const PY = z => M.t + (1 - z/ZMAX)*Hp;
  const KMPX = Wp/Xr;                        // px per km horizontally
  const xf = S.xf;
  if (o.out) o.out.xs = {M, Wp, Hp, Xr, xmin};
  const slopeTxt = F.slopeText.replace(/^about /,'');
  const tsc = Math.round(S.ve) <= 1;
  const capt = tsc ? `TRUE SCALE 1×  ·  real slope ${slopeTxt}`
                   : `VERTICAL EXAGGERATION ${Math.round(S.ve)}×  ·  real slope ${slopeTxt}`;
  ctx.save(); ctx.font = `700 13px ${FONT.mono}`;
  const capW = ctx.measureText(capt).width;
  ctx.restore();
  const TAG = {x: M.l+Wp-capW-24, y: M.t+CH_+6, w: capW+16, h: 23};
  const AV = [TAG].concat(o.avoid ? [o.avoid] : []);
  const hits = (x0, y0, x1, y1) => AV.some(R => x1 > R.x - 6 && x0 < R.x + R.w + 6 && y1 > R.y - 4 && y0 < R.y + R.h + 4);

  ctx.save();

  /* sky */
  const sky = ctx.createLinearGradient(0, M.t, 0, M.t+Hp);
  sky.addColorStop(0, '#151d29'); sky.addColorStop(0.55,'#1d2733'); sky.addColorStop(1,'#283230');
  ctx.fillStyle = sky; ctx.fillRect(M.l, M.t, Wp, Hp);

  ctx.save();
  ctx.beginPath(); ctx.rect(M.l, M.t, Wp, Hp); ctx.clip();

  /* ── air-mass regions ─────────────────────────────────────────── */
  const coldFill = hexA(F.behind.col === COL.warm ? COL.cold : F.behind.col, 0.26);
  if (S.layers.airmass){
    ctx.save();
    if (F.key === 'occluded'){
      // coldest air: left of xf, under the back arm ; cool air: right of xf under the fwd arm
      ctx.beginPath(); ctx.moveTo(PX(xmin), PY(0));
      for (let x = xmin; x <= xf; x += Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, xf-x, 'back')));
      ctx.lineTo(PX(xf), PY(0)); ctx.closePath();
      ctx.fillStyle = hexA(COL.cold, 0.34); ctx.fill();
      ctx.beginPath(); ctx.moveTo(PX(xf), PY(0));
      for (let x = xf; x <= xmax; x += Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, x-xf, 'fwd')));
      ctx.lineTo(PX(xmax), PY(0)); ctx.closePath();
      ctx.fillStyle = hexA(COL.cool, 0.24); ctx.fill();
      // warm air aloft
      ctx.beginPath(); ctx.moveTo(PX(xmin), PY(ZMAX));
      ctx.lineTo(PX(xmin), PY(surfaceZ(F, xf-xmin,'back')));
      for (let x = xmin; x <= xf; x += Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, xf-x,'back')));
      for (let x = xf; x <= xmax; x += Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, x-xf,'fwd')));
      ctx.lineTo(PX(xmax), PY(ZMAX)); ctx.closePath();
      ctx.fillStyle = hexA(COL.warm, 0.10); ctx.fill();
    } else {
      const left = (F.coldOn === 'left');
      ctx.beginPath();
      if (left){
        ctx.moveTo(PX(xmin), PY(0));
        for (let x = xmin; x <= xf; x += Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, xf-x)));
        ctx.lineTo(PX(xf), PY(0));
      } else {
        ctx.moveTo(PX(xmax), PY(0));
        for (let x = xmax; x >= xf; x -= Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, x-xf)));
        ctx.lineTo(PX(xf), PY(0));
      }
      ctx.closePath(); ctx.fillStyle = hexA(COL.cold, 0.30); ctx.fill();
      // warm air = the rest
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.beginPath(); ctx.rect(M.l, M.t, Wp, Hp);
      if (left){
        ctx.moveTo(PX(xmin), PY(0));
        for (let x = xmin; x <= xf; x += Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, xf-x)));
        ctx.lineTo(PX(xf), PY(0));
      } else {
        ctx.moveTo(PX(xmax), PY(0));
        for (let x = xmax; x >= xf; x -= Xr/300) ctx.lineTo(PX(x), PY(surfaceZ(F, x-xf)));
        ctx.lineTo(PX(xf), PY(0));
      }
      ctx.closePath();
      ctx.fillStyle = hexA(COL.warm, 0.085); ctx.fill('evenodd');
      ctx.restore();
    }
    ctx.restore();
  }

  /* ── clouds & precipitation ───────────────────────────────────── */
  const trueScale = S.ve < 6;
  if (S.layers.clouds){
    F.clouds.forEach((cl, ci) => {
      const a0 = PX(xf + cl.x0), a1 = PX(xf + cl.x1);
      const zb = PY(cl.z0), zt = PY(cl.z1);
      const w = a1 - a0, h = zb - zt;
      if (w < 3 || h < 3) return;
      if (a1 < M.l-140 || a0 > M.l+Wp+140) return;
      // size is quantized so an animating front reuses one cached sprite
      const qw = clamp(Math.round(w/6)*6, 8, 1200), qh = clamp(Math.round(h/4)*4, 6, 900);
      const pal = cl.type === 'cb' ? 'cb' : (cl.z0 >= 5.6 ? 'ice' : 'deck');
      const kind = cl.type === 'layer' && pal === 'ice' ? 'ice' : cl.type;
      const seed = 13 + ci*29 + F.key.length*7;
      const sp = xsCloudSprite(kind, qw, qh, pal, seed);
      const alpha = kind === 'cb' ? 0.92
                  : kind === 'anvil' ? 0.60
                  : 0.34 + 0.58*(cl.dens || 0.6);
      ctx.save();
      ctx.globalAlpha = alpha;
      const sx = w/qw, sy = h/qh;
      ctx.drawImage(sp.cv, a0 + sp.dx*sx, zt + sp.dy*sy,
                    sp.cv.width*sx, sp.cv.height*sy);
      ctx.restore();
    });

    /* precipitation streaks */
    const RP = rng(4421);
    for (let x = xmin; x <= xmax; x += Xr/(trueScale ? 40 : 260)){
      const d = x - xf, inten = tbl(F.PR, d);
      if (inten <= 0.02) continue;
      const n = Math.max(1, Math.round(inten*4));
      for (let k=0;k<n;k++){
        const px = PX(x) + (RP()-0.5)*(Wp/460)*4;
        const baseKm = Math.min(4.2, 0.55 + inten*2.2);
        const top = PY(baseKm) + RP()*(PY(0.12) - PY(baseKm));
        const len = 16 + RP()*26;
        const tilt = len*(F.key==='cold' ? 0.34 : 0.20);
        ctx.strokeStyle = `rgba(118,208,186,${0.22 + inten*0.36})`;
        ctx.lineWidth = inten > 0.7 ? 1.5 : 1.0;
        ctx.beginPath(); ctx.moveTo(px, top); ctx.lineTo(px - tilt, top + len); ctx.stroke();
      }
    }
    if (F.key === 'cold' || F.key === 'occluded'){
      const lx = PX(xf + (F.key==='cold' ? 25 : -30)), ly0 = PY(7.4), ly1 = PY(1.2);
      ctx.save(); ctx.strokeStyle = 'rgba(240,214,130,0.85)'; ctx.lineWidth = 1.8; ctx.lineJoin='round';
      const seg = (ly1-ly0);
      ctx.beginPath(); ctx.moveTo(lx, ly0);
      ctx.lineTo(lx-7, ly0+seg*0.30); ctx.lineTo(lx+3, ly0+seg*0.40);
      ctx.lineTo(lx-5, ly0+seg*0.72); ctx.lineTo(lx+4, ly0+seg*0.80);
      ctx.lineTo(lx-3, ly1);
      ctx.stroke(); ctx.restore();
    }
  }

  /* ── the frontal surface itself ───────────────────────────────── */
  function strokeSurface(arm, dir, color){
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineJoin='round';
    ctx.shadowColor = hexA(color, 0.6); ctx.shadowBlur = 8;
    ctx.beginPath();
    let started = false;
    const dxMax = Math.abs(xf) + Xr*1.1;
    for (let k=0;k<=600;k++){
      const dx = dxMax*(k/600);
      const x = dir<0 ? xf-dx : xf+dx;
      const z = surfaceZ(F, dx, arm);
      if (z > ZMAX*1.05) break;
      const px = PX(x), py = PY(z);
      if (!started){ ctx.moveTo(px,py); started = true; } else ctx.lineTo(px,py);
    }
    ctx.stroke(); ctx.restore();
  }
  if (F.key === 'occluded'){
    strokeSurface('back', -1, COL.cold);
    strokeSurface('fwd',  +1, COL.warm);
  } else if (F.coldOn === 'left'){
    strokeSurface(null, -1, F.color);
  } else {
    strokeSurface(null, +1, F.color);
  }

  /* ── air-motion arrows ────────────────────────────────────────── */
  if (S.layers.motion && !trueScale){
    const upCol = 'rgba(232,170,120,0.95)', coldCol = 'rgba(140,180,235,0.92)';
    // warm air riding the frontal surface
    const dirSign = (F.coldOn === 'left') ? -1 : +1;
    const arms = (F.key === 'occluded') ? [['back',-1],['fwd',+1]] : [[null, dirSign]];
    arms.forEach(([arm, sgn]) => {
      for (let i=1;i<=5;i++){
        const dx = (i/5.4)*Math.min(Xr*0.46, ZMAX/ (F.key==='occluded' ? (arm==='back'?1/110:1/200) : F.slope));
        const z0 = surfaceZ(F, dx, arm);
        if (z0 > ZMAX*0.92) continue;
        const dx2 = dx*1.30;
        const z1 = surfaceZ(F, dx2, arm);
        const x0 = xf + sgn*dx, x1 = xf + sgn*dx2;
        const off = 12;
        // for a cold front the warm air is on the far side of the wedge, so
        // offset the arrow up-and-away from the sloping surface
        arrow(ctx, PX(x0), PY(z0)-off, PX(x1), PY(z1)-off-4, upCol, 2.4, 8);
      }
    });
    // low-level flow in each air mass
    if (F.key === 'stationary'){ /* low-level flow is parallel to the boundary */ }
    else if (F.key !== 'occluded'){
      // the air mass BEHIND (left) is the one advancing — bold arrows to the right
      const behCol = F.behind.col === COL.warm ? upCol : coldCol;
      const ahdCol = F.ahead.col  === COL.warm ? upCol : 'rgba(150,190,235,0.75)';
      for (let i=0;i<3;i++){
        const xc = xf - (Xr*0.13 + i*Xr*0.11);
        const zz = Math.min(surfaceZ(F, Math.abs(xc-xf), null)*0.40, ZMAX*0.20);
        arrow(ctx, PX(xc)-32, PY(zz+0.35), PX(xc)+32, PY(zz+0.35), behCol, 2.6, 8);
      }
      for (let i=0;i<2;i++){
        const xw = xf + (Xr*0.15 + i*Xr*0.13);
        arrow(ctx, PX(xw)-30, PY(0.8), PX(xw)+30, PY(0.8), ahdCol, 2.0, 7);
      }
    } else {
      for (let i=0;i<2;i++) arrow(ctx, PX(xf-Xr*0.30+i*Xr*0.10)-26, PY(0.6), PX(xf-Xr*0.30+i*Xr*0.10)+26, PY(0.6), coldCol, 2.2, 7);
      for (let i=0;i<2;i++) arrow(ctx, PX(xf+Xr*0.30-i*Xr*0.10)+26, PY(0.6), PX(xf+Xr*0.30-i*Xr*0.10)-26, PY(0.6), 'rgba(160,196,240,0.9)', 2.2, 7);
      arrow(ctx, PX(xf), PY(1.2), PX(xf), PY(ZMAX*0.72), upCol, 2.6, 9);
    }
    // stationary front: winds are parallel to the boundary → into / out of page
    if (F.key === 'stationary'){
      const mark = (px, py, into, col) => {
        ctx.save(); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(px,py,10,0,7); ctx.stroke();
        if (into){ line(ctx,px-6,py-6,px+6,py+6,col,2); line(ctx,px+6,py-6,px-6,py+6,col,2); }
        else { ctx.beginPath(); ctx.arc(px,py,3.2,0,7); ctx.fill(); }
        ctx.restore();
      };
      // kept out toward the panel edges so they never collide with the
      // cloud-name chips, which sit over the middle of each deck
      const wx1 = PX(xmin + Xr*0.075), wx2 = PX(xmax - Xr*0.085);
      const my = PY(Math.min(2.0, ZMAX*0.18));
      mark(wx1, my, false, upCol);
      mark(wx2, my, true,  coldCol);
      const chip = (t, x, y, col) => {
        ctx.save(); ctx.font = `13px ${FONT.mono}`;
        const w = ctx.measureText(t).width;
        const cx = clamp(x, M.l + w/2 + 12, M.l + Wp - w/2 - 12);
        ctx.fillStyle = 'rgba(24,29,26,0.92)'; roundRect(ctx, cx-w/2-8, y-16, w+16, 22, 4); ctx.fill();
        ctx.restore(); txt(ctx, t, cx, y, `13px ${FONT.mono}`, col, 'center');
      };
      const chipS = (t, x, y, col, right) => {
        ctx.save(); ctx.font = `13px ${FONT.mono}`;
        const w = ctx.measureText(t).width;
        const x0 = right ? x - 18 - w - 16 : x + 18;
        ctx.fillStyle = 'rgba(24,29,26,0.92)'; roundRect(ctx, x0, y-11, w+16, 22, 4); ctx.fill();
        ctx.restore(); txt(ctx, t, x0+8, y+5, `13px ${FONT.mono}`, col, 'left');
      };
      chipS('warm air — OUT of page', wx1, my, 'rgba(238,180,132,0.98)', false);
      chipS('cool air — INTO page',   wx2, my, 'rgba(160,198,244,0.98)', true);
    }
  }

  if (S.layers.labels && F.key === 'occluded' && !trueScale){
    const tagBot = M.t + CH_ + 6 + 23;
    const wy = Math.max(PY(9.0), tagBot + 24), wx0 = PX(xf);
    ctx.save(); ctx.font = `700 14px ${FONT.body}`;
    const t = 'warm air — lifted completely off the ground';
    const w = ctx.measureText(t).width;
    const A = o.avoid;
    const lo = (A && wy + 11 > A.y && wy - 16 < A.y + A.h) ? Math.max(M.l+8, A.x + A.w + 10) : M.l+8;
    const bx = clamp(wx0 - w/2 - 9, lo, M.l+Wp-w-26);
    ctx.fillStyle = 'rgba(26,31,28,0.92)'; roundRect(ctx, bx, wy-16, w+18, 27, 4); ctx.fill();
    ctx.strokeStyle = hexA(COL.warm,0.55); ctx.lineWidth=1; ctx.stroke(); ctx.restore();
    txt(ctx, t, bx+9+w/2, wy+4, `700 14px ${FONT.body}`, '#F0A98C', 'center');
  }

  /* ── cloud name labels ────────────────────────────────────────── */
  if (S.layers.clouds && S.layers.labels && !trueScale){
    F.clouds.forEach(cl => {
      if (cl.type === 'anvil') return;
      let cx = PX(xf + (cl.x0+cl.x1)/2); const cy = PY((cl.z0+cl.z1)/2);
      ctx.save(); ctx.font = `600 14px ${FONT.body}`;
      const w = ctx.measureText(cl.name).width;
      ctx.restore();
      if (hits(cx-w/2-8, cy-12, cx+w/2+8, cy+11)){
        const lo = Math.max(PX(xf + cl.x0) + w/2 + 4, M.l + w/2 + 12), hi = Math.min(PX(xf + cl.x1) - w/2 - 4, M.l + Wp - w/2 - 12);
        const cands = [];
        AV.forEach(R => { cands.push(R.x + R.w + w/2 + 16, R.x - w/2 - 16); });
        cands.sort((a, b) => Math.abs(a - cx) - Math.abs(b - cx));
        const ok = cands.find(c => c >= lo && c <= hi && !hits(c-w/2-8, cy-12, c+w/2+8, cy+11));
        if (ok === undefined) return;
        cx = ok;
      }
      if (cx < M.l+30 || cx > M.l+Wp-30) return;
      ctx.save();
      ctx.font = `600 14px ${FONT.body}`;
      ctx.fillStyle = 'rgba(30,35,32,0.76)';
      roundRect(ctx, cx-w/2-8, cy-12, w+16, 23, 4); ctx.fill();
      txt(ctx, cl.name, cx, cy+5, `600 14px ${FONT.body}`, '#E8E4D9', 'center');
      ctx.restore();
    });
  }

  ctx.restore();  /* end plot clip */

  /* ── ground ───────────────────────────────────────────────────── */
  const gy = PY(0);
  ctx.fillStyle = '#3A423B'; ctx.fillRect(M.l, gy, Wp, M.b-2);
  line(ctx, M.l, gy, M.l+Wp, gy, COL.borderH, 2);

  /* ── axes ─────────────────────────────────────────────────────── */
  for (let z=0; z<=ZMAX; z+=2){
    const y = PY(z);
    line(ctx, M.l-5, y, M.l, y, COL.muted, 1);
    if (z>0) line(ctx, M.l, y, M.l+Wp, y, 'rgba(232,228,217,0.05)', 1);
    txt(ctx, z+'', M.l-10, y+5, `14px ${FONT.mono}`, COL.text2, 'right');
  }
  ctx.save(); ctx.translate(15, M.t+Hp/2); ctx.rotate(-Math.PI/2);
  txt(ctx, 'ALTITUDE (km)', 0, 0, `13px ${FONT.mono}`, COL.text2, 'center'); ctx.restore();
  const niceSteps = [1,2,5,10,20,50,100,200,500,1000,2000];
  const target = Xr/8;
  const stepKm = niceSteps.reduce((a,b)=> Math.abs(b-target)<Math.abs(a-target)?b:a, niceSteps[0]);
  const xticks = [];
  for (let x = Math.ceil(xmin/stepKm)*stepKm; x <= xmax; x += stepKm){
    const px = PX(x);
    line(ctx, px, gy, px, gy+4, COL.text2, 1);
    xticks.push([px, (x===0 ? '0' : (x>0?'+':MINUS) + Math.abs(Math.round(x))) + ' km']);
  }

  /* ── station marker ───────────────────────────────────────────── */
  const sx = PX(0);
  line(ctx, sx, M.t, sx, gy, 'rgba(60,163,174,0.45)', 1.5, [4,4]);
  ctx.save(); ctx.fillStyle = COL.accent;
  ctx.beginPath(); ctx.moveTo(sx, gy-14); ctx.lineTo(sx-9, gy+2); ctx.lineTo(sx+9, gy+2); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* ── surface-front position + ESSRT symbol on the ground line ─── */
  txt(ctx, 'A', M.l+8, gy-10, `700 19px ${FONT.disp}`, COL.text2, 'left');
  txt(ctx, 'A′', M.l+Wp-8, gy-10, `700 19px ${FONT.disp}`, COL.text2, 'right');
  const fx = PX(xf);
  if (fx > M.l-60 && fx < M.l+Wp+60){
    ctx.save(); ctx.beginPath(); ctx.rect(M.l, gy-26, Wp, M.b+26); ctx.clip();
    drawFrontSymbolLine(ctx, fx-52, gy, fx+52, gy, F, -1, 1.25);
    ctx.restore();
  }

  /* ── ground band: surface front, air mass at each end, km ticks ── */
  const boxes = [];
  const chipY = gy+6, chipH = 22, chipBase = gy+22;
  const chip = (t, x0, font, col, stroke) => {
    ctx.save(); ctx.font = font;
    const w = ctx.measureText(t).width + 16;
    ctx.fillStyle = 'rgba(26,31,28,0.95)'; roundRect(ctx, x0, chipY, w, chipH, 4); ctx.fill();
    if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore();
    txt(ctx, t, x0+8, chipBase, font, col, 'left');
    boxes.push([x0, x0+w]);
    return w;
  };
  const measure = (t, font) => { ctx.save(); ctx.font = font; const w = ctx.measureText(t).width + 16; ctx.restore(); return w; };
  const MF = `700 13px ${FONT.mono}`, BF = `700 13px ${FONT.body}`;
  const onScreen = fx >= M.l && fx <= M.l+Wp;
  let sfBox = null;
  const sx0 = PX(0);
  if (onScreen){
    const t = 'SURFACE FRONT  ' + F.speedKmh + ' km/h →';
    const w = measure(t, MF);
    const x0 = clamp(fx - w/2, M.l+4, M.l+Wp-w-4);
    chip(t, x0, MF, F.color, hexA(F.color, 0.55));
    sfBox = [x0, x0+w];
  }
  const side = onScreen ? null : (fx < M.l ? 'left' : 'right');
  if (side){
    const t = side === 'left' ? `◀ FRONT ${Math.round(Math.abs(xf))} km` : `FRONT ${Math.round(Math.abs(xf))} km ▶`;
    const w = measure(t, MF);
    chip(t, side === 'left' ? M.l+4 : M.l+Wp-w-4, MF, F.color, hexA(F.color, 0.6));
  }
  {
    ctx.save(); ctx.font = MF; const w = ctx.measureText('STATION').width; ctx.restore();
    if (!boxes.some(b => sx0 + w/2 > b[0] - 6 && sx0 - w/2 < b[1] + 6)){
      txt(ctx, 'STATION', sx0, gy+22, MF, COL.accent, 'center');
      boxes.push([sx0 - w/2, sx0 + w/2]);
    }
  }
  if (S.layers.airmass){
    const amAt = x => ((x - xf) >= 0 ? F.ahead : F.behind);
    const amChip = (am, end) => {
      if (end === side) return;
      const full = am.label.replace(/&amp;/g,'&');
      for (const t of [full, full.split(/[\s(]/)[0]]){
        const w = measure(t, BF);
        const x0 = end === 'left' ? M.l+4 : M.l+Wp-w-4;
        if (boxes.some(b => x0 < b[1] + 8 && x0 + w > b[0] - 8)) continue;
        chip(t, x0, BF, am.col, hexA(am.col, 0.55));
        return;
      }
    };
    amChip(amAt(xmin), 'left');
    amChip(amAt(xmax), 'right');
  }
  ctx.save(); ctx.font = `13px ${FONT.mono}`;
  xticks.forEach(([px, t]) => {
    const w = ctx.measureText(t).width;
    if (px - w/2 < M.l+2 || px + w/2 > M.l+Wp-2) return;
    if (boxes.some(b => px + w/2 > b[0] - 8 && px - w/2 < b[1] + 8)) return;
    txt(ctx, t, px, gy+22, `13px ${FONT.mono}`, COL.text2, 'center');
  });
  ctx.restore();

  /* ── scale tag ───────────────────────────────────────────────── */
  ctx.save();
  const bx = TAG.x, by = TAG.y;
  ctx.fillStyle = 'rgba(26,31,28,0.88)'; roundRect(ctx, bx, by, TAG.w, TAG.h, 4); ctx.fill();
  if (tsc){ ctx.strokeStyle = COL.accent; ctx.lineWidth = 1.2; ctx.stroke(); }
  ctx.restore();
  txt(ctx, capt, bx+8, by+16, `700 13px ${FONT.mono}`, tsc ? COL.accent : COL.text2, 'left');

  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   ESSRT FRONT SYMBOLS along an arbitrary segment
   side = +1 puts the symbols on the left of the direction of travel
   ═══════════════════════════════════════════════════════════════════ */
function drawFrontSymbolLine(ctx, x1,y1,x2,y2, F, side, scale){
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx,dy);
  if (len < 1) return;
  const ux = dx/len, uy = dy/len;
  const nx = -uy*side, ny = ux*side;         // normal, symbols point this way
  const s = 8*(scale||1);
  ctx.save();
  ctx.lineWidth = 3*(scale||1); ctx.lineJoin='round';
  const isStn = F.symbol === 'alternating';
  const isBoth = F.symbol === 'both';
  const baseCol = isStn || isBoth ? COL.purple : F.color;
  ctx.strokeStyle = baseCol;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

  const spacing = s*3.1;
  const n = Math.max(1, Math.floor(len/spacing));
  const pad = (len - n*spacing)/2;
  for (let i=0;i<n;i++){
    const t = pad + spacing*(i+0.5);
    const cx = x1 + ux*t, cy = y1 + uy*t;
    let kind, sgn = 1, col;
    if (isStn){ kind = (i%2===0) ? 'tri' : 'semi'; sgn = (i%2===0) ? -1 : 1; col = (kind==='tri')?COL.cold:COL.warm; }
    else if (isBoth){ kind = (i%2===0) ? 'tri' : 'semi'; col = COL.purple; }
    else { kind = (F.symbol === 'triangles') ? 'tri' : 'semi'; col = F.color; }
    const mx = nx*sgn, my = ny*sgn;
    ctx.fillStyle = col; ctx.strokeStyle = col;
    if (kind === 'tri'){
      ctx.beginPath();
      ctx.moveTo(cx - ux*s, cy - uy*s);
      ctx.lineTo(cx + mx*s*1.35, cy + my*s*1.35);
      ctx.lineTo(cx + ux*s, cy + uy*s);
      ctx.closePath(); ctx.fill();
    } else {
      const a = Math.atan2(my, mx);
      ctx.beginPath(); ctx.arc(cx, cy, s, a-Math.PI/2, a+Math.PI/2); ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   PLAN VIEW — the same front seen from above
   ═══════════════════════════════════════════════════════════════════ */
function drawPlan(ctx, W, H, o){
  o = o || {};
  const CP = !!o.compact;
  const F = FRONTS[S.front];
  const M = CP ? {l:0, r:0, t:0, b:0} : {l:14, r:14, t:(o.top||14), b:14};
  const CRX = CP ? 22 : 42, CRY = CP ? 30 : 40, CRR = CP ? 13 : 22;   // compass rose
  const Wp = W-M.l-M.r, Hp = H-M.t-M.b;
  const cx0 = M.l+Wp/2, cy0 = M.t+Hp/2;          // the station sits at the center

  /* north-up map: a compass bearing maps straight to a screen vector */
  const uv = b => { const r = b*Math.PI/180; return [Math.sin(r), -Math.cos(r)]; };
  const [ax, ay] = uv(F.bearAhead);              // the way the front advances
  const [fx, fy] = uv(F.bearFront);              // the way the front trails from the low
  const stationary = F.key === 'stationary';

  /* distance from a point to the panel edge along a direction */
  const tToEdge = (px,py,dx,dy,pad) => {
    let best = Infinity;
    if (Math.abs(dx) > 1e-6){
      [((M.l+pad)-px)/dx, ((M.l+Wp-pad)-px)/dx].forEach(t => { if (t > 0) best = Math.min(best,t); });
    }
    if (Math.abs(dy) > 1e-6){
      [((M.t+pad)-py)/dy, ((M.t+Hp-pad)-py)/dy].forEach(t => { if (t > 0) best = Math.min(best,t); });
    }
    return isFinite(best) ? best : 0;
  };

  /* how far the front can slide along A—A′ and still show */
  const tRun = Math.min(
    Math.abs(ax) > 1e-6 ? (Wp/2)/Math.abs(ax) : 1e9,
    Math.abs(ay) > 1e-6 ? (Hp/2)/Math.abs(ay) : 1e9);
  const PPK = tRun*0.90/900;
  const off = clamp(S.xf, -900, 900)*PPK;
  const fcx = cx0 + ax*off, fcy = cy0 + ay*off;   // where the front crosses A—A′
  if (o.out) o.out.plan = {cx0, cy0, ax, ay, PPK};

  ctx.save();
  ctx.fillStyle = '#232A26'; ctx.fillRect(M.l, M.t, Wp, Hp);
  ctx.beginPath(); ctx.rect(M.l, M.t, Wp, Hp); ctx.clip();

  /* Where the low sits — computed first, because both the sector wedge and the
     front itself are anchored to it. */
  const tBack = stationary ? tToEdge(fcx,fcy,-fx,-fy,0) : tToEdge(fcx,fcy,-fx,-fy,CP?24:46)*0.90;
  const tFwd  = tToEdge(fcx,fcy, fx, fy, 0);
  const Lx = fcx - fx*tBack, Ly = fcy - fy*tBack;
  const Ex = fcx + fx*tFwd,  Ey = fcy + fy*tFwd;
  const big = 4000;

  /* Sector shading. A half-plane split would run the color boundary straight
     past the end of the front with nothing on it; the warm sector is really a
     wedge with its apex at the low, closed off by the cyclone's other front. */
  const aheadCol  = F.ahead.col === COL.cool ? COL.cool : F.ahead.col;
  const behindCol = F.behind.col;
  if (stationary || !F.wedge){
    const q1 = [fcx - fx*big, fcy - fy*big], q2 = [fcx + fx*big, fcy + fy*big];
    const fillSide = (sign, col, alpha) => {
      ctx.save(); ctx.beginPath();
      ctx.moveTo(q1[0], q1[1]); ctx.lineTo(q2[0], q2[1]);
      ctx.lineTo(q2[0]+ax*sign*big, q2[1]+ay*sign*big);
      ctx.lineTo(q1[0]+ax*sign*big, q1[1]+ay*sign*big);
      ctx.closePath(); ctx.fillStyle = hexA(col, alpha); ctx.fill(); ctx.restore();
    };
    fillSide(+1, aheadCol, 0.20);
    fillSide(-1, behindCol, 0.24);
  } else {
    const wedgeIsAhead = F.wedgeCol === 'ahead';
    const baseCol = wedgeIsAhead ? behindCol : aheadCol;
    const wCol    = wedgeIsAhead ? aheadCol  : behindCol;
    ctx.fillStyle = hexA(baseCol, wedgeIsAhead ? 0.24 : 0.20);
    ctx.fillRect(M.l, M.t, Wp, Hp);
    const [b0, b1] = F.wedge;
    const span = (((b1-b0)%360)+360)%360;
    ctx.save(); ctx.beginPath(); ctx.moveTo(Lx, Ly);
    for (let k=0;k<=28;k++){ const [wx,wy] = uv(b0 + span*k/28); ctx.lineTo(Lx+wx*big, Ly+wy*big); }
    ctx.closePath();
    ctx.fillStyle = '#232A26'; ctx.fill();
    ctx.fillStyle = hexA(wCol, wedgeIsAhead ? 0.20 : 0.24); ctx.fill();
    ctx.restore();
  }

  /* the cyclone's other front, ghosted in from the same low */
  const ghostPts = [];
  if (F.other){
    const [ox2, oy2] = uv(F.other.bearFront);
    const [oax, oay] = uv(F.other.bearAhead);
    const tO = tToEdge(Lx, Ly, ox2, oy2, 0);
    const oSide = ((-oy2)*oax + ox2*oay) >= 0 ? 1 : -1;
    const OF = { symbol: F.other.kind === 'cold' ? 'triangles' : 'semicircles',
                 color: F.other.kind === 'cold' ? COL.cold : COL.warm };
    ctx.save(); ctx.globalAlpha = 0.34;
    drawFrontSymbolLine(ctx, Lx, Ly, Lx+ox2*tO, Ly+oy2*tO, OF, oSide, CP?0.6:0.8);
    ctx.restore();
    for (let k=0;k<=8;k++) ghostPts.push([Lx+ox2*tO*k/8, Ly+oy2*tO*k/8]);
    if (!CP){
      const mx = Lx+ox2*tO*0.62, my = Ly+oy2*tO*0.62;
      ctx.save(); ctx.font = `13px ${FONT.mono}`;
      const ow = ctx.measureText(F.other.name).width;
      const olx = clamp(mx, M.l+ow/2+8, M.l+Wp-ow/2-8);
      const oly = clamp(my - 16, M.t+16, M.t+Hp-8);
      ctx.fillStyle = 'rgba(35,42,38,0.82)';
      roundRect(ctx, olx-ow/2-7, oly-15, ow+14, 21, 4); ctx.fill(); ctx.restore();
      txt(ctx, F.other.name, olx, oly, `13px ${FONT.mono}`, hexA(OF.color,0.92), 'center');
      ghostPts.push([olx, oly]);
    }
  }

  /* A—A′ runs along the direction of advance, so the cross-section below is
     this diagonal straightened out */
  const tA = tToEdge(cx0, cy0, ax, ay, 8), tB = tToEdge(cx0, cy0, -ax, -ay, 8);
  const A  = [cx0 - ax*tB, cy0 - ay*tB], Ap = [cx0 + ax*tA, cy0 + ay*tA];
  line(ctx, A[0], A[1], Ap[0], Ap[1], 'rgba(60,163,174,0.55)', 1.6, [7,5]);
  const endPts = [];
  const endLbl = (t, p, dx, dy) => {
    ctx.save(); ctx.font = `700 ${CP?15:18}px ${FONT.disp}`;
    const w = ctx.measureText(t).width;
    const lx = clamp(p[0] - dx*16, M.l+w/2+8, M.l+Wp-w/2-8);
    const ly = clamp(p[1] - dy*16, M.t+20, M.t+Hp-10);
    ctx.fillStyle = 'rgba(35,42,38,0.9)';
    roundRect(ctx, lx-w/2-6, ly-17, w+12, 22, 4); ctx.fill(); ctx.restore();
    txt(ctx, t, lx, ly, `700 ${CP?15:18}px ${FONT.disp}`, COL.accent, 'center');
    endPts.push([lx, ly-6]);
  };
  endLbl('A', A, -ax, -ay); endLbl('A′', Ap, ax, ay);

  /* the front — from the low outward only, never through it */
  const side = ((-fy)*ax + fx*ay) >= 0 ? 1 : -1;
  drawFrontSymbolLine(ctx, Lx, Ly, Ex, Ey, F, side, CP?0.8:1.05);

  /* low-pressure center, sitting on the end of its own front */
  if (!stationary){
    ctx.save();
    ctx.beginPath(); ctx.arc(Lx, Ly, CP?14:21, 0, 7);
    ctx.fillStyle = 'rgba(30,35,32,0.9)'; ctx.fill();
    ctx.strokeStyle = 'rgba(227,106,92,0.75)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.restore();
    txt(ctx, 'L', Lx, Ly+(CP?7:11), `700 ${CP?20:30}px ${FONT.disp}`, '#E36A5C', 'center');
    if (!CP){ const ly2 = clamp(Ly+38, M.t+14, M.t+Hp-6);
      txt(ctx, 'LOW', Lx, ly2, `13px ${FONT.mono}`, 'rgba(227,106,92,0.95)', 'center'); }
  }

  /* Everything after this point competes for the same empty sky, so the
     anchored items (arrow, A—A′ ends, L, station) are collected as obstacles
     first and the free-floating air-mass labels are then placed wherever the
     panel is emptiest on the correct side of the front. */
  const obstacles = [[Lx,Ly],[cx0,cy0],[A[0],A[1]],[Ap[0],Ap[1]],
                     ].concat(CP ? [] : [[M.l+Wp-CRX, M.t+CRY]])          // the compass rose
                    .concat(ghostPts, endPts);
  for (let k=0;k<=6;k++) obstacles.push([A[0]+(Ap[0]-A[0])*k/6, A[1]+(Ap[1]-A[1])*k/6]);

  /* motion arrow, set out along the front so it never lands on the station */
  let arrowTxt = null;
  const AL = CP ? 34 : 62;
  if (!stationary){
    const along = tFwd*0.45;
    const off2 = CP ? 16 : 26;
    const bx = fcx + fx*along + ax*off2, by = fcy + fy*along + ay*off2;
    arrow(ctx, bx, by, bx + ax*AL, by + ay*AL, '#E8E4D9', CP?2.2:2.6, CP?8:10);
    obstacles.push([bx,by],[bx+ax*AL,by+ay*AL]);
    if (!CP){
      const t = 'moves ' + F.planHeading;
      ctx.font = `13px ${FONT.mono}`;
      const w = ctx.measureText(t).width;
      const tx2 = clamp(bx + ax*76, M.l+w/2+10, M.l+Wp-w/2-10);
      const ty2 = clamp(by + ay*76 + 4, M.t+20, M.t+Hp-10);
      arrowTxt = [t, tx2, ty2, w];
      obstacles.push([tx2,ty2]);
    }
  } else if (!CP){
    const t = 'barely moving';
    ctx.font = `13px ${FONT.mono}`;
    const w = ctx.measureText(t).width;
    const tx2 = clamp(M.l+Wp*0.5, M.l+w/2+10, M.l+Wp-w/2-10);
    const ty2 = clamp(fcy+36, M.t+20, M.t+Hp-10);
    arrowTxt = [t, tx2, ty2, w];
    obstacles.push([tx2,ty2]);
  }
  if (arrowTxt){
    const [t,tx2,ty2,w] = arrowTxt;
    ctx.save(); ctx.fillStyle = 'rgba(35,42,38,0.9)';
    roundRect(ctx, tx2-w/2-8, ty2-16, w+16, 23, 4); ctx.fill(); ctx.restore();
    txt(ctx, t, tx2, ty2, `13px ${FONT.mono}`, COL.text2, 'center');
  }

  /* station */
  ctx.save(); ctx.fillStyle = COL.accent;
  const sk = CP ? 0.75 : 1;
  ctx.beginPath(); ctx.moveTo(cx0, cy0-13*sk); ctx.lineTo(cx0-10*sk, cy0+6*sk); ctx.lineTo(cx0+10*sk, cy0+6*sk); ctx.closePath(); ctx.fill();
  ctx.restore();

  /* air-mass labels — searched onto the emptiest patch of their own sector */
  const strip = (label, sub, col, sign) => {
    let t1 = label.replace(/&amp;/g,'&'), t2 = sub.replace(/&amp;/g,'&');
    if (CP){ t1 = t1.split(/[\s(]/)[0]; t2 = ''; }
    ctx.font = `700 ${CP?14:15}px ${FONT.body}`; const w1 = ctx.measureText(t1).width;
    ctx.font = `14px ${FONT.body}`;     const w2 = CP ? 0 : ctx.measureText(t2).width;
    const w = Math.max(w1,w2) + (CP?16:24), h = CP ? 24 : 44;
    let best = null, bestScore = -1;
    for (let gx=0; gx<=10; gx++) for (let gy=0; gy<=6; gy++){
      const px = M.l+8+w/2 + Math.max(0,(Wp-16-w))*(gx/10);
      const py = M.t+8+h/2 + Math.max(0,(Hp-16-h))*(gy/6);
      const rel = (px-fcx)*ax + (py-fcy)*ay;
      if (Math.sign(rel) !== sign || Math.abs(rel) < h*0.75) continue;
      let sc = Math.min(Math.abs(rel), 260);
      obstacles.forEach(o => {
        const dx = Math.abs(px-o[0])/(CP ? w*0.5+20 : w*0.62), dy = Math.abs(py-o[1])/(CP ? h*0.5+14 : h*0.9);
        sc = Math.min(sc, Math.hypot(dx,dy)*90);
      });
      if (sc > bestScore){ bestScore = sc; best = [px,py]; }
    }
    if (!best) best = [clamp(fcx+ax*sign*90, M.l+w/2+8, M.l+Wp-w/2-8),
                       clamp(fcy+ay*sign*90, M.t+h/2+8, M.t+Hp-h/2-8)];
    const bx = best[0]-w/2, byTop = best[1]-h/2;
    ctx.save();
    ctx.fillStyle = 'rgba(30,35,32,0.92)'; roundRect(ctx, bx, byTop, w, h, 5); ctx.fill();
    ctx.strokeStyle = hexA(col,0.55); ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
    if (CP) txt(ctx, t1, bx+w/2, byTop+17, `700 14px ${FONT.body}`, col, 'center');
    else {
      txt(ctx, t1, bx+w/2, byTop+19, `700 15px ${FONT.body}`, col, 'center');
      txt(ctx, t2, bx+w/2, byTop+37, `14px ${FONT.body}`, COL.text2, 'center');
    }
    obstacles.push(best);
  };
  strip(F.behind.label, F.behind.sub, F.behind.col, -1);
  strip(F.ahead.label,  F.ahead.sub,  F.ahead.col,  +1);

  ctx.restore();

  /* compass rose — the plan view is a plain north-up map */
  if (!CP){
  const rx = M.l+Wp-CRX, ry = M.t+CRY, R = CRR;
  ctx.save();
  ctx.fillStyle = 'rgba(35,42,38,0.85)';
  ctx.beginPath(); ctx.arc(rx, ry, R+4, 0, 7); ctx.fill();
  ctx.strokeStyle = COL.border; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(rx, ry, R, 0, 7); ctx.stroke();
  ctx.restore();
  arrow(ctx, rx, ry+R*0.75, rx, ry-R*0.80, COL.text2, 1.8, CP?5:7);
  txt(ctx, 'N', rx, ry-R-(CP?3:6), `700 13px ${FONT.mono}`, COL.text2, 'center');
  }

}

/* ═══════════════════════════════════════════════════════════════════
   STATION MODEL  (ESSRT p.18 conventions)
   ═══════════════════════════════════════════════════════════════════ */
function drawStationModel(ctx, W, H, o){
  const cx = W*0.53, cy = H*0.45, r = Math.min(W*0.085, H*0.155);
  ctx.save();

  /* wind barb (points toward the direction the wind is coming FROM) */
  const a = (o.wdir - 90)*Math.PI/180;                 // 0°=N → up
  const dx = Math.cos(a), dy = Math.sin(a);
  const L = r*2.7;
  const bx = cx + dx*r, by = cy + dy*r;
  const ex = cx + dx*(r+L), ey = cy + dy*(r+L);
  if (o.wspd >= 3){
    ctx.strokeStyle = COL.text; ctx.lineWidth = 2.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
    let rem = Math.round(o.wspd/5)*5, pos = 0;
    const px2 = -dy, py2 = dx;                          // perpendicular
    const step = r*0.42;
    while (rem >= 50 && pos < 4){
      const p0 = [ex - dx*step*pos, ey - dy*step*pos];
      const p1 = [ex - dx*step*(pos+1), ey - dy*step*(pos+1)];
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]);
      ctx.lineTo(p0[0]+px2*r*0.85, p0[1]+py2*r*0.85);
      ctx.lineTo(p1[0],p1[1]); ctx.closePath();
      ctx.fillStyle = COL.text; ctx.fill();
      rem -= 50; pos += 1.15;
    }
    while (rem >= 10 && pos < 6){
      const p0 = [ex - dx*step*pos, ey - dy*step*pos];
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p0[0]+px2*r*0.85, p0[1]+py2*r*0.85); ctx.stroke();
      rem -= 10; pos += 1;
    }
    if (rem >= 5){
      const p0 = [ex - dx*step*Math.max(pos,0.9), ey - dy*step*Math.max(pos,0.9)];
      ctx.beginPath(); ctx.moveTo(p0[0],p0[1]); ctx.lineTo(p0[0]+px2*r*0.45, p0[1]+py2*r*0.45); ctx.stroke();
    }
  }

  /* sky cover */
  const e = clamp(Math.round(o.sky),0,8);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7);
  ctx.fillStyle = '#1E2320'; ctx.fill();
  ctx.strokeStyle = COL.text; ctx.lineWidth = 2.4; ctx.stroke();
  if (e >= 8){
    ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle = COL.text; ctx.fill();
  } else if (e > 0){
    const frac = (e===7 ? 7.4 : e)/8;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2);
    ctx.closePath(); ctx.fillStyle = COL.text; ctx.fill();
    if (e===1||e===3||e===5) line(ctx, cx, cy-r, cx, cy+r, COL.text, 2.2);
  }

  /* numbers */
  const fs = Math.max(16, Math.round(r*0.92));
  const num = (s, x, y, al) => {
    ctx.save(); ctx.font = `700 ${fs}px ${FONT.mono}`; ctx.textAlign = al; ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#262B27'; ctx.lineWidth = 5; ctx.strokeText(s, x, y);
    ctx.fillStyle = COL.text; ctx.fillText(s, x, y); ctx.restore();
  };
  num(Math.round(o.T)+'',  cx - r*1.35, cy - r*0.55, 'right');
  num(Math.round(o.Td)+'', cx - r*1.35, cy + r*1.30, 'right');
  const code = Math.round((o.P*10) % 1000).toString().padStart(3,'0');
  num(code, cx + r*1.35, cy - r*0.55, 'left');

  /* present weather */
  if (o.wx && o.wx !== 'none'){
    const wx = cx - r*1.95, wy = cy - r*0.05;
    ctx.save(); ctx.fillStyle = COL.precip; ctx.strokeStyle = COL.precip;
    if (o.wx === 'rain'){
      for (let i=0;i<3;i++){ ctx.beginPath(); ctx.arc(wx - r*0.28 + (i%2)*r*0.56, wy - r*0.18 + Math.floor(i/2)*r*0.48, r*0.16, 0, 7); ctx.fill(); }
    } else {
      ctx.lineWidth = 2.4; ctx.lineJoin='round';
      ctx.strokeStyle = '#D9B24C';
      ctx.beginPath(); ctx.moveTo(wx+r*0.20, wy-r*0.40); ctx.lineTo(wx-r*0.20, wy+r*0.02); ctx.lineTo(wx+r*0.16, wy+r*0.08); ctx.lineTo(wx-r*0.22, wy+r*0.44); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   STATION TRACE — what one fixed station records, plotted against time
   ═══════════════════════════════════════════════════════════════════ */
const WIND_COL = 'rgba(150,190,240,0.95)';
function skyCircle(ctx, x, y, r, e){
  e = clamp(Math.round(e), 0, 8);
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#1E2320'; ctx.fill();
  if (e >= 8){ ctx.fillStyle = COL.text; ctx.fill(); }
  else if (e > 0){
    const frac = (e === 7 ? 7.4 : e)/8;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2); ctx.closePath();
    ctx.fillStyle = COL.text; ctx.fill();
    if (e === 1 || e === 3 || e === 5) line(ctx, x, y-r, x, y+r, COL.text, 1.6);
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.strokeStyle = COL.text; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.restore();
}
function wxGlyph(ctx, x, y, s, wx){
  ctx.save();
  if (wx === 'rain'){
    ctx.fillStyle = COL.precip;
    for (const dx of [-s*0.45, s*0.45]){ ctx.beginPath(); ctx.arc(x+dx, y, s*0.30, 0, 7); ctx.fill(); }
  } else if (wx === 'tstm'){
    ctx.strokeStyle = '#E2BE58'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x+s*0.30, y-s*0.75); ctx.lineTo(x-s*0.25, y+s*0.02); ctx.lineTo(x+s*0.22, y+s*0.10); ctx.lineTo(x-s*0.30, y+s*0.80); ctx.stroke();
  }
  ctx.restore();
}
function drawTrace(ctx, W, H, out){
  const F = FRONTS[S.front];
  const M = {l:62, r:120, t:22, b:24};
  const Wp = W - M.l - M.r, gap = 5;
  const inner = H - M.t - M.b - gap*3;
  const FR = [0.40, 0.24, 0.18, 0.18];
  let yy = M.t;
  const R = FR.map(f => { const h = Math.round(inner*f); const r = {y0:yy, y1:yy+h, h}; yy += h + gap; return r; });
  const [RT, RP, RW, RS] = R;
  const RR = RS;
  const PX = t => M.l + (t - T_MIN)/(T_MAX - T_MIN)*Wp;
  if (out){ out.l = M.l; out.Wp = Wp; }
  ctx.save();
  ctx.fillStyle = '#222824'; ctx.fillRect(0, 0, W, H);

  const N = 240, samp = [];
  for (let i=0;i<=N;i++){
    const t = T_MIN + (T_MAX - T_MIN)*i/N, d = -t*F.speedKmh;
    samp.push({t, T:tbl(F.T,d), Td:tbl(F.Td,d), P:tbl(F.P,d)});
  }
  R.forEach(r => {
    ctx.fillStyle = '#272D29'; ctx.fillRect(M.l, r.y0, Wp, r.h);
    ctx.strokeStyle = COL.border; ctx.lineWidth = 1; ctx.strokeRect(M.l+0.5, r.y0+0.5, Wp-1, r.h-1);
  });
  for (let t = T_MIN + 6; t < T_MAX; t += 6){ const x = PX(t); R.forEach(r => line(ctx, x, r.y0+1, x, r.y1-1, 'rgba(232,228,217,0.06)', 1)); }
  const fz = PX(0);
  R.forEach(r => line(ctx, fz, r.y0, fz, r.y1, 'rgba(232,228,217,0.40)', 1.5, [5,4]));

  /* temperature & dewpoint */
  const tv = samp.flatMap(s => [s.T, s.Td]);
  const tMin = Math.floor(Math.min(...tv)/5)*5 - 3, tMax = Math.ceil(Math.max(...tv)/5)*5 + 3;
  const TY = v => RT.y1 - (v - tMin)/(tMax - tMin)*RT.h;
  const tStep = [5, 10, 20, 30].find(s => RT.h*s/(tMax - tMin) >= 17) || 40;
  for (let v = Math.ceil(tMin/tStep)*tStep; v <= tMax; v += tStep){
    line(ctx, M.l, TY(v), M.l+Wp, TY(v), 'rgba(232,228,217,0.07)', 1);
    txt(ctx, v + '°F', M.l-8, TY(v)+5, `13px ${FONT.mono}`, COL.text2, 'right');
  }
  const plot = (key, Y, col, w) => {
    ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineJoin = 'round'; ctx.beginPath();
    samp.forEach((s, i) => { const x = PX(s.t), y = Y(s[key]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke(); ctx.restore();
  };
  ctx.save(); ctx.beginPath(); ctx.rect(M.l, RT.y0, Wp, RT.h); ctx.clip();
  plot('T', TY, COL.warm, 2.4); plot('Td', TY, COL.precip, 2.2);
  ctx.restore();

  /* pressure */
  const pv = samp.map(s => s.P);
  let pMin = Math.min(...pv), pMax = Math.max(...pv);
  const pPad = Math.max(0.6, (pMax - pMin)*0.14); pMin -= pPad; pMax += pPad;
  const PY2 = v => RP.y1 - (v - pMin)/(pMax - pMin)*RP.h;
  const pStep = [1, 2, 4, 5, 10, 20].find(s => RP.h*s/(pMax - pMin) >= 16) || 20;
  if (Math.ceil(pMin/pStep)*pStep > pMax){ const v = Math.round((pMin + pMax)/2); pMin = Math.min(pMin, v - 1); pMax = Math.max(pMax, v + 1); }
  for (let v = Math.ceil(pMin/pStep)*pStep; v <= pMax; v += pStep){
    line(ctx, M.l, PY2(v), M.l+Wp, PY2(v), 'rgba(232,228,217,0.07)', 1);
    txt(ctx, v.toFixed(0), M.l-8, PY2(v)+5, `13px ${FONT.mono}`, COL.text2, 'right');
  }
  ctx.save(); ctx.beginPath(); ctx.rect(M.l, RP.y0, Wp, RP.h); ctx.clip();
  plot('P', PY2, COL.gold, 2.4);
  ctx.restore();

  /* wind, sky cover and present weather at regular times */
  const pxPerH = Wp/(T_MAX - T_MIN);
  const step = [1, 2, 3, 4, 6].find(s => s*pxPerH >= 30) || 6;
  const sp = step*pxPerH;
  for (let t = Math.ceil(T_MIN/step)*step; t <= T_MAX + 1e-6; t += step){
    const x = PX(t);
    if (x < M.l + 9 || x > M.l + Wp - 9) continue;
    const d = -t*F.speedKmh;
    const wd = tbl(F.WD, d), a = (wd + 90)*Math.PI/180;
    const hl = Math.min(12, sp*0.38, RW.h*0.44), cy = (RW.y0 + RW.y1)/2;
    const ax = Math.cos(a), ay = Math.sin(a);
    arrow(ctx, x - ax*hl, cy - ay*hl, x + ax*hl, cy + ay*hl, WIND_COL, 2.2, 7);
    const rr = Math.min(7.5, RS.h*0.36, sp*0.22);
    const wx = F.wx(d), cx = wx === 'none' ? x : x - 5;
    skyCircle(ctx, cx, (RS.y0 + RS.y1)/2, rr, tbl(F.SKY, d));
    if (wx !== 'none') wxGlyph(ctx, cx + rr + 6, (RS.y0 + RS.y1)/2, Math.min(9, RS.h*0.5), wx);
  }

  /* series labels */
  const LX = M.l + Wp + 10;
  const mid = r => (r.y0 + r.y1)/2 + 5;
  if (RT.h >= 38){
    txt(ctx, 'Temperature', LX, RT.y0 + 15, `700 13px ${FONT.body}`, COL.warm, 'left');
    txt(ctx, 'Dewpoint',    LX, RT.y0 + 33, `700 13px ${FONT.body}`, COL.precip, 'left');
  } else {
    txt(ctx, 'Temp', LX, mid(RT), `700 13px ${FONT.body}`, COL.warm, 'left');
    txt(ctx, '/ Dewpt', LX + 36, mid(RT), `700 13px ${FONT.body}`, COL.precip, 'left');
  }
  txt(ctx, 'Pressure (mb)', LX, mid(RP), `700 13px ${FONT.body}`, COL.gold, 'left');
  txt(ctx, 'Wind',          LX, mid(RW), `700 13px ${FONT.body}`, WIND_COL, 'left');
  txt(ctx, 'Sky',           LX, mid(RS), `700 13px ${FONT.body}`, COL.text2, 'left');
  txt(ctx, '/ precip',      LX + 26, mid(RS), `700 13px ${FONT.body}`, COL.precip, 'left');

  /* time axis */
  for (let t = T_MIN; t <= T_MAX; t += 6){
    const x = PX(t);
    line(ctx, x, RR.y1, x, RR.y1 + 4, COL.text2, 1);
    const lbl = t === 0 ? '0 h' : (t > 0 ? '+' : MINUS) + Math.abs(t) + ' h';
    txt(ctx, lbl, x, RR.y1 + 18, `13px ${FONT.mono}`, COL.text2, t === T_MIN ? 'left' : t === T_MAX ? 'right' : 'center');
  }

  /* now marker + passage label on the side away from it */
  const nx = PX(clamp(S.t, T_MIN, T_MAX));
  ctx.save(); ctx.font = `700 13px ${FONT.mono}`;
  const fpw = ctx.measureText('FRONT PASSES').width;
  ctx.restore();
  const fpRight = nx <= fz;
  const fpx = fpRight ? fz + 8 : fz - 8 - fpw;
  txt(ctx, 'FRONT PASSES', fpx, M.t - 7, `700 13px ${FONT.mono}`, COL.text2, 'left');
  line(ctx, nx, M.t - 3, nx, RR.y1 + 2, COL.accent, 2);
  ctx.save(); ctx.fillStyle = COL.accent;
  ctx.beginPath(); ctx.moveTo(nx, M.t - 2); ctx.lineTo(nx - 6, M.t - 12); ctx.lineTo(nx + 6, M.t - 12); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   OBSERVATIONS & WORDS
   ═══════════════════════════════════════════════════════════════════ */
function obsAt(F, t){
  const d = -t*F.speedKmh;
  return { d, T:tbl(F.T,d), Td:tbl(F.Td,d), P:tbl(F.P,d),
           wdir:tbl(F.WD,d), wspd:tbl(F.WS,d), sky:tbl(F.SKY,d),
           pr:tbl(F.PR,d), wx:F.wx(d) };
}
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const dirName = deg => COMPASS[Math.round(((deg%360)+360)%360/22.5)%16];
function cloudOver(F, d){
  let best = null;
  F.clouds.forEach(cl => { if (d >= cl.x0 && d <= cl.x1 && (!best || cl.z0 < best.z0)) best = cl; });
  return best;
}
function snapSub(F, t){
  const o = obsAt(F, t);
  if (o.wx === 'tstm') return 'T-storms';
  if (o.wx === 'rain') return o.pr > 0.6 ? 'Heavy rain' : o.pr > 0.25 ? 'Rain' : 'Light rain';
  const c = cloudOver(F, o.d);
  if (c) return c.name === 'anvil' ? 'Anvil' : c.name;
  return o.sky >= 2.5 ? 'Partly cloudy' : 'Clear';
}
const snapName = s => s === 0 ? 'Passes' : (s < 0 ? MINUS : '+') + Math.abs(s) + ' h';
function fmtH(t){ const v = Math.abs(t) < 0.05 ? 0 : t; return (v < 0 ? MINUS : v > 0 ? '+' : '') + Math.abs(v).toFixed(1) + ' h'; }
const sgnNum = v => v > 0 ? '+' + v : v < 0 ? MINUS + Math.abs(v) : '0';
function splitAM(label){
  const s = label.replace(/&amp;/g, '&');
  const m = s.match(/^(\S+)\s*(?:—\s*(.*)|\((.*)\))?$/);
  return m ? { code: m[1], name: (m[2] || m[3] || '').trim() } : { code: s, name: '' };
}
function skyWord(s){ const e = Math.round(s); return e >= 8 ? 'overcast' : e >= 5 ? 'mostly cloudy' : e >= 3 ? 'partly cloudy' : e >= 1 ? 'few clouds' : 'clear'; }
function cardModel(){
  const F = FRONTS[S.front], o = obsAt(F, S.t);
  const side = o.d >= 0 ? F.ahead : F.behind;
  const am = splitAM(side.label);
  const calm = o.wspd < 3;
  const rows = [
    { l:'Air mass',      v: am.code, u: am.name, col: side.col },
    { l:'Temperature',   v: Math.round(o.T),  u: '°F' },
    { l:'Dewpoint',      v: Math.round(o.Td), u: '°F' },
    { l:'Pressure',      v: o.P.toFixed(1),   u: 'mb' },
    { l:'Wind',          v: calm ? 'Calm' : dirName(o.wdir), u: calm ? '' : Math.round(o.wspd) + ' kt' },
    { l:'Sky cover',     v: Math.round(o.sky) + '/8', u: skyWord(o.sky) },
    { l:'Precipitation', v: o.wx === 'tstm' ? 'T-storm' : o.wx === 'rain' ? 'Rain' : 'None',
      u: o.wx === 'none' ? '' : (o.pr > 0.6 ? 'heavy' : o.pr > 0.25 ? 'moderate' : 'light') }
  ];
  const dT  = Math.round(tbl(F.T, -180)  - tbl(F.T, 180));
  const dTd = Math.round(tbl(F.Td, -180) - tbl(F.Td, 180));
  const across = [
    { l:'Temperature', v: sgnNum(dT),  u: '°F' },
    { l:'Dewpoint',    v: sgnNum(dTd), u: '°F' },
    { l:'Wind shift',  v: dirName(tbl(F.WD, 180)) + ' → ' + dirName(tbl(F.WD, -180)) }
  ];
  return { time: fmtH(S.t), o, rows, across };
}

/* ═══════════════════════════════════════════════════════════════════
   LAYOUT + SCENE
   ═══════════════════════════════════════════════════════════════════ */
function layout(W, H, capture){
  const stripH = clamp(Math.round(H*0.35), 160, 280);
  const up = H - stripH;
  const top = 12, chipH = capture ? 0 : 34;
  const L = { W, H, up, top, chipH, strip: {x:0, y:up, w:W, h:stripH} };
  if (S.view === 'map') L.plan = {x:0, y:0, w:W, h:up};
  else {
    L.xs = {x:0, y:0, w:W, h:up};
    if (S.view === 'both'){
      const Wp = W - 56 - 14, Hp = up - top - 34 - chipH;
      const iw = Math.round(clamp(Wp*0.27, 200, 380));
      const ih = Math.round(clamp(Math.min(Hp*0.68, iw*0.60), 104, 230));
      L.inset = {x: 56 + 6, y: top + chipH + 6, w: iw, h: ih};
    }
  }
  return L;
}
function renderScene(c, W, H, o){
  const L = layout(W, H, o.capture); o.layout = L;
  c.save();
  c.fillStyle = '#262B27'; c.fillRect(0, 0, W, H);
  if (L.xs){
    c.save(); c.translate(L.xs.x, L.xs.y); c.beginPath(); c.rect(0, 0, L.xs.w, L.xs.h); c.clip();
    drawXS(c, L.xs.w, L.xs.h, {top: L.top, chipH: L.chipH, avoid: L.inset, out: o});
    c.restore();
  }
  const planIn = (R, compact) => {
    if (compact){ c.save(); c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 14; c.fillStyle = '#232A26'; roundRect(c, R.x, R.y, R.w, R.h, 6); c.fill(); c.restore(); }
    c.save(); c.translate(R.x, R.y);
    roundRect(c, 0, 0, R.w, R.h, compact ? 6 : 0); c.clip();
    c.fillStyle = '#232A26'; c.fillRect(0, 0, R.w, R.h);
    const po = {compact, top: compact ? 0 : (o.capture ? 14 : 50), out: {}};
    drawPlan(c, R.w, R.h, po);
    c.restore();
    o.planHit = Object.assign({ox: R.x, oy: R.y}, po.out.plan);
    if (compact){ c.save(); c.strokeStyle = 'rgba(232,228,217,0.32)'; c.lineWidth = 1; roundRect(c, R.x+0.5, R.y+0.5, R.w-1, R.h-1, 6); c.stroke(); c.restore(); }
  };
  if (L.inset) planIn(L.inset, true);
  if (L.plan) planIn(L.plan, false);
  c.save(); c.translate(L.strip.x, L.strip.y);
  const to = {}; drawTrace(c, L.strip.w, L.strip.h, to);
  c.restore();
  o.trace = Object.assign({ox: L.strip.x, oy: L.strip.y}, to);
  line(c, 0, L.strip.y + 0.5, W, L.strip.y + 0.5, COL.borderH, 1);
  c.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   READOUT CARD
   ═══════════════════════════════════════════════════════════════════ */
const el = id => document.getElementById(id);
const cardEl = el('card');
cardEl.innerHTML =
  `<div class="eb"><span>Station ▲</span><span class="tm" id="cTm"></span></div>` +
  `<canvas class="stn" id="cStn"></canvas>` +
  ['Air mass','Temperature','Dewpoint','Pressure','Wind','Sky cover','Precipitation']
    .map((l, i) => `<div class="r"><span class="l">${l}</span><span class="v" id="cR${i}"></span></div>`).join('') +
  `<div class="sub"><span>Across the front</span><span>360 km</span></div>` +
  ['Temperature','Dewpoint','Wind shift']
    .map((l, i) => `<div class="r"><span class="l">${l}</span><span class="v" id="cA${i}"></span></div>`).join('') +
  `<div class="src">Idealized fronts · front symbols: NYS ESSRT p. 18</div>`;
const vHTML = r => `<span${r.col ? ` style="color:${r.col}"` : ''}>${r.v}</span>${r.u ? `<span class="u">${r.u}</span>` : ''}`;
const setH = (id, h) => { const e = el(id); if (e && e.innerHTML !== h) e.innerHTML = h; };
function renderCard(){
  const m = cardModel();
  setH('cTm', m.time);
  m.rows.forEach((r, i) => setH('cR' + i, vHTML(r)));
  m.across.forEach((r, i) => setH('cA' + i, vHTML(r)));
  const cs = el('cStn'), w = cs.clientWidth, h = cs.clientHeight;
  if (!w || !h) return;
  const pw = Math.round(w*DPR), ph = Math.round(h*DPR);
  if (cs.width !== pw || cs.height !== ph){ cs.width = pw; cs.height = ph; }
  const c = cs.getContext('2d');
  c.setTransform(DPR, 0, 0, DPR, 0, 0); c.clearRect(0, 0, w, h);
  drawStationModel(c, w, h, m.o);
}
function drawCardCanvas(c, x, y, w, h){
  const m = cardModel();
  c.save();
  c.fillStyle = '#262B27'; roundRect(c, x, y, w, h, 6); c.fill();
  c.strokeStyle = COL.border; c.lineWidth = 1; c.stroke();
  const px = x + 16, pw = w - 32;
  let yy = y + 22;
  txt(c, 'STATION ▲', px, yy, `700 13px ${FONT.mono}`, COL.accent, 'left', 'middle');
  txt(c, m.time, px + pw, yy, `700 18px ${FONT.mono}`, COL.text, 'right', 'middle');
  yy += 16;
  const hr = () => { c.fillStyle = COL.border; c.fillRect(px, yy, pw, 1); };
  hr();
  c.save(); c.translate(px, yy + 2); drawStationModel(c, pw, 150, m.o); c.restore();
  yy += 156;
  const row = r => {
    hr(); yy += 17;
    txt(c, r.l.toUpperCase(), px, yy, `500 13px ${FONT.mono}`, COL.text2, 'left', 'middle');
    let xr = px + pw;
    if (r.u){ c.font = `500 14px ${FONT.body}`; const uw = c.measureText(r.u).width; txt(c, r.u, xr, yy + 1, `500 14px ${FONT.body}`, COL.text2, 'right', 'middle'); xr -= uw + 6; }
    txt(c, String(r.v), xr, yy, `700 21px ${FONT.disp}`, r.col || COL.text, 'right', 'middle');
    yy += 17;
  };
  m.rows.forEach(row);
  yy += 16;
  txt(c, 'ACROSS THE FRONT', px, yy, `700 13px ${FONT.mono}`, COL.accent, 'left', 'middle');
  txt(c, '360 KM', px + pw, yy, `500 13px ${FONT.mono}`, COL.text2, 'right', 'middle');
  yy += 12;
  m.across.forEach(row);
  c.restore();
}

/* ═══════════════════════════════════════════════════════════════════
   CONTROLS
   ═══════════════════════════════════════════════════════════════════ */
const ctl = el('controls');
function mk(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
let sliderBusy = false;
function renderControls(){
  const F = FRONTS[S.front];
  ctl.innerHTML = '';
  const p = mk('button', 'cc-btn play', ''); p.id = 'bPlay'; p.onclick = playStep; ctl.appendChild(p);
  const sn = mk('div', 'snaps');
  SNAPS.forEach(s => {
    const b = mk('button', 'cc-btn snap', `<span class="n">${snapName(s)}</span><span class="v">${snapSub(F, s)}</span>`);
    b.dataset.t = s; b.title = s === 0 ? '0 h' : snapName(s);
    b.onclick = () => { stopPlay(); setT(s); };
    sn.appendChild(b);
  });
  ctl.appendChild(sn);
  const sl = mk('div', 'slider', `<input type="range" min="${T_MIN}" max="${T_MAX}" step="0.1" aria-label="Hours from frontal passage"><span class="sv"></span>`);
  const inp = sl.querySelector('input'); inp.value = S.t;
  inp.oninput = () => { stopPlay(); sliderBusy = true; setT(+inp.value); sliderBusy = false; };
  ctl.appendChild(sl);
  syncControls();
}
function syncControls(){
  ctl.querySelectorAll('.snap').forEach(b => b.classList.toggle('is-active', Math.abs(+b.dataset.t - S.t) < 0.01));
  const inp = ctl.querySelector('.slider input'); if (inp && !sliderBusy) inp.value = S.t;
  const sv = ctl.querySelector('.slider .sv'); if (sv) sv.textContent = fmtH(S.t);
  const p = el('bPlay');
  if (p){
    const next = SNAPS.find(s => s > S.t + 0.01);
    p.classList.toggle('on', !!S.play);
    p.innerHTML = S.play ? '<span class="ic">❚❚</span><span>Pause</span>'
                : next === undefined ? '<span class="ic">↺</span><span>Replay</span>'
                : '<span class="ic">▶</span><span>Play</span>';
  }
}
function setT(t){ S.t = clamp(Math.round(t*100)/100, T_MIN, T_MAX); syncControls(); renderCard(); draw(); }
function stopPlay(){ if (S.play){ S.play = null; syncControls(); } }
function playStep(){
  if (S.play){ stopPlay(); return; }
  const next = SNAPS.find(s => s > S.t + 0.01);
  if (next === undefined){ setT(SNAPS[0]); return; }
  S.play = { from: S.t, to: next, t0: performance.now(), dur: clamp(380*(next - S.t), 700, 3200) };
  syncControls();
}

/* vertical exaggeration */
const VE_MAX = 150;
const veToS = v => Math.round(Math.log(v)/Math.log(VE_MAX)*1000);
const sToVe = s => Math.max(1, Math.round(Math.pow(VE_MAX, s/1000)));
function syncVE(){
  document.querySelectorAll('[data-ve]').forEach(b => b.classList.toggle('is-active', +b.dataset.ve === S.ve));
  const s = el('veSlider'); if (document.activeElement !== s) s.value = veToS(S.ve);
  el('veVal').textContent = S.ve + '×';
}
function setVE(v, jump){
  S.ve = clamp(Math.round(v), 1, VE_MAX);
  if (jump && S.ve === 1 && Math.abs(S.xf) > 20){ stopPlay(); S.t = 0; syncControls(); renderCard(); }
  syncVE(); draw();
}
document.querySelectorAll('[data-ve]').forEach(b => b.onclick = () => setVE(+b.dataset.ve, true));
el('veSlider').oninput = e => setVE(sToVe(+e.target.value), false);

/* views, layers, front tabs */
document.querySelectorAll('#views [data-v]').forEach(b => b.onclick = () => {
  S.view = b.dataset.v;
  document.querySelectorAll('#views [data-v]').forEach(x => x.classList.toggle('is-active', x === b));
  el('veChip').style.display = S.view === 'map' ? 'none' : '';
  draw();
});
const lmenu = el('lmenu'), pmenu = el('pmenu');
el('bLayers').onclick = e => { e.stopPropagation(); lmenu.classList.toggle('open'); pmenu.classList.remove('open'); };
lmenu.addEventListener('click', e => e.stopPropagation());
lmenu.querySelectorAll('[data-layer]').forEach(b => b.onclick = () => {
  const k = b.dataset.layer; S.layers[k] = !S.layers[k]; b.classList.toggle('is-active', S.layers[k]); draw();
});
document.addEventListener('click', e => {
  if (!lmenu.contains(e.target)) lmenu.classList.remove('open');
  if (!pmenu.contains(e.target)) pmenu.classList.remove('open');
});
document.querySelectorAll('#tabs [data-front]').forEach(b => b.onclick = () => {
  if (S.front === b.dataset.front) return;
  S.front = b.dataset.front; stopPlay();
  document.querySelectorAll('#tabs [data-front]').forEach(x => x.classList.toggle('is-active', x === b));
  renderControls(); renderCard(); draw();
});

/* ═══════════════════════════════════════════════════════════════════
   CANVAS + LOOP + POINTER
   ═══════════════════════════════════════════════════════════════════ */
const cv = el('cv'), stage = el('stage'), ctx = cv.getContext('2d');
let CW = 0, CH = 0, DPR = 1, LAST = null, capturing = false;
function resize(){
  const r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  CW = Math.max(300, Math.round(r.width)); CH = Math.max(240, Math.round(r.height));
  cv.width = Math.round(CW*DPR); cv.height = Math.round(CH*DPR);
  draw(); renderCard();
}
new ResizeObserver(resize).observe(stage);
function draw(){
  if (capturing || !CW) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, CW, CH);
  const o = { pr: DPR }; renderScene(ctx, CW, CH, o); LAST = o;
}
function loop(now){
  if (S.play && !capturing){
    const p = S.play, k = clamp((now - p.t0)/p.dur, 0, 1);
    S.t = p.from + (p.to - p.from)*smooth(k);
    if (k >= 1){ S.t = p.to; S.play = null; }
    syncControls(); renderCard(); draw();
  }
  requestAnimationFrame(loop);
}

function ptr(e){ const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
const inRect = (p, R) => R && p[0] >= R.x && p[0] <= R.x + R.w && p[1] >= R.y && p[1] <= R.y + R.h;
function hitZone(p){
  if (!LAST) return null;
  const L = LAST.layout;
  if (L.inset && inRect(p, L.inset)) return 'plan';
  if (L.plan && inRect(p, L.plan)) return 'plan';
  if (L.xs && LAST.xs){
    const X = LAST.xs;
    if (p[0] >= L.xs.x + X.M.l && p[0] <= L.xs.x + X.M.l + X.Wp && p[1] >= L.xs.y + X.M.t && p[1] <= L.xs.y + X.M.t + X.Hp + X.M.b) return 'xs';
  }
  if (inRect(p, L.strip) && LAST.trace && p[0] >= LAST.trace.l - 4 && p[0] <= LAST.trace.l + LAST.trace.Wp + 4) return 'strip';
  return null;
}
function tFromPointer(zone, p){
  const F = FRONTS[S.front];
  if (zone === 'xs'){ const X = LAST.xs, L = LAST.layout; return (X.xmin + (p[0] - L.xs.x - X.M.l)/X.Wp*X.Xr)/F.speedKmh; }
  if (zone === 'plan'){ const P = LAST.planHit; const off = (p[0] - P.ox - P.cx0)*P.ax + (p[1] - P.oy - P.cy0)*P.ay; return (off/P.PPK)/F.speedKmh; }
  if (zone === 'strip'){ const T = LAST.trace; return T_MIN + (p[0] - T.ox - T.l)/T.Wp*(T_MAX - T_MIN); }
  return NaN;
}
let drag = null;
function applyDrag(p){
  let t = tFromPointer(drag, p); if (!isFinite(t)) return;
  t = clamp(t, T_MIN, T_MAX);
  for (const s of SNAPS) if (Math.abs(t - s) < 0.3) t = s;
