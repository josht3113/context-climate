  setT(Math.round(t*10)/10);
}
cv.addEventListener('pointerdown', e => { const p = ptr(e); const z = hitZone(p); if (!z) return; drag = z; cv.setPointerCapture(e.pointerId); stopPlay(); applyDrag(p); e.preventDefault(); });
cv.addEventListener('pointermove', e => { const p = ptr(e); if (drag){ applyDrag(p); return; } const z = hitZone(p); cv.style.cursor = (z === 'xs' || z === 'strip') ? 'ew-resize' : z === 'plan' ? 'grab' : 'default'; });
cv.addEventListener('pointerup', () => { drag = null; });
cv.addEventListener('pointercancel', () => { drag = null; });
document.addEventListener('keydown', e => {
  const tg = e.target && e.target.tagName;
  if (tg === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const s = e.key === 'ArrowRight' ? SNAPS.find(x => x > S.t + 0.01) : [...SNAPS].reverse().find(x => x < S.t - 0.01);
    if (s !== undefined){ stopPlay(); setT(s); }
    e.preventDefault();
  } else if (e.key === ' ' && tg !== 'BUTTON'){ playStep(); e.preventDefault(); }
});

/* ═══════════════════════════════════════════════════════════════════
   EXPORT — PNG (whole tool or one panel), GIF and MP4 sweeps
   ═══════════════════════════════════════════════════════════════════ */
const EW = 1280, EH = 720;
function stampText(){
  const F = FRONTS[S.front];
  const t = Math.abs(S.t) < 0.05 ? 'front passing the station' : Math.abs(S.t).toFixed(1) + ' h ' + (S.t < 0 ? 'before' : 'after') + ' frontal passage';
  return `${F.name} · ${t} · ` + (S.ve <= 1 ? 'true scale' : `vertical exaggeration ${S.ve}×`);
}
function compose(c, scale){
  c.setTransform(scale, 0, 0, scale, 0, 0);
  c.fillStyle = '#1E2320'; c.fillRect(0, 0, EW, EH);
  txt(c, 'Anatomy of a Front', 18, 30, `700 26px ${FONT.disp}`, COL.text, 'left', 'middle');
  txt(c, stampText(), 18, 56, `500 14px ${FONT.mono}`, COL.text2, 'left', 'middle');
  txt(c, 'contextclimate.io', EW - 18, 30, `700 14px ${FONT.mono}`, COL.accent, 'right', 'middle');
  const cw = 290, sx = 16, sy = 74, sw = EW - 32 - cw - 12, sh = EH - sy - 34;
  c.save(); roundRect(c, sx, sy, sw, sh, 6); c.clip(); c.translate(sx, sy);
  renderScene(c, sw, sh, { capture: true, pr: scale });
  c.restore();
  c.strokeStyle = COL.border; c.lineWidth = 1; roundRect(c, sx + 0.5, sy + 0.5, sw - 1, sh - 1, 6); c.stroke();
  drawCardCanvas(c, sx + sw + 12, sy, cw, sh);
  txt(c, 'Idealized fronts · front symbols per NYS Earth & Space Sciences Reference Tables p. 18', 18, EH - 16, `500 13px ${FONT.mono}`, COL.text2, 'left', 'middle');
}
function slug(){
  const t = Math.abs(S.t) < 0.05 ? '0h' : (S.t < 0 ? 'minus' : 'plus') + String(Math.abs(Math.round(S.t*10)/10)).replace('.', 'p') + 'h';
  return 'anatomy-of-a-front-' + S.front + '-' + t;
}
function saveBlob(b, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const status = t => { el('status').textContent = t; };
const tick = () => new Promise(r => setTimeout(r, 0));
function setBusy(b){ ['bPNG', 'bGIF', 'bMP4'].forEach(id => el(id).disabled = b); }

const PNG_OPTS = [['whole', 'Whole tool'], ['xs', 'Cross-section'], ['map', 'Map'], ['strip', 'Station trace'], ['card', 'Readout card']];
PNG_OPTS.forEach(([k, n]) => { const b = mk('button', '', n); b.onclick = () => { pmenu.classList.remove('open'); exportPNG(k); }; pmenu.appendChild(b); });
el('bPNG').onclick = e => { e.stopPropagation(); pmenu.classList.toggle('open'); lmenu.classList.remove('open'); };

async function exportPNG(kind){
  setBusy(true); capturing = true; status('rendering…'); await tick();
  try {
    let oc;
    if (kind === 'whole'){ oc = document.createElement('canvas'); oc.width = EW*2; oc.height = EH*2; compose(oc.getContext('2d'), 2); }
    else if (kind === 'card'){
      const w = 290, h = 612, sc = 3; oc = document.createElement('canvas'); oc.width = w*sc; oc.height = h*sc;
      const c = oc.getContext('2d'); c.setTransform(sc, 0, 0, sc, 0, 0); c.fillStyle = '#1E2320'; c.fillRect(0, 0, w, h);
      drawCardCanvas(c, 0, 0, w, h);
    } else {
      const W = 1600, H = 900, sc = 2;
      const full = document.createElement('canvas'); full.width = W*sc; full.height = H*sc;
      const c = full.getContext('2d'); c.setTransform(sc, 0, 0, sc, 0, 0);
      const savedV = S.view;
      if (kind === 'map') S.view = 'map'; else if (kind === 'xs') S.view = 'section';
      const o = { capture: true, pr: sc }; renderScene(c, W, H, o); S.view = savedV;
      const L = o.layout, R = kind === 'xs' ? L.xs : kind === 'map' ? L.plan : L.strip;
      oc = document.createElement('canvas'); oc.width = Math.round(R.w*sc); oc.height = Math.round(R.h*sc);
      oc.getContext('2d').drawImage(full, R.x*sc, R.y*sc, R.w*sc, R.h*sc, 0, 0, oc.width, oc.height);
    }
    const b = await new Promise(r => oc.toBlob(r, 'image/png'));
    saveBlob(b, slug() + (kind === 'whole' ? '' : '-' + kind) + '.png');
    status('PNG ' + (b.size/1e6).toFixed(1) + ' MB');
  } catch (e){ console.error(e); status('PNG failed'); }
  finally { capturing = false; setBusy(false); draw(); }
}

/* animation sweep through the six time snaps of the current front */
function sweep(kind){
  const saved = S.t, fr = [];
  const fps = 30;
  SNAPS.forEach((s, i) => {
    if (i){
      const a = SNAPS[i - 1];
      const n = kind === 'gif' ? Math.max(6, Math.round((s - a)*1.5)) : Math.round(clamp((s - a)*0.28, 0.9, 2.4)*fps);
      for (let j = 1; j < n; j++){ const tt = a + (s - a)*smooth(j/n); fr.push({ set: () => { S.t = tt; }, delay: 8 }); }
    }
    fr.push({ set: () => { S.t = s; }, delay: 130 });
    if (kind !== 'gif') for (let j = 0; j < Math.round(1.2*fps); j++) fr.push({ set: () => { S.t = s; } });
  });
  return { fr, restore: () => { S.t = saved; } };
}

/* ── GIF encoder: median-cut palette, LZW, inter-frame differencing ── */
function buildPalette(frames){
  const hist = new Uint32Array(32768);
  for (const f of frames) for (let i = 0; i < f.length; i += 4*3) hist[((f[i] >> 3) << 10) | ((f[i + 1] >> 3) << 5) | (f[i + 2] >> 3)]++;
  const bins = []; for (let i = 0; i < 32768; i++) if (hist[i]) bins.push(i);
  const ch = (b, c) => c === 0 ? b >> 10 : c === 1 ? (b >> 5) & 31 : b & 31;
  const boxes = [{ lo: 0, hi: bins.length }];
  const stats = bx => { let n = 0, mn = [31, 31, 31], mx = [0, 0, 0];
    for (let i = bx.lo; i < bx.hi; i++){ const b = bins[i]; n += hist[b]; for (let c = 0; c < 3; c++){ const v = ch(b, c); if (v < mn[c]) mn[c] = v; if (v > mx[c]) mx[c] = v; } }
    const rg = [mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]]; const ax = rg[1] >= rg[0] && rg[1] >= rg[2] ? 1 : rg[0] >= rg[2] ? 0 : 2;
    return { n, ax, range: rg[ax] }; };
  while (boxes.length < 255){
    let best = -1, bs = -1, bst = null;
    boxes.forEach((bx, i) => { if (bx.hi - bx.lo < 2) return; const st = stats(bx); const sc = st.range*Math.cbrt(st.n); if (st.range > 0 && sc > bs){ bs = sc; best = i; bst = st; } });
    if (best < 0) break;
    const bx = boxes[best], seg = bins.slice(bx.lo, bx.hi).sort((p, q) => ch(p, bst.ax) - ch(q, bst.ax));
    for (let i = 0; i < seg.length; i++) bins[bx.lo + i] = seg[i];
    let acc = 0, cut = bx.lo + 1; const half = bst.n/2;
    for (let i = bx.lo; i < bx.hi - 1; i++){ acc += hist[bins[i]]; if (acc >= half){ cut = i + 1; break; } cut = i + 1; }
    boxes.splice(best, 1, { lo: bx.lo, hi: cut }, { lo: cut, hi: bx.hi });
  }
  const pal = new Uint8Array(256*3);
  boxes.forEach((bx, k) => { let n = 0, r = 0, g = 0, b = 0; for (let i = bx.lo; i < bx.hi; i++){ const v = bins[i], w = hist[v]; n += w; r += ch(v, 0)*w; g += ch(v, 1)*w; b += ch(v, 2)*w; }
    pal[k*3] = Math.round(r/n*8.226); pal[k*3 + 1] = Math.round(g/n*8.226); pal[k*3 + 2] = Math.round(b/n*8.226); });
  const np = boxes.length, lut = new Uint8Array(32768);
  for (let i = 0; i < 32768; i++){ const r = (i >> 10)*8.226, g = ((i >> 5) & 31)*8.226, b = (i & 31)*8.226; let bd = 1e9, bi = 0;
    for (let k = 0; k < np; k++){ const dr = r - pal[k*3], dg = g - pal[k*3 + 1], db = b - pal[k*3 + 2], dd = 2*dr*dr + 4*dg*dg + 3*db*db; if (dd < bd){ bd = dd; bi = k; } } lut[i] = bi; }
  return { pal, lut };
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v/16 - 0.47)*9);
function lzw(ix, minCode){
  const clear = 1 << minCode, eoi = clear + 1; let size = minCode + 1, next = eoi + 1, dict = new Map();
  const out = []; let buf = 0, nb = 0;
  const emit = (code, s) => { buf |= code << nb; nb += s; while (nb >= 8){ out.push(buf & 255); buf >>>= 8; nb -= 8; } };
  emit(clear, size);
  let cur = ix[0];
  for (let i = 1; i < ix.length; i++){
    const k = ix[i], key = (cur << 8) | k, v = dict.get(key);
    if (v !== undefined){ cur = v; continue; }
    emit(cur, size);
    if (next === 4096){ emit(clear, size); dict = new Map(); next = eoi + 1; size = minCode + 1; }
    else { if (next >= (1 << size)) size++; dict.set(key, next); next++; }
    cur = k;
  }
  emit(cur, size); emit(eoi, size); if (nb > 0) out.push(buf & 255);
  return out;
}
function gifBytes(w, h, pal, frames){
  const B = []; const w16 = v => { B.push(v & 255, (v >> 8) & 255); };
  for (const ch of 'GIF89a') B.push(ch.charCodeAt(0));
  w16(w); w16(h); B.push(0xF7, 0, 0); for (let i = 0; i < 768; i++) B.push(pal[i] || 0);
  B.push(0x21, 0xFF, 11); for (const ch of 'NETSCAPE2.0') B.push(ch.charCodeAt(0)); B.push(3, 1, 0, 0, 0);
  for (const f of frames){
    B.push(0x21, 0xF9, 4, (1 << 2) | 1); w16(f.delay); B.push(255, 0);
    B.push(0x2C); w16(f.x); w16(f.y); w16(f.w); w16(f.h); B.push(0);
    B.push(8); const data = lzw(f.ix, 8);
    for (let i = 0; i < data.length; i += 255){ const n = Math.min(255, data.length - i); B.push(n); for (let j = 0; j < n; j++) B.push(data[i + j]); }
    B.push(0);
  }
  B.push(0x3B);
  return new Uint8Array(B);
}
async function exportGIF(){
  setBusy(true); capturing = true; stopPlay(); status('rendering…'); await tick();
  const sc = 0.75, W = Math.round(EW*sc), H = Math.round(EH*sc);
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H; const c = oc.getContext('2d', { willReadFrequently: true });
  const sw = sweep('gif'), raw = [];
  try {
    for (let i = 0; i < sw.fr.length; i++){ sw.fr[i].set(); compose(c, sc); raw.push(c.getImageData(0, 0, W, H).data); if (i % 4 === 0){ status(`rendering ${i + 1}/${sw.fr.length}`); await tick(); } }
    status('building palette…'); await tick();
    const { pal, lut } = buildPalette(raw.filter((_, i) => i % 4 === 0 || i === raw.length - 1));
    const out = []; let prev = null;
    for (let i = 0; i < raw.length; i++){
      const d = raw[i], n = W*H, ix = new Uint8Array(n);
      for (let y = 0, p = 0; y < H; y++) for (let x = 0; x < W; x++, p++){ const q = p*4, o = BAYER[((y & 3) << 2) | (x & 3)];
        const r = clamp(d[q] + o, 0, 255), g = clamp(d[q + 1] + o, 0, 255), b = clamp(d[q + 2] + o, 0, 255);
        ix[p] = lut[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]; }
      if (!prev) out.push({ x: 0, y: 0, w: W, h: H, ix, delay: sw.fr[i].delay });
      else {
        let x0 = W, y0 = H, x1 = -1, y1 = -1;
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){ const p = y*W + x; if (ix[p] !== prev[p]){ if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
        if (x1 < 0){ out[out.length - 1].delay += sw.fr[i].delay; }
        else { const fw = x1 - x0 + 1, fh = y1 - y0 + 1, sub = new Uint8Array(fw*fh);
          for (let y = 0; y < fh; y++) for (let x = 0; x < fw; x++){ const p = (y + y0)*W + x + x0; sub[y*fw + x] = ix[p] === prev[p] ? 255 : ix[p]; }
          out.push({ x: x0, y: y0, w: fw, h: fh, ix: sub, delay: sw.fr[i].delay }); }
      }
      prev = ix;
      if (i % 4 === 0){ status(`encoding ${i + 1}/${raw.length}`); await tick(); }
    }
    const bytes = gifBytes(W, H, pal, out);
    saveBlob(new Blob([bytes], { type: 'image/gif' }), 'anatomy-of-a-front-' + S.front + '-animation.gif');
    status('GIF ' + (bytes.length/1e6).toFixed(1) + ' MB');
  } catch (e){ console.error(e); status('GIF failed'); }
  finally { sw.restore(); capturing = false; setBusy(false); syncControls(); renderCard(); draw(); }
}
async function exportMP4(){
  if (typeof VideoEncoder === 'undefined' || typeof Mp4Muxer === 'undefined'){ status('MP4 needs a newer browser'); return; }
  setBusy(true); capturing = true; stopPlay(); status('preparing…'); await tick();
  const sc = 1.5, W = Math.round(EW*sc), H = Math.round(EH*sc), FPS = 30;
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H; const c = oc.getContext('2d');
  const sw = sweep('mp4');
  try {
    let codec = null, mux = null;
    for (const [cs, mc] of [['avc1.640028', 'avc'], ['avc1.4d0028', 'avc'], ['vp09.00.40.08', 'vp9']]){
      const cfg = { codec: cs, width: W, height: H, bitrate: 8e6, framerate: FPS };
      try { const s = await VideoEncoder.isConfigSupported(cfg); if (s.supported){ codec = cfg; mux = mc; break; } } catch (e){}
    }
    if (!codec){ status('MP4 not supported here'); return; }
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: mux, width: W, height: H }, fastStart: 'in-memory' });
    let err = null;
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { err = e; } });
    enc.configure(codec);
    for (let i = 0; i < sw.fr.length; i++){
      sw.fr[i].set(); compose(c, sc);
      const vf = new VideoFrame(oc, { timestamp: Math.round(i*1e6/FPS), duration: Math.round(1e6/FPS) });
      enc.encode(vf, { keyFrame: i % 60 === 0 }); vf.close();
      while (enc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 5));
      if (err) throw err;
      if (i % 5 === 0){ status(`encoding ${i + 1}/${sw.fr.length}`); await tick(); }
    }
    await enc.flush(); muxer.finalize();
    const buf = muxer.target.buffer;
    saveBlob(new Blob([buf], { type: 'video/mp4' }), 'anatomy-of-a-front-' + S.front + '-animation.mp4');
    status('MP4 ' + (buf.byteLength/1e6).toFixed(1) + ' MB');
  } catch (e){ console.error(e); status('MP4 failed'); }
  finally { sw.restore(); capturing = false; setBusy(false); syncControls(); renderCard(); draw(); }
}
el('bGIF').onclick = exportGIF;
el('bMP4').onclick = exportMP4;

renderControls(); syncVE();

  try { await Promise.all([`700 16px ${FONT.disp}`, `700 13px ${FONT.body}`, `500 14px ${FONT.body}`, `700 13px ${FONT.mono}`, `13px ${FONT.mono}`].map(f => document.fonts.load(f))); } catch (e){}
  resize(); renderCard(); requestAnimationFrame(loop);
})();
window.__AF = { S, FRONTS, obsAt, snapSub, cardModel, setT, setVE, playStep, renderScene, compose, drawCardCanvas, exportPNG, exportGIF, exportMP4, sweep, lzw, buildPalette, gifBytes, last: () => LAST };

})();
