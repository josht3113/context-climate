<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidal Rhythm — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 18px; white-space: nowrap; }
.top .spacer { flex: 1; }
.units .cc-segmented-btn { font-size: 13px; padding: 7px 12px; font-family: var(--font-mono); font-weight: 700; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.glab { font-family: var(--font-mono); font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin: 0 2px 0 4px; }
.play { min-width: 118px; padding: 10px 16px; font-size: 15px; font-weight: 700; background: var(--tool-accent); border-color: var(--tool-accent);
  color: var(--color-bg); white-space: nowrap; }
.play:hover { filter: brightness(1.1); background: var(--tool-accent); color: var(--color-bg); }
.preset { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 66px; padding: 5px 11px;
  color: var(--color-text-primary); line-height: 1.1; white-space: nowrap; }
.preset b { font-family: var(--font-display); font-size: 16px; font-weight: 700; }
.preset i { font-style: normal; font-family: var(--font-mono); font-size: 13px; letter-spacing: .02em; color: var(--color-text-secondary); white-space: nowrap; }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.preset.is-active i { color: var(--color-bg); opacity: .85; }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 90px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 118px; text-align: right; white-space: nowrap; }
.tgl { padding: 8px 14px; font-size: 14px; white-space: nowrap; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--tgl, var(--color-text-muted));
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tgl, var(--tool-accent)); border-color: var(--tgl, var(--tool-accent)); }
.chips { position: absolute; top: 8px; left: 8px; display: flex; flex-wrap: nowrap; gap: 8px; max-width: calc(100% - 16px); }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.chips .tgl { padding: 5px 11px; font-size: 13px; background: var(--color-surface); }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 6px; }
.card .v.hi { color: var(--tool-accent); }
.card .r.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card .r.pair .v { font-size: 21px; }
.card .r.pair .v .u { font-size: 14px; margin-left: 4px; }
.card .tri { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 5px; }
.card .tri .k { font-family: var(--font-body); font-size: 13.5px; font-weight: 600; color: var(--color-text-secondary); }
.card .tri .v { font-size: 22px; }
.card .tri .s { font-family: var(--font-body); font-size: 13px; color: var(--color-text-secondary); min-height: 17px; line-height: 1.25; }
.tt-h { display: flex; justify-content: space-between; align-items: baseline; margin-top: 10px; padding-bottom: 4px; }
.tt-h span { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
.tt-h i { font-style: normal; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.tt { display: grid; column-gap: 6px; border-top: 1px solid var(--color-border); }
.tt > div { padding: 4px 0 3px; border-bottom: 1px solid var(--color-border); min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.tt .th { font-family: var(--font-mono); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--color-text-secondary); }
.tt .rh { font-family: var(--font-body); font-size: 13.5px; font-weight: 600; color: var(--color-text-secondary); }
.tt .td { font-family: var(--font-mono); font-size: 14.5px; font-weight: 700; color: var(--color-text-primary); line-height: 1.2; white-space: nowrap; }
.tt .td span { display: block; font-weight: 500; font-size: 13px; color: var(--color-text-secondary); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 780px) {
  .card { padding: 10px 14px; }
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 21px; }
  .card .r.pair .v, .card .tri .v { font-size: 19px; }
  .tt > div { padding: 2px 0 2px; }
  .tt-h { margin-top: 7px; }
  .card .src { padding-top: 6px; line-height: 1.3; }
}
@media (max-width: 1340px) { .tabs .cc-segmented-btn { padding: 11px 13px; } .glab { display: none; } }
@media (max-width: 1190px) { .x-link .nm { display: none; } }
@media (max-width: 1240px) { .slider .sv { display: none; } .top { gap: 9px; } .top h1 { font-size: 21px; } .chips .cc-segmented-btn { padding: 6px 9px; } .chips .tgl { padding: 5px 8px; } .chips { gap: 6px; } }
@media (max-width: 1160px) { .preset { min-width: 0; padding: 5px 7px; } .preset b { font-size: 15px; } .play { min-width: 0; padding: 10px 12px; } .tabs .cc-segmented-btn { padding: 11px 9px; } .exp .cc-btn { padding: 6px 8px; } .controls { gap: 6px; } .controls .grp { gap: 4px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Tidal Rhythm</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-tab="day">Two Tides a Day</button>
      <button class="cc-segmented-btn" data-tab="why">Why Two Bulges</button>
      <button class="cc-segmented-btn" data-tab="month">Spring &amp; Neap</button>
      <button class="cc-segmented-btn" data-tab="li">Long Island</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="cc-segmented units" id="units" aria-label="Units">
      <button class="cc-segmented-btn is-active" data-u="ft">ft</button>
      <button class="cc-segmented-btn" data-u="m">m</button>
    </div>
    <a class="cc-btn x-link" id="twLink" target="_top" href="#" title="Tide Watch: live water levels"><span class="nm">Tide Watch </span>&rarr;</a>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv" tabindex="0" aria-label="Tide model. Drag the Earth, the Moon or the chart; arrow keys step through time."></canvas>
        <div class="chips" id="chips"></div>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
