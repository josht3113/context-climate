<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Color</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-hourly); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }
.top { display: flex; align-items: center; gap: 18px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 18px; }
.top .spacer { flex: 1; }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; display: block; }
#ov { touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border); min-height: 54px; }
.controls .grp { display: flex; gap: 6px; align-items: center; }
.preset { padding: 7px 11px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); min-width: 0; line-height: 1.15; }
.preset small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--color-text-secondary); }
.preset.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.preset.is-active small { color: var(--color-bg); }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 58px; text-align: right; }
.tgl { padding: 8px 13px; font-size: 14px; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 4px; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted); border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 7px 0 6px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 27px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.sw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 0 8px; border-bottom: 1px solid var(--color-border); }
.sw div { text-align: center; }
.sw i { display: block; height: 44px; border-radius: 4px; border: 1px solid rgba(232,228,217,0.22); margin-bottom: 5px; }
.sw span { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-secondary); line-height: 1.2; display: block; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
@media (max-height: 640px) { .card .r { padding: 4px 0 3px; } .card .v { font-size: 23px; } .sw i { height: 34px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Sky Color</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn is-active" data-scen="clear">Clear day</button>
      <button class="cc-segmented-btn" data-scen="smoke">Smoke · Jun 7 2023</button>
      <button class="cc-segmented-btn" data-scen="mars">Mars</button>
      <button class="cc-segmented-btn" data-scen="none">No atmosphere</button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="gl"></canvas>
        <canvas id="ov"></canvas>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>
