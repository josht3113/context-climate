<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bowen's Reaction Series</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); --rail-w: 350px; --card-w: 290px; }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top .ttl { display: flex; flex-direction: column; line-height: 1.05; white-space: nowrap; }
.top h1 { margin: 0; font-size: 24px; }
.top .sub { font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 3px; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 14px; white-space: nowrap; }
.tabs .cc-segmented-btn .n { opacity: .65; margin-right: 6px; }
.tabs .cc-segmented-btn.is-active .n { opacity: .8; }
.top .spacer { flex: 1; min-width: 0; }
.series { display: flex; gap: 6px; }
.x-link { padding: 6px 11px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.x-link:hover { background: color-mix(in srgb, var(--tool-accent) 14%, transparent); color: var(--color-text-primary); }
.exp { display: flex; align-items: center; gap: 6px; position: relative; }
.exp .cc-btn { padding: 6px 11px; font-size: 13px; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.png-menu { position: absolute; top: 38px; left: 0; z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.png-menu.open { display: flex; }
.png-menu button { background: none; border: 0; text-align: left; color: var(--color-text-primary); font-family: var(--font-body); font-size: 14px;
  padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.png-menu button:hover { background: rgba(232,228,217,0.08); }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr) var(--card-w); gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage canvas.ov { pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; row-gap: 6px; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 56px; }
.controls .grp { display: flex; gap: 6px; align-items: center; min-width: 0; }
.snap { padding: 6px 8px; font-size: 14px; font-weight: 600; color: var(--color-text-primary); line-height: 1.15; text-align: center; white-space: nowrap; }
.snap small { display: block; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--color-text-secondary); }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active small { color: var(--color-bg); opacity: .8; }
.go { min-width: 98px; padding: 11px 14px; font-size: 16px; white-space: nowrap; box-shadow: 0 0 0 3px color-mix(in srgb, var(--tool-accent) 22%, transparent); }
.go:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--tool-accent) 32%, transparent); }
.slider { flex: 1 1 110px; display: flex; align-items: center; gap: 8px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: var(--color-text-primary); min-width: 58px; text-align: right; white-space: nowrap; }
.chips { position: absolute; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.chips.r { top: 10px; right: 10px; justify-content: flex-end; max-width: 70%; }
.chips.l { top: 10px; left: 10px; max-width: 60%; }
.chips .cc-segmented { background: var(--color-surface); }
.chips .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.chips .cc-btn { padding: 6px 12px; font-size: 13px; }
.chip-rot { display: flex; align-items: center; gap: 8px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 4px 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.chip-rot input { width: 110px; accent-color: var(--tool-accent); }
.chip-rot output { min-width: 32px; text-align: right; color: var(--color-text-primary); font-weight: 700; }
.pill { background: rgba(20,24,21,.86); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 5px 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-primary); white-space: nowrap; }
.pill b { font-family: var(--font-display); font-size: 18px; margin-right: 6px; }
.pill.hot { border-color: var(--tool-accent); }

/* tooltip */
.tip { position: absolute; pointer-events: none; display: none; z-index: 6; background: rgba(14,17,13,.95); border: 1px solid var(--color-border-hover);
  border-radius: var(--radius-md); padding: 7px 11px 8px; max-width: 240px; }
.tip.on { display: block; }
.tip-n { display: flex; align-items: center; gap: 7px; font-family: var(--font-body); font-size: 14px; font-weight: 700; color: var(--color-text-primary); }
.tip-d { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.tip-m { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); line-height: 1.4; margin-top: 3px; }

/* readout card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card > * { flex-shrink: 0; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .v.big { font-size: 30px; }
.card .r.dim .v { font-size: 20px; color: var(--color-text-secondary); }
.card .s2 { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); margin-top: 1px; }
.card .s2.hot { color: var(--tool-accent); }
.card .tag { display: inline-block; font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; border: 1px solid var(--color-border-hover); border-radius: var(--radius-sm); padding: 2px 7px; margin-top: 4px; color: var(--color-text-secondary); }
.card .tag.hot { border-color: var(--tool-accent); color: var(--color-text-primary); }
.card table { width: 100%; border-collapse: collapse; margin-top: 2px; }
.card th { font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; font-weight: 500;
  color: var(--color-text-secondary); text-align: right; padding: 8px 2px 5px 4px; border-bottom: 1px solid var(--color-border-hover); line-height: 1.25; vertical-align: bottom; }
.card th:first-child, .card td:first-child { text-align: left; }
.card td { font-family: var(--font-mono); font-size: 16px; font-weight: 700; text-align: right; padding: 6px 2px; border-bottom: 1px solid var(--color-border); white-space: nowrap; color: var(--color-text-primary); }
.card td:first-child { font-size: 12px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); margin-top: auto; padding-top: 10px; line-height: 1.4; }
.card .sub { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-top: 10px; margin-bottom: 5px; }
.card .x-link { display: block; text-align: center; margin-top: 12px; padding: 9px 12px; }
@media (max-height: 640px) {
  .card .r { padding: 4px 0 3px; }
  .card .v { font-size: 22px; }
  .card .v.big { font-size: 26px; }
  .card .r.dim .v { font-size: 18px; }
  .card td { padding: 4px 2px; }
}

/* left rail */
.rail { padding: 10px 12px 10px; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.rail .eb { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); margin-bottom: 6px; }
.rail .eb em { font-style: normal; font-weight: 500; letter-spacing: .03em; text-transform: none; color: var(--color-text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail .note { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin-top: 6px; text-align: right; }
.rail .note b { color: var(--color-text-secondary); font-weight: 700; }

@media (max-width: 1440px) {
  .top .sub { display: none; }
}
@media (max-width: 1366px) {
  .tabs .cc-segmented-btn { padding: 11px 11px; }
}
@media (max-width: 1300px) {
  .x-link .nm { display: none; }
  .slider .sv { display: none; }
  .snap { padding: 6px 6px; }
}
@media (max-width: 1180px) {
  .tabs .cc-segmented-btn .lb { display: none; }
  .card td { font-size: 15px; }
  .snap { padding: 6px 7px; font-size: 13px; }
  .slider .sv { display: none; }
  .slider { min-width: 110px; }
  .controls { gap: 6px; }
  .go { min-width: 0; padding: 11px 12px; }
}


/* reaction-series rail */
.rail .rh { flex: 1; position: relative; min-height: 0; }
.rail .rh canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cimg { display: block; width: 100%; margin: 6px 0 4px; }
.card .x-link { white-space: normal; }

@media (max-width: 1300px) { :root { --rail-w: 330px; --card-w: 272px; } }
@media (max-width: 1180px) { :root { --rail-w: 300px; --card-w: 256px; } .rail { padding: 10px 10px; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="ttl"><h1 class="cc-title">Bowen’s Reaction Series</h1><span class="sub">2 of 3 · rock formation</span></div>
    <div class="spacer"></div>
    <span id="status"></span>
    <div class="series" id="series"></div>
    <div class="exp">
      <button class="cc-btn" id="bPNG">↓ PNG</button>
      <div class="png-menu" id="pngMenu">
        <button data-png="all">Whole tool</button>
        <button data-png="stage">Intrusion panel</button>
        <button data-png="chart">Reaction series</button>
        <button data-png="card">Readout card</button>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="cc-panel rail">
      <div class="eb">Reaction series <em>ESSRT p. 14</em></div>
      <div class="rh"><canvas id="rcv"></canvas></div>
    </div>
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════
   MODEL — fractional crystallization of one parent magma.
   Crystals are removed from the melt as they form, so the residual melt
   climbs in silica. Mineral colours are the same values used in
   igneous_crystallization.html.
   ═══════════════════════════════════════════════════════════════════ */

var T0 = 1400, T1 = 650, TR = T0 - T1;
var PARENT_SIO2 = 48, FMAX = 0.94, FEXP = 0.85;
var EU0 = 72, EU1 = 82;          /* melt stops evolving as it nears the granite minimum */

var MIN = {
  olivine:   {n:'Olivine',     col:[108,128,66],  hi:1400, lo:1140, w:1.50, si:39},
  plag:      {n:'Plagioclase', col:[150,152,157], hi:1400, lo:820,  w:1.20, si:null,
              col2:[214,212,206], sub:'Ca-rich → Na-rich', cont:true},
  pyroxene:  {n:'Pyroxene',    col:[56,66,50],    hi:1260, lo:1000, w:1.35, si:49},
  amphibole: {n:'Amphibole',   col:[38,42,45],    hi:1060, lo:850,  w:1.10, si:41},
  biotite:   {n:'Biotite',     col:[54,38,24],    hi:900,  lo:780,  w:0.60, si:36},
  kFeld:     {n:'K-feldspar',  col:[206,158,140], hi:790,  lo:690,  w:1.15, si:65},
  muscovite: {n:'Muscovite',   col:[204,202,192], hi:755,  lo:670,  w:0.25, si:45},
  quartz:    {n:'Quartz',      col:[142,144,146], hi:750,  lo:650,  w:1.05, si:100}

var ORDER = ['olivine','plag','pyroxene','amphibole','biotite','kFeld','muscovite','quartz'];
var DISC  = ['olivine','pyroxene','amphibole','biotite'];
var STEM  = ['kFeld','muscovite','quartz'];
var T_MERGE = 800;               /* the two branches join above K-feldspar */

/* Plagioclase stays calcium-rich through the mafic stage and only turns
   sodic late, so its silica climbs slowly at first. */
function plagSi(T){ var u = Math.max(0, Math.min(1, (T0 - T) / 580)); return 43 + 15*u*u; }
function plagMix(T){ var u = Math.max(0, Math.min(1, (T0 - T) / 580)); return u*u; }

  return a;

/* One pass down the temperature axis, integrating the mass balance.
   Everything the tool displays is read out of this table. */

var tblSi = new Float32Array(NT), tblM = new Float32Array(NT), tblF = new Float32Array(NT);
var tblCum = [];                  /* cumulative mass of each mineral, per step */

    var T = T0 - i*STEP;
    var f = crysFrac(T), dm = (f - prevF) * 100; prevF = f;
    var melt = S / M * 100;
    if (dm > 0){
      var a = activity(T), ex = 0, any = false;
      for (var k in a){ any = true; ex += a[k] * (k === 'plag' ? plagSi(T) : MIN[k].si); }

var CLASSES = [
  {max:45, k:'Ultramafic', intr:'Peridotite', extr:'Komatiite', tex:'igneous_crystallization.html?k=phaneritic&c=ultramafic'},
  {max:52, k:'Mafic',      intr:'Gabbro',     extr:'Basalt',    tex:'igneous_crystallization.html?k=phaneritic&c=mafic'},
  {max:63, k:'Intermediate',intr:'Diorite',   extr:'Andesite',  tex:'igneous_crystallization.html?k=phaneritic&c=intermediate'},
  {max:999,k:'Felsic',     intr:'Granite',    extr:'Rhyolite',  tex:'igneous_crystallization.html?k=phaneritic&c=felsic'}

function classOf(si){ for (var i=0;i<CLASSES.length;i++) if (si < CLASSES[i].max) return CLASSES[i]; return CLASSES[3]; }

/* ═══════════════════════════════════════════════════════════════════════
   UTILITIES
   ═══════════════════════════════════════════════════════════════════ */
function cl(v){ return v<0?0:v>255?255:v|0; }
function rgbCss(c){ return 'rgb(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ')'; }

/* ═══════════════════════════════════════════════════════════════════════
   THE INTRUSION — heat leaves through the country rock, so crystals
   nucleate on the cold contact and grow inward, welded in place. The body
   zones from the margin toward the core and the residual melt shrinks to a
   pocket in the middle. Nothing settles: the early crystals are separated
   from the melt because they are stuck to the wall, not because they sank.
   ═══════════════════════════════════════════════════════════════════ */
function makeIntrusion(SC){
var CW = Math.round(480*SC), CH = Math.round(380*SC), NPIX = CW * CH;
var PX = 240*SC, PY = 190*SC, PRX = 181*SC, PRY = 138*SC;

var bgCan = document.createElement('canvas'); bgCan.width = CW; bgCan.height = CH;
var offCan = document.createElement('canvas'); offCan.width = CW; offCan.height = CH;
var offCx = offCan.getContext('2d');
var REG = offCx.createImageData(CW, CH), RD = REG.data;

/* a lumpy, non-elliptical body — a clean oval reads as a container */
function plutonR(th){
  return 1 + 0.110*Math.sin(3*th + 0.7) + 0.058*Math.sin(5*th + 2.1)
           + 0.022*Math.sin(7*th + 4.3);
}

function finvT(f){
  var lo = 0, hi = NT - 1;
  while (lo < hi){ var mid = (lo + hi) >> 1; if (tblF[mid] < f) lo = mid + 1; else hi = mid; }
  return T0 - lo * STEP;

/* exact Euclidean distance to the nearest zero cell
   (Felzenszwalb & Huttenlocher: separable 1-D parabola envelopes).
   A chamfer approximation gives octagonal level sets, which made the
   residual melt pocket look like a cut gem. */
function edt1d(f, n, d, v, zz){
  var k = 0, q, s2;
  v[0] = 0; zz[0] = -1e20; zz[1] = 1e20;
  for (q=1;q<n;q++){
    s2 = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k])) / (2*q - 2*v[k]);
    while (s2 <= zz[k]){ k--; s2 = ((f[q] + q*q) - (f[v[k]] + v[k]*v[k])) / (2*q - 2*v[k]); }
    k++; v[k] = q; zz[k] = s2; zz[k+1] = 1e20;
  }
  k = 0;
  for (q=0;q<n;q++){
    while (zz[k+1] < q) k++;
    d[q] = (q - v[k])*(q - v[k]) + f[v[k]];

}
/* Inward offsets of a lumpy outline collapse onto the medial axis, which is
   made of straight segments — geometrically correct, but it makes the last
   melt pocket look like a cut gem. Smoothing the depth field (only over the
   body, so the contact isn't dragged inward) rounds the front without
   touching the area bookkeeping, which is recomputed from this field. */
function blurMasked(src, msk, radius, passes){
  var a = Float32Array.from(src), b = new Float32Array(NPIX), i, x, y, pi, sum, cnt, k;
  for (pi=0; pi<passes; pi++){
    for (y=0;y<CH;y++) for (x=0;x<CW;x++){
      i = y*CW + x; if (!msk[i]){ b[i] = 0; continue; }
      sum = 0; cnt = 0;
      for (k=-radius;k<=radius;k++){
        var xx = x + k; if (xx < 0 || xx >= CW) continue;
        var j = y*CW + xx; if (!msk[j]) continue;
        sum += a[j]; cnt++;
      }
      b[i] = cnt ? sum/cnt : a[i];
    }
    for (y=0;y<CH;y++) for (x=0;x<CW;x++){
      i = y*CW + x; if (!msk[i]){ a[i] = 0; continue; }
      sum = 0; cnt = 0;
      for (k=-radius;k<=radius;k++){
        var yy = y + k; if (yy < 0 || yy >= CH) continue;
        var j2 = yy*CW + x; if (!msk[j2]) continue;
        sum += b[j2]; cnt++;
      }
      a[i] = cnt ? sum/cnt : b[i];

}

function edt(src){
  var BIG = 1e18, g = new Float64Array(NPIX), i, x, y;
  for (i=0;i<NPIX;i++) g[i] = src[i] ? BIG : 0;
  var n = Math.max(CW, CH);
  var f = new Float64Array(n), d = new Float64Array(n);
  var v = new Int32Array(n), zz = new Float64Array(n + 1);
  for (x=0;x<CW;x++){
    for (y=0;y<CH;y++) f[y] = g[y*CW + x];
    edt1d(f, CH, d, v, zz);
    for (y=0;y<CH;y++) g[y*CW + x] = d[y];
  }
  for (y=0;y<CH;y++){
    for (x=0;x<CW;x++) f[x] = g[y*CW + x];
    edt1d(f, CW, d, v, zz);
    for (x=0;x<CW;x++) g[y*CW + x] = d[x];
  }
  var out = new Float32Array(NPIX);
  for (i=0;i<NPIX;i++) out[i] = Math.sqrt(g[i]);

}

(function buildIntrusion(){
  var rand = rng(70413), i, x, y, th, rho;

  plutonPath = new Path2D();
  for (var a=0; a<=360; a++){
    th = a * Math.PI / 180;
    var r = plutonR(th);
    var xx = PX + Math.cos(th)*PRX*r, yy = PY + Math.sin(th)*PRY*r;
    if (a === 0) plutonPath.moveTo(xx, yy); else plutonPath.lineTo(xx, yy);
  }
  plutonPath.closePath();

  var inv = new Uint8Array(NPIX), total = 0;
  for (y=0;y<CH;y++) for (x=0;x<CW;x++){
    i = y*CW + x;
    var nx = (x - PX) / PRX, ny = (y - PY) / PRY;
    rho = Math.sqrt(nx*nx + ny*ny); th = Math.atan2(ny, nx);
    var inside = rho < plutonR(th);
    mask[i] = inside ? 1 : 0; inv[i] = inside ? 0 : 1;
    if (inside) total++;
    var xs0 = x/SC, ys0 = y/SC;
    shim[i] = Math.sin(xs0*0.058 + ys0*0.047)*3.0 + Math.sin(xs0*0.019 - ys0*0.034)*2.6 + Math.sin(xs0*0.128 + ys0*0.021)*1.6;
  }

  for (i=0;i<NPIX;i++) if (mask[i] && dIn[i] > dmax) dmax = dIn[i];
  if (dmax <= 0) dmax = 1;

  /* Depth below the contact -> fraction of the body already solid, by area,
     so the front sweeps inward at the rate the mass balance says it should. */
  var NB = 512, hist = new Float64Array(NB), cum = new Float64Array(NB + 1);
  for (i=0;i<NPIX;i++) if (mask[i]){
    var bq = (dIn[i] / dmax * NB) | 0; if (bq > NB-1) bq = NB-1; hist[bq]++;
  }
  for (i=0;i<NB;i++) cum[i+1] = cum[i] + hist[i];
  for (i=0;i<NPIX;i++){
    if (!mask[i]){ fPx[i] = 2; continue; }
    var u = dIn[i] / dmax * NB, bi = u | 0; if (bi > NB-1) bi = NB-1;
    fPx[i] = (cum[bi] + hist[bi] * (u - bi)) / total;

  for (var z=0; z<=255; z++){
    var Tl = finvT(z/255), act = activity(Tl);
    var keys = [], cums = [], acc = 0, k;
    for (k in act){ acc += act[k]; keys.push(k); cums.push(acc); }
    if (!keys.length){ keys = ['olivine']; cums = [1]; acc = 1; }
    var mr = 0, mg = 0, mb = 0;
    for (var q=0;q<keys.length;q++){
      var c = minCol(keys[q], Tl), w = act[keys[q]] / acc;
      mr += c[0]*w; mg += c[1]*w; mb += c[2]*w;
    }

  }

  for (y=0;y<CH;y++) for (x=0;x<CW;x++){
    i = y*CW + x; if (!mask[i]) continue;

    var xs = x/SC, ys = y/SC, wx = xs + Math.sin(ys*0.71)*1.6, wy = ys + Math.sin(xs*0.63)*1.3;
    var gx = (wx/3.2)|0, gy = (wy/3.2)|0;

    for (var qq=0; qq<Z.cums.length; qq++) if (uu <= Z.cums[qq]){ pick = Z.keys[qq]; break; }

    zoneCol[b3+1] = cl((cc[1]*0.20 + Z.mg*0.80) + nz*0.94);
    zoneCol[b3+2] = cl((cc[2]*0.20 + Z.mb*0.80) + nz*0.86);

    var jx = Math.round(x + (rand()-0.5)*7*SC), jy = Math.round(y + (rand()-0.5)*7*SC);

})();

function drawChamber(cx, T){
  var F = crysFrac(T);
  var gl = glowAt(T);
  var hot = (T - T1) / TR; if (hot < 0) hot = 0; if (hot > 1) hot = 1;
  var act = activity(T), keys = Object.keys(act);

  for (var i=0;i<NPIX;i++){
    var b = i*4;
    if (!mask[i]){ RD[b+3] = 0; continue; }
    RD[b+3] = 255;
    var f = fPx[i], b3 = i*3;
    if (f <= F){
      /* solid — the freshly frozen shell just behind the front is still hot */
      var near = (F - f) < 0.05 ? (1 - (F - f)/0.05) : 0;
      var q = near*near*hot*0.62;
      RD[b]   = cl(zoneCol[b3]  *(1-q*0.25) + gl[0]*q);
      RD[b+1] = cl(zoneCol[b3+1]*(1-q*0.25) + gl[1]*q);
      RD[b+2] = cl(zoneCol[b3+2]*(1-q*0.25) + gl[2]*q);
    } else {
      /* the melt is coldest against the contact and hottest in the core */
      var deep = F < 0.999 ? (f - F) / (1 - F) : 1; if (deep > 1) deep = 1;
      var sv = shim[i], k = (1 + sv*0.026) * (0.78 + 0.22 * Math.sqrt(deep));
      var nz = ((i*97 + 31) & 0xff) * 0.030 - 3.8;
      var mr2 = gl[0]*k + nz, mg2 = gl[1]*k + nz*0.4, mb2 = gl[2]*k + nz*0.2;
      /* crystal mush: the front is gradational, not a knife edge */
      var mu = (f - F) / 0.032;
      if (mu < 1){
        var w = (1 - mu); w = w*w*0.78;
        mr2 = mr2*(1-w) + zoneCol[b3]  *w;
        mg2 = mg2*(1-w) + zoneCol[b3+1]*w;
        mb2 = mb2*(1-w) + zoneCol[b3+2]*w;
      }
      RD[b] = cl(mr2); RD[b+1] = cl(mg2); RD[b+2] = cl(mb2);
    }
  }
  offCx.putImageData(REG, 0, 0);
  cx.drawImage(bgCan, 0, 0);
  cx.drawImage(offCan, 0, 0);

  /* heat bleeding into the country rock */
  if (hot > 0.02){
    cx.save();
    for (var s=0;s<3;s++){
      cx.lineWidth = (6 + s*9)*SC;
      cx.strokeStyle = 'rgba(' + (gl[0]|0) + ',' + (gl[1]|0) + ',' + (gl[2]|0) + ',' + (hot*0.055/(s+1)) + ')';
      cx.stroke(plutonPath);
    }
    cx.restore();
  }

  /* the growth fringe: crystals nucleated on the front, reaching into the melt */
  if (keys.length && F > 0.012 && F < 0.90){
    cx.save();
    for (var q2=0;q2<FRINGE.length;q2++){
      var fr = FRINGE[q2], dd = fr.f - F;
      if (dd <= 0 || dd > 0.055) continue;
      var vis = 1 - dd/0.055;
      var c = minCol(keys[q2 % keys.length], T);
      cx.beginPath();
      cx.ellipse(fr.x, fr.y, fr.L*(0.5 + vis*0.5), fr.W, fr.a, 0, Math.PI*2);
      cx.fillStyle = 'rgba(' + cl(c[0]*1.18 + 20) + ',' + cl(c[1]*1.18 + 18) + ',' + cl(c[2]*1.18 + 16) + ',' + (0.34 + 0.44*vis) + ')';
      cx.fill();
      cx.strokeStyle = 'rgba(24,18,10,' + (0.20 + 0.22*vis) + ')'; cx.lineWidth = 0.7*SC; cx.stroke();
    }
    cx.restore();
  }

  cx.save();
  cx.strokeStyle = 'rgba(232,228,217,.26)'; cx.lineWidth = 1.4*SC; cx.stroke(plutonPath);
  cx.restore();
}
return {CW:CW, CH:CH, draw:drawChamber, path:plutonPath, fPx:fPx, mask:mask};
}
