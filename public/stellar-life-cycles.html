<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Life Cycles — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 10px 16px; overflow-x: hidden; }
.app { display: flex; flex-direction: column; gap: 8px; height: calc(100vh - 20px); min-height: 600px; max-width: 1700px; margin: 0 auto; }

.hdr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px; }
.hdr-title { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.hdr-title .cc-title { font-size: 26px; margin: 0; }

.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr) 300px; gap: 8px; }
.rail { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.rail-lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); margin: 0 0 6px; }
.div { height: 1px; background: var(--color-border); margin: 10px 0; }

/* mass cards — the primary control */
.mcard { position: relative; display: grid; grid-template-columns: 12px 1fr; gap: 2px 9px; align-items: center; width: 100%; text-align: left; cursor: pointer;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px;
  color: var(--color-text-primary); font: inherit; transition: transform .15s ease, border-color .15s ease, box-shadow .2s ease, background .15s ease; }
.mcard:hover { transform: translateY(-2px); border-color: var(--mc); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
.mcard:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 2px; }
.mcard.is-active { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 16%, #2C322D); box-shadow: 0 0 0 1px var(--mc), 0 0 16px color-mix(in srgb, var(--mc) 30%, transparent); }
.mcard .dot { width: 12px; height: 12px; border-radius: 50%; grid-row: 1 / span 2; }
.mcard .mt { font-family: var(--font-body); font-weight: 700; font-size: 16px; line-height: 1.2; }
.mcard .mt span { font-weight: 500; color: var(--color-text-secondary); font-size: 14px; margin-left: 4px; }
.mcard .ms { font-family: var(--font-body); font-size: 13px; color: var(--color-text-secondary); line-height: 1.3; }

.pb { display: flex; gap: 6px; align-items: center; }
.pb .cc-btn { padding: 8px 8px; min-width: 34px; }
.pb .play { flex: 1; font-size: 15px; font-weight: 700; }
.pb .play.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: #1E2320; }
.seg-full { display: flex; width: 100%; }
.seg-full .cc-segmented-btn { flex: 1; padding: 8px 6px; }
.tgl { width: 100%; margin-top: 8px; }

/* chart column */
.center { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
.chart-wrap { position: relative; flex: 1; min-height: 0; background: #171B19; border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ribbon-wrap { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 6px 10px 6px; }
.ribbon-top { display: flex; align-items: baseline; gap: 10px; }
.age { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-text-primary); }
.age-lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }
.ribbon-note { margin-left: auto; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
#ribbon { display: block; width: 100%; height: 40px; cursor: pointer; touch-action: none; margin-top: 2px; }

/* info rail */
.stage { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; }
.track-lbl { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin: 2px 0 8px; letter-spacing: 0.04em; }
.cap { font-size: 15px; line-height: 1.45; color: var(--color-text-secondary); margin: 0 0 10px; min-height: 44px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.st { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 6px; padding: 5px 9px; }
.st.wide { grid-column: 1 / -1; }
.st .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); }
.st .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--color-text-primary); line-height: 1.25; }
.near { margin-top: 8px; display: none; align-items: center; gap: 8px; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: 6px; padding: 6px 9px; text-decoration: none; color: var(--color-text-primary); font-size: 14px; }
.near.on { display: flex; }
.near b { font-weight: 700; }
.near .arr { margin-left: auto; color: var(--tool-accent); }
.near:hover { border-color: var(--tool-accent); }
.size-lbl { margin-top: 10px; }
#sizeCv { display: block; width: 100%; height: 132px; background: #0E100F; border-radius: 6px; }
.remnant { display: none; margin-top: 8px; border: 1px solid var(--color-border-hover); border-radius: 6px; padding: 8px 10px; background: var(--color-surface-2); }
.remnant.on { display: block; }
.remnant .rt { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.remnant .rd { font-size: 14px; color: var(--color-text-secondary); line-height: 1.4; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.links a { text-decoration: none; }
.race-row { display: grid; grid-template-columns: 12px 1fr; gap: 0 9px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--color-border); }
.race-row:last-child { border-bottom: none; }
.race-row .dot { width: 12px; height: 12px; border-radius: 50%; grid-row: 1 / span 2; }
.race-row .rm { font-weight: 700; font-size: 15px; }
.race-row .rs { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.race-row.dead .rm { opacity: 0.75; }
.src { margin-top: auto; padding-top: 10px; font-size: 13px; font-style: italic; color: var(--color-text-muted); line-height: 1.4; }
.exp { position: relative; display: flex; gap: 6px; align-items: center; }
.exp > .cc-btn { padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--color-text-primary); border-color: var(--color-border-hover); }
.exp > .cc-btn:hover { border-color: var(--tool-accent); }
.exp > .cc-btn:disabled { opacity: .45; cursor: default; border-color: var(--color-border); }
.png-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; display: none; flex-direction: column; gap: 2px; min-width: 230px; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: 8px; padding: 6px; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
.png-menu.open { display: flex; }
.png-menu button { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--color-text-primary); font: 500 14px var(--font-body); padding: 7px 10px; cursor: pointer; }
.png-menu button span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); }
.png-menu button:hover:not(:disabled) { border-color: var(--tool-accent); background: var(--color-surface); }
.png-menu button:disabled { opacity: .4; cursor: default; }
.exp-status { position: absolute; top: calc(100% + 4px); right: 0; z-index: 20; display: none; white-space: nowrap; background: var(--color-surface-2); border: 1px solid var(--tool-accent); border-radius: 6px; padding: 5px 10px; font: 400 13px var(--font-mono); color: var(--color-text-primary); }
.exp-status.on { display: block; }
.app.capturing .body, .app.capturing .mode-btn { pointer-events: none; }
.app.capturing .body { opacity: .7; }
@media (max-width: 1240px) { .hdr-title .cc-tag { display: none; } }
.hide { display: none !important; }
@media (max-width: 1180px) { .body { grid-template-columns: 210px minmax(0,1fr) 260px; } .stage { font-size: 22px; } }
</style>
</head>
<body>
<div class="app cc-tool-wrap">
  <header class="hdr">
    <div class="hdr-title"><span class="cc-tag">Stellar Evolution · ESS1</span><h1 class="cc-title">Stellar Life Cycles</h1></div>
    <div class="cc-segmented" role="tablist" aria-label="View">
      <button class="cc-segmented-btn mode-btn is-active" data-mode="deep">One Star</button>
      <button class="cc-segmented-btn mode-btn" data-mode="race">Race All Five</button>
    </div>
    <div class="exp">
      <button class="cc-btn" id="pngBtn" aria-haspopup="menu" aria-expanded="false">↓ PNG ▾</button>
      <div class="png-menu" id="pngMenu" role="menu">
        <button role="menuitem" data-png="tool">Whole tool <span>2560×1440</span></button>
        <button role="menuitem" data-png="chart">H-R chart <span>2400×1800</span></button>
        <button role="menuitem" data-png="size" id="pngSizeItem">Size view <span>1920×1080</span></button>
      </div>
      <button class="cc-btn" id="gifBtn">↓ GIF</button>
      <button class="cc-btn" id="mp4Btn">↓ MP4</button>
      <span class="exp-status" id="expStatus" role="status"></span>
    </div>
  </header>

  <div class="body">
    <aside class="rail" aria-label="Controls">
      <p class="rail-lbl">Mass at birth</p>
      <div id="massCards"></div>
      <div class="div"></div>
      <div class="pb">
        <button class="cc-btn" id="prevBtn" aria-label="Previous stage">◀</button>
        <button class="cc-btn play" id="playBtn">▶ Play</button>
        <button class="cc-btn" id="nextBtn" aria-label="Next stage">▶|</button>
        <button class="cc-btn" id="resetBtn" aria-label="Back to start">↺</button>
      </div>
      <div id="timeModeBox">
        <p class="rail-lbl" style="margin-top:10px">Timeline</p>
        <div class="cc-segmented seg-full" role="tablist" aria-label="Timeline scale">
          <button class="cc-segmented-btn tm-btn is-active" data-tm="stage">Each stage</button>
          <button class="cc-segmented-btn tm-btn" data-tm="true">True time</button>
        </div>
      </div>
      <button class="cc-btn cc-btn-sm tgl is-active" id="p4Btn" aria-pressed="true">Page 4 stars: on</button>
    </aside>

    <section class="center">
      <div class="chart-wrap"><canvas id="chart" aria-label="H-R diagram with the selected star's evolutionary track"></canvas></div>
      <div class="ribbon-wrap">
        <div class="ribbon-top"><span class="age-lbl">Age</span><span class="age" id="age">0</span><span class="ribbon-note" id="ribbonNote"></span></div>
        <canvas id="ribbon" aria-label="Life stages timeline. Click or drag to move through the star's life."></canvas>
      </div>
    </section>

    <aside class="rail" aria-live="polite" aria-label="Stage information">
      <div id="deepInfo">
        <h2 class="stage" id="stageName">Protostar</h2>
        <p class="track-lbl" id="trackLbl"></p>
        <p class="cap" id="cap"></p>
        <div class="stats" id="stats"></div>
        <a class="near" id="near" target="_top"><span>Near on page 4: <b id="nearName"></b></span><span class="arr">↗</span></a>
        <div class="remnant" id="remnant"><div class="rt" id="remT"></div><div class="rd" id="remD"></div></div>
        <p class="rail-lbl size-lbl">Size, to scale</p>
        <canvas id="sizeCv"></canvas>
        <div class="links" id="links"></div>
      </div>
      <div id="raceInfo" class="hide">
        <p class="rail-lbl">Five stars, one clock</p>
        <div id="raceRows"></div>
      </div>
      <p class="src">Main-sequence lifetime: τ = 10¹⁰ × M⁻²·⁵ yr, the relation behind the ESSRT p. 4 lifetime marks. Page 4 stars: ESSRT 2026.</p>
    </aside>
  </div>
</div>

// true-scale size view

const rb = document.getElementById('ribbon'), rctx = rb.getContext('2d');
let RW = 600, RH = 40;

  const r = rb.getBoundingClientRect(); RW = Math.round(r.width); RH = Math.round(r.height);
  rb.width = RW * dpr; rb.height = RH * dpr; rctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

    const tr = TRACKS[st.key], b = segBounds(tr), cur = stateAt(tr, uToP(tr, st.u)).stage;
    tr.segs.forEach((s, i) => {
      const a = x0 + b[i][0] * w, z = x0 + b[i][1] * w, on = s.stage === cur;
      const sw = Math.max(z - a, 2);

      c.font = '600 13px "Public Sans", sans-serif';

      if (c.measureText(name).width >= sw - 8 && SHORT[name]) name = SHORT[name];
      if (c.measureText(name).width < sw - 8) txt(c, name, a + sw / 2, 20, { font: '600 13px "Public Sans", sans-serif', color: on ? '#1E2320' : 'rgba(232,228,217,0.85)' });
    });

    c.fillStyle = '#FFFFFF'; c.fillRect(px - 1.5, 0, 3, 30);

  } else {
    const xt = g => x0 + (Math.log10(Math.max(g, 1e-6)) - R_MIN) / (R_MAX - R_MIN) * w;

    c.fillStyle = 'rgba(60,163,174,0.75)'; c.fillRect(x0, 10, Math.max(0, xt(st.raceT) - x0), 10);
    [[1e-3, '1 million yr'], [1e-2, '10 million'], [0.1, '100 million'], [1, '1 billion'], [10, '10 billion'], [100, '100 billion']].forEach(([g, s]) => {

    });

    const xu = xt(UNIVERSE); c.fillStyle = '#E8E4D9'; c.fillRect(xu - 1, 0, 2, 26);

let rbDrag = false;
function ribbonAt(e) {

  if (st.mode === 'deep') { st.u = f; }
  else { st.raceT = Math.pow(10, R_MIN + f * (R_MAX - R_MIN)); st.pausedAtToday = st.raceT >= UNIVERSE; }
  setPlaying(false);

rb.addEventListener('pointerdown', e => { rbDrag = true; rb.setPointerCapture(e.pointerId); ribbonAt(e); });
rb.addEventListener('pointermove', e => { if (!rbDrag) return; if (e.buttons === 0) { rbDrag = false; return; } ribbonAt(e); });

function stepStage(d) {

  const atStart = Math.abs(st.u - b[i][0]) < 1e-4;

  j = Math.max(0, Math.min(b.length - 1, j));
  st.u = d > 0 && i === b.length - 1 ? 1 : b[j][0] + (b[j][1] - b[j][0] < 1e-6 ? 0 : 1e-7);
  if (d > 0 && j === b.length - 1 && tr.segs[j].terminal) st.u = 1;
  setPlaying(false);
}
document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('.tm-btn').forEach(b => b.addEventListener('click', () => {
  const tr = TRACKS[st.key], p = uToP(tr, st.u);

}));

  if (st.mode === 'race' && st.raceT >= Math.pow(10, R_MAX) * 0.999) { st.raceT = 1e-4; st.pausedAtToday = false; }
  setPlaying(!st.playing); lastTs = null;
});

  e.currentTarget.textContent = 'Page 4 stars: ' + (st.p4 ? 'on' : 'off'); lastInfo = '';
});
document.addEventListener('keydown', e => {

// ════════════════════════════════════════════════════════════════════
// LOOP
// ════════════════════════════════════════════════════════════════════
let lastTs = null;
function fireEvents(ts) {
  if (st.mode === 'deep') {
    const tr = TRACKS[st.key], p = uToP(tr, st.u);
    tr.wps.forEach((w, i) => { if (w.event && p >= i - 0.02 && !st.fired[i]) { st.fired[i] = true; st.flashes.push({ T: w.T, L: w.L, t0: ts, col: tr.color }); } });
  } else {
    KEYS.forEach(k => { const tr = TRACKS[k]; if (st.raceT >= tr.tEnd && !st.fired[k] && tr.fate !== 'wd') { st.fired[k] = true; const w = tr.wps[tr.wps.length - 1]; st.flashes.push({ T: w.T, L: w.L, t0: ts, col: tr.color }); } });
  }
}
function tick(ts) {
  if (capturing) { lastTs = ts; requestAnimationFrame(tick); return; }
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (st.playing) {
    if (st.mode === 'deep') {
      const tr = TRACKS[st.key];
      const rate = st.tm === 'true' ? 1 / 24 : 1 / (tr.segs.length * 3.2);
      st.u = Math.min(1, st.u + rate * dt);
      if (st.u >= 1) setPlaying(false);
    } else {
      const lg = Math.log10(st.raceT) + 0.42 * dt, next = Math.pow(10, lg);
      if (!st.pausedAtToday && st.raceT < UNIVERSE && next >= UNIVERSE) { st.raceT = UNIVERSE; st.pausedAtToday = true; setPlaying(false); }
      else st.raceT = Math.min(Math.pow(10, R_MAX), next);
      if (st.raceT >= Math.pow(10, R_MAX)) setPlaying(false);
    }
  }
  fireEvents(ts);
  render(ts);
  requestAnimationFrame(tick);
}

// ════════════════════════════════════════════════════════════════════
// EXPORTS — every export is drawn fresh into a fixed 1024 × 576 (16:9) composition,
// scaled up or down. Nothing is copied from the screen, so file resolution never
// depends on the viewer's window size or devicePixelRatio.
//   PNG whole tool 2560 × 1440 (×2.5) · GIF 960 × 540 (×0.9375) · MP4 1920 × 1080 (×1.875)
//   PNG H-R chart 2400 × 1800 · PNG size view 1920 × 1080
// Animated exports: One Star sweeps protostar → remnant one stage at a time (each stage

  const flashLive = () => st.flashes.some(f => vt - f.t0 < 1800);
  const settle = () => { let g = 0; while (flashLive() && g++ < 400) put(stepMs); };

      if (lg >= R_MAX) { st.raceT = Math.pow(10, R_MAX); put(stepMs); settle(); put(2400); break; }
      st.raceT = Math.pow(10, lg); put(stepMs);

}

    await runSteps(steps, c, S, async (s, i) => {
      const d = c.getImageData(0, 0, GW, GH).data, idx = new Uint8Array(N);
      for (let p = 0, j = 0; j < N; p += 4, j++) idx[j] = lut[((d[p] >> 3) << 10) | ((d[p + 1] >> 3) << 5) | (d[p + 2] >> 3)];
      msAcc += s.dur; const cs = Math.round(msAcc / 10) - csAcc; csAcc += cs;
      if (!prev) { pending = { x: 0, y: 0, w: GW, h: GH, data: idx, cs, first: true }; prev = idx; return; }
      let x0 = GW, y0 = GH, x1 = -1, y1 = -1;
      for (let yy = 0; yy < GH; yy++) { const r = yy * GW; for (let xx = 0; xx < GW; xx++) if (idx[r + xx] !== prev[r + xx]) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; y1 = yy; } }
      if (x1 < 0) { pending.cs += cs; return; }            // identical frame: just hold longer
      flush();
      const w = x1 - x0 + 1, h = y1 - y0 + 1, data = new Uint8Array(w * h);
      for (let yy = 0; yy < h; yy++) { const r = (y0 + yy) * GW + x0; for (let xx = 0; xx < w; xx++) { const v = idx[r + xx]; data[yy * w + xx] = v === prev[r + xx] ? 255 : v; } }
      pending = { x: x0, y: y0, w, h, data, cs, first: false }; prev = idx;
    }, 'Encoding GIF');
    flush(); chunks.push(new Uint8Array([0x3B]));
    const blob = new Blob(chunks, { type: 'image/gif' });
    saveBlob(blob, baseName() + '.gif');
    setStatus('GIF saved · ' + GW + '×' + GH + ' · ' + nFrames + ' frames · ' + fmtMB(blob.size));
  } catch (e) { console.error(e); setStatus('GIF failed: ' + e.message); }
  finally { endCapture(); }
}

// ── MP4: WebCodecs + mp4-muxer; H.264 preferred, VP9-in-MP4 fallback ──
async function exportMP4() {
  if (capturing) return;
  if (typeof VideoEncoder === 'undefined' || typeof Mp4Muxer === 'undefined') { setStatus('MP4 needs Chrome or Edge'); return; }
  const W = 1920, H = 1080, FPS = 30, S = W / EXW;
  const cands = [['avc', 'avc1.640028'], ['avc', 'avc1.4d0028'], ['avc', 'avc1.42e028'], ['vp9', 'vp09.00.40.08']];
  let pick = null;
  for (const [kind, codec] of cands) {
    try { const r = await VideoEncoder.isConfigSupported({ codec, width: W, height: H, bitrate: 8e6, framerate: FPS }); if (r.supported) { pick = [kind, codec]; break; } } catch (e) {}
  }
  if (!pick) { setStatus('This browser cannot encode MP4'); return; }
  beginCapture();
  let encErr = null;
  try {
    const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: pick[0], width: W, height: H, frameRate: FPS }, fastStart: 'in-memory', firstTimestampBehavior: 'offset' });
    const enc = new VideoEncoder({ output: (chunk, meta) => muxer.addVideoChunk(chunk, meta), error: e => { encErr = e; } });
    const cfg = { codec: pick[1], width: W, height: H, bitrate: 8e6, framerate: FPS };
    if (pick[0] === 'avc') cfg.avc = { format: 'avc' };
    enc.configure(cfg);
    const steps = buildTimeline(1000 / FPS), [cnv, c] = makeCanvas(W, H, false);
    let fi = 0, msAcc = 0;
    await runSteps(steps, c, S, async s => {
      const end = Math.round((msAcc + s.dur) * FPS / 1000), n = Math.max(1, end - fi); msAcc += s.dur;
      for (let r = 0; r < n; r++) {
        if (encErr) throw encErr;
        const vf = new VideoFrame(cnv, { timestamp: Math.round(fi * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
        enc.encode(vf, { keyFrame: fi % 60 === 0 }); vf.close(); fi++;
        while (enc.encodeQueueSize > 6) await new Promise(res => setTimeout(res, 4));
      }
    }, 'Encoding MP4');
    setStatus('Finishing MP4…', true);
    await enc.flush(); if (encErr) throw encErr; enc.close();
    muxer.finalize();
    const blob = new Blob([muxer.target.buffer], { type: 'video/mp4' });
    saveBlob(blob, baseName() + '.mp4');
    setStatus('MP4 saved · ' + W + '×' + H + ' · ' + (fi / FPS).toFixed(1) + ' s · ' + fmtMB(blob.size));
  } catch (e) { console.error(e); setStatus('MP4 failed: ' + e.message); }
  finally { endCapture(); }
}
