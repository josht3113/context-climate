<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="core-sample-tools.css">
<title>Life Cycles of Stars — ContextClimate</title>
<style>
:root{ --tool-accent:var(--accent-earth); --teal:var(--accent-earth); --teal-dim:rgba(60,163,174,0.16); }
.cc-app{line-height:1.3; --cc-card-width:300px}
button, select{font:inherit; line-height:1.2}

/* ── header ── */
#top{gap:14px}
.ttl{display:flex; flex-direction:column; justify-content:center; min-width:0}
.eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#A6A499; line-height:1.1; white-space:nowrap}
#top h1{font-size:22px; line-height:1.1}
.tabs .cc-segmented-btn{padding:8px 16px}
.spacer{flex:1 1 auto}
.xwrap{position:relative}
.xbtn{display:inline-flex; align-items:center; gap:6px; background:var(--color-surface-2); border:1px solid var(--color-border-hover);
  color:var(--color-text-primary); font-family:var(--font-mono); font-size:13px; padding:6px 11px; border-radius:var(--radius-md); cursor:pointer; white-space:nowrap}
.xbtn:hover:not(:disabled){border-color:var(--teal)}
.xbtn:disabled{opacity:.6; cursor:default}
.xmenu{position:absolute; right:0; top:calc(100% + 6px); z-index:30; min-width:244px; background:var(--color-surface-2);
  border:1px solid var(--color-border-hover); border-radius:var(--radius-md); padding:5px; display:none; box-shadow:0 10px 28px rgba(0,0,0,.45)}
.xmenu.open{display:block}
.xmenu button{display:flex; justify-content:space-between; gap:12px; width:100%; background:transparent; border:0; color:var(--color-text-primary);
  font-size:13.5px; text-align:left; padding:7px 9px; border-radius:var(--radius-sm); cursor:pointer}
.xmenu button span{font-family:var(--font-mono); font-size:13px; color:#A6A499}
.xmenu button:hover{background:var(--teal-dim)}
.xmenu hr{border:0; border-top:1px solid var(--color-border); margin:4px 2px}

/* ── scene head ── */
#head{gap:8px 12px; padding:8px 12px; min-height:52px; flex-wrap:nowrap}
.hd{display:none; align-items:center; gap:8px 12px; flex-wrap:nowrap; width:100%; min-width:0}
.hd.on{display:flex}
.hlab{font-family:var(--font-mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:#A6A499; white-space:nowrap}
.hint{font-size:13px; color:var(--color-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.tbtn{background:var(--color-surface-2); border:1px solid var(--color-border-hover); color:var(--color-text-primary);
  font-size:13.5px; font-weight:500; padding:6px 12px; border-radius:var(--radius-md); cursor:pointer; white-space:nowrap}
.tbtn:hover:not(:disabled){border-color:var(--teal)}
.tbtn.on{background:var(--teal-dim); border-color:var(--teal)}
.tbtn:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
.tbtn .dot{display:inline-block; width:9px; height:9px; border-radius:50%; border:1.5px solid currentColor; margin-right:6px; vertical-align:0}
.tbtn.on .dot{background:var(--teal); border-color:var(--teal)}
.seg{display:inline-flex; padding:2px; gap:2px; background:var(--color-bg); border:1px solid var(--color-border); border-radius:var(--radius-md); flex:none}
.seg button{background:transparent; border:1px solid transparent; color:var(--color-text-secondary); font-size:13.5px; font-weight:600;
  padding:5px 12px; border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap}
.seg button:hover{color:var(--color-text-primary)}
.seg button.on{background:var(--teal-dim); border-color:var(--teal); color:var(--color-text-primary)}

/* ── stage ── */
#stage{background:#171B18}
#cv{position:absolute; inset:0; width:100%; height:100%; display:block}

/* ── control bar: ribbon, play, snaps ── */
#bar{flex-direction:column; align-items:stretch; gap:6px; padding:6px 12px 8px}
.rib-row{display:flex; align-items:center; gap:10px}
.rib-age{flex:none; width:150px; display:flex; flex-direction:column; line-height:1.15}
.rib-age .hlab{font-size:12px}
.rib-age b{font-family:var(--font-display); font-size:19px; font-weight:700; color:var(--color-text-primary); white-space:nowrap}
#ribbon{flex:1 1 auto; min-width:0; height:42px; display:block; cursor:pointer; touch-action:none}
.snaprow{display:flex; align-items:stretch; gap:8px}
.play{flex:0 0 auto; min-width:112px; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  background:var(--teal); border:1px solid var(--teal); color:var(--color-bg); font-weight:600; font-size:14px;
  padding:6px 14px; border-radius:var(--radius-md); cursor:pointer; white-space:nowrap}
.play:hover{filter:brightness(1.1)}
.thru{flex:0 0 auto; display:inline-flex; align-items:center; padding:6px 10px; font-size:13px}
.thru .lbl2{display:none}
.snaps{flex:1 1 auto; min-width:0; display:flex; gap:5px}
.snap{flex:1 1 0; min-width:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  padding:8px 4px 5px; background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md);
  color:var(--color-text-secondary); cursor:pointer; overflow:hidden; transition:border-color .14s ease, background .14s ease, transform .14s ease}
.snap::before{content:''; position:absolute; left:8px; right:8px; top:2px; height:3px; border-radius:2px; background:var(--cc); opacity:.9}
.snap b{font-weight:600; font-size:14px; color:var(--color-text-primary); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.snap i{font-style:normal; font-family:var(--font-body); font-size:13px; color:#A6A499; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.snap i .fate{color:var(--color-text-primary)}
.snap:hover{border-color:var(--color-border-hover); transform:translateY(-1px)}
.snap.on{border-color:var(--teal); background:var(--teal-dim)}
.snap:focus-visible{outline:2px solid var(--teal); outline-offset:1px}

/* ── card ── */
#card{gap:0; padding:11px 15px 9px}
.k-eb{display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); font-weight:700}
.k-eb .sw{width:11px; height:11px; border-radius:50%; flex:none}
.k-stage{font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1.1; margin-top:6px}
.k-sub{font-family:var(--font-mono); font-size:13px; color:#A6A499; margin-top:2px; min-height:16px}
.k-cap{font-size:14px; line-height:1.4; color:var(--color-text-secondary); margin:7px 0 2px}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px}
.st{background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:5px 9px 6px}
.st.wide{grid-column:1 / -1}
.st .k{font-family:var(--font-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--color-text-secondary)}
.st .v{font-family:var(--font-display); font-weight:700; font-size:18px; color:var(--color-text-primary); white-space:nowrap}
.linkrow{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
.lnk{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border:1px solid var(--teal); border-radius:var(--radius-md);
  font-size:13px; font-weight:600; color:var(--teal); text-decoration:none; white-space:nowrap}
.lnk:hover{background:var(--teal); color:var(--color-bg)}
.lnk.near{border-color:var(--color-border-hover); color:var(--color-text-primary); font-weight:500}
.lnk.near b{font-weight:700}
.lnk.near:hover{background:var(--color-surface-2); border-color:var(--teal); color:var(--color-text-primary)}
.race-age{font-family:var(--font-display); font-weight:700; font-size:26px; line-height:1.1; margin:6px 0 4px}
.race-row{display:grid; grid-template-columns:auto 1fr; gap:0 9px; align-items:center; padding:7px 0; border-top:1px solid var(--color-border)}
.race-row .dot{grid-row:1 / span 2; width:11px; height:11px; border-radius:50%}
.race-row .rm{font-weight:700; font-size:15px}
.race-row .rm span{color:var(--color-text-secondary); font-weight:500}
.race-row .rs{font-family:var(--font-mono); font-size:13px; color:var(--color-text-secondary)}
.race-row.dead .rs{color:var(--color-text-primary)}
#card .cc-card-src{font-size:13px}
.hide{display:none !important}

/* ── responsive ── */
@media (max-width:1300px){ .cc-app{--cc-card-width:280px} .tabs .cc-segmented-btn{padding:8px 12px} .rib-age{width:126px} .rib-age b{font-size:17px} }
@media (max-width:1240px){ .snap i{display:none} .snap{padding:9px 3px 6px} .snap b{white-space:normal; line-height:1.15; text-align:center} .thru span.lbl{display:none} .thru span.lbl2{display:inline} }
@media (max-width:1180px){ .eyebrow{display:none} .hint{display:none} .seg button{padding:5px 9px} }
@media (max-height:640px){ .k-stage{font-size:23px} .k-cap{margin:5px 0 0} .stats{gap:5px} .st{padding:4px 8px 5px} .st .v{font-size:17px} }
@media (max-height:610px){ #card .cc-card-src{display:none} }
@media (prefers-reduced-motion:reduce){ .snap{transition:none} }
</style>
</head>
<body class="cc-app-body t-one">
<div class="cc-app">
  <header id="top" class="cc-app-top">
    <div class="ttl">
      <span class="eyebrow">ESSRT 2026 &middot; pp.&nbsp;4&ndash;5</span>
      <h1 class="cc-app-title">Life Cycles of Stars</h1>
    </div>
    <div class="cc-segmented tabs" role="tablist" aria-label="Mode">
      <button class="cc-segmented-btn is-active" data-tab="one" role="tab">One star</button>
      <button class="cc-segmented-btn" data-tab="race" role="tab">Race all five</button>
    </div>
    <span class="spacer"></span>
    <div class="xwrap">
      <button class="xbtn" id="xbtn" aria-haspopup="true" aria-expanded="false">&#8681; Export</button>
      <div class="xmenu" id="xmenu">
        <button data-x="whole">PNG &middot; Whole tool <span>2560&times;1440</span></button>
        <button data-x="scene">PNG &middot; Scene <span>2560&times;1440</span></button>
        <button data-x="card">PNG &middot; Readout card <span>960&times;1920</span></button>
        <hr>
        <button data-x="gif">GIF &middot; Life cycle <span>960&times;540</span></button>
        <button data-x="mp4">MP4 &middot; Life cycle <span>1920&times;1080</span></button>
      </div>
    </div>
  </header>

  <div class="cc-app-main">
    <section class="cc-scene">
      <div class="cc-scene-head" id="head">
        <div class="hd on" id="hdMain">
          <span class="seg" id="viewSeg">
            <button data-v="hr">H-R</button>
            <button data-v="split" class="on">Split</button>
            <button data-v="star">Star</button>
          </span>
          <span class="seg" id="styleSeg">
            <button data-s="page" class="on">Page 4</button>
            <button data-s="dark">Dark</button>
          </span>
          <button class="tbtn on" id="p4Btn" aria-pressed="true"><span class="dot"></span>Page 4 stars</button>
          <span class="spacer"></span>
          <span class="seg" id="timeSeg">
            <button data-t="stage" class="on">Each stage</button>
            <button data-t="true">True time</button>
          </span>
        </div>
      </div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="cv" aria-label="Life cycle of the selected star on the H-R diagram"></canvas>
      </div>
      <div class="cc-scene-bar" id="bar">
        <div class="rib-row">
          <div class="rib-age"><span class="hlab" id="ageLbl">Age</span><b id="age">0</b></div>
          <canvas id="ribbon" tabindex="0" aria-label="Timeline. Click or drag to move through the life cycle."></canvas>
        </div>
        <div class="snaprow">
          <button class="play" id="playBtn">&#9654; Play</button>
          <button class="tbtn thru" id="thruBtn" aria-pressed="false" title="Play straight through without stopping at each stage"><span class="dot"></span><span class="lbl">Straight through</span><span class="lbl2">Non-stop</span></button>
          <div class="snaps" id="snaps" role="group"></div>
        </div>
      </div>
    </section>

    <aside class="cc-card" id="card" aria-live="polite">
      <div id="oneCard">
        <div class="k-eb"><span class="sw" id="cSw"></span><span id="cTrack"></span></div>
        <div class="k-stage" id="cStage"></div>
        <div class="k-sub" id="cSub"></div>
        <div class="k-cap" id="cCap"></div>
        <div class="stats" id="cStats"></div>
        <div class="linkrow" id="cLinks"></div>
      </div>
      <div id="raceCard" class="hide">
        <div class="k-eb"><span>Five stars, one clock</span></div>
        <div class="race-age" id="rAge"></div>
        <div id="raceRows"></div>
      </div>
      <div class="cc-card-src" id="src"></div>
    </aside>
  </div>
</div>
