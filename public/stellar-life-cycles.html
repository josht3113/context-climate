<title>Stellar Life Cycles — ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 10px 16px; overflow-x: hidden; }
.app { display: flex; flex-direction: column; gap: 8px; height: calc(100vh - 20px); min-height: 600px; max-width: 1700px; margin: 0 auto; }

.hdr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 40px; }
.hdr-title { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.hdr-title .cc-title { font-size: 26px; margin: 0; }

.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 236px minmax(0, 1fr) 300px; gap: 8px; }
.rail { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
.rail-lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); margin: 0 0 6px; }
.div { height: 1px; background: var(--color-border); margin: 10px 0; }

/* mass cards — the primary control */
.mcard { position: relative; display: grid; grid-template-columns: 12px 1fr; gap: 2px 9px; align-items: center; width: 100%; text-align: left; cursor: pointer;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: 8px; padding: 7px 10px; margin-bottom: 6px;
  color: var(--color-text-primary); font: inherit; transition: transform .15s ease, border-color .15s ease, box-shadow .2s ease, background .15s ease; }
.mcard:hover { transform: translateY(-2px); border-color: var(--mc); box-shadow: 0 6px 14px rgba(0,0,0,.35); }
.mcard:focus-visible { outline: 2px solid var(--tool-accent); outline-offset: 2px; }
.mcard.is-active { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 16%, #2C322D); box-shadow: 0 0 0 1px var(--mc), 0 0 16px color-mix(in srgb, var(--mc) 30%, transparent); }
.mcard .dot { width: 12px; height: 12px; border-radius: 50%; grid-row: 1 / span 2; }
.mcard .mt { font-family: var(--font-body); font-weight: 700; font-size: 16px; line-height: 1.2; }
.mcard .mt span { font-weight: 500; color: var(--color-text-secondary); font-size: 14px; margin-left: 4px; }
.mcard .ms { font-family: var(--font-body); font-size: 13px; color: var(--color-text-secondary); line-height: 1.3; }

.pb { display: flex; gap: 6px; align-items: center; }
.pb .cc-btn { padding: 8px 8px; min-width: 34px; }
.pb .play { flex: 1; font-size: 15px; font-weight: 700; }
.pb .play.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: #1E2320; }
.seg-full { display: flex; width: 100%; }
.seg-full .cc-segmented-btn { flex: 1; padding: 8px 6px; }
.tgl { width: 100%; margin-top: 8px; }

/* chart column */
.center { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
.chart-wrap { position: relative; flex: 1; min-height: 0; background: #171B19; border: 1px solid var(--color-border); border-radius: 8px; overflow: hidden; }
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ribbon-wrap { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 8px; padding: 6px 10px 6px; }
.ribbon-top { display: flex; align-items: baseline; gap: 10px; }
.age { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--color-text-primary); }
.age-lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); }
.ribbon-note { margin-left: auto; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
#ribbon { display: block; width: 100%; height: 40px; cursor: pointer; touch-action: none; margin-top: 2px; }

/* info rail */
.stage { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; }
.track-lbl { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-muted); margin: 2px 0 8px; letter-spacing: 0.04em; }
.cap { font-size: 15px; line-height: 1.45; color: var(--color-text-secondary); margin: 0 0 10px; min-height: 44px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.st { background: var(--color-surface-2); border: 1px solid var(--color-border); border-radius: 6px; padding: 5px 9px; }
.st.wide { grid-column: 1 / -1; }
.st .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text-muted); }
.st .v { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--color-text-primary); line-height: 1.25; }
.near { margin-top: 8px; display: none; align-items: center; gap: 8px; background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: 6px; padding: 6px 9px; text-decoration: none; color: var(--color-text-primary); font-size: 14px; }
.near.on { display: flex; }
.near b { font-weight: 700; }
.near .arr { margin-left: auto; color: var(--tool-accent); }
.near:hover { border-color: var(--tool-accent); }
.size-lbl { margin-top: 10px; }
#sizeCv { display: block; width: 100%; height: 132px; background: #0E100F; border-radius: 6px; }
.remnant { display: none; margin-top: 8px; border: 1px solid var(--color-border-hover); border-radius: 6px; padding: 8px 10px; background: var(--color-surface-2); }
.remnant.on { display: block; }
.remnant .rt { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.remnant .rd { font-size: 14px; color: var(--color-text-secondary); line-height: 1.4; }
.links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.links a { text-decoration: none; }
.race-row { display: grid; grid-template-columns: 12px 1fr; gap: 0 9px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--color-border); }
.race-row:last-child { border-bottom: none; }
.race-row .dot { width: 12px; height: 12px; border-radius: 50%; grid-row: 1 / span 2; }
.race-row .rm { font-weight: 700; font-size: 15px; }
.race-row .rs { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); }
.race-row.dead .rm { opacity: 0.75; }
.src { margin-top: auto; padding-top: 10px; font-size: 13px; font-style: italic; color: var(--color-text-muted); line-height: 1.4; }
.hide { display: none !important; }
@media (max-width: 1180px) { .body { grid-template-columns: 210px minmax(0,1fr) 260px; } .stage { font-size: 22px; } }
</style>

function setLinks() {

  document.getElementById('links').innerHTML = '<a class="cc-btn cc-btn-sm" target="_top" href="ESSRT_5.html?m=' + tr.page5 + '">See on page 5 ↗</a>';
}

// true-scale size view
const sCv = document.getElementById('sizeCv'), sctx = sCv.getContext('2d');
const REFS = [['Earth', 0.00916, 'body'], ['Sun', 1, 'body'], ['Mercury\'s orbit', 83.2, 'orbit'], ['Venus\'s orbit', 155.5, 'orbit'], ['Earth\'s orbit', 215, 'orbit'], ['Mars\'s orbit', 327.7, 'orbit'], ['Jupiter\'s orbit', 1118, 'orbit']];
function drawSize(s, tr) {
  const r = sCv.getBoundingClientRect(), W = Math.round(r.width), H = Math.round(r.height); if (W < 10) return;
  sCv.width = W * dpr; sCv.height = H * dpr; sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const c = sctx; c.fillStyle = '#0E100F'; c.fillRect(0, 0, W, H);
  if (!s) { txt(c, tr.fate === 'ns' ? '~24 km — smaller than Long Island' : 'Horizon ~59 km across', W / 2, H / 2 + 5, { font: '400 14px "Public Sans", sans-serif' }); return; }
  const R = s.R;
  const refs = REFS.filter(q => q[1] <= R * 3.2 && q[1] >= R / 12);
  const maxR = Math.max(R, ...refs.map(q => q[1]));
  const k = (H / 2 - 8) / maxR, cx = W * 0.42, cy = H / 2;
  refs.forEach((q, i) => {
    const rr = q[1] * k;
    if (q[2] === 'orbit') { c.strokeStyle = R >= q[1] ? 'rgba(224,112,90,0.55)' : 'rgba(232,228,217,0.4)'; c.setLineDash([3, 4]); c.beginPath(); c.arc(cx, cy, rr, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
    else { c.strokeStyle = 'rgba(159,195,232,0.8)'; c.lineWidth = 1.2; c.beginPath(); c.arc(cx, cy, Math.max(1, rr), 0, Math.PI * 2); c.stroke(); }
  });
  const col = kelvinRGB(s.T), sr = Math.max(1.5, R * k);
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, sr * 1.4 + 4); g.addColorStop(0, rgba(col, 0.9)); g.addColorStop(1, rgba(col, 0));
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, sr * 1.4 + 4, 0, Math.PI * 2); c.fill();
  c.fillStyle = rgba(col, 0.92); c.beginPath(); c.arc(cx, cy, sr, 0, Math.PI * 2); c.fill();
  // legend at right
  let ly = 18;
  refs.slice().reverse().forEach(q => { txt(c, (q[2] === 'orbit' ? '◌ ' : '○ ') + q[0], W - 8, ly, { align: 'right', font: '400 13px "Public Sans", sans-serif', color: q[2] === 'orbit' && R >= q[1] ? 'rgba(224,112,90,0.95)' : 'rgba(232,228,217,0.8)' }); ly += 17; });
}

// ════════════════════════════════════════════════════════════════════
// RACE RAIL
// ════════════════════════════════════════════════════════════════════
let lastRace = '';
function renderRace() {
  const rows = KEYS.map(k => {
    const tr = TRACKS[k], dead = st.raceT >= tr.tDeath, s = stateAt(tr, pFromTime(tr, st.raceT));
    const status = dead ? (tr.fate === 'wd' ? tr.fateLabel.replace(' (modeled)', '') + ' since age ' + fmtAge(tr.tDeath) : tr.fateLabel + ' · died at ' + fmtAge(tr.tDeath)) : s.stage;
    return [k, dead, status];
  });
  const sigr = rows.map(r => r.join(',')).join('|'); if (sigr === lastRace) return; lastRace = sigr;
  document.getElementById('raceRows').innerHTML = rows.map(([k, dead, status]) => {
    const tr = TRACKS[k];
    return '<div class="race-row' + (dead ? ' dead' : '') + '"><span class="dot" style="background:' + rgba(tr.color) + '"></span><div class="rm" style="color:' + rgba(tr.color) + '">' + tr.label + ' <span style="color:var(--color-text-secondary);font-weight:500">' + tr.sub + '</span></div><div class="rs">' + status + '</div></div>';
  }).join('');
}

// ════════════════════════════════════════════════════════════════════
// RIBBON (stages timeline / race clock)
// ════════════════════════════════════════════════════════════════════
const rb = document.getElementById('ribbon'), rctx = rb.getContext('2d');
let RW = 600, RH = 40;
const RL = 8, RR = 8;
const R_MIN = Math.log10(1e-4), R_MAX = Math.log10(300);   // race clock: 100 thousand yr … 300 billion yr
function drawRibbon() {
  const r = rb.getBoundingClientRect(); RW = Math.round(r.width); RH = Math.round(r.height);
  rb.width = RW * dpr; rb.height = RH * dpr; rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const c = rctx, x0 = RL, x1 = RW - RR, w = x1 - x0;
  c.clearRect(0, 0, RW, RH);
  if (st.mode === 'deep') {
    const tr = TRACKS[st.key], b = segBounds(tr), cur = stateAt(tr, uToP(tr, st.u)).stage;
    tr.segs.forEach((s, i) => {
      const a = x0 + b[i][0] * w, z = x0 + b[i][1] * w, on = s.stage === cur;
      const sw = Math.max(z - a, 2);
      c.fillStyle = on ? rgba(tr.color, 0.85) : rgba(tr.color, 0.22 + 0.1 * (i % 2)); c.fillRect(a, 4, sw - 1, 22);
      c.font = '600 13px "Public Sans", sans-serif';
      let name = s.stage.replace(' (modeled)', '');
      if (c.measureText(name).width >= sw - 8 && SHORT[name]) name = SHORT[name];
      if (c.measureText(name).width < sw - 8) txt(c, name, a + sw / 2, 20, { font: '600 13px "Public Sans", sans-serif', color: on ? '#1E2320' : 'rgba(232,228,217,0.85)' });
    });
    const px = x0 + st.u * w;
    c.fillStyle = '#FFFFFF'; c.fillRect(px - 1.5, 0, 3, 30);
    c.beginPath(); c.moveTo(px, 30); c.lineTo(px - 6, 38); c.lineTo(px + 6, 38); c.closePath(); c.fill();
    document.getElementById('ribbonNote').textContent = st.tm === 'true' ? 'Widths = real durations' : 'Equal width per stage';
  } else {
    const xt = g => x0 + (Math.log10(Math.max(g, 1e-6)) - R_MIN) / (R_MAX - R_MIN) * w;
    c.fillStyle = 'rgba(232,228,217,0.12)'; c.fillRect(x0, 10, w, 10);
    c.fillStyle = 'rgba(60,163,174,0.75)'; c.fillRect(x0, 10, Math.max(0, xt(st.raceT) - x0), 10);
    [[1e-3, '1 million yr'], [1e-2, '10 million'], [0.1, '100 million'], [1, '1 billion'], [10, '10 billion'], [100, '100 billion']].forEach(([g, s]) => {
      const x = xt(g); c.fillStyle = 'rgba(232,228,217,0.6)'; c.fillRect(x, 20, 1, 4); txt(c, s, x, 37, { font: '400 13px "Courier Prime", monospace', color: 'rgba(232,228,217,0.75)' });
    });
    KEYS.forEach(k => { const tr = TRACKS[k]; if (tr.tDeath < Math.pow(10, R_MAX)) { const x = xt(tr.tDeath); c.fillStyle = rgba(tr.color); c.fillRect(x - 1.5, 2, 3, 22); } });
    const xu = xt(UNIVERSE); c.fillStyle = '#E8E4D9'; c.fillRect(xu - 1, 0, 2, 26);
    txt(c, 'Today', xu + 4, 9, { align: 'left', font: '600 13px "Public Sans", sans-serif' });
    const px = xt(st.raceT); c.fillStyle = '#FFFFFF'; c.beginPath(); c.arc(px, 15, 6, 0, Math.PI * 2); c.fill();
    document.getElementById('ribbonNote').textContent = 'Log scale';
  }
  document.getElementById('age').textContent = st.mode === 'deep' ? fmtAge(stateAt(TRACKS[st.key], uToP(TRACKS[st.key], st.u)).t) : fmtAge(st.raceT);
}
let rbDrag = false;
function ribbonAt(e) {
  const r = rb.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left - RL) / (r.width - RL - RR)));
  if (st.mode === 'deep') { st.u = f; }
  else { st.raceT = Math.pow(10, R_MIN + f * (R_MAX - R_MIN)); st.pausedAtToday = st.raceT >= UNIVERSE; }
  setPlaying(false);
}
rb.addEventListener('pointerdown', e => { rbDrag = true; rb.setPointerCapture(e.pointerId); ribbonAt(e); });
rb.addEventListener('pointermove', e => { if (!rbDrag) return; if (e.buttons === 0) { rbDrag = false; return; } ribbonAt(e); });
['pointerup', 'pointercancel'].forEach(t => rb.addEventListener(t, () => { rbDrag = false; }));
window.addEventListener('blur', () => { rbDrag = false; });

// ════════════════════════════════════════════════════════════════════
// CONTROLS
// ════════════════════════════════════════════════════════════════════
function buildCards() {
  const host = document.getElementById('massCards'); host.innerHTML = '';
  KEYS.forEach(k => {
    const tr = TRACKS[k], b = document.createElement('button');
    b.className = 'mcard' + (st.mode === 'deep' && k === st.key ? ' is-active' : ''); b.style.setProperty('--mc', rgba(tr.color));
    b.innerHTML = '<span class="dot" style="background:' + rgba(tr.color) + '"></span><span class="mt">' + tr.label + '<span>' + tr.sub + '</span></span><span class="ms">→ ' + tr.fateLabel.replace(' (modeled)', '') + ' · ' + fmtAge(tr.ms) + '</span>';
    b.setAttribute('aria-pressed', st.mode === 'deep' && k === st.key);
    b.addEventListener('click', () => { if (st.mode !== 'deep') setMode('deep'); selectKey(k); });
    host.appendChild(b);
  });
}
function selectKey(k) { st.key = k; st.u = 0; st.fired = {}; st.flashes = []; lastInfo = ''; setPlaying(false); buildCards(); setLinks(); }
function setPlaying(v) {
  st.playing = v; const b = document.getElementById('playBtn');
  b.textContent = v ? '❚❚ Pause' : '▶ Play'; b.classList.toggle('is-active', v);
}
function setMode(m) {
  st.mode = m; setPlaying(false); st.flashes = []; st.fired = {}; lastInfo = ''; lastRace = '';
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('is-active', b.dataset.mode === m));
  document.getElementById('deepInfo').classList.toggle('hide', m !== 'deep');
  document.getElementById('raceInfo').classList.toggle('hide', m !== 'race');
  document.getElementById('timeModeBox').classList.toggle('hide', m !== 'deep');
  document.getElementById('prevBtn').classList.toggle('hide', m !== 'deep');
  document.getElementById('nextBtn').classList.toggle('hide', m !== 'deep');
  if (m === 'race') { st.raceT = 1e-4; st.pausedAtToday = false; }
  buildCards();
}
function stepStage(d) {
  const tr = TRACKS[st.key], b = segBounds(tr);
  let i = b.findIndex(x => st.u < x[1] - 1e-9); if (i < 0) i = b.length - 1;
  const atStart = Math.abs(st.u - b[i][0]) < 1e-4;
  let j = d > 0 ? i + 1 : (atStart ? i - 1 : i);
  j = Math.max(0, Math.min(b.length - 1, j));
  st.u = d > 0 && i === b.length - 1 ? 1 : b[j][0] + (b[j][1] - b[j][0] < 1e-6 ? 0 : 1e-7);
  if (d > 0 && j === b.length - 1 && tr.segs[j].terminal) st.u = 1;
  setPlaying(false);
}
document.querySelectorAll('.mode-btn').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('.tm-btn').forEach(b => b.addEventListener('click', () => {
  const tr = TRACKS[st.key], p = uToP(tr, st.u);
  st.tm = b.dataset.tm; document.querySelectorAll('.tm-btn').forEach(x => x.classList.toggle('is-active', x === b));
  st.u = pToU(tr, p);
}));
document.getElementById('playBtn').addEventListener('click', () => {
  if (st.mode === 'deep' && st.u >= 1) { st.u = 0; st.fired = {}; }
  if (st.mode === 'race' && st.raceT >= Math.pow(10, R_MAX) * 0.999) { st.raceT = 1e-4; st.pausedAtToday = false; }
  setPlaying(!st.playing); lastTs = null;
});
document.getElementById('resetBtn').addEventListener('click', () => { st.u = 0; st.raceT = 1e-4; st.pausedAtToday = false; st.fired = {}; st.flashes = []; setPlaying(false); });
document.getElementById('prevBtn').addEventListener('click', () => stepStage(-1));
document.getElementById('nextBtn').addEventListener('click', () => stepStage(1));
document.getElementById('p4Btn').addEventListener('click', e => {
  st.p4 = !st.p4; e.currentTarget.classList.toggle('is-active', st.p4); e.currentTarget.setAttribute('aria-pressed', st.p4);
  e.currentTarget.textContent = 'Page 4 stars: ' + (st.p4 ? 'on' : 'off'); lastInfo = '';
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  if (e.key === ' ') { e.preventDefault(); document.getElementById('playBtn').click(); }
  else if (st.mode === 'deep' && e.key === 'ArrowRight') stepStage(1);
  else if (st.mode === 'deep' && e.key === 'ArrowLeft') stepStage(-1);
});

// ════════════════════════════════════════════════════════════════════
// LOOP
// ════════════════════════════════════════════════════════════════════
let lastTs = null;
function tick(ts) {
  const dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0; lastTs = ts;
  if (st.playing) {
    if (st.mode === 'deep') {
      const tr = TRACKS[st.key];
      const rate = st.tm === 'true' ? 1 / 24 : 1 / (tr.segs.length * 3.2);
      st.u = Math.min(1, st.u + rate * dt);
      if (st.u >= 1) setPlaying(false);
    } else {
      const lg = Math.log10(st.raceT) + 0.42 * dt, next = Math.pow(10, lg);
      if (!st.pausedAtToday && st.raceT < UNIVERSE && next >= UNIVERSE) { st.raceT = UNIVERSE; st.pausedAtToday = true; setPlaying(false); }
      else st.raceT = Math.min(Math.pow(10, R_MAX), next);
      if (st.raceT >= Math.pow(10, R_MAX)) setPlaying(false);
    }
  }
  // event flashes
  if (st.mode === 'deep') {
    const tr = TRACKS[st.key], p = uToP(tr, st.u);
    tr.wps.forEach((w, i) => { if (w.event && p >= i - 0.02 && !st.fired[i]) { st.fired[i] = true; st.flashes.push({ x: xPix(clampT(w.T)), y: yPix(clampL(w.L)), t0: ts, col: tr.color }); } });
  } else {
    KEYS.forEach(k => { const tr = TRACKS[k]; if (st.raceT >= tr.tEnd && !st.fired[k] && tr.fate !== 'wd') { st.fired[k] = true; const w = tr.wps[tr.wps.length - 1]; st.flashes.push({ x: xPix(clampT(w.T)), y: yPix(clampL(w.L)), t0: ts, col: tr.color }); } });
  }
  render(ts);
  requestAnimationFrame(tick);
}

// ════════════════════════════════════════════════════════════════════
// PNG EXPORT — chart re-rendered at 3×
// ════════════════════════════════════════════════════════════════════
const EXPORT_SCALE = 3;
document.getElementById('pngBtn').addEventListener('click', () => {
  const W = G.W, H = G.H, PAD = 24, HDR = 70, FTR = 30, ow = W + PAD * 2, oh = H + HDR + FTR;
  sizeChart(EXPORT_SCALE); render(performance.now());
  const off = document.createElement('canvas'); off.width = ow * EXPORT_SCALE; off.height = oh * EXPORT_SCALE;
  const oc = off.getContext('2d'); oc.scale(EXPORT_SCALE, EXPORT_SCALE);
  oc.fillStyle = '#1E2320'; oc.fillRect(0, 0, ow, oh); oc.fillStyle = '#3CA3AE'; oc.fillRect(0, 0, ow, 3);
  const tr = TRACKS[st.key], s = stateAt(tr, uToP(tr, st.u));
  txt(oc, 'Stellar Life Cycles', PAD, 32, { align: 'left', font: '700 20px "Zilla Slab", serif', color: '#E8E4D9' });
  txt(oc, st.mode === 'deep' ? tr.label + ' · ' + tr.sub + ' — ' + s.stage + ', age ' + fmtAge(s.t) : 'Five stars, one clock — ' + fmtAge(st.raceT), PAD, 54, { align: 'left', font: '13px "Public Sans", sans-serif', color: '#A6A499' });
  oc.drawImage(cv, PAD, HDR, W, H);
  txt(oc, 'contextclimate.io', PAD, oh - 12, { align: 'left', font: '11px "Courier Prime", monospace', color: '#948F82' });
  oc.fillStyle = '#3CA3AE'; oc.fillRect(0, oh - 2, ow, 2);
  const a = document.createElement('a'); a.download = st.mode === 'deep' ? 'stellar-life-cycle-' + st.key + 'Msun.png' : 'stellar-life-cycle-race.png'; a.href = off.toDataURL('image/png'); a.click();
  sizeChart();
});

// ════════════════════════════════════════════════════════════════════
// INIT — deep links: ?m=0.3|1|5|15|25 (0.5 → 0.3), ?mode=race, ?time=true
// ════════════════════════════════════════════════════════════════════
(function init() {
  const q = new URLSearchParams(location.search);
  let m = q.get('m'); if (m === '0.5') m = '0.3';
  if (m && TRACKS[m]) st.key = m;
  if (q.get('time') === 'true') { st.tm = 'true'; document.querySelectorAll('.tm-btn').forEach(x => x.classList.toggle('is-active', x.dataset.tm === 'true')); }
  setMode(q.get('mode') === 'race' ? 'race' : 'deep');
  setLinks(); sizeChart();
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { dpr = window.devicePixelRatio || 1; sizeChart(); lastInfo = ''; }, 60); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastInfo = ''; });
  requestAnimationFrame(tick);
})();
window.__lc = { st, TRACKS, KEYS, stateAt, uToP, pToU, pFromTime, tauGyr, radiusOf, nearestP4, segBounds, selectKey, setMode, stepStage };
})();
</script>
