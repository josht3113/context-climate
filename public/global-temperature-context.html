<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Temperature in Context</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
  :root { --tool-accent: var(--accent-climate); --cc-card-width: 320px; }
  [hidden] { display: none !important; }

  .cc-app { max-width: 1760px; margin: 0 auto; }
  .cc-scene-head, .lg-strip, .cc-scene-bar { flex-shrink: 0; }

  /* ── Top row ── */
  .exp { display: flex; gap: 6px; }
  .exp .cc-btn { padding: 8px 12px; font-size: 14px; font-weight: 700; }
  .cc-btn.is-error { border-color: #C05050; color: #E07070; }
  .cc-btn.is-ok { border-color: #3A9E50; color: #5CC070; }

  /* ── Scene head ── */
  .cc-scene-head { gap: 6px 22px; padding: 8px 14px 7px; align-items: flex-end; }
  .hd-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hm-heading { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
  .hm-period { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
  .ro-row { display: flex; align-items: flex-end; gap: 4px 24px; flex-wrap: wrap; margin-left: auto; }
  .ro { display: flex; flex-direction: column; min-width: 0; }
  .ro-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
  .ro-v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; }
  .ro-n { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }

  /* ── Legend strip ── */
  .lg-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 18px; padding: 6px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 32px; }
  .lg-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sw-line { width: 22px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .sw-line.dash { border-top-style: dashed; border-top-width: 1.5px; }
  .sw-grad { width: 64px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .sw-box { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .sw-hollow { width: 10px; height: 10px; border: 1.5px solid; border-radius: 1px; flex-shrink: 0; }

  /* ── Stage ── */
  .cc-scene-stage { overflow: hidden; }
  #cv, #ov { position: absolute; left: 0; top: 0; display: block; }
  #ov { cursor: crosshair; outline: none; touch-action: pan-y; }
  #ov:focus-visible { box-shadow: inset 0 0 0 2px var(--tool-accent); }
  .state-overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px;
    background: #262B27; color: var(--color-text-secondary); font-family: var(--font-mono); font-size: 14px; text-align: center; }
  .state-overlay .err { color: #E07070; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--color-border); border-top-color: var(--tool-accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Control bar ── */
  .cc-scene-bar { flex-wrap: wrap; gap: 8px 10px; min-height: 0; padding: 7px 12px; }
  .grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .grp-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-right: 3px; white-space: nowrap; }
  .grp .cc-btn { font-size: 14px; padding: 6px 11px; }
  .grp .cc-btn:not(.is-active) { color: var(--color-text-secondary); }
  .grp .cc-btn.is-active { color: #F2EEE3; }
  .grp .cc-btn:disabled { opacity: .35; cursor: not-allowed; }
  .grp .cc-select { font-size: 14px; font-weight: 600; padding: 6px 8px; }

  /* ── Rail card ── */
  .cc-card { gap: 0; padding: 10px 14px; overflow-x: hidden; }
  .rd-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
  .rd-date { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--color-text-primary); line-height: 1.1; white-space: nowrap; }
  .rd-tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; white-space: nowrap; }
  .rd-hint { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); white-space: nowrap; }
  .sc-wrap { position: relative; flex: 1 1 auto; min-height: 140px; margin-top: 6px; }
  #sc { position: absolute; left: 0; top: 0; display: block; cursor: pointer; }
  .sc-read { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 20px; padding-top: 2px; flex-shrink: 0; }
  .sc-read b { color: var(--color-text-primary); }
  .sec-h { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); flex-shrink: 0; }
  .sec-h .sec-x { margin-left: auto; background: none; border: none; color: var(--color-text-muted); font-family: var(--font-mono); font-size: 12px; cursor: pointer; padding: 0; letter-spacing: .04em; text-transform: none; }
  .sec-h .sec-x:hover { color: var(--color-text-primary); }
  table.rk { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; margin: 2px 0 0; flex-shrink: 0; }
  .rk td { padding: 2px 0; color: var(--color-text-primary); white-space: nowrap; border-top: 1px solid rgba(232,228,217,.06); }
  .rk tr:first-child td { border-top: none; }
  .rk td.n { color: var(--color-text-muted); width: 34px; font-size: 13px; }
  .rk td.y { cursor: pointer; }
  .rk td.y i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 7px; vertical-align: 0; }
  .rk td.v { text-align: right; font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .rk td.e { text-align: right; width: 40px; font-size: 12px; color: var(--color-text-muted); }
  .rk tr.is-focus td { color: #F2EEE3; }
  .rk tr.is-focus td.y { font-weight: 700; }
  .rk tr.gap td { color: var(--color-text-muted); text-align: center; font-size: 12px; padding: 0; border-top: none; }
  .rk td.x { width: 18px; text-align: right; }
  .rk td.x button { background: none; border: none; color: var(--color-text-muted); cursor: pointer; font-size: 14px; padding: 0 0 0 4px; line-height: 1; }
  .rk td.x button:hover { color: var(--color-text-primary); }
  .pin-empty { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-muted); padding: 5px 0 2px; flex-shrink: 0; }
  .cc-card-src { padding-top: 8px; flex-shrink: 0; font-size: 12px; }

  /* ── Narrower windows ── */
  @media (max-width: 1500px) {
    .ro-row { gap: 4px 18px; }
    #g-ref .grp-l, #g-sm .grp-l, .grp-yr .grp-l { display: none; }
    .grp .cc-btn { padding: 6px 9px; }
  }
  @media (max-width: 1360px) {
    :root { --cc-card-width: 290px; }
    .cc-app-title { font-size: 21px; }
    .grp .cc-btn { padding: 6px 7px; font-size: 13px; }
    .grp-l { display: none; }
    .ro-v { font-size: 23px; }
    .ro-row { gap: 4px 14px; }
    .exp .cc-btn { padding: 8px 9px; font-size: 13px; }
  }
  @media (max-width: 1180px) {
    .hm-period { display: none; }
    .ro-n { display: none; }
  }
  @media (max-height: 720px) and (min-width: 761px) {
    .cc-app { padding-top: 6px; padding-bottom: 8px; gap: 6px; }
    .cc-app-top { min-height: 0; }
    .exp .cc-btn { padding-top: 5px; padding-bottom: 5px; }
    .cc-scene-head { padding-top: 4px; padding-bottom: 4px; }
    .hm-heading { font-size: 20px; }
    .ro-v { font-size: 22px; }
    .ro-n { display: none; }
    .lg-strip { padding-top: 3px; padding-bottom: 3px; min-height: 0; }
    .cc-scene-bar { padding-top: 4px; padding-bottom: 4px; }
    .grp .cc-btn, .grp .cc-select { padding-top: 4px; padding-bottom: 4px; }
    .rk td { padding: 1px 0; }
  }
  @media (max-width: 760px) {
    .cc-app-title { width: 100%; font-size: 20px; white-space: normal; }
    .cc-app-spacer { display: none; }
    .ro-row { margin-left: 0; }
    .grp-l { display: inline; }
    .sc-wrap { flex: none; height: 200px; }
  }
</style>
</head>
<body class="cc-app-body">
<div class="cc-app">

  <div class="cc-app-top">
    <h1 class="cc-app-title">Global Temperature in Context</h1>
    <div class="cc-app-spacer"></div>
    <div class="exp">
      <button class="cc-btn" id="copy-btn" title="Copy the chart image">&#x29C9; Copy</button>
      <button class="cc-btn" id="png-btn" title="Download the chart as PNG">&#x2193; PNG</button>
      <button class="cc-btn" id="csv-btn" title="Download the data shown as CSV">&#x2193; CSV</button>
    </div>
  </div>

  <div class="cc-app-main">
    <div class="cc-scene">
      <div class="cc-scene-head">
        <div class="hd-id">
          <div class="hm-heading" id="hd">&nbsp;</div>
          <div class="hm-period" id="hd-p">&nbsp;</div>
        </div>
        <div class="ro-row" id="ro"></div>
      </div>
      <div class="lg-strip" id="lg"></div>
      <div class="cc-scene-stage" id="stage">
        <canvas id="cv"></canvas>
        <canvas id="ov" tabindex="0" aria-label="Global temperature chart. Hover to read a day or year; left and right arrow keys move the selected day."></canvas>
        <div class="state-overlay" id="state"><div class="spinner"></div><div>Loading ERA5 daily record…</div></div>
      </div>
      <div class="cc-scene-bar">
        <div class="grp" id="g-view"><button class="cc-btn" data-v="daily">Daily</button><button class="cc-btn" data-v="annual">Annual</button></div>
        <div class="cc-scene-bar-sep"></div>
        <div class="grp" id="g-ref"><span class="grp-l">Ref</span><button class="cc-btn" data-v="1850">1850–1900</button><button class="cc-btn" data-v="1991">1991–2020</button><button class="cc-btn" data-v="abs">Absolute</button></div>
        <div class="grp" id="g-sm"><span class="grp-l">Smooth</span><button class="cc-btn" data-v="1">Raw</button><button class="cc-btn" data-v="5">5-day</button><button class="cc-btn" data-v="31">31-day</button></div>
        <div class="grp" id="g-u"><button class="cc-btn" data-v="c">°C</button><button class="cc-btn" data-v="f">°F</button></div>
        <div class="cc-scene-bar-sep"></div>
        <div class="grp grp-yr"><span class="grp-l">Year</span><select class="cc-select" id="yr-sel" aria-label="Year in focus"></select></div>
        <div class="grp" id="g-col"><span class="grp-l">Colour</span><button class="cc-btn" data-v="year">Year</button><button class="cc-btn" data-v="enso">ENSO</button></div>
      </div>
    </div>

    <div class="cc-card" id="card">
      <div class="rd-head"><span class="rd-date" id="rd-date">&nbsp;</span><span class="rd-tag" id="rd-tag"></span><span class="rd-hint" id="rd-hint">click to pin</span></div>
      <div class="sc-wrap" id="sc-wrap"><canvas id="sc"></canvas></div>
      <div class="sc-read" id="sc-read">&nbsp;</div>
      <div class="sec-h" id="rk-h">&nbsp;</div>
      <table class="rk" id="rk"></table>
      <div class="sec-h">Pinned<button class="sec-x" id="pin-clear" hidden>clear</button></div>
      <table class="rk" id="pins"></table>
      <div class="pin-empty" id="pin-empty">Click a line, stripe, bar or dot</div>
      <div class="cc-card-src" id="src"></div>
    </div>
  </div>
</div>

<script>
(function () {
"use strict";

// ── Palette ────────────────────────────────────────────────────────────
const C = {
  bg: '#1E2320', surface: '#262B27', ink: '#E8E4D9', ink2: '#A6A499', ink3: '#948F82',
  accent: '#D08425', grid: 'rgba(232,228,217,0.07)', zero: 'rgba(232,228,217,0.26)',
};
const MONO = "'Courier Prime', monospace", BODY = "'Public Sans', sans-serif", DISPLAY = "'Zilla Slab', serif";
const ENSO = {
  el_nino: { hex: '#E0574D', label: 'El Niño' },
  neutral: { hex: '#8F8C80', label: 'Neutral' },
  la_nina: { hex: '#5B9EE0', label: 'La Niña' },
  unclassified: { hex: '#565A52', label: 'Before 1950' },
};
const PIN_COLORS = ['#3FC29A', '#C79BE8', '#F08FC0', '#B5DB6A', '#7FDDE8'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MSTART = [0,31,60,91,121,152,182,213,244,274,305,335];   // 366-day calendar
const FEB29 = 59, N = 366, MAX_PINS = 5, EXPORT_SCALE = 3;
const PREIND_LINES = [1.5, 2.0];

function oklch(L, Ch, h) {
  const hr = h * Math.PI / 180, a = Ch * Math.cos(hr), b = Ch * Math.sin(hr);
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b, m_ = L - 0.1055613458 * a - 0.0638541728 * b, s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
  return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s].map(x => {
    x = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(Math.max(0, x), 1 / 2.4) - 0.055;
    return Math.max(0, Math.min(255, Math.round(x * 255)));
  });
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

// Year ramp for lines/bars: amber, dim → bright with time.
const yearRGB = t => oklch(0.34 + 0.44 * Math.pow(t, 2.2), 0.015 + 0.135 * Math.pow(t, 1.4), 62);

// Stripe ramp: dark neutral at 0; warm side runs red → orange → pale gold,
// cool side blue → pale cyan. Equal °C per step on both sides.
const DIV = (() => {
  const lut = [];
  for (let k = 0; k < 512; k++) {
    const u = k / 511 * 2 - 1, a = Math.abs(u);
    lut.push(u >= 0
      ? oklch(0.33 + 0.55 * Math.pow(a, 0.85), 0.165 * Math.sin(Math.PI * Math.min(1, a * 0.9 + 0.08)) + 0.01 * a, 26 + 52 * Math.pow(a, 1.6))
      : oklch(0.33 + 0.52 * Math.pow(a, 0.85), 0.14 * Math.sin(Math.PI * Math.min(1, a * 0.85 + 0.08)), 255 - 45 * Math.pow(a, 1.4)));
  }
  return lut;
})();
const divRGB = u => DIV[Math.round((Math.max(-1, Math.min(1, u)) + 1) / 2 * 511)];

// ── State ──────────────────────────────────────────────────────────────
const S = { view: 'daily', ref: '1850', sm: 5, u: 'c', col: 'year', focus: null, day: null, pins: [] };
let D, YEARS = [], CY, LATEST, RAW = {}, M = null;
let hover = { day: null, year: null, zone: null, px: 0, py: 0 };
let scHover = null, dpr = window.devicePixelRatio || 1, LO = null;
const gridCanvas = document.createElement('canvas');
const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('cv'), ov = $('ov');

const isLeap = y => { y = +y; return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; };
const ok = v => v === v && v !== null && v !== undefined;
function slotMD(i) { let m = 11; while (MSTART[m] > i) m--; return [m, i - MSTART[m] + 1]; }
const slotLabel = i => { const [m, d] = slotMD(i); return MONTHS[m] + ' ' + d; };
const valid = (y, i) => !(i === FEB29 && !isLeap(y)) && (y !== CY || i <= LATEST);
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
const absRef = () => S.ref === 'abs';
const refLabel = () => S.ref === '1850' ? 'vs 1850–1900' : S.ref === '1991' ? 'vs 1991–2020' : 'global mean';
const usym = () => S.u === 'f' ? '°F' : '°C';
function toU(v, isAbs) { return S.u === 'c' ? v : isAbs ? v * 1.8 + 32 : v * 1.8; }
function fmt(v, dec, isAbs, noUnit) {
  if (!ok(v)) return '–';
  let s = Math.abs(v).toFixed(dec);
  if (!isAbs) s = (v >= 0.5 * 10 ** -dec ? '+' : v <= -0.5 * 10 ** -dec ? '−' : '') + s;
  else if (v < 0) s = '−' + s;
  return s + (noUnit ? '°' : usym());
}
const yearColorT = y => { const k = YEARS.indexOf(y), last = YEARS.length - 2; return last <= 0 ? 1 : Math.min(1, k / last); };
function yearColor(y) {
  if (S.col === 'enso') return ENSO[D.years[y].enso].hex;
  return rgb(yearRGB(yearColorT(y)));
}
const pinColor = y => PIN_COLORS[S.pins.indexOf(y) % PIN_COLORS.length];
function niceTicks(lo, hi, target) {
  const raw = (hi - lo) / target, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw);
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return { ticks: out, step };
}
const tickDec = step => step >= 1 ? 0 : step >= 0.25 && step !== 0.25 ? 1 : 2;

// ── Load ───────────────────────────────────────────────────────────────
fetch('./data/global-temp-daily.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(init)
  .catch(err => { $('state').innerHTML = '<div class="err">Could not load the temperature data (' + err.message + ').</div>'; });

function init(json) {
  D = json;
  YEARS = Object.keys(D.years).sort();
  CY = String(D.current_year);
  YEARS.forEach(y => { RAW[y] = D.years[y].t.map(v => ok(v) ? v : NaN); });
  LATEST = 0;
  RAW[CY].forEach((v, i) => { if (ok(v)) LATEST = i; });

  const sel = $('yr-sel');
  YEARS.slice().reverse().forEach(y => { const o = document.createElement('option'); o.value = y; o.textContent = y; sel.appendChild(o); });

  readURL();
  if (!S.focus || !D.years[S.focus]) S.focus = CY;
  if (S.day === null || S.day < 0 || S.day > 365 || !valid(S.focus, S.day)) S.day = LATEST;

  wire();
  recompute();
  $('state').hidden = true;
  new ResizeObserver(resize).observe(stage);
  new ResizeObserver(drawSc).observe($('sc-wrap'));
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { resize(); drawSc(); });
}

// ── Derived data ───────────────────────────────────────────────────────
function baseArr(ref) { return ref === '1850' ? D.baseline_1850_1900 : ref === '1991' ? D.baseline_1991_2020 : null; }

function smoothSeries(base, w) {
  // one continuous series of real calendar days across all years, so a
  // window never wraps December into January of the same year
  const flat = [], own = [];
  YEARS.forEach(y => { for (let i = 0; i < N; i++) if (valid(y, i)) { const v = RAW[y][i]; flat.push(ok(v) ? (base ? v - base[i] : v) : NaN); own.push([y, i]); } });
  let sm = flat;
  if (w > 1) {
    const h = Math.floor(w / 2); sm = new Array(flat.length);
    for (let k = 0; k < flat.length; k++) {
      if (!ok(flat[k])) { sm[k] = NaN; continue; }
      let s = 0, c = 0;
      for (let j = Math.max(0, k - h); j <= Math.min(flat.length - 1, k + h); j++) if (ok(flat[j])) { s += flat[j]; c++; }
      sm[k] = s / c;
    }
  }
  const out = {};
  YEARS.forEach(y => { out[y] = new Float64Array(N).fill(NaN); });
  for (let k = 0; k < sm.length; k++) out[own[k][0]][own[k][1]] = sm[k];
  // drawing only: bridge 29 Feb in common years
  YEARS.forEach(y => {
    if (isLeap(y)) return;
    const a = out[y][FEB29 - 1], b = out[y][FEB29 + 1];
    if (ok(a) && ok(b)) out[y][FEB29] = (a + b) / 2;
  });
  return out;
}

function recompute() {
  const isAbs = absRef(), base = baseArr(S.ref);
  const lines = smoothSeries(base, S.sm);
  const disp = {};
  let lo = Infinity, hi = -Infinity;
  YEARS.forEach(y => {
    disp[y] = lines[y].map(v => ok(v) ? toU(v, isAbs) : NaN);
    disp[y].forEach(v => { if (ok(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } });
  });
  const rec = new Float64Array(N).fill(NaN);
  for (let i = 0; i < N; i++) YEARS.forEach(y => { if (y !== CY && ok(disp[y][i]) && !(ok(rec[i]) && rec[i] >= disp[y][i])) rec[i] = disp[y][i]; });

  // stripes: always an anomaly (Absolute → vs 1991–2020)
  const stripeRef = isAbs ? '1991' : S.ref;
  const st = isAbs ? smoothSeries(baseArr('1991'), S.sm) : lines;
  const sdisp = {}, all = [];
  YEARS.forEach(y => { sdisp[y] = st[y].map(v => ok(v) ? toU(v, false) : NaN); sdisp[y].forEach(v => { if (ok(v)) all.push(v); }); });
  all.sort((a, b) => a - b);
  const sLo = all[Math.floor(all.length * 0.005)], sHi = all[Math.floor(all.length * 0.995)];
  const sScale = Math.max(Math.abs(sLo), Math.abs(sHi));

  // annual: mean of raw daily anomalies over real calendar days
  const ann = {}, annAbsBase = base;
  YEARS.forEach(y => {
    let s = 0, c = 0;
    for (let i = 0; i < N; i++) if (valid(y, i) && ok(RAW[y][i])) { s += annAbsBase ? RAW[y][i] - annAbsBase[i] : RAW[y][i]; c++; }
    ann[y] = { v: c ? toU(s / c, isAbs) : NaN, n: c, complete: y !== CY && c >= 365 };

  const r20 = {};
  YEARS.forEach((y, k) => {
    if (k < 19) return;
    let s = 0, c = 0;
    for (let j = k - 19; j <= k; j++) if (ann[YEARS[j]].complete) { s += ann[YEARS[j]].v; c++; }
    if (c === 20) r20[y] = s / 20;
  });

  M = { disp, rec, yMin: lo, yMax: hi, sdisp, sLo, sHi, sScale, stripeRef, ann, r20 };
  const pad = (hi - lo) * 0.05; M.yMin = lo - pad; M.yMax = hi + pad;

}

function buildGrid() {
  const n = YEARS.length;
  gridCanvas.width = N; gridCanvas.height = n;
  const g = gridCanvas.getContext('2d'), img = g.createImageData(N, n);
  for (let r = 0; r < n; r++) {
    const row = M.sdisp[YEARS[n - 1 - r]];
    for (let i = 0; i < N; i++) {
      const p = (r * N + i) * 4, v = row[i];
      if (!ok(v)) { img.data[p + 3] = 0; continue; }
      const c = divRGB(v / M.sScale);
      img.data[p] = c[0]; img.data[p + 1] = c[1]; img.data[p + 2] = c[2]; img.data[p + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}

// ── Stats (raw daily values; smoothing only affects drawing) ───────────
function rawA(y, i) { const b = baseArr(S.ref), v = RAW[y][i]; return ok(v) && valid(y, i) ? toU(b ? v - b[i] : v, absRef()) : NaN; }
function dayList(i) { const out = []; YEARS.forEach(y => { const v = rawA(y, i); if (ok(v)) out.push([y, v]); }); return out.sort((a, b) => b[1] - a[1]); }
function ytdMean(y, d) {
  // Jan 1 → d, 29 Feb left out so every year averages the same dates
  let s = 0, c = 0, need = 0;
  for (let i = 0; i <= d; i++) { if (i === FEB29) continue; need++; const v = rawA(y, i); if (ok(v)) { s += v; c++; } }
  return c === need && need ? s / c : NaN;
}
function stats(Y, d) {
  const list = dayList(d), me = list.find(p => p[0] === Y);
  let records = 0, days = 0;
  const prior = YEARS.filter(y => y < Y);
  for (let k = 0; k <= d; k++) {
    const v = rawA(Y, k); if (!ok(v)) continue; days++;
    let mx = -Infinity; prior.forEach(y => { const w = rawA(y, k); if (ok(w) && w > mx) mx = w; });
    if (prior.length && v > mx) records++;
  }
  const ytd = []; YEARS.forEach(y => { const m = ytdMean(y, d); if (ok(m)) ytd.push([y, m]); });
  ytd.sort((a, b) => b[1] - a[1]);
  const yk = ytd.findIndex(p => p[0] === Y);
  return {
    value: me ? me[1] : NaN, rank: me ? list.indexOf(me) + 1 : null, of: list.length,
    records, days, ytd: yk >= 0 ? ytd[yk][1] : NaN, ytdRank: yk >= 0 ? yk + 1 : null, ytdOf: ytd.length, ytdLeader: ytd.length ? ytd[0][0] : null,
  };
}
function annualRanks() {
  return YEARS.filter(y => M.ann[y].complete).map(y => [y, M.ann[y].v]).sort((a, b) => b[1] - a[1]);
}

// ── Layout ─────────────────────────────────────────────────────────────
function layoutDaily(W, H) {
  const L = { W, H, narrow: W < 620 };
  L.px0 = L.narrow ? 46 : 54;
  L.px1 = W - (L.narrow ? 64 : 84);
  L.l0 = 14;
  const avail = H - L.l0 - 28 - 6;
  L.l1 = L.l0 + Math.round(avail * 0.6);
  L.g0 = L.l1 + 28; L.g1 = H - 6;

}
function layoutAnnual(W, H) { return { W, H, narrow: W < 620, px0: W < 620 ? 46 : 54, px1: W - 18, l0: 16, l1: H - 30 }; }
const fx = (L, i) => L.px0 + (i + 0.5) / N * (L.px1 - L.px0);
const fy = (L, v) => L.l1 - (v - M.yMin) / (M.yMax - M.yMin) * (L.l1 - L.l0);

function resize() {
  const W = Math.max(300, Math.floor(stage.clientWidth)), H = Math.max(240, Math.floor(stage.clientHeight));
  dpr = window.devicePixelRatio || 1;
  [cv, ov].forEach(c => { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); c.style.width = W + 'px'; c.style.height = H + 'px'; });
  LO = S.view === 'daily' ? layoutDaily(W, H) : layoutAnnual(W, H);
  drawAll();
}

function drawAll() {
  if (!M || !LO) return;
  const b = cv.getContext('2d'); b.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.view === 'daily') drawDaily(b, LO); else drawAnnual(b, LO);
  drawOverlayNow();
  renderHead(); renderLegend(); renderCard(); drawSc(); syncURL();
}

// ── Daily view ─────────────────────────────────────────────────────────
function haloText(c, t, x, y, color, w) { c.save(); c.lineWidth = w || 4; c.lineJoin = 'round'; c.strokeStyle = C.surface; c.strokeText(t, x, y); c.restore(); c.fillStyle = color; c.fillText(t, x, y); }
function tracePath(c, L, row) {
  c.beginPath(); let pen = false;
  for (let i = 0; i < N; i++) { const v = row[i]; if (!ok(v)) { pen = false; continue; } const x = fx(L, i), y = fy(L, v); if (pen) c.lineTo(x, y); else { c.moveTo(x, y); pen = true; } }
}

}

function drawDaily(c, L) {

}

function drawDailyOverlay(c, L, h) {
  const day = h.day ?? S.day, x = Math.round(fx(L, day)) + 0.5;
  c.strokeStyle = 'rgba(232,228,217,0.30)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, L.l0); c.lineTo(x, L.l1); c.moveTo(x, L.g0); c.lineTo(x, L.g1); c.stroke();

function tooltip(c, L, h, lines) {

}

// ── Annual view ────────────────────────────────────────────────────────
function annDomain() {
  const vals = YEARS.map(y => M.ann[y].v).filter(ok);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (!absRef()) { lo = Math.min(0, lo); hi = Math.max(0, hi); }
  if (S.ref === '1850') hi = Math.max(hi, toU(1.5));
  const pad = (hi - lo) * 0.06;
  return [absRef() ? lo - pad : lo - (lo < 0 ? pad : 0), hi + pad];
}
function annX(L, k) { const w = (L.px1 - L.px0) / YEARS.length; return { x: L.px0 + k * w, w }; }
function drawAnnual(c, L) {
  c.fillStyle = C.surface; c.fillRect(0, 0, L.W, L.H);
  const isAbs = absRef(), [lo, hi] = annDomain();
  const ay = v => L.l1 - (v - lo) / (hi - lo) * (L.l1 - L.l0);
  L.ay = ay;
  const t = niceTicks(lo, hi, 6), dec = tickDec(t.step);
  c.font = '12px ' + MONO; c.textAlign = 'right'; c.textBaseline = 'middle';
  t.ticks.forEach(v => {
    const y = Math.round(ay(v)) + 0.5, zero = !isAbs && Math.abs(v) < 1e-9;
    c.strokeStyle = zero ? C.zero : C.grid; c.lineWidth = 1;
    c.beginPath(); c.moveTo(L.px0, y); c.lineTo(L.px1, y); c.stroke();
    c.fillStyle = C.ink3; c.fillText(fmt(v, dec, isAbs, true), L.px0 - 7, y);
  });

  YEARS.forEach((y, k) => {

      c.setLineDash([]);
    } else {

    }
  });

  c.lineJoin = 'round';

  if (pts.length) {
    [[C.surface, 5], [C.ink, 2]].forEach(([col, w]) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.stroke(); });
  }
  const th = S.ref === '1850' ? PREIND_LINES.filter(v => toU(v) <= hi) : [];
  c.setLineDash([5, 5]); c.lineWidth = 1; c.strokeStyle = 'rgba(232,228,217,0.4)';
  th.forEach(v => { const y = Math.round(ay(toU(v))) + 0.5; c.beginPath(); c.moveTo(L.px0, y); c.lineTo(L.px1, y); c.stroke(); });
  c.setLineDash([]);
  c.font = '12px ' + MONO; c.textAlign = 'left'; c.textBaseline = 'bottom';
  th.forEach(v => haloText(c, '+' + toU(v).toFixed(1) + '°', L.px0 + 6, ay(toU(v)) - 3, C.ink2));
  c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.fillStyle = C.ink3;
  YEARS.forEach((y, k) => { if (+y % (L.narrow ? 20 : 10) !== 0) return; const { x, w } = annX(L, k); c.fillText(y, x + w / 2, L.l1 + 18); });
}
function drawAnnualOverlay(c, L, h) {
  const mark = (y, col) => {
    const k = YEARS.indexOf(y), a = M.ann[y]; if (!ok(a.v)) return;
    const { x, w } = annX(L, k), y0 = L.ay(absRef() ? annDomain()[0] : 0), y1 = L.ay(a.v);
    c.strokeStyle = col; c.lineWidth = 2; c.strokeRect(x, Math.min(y0, y1) - 1, w, Math.abs(y1 - y0) + 2);
    c.font = '700 12px ' + MONO; c.textAlign = 'center'; c.textBaseline = 'bottom';

  };

    if (ok(M.r20[h.year])) lines.push('20-yr mean ' + fmt(M.r20[h.year], 2, absRef()));

const fmtOni = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);

// ── Overlay + interaction ──────────────────────────────────────────────
let raf = 0;
function drawOverlayNow() {
  const o = ov.getContext('2d'); o.setTransform(dpr, 0, 0, dpr, 0, 0); o.clearRect(0, 0, LO.W, LO.H);
  if (S.view === 'daily') drawDailyOverlay(o, LO, hover); else drawAnnualOverlay(o, LO, hover);

function redraw() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; drawOverlayNow(); renderCard(); drawSc(); }); }

function hitTest(px, py) {
  const L = LO, h = { day: null, year: null, zone: null, px, py };
  if (S.view === 'annual') {
    if (px < L.px0 || px > L.px1 || py < L.l0 - 10 || py > L.l1 + 20) return h;
    const k = Math.floor((px - L.px0) / (L.px1 - L.px0) * YEARS.length);
    h.zone = 'bars'; h.year = YEARS[Math.max(0, Math.min(YEARS.length - 1, k))];
    return h;
  }
  if (px < L.px0 || px > L.px1) return h;
  const day = Math.max(0, Math.min(N - 1, Math.floor((px - L.px0) / (L.px1 - L.px0) * N)));
  if (py >= L.l0 - 6 && py <= L.l1 + 6) {
    h.zone = 'lines'; h.day = day;
    let best = null, bd = 14;
    YEARS.forEach(y => { const v = M.disp[y][day]; if (!ok(v)) return; const d = Math.abs(fy(L, v) - py); if (d < bd || (d === bd && y > best)) { bd = d; best = y; } });
    h.year = best;
  } else if (py >= L.g0 && py < L.g1) {

  const isAbs = absRef(), u = S.u === 'f' ? 'F' : 'C', tag = S.ref === 'abs' ? 'abs' : 'anom_' + (S.ref === '1850' ? '1850_1900' : '1991_2020');
  let rows;
  if (S.view === 'daily') {
    rows = [['date', ...YEARS.map(y => y + '_' + tag + '_' + u)].join(',')];
    for (let i = 0; i < N; i++) rows.push([slotLabel(i), ...YEARS.map(y => { const v = rawA(y, i); return ok(v) ? v.toFixed(3) : ''; })].join(','));
  } else {
    rows = [['year', 'mean_' + tag + '_' + u, 'days', 'complete', 'mean20_' + tag + '_' + u, 'enso_djf', 'oni_djf'].join(',')];
    YEARS.forEach(y => { const a = M.ann[y]; rows.push([y, ok(a.v) ? a.v.toFixed(3) : '', a.n, a.complete ? 1 : 0, ok(M.r20[y]) ? M.r20[y].toFixed(3) : '', D.years[y].enso, ok(D.years[y].oni_djf) ? D.years[y].oni_djf : ''].join(',')); });
  }
  download(new Blob([rows.join('\n') + '\n'], { type: 'text/csv' }), fileStem() + '.csv');
  flash($('csv-btn'), 'is-ok');
}
})();
