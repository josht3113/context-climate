<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Cycle Progression | ContextClimate</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
  /* Companion of sunspot-heatmap.html: both read sunspot-monthly.csv and
     solar-cycle-reference.json — keep their schemas in sync. */
  :root { --tool-accent: #F5A340; --cc-card-width: 330px; }
  [hidden] { display: none !important; }

  .cc-app { max-width: 1760px; margin: 0 auto; }
  .cc-scene-head, .lg-strip, .note-strip, .cc-scene-bar { flex-shrink: 0; }

  /* ── Top row ── */
  .cc-tab { font-size: 16px; color: var(--color-text-secondary); padding: 7px 16px; }
  .exp { display: flex; gap: 6px; }
  .exp .cc-btn { padding: 8px 12px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  .cc-btn.is-error { border-color: #C05050; color: #E07070; }
  .cc-btn.is-ok { border-color: #3A9E50; color: #5CC070; }

  /* ── Scene head ── */
  .cc-scene-head { gap: 6px 22px; padding: 8px 14px 7px; align-items: flex-end; }
  .hd-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .hm-heading { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; color: var(--color-text-primary); white-space: nowrap; }
  .hm-period { font-family: var(--font-mono); font-size: 14px; color: var(--color-text-secondary); white-space: nowrap; }
  .ro-row { display: flex; align-items: flex-end; gap: 4px 22px; flex-wrap: wrap; margin-left: auto; }
  .ro { display: flex; flex-direction: column; min-width: 0; }
  .ro-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); white-space: nowrap; }
  .ro-v { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.1; color: var(--color-text-primary); white-space: nowrap; }
  .ro-v small { font-size: 16px; color: var(--color-text-secondary); font-weight: 400; margin-left: 3px; }
  .ro-n { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); white-space: nowrap; }

  /* ── Legend + note ── */
  .lg-strip { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; padding: 6px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-height: 32px; }
  .lg-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .sw-line { width: 22px; height: 0; border-top: 2px solid; flex-shrink: 0; }
  .sw-line.thin { border-top-width: 1px; }
  .sw-line.thick { border-top-width: 3px; }
  .sw-line.dash { border-top-style: dashed; }
  .sw-line.dot { border-top-style: dotted; }
  .sw-band { width: 22px; height: 12px; flex-shrink: 0; }
  .sw-grad { width: 120px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .sw-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .sw-ring { width: 9px; height: 9px; border-radius: 50%; border: 1.6px solid; flex-shrink: 0; }
  .note-strip { padding: 5px 14px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 13px; color: #D9A441; line-height: 1.5; }

  /* ── Stage ── */
  .cc-scene-stage { overflow: hidden; }
  #cv, #ov { position: absolute; left: 0; top: 0; display: block; }
  #ov { cursor: crosshair; outline: none; touch-action: pan-y; }
  .state-overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px;
    background: #262B27; color: var(--color-text-secondary); font-family: var(--font-mono); font-size: 14px; text-align: center; }
  .state-overlay .err { color: #E07070; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--color-border); border-top-color: var(--tool-accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Control bar ── */
  .cc-scene-bar { flex-wrap: wrap; gap: 8px 10px; min-height: 0; padding: 7px 12px; }
  .grp { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .grp-l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); margin-right: 3px; white-space: nowrap; }
  .grp .cc-btn { font-size: 14px; padding: 6px 11px; color: var(--color-text-secondary); }
  .grp .cc-btn.is-active { color: #F2EEE3; }
  .grp .cc-btn:disabled { opacity: .35; cursor: not-allowed; }
  .grp .cc-select { font-size: 14px; font-weight: 600; padding: 6px 8px; }

  /* ── Rail card ── */
  .cc-card { gap: 0; padding: 10px 14px; overflow-x: hidden; }
  .rd-head { display: flex; align-items: baseline; gap: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); flex-shrink: 0; }
  .rd-date { font-family: var(--font-display); font-weight: 700; font-size: 24px; color: var(--color-text-primary); line-height: 1.1; }
  .rd-tag { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; }
  table.rd-t { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 14px; margin: 4px 0 2px; flex-shrink: 0; }
  .rd-t td { padding: 3px 0; color: var(--color-text-primary); text-align: right; white-space: nowrap; border-top: 1px solid rgba(232,228,217,.06); }
  .rd-t tr:first-child td { border-top: none; }
  .rd-t td:first-child { text-align: left; color: var(--color-text-secondary); font-size: 13px; padding-right: 8px; }
  .rd-t td b { font-family: var(--font-display); font-size: 18px; }
  .rd-t .sub { display: block; color: var(--color-text-muted); font-size: 12px; line-height: 1.25; }
  .rd-t td:last-child { white-space: normal; }
  .rd-t i.k { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .now-head { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-bottom: 5px; border-bottom: 1px solid var(--color-border); font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--tool-accent); font-weight: 700; flex-shrink: 0; }
  .sp-wrap { position: relative; height: 92px; margin-top: 6px; flex-shrink: 0; }
  #sp { position: absolute; left: 0; top: 0; display: block; }
  .sp-cap { font-family: var(--font-mono); font-size: 12px; color: var(--color-text-secondary); padding-top: 3px; display: flex; justify-content: space-between; flex-shrink: 0; }
  .cc-card-src { padding-top: 8px; flex-shrink: 0; }

  /* ── Narrower windows ── */
  @media (max-width: 1500px) {
    .cc-app-title { display: none; }
    .ro-row { gap: 4px 16px; }
    .grp .cc-btn { padding: 6px 8px; }
  }
  @media (max-width: 1400px) { :root { --cc-card-width: 300px; } .ro-row { gap: 4px 14px; } .ro-l { letter-spacing: .03em; } .cc-tab { padding: 7px 11px; } }
  @media (max-width: 1280px) {
    .grp .cc-btn { padding: 6px 7px; font-size: 13px; }
    .exp .cc-btn { padding: 8px 8px; font-size: 13px; }
    .ro-v { font-size: 24px; }
    .ro-n { display: none; }
  }
  @media (max-height: 700px) and (min-width: 761px) {
    .cc-app { padding-top: 6px; padding-bottom: 8px; gap: 6px; }
    .cc-app-top { min-height: 0; }
    .exp .cc-btn, .cc-tab { padding-top: 5px; padding-bottom: 5px; }
    .cc-scene-head { padding-top: 4px; padding-bottom: 4px; }
    .ro-n { display: none; }
    .lg-strip { padding-top: 3px; padding-bottom: 3px; min-height: 0; }
    .cc-scene-bar { padding-top: 4px; padding-bottom: 4px; }
    .grp .cc-btn, .grp .cc-select { padding-top: 4px; padding-bottom: 4px; }
    .sp-wrap { height: 70px; }
  }
  @media (max-width: 760px) {
    .cc-app-title { display: block; width: 100%; font-size: 20px; }
    .cc-app-spacer { display: none; }
    .cc-tab-bar { order: 2; width: 100%; } .cc-tab { flex: 1; padding: 8px 4px; font-size: 14px; }
    .exp { order: 3; }
    .hm-heading { white-space: normal; font-size: 19px; }
    .hm-period { white-space: normal; }
    .lg-item { white-space: normal; }
    .ro-row { margin-left: 0; }
    .cc-scene-head { display: contents; }
    .hd-id { order: 0; padding: 8px 14px; border-bottom: 1px solid var(--color-border); }
    .cc-scene-stage { order: 1; }
    .lg-strip { order: 2; border-top: 1px solid var(--color-border); }
    .ro-row { order: 3; padding: 8px 14px; border-bottom: 1px solid var(--color-border); gap: 8px 20px; }
    .note-strip { order: 4; }
    .cc-scene-bar { order: 5; }
  }
</style>

<body class="cc-app-body">
<div class="cc-app">

    <div class="cc-tab-bar" id="tabs" role="tablist">

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ════════════════════════════════════════════════════════════════════
   Constants
   ════════════════════════════════════════════════════════════════════ */
const ACC = '#F5A340';
const C_TXT = '#E8E4D9', C_SEC = '#A6A499', C_MUT = '#948F82';
const C_GRID = 'rgba(232,228,217,0.08)', C_AXIS = 'rgba(232,228,217,0.22)';
const C_MEAN = 'rgba(232,228,217,0.40)';
const C_BLUE = '#6D96D8', C_PURPLE = '#A08CC6', C_LIGHT = '#E8E4D9';
const FONT_MONO = "'Courier Prime', monospace", FONT_DISP = "'Zilla Slab', serif", FONT_BODY = "'Public Sans', sans-serif";
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Analog projection settings (validated by hindcast on Cycles 2–24; see project notes)
const PROJ = { K: 7, L: 36, W: 0.25, SHIFT: 12, HOR: 180 };

// Named prolonged minima — intervals from Hayakawa et al. 2021 (SWSC 11, 1), Table 1
const GRAND_MINIMA = [
  { n: 'Oort',    a: 1010, b: 1050 },
  { n: 'Wolf',    a: 1280, b: 1350 },
  { n: 'Spörer',  a: 1390, b: 1550 },
  { n: 'Maunder', a: 1645, b: 1715 },
  { n: 'Dalton',  a: 1797, b: 1827 },
];

// Sunspot-number colour ramp (stripes, deep history)
const SN_RAMP = [[0,'#0E1220'],[15,'#211D38'],[40,'#4A2738'],[75,'#8A3A2C'],[110,'#C25F25'],[145,'#E88A2C'],[180,'#F5A340'],[220,'#FAD283'],[280,'#FFF3D6']];

/* ════════════════════════════════════════════════════════════════════
   Small helpers
   ════════════════════════════════════════════════════════════════════ */
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const RAMP_RGB = SN_RAMP.map(([v, c]) => [v, hex2rgb(c)]);
function rampColor(v) {
  if (!(v > 0)) v = 0;
  for (let i = 1; i < RAMP_RGB.length; i++) {
    const [v1, c1] = RAMP_RGB[i];
    if (v <= v1) {
      const [v0, c0] = RAMP_RGB[i - 1], t = (v - v0) / (v1 - v0);
      return `rgb(${c0.map((x, j) => Math.round(x + (c1[j] - x) * t)).join(',')})`;
    }
  }
  return `rgb(${RAMP_RGB[RAMP_RGB.length - 1][1].join(',')})`;
}
const fmt1 = v => (v == null || !isFinite(v)) ? '—' : v.toFixed(1);
const fmt0 = v => (v == null || !isFinite(v)) ? '—' : Math.round(v).toLocaleString('en-US');
const ymLabel = (y, m) => `${MON[m - 1]} ${y}`;
function ageLabel(mo) {
  const s = mo < 0 ? '−' : ''; mo = Math.abs(Math.round(mo));
  const y = Math.floor(mo / 12), m = mo % 12;
  return `${s}${y}y ${m}m`;
}
const yearLabel = y => y <= 0 ? `${1 - y} BC` : String(y);
function quantile(sorted, p) {           // type-7
  if (!sorted.length) return NaN;
  const h = (sorted.length - 1) * p, lo = Math.floor(h), hi = Math.ceil(h);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (h - lo);
}
function median(a) { const s = a.slice().sort((x, y) => x - y); return quantile(s, 0.5); }
function niceStep(range, target) {
  const raw = range / Math.max(1, target), p = Math.pow(10, Math.floor(Math.log10(raw)));
  for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p;
  return 10 * p;
}
function dayOfYear(d) { return Math.round((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - Date.UTC(d.getUTCFullYear(), 0, 1)) / 864e5) + 1; }
const isoDate = s => new Date(s + 'T00:00:00Z');
function addDays(d, n) { return new Date(d.getTime() + n * 864e5); }
const dLabel = d => `${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;

/* ════════════════════════════════════════════════════════════════════
   Data
   ════════════════════════════════════════════════════════════════════ */
const M = { n: 0, y: [], m: [], X: [], S: [], prov: [], ym0: 0 };   // monthly record
let CYC = [];          // cycles with startI / maxI / endI
let CUR = null;        // ongoing cycle
let P = null;          // analog projection
let DAILY = null, DEEP = null;
let SPOT = null;       // derived spotless-day structures
let DP = null;         // derived deep-history structures

const mIdx = (y, m) => y * 12 + (m - 1) - M.ym0;
const mYM = i => { const t = M.ym0 + i; return [Math.floor(t / 12), (t % 12) + 1]; };

function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const p = lines[i].split(',');
    if (p.length < 7) continue;
    rows.push({ y: +p[0], m: +p[1], mean: p[3].trim() === '' ? NaN : +p[3], mdef: +p[4] === 1,
                sm: p[5].trim() === '' ? NaN : +p[5] });
  }
  rows.sort((a, b) => (a.y - b.y) || (a.m - b.m));
  M.ym0 = rows[0].y * 12 + rows[0].m - 1;
  for (const r of rows) {
    const i = r.y * 12 + r.m - 1 - M.ym0;
    M.y[i] = r.y; M.m[i] = r.m;
    M.X[i] = r.mean < 0 ? NaN : r.mean; M.S[i] = r.sm < 0 ? NaN : r.sm; M.prov[i] = !r.mdef;
  }
  M.n = M.y.length;
  for (let i = 0; i < M.n; i++) if (M.y[i] === undefined) { const [y, m] = mYM(i); M.y[i] = y; M.m[i] = m; M.X[i] = NaN; M.S[i] = NaN; M.prov[i] = true; }
  M.lastX = M.n - 1; while (M.lastX > 0 && !isFinite(M.X[M.lastX])) M.lastX--;
  M.lastS = M.n - 1; while (M.lastS > 0 && !isFinite(M.S[M.lastS])) M.lastS--;
  M.firstProv = M.prov.findIndex(p => p); if (M.firstProv < 0) M.firstProv = M.n;
}

function buildCycles(ref) {
  CYC = ref.map(c => ({ cycle: c.cycle, startI: mIdx(c.startYear, c.startMonth), maxI: mIdx(c.maxYear, c.maxMonth),
                        minSSN: c.minSSN, ongoing: !!c.ongoing }));
  // A new minimum is declared once the smoothed series has turned up clearly after
  // the ongoing cycle's decline (≥ 8 years in, rising ≥ 6 months, ≥ 5 above the low).
  let last = CYC[CYC.length - 1];
  if (M.lastS - last.startI > 96) {
    let lo = -1, lov = Infinity;
    for (let i = last.startI + 96; i <= M.lastS; i++) if (M.S[i] < lov) { lov = M.S[i]; lo = i; }
    if (lo > 0 && M.lastS - lo >= 6 && M.S[M.lastS] - lov >= 5) {
      CYC.push({ cycle: last.cycle + 1, startI: lo, maxI: lo, minSSN: lov, ongoing: true, provisional: true });
      last.ongoing = false;
    }
  }
  CYC.forEach((c, k) => {
    c.endI = k + 1 < CYC.length ? CYC[k + 1].startI : null;
    const hi = c.endI == null ? M.lastS : c.endI;
    let mi = c.startI, mv = -1;
    for (let i = c.startI; i <= hi; i++) if (M.S[i] > mv) { mv = M.S[i]; mi = i; }
    if (c.ongoing || c.provisional) c.maxI = mi;
    c.maxS = M.S[c.maxI];
  });
  CUR = CYC[CYC.length - 1];
}
const cycleAt = i => { let c = null; for (const q of CYC) { if (q.startI <= i) c = q; else break; } return c; };

/* ── Analog projection ─────────────────────────────────────────────────
   The ongoing cycle's last 36 months of 13-month smoothed SN (plus the
   monthly means since, at ¼ weight) are matched against every complete
   earlier cycle, each scaled by least squares and shifted ±12 months.
   The 7 best cycles carry the projection; the provisional smoothed values
   for the last 6 months are the 13-month filter run over observed months
   with each analog filling the months not yet observed. */
function taper(x, t) {
  if (t - 6 < 0 || t + 6 >= x.length) return NaN;
  let s = 0.5 * x[t - 6] + 0.5 * x[t + 6];
  if (!isFinite(s)) return NaN;
  for (let j = t - 5; j <= t + 5; j++) { if (!isFinite(x[j])) return NaN; s += x[j]; }
  return s / 12;
}
function project(cur, opt = PROJ) {
  const s0 = cur.startI, age = M.lastS - s0, nobs = M.lastX - M.lastS;
  if (age < opt.L + 1) return null;
  const tS = [], tX = [];
  for (let t = Math.max(0, age - opt.L); t <= age; t++) tS.push(t);
  for (let t = age + 1; t <= age + nobs; t++) tX.push(t);
  const yS = tS.map(t => M.S[s0 + t]), yX = tX.map(t => M.X[s0 + t]);
  const best = new Map();
  for (const k of CYC) {
    if (k.cycle >= cur.cycle || k.endI == null) continue;
    const sk = k.startI;
    for (let tau = -opt.SHIFT; tau <= opt.SHIFT; tau++) {
      if (sk + tS[0] + tau < 0 || sk + age + tau + opt.HOR >= M.n) continue;
      const aS = tS.map(t => M.S[sk + t + tau]), aX = tX.map(t => M.S[sk + t + tau]);
      if (aS.some(v => !isFinite(v)) || aX.some(v => !isFinite(v))) continue;
      let num = 0, den = 0;
      for (let j = 0; j < aS.length; j++) { num += yS[j] * aS[j]; den += aS[j] * aS[j]; }
      for (let j = 0; j < aX.length; j++) { num += opt.W * yX[j] * aX[j]; den += opt.W * aX[j] * aX[j]; }
      const a = num / den;
      let err = 0;
      for (let j = 0; j < aS.length; j++) err += (yS[j] - a * aS[j]) ** 2;
      for (let j = 0; j < aX.length; j++) err += opt.W * (yX[j] - a * aX[j]) ** 2;
      const rmse = Math.sqrt(err / (aS.length + opt.W * aX.length));
      const b = best.get(k.cycle);
      if (!b || rmse < b.rmse) best.set(k.cycle, { k, tau, a, rmse });
    }
  }
  const sel = [...best.values()].sort((p, q) => p.rmse - q.rmse).slice(0, opt.K);
  if (sel.length < 3) return null;
  const N = age + opt.HOR;
  for (const o of sel) {
    const P_ = new Float64Array(N);
    for (let t = 0; t < N; t++) P_[t] = o.a * M.S[o.k.startI + t + o.tau];
    const off = M.S[s0 + age] - P_[age];
    for (let t = 0; t < N; t++) P_[t] += off * Math.exp(-Math.max(0, t - age) / 12);
    const hyb = new Float64Array(N);
    for (let t = 0; t < N; t++) hyb[t] = t <= age + nobs ? M.X[s0 + t] : P_[t];
    o.sm = new Float64Array(N);
    for (let t = 0; t < N; t++) {
      let v = t <= age ? M.S[s0 + t] : taper(hyb, t);
      o.sm[t] = isFinite(v) ? v : P_[t];
    }
    o.minT = o.k.endI - o.k.startI - o.tau;          // this analog's next minimum, in the ongoing cycle's months
    o.minV = o.sm[o.minT];
  }
  // past its own next minimum, an analog holds its minimum value (the next cycle's rise is not projected)
  const mins = sel.map(o => o.minT).sort((p, q) => p - q);
  const end = Math.min(N - 1, mins[mins.length - 1]);
  const med = new Float64Array(N).fill(NaN), lo = new Float64Array(N).fill(NaN), hi = new Float64Array(N).fill(NaN);
  for (let t = 0; t <= end; t++) {
    const v = sel.map(o => o.sm[Math.min(t, o.minT)]).sort((p, q) => p - q);
    med[t] = quantile(v, 0.5); lo[t] = v[0]; hi[t] = v[v.length - 1];
  }
  return { s0, age, nobs, sel, med, lo, hi, N, end,
           minMed: Math.round(quantile(mins, 0.5)), minLo: mins[0], minHi: mins[mins.length - 1] };
}

/* ── Spotless days ─────────────────────────────────────────────────── */
function buildSpotless() {
  if (!DAILY) return null;
  const [y0, m0] = DAILY.monthly.start.split('-').map(Number);
  const ym0 = y0 * 12 + m0 - 1;
  const days = DAILY.monthly.days.slice(), spot = DAILY.monthly.spotless.slice();
  const last = isoDate(DAILY.lastDay);
  // recent daily values, then EISN days past the end of the daily file
  const rec = []; let d = isoDate(DAILY.recent.start);
  DAILY.recent.sn.forEach((v, j) => { rec.push({ d, v, prov: j >= DAILY.recent.firstProvisional, est: false }); d = addDays(d, 1); });
  let lastAll = last;
  if (DAILY.eisn) {
    let e = isoDate(DAILY.eisn.start);
    DAILY.eisn.sn.forEach(v => {
      rec.push({ d: e, v, prov: true, est: true });
      const k = e.getUTCFullYear() * 12 + e.getUTCMonth() - ym0;
      while (days.length <= k) { days.push(0); spot.push(0); }
      days[k]++; if (v === 0) spot[k]++;
      lastAll = e; e = addDays(e, 1);
    });
  }
  const mDays = days.length;
  // years
  const years = [];
  for (let k = 0; k < mDays; k++) {
    const y = Math.floor((ym0 + k) / 12);
    let Y = years[years.length - 1];
    if (!Y || Y.y !== y) { Y = { y, obs: 0, spot: 0 }; years.push(Y); }
    Y.obs += days[k]; Y.spot += spot[k];
  }
  for (const Y of years) {
    const full = (Y.y % 4 === 0 && (Y.y % 100 !== 0 || Y.y % 400 === 0)) ? 366 : 365;
    Y.len = Y.y === lastAll.getUTCFullYear() ? dayOfYear(lastAll) : full;
    Y.cov = Y.obs / Y.len; Y.partial = Y.y === lastAll.getUTCFullYear() && Y.len < full;
  }
  // cumulative spotless days from each cycle's maximum (good daily coverage from Cycle 9)
  const runs = [];
  for (const c of CYC) {
    const [cy, cm] = mYM(c.maxI), k0 = cy * 12 + cm - 1 - ym0;
    if (k0 < 0 || cy < 1848) continue;
    const endK = c.endI != null && CYC.find(q => q.startI === c.endI)
      ? (() => { const [ey, em] = mYM(c.endI); return ey * 12 + em - 1 - ym0 + 24; })() : mDays - 1;
    const cum = []; let s = 0;
    for (let k = k0; k <= Math.min(endK, mDays - 1); k++) { s += spot[k]; cum.push(s); }
    let minK = null;
    if (c.endI != null) { const [ey, em] = mYM(c.endI); minK = ey * 12 + em - 1 - ym0 - k0; }
    runs.push({ c, k0, cum, minK, current: c === CUR || (c.endI == null) });
  }
  let lastSpotless = null;
  for (let j = rec.length - 1; j >= 0; j--) if (rec[j].v === 0) { lastSpotless = rec[j].d; break; }
  if (!lastSpotless && DAILY.lastSpotless) lastSpotless = isoDate(DAILY.lastSpotless);
  return { ym0, days, spot, years, runs, rec, last, lastAll, lastSpotless };
}

/* ── Deep history ──────────────────────────────────────────────────── */
function buildDeep() {
  if (!DEEP) return null;
  const segs = {}; (DEEP.c14 || []).forEach(s => segs[s.id] = s);
  // Show the BC series only when the first-millennium-CE series closes the gap
  const c14 = ['bc', 'ce1', 'ce2'].map(id => segs[id]).filter(Boolean)
    .filter(s => s.id !== 'bc' || segs.ce1);
  if (!c14.length) return null;
  const val = (s, y) => (s && y >= s.start && y < s.start + s.v.length) ? s.v[y - s.start] : null;
  const c14At = y => { for (const s of c14) if (y >= s.start && y < s.start + s.sn.length) { const j = y - s.start; return { sn: s.sn[j], e: s.e[j], sm: s.sm[j], seg: s }; } return null; };
  const snY = DEEP.snYearly, bb = DEEP.gn && DEEP.gn.backbone, hs = DEEP.gn && DEEP.gn.hoyt;
  const y0 = c14[0].start, y1 = snY.start + snY.v.length - 1;
  // composite annual series for the stripes: observed SN (1700–), backbone group number (1610–1699), 14C before
  const comp = [];
  for (let y = y0; y <= y1; y++) {
    let v = val(snY, y), src = 'sn';
    if (v == null && y >= 1610) { v = val(bb, y); src = 'gn'; }
    if (v == null) { const c = c14At(y); v = c ? c.sn : null; src = c ? 'c14' : null; }
    comp.push({ y, v, src });
  }
  // 14C cycle lookup
  const cyc = [];
  for (const s of c14) (s.cycles || []).forEach((r, j) => cyc.push({ seg: s, n: j + 1, ymin: r[0], ymax: r[1], mean: r[2], e: r[3], T: r[4], q: r[5] }));
  cyc.sort((a, b) => a.ymin - b.ymin);
  // modern 22-yr mean of observed yearly SN vs the 14C 22-yr curve
  const lastY = y1, mod = []; for (let y = lastY - 21; y <= lastY; y++) mod.push(val(snY, y));
  const modern = mod.reduce((a, b) => a + b, 0) / mod.length;
  let lo = { v: Infinity }, hi = { v: -Infinity };
  for (const s of c14) s.sm.forEach((v, j) => { if (v < lo.v) lo = { v, y: s.start + j }; if (v > hi.v) hi = { v, y: s.start + j }; });
  let above = 0, tot = 0;
  for (const s of c14) s.sm.forEach(v => { tot++; if (v >= modern) above++; });
  const has3k = !!segs.ce1 && !!segs.bc;
  return { c14, snY, bb, hs, y0, y1, comp, cyc, modern, lo, hi, pctBelow: 1 - above / tot, has3k, val, c14At };
}

/* ════════════════════════════════════════════════════════════════════
   State
   ════════════════════════════════════════════════════════════════════ */
const S = {
  tab: 'record',
  range: 'cycle',            // record: full | 100y | 50y | cycle
  showProj: true,
  align: 'min',              // c25: min | max
  c25Show: { band: true, all: false, analogs: true, proj: true },
  pick: null,                // c25: highlighted cycle number
  spotMode: 'run',           // run | year
  deepRange: 'mill',         // mill | tele | all
  deepShow: { unc: true, gn: true, minima: true },
  hover: null,
};
const TABS = ['record', 'c25', 'spotless', 'deep'];

/* ════════════════════════════════════════════════════════════════════
   Canvas plumbing
   ════════════════════════════════════════════════════════════════════ */
let dpr = window.devicePixelRatio || 1;
let W = 0, H = 0, G = null;      // G = geometry of the last on-screen draw (for hover)
const cv = $('cv'), ov = $('ov');

function sizeStage() {
  const st = $('stage');
  W = st.offsetWidth; H = st.offsetHeight;
  for (const c of [cv, ov]) {
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    c.style.width = W + 'px'; c.style.height = H + 'px';
  }
}
function render() {
  if (!M.n || !W || !H) return;
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#262B27'; ctx.fillRect(0, 0, W, H);
  G = VIEWS[S.tab].draw(ctx, W, H, false);
  drawHover();
}
function drawHover() {
  const ctx = ov.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (G && S.hover && VIEWS[S.tab].hoverDraw) VIEWS[S.tab].hoverDraw(ctx, G, S.hover);
  updateCard();
}

function setFont(ctx, px, fam = FONT_MONO, weight = '') { ctx.font = `${weight}${weight ? ' ' : ''}${px}px ${fam}`; }
function frame(w, h, padL = 56, padR = 22, padT = 22, padB = 36) {
  return { x0: padL, x1: w - padR, y0: padT, y1: h - padB };
}
function yAxis(ctx, F, yMax, label, yMin = 0, ticks = 6) {
  const step = niceStep(yMax - yMin, ticks);
  const ys = v => F.y1 - (v - yMin) / (yMax - yMin) * (F.y1 - F.y0);
  setFont(ctx, 12); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let v = Math.ceil(yMin / step) * step; v <= yMax + 1e-9; v += step) {
    const y = ys(v);
    ctx.strokeStyle = v === 0 ? C_AXIS : C_GRID; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(F.x0, Math.round(y) + .5); ctx.lineTo(F.x1, Math.round(y) + .5); ctx.stroke();
    ctx.fillStyle = C_MUT; ctx.fillText(Math.round(v).toLocaleString('en-US'), F.x0 - 7, y);
  }
  if (label) {
    ctx.save(); ctx.translate(14, (F.y0 + F.y1) / 2); ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center'; ctx.fillStyle = C_SEC; setFont(ctx, 12); ctx.fillText(label, 0, 0); ctx.restore();
  }
  return ys;
}
function xTicksYears(ctx, F, xs, a, b, target = 10, fmt = yearLabel) {
  const span = b - a, cands = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500];
  let step = cands.find(s => span / s <= target) || 1000;
  setFont(ctx, 12); ctx.fillStyle = C_MUT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let v = Math.ceil(a / step) * step; v <= b; v += step) {
    const x = xs(v);
    ctx.strokeStyle = C_GRID; ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, F.y0); ctx.lineTo(Math.round(x) + .5, F.y1); ctx.stroke();
    ctx.fillText(fmt(v), x, F.y1 + 7);
  }
}
function polyline(ctx, pts) {
  let pen = false;
  ctx.beginPath();
  for (const p of pts) {
    if (!p || !isFinite(p[1])) { pen = false; continue; }
    if (!pen) { ctx.moveTo(p[0], p[1]); pen = true; } else ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}
function band(ctx, xsArr, loArr, hiArr) {
  ctx.beginPath();
  let started = false;
  for (let j = 0; j < xsArr.length; j++) { if (!isFinite(hiArr[j])) continue; if (!started) { ctx.moveTo(xsArr[j], hiArr[j]); started = true; } else ctx.lineTo(xsArr[j], hiArr[j]); }
  for (let j = xsArr.length - 1; j >= 0; j--) { if (!isFinite(loArr[j])) continue; ctx.lineTo(xsArr[j], loArr[j]); }
  ctx.closePath(); ctx.fill();
}
function clip(ctx, F) { ctx.save(); ctx.beginPath(); ctx.rect(F.x0, F.y0 - 2, F.x1 - F.x0, F.y1 - F.y0 + 4); ctx.clip(); }
function crossV(ctx, F, x) {
  ctx.strokeStyle = 'rgba(232,228,217,0.45)'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, F.y0); ctx.lineTo(Math.round(x) + .5, F.y1); ctx.stroke(); ctx.setLineDash([]);
}
function dot(ctx, x, y, r, fill, ring = '#262B27') {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
  if (ring) { ctx.lineWidth = 1.5; ctx.strokeStyle = ring; ctx.stroke(); }
}

/* ════════════════════════════════════════════════════════════════════
   VIEW: Record
   ════════════════════════════════════════════════════════════════════ */
function recordDomain() {
  const end = (S.showProj && P) ? Math.max(M.lastX, P.s0 + P.end) : M.lastX;
  let a;
  if (S.range === 'full') a = 0;
  else if (S.range === '100y') a = Math.max(0, M.lastX - 1200);
  else if (S.range === '50y') a = Math.max(0, M.lastX - 600);
  else a = Math.max(0, CUR.startI - 18);
  return { a, b: end + (S.range === 'cycle' ? 4 : 0) };
}
const VR = {
  title: () => 'The sunspot record',
  sub: () => `Monthly sunspot number, ${M.y[0]} – ${ymLabel(M.y[M.lastX], M.m[M.lastX])}`,
  draw(ctx, w, h, exp) {
    const F = frame(w, h, 58, 24, 30, 36);
    const { a, b } = recordDomain();
    const xs = i => F.x0 + (i - a) / Math.max(1, b - a) * (F.x1 - F.x0);
    let ymax = 0;
    for (let i = a; i <= Math.min(b, M.n - 1); i++) ymax = Math.max(ymax, M.X[i] || 0, M.S[i] || 0);
    if (S.showProj && P) for (let t = P.age; t <= P.end; t++) ymax = Math.max(ymax, P.hi[t]);
    ymax = Math.ceil(ymax * 1.06 / 20) * 20;
    const ys = yAxis(ctx, F, ymax, 'Sunspot number');
    const ya = M.y[0] * 12 + M.m[0] - 1 + a, yb = ya + (b - a);
    xTicksYears(ctx, F, v => xs((v * 12) - (M.y[0] * 12 + M.m[0] - 1)), Math.ceil(ya / 12), Math.floor(yb / 12), Math.max(4, Math.floor((F.x1 - F.x0) / 90)));
    clip(ctx, F);
    // cycle boundaries + labels
    setFont(ctx, 12, FONT_MONO, 'bold'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    const pxPerCycle = (F.x1 - F.x0) / Math.max(1, (b - a) / 132);
    for (const c of CYC) {
      if (c.startI >= a && c.startI <= b) {
        const x = xs(c.startI);
        ctx.strokeStyle = 'rgba(232,228,217,0.12)'; ctx.setLineDash([2, 4]);
        ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, F.y0); ctx.lineTo(Math.round(x) + .5, F.y1); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    ctx.restore();
    for (const c of CYC) {
      if (c.maxI < a || c.maxI > b) continue;
      if (pxPerCycle < 26 && c.cycle % 2 && c !== CUR) continue;
      const x = xs(c.maxI);
      ctx.fillStyle = c === CUR ? ACC : C_SEC; setFont(ctx, 12, FONT_MONO, 'bold'); ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(pxPerCycle < 60 ? String(c.cycle) : `SC${c.cycle}`, x, F.y0 - 6);
    }
    clip(ctx, F);
    // projection band
    if (S.showProj && P) {
      const T = []; for (let t = P.age; t <= P.end; t++) T.push(t);
      ctx.fillStyle = 'rgba(245,163,64,0.16)';
      band(ctx, T.map(t => xs(P.s0 + t)), T.map(t => ys(P.lo[t])), T.map(t => ys(P.hi[t])));
    }
    // monthly mean
    const lw = (b - a) > 1500 ? 0.8 : 1.1;
    ctx.lineWidth = lw; ctx.strokeStyle = C_MEAN;
    const defEnd = Math.min(M.firstProv, M.lastX);
    const pts = []; for (let i = a; i <= Math.min(defEnd, b); i++) pts.push([xs(i), ys(M.X[i])]);
    polyline(ctx, pts);
    if (M.firstProv <= M.lastX) {
      ctx.setLineDash([2, 3]); ctx.strokeStyle = 'rgba(232,228,217,0.6)';
      const pp = []; for (let i = Math.max(a, M.firstProv - 1); i <= M.lastX; i++) pp.push([xs(i), ys(M.X[i])]);
      polyline(ctx, pp); ctx.setLineDash([]);
      if (b - a < 700) for (let i = Math.max(a, M.firstProv); i <= M.lastX; i++) { ctx.beginPath(); ctx.arc(xs(i), ys(M.X[i]), 2.6, 0, 7); ctx.strokeStyle = 'rgba(232,228,217,0.75)'; ctx.lineWidth = 1.2; ctx.stroke(); }
    }
    // smoothed
    ctx.lineWidth = (b - a) > 1500 ? 1.8 : 2.4; ctx.strokeStyle = ACC; ctx.lineJoin = 'round';
    const sp = []; for (let i = a; i <= Math.min(b, M.n - 1); i++) sp.push([xs(i), ys(M.S[i])]);
    polyline(ctx, sp);
    // projection median
    if (S.showProj && P) {
      ctx.setLineDash([6, 4]); ctx.lineWidth = 2; ctx.strokeStyle = '#F8C27A';
      const mp = []; for (let t = P.age; t <= P.end; t++) mp.push([xs(P.s0 + t), ys(P.med[t])]);
      polyline(ctx, mp); ctx.setLineDash([]);
    }
    ctx.restore();
    // next-minimum bracket
    if (S.showProj && P) {
      const xa = xs(P.s0 + P.minLo), xb = xs(P.s0 + P.minHi), xm = xs(P.s0 + P.minMed), yb_ = F.y1 - 8;
      if (xb > F.x0 && xa < F.x1) {
        ctx.strokeStyle = '#F8C27A'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(xa, yb_ - 4); ctx.lineTo(xa, yb_); ctx.lineTo(xb, yb_); ctx.lineTo(xb, yb_ - 4); ctx.stroke();
        dot(ctx, xm, yb_, 3.5, '#F8C27A');
        setFont(ctx, 12); ctx.fillStyle = '#F8C27A'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        if (xb - xa > 40 || S.range === 'cycle' || S.range === '50y') ctx.fillText('next minimum', (xa + xb) / 2, yb_ - 6);
      }
    }
    // latest point
    dot(ctx, xs(M.lastX), ys(M.X[M.lastX]), 4, C_LIGHT);
    return { F, xs, ys, a, b };
  },
  hit(Gm, x) {
    const { F, a, b } = Gm;
    if (x < F.x0 - 10 || x > F.x1 + 10) return null;
    let i = Math.round(a + (x - F.x0) / (F.x1 - F.x0) * (b - a));
    const end = (S.showProj && P) ? Math.max(M.lastX, P.s0 + P.end) : M.lastX;

  },
  hoverDraw(ctx, Gm, h) {

    if (h.i < M.n && isFinite(M.X[h.i])) dot(ctx, x, ys(M.X[h.i]), 3.5, C_LIGHT);
    if (h.i < M.n && isFinite(M.S[h.i])) dot(ctx, x, ys(M.S[h.i]), 4.5, ACC);
    else if (P && S.showProj && h.i - P.s0 > P.age && h.i - P.s0 <= P.end) dot(ctx, x, ys(P.med[h.i - P.s0]), 4.5, '#F8C27A');
  },
  card(h) {
    const i = h ? h.i : M.lastX;
    const [y, m] = mYM(i);
    const rows = [];
    let tag = '';
    if (i <= M.lastX) {
      rows.push(['Monthly mean', `<b>${fmt1(M.X[i])}</b>${M.prov[i] ? '<span class="sub">provisional</span>' : ''}`]);
    }
    if (i < M.n && isFinite(M.S[i])) rows.push(['13-mo smoothed', `<b>${fmt1(M.S[i])}</b>`]);
    else if (P && i - P.s0 > P.age && i - P.s0 <= P.end) {
      const t = i - P.s0;
      rows.push([i <= M.lastX ? 'Smoothed (provisional)' : 'Smoothed (projected)', `<b>${fmt1(P.med[t])}</b><span class="sub">${fmt0(P.lo[t])}–${fmt0(P.hi[t])}</span>`]);
      tag = i <= M.lastX ? 'Provisional' : 'Projected';
    }
    const c = cycleAt(Math.min(i, M.n - 1));
    if (c) {
      rows.push(['Cycle', `<b>${c.cycle}</b><span class="sub">${ageLabel(i - c.startI)} since min</span>`]);
      if (i >= c.maxI && c.maxI <= M.lastS) rows.push(['From cycle peak', `${ageLabel(i - c.maxI)}<span class="sub">peak ${fmt1(c.maxS)}</span>`]);
    }
    if (!h) tag = M.prov[i] ? 'Latest · provisional' : 'Latest';
    return { date: ymLabel(y, m), tag, rows };
  },
  head() {
    const latest = M.X[M.lastX];
    const r = [];
    r.push({ l: 'Latest month', v: fmt1(latest), n: ymLabel(M.y[M.lastX], M.m[M.lastX]) + (M.prov[M.lastX] ? ' · prov.' : '') });
    r.push({ l: '13-mo smoothed', v: fmt1(M.S[M.lastS]), n: 'as of ' + ymLabel(M.y[M.lastS], M.m[M.lastS]) });
    if (P) r.push({ l: 'Smoothed now', v: fmt1(P.med[M.lastX - P.s0]), n: `projected · ${fmt0(P.lo[M.lastX - P.s0])}–${fmt0(P.hi[M.lastX - P.s0])}` });
    r.push({ l: `Cycle ${CUR.cycle} peak`, v: fmt1(CUR.maxS), n: ymLabel(...mYM(CUR.maxI)) });
    return r;
  },
  legend() {
    const L = [
      `<span class="lg-item"><span class="sw-line thin" style="border-color:${C_MEAN}"></span>Monthly mean</span>`,
      `<span class="lg-item"><span class="sw-line dot" style="border-color:rgba(232,228,217,.7)"></span>Provisional</span>`,
      `<span class="lg-item"><span class="sw-line thick" style="border-color:${ACC}"></span>13-month smoothed</span>`];
    if (S.showProj && P) L.push(`<span class="lg-item"><span class="sw-line dash" style="border-color:#F8C27A"></span><span class="sw-band" style="background:rgba(245,163,64,.22)"></span>Analog projection (${P.sel.length} cycles)</span>`);
    return L.join('');
  },
  bar() {
    return `<div class="grp"><span class="grp-l">Range</span>${[['cycle', 'Cycle ' + CUR.cycle], ['50y', '50 yrs'], ['100y', '100 yrs'], ['full', `${M.y[0]}–now`]]
      .map(([k, l]) => `<button class="cc-btn${S.range === k ? ' is-active' : ''}" data-range="${k}">${l}</button>`).join('')}</div>
      <div class="cc-scene-bar-sep"></div>
      <div class="grp"><span class="grp-l">Show</span><button class="cc-btn${S.showProj ? ' is-active' : ''}" data-proj="1"${P ? '' : ' disabled'}>Projection</button></div>`;
  },
  csv() {
    const L = ['year,month,monthly_mean,monthly_provisional,smoothed_13mo,projected_smoothed_median,projected_low,projected_high'];
    const end = P ? Math.max(M.lastX, P.s0 + P.end) : M.lastX;
    for (let i = 0; i <= end; i++) {
      const [y, m] = mYM(i), t = P ? i - P.s0 : -1;
      const pj = P && t > P.age && t <= P.end;
      L.push([y, m, i <= M.lastX && isFinite(M.X[i]) ? M.X[i] : '', i <= M.lastX ? (M.prov[i] ? 1 : 0) : '',
              i < M.n && isFinite(M.S[i]) ? M.S[i] : '', pj ? P.med[t].toFixed(1) : '', pj ? P.lo[t].toFixed(1) : '', pj ? P.hi[t].toFixed(1) : ''].join(','));
    }
    return L.join('\n');
  },
};

/* ════════════════════════════════════════════════════════════════════

   ════════════════════════════════════════════════════════════════════ */
function cycleSeries(c) {           // smoothed by months since minimum, until the next minimum
  const end = c.endI != null ? c.endI : M.lastS;
  const out = []; for (let i = c.startI; i <= end; i++) out.push(M.S[i]);
  return out;
}
let C25 = null;
function buildC25() {
  const past = CYC.filter(c => c !== CUR && c.endI != null);
  const ser = new Map(past.map(c => [c.cycle, cycleSeries(c)]));
  const maxLen = Math.max(...[...ser.values()].map(s => s.length));
  const pct = [];
  for (let t = 0; t < maxLen; t++) {
    const v = []; for (const s of ser.values()) if (t < s.length && isFinite(s[t])) v.push(s[t]);
    v.sort((a, b) => a - b);
    pct.push(v.length >= 8 ? { n: v.length, p10: quantile(v, .1), p25: quantile(v, .25), p50: quantile(v, .5), p75: quantile(v, .75), p90: quantile(v, .9), v } : null);
  }
  const cur = cycleSeries(CUR);
  // rank at the current age (1 = highest), among cycles that reached this age
  const age = M.lastS - CUR.startI;
  const atAge = past.filter(c => ser.get(c.cycle).length > age).map(c => ({ c: c.cycle, v: ser.get(c.cycle)[age] }));
  const rank = 1 + atAge.filter(o => o.v > cur[age]).length;
  const peakRank = 1 + past.filter(c => c.maxS > CUR.maxS).length;
  const rise = CUR.maxI - CUR.startI;
  const riseRank = 1 + past.filter(c => (c.maxI - c.startI) < rise).length;     // 1 = fastest rise
  C25 = { past, ser, pct, cur, age, rank, nAtAge: atAge.length + 1, peakRank, rise, riseRank };
}
const VC = {
  title: () => `Cycle ${CUR.cycle} against Cycles 1–${CUR.cycle - 1}`,
  sub: () => S.align === 'min' ? '13-month smoothed sunspot number by time since each cycle’s minimum' : '13-month smoothed sunspot number by time from each cycle’s peak',
  off(c) { return S.align === 'min' ? 0 : (c.maxI - c.startI); },
  draw(ctx, w, h, exp) {
    const F = frame(w, h, 58, 24, 18, 36);
    const tA = S.align === 'min' ? 0 : -84, tB = S.align === 'min' ? 168 : 108;
    const xs = t => F.x0 + (t - tA) / (tB - tA) * (F.x1 - F.x0);
    let ymax = 0;
    for (const c of C25.past) ymax = Math.max(ymax, c.maxS);
    ymax = Math.ceil(ymax * 1.05 / 20) * 20;
    const ys = yAxis(ctx, F, ymax, 'Smoothed sunspot number');
    // x ticks in years
    setFont(ctx, 12); ctx.fillStyle = C_MUT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const ystep = Math.max(1, Math.ceil(44 / ((F.x1 - F.x0) / ((tB - tA) / 12))));
    for (let yv = Math.ceil(tA / 12); yv <= tB / 12; yv++) {
      if (yv % ystep) continue;
      const x = xs(yv * 12);
      ctx.strokeStyle = yv === 0 ? C_AXIS : C_GRID; ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, F.y0); ctx.lineTo(Math.round(x) + .5, F.y1); ctx.stroke();
      ctx.fillText(yv === 0 ? (S.align === 'min' ? 'min' : 'peak') : (yv > 0 ? `+${yv}y` : `${yv}y`), x, F.y1 + 7);
    }
    clip(ctx, F);
    const off = c => this.off(c);
    // percentile bands (only meaningful when aligned at the minimum)
    if (S.c25Show.band && S.align === 'min') {
      const T = C25.pct.map((p, t) => t).filter(t => C25.pct[t]);
      ctx.fillStyle = 'rgba(232,228,217,0.07)';
      band(ctx, T.map(xs), T.map(t => ys(C25.pct[t].p10)), T.map(t => ys(C25.pct[t].p90)));
      ctx.fillStyle = 'rgba(232,228,217,0.09)';
      band(ctx, T.map(xs), T.map(t => ys(C25.pct[t].p25)), T.map(t => ys(C25.pct[t].p75)));
      ctx.strokeStyle = 'rgba(232,228,217,0.45)'; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]);
      polyline(ctx, T.map(t => [xs(t), ys(C25.pct[t].p50)])); ctx.setLineDash([]);
    }
    // all past cycles
    if (S.c25Show.all || S.align === 'max') {
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(232,228,217,0.16)';
      for (const c of C25.past) polyline(ctx, C25.ser.get(c.cycle).map((v, t) => [xs(t - off(c)), ys(v)]));
    }
    // analogs, as they map onto the current cycle (scaled + shifted)
    if (S.c25Show.analogs && P && S.align === 'min') {
      ctx.lineWidth = 1.3; ctx.strokeStyle = 'rgba(109,150,216,0.75)';
      for (const o of P.sel) {
        const pts = []; for (let t = Math.max(0, -o.tau); t <= o.minT; t++) pts.push([xs(t), ys(o.a * M.S[o.k.startI + t + o.tau])]);
        polyline(ctx, pts);

    }
    // picked cycle
    if (S.pick) {

    // projection
    if (S.c25Show.proj && P) {

      ctx.fillStyle = 'rgba(245,163,64,0.16)';
      band(ctx, T.map(t => xs(t - o0)), T.map(t => ys(P.lo[t])), T.map(t => ys(P.hi[t])));
      ctx.setLineDash([6, 4]); ctx.lineWidth = 2; ctx.strokeStyle = '#F8C27A';

    }
    // current cycle: monthly means faint, smoothed bold

    const mm = []; for (let i = CUR.startI; i <= M.lastX; i++) mm.push([xs(i - CUR.startI - o0), ys(M.X[i])]);
    polyline(ctx, mm);
    ctx.lineWidth = 3; ctx.strokeStyle = ACC; ctx.lineJoin = 'round';
    polyline(ctx, C25.cur.map((v, t) => [xs(t - o0), ys(v)]));
    ctx.restore();
    const ta = M.lastS - CUR.startI;
    dot(ctx, xs(ta - o0), ys(M.S[M.lastS]), 4.5, ACC);
    setFont(ctx, 13, FONT_MONO, 'bold'); ctx.fillStyle = ACC; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    const lx = xs(CUR.maxI - CUR.startI - o0);
    ctx.fillText(`Cycle ${CUR.cycle}`, Math.min(lx + 8, F.x1 - 80), ys(CUR.maxS) - 6);
    if (S.pick) {
      const c = CYC.find(q => q.cycle === S.pick);
      if (c && c !== CUR) { ctx.fillStyle = C_PURPLE; ctx.textAlign = 'left'; ctx.fillText(`Cycle ${c.cycle}`, Math.min(xs(c.maxI - c.startI - off(c)) + 8, F.x1 - 80), ys(c.maxS) - 6); }
    }
    return { F, xs, ys, tA, tB, o0 };
  },
  hit(Gm, x) {
    const { F, tA, tB } = Gm;

    const t = Math.round(tA + (x - F.x0) / (F.x1 - F.x0) * (tB - tA));

  hoverDraw(ctx, Gm, h) {

    if (t >= 0 && t < C25.cur.length && isFinite(C25.cur[t])) dot(ctx, xs(h.t), ys(C25.cur[t]), 4.5, ACC);
    else if (P && S.c25Show.proj && t > P.age && t <= P.end) dot(ctx, xs(h.t), ys(P.med[t]), 4.5, '#F8C27A');
    if (S.pick) {
      const c = CYC.find(q => q.cycle === S.pick), s = c && cycleSeries(c), tc = h.t + this.off(c);
      if (s && tc >= 0 && tc < s.length && isFinite(s[tc])) dot(ctx, xs(h.t), ys(s[tc]), 4, C_PURPLE);

  },
  card(h) {

    const rows = [];
    let tag = '';
    const vCur = t >= 0 && t < C25.cur.length ? C25.cur[t] : NaN;
    if (isFinite(vCur)) rows.push([`<i class="k" style="background:${ACC}"></i>Cycle ${CUR.cycle}`, `<b>${fmt1(vCur)}</b><span class="sub">${ymLabel(...mYM(CUR.startI + t))}</span>`]);
    else if (P && t > P.age && t <= P.end) { rows.push([`<i class="k" style="background:#F8C27A"></i>Cycle ${CUR.cycle}`, `<b>${fmt1(P.med[t])}</b><span class="sub">${fmt0(P.lo[t])}–${fmt0(P.hi[t])}</span>`]); tag = 'Projected'; }

    vals.sort((a, b) => b.v - a.v);

      rows.push(['10th–90th pct', `${fmt0(quantile(sv, .1))}–${fmt0(quantile(sv, .9))}`]);

/* ════════════════════════════════════════════════════════════════════
   VIEW: Spotless days
   ════════════════════════════════════════════════════════════════════ */
const VS = {
  title: () => S.spotMode === 'run' ? 'Spotless days after each cycle peak' : 'Spotless days per year',
  sub: () => S.spotMode === 'run' ? `Running total of days without sunspots, Cycles ${SPOT.runs[0].c.cycle}–${CUR.cycle}` : `Days with a daily sunspot number of zero, ${SPOT.years[0].y}–${SPOT.lastAll.getUTCFullYear()}`,
  draw(ctx, w, h, exp) {
    return S.spotMode === 'run' ? this.drawRun(ctx, w, h) : this.drawYear(ctx, w, h);
  },
  drawRun(ctx, w, h) {
    const F = frame(w, h, 64, 64, 18, 36);
    const tB = 132;     // 11 years after the peak
    const xs = t => F.x0 + t / tB * (F.x1 - F.x0);
    let ymax = 0;
    for (const r of SPOT.runs) ymax = Math.max(ymax, r.cum[Math.min(r.cum.length - 1, tB)] || 0);
    ymax = Math.ceil(ymax * 1.06 / 100) * 100;
    const ys = yAxis(ctx, F, ymax, 'Spotless days since peak');
    setFont(ctx, 12); ctx.fillStyle = C_MUT; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const ystep = Math.max(1, Math.ceil(44 / ((F.x1 - F.x0) / 11)));

      if (yv % ystep) continue;
      const x = xs(yv * 12);
      ctx.strokeStyle = yv === 0 ? C_AXIS : C_GRID; ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, F.y0); ctx.lineTo(Math.round(x) + .5, F.y1); ctx.stroke();
      ctx.fillText(yv === 0 ? 'peak' : `+${yv}y`, x, F.y1 + 7);
    }
    clip(ctx, F);
    const labels = [];
    for (const r of SPOT.runs) {
      if (r.current) continue;
      const pick = S.pick === r.c.cycle;
      ctx.lineWidth = pick ? 2.2 : 1.2; ctx.strokeStyle = pick ? C_PURPLE : 'rgba(232,228,217,0.28)';
      const pts = r.cum.slice(0, tB + 1).map((v, t) => [xs(t), ys(v)]);
      polyline(ctx, pts);
      if (r.minK != null && r.minK <= tB && r.minK < r.cum.length) dot(ctx, xs(r.minK), ys(r.cum[r.minK]), 3, pick ? C_PURPLE : 'rgba(232,228,217,0.55)', null);
      const tl = Math.min(r.cum.length - 1, tB);
      labels.push({ y: ys(r.cum[tl]), x: xs(tl), c: r.c.cycle, pick });
    }
    const cur = SPOT.runs.find(r => r.current);
    if (cur) {
      ctx.lineWidth = 3; ctx.strokeStyle = ACC;

      dot(ctx, xs(t), ys(cur.cum[t]), 4.5, ACC);
      setFont(ctx, 13, FONT_MONO, 'bold'); ctx.fillStyle = ACC; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(`Cycle ${cur.c.cycle}: ${fmt0(cur.cum[t])}`, xs(t) + 8, ys(cur.cum[t]) - 6);
    }
    // end labels (de-collided)

    setFont(ctx, 12, FONT_MONO);
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    for (const L of labels) {

  },
  drawYear(ctx, w, h) {
    const F = frame(w, h, 58, 22, 30, 36);
    const Y = SPOT.years, a = Y[0].y, b = Y[Y.length - 1].y;

      ctx.strokeStyle = 'rgba(232,228,217,0.16)'; ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, F.y0); ctx.lineTo(Math.round(x) + .5, F.y1); ctx.stroke(); ctx.setLineDash([]);

  ctx.globalAlpha = 1;
  setFont(ctx, 12); ctx.fillStyle = C_SEC; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`daily, max ${Math.max(...rec.map(r => r.v))}`, 0, 0);
  const lastE = rec[rec.length - 1];
  $('sp-l').textContent = dLabel(rec[0].d).replace(/, \d+$/, '');
  $('sp-r').textContent = `${dLabel(lastE.d).replace(/, \d+$/, '')}: ${lastE.v}${lastE.est ? ' est.' : ''}`;
}
function refresh() { updateHead(); render(); }

function setTab(t) {
  if (!TABS.includes(t)) t = 'record';
  if (t === 'spotless' && !SPOT) t = 'record';
  if (t === 'deep' && !DP) t = 'record';
  S.tab = t; S.hover = null; S.pick = null;
  const u = new URL(location.href); u.searchParams.set('tab', t); history.replaceState(null, '', u);
  refresh();
}

/* ── Events ── */
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
$('bar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.range) S.range = b.dataset.range;
  else if (b.dataset.proj) S.showProj = !S.showProj;
  else if (b.dataset.align) S.align = b.dataset.align;
  else if (b.dataset.c25) S.c25Show[b.dataset.c25] = !S.c25Show[b.dataset.c25];
  else if (b.dataset.spot) { S.spotMode = b.dataset.spot; S.pick = null; }
  else if (b.dataset.drange) S.deepRange = b.dataset.drange;
  else if (b.dataset.deep) S.deepShow[b.dataset.deep] = !S.deepShow[b.dataset.deep];
  else return;
  S.hover = null; refresh();
});
$('bar').addEventListener('change', e => { if (e.target.id === 'pick-sel') { S.pick = e.target.value ? +e.target.value : null; refresh(); } });
function onMove(e) {
  if (!G) return;
  const r = ov.getBoundingClientRect();
  const h = VIEWS[S.tab].hit(G, e.clientX - r.left, e.clientY - r.top);
  S.hover = h; drawHover();
}
ov.addEventListener('mousemove', onMove);
ov.addEventListener('mouseleave', () => { S.hover = null; drawHover(); });
ov.addEventListener('touchstart', e => { if (e.touches[0]) onMove(e.touches[0]); }, { passive: true });
ov.addEventListener('touchmove', e => { if (e.touches[0]) onMove(e.touches[0]); }, { passive: true });
ov.addEventListener('keydown', e => {
  if (!G) return;
  const step = e.shiftKey ? 12 : 1;
  const k = e.key === 'ArrowRight' ? step : e.key === 'ArrowLeft' ? -step : 0;
  if (e.key === 'Escape') { S.hover = null; drawHover(); return; }
  if (!k) return;
  e.preventDefault();
  const V = VIEWS[S.tab];
  const cur = S.hover || V.hit(G, G.F.x1);
  if (!cur) return;
  const key = Object.keys(cur)[0], probe = Object.assign({}, cur);
  let lo = 0, hi = 0;
  if (key === 'i') { lo = G.a; hi = (S.showProj && P) ? Math.max(M.lastX, P.s0 + P.end) : M.lastX; }
  else if (key === 't') { lo = G.tA || 0; hi = G.tB; }
  else { lo = G.a; hi = S.tab === 'deep' ? G.b - 1 : G.b; }
  probe[key] = Math.max(lo, Math.min(hi, probe[key] + k));
  S.hover = probe; drawHover();
});

let roKey = '';
const ro = new ResizeObserver(() => {
  const st = $('stage'), key = st.offsetWidth + 'x' + st.offsetHeight;
  if (key === roKey) return; roKey = key;
  sizeStage(); render(); drawSpark();
});

/* ── Exports ── */
const EXPORT_SCALE = 3;
function composeExport() {
  const V = VIEWS[S.tab];
  const w = 1400, chartH = 620, pad = 28;
  const headH = 116, legH = 34, footH = 54;
  const h = headH + legH + chartH + footH;
  const off = document.createElement('canvas');
  off.width = w * EXPORT_SCALE; off.height = h * EXPORT_SCALE;
  const ctx = off.getContext('2d'); ctx.scale(EXPORT_SCALE, EXPORT_SCALE);
  ctx.fillStyle = '#1E2320'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#262B27'; ctx.fillRect(pad / 2, pad / 2, w - pad, h - pad);
  setFont(ctx, 13, FONT_MONO, 'bold'); ctx.fillStyle = ACC; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText('CONTEXTCLIMATE · SOLAR CYCLE PROGRESSION', pad + 8, pad + 6);
  setFont(ctx, 30, FONT_DISP, 'bold'); ctx.fillStyle = C_TXT; ctx.fillText(V.title(), pad + 8, pad + 26);
  setFont(ctx, 15, FONT_BODY); ctx.fillStyle = C_SEC; ctx.fillText(V.sub(), pad + 8, pad + 64);
  // readouts, right-aligned
  const ro = V.head(); let rx = w - pad - 8;
  ctx.textAlign = 'right';
  for (let j = ro.length - 1; j >= 0; j--) {
    const r = ro[j], vtxt = r.v.replace(/<small>/, ' ').replace(/<[^>]+>/g, '');
    setFont(ctx, 26, FONT_DISP, 'bold'); const vw = ctx.measureText(vtxt).width;
    setFont(ctx, 12, FONT_MONO); const lw = ctx.measureText(r.l.toUpperCase()).width, nw = ctx.measureText(r.n || '').width;
    const colW = Math.max(vw, lw, nw);
    if (rx - colW < w * 0.5) break;
    ctx.fillStyle = C_SEC; ctx.fillText(r.l.toUpperCase(), rx, pad + 22);
    setFont(ctx, 26, FONT_DISP, 'bold'); ctx.fillStyle = C_TXT; ctx.fillText(vtxt, rx, pad + 38);
    setFont(ctx, 12, FONT_MONO); ctx.fillStyle = C_MUT; ctx.fillText(r.n || '', rx, pad + 70);
    rx -= colW + 26;
  }
  // legend (from the DOM legend items)
  const tmp = document.createElement('div'); tmp.innerHTML = V.legend();
  let lx = pad + 8; const ly = headH + 12;
  setFont(ctx, 13, FONT_MONO); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for (const it of tmp.querySelectorAll('.lg-item')) {
    const sw = it.querySelector('[class^="sw-"]'), txt = it.textContent.trim();
    if (sw) {
      const st = sw.getAttribute('style') || '';
      const col = (st.match(/(?:border-color|background):\s*([^;]+)/) || [])[1] || C_TXT;
      if (sw.classList.contains('sw-grad')) {
        const g = ctx.createLinearGradient(lx, 0, lx + 90, 0);
        SN_RAMP.forEach(([v, c]) => g.addColorStop(v / 280, c));
        ctx.fillStyle = C_SEC; ctx.fillText('0', lx, ly); lx += 12;
        ctx.fillStyle = g; ctx.fillRect(lx, ly - 5, 90, 10); lx += 96;
        ctx.fillStyle = C_SEC; ctx.fillText('280', lx, ly); lx += ctx.measureText('280').width + 22; continue;
      }
      if (sw.classList.contains('sw-band') || sw.classList.contains('sw-dot')) { ctx.fillStyle = col; ctx.fillRect(lx, ly - 5, 20, 10); }
      else { ctx.strokeStyle = col; ctx.lineWidth = sw.classList.contains('thick') ? 3 : (sw.classList.contains('thin') ? 1.2 : 2); ctx.setLineDash(sw.classList.contains('dash') ? [5, 3] : sw.classList.contains('dot') ? [2, 3] : []); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 22, ly); ctx.stroke(); ctx.setLineDash([]); }
      lx += 28;
    }
    ctx.fillStyle = C_SEC; ctx.fillText(txt, lx, ly); lx += ctx.measureText(txt).width + 22;
    if (lx > w - 200) break;
  }
  // chart
  ctx.save(); ctx.translate(pad / 2, headH + legH);
  V.draw(ctx, w - pad, chartH, true);
  ctx.restore();
  // footer
  const src = $('src').textContent.replace(/\s*Projection method\s*$/, '');
  ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = C_MUT;
  let fs = 12; setFont(ctx, fs, FONT_BODY);
  while (ctx.measureText(src).width > w - pad * 2 - 170 && fs > 9) setFont(ctx, --fs, FONT_BODY);
  ctx.fillText(src, pad + 8, h - footH + 6);
  setFont(ctx, 13, FONT_MONO, 'bold'); ctx.fillStyle = C_SEC; ctx.textAlign = 'right';
  ctx.fillText('contextclimate.io', w - pad - 8, h - footH + 6);
  return off;
}
function flash(btn, ok) { btn.classList.add(ok ? 'is-ok' : 'is-error'); setTimeout(() => btn.classList.remove('is-ok', 'is-error'), 1400); }
function fileBase() { const [y, m] = mYM(M.lastX); return `solar-cycle-${S.tab}-${y}-${String(m).padStart(2, '0')}`; }
$('png-btn').addEventListener('click', () => {
  const off = composeExport(), a = document.createElement('a');
  a.download = fileBase() + '.png'; a.href = off.toDataURL('image/png'); a.click();
});
$('copy-btn').addEventListener('click', async e => {
  const btn = e.currentTarget;
  try {
    const off = composeExport();
    const blob = await new Promise(r => off.toBlob(r, 'image/png'));
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    flash(btn, true);
  } catch (err) { flash(btn, false); }
});
$('csv-btn').addEventListener('click', () => {
  const blob = new Blob([VIEWS[S.tab].csv() + '\n'], { type: 'text/csv' });
  const a = document.createElement('a'); a.download = fileBase() + '.csv'; a.href = URL.createObjectURL(blob); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

/* ════════════════════════════════════════════════════════════════════
   Boot
   ════════════════════════════════════════════════════════════════════ */
async function getText(u) { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(`${u}: HTTP ${r.status}`); return r.text(); }
async function getJSON(u) { return JSON.parse(await getText(u)); }
async function boot() {
  try {
    const [csv, ref, daily, deep] = await Promise.all([
      getText('sunspot-monthly.csv'), getJSON('solar-cycle-reference.json'),
      getJSON('solar-cycle-daily.json').catch(() => null), getJSON('solar-deep-history.json').catch(() => null)]);
    parseCSV(csv);
    buildCycles(ref.cycles);
    P = project(CUR);
    buildC25();
    DAILY = daily; DEEP = deep;
    try { SPOT = buildSpotless(); } catch (e) { SPOT = null; console.warn('spotless', e); }
    try { DP = buildDeep(); } catch (e) { DP = null; console.warn('deep', e); }
    document.querySelector('[data-tab="spotless"]').disabled = !SPOT;
    document.querySelector('[data-tab="deep"]').disabled = !DP;
    $('state').hidden = true;
    sizeStage();
    const q = new URLSearchParams(location.search);
    setTab(q.get('tab') || 'record');
    updateNow();
    ro.observe($('stage')); ro.observe($('sp-wrap'));
  } catch (e) {
    $('state').innerHTML = `<div class="err">Couldn't load the sunspot record (${esc(e.message || e)}).</div>`;
  }
}
window.__scp = () => ({ M, CYC, CUR, P, C25, SPOT, DP, S });
document.fonts && document.fonts.ready ? document.fonts.ready.then(boot) : boot();
</script>
