<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winter Precipitation Heatmap | ContextClimate</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #07070f;
  --surface:      #0c1220;
  --surface2:     #141e30;
  --border:       #1e2d44;
  --text:         #e6e8f0;
  --text-muted:   #6888aa;
  --text-dim:     #2e4060;
  --accent:       #2468a8;
  --accent-glow:  #60a8d8;
  --type-glow:    #b8b8f8;
  --font-body:    'Plus Jakarta Sans', sans-serif;
  --font-label:   'Barlow Condensed', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
}
body { padding: 20px 0 48px; }

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 28px;
}

/* ── Title ── */
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.title-sep { color: var(--text-dim); font-weight: 400; }

/* ── Mode tabs ── */
.tab-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.tab-btn {
  font-family: var(--font-label);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 5px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
}
.tab-btn.active {
  background: #0a1e38;
  border-color: var(--accent);
  color: var(--accent-glow);
}
.tab-btn:hover:not(.active) { border-color: #3a3a5c; color: var(--text); }

/* ── Type toggle ── */
.type-toggle {
  display: flex;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.type-btn {
  font-family: var(--font-label);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 5px 16px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s ease;
}
.type-btn:hover:not([class*="type-active"]) { border-color: #3a3a5c; color: var(--text); }
.type-btn.type-active-all  { background: #0a1828; border-color: #2258cc; color: #60aaee; }
.type-btn.type-active-sn   { background: #1a0a38; border-color: #8844cc; color: #cc88ff; }
.type-btn.type-active-pl   { background: #2a1a08; border-color: #cc8822; color: #ffbb55; }
.type-btn.type-active-fzra { background: #2a0a18; border-color: #cc4488; color: #ff88c0; }

/* ── Controls row ── */
.controls-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  min-height: 30px;
}
.control-label {
  font-family: var(--font-label);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
select {
  font-family: var(--font-label);
  font-size: 14px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--accent-glow);
  padding: 4px 10px;
  cursor: pointer;
  outline: none;
  appearance: auto;
}
select:focus { border-color: var(--accent); }

/* ── Stat chips ── */
.stat-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.stat-chip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 16px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.stat-label {
  font-family: var(--font-label);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.stat-value {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 600;
  color: var(--type-glow);
  line-height: 1.1;
}

/* ── Legend ── */
.legend-row {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  margin-bottom: 6px;
}
.legend-end-label {
  font-family: var(--font-label);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
}
#legend-canvas {
  border-radius: 3px;
  border: 1px solid var(--border);
  display: block;
}

/* ── Heatmap layout ── */
.heatmap-wrapper { width: 100%; }
.heatmap-inner { display: flex; align-items: flex-start; }

.hour-labels {
  flex-shrink: 0;
  width: 52px;
  display: flex;
  flex-direction: column;
}
.hour-labels-spacer { height: 26px; }
.hour-label {
  font-family: var(--font-label);
  font-size: 14px;
  font-weight: 600;
  color: #b0b0cc;
  text-align: right;
  padding-right: 9px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
}

.canvas-area { flex: 1; min-width: 0; position: relative; }

.month-label-bar {
  position: relative;
  height: 26px;
  user-select: none;
}
.month-label {
  position: absolute;
  font-family: var(--font-label);
  font-size: 15px;
  font-weight: 700;
  color: #b0b0cc;
  transform: translateX(-50%);
  white-space: nowrap;
  line-height: 26px;
}

.canvas-container { position: relative; }
#heatmap-canvas {
  display: block;
  width: 100%;
  cursor: crosshair;
}

/* ── Loading overlay ── */
.loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(7, 7, 15, 0.88);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.loading-text {
  font-family: var(--font-label);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.4px;
  color: var(--text-muted);
}
.progress-track {
  width: 280px;
  height: 5px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #4c1d95, #a78bfa);
  border-radius: 3px;
  transition: width 0.4s ease;
  width: 0%;
}
.error-text {
  font-family: var(--font-label);
  font-size: 13px;
  color: #ef4444;
  margin-top: 4px;
}

/* ── Tooltip ── */
#tooltip {
  position: fixed;
  background: rgba(12, 12, 24, 0.97);
  border: 1px solid #2e2e50;
  border-radius: 8px;
  padding: 10px 14px;
  pointer-events: none;
  z-index: 200;
  display: none;
  width: 230px;
  backdrop-filter: blur(12px);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5);
}
.tt-date {
  font-family: var(--font-label);
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.3px;
  margin-bottom: 5px;
}
.tt-value {
  font-family: var(--font-mono);
  font-size: 20px;
  font-weight: 600;
  color: var(--type-glow);
  line-height: 1;
  margin-bottom: 4px;
}
.tt-value.has-wx { color: var(--type-glow); }
.tt-value.no-wx  { color: var(--text-dim); }
.tt-detail {
  font-family: var(--font-body);
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
}

/* ── Footer ── */
.footer {
  margin-top: 14px;
  font-family: var(--font-label);
  font-size: 12px;
  color: var(--text-dim);
}
.footer strong { color: #555575; }

/* ── CC pill ── */
.cc-pill {
  font-family: var(--font-label);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.4px;
  background: #0a1628;
  border: 1px solid #1e3a5c;
  border-radius: 20px;
  color: var(--accent-glow);
  padding: 3px 12px;
  text-decoration: none;
  margin-left: 8px;
  transition: all 0.15s;
  white-space: nowrap;
}
.cc-pill:hover { background: #0f2040; border-color: var(--accent); color: #88c8f0; }

/* ── Station row ── */
.station-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.station-select {
  font-family: var(--font-label);
  font-size: 15px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 7px;
  color: var(--text);
  padding: 5px 12px;
  cursor: pointer;
  outline: none;
  min-width: 260px;
}
.station-select:focus { border-color: var(--accent); }

.download-btn {
  font-family: var(--font-label);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-muted);
  padding: 3px 10px;
  cursor: pointer;
  transition: all 0.15s;
  margin-left: 8px;
}
.download-btn:hover { border-color: #3a3a5c; color: var(--text); }
</style>
</head>
<body>
<div class="container">

  <div class="page-title">
    <span id="title-station">Islip, NY</span>
    <span class="title-sep">|</span>
    <span>Winter Precipitation Heatmap</span>
    <span class="title-sep">|</span>
    <span id="title-period">1991–2025</span>
    <button class="download-btn" onclick="downloadPNG()" title="Download PNG">↓ PNG</button>
    <a class="cc-pill" href="https://contextclimate.io" target="_blank">[ ] ContextClimate</a>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-climo"  onclick="setMode('climatology')">Climatology</button>
    <button class="tab-btn"        id="tab-single" onclick="setMode('single')">Single Year</button>

  <!-- Station selector -->
  <div class="station-row">

  </div>

  <!-- Precipitation type toggle -->
  <div class="type-toggle">

  <!-- Year selector — single year mode only -->
  <div class="controls-row">
    <span class="control-label" id="ctrl-label" style="display:none">Year:</span>

  <!-- Stat chips -->
  <div class="stat-row">

      <span class="stat-label" id="sl-period">Period</span>

  <!-- Legend -->
  <div class="legend-row">

  <div class="footer">
    <span id="footer-tz">Eastern Local Time</span> &nbsp;|&nbsp; Data: IEM ASOS &nbsp;|&nbsp;
    <strong>[ ] ContextClimate</strong>

</div><!-- /.container -->

<div id="tooltip">
  <div class="tt-date"   id="tt-date"></div>
  <div class="tt-value"  id="tt-value"></div>
  <div class="tt-detail" id="tt-detail"></div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const CLIMO_START   = 1991;
const CLIMO_END     = 2025;
const TOTAL_YEARS   = CLIMO_END - CLIMO_START + 1;
const CANVAS_HEIGHT = 504; // 21px × 24 rows

const STATIONS = {
  // Northeast

const climoCache = new Map();

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_FULL  = ['January','February','March','April','May','June',
                      'July','August','September','October','November','December'];
const MONTH_DAYS_LEAP   = [31,29,31,30,31,30,31,31,30,31,30,31];
const MONTH_DAYS_NOLEAP = [31,28,31,30,31,30,31,31,30,31,30,31];

const MONTH_START_DOY = (() => {
  const arr = [0];
  for (let m = 0; m < 11; m++) arr.push(arr[m] + MONTH_DAYS_LEAP[m]);
  return arr;
})();

// ── Color palettes per precip type ──────────────────────────
// All:  dark → deep navy → royal blue → sky blue → pale ice (saturated blues)
// Snow: dark → deep blue → violet → warm violet → pink (11 stops, hue ~240°→330°)
// Sleet: dark → brown → amber → orange
// FZRA: dark → deep plum → mauve → pink
const COLOR_STOPS = {
  all: [
    { t: 0.00, rgb: [5,    8,  16] },
    { t: 0.07, rgb: [6,   12,  44] },
    { t: 0.18, rgb: [10,  28,  92] },
    { t: 0.32, rgb: [20,  62, 172] },
    { t: 0.50, rgb: [50, 118, 228] },
    { t: 0.66, rgb: [112, 172, 245] },
    { t: 0.82, rgb: [182, 215, 252] },
    { t: 1.00, rgb: [226, 240, 255] },
  ],
  sn: [
    { t: 0.00, rgb: [5,    8,  16] },
    { t: 0.06, rgb: [12,  10,  52] },
    { t: 0.14, rgb: [28,  18, 118] },
    { t: 0.24, rgb: [52,  38, 190] },
    { t: 0.36, rgb: [88,  62, 215] },
    { t: 0.48, rgb: [128,  65, 218] },
    { t: 0.59, rgb: [168,  65, 210] },
    { t: 0.70, rgb: [205,  72, 192] },
    { t: 0.80, rgb: [232,  95, 170] },
    { t: 0.90, rgb: [250, 125, 158] },
    { t: 1.00, rgb: [255, 152, 165] },
  ],
  pl: [
    { t: 0.00, rgb: [5,   8,  16] },
    { t: 0.10, rgb: [24,  18,  10] },
    { t: 0.25, rgb: [64,  44,  18] },
    { t: 0.42, rgb: [125, 80,  28] },
    { t: 0.60, rgb: [192, 125, 45] },
    { t: 0.78, rgb: [235, 168, 65] },
    { t: 1.00, rgb: [255, 200, 90] },
  ],
  fzra: [
    { t: 0.00, rgb: [5,   8,  16] },
    { t: 0.10, rgb: [22,  12,  24] },
    { t: 0.25, rgb: [62,  30,  65] },
    { t: 0.42, rgb: [122, 55, 108] },
    { t: 0.60, rgb: [185,  95, 155] },
    { t: 0.78, rgb: [230, 140, 192] },
    { t: 1.00, rgb: [255, 178, 218] },
  ],
};

// Probability ceilings — set to cover the realistic peak at extreme stations
const MAX_PROB  = { all: 0.40, sn: 0.40, pl: 0.06, fzra: 0.06 };
const LEGEND_HI = { all: '≥ 40%', sn: '≥ 40%', pl: '≥ 6%', fzra: '≥ 6%' };
const TYPE_GLOW = { all: '#60aaee', sn: '#cc88ff', pl: '#ffbb55', fzra: '#ff88c0' };

// Colors for single-year event pixels (vivid representative color from each ramp)
const SINGLE_COLOR = {
  all:  [100, 165, 245],
  sn:   [255, 148, 168],
  pl:   [255, 195, 88],
  fzra: [255, 175, 215],
};

function lerpColor(t, type) {
  const stops = COLOR_STOPS[type];
  t = Math.max(0, Math.min(1, t));
  let lo = stops[0], hi = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (t <= stops[i + 1].t) { lo = stops[i]; hi = stops[i + 1]; break; }
  }
  const span = hi.t - lo.t;
  const f = span < 1e-6 ? 0 : (t - lo.t) / span;
  return [
    Math.round(lo.rgb[0] + f * (hi.rgb[0] - lo.rgb[0])),
    Math.round(lo.rgb[1] + f * (hi.rgb[1] - lo.rgb[1])),
    Math.round(lo.rgb[2] + f * (hi.rgb[2] - lo.rgb[2])),
  ];
}
function probToRGB(prob, type) { return lerpColor(Math.min(1, prob / MAX_PROB[type]), type); }
function rgb(r, g, b) { return `rgb(${r},${g},${b})`; }

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let mode        = 'climatology';
let precipType  = 'all';
let currentYear = CLIMO_END;

let singleGridSN = null;  // binary snow grid for single year
let singleGridPL = null;  // binary sleet grid for single year
let singleGridFZ = null;  // binary FZRA grid for single year

let snCount   = null;   // climatology snow counts [doy][hour]
let plCount   = null;   // climatology sleet counts
let fzCount   = null;   // climatology FZRA counts
let dataCount = null;   // total observation counts (years with any data)

// ═══════════════════════════════════════════════════════════════
// DATE UTILITIES
// ═══════════════════════════════════════════════════════════════
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

function getDOY0(year, month, day) {
  const md = isLeap(year) ? MONTH_DAYS_LEAP : MONTH_DAYS_NOLEAP;
  let d = 0;
  for (let m = 0; m < month - 1; m++) d += md[m];
  return d + day - 1;
}

function doyToMonthDay(doy) {
  let rem = doy;
  for (let m = 0; m < 12; m++) {
    if (rem < MONTH_DAYS_LEAP[m]) return { m, day: rem + 1 };
    rem -= MONTH_DAYS_LEAP[m];
  }
  return { m: 11, day: 31 };
}

function fmtHour(h) {
  if (h === 0)  return 'Midnight';
  if (h === 12) return 'Noon';
  return h < 12 ? `${h} AM` : `${h - 12} PM`;
}

// ═══════════════════════════════════════════════════════════════
// IEM FETCH + PARSE
// ═══════════════════════════════════════════════════════════════
function buildIEMUrl(y1, y2) {
  const st = activeStation();
  const tz = encodeURIComponent(st.tz);
  return `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py?` +
    `station=${activeStationId}&data=metar` +
    `&year1=${y1}&month1=1&day1=1` +
    `&year2=${y2}&month2=12&day2=31` +
    `&tz=${tz}&format=comma&latlon=no&missing=M&trace=T&direct=no`;
}

// Detect winter precipitation codes in a raw METAR string.
// All token matching is explicit to avoid false positives.
function detectWinterPrecip(metar) {
  if (!metar || metar === 'M') return { hasSN: false, hasPL: false, hasFZRA: false };
  const up  = metar.toUpperCase();
  const rmk = up.indexOf(' RMK ');
  const body = rmk > 0 ? up.substring(0, rmk) : up;
  const tokens = body.split(/\s+/);

  let hasSN = false, hasPL = false, hasFZRA = false;

  for (const t of tokens) {
    // Snow: SN, -SN, +SN, BLSN (blowing), DRSN (drifting), SHSN (showers),
    //       RASN/SNRA (rain+snow mix), SG (snow grains), SNPL/PLSN (snow+sleet)
    if (!t.startsWith('FZ') && (
        t === 'SN'   || t === '-SN'  || t === '+SN'  ||
        t === 'BLSN' || t === 'DRSN' || t === 'SHSN' ||
        t === 'RASN' || t === 'SNRA' || t === 'SG'   ||
        t === 'SNPL' || t === 'PLSN'
    )) hasSN = true;

    // Sleet / Ice Pellets: modern PL or legacy IP codes
    if (t === 'PL'   || t === '-PL'  || t === '+PL'  ||
        t === 'IP'   || t === '-IP'  || t === '+IP'  ||
        t === 'PLSN' || t === 'SNPL' || t === 'RAPL' || t === 'PLRA'
    ) hasPL = true;

    // Freezing Rain / Freezing Drizzle
    if (t === 'FZRA'  || t === '-FZRA' || t === '+FZRA' ||
        t === 'FZDZ'  || t === '-FZDZ' || t === '+FZDZ'
    ) hasFZRA = true;
  }
  return { hasSN, hasPL, hasFZRA };
}

async function fetchRangeCSV(y1, y2) {
  const resp = await fetch(buildIEMUrl(y1, y2));
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.text();
}

function parseIEM(text) {
  const lines = text.split('\n');
  const byYear = new Map();
  let metarIdx = 2;
  let inData = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    if (line.startsWith('station,')) {
      const h  = line.split(',');
      const mi = h.indexOf('metar');
      if (mi >= 0) metarIdx = mi;
      inData = true;
      continue;
    }
    if (!inData) continue;

    const parts = line.split(',');
    if (parts.length < 3) continue;

    const valid    = parts[1].trim();
    const spaceIdx = valid.indexOf(' ');
    if (spaceIdx < 1) continue;

    const dp = valid.substring(0, spaceIdx).split('-').map(Number);
    if (dp.length < 3 || isNaN(dp[0])) continue;

    const [yr, mo, dy] = dp;
    const hour = parseInt(valid.substring(spaceIdx + 1));
    if (isNaN(hour) || hour < 0 || hour > 23) continue;

    const doy = getDOY0(yr, mo, dy);
    if (doy < 0 || doy > 365) continue;

    const metarStr = parts.slice(metarIdx).join(',').trim();
    const { hasSN, hasPL, hasFZRA } = detectWinterPrecip(metarStr);

    if (!byYear.has(yr)) byYear.set(yr, []);
    byYear.get(yr).push({ doy, hour, hasSN, hasPL, hasFZRA });
  }
  return byYear;
}

// ═══════════════════════════════════════════════════════════════
// DATA AGGREGATION
// ═══════════════════════════════════════════════════════════════
function initGrids() {
  snCount   = Array.from({ length: 366 }, () => new Int16Array(24));
  plCount   = Array.from({ length: 366 }, () => new Int16Array(24));
  fzCount   = Array.from({ length: 366 }, () => new Int16Array(24));
  dataCount = Array.from({ length: 366 }, () => new Int16Array(24));
}

function processYear(obs) {
  const ySN   = new Uint8Array(366 * 24);
  const yPL   = new Uint8Array(366 * 24);
  const yFZ   = new Uint8Array(366 * 24);
  const yData = new Uint8Array(366 * 24);

  for (const { doy, hour, hasSN, hasPL, hasFZRA } of obs) {
    const idx = doy * 24 + hour;
    yData[idx] = 1;
    if (hasSN)   ySN[idx] = 1;
    if (hasPL)   yPL[idx] = 1;
    if (hasFZRA) yFZ[idx] = 1;
  }

  for (let d = 0; d < 366; d++) {
    for (let h = 0; h < 24; h++) {
      const idx = d * 24 + h;
      if (yData[idx]) {
        dataCount[d][h]++;
        if (ySN[idx]) snCount[d][h]++;
        if (yPL[idx]) plCount[d][h]++;
        if (yFZ[idx]) fzCount[d][h]++;
      }
    }
  }
}

// ── Active-type helpers ──────────────────────────────────────
// Returns the raw hour-count for the currently selected precip type.
// For 'all', sums all three (combined hours, may double-count mixed events).
function getCount(d, h) {
  if (precipType === 'all')  return snCount[d][h] + plCount[d][h] + fzCount[d][h];
  if (precipType === 'sn')   return snCount[d][h];
  if (precipType === 'pl')   return plCount[d][h];
  return fzCount[d][h];
}

// Returns 1 if the active type (or any type in 'all' mode) occurred this hour.
function getSingleHas(doy, h) {
  const i = doy * 24 + h;
  if (precipType === 'all')  return (singleGridSN[i] || singleGridPL[i] || singleGridFZ[i]) ? 1 : 0;
  if (precipType === 'sn')   return singleGridSN[i];
  if (precipType === 'pl')   return singleGridPL[i];
  return singleGridFZ[i];
}

// ═══════════════════════════════════════════════════════════════
// CANVAS SETUP
// ═══════════════════════════════════════════════════════════════
const canvas = document.getElementById('heatmap-canvas');
const ctx    = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function setupCanvas() {
  const W = document.getElementById('canvas-area').clientWidth;
  const H = CANVAS_HEIGHT;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
}

// ═══════════════════════════════════════════════════════════════
// RENDER – HEATMAP
// ═══════════════════════════════════════════════════════════════
function renderHeatmap() {
  const W = canvas.width  / dpr;
  const H = canvas.height / dpr;
  const cellW = W / 366;
  const cellH = H / 24;
  const pw = Math.round(W * dpr);
  const ph = Math.round(H * dpr);

  const imgData = ctx.createImageData(pw, ph);
  const data = imgData.data;

  for (let doy = 0; doy < 366; doy++) {
    const x0 = Math.round(doy       * cellW * dpr);
    const x1 = Math.round((doy + 1) * cellW * dpr);

    for (let h = 0; h < 24; h++) {
      const y0 = Math.round(h       * cellH * dpr);
      const y1 = Math.round((h + 1) * cellH * dpr);

      let r, g, b;
      if (mode === 'climatology') {
        const dc  = dataCount[doy][h];
        const min = Math.ceil(TOTAL_YEARS / 3);
        const cnt  = dc >= min ? getCount(doy, h) : 0;
        const prob = dc >= min ? cnt / dc : 0;
        [r, g, b] = probToRGB(prob, precipType);
      } else {
        if (getSingleHas(doy, h)) { [r, g, b] = SINGLE_COLOR[precipType]; }
        else                      { [r, g, b] = [5, 8, 16]; }
      }

      for (let py = y0; py < y1 && py < ph; py++) {
        for (let px = x0; px < x1 && px < pw; px++) {
          const i = (py * pw + px) * 4;
          data[i]     = r;
          data[i + 1] = g;
          data[i + 2] = b;
          data[i + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Month dividers
  ctx.strokeStyle = 'rgba(255,255,255,0.10)';
  ctx.lineWidth = 1;
  for (let m = 1; m < 12; m++) {
    const x = Math.round(MONTH_START_DOY[m] * cellW) + 0.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }

  // Noon divider
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  const noonY = Math.round(12 * cellH) + 0.5;
  ctx.beginPath(); ctx.moveTo(0, noonY); ctx.lineTo(W, noonY); ctx.stroke();
}

// ═══════════════════════════════════════════════════════════════
// RENDER – LEGEND
// ═══════════════════════════════════════════════════════════════
function renderLegend() {
  const lc = document.getElementById('legend-canvas');
  const lx = lc.getContext('2d');
  const W  = lc.width, H = lc.height;
  lx.clearRect(0, 0, W, H);

  if (mode === 'climatology') {
    const grad = lx.createLinearGradient(0, 0, W, 0);
    for (const s of COLOR_STOPS[precipType]) {
      const [r, g, b] = lerpColor(s.t, precipType);
      grad.addColorStop(s.t, `rgb(${r},${g},${b})`);
    }
    lx.fillStyle = grad;
    lx.fillRect(0, 0, W, H);
    document.getElementById('legend-lo').textContent = '0%';
    document.getElementById('legend-hi').textContent = LEGEND_HI[precipType];
  } else {
    lx.fillStyle = rgb(5, 8, 16);
    lx.fillRect(0, 0, W / 2, H);
    const [r, g, b] = SINGLE_COLOR[precipType];
    lx.fillStyle = rgb(r, g, b);
    lx.fillRect(W / 2, 0, W / 2, H);
    document.getElementById('legend-lo').textContent = 'None';
    document.getElementById('legend-hi').textContent =
      { all: 'Any Precip', sn: 'Snow', pl: 'Sleet', fzra: 'Freezing Rain' }[precipType];
  }
}

// ═══════════════════════════════════════════════════════════════
// RENDER – HOUR & MONTH LABELS
// ═══════════════════════════════════════════════════════════════
function renderHourLabels() {
  const container = document.getElementById('hour-labels');
  while (container.children.length > 1) container.removeChild(container.lastChild);
  const cellH = CANVAS_HEIGHT / 24;
  for (let h = 0; h < 24; h++) {
    const el = document.createElement('div');
    el.className   = 'hour-label';
    el.style.height = cellH + 'px';
    el.textContent = h === 0 ? 'Midnight' : h === 12 ? 'Noon' : h < 12 ? h : h - 12;
    container.appendChild(el);
  }
}

function renderMonthLabels() {
  const bar   = document.getElementById('month-label-bar');
  bar.innerHTML = '';
  const W     = document.getElementById('canvas-area').clientWidth;
  const cellW = W / 366;
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e) / 2;
    const el  = document.createElement('div');
    el.className   = 'month-label';
    el.textContent = MONTHS_SHORT[m];
    el.style.left  = (mid * cellW) + 'px';
    bar.appendChild(el);
  }
}

// ═══════════════════════════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════════════════════════
function updateStats() {
  const annualLabels = {
    all:  'Avg Winter Precip Hrs / Yr',
    sn:   'Avg Snow Hrs / Yr',
    pl:   'Avg Sleet Hrs / Yr',
    fzra: 'Avg FZRA Hrs / Yr',
  };
  const totalLabels = {
    all:  'Total Winter Precip Hrs',
    sn:   'Total Snow Hours',
    pl:   'Total Sleet Hours',
    fzra: 'Total FZRA Hours',
  };

  if (mode === 'climatology' && snCount) {
    document.getElementById('sv-period').textContent = `${CLIMO_START}–${CLIMO_END}`;
    document.getElementById('sl-period').textContent = 'Period';
    document.getElementById('sl-annual').textContent = annualLabels[precipType];

    // Peak month
    const monthAvg = MONTHS_SHORT.map((_, m) => {
      const s = MONTH_START_DOY[m];
      const e = m < 11 ? MONTH_START_DOY[m + 1] : 366;
      let sum = 0, n = 0;
      for (let d = s; d < e; d++)
        for (let h = 0; h < 24; h++)
          if (dataCount[d][h] > 2) { sum += getCount(d, h) / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakM = monthAvg.indexOf(Math.max(...monthAvg));
    document.getElementById('sv-month').textContent = MONTHS_FULL[peakM];

    // Peak hour
    const hourAvg = Array.from({ length: 24 }, (_, h) => {
      let sum = 0, n = 0;
      for (let d = 0; d < 366; d++)
        if (dataCount[d][h] > 2) { sum += getCount(d, h) / dataCount[d][h]; n++; }
      return n ? sum / n : 0;
    });
    const peakH = hourAvg.indexOf(Math.max(...hourAvg));
    document.getElementById('sv-hour').textContent = fmtHour(peakH);

    // Average hours per year
    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        total += getCount(d, h);
    document.getElementById('sv-annual').textContent = (total / TOTAL_YEARS).toFixed(1);

  } else if (mode === 'single' && singleGridSN) {
    document.getElementById('sv-period').textContent = currentYear;
    document.getElementById('sl-period').textContent = 'Year';
    document.getElementById('sl-annual').textContent = totalLabels[precipType];

    // Total hours
    let total = 0;
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (getSingleHas(d, h)) total++;
    document.getElementById('sv-annual').textContent = total;

    // Peak month
    const byMonth = Array(12).fill(0);
    for (let d = 0; d < 366; d++) {
      const { m } = doyToMonthDay(d);
      for (let h = 0; h < 24; h++)
        if (getSingleHas(d, h)) byMonth[m]++;
    }
    const peakM = byMonth.indexOf(Math.max(...byMonth));
    document.getElementById('sv-month').textContent = byMonth[peakM] ? MONTHS_FULL[peakM] : '–';

    // Peak hour
    const byHour = Array(24).fill(0);
    for (let d = 0; d < 366; d++)
      for (let h = 0; h < 24; h++)
        if (getSingleHas(d, h)) byHour[h]++;
    const peakH = byHour.indexOf(Math.max(...byHour));
    document.getElementById('sv-hour').textContent = byHour[peakH] ? fmtHour(peakH) : '–';
  }
}

// ═══════════════════════════════════════════════════════════════
// LOADING UI
// ═══════════════════════════════════════════════════════════════
function showLoading(txt) {
  document.getElementById('loading-overlay').style.display = 'flex';
  document.getElementById('loading-text').textContent = txt;
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('error-text').style.display = 'none';
  const ctr = document.getElementById('ts-counter');
  if (ctr) ctr.textContent = '';
}

function setProgress(pct, txt) {
  document.getElementById('progress-fill').style.width = pct + '%';
  if (txt) document.getElementById('loading-text').textContent = txt;
  let snT = 0, plT = 0, fzT = 0;
  if (snCount) for (let d = 0; d < 366; d++) for (let h = 0; h < 24; h++) snT += snCount[d][h];
  if (plCount) for (let d = 0; d < 366; d++) for (let h = 0; h < 24; h++) plT += plCount[d][h];
  if (fzCount) for (let d = 0; d < 366; d++) for (let h = 0; h < 24; h++) fzT += fzCount[d][h];
  const ctr = document.getElementById('ts-counter');
  if (ctr && (snT + plT + fzT) > 0)
    ctr.textContent = `❄ ${snT} SN  ·  ${plT} PL  ·  🌧 ${fzT} FZRA observations found`;
}

function hideLoading() { document.getElementById('loading-overlay').style.display = 'none'; }

function showError(msg) {
  document.getElementById('loading-text').textContent = 'Failed to load data.';
  const et = document.getElementById('error-text');
  et.textContent = msg;
  et.style.display = 'block';
  setTimeout(hideLoading, 3000);
}

const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  if (!snCount && mode === 'climatology') { tooltip.style.display = 'none'; return; }
  if (mode === 'single' && !singleGridSN) { tooltip.style.display = 'none'; return; }

  const rect = canvas.getBoundingClientRect();
  const doy  = Math.min(365, Math.max(0, Math.floor((e.clientX - rect.left) / rect.width  * 366)));
  const h    = Math.min(23,  Math.max(0, Math.floor((e.clientY - rect.top)  / rect.height * 24)));

  const { m, day } = doyToMonthDay(doy);
  document.getElementById('tt-date').textContent = `${MONTHS_FULL[m]} ${day}  ·  ${fmtHour(h)}`;

  const val = document.getElementById('tt-value');
  const det = document.getElementById('tt-detail');
  val.className = 'tt-value';

  if (mode === 'climatology') {
    const dc  = dataCount[doy][h];
    const min = Math.ceil(TOTAL_YEARS / 3);
    if (dc < min) {
      val.textContent = '–';
      det.textContent = 'Insufficient data';
    } else {
      const cnt = getCount(doy, h);
      val.textContent = (cnt / dc * 100).toFixed(1) + '%';
      const typeLabel = { all: 'any winter precip', sn: 'snow (SN)', pl: 'sleet / ice pellets (PL)', fzra: 'freezing rain or drizzle' }[precipType];
      det.textContent = `${cnt} of ${dc} years had ${typeLabel}`;
    }
  } else {
    const hasSN = singleGridSN[doy * 24 + h];
    const hasPL = singleGridPL[doy * 24 + h];
    const hasFZ = singleGridFZ[doy * 24 + h];

    let hasWX, label, detail;
    if (precipType === 'all') {
      hasWX  = !!(hasSN || hasPL || hasFZ);
      const parts = [hasSN && '❄ Snow', hasPL && 'Sleet', hasFZ && '🌧 FZRA'].filter(Boolean);
      label  = hasWX ? parts.join('  ') : 'Clear';
      detail = hasWX ? 'Winter precipitation observed' : '';
    } else if (precipType === 'sn') {
      hasWX  = !!hasSN;
      label  = hasWX ? '❄ Snow' : 'No snow';
      detail = hasWX ? 'Snow (SN) observed this hour' : '';
    } else if (precipType === 'pl') {
      hasWX  = !!hasPL;
      label  = hasWX ? 'Sleet' : 'No sleet';
      detail = hasWX ? 'Sleet / Ice Pellets (PL) observed' : '';
    } else {
      hasWX  = !!hasFZ;
      label  = hasWX ? '🌧 Freezing Rain' : 'No FZRA';
      detail = hasWX ? 'Freezing Rain / Drizzle (FZRA/FZDZ) observed' : '';
    }
    val.textContent = label;
    val.classList.add(hasWX ? 'has-wx' : 'no-wx');
    det.textContent = detail;
  }

  tooltip.style.display = 'block';
  const TW = 230, TH = 95;
  let tx = e.clientX + 16;
  let ty = e.clientY - 10;
  if (tx + TW > window.innerWidth  - 10) tx = e.clientX - TW - 12;
  if (ty + TH > window.innerHeight - 10) ty = window.innerHeight - TH - 10;
  tooltip.style.left = tx + 'px';
  tooltip.style.top  = ty + 'px';
});
canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

// ═══════════════════════════════════════════════════════════════
// LOAD – CLIMATOLOGY
// ═══════════════════════════════════════════════════════════════
async function loadClimatology() {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = `${CLIMO_START}–${CLIMO_END}`;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;

  if (climoCache.has(activeStationId)) {
    const c = climoCache.get(activeStationId);
    snCount = c.snCount; plCount = c.plCount; fzCount = c.fzCount; dataCount = c.dataCount;
    renderHeatmap(); renderLegend(); updateStats();
    return;
  }

  initGrids();
  showLoading(`Fetching ${CLIMO_START}–${CLIMO_END} from IEM… (one large request, may take ~30s)`);

  try {
    const csv = await fetchRangeCSV(CLIMO_START, CLIMO_END);
    setProgress(60, 'Parsing observations…');
    await sleep(30);
    const byYear = parseIEM(csv);
    setProgress(90, 'Aggregating by year…');
    await sleep(30);
    for (const obs of byYear.values()) processYear(obs);
    setProgress(100);

    climoCache.set(activeStationId, {
      snCount:   snCount.map(r => Int16Array.from(r)),
      plCount:   plCount.map(r => Int16Array.from(r)),
      fzCount:   fzCount.map(r => Int16Array.from(r)),
      dataCount: dataCount.map(r => Int16Array.from(r)),
    });

    hideLoading();
  } catch (e) {
    showError(`Failed to load: ${e.message}`);
    console.error('Climatology load failed:', e);
    return;
  }

  renderHeatmap(); renderLegend(); updateStats();
}

// ═══════════════════════════════════════════════════════════════
// LOAD – SINGLE YEAR
// ═══════════════════════════════════════════════════════════════
async function loadSingleYear(year) {
  const st = activeStation();
  document.getElementById('title-station').textContent = st.label;
  document.getElementById('title-period').textContent  = year;
  document.getElementById('footer-tz').textContent     = `${st.tzLabel} Local Time`;
  showLoading(`Loading ${year} data…`);

  try {
    const csv = await fetchRangeCSV(year, year);
    const byYear = parseIEM(csv);
    const obs = byYear.get(year) || [];

    singleGridSN = new Uint8Array(366 * 24);
    singleGridPL = new Uint8Array(366 * 24);
    singleGridFZ = new Uint8Array(366 * 24);
    for (const { doy, hour, hasSN, hasPL, hasFZRA } of obs) {
      if (hasSN)   singleGridSN[doy * 24 + hour] = 1;
      if (hasPL)   singleGridPL[doy * 24 + hour] = 1;
      if (hasFZRA) singleGridFZ[doy * 24 + hour] = 1;
    }

    hideLoading();
    renderHeatmap();
    renderLegend();
    updateStats();
  } catch (err) {
    showError(err.message);
    console.error(err);
  }
}

// ═══════════════════════════════════════════════════════════════
// MODE / TYPE / NAV
// ═══════════════════════════════════════════════════════════════
function setMode(m) {
  mode = m;
  document.getElementById('tab-climo').classList.toggle('active', m === 'climatology');
  document.getElementById('tab-single').classList.toggle('active', m === 'single');

  const showYear = m === 'single';
  document.getElementById('ctrl-label').style.display  = showYear ? 'inline' : 'none';
  document.getElementById('year-select').style.display = showYear ? 'inline' : 'none';

  if (m === 'climatology') {
    loadClimatology();
  } else {
    currentYear = parseInt(document.getElementById('year-select').value);
    loadSingleYear(currentYear);
  }
}

function setType(t) {
  precipType = t;
  // Drive all type-glow colors (stat values, tooltip value) via CSS variable
  document.documentElement.style.setProperty('--type-glow', TYPE_GLOW[t]);
  // Update button states
  ['all', 'sn', 'pl', 'fzra'].forEach(id => {
    document.getElementById('type-' + id).className =
      'type-btn' + (id === t ? ' type-active-' + id : '');
  });
  // Re-render instantly — no re-fetch needed, all data is already in memory
  renderHeatmap();
  renderLegend();
  updateStats();
}

function onYearChange() {
  currentYear  = parseInt(document.getElementById('year-select').value);
  singleGridSN = null; singleGridPL = null; singleGridFZ = null;
  loadSingleYear(currentYear);
}

function onStationChange() {
  activeStationId = document.getElementById('station-select').value;
  singleGridSN    = null; singleGridPL = null; singleGridFZ = null;
  snCount         = null; plCount      = null; fzCount      = null; dataCount = null;
  if (mode === 'climatology') loadClimatology();
  else loadSingleYear(currentYear);
}

// ═══════════════════════════════════════════════════════════════
// DOWNLOAD PNG
// ═══════════════════════════════════════════════════════════════
function downloadPNG() {
  const st        = activeStation();
  const period    = mode === 'single' ? String(currentYear) : `${CLIMO_START}–${CLIMO_END}`;
  const typeLabel = { all: 'All Winter Precip', sn: 'Snow (SN)', pl: 'Sleet (PL)', fzra: 'Freezing Rain (FZRA)' }[precipType];
  const subtitle  = mode === 'climatology'
    ? `Probability of ${typeLabel.toLowerCase()} by hour and day of year  ·  ${CLIMO_START}–${CLIMO_END}`
    : `Hours with observed ${typeLabel.toLowerCase()}  ·  ${currentYear}`;

  const cw = canvas.width  / dpr;
  const ch = canvas.height / dpr;
  const PAD = 24, HDR = 86, FTR = 28, MONTH_H = 22;
  const ow = cw + PAD * 2;
  const oh = HDR + MONTH_H + ch + FTR;

  const off = document.createElement('canvas');
  off.width  = ow * 2;
  off.height = oh * 2;
  const oc = off.getContext('2d');
  oc.scale(2, 2);

  oc.fillStyle = '#07070f';
  oc.fillRect(0, 0, ow, oh);

  // Accent bar in type color
  oc.fillStyle = TYPE_GLOW[precipType];
  oc.fillRect(0, 0, ow, 3);

  oc.fillStyle = '#e6e6f0';
  oc.font = 'bold 20px "Barlow Condensed", Arial, sans-serif';
  oc.fillText(`${st.label}  ·  Winter Precipitation Heatmap  ·  ${period}`, PAD, 28);

  oc.fillStyle = '#7878a0';
  oc.font = '14px "Barlow Condensed", Arial, sans-serif';
  oc.fillText(subtitle, PAD, 48);

  if (mode === 'climatology' && snCount) {
    const peak = document.getElementById('sv-month').textContent;
    const hr   = document.getElementById('sv-hour').textContent;
    const avg  = document.getElementById('sv-annual').textContent;
    oc.fillStyle = TYPE_GLOW[precipType];
    oc.font = 'bold 13px "Barlow Condensed", Arial, sans-serif';
    oc.fillText(`Peak month: ${peak}   Peak hour: ${hr}   Avg hrs/yr: ${avg}`, PAD, 68);
  }

  oc.fillStyle = '#555575';
  oc.font = '13px "Barlow Condensed", Arial, sans-serif';
  oc.textAlign = 'right';
  oc.fillText('contextclimate.io', ow - PAD, 28);
  oc.textAlign = 'left';

  // Month labels strip
  oc.fillStyle = '#5a5a7a';
  oc.font = '12px "Barlow Condensed", Arial, sans-serif';
  oc.textAlign = 'center';
  const cellW = cw / 366;
  for (let m = 0; m < 12; m++) {
    const s   = MONTH_START_DOY[m];
    const e   = m < 11 ? MONTH_START_DOY[m + 1] : 366;
    const mid = (s + e - 1) / 2;
    oc.fillText(MONTHS_SHORT[m], PAD + mid * cellW, HDR + MONTH_H - 6);
  }
  oc.textAlign = 'left';

  oc.drawImage(canvas, PAD, HDR + MONTH_H, cw, ch);

  oc.fillStyle = '#3e3e58';
  oc.font = '12px "Barlow Condensed", Arial, sans-serif';
  oc.fillText(`${st.tzLabel} Local Time  ·  Data: IEM ASOS  ·  contextclimate.io`, PAD, HDR + MONTH_H + ch + 18);

  // Bottom accent line in type color
  oc.fillStyle = TYPE_GLOW[precipType];
  oc.fillRect(0, oh - 2, ow, 2);

  const link = document.createElement('a');
  link.download = `winter-precip-${activeStationId}-${precipType}-${period}.png`;
  link.href = off.toDataURL('image/png');
  link.click();
}

// ═══════════════════════════════════════════════════════════════
// UTIL + INIT
// ═══════════════════════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function init() {
  const sel = document.getElementById('year-select');
  for (let y = CLIMO_END; y >= CLIMO_START; y--) {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    sel.appendChild(opt);
  }
  sel.value = currentYear;

  // Apply initial type glow CSS variable
  document.documentElement.style.setProperty('--type-glow', TYPE_GLOW[precipType]);

  requestAnimationFrame(() => {
    setupCanvas();
    renderHourLabels();
    renderMonthLabels();
    renderLegend();
    loadClimatology();
  });

  window.addEventListener('resize', () => {
    dpr = window.devicePixelRatio || 1;
    setupCanvas();
    renderMonthLabels();
    const hasData = (mode === 'climatology' && snCount) ||
                    (mode === 'single' && singleGridSN);
    if (hasData) renderHeatmap();
  });
}

init();
</script>
