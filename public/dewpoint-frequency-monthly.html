<!DOCTYPE html>
<html lang="en">
<head>

  <title>Monthly Dewpoint Frequency | ContextClimate</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    :root {

    body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; }

    /* ── Header ── */
    .header { background: var(--surface); border-bottom: 2px solid var(--accent); }
    .header-inner { max-width: 960px; margin: 0 auto; padding: 14px 20px 12px; display: flex; align-items: center; gap: 16px; }
    .header-title-block { flex: 1; min-width: 0; }
    .cc-link-btn {
      font-family: var(--font-label); font-size: 0.75rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;
      color: var(--accent); border: 1px solid var(--accent); border-radius: 20px;
      padding: 5px 14px; white-space: nowrap; flex-shrink: 0; transition: all 0.15s;
      display: inline-block;
    }
    .cc-link-btn:hover { background: rgba(186,117,23,0.15); }
    .header-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .header h1 {
      font-family: var(--font-label); font-size: 1.35rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent);
    }
    .header-station { font-family: var(--font-label); font-size: 1rem; font-weight: 600; color: var(--text); }
    .header-meta { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; font-family: var(--font-label); }

    /* ── Layout ── */
    .container { max-width: 960px; margin: 0 auto; padding: 20px 20px 48px; }
    .section-label {
      font-family: var(--font-label); font-size: 0.74rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
    }

    /* ── Station dropdown ── */
    .station-select-wrap {
      position: relative; display: inline-block; margin-bottom: 20px;
      min-width: 220px; max-width: 300px; width: 100%;
    }
    .station-select-wrap::after {
      content: '▾'; position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%); color: var(--text-dim); pointer-events: none; font-size: 1rem;
    }
    .station-dropdown {
      width: 100%; background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 5px; padding: 8px 36px 8px 14px;
      font-family: var(--font-label); font-size: 0.92rem; font-weight: 600;
      letter-spacing: 0.03em; appearance: none; -webkit-appearance: none;
      cursor: pointer; outline: none; transition: border-color 0.15s;
    }
    .station-dropdown:hover, .station-dropdown:focus { border-color: var(--accent); }
    .station-dropdown option, .station-dropdown optgroup { background: #1a1d2e; color: #e8eaf6; font-family: sans-serif; }
    .station-dropdown optgroup { font-weight: 700; }

    /* ── Controls ── */
    .controls-section { margin-bottom: 14px; }
    .top-controls-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }

    /* ── Current obs button ── */
    .obs-btn {
      font-family: var(--font-label); font-size: 0.84rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 16px;
      border-radius: 4px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim); cursor: pointer; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .obs-btn:hover:not(:disabled) { border-color: var(--obs); color: var(--obs); }
    .obs-btn.active { border-color: var(--obs); color: var(--obs); background: rgba(58,175,169,0.12); }
    .obs-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .obs-pulse {
      width: 9px; height: 9px; border-radius: 50%; background: var(--obs);
      display: none; flex-shrink: 0; animation: pulse 1.8s ease-in-out infinite;
    }
    .obs-btn.active .obs-pulse { display: block; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.55; transform: scale(0.75); }
    }

    /* ── Month pills ── */
    .month-row { margin-bottom: 16px; }
    .month-btn-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .month-btn {
      font-family: var(--font-label); font-size: 0.86rem; font-weight: 700;
      letter-spacing: 0.05em; padding: 5px 15px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-dim); cursor: pointer; transition: all 0.15s;
    }
    .month-btn:hover { border-color: var(--text-dim); color: var(--text); }
    .month-btn.active { background: rgba(186,117,23,0.18); border-color: var(--accent); color: var(--accent); }

    /* ── Period pills ── */
    .period-row { margin-bottom: 4px; }
    .period-btn-group { display: flex; flex-wrap: wrap; gap: 5px; }
    .period-btn {
      font-family: var(--font-label); font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.04em; padding: 4px 13px; border-radius: 4px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-dim); cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .period-btn:hover:not(:disabled) { border-color: var(--text-dim); color: var(--text); }
    .period-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .period-btn.active { background: var(--surface2); border-color: var(--text); color: var(--text); }

    /* ── Zone legend ── */
    .zone-legend { display: flex; border-radius: 4px; overflow: hidden; margin-bottom: 14px; height: 25px; }
    .zone-swatch {

      font-family: var(--font-label); font-size: 0.64rem; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;

    /* ── Chart card ── */
    .chart-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 16px 20px 14px; margin-bottom: 14px;
    }
    .chart-wrap { position: relative; height: 390px; }
    #main-chart { display: none; }
    .state-overlay {

      gap: 12px; color: var(--text-dim); font-family: var(--font-label);

    /* ── Obs readout strip ── */
    .obs-readout {
      display: none; align-items: center; gap: 11px;
      background: rgba(58,175,169,0.08); border: 1px solid rgba(58,175,169,0.32);
      border-radius: 6px; padding: 10px 16px; margin-bottom: 10px;

    .obs-readout.visible { display: flex; }
    .obs-readout-dot  { width: 10px; height: 10px; border-radius: 50%; background: var(--obs); flex-shrink: 0; }
    .obs-readout-label { font-family: var(--font-label); font-size: 0.94rem; font-weight: 600; color: var(--obs); letter-spacing: 0.04em; }
    .obs-readout-time  { font-family: var(--font-label); font-size: 0.78rem; color: var(--text-dim); margin-left: auto; white-space: nowrap; }

    /* ── Chart actions ── */
    .chart-actions { display: flex; justify-content: flex-end; margin-bottom: 14px; }
    .action-pill {
      font-family: var(--font-label); font-size: 0.8rem; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 16px;
      border-radius: 20px; border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); cursor: pointer; transition: all 0.2s;
    }
    .action-pill:hover { border-color: var(--text-dim); color: var(--text); }

    /* ── Stat chips ── */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 10px; }
    .stat-chip {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px 16px; transition: border-color 0.15s;

    .stat-chip:hover { border-color: var(--accent); }
    .stat-chip .lbl {
      font-family: var(--font-label); font-size: 0.72rem; font-weight: 700;

    .stat-chip .unit { font-family: var(--font-label); font-size: 0.82rem; color: var(--text-dim); margin-left: 3px; }
    .stat-chip .sub  { font-family: var(--font-label); font-size: 0.7rem;  color: var(--text-dim); margin-top: 4px; }
  </style>
</head>
<body>

<div class="header">

<script>
// ═══════════════════════════════════════════════

const STATION_REGIONS = [

  ]},
  { region: 'Mountain / Southwest', stations: [
    { label: 'Denver, CO',         sid: 'KDEN' },
    { label: 'Albuquerque, NM',    sid: 'KABQ' },
    { label: 'Salt Lake City, UT', sid: 'KSLC' },
    { label: 'Boise, ID',          sid: 'KBOI' },
    { label: 'Phoenix, AZ',        sid: 'KPHX' },
    { label: 'Tucson, AZ',         sid: 'KTUS' },
    { label: 'Las Vegas, NV',      sid: 'KLAS' },
  ]},
  { region: 'West Coast', stations: [
    { label: 'Seattle, WA',        sid: 'KSEA' },
    { label: 'Portland, OR',       sid: 'KPDX' },
    { label: 'San Francisco, CA',  sid: 'KSFO' },
    { label: 'Sacramento, CA',     sid: 'KSMF' },
    { label: 'Los Angeles, CA',    sid: 'KLAX' },
    { label: 'San Diego, CA',      sid: 'KSAN' },
  ]},

const STATIONS_FLAT = {};
STATION_REGIONS.forEach(r => r.stations.forEach(s => { STATIONS_FLAT[s.sid] = s; }));
const DEFAULT_STATION = STATIONS_FLAT['KISP'];

// ═══════════════════════════════════════════════
//  Constants
// ═══════════════════════════════════════════════
const FIXED_PERIODS = [
  { label: 'Full Record', startYear: null, endYear: null },
  { label: '1951\u20131980',   startYear: 1951, endYear: 1980 },
  { label: '1961\u20131990',   startYear: 1961, endYear: 1990 },
  { label: '1971\u20132000',   startYear: 1971, endYear: 2000 },
  { label: '1981\u20132010',   startYear: 1981, endYear: 2010 },
  { label: '1991\u20132020',   startYear: 1991, endYear: 2020 },
];

const MONTH_NAMES      = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTH_NAMES_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const BIN_SIZE  = 1;
const BIN_START = -20;

const ZONES = [
  { lo: -999, hi: 20,  label: 'Very Dry',       color: '#5C2E0A' },
  { lo: 20,   hi: 36,  label: 'Dry',            color: '#B88C38' },
  { lo: 36,   hi: 56,  label: 'Pleasant',       color: '#CEC000' },
  { lo: 56,   hi: 64,  label: 'Slightly Humid', color: '#90C848' },
  { lo: 64,   hi: 70,  label: 'Humid',          color: '#2E9E2E' },
  { lo: 70,   hi: 75,  label: 'Very Humid',     color: '#1A6830' },
  { lo: 75,   hi: 80,  label: 'Oppressive',     color: '#107868' },
  { lo: 80,   hi: 999, label: 'Extreme',        color: '#1030A0' },
];

const THRESHOLDS = [
  { temp:  0, label:  '0\u00b0F', color: 'rgba(180,130,50,0.75)'  },
  { temp: 56, label: '56\u00b0F', color: 'rgba(120,210,80,0.70)'  },
  { temp: 70, label: '70\u00b0F', color: 'rgba(25,110,50,0.75)'   },
  { temp: 80, label: '80\u00b0F', color: 'rgba(20,50,190,0.70)'   },
];

// ═══════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════
let currentStation = null;
let currentMonth   = new Date().getMonth() + 1;   // 1–12
let singlePeriod   = FIXED_PERIODS[0];
let rawData        = null;   // array of ['YYYY-MM-DD', 'value'] — one per hourly obs
let stationPOR     = { firstYear: null, lastYear: null, firstDate: null, lastDate: null };
let chart          = null;
const cache        = {};     // keyed by sid + '__hourly'
let currentObsDwpf = null;
let obsTimestamp   = null;

// ═══════════════════════════════════════════════
//  Color helpers
// ═══════════════════════════════════════════════
function zoneForTemp(t) {
  return ZONES.find(z => t >= z.lo && t < z.hi) || ZONES[ZONES.length - 1];
}

function getDewpointColor(dp, alpha = 0.88) {
  const stops = [
    { t: -25, r: 75,  g: 38,  b: 10  },
    { t:   0, r: 130, g: 85,  b: 30  },
    { t:  20, r: 195, g: 155, b: 65  },
    { t:  36, r: 220, g: 200, b: 15  },
    { t:  50, r: 205, g: 210, b: 20  },
    { t:  56, r: 160, g: 210, b: 75  },
    { t:  64, r: 50,  g: 165, b: 50  },
    { t:  70, r: 22,  g: 105, b: 45  },
    { t:  75, r: 15,  g: 120, b: 105 },
    { t:  80, r: 15,  g: 45,  b: 170 },
    { t:  90, r: 8,   g: 20,  b: 140 },
  ];
  if (dp <= stops[0].t) return `rgba(${stops[0].r},${stops[0].g},${stops[0].b},${alpha})`;
  const last = stops[stops.length - 1];
  if (dp >= last.t) return `rgba(${last.r},${last.g},${last.b},${alpha})`;
  for (let i = 0; i < stops.length - 1; i++) {
    if (dp <= stops[i + 1].t) {
      const s0 = stops[i], s1 = stops[i + 1], f = (dp - s0.t) / (s1.t - s0.t);
      return `rgba(${Math.round(s0.r+f*(s1.r-s0.r))},${Math.round(s0.g+f*(s1.g-s0.g))},${Math.round(s0.b+f*(s1.b-s0.b))},${alpha})`;
    }
  }
}

// ═══════════════════════════════════════════════
//  Zone legend
// ═══════════════════════════════════════════════
function buildZoneLegend() {
  document.getElementById('zone-legend').innerHTML =
    ZONES.map(z => `<div class="zone-swatch" style="background:${z.color}">${z.label}</div>`).join('');
}

// ═══════════════════════════════════════════════
//  Data helpers
// ═══════════════════════════════════════════════
function getFilteredObs(startYear, endYear, month) {
  if (!rawData) return [];
  return rawData
    .filter(([date, val]) => {
      if (!val || val === 'M') return false;
      const y = parseInt(date.substring(0, 4), 10);
      const m = parseInt(date.substring(5, 7), 10);
      if (startYear && y < startYear) return false;
      if (endYear   && y > endYear)   return false;
      if (m !== month)                return false;
      return true;
    })
    .map(([, val]) => parseFloat(val))
    .filter(t => !isNaN(t));
}

function getUniqueYears(startYear, endYear, month) {
  if (!rawData) return 0;
  const years = new Set();
  rawData.forEach(([date, val]) => {
    if (!val || val === 'M') return;
    const y = parseInt(date.substring(0, 4), 10);
    const m = parseInt(date.substring(5, 7), 10);
    if (startYear && y < startYear) return;
    if (endYear   && y > endYear)   return;
    if (m !== month) return;
    if (!isNaN(parseFloat(val))) years.add(y);
  });
  return years.size;
}

function buildBins(vals) {
  const bins = [];
  for (let t = BIN_START; t < 112; t += BIN_SIZE) {
    bins.push({ lo: t, hi: t + BIN_SIZE, center: t + BIN_SIZE / 2, count: 0 });
  }
  vals.forEach(t => {
    const idx = Math.floor((t - BIN_START) / BIN_SIZE);
    if (idx >= 0 && idx < bins.length) bins[idx].count++;
  });
  return bins;
}

function visibleSlice(bins) {
  const f = bins.findIndex(b => b.count > 0);
  if (f < 0) {
    const df = bins.findIndex(b => b.lo >= 28);
    const dl = bins.findIndex(b => b.lo >= 92);
    return { first: df >= 0 ? df : 0, last: dl >= 0 ? dl : bins.length - 1 };
  }
  const r = [...bins].reverse().findIndex(b => b.count > 0);
  const l = bins.length - 1 - r;
  return { first: Math.max(0, f - 2), last: Math.min(bins.length - 1, l + 2) };
}

function periodAvailable(period) {
  if (!period.startYear) return true;
  const { firstYear, lastYear } = stationPOR;
  if (!firstYear) return false;
  return Math.min(period.endYear, lastYear) - Math.max(period.startYear, firstYear) >= 15;
}

// ═══════════════════════════════════════════════
//  Stats
// ═══════════════════════════════════════════════
function computeStats(vals) {
  if (!vals.length) return null;
  const sorted = [...vals].sort((a, b) => a - b);
  const n      = vals.length;
  const mean   = vals.reduce((s, t) => s + t, 0) / n;
  const mid    = Math.floor(n / 2);
  const median = n % 2 === 0 ? (sorted[mid - 1] + sorted[mid]) / 2 : sorted[mid];
  return {
    n,
    mean:   mean.toFixed(1),
    median: Math.round(median),
    dp75:   vals.filter(t => t >= 75).length,
    dp0:    vals.filter(t => t <= 0).length,
  };
}

function pct(n, total) { return ((n / total) * 100).toFixed(1) + '%'; }

function renderStats(stats, yearsCount, month) {
  const el = document.getElementById('stats-grid');
  if (!stats) { el.innerHTML = ''; return; }
  const monthStr = MONTH_NAMES_FULL[month - 1];
  const chips = [
    { lbl: 'Years in Sample',
      val: yearsCount,                   unit: '',        sub: monthStr + ' \u00b7 ' + singlePeriod.label },
    { lbl: 'Hourly Observations',
      val: stats.n.toLocaleString(),     unit: '',        sub: '' },
    { lbl: 'Mean Dewpoint',
      val: stats.mean,                   unit: '\u00b0F', sub: '' },
    { lbl: 'Median Dewpoint',
      val: stats.median,                 unit: '\u00b0F', sub: '' },
    { lbl: '\u2265 75\u00b0F Hours',
      val: stats.dp75.toLocaleString(), unit: '',
      sub: pct(stats.dp75, stats.n) + ' of sample \u00b7 oppressive+' },
    { lbl: '\u2264 0\u00b0F Hours',
      val: stats.dp0.toLocaleString(),  unit: '',
      sub: pct(stats.dp0,  stats.n) + ' of sample \u00b7 very dry'   },
  ];
  el.innerHTML = chips.map(c => `
    <div class="stat-chip">
      <div class="lbl">${c.lbl}</div>
      <div class="val">${c.val}<span class="unit">${c.unit}</span></div>
      ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
    </div>`).join('');
}

// ═══════════════════════════════════════════════
//  Header meta
// ═══════════════════════════════════════════════
function updateHeaderMeta() {
  if (!rawData) return;
  const monthStr  = MONTH_NAMES_FULL[currentMonth - 1];
  const periodStr = singlePeriod.label === 'Full Record'
    ? `Full Record (${stationPOR.firstDate} \u2013 ${stationPOR.lastDate})`

}

// ═══════════════════════════════════════════════
//  Chart plugins
// ═══════════════════════════════════════════════
const thresholdLinesPlugin = {
  id: 'thresholdLines',
  afterDraw(ch) {
    const { ctx, chartArea, data, scales } = ch;
    const labels = data.labels;
    const xScale = scales.x;
    THRESHOLDS.forEach(({ temp, label, color }) => {
      const idx = labels.findIndex(l => parseInt(l, 10) >= temp);
      if (idx < 0) return;
      const x = xScale.getPixelForValue(idx);
      ctx.save();
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.moveTo(x, chartArea.top + 4); ctx.lineTo(x, chartArea.bottom); ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = '600 12px "Barlow Condensed", sans-serif';
      ctx.textAlign = 'center'; ctx.setLineDash([]);
      ctx.fillText(label, x, chartArea.top + 14);
      ctx.restore();
    });
  }
};

const currentObsPlugin = {
  id: 'currentObs',
  afterDraw(ch) {
    if (currentObsDwpf === null) return;
    const { ctx, chartArea, data, scales } = ch;
    const labels = data.labels;
    const xScale = scales.x;
    const OBS_COLOR = '#3AAFA9';

    // Find the bin containing the obs value
    let idx = -1;
    for (let i = 0; i < labels.length; i++) {
      const lo = parseInt(labels[i], 10);
      if (currentObsDwpf >= lo && currentObsDwpf < lo + BIN_SIZE) { idx = i; break; }
    }
    if (idx < 0) {
      idx = currentObsDwpf < parseInt(labels[0], 10) ? 0 : labels.length - 1;
    }

    const x = xScale.getPixelForValue(idx);

    // Vertical dashed line
    ctx.save();
    ctx.strokeStyle = OBS_COLOR;
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(x, chartArea.top);
    ctx.lineTo(x, chartArea.bottom);
    ctx.stroke();
    ctx.setLineDash([]);

    // Callout badge
    const text = `NOW \u00b7 ${Math.round(currentObsDwpf)}\u00b0F`;
    ctx.font = '700 13px "Barlow Condensed", sans-serif';
    const tw   = ctx.measureText(text).width;
    const padX = 9;
    const boxW = tw + padX * 2;
    const boxH = 23;
    const triH = 7;
    const boxY = chartArea.top + 26;

    let boxX = x - boxW / 2;
    boxX = Math.max(chartArea.left + 2, Math.min(chartArea.right - boxW - 2, boxX));
    const triX = Math.max(boxX + 9, Math.min(boxX + boxW - 9, x));

    // Rounded rect
    const rad = 4;
    ctx.fillStyle = OBS_COLOR;
    ctx.beginPath();
    ctx.moveTo(boxX + rad, boxY);
    ctx.lineTo(boxX + boxW - rad, boxY);
    ctx.arcTo(boxX + boxW, boxY,        boxX + boxW, boxY + rad,        rad);
    ctx.lineTo(boxX + boxW, boxY + boxH - rad);
    ctx.arcTo(boxX + boxW, boxY + boxH, boxX + boxW - rad, boxY + boxH, rad);
    ctx.lineTo(boxX + rad, boxY + boxH);
    ctx.arcTo(boxX,        boxY + boxH, boxX,        boxY + boxH - rad, rad);
    ctx.lineTo(boxX, boxY + rad);
    ctx.arcTo(boxX,        boxY,        boxX + rad,  boxY,              rad);
    ctx.closePath();
    ctx.fill();

    // Triangle pointer
    ctx.beginPath();
    ctx.moveTo(triX - 5, boxY + boxH);
    ctx.lineTo(triX + 5, boxY + boxH);
    ctx.lineTo(triX,     boxY + boxH + triH);
    ctx.closePath();
    ctx.fill();

    // Text
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, boxX + boxW / 2, boxY + boxH / 2);
    ctx.restore();
  }
};

// ═══════════════════════════════════════════════
//  Chart render
// ═══════════════════════════════════════════════
function renderChart(bins) {
  const { first, last } = visibleSlice(bins);
  const visible  = bins.slice(first, last + 1);
  const labels   = visible.map(b => String(b.lo));
  const bgColors = visible.map(b => getDewpointColor(b.center));

  if (chart) { chart.destroy(); chart = null; }
  const canvas = document.getElementById('main-chart');
  const ctx    = canvas.getContext('2d');

  chart = new Chart(ctx, {
    type: 'bar',
    plugins: [thresholdLinesPlugin, currentObsPlugin],
    data: {
      labels,
      datasets: [{
        label: 'Observations',
        data:            visible.map(b => b.count),
        backgroundColor: bgColors,
        borderColor:     bgColors,
        borderWidth: 0, borderRadius: 1,
        barPercentage: 1.0, categoryPercentage: 0.97,
      }],
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 280 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1a1d2e', borderColor: '#2d3250', borderWidth: 1, padding: 10,
          titleColor: '#e8eaf6', bodyColor: '#8890b0',
          titleFont: { family: 'Barlow Condensed', size: 14, weight: '600' },
          bodyFont:  { family: 'JetBrains Mono',   size: 13 },
          callbacks: {
            title([item]) {
              const lo = parseInt(item.label, 10);
              return `${lo}\u00b0F  \u00b7  ${zoneForTemp(lo + 0.5).label}`;
            },
            label(item) {
              const total = item.dataset.data.reduce((s, v) => s + v, 0);
              const p = total > 0 ? ((item.raw / total) * 100).toFixed(2) : '0.00';
              return ` ${item.raw.toLocaleString()} obs (${p}%)`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false }, border: { color: '#2d3250' },
          ticks: {
            font: { family: 'Barlow Condensed', size: 13 }, color: '#8890b0', maxRotation: 0,
            callback(val, idx) {
              const t = parseInt(this.getLabelForValue(idx), 10);
              return t % 10 === 0 ? t + '\u00b0' : '';
            }
          }
        },
        y: {
          grid: { color: 'rgba(45,50,80,0.5)' }, border: { color: '#2d3250' },
          ticks: { font: { family: 'Barlow Condensed', size: 12 }, color: '#8890b0' },
          title: {
            display: true, text: 'Hourly Observations',
            font: { family: 'Barlow Condensed', size: 13 }, color: '#8890b0'
          }
        }
      }
    }
  });
}

// ═══════════════════════════════════════════════
//  Master update
// ═══════════════════════════════════════════════
function updateChart() {
  if (!rawData) return;
  const vals  = getFilteredObs(singlePeriod.startYear, singlePeriod.endYear, currentMonth);
  const years = getUniqueYears(singlePeriod.startYear, singlePeriod.endYear, currentMonth);
  renderChart(buildBins(vals));
  renderStats(computeStats(vals), years, currentMonth);
  updateHeaderMeta();
}

// ═══════════════════════════════════════════════
//  Month buttons
// ═══════════════════════════════════════════════
function buildMonthButtons() {
  const group = document.getElementById('month-btn-group');
  group.innerHTML = '';
  MONTH_NAMES.forEach((name, i) => {
    const month = i + 1;
    const btn   = document.createElement('button');
    btn.className   = 'month-btn' + (month === currentMonth ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => {
      currentMonth = month;
      document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (rawData) updateChart();
    };
    group.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════
//  Period buttons
// ═══════════════════════════════════════════════
function buildPeriodButtons() {
  const group = document.getElementById('period-btn-group');
  group.innerHTML = '';
  FIXED_PERIODS.forEach(period => {
    const btn = document.createElement('button');
    btn.className   = 'period-btn';
    btn.textContent = period.label;
    btn.disabled    = !periodAvailable(period);
    if (period.label === singlePeriod.label) btn.classList.add('active');
    btn.onclick = () => {
      if (btn.disabled) return;
      singlePeriod = period;
      document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateChart();
    };
    group.appendChild(btn);
  });
}

// ═══════════════════════════════════════════════
//  Current obs
// ═══════════════════════════════════════════════
function clearObs() {
  currentObsDwpf = null;
  obsTimestamp   = null;
  const btn   = document.getElementById('obs-btn');
  const label = document.getElementById('obs-btn-label');
  if (btn)   { btn.classList.remove('active'); btn.disabled = false; }
  if (label) label.textContent = '\u2295 Plot Current Obs';
  document.getElementById('obs-readout').classList.remove('visible');
}

async function fetchCurrentObs() {
  if (!currentStation) return;
  const btn   = document.getElementById('obs-btn');
  const label = document.getElementById('obs-btn-label');

  // Toggle off if already active
  if (currentObsDwpf !== null) {
    clearObs();
    if (chart) chart.update();
    return;
  }

  btn.disabled = true;
  label.textContent = 'Fetching\u2026';

  try {
    const res = await fetch(
      `https://api.weather.gov/stations/${currentStation.sid}/observations/latest`,
      { headers: { Accept: 'application/geo+json' } }
    );
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json  = await res.json();
    const props = json.properties;
    const dwpC  = props?.dewpoint?.value;
    if (dwpC === null || dwpC === undefined) throw new Error('No dewpoint in response');

    currentObsDwpf = dwpC * 9 / 5 + 32;
    obsTimestamp   = props.timestamp;

    btn.disabled = false;
    btn.classList.add('active');
    label.textContent = '\u2715 Clear Obs';

    const timeStr = obsTimestamp
      ? new Date(obsTimestamp).toLocaleString(undefined, {
          month: 'short', day: 'numeric',
          hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
        })
      : '';
    document.getElementById('obs-readout-label').textContent =
      `Current Dewpoint: ${Math.round(currentObsDwpf)}\u00b0F (${dwpC.toFixed(1)}\u00b0C)`;
    document.getElementById('obs-readout-time').textContent =
      timeStr ? `Observed ${timeStr}` : '';
    document.getElementById('obs-readout').classList.add('visible');

    if (chart) chart.update();

  } catch (err) {
    console.error('fetchCurrentObs:', err);
    label.textContent = '\u26a0 Unavailable';
    btn.style.borderColor = '#b04040';
    btn.style.color       = '#b04040';
    setTimeout(() => {
      label.textContent     = '\u2295 Plot Current Obs';
      btn.style.borderColor = '';
      btn.style.color       = '';
      btn.disabled          = false;
    }, 2600);
  }
}

// ═══════════════════════════════════════════════
//  IEM fetch — hourly obs stored directly, no daily aggregation.
//  report_type=3 = routine METARs only (no specials, no backfill).
//  One fetch per station; result cached under sid + '__hourly'.
// ═══════════════════════════════════════════════
async function fetchIEM(station) {
  const key = station.sid + '__hourly';
  if (cache[key]) return cache[key];

  const url =
    `https://mesonet.agron.iastate.edu/cgi-bin/request/asos.py` +
    `?station=${encodeURIComponent(station.sid)}` +
    `&data=dwpf&tz=Etc%2FUTC&format=onlycomma` +
    `&latlon=no&elev=no&missing=M&trace=T&direct=no&report_type=3` +
    `&year1=1940&month1=1&day1=1&year2=2099&month2=12&day2=31`;

  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();

  const lines   = text.trim().split('\n');
  const records = [];   // ['YYYY-MM-DD', 'value']
  let firstDate = null, lastDate = null;

  for (let i = 1; i < lines.length; i++) {
    const parts   = lines[i].split(',');
    if (parts.length < 3) continue;
    const dwpfStr = parts[2].trim();
    if (!dwpfStr || dwpfStr === 'M') continue;
    const dwpf    = parseFloat(dwpfStr);
    if (isNaN(dwpf)) continue;
    // parts[1] is 'YYYY-MM-DD HH:MM' — keep just the date for month/year filtering
    const dateStr = parts[1].substring(0, 10);
    records.push([dateStr, String(dwpf)]);
    if (!firstDate) firstDate = dateStr;
    lastDate = dateStr;
  }

  if (!records.length) throw new Error('No dewpoint observations for ' + station.sid);

  const por = {
    firstYear: parseInt(firstDate.substring(0, 4), 10),
    lastYear:  parseInt(lastDate.substring(0, 4),  10),
    firstDate, lastDate,
  };

  cache[key] = { data: records, por };
  return cache[key];
}

// ═══════════════════════════════════════════════
//  Load station
// ═══════════════════════════════════════════════
async function load(station) {
  const stationChanged = !currentStation || currentStation.sid !== station.sid;
  currentStation = station;
  singlePeriod   = FIXED_PERIODS[0];

  if (stationChanged) clearObs();

  // Sync dropdown
  const sel = document.getElementById('station-select');
  if (sel && sel.value !== station.sid) sel.value = station.sid;

  // Loading state
  const overlay = document.getElementById('state-overlay');
  const canvas  = document.getElementById('main-chart');
  overlay.innerHTML = '<div class="spinner"></div> Downloading data\u2026 (first load may take a moment)';
  overlay.style.display = 'flex';
  canvas.style.display  = 'none';
  document.getElementById('stats-grid').innerHTML = '';

  try {
    const result = await fetchIEM(station);
    rawData    = result.data;
    stationPOR = {
      firstYear: result.por.firstYear, lastYear:  result.por.lastYear,
      firstDate: result.por.firstDate, lastDate:  result.por.lastDate,
    };

    document.getElementById('hdr-station').textContent = station.label;

    buildPeriodButtons();

    overlay.style.display = 'none';
    canvas.style.display  = 'block';
    updateChart();

  } catch (err) {
    overlay.innerHTML = '<span style="color:#e05050">\u26a0 Error loading data \u2014 please try again.</span>';
    console.error(err);
  }
}

// ═══════════════════════════════════════════════
//  Copy chart as PNG
// ═══════════════════════════════════════════════
async function copyChartImage() {
  const chartCanvas = document.getElementById('main-chart');
  if (!rawData || chartCanvas.style.display === 'none') return;

  const btn = document.getElementById('copy-img-btn');
  btn.textContent = 'Rendering\u2026';
  btn.disabled    = true;

  try {
    const cW = chartCanvas.width;
    const cH = chartCanvas.height;
    const r  = window.devicePixelRatio || 1;

    const PAD = Math.round(24 * r);
    const HDR = Math.round(68 * r);
    const LGD = Math.round(25 * r);
    const GAP = Math.round(10 * r);
    const FTR = Math.round(38 * r);

    const W = cW + PAD * 2;
    const H = PAD + HDR + GAP + LGD + GAP + cH + GAP + FTR + PAD;

    const off = document.createElement('canvas');
    off.width  = W; off.height = H;
    const c = off.getContext('2d');

    c.fillStyle = '#0f1117';
    c.fillRect(0, 0, W, H);

    let y = PAD;

    // Title + station
    c.fillStyle = '#BA7517';
    c.font = `700 ${Math.round(20 * r)}px "Barlow Condensed", sans-serif`;
    c.textBaseline = 'top';
    const titleStr = 'DEWPOINT FREQUENCY';
    c.fillText(titleStr, PAD, y);
    const titleW = c.measureText(titleStr).width;
    const stnText = (document.getElementById('hdr-station').textContent || '').toUpperCase();
    c.fillStyle = '#e8eaf6';
    c.font = `600 ${Math.round(13 * r)}px "Barlow Condensed", sans-serif`;
    c.fillText(stnText, PAD + titleW + Math.round(14 * r), y + Math.round(5 * r));
    y += Math.round(30 * r);

    // Subtitle: month · period · hourly obs · data source
    const monthStr  = MONTH_NAMES_FULL[currentMonth - 1].toUpperCase();
    const periodStr = singlePeriod.label;
    c.fillStyle = '#8890b0';
    c.font = `${Math.round(11.5 * r)}px "Barlow Condensed", sans-serif`;
    c.fillText(
      `HOURLY OBS  \u00b7  ${monthStr}  \u00b7  ${periodStr}  \u00b7  Data: IEM / ASOS`,
      PAD, y
    );
    y += Math.round(20 * r);

    if (currentObsDwpf !== null) {
      c.fillStyle = '#3AAFA9';
      c.font = `600 ${Math.round(11 * r)}px "Barlow Condensed", sans-serif`;
      c.fillText(`Current Obs: ${Math.round(currentObsDwpf)}\u00b0F`, PAD, y);
      y += Math.round(18 * r);
    }

    // Zone legend strip
    const zW = (W - PAD * 2) / ZONES.length;
    ZONES.forEach((zone, i) => {
      c.fillStyle = zone.color;
      c.fillRect(PAD + i * zW, y, zW, LGD);
      c.fillStyle = 'rgba(255,255,255,0.85)';
      c.font = `700 ${Math.round(8.5 * r)}px "Barlow Condensed", sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(zone.label.toUpperCase(), PAD + i * zW + zW / 2, y + LGD / 2);
    });
    c.textAlign = 'left'; c.textBaseline = 'top';
    y += LGD + GAP;

    c.drawImage(chartCanvas, PAD, y);
    y += cH + GAP;

    c.fillStyle = '#BA7517';
    c.font = `700 ${Math.round(13 * r)}px "Barlow Condensed", sans-serif`;
    c.textBaseline = 'middle';
    c.fillText('contextclimate.io', PAD, y + FTR / 2);

    const blob = await new Promise(res => off.toBlob(res, 'image/png'));
    let copied = false;
    if (navigator.clipboard?.write && window.ClipboardItem) {
      try {
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        copied = true;
      } catch {}
    }
    if (copied) {
      btn.textContent = '\u2713 Copied!';
      btn.style.borderColor = '#3a9e50'; btn.style.color = '#3a9e50';
    } else {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement('a');
      a.href = url; a.download = 'dewpoint-frequency-monthly.png'; a.click();
      URL.revokeObjectURL(url);
      btn.textContent = '\u2713 Saved!';
      btn.style.borderColor = '#3a9e50'; btn.style.color = '#3a9e50';
    }
    setTimeout(() => {
      btn.textContent = '\u29c9 Copy Image';
      btn.style.borderColor = ''; btn.style.color = ''; btn.disabled = false;
    }, 2200);

  } catch (err) {
    console.error('copyChartImage:', err);
    btn.textContent = '\u26a0 Failed'; btn.style.color = '#e05050';
    setTimeout(() => {
      btn.textContent = '\u29c9 Copy Image'; btn.style.color = ''; btn.disabled = false;
    }, 2200);
  }
}
