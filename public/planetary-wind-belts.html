<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planetary Wind Belts</title>
<link rel="stylesheet" href="core-sample-tools.css">
<style>
:root { --tool-accent: var(--accent-earth); }
html, body { height: 100%; }
body { padding: 0; overflow: hidden; min-height: 0; }
.app { height: 100vh; display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 10px; }

/* header */
.top { display: flex; align-items: center; gap: 14px; min-height: 42px; }
.top h1 { margin: 0; font-size: 24px; white-space: nowrap; }
.tabs .cc-segmented-btn { font-size: 13px; padding: 11px 13px; white-space: nowrap; }
.tabs .ls { display: none; }
.top .spacer { flex: 1; }
.x-link { padding: 6px 12px; font-size: 14px; font-weight: 700; text-decoration: none; white-space: nowrap; color: var(--tool-accent); border-color: var(--tool-accent); }
.exp { display: flex; align-items: center; gap: 6px; }
.exp .cc-btn { padding: 6px 12px; font-size: 13px; white-space: nowrap; }
.exp .cc-btn:disabled { opacity: .4; cursor: default; }
.pngwrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; display: none; flex-direction: column; min-width: 170px;
  background: var(--color-surface-2); border: 1px solid var(--color-border-hover); border-radius: var(--radius-md); padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
.menu.open { display: flex; }
.menu button { all: unset; cursor: pointer; font-family: var(--font-body); font-size: 14px; color: var(--color-text-primary); padding: 8px 12px; border-radius: 4px; }
.menu button:hover, .menu button:focus-visible { background: var(--color-surface); color: var(--tool-accent); }
#status { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); min-width: 0; white-space: nowrap; }

/* body */
.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 12px; }
.scene { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.stage { flex: 1; position: relative; min-height: 0; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.controls { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-top: 1px solid var(--color-border);
  background: var(--color-surface); min-height: 58px; }
.controls .grp { display: flex; gap: 6px; align-items: stretch; }
.controls .sep { width: 1px; align-self: stretch; background: var(--color-border); margin: 2px 2px; }
.play { min-width: 98px; padding: 9px 12px; font-size: 15px; font-weight: 700; color: var(--color-text-primary); }
.snap { min-width: 0; padding: 5px 10px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.12; gap: 1px; color: var(--color-text-primary); }
.snap b { font-family: var(--font-display); font-size: 17px; font-weight: 700; white-space: nowrap; }
.snap span { font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; }
.snap.is-active { background: var(--tool-accent); border-color: var(--tool-accent); color: var(--color-bg); }
.snap.is-active span { color: var(--color-bg); }
.slider { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 110px; }
.slider input { flex: 1; accent-color: var(--tool-accent); height: 22px; cursor: pointer; min-width: 60px; }
.slider .sv { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--color-text-primary); min-width: 62px; text-align: right; white-space: nowrap; }
.parcel { padding: 9px 14px; font-size: 15px; font-weight: 700; white-space: nowrap; color: var(--tool-accent); border: 1.5px solid var(--tool-accent); background: rgba(60,163,174,0.12); }
.parcel:hover { background: rgba(60,163,174,0.24); }
.parcel::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--tool-accent); margin-right: 8px; vertical-align: 0; box-shadow: 0 0 8px var(--tool-accent); }

/* floating chips over the stage */
.chip { position: absolute; display: flex; gap: 6px; z-index: 4; }
.chip .cc-segmented-btn { padding: 6px 12px; font-size: 13px; }
.tgl { padding: 6px 12px; font-size: 13px; background: var(--color-surface); white-space: nowrap; }
.tgl::before { content: ''; display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--color-text-muted);
  border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
.tgl.is-active::before { background: var(--tool-accent); border-color: var(--tool-accent); }
.spd { align-items: center; gap: 8px; height: 32px; padding: 0 10px; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary);
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); white-space: nowrap; }
.spd input { width: 92px; accent-color: var(--tool-accent); cursor: pointer; }
.ctx-link { position: absolute; z-index: 4; padding: 6px 12px; font-size: 13px; background: var(--color-surface); }
.hint { position: absolute; z-index: 4; font-family: var(--font-mono); font-size: 13px; color: var(--color-text-secondary); white-space: nowrap; pointer-events: none; line-height: 32px; }

/* card */
.card { padding: 12px 16px; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.card .eb { font-family: var(--font-mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tool-accent); font-weight: 700; padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
.card .r { padding: 6px 0 5px; border-bottom: 1px solid var(--color-border); }
.card .l { font-family: var(--font-mono); font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--color-text-secondary); }
.card .v { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.15; color: var(--color-text-primary); }
.card .v .u { font-family: var(--font-body); font-weight: 500; font-size: 15px; color: var(--color-text-secondary); margin-left: 5px; }
.card .v .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: 2px; }
.card .r.dim .v { font-size: 19px; color: var(--color-text-secondary); }
.card .lg { display: flex; flex-wrap: wrap; gap: 5px 12px; margin-top: auto; padding-top: 10px; }
.card .lg div { font-family: var(--font-body); font-size: 13px; color: var(--color-text-secondary); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.card .lg i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; }
.card .lg i.c { width: 12px; height: 12px; border-radius: 50%; }
.card .src { font-family: var(--font-body); font-size: 13px; color: var(--color-text-muted); padding-top: 8px; line-height: 1.4; }
@media (max-height: 700px) {
  .card .r { padding: 2px 0 2px; }
  .card .v { font-size: 19px; }
  .card .r.dim .v { font-size: 17px; }
  .card .lg { gap: 3px 10px; padding-top: 6px; }
}

/* narrow widths: drop words, never shrink type */
@media (max-width: 1300px) { .x-link .nm { display: none; } }
@media (max-width: 1240px) {
  .x-link .nm { display: none; }
  .snap span { display: none; }
  .parcel .nm2 { display: none; }
  .main { grid-template-columns: minmax(0, 1fr) 262px; }
  .tabs .lf { display: none; } .tabs .ls { display: inline; }
}
@media (max-width: 1140px) {
  .slider .sv { display: none; }
  .tabs .cc-segmented-btn { padding: 11px 11px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1 class="cc-title">Planetary Wind Belts</h1>
    <div class="cc-segmented tabs" id="tabs">
      <button class="cc-segmented-btn" data-step="norot"><span class="lf">No rotation</span><span class="ls">No spin</span></button>
      <button class="cc-segmented-btn is-active" data-step="rot"><span class="lf">Rotating Earth</span><span class="ls">Rotating</span></button>
      <button class="cc-segmented-btn" data-step="moist"><span class="lf">Wet &amp; dry</span><span class="ls">Wet/dry</span></button>
      <button class="cc-segmented-btn" data-step="season"><span class="lf">Seasons</span><span class="ls">Seasons</span></button>
      <button class="cc-segmented-btn" data-step="real"><span class="lf">Real Earth</span><span class="ls">Real</span></button>
    </div>
    <div class="spacer"></div>
    <span id="status"></span>
    <a class="cc-btn x-link" id="lkPrev" target="_top" href="#" title="Coriolis Effect">&larr;<span class="nm"> Coriolis</span></a>
    <a class="cc-btn x-link" id="lkNext" target="_top" href="#" title="The Jet Stream"><span class="nm">Jet Stream </span>&rarr;</a>
    <div class="exp">
      <div class="pngwrap">
        <button class="cc-btn" id="bPNG" aria-haspopup="true" aria-expanded="false">↓ PNG ▾</button>
        <div class="menu" id="pngMenu" role="menu">
          <button data-png="all" role="menuitem">Whole tool</button>
          <button data-png="globe" role="menuitem">Globe</button>
          <button data-png="side" role="menuitem" id="pngSide">Cross section</button>
        </div>
      </div>
      <button class="cc-btn" id="bGIF">↓ GIF</button>
      <button class="cc-btn" id="bMP4">↓ MP4</button>
    </div>
  </div>
  <div class="main">
    <div class="scene">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="chip" id="chipView">
          <div class="cc-segmented">
            <button class="cc-segmented-btn is-active" data-view="tilt">Tilted</button>
            <button class="cc-segmented-btn" data-view="eq">Equator</button>
            <button class="cc-segmented-btn" data-view="pole">Pole</button>
          </div>
        </div>
        <div class="chip" id="chipFreeze"><button class="cc-btn tgl" id="tFreeze">Freeze</button></div>
        <div class="chip" id="chipHemi">
          <div class="cc-segmented">
            <button class="cc-segmented-btn is-active" data-hemi="n">N only</button>
            <button class="cc-segmented-btn" data-hemi="both">Both</button>
          </div>
        </div>
        <label class="chip spd" id="chipSpeed">Cell speed<input type="range" id="cellSpd" min="0.1" max="1.5" step="0.05" value="0.5" aria-label="Cell circulation speed"></label>
        <a class="cc-btn x-link ctx-link" id="ctxLink" target="_top" href="#"></a>
        <span class="hint" id="hint">Click to release a parcel</span>
      </div>
      <div class="controls" id="controls"></div>
    </div>
    <div class="cc-panel card" id="card"></div>
  </div>
</div>

/* ════════════════════════════════════════════════════════════════════════
   PLANETARY WIND BELTS — contextclimate.io
   MODEL LAYER. Pure functions; nothing here touches the DOM, so the whole
   model can be exercised headlessly (window.WINDBELTS exposes it).
   ════════════════════════════════════════════════════════════════════════ */
const DEG = Math.PI / 180, TILT = 23.5;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MDAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
const SNAP_DEC = { 79: 0, 172: TILT, 265: 0, 355: -TILT };
function decl(day) {
  if (day in SNAP_DEC) return SNAP_DEC[day];
  const n = 9496.5 + (day - 1) + 17 / 24;
  const L = 280.460 + 0.9856474 * n, g = (357.528 + 0.9856003 * n) * DEG;
  const lam = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * DEG;

function dateLabel(day) { let d = day, m = 0; while (d > MDAYS[m]) { d -= MDAYS[m]; m++; } return MONTHS[m] + ' ' + d; }

/* ── Cells. 'one' = single overturning cell per hemisphere (no rotation);

function wAnom(chi, c) { return Math.cos(K(c) * chi * DEG); }    // + rising
function vSurf(chi, c) { return -Math.sin(K(c) * chi * DEG); }   // + northward

// shifted ITCZ but north of the equator is deflected to the right.

/* ── Seasonal shift. All belts follow the Sun's direct ray; the rain belt

const JETS = [

/* ── Names ───────────────────────────────────────────────────────────── */

async function exportMP4() {
