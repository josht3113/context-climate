<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dewpoint Frequency | ContextClimate</title>
  <link rel="stylesheet" href="core-sample-tools.css">
  <link rel="stylesheet" href="frequency-core.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="station-roster.js"></script>
</head>
<body class="cc-app-body">
<div class="cc-app">

  <div class="cc-app-top">
    <h1 class="cc-app-title">Dewpoint Frequency</h1>
    <div class="finder-group" id="sw">
      <span class="search-icon">&#9906;</span>
      <input type="text" class="search-input" id="si" placeholder="Search station ID or city..." autocomplete="off" spellcheck="false">
      <div class="dropdown" id="dd"></div>
      <div class="finder-sep"></div>
      <button class="cc-btn locate-btn" id="locate-btn" title="Use my location to find the nearest station">&#128205;<span class="nm"> Near Me</span></button>
    </div>
    <div class="cc-segmented" id="elem-seg"></div>
    <div class="cc-app-spacer"></div>
    <div class="exp">
      <button class="cc-btn" id="copy-img-btn">&#x29C9; Copy</button>
      <button class="cc-btn" id="png-btn">&#x2193; PNG</button>
    </div>
  </div>

  <div class="cc-app-main">

    <div class="cc-scene">
      <div class="cc-scene-head">
        <div class="stn-block"><span class="stn-name" id="stn-name"></span><span class="stn-meta" id="stn-meta"></span></div>
        <div class="series-legend" id="series-legend"></div>
        <div class="now-pill" id="now-pill" hidden></div>
      </div>
      <div class="fetch-notice" id="fetch-notice" hidden>
        <span id="fetch-notice-text"></span>
        <button class="cc-btn" id="fetch-retry-btn">Retry</button>
      </div>
      <div class="cc-scene-stage">
        <div class="view" id="view-dist">
          <div class="main-wrap"><canvas id="main-chart"></canvas></div>
          <div class="diff-wrap" id="diff-wrap" hidden><canvas id="diff-chart"></canvas></div>
        </div>
        <div class="view view-months" id="view-months" hidden>
          <canvas id="ridge-canvas"></canvas>
          <div class="ridge-tip" id="ridge-tip" hidden></div>
        </div>
        <div class="state-overlay" id="state-overlay"></div>
      </div>
      <div class="cc-scene-bar">
        <div class="cc-segmented" id="view-seg">
          <button class="cc-segmented-btn is-active" data-view="dist">Distribution</button>
          <button class="cc-segmented-btn" data-view="months">By Month</button>
        </div>
        <div class="bar-slider dimmed" id="bar-slider">
          <span class="bar-lbl">30-yr</span>
          <input type="range" id="period-slider" min="1990" max="2010" value="2005" step="1" aria-label="30-year window">
          <span class="slider-window" id="slider-window-label">—</span>
        </div>
        <div class="bar-tools">
          <span class="bar-hint" id="months-hint" hidden>Click a month to open it</span>
          <button class="cc-btn" id="curve-btn">&#x223C;<span class="lbl"> KDE</span></button>
          <button class="cc-btn" id="obs-btn"><span class="obs-pulse"></span><span id="obs-btn-label">&#x2295; Current obs</span></button>
        </div>
      </div>
    </div>

    <div class="cc-card">
      <div class="cc-card-eb">Period</div>
      <div class="cc-card-grp">
        <div class="card-row">
          <div class="cc-segmented" id="mode-seg">
            <button class="cc-segmented-btn is-active" data-mode="single">Single</button>
            <button class="cc-segmented-btn" data-mode="compare">Compare</button>
          </div>
        </div>
        <div class="card-row" id="single-periods"><div class="chip-grid" id="single-period-btns"></div></div>
        <div id="cmp-periods" hidden>
          <div class="card-row"><span class="row-lbl a">Period A</span><div class="chip-grid" id="period-a-btns"></div></div>
          <div class="card-row"><span class="row-lbl b">Period B</span><div class="chip-grid" id="period-b-btns"></div></div>
        </div>
      </div>

      <div id="toy-grp">
        <div class="cc-card-eb">Time of year</div>
        <div class="cc-card-grp">
          <div class="card-row"><div class="chip-grid g4" id="toy-btns"></div></div>
          <div class="card-row" id="toy-sub"></div>
        </div>
      </div>

      <div class="cc-card-eb">Summary<span class="eb-sub" id="sum-sub"></span></div>
      <div id="summary"></div>

      <div class="cc-card-eb">Time in each zone<span class="eb-sub" id="zone-sub"></span></div>
      <div id="zones"></div>

      <div class="cc-card-src" id="src"></div>
    </div>

  </div>
</div>

<script>
window.FREQ_CONFIG = {
  title: 'Dewpoint Frequency',
  fileSlug: 'dewpoint-frequency',
  idbName: 'cc-dewpoint-frequency',
  emptyMsg: 'No dewpoint observations for this station',
  defaultElem: 'hourly',
  elems: {
    hourly: {
      label: 'Hourly', src: 'iem', iemVar: 'dwpf', obsField: 'dewpoint', obs: 'now',
      unit: 'hours', per: 'hrs/yr', noun: 'Hourly dewpoint', cov: 0.75,
      thresholds: [
        { key: 'ge70', label: '≥ 70°F', lo: 70, test10: t => t >= 700 },
        { key: 'ge75', label: '≥ 75°F', lo: 75, test10: t => t >= 750 },
        { key: 'lt20', label: '< 20°F', hi: 20, test10: t => t < 200 },
      ],
    },
  },
  zones: [
    { lo: -999, hi: 20,  label: 'Very Dry',       range: '< 20°'  },
    { lo: 20,   hi: 36,  label: 'Dry',            range: '20–35°' },
    { lo: 36,   hi: 56,  label: 'Pleasant',       range: '36–55°' },
    { lo: 56,   hi: 64,  label: 'Slightly Humid', range: '56–63°' },
    { lo: 64,   hi: 70,  label: 'Humid',          range: '64–69°' },
    { lo: 70,   hi: 75,  label: 'Very Humid',     range: '70–74°' },
    { lo: 75,   hi: 80,  label: 'Oppressive',     range: '75–79°' },
    { lo: 80,   hi: 999, label: 'Extreme',        range: '80°+'   },
  ],
  zoneMidLo: 8, zoneMidHi: 84,
  // Dewpoint colour ramp (content colours — do not normalise)
  ramp: [
    { t: -25, c: [75, 38, 10]   },
    { t:   0, c: [130, 85, 30]  },
    { t:  20, c: [195, 155, 65] },
    { t:  36, c: [220, 200, 15] },
    { t:  50, c: [205, 210, 20] },
    { t:  56, c: [160, 210, 75] },
    { t:  64, c: [50, 165, 50]  },
    { t:  70, c: [22, 105, 45]  },
    { t:  75, c: [15, 120, 105] },
    { t:  80, c: [15, 45, 170]  },
    { t:  90, c: [8, 20, 140]   },
  ],
};
</script>
<script src="frequency-core.js"></script>
</body>
</html>
